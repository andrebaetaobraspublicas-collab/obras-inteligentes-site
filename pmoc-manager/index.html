>&gt;<\/button>\n      <\/div>\n      <div class=\"cal\" id=\"cal-grade\"><\/div>\n      <div style=\"margin-top:.5rem;display:flex;gap:.7rem;flex-wrap:wrap\">\n        <small><span style=\"display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--er)\"><\/span> vencida<\/small>\n        <small><span class=\"pt wa\" style=\"display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--wa)\"><\/span> a vencer<\/small>\n        <small><span class=\"pt ok\" style=\"display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok)\"><\/span> concluída<\/small>\n      <\/div>\n    <\/div>\n    <div class=\"card\">\n      <h3>Distribuição por periodicidade<\/h3>\n      <div id=\"dist-per\"><\/div>\n      <h3 style=\"margin-top:1rem\">Distribuição por equipamento<\/h3>\n      <div id=\"dist-eq\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"card\">\n    <h3>Tarefas programadas<\/h3>\n    <div class=\"filtros\">\n      <div class=\"campo\"><label for=\"ft-eq\">Equipamento<\/label><select id=\"ft-eq\"><option value=\"\">Todos<\/option><\/select><\/div>\n      <div class=\"campo\"><label for=\"ft-sit\">Situação<\/label><select id=\"ft-sit\">\n        <option value=\"\">Todas<\/option><option value=\"vencida\">Vencida<\/option><option value=\"avencer\">A vencer (30 d)<\/option>\n        <option value=\"futura\">Futura<\/option><option value=\"concluida\">Concluída<\/option><option value=\"cancelada\">Cancelada pela reconciliação<\/option><\/select><\/div>\n      <div class=\"campo\"><label for=\"ft-per\">Periodicidade<\/label><select id=\"ft-per\"><option value=\"\">Todas<\/option><\/select><\/div>\n    <\/div>\n    <div class=\"tabwrap\"><table id=\"tb-tarefas\">\n      <thead><tr><th>Prazo<\/th><th>Equipamento<\/th><th>Atividade<\/th><th>Periodicidade<\/th><th>Base normativa<\/th><th>Situação<\/th><th class=\"naoimp\">Ações<\/th><\/tr><\/thead>\n      <tbody><\/tbody><\/table><\/div>\n  <\/div>\n<\/section>\n\n<!-- ============ OS ============ -->\n<section role=\"tabpanel\" id=\"p-os\">\n  <div class=\"card\">\n    <div class=\"acoes\" style=\"margin-bottom:.7rem\">\n      <h2 style=\"flex:1;margin:0\">Ordens de serviço<\/h2>\n      <button class=\"pri\" id=\"bt-nova-os\">Nova OS corretiva<\/button>\n    <\/div>\n    <div class=\"filtros\">\n      <div class=\"campo\"><label for=\"fo-sit\">Situação<\/label><select id=\"fo-sit\">\n        <option value=\"\">Ativas<\/option><option>Aberta<\/option><option>Em execução<\/option><option>Concluída<\/option><option>Cancelada<\/option><option value=\"Arquivada\">Arquivadas<\/option><\/select><\/div>\n      <div class=\"campo\"><label for=\"fo-tipo\">Tipo<\/label><select id=\"fo-tipo\">\n        <option value=\"\">Todos<\/option><option>Preventiva<\/option><option>Corretiva<\/option><\/select><\/div>\n      <div class=\"campo\"><label for=\"fo-pri\">Prioridade<\/label><select id=\"fo-pri\">\n        <option value=\"\">Todas<\/option><option>Alta<\/option><option>Média<\/option><option>Baixa<\/option><\/select><\/div>\n    <\/div>\n    <div class=\"tabwrap\"><table id=\"tb-os\">\n      <thead><tr><th>OS<\/th><th>Abertura<\/th><th>Tipo<\/th><th>Equipamento<\/th><th>Descrição<\/th>\n        <th>Prioridade<\/th><th>Situação<\/th><th class=\"naoimp\">Ações<\/th><\/tr><\/thead>\n      <tbody><\/tbody><\/table><\/div>\n  <\/div>\n<\/section>\n\n<!-- ============ QAI ============ -->\n<section role=\"tabpanel\" id=\"p-qai\">\n  <div class=\"card\">\n    <div class=\"acoes\" style=\"margin-bottom:.7rem\">\n      <h2 style=\"flex:1;margin:0\">Qualidade do ar interior<\/h2>\n      <button class=\"pri\" id=\"bt-nova-qai\">Registrar análise<\/button>\n    <\/div>\n    <p><small>Padrões referenciais da Resolução-RE ANVISA nº 9, de 16/01/2003. O aplicativo classifica cada campanha como Conforme, Desconforme ou Inconclusiva. Limites expressos com “&lt;” são tratados estritamente; resultados incompletos nunca são declarados conformes.<\/small><\/p>\n    <div class=\"tabwrap\"><table id=\"tb-qai\">\n      <thead><tr><th>Data<\/th><th>Ambiente<\/th><th class=\"num\">Fungos (UFC/m³)<\/th><th class=\"num\">CO₂ (ppm)<\/th>\n        <th class=\"num\">Aerodisp. (µg/m³)<\/th><th class=\"num\">Temp. (°C)<\/th><th class=\"num\">UR (%)<\/th>\n        <th class=\"num\">Vel. ar (m/s)<\/th><th>Situação<\/th><th class=\"naoimp\">Ações<\/th><\/tr><\/thead>\n      <tbody><\/tbody><\/table><\/div>\n    <div id=\"qai-diag\" style=\"margin-top:.8rem\"><\/div>\n  <\/div>\n  <div class=\"card\">\n    <h3>Padrões referenciais adotados<\/h3>\n    <div class=\"tabwrap\"><table>\n      <thead><tr><th>Parâmetro<\/th><th>Valor de referência<\/th><th>Observação<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td>Fungos totais<\/td><td>&lt; 750 UFC/m³<\/td><td>Relação interna/externa (I/E) deve ser ≤ 1,5<\/td><\/tr>\n        <tr><td>Dióxido de carbono (CO₂)<\/td><td>&lt; 1.000 ppm<\/td><td>Indicador indireto de renovação de ar<\/td><\/tr>\n        <tr><td>Aerodispersóides (PM₁₀)<\/td><td>&lt; 80 µg/m³<\/td><td>Partículas inaláveis<\/td><\/tr>\n        <tr><td>Temperatura de bulbo seco<\/td><td>23 a 26 °C (conforto de verão)<\/td><td>NBR 16401-2<\/td><\/tr>\n        <tr><td>Umidade relativa<\/td><td>40 a 65 %<\/td><td>NBR 16401-2<\/td><\/tr>\n        <tr><td>Velocidade do ar<\/td><td>&lt; 0,25 m/s<\/td><td>Na zona ocupada<\/td><\/tr>\n      <\/tbody><\/table><\/div>\n  <\/div>\n<\/section>\n\n<!-- ============ ENERGIA ============ -->\n<section role=\"tabpanel\" id=\"p-energia\">\n  <div class=\"card\">\n    <div class=\"acoes\" style=\"margin-bottom:.7rem\">\n      <h2 style=\"flex:1;margin:0\">Consumo energético<\/h2>\n      <button class=\"pri\" id=\"bt-nova-energia\">Registrar leitura<\/button>\n    <\/div>\n    <div class=\"grade g4\" style=\"margin-bottom:1rem\">\n      <div class=\"kpi\"><div class=\"rot\">Consumo 30 d<\/div><div class=\"val\" id=\"k-en-30\">0<\/div><div class=\"sub\">kWh<\/div><\/div>\n      <div class=\"kpi\"><div class=\"rot\">Média diária<\/div><div class=\"val\" id=\"k-en-med\">0<\/div><div class=\"sub\">kWh/dia<\/div><\/div>\n      <div class=\"kpi\"><div class=\"rot\">Custo estimado 30 d<\/div><div class=\"val\" id=\"k-en-cus\">R$ 0<\/div><div class=\"sub\" id=\"k-en-tar\">tarifa —<\/div><\/div>\n      <div class=\"kpi\"><div class=\"rot\">Anomalias<\/div><div class=\"val\" id=\"k-en-ano\">0<\/div><div class=\"sub\">acima de +20% da linha de base<\/div><\/div>\n    <\/div>\n    <div class=\"campo\" style=\"max-width:220px\"><label for=\"en-tarifa\">Tarifa de energia (R$/kWh)<\/label>\n      <input id=\"en-tarifa\" type=\"number\" step=\"0.01\" min=\"0\" value=\"0.92\"><\/div>\n    <div id=\"graf-energia\"><\/div>\n    <div class=\"tabwrap\" style=\"margin-top:1rem\"><table id=\"tb-energia\">\n      <thead><tr><th>Data<\/th><th>Equipamento<\/th><th class=\"num\">kWh<\/th><th class=\"num\">Horas<\/th>\n        <th class=\"num\">T. amb. (°C)<\/th><th class=\"num\">T. insufl. (°C)<\/th><th class=\"num\">ΔT<\/th><th>Situação<\/th><th class=\"naoimp\"><\/th><\/tr><\/thead>\n      <tbody><\/tbody><\/table><\/div>\n  <\/div>\n<\/section>\n\n<!-- ============ PECAS ============ -->\n<section role=\"tabpanel\" id=\"p-pecas\">\n  <div class=\"card\">\n    <div class=\"acoes\" style=\"margin-bottom:.7rem\">\n      <h2 style=\"flex:1;margin:0\">Peças, insumos e custos<\/h2>\n      <button class=\"pri\" id=\"bt-nova-peca\">Registrar troca<\/button>\n      <button id=\"bt-csv-pecas\">Exportar CSV<\/button>\n    <\/div>\n    <div class=\"grade g4\" style=\"margin-bottom:1rem\">\n      <div class=\"kpi\"><div class=\"rot\">Gasto 12 meses<\/div><div class=\"val\" id=\"k-pc-ano\">R$ 0<\/div><div class=\"sub\">materiais aplicados<\/div><\/div>\n      <div class=\"kpi\"><div class=\"rot\">Gasto 30 dias<\/div><div class=\"val\" id=\"k-pc-30\">R$ 0<\/div><div class=\"sub\">—<\/div><\/div>\n      <div class=\"kpi\"><div class=\"rot\">Itens a vencer<\/div><div class=\"val\" id=\"k-pc-venc\">0<\/div><div class=\"sub\">vida útil esgotada em 30 d<\/div><\/div>\n      <div class=\"kpi\"><div class=\"rot\">Projeção 12 meses<\/div><div class=\"val\" id=\"k-pc-proj\">R$ 0<\/div><div class=\"sub\">com base na vida útil<\/div><\/div>\n    <\/div>\n    <div id=\"pc-alertas\"><\/div>\n    <div class=\"tabwrap\"><table id=\"tb-pecas\">\n      <thead><tr><th>Data<\/th><th>Item<\/th><th>Equipamento<\/th><th class=\"num\">Qtd<\/th><th class=\"num\">Unit. (R$)<\/th>\n        <th class=\"num\">Total (R$)<\/th><th>Fornecedor<\/th><th>Próx. troca<\/th><th class=\"naoimp\"><\/th><\/tr><\/thead>\n      <tbody><\/tbody><\/table><\/div>\n  <\/div>\n<\/section>\n\n<!-- ============ TRIAGEM ============ -->\n<section role=\"tabpanel\" id=\"p-triagem\">\n  <div class=\"card\">\n    <h2>Triagem inteligente de ocorrências<\/h2>\n    <p><small>Descreva o problema em linguagem natural. O aplicativo classifica a falha, estima a prioridade, indica a especialidade do técnico e sugere as verificações iniciais. A triagem funciona offline por um classificador embutido; se você informar uma chave da API Anthropic, a análise passa a usar o modelo Claude.<\/small><\/p>\n    <div class=\"campo\"><label for=\"tr-txt\">Descrição da ocorrência *<\/label>\n      <textarea id=\"tr-txt\" rows=\"4\" placeholder=\"Ex.: fancoil do 3º andar parou de gelar desde ontem, gotejando água no forro e o disjuntor desarmou duas vezes\"><\/textarea>\n      <div class=\"erro\">Descreva a ocorrência antes de analisar.<\/div><\/div>\n    <div class=\"grade g2\">\n      <div class=\"campo\"><label for=\"tr-eq\">Equipamento relacionado<\/label><select id=\"tr-eq\"><option value=\"\">Não identificado<\/option><\/select><\/div>\n      <div class=\"campo\"><label for=\"tr-key\">Chave da API Anthropic (opcional)<\/label>\n        <input id=\"tr-key\" type=\"password\" placeholder=\"sk-ant-... — guardada apenas nesta aba\"><\/div>\n    <\/div>\n    <div class=\"acoes\"><button class=\"pri\" id=\"bt-analisar\">Analisar ocorrência<\/button>\n      <button id=\"bt-limpar-tri\">Limpar<\/button><span class=\"chip\" id=\"tr-motor\">motor: local<\/span><\/div>\n    <div id=\"tr-result\" style=\"margin-top:1rem\"><\/div>\n  <\/div>\n  <div class=\"card\">\n    <h3>Histórico de triagens<\/h3>\n    <div class=\"tabwrap\"><table id=\"tb-triagem\">\n      <thead><tr><th>Data<\/th><th>Ocorrência<\/th><th>Categoria<\/th><th>Prioridade<\/th><th class=\"num\">Urgência<\/th><th>OS<\/th><th class=\"naoimp\"><\/th><\/tr><\/thead>\n      <tbody><\/tbody><\/table><\/div>\n  <\/div>\n<\/section>\n\n<!-- ============ RELATORIO ============ -->\n<section role=\"tabpanel\" id=\"p-relatorio\">\n  <div class=\"card naoimp\">\n    <h2>Emissão do relatório PMOC<\/h2>\n    <div class=\"grade g3\">\n      <div class=\"campo\"><label for=\"r-ini\">Período — início<\/label><input id=\"r-ini\" type=\"date\"><\/div>\n      <div class=\"campo\"><label for=\"r-fim\">Período — fim<\/label><input id=\"r-fim\" type=\"date\"><\/div>\n      <div class=\"campo\"><label for=\"r-local\">Local de emissão<\/label><input id=\"r-local\" placeholder=\"Cidade – UF\"><\/div>\n    <\/div>\n    <div class=\"acoes\">\n      <label style=\"display:flex;align-items:center;gap:.35rem;font-size:.8rem;margin:0\">\n        <input type=\"checkbox\" id=\"r-conf\"> Declaro que os registros conferem com a execução<\/label>\n      <button class=\"pri\" id=\"bt-gerar-rel\">Gerar relatório<\/button>\n      <button id=\"bt-imprimir\" disabled=\"\">Imprimir / salvar em PDF<\/button>\n    <\/div>\n    <div class=\"erro\" id=\"r-erro\" style=\"margin-top:.4rem\"><\/div>\n  <\/div>\n  <div id=\"rel-doc\"><p style=\"text-align:center;color:#777\">Nenhum relatório gerado.<\/p><\/div>\n<\/section>\n\n<!-- ============ AJUDA ============ -->\n<section role=\"tabpanel\" id=\"p-ajuda\">\n  <div class=\"card\">\n    <h2>Base legal e normativa adotada<\/h2>\n    <div class=\"tabwrap\"><table>\n      <thead><tr><th>Norma<\/th><th>O que estabelece<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td><strong>Lei nº 13.589/2018<\/strong><\/td><td>Obriga edifícios de uso público e coletivo com sistema de climatização a manter PMOC, sob responsabilidade de profissional habilitado.<\/td><\/tr>\n        <tr><td><strong>Portaria GM/MS nº 3.523/1998<\/strong><\/td><td>Define o conteúdo mínimo do PMOC, a limpeza dos componentes e a proibição do uso de produtos que possam contaminar o ar.<\/td><\/tr>\n        <tr><td><strong>Resolução-RE ANVISA nº 9, de 16/01/2003<\/strong><\/td><td>Padrões referenciais de qualidade do ar interior: fungos, CO₂, aerodispersóides, temperatura, umidade e velocidade do ar.<\/td><\/tr>\n        <tr><td><strong>ABNT NBR 13971<\/strong><\/td><td>Manutenção programada de sistemas de refrigeração, condicionamento de ar e ventilação.<\/td><\/tr>\n        <tr><td><strong>ABNT NBR 16401-1/2/3<\/strong><\/td><td>Instalações de ar-condicionado: projeto, conforto térmico e qualidade do ar interior (vazão de ar exterior).<\/td><\/tr>\n        <tr><td><strong>ABNT NBR 14679<\/strong><\/td><td>Higienização de sistemas de climatização — procedimento de limpeza de dutos e componentes.<\/td><\/tr>\n        <tr><td><strong>ABNT NBR 16401-3 / RE 9/2003<\/strong><\/td><td>Renovação mínima de ar exterior por pessoa e por área.<\/td><\/tr>\n      <\/tbody><\/table><\/div>\n    <p style=\"margin-top:.8rem\"><small>Torres de arrefecimento e sistemas com água em recirculação demandam controle específico do risco de <em>Legionella<\/em>, conforme legislação sanitária estadual/municipal aplicável e boas práticas internacionais. O aplicativo inclui as atividades correspondentes no plano quando houver torre cadastrada.<\/small><\/p>\n    <div class=\"nota\" style=\"margin-top:.8rem\">Este aplicativo organiza e documenta a gestão do PMOC. Ele não substitui a análise, a assinatura e a responsabilidade técnica do profissional habilitado, nem os ensaios laboratoriais exigidos pela legislação.<\/div>\n  <\/div>\n  <div class=\"card\">\n    <h3>Catálogo de atividades e periodicidades<\/h3>\n    <div class=\"tabwrap\"><table id=\"tb-catalogo\">\n      <thead><tr><th>Atividade<\/th><th>Aplicável a<\/th><th>Periodicidade padrão<\/th><th>Saúde<\/th><th>Base<\/th><\/tr><\/thead>\n      <tbody><\/tbody><\/table><\/div>\n  <\/div>\n  <div class=\"card\">\n    <h3>Armazenamento de dados e backups<\/h3>\n    <p><small>O estado do sistema e os anexos são gravados prioritariamente em <code>IndexedDB<\/code>, com espelho de segurança dos dados estruturados no <code>localStorage<\/code>. Fotos, PDFs, certificados e demais arquivos permanecem somente neste navegador/dispositivo. O backup v3 inclui dados, metadados, anexos, versão do esquema e verificações de integridade.<\/small><\/p>\n    <div class=\"nota\">A restauração valida a estrutura, migra backups antigos, repara referências históricas quando possível e apresenta um resumo antes de substituir os dados atuais.<\/div>\n  <\/div>\n  <div class=\"card\">\n    <h3>Arquivo e trilha de auditoria<\/h3>\n    <p><small>Registros operacionais não são mais apagados: eles são arquivados e podem ser restaurados. Tarefas incompatíveis após alteração de tipo, periodicidade ou situação do equipamento são canceladas de forma rastreável, sem perda do histórico concluído.<\/small><\/p>\n    <h4>Registros arquivados<\/h4>\n    <div class=\"tabwrap\"><table id=\"tb-arquivo\"><thead><tr><th>Tipo<\/th><th>Identificação<\/th><th>Data<\/th><th>Motivo<\/th><th class=\"naoimp\">Ação<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n    <h4 style=\"margin-top:1rem\">Últimos eventos de auditoria<\/h4>\n    <div class=\"tabwrap\"><table id=\"tb-auditoria\"><thead><tr><th>Data/hora<\/th><th>Ação<\/th><th>Entidade<\/th><th>Responsável<\/th><th>Detalhe<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n  <\/div>\n<\/section>\n\n<!-- ============ MANUAL DO SISTEMA ============ -->\n<section role=\"tabpanel\" id=\"p-manual\">\n  <div class=\"manual-hero\">\n    <div>\n      <span class=\"manual-kicker\">PMOC Manager v2.2<\/span>\n      <h1>Manual do sistema<\/h1>\n      <p>Guia prático para estruturar a instituição, inventariar os sistemas de climatização, gerar o PMOC, registrar a execução, controlar a qualidade do ar e emitir relatórios.<\/p>\n    <\/div>\n    <div class=\"manual-hero-badge\" aria-hidden=\"true\"><span>?<\/span><\/div>\n  <\/div>\n\n  <div class=\"card manual-search-card\">\n    <div class=\"manual-search-row\">\n      <div class=\"campo\">\n        <label for=\"manual-busca\">Pesquisar no manual<\/label>\n        <input id=\"manual-busca\" type=\"search\" placeholder=\"Ex.: backup, equipamento, QAI, ordem de serviço, planta...\" autocomplete=\"off\">\n      <\/div>\n      <button type=\"button\" id=\"manual-limpar\">Limpar pesquisa<\/button>\n      <span class=\"chip pri\" id=\"manual-contador\">Todos os tópicos<\/span>\n    <\/div>\n  <\/div>\n\n  <div class=\"manual-layout\">\n    <aside class=\"manual-toc card\" aria-label=\"Índice do manual\">\n      <h3>Índice<\/h3>\n      <a href=\"#man-inicio\">1. Início rápido<\/a>\n      <a href=\"#man-estrutura\">2. Estrutura institucional<\/a>\n      <a href=\"#man-edificacao\">3. Edificação e RT<\/a>\n      <a href=\"#man-equipamentos\">4. Equipamentos<\/a>\n      <a href=\"#man-plantas\">5. Plantas e localização<\/a>\n      <a href=\"#man-plano\">6. Plano e cronograma<\/a>\n      <a href=\"#man-execucao\">7. Execução e checklists<\/a>\n      <a href=\"#man-os\">8. Ordens de serviço e SLA<\/a>\n      <a href=\"#man-qai\">9. QAI e não conformidades<\/a>\n      <a href=\"#man-ensaios\">10. Ensaios e instrumentos<\/a>\n      <a href=\"#man-energia\">11. Energia<\/a>\n      <a href=\"#man-pecas\">12. Peças e custos<\/a>\n      <a href=\"#man-indicadores\">13. Indicadores<\/a>\n      <a href=\"#man-triagem\">14. Triagem inteligente<\/a>\n      <a href=\"#man-relatorio\">15. Relatório PMOC<\/a>\n      <a href=\"#man-dados\">16. Dados, backup e auditoria<\/a>\n      <a href=\"#man-rotina\">17. Rotina recomendada<\/a>\n      <a href=\"#man-problemas\">18. Solução de problemas<\/a>\n    <\/aside>\n\n    <div class=\"manual-content\">\n      <article class=\"manual-bloco card\" id=\"man-inicio\" data-manual=\"início rápido primeiros passos demonstração\">\n        <div class=\"manual-num\">1<\/div><h2>Início rápido<\/h2>\n        <p>Para conhecer o sistema sem preencher todos os cadastros, abra o <strong>Painel<\/strong> e use <strong>Carregar dados de demonstração<\/strong>. O cenário fictício preenche a estrutura institucional, os equipamentos, as tarefas, as OS, as análises de QAI, os ensaios e os indicadores.<\/p>\n        <div class=\"manual-steps\">\n          <div class=\"manual-step\"><strong>Faça um backup.<\/strong><span>Antes de restaurar dados antigos ou carregar uma demonstração, gere um arquivo de segurança.<\/span><\/div>\n          <div class=\"manual-step\"><strong>Cadastre a estrutura.<\/strong><span>Crie instituição, unidade, edificação, pavimentos, ambientes e sistemas.<\/span><\/div>\n          <div class=\"manual-step\"><strong>Defina a edificação ativa.<\/strong><span>O seletor no topo determina o escopo das demais telas.<\/span><\/div>\n          <div class=\"manual-step\"><strong>Inventarie os equipamentos.<\/strong><span>Informe identificação, localização, capacidade, dados elétricos, criticidade e custos.<\/span><\/div>\n          <div class=\"manual-step\"><strong>Gere o cronograma.<\/strong><span>O sistema cria as tarefas aplicáveis e calcula os prazos futuros.<\/span><\/div>\n          <div class=\"manual-step\"><strong>Registre as execuções.<\/strong><span>Preencha o checklist, as leituras, os materiais, a duração e as evidências.<\/span><\/div>\n          <div class=\"manual-step\"><strong>Emita o relatório.<\/strong><span>Revise as pendências, confirme os dados e gere o documento do período.<\/span><\/div>\n        <\/div>\n        <div class=\"manual-callout info\"><strong>Regra de escopo:<\/strong> ao trocar a edificação ativa, o sistema passa a exibir somente os registros operacionais vinculados àquela edificação.<\/div>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-estrutura\" data-manual=\"instituição unidade edificação pavimento ambiente sistema hierarquia\">\n        <div class=\"manual-num\">2<\/div><h2>Estrutura institucional<\/h2>\n        <p>A aba <strong>Estrutura institucional<\/strong> organiza os registros na sequência: <strong>Instituição → Unidade → Edificação → Pavimento → Ambiente → Sistema → Equipamento<\/strong>.<\/p>\n        <h3>Como preencher<\/h3>\n        <ol>\n          <li>Salve os dados da instituição mantenedora.<\/li>\n          <li>Cadastre uma ou mais unidades administrativas ou operacionais.<\/li>\n          <li>Crie as edificações e vincule cada uma à sua unidade.<\/li>\n          <li>Na edificação ativa, registre pavimentos, ambientes e sistemas de climatização.<\/li>\n          <li>Defina a criticidade dos ambientes e sistemas para orientar a priorização.<\/li>\n        <\/ol>\n        <div class=\"manual-callout\"><strong>Boa prática:<\/strong> utilize códigos curtos e únicos, como <code>BL-A<\/code>, <code>P03<\/code>, <code>AMB-315<\/code> e <code>HVAC-01<\/code>. Eles tornam as tabelas e os relatórios mais claros.<\/div>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-edificacao\" data-manual=\"edificação responsável técnico rt art rrt empresa contrato vazão ar exterior\">\n        <div class=\"manual-num\">3<\/div><h2>Edificação ativa e responsável técnico<\/h2>\n        <p>Na aba <strong>Edificação ativa e RT<\/strong>, registre a identificação do estabelecimento, a área climatizada, a ocupação, o responsável técnico, a empresa mantenedora e os dados contratuais.<\/p>\n        <ul>\n          <li>O nome da edificação e o responsável técnico são necessários para a emissão do relatório.<\/li>\n          <li>O tipo de ocupação interfere nas periodicidades e no cálculo referencial de ar exterior.<\/li>\n          <li>Uma alteração do tipo da edificação pode exigir a reconciliação das tarefas futuras.<\/li>\n          <li>Informe ART/RRT, registro profissional e vigência contratual sempre que disponíveis.<\/li>\n        <\/ul>\n        <div class=\"manual-callout warning\"><strong>Atenção:<\/strong> após modificar dados que influenciam o plano, use <strong>Gerar/atualizar cronograma<\/strong> e revise o resumo da reconciliação.<\/div>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-equipamentos\" data-manual=\"equipamento inventário tag fabricante modelo série patrimônio criticidade qr capacidade potência refrigerante filtro\">\n        <div class=\"manual-num\">4<\/div><h2>Equipamentos<\/h2>\n        <p>A aba <strong>Equipamentos<\/strong> concentra o inventário técnico. Clique em <strong>Novo equipamento<\/strong> e preencha, no mínimo, tag, tipo, localização e capacidade.<\/p>\n        <div class=\"manual-grid-2\">\n          <div><h3>Identificação<\/h3><p>Tag, fabricante, modelo, série, patrimônio, data de instalação, garantia e situação operacional.<\/p><\/div>\n          <div><h3>Hierarquia<\/h3><p>Pavimento, ambiente e sistema ao qual o equipamento pertence.<\/p><\/div>\n          <div><h3>Características<\/h3><p>Capacidade, potência, tensão, fases, corrente, vazão, fluido, carga e classe de filtragem.<\/p><\/div>\n          <div><h3>Gestão patrimonial<\/h3><p>Criticidade, custo de aquisição, custo de reposição e vida útil estimada.<\/p><\/div>\n        <\/div>\n        <p>Quando um equipamento já possui histórico, prefira <strong>arquivar ou desativar<\/strong> em vez de eliminar. Assim, as tarefas concluídas, OS, peças, energia e evidências permanecem rastreáveis.<\/p>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-plantas\" data-manual=\"planta pdf png jpg svg mapa marcador localização equipamento qai ensaio pavimento\">\n        <div class=\"manual-num\">5<\/div><h2>Plantas e localização gráfica<\/h2>\n        <p>Use a aba <strong>Plantas e localização<\/strong> para associar uma planta a cada pavimento e posicionar equipamentos, amostras de QAI e ensaios.<\/p>\n        <ol>\n          <li>Selecione o pavimento e cadastre uma planta.<\/li>\n          <li>Para marcação interativa, prefira PNG, JPG ou SVG.<\/li>\n          <li>Selecione o tipo de ponto e o registro que será posicionado.<\/li>\n          <li>Clique sobre a planta e arraste o marcador até a posição correta.<\/li>\n          <li>Confira a lista de pontos e salve um backup depois de anexar os arquivos.<\/li>\n        <\/ol>\n        <div class=\"manual-callout info\"><strong>PDF:<\/strong> o documento é preservado e pode ser visualizado, mas a marcação precisa é realizada sobre uma versão em imagem do pavimento.<\/div>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-plano\" data-manual=\"plano cronograma tarefa periodicidade vencida a vencer calendário reconciliação\">\n        <div class=\"manual-num\">6<\/div><h2>Plano e cronograma<\/h2>\n        <p>O catálogo associa atividades aos tipos de equipamento e à edificação. Ao clicar em <strong>Gerar/atualizar cronograma<\/strong>, o motor cria, reprograma, mantém ou cancela tarefas futuras conforme a aplicabilidade atual.<\/p>\n        <ul>\n          <li><strong>Vencida:<\/strong> prazo anterior à data atual e sem conclusão.<\/li>\n          <li><strong>A vencer:<\/strong> prazo dentro da janela de alerta.<\/li>\n          <li><strong>Programada:<\/strong> tarefa futura fora da janela imediata.<\/li>\n          <li><strong>Concluída:<\/strong> execução registrada e preservada no histórico.<\/li>\n        <\/ul>\n        <p>Use filtros por equipamento, periodicidade e situação para localizar rapidamente as tarefas. O calendário oferece uma leitura mensal das ocorrências.<\/p>\n        <div class=\"manual-callout\"><strong>Importante:<\/strong> a reconciliação nunca deve alterar uma execução já concluída; ela atua sobre tarefas futuras e pendentes.<\/div>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-execucao\" data-manual=\"execução checklist tarefa epi loto leitura antes depois materiais anexos evidência\">\n        <div class=\"manual-num\">7<\/div><h2>Execução e checklists<\/h2>\n        <p>Na tarefa desejada, clique em <strong>Executar<\/strong>. O formulário registra a data, o executante, a duração, a segurança, as leituras antes e depois, os materiais aplicados e as evidências.<\/p>\n        <h3>Preenchimento do checklist<\/h3>\n        <ul>\n          <li>Classifique cada item como <strong>Conforme<\/strong>, <strong>Não conforme<\/strong> ou <strong>Não aplicável<\/strong>.<\/li>\n          <li>Registre valores medidos e observações quando o procedimento exigir.<\/li>\n          <li>Confirme os EPIs e, nas intervenções elétricas, o bloqueio e a desenergização aplicáveis.<\/li>\n          <li>Anexe fotografias, fichas de campo, certificados ou laudos.<\/li>\n        <\/ul>\n        <p>Uma não conformidade no checklist pode originar automaticamente uma OS corretiva, mantendo o vínculo com a tarefa executada.<\/p>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-os\" data-manual=\"ordem serviço os corretiva preventiva sla prioridade atendimento solução parada falha causa custo\">\n        <div class=\"manual-num\">8<\/div><h2>Ordens de serviço e SLA<\/h2>\n        <p>As OS documentam ocorrências, intervenções e ações corretivas. Informe equipamento, descrição, prioridade, situação, responsável e datas.<\/p>\n        <div class=\"manual-grid-2\">\n          <div><h3>SLA<\/h3><p>A prioridade define as metas de primeiro atendimento e de solução. As metas podem ser editadas em <strong>Indicadores e SLA<\/strong>.<\/p><\/div>\n          <div><h3>Confiabilidade<\/h3><p>Categoria, modo de falha e causa raiz alimentam os indicadores de reincidência e o Pareto.<\/p><\/div>\n          <div><h3>Indisponibilidade<\/h3><p>Início e fim da parada, ou horas informadas manualmente, entram no cálculo de disponibilidade.<\/p><\/div>\n          <div><h3>Custos<\/h3><p>Mão de obra, materiais e terceiros compõem o custo total da OS.<\/p><\/div>\n        <\/div>\n        <div class=\"manual-callout warning\"><strong>Consistência:<\/strong> uma OS concluída deve possuir data de conclusão válida. Ao reabrir, registre a alteração e mantenha o histórico.<\/div>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-qai\" data-manual=\"qai qualidade ar campanha amostra fungos co2 pm10 temperatura umidade velocidade inconclusivo não conformidade reteste\">\n        <div class=\"manual-num\">9<\/div><h2>QAI e não conformidades<\/h2>\n        <p>Organize as análises em campanhas, identifique ambientes e pontos de coleta e registre os resultados laboratoriais ou instrumentais.<\/p>\n        <ul>\n          <li><strong>Conforme:<\/strong> dados suficientes e todos os critérios atendidos.<\/li>\n          <li><strong>Desconforme:<\/strong> ao menos um parâmetro fora do critério adotado.<\/li>\n          <li><strong>Inconclusivo:<\/strong> informações insuficientes para afirmar conformidade.<\/li>\n        <\/ul>\n        <p>Quando habilitada, a abertura automática cria uma não conformidade vinculada à análise. A NC deve registrar responsável, prazo, causa, ação corretiva, verificação de eficácia e eventual reteste.<\/p>\n        <div class=\"manual-callout info\"><strong>Relação I/E:<\/strong> informe fungos internos e externos para que o sistema calcule a relação. A ausência da amostra externa pode tornar a avaliação parcial.<\/div>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-ensaios\" data-manual=\"ensaio medição instrumento calibração certificado procedimento limite unidade resultado\">\n        <div class=\"manual-num\">10<\/div><h2>Ensaios e instrumentos<\/h2>\n        <p>A aba possui três componentes integrados: inventário de instrumentos, biblioteca de procedimentos e registros de ensaios.<\/p>\n        <ol>\n          <li>Cadastre o instrumento, seu número de série, faixa, resolução e certificado.<\/li>\n          <li>Informe as datas de calibração e validade.<\/li>\n          <li>Revise ou crie o procedimento com unidade e critérios de aceitação.<\/li>\n          <li>Registre o resultado e associe os instrumentos utilizados.<\/li>\n          <li>Abra uma NC quando o resultado não atender ao critério.<\/li>\n        <\/ol>\n        <div class=\"manual-callout warning\"><strong>Calibração:<\/strong> resultados obtidos com instrumento vencido ou sem rastreabilidade devem ser avaliados pelo responsável técnico antes de serem utilizados como evidência conclusiva.<\/div>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-energia\" data-manual=\"energia consumo kwh tarifa temperatura horas anomalia eficiência\">\n        <div class=\"manual-num\">11<\/div><h2>Energia<\/h2>\n        <p>Registre o consumo por equipamento, a data, as horas de funcionamento, as temperaturas e a tarifa. Os gráficos permitem observar tendências e possíveis aumentos anormais.<\/p>\n        <p>Para comparações mais úteis, mantenha a mesma frequência de leitura e preencha as horas de operação. Evite comparar diretamente períodos com regimes de funcionamento muito diferentes.<\/p>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-pecas\" data-manual=\"peças materiais custos estoque vida útil próxima troca fornecedor csv\">\n        <div class=\"manual-num\">12<\/div><h2>Peças e custos<\/h2>\n        <p>Registre filtros, correias, componentes, fluidos e produtos aplicados. Informe quantidade, valor unitário, fornecedor, vida útil e próxima troca.<\/p>\n        <ul>\n          <li>O valor total é calculado pela quantidade multiplicada pelo valor unitário.<\/li>\n          <li>A vida útil alimenta a projeção das próximas substituições.<\/li>\n          <li>Os custos entram nos indicadores e podem ser exportados para CSV.<\/li>\n        <\/ul>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-indicadores\" data-manual=\"indicadores sla mttr mtbf disponibilidade backlog pareto falhas custos reincidência\">\n        <div class=\"manual-num\">13<\/div><h2>Indicadores e SLA<\/h2>\n        <p>Selecione o período e clique em <strong>Atualizar<\/strong>. O painel consolida SLA de atendimento e solução, MTTR, MTBF, disponibilidade, horas de parada, reincidência, backlog e custos.<\/p>\n        <ul>\n          <li>Use o Pareto de causas para direcionar ações de engenharia e manutenção.<\/li>\n          <li>Use o Pareto de custos para identificar os ativos economicamente mais relevantes.<\/li>\n          <li>Interprete MTBF e disponibilidade somente quando houver histórico suficiente e registros consistentes de falha e parada.<\/li>\n        <\/ul>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-triagem\" data-manual=\"triagem inteligente ocorrência inteligência artificial claude api prioridade especialidade verificações\">\n        <div class=\"manual-num\">14<\/div><h2>Triagem inteligente<\/h2>\n        <p>Descreva a ocorrência em linguagem natural. O classificador local sugere categoria, prioridade, prazo, especialidade e verificações iniciais.<\/p>\n        <p>A chave de API é opcional e habilita a análise externa. Antes de utilizá-la, revise a descrição e evite enviar dados pessoais ou identificadores desnecessários. A recomendação da triagem é auxiliar e deve ser confirmada por profissional competente.<\/p>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-relatorio\" data-manual=\"relatório pmoc imprimir pdf período assinatura responsável técnico pendências\">\n        <div class=\"manual-num\">15<\/div><h2>Relatório PMOC<\/h2>\n        <p>Informe o período e o local de emissão, revise os registros e marque a declaração de conferência. Em seguida, clique em <strong>Gerar relatório<\/strong>.<\/p>\n        <p>O documento reúne identificação, inventário, plano executado, pendências, OS, QAI, materiais, energia, ensaios, não conformidades e indicadores disponíveis. Use <strong>Imprimir / salvar em PDF<\/strong> para gerar o arquivo final.<\/p>\n        <div class=\"manual-callout\"><strong>Revisão técnica:<\/strong> a emissão do relatório não elimina atrasos, pendências ou resultados inconclusivos. Eles devem permanecer expressamente registrados.<\/div>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-dados\" data-manual=\"dados indexeddb localstorage backup restaurar arquivo auditoria anexos migração\">\n        <div class=\"manual-num\">16<\/div><h2>Dados, backup, arquivo e auditoria<\/h2>\n        <p>O IndexedDB é o armazenamento principal. O espelho local é complementar e pode ser reduzido automaticamente quando o navegador limita o espaço disponível.<\/p>\n        <ul>\n          <li><strong>Backup:<\/strong> gere o arquivo regularmente e antes de mudanças importantes.<\/li>\n          <li><strong>Restaurar:<\/strong> selecione o backup, confira o resumo e confirme a substituição.<\/li>\n          <li><strong>Arquivar:<\/strong> retira o registro das telas operacionais sem apagar o histórico.<\/li>\n          <li><strong>Auditoria:<\/strong> registra ações relevantes, datas, entidades e detalhes.<\/li>\n          <li><strong>Anexos:<\/strong> permanecem no navegador e são incluídos no backup completo.<\/li>\n        <\/ul>\n        <div class=\"manual-callout warning\"><strong>Não dependa de um único navegador ou computador.<\/strong> Mantenha cópias do backup em local institucional seguro e com controle de versão.<\/div>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-rotina\" data-manual=\"rotina diária semanal mensal anual fluxo trabalho\">\n        <div class=\"manual-num\">17<\/div><h2>Rotina recomendada de uso<\/h2>\n        <div class=\"manual-grid-2\">\n          <div><h3>Diariamente<\/h3><p>Verifique alertas, tarefas vencidas, OS abertas, falhas críticas e novas ocorrências.<\/p><\/div>\n          <div><h3>Semanalmente<\/h3><p>Atualize OS, confira tarefas a vencer, valide anexos e acompanhe não conformidades.<\/p><\/div>\n          <div><h3>Mensalmente<\/h3><p>Revise custos, peças, energia, SLA, backlog, Pareto e a qualidade dos registros.<\/p><\/div>\n          <div><h3>Periodicamente<\/h3><p>Realize campanhas de QAI, calibrações, revisão documental e emissão do relatório.<\/p><\/div>\n        <\/div>\n        <p>Após cada ciclo relevante, gere um backup e registre a revisão documental do PMOC.<\/p>\n      <\/article>\n\n      <article class=\"manual-bloco card\" id=\"man-problemas\" data-manual=\"problema erro espelho local armazenamento tela branca navegador arquivo download\">\n        <div class=\"manual-num\">18<\/div><h2>Solução de problemas<\/h2>\n        <details open><summary>O sistema informa que o espelho local não pôde ser atualizado<\/summary><p>O IndexedDB pode continuar armazenando os dados principais. Confira o chip de armazenamento, gere um backup e evite manter anexos excessivos sem cópia externa. A versão atual reduz automaticamente o espelho quando necessário.<\/p><\/details>\n        <details><summary>A tela abre, mas os dados antigos não aparecem<\/summary><p>Confirme se o arquivo está sendo aberto no mesmo navegador e perfil. Os dados locais não acompanham automaticamente o HTML. Use a opção <strong>Restaurar<\/strong> com o backup gerado no ambiente anterior.<\/p><\/details>\n        <details><summary>Uma planta ou anexo não aparece em outro computador<\/summary><p>Os arquivos ficam no armazenamento do navegador. Transfira-os por meio do backup completo e restaure o arquivo no novo dispositivo.<\/p><\/details>\n        <details><summary>O relatório não é gerado<\/summary><p>Confira o período, a declaração de conferência, a edificação, o responsável técnico e o inventário de equipamentos. O sistema mostra a pendência encontrada junto aos controles de emissão.<\/p><\/details>\n        <details><summary>As letras ainda estão pequenas<\/summary><p>Use os botões <strong>A−<\/strong>, <strong>A<\/strong> e <strong>A+<\/strong> no canto superior. A preferência é preservada neste navegador quando o armazenamento local está disponível.<\/p><\/details>\n      <\/article>\n\n      <div class=\"manual-empty\" id=\"manual-vazio\" hidden>Nenhum tópico corresponde à pesquisa.<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\/main>\n\n<!-- ============ MODAIS ============ -->\n<div class=\"modal\" id=\"md-eq\"><div class=\"cx\">\n  <div class=\"cab\"><h3 id=\"md-eq-tit\">Equipamento<\/h3><button class=\"mini\" data-fechar=\"\">Fechar<\/button><\/div>\n  <form id=\"f-eq\" novalidate=\"\">\n    <input type=\"hidden\" id=\"q-id\">\n    <div class=\"grade g2\">\n      <div class=\"campo\"><label for=\"q-tag\">Tag / identificação *<\/label><input id=\"q-tag\"><div class=\"erro\">Informe a tag.<\/div><\/div>\n      <div class=\"campo\"><label for=\"q-tipo\">Tipo *<\/label><select id=\"q-tipo\"><\/select><\/div>\n    <\/div>\n    <div class=\"grade g2\">\n      <div class=\"campo\"><label for=\"q-local\">Ambiente atendido / localização *<\/label><input id=\"q-local\"><div class=\"erro\">Informe a localização.<\/div><\/div>\n      <div class=\"campo\"><label for=\"q-marca\">Marca / modelo<\/label><input id=\"q-marca\"><\/div>\n    <\/div>\n    <div class=\"grade g3\">\n      <div class=\"campo\"><label for=\"q-cap\">Capacidade (TR) *<\/label><input id=\"q-cap\" type=\"number\" step=\"0.01\" min=\"0\"><div class=\"erro\">Capacidade deve ser maior que zero.<\/div><\/div>\n      <div class=\"campo\"><label for=\"q-pot\">Potência elétrica (kW)<\/label><input id=\"q-pot\" type=\"number\" step=\"0.01\" min=\"0\"><\/div>\n      <div class=\"campo\"><label for=\"q-ano\">Ano de instalação<\/label><input id=\"q-ano\" type=\"number\" min=\"1950\" max=\"2100\"><\/div>\n    <\/div>\n    <div class=\"grade g3\">\n      <div class=\"campo\"><label for=\"q-fluido\">Fluido refrigerante<\/label><select id=\"q-fluido\">\n        <option value=\"\">—<\/option><option>R-410A<\/option><option>R-32<\/option><option>R-22<\/option><option>R-134a<\/option><option>R-407C<\/option><option>R-1234ze<\/option><option>Água gelada<\/option><\/select><\/div>\n      <div class=\"campo\"><label for=\"q-filtro\">Classe de filtragem<\/label><select id=\"q-filtro\">\n        <option value=\"\">—<\/option><option>G4<\/option><option>M5<\/option><option>F7<\/option><option>F9<\/option><option>H13 (HEPA)<\/option><option>H14 (HEPA)<\/option><\/select><\/div>\n      <div class=\"campo\"><label for=\"q-sit\">Situação *<\/label><select id=\"q-sit\">\n        <option>Operando<\/option><option>Parado<\/option><option>Crítico<\/option><option>Desativado<\/option><\/select><\/div>\n    <\/div>\n    <div class=\"grade g2\">\n      <div class=\"campo\"><label for=\"q-ult\">Última manutenção<\/label><input id=\"q-ult\" type=\"date\"><\/div>\n      <div class=\"campo\"><label for=\"q-obs\">Observações<\/label><input id=\"q-obs\"><\/div>\n    <\/div>\n    <div class=\"acoes\"><button type=\"submit\" class=\"pri\">Salvar<\/button><button type=\"button\" data-fechar=\"\">Cancelar<\/button><\/div>\n  <\/form>\n<\/div><\/div>\n\n<div class=\"modal\" id=\"md-exec\"><div class=\"cx\" style=\"max-width:980px\">\n  <div class=\"cab\"><h3>Registrar execução e checklist técnico<\/h3><button class=\"mini\" data-fechar=\"\">Fechar<\/button><\/div>\n  <form id=\"f-exec\" novalidate=\"\">\n    <input type=\"hidden\" id=\"x-id\">\n    <p id=\"x-desc\" style=\"font-size:.85rem;color:var(--tx2)\"><\/p>\n    <div class=\"grade g3\">\n      <div class=\"campo\"><label for=\"x-data\">Data de execução *<\/label><input id=\"x-data\" type=\"date\"><div class=\"erro\">Informe uma data válida, não futura.<\/div><\/div>\n      <div class=\"campo\"><label for=\"x-resp\">Executante *<\/label><input id=\"x-resp\"><div class=\"erro\">Informe o executante.<\/div><\/div>\n      <div class=\"campo\"><label for=\"x-dur\">Duração (min)<\/label><input id=\"x-dur\" type=\"number\" min=\"0\" step=\"1\"><\/div>\n    <\/div>\n    <fieldset class=\"execucao\"><legend>Segurança, leituras e materiais<\/legend>\n      <div class=\"grade g2\">\n        <div class=\"campo\"><label for=\"x-ant\">Condição / leituras antes da intervenção<\/label><textarea id=\"x-ant\" rows=\"2\" placeholder=\"Temperatura, pressão, corrente, ΔP, ruído ou condição visual\"><\/textarea><\/div>\n        <div class=\"campo\"><label for=\"x-dep\">Condição / leituras após a intervenção<\/label><textarea id=\"x-dep\" rows=\"2\"><\/textarea><\/div>\n      <\/div>\n      <div class=\"campo\"><label for=\"x-mat\">Materiais, peças e produtos aplicados<\/label><textarea id=\"x-mat\" rows=\"2\"><\/textarea><\/div>\n      <div class=\"grade g2\">\n        <div class=\"campo\"><label><input type=\"checkbox\" id=\"x-epi\"> EPIs e condições de trabalho verificados<\/label><div class=\"erro\">Confirme a verificação de segurança.<\/div><\/div>\n        <div class=\"campo\"><label><input type=\"checkbox\" id=\"x-loto\"> Bloqueio, etiquetagem e desenergização realizados quando aplicáveis<\/label><div class=\"erro\">Obrigatório para a atividade elétrica.<\/div><\/div>\n      <\/div>\n    <\/fieldset>\n    <h4>Checklist do procedimento<\/h4>\n    <p class=\"help-inline\">Classifique todos os itens como Conforme, Não conforme ou Não aplicável. Qualquer não conformidade abrirá uma OS corretiva.<\/p>\n    <div id=\"x-checklist\"><\/div>\n    <div class=\"campo\"><label for=\"x-obs\">Observações gerais / método empregado<\/label><textarea id=\"x-obs\" rows=\"3\"><\/textarea><\/div>\n    <div class=\"campo\"><label for=\"x-anexos\">Evidências e documentos<\/label><input id=\"x-anexos\" type=\"file\" multiple accept=\"image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt\"><div class=\"help-inline\">Fotos antes/depois, laudos, certificados ou fichas de campo. Limite de 12 MB por arquivo.<\/div><\/div>\n    <div class=\"campo\"><label><input type=\"checkbox\" id=\"x-conf\"> Registrar não conformidade adicional (além do checklist)<\/label><\/div>\n    <div class=\"acoes\"><button type=\"submit\" class=\"pri\">Concluir tarefa<\/button><button type=\"button\" data-fechar=\"\">Cancelar<\/button><\/div>\n  <\/form>\n<\/div><\/div>\n\n<div class=\"modal\" id=\"md-os\"><div class=\"cx\">\n  <div class=\"cab\"><h3 id=\"md-os-tit\">Ordem de serviço<\/h3><button class=\"mini\" data-fechar=\"\">Fechar<\/button><\/div>\n  <form id=\"f-os\" novalidate=\"\">\n    <input type=\"hidden\" id=\"o-id\">\n    <div class=\"grade g3\">\n      <div class=\"campo\"><label for=\"o-eq\">Equipamento *<\/label><select id=\"o-eq\"><\/select><div class=\"erro\">Selecione o equipamento.<\/div><\/div>\n      <div class=\"campo\"><label for=\"o-abre\">Data de abertura *<\/label><input id=\"o-abre\" type=\"date\"><div class=\"erro\">Informe uma data válida.<\/div><\/div>\n      <div class=\"campo\"><label for=\"o-pri\">Prioridade<\/label><select id=\"o-pri\"><option>Alta<\/option><option selected=\"\">Média<\/option><option>Baixa<\/option><\/select><\/div>\n    <\/div>\n    <div class=\"campo\"><label for=\"o-desc\">Descrição do serviço *<\/label><textarea id=\"o-desc\" rows=\"3\"><\/textarea><div class=\"erro\">Descreva o serviço.<\/div><\/div>\n    <div class=\"grade g3\">\n      <div class=\"campo\"><label for=\"o-sit\">Situação<\/label><select id=\"o-sit\"><option>Aberta<\/option><option>Em execução<\/option><option>Concluída<\/option><option>Cancelada<\/option><\/select><\/div>\n      <div class=\"campo\"><label for=\"o-resp\">Responsável<\/label><input id=\"o-resp\"><\/div>\n      <div class=\"campo\"><label for=\"o-concl\">Data de conclusão<\/label><input id=\"o-concl\" type=\"date\"><\/div>\n    <\/div>\n    <div class=\"campo\"><label for=\"o-sol\">Solução adotada<\/label><textarea id=\"o-sol\" rows=\"2\"><\/textarea><\/div>\n    <div class=\"campo\"><label for=\"o-anexos\">Novos anexos<\/label><input id=\"o-anexos\" type=\"file\" multiple accept=\"image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt\"><\/div>\n    <div id=\"o-hist\" class=\"nota\" style=\"display:none;margin-bottom:.7rem\"><\/div>\n    <div class=\"acoes\"><button type=\"submit\" class=\"pri\">Salvar<\/button><button type=\"button\" data-fechar=\"\">Cancelar<\/button><\/div>\n  <\/form>\n<\/div><\/div>\n\n<div class=\"modal\" id=\"md-qai\"><div class=\"cx\">\n  <div class=\"cab\"><h3>Análise de qualidade do ar<\/h3><button class=\"mini\" data-fechar=\"\">Fechar<\/button><\/div>\n  <form id=\"f-qai\" novalidate=\"\">\n    <input type=\"hidden\" id=\"a-id\">\n    <div class=\"grade g2\">\n      <div class=\"campo\"><label for=\"a-data\">Data da coleta *<\/label><input id=\"a-data\" type=\"date\"><div class=\"erro\">Informe a data.<\/div><\/div>\n      <div class=\"campo\"><label for=\"a-amb\">Ambiente avaliado *<\/label><input id=\"a-amb\"><div class=\"erro\">Informe o ambiente.<\/div><\/div>\n    <\/div>\n    <div class=\"grade g3\">\n      <div class=\"campo\"><label for=\"a-fun\">Fungos internos (UFC/m³)<\/label><input id=\"a-fun\" type=\"number\" step=\"1\" min=\"0\"><\/div>\n      <div class=\"campo\"><label for=\"a-fune\">Fungos externos (UFC/m³)<\/label><input id=\"a-fune\" type=\"number\" step=\"1\" min=\"0\"><\/div>\n      <div class=\"campo\"><label for=\"a-co2\">CO₂ (ppm)<\/label><input id=\"a-co2\" type=\"number\" step=\"1\" min=\"0\"><\/div>\n    <\/div>\n    <div class=\"grade g4\">\n      <div class=\"campo\"><label for=\"a-aer\">Aerodispersóides (µg/m³)<\/label><input id=\"a-aer\" type=\"number\" step=\"1\" min=\"0\"><\/div>\n      <div class=\"campo\"><label for=\"a-t\">Temperatura (°C)<\/label><input id=\"a-t\" type=\"number\" step=\"0.1\"><\/div>\n      <div class=\"campo\"><label for=\"a-ur\">Umidade relativa (%)<\/label><input id=\"a-ur\" type=\"number\" step=\"1\" min=\"0\" max=\"100\"><\/div>\n      <div class=\"campo\"><label for=\"a-v\">Velocidade do ar (m/s)<\/label><input id=\"a-v\" type=\"number\" step=\"0.01\" min=\"0\"><\/div>\n    <\/div>\n    <div class=\"grade g2\">\n      <div class=\"campo\"><label for=\"a-lab\">Laboratório / responsável<\/label><input id=\"a-lab\"><\/div>\n      <div class=\"campo\"><label for=\"a-laudo\">Laudo nº<\/label><input id=\"a-laudo\"><\/div>\n    <\/div>\n    <div class=\"erro\" id=\"a-med-erro\" style=\"margin-bottom:.6rem\">Informe ao menos uma medição. Resultados parciais serão classificados como inconclusivos.<\/div>\n    <div class=\"campo\"><label for=\"a-anexos\">Laudos e evidências<\/label><input id=\"a-anexos\" type=\"file\" multiple accept=\"image/*,.pdf,.csv,.txt\"><\/div>\n    <div class=\"acoes\"><button type=\"submit\" class=\"pri\">Salvar análise<\/button><button type=\"button\" data-fechar=\"\">Cancelar<\/button><\/div>\n  <\/form>\n<\/div><\/div>\n\n<div class=\"modal\" id=\"md-en\"><div class=\"cx\">\n  <div class=\"cab\"><h3>Leitura de consumo<\/h3><button class=\"mini\" data-fechar=\"\">Fechar<\/button><\/div>\n  <form id=\"f-en\" novalidate=\"\">\n    <div class=\"grade g2\">\n      <div class=\"campo\"><label for=\"n-data\">Data *<\/label><input id=\"n-data\" type=\"date\"><div class=\"erro\">Informe a data.<\/div><\/div>\n      <div class=\"campo\"><label for=\"n-eq\">Equipamento *<\/label><select id=\"n-eq\"><\/select><div class=\"erro\">Selecione o equipamento.<\/div><\/div>\n    <\/div>\n    <div class=\"grade g3\">\n      <div class=\"campo\"><label for=\"n-kwh\">Consumo (kWh) *<\/label><input id=\"n-kwh\" type=\"number\" step=\"0.1\" min=\"0\"><div class=\"erro\">Consumo deve ser maior que zero.<\/div><\/div>\n      <div class=\"campo\"><label for=\"n-hr\">Horas de operação<\/label><input id=\"n-hr\" type=\"number\" step=\"0.5\" min=\"0\" max=\"24\"><\/div>\n      <div class=\"campo\"><label for=\"n-ta\">Temp. ambiente (°C)<\/label><input id=\"n-ta\" type=\"number\" step=\"0.1\"><\/div>\n    <\/div>\n    <div class=\"grade g2\">\n      <div class=\"campo\"><label for=\"n-ti\">Temp. de insuflamento (°C)<\/label><input id=\"n-ti\" type=\"number\" step=\"0.1\"><\/div>\n      <div class=\"campo\"><label for=\"n-obs\">Observações<\/label><input id=\"n-obs\"><\/div>\n    <\/div>\n    <div class=\"acoes\"><button type=\"submit\" class=\"pri\">Registrar<\/button><button type=\"button\" data-fechar=\"\">Cancelar<\/button><\/div>\n  <\/form>\n<\/div><\/div>\n\n<div class=\"modal\" id=\"md-pc\"><div class=\"cx\">\n  <div class=\"cab\"><h3>Troca de peça / insumo<\/h3><button class=\"mini\" data-fechar=\"\">Fechar<\/button><\/div>\n  <form id=\"f-pc\" novalidate=\"\">\n    <div class=\"grade g2\">\n      <div class=\"campo\"><label for=\"c-data\">Data da troca *<\/label><input id=\"c-data\" type=\"date\"><div class=\"erro\">Informe a data.<\/div><\/div>\n      <div class=\"campo\"><label for=\"c-eq\">Equipamento *<\/label><select id=\"c-eq\"><\/select><div class=\"erro\">Selecione o equipamento.<\/div><\/div>\n    <\/div>\n    <div class=\"grade g2\">\n      <div class=\"campo\"><label for=\"c-item\">Item *<\/label><select id=\"c-item\"><\/select><\/div>\n      <div class=\"campo\"><label for=\"c-forn\">Fornecedor<\/label><input id=\"c-forn\"><\/div>\n    <\/div>\n    <div class=\"grade g3\">\n      <div class=\"campo\"><label for=\"c-qtd\">Quantidade *<\/label><input id=\"c-qtd\" type=\"number\" step=\"1\" min=\"1\" value=\"1\"><div class=\"erro\">Quantidade inválida.<\/div><\/div>\n      <div class=\"campo\"><label for=\"c-vlr\">Valor unitário (R$) *<\/label><input id=\"c-vlr\" type=\"number\" step=\"0.01\" min=\"0\"><div class=\"erro\">Valor inválido.<\/div><\/div>\n      <div class=\"campo\"><label for=\"c-vida\">Vida útil (dias)<\/label><input id=\"c-vida\" type=\"number\" step=\"1\" min=\"1\"><\/div>\n    <\/div>\n    <div class=\"campo\"><label for=\"c-obs\">Observações<\/label><input id=\"c-obs\"><\/div>\n    <div class=\"acoes\"><button type=\"submit\" class=\"pri\">Registrar<\/button><button type=\"button\" data-fechar=\"\">Cancelar<\/button><\/div>\n  <\/form>\n<\/div><\/div>\n\n<div class=\"modal\" id=\"md-cat\"><div class=\"cx\" style=\"max-width:860px\">\n  <div class=\"cab\"><h3>Catálogo de atividades<\/h3><button class=\"mini\" data-fechar=\"\">Fechar<\/button><\/div>\n  <div class=\"tabwrap\"><table id=\"tb-cat-modal\">\n    <thead><tr><th>Atividade<\/th><th>Aplicável a<\/th><th>Padrão<\/th><th>Saúde<\/th><th>Base<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<\/div><\/div>\n\n\n\n<div class=\"modal\" id=\"md-anexos\"><div class=\"cx\" style=\"max-width:780px\">\n  <div class=\"cab\"><h3 id=\"anx-tit\">Anexos<\/h3><button class=\"mini\" data-fechar=\"\">Fechar<\/button><\/div>\n  <input type=\"hidden\" id=\"anx-ent\"><input type=\"hidden\" id=\"anx-id\">\n  <div class=\"campo\"><label for=\"anx-files\">Adicionar arquivos<\/label><input id=\"anx-files\" type=\"file\" multiple accept=\"image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt\"><\/div>\n  <div class=\"acoes\"><button class=\"pri\" id=\"bt-anx-add\" type=\"button\">Adicionar<\/button><span class=\"chip\" id=\"anx-resumo\">—<\/span><\/div>\n  <div class=\"anexo-lista\" id=\"anx-lista\"><\/div>\n<\/div><\/div>\n\n<div class=\"toasts\" id=\"toasts\"><\/div>\n<script>\n\"use strict\";\n(function(){\n\n/* ==================================================================\n   1. CONSTANTES NORMATIVAS\n   ================================================================== */\n\nvar TIPOS = [\n  {id:\"split\",       nome:\"Split (hi-wall / piso-teto)\",  ar:false, agua:false},\n  {id:\"cassete\",     nome:\"Split cassete\",                ar:false, agua:false},\n  {id:\"dutado\",      nome:\"Split dutado\",                 ar:true,  agua:false},\n  {id:\"vrf\",         nome:\"VRF / multi-split\",            ar:false, agua:false},\n  {id:\"janela\",      nome:\"Condicionador de janela\",      ar:false, agua:false},\n  {id:\"selfcont\",    nome:\"Self-contained\",               ar:true,  agua:false},\n  {id:\"fancoil\",     nome:\"Fanco  14679 / Port. 3.523/1998\"},\n  {id:\"tomada\",   nome:\"Limpeza da tomada de ar exterior e verificação da vazão de renovação\",\n   tipos:[\"dutado\",\"selfcont\",\"fancoil\",\"uta\",\"exaustor\"], dias:180, saude:90, base:\"NBR 16401-3 / RE 9/2003\"},\n  {id:\"agua\",     nome:\"Tratamento e análise da água de condensação/circuito\",\n   tipos:[\"torre\",\"chiller\",\"fancoil\",\"uta\"], dias:30, saude:15, base:\"Port. GM/MS 3.523/1998\"},\n  {id:\"bacia\",    nome:\"Limpeza da bacia, do enchimento e dos eliminadores de gotas da torre\",\n   tipos:[\"torre\"], dias:30, saude:30, base:\"Port. GM/MS 3.523/1998\"},\n  {id:\"legio\",    nome:\"Pesquisa de Legionella spp. na água de recirculação\",\n   tipos:[\"torre\"], dias:180, saude:90, base:\"Boas práticas / legislação sanitária local\"},\n  {id:\"qai\",      nome:\"Análise laboratorial da qualidade do ar interior (fungos, CO₂, PM₁₀)\",\n   tipos:\"*\", unica:true, dias:180, saude:180, base:\"RE ANVISA 9/2003\"},\n  {id:\"isol\",     nome:\"Verificação do isolamento térmico de tubulações e dutos\",\n   tipos:[\"chiller\",\"fancoil\",\"uta\",\"dutado\",\"selfcont\"], dias:180, saude:180, base:\"NBR 16401-1\"},\n  {id:\"termo\",    nome:\"Medição de temperatura, umidade e velocidade do ar nos ambientes\",\n   tipos:\"*\", unica:true, dias:90, saude:90, base:\"RE ANVISA 9/2003 / NBR 16401-2\"},\n  {id:\"revisao\",  nome:\"Revisão e atualização documental do PMOC\",\n   tipos:\"*\", unica:true, dias:365, saude:365, base:\"Lei 13.589/2018\"}\n];\n\nvar VIDA_UTIL = {\n  \"Filtro de ar G4\":180, \"Filtro de ar M5\":180, \"Filtro F7\":365, \"Filtro HEPA H13\":730,\n  \"Capacitor\":1460, \"Contator\":1825, \"Motor do ventilador\":1825, \"Correia\":365,\n  \"Rolamento / mancal\":1095, \"Termostato / controlador\":2190, \"Sensor de temperatura\":1825,\n  \"Compressor\":5475, \"Válvula de expansão\":3650, \"Fluido refrigerante (carga)\":1095,\n  \"Bomba de condensado\":1825, \"Placa eletrônica\":2555, \"Isolamento térmico\":3650,\n  \"Produto químico de tratamento de água\":90, \"Outro\":365\n};\n\nvar REF_QAI = {\n  fungos:{max:750,maxInclusivo:false,un:\"UFC/m³\",nome:\"Fungos internos\",campo:\"fungos\"},\n  ie:{max:1.5,maxInclusivo:true,un:\"\",nome:\"Relação I/E de fungos\",campo:\"ie\"},\n  co2:{max:1000,maxInclusivo:false,un:\"ppm\",nome:\"CO₂\",campo:\"co2\"},\n  aero:{max:80,maxInclusivo:false,un:\"µg/m³\",nome:\"Aerodispersóides\",campo:\"aero\"},\n  temp:{min:23,max:26,minInclusivo:true,maxInclusivo:true,un:\"°C\",nome:\"Temperatura\",campo:\"temp\"},\n  ur:{min:40,max:65,minInclusivo:true,maxInclusivo:true,un:\"%\",nome:\"Umidade relativa\",campo:\"ur\"},\n  vel:{max:0.25,maxInclusivo:false,un:\"m/s\",nome:\"Velocidade do ar\",campo:\"vel\"}\n};\n\n/* Vazão de ar exterior — NBR 16401-3, nível 1 (valores em L/s) */\nvar AR_EXT = {\n  escritorio:{pessoa:7.5, area:0.3, dens:0.07},\n  saude:     {pessoa:10.0, area:0.6, dens:0.10},\n  hotel:     {pessoa:5.5, area:0.3, dens:0.05},\n  ensino:    {pessoa:5.5, area:0.6, dens:0.35},\n  comercio:  {pessoa:5.5, area:0.6, dens:0.16},\n  residencial:{pessoa:5.5, area:0.3, dens:0.05},\n  industrial:{pessoa:7.5, area:0.9, dens:0.07}\n};\n\n/* ==================================================================\n   2. ESTADO, VERSIONAMENTO E PERSISTÊNCIA\n   ================================================================== */\n\nvar APP_VERSION=\"2.2\";\nvar SCHEMA_VERSION=4;\nvar CHAVE=\"pmoc_manager_v4\";\nvar CHAVES_LEGADAS=[\"pmoc_manager_v3\",\"pmoc_manager_v2\",\"pmoc_manager_v1\"];\nvar DB_NAME=\"pmoc_manager_offline\";\nvar DB_VERSION=4;\nvar DB=null;\nvar MODO_ARMAZENAMENTO=\"memória\";\nvar filaSalvar=Promise.resolve();\n\nfunction estadoVazio(){\n  return {\n    versao:SCHEMA_VERSION, schemaVersion:SCHEMA_VERSION, appVersion:APP_VERSION,\n    edificacao:{nome:\"\",cnpj:\"\",endereco:\"\",cidade:\"\",tipo:\"escritorio\",area:0,ocupacao:0,\n      rtNome:\"\",rtReg:\"\",rtForm:\"\",rtArt:\"\",rtTel:\"\",\n      empNome:\"\",empCnpj:\"\",contrato:\"\",vigencia:\"\"},\n    equipamentos:[], tarefas:[], os:[], qai:[], energia:[], pecas:[], triagens:[],\n    anexosMeta:[], auditoria:[],\n    config:{tema:\"claro\",tarifa:0.92,seqOs:1,planoGerado:null,\n      ultimaReconciliacao:null,ultimoResumoReconciliacao:null,planoDesatualizado:false}\n  };\n}\n\nvar S=estadoVazio();\n\nfunction armazem(){\n  try{ if(typeof localStorage!==\"undefined\") return localStorage; }catch(e){}\n  return null;\n}\n\nfunction reqPromise(req){\n  return new Promise(function(resolve,reject){\n    req.onsuccess=function(){ resolve(req.result); };\n    req.onerror=function(){ reject(req.error||new Error(\"falha no IndexedDB\")); };\n  });\n}\n\nfunction abrirDB(){\n  return new Promise(function(resolve,reject){\n    if(typeof indexedDB===\"undefined\") return reject(new Error(\"IndexedDB indisponível\"));\n    var r=indexedDB.open(DB_NAME,DB_VERSION);\n    r.onupgradeneeded=function(){\n      var db=r.result;\n      if(!db.objectStoreNames.contains(\"estado\")) db.createObjectStore(\"estado\",{keyPath:\"id\"});\n      if(!db.objectStoreNames.contains(\"anexos\")){\n        var a=db.createObjectStore(\"anexos\",{keyPath:\"id\"});\n        a.createIndex(\"entidade\",\"entidade\",{unique:false});\n        a.createIndex(\"entidadeId\",\"entidadeId\",{unique:false});\n      }\n      if(!db.objectStoreNames.contains(\"snapshots\")) db.createObjectStore(\"snapshots\",{keyPath:\"id\"});\n    };\n    r.onsuccess=function(){ resolve(r.result); };\n    r.onerror=function(){ reject(r.error||new Error(\"não foi possível abrir o IndexedDB\")); };\n  });\n}\n\nfunction dbGet(store,key){\n  if(!DB) return Promise.resolve(null);\n  return reqPromise(DB.transaction(store,\"readonly\").objectStore(store).get(key));\n}\nfunction dbPut(store,obj){\n  if(!DB) return Promise.reject(new Error(\"IndexedDB indisponível\"));\n  return reqPromise(DB.transaction(store,\"readwrite\").objectStore(store).put(obj));\n}\nfunction dbDelete(store,key){\n  if(!DB) return Promise.reject(new Error(\"IndexedDB indisponível\"));\n  return reqPromise(DB.transaction(store,\"readwrite\").objectStore(store).delete(key));\n}\nfunction dbClear(store){\n  if(!DB) return Promise.resolve();\n  return reqPromise(DB.transaction(store,\"readwrite\").objectStore(store).clear());\n}\n\nfunction cloneJSON(o){ return JSON.parse(JSON.stringify(o)); }\n\nasync function carregar(){\n  var bruto=null, origem=\"\";\n  try{\n    DB=await abrirDB();\n    var reg=await dbGet(\"estado\",\"atual\");\n    if(reg&&reg.valor){ bruto=reg.valor; origem=\"IndexedDB\"; }\n  }catch(e){ DB=null; }\n\n  var a=armazem();\n  if(!bruto&&a){\n    try{\n      var txt=a.getItem(CHAVE);\n      if(txt){ bruto=JSON.parse(txt); origem=\"localStorage\"; }\n      if(!bruto){\n        for(var i=0;i<CHAVES_LEGADAS.length;i++){\n          txt=a.getItem(CHAVES_LEGADAS[i]);\n          if(txt){ bruto=JSON.parse(txt); origem=\"localStorage legado\"; break; }\n        }\n      }\n    }catch(e2){}\n  }\n\n  var mig=migrarEstado(bruto||estadoVazio());\n  S=mig.estado;\n  MODO_ARMAZENAMENTO=DB?\"IndexedDB + espelho local\":\"localStorage (fallback)\";\n  if(origem&&origem!==\"IndexedDB\") auditar(\"Migração\",\"sistema\",\"\",origem+\" → esquema v\"+SCHEMA_VERSION);\n  salvar();\n  return {carregado:!!bruto,origem:origem||\"novo\",avisos:mig.avisos};\n}\n\nfunction salvar(){\n  S.versao=SCHEMA_VERSION; S.schemaVersion=SCHEMA_VERSION; S.appVersion=APP_VERSION;\n  var copia=cloneJSON(S), a=armazem();\n  try{ if(a) a.setItem(CHAVE,JSON.stringify(copia)); }\n  catch(e){ if(typeof toast===\"function\") toast(\"Não foi possível atualizar o espelho local.\",\"wa\"); }\n  if(DB){\n    filaSalvar=filaSalvar.catch(function(){ }).then(function(){ return dbPut(\"estado\",{id:\"atual\",valor:copia,atualizadoEm:new Date().toISOString()}); });\n    filaSalvar.catch(function(){ if(typeof toast===\"function\") toast(\"Falha ao gravar no IndexedDB.\",\"er\"); });\n  }\n  return true;\n}\n\nfunction aguardarPersistencia(){ return filaSalvar.catch(function(){ }); }\n\n\n/* ==================================================================\n   3. UTILITÁRIOS\n   ================================================================== */\n\nvar DIA = 86400000;\n\nfunction uid(p){ return (p||\"id\")+\"_\"+Date.now().toString(36)+\"_\"+Math.random().toString(36).slice(2,7); }\n\nfunction hoje(){ var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }\n\nfunction dISO(d){\n  if(!d) return \"\";\n  if(typeof d===\"string\") return d.slice(0,10);\n  var m=d.getMonth()+1, x=d.getDate();\n  return d.getFullYear()+\"-\"+(m<10?\"0\":\"\")+m+\"-\"+(x<10?\"0\":\"\")+x;\n}\n\nfunction dObj(s){\n  if(!s) return null;\n  var p=String(s).slice(0,10).split(\"-\");\n  if(p.length!==3) return null;\n  var d=new Date(+p[0],+p[1]-1,+p[2]);\n  return isNaN(d.getTime())?null:d;\n}\n\nfunction dBR(s){ var d=dObj(s); if(!d) return \"—\";\n  var m=d.getMonth()+1,x=d.getDate();\n  return (x<10?\"0\":\"\")+x+\"/\"+(m<10?\"0\":\"\")+m+\"/\"+d.getFullYear(); }\n\nfunction somaDias(s,n){ var d=dObj(s)||hoje(); return dISO(new Date(d.getTime()+n*DIA)); }\n\nfunction difDias(a,b){\n  var x=dObj(a), y=dObj(b)||hoje();\n  if(!x) return 0;\n  return Math.round((x.getTime()-y.getTime())/DIA);\n}\n\nfunction num(v,d){ var n=parseFloat(v); return isNaN(n)?(d===undefined?0:d):n; }\n\nfunction fmt(v,c){ c=c===undefined?2:c;\n  return num(v).toLocaleString(\"pt-BR\",{minimumFractionDigits:c,maximumFractionDigits:c}); }\n\nfunction moeda(v){ return \"R$ \"+fmt(v,2); }\n\nfunction esc(s){\n  return String(s===undefined||s===null?\"\":s)\n    .replace(/&/g,\"&amp;\").replace(/<\/g,\"&lt;\").replace(/>/g,\"&gt;\")\n    .replace(/\"/g,\"&quot;\").replace(/'/g,\"&#39;\");\n}\n\nfunction validaCNPJ(c){\n  var s=String(c||\"\").replace(/\\D/g,\"\");\n  if(s.length!==14) return false;\n  if(/^(\\d)\\1{13}$/.test(s)) return false;\n  var t=[5,4,3,2,9,8,7,6,5,4,3,2], soma=0,i;\n  for(i=0;i<12;i++) soma+=+s[i]*t[i];\n  var r=soma%11, d1=r<2?0:11-r;\n  if(+s[12]!==d1) return false;\n  t=[6,5,4,3,2,9,8,7,6,5,4,3,2]; soma=0;\n  for(i=0;i<13;i++) soma+=+s[i]*t[i];\n  r=soma%11; var d2=r<2?0:11-r;\n  return +s[13]===d2;\n}\n\nfunction fmtCNPJ(c){\n  var s=String(c||\"\").replace(/\\D/g,\"\");\n  if(s.length!==14) return c||\"—\";\n  return s.slice(0,2)+\".\"+s.slice(2,5)+\".\"+s.slice(5,8)+\"/\"+s.slice(8,12)+\"-\"+s.slice(12);\n}\n\nfunction el(id){ return document.getElementById(id); }\nfunction val(id){ var e=el(id); return e?e.value:\"\"; }\nfunction setVal(id,v){ var e=el(id); if(e) e.value=(v===undefined||v===null)?\"\":v; }\n\nfunction toast(msg,tipo){\n  var c=el(\"toasts\"); if(!c) return;\n  var d=document.createElement(\"div\");\n  d.className=\"toast\"+(tipo?\" \"+tipo:\"\");\n  d.textContent=msg; c.appendChild(d);\n  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },4200);\n}\n\nfunction invalido(idCampo,cond){\n  var e=el(idCampo); if(!e) return cond;\n  var c=e.closest?e.closest(\".campo\"):null;\n  if(c) c.className = cond?\"campo invalido\":\"campo\";\n  return cond;\n}\n\nfunction tipoNome(id){\n  for(var i=0;i<TIPOS.length;i++) if(TIPOS[i].id===id) return TIPOS[i].nome;\n  return id||\"—\";\n}\n\nfunction eq(id){\n  for(var i=0;i<S.equipamentos.length;i++) if(S.equipamentos[i].id===id) return S.equipamentos[i];\n  return null;\n}\n\nfunction eqTag(id){\n  if(!id) return \"Edificação\";\n  var e=eq(id); return e?(e.tag+(e.arquivado?\" [arquivado]\":\"\")):\"Equipamento não localizado\";\n}\n\nfunction ativ(id){\n  for(var i=0;i<CATALOGO.length;i++) if(CATALOGO[i].id===id) return CATALOGO[i];\n  return null;\n}\n\nfunction periodicidadeTexto(d){\n  if(d<=7) return \"Semanal\";\n  if(d<=15) return \"Quinzenal\";\n  if(d<=31) return \"Mensal\";\n  if(d<=93) return \"Trimestral\";\n  if(d<=186) return \"Semestral\";\n  if(d<=370) return \"Anual\";\n  return Math.round(d/365)+\" anos\";\n}\n\nfunction aplicavel(a,tipo){\n  if(a.tipos= oId); }\nfunction chaveEsperada(a,e){ return (a.unica?\"edificacao|edificacao\":\"equipamento|\"+e.id)+\"|\"+a.id; }\nfunction ultimaConclusao(atividadeId,escopo,equipamentoId){\n  var base=\"\";\n  S.tarefas.forEach(function(t){\n    if(!t.conclusao||t.cancelada||t.arquivado||t.atividadeId!==atividadeId||escopoTarefa(t)!==escopo) return;\n    if(escopo===\"equipamento\"&&t.equipamentoId!==equipamentoId) return;\n    if(!base||t.conclusao>base) base=t.conclusao;\n  });\n  return base;\n}\nfunction prazoEsperado(a,e,ref,existente){\n  var d=diasAtividade(a), esc=a.unica?\"edificacao\":\"equipamento\";\n  var base=ultimaConclusao(a.id,esc,e?e.id:\"\");\n  if(!base&&e) base=e.ultimaManutencao||\"\";\n  if(base) return somaDias(base,d);\n  if(existente&&existente.periodicidade===d&&existente.prazo) return existente.prazo;\n  return somaDias(ref,Math.min(d,30));\n}\nfunction novaTarefa(a,e,ref){\n  return {id:uid(\"tf\"),equipamentoId:a.unica?\"\":e.id,escopo:a.unica?\"edificacao\":\"equipamento\",\n    atividadeId:a.id,prazo:prazoEsperado(a,e,ref,null),periodicidade:diasAtividade(a),conclusao:null,\n    executante:\"\",observacoes:\"\",criadaEm:ref,cancelada:false,arquivado:false,checklist:[]};\n}\nfunction cancelarTarefa(t,motivo,ref){\n  if(t.conclusao||t.cancelada) return false;\n  t.cancelada=true; t.canceladaEm=ref; t.motivoCancelamento=motivo;\n  auditar(\"Cancelamento por reconciliação\",\"tarefa\",t.id,tarefaAlvo(t)+\" — \"+(ativ(t.atividadeId)?ativ(t.atividadeId).nome:t.atividadeId)+\" — \"+motivo);\n  return true;\n}\nfunction reconciliarPlano(opcoes){\n  opcoes=opcoes||{};\n  var ref=dISO(hoje()), ativas=equipamentosAtivos(), esperadas={}, resumo={criadas:0,reprogramadas:0,canceladas:0,duplicadas:0,mantidas:0,totalAtivas:0};\n  CATALOGO.forEach(function(a){\n    if(a.unica){ if(ativas.length) esperadas[chaveEsperada(a,null)]={a:a,e:null}; return; }\n    ativas.forEach(function(e){ if(aplicavel(a,e.tipo)) esperadas[chaveEsperada(a,e)]={a:a,e:e}; });\n  });\n\n  var grupos={};\n  S.tarefas.forEach(function(t){\n    if(t.conclusao||t.cancelada||t.arquivado) return;\n    var k=tarefaChave(t); (grupos[k]=grupos[k]||[]).push(t);\n  });\n  Object.keys(grupos).forEach(function(k){\n    grupos[k].sort(function(a,b){ return a.prazo<b.prazo?-1:1; });\n    for(var i=1;i<grupos[k].length;i++) if(cancelarTarefa(grupos[k][i],\"Tarefa pendente duplicada\",ref)){ resumo.canceladas++; resumo.duplicadas++; }\n    grupos[k]=[grupos[k][0]];\n  });\n\n  Object.keys(grupos).forEach(function(k){\n    if(!esperadas[k]&&cancelarTarefa(grupos[k][0],\"Atividade deixou de ser aplicável ao escopo atual\",ref)) resumo.canceladas++;\n  });\n\n  Object.keys(esperadas).forEach(function(k){\n    var ex=esperadas[k], atual=grupos[k]&&grupos[k][0];\n    if(atual&&!atual.cancelada){\n      var novoPer=diasAtividade(ex.a), novoPrazo=prazoEsperado(ex.a,ex.e,ref,atual), mudou=false;\n      if(atual.periodicidade!==novoPer){ atual.periodicidade=novoPer; mudou=true; }\n      if(atual.prazo!==novoPrazo){ atual.prazo=novoPrazo; mudou=true; }\n      atual.escopo=ex.a.unica?\"edificacao\":\"equipamento\"; atual.equipamentoId=ex.a.unica?\"\":ex.e.id;\n      if(mudou){ resumo.reprogramadas++; auditar(\"Reprogramação\",\"tarefa\",atual.id,\"Novo prazo \"+dBR(novoPrazo)+\" · \"+periodicidadeTexto(novoPer)); }\n      else resumo.mantidas++;\n    }else{\n      S.tarefas.push(novaTarefa(ex.a,ex.e,ref)); resumo.criadas++;\n    }\n  });\n  resumo.totalAtivas=S.tarefas.filter(function(t){ return !t.conclusao&&!t.cancelada&&!t.arquivado; }).length;\n  S.config.planoGerado=ref; S.config.ultimaReconciliacao=new Date().toISOString(); S.config.ultimoResumoReconciliacao=resumo; S.config.planoDesatualizado=false;\n  if(!opcoes.silencioso) auditar(\"Reconciliação do plano\",\"plano\",\"\",(opcoes.origem||\"ação manual\")+\": \"+resumo.criadas+\" criadas, \"+resumo.reprogramadas+\" reprogramadas, \"+resumo.canceladas+\" canceladas\");\n  return resumo;\n}\nfunction gerarPlano(){ return reconciliarPlano({origem:\"geração/atualização manual\"}); }\n\nfunction concluirTarefa(id,data,resp,obs,naoConforme,detalhes){\n  var t=S.tarefas.find(function(x){ return x.id===id; }); if(!t||t.conclusao||t.cancelada) return null;\n  detalhes=detalhes||{};\n  t.conclusao=data; t.executante=resp; t.observacoes=obs||\"\"; t.checklist=Array.isArray(detalhes.checklist)?detalhes.checklist:[];\n  t.duracaoMin=num(detalhes.duracaoMin); t.leiturasAntes=detalhes.leiturasAntes||\"\"; t.leiturasDepois=detalhes.leiturasDepois||\"\";\n  t.materiais=detalhes.materiais||\"\"; t.epiConfirmado=!!detalhes.epiConfirmado; t.bloqueioConfirmado=!!detalhes.bloqueioConfirmado;\n  var ncs=t.checklist.filter(function(c){ return c.resultado===\"NC\"; });\n  t.resultadoExecucao=(naoConforme||ncs.length)?\"Não conforme\":\"Conforme\";\n  var e=eq(t.equipamentoId); if(e&&(!e.ultimaManutencao||data>e.ultimaManutencao)) e.ultimaManutencao=data;\n  auditar(\"Conclusão de tarefa\",\"tarefa\",t.id,tarefaAlvo(t)+\" — \"+t.resultadoExecucao+\" — prazo \"+dBR(t.prazo)+\", executada em \"+dBR(data));\n  var os=null;\n  if(naoConforme||ncs.length){\n    var a=ativ(t.atividadeId), itens=ncs.map(function(c){ return c.item; }).join(\"; \");\n    os=criarOS({equipamentoId:t.equipamentoId||((equipamentosAtivos()[0]||{}).id||\"\"),tipo:\"Corretiva\",prioridade:\"Alta\",abertura:data,\n      descricao:\"Não conformidade constatada na atividade: \"+(a?a.nome:t.atividadeId)+(itens?\" — Itens: \"+itens:\"\")+(obs?\" — \"+obs:\"\"),responsavel:resp});\n  }\n  var rec=reconciliarPlano({origem:\"conclusão da tarefa\",silencioso:true});\n  var chave=tarefaChave(t), prox=S.tarefas.filter(function(x){ return !x.conclusao&&!x.cancelada&&!x.arquivado&&tarefaChave(x)===chave; }).sort(function(a,b){ return a.prazo<b.prazo?-1:1; })[0]||null;\n  return {proxima:prox,os:os,reconciliacao:rec};\n}\n\nfunction criarOS(o){\n  o=o||{}; var n=S.config.seqOs||1, abertura=o.abertura||dISO(hoje()), situacao=o.situacao||\"Aberta\", c
