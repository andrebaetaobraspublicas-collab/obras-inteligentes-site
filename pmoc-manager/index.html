  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"pt-BR\" data-tema=\"claro\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>PMOC Manager v2.2 — Interface ampliada e Manual do Sistema<\/title>\n<style>\n:root{\n  --bg:#f4f6f8; --surf:#ffffff; --surf2:#eef1f4; --bd:#d7dde3; --bd2:#c2cad2;\n  --tx:#16202b; --tx2:#5b6b7b; --tx3:#8593a1;\n  --pri:#0d5ca8; --pri-bg:#e4eefb; --pri-tx:#0a4680;\n  --ok:#1c7a4a; --ok-bg:#e2f3ea;\n  --wa:#96620a; --wa-bg:#fdf1da;\n  --er:#b02a2a; --er-bg:#fbe7e7;\n  --nt:#5b6b7b; --nt-bg:#e9edf1;\n  --sh:0 1px 2px rgba(16,32,48,.06),0 2px 8px rgba(16,32,48,.05);\n  --r:8px; --mono:ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n}\nhtml[data-tema=\"escuro\"]{\n  --bg:#11161c; --surf:#1a222b; --surf2:#222c37; --bd:#2e3a46; --bd2:#3d4c5a;\n  --tx:#e6ecf2; --tx2:#a3b1bf; --tx3:#7d8b99;\n  --pri:#57a5f0; --pri-bg:#15304d; --pri-tx:#9fcbf7;\n  --ok:#5cc98d; --ok-bg:#123326;\n  --wa:#e0a63c; --wa-bg:#3a2b0d;\n  --er:#f08585; --er-bg:#3d1717;\n  --nt:#a3b1bf; --nt-bg:#26313c;\n  --sh:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);\n  font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;\n  font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}\nh1,h2,h3,h4{margin:0 0 .5rem;font-weight:600;line-height:1.25}\nh1{font-size:1.15rem} h2{font-size:1.05rem} h3{font-size:.95rem} h4{font-size:.85rem}\np{margin:0 0 .6rem}\na{color:var(--pri)}\nsmall{font-size:.78rem;color:var(--tx2)}\nhr{border:0;border-top:1px solid var(--bd);margin:1rem 0}\n\n/* ---------- topo ---------- */\nheader{position:sticky;top:0;z-index:40;background:var(--surf);\n  border-bottom:1px solid var(--bd);box-shadow:var(--sh)}\n.topo{display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem;flex-wrap:wrap}\n.marca{display:flex;align-items:center;gap:.55rem;font-weight:700;letter-spacing:-.2px}\n.marca .sig{background:var(--pri);color:#fff;border-radius:6px;padding:.25rem .45rem;\n  font-size:.72rem;letter-spacing:.5px}\nhtml[data-tema=\"escuro\"] .marca .sig{color:#0d1218}\n.topo .esp{flex:1}\n.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .5rem;border-radius:999px;\n  font-size:.72rem;font-weight:600;background:var(--nt-bg);color:var(--nt);white-space:nowrap}\n.chip.ok{background:var(--ok-bg);color:var(--ok)}\n.chip.wa{background:var(--wa-bg);color:var(--wa)}\n.chip.er{background:var(--er-bg);color:var(--er)}\n.chip.pri{background:var(--pri-bg);color:var(--pri-tx)}\n\nnav.abas{display:flex;gap:.15rem;padding:0 .6rem;overflow-x:auto;background:var(--surf);\n  border-bottom:1px solid var(--bd);scrollbar-width:thin}\nnav.abas button{background:none;border:0;border-bottom:2px solid transparent;\n  padding:.55rem .7rem;font-size:.82rem;font-weight:600;color:var(--tx2);cursor:pointer;\n  white-space:nowrap;font-family:inherit}\nnav.abas button:hover{color:var(--tx)}\nnav.abas button[aria-selected=\"true\"]{color:var(--pri);border-bottom-color:var(--pri)}\n\nmain{max-width:1180px;margin:0 auto;padding:1rem}\nsection[role=\"tabpanel\"]{display:none}\nsection[role=\"tabpanel\"].ativo{display:block}\n\n/* ---------- cartões ---------- */\n.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);\n  padding:1rem;margin-bottom:1rem;box-shadow:var(--sh)}\n.card>h2,.card>h3{margin-top:0}\n.grade{display:grid;gap:1rem}\n.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}\n.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}\n.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}\n.kpi{background:var(--surf2);border-radius:var(--r);padding:.8rem;border:1px solid var(--bd)}\n.kpi .rot{font-size:.72rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px;font-weight:600}\n.kpi .val{font-size:1.6rem;font-weight:700;line-height:1.2;margin-top:.15rem}\n.kpi .sub{font-size:.75rem;color:var(--tx3)}\n\n/* ---------- formulários ---------- */\nlabel{display:block;font-size:.76rem;font-weight:600;color:var(--tx2);margin-bottom:.2rem}\ninput,select,textarea{width:100%;padding:.45rem .55rem;border:1px solid var(--bd2);\n  border-radius:6px;background:var(--surf);color:var(--tx);font-family:inherit;font-size:.85rem}\ninput:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:var(--pri)}\ninput[type=checkbox]{width:auto;accent-color:var(--pri)}\ntextarea{resize:vertical;min-height:64px}\nfieldset{border:1px solid var(--bd);border-radius:var(--r);padding:.8rem;margin:0 0 1rem}\nlegend{font-size:.78rem;font-weight:700;color:var(--tx2);padding:0 .35rem}\n.campo{margin-bottom:.7rem}\n.erro{color:var(--er);font-size:.74rem;margin-top:.15rem;display:none}\n.campo.invalido input,.campo.invalido select,.campo.invalido textarea{border-color:var(--er)}\n.campo.invalido .erro{display:block}\n\nbutton,.btn{font-family:inherit;font-size:.82rem;font-weight:600;padding:.45rem .8rem;\n  border-radius:6px;border:1px solid var(--bd2);background:var(--surf);color:var(--tx);cursor:pointer}\nbutton:hover{background:var(--surf2)}\nbutton.pri{background:var(--pri);border-color:var(--pri);color:#fff}\nhtml[data-tema=\"escuro\"] button.pri{color:#0d1218}\nbutton.pri:hover{filter:brightness(1.08)}\nbutton.per{color:var(--er);border-color:var(--bd2)}\nbutton.mini{padding:.2rem .45rem;font-size:.74rem}\nbutton:disabled{opacity:.45;cursor:not-allowed}\n.acoes{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}\n\n/* ---------- tabelas ---------- */\n.tabwrap{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:var(--surf)}\ntable{width:100%;border-collapse:collapse;font-size:.82rem}\nth,td{padding:.45rem .6rem;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}\nth{background:var(--surf2);font-size:.72rem;text-transform:uppercase;letter-spacing:.3px;\n  color:var(--tx2);position:sticky;top:0;white-space:nowrap}\ntbody tr:hover{background:var(--surf2)}\ntbody tr:last-child td{border-bottom:0}\ntd.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.78rem}\n.vazio{padding:1.4rem;text-align:center;color:var(--tx3);font-size:.85rem}\n\n/* ---------- modal ---------- */\n.modal{position:fixed;inset:0;z-index:90;background:rgba(10,18,26,.55);\n  display:none;align-items:flex-start;justify-content:center;padding:1rem;overflow-y:auto}\n.modal.aberto{display:flex}\n.modal .cx{background:var(--surf);border-radius:12px;border:1px solid var(--bd);\n  width:100%;max-width:660px;padding:1.1rem;margin:auto 0;box-shadow:0 12px 40px rgba(0,0,0,.35)}\n.modal .cab{display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem}\n.modal .cab h3{margin:0;flex:1}\n\n/* ---------- diversos ---------- */\n.barra{height:8px;border-radius:4px;background:var(--surf2);overflow:hidden;border:1px solid var(--bd)}\n.barra>i{display:block;height:100%;background:var(--pri)}\n.barra>i.ok{background:var(--ok)} .barra>i.wa{background:var(--wa)} .barra>i.er{background:var(--er)}\n.lista-alerta{list-style:none;margin:0;padding:0}\n.lista-alerta li{padding:.5rem .6rem;border-left:3px solid var(--bd2);background:var(--surf2);\n  border-radius:0 6px 6px 0;margin-bottom:.4rem;font-size:.82rem}\n.lista-alerta li.er{border-left-color:var(--er)} .lista-alerta li.wa{border-left-color:var(--wa)}\n.lista-alerta li.ok{border-left-color:var(--ok)}\n.nota{background:var(--pri-bg);color:var(--pri-tx);border-radius:var(--r);padding:.6rem .7rem;\n  font-size:.79rem;border:1px solid var(--bd)}\n.toasts{position:fixed;right:1rem;bottom:1rem;z-index:120;display:flex;flex-direction:column;gap:.4rem}\n.toast{background:var(--surf);border:1px solid var(--bd);border-left:4px solid var(--pri);\n  border-radius:6px;padding:.55rem .8rem;font-size:.82rem;box-shadow:var(--sh);max-width:320px}\n.toast.ok{border-left-color:var(--ok)} .toast.er{border-left-color:var(--er)} .toast.wa{border-left-color:var(--wa)}\n.filtros{display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:.8rem}\n.filtros .campo{margin:0;min-width:150px;flex:1}\n.tag{display:inline-block;padding:.1rem .4rem;border-radius:4px;font-size:.7rem;font-weight:600;\n  background:var(--nt-bg);color:var(--nt)}\n.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}\n.cal .dh{font-size:.68rem;text-align:center;color:var(--tx2);font-weight:700;padding:.2rem 0}\n.cal .d{min-height:52px;border:1px solid var(--bd);border-radius:5px;padding:.2rem .25rem;\n  background:var(--surf);font-size:.7rem}\n.cal .d.fora{opacity:.35}\n.cal .d.hoje{outline:2px solid var(--pri);outline-offset:-2px}\n.cal .d .n{font-weight:700;font-size:.72rem}\n.cal .pts{display:flex;gap:2px;flex-wrap:wrap;margin-top:.15rem}\n.cal .pt{width:7px;height:7px;border-radius:50%;background:var(--nt)}\n.cal .pt.er{background:var(--er)} .cal .pt.wa{background:var(--wa)} .cal .pt.ok{background:var(--ok)}\nsvg.graf{width:100%;height:auto;display:block}\ncode{font-family:var(--mono);font-size:.78rem;background:var(--surf2);padding:.05rem .25rem;border-radius:4px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n\n/* ---------- relatório / impressão ---------- */\n#rel-doc{background:#fff;color:#111;padding:18mm 14mm;font-size:11pt;line-height:1.45;\n  font-family:Arial,Helvetica,sans-serif;border:1px solid var(--bd);border-radius:4px}\n#rel-doc h1{font-size:15pt;text-align:center;margin-bottom:.2rem}\n#rel-doc h2{font-size:12pt;border-bottom:1.2pt solid #111;margin:1.1rem 0 .5rem;padding-bottom:.15rem}\n#rel-doc table{font-size:9.5pt;color:#111}\n#rel-doc th{background:#e8e8e8;color:#111;position:static;border:1px solid #999}\n#rel-doc td{border:1px solid #999}\n#rel-doc .assin{margin-top:2.2rem;display:flex;gap:2rem;justify-content:space-around;text-align:center}\n#rel-doc .assin div{flex:1;border-top:1px solid #111;padding-top:.3rem;font-size:9.5pt}\n@media print{\n  header,nav.abas,.naoimp,.toasts{display:none!important}\n  body{background:#fff}\n  main{max-width:none;padding:0}\n  .card{border:0;box-shadow:none;padding:0;margin:0}\n  #rel-doc{border:0;border-radius:0;padding:0}\n  section[role=\"tabpanel\"]{display:none!important}\n  section[role=\"tabpanel\"].ativo{display:block!important}\n}\n@media(max-width:640px){\n  main{padding:.6rem}\n  .card{padding:.8rem}\n  .kpi .val{font-size:1.3rem}\n}\n\n\n/* ---------- integridade, checklists e anexos (v2.0) ---------- */\n.linha-arquivada{opacity:.58;background:var(--surf2)}\n.linha-cancelada{opacity:.62;text-decoration:none}\n.checklist-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);margin:.55rem 0 .8rem}\n.checklist-wrap table{min-width:760px}\n.checklist-wrap select,.checklist-wrap input{min-width:120px;font-size:.78rem;padding:.32rem .4rem}\n.checklist-wrap td:first-child{min-width:280px}\n.anexo-lista{display:flex;flex-direction:column;gap:.45rem;margin:.6rem 0}\n.anexo-item{display:flex;align-items:center;gap:.55rem;padding:.55rem .65rem;border:1px solid var(--bd);border-radius:7px;background:var(--surf2)}\n.anexo-item .info{flex:1;min-width:0}\n.anexo-item .nome{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.anexo-item .meta{font-size:.72rem;color:var(--tx2)}\n.audit-detalhe{max-width:460px;white-space:normal}\n.help-inline{font-size:.74rem;color:var(--tx2);margin-top:.2rem}\nfieldset.execucao{background:var(--surf2)}\n@media(max-width:760px){.audit-detalhe{max-width:260px}}\n\n<\/style>\n\n<script src=\"2ee60069-3300-4cd3-8e63-4c6a1a7038d1\"><\/script>\n<style id=\"splash-css\">\n#splash{position:fixed;inset:0;z-index:100000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#eef4fb;background:radial-gradient(120% 90% at 70% 15%,#12213a 0%,#0a1424 45%,#060b14 100%);transition:opacity .7s ease}\n#splash.oculto{opacity:0;pointer-events:none}\n#splash canvas{position:absolute;inset:0;width:100%;height:100%;display:block}\n#splash .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 120% at 50% 42%,transparent 55%,rgba(4,8,14,.55) 100%)}\n#splash .marca{position:absolute;left:0;right:0;bottom:14%;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;padding:0 24px}\n#splash .marca .top{display:flex;align-items:center;gap:12px;opacity:0;animation:spBrandIn .9s .4s cubic-bezier(.2,.7,.2,1) both}\n#splash .marca .sig{background:linear-gradient(180deg,#2a86e6,#0d5ca8);color:#fff;border-radius:9px;padding:8px 12px;font-size:14px;font-weight:800;letter-spacing:1.5px;box-shadow:0 8px 30px rgba(20,110,210,.5)}\n#splash .marca .nm{font-size:30px;font-weight:700;letter-spacing:-.5px}\n#splash .marca .ln{height:2px;width:200px;margin:18px 0 14px;background:linear-gradient(90deg,transparent,#3f9bff,transparent);transform-origin:center;animation:spLine 1.1s .7s cubic-bezier(.2,.7,.2,1) both}\n#splash .marca .sub{font-size:13.5px;letter-spacing:.5px;color:#9fb6d0;max-width:520px;line-height:1.55;opacity:0;animation:spBrandIn 1s .95s cubic-bezier(.2,.7,.2,1) both}\n#splash .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}\n#splash .prog>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#0d5ca8,#4aa3ff);box-shadow:0 0 12px rgba(74,163,255,.7)}\n#splash .pular{position:absolute;top:22px;right:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#cfe0f2;font:600 12px/1 inherit;letter-spacing:.4px;padding:9px 16px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}\n#splash .legal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(6,11,20,.72);backdrop-filter:blur(8px)}\n#splash .legal.aberto{display:flex;animation:spFade .5s ease both}\n#splash .cx{width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;background:#0f1a2c;border:1px solid rgba(120,160,210,.22);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.6);overflow:hidden;animation:spLegalIn .55s cubic-bezier(.2,.7,.2,1) both}\n#splash .cx .cab{padding:22px 26px 16px;border-bottom:1px solid rgba(120,160,210,.15)}\n#splash .cx .cab .row{display:flex;align-items:center;gap:10px}\n#splash .cx .cab .sig{background:linear-gradient(180deg,#2a86e6,#0d5ca8);color:#fff;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:800;letter-spacing:1.2px}\n#splash .cx .cab h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.3px}\n#splash .cx .cab p{margin:10px 0 0;font-size:12.5px;color:#8fa6c2;line-height:1.5}\n#splash .cx .corpo{padding:18px 26px;overflow-y:auto;font-size:13px;line-height:1.62;color:#c4d3e6}\n#splash .cx .corpo p{margin:0 0 14px}\n#splash .cx .corpo strong{color:#eef4fb}\n#splash .cx .rod{padding:16px 26px;border-top:1px solid rgba(120,160,210,.15);background:rgba(255,255,255,.02)}\n#splash .cx .rod label{display:flex;gap:11px;align-items:flex-start;font-size:12.8px;color:#cddcee;cursor:pointer;margin-bottom:10px;font-weight:400}\n#splash .cx .rod label:last-of-type{margin-bottom:0}\n#splash .cx .rod input{margin-top:2px;width:17px;height:17px;accent-color:#2a86e6;flex:none}\n#splash .cx .rod .acao{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:18px}\n#splash .cx .rod .hint{font-size:11.5px;color:#7f95b2}\n#splash .cx .rod .btn{font:700 13.5px/1 inherit;letter-spacing:.3px;padding:12px 22px;border-radius:10px;border:0;background:rgba(255,255,255,.06);color:#5f748f;cursor:not-allowed;transition:filter .15s}\n#splash .cx .rod .btn.ok{background:linear-gradient(180deg,#2a86e6,#0d5ca8);color:#fff;box-shadow:0 10px 30px rgba(20,110,210,.45);cursor:pointer}\n#splash .cx .rod .btn.ok:hover{filter:brightness(1.08)}\n@keyframes spBrandIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}\n@keyframes spLine{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}\n@keyframes spLegalIn{0%{opacity:0;transform:translateY(18px) scale(.985)}100%{opacity:1;transform:translateY(0) scale(1)}}\n@keyframes spFade{0%{opacity:0}100%{opacity:1}}\n<\/style>\n\n\n<style id=\"visual-v22\">\n:root{\n  --sidebar-w:264px;\n  --content-pad-x:14px;\n  --content-pad-y:12px;\n  --sidebar-bg:#0b2b4d;\n  --sidebar-bg2:#071d34;\n  --sidebar-tx:#eaf3fb;\n  --sidebar-muted:#a9bfd2;\n  --sidebar-active:#ffffff;\n  --sidebar-accent:#55aaf5;\n}\nhtml{font-size:16px;scroll-behavior:smooth}\nbody{font-size:1rem;line-height:1.58;min-height:100vh;overflow-x:hidden}\nh1{font-size:1.5rem}h2{font-size:1.27rem}h3{font-size:1.08rem}h4{font-size:.96rem}\np{margin-bottom:.75rem}small{font-size:.86rem;line-height:1.5}\n\n/* Estrutura geral: menu vertical + barra de contexto */\n.app-sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);z-index:70;display:flex;flex-direction:column;\n  background:linear-gradient(180deg,var(--sidebar-bg) 0%,var(--sidebar-bg2) 100%);color:var(--sidebar-tx);\n  box-shadow:8px 0 24px rgba(8,27,47,.13);transition:width .22s ease,transform .24s ease}\n.sidebar-brand{padding:1.15rem 1rem 1rem;border-bottom:1px solid rgba(255,255,255,.12)}\n.sidebar-brand .marca{gap:.7rem;color:#fff;font-size:1.06rem;white-space:nowrap}\n.sidebar-brand .marca .sig{font-size:.78rem;padding:.34rem .52rem;background:linear-gradient(180deg,#2487e6,#0d5ca8);box-shadow:0 6px 18px rgba(0,0,0,.22)}\n.sidebar-brand .brand-name{font-size:1.13rem}.sidebar-brand .brand-name small{font-size:.74rem;color:#bcd0e1!important;margin-left:.2rem}\n.sidebar-subtitle{margin-top:.58rem;color:var(--sidebar-muted);font-size:.78rem;line-height:1.4;max-width:210px}\nnav.abas{display:flex;flex:1;min-height:0;flex-direction:column;gap:.22rem;padding:.72rem .65rem .9rem;overflow-x:hidden;overflow-y:auto;\n  background:transparent;border:0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}\nnav.abas button{display:flex;align-items:center;gap:.72rem;width:100% anutenção, Operação e Controle de sistemas de climatização, nos termos da Lei nº 13.589/2018 e regulamentação sanitária aplicável. Os relatórios, cronogramas e indicadores gerados têm caráter auxiliar e <strong>não substituem<\/strong> a avaliação técnica de responsável habilitado nem o parecer de autoridade sanitária.<\/p>\n        <p><strong>2. Responsabilidade técnica.<\/strong> A execução das atividades de manutenção, higienização e controle da qualidade do ar interior é de responsabilidade do profissional legalmente habilitado (com ART/RRT quando exigível) e do responsável pela edificação. O usuário é o único responsável pela veracidade, atualização e conformidade dos dados inseridos.<\/p>\n        <p><strong>3. Isenção de garantias.<\/strong> O sistema é fornecido \"no estado em que se encontra\". Não se garante ausência de erros, disponibilidade ininterrupta ou adequação a finalidade específica. Em nenhuma hipótese os fornecedores responderão por danos indiretos, lucros cessantes ou decisões tomadas com base exclusiva nas informações do sistema.<\/p>\n        <p style=\"margin-bottom:4px\"><strong>4. Proteção de dados (LGPD).<\/strong> Os dados são tratados conforme a Lei nº 13.709/2018, exclusivamente para as finalidades de gestão do PMOC. Cabe ao usuário obter as bases legais necessárias para o tratamento de dados de terceiros por ele inseridos.<\/p>\n      <\/div>\n      <div class=\"rod\">\n        <label><input type=\"checkbox\" data-k=\"uso\"><span>Li e concordo com os <strong>termos de uso<\/strong> e com as condições de responsabilidade técnica descritas acima.<\/span><\/label>\n        <label><input type=\"checkbox\" data-k=\"dados\"><span>Reconheço que os dados inseridos são de minha responsabilidade e concordo com o tratamento conforme a <strong>LGPD<\/strong>.<\/span><\/label>\n        <label><input type=\"checkbox\" data-k=\"aux\"><span>Compreendo que o sistema tem <strong>caráter auxiliar<\/strong> e não substitui laudo, ART/RRT ou parecer de autoridade competente.<\/span><\/label>\n        <div class=\"acao\"><span class=\"hint\" id=\"sp-hint\">Marque as três opções para continuar<\/span><button class=\"btn\" id=\"sp-entrar\" type=\"button\">Concordar e entrar<\/button><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<aside class=\"app-sidebar\" id=\"app-sidebar\" aria-label=\"Navegação principal\">\n  <div class=\"sidebar-brand\">\n    <div class=\"marca\"><span class=\"sig\">PMOC<\/span><span class=\"brand-name\">Manager <small>v2.2<\/small><\/span><\/div>\n    <div class=\"sidebar-subtitle\">Gestão institucional, manutenção e qualidade do ar<\/div>\n  <\/div>\n  <nav class=\"abas\" role=\"tablist\" id=\"abas\" aria-label=\"Módulos do sistema\">\n    <button role=\"tab\" data-p=\"painel\" aria-selected=\"true\">Painel<\/button>\n    <button role=\"tab\" data-p=\"edificacao\">Edificação e RT<\/button>\n    <button role=\"tab\" data-p=\"equipamentos\">Equipamentos<\/button>\n    <button role=\"tab\" data-p=\"plano\">Plano e cronograma<\/button>\n    <button role=\"tab\" data-p=\"os\">Ordens de serviço<\/button>\n    <button role=\"tab\" data-p=\"qai\">Qualidade do ar<\/button>\n    <button role=\"tab\" data-p=\"energia\">Energia<\/button>\n    <button role=\"tab\" data-p=\"pecas\">Peças e custos<\/button>\n    <button role=\"tab\" data-p=\"triagem\">Triagem inteligente<\/button>\n    <button role=\"tab\" data-p=\"relatorio\">Relatório PMOC<\/button>\n    <button role=\"tab\" data-p=\"ajuda\">Base legal<\/button>\n    <button role=\"tab\" data-p=\"manual\">Manual do sistema<\/button>\n  <\/nav>\n  <div class=\"sidebar-footer\">\n    <button type=\"button\" id=\"bt-recolher-menu\" class=\"sidebar-collapse\" title=\"Recolher ou expandir o menu\">\n      <span class=\"collapse-symbol\" aria-hidden=\"true\">‹<\/span><span class=\"collapse-label\">Recolher menu<\/span>\n    <\/button>\n    <div class=\"sidebar-offline\"><span aria-hidden=\"true\">●<\/span> Aplicação offline<\/div>\n  <\/div>\n<\/aside  id=\"e-nome\" required=\"\"><div class=\"erro\">Informe o nome.<\/div><\/div>\n        <div class=\"campo\"><label for=\"e-cnpj\">CNPJ<\/label><input id=\"e-cnpj\" placeholder=\"00.000.000/0000-00\">\n          <div class=\"erro\">CNPJ inválido.<\/div><\/div>\n      <\/div>\n      <div class=\"grade g2\">\n        <div class=\"campo\"><label for=\"e-end\">Endereço<\/label><input id=\"e-end\"><\/div>\n        <div class=\"campo\"><label for=\"e-cid\">Município / UF<\/label><input id=\"e-cid\"><\/div>\n      <\/div>\n      <div class=\"grade g3\">\n        <div class=\"campo\"><label for=\"e-tipo\">Tipo de ocupação *<\/label>\n          <select id=\"e-tipo\">\n            <option value=\"escritorio\">Escritório / administrativo<\/option>\n            <option value=\"saude\">Estabelecimento de saúde<\/option>\n            <option value=\"hotel\">Hotel / hospedagem<\/option>\n            <option value=\"ensino\">Ensino<\/option>\n            <option value=\"comercio\">Comércio / shopping<\/option>\n            <option value=\"residencial\">Condomínio residencial<\/option>\n            <option value=\"industrial\">Industrial / laboratório<\/option>\n          <\/select><\/div>\n        <div class=\"campo\"><label for=\"e-area\">Área climatizada (m²)<\/label><input id=\"e-area\" type=\"number\" min=\"0\" step=\"1\"><\/div>\n        <div class=\"campo\"><label for=\"e-ocup\">Ocupação média (pessoas)<\/label><input id=\"e-ocup\" type=\"number\" min=\"0\" step=\"1\"><\/div>\n      <\/div>\n      <fieldset>\n        <legend>Responsável técnico (Lei 13.589/2018, art. 2º)<\/legend>\n        <div class=\"grade g2\">\n          <div class=\"campo\"><label for=\"e-rt-nome\">Nome do RT *<\/label><input id=\"e-rt-nome\"><div class=\"erro\">Informe o RT.<\/div><\/div>\n          <div class=\"campo\"><label for=\"e-rt-reg\">Registro profissional (CREA/CAU/CRM)<\/label><input id=\"e-rt-reg\"><\/div>\n        <\/div>\n        <div class=\"grade g3\">\n          <div class=\"campo\"><la
