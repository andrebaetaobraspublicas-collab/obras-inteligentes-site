function tuningTimeline(h=harmonicResult()){const families=[...new Map(h.stageResults.filter(x=>x.fr).map(x=>[x.fr.toFixed(1),x])).values()],W=860,base=75+families.length*18,H=base+85,x0=48,x1=W-80,max=Math.max(15,...families.map(x=>Math.ceil(x.frMax/project.installation.freq)+1)),fx=x=>x0+(x-1)/(max-1)*(x1-x0),f=project.installation.freq;let svg=`<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frequências LC e harmônicas" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="white"/><path d="M${x0} ${base}H${x1}" stroke="#ccdce4" stroke-width="3"/>`;for(const k of [1,3,5,7,9,11,13,15])svg+=`<path d="M${fx(k)} ${base-5}v15" stroke="#839ba9"/><text x="${fx(k)}" y="${base+30}" text-anchor="middle" fill="#53768a" font-size="12">h${k}</text><text x="${fx(k)}" y="${base+50}" text-anchor="middle" fill="#8299a7" font-size="10">${n(k*f,0)} Hz</text>`;families.forEach((st,i)=>{const y=30+i*18,lo=Math.max(1,st.frMin/f),hi=Math.min(max,st.frMax/f),x=fx(st.fr/f);svg+=`<rect x="${fx(lo)}" y="${y+3}" width="${Math.max(1,fx(hi)-fx(lo))}" height="${base-y-3}" rx="4" fill="#27b0aa" opacity=".10"/><path d="M${x} ${y+8}V${base}" stroke="#008b90" stroke-width="1.5"/><text x="${x+7}" y="${y}" fill="#047b83" font-size="12">LC: ${n(st.fr,1)} Hz</text>`;});svg+=`<text x="${x0}" y="${H-7}" font-size="10" fill="#7992a0">Faixa sombreada: extremos de tolerância de L e C. Não é a ressonância paralela da rede.</text></svg>`;return svg;}

let temporalJob=null,temporalCompareJob=null,tpPosition=0,tpRate=600,tpZoom=0,tpFrame=null,tpLastFrame=0,tpLastPaint=0,tpLogPage=0,tpLogType='all',tpLogStage='all',tpProfilePage=0;

function tpClock(t,start=0,decimals=0){const seconds=Math.round(Math.max(0,t+start*3600)*10**decimals)/10**decimals,day=Math.floor(seconds/86400),h=Math.floor(seconds/3600)%24,m=Math.floor(seconds/60)%60,s=seconds%60;return (day?'D+'+day+' ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+s.toFixed(decimals).padStart(decimals?3+decimals:2,'0');}

function tpRange(r){if(!tpZoom||tpZoom>=r.duration)return [0,r.duration];const start=Math.max(0,Math.min(r.duration-tpZoom,tpPosition-tpZoom/2));return [start,start+tpZoom];}
function tpPlot(r,type,full=false){const range=full?[0,r.duration]:tpRange(r),all=r.spans.filter(s=>s.t1>=range[0]&&s.t0<=range[1]),stride=Math.max(1,Math.ceil(all.length/1600));let spans=all.filter((s,i)=>i%stride===0||i===all.length-1);
 const points=key=>spans.flatMap(s=>[[Math.max(s.t0,range[0]),s[key]],[Math.min(s.t1,range[1]),s[key]]]);
 let series=[],options={height:235,xmin:range[0],xmax:range[1],xlabels:x=>tpClock(x,r.startHour),xTitle:'Horário do perfil · '+(stride>1?'desenho reduzido; eventos exportados integralmente':'patamares constantes entre eventos')};

function tpStop(){if(tpFrame!==null)cancelAnimationFrame(tpFrame);tpFrame=null;tpLastFrame=0;const b=$('#tpPlayButton');if(b)b.innerHTML=icon('play')+' Reproduzir';}
function tpSeekTo(value){if(!tpFresh())return;tpPosition=Math.max(0,Math.min(temporalJob.value.duration,value));tpPaint();}
function tpPaint(){if(!tpFresh()||page!=='controller')return;const r=temporalJob.value,s=TemporalEngine.at(r,tpPosition),write=(id,html)=>{const e=$('#'+id);if(e)e.innerHTML=html;};
 write('tpFP',n(s.fp,3));write('tpNature',s.netQ< -1e-7?'CAPACITIVO':'INDUTIVO / UNITÁRIO');write('tpTime',tpClock(tpPosition,r.startHour,1));write('tpStatus',esc(s.status));write('tpP',n(s.P,1)+' <small>kW</small>');write('tpQ',n(s.qc,1)+' <small>kvar</small>');write('tpI',n(s.I,1)+' <small>A</small>');write('tpTrue',n(s.fpTrue,3));write('tpTimeSmall',tpClock(tpPosition,r.startHour)+' / '+tpClock(r.duration,r.startHour));
 write('tpPending',s.pending?'Atraso remanescente: '+n(Math.max(0,s.requestSince+s.delay-tpPosition),1)+' s':'Sem pedido de manobra');write('tpStageLeds',tpLedsMarkup(r,s));
 const seek=$('#tpSeek');if(seek)seek.value=tpPosition;
 const previousCursor=$('#tpGanttCursor');if(tpZoom&&previousCursor&&(tpPosition<+previousCursor.dataset.start||tpPosition>+previousCursor.dataset.end))$('#tpCharts').innerHTML=tpChartsMarkup(r);
 const cursor=$('#tpGanttCursor');if(cursor){const a=+cursor.dataset.start,b=+cursor.dataset.end,x=68+(Math.max(a,Math.min(b,tpPosition))-a)/(b-a)*814;cursor.setAttribute('x1',x);cursor.setAttribute('x2',x);}
 if($('#tpLiveDiagram')?.dataset.mask!==String(s.mask)+':'+s.row+':'+Boolean(tpFrame)){$('#tpLiveDiagram').innerHTML=tpDiagram(r,s);$('#tpLiveDiagram').dataset.mask=String(s.mask)+':'+s.row+':'+Boolean(tpFrame);}
}
function tpPlay(){if(tpFrame!==null){tpStop();return;}const r=tpRequire();if(tpPosition>=r.duration)tpPosition=0;tpLastFrame=0;const tick=now=>{if(!tpFresh()||page!=='controller'){tpStop();return;}if(tpLastFrame)tpPosition=Math.min(r.duration,tpPosition+(now-tpLastFrame)/1000*tpRate);tpLastFrame=now;if(now-tpLastPaint>100){tpPaint();tpLastPaint=now;}if(tpPosition>=r.duration){tpPaint();tpStop();return;}tpFrame=requestAnimationFrame(tick);};tpFrame=requestAnimationFrame(tick);$('#tpPlayButton').innerHTML=icon('stop')+' Pausar';}
function tpUiChange(el){const type=el.dataset.tpUi;if(type==='speed'){tpRate=Number(el.value);return;}if(type==='zoom'){tpZoom=Number(el.value);tpStop();render();tpPaint();return;}if(type==='logtype'){tpLogType=el.value;tpLogPage=0;}if(type==='logstage'){tpLogStage=el.value;tpLogPage=0;}render();}

 {title:'2. Dados elétricos e condição de projeto',headers:['Parâmetro','Valor'],rows:[['Sistema',d.system==='tri'?'Trifásico equilibrado':d.system==='mono'?'Monofásico bifilar':'Bifásico, carga entre duas fases'],['Tensão / frequência',`${n(d.voltage,0)} V / ${n(d.freq,0)} Hz`],['Conjunto de entrada / tipo de FP',`${d.mode} / ${d.fpType}`],['Potência ativa',n(r.base.P,3)+' kW'],['Potência reativa fundamental',n(r.base.Q,3)+' kvar'],['cos φ inicial / objetivo',n(r.base.fp,4)+' / '+n(d.target,4)],['Potência aparente fundamental / total',n(r.base.S1,3)+' / '+n(r.base.S,3)+' kVA'],['FP verdadeiro inicial',n(r.base.fpTrue,4)],['THDi inicial / modelo de distorção',n(d.thdi,2)+'% / '+(d.includeHarm?'ativado':'desativado')],['Transformador / impedância',n(d.transformer,0)+' kVA / '+n(d.uk,2)+'%'],['Demanda contratada / medida',n(d.contract,1)+' / '+n(d.demand,1)+' kW'],['Local do banco',d.placement==='central'?'Quadro geral':d.placement==='sector'?'Setorial':'Junto à carga']]},
 {title:'3. Memória do dimensionamento',paragraphs:[`φ1 = arctan(Q/P) = ${n(r.base.phi,4)}°; φ2 = arccos(${n(d.target,4)}) = ${n(Math.acos(d.target)*180/Math.PI,4)}°.`,`Q alvo = P × tan(φ2) = ${n(r.base.P,3)} × ${n(CapEngine.tanfp(d.target),6)} = ${n(r.base.qtarget,3)} kvar.`,`Qc necessária = max(0, Q inicial − Q alvo) = max(0, ${n(r.base.Q,3)} − ${n(r.base.qtarget,3)}) = ${n(r.base.qreq,3)} kvar.`,`Qc instalada efetiva = ${n(r.installed,3)} kvar; Qc acionada no ponto de projeto = ${n(r.active,3)} kvar. Q líquido = ${n(r.after.Q,3)} kvar (${r.after.leading?'capacitivo':'indutivo ou nulo'}).`,`cos φ final = P / √[P² + (Q − Qc acionada)²] = ${n(r.after.fp,5)}. O valor preserva a indicação da natureza reativa.`,`D = S1,inicial × THDi/100 = ${n(r.base.D,3)} kVA no modelo ativado. S total,final = √(P² + Q líquido² + D²) = ${n(r.after.S,3)} kVA; FP verdadeiro final ≈ ${n(r.after.fpTrue,5)}.`,`I = S total × 1000 / (k × V), com k = ${d.system==='tri'?'√3':'1'}. Corrente inicial ${n(r.base.I,3)} A; final ${n(r.after.I,3)} A; redução ${n(r.currentReduction,3)}%. Capacidade liberada: ${n(r.capacity,3)} kVA.`,`No modelo de distorção, a corrente harmônica absoluta é mantida após a compensação. A hipótese pode falhar em caso de ressonância, THDv relevante ou alteração do comportamento das cargas.`]},
 {title:'4. Banco de capacitores e estágios',paragraphs:[`Modo: ${p.bank.type}. Tecnologia: ${p.bank.tech==='detuned'?'capacitores com reatores, p nominal '+n(p.bank.detune,2)+'%':'convencional'}. Ligação: ${d.system==='tri'?(p.bank.connection==='delta'?'triângulo':'estrela'):'dois condutores'}.`,`Potência de placa total: ${n(r.nominal,3)} kvar. Qef convencional = Qn × (V/Vn)² × (f/fn). Com reatores: dividir por (1 − p efetivo), sendo p efetivo = p nominal × (f/fn)². Os valores de placa se referem ao capacitor, não à potência líquida de um conjunto comercial com reator.`,`Histerese: ${n(p.bank.hysteresis,2)} kvar. Intervalo mínimo de decisão: ${p.bank.switchDelay} s. Bloqueio após desligamento: ${p.bank.discharge} s. ${p.bank.allowLeading?'O automático pode aceitar seleção capacitiva.':'O automático evita seleção capacitiva quando existe solução viável.'}`],headers:['Estágio','Placa kvar','Vn / fn','Efetivo kvar','Custo R$'],rows:p.stages.map((s,i)=>['E'+(i+1),n(s.qn,2),`${n(s.vn,0)} V / ${s.fn} Hz`,n(CapEngine.stagePower(s,d,p.bank),3),s.commercialPriceMissing?'A cotar':money(s.price)])},

 {title:'7. Premissas tarifárias, perdas e custos',headers:['Premissa','Valor'],rows:[['Enquadramento / FP de referência',p.tariff.group+' / '+n(p.tariff.reference,3)],['Distribuidora',p.tariff.distributor],['Referência tarifária ERE',money(p.tariff.reactiveRate)+'/MWh'],['Tarifa de energia ativa',money(e.energyRate)+'/kWh'],['Regra horária',p.tariff.window==='window'?`${p.tariff.capStart} h + ${p.tariff.capHours} h capacitivas; demais indutivas`:p.tariff.window],['Origem da cobrança reativa',e.billingMode==='bill'?'Fatura calibrada pelo perfil':'Modelo estimativo por perfil'],['Fatura ERE observada',money(e.actualReactive)],['Economia DRE informada externamente',money(e.confirmedDemandSaving)+'/mês'],['Modelo de perdas',e.lossMode==='resistance'?`Resistência por fase ${n(e.resistance,6)} Ω`:e.lossMode==='percent'?`${n(e.lossPercent,2)}% da potência ativa inicial`:'Sem perdas de alimentador'],['Trecho após a medição',e.meteredLosses?'Sim, monetizar perdas evitadas':'Não, não monetizar perdas evitadas'],['Perdas próprias do banco',n(e.bankWatts,3)+' W/kvar conectado'],['Custo dos equipamentos',money(ec.equipment)],['Instalação / manutenção anual',money(e.installCost)+' / '+money(e.maintenance)],['Horizonte / desconto',e.life+' anos / '+n(e.discount,2)+'% a.a.'],['Fonte / conferência',p.tariff.source+' · '+p.tariff.checkedDate]],paragraphs:['ERE estimada: Σ max[fR × √(P²+Q²) − P, 0] × Δt × VRERE / 1000, nas janelas e naturezas configuradas. O modelo usa potência em kW/kvar e tarifa em R$/MWh. Não é cálculo em R$/kvarh. A DRE não é calculada automaticamente.',`Fonte dos preços: ${e.costMode==='library'?'biblioteca de módulos + painel, com adicional de reatores quando aplicável':'valor global fornecido pelo usuário'}. Preços iniciais são ilustrativos; não constituem cotação.`, 'A economia não inclui redução automática da demanda contratada em kW, perdas fixas de transformador, retorno por capacidade liberada, receitas não informadas, inflação, tributos ou valor residual.']},
 {title:'8. Resultado econômico',headers:['Indicador','Resultado'],rows:[['ERE mensal antes / depois',money(ec.before)+' / '+money(ec.after)],['ERE mensal evitada',money(ec.reactiveSaving)],['Perdas do alimentador evitadas por mês',n(ec.lossKwh,3)+' kWh'],['Economia mensal nas perdas',money(ec.lossSaving)],['Consumo próprio do banco por mês',n(ec.bankKwh,3)+' kWh'],['Custo mensal do consumo próprio',money(ec.bankCost)],['Investimento total',money(ec.investment)],['Economia líquida mensal / anual',money(ec.monthlyNet)+' / '+money(ec.annualNet)],['Retorno simples',ec.costIncomplete?'Indisponível: custo incompleto':ec.payback===null?'Sem economia líquida positiva':n(ec.payback*12,3)+' meses'],['Retorno descontado',ec.costIncomplete?'Indisponível: custo incompleto':ec.discountedPayback===null?'Não ocorre no horizonte':n(ec.discountedPayback,3)+' anos'],['Valor presente líquido',money(ec.npv)]],paragraphs:['Perdas do alimentador: 3I²R em trifásico e 2I²R em circuito de dois condutores. No modelo percentual, as perdas posteriores são proporcionais ao quadrado da razão de correntes. Somente o trecho afetado pelo banco e incluído na medição pode gerar economia para o consumidor.','Fluxos anuais constantes, líquidos da manutenção. Retorno descontado interpolado entre fluxos anuais. A existência de VPL positivo não dispensa verificação técnica e comercial.']},
 {title:'9. Fluxo de caixa',headers:['Ano','Fluxo líquido','Acumulado simples','Acumulado descontado'],rows:ec.cash.map(x=>[x.year,money(x.flow),money(x.cum),money(x.dcum)])},
 {title:'10. Harmônicas, ressonância e proteção',paragraphs:[`THDv: ${n(p.harmonics.thdv,2)}%; THDi: ${n(d.thdi,2)}%; participação estimada de cargas não lineares: ${n(p.harmonics.nonlinear,1)}%.`,`Potência de curto-circuito considerada: ${n(h.Ssc/1000,3)} MVA (${h.approx?'estimada por Sn × 100 / uk%, desprezando impedância a montante':'informada pelo usuário'}). Ordem de ressonância convencional equivalente: ${h.order?n(h.order,3):'não calculada'}. Relação h ≈ √(Scc/Qc).`,`Foram analisados ${h.levels} patamares; ${new Set(h.matches.map(x=>x.q)).size} apresentam proximidade das ordens 3, 5, 7, 11 ou 13 na banda de ${n(p.harmonics.band,1)}%. Com reatores, essa triagem convencional é apenas comparativa e não descreve a rede LC completa.`,`Corrente de pré-seleção: ${n(pr.I,2)} A, utilizando multiplicador ${n(p.protection.factor,3)}. Calibre genérico candidato: ${pr.rating?n(pr.rating,0)+' A':'a definir'}. Ampacidade ${pr.cable?pr.runs+' × '+n(pr.cable[0],0)+' mm² por fase':'não atendida pela tabela informada'}, sem aprovação automática.`,`Método de instalação: ${p.protection.method}. Temperatura ambiente: ${n(p.protection.ambient,1)} °C. Comprimento: ${n(p.protection.length,1)} m. Fonte da tabela: ${p.protection.tableSource}. Conferência declarada pelo usuário: ${p.protection.tableVerified?'sim':'não'}. PE, curto-circuito, seletividade e queda/elevação de tensão não estão dimensionados.`]},

function reportHtml(){const sections=reportSections();return `<article class="report" id="reportDocument"><div class="eyebrow">CapacitorPro · Memória técnica</div><h1>${esc(project.name)}</h1><p class="muted">Dimensionamento e avaliação de banco de capacitores · Versão ${APP_VERSION}</p>${notice('Estudo de apoio ao projeto. Premissas e componentes demonstrativos devem ser substituídos por dados medidos e especificações confirmadas.','warn')}${sections.map(s=>`<section><h2>${esc(s.title)}</h2>${(s.paragraphs||[]).map(x=>`<p>${esc(x)}</p>`).join('')}${s.rows?table(s.headers,s.rows.map(row=>row.map(esc))):''}${s.title.startsWith('3.')?`<div class="chart">${triangleSVG(result.base.P,result.base.Q,result.after.Q)}</div>`:''}${s.title.startsWith('4.')?`<div class="diagram">${diagramSVG()}</div>`:''}${s.title.startsWith('9.')?lineChart([{name:'Simples',points:result.econ.cash.map(x=>[x.year,x.cum])},{name:'Descontado',points:result.econ.cash.map(x=>[x.year,x.dcum])}],{reference:0,xTitle:'Ano'}):''}${s.harmonicSvg?`<div class="chart">${s.harmonicSvg}</div>`:''}</section>`).join('')}<div class="divider"></div><p class="tiny muted">Dados armazenados localmente. Este documento não contém assinatura profissional ou declaração de responsabilidade técnica.</p></article>`;}
RENDERERS.report=()=>reportHtml();
const MANUAL=[
 ['Começar um estudo e salvar os dados',`<p>Comece em <strong>Projetos salvos</strong> ou carregue um dos cinco exemplos. Confira a instalação, ajuste os estágios e cadastre um perfil representativo. Todos os exemplos são sintéticos; preços, tarifas, impedâncias e distorções não representam medições de campo.</p><p>Use <strong>Salvar projeto</strong> para guardar uma versão nomeada no IndexedDB. O rascunho atual é salvo após alterações válidas, quando o navegador permite. O armazenamento é local ao navegador/origem; não é uma conta na nuvem. Um arquivo HTML aberto em outro caminho ou navegador pode acessar outro armazenamento.</p><p>Exporte o projeto em JSON para transferi-lo ou recuperá-lo. O backup JSON inclui instalação, estágios, perfil, biblioteca e parâmetros. A aplicação não faz sincronização entre abas; a última gravação de um mesmo projeto prevalece.</p>`],
 ['Potências ativa, reativa, aparente e fator de potência',`<p>A potência ativa P, em kW, representa o trabalho e as perdas ativas. Q, em kvar, representa a componente reativa fundamental, positiva para carga indutiva e negativa para capacitiva. Na aproximação senoidal equilibrada, S = √(P²+Q²), em kVA, e cos φ = P/S.</p><div class="equation">S = P/cos φ<br>Q = P × tan(arccos(cos φ))<br>Qc = max[0, P × (tan φ₁ − tan φ₂)]</div><p>Se o fator inicial já atende ao alvo, o valor necessário é zero. Para carga capacitiva, adicionar capacitores não é a solução automática. Após compensação, conserva-se P e calcula-se Qlíq = Q − Qc, sem ocultar seu sinal.</p>`],
 ['FP de deslocamento versus FP verdadeiro',`<p>O cos φ se refere à componente fundamental. O FP verdadeiro incorpora a distorção. Com tensão aproximadamente senoidal, admite-se FP ≈ cos φ / √(1+THDi²), usando THDi em valor decimal.</p><p>Na entrada de FP verdadeiro, o motor obtém cos φ ≈ FP × √(1+THDi²). Um resultado acima de 1 invalida a combinação informada. No cálculo posterior, mantém-se a corrente harmônica absoluta da carga: D = S1,inicial × THDi e Sfinal ≈ √(P²+Qlíq²+D²). Por isso o capacitor não elimina a componente de distorção.</p><p>THDi não é mantida constante após a correção: a relação com a corrente fundamental pode aumentar. O modelo não prevê a modificação das harmônicas por ressonância, o que requer estudo específico. THDv elevada invalida a aproximação de tensão senoidal.</p>`],
 ['Sistemas elétricos, correntes e capacidade liberada',`<div class="equation">Trifásico equilibrado: I = S × 1000/(√3 × Vlinha)<br>Monofásico ou carga entre duas fases: I = S × 1000/V<br>Capacidade liberada = Santes − Sdepois</div><p>A opção bifásica representa uma carga entre dois condutores. Não modela um conjunto desequilibrado de cargas fase-neutro. A potência aparente liberada pode permitir mais carregamento, mas não altera a corrente nominal de disjuntores ou a seção dos cabos existentes.</p><p>A demanda contratada e medida em kW é registrada para contexto; o programa não atribui automaticamente economia de demanda ativa ao diminuir kVA.</p>`],
 ['Potência de placa, tensão e frequência dos capacitores',`<div class="equation">Qef = Qn × (V/Vn)² × (f/fn)<br>Com reator: Qef = Qn × (V/Vn)² × (f/fn)/(1−pₑ)<br>pₑ = pₙ × (f/fn)²</div><p>Um módulo de 50 kvar a 440 V, operando a 380 V e mesma frequência, não entrega 50 kvar: entrega aproximadamente 37,293 kvar, antes de qualquer reator. O solver considera essa diferença.</p><p>O cadastro usa potência de placa do capacitor e tensão equivalente linha–linha da configuração. Não confundir essa convenção com a potência líquida de um conjunto comercial capacitor/reator. Para um banco pronto com placa em kvar líquidos, obtenha do fabricante os dados equivalentes antes de aplicar o modelo.</p><p>Os registros iniciais são módulos trifásicos genéricos em triângulo. A mudança para estrela é um cálculo de configuração, não autorização para religar fisicamente o mesmo equipamento. Confirme a construção e tensão de cada elemento.</p>`],
 ['Capacitância, ligações e dessintonia',`<div class="equation">ω = 2πf; Q em var<br>Δ: Cramo = Q/(3ωV²)<br>Y: Cramo = Q/(ωV²)<br>Monofásico: C = Q/(ωV²)<br>Com reator: multiplicar C por (1−pₑ)<br>Uc ≈ Uramo/(1−pₑ); fres ≈ f/√pₑ</div><p>As capacitâncias do banco são equivalentes por ramo, somando estágios em paralelo. Somar os três ramos é uma soma física, não uma capacitância equivalente entre duas fases.</p><p>A indutância exibida é equivalente para o conjunto e não especifica cada reator. Componentes comerciais exigem verificação de tensão reforçada, tolerâncias, perdas, corrente, espectro e compatibilidade LC. Bancos dessintonizados não são automaticamente filtros sintonizados.</p>`],
 ['Banco fixo, semiautomático e automático',`<p>No banco fixo, todos os estágios permanecem ligados em todo o perfil, inclusive quando a carga cai. No modo semiautomático, os estágios selecionados manualmente permanecem ligados. No automático, o motor procura um subconjunto próximo do objetivo de Q, com preferência para atender o cos φ alvo, evitando condição capacitiva quando essa restrição está habilitada.</p><p>A histerese retém uma combinação já ligada se a melhoria for inferior à banda configurada. O intervalo mínimo entre decisões e o bloqueio de religamento são avaliados nos instantes de cada registro. O primeiro registro inicia com todos os estágios desligados antes da primeira decisão, e o perfil é simulado uma vez.</p><p>Não se emula o firmware de um regulador nem se integram os transitórios dentro de cada intervalo. Em um perfil horário, os tempos de poucos segundos só influenciam mudanças compatíveis com a resolução dos registros. A contagem de mudanças não serve para previsão de vida de contatores. Intervalos sem circulação de potência não têm FP definido e ficam fora do denominador da cobertura do objetivo.</p>`],
 ['Perfil de carga, importação e sobrecompensação',`<p>O dia típico é multiplicado pelo número de dias configurados; o período mensal completo não é multiplicado. As horas/dia da instalação servem ao gerador de perfil constante e não multiplicam novamente o consumo calculado.</p><p>CSV e XLSX usam as colunas <strong>hora, duracao_h, kw, fp, natureza, q_kvar, posto</strong>. q_kvar preenchido prevalece sobre fp; valores negativos significam reativo capacitivo. q_kvar vazio utiliza o cos φ informado. A hora é decimal de 0 até menos de 24; 8,5 significa 08h30. Os intervalos devem estar em ordem cronológica.</p><p>O programa aceita até 744 registros e planilhas XLSX sem proteção. Na importação, células com fórmulas dependem do valor calculado armazenado no arquivo. Arquivos XLS antigos, XLSM, planilhas criptografadas e links externos não são suportados.</p><p>Mesmo um banco bem dimensionado na carga máxima pode provocar sobrecompensação em baixa carga. O simulador mostra a queda do fator de potência após Qc ultrapassar Q indutivo. Avalie o perfil completo, não apenas a soma nominal dos módulos.</p>`],
 ['Solver e interpretação das alternativas',`<p>O solver usa módulos de capacitores habilitados, limites de potência nominal, tensão mínima compatível e até 12 estágios. A necessidade-alvo corresponde ao maior valor entre a condição de projeto e o perfil. A busca usa estados discretizados, retenção limitada e avalia até 72 configurações no perfil.</p><p>Os objetivos disponíveis combinam diferença de kvar, custo, número de estágios, cobertura, sobrecompensação ou VPL. Por ser uma busca limitada, o sistema <strong>não comprova ótimo global</strong>. Preços, restrições e a capacidade de regulação podem fazer alternativas diferentes serem preferíveis.</p><p>Aplicar uma alternativa substitui os estágios, mas mantém o restante do cenário. Alterar parâmetros invalida resultados antigos do solver. No comparador, a alternativa econômica é a melhor entre as alternativas retidas e apresentadas.</p>`],
 ['Harmônicas e risco de ressonância',`<div class="equation">hᵣ ≈ √(Scc/Qc)<br>fᵣ = hᵣ × f<br>Scc ≈ Sn × 100/uk%</div><p>Use Scc e Qc na mesma base (kVA/kvar). Sem Scc informado, o modelo considera o transformador e despreza a impedância da rede a montante. Todos os patamares discretos são examinados nas ordens 3, 5, 7, 11 e 13, conforme a banda relativa escolhida.</p><p>Os gatilhos de atenção de THD e participação de cargas não lineares são critérios internos de investigação, não limites normativos. Ausência de coincidência não prova segurança. Redes com reatores precisam de modelo LC completo, varredura de impedância e medições de espectro.</p><p>A presença de inversores, UPS e retificadores ajuda a caracterizar o estudo, mas suas simples marcações não bastam para dimensionar um filtro. Não instalar capacitores na saída de inversores sem aprovação do fabricante.</p>`],
 ['Economia, tarifa, perdas e retorno',`<p>A economia reúne ERE evitada, perdas ativas efetivamente evitadas e eventual economia de DRE validada externamente, deduzindo consumo próprio do banco e manutenção. A redução de kVA não é convertida automaticamente em redução de demanda contratada em kW.</p><div class="equation">ERE ≈ Σ Eativa(MWh) × max(fR/fT − 1, 0) × VRERE<br>Economia anual líquida = 12 × economia mensal operacional − manutenção anual<br>Retorno simples = investimento / economia anual líquida<br>VPL = −investimento + Σ fluxo anual/(1+i)^ano</div><p>Grupo B não gera ERE no modelo. O Grupo A com opção de faturamento por tarifa B continua classificado como Grupo A para a análise. A referência inicial 0,92 e a janela inicial 00h–06h são parâmetros que precisam ser conferidos; a janela de seis horas não é imposta como universal pelo software.</p><p>A ERE é estimada; a DRE completa não é automatizada. A taxa de energia reativa é em R$/MWh de referência, não em R$/kvarh. O campo de fatura observada considera apenas ERE para evitar duplicidade com DRE.</p><p>O modelo I²R considera apenas o trecho a montante do banco. Perdas do consumidor só são monetizadas quando o trecho está dentro da medição faturada. Não se reduzem perdas fixas no ferro nem perdas a jusante de banco central. Os fluxos econômicos são constantes em termos reais, sem inflação, valor residual ou financiamento.</p>`],
 ['Proteção, manobra e descarga',`<p>A corrente de pré-seleção é a corrente do banco multiplicada pela margem informada. O valor inicial 1,43 é ilustrativo; não é uma recomendação normativa para toda instalação. O calibre genérico sugerido não verifica curva, curto-circuito, poder de interrupção ou energização.</p><p>A tabela de ampacidade inicial é demonstrativa. Substitua-a por dados aplicáveis ao método real, informe fatores e paralelos e registre a fonte. O modelo procura Iz corrigida total maior ou igual ao calibre candidato. PE e queda/elevação de tensão não são dimensionados. Paralelos exigem condições adequadas de divisão de corrente.</p><div class="equation">V(t) = V₀ × e^(−t/RC)<br>Rmáx = t/[C × ln(V₀/Vfinal)]</div><p>A descarga RC é uma estimativa por ramo, sem tolerâncias nem dimensionamento térmico. Não se deve prescrever um resistor somente por este resultado. Tempo decorrido não equivale a ausência de tensão: o banco deve passar pelos procedimentos de desenergização, bloqueio e verificação aplicáveis.</p>`],
 ['Escopo, limitações e informações de versão',`<p>Versão 1.0.0: dimensionamento fundamental, estimativa de FP verdadeiro, bibliotecas editáveis, estágios, solver limitado, simulação quase-estática, perfil CSV/XLSX, análise econômica, triagem de harmônicas, pré-seleção orientativa de proteção, descarga RC, diagramas SVG/PNG, relatórios PDF/XLSX e projetos IndexedDB/JSON.</p><p>Fora do escopo executivo: rede desequilibrada, geração/exportação, transitórios, medição em tempo real, cálculos harmônicos completos, curvas de proteção, seletividade, dimensionamento completo do PE, aprovação normativa, atualização automática de tarifas e seleção homologada de fabricantes. O PDF é gerado localmente; impressão pelo navegador permanece disponível.</p><p>Dados não são transmitidos. O aplicativo pode ser hospedado como um único HTML. Em instalação multiusuário, será necessário desenvolver autenticação, servidor, banco de dados e política de segurança próprios. Não há backend nesta versão.</p>`]
];
RENDERERS.manual=()=>{const tests=allTests();return `<div class="grid3 blockgap">${metric('Tópicos do manual',MANUAL.length,'','Conceitos, métodos e operação',true,'book')}${metric('Testes internos aprovados',tests.filter(x=>x.ok).length+'/'+tests.length,'','Validação determinística do motor',false,'check')}${metric('Dependências externas','Zero','','Cálculo e exportações no próprio HTML',false,'shield')}</div><div class="card"><div class="field"><label for="manualSearch">Pesquisar no manual</label><input id="manualSearch" type="search" value="${esc(manualSearch)}" placeholder="Ex.: harmônicas, tarifa, XLSX, tensão"></div></div><div class="manual" id="manualTopics">${manualTopics()}</div>${card('Fontes técnicas e regulatórias','A norma aplicável e sua vigência devem ser conferidas na data do projeto.',SOURCES.map(s=>`<p class="smalltext"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer"><strong>${esc(s.title)}</strong></a><br><span class="muted">${esc(s.note)}</span></p>`).join(''))}${card('Testes internos do motor','Estes testes não substituem validação independente de engenharia.',table(['Teste','Resultado','Detalhe'],tests.map(t=>[esc(t.name),badge(t.ok?'Aprovado':'Falhou',t.ok?'green':'red'),esc(t.detail)])),button('Executar testes','runTests','small'))}`;};
function manualTopics(){return MANUAL.filter(([t,c])=>(t+' '+c).toLowerCase().includes(manualSearch.toLowerCase())).map(([t,c])=>`<details ${manualSearch?'open':''}><summary>${t}</summary><div>${c}</div></details>`).join('')||'<div class="empty">Nenhum tópico encontrado.</div>';}

MANUAL.push(
 ['v1.1 — Circuitos do banco e significado dos indicadores',`<p>Acesse <strong>Engenharia do banco</strong> para navegar por Verificações, Cabos e PE, Proteção e manobra, Descarga e Rede/transformador. O alimentador do banco e cada estágio são calculados separadamente. O dimensionamento do alimentador usa todos os estágios disponíveis, independentemente do subconjunto acionado no ponto de projeto.</p><p><strong>Atende ao critério</strong> significa que a inequação calculada atende aos dados. <strong>Atenção</strong> indica premissas não conferidas. <strong>Requer estudo</strong> significa dados ausentes ou método não implementado. <strong>Não atende</strong> é um descumprimento numérico. Nunca interpretar todos os números como aprovação de uma instalação.</p>`],
 ['v1.1 — Corrente, tolerâncias e harmônicas do banco',`<p>O modo global usa Ib=I1×fator. O modo envelope usa a variação de capacitância, tensão e frequência e a distorção de corrente <strong>no banco</strong>. O THDi da carga não é copiado, porque não determina a corrente harmônica absorvida pelo banco.</p><div class="equation">Convencional: F=(1+c)(1+u)(1+δf)√(1+THDi²)<br>Com reator: F anterior × (1−p)/(1−p(1+c)(1+δf)²)</div><p>Os dois modos são alternativos. Corrente de energização não é calculada por esse fator. Os limites de serviço do fabricante continuam a ser verificados.</p>`],
 ['v1.1 — Ampacidade, R/X, tensão e paralelos',`<p>Informe a ampacidade de referência em <strong>seção:Iz</strong>. A tabela inicial é demonstrativa. Ela não muda com material ou isolação. Informe método, fonte, temperatura, número de condutores carregados e fatores. Alterações nos dados revogam a conferência da tabela.</p><div class="equation">Iz=Iztabela×kt×kg×kp×n<br>Iz requerida=max(Ib, In/Ir, I2/1,45)<br>R=ρ20[1+α(θ−20)]L/(S×n)<br>X=x60(f/60)L/(1000×n)</div><p>O cabo é selecionado pela primeira seção que atende ampacidade, limite de tensão, mínimo e critério adiabático ativo. Uma seção manual inadequada é mantida e reprovada. Zero no campo de seção significa seleção automática. Sem dados de I²t, o programa não declara suportabilidade à falta.</p><p>Na carga capacitiva a corrente adianta a tensão. O sinal negativo da variação fasorial caracteriza elevação a jusante, não erro de cálculo. Perdas são calculadas pela corrente fundamental; perdas AC harmônicas não são inferidas. O ajuste de temperatura ambiente não recalcula o fator térmico automaticamente.</p>`],
 ['v1.1 — Proteção, PE e curto-circuito',`<p>Calibres são candidatos. O software verifica Ib ≤ In/Ir ≤ Iz e I2 ≤1,45 Iz. I2 é a corrente convencional de atuação do dispositivo, diferente do I²t da falta. Disjuntores ajustáveis exigem verificação adicional de carcaça e faixa de ajuste.</p><p>O usuário pode fornecer I²t passante ou Icc e tempo de eliminação. S ≥√(I²t)/k é aplicado integralmente a cada condutor paralelo, hipótese conservadora. Para PE, a corrente de falta à terra deve ser fornecida; não é igualada ao Icc trifásico. Um único PE comum é selecionado pela regra de seção equivalente, quando do mesmo material, pelo mínimo mecânico e pelo critério térmico disponível.</p><p>O equivalente de curto-circuito representa rede/transformador/alimentador, sem contribuições de outras fontes ou transitórios. Icu do geral deve atender à falta em sua origem, não apenas à falta reduzida após o cabo. Correntes mínimas de falta, laço, desligamento automático, Ics, seletividade e arco elétrico não são dimensionados.</p>`],
 ['v1.1 — Contatores, descarga e reconexão',`<p>Cada estágio permite informar contator AC-6b, kvar aplicável, Ie de serviço, tensão e pico suportável. O pico estudado deve ser medido ou fornecido por estudo próprio. Não há comparação incorreta de corrente de pico com ajuste RMS de disjuntor, nem extrapolação de kvar de contator por V².</p><p>Na descarga, o modelo considera R e C no pior caso positivo e tensão inicial de pico. Em estrela, a tensão por resistor difere da tensão residual entre terminais. A seleção E24 é arredondada para baixo considerando os prazos de descarga e, quando habilitado, de religamento. A condição de religamento é sempre verificada, mesmo com essa opção desabilitada.</p><div class="equation">Rmax=t/[Cmax ln(U0/Ualvo)]<br>Rnom≤Rmax/(1+tolerância R)<br>P contínua=Uramo,rms²/Rmín<br>Eramo,max=½CmaxUramo,pico²</div><p>Potência mínima inclui a margem configurada. Tensão de pico, energia de pulso e potência contínua do resistor são conferências independentes. O resistor pode precisar ser uma associação física: o sistema calcula a resistência equivalente, mas não projeta essa associação. Tempo decorrido nunca é declaração de ausência de tensão.</p>`],
 ['v1.1 — Compatibilidade, exportações e escopo',`<p>Projetos JSON da v1.0 são aceitos. Parâmetros anteriores de corrente, tabela, fatores, comprimento e descarga são preservados, e as novas verificações ficam pendentes. Os resultados da nova engenharia são incluídos no PDF completo e nas abas Circuitos_v11, Descarga_v11 e Verificacoes_v11 do XLSX. Também há PDF específico e CSV dos circuitos.</p><p>As perdas do alimentador novo e dos resistores não são adicionadas automaticamente à economia: não são perdas evitadas, e resistores podem já estar contabilizados em W/kvar. Reatores, fusíveis, modelos reais e preços da biblioteca não são homologados por esta atualização. Para tensão acima de 1 kV, a seleção de componentes BT é bloqueada.</p><p>Harmônicas avançadas, varredura de impedância, simulação dinâmica do regulador, transitórios, seletividade e projeto executivo de média tensão continuam fora do escopo da v1.1.</p>`]

MANUAL.push(
 ['v1.2 — Espectro, referência e importação',`<p>Abra <strong>Harmônicas → Espectro</strong>. Cada linha contém ordem h de 2 a 50, U e I em percentual da fundamental e fases em graus. A corrente de referência é I1 fundamental, não a corrente RMS com distorção. A origem do espectro e a declaração de cobertura são independentes. Ordens omitidas somente podem ser consideradas desprezíveis quando essa condição tiver sido verificada.</p><p>CSV/XLSX usam <code>h;u_pct;i_pct;u_ang_deg;i_ang_deg;ativo</code>. As três primeiras colunas são obrigatórias; amplitudes vazias não são convertidas em zero. Fases omitidas são assumidas iguais a zero e devem ser conferidas. Em XLSX, a aba preferida é Espectro_v12. A importação valida todas as linhas antes de substituir os dados, apresenta prévia e exige confirmação. Os exemplos são sintéticos.</p><p>Os arquivos antigos mantêm THDi/THDv agregados, mas recebem um espectro vazio. Não é possível recuperar a distribuição por ordem a partir de um índice THD único. A cópia explícita dos índices de entrada para o motor antigo só é admitida no modo de tensão imposta e exige confirmação.</p>`],
 ['v1.2 — Dois modelos de excitação',`<p><strong>Tensão imposta:</strong> use U(h) medido ou assumido no ponto de conexão. Calcula corrente e tensão nos capacitores sob esse espectro. I(h) cadastrado é diagnóstico e não excita a rede. Esse modo não prevê filtragem nem alteração do THDu do barramento.</p><p><strong>Rede e injeção:</strong> informe U(h) da fonte Thévenin de fundo e I(h) injetado pela carga. O barramento é resolvido pela lei dos nós. A tensão medida já contendo o efeito da corrente da carga não pode ser usada como outra excitação independente, sob pena de dupla contagem.</p><div class="equation">Zb(h)=Rb1 h^β + j[hωL−1/(hωCeq)]<br>Zs(h)=Rs1 h^α + j hXs1<br>Vh=(Eh/Zs+Jh)/(1/Zs+G+ΣYb)</div><p>R e seus expoentes, bem como a carga resistiva shunt G, são hipóteses editáveis. O amortecimento afeta fortemente os picos. O modelo mantém a fundamental em tensão nominal e não resolve fluxo de carga fundamental, saturação ou carga não linear dependente da tensão. As fases dos espectros definem a composição vetorial entre fonte e carga na mesma ordem.</p>`],
 ['v1.2 — Frequência LC, delta/estrela e esforços RMS',`<p>A potência de placa é do capacitor, não a potência líquida do conjunto com reator. O sistema conserva a convenção de placa trifásica da v1.1. Para o equivalente por fase, Ceq=Qn/(ωn Vn²); C físico em delta=Ceq/3 e em estrela=Ceq. L exibido é por reator de linha. A frequência de placa define o p nominal; p efetivo muda com a frequência de alimentação.</p><div class="equation">L=pnom/(ωn²Ceq)<br>p efetivo=ω²LCeq<br>fLC=1/(2π√LCeq)<br>IRMS=√(I1²+ΣIh²)<br>Uc,RMS=√(Uc1²+ΣUch²)</div><p>O cálculo fasorial com resistência inclui perdas equivalentes. O Qc usado para comparar com o motor de compensação é o valor ideal da associação LC, conservando os resultados anteriores. Limites de tensão e corrente são premissas confirmadas com catálogo, não limites universais. Reatores precisam de avaliação própria de espectro, temperatura, saturação e proteção térmica.</p>`],
 ['v1.2 — Sequência zero e múltiplas de três',`<p>No modelo trifásico equilibrado, as ordens múltiplas de três são mantidas no cadastro e nos gráficos, mas não entram na solução do banco. Quando excitadas, deixam o resultado parcial. O sistema não resolve neutro, circulação interna de correntes triplas no delta, redes homopolares ou componentes de sequência em uma instalação desequilibrada.</p><p>Essa exclusão não significa que essas componentes sejam inofensivas ou inexistentes. O caso exige outro modelo, medição por fase e topologia de aterramento/ligação. No circuito de dois fios usa-se um equivalente de laço, que pode conter todas as ordens cadastradas sem pressupor equilíbrio trifásico.</p>`],
 ['v1.2 — Varredura, estados e sensibilidade',`<p>A varredura compara a impedância vista por uma fonte de corrente com e sem banco. O ganho é de impedância; não constitui por si só previsão de distorção absoluta. São exibidos picos amostrados, com resolução editável. Mesmo uma curva abaixo do gatilho não prova conformidade.</p><p><strong>Examinar estados</strong> enumera até 4.095 subconjuntos não vazios de 12 estágios, somente nas ordens excitadas modeladas e em 5, 7, 11 e 13 até o limite declarado. Não verifica todos os picos entre ordens nem intertravamentos. Inspecionar um estado altera apenas a máscara deste estudo, sem comandar o regulador.</p><p>A sensibilidade avalia 15 combinações: LC nominal e quatro cantos C±/L±, em três níveis de força de curto-circuito. Não é análise probabilística nem pior caso global. As alternativas e resultados temporários são invalidados quando os dados mudam. A aplicação de outra tecnologia ou p ao projeto inteiro exige confirmação.</p>`],
 ['v1.2 — Exportações, migração e integração',`<p>O PDF harmônico específico registra o espectro, premissas, modelo, esforços, curva de impedância e pendências. O PDF completo acrescenta os capítulos da v1.2 depois dos capítulos anteriores. O XLSX acrescenta seis abas: Espectro_v12, Resposta_v12, Estagios_v12, Impedancia_v12, Premissas_v12 e Verificacoes_v12. Alternativas, Sensibilidade e Estados são acrescentadas quando calculados com as premissas atuais.</p><p>JSON guarda o estudo e aceita arquivos 1.0/1.1. As perdas R(h) e correntes harmônicas calculadas não são somadas automaticamente ao faturamento nem substituem Ib dos circuitos. A comparação com Ib é informativa: revise o envelope e as tolerâncias na Engenharia do banco. Isso evita misturar medições, modelos e dupla contagem de perdas.</p><p>As referências de fabricante citadas são apoio conceitual e não constituem catálogo validado ou garantia da seleção comercial.</p>`]
);
const scopeV12=MANUAL.find(x=>x[0]==='Escopo, limitações e informações de versão');if(scopeV12)scopeV12[1]=`<p>CapacitorPro ${APP_VERSION}: preserva compensação, economia e engenharia de circuitos; acrescenta espectro por ordem, modelo linear de um barramento, conjuntos LC, esforços RMS, varredura e sensibilidade. Os limites do modelo ficam explícitos em cada estudo.</p><p>Não fornece certificação, projeto executivo completo, fluxo harmônico multibarramento, sequência zero, transitórios, saturação, seletividade ou dimensionamento de filtros ativos. Os dados são locais, e o usuário deve manter cópias JSON.</p>`;

'use strict';
let hmPendingImport=null;
function hmParseSpectrum(rows){
 if(!Array.isArray(rows)||rows.length<2)throw Error('Arquivo sem cabeçalho e dados de espectro.');
 const headers=rows[0].map(normalizeHeader),aliases={h:['h','ordem','ordemharmonica','harmonic'],u:['upct','u','uh','tensaopct','tensaopercentual'],i:['ipct','i','ih','correntepct','correntepercentual'],au:['uangdeg','au','angulou','angulougraus','faseu'],ai:['iangdeg','ai','anguloi','anguloigraus','fasei'],enabled:['ativo','enabled','habilitado']};
 const cols={};for(const key in aliases)cols[key]=headers.findIndex(h=>aliases[key].includes(h));
 for(const key of ['h','u','i'])if(cols[key]<0)throw Error('Coluna obrigatória ausente: '+({h:'h',u:'u_pct',i:'i_pct'}[key])+'. Use o modelo CSV.');
 const parse=(v,label)=>{if(v===null||v===undefined||String(v).trim()==='')throw Error(label+': valor ausente (zero medido deve ser explícito).');const t=typeof v==='number'?v:Number(String(v).trim().replace(/\s/g,'').replace(',','.'));if(!Number.isFinite(t))throw Error(label+': número inválido.');return t;};
 const data=rows.slice(1).filter(r=>r.some(x=>String(x??'').trim()!=='')).map((r,j)=>{const o={};for(const key of ['h','u','i','au','ai'])o[key]=cols[key]<0?0:parse(r[cols[key]],'Linha '+(j+2)+' / '+key);const v=cols.enabled<0?'1':String(r[cols.enabled]??'').trim().toLowerCase();if(!['1','0','true','false','sim','nao','não','s','n'].includes(v))throw Error('Linha '+(j+2)+': ativo deve ser 1 ou 0.');o.enabled=['1','true','sim','s'].includes(v);return o;});
 if(!data.length)throw Error('Nenhuma ordem harmônica foi informada.');
 const p=defaultProject();p.harmonicStudy=HarmEngine.defaults(false);p.harmonicStudy.spectrum=data;const errors=HarmEngine.validate(p);if(errors.length)throw Error(errors[0]);return data.sort((a,b)=>a.h-b.h);
}
function hmEditRow(el){const i=Number(el.dataset.hmRow),key=el.dataset.hmKey;if(!Number.isInteger(i)||!project.harmonicStudy.spectrum[i]||!['h','u','i','au','ai','enabled'].includes(key))return;const row=project.harmonicStudy.spectrum[i],old=row[key];if(key!=='enabled'&&el.value.trim()==='')throw Error('Preencha o valor; use zero somente quando aplicável.');row[key]=key==='enabled'?el.checked:Number(el.value);const errors=HarmEngine.validate(project);if(errors.length){row[key]=old;render();throw Error(errors[0]);}project.harmonicStudy.complete=false;project.harmonicStudy.catalogVerified=false;project.demo=false;changed();}
function hmChooseImport(){const input=$('#fileInput');input.value='';input.accept='.csv,.xlsx';input.onchange=async()=>{const file=input.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('Arquivo maior que 10 MB. Exporte somente o espectro.');const rows=/\.xlsx$/i.test(file.name)?await NativeXlsx.read(file,'Espectro_v12'):parseCSV(await file.text()),data=hmParseSpectrum(rows);hmPendingImport={data,name:file.name};showModal('Conferir espectro importado',notice(`${data.length} ordens validadas. O espectro atual será substituído após confirmação. A importação não declara que os dados são medidos ou completos.`)+table(['h','U (%)','I (%)','Ângulo U','Ângulo I','Ativo'],data.slice(0,12).map(r=>[r.h,n(r.u,3),n(r.i,3),n(r.au,2),n(r.ai,2),r.enabled?'Sim':'Não']))+'<p class="tiny muted" style="margin-top:12px">Prévia de até 12 registros. Confira origem, ponto de medição, referência de I1 e modo de excitação após importar.</p>',button('Cancelar','closeModal')+button('Substituir espectro','hmConfirmImport','primary'));}catch(e){toast('Importação não concluída: '+e.message,'bad');}};input.click();}
async function hmExportPDF(){if(validateProject(project).length)throw Error('Corrija os dados inválidos antes de exportar.');const pdf=new LocalPDF();pdf.title('Memorial harmônico',true);pdf.paragraph('CapacitorPro '+APP_VERSION+' | '+project.name,11);pdf.paragraph('ESTUDO PRELIMINAR — não equivale a projeto executivo nem atestado de conformidade.',10,'0.6 0.34 0.10');for(const section of hmReportSections()){pdf.title(section.title);for(const t of section.paragraphs||[])pdf.paragraph(t);if(section.rows)pdf.table(section.headers,section.rows,section.widthRatios);if(section.harmonicSvg)await pdf.image(section.harmonicSvg,218);}downloadFile(pdf.blob(),'CapacitorPro_memorial_harmonico_'+safeName(project.name)+'.pdf');return pdf.pages.length;}

 case 'hmGoSpectrum':goto('harmonicSpectrum');break;
 case 'hmGoEngineering':goto('protection');break;
 case 'hmCSV':downloadFile(csvBlob(hmSpectrumRows()),'CapacitorPro_espectro.csv');break;
 case 'hmXLSX':downloadFile(NativeXlsx.write(hmWorkbookSheets()),'CapacitorPro_estudo_harmonico.xlsx');break;
 case 'hmPDF':await hmExportPDF();break;
 case 'hmTemplate':downloadFile(csvBlob([['h','u_pct','i_pct','u_ang_deg','i_ang_deg','ativo'],[5,1,8,0,0,1],[7,.5,4,0,0,1],[11,.2,2,0,0,1],[13,.1,1,0,0,1]]),'CapacitorPro_modelo_espectro_ILUSTRATIVO.csv');toast('Modelo ilustrativo exportado. Substitua as amplitudes antes de usar.');break;
 case 'hmImport':hmChooseImport();break;
 case 'hmConfirmImport':{if(!hmPendingImport)throw Error('Importação pendente não encontrada.');const s=project.harmonicStudy;s.spectrum=hmPendingImport.data;s.source='Importado de '+hmPendingImport.name+' — conferir campanha, instrumento e unidades.';s.origin='assumed';s.complete=false;s.catalogVerified=false;s.maxOrder=50;s.migrationNote='';hmPendingImport=null;closeModal();changed();toast('Espectro importado; confira origem e modelo.','good');break;}
 case 'hmAddRow':{const s=project.harmonicStudy,used=new Set(s.spectrum.map(x=>x.h));let h=2;while(h<=50&&used.has(h))h++;if(h>50)throw Error('Todas as ordens de 2 a 50 já estão cadastradas.');s.maxOrder=Math.max(s.maxOrder,h);s.spectrum.push({h,u:0,i:0,au:0,ai:0,enabled:true});s.complete=false;s.catalogVerified=false;changed();break;}
 case 'hmRemoveRow':{const i=Number(el.dataset.index);if(!Number.isInteger(i)||!project.harmonicStudy.spectrum[i])return;project.harmonicStudy.spectrum.splice(i,1);project.harmonicStudy.complete=false;project.harmonicStudy.catalogVerified=false;changed();break;}

MANUAL.push(
 ['Controlador v1.3 — simular e reproduzir',`<p><strong>Simular</strong> resolve o horizonte completo por eventos de carga, temporização, liberação de descarga, permanência e limite de manobras. <strong>Reproduzir</strong> percorre esse resultado; velocidade e posição do cursor não alteram a simulação. Uma edição invalida o resultado anterior e bloqueia sua exportação.</p><p>Use o perfil principal ou importe um perfil independente. A tensão é constante; dentro de cada registro, P, Q e a distorção agregada da carga permanecem constantes. Variações internas não medidas não são inventadas. Até 744 registros, 12 etapas e 31 dias por execução, com teto de 80.000 eventos internos. Exceder o teto interrompe o estudo, sem adotar resultados parciais.</p>`],
 ['Controlador v1.3 — faixa, atrasos e reconexão',`<div class="equation">Q líquido = Q carga − Qc<br>Q alvo = P × tan(arccos(FP alvo))<br>Qmín = P × tan(arccos(FP retirada))<br>Qmáx = P × tan(arccos(FP entrada))<br>Bloqueio efetivo = max(t informado, tRC)</div><p>Acima de Qmáx solicita entrada; abaixo de Qmín solicita retirada. O pedido deve persistir pelo atraso. O retorno à faixa reinicia o temporizador; cruzar uma linha do perfil sem cessar a condição não reinicia o atraso. Depois de uma manobra, o atraso inicia novamente para a próxima etapa.</p><p>Tempos de entrada, retirada, permanência, intervalo entre manobras e reconexão são distintos. Na partida, uma etapa desligada com descarga desconhecida aguarda o maior entre a espera inicial e o bloqueio efetivo. Estado inicial já ligado não conta como conexão.</p><p>A retirada por baixa carga ou excesso capacitivo pode ignorar a permanência e ultrapassar o limite de operações, sempre com registro. Nunca se ignora o bloqueio para uma nova conexão. A integração RC é de estudo e não valida o resistor real.</p>`],
 ['Controlador v1.3 — estratégias e manobras',`<p>Menor erro reativo, linear por prioridade, circular, FIFO e balanceamento de operações escolhem entre etapas viáveis. A estratégia linear aplica prioridades, não um prefixo rígido de relé comercial. Circular avança o cursor de entrada; FIFO reutiliza a desligada há mais tempo e retira a que entrou primeiro. Balanceamento favorece menor número de operações.</p><p>Uma decisão muda uma etapa. O sistema não faz trocas combinatórias com interrupção e reconexão de múltiplos estágios. Uma combinação teoricamente melhor pode exigir troca que este modelo não executa; essa situação aparece como ausência de etapa adequada. Não é garantia de ótimo global.</p><p>ON e OFF são operações distintas; a janela móvel considera (t − 3.600 s, t]. Ciclos completos exigem ON seguido de OFF durante o horizonte. As projeções multiplicam o resultado pelas repetições anuais, sem representar continuidade entre períodos ou vida útil.</p>`],

RENDERERS.optimizerSetup=()=>{const c=project.commercial.optimizer;return opTabs()+opToolbar()+opStatus()+card('Espaço de busca','A potência de cada módulo é convertida para a tensão e frequência da instalação.',`<div class="formgrid">${field('commercial.optimizer.source','Fonte dos módulos',{options:[['library','Biblioteca do projeto'],['catalog','Catálogo comercial v1.4']]})}${field('commercial.optimizer.maxStages','Máximo de estágios',{min:1,max:12,step:1})}${field('commercial.optimizer.maxRepeat','Máximo por modelo',{min:1,max:12,step:1})}${field('commercial.optimizer.minKvar','Banco mínimo efetivo',{unit:'kvar',min:0})}${field('commercial.optimizer.maxKvar','Banco máximo efetivo',{unit:'kvar',min:0,hint:'0 = 135% do pico requerido; limite heurístico, não critério normativo.'})}${field('commercial.optimizer.minStep','Mínimo por estágio',{unit:'kvar',min:0})}${field('commercial.optimizer.maxStep','Máximo por estágio',{unit:'kvar',min:0,hint:'0 = sem limite adicional.'})}${field('commercial.optimizer.poolSize','Alternativas na triagem',{min:10,max:500,step:1})}${field('commercial.optimizer.temporalLimit','Finalistas temporais',{min:3,max:80,step:1})}${field('commercial.optimizer.maxNodes','Limite de expansões',{min:100,max:200000,step:1})}${field('commercial.optimizer.strictFrequency','Exigir frequência de placa igual',{type:'check'})}${field('commercial.optimizer.excludeUnavailable','Respeitar estoque / indisponibilidade',{type:'check'})}${field('commercial.optimizer.requireQuoted','No catálogo, exigir preço cotado',{type:'check'})}${field('commercial.optimizer.resetStageSettings','Reiniciar ajustes individuais nas alternativas',{type:'check',hint:'Mantém tempos globais; limpa ajustes de circuitos/estágios e inicia desligado.'})}</div>`)+card('Filtros de atendimento','Fora dos filtros significa inadequado a estas preferências, não impossibilidade física.',`<div class="formgrid">${field('commercial.optimizer.minCoverage','Cobertura mínima do FP alvo',{unit:'%',min:0,max:100})}${field('commercial.optimizer.maxLeading','Tempo capacitivo máximo',{unit:'%',min:0,max:100})}${field('commercial.optimizer.maxInvestment','Teto de investimento',{unit:'R$',min:0,hint:'0 = sem teto. Total desconhecido não satisfaz teto definido.'})}${field('commercial.optimizer.maxOperations','Manobras máximas no horizonte',{min:0,max:1000000,step:1,hint:'0 = sem limite; não equivale a operações por hora.'})}</div>`)+card('Pesos multicritério','Pesos são normalizados. Todos os objetivos abaixo são de minimização; use 0 para não considerar.',`<div class="formgrid">${Object.keys(c.weights).map(k=>field('commercial.optimizer.weights.'+k,OP_LABEL[k],{min:0,max:1000,unit:OP_UNIT[k]})).join('')}</div><div class="equation">Pontos = 100 × Σ [peso normalizado × (máximo − valor)/(máximo − mínimo)]</div><p class="tiny muted">Critério constante recebe contribuição igual para todos. Se algum finalista não possui dado, o critério é suspenso para todo o conjunto. A fronteira de Pareto usa somente os critérios ativos.</p>`)+card('Custo paramétrico comparável','Não é a lista de materiais. Evite sobreposição entre parcelas; preços ausentes de capacitores deixam o investimento incompleto.',`<div class="formgrid">${field('commercial.optimizer.fixedCost','Painel e custos fixos',{unit:'R$',min:0})}${field('commercial.optimizer.perStageCost','Manobra / proteção por estágio',{unit:'R$',min:0})}${field('commercial.optimizer.reactorPerKvar','Reatores por kvar efetivo',{unit:'R$/kvar',min:0})}${field('commercial.optimizer.installationCost','Instalação',{unit:'R$',min:0})}${field('commercial.optimizer.costNote','Fonte e escopo dos custos',{type:'textarea',full:true})}</div>`);};
RENDERERS.optimizerMethod=()=>opTabs()+opStatus()+card('Como a busca funciona','O resultado é reproduzível para as mesmas entradas e a mesma versão.',`<div class="opSteps"><div><strong>01 · Elegibilidade</strong><p>Tensão fundamental no capacitor, frequência, sistema, ligação, habilitação e disponibilidade declarada.</p></div><div><strong>02 · Combinações</strong><p>Multiconjuntos de módulos com repetição limitada, faixa de kvar e poda por feixe. Ordem elétrica crescente nas alternativas.</p></div><div><strong>03 · Triagem</strong><p>Amostra diversa por número de estágios e potência. Seleção de finalistas por déficit, custo, passo, quantidade e proximidade do pico.</p></div><div><strong>04 · Controlador</strong><p>O motor temporal v1.3 simula cada finalista. Pesos normalizados e filtros explícitos produzem uma comparação relativa.</p></div></div>`)+notice('A busca pode não encontrar uma configuração existente. “Nenhuma alternativa atende” descreve somente os finalistas avaliados; aumente a busca ou reveja as premissas.','warn')+card('Limites e segurança','A pontuação não é uma aprovação de engenharia.',`<p class="smalltext">Não há otimização de vida útil, disponibilidade real em tempo real, transitórios, harmônicas por candidato ou simultaneidade de falhas. O critério de perdas usa W/kvar do projeto: é consumo próprio estimado, não cálculo completo de aquecimento dos componentes.</p><p class="smalltext">O pré-filtro de tensão usa a elevação fundamental do capacitor com reator; tolerâncias, sobretensões e esforços harmônicos devem ser conferidos no módulo Harmônicas. O contator não recebe escalonamento por V².</p><p class="smalltext">Ao aplicar: banco automático, máscara inicial desligada, conferência harmônica invalidada; ajustes individuais dependem da opção selecionada. Tarifas, perfis e valores econômicos anteriores só mudam com comando explícito de transferência de custo.</p>`)+card('Histórico de decisões','Até 50 ações do projeto; salvo no JSON.',project.commercial.audit.length?table(['Data','Ação','Detalhe'],project.commercial.audit.slice().reverse().map(x=>[esc(x.date),esc(x.action),esc(x.detail)])):'<p class="muted smalltext">Nenhuma aplicação registrada.</p>');
function opCatalogRows(){return project.commercial.catalog.filter(x=>(opCatalogFilter==='all'||x.category===opCatalogFilter)&&(!opCatalogSearch||(x.name+' '+x.manufacturer+' '+x.model).toLowerCase().includes(opCatalogSearch.toLowerCase())));}
RENDERERS.commercialCatalog=()=>{const a=opCatalogRows();return `<div class="actions blockgap">${button('Cadastrar componente','opNewItem','primary')}${button('Importar CSV / XLSX / JSON','opImportCatalog')}${button('Exportar XLSX','opCatalogXLSX')}${button('Exportar JSON','opCatalogJSON')}${button('Modelo CSV','opCatalogTemplate')}${button('Restaurar referências oficiais','opSeed')}</div>${notice('As sete referências iniciais vieram de páginas oficiais. Apenas os campos descritos em “Evidência” foram conferidos; não são kits homologados. Estoque, preços, tolerâncias e combinações LC devem ser confirmados.')}<div class="grid3 blockgap">${metric('Registros',project.commercial.catalog.length,'','Cadastro independente da biblioteca antiga',true)}${metric('Com preço informado',project.commercial.catalog.filter(x=>x.price!==null).length,'','Cotação ou estimativa explicitada')}${metric('Capacitores habilitados',project.commercial.catalog.filter(x=>x.enabled&&x.category==='capacitor').length,'','Elegibilidade ainda depende do projeto')}</div>${card('Equipamentos e fontes','Clique em Detalhes para consultar as evidências e completar a cotação.',`<div class="formgrid two blockgap"><div class="field"><label>Categoria</label><select id="opCatalogFilter"><option value="all">Todas</option>${Object.entries(OP_CAT).map(([v,l])=>`<option value="${v}" ${v===opCatalogFilter?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Buscar fabricante ou modelo</label><input id="opCatalogSearch" value="${esc(opCatalogSearch)}" placeholder="Modelo, referência ou fabricante"></div></div>${table(['Usar','Fabricante / modelo','Categoria','Dados de placa','Preço unitário','Fonte / evidência','Ação'],a.map(x=>[`<input type="checkbox" data-op-enable="${esc(x.id)}" ${x.enabled?'checked':''} aria-label="Habilitar ${esc(x.model)}">`,`<strong>${esc(x.manufacturer)}</strong><br>${esc(x.model)}<br><small class="muted">${esc(x.name)}</small>`,OP_CAT[x.category],x.category==='capacitor'?n(x.qn,2)+' kvar · '+n(x.vn,0)+' V · '+n(x.fn,0)+' Hz':x.category==='contactor'?n(x.ratingKvar,1)+' kvar @ '+n(x.ratingVoltage,0)+' V / '+n(x.ratingFrequency,0)+' Hz':x.stages?x.stages+' saídas':'Conferir cadastro',x.price===null?badge('A cotar','warn'):money(x.price)+'<br>'+badge(x.priceKind==='quote'?'Cotado':'Estimativa',x.priceKind==='quote'?'green':'warn'),(x.source?`<a href="${esc(x.source)}" target="_blank" rel="noopener noreferrer">Fonte técnica ↗</a>`:'Sem URL')+'<br><small>'+esc(x.evidence==='primary'?'Campos de fonte primária':x.evidence==='demo'?'Demonstrativo':'Informado pelo usuário')+'</small>',button('Detalhes','opEditItem','small',`data-id="${esc(x.id)}"`)]))}`)}${notice('Referências descontinuadas ou disponibilidade regional podem mudar. O cadastro não consulta estoque automaticamente. Registre a data e a origem da proposta comercial.','warn')}`;};
function opBOMBadge(row){return badge(row.status==='fail'?'Incompatível':row.status==='reviewed'?'Revisado pelo usuário':'A conferir',row.status==='fail'?'red':row.status==='reviewed'?'green':'warn');}
RENDERERS.materials=()=>{const b=CommercialEngine.bom(project);return `<div class="actions blockgap">${button('Adicionar item','opExtra','primary')}${button('Memorial de materiais PDF','opBOMPDF')}${button('Materiais XLSX','opBOMXLSX')}${button('Materiais CSV','opBOMCSV')}${button('Transferir total à economia','opTransferBOM','',b.total===null?'disabled':'')}</div><div class="grid4 blockgap">${metric('Itens / linhas incompletas',b.rows.length+' / '+b.missing,'','Linhas do orçamento')}${metric(b.total===null?'Subtotal conhecido':'Total orçado',money(b.partial),'',b.total===null?'Não é o custo completo':'Inclui complementos abaixo',true)}${metric('Revisados / incompatíveis',b.reviewed+' / '+b.fail,'','Conferência declarada; não homologação')}${metric('Valores estimados',b.estimated,'','Não equiparar a cotação')}</div>${notice('Quantidades geradas a partir do banco e dos circuitos. Proteção, TC, painel, bobinas, barramentos, descarga e cabos exigem validação. Itens adicionais permitem completar acessórios e serviços.')} ${b.stale.length?notice('Requisitos alterados: vínculos antigos ignorados em '+b.stale.join(', ')+'. Reabra as linhas para conferir.','warn'):''}${b.missing?notice(b.missing+' linha(s) com preço ou quantidade pendente. O total está indisponível; o subtotal não representa um orçamento completo.','warn'):''}${card('Requisitos e equipamentos escolhidos','A escolha de um equipamento não modifica automaticamente a engenharia elétrica.',table(['Tag','Requisito','Qtd. / un.','Equipamento / situação','Preço unit.','Subtotal','Ação'],b.rows.map(row=>[esc(row.tag),esc(row.description||row.name),n(row.qty,2)+' '+esc(row.unit),esc(row.name)+'<br>'+opBOMBadge(row),row.price===null?'A cotar':money(row.price),row.total===null?'—':money(row.total),row.key.startsWith('extra:')?button('Remover','opDeleteExtra','small danger',`data-id="${esc(row.id)}"`):button('Vincular / cotar','opBOMEdit','small',`data-key="${esc(row.key)}"`)])))}${card('Complementos do orçamento','Aplicados uma única vez; reserva incide sobre materiais conhecidos + frete + instalação.',`<div class="formgrid">${field('commercial.costs.freight','Frete',{unit:'R$',min:0})}${field('commercial.costs.installation','Instalação / montagem',{unit:'R$',min:0})}${field('commercial.costs.contingency','Reserva estimada',{unit:'%',min:0,max:100})}${field('commercial.costs.note','Escopo e exclusões',{type:'textarea',full:true})}</div><div class="divider"></div>${pair('Materiais com preço',money(b.known))}${pair('Frete + instalação',money(b.freight+b.installation))}${pair('Reserva estimada',money(b.contingency))}${pair(b.total===null?'Subtotal parcial':'Total',money(b.partial))}`)}`;};

const economyBeforeCommercial=RENDERERS.economy;RENDERERS.economy=function(){return (result.econ.costIncomplete?notice('Há capacitor comercial sem cotação. Investimento, payback, VPL e fluxo de caixa estão indisponíveis. Complete os preços dos estágios ou transfira um orçamento integral da lista de materiais.','warn'):'')+economyBeforeCommercial();};

'use strict';
function opCatalogHeaders(){return [...CommercialEngine.strKeys,...CommercialEngine.numKeys,'enabled'];}
function opCatalogExportRows(){const keys=opCatalogHeaders();return [keys,...project.commercial.catalog.map(x=>keys.map(k=>k==='enabled'?(x[k]?1:0):x[k]??''))];}
function opAlternativeRows(){const j=opRequire();return [['Alternativa','Viavel filtros','Pareto conjunto','Estagios','kvar efetivo','Cobertura temporal %','Manobras horizonte','Tempo capacitivo %','Deficit kvarh','Maior passo kvar','Consumo banco kWh','Investimento R$','Payback quase-estatico anos','VPL quase-estatico R$','Pontuacao','Restricoes nao atendidas'],...j.candidates.map(a=>[a.id,a.feasible?'Sim':'Nao',a.pareto?'Sim':'Nao',a.stages.length,a.q,a.temporal.targetPercent??'',a.temporal.operations,a.temporal.leadingPercent,a.metrics.deficit,a.gap,a.metrics.loss,a.cost.total??'',a.economic?.payback??'',a.economic?.npv??'',a.score,a.checks.join('; ')])];}
function opBOMRows(){const b=CommercialEngine.bom(project);return [['Tag','Categoria','Descricao / requisito','Quantidade','Unidade','Equipamento','Preco unitario R$','Subtotal R$','Origem preco','Natureza preco','Fonte tecnica','Status','Pendencias','Observacoes'],...b.rows.map(r=>[r.tag,OP_CAT[r.category],r.description||r.name,r.qty??'',r.unit,r.name,r.price??'',r.total??'',r.priceSource||r.source||'',r.priceKind,r.source||'',r.status,(r.checks?.fails||[]).concat(r.checks?.pending||[]).join('; '),r.note||''])];}
function opWorkbookSheets(includeSolver=true){const b=CommercialEngine.bom(project),bomrows=opBOMRows();for(let i=1;i<bomrows.length;i++)if(b.rows[i-1].total!==null)bomrows[i][7]={formula:'D'+(i+1)+'*G'+(i+1),value:b.rows[i-1].total};
 const sheets=[{name:'Materiais_v14',rows:bomrows},{name:'Custos_v14',rows:[['Parcela','Valor','Unidade / condicao'],['Materiais conhecidos',{formula:'SUM(Materiais_v14!H2:H'+(bomrows.length)+')',value:b.known},'R$'],['Frete',b.freight,'R$'],['Instalacao',b.installation,'R$'],['Reserva percentual',project.commercial.costs.contingency/100,'fracao'],['Reserva sobre valores conhecidos',{formula:'SUM(B2:B4)*B5',value:b.contingency},'R$'],['Linhas sem preco ou quantidade',b.missing,'linhas'],['Subtotal conhecido',{formula:'SUM(B2:B4)+B6',value:b.partial},'Nao confundir com total quando houver pendencias'],['Total completo',b.total===null?'INCOMPLETO':{formula:'IF(B7=0,B8,"")',value:b.total},'R$'],['Escopo',project.commercial.costs.note,'Informado pelo usuario']]},{name:'Catalogo_comercial',rows:opCatalogExportRows()},{name:'Auditoria_v14',rows:[['Data','Acao','Detalhe'],...project.commercial.audit.map(x=>[x.date,x.action,x.detail])]}];
 if(includeSolver&&opFresh()){const j=opJob;sheets.unshift({name:'Alternativas_v14',rows:opAlternativeRows()});sheets.push({name:'Pesos_v14',rows:[['Alternativa','Criterio','Valor','Peso efetivo','Normalizado','Contribuicao pontos'],...j.candidates.flatMap(a=>Object.entries(a.contributions).map(([k,v])=>[a.id,OP_LABEL[k],v.value,v.weight,v.normalized,v.points]))]});sheets.push({name:'Modulos_alternativas',rows:[['Alternativa','Estagio','ID','Fabricante','Modelo','kvar placa','Vn','fn','kvar efetivo','Fonte'],...j.candidates.flatMap(a=>a.stages.map((s,i)=>[a.id,i+1,s.id,s.manufacturer,s.model,s.qn,s.vn,s.fn,CapEngine.stagePower(s,project.installation,project.bank),s.source]))]});}
 sheets.push({name:'Limites_v14',rows:[['Tema','Descricao'],['Software','CapacitorPro '+APP_VERSION+' — estudo preliminar'],['Busca','Heuristica em duas etapas; sem garantia de otimo global. Pareto limitado aos finalistas.'],['Custos','Precos ausentes nao equivalem a zero. Subtotal nao e investimento completo.'],['Economia','Payback das alternativas calculado no perfil quase-estatico principal; perfil temporal nao e monetizado.'],['Catalogo','Fonte primaria confirma somente campos listados em verifiedFields. Precos locais, estoque, normas e conjuntos LC exigem verificacao.'],['BOM','Dimensionamento e vinculacao comercial separados. Sem homologacao automatica.'],['Hipotese de consumo','kvarh conectado × W/kvar / 1000. Sem perdas detalhadas dos reatores ou cabos.'],...opFresh()?opJob.warnings.map(w=>['Solver',w]):[]]});return sheets;
}
function opReportSections(start=1,onlyBOM=false){let i=start;const b=CommercialEngine.bom(project),out=[];if(!onlyBOM&&opFresh()){const j=opJob;
 out.push({title:(i++)+'. Busca multicritério',paragraphs:[`Executada em ${j.date}. ${j.generation.nodes} expansões, ${j.generation.generated} combinações geradas, ${j.generation.screened} triadas e ${j.generation.temporal} finalistas temporais.`,...j.warnings,`Tecnologia fixa nesta busca: ${project.bank.tech}; ${project.bank.detune}% quando dessintonizada. Perfil temporal: ${project.temporal.source}. Alvo temporal: ${n(project.temporal.target,4)}. Ordem dos módulos crescente por potência.`]});
 out.push({title:(i++)+'. Comparação dos finalistas',paragraphs:['Os valores econômicos usam custos paramétricos e o perfil principal quase-estático. Cobertura, déficit e manobras usam o controlador temporal. “Atende” significa somente atendimento aos filtros desta busca.'],headers:['ID','kvar / n','Cobertura','Manobras','Invest. R$','Pontos','Filtros'],rows:j.candidates.map(a=>[a.id,n(a.q,1)+' / '+a.stages.length,n(a.temporal.targetPercent,1)+'%',a.temporal.operations,a.cost.total===null?'Incompleto':money(a.cost.total),n(a.score,1),a.feasible?'Atende':'Rever'])});
 out.push({title:(i++)+'. Distribuição das alternativas',harmonicSvg:opScatter(j.candidates),paragraphs:['A fronteira não dominada se refere aos critérios ativos e apenas às alternativas temporais avaliadas. Ela não representa o universo de configurações possíveis.']});
 out.push({title:(i++)+'. Pesos e escalas da comparação',headers:['Critério','Peso informado','Ativo','Faixa nos finalistas'],rows:Object.entries(j.weights).map(([k,w])=>[OP_LABEL[k],w,j.active.includes(k)?'Sim':'Não',j.bounds[k]?n(j.bounds[k].min,3)+' a '+n(j.bounds[k].max,3):'Não disponível']),paragraphs:['Para cada objetivo de minimização: contribuição = 100 × peso normalizado × (máximo - valor) / (máximo - mínimo). Critério constante dá contribuição igual a todos; dado ausente suspende o critério para o conjunto.']});

function sanitizeProject(raw,newId=true){if(!raw||raw.schema!=='capacitorpro'||!raw.installation||!Array.isArray(raw.profile)||!Array.isArray(raw.stages)||!Array.isArray(raw.library))throw Error('Arquivo não é um projeto CapacitorPro válido.');if(raw.version&&!String(raw.version).startsWith('1.'))throw Error('Versão do projeto não compatível com este aplicativo.');const p=defaultProject();

function showTerms(required=!termsAccepted()){const content=`<div class="eyebrow">Uso técnico responsável</div><p class="sub" style="margin-bottom:18px">Leia antes de iniciar seu estudo de compensação reativa.</p><div class="terms"><p><strong>Ferramenta de apoio, não projeto executivo.</strong> Os resultados dependem da qualidade dos dados e devem ser verificados por profissional legalmente habilitado, observadas as normas técnicas, regulamentação e orientações do fabricante.</p><p><strong>Exemplos e catálogo.</strong> Projetos e módulos genéricos são demonstrativos. O catálogo v1.4 inclui referências de páginas oficiais, com campos de evidência limitada e sem preços inventados. Nenhum cadastro equivale a homologação. Confirme placa, associação LC, disponibilidade e cotações.</p><p><strong>Qualidade de energia e segurança.</strong> Instalações com harmônicas, reatores ou risco de ressonância exigem estudo específico. O programa não substitui análise de curto-circuito, seletividade, transitórios, aterramento, descarga ou qualidade de energia.</p><p><strong>Economia estimada.</strong> O modelo de ERE não reproduz todos os componentes de faturamento. Demanda reativa excedente, tributos, horários e critérios da distribuidora precisam de conferência própria. Reduzir kVA não equivale a reduzir automaticamente kW.</p><p><strong>Dados locais.</strong> Os estudos são gravados no navegador quando permitido. Limpeza de dados, modo privado e mudança de origem podem eliminar ou isolar os registros. Exporte JSON como cópia de segurança.</p><p><strong>Intervenções em capacitores envolvem energia armazenada.</strong> O tempo de descarga calculado não comprova ausência de tensão. Não intervir sem os procedimentos e verificações de segurança aplicáveis.</p></div>${required?'<label class="checklabel" style="font-size:13px;margin-top:18px"><input type="checkbox" id="termsCheck">Li e compreendi as premissas e limitações de uso.</label>':''}`;showModal('Avisos legais e técnicos',content, document.addEventListener('change',e=>{const el=e.target;try{

 if(el.dataset.bind){const path=el.dataset.bind,old=get(path),val=el.type==='checkbox'?el.checked:typeof old==='number'?Number(el.value):el.value;if(el.type==='number'&&(el.value===''||!Number.isFinite(val)))throw Error('Informe um número válido.');set(path,val);if(path==='harmonicStudy.referenceMode'&&val==='manual'&&project.harmonicStudy.currentA<=0)project.harmonicStudy.currentA=result.base.S1*1000/((project.installation.system==='tri'?Math.sqrt(3):1)*project.installation.voltage);const err=validateProject(project);if(err.length){set(path,old);render();throw Error(err[0]);}if(path.startsWith('engineering.cable.')&&path!=='engineering.cable.verified')project.engineering.cable.verified=false;
 if(path.startsWith('engineering.fault.')&&path!=='engineering.fault.verified')project.engineering.fault.verified=false;

 if(['installation.voltage','installation.freq','installation.transformer','installation.uk','installation.system'].includes(path)){project.engineering.cable.verified=false;project.engineering.fault.verified=false;project.engineering.protection.verified=false;}

 if(['bank.tech','bank.detune','bank.connection','installation.voltage','installation.freq','installation.system'].includes(path))project.harmonicStudy.catalogVerified=false;
 project.demo=false;changed();return;}
 if(el.dataset.stage!==undefined){const i=+el.dataset.stage,key=el.dataset.key,old=project.stages[i][key],oldMissing=project.stages[i].commercialPriceMissing;if(el.value===''&&key!=='price')throw Error('Valor obrigatório.');if(key==='price'&&el.value!==''&&+el.value===0&&!confirm('Registrar custo zero explícito para este estágio? Use o campo vazio quando o preço for desconhecido.')){render();return;}project.stages[i][key]=el.value===''?0:+el.value;if(key==='price')project.stages[i].commercialPriceMissing=el.value==='';const err=validateProject(project);if(err.length){project.stages[i][key]=old;project.stages[i].commercialPriceMissing=oldMissing;render();throw Error(err[0]);}project.harmonicStudy.catalogVerified=false;changed();return;}
