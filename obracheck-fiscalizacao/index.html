      { id: "F7", curto: "Alterações", titulo: "Alterações, reajuste e reequilíbrio", desc: "Termos aditivos e apostilas, limites legais, preservação do desconto, reajuste anual, pedidos de reequilíbrio e aplicação da matriz de riscos.", prereq: ["F2"], desde: "execucao", rotina: "execucao" },
      { id: "F8", curto: "Gestão", titulo: "Gestão contratual, riscos e sanções", desc: "Riscos da execução, notificações, condições de habilitação, garantia, subcontratações, processos sancionatórios e transparência.", prereq: ["F1"], desde: "execucao", rotina: "execucao" },
      { id: "F9", curto: "Recebimento", titulo: "Recebimento e encerramento", desc: "Comunicação de término, recebimentos provisório e definitivo, documentação de entrega, licenças de funcionamento, liberação da garantia e encerramento.", prereq: ["F3", "F4", "F5", "F6", "F7", "F8"], desde: "recebimento" },
      { id: "F10", curto: "Pós-obra", titulo: "Pós-obra e garantia quinquenal", desc: "Inspeções periódicas durante os cinco anos de responsabilidade do contratado, notificação de vícios, manutenção e arquivo técnico.", prereq: ["F9"], desde: "garantia", rotina: "posobra" }
    ],

    /* --------------------------- ITENS --------------------------- */
    itens: [
      /* ============================ F1 ============================ */
      { id: "F1.01", etapa: "F1", grupo: "Instrumento contratual", titulo: "Contrato assinado e conferido com a minuta do edital e com a proposta", desc: "Assinaturas e poderes de representação, cláusulas necessárias do art. 92 e aderência à minuta anexa ao edital e à proposta vencedora. Vícios devem ser corrigidos antes do início dos serviços.", base: L + ", arts. 89 a 92; " + AP, crit: "critico", antesOS: true },
      { id: "F1.02", etapa: "F1", grupo: "Instrumento contratual", titulo: "Divulgação do contrato no PNCP", desc: "Condição de eficácia do contrato e dos aditamentos: até 20 dias úteis da assinatura, se houve licitação, ou 10 dias úteis, na contratação direta. Divulgue também no sítio oficial do ente e, se a norma local exigir, o extrato na imprensa oficial.", base: L + ", art. 94", crit: "critico", auto: "pncp", antesOS: true },
      { id: "F1.23", etapa: "F1", grupo: "Instrumento contratual", titulo: "Quantitativos e preços contratados divulgados em sítio oficial", desc: "Nas obras, a Administração divulga em sítio eletrônico oficial, em até 25 dias úteis da assinatura, os quantitativos e os preços unitários e totais contratados.", base: L + ", art. 94, §3º", crit: "importante", ajuda: "art94inicio" },
      { id: "F1.03", etapa: "F1", grupo: "Instrumento contratual", titulo: "Nota de empenho suficiente para a execução prevista no exercício", desc: "Empenho prévio compatível com o cronograma do exercício, com reforços e anulações acompanhados pelo fiscal administrativo.", base: "Lei 4.320/1964, art. 60; " + L + ", arts. 105 e 150", crit: "critico", antesOS: true },
      { id: "F1.04", etapa: "F1", grupo: "Instrumento contratual", titulo: "Previsão no plano plurianual", desc: "Investimento cuja execução ultrapassa o exercício financeiro depende de previsão no plano plurianual.", base: "Constituição Federal, art. 167, §1º; " + L + ", art. 105", crit: "importante", aplica: { se: "ultrapassaExercicio" }, antesOS: true },
      { id: "F1.05", etapa: "F1", grupo: "Equipe de fiscalização", titulo: "Designação formal do gestor, dos fiscais e dos substitutos", desc: "Ato publicado antes do início da vigência, com nome, matrícula e cargo dos designados e substitutos, números do processo e do contrato, atribuições e indicação de que a dedicação não é exclusiva. Ciência expressa dos designados.", base: L + ", arts. 7º e 117; regulamento do ente (no âmbito federal, Decreto 11.246/2022); " + DNIT + ", item 3.4", crit: "critico", antesOS: true },
      { id: "F1.06", etapa: "F1", grupo: "Equipe de fiscalização", titulo: "Segregação de funções e ausência de conflito de interesses", desc: "Quem elaborou o projeto ou o termo de referência não fiscaliza o contrato de escopo; quem afere os serviços não efetua o pagamento; agente de contratação e membros da comissão não atuam como fiscais; nenhum designado tem parentesco ou vínculo com a contratada.", base: L + ", art. 7º, III e §1º, e art. 9º, §1º; Acórdão 2.296/2014-TCU-Plenário; " + DNIT + ", item 3.3", crit: "critico", antesOS: true },
      { id: "F1.07", etapa: "F1", grupo: "Equipe de fiscalização", titulo: "Formação, carga de trabalho e condições da equipe", desc: "Formação compatível com o objeto, número de contratos por fiscal, distância até a obra, veículos, instrumentos de medição e acesso aos sistemas.", base: L + ", art. 7º, II; " + DNIT + ", item 5.1", crit: "importante" },
      { id: "F1.08", etapa: "F1", grupo: "Equipe de fiscalização", titulo: "Planejamento da fiscalização", desc: "Integrantes e especialidades, prazos, valor, porte e complexidade, turnos de trabalho, ensaios de controle tecnológico, estrutura física e logística e necessidade de empresa supervisora ou de reforço da equipe.", base: AP, crit: "importante", antesOS: true },
      { id: "F1.09", etapa: "F1", grupo: "Equipe de fiscalização", titulo: "Empresa supervisora contratada, com papéis definidos", desc: "A supervisora assiste e subsidia os fiscais, sem exercer atribuição própria do fiscal: responde objetivamente pela veracidade das informações e firma termo de confidencialidade. A responsabilidade do fiscal permanece.", base: L + ", art. 117, caput e §4º; " + DNIT + ", item 8", crit: "importante", aplica: SUPERVISORA },
      { id: "F1.10", etapa: "F1", grupo: "Equipe de fiscalização", titulo: "Anotação de responsabilidade técnica da fiscalização", desc: "ART ou RRT dos fiscais e da supervisora, conforme o conselho profissional.", base: "Lei 6.496/1977; Resolução CONFEA 1.137/2023; Lei 12.378/2010", crit: "importante" },
      { id: "F1.11", etapa: "F1", grupo: "Contratada", titulo: "Preposto indicado formalmente e aceito pela Administração", desc: "Representante da contratada no local da obra, com poderes para receber notificações e responder pela execução.", base: L + ", art. 118; " + DNIT + ", item 3.7", crit: "critico", antesOS: true },
      { id: "F1.12", etapa: "F1", grupo: "Contratada", titulo: "Responsáveis técnicos iguais aos da habilitação, com ART registrada e paga", desc: "Os profissionais indicados na qualificação técnico-profissional devem participar da obra; substituição apenas por profissional de experiência equivalente ou superior, aprovada pela Administração.", base: L + ", art. 67, §6º; Lei 6.496/1977; Resolução CONFEA 1.137/2023", crit: "critico", antesOS: true },
      { id: "F1.13", etapa: "F1", grupo: "Contratada", titulo: "Relação do pessoal, dos materiais, das máquinas e dos equipamentos", desc: "Pessoal com a documentação regular e recursos compatíveis com a proposta e o cronograma.", base: DNIT + ", item 3.6; " + AP, crit: "importante" },
      { id: "F1.14", etapa: "F1", grupo: "Garantias e seguros", titulo: "Garantia contratual apresentada e conferida", desc: "Modalidade escolhida pelo contratado, valor de até 5% do valor inicial (até 10% se justificado), vigência que cubra todo o prazo do contrato, cláusulas aderentes ao modelo do edital e idoneidade do emissor.", base: L + ", arts. 96 a 98; Circular SUSEP 662/2022", crit: "critico", aplica: GARANTIA, antesOS: true },
      { id: "F1.15", etapa: "F1", grupo: "Garantias e seguros", titulo: "Garantia adicional da proposta inferior a 85% do orçamento", desc: "Equivalente à diferença entre o valor orçado pela Administração e o valor da proposta, sem prejuízo da garantia contratual.", base: L + ", art. 59, §5º", crit: "critico", aplica: { se: "exigeGarantiaAdicional" }, ajuda: "garantiaAdicional", antesOS: true },
      { id: "F1.16", etapa: "F1", grupo: "Garantias e seguros", titulo: "Seguro-garantia com cláusula de retomada", desc: "Até 30% do valor inicial nas obras de grande vulto; seguradora interveniente no contrato, com direito de fiscalizar e de assumir a execução em caso de inadimplemento.", base: L + ", arts. 99 e 102", crit: "critico", aplica: { se: "contrato.garantia.retomada" }, antesOS: true },
      { id: "F1.17", etapa: "F1", grupo: "Garantias e seguros", titulo: "Seguros exigidos no contrato apresentados", desc: "Risco de engenharia, responsabilidade civil e outros previstos, com coberturas, valores e vigências conferidos.", base: "Edital e contrato; " + L + ", art. 103, §2º", crit: "importante", aplica: { se: "contrato.exigeSeguros" }, antesOS: true },
      { id: "F1.18", etapa: "F1", grupo: "Conhecimento do contrato e registros", titulo: "Estudo do contrato, do edital, dos projetos, da proposta e das composições", desc: "Leitura até o completo entendimento do objeto, incluindo critérios de medição, matriz de riscos e documentos da habilitação.", base: AP + "; " + DNIT + ", item 4.1", crit: "importante" },
      { id: "F1.19", etapa: "F1", grupo: "Conhecimento do contrato e registros", titulo: "Processo de fiscalização autuado com a documentação inicial", desc: "Registro próprio de todas as ocorrências: contrato, garantia, designações, projetos, cronograma, ordens de serviço, comunicações e medições.", base: L + ", art. 117, §1º; " + DNIT + ", item 3.6", crit: "importante" },
      { id: "F1.20", etapa: "F1", grupo: "Conhecimento do contrato e registros", titulo: "Contrato registrado no sistema de gestão de contratos", desc: "Valores, aditivos, empenhos e pagamentos mantidos atualizados no sistema do ente.", base: "Sistema do ente; no âmbito federal, Contratos.gov.br (Decreto 13.031/2026); " + DNIT + ", item 4.1, k", crit: "importante", ajustes: [crit("critico", FEDERAL)] },
      { id: "F1.21", etapa: "F1", grupo: "Conhecimento do contrato e registros", titulo: "Registro da obra no Obrasgov.br", desc: "Cadastro e atualização do projeto de investimento com recursos da União.", base: "Decreto 10.496/2020 (Cadastro Integrado de Projetos de Investimento), alterado pelo Decreto 10.899/2021", crit: "importante", aplica: UNIAO },
      { id: "F1.22", etapa: "F1", grupo: "Conhecimento do contrato e registros", titulo: "Matriz de riscos do contrato e riscos da execução disponíveis à fiscalização", desc: "Importe do ObraCheck Planejamento ou registre na aba Riscos a matriz anexa ao contrato e o mapa de riscos da execução.", base: L + ", arts. 22 e 103; " + DNIT + ", item 4.1, h", crit: "importante", auto: "riscos_disponiveis" },

      /* ============================ F2 ============================ */
      { id: "F2.01", etapa: "F2", grupo: "Condições para o início", titulo: "Imóvel com titularidade ou imissão na posse", desc: "A obra só começa em área de titularidade da Administração ou com imissão provisória na posse obtida no processo de desapropriação; o decreto de utilidade pública não basta.", base: "Decreto-Lei 3.365/1941, art. 15; " + AP, crit: "critico", antesOS: true },
      { id: "F2.02", etapa: "F2", grupo: "Condições para o início", titulo: "Áreas e frentes de serviço liberadas", desc: "Desocupação, demolições a cargo da Administração e cronograma de liberação por frente. A não liberação no prazo gera reequilíbrio e permite a extinção a pedido do contratado.", base: L + ", art. 92, §2º, art. 124, §2º, e art. 137, §2º, V", crit: "critico", antesOS: true },
      { id: "F2.03", etapa: "F2", grupo: "Condições para o início", titulo: "Interferências identificadas e remanejamentos acertados com as concessionárias", desc: "Redes de água, esgoto, energia, telecomunicações e gás, com prazos de remanejamento compatíveis com o cronograma.", base: AP, crit: "importante", ajustes: [crit("critico", { se: "terreno.interferencias" })], antesOS: true },
      { id: "F2.04", etapa: "F2", grupo: "Condições para o início", titulo: "Reassentamento concluído nas frentes iniciais", desc: "Famílias e atividades das frentes iniciais reassentadas conforme o plano, com a área desocupada.", base: AP, crit: "critico", aplica: REASSENTAR, antesOS: true },
      { id: "F2.05", etapa: "F2", grupo: "Licenças e aprovações", titulo: "Licença de instalação vigente, com condicionantes repassadas ao contratado", desc: "Licença ou autorização ambiental que permite a implantação, com as condicionantes transformadas em obrigações acompanhadas pela fiscalização.", base: "Resolução CONAMA 237/1997, art. 8º, II; LC 140/2011", crit: "critico", aplica: LICENCIAMENTO, antesOS: true },
      { id: "F2.06", etapa: "F2", grupo: "Licenças e aprovações", titulo: "Autorização de supressão de vegetação e de intervenção em APP", desc: "Autorização do órgão ambiental antes de qualquer supressão ou intervenção.", base: "Lei 12.651/2012", crit: "critico", aplica: AREA_PROTEGIDA, antesOS: true },
      { id: "F2.07", etapa: "F2", grupo: "Licenças e aprovações", titulo: "Outorga de uso de recursos hídricos ou de intervenção em curso d'água", desc: "Captação, lançamento, travessia ou canalização autorizados pelo órgão gestor de recursos hídricos.", base: "Lei 9.433/1997, art. 12", crit: "critico", aplica: { any: [{ se: "saneamento.captacao" }, { campo: "terreno.agua", op: "in", valor: ["curso", "intervencao"] }] }, antesOS: true },
      { id: "F2.08", etapa: "F2", grupo: "Licenças e aprovações", titulo: "Alvará de construção e projeto aprovado na prefeitura", desc: "Projeto legal aprovado e alvará vigente antes do início dos serviços.", base: "Código de obras e legislação municipal; " + AP, crit: "critico", aplica: EDIF, antesOS: true },
      { id: "F2.09", etapa: "F2", grupo: "Licenças e aprovações", titulo: "Projeto aprovado pelo Corpo de Bombeiros", desc: "Projeto de segurança contra incêndio e pânico aprovado.", base: "Legislação estadual de segurança contra incêndio; Lei 13.425/2017", crit: "critico", aplica: EDIF, antesOS: true },
      { id: "F2.10", etapa: "F2", grupo: "Licenças e aprovações", titulo: "Projeto aprovado pela vigilância sanitária", desc: "Projeto físico do estabelecimento assistencial de saúde aprovado.", base: "RDC ANVISA 50/2002", crit: "critico", aplica: SAUDE, antesOS: true },
      { id: "F2.11", etapa: "F2", grupo: "Licenças e aprovações", titulo: "Autorizações do patrimônio cultural e programa de arqueologia", desc: "Autorização para intervenção em bem tombado ou no entorno e acompanhamento arqueológico, quando exigido.", base: "Decreto-Lei 25/1937; Lei 3.924/1961; IN IPHAN 1/2015", crit: "critico", aplica: PATRIMONIO, antesOS: true },
      { id: "F2.12", etapa: "F2", grupo: "Licenças e aprovações", titulo: "Autorização para obras na faixa de domínio de rodovia ou ferrovia", desc: "Autorização do órgão rodoviário ou ferroviário para intervenção na faixa de domínio ou para o acesso.", base: "Normas do órgão rodoviário ou ferroviário", crit: "critico", aplica: { any: [{ se: "terreno.faixaRodovia" }, { se: "viaria.intersecaoRodovia" }] }, antesOS: true },
      { id: "F2.13", etapa: "F2", grupo: "Licenças e aprovações", titulo: "Projeto de blindagem das instalações radiativas aprovado", desc: "Aprovação pela vigilância sanitária ou pela CNEN antes da construção das salas.", base: "Normas da CNEN e da vigilância sanitária", crit: "critico", aplica: { se: "saude.imagem" }, antesOS: true },
      { id: "F2.14", etapa: "F2", grupo: "Projetos e planejamento da execução", titulo: "Projeto executivo aprovado antes da execução de cada parte", desc: "Total, por etapa ou por disciplina, aprovado e disponibilizado ao contratado antes dos serviços correspondentes. Se o projeto executivo couber ao contratado, aprovado pela fiscalização antes da execução.", base: L + ", art. 46, §1º; " + DNIT + ", item 4.3", crit: "critico", aplica: PE_PELA_ADMINISTRACAO, antesOS: true },
      { id: "F2.15", etapa: "F2", grupo: "Projetos e planejamento da execução", titulo: "Projetos do contratado aprovados pela Administração", desc: "Na integrada, o projeto básico e o executivo; na semi-integrada, o executivo e eventuais alterações do básico. A Administração avalia a adequação aos parâmetros do edital e às normas técnicas, vedadas alterações que reduzam qualidade ou vida útil.", base: L + ", art. 46, §§ 3º e 5º", crit: "critico", aplica: INTEGRADA_SEMI, antesOS: true },
      { id: "F2.16", etapa: "F2", grupo: "Projetos e planejamento da execução", titulo: "Cronograma físico-financeiro ajustado ao início real e aprovado", desc: "Cronograma aprovado pelas partes e ajustado à data efetiva de início, base para medir atrasos e desvios.", base: DNIT + ", item 4.3", crit: "critico", antesOS: true },
      { id: "F2.17", etapa: "F2", grupo: "Projetos e planejamento da execução", titulo: "Plano de trabalho, métodos executivos e layout do canteiro aprovados", desc: "Sequência executiva, frentes de serviço, equipamentos e instalações provisórias.", base: AP, crit: "importante" },
      { id: "F2.18", etapa: "F2", grupo: "Projetos e planejamento da execução", titulo: "Reunião inicial registrada em ata", desc: "Reunião com a contratada antes do início, conduzida pelo gestor, com pauta prévia e ata juntada ao processo.", base: DNIT + ", item 4.1, e; " + AP, crit: "importante" },
      { id: "F2.19", etapa: "F2", grupo: "Ordem de serviço e registros", titulo: "Ordem de serviço emitida com a data de início", desc: "Marco inicial do prazo de execução. Deve ser emitida depois de atendidas as condições para o início.", base: "Contrato; " + DNIT + ", item 4.3", crit: "critico", auto: "ordem_servico" },
      { id: "F2.20", etapa: "F2", grupo: "Ordem de serviço e registros", titulo: "Diário de obra aberto", desc: "Registro próprio, físico ou eletrônico, com termo de abertura assinado pela fiscalização e pelo responsável técnico da contratada.", base: L + ", art. 117, §1º", crit: "critico" },
      { id: "F2.21", etapa: "F2", grupo: "Ordem de serviço e registros", titulo: "Placa da obra instalada", desc: "Placa com os responsáveis técnicos e as informações exigidas pelo contrato e pelo concedente dos recursos.", base: "Lei 5.194/1966, art. 16; manual do concedente, se houver", crit: "importante" },
      { id: "F2.22", etapa: "F2", grupo: "Ordem de serviço e registros", titulo: "Matrícula da obra no Cadastro Nacional de Obras (CNO)", desc: "Inscrição providenciada pela contratada responsável pela obra.", base: "IN RFB 2.061/2021", crit: "importante" },
      { id: "F2.23", etapa: "F2", grupo: "Ordem de serviço e registros", titulo: "Comunicação prévia da obra à inspeção do trabalho", desc: "Endereço, contratante, tipo de obra, datas previstas de início e de término e número máximo de trabalhadores.", base: "NR-18; " + AP, crit: "importante" },
      { id: "F2.24", etapa: "F2", grupo: "Mobilização, canteiro e segurança", titulo: "Programas de segurança e saúde da contratada", desc: "Documentos de segurança e saúde exigidos antes da mobilização dos trabalhadores.", base: "NR-1 (PGR), NR-4 (SESMT), NR-5 (CIPA), NR-7 (PCMSO) e NR-18", crit: "critico" },
      { id: "F2.25", etapa: "F2", grupo: "Mobilização, canteiro e segurança", titulo: "Sinalização de obra e desvios de tráfego autorizados", desc: "Projeto de sinalização provisória e desvios aprovados pelo órgão com circunscrição sobre a via antes da intervenção.", base: "Lei 9.503/1997 (CTB), arts. 88 e 95", crit: "importante", aplica: VIAS_E_REDES, ajustes: [crit("critico", VIARIA)] },
      { id: "F2.26", etapa: "F2", grupo: "Mobilização, canteiro e segurança", titulo: "Mobilização da equipe técnica mínima e dos equipamentos exigidos", desc: "Profissionais e equipamentos previstos no edital e na proposta presentes desde o início.", base: "Edital e contrato; " + L + ", art. 67, §6º", crit: "critico" },
      { id: "F2.27", etapa: "F2", grupo: "Mobilização, canteiro e segurança", titulo: "Canteiro e áreas de vivência conforme o projeto e a NR-18", desc: "Instalações provisórias, almoxarifado, escritório da fiscalização e áreas de vivência.", base: "NR-18; projeto do canteiro", crit: "importante" },
      { id: "F2.28", etapa: "F2", grupo: "Mobilização, canteiro e segurança", titulo: "Ligações provisórias de água, energia e esgoto", desc: "Ligações do canteiro aprovadas pelas concessionárias.", base: AP, crit: "importante" },
      { id: "F2.29", etapa: "F2", grupo: "Mobilização, canteiro e segurança", titulo: "Locação da obra conferida", desc: "Conferência da locação, dos marcos topográficos e das referências de nível antes do início dos serviços.", base: "Projeto executivo e levantamento topográfico", crit: "importante", aplica: { any: [EDIF, SANEAMENTO, URBANA, { se: "viaria.oae" }] } },
      { id: "F2.30", etapa: "F2", grupo: "Mobilização, canteiro e segurança", titulo: "Plano de convivência com a unidade em funcionamento", desc: "Horários, isolamento das áreas, rotas de fuga, proteção dos usuários e comunicação com a unidade.", base: "Contrato; NR-18", crit: "critico", aplica: EM_USO, antesOS: true },
      { id: "F2.31", etapa: "F2", grupo: "Mobilização, canteiro e segurança", titulo: "Comunicação prévia à comunidade e aos usuários afetados", desc: "Datas, interdições, desvios e canais de contato divulgados antes do início.", base: L + ", art. 174, §3º, VI, c", crit: "recomendado", aplica: { any: [VIARIA, SANEAMENTO, URBANA, REASSENTAR, EM_USO] } },

      /* ============================ F3 ============================ */
      { id: "F3.01", etapa: "F3", grupo: "Rotina de campo", titulo: "Acompanhamento diário da execução", desc: "Materiais, equipamentos e efetivo suficientes, serviços conforme projeto e especificações e refazimento do que estiver inadequado.", base: L + ", art. 117; " + AP, crit: "critico", periodicidade: "continua" },
      { id: "F3.02", etapa: "F3", grupo: "Rotina de campo", titulo: "Diário de obra atualizado", desc: "Ocorrências, condições climáticas e fatores que interferem no andamento, equipes e equipamentos no canteiro, determinações à contratada e prazos fixados.", base: L + ", art. 117, §1º; " + DNIT + ", item 5.2", crit: "critico", periodicidade: "continua" },
      { id: "F3.03", etapa: "F3", grupo: "Rotina de campo", titulo: "Presença do responsável técnico, do preposto e da equipe mínima", desc: "Profissionais da habilitação efetivamente na obra; no critério de técnica e preço, também os profissionais pontuados.", base: L + ", arts. 67, §6º, e 118; " + AP, crit: "critico", periodicidade: "semanal" },
      { id: "F3.04", etapa: "F3", grupo: "Rotina de campo", titulo: "Uso de EPI, uniformes e crachás", desc: "Equipamentos de proteção individual adequados às atividades e identificação dos empregados.", base: "NR-6; contrato", crit: "importante", periodicidade: "continua" },
      { id: "F3.05", etapa: "F3", grupo: "Rotina de campo", titulo: "Aderência dos serviços aos projetos e às especificações", desc: "Serviços executados conforme projetos, especificações, normas técnicas e métodos aprovados.", base: L + ", art. 117; " + AP, crit: "critico", periodicidade: "semanal" },
      { id: "F3.06", etapa: "F3", grupo: "Rotina de campo", titulo: "Relatório fotográfico da evolução dos serviços", desc: "Registro datado de todos os serviços do período, que sustenta as medições.", base: AP + "; " + DNIT + ", item 5.1", crit: "importante", periodicidade: "semanal" },
      { id: "F3.07", etapa: "F3", grupo: "Rotina de campo", titulo: "Não conformidades notificadas por escrito, com prazo para correção", desc: "Registre cada notificação na aba Ocorrências e acompanhe até a solução.", base: L + ", art. 117, §1º, e art. 119", crit: "critico", periodicidade: "mensal" },
      { id: "F3.08", etapa: "F3", grupo: "Rotina de campo", titulo: "Autor do projeto sem participação na execução", desc: "O autor do anteprojeto, do projeto básico ou do projeto executivo não participa, direta ou indiretamente, da execução, salvo quando o projeto for encargo do contratado. A serviço da Administração, pode apoiar a gestão do contrato, sob supervisão exclusiva de agentes públicos.", base: L + ", art. 14, I e §§ 2º e 4º", crit: "importante", aplica: PE_PELA_ADMINISTRACAO },
      { id: "F3.09", etapa: "F3", grupo: "Materiais e serviços", titulo: "Materiais, amostras e equivalentes aprovados antes do emprego", desc: "Conformidade com a especificação, equivalência técnica demonstrada e decisão registrada.", base: "Edital e especificações; " + L + ", art. 42", crit: "critico" },
      { id: "F3.10", etapa: "F3", grupo: "Materiais e serviços", titulo: "Recebimento de materiais com conferência de notas e de certificados", desc: "Quantidades, especificações, lotes e certificados de qualidade conferidos no recebimento.", base: "Especificações do projeto", crit: "importante", periodicidade: "mensal" },
      { id: "F3.11", etapa: "F3", grupo: "Materiais e serviços", titulo: "Serviços com vícios refeitos às expensas do contratado", desc: "Reparação, correção, remoção, reconstrução ou substituição do que não estiver conforme.", base: L + ", art. 119", crit: "importante", periodicidade: "mensal" },
      { id: "F3.12", etapa: "F3", grupo: "Controle tecnológico", titulo: "Plano de controle tecnológico e laboratório definidos", desc: "Ensaios, frequências e critérios de aceitação de cada serviço, laboratório e rastreabilidade por lote e elemento. Salvo disposição em contrário, os ensaios exigidos por normas técnicas correm por conta do contratado.", base: "Lei 4.150/1962; " + L + ", art. 140, §4º", crit: "critico" },
      { id: "F3.13", etapa: "F3", grupo: "Controle tecnológico", titulo: "Resultados dos ensaios analisados, com não conformidades tratadas", desc: "Resultados conferidos antes da medição dos serviços correspondentes.", base: "Normas técnicas aplicáveis; " + AP, crit: "critico", periodicidade: "medicao" },
      { id: "F3.14", etapa: "F3", grupo: "Controle tecnológico", titulo: "Concreto: recebimento, moldagem e ruptura de corpos de prova", desc: "Controle de aceitação do concreto por lote, com rastreabilidade até o elemento estrutural.", base: "NBR 12655; NBR 7212; NBR 5738; NBR 5739", crit: "critico", aplica: ESTRUTURAS },
      { id: "F3.15", etapa: "F3", grupo: "Controle tecnológico", titulo: "Armaduras e formas liberadas antes de cada concretagem", desc: "Conferência registrada no diário antes do lançamento do concreto.", base: "NBR 14931; NBR 7480", crit: "critico", aplica: ESTRUTURAS },
      { id: "F3.16", etapa: "F3", grupo: "Controle tecnológico", titulo: "Fundações executadas conforme o projeto, com os ensaios previstos", desc: "Cotas, comprimentos, nega ou torque, integridade e provas de carga quando previstas.", base: "NBR 6122; NBR 16903; NBR 13208", crit: "critico", aplica: ESTRUTURAS },
      { id: "F3.17", etapa: "F3", grupo: "Controle tecnológico", titulo: "Aterros e camadas: grau de compactação e umidade", desc: "Ensaios de compactação por camada e liberação antes da camada seguinte.", base: "NBR 7182; DNIT 108/2009-ES", crit: "importante", aplica: { any: [VIARIA, URBANA, SANEAMENTO, { campo: "terreno.declividade", op: "eq", valor: "acentuada" }] }, ajustes: [crit("critico", VIARIA)] },
      { id: "F3.18", etapa: "F3", grupo: "Controle tecnológico", titulo: "Pavimento asfáltico: controle dos materiais e da execução", desc: "Materiais, mistura, temperatura, compactação e espessura controlados por trecho.", base: "DNIT 031/2006-ES; DNIT 141/2010-ES", crit: "critico", aplica: VIARIA },
      { id: "F3.19", etapa: "F3", grupo: "Controle tecnológico", titulo: "Redes de água: estanqueidade, limpeza e desinfecção", desc: "Ensaio de estanqueidade por trecho e limpeza e desinfecção antes da entrada em operação.", base: "NBR 9650; NBR 10156", crit: "critico", aplica: { se: "saneamento.agua" } },
      { id: "F3.20", etapa: "F3", grupo: "Controle tecnológico", titulo: "Redes de esgoto e de drenagem: declividade, assentamento e estanqueidade", desc: "Cotas e declividades conferidas, berço e reaterro conforme o projeto e inspeção antes do recobrimento.", base: "NBR 9814; NBR 15645", crit: "critico", aplica: { any: [{ se: "saneamento.esgoto" }, { se: "saneamento.drenagem" }, { se: "viaria.drenagem" }] } },
      { id: "F3.21", etapa: "F3", grupo: "Controle tecnológico", titulo: "Instalações elétricas inspecionadas e ensaiadas antes da energização", desc: "Inspeção visual, continuidade, isolamento, aterramento, dispositivos de proteção e SPDA.", base: "NBR 5410; NBR 14039; NBR 5419", crit: "critico", aplica: { any: [EDIF, { se: "urbana.iluminacao" }, EQUIP_SANEAMENTO] } },
      { id: "F3.22", etapa: "F3", grupo: "Controle tecnológico", titulo: "Instalações hidrossanitárias e de gás testadas", desc: "Ensaios de estanqueidade e de funcionamento antes do fechamento das paredes e forros.", base: "NBR 5626; NBR 8160; NBR 15526", crit: "importante", aplica: EDIF, ajustes: [crit("critico", { se: "edif.gas" })] },
      { id: "F3.23", etapa: "F3", grupo: "Controle tecnológico", titulo: "Impermeabilização com teste de estanqueidade", desc: "Teste de lâmina d'água antes da proteção mecânica.", base: "NBR 9574", crit: "importante", aplica: EDIF },
      { id: "F3.24", etapa: "F3", grupo: "Controle tecnológico", titulo: "Sistemas de segurança contra incêndio testados", desc: "Hidrantes, chuveiros automáticos, alarme, detecção, iluminação de emergência e sinalização.", base: "Legislação estadual de segurança contra incêndio; NBR 13714; NBR 10897", crit: "critico", aplica: EDIF },
      { id: "F3.25", etapa: "F3", grupo: "Controle tecnológico", titulo: "Gases medicinais: ensaios e certificação", desc: "Estanqueidade, pureza, identificação das redes e certificação antes do uso.", base: "NBR 12188; RDC ANVISA 50/2002", crit: "critico", aplica: { se: "saude.gases" } },
      { id: "F3.26", etapa: "F3", grupo: "Controle tecnológico", titulo: "Climatização: testes, balanceamento e plano de manutenção", desc: "Testes de desempenho, balanceamento de ar e de água e plano de manutenção, operação e controle.", base: "NBR 16401; Lei 13.589/2018", crit: "recomendado", aplica: EDIF, ajustes: [crit("critico", SAUDE)] },
      { id: "F3.27", etapa: "F3", grupo: "Controle tecnológico", titulo: "Elevadores: inspeção e ensaios de entrega", desc: "Inspeção de segurança e ensaios de funcionamento antes da liberação ao uso.", base: "NBR 16858", crit: "importante", aplica: { all: [EDIF, { campo: "edif.pavimentos", op: "gte", valor: 2 }] } },
      { id: "F3.28", etapa: "F3", grupo: "Controle tecnológico", titulo: "Contenções e taludes: execução e monitoramento", desc: "Execução conforme o projeto geotécnico, drenagem e instrumentação, quando prevista.", base: "NBR 11682", crit: "critico", aplica: TALUDES },
      { id: "F3.29", etapa: "F3", grupo: "Controle tecnológico", titulo: "Obras de arte especiais: controle de execução e prova de carga, se prevista", desc: "Controle de fundações, aparelhos de apoio, protensão e geometria.", base: "NBR 7187; NBR 9452", crit: "critico", aplica: { se: "viaria.oae" } },
      { id: "F3.30", etapa: "F3", grupo: "Controle tecnológico", titulo: "Sinalização viária executada conforme o projeto", desc: "Sinalização horizontal, vertical e dispositivos de segurança.", base: "Lei 9.503/1997 (CTB), art. 88; Manual Brasileiro de Sinalização de Trânsito (CONTRAN)", crit: "importante", aplica: VIARIA },
      { id: "F3.31", etapa: "F3", grupo: "Controle tecnológico", titulo: "Equipamentos eletromecânicos de saneamento testados", desc: "Bombas, painéis, válvulas e automação testados quanto ao desempenho especificado.", base: "Especificações e manuais dos fabricantes", crit: "critico", aplica: EQUIP_SANEAMENTO },
      { id: "F3.32", etapa: "F3", grupo: "Controle tecnológico", titulo: "Acessibilidade executada conforme a NBR 9050", desc: "Rotas acessíveis, rampas, sanitários, pisos táteis e sinalização.", base: "NBR 9050; Lei 13.146/2015; Decreto 5.296/2004", crit: "importante", aplica: { any: [EDIF, URBANA, VIA_URBANA] } },
      { id: "F3.33", etapa: "F3", grupo: "Projetos durante a execução", titulo: "Projetos elaborados durante a obra analisados e aprovados", desc: "Análise, aprovação ou rejeição dos projetos entregues pelo contratado antes da execução de cada parte.", base: L + ", art. 46, §§ 3º e 5º; " + AP, crit: "critico", aplica: PE_CONTRATADO },
      { id: "F3.34", etapa: "F3", grupo: "Projetos durante a execução", titulo: "Cadastro como construído (as built) atualizado ao longo da obra", desc: "Alterações de campo registradas progressivamente, para não depender da memória no final da obra.", base: AP, crit: "importante", periodicidade: "mensal" },
      { id: "F3.35", etapa: "F3", grupo: "Projetos durante a execução", titulo: "Modelo BIM atualizado e entregáveis conforme o plano de execução BIM", desc: "Revisões registradas no ambiente comum de dados e entregáveis em formato aberto.", base: "Decreto 10.306/2020; NBR ISO 19650", crit: "importante", aplica: BIM, periodicidade: "mensal" },

      /* ============================ F4 ============================ */
      { id: "F4.01", etapa: "F4", grupo: "Saúde e segurança no trabalho", titulo: "Cumprimento da NR-18 verificado no canteiro", desc: "Inspeção das condições de segurança, com registro e notificação das irregularidades.", base: "NR-18; " + AP, crit: "critico", periodicidade: "semanal" },
      { id: "F4.02", etapa: "F4", grupo: "Saúde e segurança no trabalho", titulo: "Acidentes comunicados e investigados", desc: "Comunicação de acidente de trabalho, análise das causas e medidas corretivas. Registre na aba Ocorrências.", base: "Lei 8.213/1991, art. 22; NR-1", crit: "importante", periodicidade: "mensal" },
      { id: "F4.03", etapa: "F4", grupo: "Meio ambiente", titulo: "Condicionantes da licença ambiental cumpridas", desc: "Programas ambientais executados e relatórios entregues ao órgão licenciador nos prazos.", base: "Resolução CONAMA 237/1997; licença emitida", crit: "critico", aplica: LICENCIAMENTO, periodicidade: "mensal" },
      { id: "F4.04", etapa: "F4", grupo: "Meio ambiente", titulo: "Resíduos da construção segregados e destinados com comprovação", desc: "Transporte e destinação licenciados, com volumes compatíveis com o previsto.", base: "Lei 12.305/2010; Resolução CONAMA 307/2002", crit: "importante", periodicidade: "mensal" },
      { id: "F4.05", etapa: "F4", grupo: "Meio ambiente", titulo: "Supressão vegetal, compensação e plantios conforme a autorização", desc: "Áreas, quantidades e compensações limitadas ao autorizado.", base: "Lei 12.651/2012", crit: "importante", aplica: AREA_PROTEGIDA, periodicidade: "mensal" },
      { id: "F4.06", etapa: "F4", grupo: "Meio ambiente", titulo: "Controle de poeira, ruído, efluentes e lavagem de veículos", desc: "Medidas de controle no canteiro e nas vias de acesso.", base: "NBR 10151; Resolução CONAMA 1/1990", crit: "recomendado", ajustes: [crit("importante", ZONA_URBANA)], periodicidade: "mensal" },
      { id: "F4.07", etapa: "F4", grupo: "Meio ambiente", titulo: "Acompanhamento arqueológico e achados comunicados", desc: "Achados comunicados imediatamente, com suspensão dos serviços no local até a manifestação do órgão.", base: "Lei 3.924/1961; IN IPHAN 1/2015", crit: "critico", aplica: ARQUEOLOGIA, periodicidade: "mensal" },
      { id: "F4.08", etapa: "F4", grupo: "Terceiros e vizinhança", titulo: "Sinalização de obra e desvios mantidos", desc: "Sinalização provisória, iluminação noturna e desvios conforme o projeto aprovado.", base: "Lei 9.503/1997 (CTB), arts. 88 e 95", crit: "importante", aplica: VIAS_E_REDES, ajustes: [crit("critico", VIARIA)], periodicidade: "semanal" },
      { id: "F4.09", etapa: "F4", grupo: "Terceiros e vizinhança", titulo: "Segurança de pedestres e acessibilidade no entorno da obra", desc: "Passeios protegidos, rotas alternativas acessíveis e tapumes conservados.", base: "NBR 9050; legislação municipal", crit: "importante", aplica: ZONA_URBANA, periodicidade: "semanal" },
      { id: "F4.10", etapa: "F4", grupo: "Terceiros e vizinhança", titulo: "Convivência com a unidade em funcionamento", desc: "Isolamento, horários, rotas de fuga e proteção dos usuários conforme o plano.", base: "Contrato; NR-18", crit: "critico", aplica: EM_USO, periodicidade: "semanal" },
      { id: "F4.11", etapa: "F4", grupo: "Terceiros e vizinhança", titulo: "Comunicação com a comunidade e tratamento de reclamações", desc: "Canal de atendimento, registro das reclamações e respostas.", base: L + ", art. 174, §3º, VI, c", crit: "recomendado", aplica: { any: [VIARIA, SANEAMENTO, URBANA, REASSENTAR] }, ajustes: [crit("importante", REASSENTAR)], periodicidade: "mensal" },
      { id: "F4.12", etapa: "F4", grupo: "Terceiros e vizinhança", titulo: "Reassentamento conforme o plano e liberação das frentes", desc: "Famílias e atividades atendidas conforme o plano e frentes liberadas no cronograma.", base: AP, crit: "critico", aplica: REASSENTAR, periodicidade: "mensal" },
      { id: "F4.13", etapa: "F4", grupo: "Terceiros e vizinhança", titulo: "Danos a terceiros e a redes de concessionárias registrados e tratados", desc: "O contratado responde pelos danos causados na execução; a fiscalização não exclui nem reduz essa responsabilidade.", base: L + ", art. 120", crit: "importante", periodicidade: "mensal" },

      /* ============================ F5 ============================ */
      { id: "F5.01", etapa: "F5", grupo: "Cronograma", titulo: "Evolução física comparada ao cronograma", desc: "Executado comparado ao previsto, desvios e frentes críticas identificados e recuperação de atrasos cobrada formalmente.", base: AP + "; " + DNIT + ", item 8.1", crit: "critico", periodicidade: "semanal" },
      { id: "F5.02", etapa: "F5", grupo: "Cronograma", titulo: "Cronograma físico-financeiro atualizado", desc: "Cronograma revisado após aditivos, paralisações e replanejamentos, aprovado pela fiscalização.", base: "Contrato", crit: "importante", periodicidade: "mensal" },
      { id: "F5.03", etapa: "F5", grupo: "Prazos", titulo: "Prazos de execução e de vigência acompanhados", desc: "Prazo de execução contado da ordem de serviço; prazo de vigência contado da assinatura. Nos contratos de escopo, a vigência se prorroga automaticamente enquanto o objeto não for concluído.", base: L + ", arts. 105 e 111", crit: "critico", auto: "prazos" },
      { id: "F5.04", etapa: "F5", grupo: "Prazos", titulo: "Interferências e fatos da Administração que afetam o prazo resolvidos", desc: "É proibido à Administração retardar imotivadamente a execução da obra ou de suas parcelas.", base: L + ", art. 115, §1º", crit: "critico", periodicidade: "mensal" },
      { id: "F5.05", etapa: "F5", grupo: "Prazos", titulo: "Atrasos atribuíveis ao contratado notificados e apurados", desc: "O atraso injustificado sujeita o contratado à multa de mora prevista no edital ou no contrato.", base: L + ", art. 162", crit: "importante", periodicidade: "mensal" },
      { id: "F5.06", etapa: "F5", grupo: "Paralisações e prorrogações", titulo: "Paralisações por ordem escrita e registradas por apostila", desc: "O cronograma é prorrogado automaticamente pelo tempo da paralisação, anotada por apostila.", base: L + ", art. 115, §5º; " + DNIT + ", item 4.4.1", crit: "critico", auto: "paralisacoes" },
      { id: "F5.07", etapa: "F5", grupo: "Paralisações e prorrogações", titulo: "Aviso público de obra paralisada há mais de um mês", desc: "Aviso no sítio oficial e em placa no local, com o motivo, o responsável e a data prevista para o reinício.", base: L + ", art. 115, §§ 6º e 7º", crit: "critico", auto: "aviso_paralisacao" },
      { id: "F5.08", etapa: "F5", grupo: "Paralisações e prorrogações", titulo: "Prorrogações justificadas, autorizadas e formalizadas antes do término", desc: "Justificativa escrita, autorização prévia da autoridade, provas quando o pedido for do contratado e endosso da garantia.", base: L + ", arts. 111 e 132; " + AP, crit: "critico", auto: "prorrogacoes" },

      /* ============================ F6 ============================ */
      { id: "F6.01", etapa: "F6", grupo: "Medição", titulo: "Medições registradas na periodicidade do contrato", desc: "Medição dos serviços executados em cada período, com o processo de suporte documental. Nas obras, a medição é mensal sempre que compatível com o regime de execução.", base: L + ", art. 92, VI e §5º; contrato", crit: "critico", auto: "medicoes_registradas" },
      { id: "F6.02", etapa: "F6", grupo: "Medição", titulo: "Verificações de cada medição concluídas", desc: "Medição conjunta, conferência no local, memória de cálculo, fotos, critérios do contrato, saldo, regularidade, nota fiscal e ateste.", base: "Lei 4.320/1964, arts. 62 e 63; " + DNIT + ", item 6; " + AP, crit: "critico", auto: "medicoes_checklist" },
      { id: "F6.03", etapa: "F6", grupo: "Medição", titulo: "Critérios de medição do contrato aplicados", desc: "Unidades, regras de medição e de pagamento e itens conforme o termo de referência e o contrato.", base: L + ", art. 92, VI; termo de referência", crit: "critico" },
      { id: "F6.04", etapa: "F6", grupo: "Medição", titulo: "Pagamento por etapas ou eventos concluídos do cronograma", desc: "Nos regimes de preço global, a medição e o pagamento seguem etapas do cronograma vinculadas a metas de resultado, vedada a remuneração por quantidades de itens unitários.", base: L + ", art. 46, §9º", crit: "critico", aplica: PRECO_GLOBAL },
      { id: "F6.05", etapa: "F6", grupo: "Medição", titulo: "Medição pelas quantidades efetivamente executadas", desc: "Na empreitada por preço unitário, pagam-se as quantidades executadas e medidas, com memória de cálculo; acompanhe a evolução em relação à planilha.", base: "Lei 4.320/1964, art. 63; " + L + ", art. 6º, XXVIII", crit: "critico", aplica: UNITARIO },
      { id: "F6.06", etapa: "F6", grupo: "Medição", titulo: "Glosas de serviços não aceitos registradas e justificadas", desc: "Serviços em desacordo com as especificações não são medidos até a correção.", base: "Lei 4.320/1964, art. 63; " + DNIT + ", item 2", crit: "importante", periodicidade: "mensal" },
      { id: "F6.07", etapa: "F6", grupo: "Medição", titulo: "Saldo contratual de cada serviço verificado", desc: "Insuficiência de saldo leva a pedido motivado de alteração do projeto e termo aditivo antes da execução.", base: AP, crit: "importante", periodicidade: "medicao" },
      { id: "F6.08", etapa: "F6", grupo: "Pagamento", titulo: "Regularidade fiscal, previdenciária e trabalhista antes de cada pagamento", desc: "Em regra, a irregularidade não autoriza reter o pagamento do serviço executado (jurisprudência do TCU): notifique para regularizar, sob pena de extinção e de sanção, e registre a ocorrência.", base: L + ", art. 92, XVI; Constituição Federal, art. 195, §3º; no âmbito federal, SICAF", crit: "critico", periodicidade: "medicao" },
      { id: "F6.09", etapa: "F6", grupo: "Pagamento", titulo: "Retenções tributárias e previdenciárias conferidas", desc: "ISS conforme a legislação municipal, contribuição previdenciária quando cabível e tributos federais retidos pelos órgãos federais; verifique divergências entre o ISS declarado e o recolhido.", base: "Lei 8.212/1991, art. 31; IN RFB 2.110/2022; IN RFB 1.234/2012; legislação do ISS; LC 214/2025", crit: "importante", periodicidade: "medicao" },
      { id: "F6.10", etapa: "F6", grupo: "Pagamento", titulo: "Ordem cronológica de pagamentos observada", desc: "Pagamentos na ordem cronológica de cada fonte de recursos, com justificativa publicada para eventual alteração.", base: L + ", art. 141; IN SEGES/ME 77/2022 (âmbito federal)", crit: "critico" },
      { id: "F6.11", etapa: "F6", grupo: "Pagamento", titulo: "Pagamentos no prazo, com atualização monetária se houver atraso", desc: "Atraso superior a dois meses autoriza o contratado a suspender a execução ou pedir a extinção do contrato.", base: L + ", art. 92, V, e art. 137, §2º, IV", crit: "critico", auto: "pagamentos" },
      { id: "F6.12", etapa: "F6", grupo: "Pagamento", titulo: "Sem pagamento antecipado e com liberação da parcela incontroversa", desc: "Pagamento somente do executado e aceito; havendo controvérsia sobre dimensão, qualidade ou quantidade, a parcela incontroversa é paga no prazo.", base: L + ", arts. 143 e 145", crit: "importante" },
      { id: "F6.13", etapa: "F6", grupo: "Pagamento", titulo: "Saldo de empenho acompanhado, com reforço ou inscrição em restos a pagar", desc: "Saldo compatível com o cronograma do exercício e providências antes do encerramento do exercício.", base: "Lei 4.320/1964, arts. 36 e 60; " + AP, crit: "importante", periodicidade: "mensal" },
      { id: "F6.14", etapa: "F6", grupo: "Pagamento", titulo: "Materiais asfálticos com critério próprio de pagamento ou de reajuste", desc: "Quando o contrato separa o ligante asfáltico dos serviços de pavimentação, confira o critério de pagamento e de reajuste.", base: "DNIT, IS/DG 10/2019 (âmbito do DNIT)", crit: "recomendado", aplica: VIARIA },
      { id: "F6.15", etapa: "F6", grupo: "Obrigações trabalhistas e mão de obra", titulo: "Obrigações trabalhistas e previdenciárias dos empregados da obra", desc: "Verificação mensal das obrigações do empregador com os trabalhadores vinculados ao contrato.", base: "Constituição Federal, art. 195, §3º; " + L + ", art. 121, §1º; Decreto 12.174/2024 (garantias trabalhistas, âmbito federal); " + AP, crit: "critico", periodicidade: "mensal" },
      { id: "F6.16", etapa: "F6", grupo: "Obrigações trabalhistas e mão de obra", titulo: "Obrigações das subcontratadas verificadas", desc: "As mesmas verificações trabalhistas e previdenciárias aplicadas às subcontratadas.", base: L + ", art. 122; " + AP, crit: "importante", aplica: SUBCONTRATACAO, periodicidade: "mensal" },
      { id: "F6.17", etapa: "F6", grupo: "Obrigações trabalhistas e mão de obra", titulo: "Reserva de cargos e cotas de mão de obra cumpridas", desc: "Reserva de cargos para pessoa com deficiência, reabilitados e aprendizes durante toda a execução e cotas previstas no edital.", base: L + ", arts. 25, §9º, 92, XVII, e 116; Decreto 11.430/2023", crit: "importante", periodicidade: "trimestral" },
      { id: "F6.18", etapa: "F6", grupo: "Obrigações trabalhistas e mão de obra", titulo: "Processo de pagamento organizado e atualizado", desc: "Documentos de cada medição e pagamento reunidos e relacionados ao processo de suporte documental.", base: AP + "; " + DNIT + ", item 6.1.4", crit: "recomendado", periodicidade: "mensal" },

      /* ============================ F7 ============================ */
      { id: "F7.01", etapa: "F7", grupo: "Termos aditivos e apostilas", titulo: "Aditivos e apostilas com as verificações concluídas", desc: "Cada registro da aba Alterações traz as verificações aplicáveis à sua natureza.", base: L + ", arts. 124 a 136; " + AP, crit: "critico", auto: "alteracoes_checklist" },
      { id: "F7.02", etapa: "F7", grupo: "Termos aditivos e apostilas", titulo: "Limites de acréscimos e de supressões respeitados, sem compensação", desc: "Conjunto de acréscimos e conjunto de supressões calculados separadamente sobre o valor inicial atualizado.", base: L + ", art. 125; Acórdão 2.819/2011-TCU-Plenário", crit: "critico", auto: "limites" },
      { id: "F7.03", etapa: "F7", grupo: "Termos aditivos e apostilas", titulo: "Aditivos formalizados antes da execução das alterações", desc: "Salvo justificada antecipação de efeitos, com formalização em até um mês.", base: L + ", art. 132", crit: "critico" },
      { id: "F7.04", etapa: "F7", grupo: "Termos aditivos e apostilas", titulo: "Desconto da licitação preservado nas alterações", desc: "Serviços novos com a relação entre proposta e orçamento aplicada aos preços de referência; aditivos não reduzem, em favor do contratado, a diferença entre o valor contratado e o referencial.", base: L + ", arts. 127 e 128", crit: "critico" },
      { id: "F7.05", etapa: "F7", grupo: "Reajuste e reequilíbrio", titulo: "Reajuste anual aplicado por apostila", desc: "A cada doze meses da data-base do orçamento estimado, pelo índice do contrato.", base: L + ", art. 25, §7º, art. 92, §3º, e art. 136, I; Lei 10.192/2001", crit: "critico", auto: "reajuste" },
      { id: "F7.06", etapa: "F7", grupo: "Reajuste e reequilíbrio", titulo: "Pedidos de reequilíbrio instruídos e decididos no prazo", desc: "Concluída a instrução, a decisão deve ocorrer em até um mês, prorrogável por igual período.", base: L + ", arts. 123, 124, II, d, e 131", crit: "critico", auto: "pleitos" },
      { id: "F7.07", etapa: "F7", grupo: "Reajuste e reequilíbrio", titulo: "Matriz de riscos aplicada às alterações e aos pedidos de reequilíbrio", desc: "Atendidas as condições da matriz, o equilíbrio é considerado mantido quanto aos riscos assumidos pelo contratado, salvo alterações unilaterais e tributos supervenientes.", base: L + ", art. 103, §5º", crit: "critico", aplica: MATRIZ },
      { id: "F7.08", etapa: "F7", grupo: "Reajuste e reequilíbrio", titulo: "Alterações na integrada ou na semi-integrada restritas às hipóteses legais", desc: "Caso fortuito ou força maior, adequação técnica a pedido da Administração sem erro do contratado, alteração do projeto na semi-integrada e evento alocado à Administração na matriz.", base: L + ", art. 133", crit: "critico", aplica: INTEGRADA_SEMI },
      { id: "F7.09", etapa: "F7", grupo: "Reajuste e reequilíbrio", titulo: "Falhas de projeto com apuração de responsabilidade do projetista", desc: "Alterações decorrentes de falhas de projeto ensejam a apuração de responsabilidade e o ressarcimento dos danos.", base: L + ", art. 124, §1º, e art. 140, §5º", crit: "importante" },
      { id: "F7.10", etapa: "F7", grupo: "Reajuste e reequilíbrio", titulo: "Limite de alterações por falhas de projeto em preço global com recursos da União", desc: "Alterações por falhas ou omissões do projeto limitadas, no conjunto, a 10% do valor total do contrato, quando a regra for aplicável ao contrato.", base: "Decreto 7.983/2013, art. 13, II; " + DNIT + ", item 4.4", crit: "importante", aplica: { all: [{ regime: ["global", "integral"] }, UNIAO] } },
      { id: "F7.11", etapa: "F7", grupo: "Reajuste e reequilíbrio", titulo: "Garantia reforçada e endossada após aditivos e reajustes", desc: "Garantia proporcional ao valor atualizado e vigência acompanhando o novo prazo, mediante endosso da apólice.", base: L + ", art. 97, I; " + AP, crit: "critico", aplica: GARANTIA, auto: "garantia_atualizada" },
      { id: "F7.12", etapa: "F7", grupo: "Reajuste e reequilíbrio", titulo: "Compatibilidade dos preços com o mercado verificada periodicamente", desc: "Acompanhamento da economicidade, especialmente de serviços com quantidades crescentes.", base: AP, crit: "recomendado", periodicidade: "trimestral" },

      { id: "F8.01", etapa: "F8", grupo: "Riscos e ocorrências", titulo: "Riscos da execução monitorados e mapa de riscos atualizado", desc: "Reavaliação dos riscos identificados, novas ameaças e acompanhamento das medidas preventivas.", base: DNIT + ", item 4.1, h; " + AP, crit: "critico", periodicidade: "mensal" },

      { id: "F9.01", etapa: "F9", grupo: "Recebimento provisório", titulo: "Comunicação escrita de término pelo contratado", desc: "Marco para a vistoria e para o prazo do recebimento provisório.", base: L + ", art. 140; " + AP, crit: "critico", auto: "comunicacao_termino" },

      { id: "F9.20", etapa: "F9", grupo: "Recebimento definitivo e encerramento", titulo: "Termo de recebimento definitivo por servidor ou comissão distinta", desc: "Emitido por servidor ou comissão designada pela autoridade, depois do prazo de observação ou de vistoria que comprove a adequação; quem recebeu provisoriamente não participa. O recebimento não exclui a responsabilidade civil pela solidez e pela segurança da obra nem a ético-profissional.", base: L + ", art. 140, I, b, e §2º; " + DNIT + ", item 7", crit: "critico", auto: "trd" },
      { id: "F9.21", etapa: "F9", grupo: "Recebimento definitivo e encerramento", titulo: "Garantia contratual liberada somente após a execução", desc: "Liberação ou restituição após a fiel execução do contrato, com atualização monetária quando em dinheiro.", base: L + ", art. 100", crit: "importante", aplica: GARANTIA },

      { id: "AF.01", titulo: "Regime de preço global", texto: "Medição e pagamento por etapas concluídas do cronograma vinculadas a metas de resultado (art. 46, §9º). Confira o eventograma do contrato antes de cada medição.", se: PRECO_GLOBAL },
      { id: "AF.02", titulo: "Empreitada por preço unitário", texto: "Pague somente as quantidades executadas e medidas, com memória de cálculo. Acompanhe a evolução das quantidades em relação à planilha para antecipar aditivos e evitar o jogo de planilha (art. 128).", se: UNITARIO },
      { id: "AF.03", titulo: "Contratação integrada ou semi-integrada", texto: "Alterações de valor restritas às hipóteses do art. 133; os riscos do projeto elaborado pelo contratado não geram reequilíbrio. Aprove os projetos do contratado antes da execução de cada parte (art. 46, §3º).", se: INTEGRADA_SEMI },
      { id: "AF.04", titulo: "Contratação de grande vulto", texto: "Exija a comprovação do programa de integridade em até seis meses (art. 25, §4º) e avalie reforçar a equipe de fiscalização ou contratar apoio técnico.", se: GRANDE_VULTO },
      { id: "AF.05", titulo: "Recursos da União", texto: "Mantenha o Obrasgov.br atualizado e siga as regras do concedente para medição, placa, relatórios e prestação de contas.", se: UNIAO },
      { id: "AF.06", titulo: "Estabelecimento de saúde", texto: "Coordene a instalação dos equipamentos médico-hospitalares, o comissionamento de gases e de climatização e a vistoria da vigilância sanitária antes da ocupação.", se: SAUDE },
      { id: "AF.07", titulo: "Edificação escolar", texto: "Planeje as entregas e as interferências com o calendário letivo e confirme mobiliário e equipamentos como contratações correlatas.", se: ESCOLAR },
      { id: "AF.08", titulo: "Obra rodoviária", texto: "Sinalização de obras e desvios autorizados pelo órgão com circunscrição sobre a via (CTB, art. 95), controle tecnológico por camada e recebimento com avaliação de irregularidade e deflexões.", se: VIA_RODOVIARIA },
      { id: "AF.09", titulo: "Saneamento", texto: "Testes de estanqueidade e desinfecção antes da operação, cadastro técnico das redes e pré-operação assistida com o prestador.", se: SANEAMENTO },
      { id: "AF.10", titulo: "Edificação em funcionamento durante a obra", texto: "Siga o plano de convivência e registre como fato da Administração as restrições impostas pela unidade que afetarem o prazo.", se: EM_USO },
      { id: "AF.11", titulo: "Reforma de edifício", texto: "O limite de acréscimos é de 50% do valor inicial atualizado; as supressões continuam limitadas a 25% (art. 125).", se: REFORMA_EDIF },
      { id: "AF.12", titulo: "Licenciamento a cargo do contratado", texto: "O contratado obtém as licenças e responde pelo risco correspondente. O atraso nas licenças não justifica reequilíbrio se o risco foi alocado a ele.", se: LIC_CONTRATADO },
      { id: "AF.13", titulo: "Desapropriação ou reassentamento", texto: "Libere as frentes conforme o cronograma: a não liberação gera reequilíbrio (art. 124, §2º) e permite a extinção a pedido do contratado (art. 137, §2º, V).", se: { any: [DESAPROPRIAR, REASSENTAR] } },
      { id: "AF.14", titulo: "Contrato com matriz de riscos", texto: "Atendidas as condições da matriz, o equilíbrio é considerado mantido quanto aos riscos assumidos pelo contratado, salvo alterações unilaterais e tributos supervenientes (art. 103, §5º). Consulte a matriz antes de analisar pleitos.", se: MATRIZ },
      { id: "AF.15", titulo: "Apoio de empresa supervisora", texto: "A supervisora assiste a fiscalização, mas não pratica atos próprios do fiscal: ateste, notificações e recebimento continuam com os designados (art. 117, §4º).", se: SUPERVISORA },
      { id: "AF.16", titulo: "Julgamento por técnica e preço", texto: "Os profissionais pontuados na proposta técnica devem atuar efetivamente na obra; substituições só por experiência equivalente ou superior, aprovadas pela Administração.", se: TECNICA_PRECO },
      { id: "AF.17", titulo: "Proposta inferior a 85% do orçamento", texto: "Exija a garantia adicional (art. 59, §5º) e intensifique o controle de qualidade e de produtividade, pois há maior risco de inexequibilidade.", se: { se: "exigeGarantiaAdicional" } },
      { id: "AF.18", titulo: "Contratação em BIM", texto: "Exija os entregáveis em formato aberto e o modelo como construído atualizado, com as revisões registradas no ambiente comum de dados.", se: BIM },
      { id: "AF.19", titulo: "Patrimônio cultural ou arqueológico", texto: "Comunique imediatamente achados arqueológicos e suspenda os serviços no local até a manifestação do órgão de patrimônio.", se: PATRIMONIO },
      { id: "AF.20", titulo: "Subcontratação admitida", texto: "Controle cada subcontratação: parcela autorizada, capacidade técnica, regularidade e obrigações trabalhistas (art. 122).", se: SUBCONTRATACAO },
      { id: "AF.21", titulo: "Garantia quinquenal em curso", texto: "Durante os cinco anos seguintes ao recebimento definitivo, inspecione a obra ao menos uma vez por ano e notifique o contratado sobre os vícios. A ação deve ser proposta em até 180 dias do aparecimento do vício (Código Civil, art. 618, parágrafo único).", se: { campo: "fase", op: "eq", valor: "garantia" } },

    garantia_atualizada: function (cfg, doc, res) {

    },
    garantia_validade: function (cfg, doc, res) {
      var s = res.sit;
      if (!s.garantiaValidade) return { ok: false, detalhe: "Informe a validade da garantia no cadastro" };
      if (doc.contrato.dataTRD) return { ok: true, detalhe: "Contrato recebido definitivamente; validade da garantia até " + br(s.garantiaValidade) };
      if (s.garantiaVencida) return { ok: false, falha: true, detalhe: "Garantia vencida em " + br(s.garantiaValidade) };
      if (s.garantiaCobre === false) return { ok: false, falha: true, detalhe: "Validade " + br(s.garantiaValidade) + " não cobre o contrato até " + br(s.coberturaNecessaria) };
      if (s.garantiaVencendo) return { ok: false, parcial: true, detalhe: "Garantia vence em " + br(s.garantiaValidade) };

    },
    notificacoes: function (cfg, doc, res) {
      var l = (doc.ocorrencias || []).filter(function (x) { return x.tipo === "notificacao"; });
      if (!l.length) return { ok: true, vazio: true, detalhe: "Nenhuma notificação registrada" };
      var v = res.sit.notificacoesVencidas;
      if (v.length) return { ok: false, falha: true, detalhe: "Prazo vencido sem solução: notificação " + listaIds(v, rotOcorrencia) };
      var abertas = l.filter(function (x) { return x.situacao !== "encerrada"; });
      return { ok: true, detalhe: abertas.length ? abertas.length + " notificação(ões) dentro do prazo" : "Notificações atendidas" };
    },
    subcontratacoes: function (cfg, doc, res) {
      var l = (doc.ocorrencias || []).filter(function (x) { return x.tipo === "subcontratacao"; });
      if (!l.length) return { ok: true, vazio: true, detalhe: "Nenhuma subcontratação registrada" };
      var falta = l.filter(function (x) { return pendentesRegistro(cfg, res.ctx, "ocorrencia", x).length; });
      return { ok: !falta.length, parcial: true, detalhe: falta.length ? "Verificações pendentes: " + listaIds(falta, rotOcorrencia) : l.length + " subcontratação(ões) verificada(s)" };
    },
    sancoes: function (cfg, doc, res) {
      var l = res.sit.sancoes;
      if (!l.length) return { ok: true, vazio: true, detalhe: "Nenhum processo sancionatório registrado" };
      var ceis = l.filter(function (x) { return x.ceisPendente; });
      if (ceis.length) return { ok: false, falha: true, detalhe: "Registro no CEIS ou CNEP fora do prazo: " + listaIds(ceis, function (x) { return rotOcorrencia(x.o); }) };
      var falta = l.filter(function (x) { return pendentesRegistro(cfg, res.ctx, "ocorrencia", x.o).length; });
      return { ok: !falta.length, parcial: true, detalhe: falta.length ? "Etapas pendentes: " + listaIds(falta, function (x) { return rotOcorrencia(x.o); }) : "Processos com as etapas concluídas" };
    },
    comunicacao_termino: function (cfg, doc) {
      var c = doc.contrato;
      if (c.dataComunicacaoTermino) return { ok: true, detalhe: "Comunicação recebida em " + br(c.dataComunicacaoTermino) };
      if (verdade(c.extinto)) return { ok: true, vazio: true, detalhe: "Contrato extinto antes da conclusão" };
      return { aguardando: "Conclusão dos serviços" };
    },
    trp: function (cfg, doc, res) {
      var c = doc.contrato, s = res.sit;
      if (!c.dataComunicacaoTermino) return verdade(c.extinto) ? { ok: true, vazio: true, detalhe: "Contrato extinto: termo de vistoria (F9.27)" } : { aguardando: "Comunicação de término" };
      if (c.dataTRP) return { ok: true, detalhe: "Emitido em " + br(c.dataTRP) + (c.recebProvisorioPor ? " por " + c.recebProvisorioPor : "") + (s.trpForaPrazo ? ", depois do prazo (" + br(s.trpPrazo) + ")" : "") };
      return { ok: false, falha: s.trpAtrasado, parcial: !s.trpAtrasado, detalhe: (s.trpAtrasado ? "Prazo encerrado em " : "Prazo até ") + br(s.trpPrazo) };
    },
    trd: function (cfg, doc, res) {
      var c = doc.contrato, s = res.sit;
      if (!c.dataTRP) return verdade(c.extinto) ? { ok: true, vazio: true, detalhe: "Contrato extinto antes da conclusão" } : { aguardando: "Recebimento provisório" };
      if (c.dataTRD) {
        if (s.mesmoRecebedor) return { ok: false, falha: true, detalhe: "Emitido em " + br(c.dataTRD) + " pelo mesmo agente do recebimento provisório" };
        return { ok: true, detalhe: "Emitido em " + br(c.dataTRD) + (c.recebDefinitivoPor ? " por " + c.recebDefinitivoPor : "") + "; garantia quinquenal até " + br(s.garantiaObraAte) };
      }
      return { ok: false, falha: s.trdAtrasado, parcial: !s.trdAtrasado, detalhe: (s.trdAtrasado ? "Prazo encerrado em " : "Prazo até ") + br(s.trdPrazo) };
    }
