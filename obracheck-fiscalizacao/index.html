  function estadoItem(cfg, doc, it, res) {
    var reg = registro(doc, it.id), sit = res.sit, status, autoRes = null;
    var e = { reg: reg, aguardando: null, vencida: false, proxima: null, ultima: null, encerrada: false };
    if (it.auto) {
      autoRes = AUTO[it.auto] ? AUTO[it.auto](cfg, doc, res) : { ok: false, detalhe: "Verificação não encontrada" };
      if (autoRes.aguardando) { e.aguardando = autoRes.aguardando; status = "nao_verificado"; }
      else status = autoRes.ok ? "conforme" : (autoRes.falha ? "nao_conforme" : (autoRes.parcial ? "em_andamento" : "nao_verificado"));
    } else status = reg.status || "nao_verificado";
    if (it.periodicidade && !it.auto && status !== "na") {
      var et = etapaDef(cfg, it.etapa), rotina = et && et.rotina, per = (cfg.periodicidades || {})[it.periodicidade] || {};
      e.ultima = reg.ultimaVerificacao || null;
      if (rotina === "posobra") {
        if (!doc.contrato.dataTRD) e.aguardando = "Recebimento definitivo";
        else if (sit.fase === "encerrado") e.encerrada = true;
      } else {
        if (!sit.execucaoIniciada) e.aguardando = "Início da execução (ordem de serviço)";
        else if (sit.execucaoEncerrada) e.encerrada = true;
        else if (sit.paralisacaoAberta && it.periodicidade !== "medicao") e.suspensa = true;
      }
      if (!e.aguardando && !e.encerrada && !e.suspensa) {
        if (it.periodicidade === "medicao") {
          var ult = sit.ultimaMedicao;
          if (!ult) e.aguardando = "Primeira medição";
          else {
            var fimUlt = ult.fim || ult.inicio || ult.dataAteste || "";
            e.vencida = !e.ultima || e.ultima < fimUlt;
            e.proxima = e.vencida ? fimUlt : null;
            e.medicaoRef = ult.numero;
          }
        } else if (per.dias) {
          var base = e.ultima || (rotina === "posobra" ? doc.contrato.dataTRD : sit.inicio);
          e.proxima = somarDias(base, per.dias);
          e.vencida = hoje() > e.proxima;
        }
      }
    }
    var ok = resolvidoStatus(reg, status) && !e.vencida;
    if (it.auto) ok = !!(autoRes && autoRes.ok) && !e.aguardando;
    /* nas etapas da rotina de execução, o item manual não periódico "em acompanhamento"
       indica serviço em curso ou ainda não executado: não é pendência crítica */
    var etR = etapaDef(cfg, it.etapa);
    var acompanhamento = !ok && !it.auto && !it.periodicidade && status === "em_andamento" && !!(etR && etR.rotina === "execucao");
    var atrasado = !ok && !e.aguardando && !!reg.dataPrevista && reg.dataPrevista < hoje();
    var conferencia = null;
    if (it.conteudo) {
      var ks = chavesConteudo(it.conteudo), marcados = Array.isArray(reg.conferidos) ? reg.conferidos : [];
      conferencia = { total: ks.length, feitos: ks.filter(function (k) { return marcados.indexOf(k) >= 0; }).length };
    }
    return {
      status: status, resolvido: ok, auto: autoRes, reg: reg, atrasado: atrasado, vazio: !!(autoRes && autoRes.vazio), conferencia: conferencia,
      aguardando: e.aguardando, vencida: e.vencida, proxima: e.proxima, ultima: e.ultima, encerrada: e.encerrada, suspensa: !!e.suspensa,
      medicaoRef: e.medicaoRef || null, naoConforme: status === "nao_conforme", acompanhamento: acompanhamento
    };
  }

  /* --------------------------- inconsistências --------------------------- */
  function inconsistencias(cfg, doc, res) {
    var L = [];
    var o = doc.obra || {}, c = doc.contrato || {}, s = res.sit, P = cfg.parametros;
    var est = function (id) { return res.estados[id] || null; };
    var conf = function (id) { var e = est(id); return !!(e && e.status === "conforme"); };
    var add = function (id, nivelI, titulo, detalhe, etapa, extra) { L.push(mesclar({ id: id, nivel: nivelI, titulo: titulo, detalhe: detalhe || "", etapa: etapa || null }, extra || {})); };
    var listar = function (l, f) { return listaIds(l, f || function (x) { return x.id; }); };

    var faltam = [];
    if (!o.nome) faltam.push("nome da obra");
    if (!o.tipologia) faltam.push("tipologia");
    if (!o.regime) faltam.push("regime de execução");
    if (!c.numero) faltam.push("nº do contrato");
    if (!c.contratada) faltam.push("contratada");
    if (num(c.valorInicial) == null) faltam.push("valor inicial");
    if (!c.dataAssinatura) faltam.push("data de assinatura");
    if (num(c.prazoExecucaoDias) == null) faltam.push("prazo de execução");
    if (faltam.length) add("INC.01", "aviso", "Cadastro incompleto", "Preencha: " + faltam.join(", ") + ". As exigências e os cálculos dependem desses dados.", null, { visao: "cadastro" });

    if (s.pncpAtrasado) add("INC.02", "erro", "Contrato não divulgado no PNCP no prazo", "O prazo de divulgação terminou em " + br(s.pncpPrazo) + ". A divulgação é condição de eficácia do contrato (art. 94).", "F1");
    else if (s.pncpForaPrazo) add("INC.02", "aviso", "Contrato divulgado no PNCP depois do prazo", "Divulgado em " + br(c.dataPNCP) + "; o prazo terminava em " + br(s.pncpPrazo) + " (art. 94).", "F1");
    if (s.semEficaciaNaOS) add("INC.03", "erro", "Ordem de serviço anterior à divulgação no PNCP", "A execução começou em " + br(s.inicio) + (c.dataPNCP ? " e a divulgação ocorreu em " + br(c.dataPNCP) : " sem divulgação registrada") + ". A divulgação é condição de eficácia (art. 94).", "F1");
    if (s.execucaoIniciada) {
      var antes = res.ativos.filter(function (it) { var e = est(it.id); return it.antesOS && it.crit === "critico" && e && !e.resolvido && !e.aguardando; });
      if (antes.length) add("INC.04", "aviso", "Execução iniciada com pendências que deveriam precedê-la", listar(antes) + ": itens críticos das condições para o início ainda não atendidos.", antes[0].etapa);
      if (!c.fiscalTecnico && !conf("F1.05")) add("INC.05", "erro", "Execução sem fiscal designado", "Informe o fiscal técnico e o ato de designação (art. 117).", "F1", { visao: "cadastro" });
    }

    if (s.garantiaExigida) {
      if (s.garantiaAdicional.pendente) add("INC.06", "erro", "Garantia adicional não apresentada", "A proposta é inferior a " + P.pctPropostaGarantiaAdicional + "% do valor orçado: exija a garantia adicional de " + moeda(s.garantiaAdicional.valor) + " (art. 59, §5º).", "F1");
      if (s.garantiaInsuficiente) add("INC.07", "erro", "Garantia insuficiente para o valor atualizado", "Apresentado: " + moeda(s.garantiaApresentada) + "; exigido: " + moeda(s.garantiaNecessaria) + " (" + numero(s.garantiaPct, 2) + "% de " + moeda(s.garantiaBase) + "). Exija o reforço após aditivos e reajustes.", "F7");
      if (s.garantiaPctAcimaLimite) add("INC.07b", "aviso", "Percentual de garantia acima do limite legal", "Até 5% do valor inicial, ou até 10% com justificativa (art. 98); até 30% no seguro-garantia com cláusula de retomada (art. 99).", "F1", { visao: "cadastro" });
      if (!c.dataTRD) {
        if (s.garantiaVencida) add("INC.08", "erro", "Garantia contratual vencida", "Validade encerrada em " + br(s.garantiaValidade) + ". Exija a renovação.", "F8");
        else if (s.garantiaCobre === false) add("INC.08", "erro", "Garantia não cobre o prazo do contrato", "Validade até " + br(s.garantiaValidade) + "; o contrato vai até " + br(s.coberturaNecessaria) + ". Exija o endosso ou a renovação (art. 97, I).", "F8");
        else if (s.garantiaVencendo) add("INC.08", "aviso", "Garantia vence em breve", "Validade até " + br(s.garantiaValidade) + ".", "F8");
      }
      if (s.garantiaLiberadaAntes) add("INC.09", "erro", "Garantia liberada antes do recebimento definitivo", "A garantia é liberada após a fiel execução do contrato (art. 100).", "F9");
    }

    if (s.acrescimosAcimaLimite) add("INC.10", "erro", "Acréscimos acima do limite legal", "Acréscimos de " + numero(s.pctAcrescimos, 2) + "% do valor inicial atualizado; limite de " + s.limiteAcrescimos + "% (art. 125), sem compensação com supressões.", "F7", { visao: "alteracoes" });
    if (s.supressoesAcimaLimite) add("INC.10b", "aviso", "Supressões acima de 25%", "Supressões de " + numero(s.pctSupressoes, 2) + "%. O contratado só está obrigado a aceitar supressões de até 25% (art. 125); acima disso, exige-se acordo formal.", "F7", { visao: "alteracoes" });
    var alts = doc.alteracoes || [];
    var apostilaErrada = alts.filter(function (a) {
      return a.tipo === "apostila" && (a.naturezas || []).some(function (n) { var d = (cfg.naturezasAlteracao || []).filter(function (x) { return x[0] === n; })[0]; return d && d[2] === "aditivo"; });
    });
    if (apostilaErrada.length) add("INC.11", "erro", "Alteração de contrato registrada por apostila", listar(apostilaErrada, function (a) { return a.numero || br(a.data); }) + ": prazo, quantidades, projeto e reequilíbrio exigem termo aditivo; a apostila serve ao reajuste e a registros que não alteram o contrato (art. 136). A prorrogação automática por paralisação é anotada na própria ocorrência (art. 115, §5º).", "F7", { visao: "alteracoes" });
    if (["integrada", "semi"].indexOf(o.regime) >= 0) {
      var sem133 = alts.filter(function (a) { return a.tipo !== "apostila" && (a.naturezas || []).some(function (n) { return ["acrescimo", "qualitativa", "reequilibrio"].indexOf(n) >= 0; }) && !a.fundamento133; });
      if (sem133.length) add("INC.12", "erro", "Alteração de valor na contratação integrada ou semi-integrada sem hipótese legal", listar(sem133, function (a) { return a.numero || br(a.data); }) + ": indique a hipótese do art. 133.", "F7", { visao: "alteracoes" });
    }
    var altPend = alts.filter(function (a) { return pendentesRegistro(cfg, res.ctx, "alteracao", a).length; });
    if (altPend.length) add("INC.13", "aviso", "Aditivos ou apostilas com verificações pendentes", listar(altPend, function (a) { return a.numero || br(a.data); }) + ".", "F7", { visao: "alteracoes" });
    var fer = P.feriadosNacionais || [];
    var semPncp = alts.filter(function (a) { return a.tipo !== "apostila" && a.data && !a.dataPNCP && hoje() > somarDiasUteis(a.data, P.diasUteisPncpLicitacao, fer); });
    if (semPncp.length) add("INC.14", "aviso", "Aditivo sem divulgação no PNCP", listar(semPncp, function (a) { return a.numero || br(a.data); }) + ": a divulgação é condição de eficácia dos aditamentos (art. 94).", "F7", { visao: "alteracoes" });

    if (s.execucaoIniciada && !s.execucaoEncerrada && s.terminoExecucao) {
      if (s.diasRestantes < 0) add("INC.15", "erro", "Prazo de execução vencido", "O término previsto era " + br(s.terminoExecucao) + ". Formalize a prorrogação, se houver motivo, ou apure a mora (art. 162).", "F5");
      else if (s.diasRestantes <= P.avisoTerminoDias) add("INC.15", "aviso", "Prazo de execução termina em " + s.diasRestantes + " dias", "Avalie o andamento e, se for o caso, formalize a prorrogação antes do término.", "F5");
    }
    if (s.vigenciaNaoCobre) add("INC.16", "aviso", "Vigência menor que a execução e os recebimentos", "A vigência termina em " + br(s.vigenciaFim) + ". Nos contratos de escopo, a vigência se prorroga automaticamente (art. 111); registre e ajuste a garantia.", "F5");
    if (s.paralisacoesSemAviso.length) add("INC.17", "erro", "Obra paralisada há mais de um mês sem aviso público", "Paralisação " + listar(s.paralisacoesSemAviso, function (p) { return rotOcorrencia(p.o) + " (" + p.dias + " dias)"; }) + ": divulgue o aviso no sítio oficial e em placa no local, com o motivo, o responsável e a data prevista de reinício (art. 115, §6º).", "F5", { visao: "ocorrencias" });
    if (s.suspensaoLonga.length || s.suspensoesRepetidas) add("INC.18", "aviso", "Suspensão que permite ao contratado pedir a extinção", (s.suspensaoLonga.length ? "Suspensão superior a três meses" : "Suspensões repetidas que somam " + s.paralisacaoDiasUteis + " dias úteis") + " (art. 137, §2º, II e III). Avalie a indenização e a continuidade do contrato.", "F5", { visao: "ocorrencias" });
    if (s.paralisacaoAberta) add("INC.19", "info", "Obra paralisada", "Paralisação total desde " + br(s.paralisacaoAberta.o.data) + " (" + s.paralisacaoAberta.dias + " dias). O prazo de execução é prorrogado automaticamente pelo período (art. 115, §5º).", "F5", { visao: "ocorrencias" });

    if (s.medicaoAtrasada) add("INC.20", "aviso", "Medição em atraso", (s.ultimaMedicao ? "A última medição vai até " + br(s.refUltimaMedicao) : "Nenhuma medição desde o início em " + br(s.inicio)) + "; a periodicidade do contrato é " + rotuloCampo(cfg, "contrato.periodicidadeMedicao", c.periodicidadeMedicao || "mensal").toLowerCase() + ".", "F6", { visao: "medicoes" });
    var medPend = (doc.medicoes || []).filter(function (m) { return pendentesRegistro(cfg, res.ctx, "medicao", m).length; });
    if (medPend.length) add("INC.21", "aviso", "Medições com verificações pendentes", listar(medPend, rotMedicao) + ".", "F6", { visao: "medicoes" });
    if (s.pagamentosGraves.length) add("INC.22", "erro", "Pagamento atrasado há mais de dois meses", listar(s.pagamentosGraves, function (x) { return rotMedicao(x.m); }) + ": o contratado pode suspender a execução ou pedir a extinção (art. 137, §2º, IV, e §3º, II).", "F6", { visao: "medicoes" });
    else if (s.pagamentosAtrasados.length) add("INC.22", "aviso", "Pagamento em atraso", listar(s.pagamentosAtrasados, function (x) { return rotMedicao(x.m) + " (" + x.atrasoDias + " dias)"; }) + ". Verifique a atualização monetária prevista no contrato (art. 92, V).", "F6", { visao: "medicoes" });
    if (s.medidoAcima) add("INC.23", "erro", "Medido acima do valor contratual", "O acumulado medido supera em " + moeda(-s.saldo) + " o valor do contrato. Formalize o aditivo antes de executar e medir (art. 132).", "F6", { visao: "medicoes" });
    if (s.reajustePendente) add("INC.24", "aviso", "Reajuste devido sem apostila", "A data-base é " + mesBR(s.dataBase) + "; o reajuste é devido desde " + mesBR(s.reajusteDevidoDesde.slice(0, 7)) + ". Separe os serviços executados antes e depois do aniversário e registre a apostila (art. 136, I).", "F7", { visao: "alteracoes" });
    if (s.desvioCritico) add("INC.25", "aviso", "Execução física atrasada em relação ao cronograma", "Executado acumulado de " + numero(s.pctExecutado, 1) + "% contra " + numero(s.previsto, 1) + "% previstos (desvio de " + numero(s.desvio, 1) + " pontos). Cobre o plano de recuperação e apure a responsabilidade pelo atraso.", "F5", { visao: "medicoes" });

    s.pleitos.forEach(function (x) {
      if (x.riscoContratado) add("INC.26", "aviso", "Pedido de reequilíbrio sobre risco do contratado", "Pedido " + rotOcorrencia(x.o) + " vinculado a " + x.risco.id + " (" + x.risco.descricao + "), alocado ao contratado na matriz: atendidas as condições da matriz, o equilíbrio é considerado mantido (art. 103, §5º).", "F7", { visao: "ocorrencias" });
      if (x.vencido) add("INC.27", "aviso", "Pedido de reequilíbrio sem decisão no prazo", "Instrução concluída em " + br(x.o.dataInstrucao) + "; a decisão deveria ocorrer até " + br(x.prazoDecisao) + " (art. 123, parágrafo único).", "F7", { visao: "ocorrencias" });
      if (x.foraVigencia) add("INC.27b", "aviso", "Pedido de reequilíbrio após a vigência", "O pedido deve ser formulado durante a vigência do contrato (art. 131, parágrafo único).", "F7", { visao: "ocorrencias" });
    });
    if (s.notificacoesVencidas.length) add("INC.28", "aviso", "Notificações com prazo vencido", listar(s.notificacoesVencidas, rotOcorrencia) + ": leve ao gestor as faltas não corrigidas (art. 117, §2º).", "F8", { visao: "ocorrencias" });
    var ceis = s.sancoes.filter(function (x) { return x.ceisPendente; });
    if (ceis.length) add("INC.29", "aviso", "Sanção sem registro no CEIS ou no CNEP", "Registre a sanção em até 15 dias úteis da aplicação (art. 161).", "F8", { visao: "ocorrencias" });
    if (s.trpAtrasado) add("INC.30", "aviso", "Recebimento provisório fora do prazo", "Comunicação de término em " + br(c.dataComunicacaoTermino) + "; prazo até " + br(s.trpPrazo) + ".", "F9");
    if (s.trdAtrasado) add("INC.30b", "aviso", "Recebimento definitivo fora do prazo", "Recebimento provisório em " + br(c.dataTRP) + "; prazo até " + br(s.trdPrazo) + ". Receba dentro da vigência.", "F9");
    if (s.mesmoRecebedor) add("INC.31", "erro", "Recebimento definitivo pelo mesmo agente do provisório", "O recebimento definitivo cabe a servidor ou comissão designada pela autoridade, distinto de quem recebeu provisoriamente (art. 140, I, b; segregação de funções).", "F9", { visao: "cadastro" });

    var nc = res.ativos.filter(function (it) { var e = est(it.id); return e && e.status === "nao_conforme" && !it.auto; });
    if (nc.length) add("INC.32", nc.some(function (it) { return it.crit === "critico"; }) ? "erro" : "aviso", "Não conformidades em aberto", listar(nc) + ". Notifique a contratada e acompanhe até a solução.", nc[0].etapa);
    var venc = res.ativos.filter(function (it) { var e = est(it.id); return e && e.vencida && it.crit === "critico"; });
    if (venc.length) add("INC.33", "aviso", "Verificações periódicas críticas vencidas", listar(venc) + ".", venc[0].etapa, { visao: "painel" });
    var naSem = res.ativos.filter(function (it) { var e = est(it.id); return e && e.status === "na" && !e.resolvido; });
    if (naSem.length) add("INC.34", "erro", "Itens não aplicáveis sem justificativa", listar(naSem), naSem[0].etapa);
    if (res.ctx.grandeVulto && s.integridadePrazo && hoje() > s.integridadePrazo && est("F8.11") && !conf("F8.11")) add("INC.35", "aviso", "Programa de integridade não comprovado no prazo", "O prazo de seis meses terminou em " + br(s.integridadePrazo) + " (art. 25, §4º).", "F8");
    var parciais = res.ativos.filter(function (it) { var e = est(it.id); return e && e.conferencia && !it.periodicidade && e.status === "conforme" && e.conferencia.feitos > 0 && e.conferencia.feitos < e.conferencia.total; });
    if (parciais.length) add("INC.37", "aviso", "Itens conformes com conferência parcial", parciais.map(function (it) { var x = est(it.id).conferencia; return it.id + " (" + x.feitos + " de " + x.total + ")"; }).join(", ") + ".", parciais[0].etapa);
    if ((doc.ressalvas || []).length) add("INC.38", "info", "Avanços de etapa com ressalva", (doc.ressalvas || []).length + " registro(s) de avanço com itens críticos pendentes.", null, { visao: "alertas" });

    var ordem = { erro: 1, aviso: 2, info: 3 };
    L.sort(function (a, b) { return ordem[a.nivel] - ordem[b.nivel]; });
    return L;
  }

  /* --------------------------- alertas --------------------------- */
  function alertasContexto(cfg, doc, ctx) {
    return (cfg.alertas || []).filter(function (a) { return avaliar(a.se, ctx); }).map(function (a) {
      return { id: a.id, titulo: a.titulo, texto: a.texto, motivo: a.se ? explicar(a.se, cfg) : "Aplicável a todos os contratos", regra: a.se || null };
    });
  }

  /* --------------------------- cálculo consolidado --------------------------- */
  function normalizar(doc) {
    doc.itens = doc.itens || {};
    doc.itensCustom = doc.itensCustom || [];
    doc.medicoes = doc.medicoes || [];
    doc.alteracoes = doc.alteracoes || [];
    doc.ocorrencias = doc.ocorrencias || [];
    doc.matriz = doc.matriz || [];
    doc.riscos = doc.riscos || [];
    doc.ressalvas = doc.ressalvas || [];
    doc.historico = doc.historico || [];
    doc.obra = doc.obra || {};
    doc.contrato = doc.contrato || {};
    doc.contrato.garantia = doc.contrato.garantia || {};
    return doc;
  }

  function etapaDevida(etapa, sit) { return (ORDEM_FASE[sit.fase] || 1) >= (ORDEM_FASE[etapa.desde] || 1); }

  function progressoEtapa(etapa, res) {
    var itens = res.ativos.filter(function (it) { return it.etapa === etapa.id && !res.estados[it.id].aguardando; });
    var resolvidos = 0, crit = [], pend = [], iniciados = 0, vencidas = 0, vencCrit = 0, naoConf = 0, acomp = 0;
    itens.forEach(function (it) {
      var s = res.estados[it.id];
      if (s.resolvido) resolvidos++;
      else if (s.acompanhamento) acomp++;
      else { pend.push(it.id); if (it.crit === "critico") crit.push(it.id); }
      if (s.vencida) { vencidas++; if (it.crit === "critico") vencCrit++; }
      if (s.status === "nao_conforme") naoConf++;
      var iniciou = it.auto ? (!!(s.auto && s.auto.ok) && !s.vazio) || s.status !== "nao_verificado" : (s.status !== "nao_verificado" || s.resolvido);
      if (iniciou) iniciados++;
    });
    var total = itens.length;
    var sem = total === 0 || resolvidos === total ? "verde" : (iniciados === 0 ? "cinza" : (crit.length || naoConf || vencCrit ? "vermelho" : "amarelo"));
    return {
      id: etapa.id, titulo: etapa.titulo, curto: etapa.curto, total: total, resolvidos: resolvidos, aguardando: res.ativos.filter(function (it) { return it.etapa === etapa.id; }).length - total,
      pct: total ? Math.round(100 * resolvidos / total) : 100, criticosPendentes: crit, pendentes: pend, acompanhamento: acomp, iniciados: iniciados, semaforo: sem,
      vencidas: vencidas, naoConformes: naoConf, devida: etapaDevida(etapa, res.sit)
    };
  }

  function calcular(cfg, doc) {
    normalizar(doc);
    var sit = situacaoContrato(cfg, doc);
    var ctx = contexto(cfg, doc, sit);
    var ativos = itensAtivos(cfg, doc, ctx);
    var porId = {};
    ativos.forEach(function (it) { porId[it.id] = it; });
    var res = { ctx: ctx, sit: sit, ativos: ativos, porId: porId, estados: {}, inconsistencias: [] };
    ativos.forEach(function (it) { res.estados[it.id] = estadoItem(cfg, doc, it, res); });
    res.inconsistencias = inconsistencias(cfg, doc, res);

    res.etapas = cfg.etapas.map(function (e) { return progressoEtapa(e, res); });
    var porEtapa = {};
    res.etapas.forEach(function (p) { porEtapa[p.id] = p; });
    res.porEtapa = porEtapa;
    cfg.etapas.forEach(function (e) {
      var bloq = (e.prereq || []).filter(function (pid) { return porEtapa[pid] && porEtapa[pid].criticosPendentes.length; })
        .map(function (pid) { return { etapa: pid, n: porEtapa[pid].criticosPendentes.length }; });
      porEtapa[e.id].entrada = { liberada: bloq.length === 0, bloqueios: bloq };
    });

    var considerados = ativos.filter(function (it) { return !res.estados[it.id].aguardando; });
    res.total = considerados.length;
    res.resolvidos = considerados.filter(function (it) { return res.estados[it.id].resolvido; }).length;
    res.pct = res.total ? Math.round(100 * res.resolvidos / res.total) : 0;
    var devido = function (it) { return porEtapa[it.etapa] && porEtapa[it.etapa].devida; };
    res.criticosPendentes = considerados.filter(function (it) { var e = res.estados[it.id]; return devido(it) && it.crit === "critico" && !e.resolvido && !e.acompanhamento; });
    res.acompanhamento = considerados.filter(function (it) { return res.estados[it.id].acompanhamento; });
    res.vencidas = considerados.filter(function (it) { return res.estados[it.id].vencida; });
    res.naoConformes = ativos.filter(function (it) { return !it.auto && res.estados[it.id].status === "nao_conforme"; });
    var erros = res.inconsistencias.filter(function (i) { return i.nivel === "erro"; });
    res.gate = {
      emDia: res.criticosPendentes.length === 0 && erros.length === 0 && !res.vencidas.some(function (it) { return it.crit === "critico"; }),
      criticos: res.criticosPendentes.length, erros: erros.length, vencidas: res.vencidas.length, naoConformes: res.naoConformes.length
    };
    res.alertas = alertasContexto(cfg, doc, ctx);
    res.bloqueios = bloqueios(cfg, doc, res);
    res.proximas = proximasAcoes(cfg, doc, res);
    res.rotinas = rotinas(cfg, doc, res);
    return res;
  }

  function bloqueios(cfg, doc, res) {
    var L = [];
    res.inconsistencias.filter(function (i) { return i.nivel === "erro"; }).forEach(function (i) {
      L.push({ tipo: "inconsistencia", peso: 100, texto: i.titulo, detalhe: i.detalhe, etapa: i.etapa, ref: i.id, visao: i.visao, aba: i.aba });
    });
    res.naoConformes.forEach(function (it) {
      L.push({ tipo: "nao_conforme", peso: it.crit === "critico" ? 90 : 50, texto: it.titulo, detalhe: it.id + ": " + (res.estados[it.id].reg.naoConformidade || "não conformidade registrada"), etapa: it.etapa, ref: it.id });
    });
    res.vencidas.forEach(function (it) {
      if (it.crit !== "critico") return;
      var e = res.estados[it.id];
      L.push({ tipo: "rotina", peso: 75, texto: it.titulo, detalhe: it.id + (e.medicaoRef ? ": verificação devida na medição nº " + e.medicaoRef : ": verificação vencida em " + br(e.proxima)), etapa: it.etapa, ref: it.id });
    });
    res.ativos.forEach(function (it) {
      var e = res.estados[it.id];
      if (e.atrasado && it.crit === "critico") L.push({ tipo: "prazo", peso: 60, texto: it.titulo, detalhe: it.id + " com data prevista vencida (" + br(e.reg.dataPrevista) + ")", etapa: it.etapa, ref: it.id });
    });
    L.sort(function (a, b) { return b.peso - a.peso; });
    return L;
  }

  function proximasAcoes(cfg, doc, res) {
    var idx = {};
    cfg.etapas.forEach(function (e, i) { idx[e.id] = i; });
    var L = res.ativos.filter(function (it) {
      var e = res.estados[it.id];
      return !it.auto && !e.resolvido && !e.aguardando && !e.acompanhamento && res.porEtapa[it.etapa] && res.porEtapa[it.etapa].devida;
    }).map(function (it) {
      var e = res.estados[it.id];
      var pontos = (CRIT[it.crit] ? CRIT[it.crit].peso * 10 : 10) + (12 - idx[it.etapa]) * 2 + (e.atrasado ? 100 : 0) + (e.vencida ? 60 : 0) + (e.status === "nao_conforme" ? 80 : 0) + (e.status === "em_andamento" ? 5 : 0);
      return { id: it.id, etapa: it.etapa, titulo: it.titulo, crit: it.crit, status: e.status, dataPrevista: e.reg.dataPrevista || "", atrasado: e.atrasado, vencida: e.vencida, proxima: e.proxima, periodico: !!it.periodicidade, pontos: pontos };
    });
    L.sort(function (a, b) { return b.pontos - a.pontos || (a.id < b.id ? -1 : 1); });
    return L;
  }

  function rotinas(cfg, doc, res) {
    return res.ativos.filter(function (it) {
      var e = res.estados[it.id];
      return it.periodicidade && !it.auto && !e.aguardando && !e.encerrada;
    }).map(function (it) {
      var e = res.estados[it.id];
      return { id: it.id, etapa: it.etapa, titulo: it.titulo, crit: it.crit, periodicidade: it.periodicidade, ultima: e.ultima, proxima: e.proxima, vencida: e.vencida, status: e.status, suspensa: e.suspensa, medicaoRef: e.medicaoRef };
    }).sort(function (a, b) {
      if (a.vencida !== b.vencida) return a.vencida ? -1 : 1;
      return (a.proxima || "9999") < (b.proxima || "9999") ? -1 : 1;
    });
  }

  /* --------------------------- registros --------------------------- */
  function proximoId(lista, prefixo) {
    var max = 0;
    lista.forEach(function (x) {
      var m = new RegExp("^" + prefixo.replace(".", "\\.") + "(\\d+)$").exec(x.id || "");
      if (m) max = Math.max(max, +m[1]);
    });
    return prefixo + pad(max + 1);
  }
  function proximoNumero(lista) { return lista.reduce(function (m, x) { return Math.max(m, num(x.numero) || 0); }, 0) + 1; }

  function novaMedicao(doc, dados) {
    normalizar(doc);
    var m = mesclar({ id: uid("md"), numero: proximoNumero(doc.medicoes), inicio: "", fim: "", valor: null, reajuste: null, glosa: null, previstoPct: null, dataAteste: "", nf: "", dataNF: "", dataPagamento: "", final: false, obs: "", checks: [], criadoEm: agora() }, dados || {});
    doc.medicoes.push(m);
    return m;
  }
  function novaAlteracao(doc, dados) {
    normalizar(doc);
    var a = mesclar({ id: uid("al"), tipo: "aditivo", numero: "", data: "", naturezas: [], acrescimo: null, supressao: null, reequilibrio: null, reajuste: null, prazoDias: null, vigenciaDias: null, reforcoGarantia: null, fundamento133: "", falhaProjeto: false, dataPNCP: "", justificativa: "", checks: [], criadoEm: agora() }, dados || {});
    if (!Array.isArray(a.naturezas)) a.naturezas = [];
    doc.alteracoes.push(a);
    return a;
  }
  function novaOcorrencia(doc, dados) {
    normalizar(doc);
    var o = mesclar({ id: uid("oc"), numero: "", tipo: "notificacao", data: "", dataFim: "", prazo: "", extensao: "total", dataInstrucao: "", dataAplicacao: "", valor: null, riscoRef: "", situacao: "aberta", descricao: "", providencia: "", checks: [], criadoEm: agora() }, dados || {});
    doc.ocorrencias.push(o);
    return o;
  }
  function novoRiscoMatriz(doc, dados) {
    normalizar(doc);
    var m = mesclar({ id: proximoId(doc.matriz, "MA."), descricao: "", categoria: "Outro", alocacao: "", mecanismo: "", clausula: "", parametros: "", origem: "manual" }, dados || {});
    doc.matriz.push(m);
    return m;
  }
  function novoRisco(doc, dados) {
    normalizar(doc);
    var r = mesclar({ id: proximoId(doc.riscos, "MR."), evento: "", causa: "", consequencia: "", p: 3, i: 3, tratamento: "mitigar", providencia: "", responsavel: "", prazo: "", statusMedida: "nao_iniciada", origem: "manual" }, dados || {});
    doc.riscos.push(r);
    return r;
  }
  function remover(doc, colecao, id) { doc[colecao] = (doc[colecao] || []).filter(function (x) { return x.id !== id; }); }

  function nivel(cfg, p, i) {
    var v = (num(p) || 0) * (num(i) || 0), n = null;
    (cfg.escalas.niveis || []).forEach(function (x) { if (v >= x.min && v <= x.max) n = x; });
    return { valor: v, id: n ? n.id : null, rotulo: n ? n.rotulo : "Sem avaliação" };
  }

  /* registra uma verificação de rotina (periódica) no item */
  function registrarVerificacao(cfg, doc, id, resultado, dados) {
    normalizar(doc);
    var reg = doc.itens[id] = doc.itens[id] || {};
    var data = (dados && dados.data) || hoje();
    reg.status = resultado;
    reg.ultimaVerificacao = data;
    if (resultado === "nao_conforme") { reg.naoConformidade = (dados && dados.naoConformidade) || reg.naoConformidade || ""; reg.providencia = (dados && dados.providencia) || reg.providencia || ""; }
    var entrada = { data: data, resultado: resultado, obs: (dados && dados.obs) || "" };
    if (Array.isArray(reg.conferidos) && reg.conferidos.length) { entrada.conferidos = reg.conferidos.length; reg.conferidos = []; }
    reg.verificacoes = (reg.verificacoes || []).concat([entrada]).slice(-60);
    return reg;
  }

  /* --------------------------- obra, exemplos e importação --------------------------- */
  function novaObra(cfg) {

      try {
        var d = JSON.parse(bruto);
        if (d && typeof d === "object" && d.obras) {
          dados.obras = d.obras || {};
          dados.ativa = d.ativa || null;
          dados.prefs = M.mesclar({ tema: "auto" }, d.prefs || {});
          dados.aceites = Array.isArray(d.aceites) ? d.aceites : [];
        }
      } catch (e) { /* dados ilegíveis: começa vazio */ }
    }
    var base = lerLS(LS_BASE);
    if (base) {
      try {
        var c = JSON.parse(base);
        if (!M.validarConfig(c)) { CFG = c; baseCustomizada = true; }
      } catch (e) { /* base ilegível: usa a original */ }
    }
    Object.keys(dados.obras).forEach(function (id) {
      try { dados.obras[id] = M.migrar(CFG, dados.obras[id]); } catch (e) { delete dados.obras[id]; }

  }

    } else {
      estado = '<select class="item-estado" id="st-' + sid + '" data-status-item="' + attr(it.id) + '" aria-label="Situação de ' + attr(it.id) + '">' + M.STATUS.map(function (o) {
        return '<option value="' + o[0] + '"' + (o[0] === s.status ? " selected" : "") + ">" + esc(o[1]) + "</option>";
      }).join("") + "</select>";
    }
    var sub = [];
    if (it.periodicidade) sub.push(s.vencida ? '<span class="txt-erro">' + esc(textoPeriodico(it, s)) + "</span>" : esc(textoPeriodico(it, s)));
    if (s.status === "nao_conforme" && reg.naoConformidade) sub.push('<span class="txt-erro">Não conformidade: ' + esc(reg.naoConformidade) + "</span>");
    if (s.atrasado) sub.push('<span class="txt-erro">Prazo vencido em ' + dataBR(reg.dataPrevista) + "</span>");
    else if (!it.periodicidade && reg.responsavel) sub.push("Responsável: " + esc(reg.responsavel) + (reg.dataPrevista ? ", previsto para " + dataBR(reg.dataPrevista) : ""));
    if (s.conferencia) sub.push('<span class="conf-resumo">Roteiro: ' + s.conferencia.feitos + " de " + s.conferencia.total + " conferidos</span>");
    var h = ['<li class="' + cls + '" id="item-' + sid + '">'];
    h.push('<div class="item-linha">' + glifoItem(it, s) + '<span class="item-id">' + esc(it.id) + '</span><span class="item-titulo"><span class="t">' + esc(it.titulo) + "</span>" + (sub.length ? "<small>" + sub.join(" · ") + "</small>" : "") + "</span>" +
      '<span class="etiqueta ' + it.crit + '">' + esc(M.CRIT[it.crit].rotulo) + "</span>" + estado +
      '<button type="button" class="expandir" id="exp-' + sid + '" data-acao="expandir" data-item="' + attr(it.id) + '" aria-expanded="' + aberto + '" aria-controls="det-' + sid + '" aria-label="Detalhes de ' + attr(it.id) + '">' + IC.seta + "</button></div>");
    if (aberto) h.push('<div class="item-detalhe" id="det-' + sid + '">' + detalheItem(it, s) + "</div>");
    h.push("</li>");
    return h.join("");
  }

  function campoReg(id, campo, rotulo, tipo, valor, largo, opcoes) {
    var fid = "r-" + idSeguro(id) + "-" + campo;
    var a = ' id="' + fid + '" data-item="' + attr(id) + '" data-reg="' + campo + '"';
    var ctrl;
    if (tipo === "textarea") ctrl = "<textarea" + a + ">" + esc(valor || "") + "</textarea>";
    else if (tipo === "select") ctrl = "<select" + a + ">" + opcoes.map(function (o) { return '<option value="' + attr(o[0]) + '"' + (o[0] === (valor || "") ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") + "</select>";
    else ctrl = '<input type="' + tipo + '"' + a + ' value="' + attr(valor || "") + '">';
    return '<div class="campo' + (largo ? " largo" : "") + '"><label for="' + fid + '">' + esc(rotulo) + "</label>" + ctrl + "</div>";
  }

  function detalheItem(it, s) {
    var reg = s.reg, h = [];
    h.push('<p class="desc">' + esc(it.desc) + "</p>");
    h.push('<p class="base-legal"><b>Base:</b> ' + esc(it.base) + "</p>");
    if (it.tipo !== "custom") {
      var mot = it.regra ? M.explicarAtivo(it.regra, calc.ctx, CFG) : "Aplicável a todos os contratos";
      h.push('<div class="motivo"><b>Por que está ativo:</b> ' + esc(mot) + (it.motivoCrit ? ". <b>Criticidade ajustada porque:</b> " + esc(M.explicarAtivo(it.motivoCrit, calc.ctx, CFG)) : "") + "</div>");
    }
    if (it.nota) h.push('<div class="faixa aviso"><p>' + esc(it.nota) + "</p></div>");
    if (it.ajuda === "garantiaAdicional") h.push(ajudaGarantiaAdicional());
    if (it.ajuda === "integridade") h.push(ajudaIntegridade());
    if (it.ajuda === "art94inicio" || it.ajuda === "art94fim") h.push(ajudaArt94(it.ajuda));
    if (it.conteudo && s.conferencia) h.push(conteudoHtml(it, s));
    if (it.auto) {
      h.push('<div class="ajuda-calc"><b>Verificação automática.</b> ' + esc(s.aguardando ? "Aguarda: " + s.aguardando + "." : (s.auto ? s.auto.detalhe : "")) + "</div>");
      var dest = AUTO_DESTINO[it.auto];
      if (dest) h.push('<div class="acoes"><button type="button" class="btn pequeno" data-acao="ir" data-visao="' + dest[0] + '"' + (dest[2] ? ' data-aba="' + dest[2] + '"' : "") + ">" + esc(dest[1]) + "</button></div>");
      return h.join("");
    }
    if (it.periodicidade) h.push(historicoRotina(it, s));
    if (s.status === "nao_conforme") {
      h.push('<div class="bloco-nc"><h4>Não conformidade em aberto</h4><div class="campos">' +
        campoReg(it.id, "naoConformidade", "Descrição", "textarea", reg.naoConformidade, true) +
        campoReg(it.id, "providencia", "Providência exigida da contratada", "textarea", reg.providencia, true) +
        campoReg(it.id, "prazoCorrecao", "Prazo para correção", "date", reg.prazoCorrecao) +
        campoReg(it.id, "notificacao", "Notificação ou registro no diário", "text", reg.notificacao) + "</div>" +
        '<p class="pequeno mudo">' + (it.periodicidade ? "Registre uma nova verificação conforme quando a falha for corrigida." : "Altere a situação para Conforme quando a falha for corrigida e aceita.") + "</p></div>");
    }
    h.push('<div class="campos">' +
      campoReg(it.id, "responsavel", "Responsável pela verificação", "text", reg.responsavel) +
      (it.periodicidade ? "" : campoReg(it.id, "dataPrevista", "Data prevista", "date", reg.dataPrevista) + campoReg(it.id, "dataRealizada", "Data da verificação", "date", reg.dataRealizada)) +
      campoReg(it.id, "documento", "Documento ou evidência (nº, link ou referência)", "text", reg.documento, true) +
      campoReg(it.id, "obs", "Observações", "textarea", reg.obs, true) + "</div>");
    if (s.status === "na" || reg.justificativa) h.push('<div class="campos">' + campoReg(it.id, "justificativa", "Justificativa da não aplicabilidade", "textarea", reg.justificativa, true) + "</div>");
    var botoes = [];
    if (it.periodicidade && s.status !== "na" && !s.aguardando && !s.encerrada) botoes.push('<button type="button" class="btn pequeno primario" data-acao="registrar" data-item="' + attr(it.id) + '">Registrar verificação</button>');
    if (it.periodicidade && s.status !== "na") botoes.push('<button type="button" class="btn sutil pequeno" data-acao="periodico-na" data-item="' + attr(it.id) + '">Não se aplica a este contrato</button>');
    if (it.periodicidade && s.status === "na") botoes.push('<button type="button" class="btn sutil pequeno" data-acao="reativar" data-item="' + attr(it.id) + '">Reativar a rotina</button>');
    if (it.tipo === "custom") botoes.push('<button type="button" class="btn perigo pequeno" data-acao="excluir-item" data-item="' + attr(it.id) + '">' + IC.lixo + "Excluir item adicional</button>");
    if (botoes.length) h.push('<div class="acoes">' + botoes.join("") + "</div>");
    return h.join("");
  }

  function historicoRotina(it, s) {
    var l = (s.reg.verificacoes || []).slice(-8).reverse();
    var per = CFG.periodicidades[it.periodicidade] || {};
    var h = ['<div class="rotina-info"><p class="pequeno"><b>Periodicidade:</b> ' + esc(per.rotulo || it.periodicidade) +
      (s.status === "na" ? ". Marcada como não aplicável" : "") +
      (s.proxima && s.status !== "na" ? (s.vencida ? '. <b class="txt-erro">Vencida desde ' + dataBR(s.proxima) + "</b>" : ". Próxima verificação até " + dataBR(s.proxima)) : "") +
      (s.aguardando ? ". Começa com: " + esc(s.aguardando.toLowerCase()) : "") + (s.suspensa ? ". Suspensa enquanto a obra estiver paralisada" : "") + (s.encerrada ? ". Rotina encerrada" : "") + ".</p>"];
    if (!l.length) h.push('<p class="pequeno mudo">Nenhuma verificação registrada.</p>');
    else h.push('<div class="tabela-wrap"><table class="tabela compacta"><caption class="sr">Últimas verificações de ' + esc(it.id) + "</caption><thead><tr><th>Data</th><th>Resultado</th><th>Observação</th></tr></thead><tbody>" + l.map(function (v) {
      return '<tr><td class="curto">' + dataBR(v.data) + "</td><td>" + (v.resultado === "nao_conforme" ? '<span class="txt-erro">Não conforme</span>' : "Conforme") + "</td><td>" + esc(v.obs || "") + (v.conferidos ? '<span class="sub">' + v.conferidos + " elemento(s) do roteiro conferido(s)</span>" : "") + "</td></tr>";
    }).join("") + "</tbody></table></div>");
    h.push("</div>");
    return h.join("");
  }

  function conteudoHtml(it, s) {
    var sid = idSeguro(it.id), marc = Array.isArray(s.reg.conferidos) ? s.reg.conferidos : [], c = s.conferencia;
    var h = ['<section class="conteudo-min" aria-labelledby="cm-' + sid + '"><div class="conteudo-cabeca"><h4 id="cm-' + sid + '">' + (it.periodicidade ? "Roteiro de conferência desta verificação" : "Roteiro de conferência") + "</h4>" +
      '<span class="etiqueta ' + (c.feitos === c.total ? "cheia-ok" : c.feitos ? "cheia-aviso" : "cheia-neutra") + '" id="cm-conta-' + sid + '">' + c.feitos + " de " + c.total + " conferidos</span>" +
      '<span class="acoes"><button type="button" class="btn sutil pequeno" data-acao="conferir-todos" data-item="' + attr(it.id) + '">Marcar todos</button><button type="button" class="btn sutil pequeno" data-acao="conferir-nenhum" data-item="' + attr(it.id) + '">Limpar</button></span></div>'];
    it.conteudo.forEach(function (b) {
      h.push('<p class="conteudo-fonte">' + esc(b.fonte) + "</p>");
      b.elementos.forEach(function (e) {
        h.push('<div class="conteudo-grupo" role="group" aria-label="' + attr(e.tipo) + '"><h5>' + esc(e.tipo) + "</h5><ul>" + e.itens.map(function (x) {
          var id = "cf-" + sid + "-" + x.chave;
          return '<li><label class="marcador" for="' + id + '"><input type="checkbox" id="' + id + '" data-conferir="' + attr(it.id) + '" data-chave="' + x.chave + '"' + (marc.indexOf(x.chave) >= 0 ? " checked" : "") + "><span>" + esc(x.texto) + "</span></label></li>";
        }).join("") + "</ul></div>");
      });
    });
    h.push("</section>");
    return h.join("");
  }

  function ajudaGarantiaAdicional() {
    var s = calc.sit, P = CFG.parametros, ga = s.garantiaAdicional;
    if (!s.valorOrcado || s.valorInicial == null) return '<div class="ajuda-calc">Informe o valor orçado e o valor inicial do contrato no cadastro para calcular a garantia adicional (art. 59, §5º).</div>';
    return '<div class="ajuda-calc"><b>Garantia adicional:</b> proposta de ' + esc(M.moeda(s.valorInicial)) + " para valor orçado de " + esc(M.moeda(s.valorOrcado)) + " (" + esc(M.numero(s.valorInicial / s.valorOrcado * 100, 2)) + "%). " +
      (ga.exigida ? "Abaixo de " + P.pctPropostaGarantiaAdicional + "%: exija " + esc(M.moeda(ga.valor)) + ", diferença entre o valor orçado e a proposta" + (ga.apresentada != null ? "; apresentado " + esc(M.moeda(ga.apresentada)) : "") + "." : "Igual ou superior a " + P.pctPropostaGarantiaAdicional + "%: garantia adicional não exigida.") + "</div>";
  }
  function ajudaArt94(tipo) {
    var c = doc().contrato, P = CFG.parametros, fer = P.feriadosNacionais || [];
    if (tipo === "art94inicio") {
      if (!c.dataAssinatura) return '<div class="ajuda-calc">Informe a data de assinatura do contrato para calcular o prazo de 25 dias úteis (art. 94, §3º).</div>';
      return '<div class="ajuda-calc"><b>Prazo:</b> até ' + dataBR(M.somarDiasUteis(c.dataAssinatura, P.diasUteisPlanilhaObra || 25, fer)) + ", 25 dias úteis da assinatura (sem feriados locais).</div>";
    }
    var fim = c.dataTRD || (M.verdade(c.extinto) ? c.dataExtincao : "");
    if (!fim) return '<div class="ajuda-calc">O prazo de 45 dias úteis conta da conclusão do contrato: recebimento definitivo ou extinção (art. 94, §3º).</div>';
    return '<div class="ajuda-calc"><b>Prazo:</b> até ' + dataBR(M.somarDiasUteis(fim, P.diasUteisExecutadoObra || 45, fer)) + ", 45 dias úteis da conclusão em " + dataBR(fim) + " (sem feriados locais).</div>";
  }
  function ajudaIntegridade() {
    var s = calc.sit;
    return '<div class="ajuda-calc"><b>Programa de integridade:</b> ' + (s.integridadePrazo ? "comprovação da implantação até " + dataBR(s.integridadePrazo) + ", seis meses após a assinatura (art. 25, §4º)." : "informe a data de assinatura para calcular o prazo de seis meses (art. 25, §4º).") + "</div>";
  }

  /* ---------------------------- situação dos itens ---------------------------- */
  function opcoesHtml(lista, valor, vazio) {
    return (vazio ? '<option value="">' + esc(vazio) + "</option>" : "") + lista.map(function (o) { return '<option value="' + attr(o[0]) + '"' + (String(o[0]) === String(valor) ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("");
  }
  function campoModal(id, rotulo, ctrl, largo, ajuda, extra) {
    return '<div class="campo' + (largo ? " largo" : "") + '"' + (extra || "") + '><label for="' + id + '">' + esc(rotulo) + "</label>" + ctrl + (ajuda ? '<span class="ajuda">' + esc(ajuda) + "</span>" : "") + "</div>";
  }
  function lerForm(f) {
    var v = {};
    $$("input, select, textarea", f).forEach(function (el) {
      if (!el.name) return;
      if (el.type === "radio") { if (el.checked) v[el.name] = el.value; return; }
      if (el.type === "checkbox") {
        if (el.hasAttribute("data-multi")) { v[el.name] = v[el.name] || []; if (el.checked) v[el.name].push(el.value); }
        else v[el.name] = el.checked;
        return;
      }
      v[el.name] = el.value;
    });
    return v;
  }

  function mudarStatus(id, novo) {
    var d = doc(), it = calc.porId[id];
    if (!it) return;
    var reg = d.itens[id] || {}, anterior = reg.status || "nao_verificado";
    if (novo === "na") { formNA(id, anterior); return; }
    if (novo === "nao_conforme") { formNaoConformidade(id, anterior); return; }
    d.itens[id] = reg;
    reg.status = novo;
    if (novo === "conforme" && !reg.dataRealizada) reg.dataRealizada = M.hoje();
    concluirMudanca(it, anterior, novo);
  }
  function concluirMudanca(it, anterior, novo) {
    historico(it.id + ": " + M.rotuloLista(M.STATUS, anterior) + " para " + M.rotuloLista(M.STATUS, novo));
    salvar();
    render();
  }
  function formNA(id, anterior) {
    var it = calc.porId[id], reg = doc().itens[id] || {};
    abrirModal({
      titulo: "Justificar não aplicabilidade", descricao: id + " " + it.titulo,
      corpo: '<div class="campo"><label for="just-na">Justificativa (obrigatória)</label><textarea id="just-na">' + esc(reg.justificativa || "") + "</textarea></div>",
      foco: "#just-na", aoFechar: function () { render(); },
      botoes: [{ rotulo: "Cancelar" }, {
        rotulo: "Marcar como não aplicável", classe: "primario", acao: function (m) {
          var t = $("#just-na", m).value.trim();
          if (!t) { avisar("A justificativa é obrigatória para marcar o item como não aplicável."); $("#just-na", m).focus(); return false; }
          var d = doc(), r = d.itens[id] = d.itens[id] || {};
          r.status = "na"; r.justificativa = t;
          concluirMudanca(it, anterior, "na");
        }
      }]
    });
  }
  function formNaoConformidade(id, anterior) {
    var it = calc.porId[id], reg = doc().itens[id] || {};
    abrirModal({
      titulo: "Registrar não conformidade", descricao: id + " " + it.titulo,
      corpo: '<form id="form-nc" class="campos" novalidate>' +
        campoModal("nc-desc", "Não conformidade constatada *", '<textarea id="nc-desc" name="naoConformidade">' + esc(reg.naoConformidade || "") + "</textarea>", true) +
        campoModal("nc-prov", "Providência exigida da contratada", '<textarea id="nc-prov" name="providencia">' + esc(reg.providencia || "") + "</textarea>", true) +
        campoModal("nc-prazo", "Prazo para correção", '<input type="date" id="nc-prazo" name="prazoCorrecao" value="' + attr(reg.prazoCorrecao || "") + '">') + "</form>",
      foco: "#nc-desc", aoFechar: function () { render(); },
      botoes: [{ rotulo: "Cancelar" }, {
        rotulo: "Registrar não conformidade", classe: "primario", acao: function (m) {
          var v = lerForm($("#form-nc", m));
          if (!String(v.naoConformidade || "").trim()) { avisar("Descreva a não conformidade constatada."); $("#nc-desc", m).focus(); return false; }
          var d = doc(), r = d.itens[id] = d.itens[id] || {};
          r.status = "nao_conforme"; r.naoConformidade = v.naoConformidade.trim(); r.providencia = v.providencia; r.prazoCorrecao = v.prazoCorrecao;
          if (!r.dataRealizada) r.dataRealizada = M.hoje();
          concluirMudanca(it, anterior, "nao_conforme");
        }
      }]
    });
  }

  function formRegistrar(id) {
    var it = calc.porId[id];
    if (!it || !it.periodicidade) return;
    var s = calc.estados[id];
    var corpo = '<form id="form-reg" class="campos" novalidate>' +
      campoModal("rv-data", "Data da verificação", '<input type="date" id="rv-data" name="data" value="' + attr(M.hoje()) + '" max="' + attr(M.hoje()) + '">') +
      '<div class="campo"><span class="rotulo" id="rv-res-rot">Resultado</span><div class="opcoes-radio" role="radiogroup" aria-labelledby="rv-res-rot"><label class="marcador" for="rv-ok"><input type="radio" id="rv-ok" name="resultado" value="conforme" checked><span>Conforme</span></label><label class="marcador" for="rv-nc"><input type="radio" id="rv-nc" name="resultado" value="nao_conforme"><span>Não conforme</span></label></div></div>' +
      '<div class="campo largo" id="rv-nc-bloco" hidden><label for="rv-desc">Não conformidade constatada *</label><textarea id="rv-desc" name="naoConformidade"></textarea></div>' +
      '<div class="campo largo" id="rv-prov-bloco" hidden><label for="rv-prov">Providência exigida da contratada</label><textarea id="rv-prov" name="providencia"></textarea></div>' +
      campoModal("rv-obs", "Observação", '<textarea id="rv-obs" name="obs"></textarea>', true) +
      (s.conferencia ? '<p class="pequeno mudo campo largo">Roteiro de conferência: ' + s.conferencia.feitos + " de " + s.conferencia.total + " elementos marcados. As marcações ficam registradas nesta verificação e são reiniciadas para a próxima.</p>" : "") +
      "</form>";
    abrirModal({
      titulo: "Registrar verificação", descricao: it.id + " " + it.titulo + " (" + ((CFG.periodicidades[it.periodicidade] || {}).rotulo || "") + ")", corpo: corpo, foco: "#rv-data",
      aoAbrir: function (m) {
        var upd = function () { var nc = $("#rv-nc", m).checked; $("#rv-nc-bloco", m).hidden = !nc; $("#rv-prov-bloco", m).hidden = !nc; };
        $("#rv-ok", m).addEventListener("change", upd);
        $("#rv-nc", m).addEventListener("change", upd);
      },
      botoes: [{ rotulo: "Cancelar" }, {
        rotulo: "Registrar", classe: "primario", acao: function (m) {
          var v = lerForm($("#form-reg", m));
          if (!v.data) { avisar("Informe a data da verificação."); return false; }
          if (v.data > M.hoje()) { avisar("A data da verificação não pode ser futura."); return false; }
          if (v.resultado === "nao_conforme" && !String(v.naoConformidade || "").trim()) { avisar("Descreva a não conformidade constatada."); $("#rv-desc", m).focus(); return false; }
          M.registrarVerificacao(CFG, doc(), id, v.resultado, { data: v.data, obs: v.obs, naoConformidade: v.naoConformidade, providencia: v.providencia });
          historico(id + ": verificação " + (v.resultado === "conforme" ? "conforme" : "não conforme") + " registrada em " + dataBR(v.data));
          salvar(); render(); avisar(id + ": verificação registrada.");
        }
      }]
    });
  }

  /* ------------------------------- rotinas ------------------------------- */
  VIEWS.rotinas = function () {
    var r = calc, s = r.sit, hoje = M.hoje(), lim = M.somarDias(hoje, 7);
    var G = { vencidas: [], proximas: [], emdia: [], suspensas: [], aguardando: [], encerradas: [], na: [] };
    r.ativos.filter(function (it) { return it.periodicidade && !it.auto; }).forEach(function (it) {
      var e = r.estados[it.id], x = { it: it, e: e };
      if (e.status === "na") G.na.push(x);
      else if (e.aguardando) G.aguardando.push(x);
      else if (e.encerrada) G.encerradas.push(x);
      else if (e.suspensa) G.suspensas.push(x);
      else if (e.vencida) G.vencidas.push(x);
      else if (e.proxima && e.proxima <= lim) G.proximas.push(x);
      else G.emdia.push(x);
    });
    var ord = function (a, b) { return (a.e.proxima || "9999") < (b.e.proxima || "9999") ? -1 : (a.e.proxima || "9999") > (b.e.proxima || "9999") ? 1 : (a.it.id < b.it.id ? -1 : 1); };
    Object.keys(G).forEach(function (k) { G[k].sort(ord); });
    Object.keys(ui.selRot).forEach(function (id) { var e = r.estados[id]; if (!e || e.aguardando || e.encerrada || e.status === "na") delete ui.selRot[id]; });
    var nSel = Object.keys(ui.selRot).filter(function (k) { return ui.selRot[k]; }).length;
    var vencCrit = G.vencidas.filter(function (x) { return x.it.crit === "critico"; }).length;
    var h = ['<div class="pagina">'];
    h.push('<header class="pagina-cabeca"><h1>Rotinas de fiscalização</h1><p>Verificações periódicas da execução: diárias (confirmadas ao menos semanalmente), semanais, mensais, trimestrais e a cada medição. Registre cada verificação com a data e o resultado; a não conformidade exige descrição e providência. As rotinas começam com a ordem de serviço, ficam suspensas durante a paralisação total e se encerram com a conclusão; as de pós-obra começam no recebimento definitivo.</p></header>');

  function pontosCurva() {
    var s = calc.sit;
    var l = [{ rot: "Início", sub: s.inicio ? "Ordem de serviço em " + dataBR(s.inicio) : "Início da execução", exec: 0, prev: 0 }];

    });

  }
  function tabelaCurva() {

      l.map(function (p) { return '<tr><td class="id">' + esc(p.rot) + "</td><td>" + esc(p.sub) + '</td><td class="num">' + pct(p.exec) + '</td><td class="num">' + pct(p.prev) + '</td><td class="num">' + (p.desvio != null ? M.numero(p.desvio, 1) + " p.p." : "—") + "</td></tr>"; }).join("") + "</tbody></table></div>";
  }

  /* curva S em SVG: linhas de 2 px, grade em linhas finas, rótulos diretos no fim das linhas,
     cruz de leitura que se ajusta à medição mais próxima e leitura também pelo teclado */
  function desenharCurva() {
    var caixa = document.getElementById("curva-s");
    if (!caixa || !calc) return;
    var pts = pontosCurva();
    if (pts.length < 2) { caixa.innerHTML = '<p class="pequeno mudo">A curva aparece após a primeira medição.</p>'; return; }
    var NS = "http://www.w3.org/2000/svg";
    var W = Math.max(300, Math.round(caixa.clientWidth || 720)), H = 280;
    var estreito = W < 520;
    var mg = { e: 46, d: estreito ? 18 : 132, t: 16, b: 34 };
    var pw = W - mg.e - mg.d, ph = H - mg.t - mg.b;
    var maxV = 100;
    pts.forEach(function (p) { if (p.exec != null) maxV = Math.max(maxV, p.exec); if (p.prev != null) maxV = Math.max(maxV, p.prev); });
    maxV = Math.ceil(maxV / 25) * 25;
    var X = function (i) { return mg.e + (pts.length === 1 ? 0 : i * pw / (pts.length - 1)); };
    var Y = function (v) { return mg.t + ph - v / maxV * ph; };
    var el = function (tag, at, pai) { var e = document.createElementNS(NS, tag); Object.keys(at || {}).forEach(function (k) { e.setAttribute(k, at[k]); }); if (pai) pai.appendChild(e); return e; };
    var ult = pts[pts.length - 1];
    var resumo = "Curva S com " + (pts.length - 1) + " medição(ões). Executado acumulado de " + pct(ult.exec) + (ult.prev != null ? " e previsto de " + pct(ult.prev) : "") + " na última medição.";
    caixa.innerHTML = "";
    var alvo = document.createElement("div");
    alvo.className = "curva-alvo";
    alvo.tabIndex = 0;
    alvo.setAttribute("role", "img");
    alvo.setAttribute("aria-label", resumo + " Use as setas para percorrer as medições.");
    caixa.appendChild(alvo);
    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, "aria-hidden": "true", focusable: "false" }, alvo);
    for (var v = 0; v <= maxV; v += 25) {
      el("line", { x1: mg.e, x2: mg.e + pw, y1: Y(v), y2: Y(v), "class": v === 0 ? "c-base" : "c-grade" }, svg);
      var t = el("text", { x: mg.e - 8, y: Y(v) + 4, "class": "c-eixo", "text-anchor": "end" }, svg);
      t.textContent = v + "%";
    }
    var passo = Math.max(1, Math.ceil(pts.length / Math.max(2, Math.floor(pw / 46))));
    pts.forEach(function (p, i) {
      if (i % passo && i !== pts.length - 1) return;
      var t = el("text", { x: X(i), y: H - 10, "class": "c-eixo", "text-anchor": i === 0 ? "start" : (i === pts.length - 1 ? "end" : "middle") }, svg);
      t.textContent = p.rot;
    });
    var caminho = function (campo) {
      var dd = "", primeiro = true;
      pts.forEach(function (p, i) { if (p[campo] == null) return; dd += (primeiro ? "M" : "L") + X(i).toFixed(1) + " " + Y(p[campo]).toFixed(1) + " "; primeiro = false; });
      return dd.trim();
    };
    var dPrev = caminho("prev");
    if (dPrev && dPrev.indexOf("L") > 0) el("path", { d: dPrev, "class": "c-prev" }, svg);
    el("path", { d: caminho("exec"), "class": "c-exec" }, svg);
    pts.forEach(function (p, i) { if (i > 0 && p.exec != null) el("circle", { cx: X(i), cy: Y(p.exec), r: 4, "class": "c-ponto" }, svg); });
    var iPrev = -1;
    pts.forEach(function (p, i) { if (p.prev != null) iPrev = i; });
    if (!estreito) {
      var yE = Y(ult.exec), yP = iPrev > 0 ? Y(pts[iPrev].prev) : null;
      var colide = yP != null && Math.abs(yE - yP) < 18 && iPrev === pts.length - 1;
      if (!colide) {
        var rotE = el("text", { x: X(pts.length - 1) + 10, y: yE + 4, "class": "c-rot" }, svg); rotE.textContent = "Executado " + pct(ult.exec);
        if (yP != null) { var rotP = el("text", { x: X(iPrev) + 10, y: yP + 4, "class": "c-rot c-rot-sec" }, svg); rotP.textContent = "Previsto " + pct(pts[iPrev].prev); }
      }
    }
    var cruz = el("line", { x1: 0, x2: 0, y1: mg.t, y2: mg.t + ph, "class": "c-cruz", visibility: "hidden" }, svg);
    var foco = el("circle", { cx: 0, cy: 0, r: 5, "class": "c-ponto c-foco", visibility: "hidden" }, svg);
    var area = el("rect", { x: mg.e - 12, y: mg.t, width: pw + 24, height: ph, fill: "transparent", "class": "c-area" }, svg);
    var dica = document.createElement("div");
    dica.className = "grafico-dica";
    dica.hidden = true;
    alvo.appendChild(dica);
    var atual = -1;
    var linhaDica = function (classe, valor, rotulo) {
      var lin = document.createElement("div"); lin.className = "dica-linha";
      var k = document.createElement("i"); k.className = classe; k.setAttribute("aria-hidden", "true");
      var b = document.createElement("b"); b.textContent = valor;
      var sp = document.createElement("span"); sp.textContent = rotulo;
      lin.appendChild(k); lin.appendChild(b); lin.appendChild(sp);
      return lin;
    };
    var mostrar = function (i) {
      atual = i;
      var p = pts[i], x = X(i);
      cruz.setAttribute("x1", x); cruz.setAttribute("x2", x); cruz.setAttribute("visibility", "visible");
      if (p.exec != null) { foco.setAttribute("cx", x); foco.setAttribute("cy", Y(p.exec)); foco.setAttribute("visibility", "visible"); }

      campoModal("mx-aloc", "Responsável pelo risco", '<select id="mx-aloc" name="alocacao">' + opcoesHtml(CFG.escalas.alocacoes, mx.alocacao, "A definir") + "</select>") +
      campoModal("mx-mec", "Mecanismo de tratamento", '<select id="mx-mec" name="mecanismo">' + opcoesHtml(CFG.escalas.mecanismos, mx.mecanismo, "A definir") + "</select>") +

      botoes: [{ rotulo: "Cancelar" }, {

      campoModal("rx-evento", "Evento de risco *", '<input type="text" id="rx-evento" name="evento" value="' + attr(r.evento) + '">', true) +
      campoModal("rx-causa", "Causa", '<textarea id="rx-causa" name="causa">' + esc(r.causa || "") + "</textarea>") +
      campoModal("rx-cons", "Consequência para a execução", '<textarea id="rx-cons" name="consequencia">' + esc(r.consequencia || "") + "</textarea>") +
      campoModal("rx-p", "Probabilidade", '<select id="rx-p" name="p">' + opcoesHtml(e5(CFG.escalas.probabilidade), r.p) + "</select>") +

      campoModal("rx-resp", "Responsável", '<input type="text" id="rx-resp" name="responsavel" value="' + attr(r.responsavel) + '">') +
      campoModal("rx-prazo", "Prazo da medida", '<input type="date" id="rx-prazo" name="prazo" value="' + attr(r.prazo) + '">') + "</form>";
    abrirModal({
      titulo: novo ? "Novo risco da execução" : "Editar " + r.id, descricao: "Mapa de riscos da execução, com medidas preventivas.", corpo: corpo, largo: true, foco: "#rx-evento",

          var d = doc();
          if (novo) { var n = M.novoRisco(d, dadosR); historico("Risco " + n.id + " incluído no mapa da execução"); avisar(n.id + " incluído."); }
          else { M.mesclar(r, dadosR); historico("Risco " + r.id + " alterado"); avisar(r.id + " atualizado."); }
          salvar(); render();
        }
      }]
    });
  }

  /* ------------------------------- alertas ------------------------------- */
  VIEWS.alertas = function () {
    var d = doc(), r = calc;
    var h = ['<div class="pagina">'];
    h.push('<header class="pagina-cabeca"><h1>Alertas e inconsistências</h1><p>Inconsistências entre os dados do contrato, os registros e a legislação, alertas específicos deste contrato e a explicação de por que cada exigência foi ativada.</p></header>');
    h.push('<section class="bloco"><h2>Inconsistências (' + r.inconsistencias.length + ")</h2>");
    if (!r.inconsistencias.length) h.push('<div class="vazio"><p>Nenhuma inconsistência identificada com os dados atuais.</p></div>');
    else {
      h.push('<ul class="alerta-lista">' + r.inconsistencias.map(function (i) {
        var alvo = i.visao ? '<button type="button" class="btn pequeno" data-acao="ir" data-visao="' + i.visao + '"' + (i.aba ? ' data-aba="' + i.aba + '"' : "") + ">Resolver</button>" : (i.etapa ? '<button type="button" class="btn pequeno" data-acao="abrir-etapa" data-etapa="' + i.etapa + '">Ir para ' + i.etapa + "</button>" : "");
        return '<li class="alerta ' + i.nivel + '">' + (i.nivel === "erro" ? IC.erro : i.nivel === "aviso" ? IC.aviso : IC.info) + "<div><b>" + esc(i.titulo) + '</b> <span class="etiqueta ' + (i.nivel === "erro" ? "cheia-critico" : i.nivel === "aviso" ? "cheia-aviso" : "cheia-info") + '">' + (i.nivel === "erro" ? "Bloqueante" : i.nivel === "aviso" ? "Atenção" : "Informação") + "</span><p>" + esc(i.detalhe) + "</p></div>" + alvo + "</li>";
      }).join("") + "</ul>");
    }
    h.push("</section>");
    h.push('<section class="bloco"><h2>Alertas para este contrato (' + r.alertas.length + ")</h2>");
    if (!r.alertas.length) h.push('<p class="mudo">Sem alertas específicos com os dados atuais.</p>');
    else h.push('<ul class="alerta-lista">' + r.alertas.map(function (a) { return '<li class="alerta info">' + IC.info + "<div><b>" + esc(a.titulo) + "</b><p>" + esc(a.texto) + '</p><p class="motivo-linha">Ativado porque: ' + esc(a.regra ? M.explicarAtivo(a.regra, r.ctx, CFG) : a.motivo) + "</p></div><span></span></li>"; }).join("") + "</ul>");
    h.push("</section>");
    var grupos = {}, ordem = [];
    r.ativos.forEach(function (it) {
      if (!it.regra) return;
      var k = M.explicarAtivo(it.regra, r.ctx, CFG);
      if (!grupos[k]) { grupos[k] = []; ordem.push(k); }
      grupos[k].push(it);
    });
    h.push('<section class="bloco"><h2>Por que cada exigência foi ativada</h2><p class="mudo">Itens que dependem de condições do cadastro, agrupados pela condição atendida. Itens sem condição valem para todos os contratos.</p>');
    ordem.forEach(function (k) {
      h.push('<details class="porque"><summary>' + esc(k) + " (" + grupos[k].length + ")</summary><ul>" + grupos[k].map(function (it) { return '<li><button type="button" class="btn sutil pequeno" data-acao="abrir-etapa" data-etapa="' + it.etapa + '" data-item="' + attr(it.id) + '">' + esc(it.id) + "</button> " + esc(it.titulo) + "</li>"; }).join("") + "</ul></details>");
    });
    h.push("</section>");
    if (d.ressalvas.length) {
      h.push('<section class="bloco"><h2>Avanços com ressalva</h2><div class="tabela-wrap"><table class="tabela"><thead><tr><th>Data</th><th>Etapas</th><th>Pendências críticas</th><th>Motivação</th></tr></thead><tbody>' + d.ressalvas.map(function (x) { return "<tr><td>" + dataBR(x.em) + "</td><td>" + esc(x.de + " para " + x.para) + "</td><td>" + esc((x.pendentes || []).join(", ")) + "</td><td>" + esc(x.texto) + "</td></tr>"; }).join("") + "</tbody></table></div></section>");
    }
    var hist = (d.historico || []).slice(-30).reverse();
    h.push('<section class="bloco"><h2>Histórico de registros</h2>' + (hist.length ? '<ul class="historico">' + hist.map(function (x) { return '<li><span class="curto mudo">' + esc(new Date(x.em).toLocaleString("pt-BR")) + "</span> " + esc(x.texto) + "</li>"; }).join("") + "</ul>" : '<p class="mudo">Sem registros.</p>') + "</section>");
    h.push("</div>");
    return h.join("");
  };

  /* ------------------------------- base normativa ------------------------------- */
  function textoConteudo(def) {
    return (def.conteudo || []).map(function (b) { return b.fonte + " " + (b.elementos || []).map(function (e) { return e[0] + " " + (e[1] || []).join(" "); }).join(" "); }).join(" ");
  }
  function contarConteudo(def) {
    var n = 0;
    (def.conteudo || []).forEach(function (b) { (b.elementos || []).forEach(function (e) { n += (e[1] || []).length; }); });
    return n;
  }

      '<div class="acoes"><button type="button" class="btn" data-acao="exportar-base">' + IC.exportar + 'Exportar base (JSON)</button><button type="button" class="btn" data-acao="importar-base">' + IC.importar + "Importar base</button>" + (baseCustomizada ? '<button type="button" class="btn perigo" data-acao="restaurar-base">Restaurar base original</button>' : "") + "</div></header>");

      cont.map(function (c) { return "<tr><td>" + esc(c.rotulo) + '</td><td class="num">' + c.itens + '</td><td class="num">' + c.periodicos + '</td><td class="num">' + c.criticos + '</td><td class="num">' + c.alertas + "</td></tr>"; }).join("") + "</tbody></table></div></section>");
    h.push('<section class="bloco"><div class="bloco-cabeca"><h2>Catálogo de itens (' + CFG.itens.length + ')</h2><div class="acoes"><div class="campo"><label for="fb-etapa">Etapa</label><select id="fb-etapa" data-filtro-base="etapa"><option value="">Todas</option>' + CFG.etapas.map(function (e) { return '<option value="' + e.id + '"' + (ui.fBase.etapa === e.id ? " selected" : "") + ">" + e.id + " " + esc(e.curto) + "</option>"; }).join("") + '</select></div><div class="campo"><label for="fb-busca">Buscar</label><input type="text" id="fb-busca" data-filtro-base="busca" value="' + attr(ui.fBase.busca) + '" placeholder="Texto, norma ou ID"></div></div></div>');

    h.push('<div class="tabela-wrap"><table class="tabela" id="tabela-base"><thead><tr><th>ID</th><th>Item</th><th>Criticidade</th><th>Aplicabilidade</th><th>Base</th></tr></thead><tbody>' + itens.map(function (it) {

      "<li><b>Conteúdo normativo.</b> As referências a leis, decretos, instruções, manuais e normas técnicas foram selecionadas a título de orientação, com base normativa de " + esc(CFG.dataBaseNormativa) + ", e podem ter sido alteradas, revogadas ou complementadas. Exigências estaduais e municipais e as cláusulas de cada contrato prevalecem no caso concreto. Confirme sempre a vigência e a aplicabilidade.</li>" +

  function slug(s) {
    return String(s || "obra").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "obra";
  }
  function baixar(nome, conteudo, tipo) {
    var blob = new Blob([conteudo], { type: tipo });
    var U = window.URL || window.webkitURL;
    if (!U || !U.createObjectURL) { avisar("O navegador não permitiu o download do arquivo."); return false; }
    var url = U.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nome; a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { U.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 800);
    return true;
  }
  function exportarObra(d) {
    d = d || doc();

  }
  function importarTexto(texto) {
    var j;

    if (ui.modoImportacao === "base") {
      var erroB = M.validarConfig(j);
      if (erroB) { avisar("Base não importada: " + erroB); return; }
      gravarLS(LS_BASE, JSON.stringify(j));
      CFG = j; baseCustomizada = true;
      avisar("Base normativa importada: versão " + (j.versao || "sem número") + ".");
      render(); return;
    }
    var lista = j && j.obras && typeof j.obras === "object" && !j.obra ? Object.keys(j.obras).map(function (k) { var x = j.obras[k]; if (x && j.modulo && !x.modulo) x.modulo = j.modulo; return x; }) : [j];
    var importadas = 0, doPlan = 0, ultimo = null, erro = null;
    lista.forEach(function (d0) {
      var e = M.validarDoc(d0);
      if (e) { erro = e; return; }
      var plan = d0.modulo === "planejamento";
      var d;
      try { d = M.migrar(CFG, d0); } catch (ex) { erro = "arquivo com estrutura inesperada."; return; }
      if (plan && Object.keys(dados.obras).some(function (k) { var o = dados.obras[k]; return o.origem && o.origem.idOriginal && o.origem.idOriginal === d0.id; })) d.obra.nome = (d.obra.nome || "Obra") + " (nova importação)";
      if (dados.obras[d.id]) { d.id = M.uid("ob"); d.obra.nome = (d.obra.nome || "Obra") + " (importada)"; }
      dados.obras[d.id] = d;
      importadas++; if (plan) doPlan++; ultimo = d.id;
    });
    if (!importadas) { avisar("Nada importado: " + (erro || "arquivo sem contratos.")); return; }
    reiniciarNavegacao();
    dados.ativa = ultimo;
    gravarAgora();
    if (doPlan) {
      avisar(doPlan === 1 ? "Obra importada do ObraCheck Planejamento. Complete os dados do contrato celebrado." : doPlan + " obras importadas do ObraCheck Planejamento.");
      ir("cadastro");
    } else {
      avisar(importadas === 1 ? "Contrato importado." : importadas + " contratos importados.");
      ir("painel");
    }
  }

    },
    "nova-ocorrencia": function (el) { formOcorrencia(null, el.getAttribute("data-tipo")); },
    "editar-ocorrencia": function (el) { var o = acharEm(doc().ocorrencias, el.getAttribute("data-id")); if (o) formOcorrencia(o); },
    "excluir-ocorrencia": function (el) {
      var d = doc(), o = acharEm(d.ocorrencias, el.getAttribute("data-id"));
      if (!o) return;
      confirmar("Excluir ocorrência", "Excluir a ocorrência nº " + (o.numero || "") + " (" + M.rotuloLista(CFG.tiposOcorrencia, o.tipo).toLowerCase() + ")?", "Excluir", function () { M.remover(d, "ocorrencias", o.id); historico("Ocorrência nº " + (o.numero || "") + " excluída"); salvar(); render(); }, true);
    },
    "novo-matriz": function () { formMatriz(null); },
    "editar-matriz": function (el) { var m = acharEm(doc().matriz, el.getAttribute("data-id")); if (m) formMatriz(m); },
    "excluir-matriz": function (el) {
      var d = doc(), m = acharEm(d.matriz, el.getAttribute("data-id"));
      if (!m) return;
      confirmar("Excluir risco da matriz", "Excluir " + m.id + " (" + m.descricao + ")? Ocorrências vinculadas perderão a referência.", "Excluir", function () { M.remover(d, "matriz", m.id); historico("Risco " + m.id + " excluído da matriz"); salvar(); render(); }, true);
    },
    "novo-risco": function () { formRisco(null); },
    "editar-risco": function (el) { var r = acharEm(doc().riscos, el.getAttribute("data-id")); if (r) formRisco(r); },
    "excluir-risco": function (el) {
      var d = doc(), r = acharEm(d.riscos, el.getAttribute("data-id"));
      if (!r) return;
      confirmar("Excluir risco da execução", "Excluir " + r.id + " (" + r.evento + ")?", "Excluir", function () { M.remover(d, "riscos", r.id); historico("Risco " + r.id + " excluído"); salvar(); render(); }, true);
    },
    "marcar-checklist": function (el) {
      var pre = el.getAttribute("data-alvo"), m = $(".modal");
      var caixa = m && $("#" + pre + "-checklist", m);
      if (!caixa) return;
      var todos = $$("input[name=checks]", caixa);
      var marcar = todos.some(function (x) { return !x.checked; });
      todos.forEach(function (x) { x.checked = marcar; });
      el.textContent = marcar ? "Desmarcar todas" : "Marcar todas";
      contarChecklist(m, pre);
    },
    "imprimir": function () {
      var html = Relatorio.gerar(CFG, doc(), calc);
      var ifr = document.createElement("iframe");
      ifr.setAttribute("aria-hidden", "true");
      ifr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;";
      document.body.appendChild(ifr);
      try {
        var w = ifr.contentWindow;
        w.document.open(); w.document.write(html); w.document.close();
        setTimeout(function () {
          try { w.focus(); w.print(); } catch (e) { avisar("Não foi possível abrir a impressão. Use Baixar relatório e imprima pelo navegador."); }
          setTimeout(function () { if (ifr.parentNode) ifr.parentNode.removeChild(ifr); }, 60000);
        }, 300);
      } catch (e) { avisar("Não foi possível preparar a impressão. Use Baixar relatório."); }
    },
    "baixar-relatorio": function () {
      var d = doc();
      if (baixar("relatorio-fiscalizacao-" + slug(d.obra.nome) + "-" + M.hoje() + ".html", Relatorio.gerar(CFG, d, calc), "text/html")) avisar("Relatório baixado.");
    }
  };

  /* ------------------------------- eventos ------------------------------- */
  function valorDoCampo(el) {
    var t = el.getAttribute("data-tipo");
    if (el.type === "checkbox") return el.checked;
    if (t === "numero" || t === "moeda") return M.num(el.value);
    return el.value;
  }
  function aoMudarCampo(el) {
    var d = doc();
    if (!d) return;
    var caminho = el.getAttribute("data-campo");
    var antes = M.obter(d, caminho);
    var v = valorDoCampo(el);
    M.definir(d, caminho, v);
    var sujo = !!ui.sujos[caminho];
    delete ui.sujos[caminho];
    if (antes === v && !sujo) return;
    var chave = caminho.replace(/^obra\./, "");
    var rotulo = (M.mapaRotulos(CFG)[chave] || {}).rotulo || chave;
    if (el.type !== "text" && el.tagName !== "TEXTAREA") historico(rotulo + " alterado");
    salvar();
    renderSeguro();
  }

  /* conferência do roteiro (marcações gravadas no registro do item) */
  function marcarConteudo(id, todos) {
    var d = doc(), it = calc && calc.porId[id];
    if (!d || !it || !it.conteudo) return;
    var reg = d.itens[id] = d.itens[id] || {};
    reg.conferidos = todos ? M.chavesConteudo(it.conteudo) : [];
    historico(id + ": roteiro " + (todos ? "todo conferido" : "desmarcado"));
    salvar();
    render();
  }
  function alternarConferencia(el) {
    var d = doc(), id = el.getAttribute("data-conferir"), k = el.getAttribute("data-chave");
    if (!d) return;
    var reg = d.itens[id] = d.itens[id] || {};
    var l = Array.isArray(reg.conferidos) ? reg.conferidos.slice() : [];
    var i = l.indexOf(k);
    if (el.checked && i < 0) l.push(k);
    if (!el.checked && i >= 0) l.splice(i, 1);
    reg.conferidos = l;
    salvar();
    renderSeguro();
  }

  function aoInput(ev) {
    var el = ev.target;
    if (el.closest && el.closest(".modal")) return;
    if (el.hasAttribute("data-campo")) {
      var t = el.getAttribute("data-tipo");
      if (t === "texto" || t === "textoLongo" || t === "numero" || t === "moeda" || t === "mes" || t === "data") {
        var d = doc();
        if (!d) return;
        M.definir(d, el.getAttribute("data-campo"), valorDoCampo(el));
        ui.sujos[el.getAttribute("data-campo")] = true;
        if (t === "moeda") { var f = document.getElementById(el.id + "-fmt"); if (f) f.textContent = el.value ? M.moeda(el.value) : ""; }
        salvar();
      }
      return;
    }
    if (el.hasAttribute("data-reg") && (el.tagName === "TEXTAREA" || el.type === "text")) {
      var dd = doc(), id = el.getAttribute("data-item");
      dd.itens[id] = dd.itens[id] || {};
      dd.itens[id][el.getAttribute("data-reg")] = el.value;
      salvar();
      return;
    }
    if (el.hasAttribute("data-filtro-base") && el.type === "text") {
      ui.fBase.busca = el.value;
      clearTimeout(ui.tBusca);
      ui.tBusca = setTimeout(function () { render(); }, 220);
    }
  }

  function aoChange(ev) {
    var el = ev.target;
    if (el.id === "sel-obra") { if (el.value) { if (dados.ativa !== el.value) reiniciarNavegacao(); dados.ativa = el.value; gravarAgora(); ir(ui.visao === "inicio" ? "painel" : ui.visao); } return; }
    if (el.id === "arquivo") {
      var arq = el.files && el.files[0];
      if (!arq) return;
      var leitor = new FileReader();
      leitor.onload = function () { importarTexto(String(leitor.result || "")); };
      leitor.onerror = function () { avisar("Não foi possível ler o arquivo."); };
      leitor.readAsText(arq, "utf-8");
      return;
    }
    if (el.closest && el.closest(".modal")) return;
    if (el.hasAttribute("data-status-item")) { mudarStatus(el.getAttribute("data-status-item"), el.value); return; }
    if (el.hasAttribute("data-conferir")) { alternarConferencia(el); return; }
    if (el.hasAttribute("data-campo")) { aoMudarCampo(el); return; }
    if (el.hasAttribute("data-sel-rotina")) { ui.selRot[el.getAttribute("data-sel-rotina")] = el.checked; renderSeguro(); return; }
    if (el.hasAttribute("data-lote")) { ui.dataLote = el.value; return; }
    if (el.hasAttribute("data-reg")) {
      var d = doc(), id = el.getAttribute("data-item"), campo = el.getAttribute("data-reg");
      d.itens[id] = d.itens[id] || {};
      d.itens[id][campo] = el.value;
      salvar();
      if (el.type === "date" || el.tagName === "SELECT") renderSeguro();
      return;
    }
    if (el.hasAttribute("data-filtro-oc")) { ui.fOc[el.getAttribute("data-filtro-oc")] = el.value; render(); return; }
    if (el.hasAttribute("data-filtro-base") && el.tagName === "SELECT") { ui.fBase.etapa = el.value; render(); }
  }

  function aoClicar(ev) {
    var mb = ev.target.closest("[data-modal-acao]");
    if (mb && modal) {
      var atual = modal;
      var b = atual.o.botoes[+mb.getAttribute("data-modal-acao")];
      var r = b && b.acao ? b.acao($(".modal")) : undefined;
      if (r !== false && modal === atual) fecharModal();
      return;
    }
    var fundo = ev.target.classList && ev.target.classList.contains("modal-fundo") && ev.target.hasAttribute("data-fundo");
    if (fundo) { fecharModal(); return; }
    var alvo = ev.target.closest("[data-acao]");
    if (!alvo || alvo.disabled) return;
    var acao = alvo.getAttribute("data-acao");
    if (ACOES[acao]) { ev.preventDefault(); ACOES[acao](alvo, ev); }
  }

  function aoTeclar(ev) {
    if (!modal) return;
    if (ev.key === "Escape" && !modal.o.bloqueante) { ev.preventDefault(); fecharModal(); return; }
    if (ev.key === "Tab") {
      var foc = $$('.modal button:not([disabled]), .modal input:not([disabled]), .modal select, .modal textarea, .modal [href]').filter(function (x) { return x.offsetParent !== null || x === document.activeElement; });
      if (!foc.length) return;
      var pri = foc[0], ult = foc[foc.length - 1];
      if (ev.shiftKey && document.activeElement === pri) { ev.preventDefault(); ult.focus(); }
      else if (!ev.shiftKey && document.activeElement === ult) { ev.preventDefault(); pri.focus(); }
    }
  }

  /* ------------------------------- início ------------------------------- */
  function iniciar() {
    carregar();
    aplicarTema();
    $(".marca").insertAdjacentHTML("afterbegin", LOGO);
    if (doc()) ui.visao = "painel";
    document.addEventListener("click", aoClicar);
    document.addEventListener("change", aoChange);
    document.addEventListener("input", aoInput);
    document.addEventListener("keydown", aoTeclar);
    document.addEventListener("pointerdown", function () { ponteiroAbaixo = true; }, true);
    document.addEventListener("pointerup", function () {
      ponteiroAbaixo = false;
      if (renderPendente) setTimeout(function () { if (renderPendente) render(); }, 0);
    }, true);
    document.addEventListener("pointercancel", function () { ponteiroAbaixo = false; if (renderPendente) render(); }, true);
    window.addEventListener("beforeunload", function () { if (timerSalvar) gravarAgora(); });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden" && timerSalvar) gravarAgora(); });
    window.addEventListener("resize", function () { clearTimeout(ui.tRedim); ui.tRedim = setTimeout(function () { if (ui.visao === "medicoes" && calc) desenharCurva(); }, 150); });
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var f = function () { if (dados.prefs.tema === "auto") renderTopo(); };
      if (mq.addEventListener) mq.addEventListener("change", f); else if (mq.addListener) mq.addListener(f);
    }
    render();
    mostrarAbertura();
  }

  window.ObraCheck = { versao: CFG_ORIGINAL.versao, modulo: "fiscalizacao", duracaoAbertura: DURACAO_ABERTURA, estado: function () { return { dados: dados, ui: ui, calc: calc, cfg: CFG }; } };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
  else iniciar();
})();

</script>
</body>
</html>
