<style>
/* =====================================================================
   ObraCheck · Fiscalização — estilos
   Mesma linguagem do ObraCheck Planejamento (papel e nanquim, vermelho
   reservado a bloqueios), com o trilho de etapas F1 a F10, medidores,
   indicadores, rotinas periódicas e a curva S das medições.
   ===================================================================== */
:root {
  --papel: #edf0f2;
  --superficie: #ffffff;
  --superficie-2: #f5f7f8;
  --tinta: #16202a;
  --grafite: #52606d;
  --linha: #cad2d9;
  --linha-forte: #8f9ca8;
  --azul: #1e4e8c;
  --azul-texto: #1e4e8c;
  --azul-suave: #e3ecf6;
  --vermelho: #b3261e;
  --vermelho-suave: #f8e3e0;
  --ocre: #9a6206;
  --ocre-suave: #f7ebd3;
  --verde: #2b7a4b;
  --verde-suave: #dff0e5;
  --cinza: #8a949e;
  --cinza-suave: #e8ecef;
  --topo: #16202a;
  --topo-texto: #e9eef2;
  --topo-mudo: #a9b6c2;
  --sombra-modal: 0 18px 48px rgba(16, 24, 32, .28);
  --fonte-titulo: "Bahnschrift", "DIN Alternate", "DIN Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --fonte-texto: "Segoe UI", system-ui, -apple-system, "Roboto", "Helvetica Neue", Arial, sans-serif;
  --raio-p: 3px;
  --raio-m: 6px;
  --viz-acento: #2a78d6;
  --viz-ref: #52606d;
  --st-alerta: #fab219;
  --st-critico: #d03b3b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #10161c; --superficie: #17202a; --superficie-2: #1c2733; --tinta: #e4eaf0; --grafite: #9aa8b5;
    --linha: #2b3846; --linha-forte: #4a5a6a; --azul: #8db4e8; --azul-texto: #a9c8f0; --azul-suave: #1c2d44;
    --vermelho: #f08a80; --vermelho-suave: #3a1f1f; --ocre: #e4b04f; --ocre-suave: #3a2e16; --verde: #6cc793;
    --verde-suave: #183226; --cinza: #7d8995; --cinza-suave: #222d38; --topo: #0d1319; --topo-texto: #e4eaf0; --topo-mudo: #8c9aa8;
    --sombra-modal: 0 18px 48px rgba(0, 0, 0, .55);
    --viz-acento: #3987e5; --viz-ref: #9aa8b5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #10161c; --superficie: #17202a; --superficie-2: #1c2733; --tinta: #e4eaf0; --grafite: #9aa8b5;
  --linha: #2b3846; --linha-forte: #4a5a6a; --azul: #8db4e8; --azul-texto: #a9c8f0; --azul-suave: #1c2d44;
  --vermelho: #f08a80; --vermelho-suave: #3a1f1f; --ocre: #e4b04f; --ocre-suave: #3a2e16; --verde: #6cc793;
  --verde-suave: #183226; --cinza: #7d8995; --cinza-suave: #222d38; --topo: #0d1319; --topo-texto: #e4eaf0; --topo-mudo: #8c9aa8;
  --sombra-modal: 0 18px 48px rgba(0, 0, 0, .55);
  --viz-acento: #3987e5; --viz-ref: #9aa8b5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--papel); color: var(--tinta);
  font-family: var(--fonte-texto); font-size: 15px; line-height: 1.5;
}
h1, h2, h3, h4 { font-family: var(--fonte-titulo); font-weight: 600; line-height: 1.2; margin: 0; letter-spacing: .1px; }
h1 { font-size: 28px; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
p { margin: 0 0 10px; }
a { color: var(--azul-texto); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pular-link { position: absolute; left: 8px; top: -60px; background: var(--azul); color: #fff; padding: 8px 12px; z-index: 300; border-radius: var(--raio-p); }
.pular-link:focus { top: 8px; }
.num { font-variant-numeric: tabular-nums; }
.mudo { color: var(--grafite); }
.pequeno { font-size: 13px; }

/* ----------------------------- estrutura ----------------------------- */
.app {
  min-height: 100vh; display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  grid-template-rows: 56px minmax(0, 1fr);
  grid-template-areas: "topo topo" "nav main";
}
.topo {
  grid-area: topo; background: var(--topo); color: var(--topo-texto);
  display: flex; align-items: center; gap: 18px; padding: 0 18px; position: sticky; top: 0; z-index: 50;
}
.marca { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.marca svg { align-self: center; flex: none; }
.marca-nome { font-family: var(--fonte-titulo); font-size: 21px; font-weight: 600; letter-spacing: .3px; }
.marca-mod { font-family: var(--fonte-titulo); font-size: 15px; color: var(--topo-mudo); }
.topo-obra { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.topo-obra select {
  max-width: 420px; width: 100%; background: transparent; color: var(--topo-texto);
  border: 1px solid rgba(233, 238, 242, .28); border-radius: var(--raio-p); padding: 6px 30px 6px 10px; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--topo-mudo) 50%), linear-gradient(135deg, var(--topo-mudo) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat;
}
.topo-obra select option { color: #16202a; background: #fff; }
.topo-acoes { display: flex; gap: 4px; }
.topo-acoes button {
  background: transparent; border: 1px solid transparent; color: var(--topo-texto); padding: 6px 10px;
  border-radius: var(--raio-p); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.topo-acoes button:hover { border-color: rgba(233, 238, 242, .3); }
.topo-acoes svg { width: 16px; height: 16px; }

.lateral { grid-area: nav; border-right: 1px solid var(--linha); background: var(--superficie); padding: 14px 10px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
.lateral ul { list-style: none; margin: 0; padding: 0; }
.lateral li + li { margin-top: 2px; }
.lateral button {
  width: 100%; text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: var(--raio-p); cursor: pointer;
  display: flex; align-items: center; gap: 10px; color: var(--tinta);
}
.lateral button:hover { background: var(--superficie-2); }
.lateral button[aria-current="page"] { background: var(--azul-suave); color: var(--azul-texto); font-weight: 600; }
.lateral button:disabled { color: var(--cinza); cursor: not-allowed; background: none; }
.lateral svg { width: 18px; height: 18px; flex: none; }
.lateral .contagem { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; padding: 1px 7px; border-radius: 10px; background: var(--cinza-suave); color: var(--grafite); }
.lateral .contagem.alerta { background: var(--vermelho-suave); color: var(--vermelho); font-weight: 600; }
.lateral-rodape { margin-top: 18px; padding: 12px; border-top: 1px solid var(--linha); font-size: 12px; color: var(--grafite); }

main { grid-area: main; min-width: 0; padding: 28px 32px 64px; outline: none; }
.pagina { max-width: 1180px; }
.pagina-cabeca { margin-bottom: 22px; }
.pagina-cabeca p { color: var(--grafite); margin: 6px 0 0; max-width: 78ch; }
.pagina-cabeca .acoes { margin-top: 14px; }

/* ----------------------------- componentes ----------------------------- */
.bloco { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-m); padding: 20px 22px; }
.bloco + .bloco { margin-top: 18px; }
.grade-2 > .bloco, .grade-3 > .bloco, .colunas > .bloco, .indicadores > .bloco { margin-top: 0; }
.bloco h2 { font-size: 18px; margin-bottom: 12px; }
.bloco-cabeca { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.bloco-cabeca h2 { margin: 0; }
.grade-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grade-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--linha-forte); background: var(--superficie); color: var(--tinta); font-weight: 500; text-decoration: none; line-height: 1.3;
}
.btn:hover { border-color: var(--tinta); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
:root[data-theme="dark"] .btn.primario { color: #0d1319; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primario { color: #0d1319; } }
.btn.primario:hover { filter: brightness(1.08); }
.btn.perigo { color: var(--vermelho); border-color: var(--vermelho); background: var(--superficie); }
.btn.sutil { border-color: transparent; background: transparent; color: var(--azul-texto); padding: 6px 8px; }
.btn.sutil:hover { background: var(--azul-suave); }
.btn.pequeno { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.etiqueta {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; line-height: 1;
  padding: 4px 7px; border-radius: var(--raio-p); border: 1px solid currentColor; white-space: nowrap;
}
.etiqueta.critico { color: var(--vermelho); }
.etiqueta.importante { color: var(--ocre); }
.etiqueta.recomendado { color: var(--grafite); }
.etiqueta.cheia-critico { background: var(--vermelho-suave); color: var(--vermelho); border-color: transparent; }
.etiqueta.cheia-ok { background: var(--verde-suave); color: var(--verde); border-color: transparent; }
.etiqueta.cheia-aviso { background: var(--ocre-suave); color: var(--ocre); border-color: transparent; }
.etiqueta.cheia-info { background: var(--azul-suave); color: var(--azul-texto); border-color: transparent; }
.etiqueta.cheia-neutra { background: var(--cinza-suave); color: var(--grafite); border-color: transparent; }

.faixa { border-left: 4px solid var(--azul); background: var(--azul-suave); padding: 12px 16px; border-radius: 0 var(--raio-m) var(--raio-m) 0; margin: 0 0 18px; }
.faixa.aviso { border-color: var(--ocre); background: var(--ocre-suave); }
.faixa.erro { border-color: var(--vermelho); background: var(--vermelho-suave); }
.faixa.ok { border-color: var(--verde); background: var(--verde-suave); }
.faixa p:last-child { margin: 0; }

.barra { height: 8px; background: var(--cinza-suave); border-radius: 4px; overflow: hidden; }
.barra span { display: block; height: 100%; background: var(--azul); border-radius: 4px; }
.barra.verde span { background: var(--verde); }

.vazio { text-align: left; padding: 22px; border: 1px dashed var(--linha-forte); border-radius: var(--raio-m); color: var(--grafite); }
.vazio p { margin-bottom: 12px; }

/* ----------------------------- trilho de etapas ----------------------------- */
.trilho { list-style: none; margin: 0; padding: 4px 2px 10px; display: flex; align-items: flex-start; overflow-x: auto; scrollbar-width: thin; }
.estacao { flex: 0 0 auto; width: 72px; }
.estacao button { width: 100%; background: none; border: 0; padding: 4px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--tinta); border-radius: var(--raio-m); }
.estacao button:hover .no { transform: translateY(-1px); }
.no {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; position: relative;
  border: 2px solid var(--cinza); background: var(--superficie); color: var(--grafite);
  font-family: var(--fonte-titulo); font-weight: 600; font-size: 13px; transition: transform .12s ease;
}
.estacao-nome { font-size: 12px; text-align: center; line-height: 1.25; color: var(--grafite); max-width: 76px; }
.estacao-pct { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--grafite); }
.s-verde .no { background: var(--verde); border-color: var(--verde); color: #fff; }
:root[data-theme="dark"] .s-verde .no { color: #0d1319; }
.s-amarelo .no { border-color: var(--ocre); color: var(--ocre); background: conic-gradient(var(--ocre-suave) 0 50%, var(--superficie) 50% 100%); }
.s-vermelho .no { border-color: var(--vermelho); color: var(--vermelho); background: var(--vermelho-suave); }
.s-vermelho .no::after { content: ""; position: absolute; top: -3px; right: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--vermelho); border: 2px solid var(--superficie); }
.estacao.atual .no { box-shadow: 0 0 0 3px var(--superficie), 0 0 0 5px var(--tinta); }
.estacao.atual .estacao-nome { color: var(--tinta); font-weight: 600; }
.portao { flex: 1 1 16px; min-width: 16px; position: relative; height: 46px; }
.portao::before { content: ""; position: absolute; left: -2px; right: -2px; top: 23px; height: 2px; background: var(--linha-forte); }
/* portão fechado: barra vermelha que interrompe o trilho; aberto: braço levantado sobre o trilho */
.portao span { position: absolute; left: 50%; top: 11px; width: 4px; height: 25px; margin-left: -2px; border-radius: 2px; background: var(--vermelho); box-shadow: 0 0 0 3px var(--superficie); transform-origin: 50% 100%; transition: transform .25s ease; }
.portao.aberto span { width: 3px; margin-left: -1.5px; background: var(--linha-forte); box-shadow: none; transform: translateY(-12px) rotate(-58deg); }
.trilho.compacto .estacao { width: 54px; }
.trilho.compacto .no { width: 32px; height: 32px; font-size: 12px; }
.trilho.compacto .estacao-nome { display: none; }
.trilho.compacto .portao { height: 40px; }
.trilho.compacto .portao::before { top: 20px; }
.trilho.compacto .portao span { top: 9px; height: 22px; }
.trilho.compacto .portao.aberto span { transform: translateY(-11px) rotate(-58deg); }
.legenda-trilho { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--grafite); margin-top: 6px; }
.legenda-trilho span { display: inline-flex; align-items: center; gap: 6px; }
.legenda-trilho i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--cinza); display: inline-block; }
.legenda-trilho i.v { background: var(--verde); border-color: var(--verde); }
.legenda-trilho i.a { border-color: var(--ocre); background: conic-gradient(var(--ocre-suave) 0 50%, var(--superficie) 50% 100%); }
.legenda-trilho i.r { border-color: var(--vermelho); background: var(--vermelho-suave); }
.legenda-trilho b { display: inline-block; width: 4px; height: 14px; background: var(--vermelho); border-radius: 2px; }
.legenda-trilho em { display: inline-block; width: 3px; height: 13px; margin: 0 4px 0 6px; background: var(--linha-forte); border-radius: 2px; transform: rotate(-58deg); }

/* ----------------------------- painel ----------------------------- */
.painel-topo { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; margin-bottom: 18px; }
.ficha { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--linha-forte); border-radius: var(--raio-m); overflow: hidden; background: var(--superficie); }
.ficha > div { padding: 10px 12px; border-right: 1px solid var(--linha); border-bottom: 1px solid var(--linha); min-width: 0; }
.ficha > div:nth-child(4n) { border-right: 0; }
.ficha .r { display: block; font-size: 12px; color: var(--grafite); }
.ficha .v { font-weight: 600; overflow-wrap: anywhere; }
.ficha .largo { grid-column: span 2; }
.liberacao { border: 2px solid var(--vermelho); border-radius: var(--raio-m); padding: 16px 18px; background: var(--superficie); }
.liberacao.ok { border-color: var(--verde); }
.liberacao h2 { font-size: 15px; color: var(--grafite); font-family: var(--fonte-texto); font-weight: 600; }
.liberacao-estado { font-family: var(--fonte-titulo); font-size: 30px; font-weight: 600; margin: 4px 0 6px; color: var(--vermelho); }
.liberacao.ok .liberacao-estado { color: var(--verde); }
.liberacao ul { margin: 8px 0 12px; padding-left: 18px; font-size: 14px; }
.colunas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; }
.lista-acoes { list-style: none; margin: 0; padding: 0; }
.lista-acoes li { border-top: 1px solid var(--linha); }
.lista-acoes li:first-child { border-top: 0; }
.lista-acoes button { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: start; width: 100%; text-align: left; background: none; border: 0; padding: 10px 4px; cursor: pointer; border-radius: var(--raio-p); }
.lista-acoes button:hover { background: var(--superficie-2); }
.lista-acoes .id { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--grafite); font-size: 13px; padding-top: 1px; }
.lista-acoes .t { min-width: 0; }
.lista-acoes .t small { display: block; color: var(--grafite); }
.indicadores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
.indicador h3 { font-size: 16px; margin-bottom: 10px; }
.indicador dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.indicador dt { color: var(--grafite); }
.indicador dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.indicador dd.txt-erro { color: var(--vermelho); }

/* ----------------------------- formulário ----------------------------- */
.form-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.secao-form { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-m); padding: 18px 20px 20px; margin: 0 0 18px; }
.secao-form legend { float: left; width: 100%; padding: 0; margin: 0 0 14px; }
.secao-form legend h2 { font-size: 17px; margin: 0; }
.secao-form legend + * { clear: both; }
.campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo.largo { grid-column: 1 / -1; }
.campo label, .campo .rotulo { font-size: 13px; font-weight: 600; color: var(--tinta); }
.campo .ajuda { font-size: 12px; color: var(--grafite); }
.campo input[type="text"], .campo input[type="number"], .campo input[type="date"], .campo input[type="month"], .campo select, .campo textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--linha-forte); border-radius: 4px; background: var(--superficie); color: var(--tinta); min-height: 38px;
}
.campo textarea { min-height: 72px; resize: vertical; }
.campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--azul); outline: 2px solid var(--azul-suave); outline-offset: 0; }
.campo.obrigatorio label::after { content: " *"; color: var(--vermelho); }
.marcador { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; font-size: 14px; padding: 4px 0; }
.marcador input { width: 18px; height: 18px; margin: 1px 0 0; flex: none; accent-color: var(--azul); }
.impacto { position: sticky; top: 76px; }
.impacto h2 { font-size: 16px; margin-bottom: 10px; }
.impacto dl { margin: 0 0 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 14px; }
.impacto dt { color: var(--grafite); }
.impacto dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.impacto .sim { color: var(--vermelho); }

/* ----------------------------- etapas e itens ----------------------------- */
.etapa-cabeca { display: flex; gap: 18px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin: 18px 0 14px; }
.etapa-titulo { display: flex; gap: 14px; align-items: flex-start; }
.etapa-marca {
  font-family: var(--fonte-titulo); font-size: 20px; font-weight: 600; min-width: 54px; height: 54px; display: grid; place-items: center;
  border: 2px solid var(--tinta); border-radius: var(--raio-m); padding: 0 6px;
}
.etapa-titulo p { color: var(--grafite); margin: 4px 0 0; max-width: 72ch; }
.etapa-progresso { min-width: 220px; }
.etapa-progresso .linha1 { display: flex; justify-content: space-between; font-size: 13px; color: var(--grafite); margin-bottom: 6px; }
.etapa-progresso b { color: var(--tinta); font-variant-numeric: tabular-nums; }
.filtros { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; }
.chip { border: 1px solid var(--linha-forte); background: var(--superficie); border-radius: 16px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--tinta); color: var(--superficie); border-color: var(--tinta); }
.grupo-itens { margin-top: 16px; }
.grupo-itens > h3 { font-size: 14px; color: var(--grafite); font-family: var(--fonte-texto); font-weight: 600; margin: 0 0 8px; }
.itens { list-style: none; margin: 0; padding: 0; background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-m); }
.item { border-top: 1px solid var(--linha); position: relative; }
.item:first-child { border-top: 0; }
.item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }
.item.st-conforme::before { background: var(--verde); }
.item.st-em_andamento::before { background: var(--ocre); }
.item.st-nao_conforme::before, .item.st-vencida::before { background: var(--vermelho); }
.item.st-na::before, .item.st-aguardando::before { background: var(--cinza); }
.item.pend-critico.st-nao_verificado::before { background: var(--vermelho); }
.item-linha { display: grid; grid-template-columns: 26px 64px minmax(0, 1fr) auto 200px 36px; gap: 10px; align-items: center; padding: 10px 12px 10px 14px; }
.item-glifo { width: 22px; height: 22px; }
.item-id { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--grafite); font-size: 13px; }
.item-titulo { min-width: 0; }
.item-titulo .t { font-weight: 500; }
.item-titulo small { display: block; color: var(--grafite); font-size: 12.5px; }
.item-linha select { width: 100%; padding: 6px 8px; border: 1px solid var(--linha-forte); border-radius: 4px; background: var(--superficie); min-height: 34px; }
.auto-estado { font-size: 12.5px; color: var(--grafite); line-height: 1.35; }
.expandir { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid transparent; background: none; border-radius: 4px; cursor: pointer; color: var(--grafite); }
.expandir:hover { border-color: var(--linha-forte); }
.expandir svg { width: 16px; height: 16px; transition: transform .15s ease; }
.expandir[aria-expanded="true"] svg { transform: rotate(180deg); }
.item-detalhe { padding: 4px 18px 18px 112px; display: grid; gap: 12px; }
.item-detalhe .desc { margin: 0; max-width: 80ch; }
.base-legal { font-size: 13px; color: var(--grafite); }
.base-legal b { color: var(--tinta); font-weight: 600; }
.motivo { font-size: 13px; background: var(--superficie-2); border: 1px solid var(--linha); border-radius: 4px; padding: 8px 10px; }
.motivo b { font-weight: 600; }
.item-detalhe .campos { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ajuda-calc { font-size: 13px; border-left: 3px solid var(--azul); padding: 6px 10px; background: var(--azul-suave); border-radius: 0 4px 4px 0; }
.conteudo-min { border: 1px solid var(--linha); border-radius: var(--raio-m); background: var(--superficie-2); padding: 12px 14px 6px; }
.conteudo-cabeca { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.conteudo-cabeca h4 { margin: 0; font-size: 14px; font-weight: 600; font-family: var(--fonte-texto); }
.conteudo-cabeca .acoes { margin-left: auto; display: flex; gap: 6px; }
.conteudo-fonte { margin: 6px 0 4px; font-size: 12.5px; color: var(--grafite); }
.conteudo-grupo { margin: 4px 0 8px; }
.conteudo-grupo h5 { margin: 6px 0 2px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--grafite); font-family: var(--fonte-texto); }
.conteudo-grupo ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; }
.conteudo-grupo .marcador { font-size: 13.5px; padding: 3px 0; }
.conf-resumo { white-space: nowrap; }
.rodape-etapa { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.painel-etapa { margin-bottom: 16px; }

/* ----------------------------- tabelas ----------------------------- */
.tabela-wrap { position: relative; overflow-x: auto; border: 1px solid var(--linha); border-radius: var(--raio-m); background: var(--superficie); }
table.tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabela th { text-align: left; font-weight: 600; font-size: 13px; color: var(--grafite); background: var(--superficie-2); border-bottom: 1px solid var(--linha-forte); padding: 9px 10px; white-space: nowrap; }
.tabela td { border-top: 1px solid var(--linha); padding: 10px; vertical-align: top; }
.tabela tr.destaque td { background: var(--azul-suave); }
.tabela .id { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabela .sub { display: block; font-size: 12.5px; color: var(--grafite); margin-top: 2px; }
.tabela .causa { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tabela .curto { white-space: nowrap; font-size: 13px; }
.tabela .acoes-linha { white-space: nowrap; }
.nivel { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; padding: 3px 8px; border-radius: var(--raio-p); white-space: nowrap; }
.nivel.critico { background: var(--vermelho-suave); color: var(--vermelho); }
.nivel.alto { background: var(--ocre-suave); color: var(--ocre); }
.nivel.moderado { background: var(--azul-suave); color: var(--azul-texto); }
.nivel.baixo { background: var(--verde-suave); color: var(--verde); }
.problemas { list-style: none; margin: 4px 0 0; padding: 0; font-size: 12.5px; }
.problemas li { display: flex; gap: 6px; align-items: flex-start; }
.problemas li.erro { color: var(--vermelho); }
.problemas li.aviso { color: var(--ocre); }
.problemas svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }

/* ----------------------------- riscos ----------------------------- */
.abas { display: flex; gap: 2px; border-bottom: 1px solid var(--linha-forte); margin-bottom: 18px; flex-wrap: wrap; }
.abas button { border: 0; background: none; padding: 10px 16px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; color: var(--grafite); font-weight: 500; }
.abas button[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--tinta); font-weight: 600; }
.comparacao { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--linha-forte); border-radius: var(--raio-m); overflow: hidden; margin-bottom: 18px; background: var(--superficie); }
.comparacao > div { padding: 14px 16px; }
.comparacao > div + div { border-left: 1px solid var(--linha-forte); }
.comparacao h3 { font-size: 16px; margin-bottom: 6px; }
.comparacao ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.comparacao .atual { background: var(--azul-suave); }
.barra-ferramentas { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; margin-bottom: 12px; }
.barra-ferramentas .campo { min-width: 150px; max-width: 240px; }
.calor { display: grid; grid-template-columns: 110px repeat(5, minmax(0, 1fr)); gap: 4px; max-width: 760px; }
.calor .cab { font-size: 12px; color: var(--grafite); display: grid; place-items: center; text-align: center; padding: 4px; }
.calor .cab.y { justify-items: end; text-align: right; }
.calor button { min-height: 62px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; font-family: var(--fonte-titulo); font-size: 20px; font-weight: 600; color: var(--tinta); }
.calor button.baixo { background: var(--verde-suave); }
.calor button.moderado { background: var(--azul-suave); }
.calor button.alto { background: var(--ocre-suave); }
.calor button.critico { background: var(--vermelho-suave); }
.calor button.vazia { color: var(--cinza); font-weight: 400; font-size: 14px; }
.calor button[aria-pressed="true"] { border-color: var(--tinta); box-shadow: inset 0 0 0 1px var(--tinta); }
.eixo { font-size: 12px; color: var(--grafite); margin-top: 6px; }

/* ----------------------------- alertas ----------------------------- */
.alerta-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.alerta { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 12px 14px; border: 1px solid var(--linha); border-radius: var(--raio-m); background: var(--superficie); }
.alerta svg { width: 20px; height: 20px; }
.alerta.erro { border-left: 4px solid var(--vermelho); }
.alerta.erro svg { color: var(--vermelho); }
.alerta.aviso { border-left: 4px solid var(--ocre); }
.alerta.aviso svg { color: var(--ocre); }
.alerta.info { border-left: 4px solid var(--azul); }
.alerta.info svg { color: var(--azul); }
.alerta p { margin: 3px 0 0; font-size: 14px; color: var(--grafite); }
.alerta .motivo-linha { font-size: 12.5px; color: var(--grafite); margin-top: 6px; }
details.porque { border: 1px solid var(--linha); border-radius: var(--raio-m); background: var(--superficie); }
details.porque + details.porque { margin-top: 8px; }
details.porque summary { cursor: pointer; padding: 11px 14px; font-weight: 500; }
details.porque ul { margin: 0; padding: 0 14px 12px 34px; font-size: 14px; }

/* ----------------------------- relatório e base ----------------------------- */
.previa { width: 100%; height: 78vh; border: 1px solid var(--linha-forte); border-radius: var(--raio-m); background: #e6eaee; }
.contagens td, .contagens th { text-align: right; }
.contagens td:first-child, .contagens th:first-child { text-align: left; }

/* ----------------------------- modal e avisos ----------------------------- */
.modal-fundo { position: fixed; inset: 0; background: rgba(16, 22, 28, .58); display: grid; place-items: center; padding: 18px; z-index: 200; }
.modal { background: var(--superficie); color: var(--tinta); border-radius: 8px; box-shadow: var(--sombra-modal); width: min(640px, 100%); max-height: calc(100vh - 36px); display: flex; flex-direction: column; border: 1px solid var(--linha-forte); }
.modal.largo { width: min(860px, 100%); }
.modal-cabeca { padding: 18px 22px 12px; border-bottom: 1px solid var(--linha); }
.modal-cabeca h2 { font-size: 21px; }
.modal-cabeca p { margin: 6px 0 0; color: var(--grafite); font-size: 14px; }
.modal-corpo { padding: 16px 22px; overflow-y: auto; }
.modal-rodape { padding: 14px 22px 18px; border-top: 1px solid var(--linha); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.avisos-texto { font-size: 14px; }
.avisos-texto ol { padding-left: 20px; margin: 0; }
.avisos-texto li { margin-bottom: 10px; }
.avisos-texto li b { font-weight: 600; }
.concordancia { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--linha-forte); border-radius: var(--raio-m); background: var(--superficie-2); margin-top: 6px; font-weight: 500; cursor: pointer; }
.concordancia input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--azul); }
.recusa { margin-top: 12px; }
.lista-sel { list-style: none; margin: 0; padding: 0; border: 1px solid var(--linha); border-radius: var(--raio-m); max-height: 46vh; overflow-y: auto; }
.lista-sel li { border-top: 1px solid var(--linha); }
.lista-sel li:first-child { border-top: 0; }
.lista-sel label { display: grid; grid-template-columns: 20px 64px minmax(0, 1fr); gap: 10px; padding: 10px 12px; cursor: pointer; align-items: start; }
.lista-sel input { margin: 3px 0 0; width: 16px; height: 16px; accent-color: var(--azul); }
.lista-sel .id { font-weight: 600; color: var(--grafite); font-variant-numeric: tabular-nums; font-size: 13px; }
.lista-sel small { display: block; color: var(--grafite); }

#toast { position: fixed; right: 20px; top: 68px; z-index: 400; pointer-events: none; display: grid; justify-items: end; }
@media (max-width: 640px) { #toast { left: 12px; right: 12px; top: auto; bottom: 14px; justify-items: stretch; } }
#toast div { background: var(--tinta); color: var(--superficie); padding: 10px 16px; border-radius: 6px; box-shadow: var(--sombra-modal); font-size: 14px; max-width: 520px; margin-top: 8px; }

/* ----------------------------- abertura (4 s) ----------------------------- */
.abertura {
  position: fixed; inset: 0; z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  background-color: #141c24; color: #e9eef2;
  background-image: linear-gradient(rgba(141, 180, 232, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(141, 180, 232, .07) 1px, transparent 1px);
  background-size: 24px 24px; background-position: center;
  animation: ab-sair .35s ease 3.65s forwards;
}
.abertura.fechada { display: none; }
.ab-svg { width: min(880px, 92vw); height: auto; overflow: visible; }
.ab-linha { fill: none; stroke: #4a6a8f; stroke-width: 2; stroke-dasharray: 800; stroke-dashoffset: 800; animation: ab-tracar 1.5s cubic-bezier(.5, 0, .2, 1) .15s forwards; }
.ab-no { fill: #141c24; stroke: #8db4e8; stroke-width: 2; transform-box: fill-box; transform-origin: center; transform: scale(0); animation: ab-surgir .3s ease forwards, ab-marcar .3s ease forwards; }
.ab-rot { fill: #8c9aa8; font-family: var(--fonte-titulo); font-size: 13px; text-anchor: middle; opacity: 0; animation: ab-fade .3s ease forwards; }
.ab-portao { stroke: #f08a80; stroke-width: 3; stroke-linecap: round; transform-box: fill-box; transform-origin: 50% 100%; animation: ab-levantar .45s ease forwards; }
.ab-selo { fill: none; stroke: #6cc793; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: ab-tracar-selo .45s ease 2.2s forwards; }
.ab-anel { fill: none; stroke: #6cc793; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ab-anel .7s ease 2.15s forwards; }
.ab-titulo { display: flex; align-items: baseline; gap: 12px; opacity: 0; transform: translateY(8px); animation: ab-subir .55s ease 2.35s forwards; margin-top: 4px; }
.ab-titulo .n { font-family: var(--fonte-titulo); font-size: clamp(34px, 6vw, 54px); font-weight: 600; letter-spacing: .5px; }
.ab-titulo .m { font-family: var(--fonte-titulo); font-size: clamp(20px, 3.2vw, 30px); color: #8db4e8; }
.ab-sub { margin: 0; color: #a9b6c2; font-size: 15px; opacity: 0; animation: ab-fade .5s ease 2.7s forwards; text-align: center; padding: 0 18px; }
.ab-barra { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(233, 238, 242, .08); }
.ab-barra span { display: block; height: 100%; width: 0; background: #8db4e8; animation: ab-progresso 4s linear forwards; }
.ab-pular { position: absolute; right: 18px; bottom: 18px; background: none; border: 1px solid rgba(233, 238, 242, .25); color: #a9b6c2; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.ab-pular:hover { color: #e9eef2; border-color: rgba(233, 238, 242, .5); }
.ab-autor { position: absolute; left: 18px; bottom: 20px; color: #6f7f8f; font-size: 12px; }
@keyframes ab-tracar { to { stroke-dashoffset: 0; } }
@keyframes ab-tracar-selo { to { stroke-dashoffset: 0; } }
@keyframes ab-surgir { to { transform: scale(1); } }
@keyframes ab-marcar { to { fill: #1e4e8c; } }
@keyframes ab-fade { to { opacity: 1; } }
@keyframes ab-levantar { to { transform: translateY(-10px) rotate(-58deg); stroke: #4a6a8f; } }
@keyframes ab-anel { 0% { opacity: .9; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.2); } }
@keyframes ab-subir { to { opacity: 1; transform: none; } }
@keyframes ab-progresso { to { width: 100%; } }
@keyframes ab-sair { to { opacity: 0; visibility: hidden; } }
@media (prefers-reduced-motion: reduce) {
  .abertura *, .abertura { animation-duration: .01ms !important; animation-delay: 0s !important; }
  .abertura { animation: ab-sair .01ms linear 3.99s forwards !important; }
  .ab-barra span { animation: ab-progresso 4s linear forwards !important; }
  .portao span, .no, .expandir svg { transition: none !important; }
}

/* ----------------------------- fiscalização ----------------------------- */
.txt-erro { color: var(--vermelho); }
button.link { background: none; border: 0; padding: 0; color: var(--tinta); font-weight: 500; text-align: left; cursor: pointer; font: inherit; }
button.link:hover { text-decoration: underline; color: var(--azul-texto); }
.estacao.futura .no { border-style: dashed; background: var(--superficie); color: var(--cinza); }
.estacao.futura .estacao-nome, .estacao.futura .estacao-pct { color: var(--cinza); }
.legenda-trilho i.f { border-style: dashed; }
.grupo-form { font-size: 22px; margin: 28px 0 12px; scroll-margin-top: 76px; }
.secao-form + .grupo-form { margin-top: 30px; }
.item-estado.periodico { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.item-estado.periodico .btn { justify-content: center; }
.per-datas { font-size: 12.5px; color: var(--grafite); line-height: 1.3; }
.rotina-info { display: grid; gap: 8px; }
.tabela.compacta th, .tabela.compacta td { padding: 6px 8px; font-size: 13px; }
.bloco-nc { border: 1px solid var(--vermelho); border-left-width: 4px; border-radius: var(--raio-m); padding: 10px 14px 12px; background: var(--vermelho-suave); }
.bloco-nc h4 { margin: 0 0 8px; font-size: 14px; color: var(--vermelho); font-family: var(--fonte-texto); font-weight: 600; }
.bloco-nc p { margin: 8px 0 0; }
.opcoes-radio { display: flex; gap: 18px; flex-wrap: wrap; }
.marcador input[type="radio"] { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--azul); }
.naturezas { border: 0; padding: 0; margin: 0; min-width: 0; }
.naturezas legend { padding: 0; margin-bottom: 6px; }
.naturezas-lista { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; }
.naturezas .ajuda { margin: 6px 0 0; }
.historico { list-style: none; margin: 0; padding: 0; font-size: 13.5px; display: grid; gap: 6px; }
.info-oc span { display: block; font-size: 13px; }
.indicador h2 { font-size: 18px; margin-bottom: 12px; }
.barra-ferramentas.lote { align-items: flex-end; background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-m); padding: 12px 14px; }

/* indicadores (stat tiles) */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-m); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .r { font-size: 12.5px; color: var(--grafite); font-weight: 600; }
.kpi .v { font-family: var(--fonte-titulo); font-size: 24px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.kpi .s { font-size: 12.5px; color: var(--grafite); }
.kpi .s.txt-erro { color: var(--vermelho); font-weight: 600; }
.kpi .v-curto { display: none; }
.marcador input:disabled + span { color: var(--cinza); }

/* medidores: trilho em tom claro da mesma rampa; o estado vem com ícone e texto */
.medidores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; }
.medidores.coluna { grid-template-columns: 1fr; }
.medidor-cabeca { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.medidor-cabeca .r { font-size: 13px; color: var(--grafite); font-weight: 600; }
.medidor-cabeca b { font-family: var(--fonte-titulo); font-size: 20px; font-weight: 600; }
.medidor-trilho { position: relative; height: 12px; background: var(--azul-suave); border-radius: 6px; }
.medidor-fill { display: block; height: 100%; max-width: 100%; background: var(--viz-acento); border-radius: 4px; }
.medidor-marca { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--tinta); border-radius: 1px; }
.m-alerta .medidor-trilho { background: var(--ocre-suave); }
.m-alerta .medidor-fill { background: var(--st-alerta); }
.m-critico .medidor-trilho { background: var(--vermelho-suave); }
.m-critico .medidor-fill { background: var(--st-critico); }
.medidor-pe { display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px; color: var(--grafite); margin-top: 7px; }
.medidor-icone { display: inline-flex; margin-top: 1px; }
.medidor-icone svg { width: 15px; height: 15px; }
.m-ok .medidor-icone { color: var(--verde); }
.m-alerta .medidor-icone { color: var(--ocre); }
.m-critico .medidor-icone { color: var(--vermelho); }

/* rotinas no painel */
.lista-rotinas { list-style: none; margin: 0; padding: 0; }
.lista-rotinas li { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 9px 4px; border-top: 1px solid var(--linha); }
.lista-rotinas li:first-child { border-top: 0; }
.lista-rotinas .id { font-weight: 600; font-size: 13px; color: var(--grafite); font-variant-numeric: tabular-nums; }
.lista-rotinas .t { min-width: 0; }
.lista-rotinas .t small { display: block; color: var(--grafite); font-size: 12.5px; }

/* verificações dos registros (nos formulários) */
.checklist { border: 1px solid var(--linha); border-radius: var(--raio-m); background: var(--superficie-2); padding: 10px 14px 6px; }
.checklist-cabeca { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.checklist-cabeca .rotulo { font-size: 13px; font-weight: 600; }
.checklist-cabeca .btn { margin-left: auto; }
.checklist-grupo { border: 0; margin: 6px 0 8px; padding: 0; min-width: 0; }
.checklist-grupo legend { font-weight: 600; font-size: 13.5px; padding: 0; }
.checklist-grupo .ajuda { font-size: 12px; color: var(--grafite); margin: 2px 0 4px; }
.checklist-grupo ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; }
.checklist-grupo .marcador { font-size: 13.5px; padding: 3px 0; }

/* curva S */
.grafico { margin: 0 0 18px; }
.grafico figcaption { margin-top: 8px; }
.legenda-grafico { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--grafite); margin: -2px 0 8px; }
.legenda-grafico span { display: inline-flex; align-items: center; gap: 7px; }
.k-exec, .k-prev { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--viz-acento); vertical-align: middle; }
.k-prev { border-top: 2px dashed var(--viz-ref); }
.curva { position: relative; min-height: 60px; }
.curva-alvo { position: relative; outline: none; border-radius: 4px; }
.curva-alvo:focus-visible { box-shadow: 0 0 0 2px var(--azul); }
.curva svg { display: block; width: 100%; height: auto; overflow: visible; }
.c-grade { stroke: var(--linha); stroke-width: 1; shape-rendering: crispEdges; }
.c-base { stroke: var(--linha-forte); stroke-width: 1; shape-rendering: crispEdges; }
.c-eixo { fill: var(--grafite); font-size: 12px; font-variant-numeric: tabular-nums; font-family: var(--fonte-texto); }
.c-exec { fill: none; stroke: var(--viz-acento); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.c-prev { fill: none; stroke: var(--viz-ref); stroke-width: 2; stroke-dasharray: 6 5; stroke-linejoin: round; stroke-linecap: round; }
.c-ponto { fill: var(--viz-acento); stroke: var(--superficie); stroke-width: 2; }
.c-rot { fill: var(--tinta); font-size: 12.5px; font-weight: 600; font-family: var(--fonte-texto); font-variant-numeric: tabular-nums; }
.c-rot-sec { fill: var(--grafite); font-weight: 500; }
.c-cruz { stroke: var(--linha-forte); stroke-width: 1; shape-rendering: crispEdges; }
.c-area { cursor: crosshair; }
.grafico-dica { position: absolute; z-index: 5; width: 230px; background: var(--superficie); border: 1px solid var(--linha-forte); border-radius: 6px; box-shadow: 0 6px 18px rgba(16, 24, 32, .16); padding: 8px 10px; font-size: 12.5px; pointer-events: none; }
.dica-titulo { color: var(--grafite); margin-bottom: 4px; }
.dica-linha { display: grid; grid-template-columns: 18px auto minmax(0, 1fr); gap: 7px; align-items: center; }
.dica-linha b { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--tinta); }
.dica-linha span { color: var(--grafite); }
.dica-desvio { margin-top: 4px; color: var(--grafite); }

/* ----------------------------- responsivo ----------------------------- */
@media (max-width: 1100px) {
  .painel-topo { grid-template-columns: 1fr; }
  .form-layout { grid-template-columns: 1fr; }
  .impacto { position: static; }
  .indicadores { grid-template-columns: 1fr 1fr; }
  .item-linha { grid-template-columns: 26px 58px minmax(0, 1fr) 180px 36px; }
  .item-linha .etiqueta { grid-column: 3; justify-self: start; }
  .item-detalhe { padding-left: 18px; }
}
@media (max-width: 1360px) {
  .trilho:not(.compacto) .estacao { width: 64px; }
  .trilho:not(.compacto) .estacao-nome { font-size: 11.5px; }
}
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 56px auto minmax(0, 1fr); grid-template-areas: "topo" "nav" "main"; }
  .lateral { position: sticky; top: 56px; height: auto; z-index: 40; border-right: 0; border-bottom: 1px solid var(--linha); padding: 6px 10px; overflow-x: auto; }
  .lateral ul { display: flex; gap: 4px; }
  .lateral li + li { margin: 0; }
  .lateral button { white-space: nowrap; padding: 8px 10px; }
  .lateral-rodape { display: none; }
  .marca-mod, .topo-acoes .rotulo { display: none; }
  main { padding: 20px 16px 56px; }
  .colunas, .grade-2, .grade-3, .comparacao { grid-template-columns: 1fr; }
  .comparacao > div + div { border-left: 0; border-top: 1px solid var(--linha-forte); }
  .ficha { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ficha > div:nth-child(4n) { border-right: 1px solid var(--linha); }
  .ficha > div:nth-child(2n) { border-right: 0; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .medidores { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  h1 { font-size: 23px; }
  .app { grid-template-rows: auto auto minmax(0, 1fr); }
  .topo { position: relative; flex-wrap: wrap; gap: 8px 10px; padding: 8px 10px; }
  .topo-obra { order: 3; flex: 1 1 100%; }
  .topo-obra select { max-width: none; }
  .topo-acoes { margin-left: auto; }
  .topo-acoes button { padding: 6px 7px; }
  .lateral { top: 0; }
  .etapa-progresso { min-width: 0; width: 100%; }
  .marca-nome { font-size: 18px; }
  .campos, .item-detalhe .campos { grid-template-columns: 1fr; }
  .conteudo-grupo ul { grid-template-columns: 1fr; }
  .conteudo-cabeca .acoes { margin-left: 0; }
  .indicadores { grid-template-columns: 1fr; }
  .item-linha { grid-template-columns: 22px minmax(0, 1fr) 36px; gap: 8px; padding-left: 10px; }
  .item-linha .item-id { grid-column: 2; grid-row: 1; }
  .item-linha .item-glifo { grid-row: 1 / span 2; }
  .item-linha .item-titulo { grid-column: 2; }
  .item-linha .etiqueta { grid-column: 2; }
  .item-linha .item-estado { grid-column: 2; }
  .item-linha .expandir { grid-column: 3; grid-row: 1; }
  .bloco { padding: 16px; }
  .calor { grid-template-columns: 70px repeat(5, minmax(0, 1fr)); }
  .kpi .v { font-size: 19px; }
  .kpi .v-longo { display: none; }
  .kpi .v-curto { display: inline; }
  .checklist-grupo ul, .naturezas-lista { grid-template-columns: 1fr; }
  .lista-rotinas li { grid-template-columns: 46px minmax(0, 1fr) auto; }
  .lista-rotinas li .etiqueta { grid-column: 2; grid-row: 2; justify-self: start; }
  .lista-rotinas li .btn { grid-column: 3; grid-row: 1 / span 2; }
  .barra-ferramentas.lote .acoes { width: 100%; }
}

@media print {
  .topo, .lateral, #toast, .abertura { display: none !important; }
  .app { display: block; }
  main { padding: 0; }
}

/* ----------------------------- início ----------------------------- */
.obras { list-style: none; margin: 0; padding: 0; }
.obra-item { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 12px 4px; border-top: 1px solid var(--linha); }
.obra-item:first-child { border-top: 0; }
.obra-item.ativa .obra-nome { color: var(--azul-texto); }
.obra-info { min-width: 0; flex: 1; display: grid; gap: 4px; }
.obra-nome { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; cursor: pointer; color: var(--tinta); font-size: 15px; }
.obra-nome:hover { text-decoration: underline; }
.obra-prog { display: grid; grid-template-columns: minmax(80px, 1fr) auto auto; gap: 10px; align-items: center; margin-top: 4px; }
.bloco.como { margin-top: 18px; }
.passos { margin: 0; padding-left: 22px; display: grid; gap: 8px; max-width: 86ch; }
.passos li::marker { font-family: var(--fonte-titulo); font-weight: 600; color: var(--grafite); }
.lista-acoes svg { color: var(--grafite); align-self: center; }

</style>
</head>

:0.96s,1.14s"/><text class="ab-rot" x="573.3" y="106" style="animation-delay:1.01s">F7</text><circle class="ab-no" cx="662.2" cy="70" r="10" style="animation-delay:1.07s,1.25s"/><text class="ab-rot" x="662.2" y="106" style="animation-delay:1.12s">F8</text><circle class="ab-no" cx="751.1" cy="70" r="10" style="animation-delay:1.18s,1.36s"/><text class="ab-rot" x="751.1" y="106" style="animation-delay:1.23s">F9</text><circle class="ab-no" cx="840.0" cy="70" r="10" style="animation-delay:1.29s,1.47s"/><text class="ab-rot" x="840.0" y="106" style="animation-delay:1.34s">F10</text><circle class="ab-anel" cx="840" cy="70" r="14"/><path class="ab-selo" d="M835 70 l3.6 3.8 l7 -7.6"/></svg>

<script>
/* =====================================================================
   ObraCheck · Fiscalização — BASE DE REGRAS EDITÁVEL
   ---------------------------------------------------------------------
   Tudo o que está neste objeto é DADO: etapas do ciclo do contrato,
   itens do checklist, verificações periódicas, regras de aplicabilidade,
   procedimentos dos registros (medições, aditivos, apostilas e
   ocorrências), alertas, parâmetros e exemplos. A equipe pode atualizar
   normas, textos e critérios sem tocar na lógica: edite aqui ou
   exporte e importe a base pela aba "Base normativa".

   Linguagem das regras (campos "aplica", "mostrar", "se" e "ajustes[].se"):
     {se: "chave"}                 -> valor verdadeiro (sim)
     {nao: "chave"}                -> valor falso (não)
     {tip: ["edificacao", ...]}    -> tipologia em uma das opções
     {regime: ["integrada", ...]}  -> regime de execução em uma das opções
     {campo, op, valor}            -> op: eq, ne, in, nin, gt, gte, lt, lte
     {all: [...]}, {any: [...]}, {not: {...}}
   Os dados do contrato entram nas regras com o prefixo "contrato."
   (por exemplo, "contrato.subcontratacao").
   ===================================================================== */
var CONFIG_PADRAO = (function () {
  "use strict";

  /* ---------- atalhos de regras ---------- */
  var EDIF = { se: "isEdif" };
  var VIARIA = { tip: ["viaria"] };
  var SANEAMENTO = { tip: ["saneamento"] };
  var URBANA = { tip: ["urbana"] };
  var SAUDE = { tip: ["saude"] };
  var ESCOLAR = { tip: ["escolar"] };
  var ZONA_URBANA = { campo: "local.zona", op: "eq", valor: "urbana" };
  var VIA_RODOVIARIA = { all: [VIARIA, { campo: "viaria.ambito", op: "eq", valor: "rodoviaria" }] };
  var VIA_URBANA = { all: [VIARIA, { campo: "viaria.ambito", op: "eq", valor: "urbana" }] };
  var INTEGRADA_SEMI = { regime: ["integrada", "semi"] };
  var PE_PELA_ADMINISTRACAO = { regime: ["unitario", "global", "integral", "tarefa", "fornecimento"] };
  var PRECO_GLOBAL = { regime: ["global", "integral", "tarefa", "integrada", "semi"] };
  var UNITARIO = { regime: ["unitario"] };
  var LICENCIAMENTO = { campo: "licResp", op: "nin", valor: ["nao_sujeito"] };
  var LIC_CONTRATADO = { campo: "licResp", op: "eq", valor: "contratado" };
  var FEDERAL = { campo: "esfera", op: "eq", valor: "federal" };
  var UNIAO = { se: "recursosUniao" };
  var TRANSFERENCIA = { campo: "fonte", op: "in", valor: ["uniao_voluntaria", "uniao_fundo", "estado", "internacional"] };
  var GRANDE_VULTO = { se: "grandeVulto" };
  var REASSENTAR = { se: "terreno.reassentamento" };
  var DESAPROPRIAR = { campo: "terreno.dominio", op: "eq", valor: "desapropriar" };
  var EM_USO = { all: [EDIF, { se: "edif.emUso" }] };
  var BIM = { se: "bim" };
  var AREA_PROTEGIDA = { campo: "local.areaProtegida", op: "in", valor: ["app", "uc", "amortecimento"] };
  var ARQUEOLOGIA = { campo: "local.arqueologia", op: "in", valor: ["sim", "a_verificar"] };
  var PATRIMONIO = { any: [{ campo: "local.tombamento", op: "in", valor: ["tombado", "entorno"] }, ARQUEOLOGIA] };
  var ESTRUTURAS = { any: [EDIF, { se: "viaria.oae" }, { se: "urbana.contencao" }, { se: "saneamento.eta" }, { se: "saneamento.ete" }, { se: "saneamento.elevatorias" }] };
  var EQUIP_SANEAMENTO = { any: [{ se: "saneamento.captacao" }, { se: "saneamento.eta" }, { se: "saneamento.ete" }, { se: "saneamento.elevatorias" }] };
  var TALUDES = { any: [{ se: "urbana.contencao" }, { campo: "terreno.declividade", op: "eq", valor: "acentuada" }] };
  var VIAS_E_REDES = { any: [VIARIA, URBANA, { all: [SANEAMENTO, ZONA_URBANA] }] };
  var SUPERVISORA = { se: "contrato.supervisora" };
  var SUBCONTRATACAO = { se: "contrato.subcontratacao" };
  var MATRIZ = { se: "contrato.matriz" };
  var GARANTIA = { nao: "contrato.garantiaDispensada" };
  var SEGURO_GARANTIA = { all: [GARANTIA, { campo: "contrato.garantia.modalidade", op: "eq", valor: "seguro" }] };
  var TECNICA_PRECO = { campo: "contrato.criterio", op: "eq", valor: "tecnica_preco" };
  var PE_CONTRATADO = { any: [INTEGRADA_SEMI, { se: "contrato.peContratado" }] };
  var REFORMA_EDIF = { se: "reformaEdificio" };

  function crit(c, se) { return { se: se, crit: c }; }

  /* ---------- fontes citadas ---------- */
  var L = "Lei 14.133/2021";
  var AP = "TCU, Fiscalização de obras públicas e serviços de engenharia (apresentação)";
  var DNIT = "DNIT, Manual de Gestão e Fiscalização de Contratos (2ª ed., 2020)";


  /* ------------- CONTEÚDO DE CONFERÊNCIA DE ITENS ESPECÍFICOS -------------
     Listas de referência anexadas aos itens pelo identificador (ver o fim
     deste arquivo). Cada bloco traz a fonte, uma regra opcional "se" e os
     elementos no formato [tipo, [conteúdos]]. */
  var CONTEUDO = {
    "F1.01": [
      { fonte: L + ", art. 92; " + AP, elementos: [
        ["Cláusulas necessárias", ["Objeto e seus elementos característicos", "Vinculação ao edital e à proposta", "Regime de execução", "Preço, condições de pagamento, data-base e periodicidade do reajuste e atualização monetária", "Critérios e periodicidade da medição e prazo de pagamento", "Prazos de início, de conclusão, de observação e de recebimento definitivo", "Crédito orçamentário", "Matriz de riscos, quando exigida", "Prazos de resposta aos pedidos de reequilíbrio", "Garantias e prazo de garantia mínima do objeto", "Direitos, responsabilidades, penalidades e multas", "Obrigação de manter as condições de habilitação", "Modelo de gestão do contrato", "Casos de extinção"]],
        ["Formalização", ["Assinaturas e poderes de representação conferidos", "Termos aderentes à minuta anexa ao edital", "Valores e cronograma iguais aos da proposta vencedora"]]] }
    ],
    "F1.14": [
      { fonte: L + ", arts. 96 a 98; " + AP + "; " + DNIT + ", item 4.2", elementos: [
        ["Conferência", ["Modalidade admitida no edital", "Valor igual ou superior ao percentual exigido", "Vigência que cobre todo o prazo do contrato", "Beneficiário e objeto corretos", "Cobertura de multas, prejuízos e indenizações (seguro-garantia)", "Seguradora autorizada pela SUSEP ou banco idôneo", "Cláusulas conforme o modelo do edital", "Prazo de apresentação observado"]]] }
    ],
    "F1.18": [
      { fonte: AP, elementos: [
        ["Documentos estudados", ["Edital, termo de referência e anexos", "Projetos, especificações e memoriais", "Proposta, planilha, composições de custo unitário, BDI e encargos sociais", "Cronograma físico-financeiro e critérios de medição", "Matriz de riscos e mapa de riscos", "Documentos de habilitação da contratada", "Atas, pareceres, recursos, impugnações e esclarecimentos da licitação"]]] }
    ],
    "F2.18": [
      { fonte: AP, elementos: [
        ["Pauta da reunião inicial", ["Pontos relevantes do edital e do contrato", "Plano de trabalho", "Equipes de trabalho", "Recebimento das ARTs", "Abertura do diário de obra", "Entrega de documentos: ordem de serviço, licenças, projetos e critérios de medição", "Diretrizes internas e acesso de colaboradores", "Projeto e layout das instalações provisórias", "Liberação de áreas e frentes de serviço", "Calendário de reuniões periódicas com o preposto"]]] }
    ],
