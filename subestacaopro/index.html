  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

O autor e os distribuidores do software não respondem por perdas, danos, atrasos ou decisões técnicas, econômicas ou contratuais tomadas com base nos resultados apresentados.<\u002Fli>\n        <\u002Ful>\n        <div class=\"sp-note\">Trabalhos em instalações elétricas envolvem risco de morte. A execução, a operação e a energização devem seguir a NR-10, procedimentos formais de segurança e a supervisão de profissional habilitado.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sp-foot\">\n        <label class=\"sp-agree\"><input type=\"checkbox\" id=\"spCheck\"><span>Declaro que li, compreendi e concordo integralmente com o aviso legal e os termos de uso acima.<\u002Fspan><\u002Flabel>\n        <div class=\"sp-btns\">\n          <button type=\"button\" id=\"spDecline\">Não concordo<\u002Fbutton>\n          <button type=\"button\" id=\"spAccept\" disabled=\"\">Concordar e abrir o sistema<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"sp-stamp\" id=\"spStamp\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"spBlocked\">\n    <div>\n      <h2>Acesso não liberado<\u002Fh2>\n      <p>O uso do SubestaçãoPro depende da aceitação do aviso legal e dos termos de uso. Recarregue a página para revisar os termos.<\u002Fp>\n      <button type=\"button\" onclick=\"location.reload()\">Revisar os termos<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<script>\n(function(){\n  var root=document.getElementById('spSplash'),cv=document.getElementById('spCanvas'),ctx=cv.getContext('2d');\n  var W=0,H=0,DPR=1,t0=performance.now(),phase='intro',strikeAt=1.85,DUR=5.0,flash=0,done=false;\n  function resize(){DPR=Math.min(window.devicePixelRatio||1,2.5);W=root.clientWidth;H=root.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}\n  resize();window.addEventListener('resize',resize);\n\n  var cam={yaw:-1.02,pitch:.46,dist:96,ty:9};\n  function proj(p){\n    var x=p.x,y=p.y-cam.ty,z=p.z;\n    var cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);\n    var x1=x*cy-z*sy,z1=x*sy+z*cy;\n    var cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);\n    var y1=y*cp-z1*sp,z2=y*sp+z1*cp+cam.dist;\n    if(z2<1)z2=1;\n    var f=(1.05*H)/z2;\n    return{x:W/2+x1*f,y:H*.60-y1*f,z:z2,f:f}\n  }\n  function ease(a){return a<.5?4*a*a*a:1-Math.pow(-2*a+2,3)/2}\n  function shade(hex,k){var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);\n    return'rgb('+Math.min(255,r*k|0)+','+Math.min(255,g*k|0)+','+Math.min(255,b*k|0)+')'}\n\n  var LIGHT={x:-.45,y:.78,z:-.44};\n  var Q=[];\n  function quad(a,b,c,d,color,opts){\n    var ux=b.x-a.x,uy=b.y-a.y,uz=b.z-a.z,vx=d.x-a.x,vy=d.y-a.y,vz=d.z-a.z;\n    var nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx,l=Math.hypot(nx,ny,nz)||1;\n    var lam=Math.abs((nx/l)*LIGHT.x+(ny/l)*LIGHT.y+(nz/l)*LIGHT.z);\n    var pa=proj(a),pb=proj(b),pc=proj(c),pd=proj(d);\n    Q.push({z:(pa.z+pb.z+pc.z+pd.z)/4,draw:function(){\n      ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.lineTo(pc.x,pc.y);ctx.lineTo(pd.x,pd.y);ctx.closePath();\n      ctx.fillStyle=shade(color,.42+.85*lam);ctx.fill();\n      if(!opts||!opts.noEdge){ctx.strokeStyle='rgba(150,190,235,.16)';ctx.lineWidth=1;ctx.stroke()}\n    }})\n  }\n  function box(cx,cy,cz,w,h,d,color){\n    var x0=cx-w/2,x1=cx+w/2,y0=cy,y1=cy+h,z0=cz-d/2,z1=cz+d/2;\n    var p=function(x,y,z){return{x:x,y:y,z:z}};\n    quad(p(x0,y1,z0),p(x1,y1,z0),p(x1,y1,z1),p(x0,y1,z1),color);\n    quad(p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1),color);\n    quad(p(x1,y0,z1),p(x1,y0,z0),p(x1,y1,z0),p(x1,y1,z1),color);\n    quad(p(x0,y0,z0),p(x0,y0,z1),p(x0,y1,z1),p(x0,y1,z0),color);\n    quad(p(x1,y0,z0),p(x0,y0,z0),p(x0,y1,z0),p(x1,y1,z0),color);\n  }\n  function line3(a,b,color,w,glow){\n    var pa=proj(a),pb=proj(b);\n    Q.push({z:(pa.z+pb.z)/2,draw:function(){\n      ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);\n      ctx.strokeStyle=color;ctx.lineWidth=Math.max(.6,w*pa.f*.04);\n      if(glow){ctx.shadowColor=glow;ctx.shadowBlur=14}ctx.stroke();ctx.shadowBlur=0\n    }})\n  }\n  function cyl(cx,y0,cz,y1,r,color,segs){\n    segs=segs||9;var prev=null;\n    for(var i=0;i<=segs;i++){\n      var yy=y0+(y1-y0)*(i/segs),rr=r*(1-.22*(i/segs));\n      var pc=proj({x:cx,y:yy,z:cz}),rad=rr*pc.f;\n      var cur={p:pc,r:rad};\n      if(prev){(function(a,b,k){Q.push({z:a.p.z,draw:function(){\n        ctx.beginPath();ctx.moveTo(a.p.x-a.r,a.p.y);ctx.lineTo(b.p.x-b.r,b.p.y);ctx.lineTo(b.p.x+b.r,b.p.y);ctx.lineTo(a.p.x+a.r,a.p.y);ctx.closePath();\n        ctx.fillStyle=shade(color,.62+.5*k);ctx.fill();\n        ctx.beginPath();ctx.ellipse(b.p.x,b.p.y,b.r,b.r*.34,0,0,6.284);ctx.fillStyle=shade(color,1.05);ctx.fill()\n      }})})(prev,cur,i/segs)}\n      prev=cur\n    }\n  }\n  function tower(x){\n    var col='#33445c',legs=[[-3.2,-3.2],[3.2,-3.2],[3.2,3.2],[-3.2,3.2]],H1=30,taper=.42;\n    function at(i,h){var s=1-(1-taper)*(h/H1);return{x:x+legs[i][0]*s,y:h,z:legs[i][1]*s}}\n    for(var i=0;i<4;i++){line3(at(i,0),at(i,H1),col,2.6);}\n    for(var h=0;h<H1;h+=4.2){\n      for(var i=0;i<4;i++){var j=(i+1)%4;\n        line3(at(i,h),at(j,h),'#2b3a4f',1.4);\n        line3(at(i,h),at(j,Math.min(H1,h+4.2)),'#3a4c66',1.1);}\n    }\n    box(x,H1,0,17,1.1,1.6,'#3b4d67');\n    box(x,H1+1.1,0,2.2,3.4,2.2,'#33445c');\n    return H1\n  }\n  function insulators(x,y,z,n){for(var i=0;i<n;i++)box(x,y-i*1.15,z,1.5,.85,1.5,'#8fa2b8')}\n\n  var TH=30,busY=17.6,cond=[];\n  var phases=[{x:-7.2,c:'#ffd27a'},{x:0,c:'#8fe3ff'},{x:7.2,c:'#c9a6ff'}];\n  function conductorPath(fromX,toX,offZ,yA,yB,sag){\n    var pts=[];for(var i=0;i<=26;i++){var s=i/26,y=yA+(yB-yA)*s-Math.sin(Math.PI*s)*sag;\n      pts.push({x:fromX+(toX-fromX)*s,y:y,z:offZ*(1-s*.55)})}\n    return pts\n  }\n  function drawPoly(pts,color,w,glowA){\n    var sp=pts.map(proj);\n    Q.push({z:sp[Math.floor(sp.length/2)].z,draw:function(){\n      ctx.beginPath();ctx.moveTo(sp[0].x,sp[0].y);for(var i=1;i<sp.length;i++)ctx.lineTo(sp[i].x,sp[i].y);\n      ctx.strokeStyle=color;ctx.lineWidth=Math.max(.8,w);ctx.lineJoin='round';\n      if(glowA>0){ctx.shadowColor=color;ctx.shadowBlur=16*glowA}ctx.stroke();ctx.shadowBlur=0\n    }})\n  }\n  function glowBlob(p3,r,color,a){\n    var p=proj(p3),rad=Math.max(4,r*p.f);\n    Q.push({z:p.z-.001,draw:function(){\n      var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);\n      g.addColorStop(0,color.replace('ALPHA',(.85*a).toFixed(3)));\n      g.addColorStop(.4,color.replace('ALPHA',(.30*a).toFixed(3)));\n      g.addColorStop(1,color.replace('ALPHA','0'));\n      ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;\n      ctx.beginPath();ctx.arc(p.x,p.y,rad,0,6.284);ctx.fill();ctx.globalCompositeOperation='source-over'\n    }})\n  }\n  function jag(pts,amp,color,w){\n    var sp=pts.map(proj);\n    Q.push({z:0,draw:function(){\n      ctx.beginPath();ctx.moveTo(sp[0].x,sp[0].y);\n      for(var i=1;i<sp.length;i++){var o=(Math.random()-.5)*amp;ctx.lineTo(sp[i].x+o,sp[i].y+o*.7)}\n      ctx.strokeStyle=color;ctx.lineWidth=w;ctx.shadowColor='#bfe6ff';ctx.shadowBlur=26;ctx.lineJoin='round';ctx.stroke();ctx.shadowBlur=0\n    }})\n  }\n\n  function sky(){\n    var g=ctx.createLinearGradient(0,0,0,H);\n    g.addColorStop(0,'#050c17');g.addColorStop(.45,'#0a1a2c');g.addColorStop(.62,'#123049');g.addColorStop(1,'#050a11');\n    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);\n    ctx.globalCompositeOperation='lighter';\n    var hz=proj({x:0,y:0,z:0}).y;\n    var g2=ctx.createRadialGradient(W*.72,hz-H*.06,0,W*.72,hz-H*.06,H*.85);\n    g2.addColorStop(0,'rgba(28,110,180,.28)');g2.addColorStop(1,'rgba(0,0,0,0)');\n    ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'\n  }\n  function ground(){\n    var a=proj({x:-220,y:0,z:-220}),b=proj({x:220,y:0,z:-220}),c=proj({x:220,y:0,z:220}),d=proj({x:-220,y:0,z:220});\n    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();\n    var g=ctx.createLinearGradient(0,proj({x:0,y:0,z:-120}).y,0,H);\n    g.addColorStop(0,'#0b1524');g.addColorStop(1,'#060c15');ctx.fillStyle=g;ctx.fill();\n    ctx.strokeStyle='rgba(90,140,190,.13)';ctx.lineWidth=1;\n    for(var i=-8;i<=8;i++){\n      var p1=proj({x:i*12,y:.02,z:-96}),p2=proj({x:i*12,y:.02,z:96});\n      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();\n      var p3=proj({x:-96,y:.02,z:i*12}),p4=proj({x:96,y:.02,z:i*12});\n      ctx.beginPath();ctx.moveTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.stroke()\n    }\n  }\n\n  function frame(now){\n    var t=(now-t0)/1000;\n    if(phase==='intro'){\n      var k=ease(Math.min(1,t/DUR));\n      cam.yaw=-1.02+.62*k;cam.pitch=.46-.21*k;cam.dist=96-42*k;\n      if(t>=DUR){phase='terms';showTerms()}\n    }else{\n      cam.yaw+=.0008;cam.dist+=Math.sin(t*.35)*.006\n    }\n    var en=Math.max(0,Math.min(1,(t-strikeAt)/.9));\n    if(t>strikeAt&&t<strikeAt+.16)flash=Math.max(flash,1-(t-strikeAt)/.16);\n    flash*=.9;\n\n    ctx.setTransform(DPR,0,0,DPR,0,0);\n    sky();ground();Q=[];\n\n    tower(-34);tower(34);\n    box(0,0,0,26,1.2,17,'#141f2e');\n    box(0,1.2,0,15,8.4,10,'#2f4257');\n    box(0,9.6,0,15.6,1.1,10.6,'#3a4f68');\n    for(var i=-3;i<=3;i++){box(8.1,2.2,i*1.35,.9,6.6,.9,'#26374a');box(-8.1,2.2,i*1.35,.9,6.6,.9,'#26374a')}\n    box(0,1.2,-6.6,4.6,3.6,2.4,'#25364a');\n    box(-19,1.2,4.5,7,7.5,5,'#223145');\n    box(19,1.2,4.5,6,6.5,4.4,'#223145');\n\n    phases.forEach(function(ph,idx){\n      var bx=ph.x;\n      cyl(bx,10.7,-1.2,10.7+6.2,1.35,'#a9bccf',10);\n      insulators(bx,busY-.4,-1.2,3);\n      var left=conductorPath(-34,bx,-1.2,TH,busY+1.2,3.4+idx*.5);\n      var right=conductorPath(34,bx,-1.2,TH,busY+1.2,3.4+idx*.5);\n      var lw=1.6,glow=en*.9;\n      var col=en>0?ph.c:'#5d6f84';\n      drawPoly(left,col,lw+en*.7,glow);drawPoly(right,col,lw+en*.7,glow);\n      if(en>0){\n        glowBlob({x:bx,y:busY+1.4,z:-1.2},2.6,'rgba(150,220,255,ALPHA)',en);\n        var sp=(t*.55+idx*.33)%1;\n        var li=Math.floor(sp*(left.length-1));\n        glowBlob(left[li],1.5,'rgba(255,255,255,ALPHA)',en*.9);\n        glowBlob(right[left.length-1-li],1.5,'rgba(255,255,255,ALPHA)',en*.9)\n      }\n      if(t>strikeAt-.02&&t<strikeAt+.22){\n        jag(left,10*Math.random()+4,'rgba(235,248,255,.95)',2.2);\n        jag(right,10*Math.random()+4,'rgba(235,248,255,.9)',2)\n      }\n    });\n\n    if(en>0){\n      glowBlob({x:0,y:6,z:5.4},9,'rgba(90,170,255,ALPHA)',en*(.32+.06*Math.sin(t*7)));\n      [[-27,7],[27,7]].forEach(function(l){\n        box(l[0],0,-11,.7,l[1],.7,'#2a3a4e');\n        glowBlob({x:l[0],y:l[1]+.6,z:-11},4.2,'rgba(255,232,180,ALPHA)',en*.75)\n      });\n      glowBlob({x:-19,y:6,z:7},3.2,'rgba(120,255,220,ALPHA)',en*.4)\n    }\n\n    Q.sort(function(a,b){return b.z-a.z});\n    for(var q=0;q<Q.length;q++)Q[q].draw();\n\n    if(flash>.01){ctx.fillStyle='rgba(210,238,255,'+(flash*.55).toFixed(3)+')';ctx.fillRect(0,0,W,H)}\n    last=now;\n    if(!done)requestAnimationFrame(frame)\n  }\n  var last=0;\n  requestAnimationFrame(frame);\n  // watchdog: rAF pode ficar suspenso (aba oculta/preview) — a abertura nunca deve travar\n  var wd=setInterval(function(){\n    if(done){clearInterval(wd);return}\n    if(!document.hidden&&performance.now()-last>420)frame(performance.now())\n  },140);\n  setTimeout(function(){phase='terms';showTerms()},DUR*1000+250);\n  setTimeout(function(){phase='terms';showTerms()},DUR*1000+200);\n\n  var terms=document.getElementById('spTerms'),chk=document.getElementById('spCheck'),ok=document.getElementById('spAccept');\n  function showTerms(){\n    if(terms.classList.contains('sp-on'))return;\n    root.querySelector('.sp-brand').style.transition='opacity .4s ease';\n    root.querySelector('.sp-brand').style.opacity='.16';\n    document.getElementById('spSkip').style.display='none';\n    terms.classList.add('sp-on');\n    var last=null;try{last=localStorage.getItem('subpro_terms_accepted')}catch(e){}\n    if(last)document.getElementById('spStamp').textContent='Aceitação anterior registrada em '+last+'. A confirmação é solicitada a cada acesso.';\n    setTimeout(function(){chk.focus()},260)\n  }\n  document.getElementById('spSkip').addEventListener('click',function(){phase='terms';showTerms()});\n  chk.addEventListener('change',function(){ok.disabled=!chk.checked});\n  ok.addEventListener('click',function(){\n    if(!chk.checked)return;\n    try{localStorage.setItem('subpro_terms_accepted',new Date().toLocaleString('pt-BR'))}catch(e){}\n    done=true;root.classList.add('sp-out');\n    setTimeout(function(){root.remove();var s=document.getElementById('sp-splash-style');if(s)s.remove()},560)\n  });\n  document.getElementById('spDecline').addEventListener('click',function(){\n    done=true;terms.classList.remove('sp-on');document.getElementById('spBlocked').classList.add('sp-on')\n  });\n})();\n<\u002Fscript>\n\n<div id=\"welcome\" class=\"welcome\">\n  <div class=\"welcome-inner\">\n    <div>\n      <div class=\"welcome-logo\"><span>⚡<\u002Fspan><span>SubestaçãoPro <small style=\"font-size:11px;opacity:.7\">v2.0<\u002Fsmall><\u002Fspan><\u002Fdiv>\n      <h1>Pré-dimensionamento de subestações prediais<\u002Fh1>\n      <p>Organize cargas, simule perfis horários, compare equipamentos, selecione transformadores, verifique os principais critérios elétricos e gere materiais, custos e memorial em um único ambiente.<\u002Fp>\n      <div class=\"welcome-actions\">\n        <button class=\"btn btn-primary btn-lg\" id=\"welcomeNew\">＋ Novo projeto<\u002Fbutton>\n        <button class=\"btn btn-lg\" id=\"welcomeOpen\">▤ Abrir projetos<\u002Fbutton>\n        <button class=\"btn btn-lg\" id=\"welcomeLibrary\">▦ Biblioteca de exemplos<\u002Fbutton>\n        <button class=\"btn btn-lg\" id=\"welcomeDemo\">▶ Exemplo administrativo<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"welcome-warning\"><strong>Aviso técnico:<\u002Fstrong> ferramenta de apoio ao pré-dimensionamento put class=\"num\" type=\"number\" step=\"1\" min=\"1\" data-load-id=\"${row.id}\" data-load-field=\"voltage\" value=\"${esc(row.voltage)}\"><\u002Ftd>\n<td><select data-load-id=\"${row.id}\" data-load-field=\"phases\">${optionList([1,3],row.phases)}<\u002Fselect><\u002Ftd>\n<td><select data-load-id=\"${row.id}\" data-load-field=\"classification\">${optionList(['Normal','Essencial','Emergência'],row.classification)}<\u002Fselect><\u002Ftd>\n<td><div class=\"table-actions\"><button class=\"row-btn\" data-load-action=\"duplicate\" data-id=\"${row.id}\" title=\"Duplicar\">⧉<\u002Fbutton><button class=\"row-btn danger\" data-load-action=\"delete\" data-id=\"${row.id}\" title=\"Excluir\">✕<\u002Fbutton><\u002Fdiv><\u002Ftd>\n<\u002Ftr>`}\nfunction renderLoads(){const p=currentProject(),c=lastCalc=calculateProject(p);const calcMap=Object.fromEntries(c.loads.map(x=>[x.id,x]));document.getElementById('view-loads').innerHTML=pageHeader('Levantamento de cargas','Cadastre cargas por setor, categoria, criticidade e regime de utilização. A potência unitária deve representar a potência nominal de entrada; para motores, o rendimento informado corrige a demanda.',`<button class=\"btn\" data-action=\"import-csv\">⇧ Importar CSV<\u002Fbutton><button class=\"btn\" data-action=\"export-loads-csv\">⇩ Exportar CSV<\u002Fbutton><button class=\"btn btn-primary\" data-action=\"add-load\">＋ Nova carga<\u002Fbutton>`)+`\n<div class=\"grid grid-4\">\n${kpi('Linhas cadastradas',String(p.loads.length),'Itens individuais ou agrupados')}${kpi('Potência instalada',fmt(c.installedKw,2)+' kW','Soma nominal das cargas')}${kpi('Demanda ativa',fmt(c.demandKw,2)+' kW','Após demanda, simultaneidade e rendimento')}${kpi('Demanda aparente',fmt(c.demandKva,2)+' kVA','Antes das margens globais')}\n<\u002Fdiv>\n<div class=\"card mt-2\"><div class=\"card-header\"><div><div class=\"card-title\">Tabela de cargas<\u002Fdiv><div class=\"card-subtitle\">Pdem = Quantidade × Punit × FD × FS ÷ η; S = Pdem ÷ FP<\u002Fdiv tCalc=calculateProject(p);const rows=c.loads.slice().sort((a,b)=>b.kva-a.kva);document.getElementById('view-demand').innerHTML=pageHeader('Cálculo da demanda','Consolidação das cargas e aplicação das margens de crescimento e reserva técnica.',`<button class=\"btn\" data-go=\"loads\">Editar cargas<\u002Fbutton><button class=\"btn btn-primary\" data-go=\"transformers\">Dimensionar transformadores →<\u002Fbutton>`)+`\n<div class=\"grid grid-5\">\n${kpi('Instalada',fmt(c.installedKw,1)+' kW','Potência nominal total')}${kpi('Demandada ativa',fmt(c.demandKw,1)+' kW',`Redução global de ${pct(c.installedKw?100-c.demandKw/c.installedKw*100:0)}`)}${kpi('Demandada aparente',fmt(c.demandKva,1)+' kVA',`FP global ${fmt(c.powerFactor,3)}`)}${kpi('Com crescimento',fmt(c.demandKva*c.growthFactor,1)+' kVA',`Fator ${fmt(c.growthFactor,2)}`)}${kpi('Com reserva',fmt(c.requiredKva,1)+' kVA',`Fator combinado ${fmt(c.growthFactor*c.reserveFactor,3)}`)}\n<\u002Fdiv>\n<div class=\"grid grid-2 mt-2\">\n  <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Demanda por categoria<\u002Fdiv><div class=\"card-subtitle\">Participação das cargas em kVA<\u002Fdiv><\u002Fdiv>${typeBadge('calculated')}<\u002Fdiv><div class=\"card-body\">${barChart(c.categories)}<\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Classificação operacional<\u002Fdiv><div class=\"card-subtitle\">Cargas normais, essenciais e de emergência<\u002Fdiv><\u002Fdiv>${typeBadge('calculated')}<\u002Fdiv><div class=\"card-body\">${barChart(c.classes)}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"grid grid-2 mt-2\">\n  <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Memória da demanda<\u002Fdiv><div class=\"card-subtitle\">Sequência de cálculo aplicada<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\">\n    <div class=\"formula\">P<sub>dem,i<\u002Fsub> = Qtd × P<sub>unit<\u002Fsub> × FD × FS ÷ η<br>S<sub>dem,i<\u002Fsub> = P<sub>dem,i<\u002Fsub> ÷ FP<br><br>S<sub>base<\u002Fsub> = Σ S<sub>dem,i<\u002Fsub> = ${fmt(c.demandKva,3)} kVA<br>S<sub>crescimento<\u002Fsub> = ${fmt(c.demandKva,3)} × ${fmt(c.growthFactor,3)} = ${fmt(c.demandKva*c.growthFactor,3)} kVA<br>S<sub>requerida<\u002Fsub> = ${fmt(c.demandKva*c.growthFactor,3)} × ${fmt(c.reserveFactor,3)} = <strong>${fmt(c.requiredKva,3)} kVA<\u002Fstrong><\u002Fdiv>\n    <div class=\"alert mt-2\"><div class=\"alert-title\">Interpretação<\u002Fdiv>A demanda requerida é usada para seleção dos transformadores e da corrente de projeto. Crescimento e reserva são aplicados sequencialmente.<\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Parâmetros globais<\u002Fdiv><div class=\"card-subtitle\">Edite sem retornar à tela do empreendimento<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\"><div class=\"form-grid\">${field('Margem de crescimento','electrical.growth',p.electrical.growth,{span:6,type:'number',step:.1,addon:'%'})}${field('Reserva técnica','electrical.reserve',p.electrical.reserve,{span:6,type:'number',step:.1,addon:'%'})}${field('Cenário de demanda','demand.scenario',p.demand.scenario,{span:6,options:['conservador','provável','otimizado']})}${field('Método','demand.method',p.demand.method,{span:6,options:['individual','por categoria','global']})}<\u002Fdiv><div class=\"alert warning\"><div class=\"alert-title\">Observação<\u002Fdiv>Nesta versão, o motor utiliza os fatores individuais cadastrados. Os seletores de cenário e método documentam a premissa para evolução e relatório.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card mt-2\"><div class=\"card-header\"><div><div class=\"card-title\">Maiores cargas<\u002Fdiv><div class=\"card-subtitle\">Ordenação pela potência aparente demandada<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\" style=\"padding:0\"><div class=\"table-wrap\" style=\"border:0\"><table class=\"data-table\"><thead><tr><th>Descrição<\u002Fth><th>Setor<\u002Fth><th>Categoria<\u002Fth><th>Instalada (kW)<\u002Fth><th>Demandada (kW)<\u002Fth><th>Aparente (kVA)<\u002Fth><th>Participação<\u002Fth><\u002Ftr><\u002Fthead><tbody>${rows.slice(0,15).map(x=>`<tr><td>${esc(x.description)}<\u002Ftd><td>${esc(x.sector)}<\u002Ftd><td>${esc(x.category)}<\u002Ftd><td class=\"num\">${fmt(x.installed,2)}<\u002Ftd><td class=\"num\">${fmt(x.demand,2)}<\u002Ftd><td class=\"num\"><strong>${fmt(x.kva,2)}<\u002Fstrong><\u002Ftd><td class=\"num\">${pct(c.demandKva?x.kva/c.demandKva*100:0)}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv><\u002Fdiv>`}\n\nfunction renderTransformers(){const p=currentProject(),c=lastCalc=calculateProject(p);const s=c.transformerScenarios;function card(x){const selected=p.transformer.selected===x.key;const load=c.requiredKva/Math.max(1,x.activeKva)*100;const st=statusClass(load,store.settings.maxLoading,100);return `<div class=\"scenario-card ${selected?'recommended':''}\">${selected?'<div class=\"recommend-tag\">Selecionado<\u002Fdiv>':''}<div class=\"scenario-head\"><div><div class=\"scenario-name\">${x.label}<\u002Fdiv><div class=\"text-muted\" style=\"font-size:11px\">${x.redundancy}<\u002Fdiv><\u002Fdiv><span class=\"badge ${st==='good'?'success':st==='warn'?'warning':'danger'}\">${pct(load)}<\u002Fspan><\u002Fdiv><div class=\"scenario-kva\">${x.count} × ${fmt0(x.unitKva)} kVA<\u002Fdiv><div class=\"scenario-stats\"><div class=\"scenario-stat\"><span>Capacidade instalada<\u002Fspan><strong>${fmt0(x.totalKva)} kVA<\u002Fstrong><\u002Fdiv><div class=\"scenario-stat\"><span>Capacidade ativa<\u002Fspan><strong>${fmt0(x.activeKva)} kVA<\u002Fstrong><\u002Fdiv><div class=\"scenario-stat\"><span>Folga ativa<\u002Fspan><strong>${fmt(x.activeKva-c.requiredKva,1)} kVA<\u002Fstrong><\u002Fdiv><\u002Fdiv><button class=\"btn ${selected?'btn-soft':'btn-primary'} w-100 mt-2\" data-transformer-select=\"${x.key}\">${selected?'Cenário em uso':'Selecionar cenário'}<\u002Fbutton><\u002Fdiv>`}\n  document.getElementById('view-transformers').innerHTML=pageHeader('Transformadores','Seleção preliminar da potência comercial, análise de carregamento e alternativas de redundância.',`<button class=\"btn\" data-go=\"demand\">← Revisar demanda<\u002Fbutton><button class=\"btn btn-primary\" data-go=\"shortcircuit\">Curto-circuito →<\u002Fbutton>`)+`\n<div class=\"grid grid-3\">${card(s.single)}${card(s.split)}${card(s.nplus1)}<\u002Fdiv>\n<div class=\"grid grid-2 mt-2\">\n <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Configuração selecionada<\u002Fdiv><div class=\"card-subtitle\">Parâmetros usados nos demais módulos<\u002Fdiv><\u002Fdiv>${typeBadge('suggested')}<\u002Fdiv><div class=\"card-body\"><div class=\"form-grid\">\n  ${field('Cenário','transformer.selected',p.transformer.selected,{span:6,options:['single','split','nplus1']})}${field('Tipo construtivo','electrical.transformerType',p.electrical.transformerType,{span:6,options:['Seco','Óleo','A comparar']})}\n  ${field('Potência manual do transformador','transformer.manualKva',p.transformer.manualKva,{span:6,type:'number',step:.5,addon:'kVA',help:'Zero mantém a seleção automática; um valor informado aplica-se à unidade do cenário selecionado.'})}${field('Impedância nominal','transformer.impedancePct',p.transformer.impedancePct,{span:6,type:'number',step:.01,addon:'%'})}\n  ${field('Perda em vazio estimada','transformer.noLoadLossPct',p.transformer.noLoadLossPct,{span:6,type:'number',step:.01,addon:'%'})}${field('Perda em carga estimada','transformer.loadLossPct',p.transformer.loadLossPct,{span:6,type:'number',step:.01,addon:'%'})}\n <\u002Fdiv><div class=\"check-row mt-2\">${boolCard('Operação em paralelo','transformer.parallel',p.transformer.parallel,'Aplicável ao cenário dividido; altera o curto-circuito no barramento comum.')}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\ ard\"><div class=\"card-header\"><div><div class=\"card-title\">Indicadores de passo e toque<\u002Fdiv><div class=\"card-subtitle\">Somente triagem; não são limites normativos<\u002Fdiv><\u002Fdiv>${typeBadge('estimated')}<\u002Fdiv><div class=\"card-body\"><div class=\"result-grid\"><div class=\"result-item\"><div class=\"result-label\">Indicador de toque<\u002Fdiv><div class=\"result-value\">${fmt0(g.touchIndicator)} V<\u002Fdiv><\u002Fdiv><div class=\"result-item\"><div class=\"result-label\">Indicador de passo<\u002Fdiv><div class=\"result-value\">${fmt0(g.stepIndicator)} V<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"alert danger mt-2\"><div class=\"alert-title\">Não usar para aprovação<\u002Fdiv>As tensões admissíveis dependem da geometria completa, camada superficial, corrente efetivamente dissipada, duração, peso corporal e modelo de solo. Realize estudo específico de malha.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>`}\n\nfunction layoutSvg(p,c){const l=p.layout;const W=800,H=470,pad=35;const roomW=Math.max(3,n(l.width,9)),roomL=Math.max(3,n(l.length,7));const sx=(W-2*pad)/roomW,sy=(H-2*pad)/roomL;const scale=Math.min(sx,sy);const rw=roomW*scale,rh=roomL*scale,ox=(W-rw)/2,oy=(H-rh)/2;const count=c.selected.count;const items=[];items.push({x:.5,y:.6,w:2.2,h:1.2,label:'Cubículos MT'});for(let i=0;i<count;i++)items.push({x:3+i*2.25,y:.6,w:1.8,h:1.7,label:`Trafo ${i+1}\\n${fmt0(c.selected.unitKva)} kVA`});items.push({x:.5,y:3,w:2.5,h:1.5,label:'QGBT'});if(p.electrical.capacitor)items.push({x:3.5,y:3.1,w:1.6,h:1.2,label:'Banco\\ncapacitivo'});if(p.electrical.generator)items.push({x:5.6,y:3,w:2.1,h:1.5,label:'Gerador'});function rect(it){const x=ox+it.x*scale,y=oy+it.y*scale,w=Math.min(it.w*scale,rw-it.x*scale-5),h=it.h*scale;return `<rect x=\"${x}\" y=\"${y}\" width=\"${Math.max(25,w)}\" height=\"${h}\" rx=\"7\" fill=\"#ffffff\" stroke=\"#0b5cad\" stroke-width=\"2\"/><text x=\"${x+Math.max(25,w)/2}\" y=\"${y+h/2-4}\" text-anchor=\"middle\" fill=\"#172033\" fon e class=\"data-table\"><thead><tr><th>Classe<\u002Fth><th>Item<\u002Fth><th>Grupo<\u002Fth><th>Valor<\u002Fth><th>Participação<\u002Fth><th>Acumulado<\u002Fth><\u002Ftr><\u002Fthead><tbody>${b.abc.map(x=>`<tr><td><span class=\"badge ${x.abc==='A'?'danger':x.abc==='B'?'warning':'info'}\">${x.abc}<\u002Fspan><\u002Ftd><td>${esc(x.description)}<\u002Ftd><td>${esc(x.group)}<\u002Ftd><td class=\"num\">${money(x.total)}<\u002Ftd><td class=\"num\">${pct(x.share)}<\u002Ftd><td class=\"num\">${pct(x.cumulative)}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"alert warning mt-2\"><div class=\"alert-title\">Preços ilustrativos<\u002Fdiv>A ferramenta não consulta preços de mercado nesta versão. Valores gerados automaticamente são parâmetros internos editáveis e não devem ser usados em contratação sem pesquisa de preços, especificação e data-base adequadas.<\u002Fdiv>`}\n\nfunction renderScenarios(){const p=currentProject(),c=lastCalc=calculateProject(p),sc=Object.values(c.costScenarios);const best=Math.min(...sc.map(x=>x.tenYear));document.getElementById('view-scenarios').innerHTML=pageHeader('Comparação de cenários','Análise paramétrica de investimento, perdas, manutenção, redundância e custo em dez anos.',`<button class=\"btn\" data-go=\"budget\">← Orçamento<\u002Fbutton><button class=\"btn btn-primary\" data-go=\"report\">Memorial →<\u002Fbutton>`)+`\n<div class=\"grid grid-3\">${sc.map(x=>`<div class=\"scenario-card ${x.key==='balanced'?'recommended':''}\">${x.key==='balanced'?'<div class=\"recommend-tag\">Equilíbrio técnico<\u002Fdiv>':''}<div class=\"scenario-head\"><div><div class=\"scenario-name\">${esc(x.name)}<\u002Fdiv><div class=\"text-muted\" style=\"font-size:11px\">${x.count} × ${fmt0(x.unit)} kVA · ${x.type}<\u002Fdiv><\u002Fdiv><span class=\"badge ${x.loading<=store.settings.maxLoading?'success':x.loading<=100?'warning':'danger'}\">${pct(x.loading)}<\u002Fspan><\u002Fdiv><div class=\"scenario-kva\">${mon inuidade<\u002Fstrong>A alternativa N+1 mantém capacidade integral com uma unidade indisponível.<\u002Fdiv><\u002Fdiv><div class=\"warning-item\"><div class=\"warning-icon\">⇆<\u002Fdiv><div class=\"warning-text\"><strong>Maior flexibilidade<\u002Fstrong>A divisão em duas unidades permite escalonamento e manutenção parcial, desde que a topologia seja adequada.<\u002Fdiv><\u002Fdiv><div class=\"warning-item\"><div class=\"warning-icon\">⌂<\u002Fdiv><div class=\"warning-text\"><strong>Área e implantação<\u002Fstrong>Soluções redundantes aumentam espaço, cubículos, cabos e complexidade operacional.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card mt-2\"><div class=\"card-header\"><div><div class=\"card-title\">Tabela consolidada<\u002Fdiv><div class=\"card-subtitle\">Hipóteses de custo configuráveis no módulo Configurações<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\" style=\"padding:0\"><div class=\"table-wrap\" style=\"border:0\"><table class=\"data-table\"><thead><tr><th>Alternativa<\u002Fth><th>Configuração<\u002Fth><th>Tipo<\u002Fth><th>Carregamento<\u002Fth><th>Investimento<\u002Fth><th>Perdas anuais<\u002Fth><th>Manutenção anual<\u002Fth><th>10 anos<\u002Fth><th>Redundância<\u002Fth><\u002Ftr><\u002Fthead><tbody>${sc.map(x=>`<tr><td><strong>${esc(x.name)}<\u002Fstrong><\u002Ftd><td>${x.count} × ${fmt0(x.unit)} kVA<\u002Ftd><td>${x.type}<\u002Ftd><td class=\"num\">${pct(x.loading)}<\u002Ftd><td class=\"num\">${money(x.investment)}<\u002Ftd><td class=\"num\">${money(x.annualLossCost)}<\u002Ftd><td class=\"num\">${money(x.annualMaintenance)}<\u002Ftd><td class=\"num\"><strong>${money(x.tenYear)}<\u002Fstrong><\u002Ftd><td>${x.redundancy}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"alert warning mt-2\"><div class=\"alert-title\">Modelo paramétrico<\u002Fdiv>Os custos e perdas desta comparação são estimativas internas para triagem. Substitua-os por propostas técnicas, curvas de eficiência, tarifas, custos de indisponibilidade e manutenção próprios do empreendimento.<\u002Fdiv>`}\nfunction completeness(p,c){const items=[['Identificação do empreendimento',!!(p.name&&p.meta.enterprise&&p.meta.city)],['Responsável pelo estudo',!!p.meta.responsible],['Cargas cadastradas',p.loads.length>0],['Dados da distribuidora',!!(p.meta.utility&&n(p.shortCircuit.utilityMva)>0)],['Transformador definido',c.selected.activeKva>0],['Parâmetros de cabos',!!(p.cable.material&&n(p.cable.length)>=0)],['Aterramento informado',n(p.grounding.soilResistivity)>0],['Arranjo físico',n(p.layout.width)>0&&n(p.layout.length)>0],['Orçamento',p.budget.length>0],['Conclusão do responsável',!!p.report.conclusion]];const done=items.filter(x=>x[1]).length;return{items,score:done/items.length*100,done,total:items.length}}\nfunction reportTable(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${h}<\u002Fth>`).join('')}<\u002Ftr><\u002Fthead><tbody>${rows.join('')}<\u002Ftbody><\u002Ftable>`}\nfunction buildReportHtml(p,c){const b=budgetCalc(p),comp=completeness(p,c),date=new Intl.DateTimeFormat('pt-BR',{dateStyle:'long'}).format(new Date());const alertRows=c.alerts.length?c.alerts.map(x=>`<tr><td>${esc(x.level.toUpperCase())}<\u002Ftd><td>${esc(x.title)}<\u002Ftd><td>${esc(x.text)}<\u002Ftd><td>${esc(x.module)}<\u002Ftd><\u002Ftr>`).join(''):'<tr><td colspan=\"4\">Nenhum alerta automático.<\u002Ftd><\u002Ftr>';const loadRows=c.loads.map(x=>`<tr><td>${esc(x.category)}<\u002Ftd><td>${esc(x.sector)}<\u002Ftd><td>${esc(x.description)}<\u002Ftd><td class=\"num\">${fmt(x.installed,2)}<\u002Ftd><td class=\"num\">${fmt(x.demand,2)}<\u002Ftd><td class=\"num\">${fmt(x.kva,2)}<\u002Ftd><td>${esc(x.classification)}<\u002Ftd><\u002Ftr>`);const budgetRows=b.rows.map(x=>`<tr><td>${esc(x.group)}<\u002Ftd><td>${esc(x.description)}<\u002Ftd><td>${esc(x.unit)}<\u002Ftd><td class=\"num\">${fmt(x.qty,2)}<\u002Ftd><td class=\"num\">${money(x.unitPrice)}<\u002Ftd><td class=\"num\">${money(x.total)}<\u002Ftd><td>${esc(x.source)}<\u002Ftd><\u002Ftr>`);const scen=Object.values(c.costScenarios);return `<!DOCTYPE html><html lang=\"pt-BR\"><head><meta charset=\"UTF-8\"><title>Memorial – ${esc(p.name)}<\u002Ftitle><style>\n@page{size:A4;margin:18mm 16mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#172033;font-size:10.5pt;line-height:1.45;margin:0}h1{font-size:25pt;color:#0b5cad;margin:0 0 8px}h2{font-size:16pt;color:#0b5cad;border-bottom:2px solid #dbe9f6;padding-bottom:5px;margin:28px 0 12px}h3{font-size:12.5pt;margin:18px 0 8px}.cover{min-height:245mm;display:flex;flex-direction:column;justify-content:space-between;page-break-after:always}.cover-mark{font-size:38pt}.subtitle{font-size:15pt;color:#536579}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;border-top:1px solid #cad5e1;padding-top:14px}.meta div{padding:4px 0}.label{font-size:8pt;text-transform:uppercase;color:#64748b;font-weight:bold}.value{font-weight:bold}.notice{border:1px solid #e5b04e;background:#fff8e7;border-left:5px solid #c87800;border-radius:5px;padding:10px 12px;margin:12px 0}.info{border:1px solid #a9cce9;background:#f0f8ff;border-left:5px solid #0b5cad;border-radius:5px;padding:10px 12px;margin:12px 0}.danger{border:1px solid #e4aaa5;background:#fff0ef;border-left:5px solid #c9362b;border-radius:5px;padding:10px 12px;margin:12px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.kpi{border:1px solid #d5dee8;border-radius:6px;padding:9px}.kpi small{display:block;color:#64748b}.kpi strong{font-size:14pt;color:#0b5cad}.formula{font-family:Consolas,monospace;background:#f7f9fc;border:1px dashed #b8c5d3;border-radius:5px;padding:10px;margin:8px 0;white-space:normal}table{width:100%;border-collapse:collapse;margin:8px 0 15px;font-size:8.5pt}th{background:#eaf2fa;color:#27415c;text-align:left;padding:6px;border:1px solid #bfcbd8}td{padding:5px 6px;border:1px solid #d5dee8;vertical-align:top}.num{text-align:right;white-space:nowrap}.section{page-break-inside:auto}.keep{page-break-inside:avoid}.page-break{page-break-before:always}.footer-note{font-size:8pt;color:#64748b;margin-top:18px}.signature{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:55px}.signature div{border-top:1px solid #172033;text-align:center;padding-top:7px}.unifilar{border:1px solid #d5dee8;border-radius:6px;padding:5px}.unifilar svg{width:100%;height:auto}.pill{display:inline-block;padding:2px 6px;border-radius:10px;background:#eaf2fa;color:#0b5cad;font-size:8pt;font-weight:bold}@media print{.no-print{display:none}}<\u002Fstyle><template id=\"__bundler_thumbnail\" data-bg-color=\"#04080f\">\n  <svg viewBox=\"0 0 1200 800\" xmlns=\"http://www.w3.org/2000/svg\">\n    <rect width=\"1200\" height=\"800\" fill=\"#04080f\"/>\n    <rect x=\"420\" y=\"420\" width=\"360\" height=\"150\" rx=\"10\" fill=\"#2f4257\"/>\n    <rect x=\"470\" y=\"360\" width=\"40\" height=\"70\" fill=\"#a9bccf\"/>\n    <rect x=\"580\" y=\"360\" width=\"40\" height=\"70\" fill=\"#a9bccf\"/>\n    <rect x=\"690\" y=\"360\" width=\"40\" height=\"70\" fill=\"#a9bccf\"/>\n    <path d=\"M180 250 L600 400 L1020 250\" stroke=\"#8fe3ff\" stroke-width=\"12\" fill=\"none\"/>\n    <path d=\"M180 300 L600 450 L1020 300\" stroke=\"#ffd27a\" stroke-width=\"12\" fill=\"none\"/>\n    <rect x=\"160\" y=\"240\" width=\"24\" height=\"330\" fill=\"#33445c\"/>\n    <rect x=\"1016\" y=\"240\" width=\"24\" height=\"330\" fill=\"#33445c\"/>\n    <path d=\"M600 120 l-52 130 h44 l-34 110 96 -150 h-46 l40 -90 z\" fill=\"#22dbc8\"/>\n  <\u002Fsvg>\n<\u002Ftemplate>\n<\u002Fhead><body>\n<section class=\"cover\"><div><div class=\"cover-mark\">⚡<\u002Fdiv><h1>SubestaçãoPro<\u002Fh1><div class=\"subtitle\">Memorial de pré-dimensionamento de subestação predial<\u002Fdiv><\u002Fdiv><div><h2 style=\"border:0;margin-bottom:4px\">${esc(p.name)}<\u002Fh2><div style=\"font-size:14pt;color:#536579\">${esc(p.meta.enterprise||'Empreendimento')}<\u002Fdiv><\u002Fdiv><div class=\"meta\"><div><div class=\"label\">Contratante<\u002Fdiv><div class=\"value\">${esc(p.meta.client||'Não informado')}<\u002Fdiv><\u002Fdiv><div><div class=\"label\">Código / revisão<\u002Fdiv><div class=\"value\">${esc(p.meta.code||'—')} / Rev. ${esc(p.meta.revision||'00')}<\u002Fdiv><\u002Fdiv><div><div class=\"label\">Município / UF<\u002Fdiv><div class=\"value\">${esc(p.meta.city||'—')} / ${esc(p.meta.uf||'—')}<\u002Fdiv><\u002Fdiv><div><div class=\"label\">Data<\u002Fdiv><div class=\"value\">${esc(p.meta.date||date)}<\u002Fdiv><\u002Fdiv><div><div class=\"label\">Responsável<\u002Fdiv><div class=\"value\">${esc(p.meta.responsible||'Não informado')}<\u002Fdiv><\u002Fdiv><div><div class=\"label\">Etapa<\u002Fdiv><div class=\"value\">${esc(p.meta.stage)}<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"notice\"><strong>Natureza do documento.<\u002Fstrong> ${esc(store.settings.disclaimer)}<\u002Fdiv><\u002Fsection>\n<section class=\"section\"><h2>1. Resumo executivo<\u002Fh2><p>Este memorial consolida os dados informados no SubestaçãoPro e apresenta resultados de pré-dimensionamento para apoio à definição da arquitetura elétrica. O nível de completude do estudo é de <strong>${pct(comp.score,0)}<\u002Fstrong> (${comp.done} de ${comp.total} grupos preenchidos).<\u002Fp><div class=\"kpis\"><div class=\"kpi\"><small>Potência instalada<\u002Fsmall><strong>${fmt(c.installedKw,1)} kW<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Demanda base<\u002Fsmall><strong>${fmt(c.demandKva,1)} kVA<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Demanda requerida<\u002Fsmall><strong>${fmt(c.requiredKva,1)} kVA<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Transformação ativa<\u002Fsmall><strong>${fmt0(c.selected.activeKva)} kVA<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Carregamento<\u002Fsmall><strong>${pct(c.loading)}<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Curto-circuito 3φ<\u002Fsmall><strong>${fmt(c.shortCircuit.ik3,2)} kA<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Banco capacitivo<\u002Fsmall><strong>${fmt0(c.powerFactorCalc.rounded)} kvar<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Custo preliminar<\u002Fsmall><strong>${money(b.total)}<\u002Fstrong><\u002Fdiv><\u002Fdiv><div class=\"info\"><strong>Solução selecionada:<\u002Fstrong> ${esc(c.selected.label)}, composta por ${c.selected.count} unidade(s) de ${fmt0(c.selected.unitKva)} kVA, com capacidade ativa de ${fmt0(c.selected.activeKva)} kVA e ${esc(c.selected.redundancy.toLowerCase())}.<\u002Fdiv><\u002Fsection>\n<section class=\"section\"><h2>2. Identificação e premissas<\u002Fh2>${reportTable(['Parâmetro','Valor'],[\n`<tr><td>Empreendimento<\u002Ftd><td>${esc(p.meta.enterprise||p.name)}<\u002Ftd><\u002Ftr>`,`<tr><td>Endereço<\u002Ftd><td>${esc(p.meta.address||'Não informado')}<\u002Ftd><\u002Ftr>`,`<tr><td>Tipo / área / pavimentos<\u002Ftd><td>${esc(p.meta.buildingType)} · ${fmt(n(p.meta.area),2)} m² · ${fmt0(n(p.meta.floors))} pav.<\u002Ftd><\u002Ftr>`,`<tr><td>Distribuidora<\u002Ftd><td>${esc(p.meta.utility||'Não informada')}<\u002Ftd><\u002Ftr>`,`<tr><td>Tensões<\u002Ftd><td>${fmt0(n(p.electrical.primaryVoltage))} V / ${fmt0(n(p.electrical.secondaryVoltage))} V · ${fmt0(n(p.electrical.frequency))} Hz<\u002Ftd><\u002Ftr>`,`<tr><td>Esquema de aterramento<\u002Ftd><td>${esc(p.electrical.grounding)}<\u002Ftd><\u002Ftr>`,`<tr><td>Margens<\u002Ftd><td>Crescimento ${pct(n(p.electrical.growth))}; reserva técnica ${pct(n(p.electrical.reserve))}<\u002Ftd><\u002Ftr>`,`<tr><td>Recursos<\u002Ftd><td>Gerador: ${p.electrical.generator?'sim':'não'}; FV: ${p.electrical.photovoltaic?'sim':'não'}; UPS: ${p.electrical.ups?'sim':'não'}; VE: ${p.electrical.ev?'sim':'não'}<\u002Ftd><\u002Ftr>`])}<\u002Fsection>\n<section class=\"section page-break\"><h2>3. Levantamento de cargas<\u002Fh2><p>Para cada carga, a potência ativa demandada foi estimada pela aplicação dos fatores de demanda e simultaneidade, com correção pelo rendimento informado.<\u002Fp>${reportTable(['Categoria','Setor','Descrição','Instalada kW','Demandada kW','Aparente kVA','Classe'],loadRows)}<div class=\"formula\">Pdem,i = Quantidade × Punit × FD × FS ÷ η<br>Sdem,i = Pdem,i ÷ FP<br>Σ Pinst = ${fmt(c.installedKw,3)} kW; Σ Pdem = ${fmt(c.demandKw,3)} kW; Σ Sdem = ${fmt(c.demandKva,3)} kVA.<\u002Fdiv><\u002Fsection>\n<section class=\"section\"><h2>4. Demanda e transformação<\u002Fh2><div class=\"formula\">Srequerida = Sbase × (1 + crescimento) × (1 + reserva)<br>Srequerida = ${fmt(c.demandKva,3)} × ${fmt(c.growthFactor,3)} × ${fmt(c.reserveFactor,3)} = <strong>${fmt(c.requiredKva,3)} kVA<\u002Fstrong>.<\u002Fdiv>${reportTable(['Grandeza','Resultado','Classificação'],[\n`<tr><td>Potência comercial unitária<\u002Ftd><td>${fmt0(c.selected.unitKva)} kVA<\u002Ftd><td>Resultado sugerido<\u002Ftd><\u002Ftr>`,`<tr><td>Quantidade / capacidade total<\u002Ftd><td>${c.selected.count} / ${fmt0(c.selected.totalKva)} kVA<\u002Ftd><td>Resultado sugerido<\u002Ftd><\u002Ftr>`,`<tr><td>Capacidade ativa<\u002Ftd><td>${fmt0(c.selected.activeKva)} kVA<\u002Ftd><td>Resultado calculado<\u002Ftd><\u002Ftr>`,`<tr><td>Carregamento<\u002Ftd><td>${pct(c.loading)}<\u002Ftd><td>Resultado calculado<\u002Ftd><\u002Ftr>`,`<tr><td>Corrente primária<\u002Ftd><td>${fmt(c.primaryCurrent,3)} A<\u002Ftd><td>Resultado calculado<\u002Ftd><\u002Ftr>`,`<tr><td>Corrente secundária nominal<\u002Ftd><td>${fmt(c.secondaryRatedCurrent,3)} A<\u002Ftd><td>Resultado calculado<\u002Ftd><\u002Ftr>`])}<\u002Fsection>\n<section class=\"section\"><h2>5. Curto-circuito preliminar<\u002Fh2><div class=\"notice\"><strong>${n(p.shortCircuit.utilityMva)>0?'Dado da fonte informado.':'Dado da distribuidora ausente.'}<\u002Fstrong> ${n(p.shortCircuit.utilityMva)>0?'O nível de curto-circuito indicado foi incorporado ao equivalente.':'O resultado foi estimado sem o nível oficial no ponto de entrega e depende de validação.'}<\u002Fdiv>${reportTable(['Parâmetro','Valor'],[\n`<tr><td>Base adotada<\u002Ftd><td>${fmt0(c.shortCircuit.scBaseKva)} kVA<\u002Ftd><\u002Ftr>`,`<tr><td>Impedância do transformador<\u002Ftd><td>${fmt(c.shortCircuit.ztr*100,3)}%<\u002Ftd><\u002Ftr>`,`<tr><td>Impedância equivalente<\u002Ftd><td>${fmt(c.shortCircuit.ztotal,6)} pu<\u002Ftd><\u002Ftr>`,`<tr><td>Curto-circuito trifásico<\u002Ftd><td>${fmt(c.shortCircuit.ik3,3)} kA<\u002Ftd><\u002Ftr>`,`<tr><td>Falta fase-terra indicativa<\u002Ftd><td>${fmt(c.shortCircuit.ik1,3)} kA<\u002Ftd><\u002Ftr>`,`<tr><td>Corrente de pico<\u002Ftd><td>${fmt(c.shortCircuit.peak,3)} kA<\u002Ftd><\u002Ftr>`,`<tr><td>Interrupção mínima sugerida<\u002Ftd><td>${fmt0(c.shortCircuit.breaking)} kA<\u002Ftd><\u002Ftr>`])}<\u002Fsection>\n<section class=\"section page-break\"><h2>6. Cabos, barramentos e proteção<\u002Fh2><h3>6.1 Cabos de baixa tensão<\u002Fh3>${reportTable(['Critério','Resultado'],[\n`<tr><td>Configuração sugerida<\u002Ftd><td>${c.cable.parallel} cabo(s) de ${fmt0(c.cable.section)} mm² por fase – ${esc(c.cable.material)}<\u002Ftd><\u002Ftr>`,`<tr><td>Corrente de projeto / ampacidade<\u002Ftd><td>${fmt(c.cable.designCurrent,1)} A / ${fmt(c.cable.ampacity,1)} A<\u002Ftd><\u002Ftr>`,`<tr><td>Queda de tensão<\u002Ftd><td>${pct(c.cable.dropPct,3)} (limite ${pct(c.cable.maxDrop)})<\u002Ftd><\u002Ftr>`,`<tr><td>Seção térmica mínima por cabo<\u002Ftd><td>${fmt(c.cable.shortRequired,2)} mm²<\u002Ftd><\u002Ftr>`,`<tr><td>Verificações<\u002Ftd><td>Ampacidade: ${c.cable.okAmp?'atende':'não atende'}; queda: ${c.cable.okDrop?'atende':'não atende'}; curto: ${c.cable.okShort?'atende':'não atende'}<\u002Ftd><\u002Ftr>`])}<h3>6.2 Barramento principal<\u002Fh3><p>Arranjo sugerido: <strong>${c.busbar.bars} barra(s) de ${c.busbar.w} × ${c.busbar.t} mm por fase<\u002Fstrong>, área total ${fmt0(c.busbar.totalArea)} mm² para área requerida ${fmt0(c.busbar.required)} mm².<\u002Fp><h3>6.3 Proteções<\u002Fh3>${reportTable(['Elemento','Seleção preliminar'],[\n`<tr><td>Proteção MT<\u002Ftd><td>${esc(p.protection.mtType)} · ${fmt0(c.protection.mtRating)} A · TC ${fmt0(c.protection.ctPrimary)}/5 A<\u002Ftd><\u002Ftr>`,`<tr><td>Disjuntor geral BT<\u002Ftd><td>${fmt0(c.protection.lvRating)} A · ${fmt0(c.protection.breaking)} kA<\u002Ftd><\u002Ftr>`,`<tr><td>Funções<\u002Ftd><td>${c.protection.functions.join(', ')}<\u002Ftd><\u002Ftr>`])}<div class=\"danger\"><strong>Coordenação e seletividade.<\u002Fstrong> Os ajustes finais dependem das curvas dos dispositivos, magnetização do transformador, partida de motores, alimentadores, energia incidente e requisitos da distribuidora.<\u002Fdiv><\u002Fsection>\n<section class=\"section\"><h2>7. Fator de potência<\u002Fh2><div class=\"formula\">Qc = P × [tan(arccos FPatual) − tan(arccos FPdesejado)]<br>Qc = ${fmt(c.powerFactorCalc.P,3)} × [tan(arccos ${fmt(c.powerFactorCalc.current,4)}) − tan(arccos ${fmt(c.powerFactorCalc.target,4)})] = ${fmt(c.powerFactorCalc.kvar,3)} kvar.<\u002Fdiv><p>Banco sugerido: <strong>${fmt0(c.powerFactorCalc.rounded)} kvar<\u002Fstrong>, corrente nominal ${fmt(c.powerFactorCalc.currentA,1)} A, dividido preliminarmente em ${c.powerFactorCalc.stages} estágio(s) de ${fmt(c.powerFactorCalc.stageKvar,1)} kvar.<\u002Fp><\u002Fsection>\n<section class=\"section\"><h2>8. Aterramento preliminar<\u002Fh2>${reportTable(['Grandeza','Resultado'],[\n`<tr><td>Resistividade adotada<\u002Ftd><td>${fmt(c.grounding.rho,2)} Ω·m<\u002Ftd><\u002Ftr>`,`<tr><td>Hastes<\u002Ftd><td>${c.grounding.rods} × ${fmt(c.grounding.L,2)} m; espaçamento ${fmt(c.grounding.spacing,2)} m<\u002Ftd><\u002Ftr>`,`<tr><td>Resistência equivalente estimada<\u002Ftd><td>${fmt(c.grounding.resistance,3)} Ω (meta ${fmt(c.grounding.target,2)} Ω)<\u002Ftd><\u002Ftr>`,`<tr><td>Seção térmica mínima<\u002Ftd><td>${fmt(c.grounding.requiredSection,2)} mm²; adotada ${fmt0(n(p.grounding.conductorSection))} mm²<\u002Ftd><\u002Ftr>`,`<tr><td>Elevação de potencial do solo<\u002Ftd><td>${fmt0(c.grounding.gpr)} V – indicador preliminar<\u002Ftd><\u002Ftr>`])}<div class=\"danger\"><strong>Passo e toque.<\u002Fstrong> A verificação admissível exige modelo de solo, geometria completa, camada superficial, divisão da corrente de falta e estudo específico de malha.<\u002Fdiv><\u002Fsection>\n<section class=\"section page-break\"><h2>9. Diagrama unifilar simplificado<\u002Fh2><div class=\"unifilar\">${unifilarSvg(p,c)}<\u002Fdiv><p class=\"footer-note\">Representação esquemática sem valor executivo.<\u002Fp><\u002Fsection>\n<section class=\"section\"><h2>10. Orçamento preliminar<\u002Fh2>${reportTable(['Grupo','Descrição','Un.','Qtd.','Preço unitário','Total','Fonte'],budgetRows)}${reportTable(['Resumo','Valor'],[\n`<tr><td>Custo direto<\u002Ftd><td class=\"num\">${money(b.direct)}<\u002Ftd><\u002Ftr>`,`<tr><td>BDI (${pct(n(b.cfg.bdi))})<\u002Ftd><td class=\"num\">${money(b.bdi)}<\u002Ftd><\u002Ftr>`,`<tr><td>Contingência (${pct(n(b.cfg.contingency))})<\u002Ftd><td class=\"num\">${money(b.contingency)}<\u002Ftd><\u002Ftr>`,`<tr><td>Tributos adicionais (${pct(n(b.cfg.taxes))})<\u002Ftd><td class=\"num\">${money(b.taxes)}<\u002Ftd><\u002Ftr>`,`<tr><td><strong>Total preliminar<\u002Fstrong><\u002Ftd><td class=\"num\"><strong>${money(b.total)}<\u002Fstrong><\u002Ftd><\u002Ftr>`])}<div class=\"notice\"><strong>Pesquisa de preços.<\u002Fstrong> Os valores cadastrados e paramétricos precisam ser atualizados, especificados e documentados para o local e a data-base do empreendimento.<\u002Fdiv><\u002Fsection>\n<section class=\"section\"><h2>11. Comparação de cenários<\u002Fh2>${reportTable(['Alternativa','Configuração','Carregamento','Investimento','Custo em 10 anos','Redundância'],scen.map(x=>`<tr><td>${esc(x.name)}<\u002Ftd><td>${x.count} × ${fmt0(x.unit)} kVA · ${x.type}<\u002Ftd><td>${pct(x.loading)}<\u002Ftd><td class=\"num\">${money(x.investment)}<\u002Ftd><td class=\"num\">${money(x.tenYear)}<\u002Ftd><td>${x.redundancy}<\u002Ftd><\u002Ftr>`))}<\u002Fsection>\n<section class=\"section\"><h2>12. Alertas e pendências<\u002Fh2>${reportTable(['Nível','Alerta','Descrição','Módulo'],[alertRows])}<\u002Fsection>\n<section class=\"section\"><h2>13. Conclusão<\u002Fh2><p>${esc(p.report.conclusion||`Com os dados disponíveis, a demanda requerida foi estimada em ${fmt(c.requiredKva,1)} kVA. O cenário selecionado possui capacidade ativa de ${fmt0(c.selected.activeKva)} kVA e carregamento de ${pct(c.loading)}. Os resultados devem ser confirmados no desenvolvimento do projeto elétrico, com obtenção dos dados da distribuidora e execução dos estudos especializados indicados neste memorial.`)}<\u002Fp><div class=\"notice\"><strong>Limitações.<\u002Fstrong> ${esc(store.settings.disclaimer)}<\u002Fdiv><div class=\"signature\"><div>${esc(p.report.preparedBy||p.meta.responsible||'Elaborador')}<\u002Fdiv><div>${esc(p.report.reviewedBy||'Revisor')}<\u002Fdiv><\u002Fdiv><p class=\"footer-note\">Documento gerado em ${date} pelo SubestaçãoPro ${APP_VERSION}. Dados armazenados localmente no navegador.<\u002Fp><\u002Fsection>\n<\u002Fbody><\u002Fhtml>`}\nfunction openPrintReport(){const p=currentProject(),c=calculateProject(p),html=buildReportHtml(p,c);const w=window.open('','_blank');if(!w){toast('O navegador bloqueou a janela do relatório. Libere pop-ups e tente novamente.','error');return}w.document.open();w.document.write(html);w.document.close();setTimeout(()=>{w.focus();w.print()},500)}\nfunction renderReport(){const p=currentProject(),c=lastCalc=calculateProject(p),comp=completeness(p,c);document.getElementById('view-report').innerHTML=pageHeader('Memorial de cálculo','Revise a completude, registre a conclusão e gere o documento detalhado.',`<button class=\"btn\" data-action=\"export-json\">⇩ Backup JSON<\u002Fbutton><button class=\"btn\" data-action=\"export-report-html\">⇩ Exportar HTML<\u002Fbutton><button class=\"btn btn-primary\" data-action=\"print-report\">▣ Imprimir / PDF<\u002Fbutton>`)+`\n<div class=\"grid grid-3\">\n <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Completude do estudo<\u002Fdiv><div class=\"card-subtitle\">${comp.done} de ${comp.total} grupos preenchidos<\u002Fdiv><\u002Fdiv><span class=\"badge ${comp.score>=80?'success':comp.score>=50?'warning':'danger'}\">${pct(comp.score,0)}<\u002Fspan><\u002Fdiv><div class=\"card-body\"><div class=\"meter\"><div class=\"meter-bar ${comp.score>=80?'good':comp.score>=50?'warn':'bad'}\" style=\"width:${comp.score}%\"><\u002Fdiv><\u002Fdiv><div class=\"alert-list mt-2\">${comp.items.map(([label,ok])=>`<div class=\"scenario-stat\"><span>${esc(label)}<\u002Fspan><span class=\"badge ${ok?'success':'warning'}\">${ok?'Preenchido':'Pendente'}<\u002Fspan><\u002Fdiv>`).join('')}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n <div class=\"card span-2\"><div class=\"card-header\"><div><div class=\"card-title\">Responsáveis e conclusão<\u002Fdiv><div class=\"card-subtitle\">Campos reproduzidos no relatório<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\"><div class=\"form-grid\">${field('Elaborado por','report.preparedBy',p.report.preparedBy,{span:6})}${field('Revisado por','report.reviewedBy',p.report.reviewedBy,{span:6})}${field('Conclusão técnica','report.conclusion',p.report.conclusion,{span:12,type:'textarea',placeholder:'Registre a síntese, condicionantes e recomendações do estudo.'})}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"grid grid-2 mt-2\">\n <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Conteúdo do memorial<\u002Fdiv><div class=\"card-subtitle\">Estrutura automática do documento<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\"><div class=\"alert-list\">${['Resumo executivo','Identificação e premissas','Levantamento de cargas','Demanda e transformação','Curto-circuito','Cabos, barramentos e proteção','Fator de potência','Aterramento','Diagrama unifilar','Orçamento','Comparação de cenários','Alertas e conclusão'].map((x,i)=>`<div class=\"warning-item\"><div class=\"warning-icon\">${i+1}<\u002Fdiv><div class=\"warning-text\"><strong>${x}<\u002Fstrong>Incluído automaticamente com fórmulas, dados substituídos e interpretação.<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Alertas no documento<\u002Fdiv><div class=\"card-subtitle\">${c.alerts.length} ocorrência(s)<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\"><div class=\"alert-list\">${c.alerts.length?c.alerts.slice(0,8).map(alertHtml).join(''):'<div class=\"alert success\"><div class=\"alert-title\">Sem alertas automáticos<\u002Fdiv>Revise ainda assim as premissas e os estudos especializados.<\u002Fdiv>'}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"alert warning mt-2\"><div class=\"alert-title\">Exportação para PDF<\u002Fdiv>Use o botão “Imprimir / PDF” e selecione “Salvar como PDF” na caixa de impressão do navegador. O relatório possui estilo próprio para papel A4.<\u002Fdiv>`}\nfunction sfield(label,key,value,opts={}){const span=opts.span||4;const type=opts.type||'number';const addon=opts.addon?`<span class=\"input-addon\">${opts.addon}<\u002Fspan>`:'';return `<div class=\"field span-${span}\"><label>${label}<\u002Flabel><div class=\"${addon?'input-group':''}\"><input class=\"control\" type=\"${type}\" data-setting=\"${key}\" value=\"${esc(value)}\" ${opts.step!==undefined?`step=\"${opts.step}\"`:''}>${addon}<\u002Fdiv>${opts.help?`<small>${opts.help}<\u002Fsmall>`:''}<\u002Fdiv>`}\nfunction renderSettings(){const s=store.settings;document.getElementById('view-settings').innerHTML=pageHeader('Configurações','Personalize faixas comerciais, limites internos e parâmetros das estimativas.',`<button class=\"btn\" data-action=\"reset-settings\">↺ Restaurar parâmetros<\u002Fbutton><button class=\"btn btn-primary\" data-action=\"save\">✓ Salvar<\u002Fbutton>`)+`\n<div class=\"grid grid-2\">\n <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Critérios gerais<\u002Fdiv><div class=\"card-subtitle\">Limites usados nos semáforos e seleções<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\"><div class=\"form-grid\">${sfield('Carregamento preferencial','maxLoading',s.maxLoading,{span:4,step:.1,addon:'%'})}${sfield('Carregamento de alerta','warningLoading',s.warningLoading,{span:4,step:.1,addon:'%'})}${sfield('Queda de tensão padrão','maxVoltageDrop',s.maxVoltageDrop,{span:4,step:.1,addon:'%'})}${sfield('FP padrão','standardPF',s.standardPF,{span:4,step:.01})}${sfield('Meta de aterramento','groundTarget',s.groundTarget,{span:4,step:.1,addon:'Ω'})}${sfield('Tarifa de energia ilustrativa','energyTariff',s.energyTariff,{span:4,step:.01,addon:'R$/kWh'})}${sfield('Horas anuais equivalentes','annualHours',s.annualHours,{span:4,step:1,addon:'h'})}<\u002Fdiv><div class=\"field span-12 mt-2\"><label>Potências comerciais de transformadores (kVA)<\u002Flabel><textarea class=\"control\" data-setting-list=\"commercialKva\" style=\"min-height:90px\">${esc((s.commercialKva||[]).join(', '))}<\u002Ftextarea><small>Separe os valores por vírgulas. A lista será ordenada automaticamente.<\u002Fsmall><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Critérios térmicos<\u002Fdiv><div class=\"card-subtitle\">Parâmetros simplificados dos condutores<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\"><div class=\"form-grid\">${sfield('Densidade barramento cobre','busbarDensityCu',s.busbarDensityCu,{span:6,step:.1,addon:'A/mm²'})}${sfield('Densidade barramento alumínio','busbarDensityAl',s.busbarDensityAl,{span:6,step:.1,addon:'A/mm²'})}${sfield('Constante k – cobre XLPE','cableKCu',s.cableKCu,{span:6,step:1})}${sfield('Constante k – alumínio XLPE','cableKAl',s.cableKAl,{span:6,step:1})}${sfield('Constante k – aterramento','groundingK',s.groundingK,{span:6,step:1})}<\u002Fdiv><div class=\"alert warning mt-2\"><div class=\"alert-title\">Tabelas internas<\u002Fdiv>As ampacidades e constantes são referências genéricas para triagem. O projeto deve usar tabelas correspondentes ao cabo, instalação e norma efetivamente adotados.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"grid grid-2 mt-2\">\n <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Custos paramétricos<\u002Fdiv><div class=\"card-subtitle\">Utilizados somente na comparação de cenários<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\"><div class=\"form-grid\">${sfield('Transformador seco','dryCostPerKva',s.dryCostPerKva,{span:6,step:1,addon:'R$/kVA'})}${sfield('Transformador a óleo','oilCostPerKva',s.oilCostPerKva,{span:6,step:1,addon:'R$/kVA'})}${sfield('Cubículo MT','mtCellCost',s.mtCellCost,{span:6,step:1,addon:'R$/un'})}${sfield('Painel BT por corrente','lvPanelCostPerAmp',s.lvPanelCostPerAmp,{span:6,step:1,addon:'R$/A'})}${sfield('Fator de instalação','installationFactor',s.installationFactor,{span:6,step:.01,help:'Valor decimal: 0,18 corresponde a 18%.'})}${sfield('Manutenção anual – seco','maintenanceDry',s.maintenanceDry,{span:6,step:.1,addon:'%'})}${sfield('Manutenção anual – óleo','maintenanceOil',s.maintenanceOil,{span:6,step:.1,addon:'%'})}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Aviso técnico<\u002Fdiv><div class=\"card-subtitle\">Reproduzido nas telas e no relatório<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\"><textarea class=\"control\" data-setting=\"disclaimer\" style=\"min-height:190px\">${esc(s.disclaimer)}<\u002Ftextarea><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card mt-2\"><div class=\"card-header\"><div><div class=\"card-title\">Dados locais<\u002Fdiv><div class=\"card-subtitle\">Gerenciamento do armazenamento do navegador<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\"><div class=\"page-actions\"><button class=\"btn\" data-action=\"export-all\">⇩ Backup completo<\u002Fbutton><button class=\"btn\" data-action=\"load-fresh-demo\">Recriar projeto demonstrativo<\u002Fbutton><button class=\"btn btn-danger\" data-action=\"clear-all-data\">Excluir todos os dados locais<\u002Fbutton><\u002Fdiv><div class=\"alert warning mt-2\"><div class=\"alert-title\">Armazenamento local<\u002Fdiv>Os projetos permanecem apenas neste navegador. Faça backups JSON periódicos antes de limpar dados, trocar de computador ou redefinir o navegador.<\u002Fdiv><\u002Fdiv><\u002Fdiv>`}\n\nfunction updateTopbar(){const p=currentProject();document.getElementById('topProjectName').textContent=p.name||'Projeto sem nome';document.getElementById('topProjectMeta').textContent=`${p.meta.stage||'Estudo'} · ${p.meta.city||'Município não informado'}${p.meta.uf?'/'+p.meta.uf:''}`}\nfunction renderAll(){lastCalc=calculateProject(currentProject());renderDashboard();renderProjects();renderEnterprise();renderLoads();renderDemand();renderTransformers();renderShortCircuit();renderCables();renderProtection();renderPowerFactor();renderGrounding();renderLayout();renderDiagram();renderBudget();renderScenarios();renderReport();renderSettings();updateTopbar();showView(activeView,false)}\nfunction showView(view,scroll=true){activeView=view;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+view));document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.getElementById('sidebar').classList.remove('open');if(scroll)window.scrollTo({top:0,behavior:'smooth'})}\nfunction deepMerge(base,extra){if(Array.isArray(base))return Array.isArray(extra)?extra:base;if(base&&typeof base==='object'){const out={...base};if(extra&&typeof extra==='object')Object.keys(extra).forEach(k=>{out[k]=k in base?deepMerge(base[k],extra[k]):extra[k]});return out}return extra!==undefined?extra:base}\nfunction normalizeProject(raw){const b=baseProject(raw?.name||'Projeto importado');const p=deepMerge(b,raw||{});p.id=p.id||uid('prj');p.createdAt=p.createdAt||Date.now();p.updatedAt=p.updatedAt||Date.now();p.loads=(p.loads||[]).map(x=>deepMerge(loadItem('Outras ca nfraestrutura de recarga veicular<\u002Fh2><div class=\"kpis\"><div class=\"kpi\"><small>Pontos de recarga<\u002Fsmall><strong>${fmt0(e.qty)}<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Potência instalada<\u002Fsmall><strong>${fmt(e.installedKw,1)} kW<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Demanda gerenciada<\u002Fsmall><strong>${fmt(e.demandKw,1)} kW<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Energia diária<\u002Fsmall><strong>${fmt(e.dailyEnergy,0)} kWh<\u002Fstrong><\u002Fdiv><\u002Fdiv>${reportTable(['Cenário','Demanda ativa','Demanda aparente','Carregamento projetado','Avaliação'],evRows.length?evRows:['<tr><td colspan=\"5\">Módulo de recarga desativado.<\u002Ftd><\u002Ftr>'])}<div class=\"formula\">Pdem,VE = min(Quantidade × Punit × ocupação × simultaneidade; limite de demanda)<br>Pdem,VE = ${fmt(e.demandKw,3)} kW.<\u002Fdiv><div class=\"notice\"><strong>Gerenciamento dinâmico.<\u002Fstrong> Valide comunicação, proteção individual, medição, balanceamento de fases, disponibilidade de potência, expansão e critérios de segurança da instalação.<\u002Fdiv><\u002Fsection>\n  <section class=\"section page-break\"><h2>21. Distribuição principal: cabos e barramento blindado<\u002Fh2><p>Solução preferida no projeto: <strong>${esc(p.cableAdvanced.preferredSolution)}<\u002Fstrong>. O módulo compara ampacidade corrigida, queda de tensão, suportabilidade térmica, perdas, investimento e custo presente do ciclo de vida.<\u002Fp><h3>Alternativas de cabos que atendem aos critérios<\u002Fh3>${reportTable(['Configuração','Ampacidade','Queda','Perdas','Investimento','Ciclo de vida'],cableRows.length?cableRows:['<tr><td colspan=\"6\">Nenhuma alternativa válida na faixa analisada.<\u002Ftd><\u002Ftr>'])}<h3>Barramento blindado<\u002Fh3>${reportTable(['Parâmetro','Resultado','Avaliação'],[\n    `<tr><td>Modelo / classe<\u002Ftd><td>${esc(bw.selected?.model||'Sem seleção')} · ${bw.runs} × ${fmt0(bw.rating)} A<\u002Ftd><td>${bw.totalCapacity>=bw.totalCurrent?'At
