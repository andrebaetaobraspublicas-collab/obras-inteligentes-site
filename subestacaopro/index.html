,.json\" class=\"hidden\"><input type=\"file\" id=\"v20UniversalImport\" accept=\"application/json,.json\" class=\"hidden\">`;\n}\nasync function v20FetchJson(url){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const res=await fetch(url,{cache:'no-store',signal:controller.signal});if(!res.ok)throw new Error(`HTTP ${res.status}`);return await res.json()}catch(err){if(err?.name==='AbortError')throw new Error('Tempo limite de 12 s excedido');throw err}finally{clearTimeout(timer)}}\nfunction v20LogUpdate(kind,status,message){store.v20Config.logs=store.v20Config.logs||[];store.v20Config.logs.unshift({id:uid('upd'),date:Date.now(),kind,status,message});store.v20Config.logs=store.v20Config.logs.slice(0,80)}\nasync function v20SyncMunicipalities(uf=currentProject().v20.portal.uf){\n  if(!uf)throw new Error('Selecione uma UF.');const tpl=store.v20Config.ibgeMunicipalitiesEndpoint||'',url=tpl.replace('{UF}',encodeURIComponent(uf)),data=await v20FetchJson(url),rows=(Array.isArray(data)?data:[]).map(x=>({id:x.id,nome:x.nome}));store.v20Config.municipalitiesCache[uf]=rows;currentProject().v20.portal.lastMunicipalitySync=Date.now();v20LogUpdate('Municípios','success',`${rows.length} municípios de ${uf} sincronizados via IBGE.`);saveStore();renderAll();return rows.length;\n}\nfunction v20ApplyUpdatePackage(pkg,source='Pacote importado'){\n  if(!pkg||typeof pkg!=='object')throw new Error('Pacote inválido.');let catalog=0,prices=0,utilities=0;\n  if(Array.isArray(pkg.catalog)){const byId=new Map((store.catalog||[]).map(x=>[x.id,x]));pkg.catalog.forEach(x=>{if(!x?.manufacturer||!x?.model)return;const id=x.id||`feed_${slug(x.manufacturer+'-'+x.model)}`,old=byId.get(id)||{};byId.set(id,{...old,...x,id,sourceKind:x.sourceKind||old.sourceKind||'parametric',updatedAt:Date.now()});catalog++});store.catalog=[...byId.values()]}\n  if(Array.isArray(pkg.prices)){pkg.prices.forEach(pr=>{const item=(store.catalog||[]).find(x=>x.id===pr.id||(`${x.manufac s).`,fail?'warning':'success');return{ok,fail};\n}\nfunction renderUpdates(){\n  const cfg=store.v20Config,logs=cfg.logs||[],online=navigator.onLine,catalogFeeds=[cfg.catalogEndpoint,cfg.priceEndpoint,cfg.utilitiesEndpoint].filter(Boolean).length;\n  document.getElementById('view-updates').innerHTML=pageHeader('Central de atualizações','Atualizações online opcionais para catálogo, preços, municípios, equipamentos e perfis. O sistema continua plenamente utilizável com os dados locais quando estiver offline.',`<button class=\"btn\" data-action=\"v20-export-update-template\">⇩ Modelo de feed<\u002Fbutton><button class=\"btn\" data-action=\"v20-import-update-package\">Importar pacote<\u002Fbutton><button class=\"btn btn-primary\" data-action=\"v20-run-updates\">⟳ Atualizar agora<\u002Fbutton>`)+`\n  <div class=\"grid grid-4\">${kpi('Conectividade',online?'Online':'Offline',online?'Fontes podem ser consultadas':'Usando somente dados locais',online?'good':'warn')}${kpi('Última atualização',cfg.lastUpdate?dateTimeBR(cfg.lastUpdate):'Nunca','Registro local')}${kpi('Feeds configurados',fmt0(catalogFeeds),'Catálogo, preços e distribuidoras')}${kpi('Catálogo local',fmt0((store.catalog||[]).length),'Referências disponíveis')}<\u002Fdiv>\n  <div class=\"grid grid-2 mt-2\"><div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Automação<\u002Fdiv><div class=\"card-subtitle\">Intervalo e fontes oficiais de apoio<\u002Fdiv><\u002Fdiv><span class=\"v20-online ${online?'':'offline'}\">${online?'Conectado':'Sem conexão'}<\u002Fspan><\u002Fdiv><div class=\"card-body\"><div class=\"check-row\"><label class=\"check-card\"><input type=\"checkbox\" data-v20-store-bind=\"autoUpdate\" ${cfg.autoUpdate?'checked':''}><span><strong>Verificar atualizações automaticamente<\u002Fstrong><br><span class=\"text-muted\">Executa somente quando houver conexão e intervalo vencido.<\u002Fspan><\u002Fspan><\u002Flabel><\u002Fdiv><div class=\"form-grid mt-2\"><div class=\"field span-4 ard-header\"><div><div class=\"card-title\">Trajetória da demanda<\u002Fdiv><div class=\"card-subtitle\">Após crescimento, cargas adicionadas e crédito FV<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\">${v20LineSvg([{year:n(p.v20.expansion.baseYear),demand:c.requiredKva},...rows.map(x=>({year:x.year,demand:x.demand}))],'year','demand','kVA')}<\u002Fdiv><\u002Fdiv><div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Critérios<\u002Fdiv><div class=\"card-subtitle\">Premissas globais<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\"><div class=\"form-grid\">${field('Ano-base','v20.expansion.baseYear',p.v20.expansion.baseYear,{span:6,type:'number'})}${field('Crédito FV na demanda','v20.expansion.pvDemandCreditPct',p.v20.expansion.pvDemandCreditPct,{span:6,type:'number',addon:'%'})}<\u002Fdiv><div class=\"alert warning mt-2\"><div class=\"alert-title\">Crédito fotovoltaico<\u002Fdiv>O valor reduz apenas a demanda projetada na proporção configurada. A coincidência entre geração e ponta deve ser estudada com curvas horárias e regras da distribuidora.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"card mt-2\"><div class=\"card-header\"><div><div class=\"card-title\">Fases de expansão<\u002Fdiv><div class=\"card-subtitle\">Resultados recalculados em sequência cronológica<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\" style=\"padding:0\"><div class=\"table-wrap\" style=\"border:0\"><table class=\"data-table\" style=\"min-width:1500px\"><thead><tr><th>Ano<\u002Fth><th>Descrição<\u002Fth><th>Cresc.<\u002Fth><th>Carga adicional<\u002Fth><th>Recarga VE<\u002Fth><th>FV<\u002Fth><th>Demanda resultante<\u002Fth><th>Carregamento<\u002Fth><th>Trafo sugerido<\u002Fth><th>Corrente<\u002Fth><th>Gerador<\u002Fth><th>CAPEX<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody>${rows.map(x=>`<tr><td><input type=\"number\" data-v20-expansion-bind=\"year\" data-id=\"${x.id}\" value=\"${n(x.year)}\"><\u002Ftd><td><input data-v20-expansion-bind=\"description\" data-id=\"${x.id}\" value=\"${esc(x.description)}\"><\u002Ftd><td><input type=\"number\" step=\".1\" data-v20-expansion-bind=\"growthPct\" data-id=\"${x.id}\" value=\"${n(x.growthPct)}\"><\u002Ftd><td><input type=\"number\" data-v20-expansion-bind=\"addedKva\" data-id=\"${x.id}\" value=\"${n(x.addedKva)}\"><\u002Ftd><td><input type=\"number\" data-v20-expansion-bind=\"evKw\" data-id=\"${x.id}\" value=\"${n(x.evKw)}\"><\u002Ftd><td><input type=\"number\" data-v20-expansion-bind=\"pvKw\" data-id=\"${x.id}\" value=\"${n(x.pvKw)}\"><\u002Ftd><td class=\"num\"><strong>${fmt(x.demand,1)} kVA<\u002Fstrong><\u002Ftd><td><span class=\"badge ${x.loading<=85?'success':x.loading<=100?'warning':'danger'}\">${pct(x.loading)}<\u002Fspan><\u002Ftd><td class=\"num\">${fmt0(x.recommended)} kVA<\u002Ftd><td class=\"num\">${fmt0(x.current)} A<\u002Ftd><td class=\"num\">${fmt0(x.generator)} kVA<\u002Ftd><td><input type=\"number\" data-v20-expansion-bind=\"capex\" data-id=\"${x.id}\" value=\"${n(x.capex)}\"><\u002Ftd><td><button class=\"row-btn danger\" data-v20-expansion-delete=\"${x.id}\">✕<\u002Fbutton><\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"grid grid-3 mt-2\">${rows.map(x=>`<div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">${esc(x.year)} · ${esc(x.description)}<\u002Fdiv><div class=\"card-subtitle\">${fmt(x.demand,1)} kVA<\u002Fdiv><\u002Fdiv><span class=\"badge ${x.loading<=85?'success':x.loading<=100?'warning':'danger'}\">${pct(x.loading)}<\u002Fspan><\u002Fdiv><div class=\"card-body\"><div class=\"v20-risk-bar\"><span style=\"width:${clamp(x.loading,0,100)}%\"><\u002Fspan><\u002Fdiv><p class=\"help mt-1\">Transformação sugerida ${fmt0(x.recommended)} kVA · corrente ${fmt0(x.current)} A · geração de emergência ${fmt0(x.generator)} kVA.<\u002Fp><\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv>`;\n}\nfunction renderFailures(){\n  const p=currentProject(),c=calculateProject(p),res=v20FailureCalc(p,c),matrix=v20FailureMatrix(p,c),events=['Perda da rede da distribuidora','Falha do transformador T1','Falha do transformador T2','Falha do barramento QGBT','Falha do grupo gerador','Falha do UPS'];\n  const cell=(served,total)=>`<div class=\"${served>=total-.01?'v20-cell-ok':served>0?'v20-cell-warn':'v20-cell-bad'}\">${fmt(served,1)} / ${fmt(total,1)} kVA<\u002Fdiv>`;\n  document.getElementById('view-failures').innerHTML=pageHeader('Simulação de falhas','Analise perda de fontes e equipamentos, cargas mantidas, sobrecarga, apoio do gerador, autonomia do UPS e necessidade de desligamentos.',`<button class=\"btn\" data-go=\"network\">Ver topologia<\u002Fbutton><button class=\"btn\" data-action=\"v20-export-failures-csv\">⇩ Matriz CSV<\u002Fbutton><button class=\"btn btn-primary\" data-go=\"executive\">Dashboard executivo<\u002Fbutton>`)+`\n  <div class=\"grid grid-5\">${kpi('Cenário',esc(res.event),res.status)}${kpi('Fonte disponível',fmt(res.sourceCapacity,1)+' kVA',res.grid?'Rede / transformação':'Geração de emergência')}${kpi('Carga atendida',fmt(res.served+res.criticalByUps,1)+' kVA',`de ${fmt(res.normal+res.essential+res.emergency,1)} kVA`)}${kpi('Carga interrompida',fmt(res.curtailed,1)+' kVA',res.curtailed?'Desligamento necessário':'Sem corte',res.curtailed?'bad':'good')}${kpi('Autonomia UPS',fmt0(res.upsAutonomy)+' min',`${fmt(res.criticalByUps,1)} kVA protegidos`)}<\u002Fdiv>\n  <div class=\"grid grid-2 mt-2\"><div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Evento e política de atendimento<\u002Fdiv><div class=\"card-subtitle\">Priorização: emergência → essencial → normal<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\"><div class=\"form-grid\">${field('Falha simulada','v20.failure.selectedEvent',p.v20.failure.selectedEvent,{span:8,options:events})}${field('Duração','v20.failure.durationHours',p.v20.failure.durationHours,{span:4,type:'number',step:.5,addon:'h'})}${field('Cargas normais mantidas no gerador','v20.failure.normalPriorityPct',p.v20.failure.normalPriorityPct,{span:6,type:'number',addon:'%'})}<\u002Fdiv><div class=\"alert ${res.curtailed?'warning':'success'} mt-2\"><div class=\"alert-title\">${esc(res.status)}<\u002Fdiv>${res.notes.map(esc).join(' ')} ${res.curtailed?`Recomenda-se desligar ou transferir ${fmt(res.curtailed,1)} kVA.`:'A capacidade disponível atende às classes priorizadas no modelo.'}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Balanço do cenário<\u002Fdiv><div class=\"card-subtitle\">Atendimento por classe<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\">${v20MiniBars([res.normal,res.essential,res.emergency,res.servedNormal,res.servedEssential,res.servedEmergency],['Normal req.','Essencial req.','Emergência req.','Normal atend.','Essencial atend.','Emergência atend.'],'kVA')}<div class=\"result-grid mt-2\"><div class=\"result-item\"><div class=\"result-label\">Transformação remanescente<\u002Fdiv><div class=\"result-value\">${fmt0(res.transformCapacity)} kVA<\u002Fdiv><\u002Fdiv><div class=\"result-item\"><div class=\"result-label\">Gerador disponível<\u002Fdiv><div class=\"result-value\">${fmt0(res.generatorAvailable)} kVA<\u002Fdiv><\u002Fdiv><div class=\"result-item\"><div class=\"result-label\">UPS disponível<\u002Fdiv><div class=\"result-value\">${fmt0(res.upsAvailable)} kVA<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"card mt-2\"><div class=\"card-header\"><div><div class=\"card-title\">Matriz de resiliência<\u002Fdiv><div class=\"card-subtitle\">Comparação dos principais eventos<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\"><div class=\"v20-scenario-matrix\"><div class=\"v20-scenario-head\">Evento<\u002Fdiv><div class=\"v20-scenario-head\">Cargas normais<\u002Fdiv><div class=\"v20-scenario-head\">Essenciais<\u002Fdiv><div class=\"v20-scenario-head\">Emergência<\u002Fdiv>${matrix.map(x=>`<div><strong>${esc(x.event)}<\u002Fstrong><br><small>${esc(x.status)}<\u002Fsmall><\u002Fdiv>${cell(n(x.servedNormal),n(c.classes.Normal))}${cell(n(x.servedEssential)+Math.min(n(x.criticalByUps),Math.max(0,n(c.classes.Essencial)-n(x.servedEssential))),n(c.classes.Essencial))}${cell(n(x.servedEmergency),n(c.classes['Emergência']))}`).join('')}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"alert warning mt-2\"><div class=\"alert-title\">Simulação funcional<\u002Fdiv>O resultado presume prioridades agregadas por classe e capacidades nominais. A análise executiva deve conferir seccionamentos, barramentos independentes, QTA, intertravamentos, tempo de transferência, partidas, degraus de carga, autonomia real e lógica de rejeição de cargas.<\u002Fdiv>`;\n}\nfunction v20GanttHtml(tasks){\n  const maxWeek=Math.max(12,...tasks.map(x=>n(x.startWeek)+n(x.duration)-1)),months=12,scale=maxWeek/months,headers=Array.from({length:months},(_,i)=>`M${i+1}`),cells=[];tasks.forEach(t=>{cells.push(`<div class=\"v20-gantt-task\">${esc(t.name)}<br><small>${esc(t.owner)}<\u002Fsmall><\u002Fdiv>`);for(let m=0;m<months;m++){const mStart=m*scale+1,mEnd=(m+1)*scale+1,overlap=Math.max(0,Math.min(n(t.startWeek)+n(t.duration),mEnd)-Math.max(n(t.startWeek),mStart));cells.push(`<div class=\"v20-gantt-cell\">${overlap>0?`<span class=\"v20-gantt-bar\" title=\"Semanas ${t.startWeek}–${n(t.startWeek)+n(t.duration)-1}\">${overlap/scale>.45?esc(t.status):''}<\u002Fspan>`:''}<\u002Fdiv>`)}});return`<div class=\"v20-gantt\"><div class=\"v20-gantt-grid\"><div class=\"v20-gantt-head\">Atividade<\u002Fdiv>${headers.map(x=>`<div class=\"v20-gantt-head\">${x}<\u002Fdiv>`).join('')}${cells.join('')}<\u002Fdiv><\u002Fdiv>`\n}\nfunction renderDocuments(){\n  const p=currentProject(),tasks=p.v20.documents.schedule||[],docs=[['descriptive','▤','Memorial descritivo','Escopo, solução, critérios, operação e limitações.'],['calculation','∑','Memorial de cálculo','Cargas, demanda, transformação, curto, cabos, proteção e aterramento.'],['specifications','⚙','Especificações técnicas','Requisitos mínimos dos equipamentos e serviços.'],['quantities','▣','Quantitativos e materiais','Relação consolidada para contratação e suprimentos.'],['budget','R$','Orçamento','Itens, fontes, BDI, contingência, tributos e curva ABC.'],['schedule','▥','Cronograma','Etapas de projeto, aprovação, aquisição, obra, montagem e energização.'],['art','ART','Minuta de ART','Pré-preenchimento auxiliar, sem emissão oficial.'],['technicalbook','▦','Caderno técnico completo','Documento consolidado com todos os capítulos e anexos.']];\n  document.getElementById('view-documents').innerHTML=pageHeader('Documentação profissional','Gere documentos separados ou um caderno técnico consolidado, com identidade do projeto, rastreabilidade e ressalvas de responsabilidade.',`<button class=\"btn\" data-action=\"v20-export-doc-data\">⇩ Dados documentais<\u002Fbutton><button class=\"btn btn-primary\" data-v20-document=\"technicalbook\" data-mode=\"print\">▣ Imprimir caderno<\u002Fbutton>`)+`\n  <div class=\"v20-doc-list\">${docs.map(([id,icon,title,desc])=>`<div class=\"v20-doc-card\"><div class=\"v20-doc-icon\">${icon}<\u002Fdiv><h3>${title}<\u002Fh3><p>${desc}<\u002Fp><div class=\"page-actions\"><button class=\"btn btn-sm\" data-v20-document=\"${id}\" data-mode=\"html\">HTML<\u002Fbutton><button class=\"btn btn-sm btn-primary\" data-v20-document=\"${id}\" data-mode=\"print\">Imprimir/PDF<\u002Fbutton><\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv>\n  <div class=\"grid grid-2 mt-2\"><div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Minuta auxiliar de ART<\u002Fdiv><div class=\"card-subtitle\">Não substitui o sistema oficial do CREA<\u002Fdiv><\u002Fdiv><span class=\"badge warning\">Rascunho<\u002Fspan><\u002Fdiv><div class=\"card-body\"><div class=\"form-grid\">${field('Profissional','v20.documents.art.professional',p.v20.documents.art.professional,{span:6})}${field('Registro / CREA','v20.documents.art.registration',p.v20.documents.art.registration,{span:3})}${field('CREA da UF','v20.documents.art.crea',p.v20.documents.art.crea,{span:3})}${field('Contratante','v20.documents.art.contractor',p.v20.documents.art.contractor,{span:6})}${field('Endereço da obra','v20.documents.art.workAddress',p.v20.documents.art.workAddress,{span:6})}${field('Atividade técnica','v20.documents.art.activity',p.v20.documents.art.activity,{span:12})}${field('Observações','v20.documents.art.notes',p.v20.documents.art.notes,{span:12,type:'textarea'})}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><div class=\"card-header\"><div><div class=\"card-title\">Diretrizes de especificação<\u002Fdiv><div class=\"card-subtitle\">Texto incorporado aos documentos<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card-body\"><div class=\"form-grid\">${field('Data de emissão','v20.documents.issueDate',p.v20.documents.issueDate,{span:4,type:'date'})}${field('Notas gerais','v20.documents.specificationNotes',p.v20.documents.specificationNotes,{span:12,type:'textarea'})}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"card mt-2\"><div class=\"card-header\"><div><div class=\"card-title\">Cronograma preliminar<\u002Fdiv><div class=\"card-subtitle\">Semanas convertidas em 12 períodos visuais<\u002Fdiv><\u002Fdiv><button class=\"btn btn-sm\" data-action=\"v20-add-schedule-task\">＋ Atividade<\u002Fbutton><\u002Fdiv><div class=\"card-body\">${v20GanttHtml(tasks)}<\u002Fdiv><div class=\"card-body\" style=\"padding:0;border-top:1px solid var(--border)\"><div class=\"table-wrap\" style=\"border:0\"><table class=\"data-table\"><thead><tr><th>Atividade<\u002Fth><th>Início<\u002Fth><th>Duração<\u002Fth><th>Responsável<\u002Fth><th>Status<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody>${tasks.map(t=>`<tr><td><input data-v20-schedule-bind=\"name\" data-id=\"${t.id}\" value=\"${esc(t.name)}\"><\u002Ftd><td><input type=\"number\" data-v20-schedule-bind=\"startWeek\" data-id=\"${t.id}\" value=\"${n(t.startWeek)}\"><\u002Ftd><td><input type=\"number\" data-v20-schedule-bind=\"duration\" data-id=\"${t.id}\" value=\"${n(t.duration)}\"><\u002Ftd><td><input data-v20-schedule-bind=\"owner\" data-id=\"${t.id}\" value=\"${esc(t.owner)}\"><\u002Ftd><td><select data-v20-schedule-bind=\"status\" data-id=\"${t.id}\">${optionList(['Planejado','Em andamento','Concluído','Atrasado'],t.status)}<\u002Fselect><\u002Ftd><td><button class=\"row-btn danger\" data-v20-schedule-delete=\"${t.id}\">✕<\u002Fbutton><\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"alert warning mt-2\"><div class=\"alert-title\">ART e responsabilidade técnica<\u002Fdiv>O sistema apenas organiza uma minuta com dados do projeto. O enquadramento da atividade, atribuições, valores, vínculos contratuais, assinatura e emissão devem ser realizados pelo profissional no ambiente oficial do conselho competente.<\u002Fdiv>`;\n}\n\n\n/* ========================= SUBESTAÇÃOPRO 2.0 — DOCUMENTOS, EXPORTAÇÕES E AÇÕES ========================= */\nfunction v20DocStyle(){return`<style>@page{size:A4;margin:16mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#172033;line-height:1.45;font-size:10.5pt;margin:0}header{border-bottom:3px solid #0b5cad;padding-bottom:12px;margin-bottom:20px}h1{font-size:23pt;margin:0;color:#0b5cad}h2{font-size:15pt;color:#0b5cad;border-bottom:1px solid #dce4ef;padding-bottom:5px;margin-top:24px}h3{font-size:12pt;color:#172033;margin-top:18px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;margin-top:12px}.meta div{border-bottom:1px solid #e5e7eb;padding:4px}.muted{color:#64748b}.notice{border-left:4px solid #b76b00;background:#fff5dd;padding:10px 12px;margin:14px 0}.success{border-left-color:#14804a;background:#e9f8f0}.page-break{page-break-before:always}table{width:100%;border-collapse:collapse;margin:10px 0 16px}th{background:#0b5cad;color:#fff;text-align:left;padding:7px;font-size:9pt}td{border:1px solid #dce4ef;padding:6px;vertical-align:top;font-size:9pt}.num{text-align:right}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.kpi{border:1px solid #dce4ef;border-radius:8px;padding:9px}.kpi small{display:block;color:#64748b}.kpi strong{display:block;font-size:14pt;margin-top:3px}.formula{font-family:Consolas,monospace;background:#f3f6fb;border:1px solid #dce4ef;border-radius:7px;padding:10px;white-space:pre-wrap}.signature{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:60px}.signature div{border-top:1px solid #172033;text-align:center;padding-top:5px}.footer{margin-top:24px;border-top:1px solid #dce4ef;padding-top:8px;color:#64748b;font-size:8.5pt}@media print{.no-print{display:none!important}a{color:inherit;text-decoration:none}}<\u002Fstyle>`}\nfunction v20DocHeader(title,p){return`<header><h1>${esc(title)}<\u002Fh1><div class=\"muted\">SubestaçãoPro 2.0 · documento técnico gerado em ${new Date().toLocaleString('pt-BR')}<\u002Fdiv><div class=\"meta\"><div><strong>Projeto:<\u002Fstrong> ${esc(p.name)}<\u002Fdiv><div><strong>Código:<\u002Fstrong> ${esc(p.meta.code||'—')}<\u002Fdiv><div><strong>Empreendimento:<\u002Fstrong> ${esc(p.meta.enterprise||'—')}<\u002Fdiv><div><strong>Contratante:<\u002Fstrong> ${esc(p.meta.client||'—')}<\u002Fdiv><div><strong>Local:<\u002Fstrong> ${esc([p.meta.city,p.meta.uf].filter(Boolean).join('/')||'—')}<\u002Fdiv><div><strong>Revisão:<\u002Fstrong> ${esc(p.meta.revision||'00')}<\u002Fdiv><div><strong>Responsável:<\u002Fstrong> ${esc(p.meta.responsible||p.report.preparedBy||'—')}<\u002Fdiv><div><strong>Data-base:<\u002Fstrong> ${esc(p.v20.documents.issueDate||p.meta.date||todayBR())}<\u002Fdiv><\u002Fdiv><\u002Fheader>`}\nfunction v20DocShell(title,body,p){return`<!doctype html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>${esc(title)} — ${esc(p.name)}<\u002Ftitle>${v20DocStyle()}<template id=\"__bundler_thumbnail\" data-bg-color=\"#04080f\">\n  <svg viewBox=\"0 0 1200 800\" xmlns=\"http://www.w3.org/2000/svg\">\n    <rect width=\"1200\" height=\"800\" fill=\"#04080f\"/>\n    <rect x=\"420\" y=\"420\" width=\"360\" height=\"150\" rx=\"10\" fill=\"#2f4257\"/>\n    <rect x=\"470\" y=\"360\" width=\"40\" height=\"70\" fill=\"#a9bccf\"/>\n    <rect x=\"580\" y=\"360\" width=\"40\" height=\"70\" fill=\"#a9bccf\"/>\n    <rect x=\"690\" y=\"360\" width=\"40\" height=\"70\" fill=\"#a9bccf\"/>\n    <path d=\"M180 250 L600 400 L1020 250\" stroke=\"#8fe3ff\" stroke-width=\"12\" fill=\"none\"/>\n    <path d=\"M180 300 L600 450 L1020 300\" stroke=\"#ffd27a\" stroke-width=\"12\" fill=\"none\"/>\n    <rect x=\"160\" y=\"240\" width=\"24\" height=\"330\" fill=\"#33445c\"/>\n    <rect x=\"1016\" y=\"240\" width=\"24\" height=\"330\" fill=\"#33445c\"/>\n    <path d=\"M600 120 l-52 130 h44 l-34 110 96 -150 h-46 l40 -90 z\" fill=\"#22dbc8\"/>\n  <\u002Fsvg>\n<\u002Ftemplate>\n<\u002Fhead><body>${v20DocHeader(title,p)}${body}<div class=\"footer\">${esc(store.settings.disclaimer)}<\u002Fdiv><\u002Fbody><\u002Fhtml>`}\nfunction v20Table(headers,rows){return`<table><thead><tr>${headers.map(x=>`<th>${esc(x)}<\u002Fth>`).join('')}<\u002Ftr><\u002Fthead><tbody>${rows.join('')}<\u002Ftbody><\u002Ftable>`}\nfunction v20DescriptiveBody(p,c){const profile=(store.utilityProfiles||[]).find(x=>x.id===p.v20.portal.utilityId)||v12SelectedUtility(p),g=v12GeneratorCalc(p,c),u=v12UpsCalc(p,c);return`<h2>1. Objeto e finalidade<\u002Fh2><p>Este documento descreve a solução preliminar de fornecimento, transformação, distribuição e continuidade de energia para <strong>${esc(p.meta.enterprise||p.name)}<\u002Fstrong>. O estudo organiza premissas, alternativas e interfaces necessárias à futura elaboração do projeto executivo.<\u002Fp><h2>2. Caracterização do empreendimento<\u002Fh2>${v20Table(['Parâmetro','Informação'],[`<tr><td>Tipologia<\u002Ftd><td>${esc(p.meta.buildingType)}<\u002Ftd><\u002Ftr>`,`<tr><td>Área / pavimentos<\u002Ftd><td>${fmt0(n(p.meta.area))} m² / ${fmt0(n(p.meta.floors))}<\u002Ftd><\u002Ftr>`,`<tr><td>Usuários estimados<\u002Ftd><td>${fmt0(n(p.meta.users))}<\u002Ftd><\u002Ftr>`,`<tr><td>Distribuidora de referência<\u002Ftd><td>${esc(profile?.utility||p.meta.utility||'A confirmar')}<\u002Ftd><\u002Ftr>`,`<tr><td>Fornecimento<\u002Ftd><td>${fmt(n(p.electrical.primaryVoltage)/1000,1)} kV → ${fmt0(n(p.electrical.secondaryVoltage))} V<\u002Ftd><\u002Ftr>`])}<h2>3. Solução elétrica proposta<\u002Fh2><p>A demanda de projeto é de ${fmt(c.requiredKva,1)} kVA. Foi selecionada a configuração <strong>${esc(c.selected.label)}<\u002Fstrong>, com ${fmt0(c.selected.activeKva)} kVA de capacidade ativa, carregamento de ${pct(c.loading)} e ${esc(c.selected.redundancy.toLowerCase())}.<\u002Fp><p>A instalação considera subestação ${esc(p.electrical.substationType.toLowerCase())}, transformadores do tipo ${esc(p.electrical.transformerType.toLowerCase())}, distribuição secundária em ${fmt0(n(p.electrical.secondaryVoltage))} V e esquema de aterramento ${esc(p.electrical.grounding)}.<\u002Fp><h2>4. Continuidade e fontes complementares<\u002Fh2>${v20Table(['Sistema','Situação','Capacidade preliminar'],[`<tr><td>Grupo gerador<\u002Ftd><td>${p.generatorSystem?.enabled?'Previsto':'Não previsto'}<\u002Ftd><td>${p.generatorSystem?.enabled?`${g.totalUnits} × ${fmt0(g.unitKva)} kVA`:'—'}<\u002Ftd><\u002Ftr>`,`<tr><td>UPS<\u002Ftd><td>${p.upsSystem?.enabled?'Previsto':'Não previsto'}<\u002Ftd><td>${p.upsSystem?.enabled?`${u.totalUnits} × ${fmt0(u.unitKva)} kVA · ${fmt0(p.upsSystem.autonomyMinutes)} min`:'—'}<\u002Ftd><\u002Ftr>`,`<tr><td>Fotovoltaico<\u002Ftd><td>${p.electrical.photovoltaic?'Previsto':'Não previsto'}<\u002Ftd><td>${fmt(n(p.v20.integration.pvKw),1)} kWp<\u002Ftd><\u002Ftr>`,`<tr><td>Recarga veicular<\u002Ftd><td>${p.evSystem?.enabled?'Prevista':'Não prevista'}<\u002Ftd><td>${p.evSystem?.enabled?`${fmt0(n(p.evSystem.quantity))} ponto(s)`:'—'}<\u002Ftd><\u002Ftr>`])}<h2>5. Operação, segurança e manutenção<\u002Fh2><p>O projeto executivo deverá detalhar sequência de manobra, intertravamentos, procedimentos de desenergização, sinalização, bloqueio, acesso, ventilação, retirada de equipamentos, combate a incêndio, equipotencialização, proteção contra surtos e plano de manutenção.<\u002Fp><div class=\"notice\"><strong>Caráter preliminar.<\u002Fstrong> Os requisitos da distribuidora, estudos de curto-circuito, coordenação e seletividade, aterramento, arc flash, qualidade de energia e desempenho garantido dos equipamentos devem ser confirmados antes da contratação e da execução.<\u002Fdiv>`}\nfunction v20SpecificationsBody(p,c){const selected=v11CatalogSelectedTransformer(p),fault=v20FaultResults(p,c).find(x=>x.node.id==='qgbt'),g=v12GeneratorCalc(p,c),u=v12UpsCalc(p,c),materials=v11GenerateMaterials(p,c);return`<h2>1. Critérios gerais<\u002Fh2><p>${esc(p.v20.documents.specificationNotes)}<\u002Fp><h2>2. Equipamentos principais<\u002Fh2>${v20Table(['Sistema','Especificação mínima preliminar','Observações'],[`<tr><td>Transformação<\u002Ftd><td>${c.selected.count} × ${fmt0(c.selected.unitKva)} kVA, ${esc(p.electrical.transformerType)}, ${fmt(n(p.electrical.primaryVoltage)/1000,1)} kV / ${fmt0(n(p.electrical.secondaryVoltage))} V, Z ${fmt(n(p.transformer.impedancePct),2)}%<\u002Ftd><td>${selected?`${esc(selected.manufacturer)} ${esc(selected.model)} como referência`:'Modelo a selecionar'}<\u002Ftd><\u002Ftr>`,`<tr><td>Cubículos MT<\u002Ftd><td>Classe de tensão compatível, corrente nominal e curto-circuito ≥ ${fmt(fault?.breaking||c.protection.breaking,0)} kA, intertravamentos e ensaios aplicáveis<\u002Ftd><td>Configuração conforme distribuidora<\u002Ftd><\u002Ftr>`,`<tr><td>QGBT<\u002Ftd><td>${fmt0(c.protection.lvRating)} A, capacidade de interrupção ≥ ${fmt(fault?.breaking||c.protection.breaking,0)} kA, unidades eletrônicas ajustáveis<\u002Ftd><td>Forma construtiva e grau de proteção a definir<\u002Ftd><\u002Ftr>`,`<tr><td>Gerador<\u002Ftd><td>${p.generatorSystem?.enabled?`${g.totalUnits} × ${fmt0(g.unitKva)} kVA, regime e transitórios a confirmar`:'Não previsto'}<\u002Ftd><td>Curvas de aceitação de carga obrigatórias<\u002Ftd><\u002Ftr>`,`<tr><td>UPS<\u002Ftd><td>${p.upsSystem?.enabled?`${u.totalUnits} × ${fmt0(u.unitKva)} kVA, dupla conversão, autonomia ${fmt0(p.upsSystem.autonomyMinutes)} min`:'Não previsto'}<\u002Ftd><td>Baterias conforme curva de descarga<\u002Ftd><\u002Ftr>`])}<h2>3. Condutores e barramentos<\u002Fh2><p>Os condutores deverão ser selecionados por ampacidade, queda de tensão, agrupamento, temperatura, harmônicas, suportabilidade ao curto-circuito, resistência ao fogo e condições reais de instalação. A configuração preliminar da interligação BT é ${c.cable.parallel} × ${fmt0(c.cable.section)} mm² por fase.<\u002Fp><h2>4. Proteção, controle e supervisão<\u002Fh2><p>As proteções deverão ser parametrizadas a partir dos níveis máximo e mínimo de curto, corrente de magnetização, partidas, limites térmicos e coordenação com dispositivos a montante e jusante. O estudo deverá documentar curvas oficiais e tolerâncias.<\u002Fp><h2>5. Relação indicativa<\u002Fh2>${v20Table(['Grupo','Descrição','Un.','Qtd.'],materials.slice(0,30).map(x=>`<tr><td>${esc(x.group)}<\u002Ftd><td>${esc(x.description)}<\u002Ftd><td>${esc(x.unit)}<\u002Ftd><td class=\"num\">${fmt(n(x.qty),2)}<\u002Ftd><\u002Ftr>`))}<div class=\"notice\"><strong>Conferência obrigatória.<\u002Fstrong> Códigos completos, acessórios, dimensões, massa, perdas, níveis de isolamento, ensaios, garantia, compatibilidade e documentação de fábrica devem ser definidos na especificação de aquisição.<\u002Fdiv>`}\nfunction v20QuantitiesBody(p,c){const materials=v11GenerateMaterials(p,c);return`<h2>1. Lista consolidada de materiais<\u002Fh2>${v20Table(['Grupo','Descrição','Unidade','Quantidade','Origem','Preço unitário'],materials.map(x=>`<tr><td>${esc(x.group)}<\u002Ftd><td>${esc(x.description)}<\u002Ftd><td>${esc(x.unit)}<\u002Ftd><td class=\"num\">${fmt(n(x.qty),2)}<\u002Ftd><td>${esc(x.source||'')}<\u002Ftd><td class=\"num\">${n(x.unitPrice)?money(n(x.unitPrice)):'—'}<\u002Ftd><\u002Ftr>`))}<h2>2. Critérios de medição<\u002Fh2><p>As quantidades foram geradas a partir dos parâmetros do estudo e devem ser compatibilizadas com plantas, cortes, rotas, detalhes construtivos, folgas, terminações, reservas, acessórios, suportação e interfaces civis.<\u002Fp><div class=\"notice\"><strong>Não exaustivo.<\u002Fstrong> A lista automática não contempla necessariamente todos os conectores, ferragens, fixadores, identificações, materiais de acabamento, ferramentas, consumíveis, interfaces e sobressalentes.<\u002Fdiv>`}\nfunction v20BudgetBody(p){const b=budgetCalc(p);return`<h2>1. Resumo financeiro<\u002Fh2><div class=\"kpis\"><div class=\"kpi\"><small>Custo direto<\u002Fsmall><strong>${money(b.direct)}<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>BDI<\u002Fsmall><strong>${money(b.bdi)}<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Contingência<\u002Fsmall><strong>${money(b.contingency)}<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Total<\u002Fsmall><strong>${money(b.total)}<\u002Fstrong><\u002Fdiv><\u002Fdiv><h2>2. Planilha orçamentária<\u002Fh2>${v20Table(['Grupo','Descrição','Un.','Qtd.','Preço unitário','Total','Fonte'],b.rows.map(x=>`<tr><td>${esc(x.group)}<\u002Ftd><td>${esc(x.description)}<\u002Ftd><td>${esc(x.unit)}<\u002Ftd><td class=\"num\">${fmt(n(x.qty),2)}<\u002Ftd><td class=\"num\">${money(n(x.unitPrice))}<\u002Ftd><td class=\"num\">${money(n(x.total))}<\u002Ftd><td>${esc(x.source||'')}<\u002Ftd><\u002Ftr>`))}<h2>3. Curva ABC<\u002Fh2>${v20Table(['Classe','Descrição','Participação','Acumulado','Valor'],b.abc.map(x=>`<tr><td>${esc(x.abc)}<\u002Ftd><td>${esc(x.description)}<\u002Ftd><td class=\"num\">${pct(x.share,2)}<\u002Ftd><td class=\"num\">${pct(x.cumulative,2)}<\u002Ftd><td class=\"num\">${money(x.total)}<\u002Ftd><\u002Ftr>`))}<div class=\"notice\"><strong>Data-base e mercado.<\u002Fstrong> Valores paramétricos e preços cadastrados devem ser substituídos por cotações válidas, condições tributárias, fretes, montagem, ensaios e demais custos da contratação.<\u002Fdiv>`}\nfunction v20ScheduleBody(p){const tasks=p.v20.documents.schedule||[];return`<h2>1. Cronograma preliminar<\u002Fh2>${v20GanttHtml(tasks)}<h2>2. Relação de atividades<\u002Fh2>${v20Table(['Atividade','Início','Duração','Responsável','Status'],tasks.map(x=>`<tr><td>${esc(x.name)}<\u002Ftd><td>Semana ${fmt0(n(x.startWeek))}<\u002Ftd><td>${fmt0(n(x.duration))} semana(s)<\u002Ftd><td>${esc(x.owner)}<\u002Ftd><td>${esc(x.status)}<\u002Ftd><\u002Ftr>`))}<h2>3. Marcos recomendados<\u002Fh2><p>Consulta de acesso, aprovação do projeto, liberação de fabricação, conclusão civil, entrega dos equipamentos, montagem, ensaios, aprovação da inspeção e energização devem possuir responsáveis e evidências documentais.<\u002Fp>`}\nfunction v20ArtBody(p){const a=p.v20.documents.art;return`<h2>Minuta de informações para ART<\u002Fh2>${v20Table(['Campo','Informação'],[`<tr><td>Profissional<\u002Ftd><td>${esc(a.professional||'A preencher')}<\u002Ftd><\u002Ftr>`,`<tr><td>Registro profissional<\u002Ftd><td>${esc(a.registration||'A preencher')}<\u002Ftd><\u002Ftr>`,`<tr><td>CREA<\u002Ftd><td>${esc(a.crea||p.meta.uf||'A preencher')}<\u002Ftd><\u002Ftr>`,`<tr><td>Contratante<\u002Ftd><td>${esc(a.contractor||p.meta.client||'A preencher')}<\u002Ftd><\u002Ftr>`,`<tr><td>Endereço da obra<\u002Ftd><td>${esc(a.workAddress||p.meta.address||'A preencher')}<\u002Ftd><\u002Ftr>`,`<tr><td>Atividade<\u002Ftd><td>${esc(a.activity)}<\u002Ftd><\u002Ftr>`,`<tr><td>Objeto técnico<\u002Ftd><td>Estudo e projeto de subestação predial, demanda ${fmt(calculateProject(p).requiredKva,1)} kVA, transformação ${fmt0(calculateProject(p).selected.activeKva)} kVA<\u002Ftd><\u002Ftr>`,`<tr><td>Observações<\u002Ftd><td>${esc(a.notes)}<\u002Ftd><\u002Ftr>`])}<div class=\"notice\"><strong>Documento sem validade de ART.<\u002Fstrong> Esta minuta não contém número, autenticação, recolhimento, assinatura ou validação do conselho. O profissional deve conferir atribuições e preencher o registro no sistema oficial.<\u002Fdiv><div class=\"signature\"><div>Profissional responsável<\u002Fdiv><div>Contratante<\u002Fdiv><\u002Fdiv>`}\nfunction v20BuildDocument(type,p=currentProject(),c=calculateProject(p)){\n  if(type==='calculation')return buildReportHtml(p,c);if(type==='technicalbook')return buildReportHtml(p,c);\n  const map={descriptive:['Memorial descritivo',v20DescriptiveBody(p,c)],specifications:['Especificações técnicas',v20SpecificationsBody(p,c)],quantities:['Quantitativos e lista de materiais',v20QuantitiesBody(p,c)],budget:['Orçamento preliminar',v20BudgetBody(p)],schedule:['Cronograma preliminar',v20ScheduleBody(p)],art:['Minuta auxiliar de ART',v20ArtBody(p)]};const item=map[type]||map.descriptive;return v20DocShell(item[0],item[1],p)\n}\nfunction v20OpenDocument(type,mode='print'){const p=currentProject(),html=v20BuildDocument(type,p,calculateProject(p)),title=type==='technicalbook'?'caderno-tecnico':type;if(mode==='html'){downloadBlob('\\ufeff'+html,'text/html;charset=utf-8',`${slug(p.name)}-${title}.html`);toast('Documento HTML gerado.');return}const w=window.open('','_blank');if(!w){toast('Permita janelas pop-up para imprimir.','warning');return}w.document.open();w.document.write(html);w.document.close();setTimeout(()=>{w.focus();w.print()},500)}\nfunction v20ReportExtra(p,c){const exec=v20ExecutiveCalc(p,c),fault=v20FaultResults(p,c),pairs=v20SelectivityAnalysis(p),eco=v20EconomicCalc(p,c),exp=v20ExpansionCalc(p,c),matrix=v20FailureMatrix(p,c),audit=v20AuditProject(p,c);return`\n<section class=\"section page-break\"><h2>25. Dashboard executivo e ESG<\u002Fh2><div class=\"kpis\"><div class=\"kpi\"><small>Energia anual<\u002Fsmall><strong>${fmt0(exec.annualEnergy/1000)} MWh<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Perdas anuais<\u002Fsmall><strong>${fmt0(exec.losses/1000)} MWh<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>FV<\u002Fsmall><strong>${fmt0(exec.pvAnnual/1000)} MWh<\u002Fstrong><\u002Fdiv><div class=\"kpi\"><small>Emissões evitadas<\u002Fsmall><strong>${fmt(exec.avoidedT,1)} tCO₂e<\u002Fstrong><\u002Fdiv><\u002Fdiv><p>A margem disponível é de ${fmt(exec.margin,1)} kVA; o custo operacional paramétrico é ${money(exec.opex)}/ano e a disponibilidade da melhor alternativa econômica é ${pct(exec.availability*100,4)}.<\u002Fp><\u002Fsection>\n<section class=\"section\"><h2>26. Curto-circuito por barras<\u002Fh2>${reportTable(['Ponto','Tensão','Icc 3φ','Icc 2φ','Icc 1φ','Pico','Interrupção'],fault.map(x=>`<tr><td>${esc(x.node.label)}<\u002Ftd><td class=\"num\">${fmt0(x.targetV)} V<\u002Ftd><td class=\"num\">${fmt(x.ik3,2)} kA<\u002Ftd><td class=\"num\">${fmt(x.ik2,2)} kA<\u002Ftd><td class=\"num\">${fmt(x.ik1,2)} kA<\u002Ftd><td class=\"num\">${fmt(x.peak,2)} kA<\u002Ftd><td class=\"num\">${fmt0(x.breaking)} kA<\u002Ftd><\u002Ftr>`))}<div class=\"notice\"><strong>Modelo radial preliminar.<\u002Fstrong> Validar impedâncias de sequência, fontes, paralelismos e condições máxima/mínima em estudo especializado.<\u002Fdiv><\u002Fsection>\n<section class=\"section page-break\"><h2>27. Coordenação e seletividade<\u002Fh2>${reportTable(['Montante','Jusante','Margem mínima','Sobreposição','Classificação'],pairs.map(x=>`<tr><td>${esc(x.upstream.label)}<\u002Ftd><td>${esc(x.downstream.label)}<\u002Ftd><td class=\"num\">${fmt(x.minMargin,3)} s<\u002Ftd><td class=\"num\">${pct(x.overlapPct,0)}<\u002Ftd><td>${esc(x.status)}<\u002Ftd><\u002Ftr>`))}<div class=\"notice\"><strong>Curvas paramétricas.<\u002Fstrong> Conferir curvas e tolerâncias oficiais dos dispositivos efetivamente selecionados.<\u002Fdiv><\u002Fsection>\n<section class=\"section\"><h2>28. Comparador econômico<\u002Fh2>${reportTable(['Alternativa','CAPEX','VPL','Carregamento','Disponibilidade','Redundância'],eco.rows.map(x=>`<tr><td>${esc(x.name)}<\u002Ftd><td class=\"num\">${money(x.capex)}<\u002Ftd><td class=\"num\">${money(x.npv)}<\u002Ftd><td class=\"num\">${pct(x.loading)}<\u002Ftd><td class=\"num\">${pct(x.availability*100,4)}<\u002Ftd><td>${esc(x.redundancy)}<\u002Ftd><\u002Ftr>`))}<p>Alternativa classificada em primeiro lugar: <strong>${esc(eco.best?.name||'—')}<\u002Fstrong>.<\u002Fp><\u002Fsection>\n<section class=\"section page-break\"><h2>29. Expansão futura<\u002Fh2>${reportTable(['Ano','Fase','Demanda','Carregamento','Transformação sugerida','CAPEX'],exp.rows.map(x=>`<tr><td>${fmt0(n(x.year))}<\u002Ftd><td>${esc(x.description)}<\u002Ftd><td class=\"num\">${fmt(x.demand,1)} kVA<\u002Ftd><td class=\"num\">${pct(x.loading)}<\u002Ftd><td class=\"num\">${fmt0(x.recommended)} kVA<\u002Ftd><td class=\"num\">${money(x.capex)}<\u002Ftd><\u002Ftr>`))}<\u002Fsection>\n<section class=\"section\"><h2>30. Matriz de falhas e resiliência<\u002Fh2>${reportTable(['Evento','Situação','Atendido','Interrompido','UPS'],matrix.map(x=>`<tr><td>${esc(x.event)}<\u002Ftd><td>${esc(x.status)}<\u002Ftd><td class=\"num\">${fmt(n(x.served)+n(x.criticalByUps),1)} kVA<\u002Ftd><td class=\"num\">${fmt(n(x.curtailed),1)} kVA<\u002Ftd><td class=\"num\">${fmt0(n(x.upsAutonomy))} min<\u002Ftd><\u002Ftr>`))}<\u002Fsection>\n<section class=\"section page-break\"><h2>31. Revisão técnica automatizada<\u002Fh2>${reportTable(['Severidade','Ocorrência','Análise','Módulo'],audit.map(x=>`<tr><td>${esc(x.severity)}<\u002Ftd><td>${esc(x.title)}<\u002Ftd><td>${esc(x.text)}<\u002Ftd><td>${esc(x.module)}<\u002Ftd><\u002Ftr>`))}<div class=\"notice\"><strong>Conclusão.<\u002Fstrong> A revisão automática apoia o projetista, mas não substitui conferência independente, responsabilidade técnica, normas vigentes, dados oficiais da distribuidora nem documentação garantida dos fabricantes.<\u002Fdiv><\u002Fsection>\n<section class=\"section page-break\"><h2>32. Cronograma preliminar<\u002Fh2>${v20ScheduleBody(p)}<\u002Fsection>\n<section class=\"section page-break\"><h2>33. Minuta auxiliar de ART<\u002Fh2>${v20ArtBody(p
