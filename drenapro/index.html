  for(const [id,k] of Object.entries({idfK:\"K\",idfA:\"a\",idfB:\"b\",idfC:\"c\",idfTr:\"tr\",idfT:\"t\",idfStation:\"station\",idfSource:\"source\"}))$(id).value=x[k]??\"\";\n  const i=idfIntensity(),lsHa=i/3.6;\n  $(\"idfResult\").innerHTML=`<small>Intensidade calculada<\u002Fsmall><div class=\"big\">${fmt(i,2)} mm/h<\u002Fdiv>\n    <div class=\"kpi-row mt\"><div><b>${fmt(lsHa,2)}<\u002Fb><small>L/s\u00b7ha<\u002Fsmall><\u002Fdiv><div><b>${fmt(x.tr,1)}<\u002Fb><small>anos<\u002Fsmall><\u002Fdiv><div><b>${fmt(x.t,1)}<\u002Fb><small>min<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n    <div class=\"formula mt\">i = ${fmt(x.K,3)} \u00d7 ${fmt(x.tr,2)}^${fmt(x.a,3)} \u00f7 (${fmt(x.t,2)} + ${fmt(x.b,3)})^${fmt(x.c,3)}\ni = ${fmt(i,3)} mm/h<\u002Fdiv>`;\n  requestAnimationFrame(drawIdfChart);\n}\nfunction renderBasins(){\n  const rows=state.basins.map(b=>{\n    const A=basinArea(b),sum=basinSurfaceArea(b),C=basinC(b),diff=Math.abs(A-sum),ok=A>0&&C>=0&&C<=1&&diff<=Math.max(.001,A*.01);\n    return `<tr><td><b>${escapeHTML(b.code)}<\u002Fb><\u002Ftd><td>${escapeHTML(b.name||\"\u2014\")}<\u002Ftd><td>${fmt(A,3)}<\u002Ftd><td>${fmt(C,3)}<\u002Ftd><td>${fmt(b.length,1)}<\u002Ftd><td>${fmt(b.drop,2)}<\u002Ftd><td>${fmt(b.tc,2)}<\u002Ftd><td>${escapeHTML(b.outlet||\"\u2014\")}<\u002Ftd><td>${statusBadge(ok?\"ok\":\"warn\",ok?\"Consistente\":\"Revisar\")}<\u002Ftd><td class=\"t-actions\"><button data-edit-basin=\"${b.id}\">Editar<\u002Fbutton><button data-copy-basin=\"${b.id}\">Duplicar<\u002Fbutton><\u002Ftd><\u002Ftr>`;\n  }).join(\"\");\n  $(\"basinRows\").innerHTML=rows||'<tr><td colspan=\"10\" class=\"muted center\">Nenhuma bacia cadastrada.<\u002Ftd><\u002Ftr>';\n}\nfunction renderTcSelectors(){\n  const current=$(\"tcBasin\").value;\n  $(\"tcBasin\").innerHTML=`<option value=\"\">Selecione...<\u002Foption>${state.basins.map(b=>`<option value=\"${b.id}\">${escapeHTML(b.code)} \u2014 ${escapeHTML(b.name)}<\u002Foption>`).join(\"\")}`;\n  if(state.basins.some(b=>b.id===current))$(\"tcBasin\").value=current;\n}\nfunction renderTcResults(){\n  if(!tcComparison.length){$(\"tcResults\").innerHTML='<div class=\"muted center\">Preencha os dados e calcule.<\u002Fdiv>';return}\n  const vals=tcComparison.filter(x=>Number.isFinite(x.value)).map(x=>x.value),min=Math.min(...vals),max=Math.max(...vals),avg=vals.reduce((a,b)=>a+b,0)/vals.length;\n  $(\"tcResults\").innerHTML=`<div class=\"grid g3 mb\"><div class=\"result\"><small>M\u00ednimo<\u002Fsmall><div class=\"big\">${fmt(min,2)} min<\u002Fdiv><\u002Fdiv><div class=\"result\"><small>M\u00e9dia<\u002Fsmall><div class=\"big\">${fmt(avg,2)} min<\u002Fdiv><\u002Fdiv><div class=\"result\"><small>M\u00e1ximo<\u002Fsmall><div class=\"big\">${fmt(max,2)} min<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"table-wrap\"><table><thead><tr><th>Adotar<\u002Fth><th>M\u00e9todo<\u002Fth><th>Tc (min)<\u002Fth><th>Express\u00e3o<\u002Fth><th>Observa\u00e7\u00e3o<\u002Fth><\u002Ftr><\u002Fthead><tbody>${tcComparison.map((x,i)=>`<tr><td><input type=\"radio\" name=\"tcPick\" value=\"${i}\" ${i===state.tcSelection?\"checked\":\"\"}><\u002Ftd><td><b>${escapeHTML(x.name)}<\u002Fb><\u002Ftd><td>${fmt(x.value,2)}<\u002Ftd><td><span class=\"code\" style=\"padding:3px 5px\">${escapeHTML(x.formula)}<\u002Fspan><\u002Ftd><td>${x.valid?escapeHTML(x.note):statusBadge(\"danger\",\"Dados inv\u00e1lidos\")}<\u002Ftd><\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable><\u002Fdiv>`;\n}\nfunction renderRational(){\n  const items=state.basins.map(b=>({b,r:rationalForBasin(b)}));\n  $(\"rArea\").textContent=`${fmt(items.reduce((s,x)=>s+x.r.area,0),2)} ha`;\n  $(\"rFlow\").textContent=`${fmt(items.reduce((s,x)=>s+x.r.q,0),3)} m\u00b3/s`;\n  $(\"rIntensity\").textContent=`${fmt(items.length?Math.max(...items.map(x=>x.r.i)):0,1)} mm/h`;\n  $(\"rTr\").textContent=`${fmt(state.idf.tr,0)} anos`;\n  $(\"rationalRows\").innerHTML=items.map(({b,r})=>`<tr><td><b>${escapeHTML(b.code)}<\u002Fb><\u002Ftd><td>${fmt(r.area,3)}<\u002Ftd><td>${fmt(r.C,3)}<\u002Ftd><td>${fmt(r.tc,2)}<\u002Ftd><td>${fmt(r.i,2)}<\u002Ftd><td><b>${fmt(r.q,4)}<\u002Fb><\u002Ftd><td>${fmt(r.ls,1)}<\u002Ftd><td><span class=\"code\" style=\"padding:3px 6px\">Q = ${fmt(r.C,3)} \u00d7 ${fmt(r.i,2)} \u00d7 ${fmt(r.area,3)} / 360<\u002Fspan><\u002Ftd><\u002Ftr>`).join(\"\")||'<tr><td colspan=\"8\" class=\"muted center\">Cadastre bacias para calcular as vaz\u00f5es.<\u002Ftd><\u002Ftr>';\n}\n\nfunction worstLevel(levels){\n  return levels.includes(\"danger\")?\"danger\":levels.includes(\"warn\")?\"warn\":levels.includes(\"info\")?\"info\":\"ok\";\n}\nfunction gutterLevel(g,m=gutterMetrics(g)){\n  const levels=[];\n  if(m.util>1||m.depth>asNumber(g.maxDepth,state.settings.maxGutterDepth)*1.001)levels.push(\"danger\");\n  else if(m.util>=state.settings.warnUtil/100)levels.push(\"warn\");\n  if(m.spread>asNumber(g.maxSpread,state.settings.maxSpread))levels.push(\"danger\");\n  if(m.velocity>state.settings.maxV)levels.push(\"danger\");\n  if(m.q>0&&m.velocity<state.settings.minV)levels.push(\"warn\");\n  return worstLevel(levels);\n}\nfunction inletLevel(x,m=inletMetrics(x)){\n  if(m.residual>1e-8||m.eff<state.settings.minInletEff/100)return \"danger\";\n  if(m.eff<.8||m.clog>.5)return \"warn\";return \"ok\";\n}\nfunction pipeLevel(p,m=p.metrics||pipeMetrics(p)){\n  const levels=[];\n  if(m.util>1||m.fill>state.settings.maxFill/100+.002)levels.push(\"danger\");\n  else if(m.util>=state.settings.warnUtil/100)levels.push(\"warn\");\n  if(m.q>0&&m.velocity<state.settings.minV)levels.push(\"warn\");\n  if(m.velocity>state.settings.maxV)levels.push(\"danger\");\n  if(Number.isFinite(m.cover)&&m.cover<state.settings.minCover)levels.push(\"danger\");\n  if(asNumber(p.slope)<=0)levels.push(\"danger\");\n  if(!p.from||!p.to)levels.push(\"info\");\n  return worstLevel(levels);\n}\nfunction channelLevel(ch,m=channelMetrics(ch)){\n  const levels=[];\n  if(Number.isFinite(m.freeboard)&&m.freeboard<0)levels.push(\"danger\");\n  else if(Number.isFinite(m.freeboard)&&m.freeboard<state.settings.minFreeboard)levels.push(\"warn\");\n  if(m.V>asNumber(ch.maxV,state.settings.maxV))levels.push(\"danger\");\n  if(m.q>0&&m.V<state.settings.minV)levels.push(\"warn\");\n  if(asNumber(ch.tauAdmissible)>0&&m.tau>asNumber(ch.tauAdmissible))levels.push(\"danger\");\n  return worstLevel(levels);\n}\nfunction labelForLevel(level){return level===\"ok\"?\"Adequado\":level===\"warn\"?\"Aten\u00e7\u00e3o\":level===\"danger\"?\"Insuficiente\":\"Incompleto\"}\n\nfunction renderGutters(){\n  $(\"gutterRows\").innerHTML=state.gutters.map(g=>{const m=gutterMetrics(g),level=gutterLevel(g,m);return `<tr>\n    <td><b>${escapeHTML(g.code)}<\u002Fb><\u002Ftd><td>${fmt(m.q,4)} m\u00b3/s<\u002Ftd><td>${fmt(g.slopeLong,4)}<\u002Ftd><td>${fmt(g.crossSlope,4)}<\u002Ftd><td>${fmt(g.n,3)}<\u002Ftd>\n    <td>${fmt(m.depth,3)} m<\u002Ftd><td>${fmt(m.spread,2)} m<\u002Ftd><td>${fmt(m.velocity,2)} m/s<\u002Ftd><td>${fmt(m.cap,4)} m\u00b3/s<\u002Ftd>\n    <td>${statusBadge(level,labelForLevel(level))}<\u002Ftd><td class=\"t-actions\"><button data-edit-gutter=\"${g.id}\">Editar<\u002Fbutton><button data-copy-item=\"gutter:${g.id}\">Duplicar<\u002Fbutton><\u002Ftd><\u002Ftr>`}).join(\"\")||'<tr><td colspan=\"11\" class=\"muted center\">Nenhuma sarjeta cadastrada.<\u002Ftd><\u002Ftr>';\n}\nfunction renderInlets(){\n  $(\"inletRows\").innerHTML=state.inlets.map(x=>{const m=inletMetrics(x),level=inletLevel(x,m),dims=`${fmt(x.length,2)} \u00d7 ${fmt(x.width||x.height,2)} m`;return `<tr>\n    <td><b>${escapeHTML(x.code)}<\u002Fb><\u002Ftd><td>${escapeHTML(x.type)}<\u002Ftd><td>${fmt(m.q,4)} m\u00b3/s<\u002Ftd><td>${dims}<\u002Ftd><td>${fmt(m.clog*100,0)}%<\u002Ftd>\n    <td>${fmt(m.cap,4)}<\u002Ftd><td>${fmt(m.captured,4)}<\u002Ftd><td>${fmt(m.residual,4)}<\u002Ftd><td>${pct(m.eff,1)}<\u002Ftd>\n    <td>${statusBadge(level,labelForLevel(level))}<\u002Ftd><td class=\"t-actions\"><button data-edit-inlet=\"${x.id}\">Editar<\u002Fbutton><button data-copy-item=\"inlet:${x.id}\">Duplicar<\u002Fbutton><\u002Ftd><\u002Ftr>`}).join(\"\")||'<tr><td colspan=\"11\" class=\"muted center\">Nenhuma boca de lobo cadastrada.<\u002Ftd><\u002Ftr>';\n}\nfunction pipeDimLabel(p){\n  return p.shape===\"rectangular\"?`${fmt(p.width,2)} \u00d7 ${fmt(p.height,2)} m`:`DN ${fmt(p.diameter,0)} mm`;\n}\nfunction renderPipes(){\n  $(\"pipeRows\").innerHTML=state.pipes.map(p=>{const m=p.metrics||pipeMetrics(p),level=pipeLevel(p,m);return `<tr>\n    <td><b>${escapeHTML(p.code)}<\u002Fb><\u002Ftd><td>${escapeHTML(p.from||\"?\")} \u2192 ${escapeHTML(p.to||\"?\")}<\u002Ftd><td>${fmt(p.qLocal,4)}<\u002Ftd><td><b>${fmt(p.qAccum,4)}<\u002Fb><\u002Ftd>\n    <td>${p.shape===\"rectangular\"?\"Retangular\":\"Circular\"}<\u002Ftd><td>${pipeDimLabel(p)}<\u002Ftd><td>${fmt(p.slope,4)}<\u002Ftd><td>${fmt(p.n,3)}<\u002Ftd><td>${fmt(p.length,1)} m<\u002Ftd>\n    <td>${pct(m.fill,1)}<\u002Ftd><td>${fmt(m.velocity,2)} m/s<\u002Ftd><td>${fmt(m.cap,4)}<\u002Ftd><td>${fmt(m.cover,2)} m<\u002Ftd>\n    <td>${statusBadge(level,labelForLevel(level))}<\u002Ftd><td class=\"t-actions\"><button data-edit-pipe=\"${p.id}\">Editar<\u002Fbutton><button data-copy-item=\"pipe:${p.id}\">Duplicar<\u002Fbutton><\u002Ftd><\u002Ftr>`}).join(\"\")||'<tr><td colspan=\"15\" class=\"muted center\">Nenhum trecho de galeria cadastrado.<\u002Ftd><\u002Ftr>';\n}\nfunction structureConnections(st){\n  return {incoming:state.pipes.filter(p=>String(p.to)===String(st.code)),outgoing:state.pipes.filter(p=>String(p.from)===String(st.code))};\n}\nfunction renderStructures(){\n  $(\"structureRows\").innerHTML=state.structures.map(st=>{const c=structureConnections(st),depth=asNumber(st.ground)-asNumber(st.invert);let level=\"ok\";if(depth<=0)level=\"danger\";else if(depth<state.settings.minCover)level=\"warn\";return `<tr>\n    <td><b>${escapeHTML(st.code)}<\u002Fb><\u002Ftd><td>${escapeHTML(st.type)}<\u002Ftd><td>${fmt(st.ground,2)} m<\u002Ftd><td>${fmt(st.invert,2)} m<\u002Ftd><td>${fmt(depth,2)} m<\u002Ftd>\n    <td>${fmt(st.width,2)} \u00d7 ${fmt(st.length,2)} m<\u002Ftd><td>${fmt(st.k,2)}<\u002Ftd><td>${c.incoming.map(p=>escapeHTML(p.code)).join(\", \")||\"\u2014\"}<\u002Ftd><td>${c.outgoing.map(p=>escapeHTML(p.code)).join(\", \")||\"\u2014\"}<\u002Ftd>\n    <td>${statusBadge(level,labelForLevel(level))}<\u002Ftd><td class=\"t-actions\"><button data-edit-structure=\"${st.id}\">Editar<\u002Fbutton><button data-copy-item=\"structure:${st.id}\">Duplicar<\u002Fbutton><\u002Ftd><\u002Ftr>`}).join(\"\")||'<tr><td colspan=\"11\" class=\"muted center\">Nenhuma estrutura cadastrada.<\u002Ftd><\u002Ftr>';\n}\nfunction renderChannels(){\n  $(\"channelRows\").innerHTML=state.channels.map(ch=>{const m=channelMetrics(ch),level=channelLevel(ch,m);return `<tr>\n    <td><b>${escapeHTML(ch.code)}<\u002Fb><\u002Ftd><td>${escapeHTML(ch.shape)}<\u002Ftd><td>${fmt(ch.q,4)}<\u002Ftd><td>${fmt(ch.width,2)}<\u002Ftd><td>${fmt(ch.z,2)}<\u002Ftd><td>${fmt(ch.slope,4)}<\u002Ftd><td>${fmt(ch.n,3)}<\u002Ftd>\n    <td>${fmt(m.yn,3)}<\u002Ftd><td>${fmt(m.yc,3)}<\u002Ftd><td>${fmt(m.V,2)}<\u002Ftd><td>${fmt(m.Fr,2)}<\u002Ftd><td>${m.regime}<\u002Ftd><td>${fmt(m.freeboard,2)} m<\u002Ftd>\n    <td>${statusBadge(level,labelForLevel(level))}<\u002Ftd><td class=\"t-actions\"><button data-edit-channel=\"${ch.id}\">Editar<\u002Fbutton><button data-copy-item=\"channel:${ch.id}\">Duplicar<\u002Fbutton><\u002Ftd><\u002Ftr>`}).join(\"\")||'<tr><td colspan=\"15\" class=\"muted center\">Nenhum canal cadastrado.<\u002Ftd><\u002Ftr>';\n}\nfunction renderNetwork(){\n  calculateNetworkFlows();\n  const nodes=new Set(state.pipes.flatMap(p=>[p.from,p.to]).filter(Boolean));\n  const maxQ=state.pipes.length?Math.max(...state.pipes.map(p=>asNumber(p.qAccum))):0;\n  const utils=state.pipes.map(p=>p.metrics?.util).filter(Number.isFinite),maxUtil=utils.length?Math.max(...utils):0;\n  $(\"nNodes\").textContent=nodes.size;$(\"nEdges\").textContent=state.pipes.length;$(\"nOutletFlow\").textContent=`${fmt(maxQ,3)} m\u00b3/s`;$(\"nMinUtil\").textContent=pct(maxUtil,0);\n  $(\"networkRows\").innerHTML=state.pipes.map(p=>{const m=p.metrics||pipeMetrics(p),level=pipeLevel(p,m),basins=state.basins.filter(b=>String(b.outlet)===String(p.code)||String(b.outlet)===String(p.id)).map(b=>b.code);return `<tr>\n    <td><b>${escapeHTML(p.code)}<\u002Fb><\u002Ftd><td>${escapeHTML(p.from||\"\u2014\")}<\u002Ftd><td>${escapeHTML(p.to||\"\u2014\")}<\u002Ftd><td>${basins.join(\", \")||\"\u2014\"}<\u002Ftd><td>${fmt(p.qLocal,4)}<\u002Ftd><td>${fmt(p.qAccum,4)}<\u002Ftd><td>${fmt(m.cap,4)}<\u002Ftd><td>${pct(m.util,1)}<\u002Ftd><td>${fmt(m.travel,2)} min<\u002Ftd><td>${statusBadge(level,labelForLevel(level))}<\u002Ftd><\u002Ftr>`}).join(\"\")||'<tr><td colspan=\"10\" class=\"muted center\">Cadastre trechos para montar a rede.<\u002Ftd><\u002Ftr>';\n  const paths=networkPaths(),selected=$(\"profilePath\").value;\n  $(\"profilePath\").innerHTML=paths.map((path,i)=>`<option value=\"${i}\">${path.map(p=>escapeHTML(p.code)).join(\" \u2192 \")}<\u002Foption>`).join(\"\")||'<option value=\"\">Sem percurso<\u002Foption>';\n  if(paths[selected])$(\"profilePath\").value=selected;\n  requestAnimationFrame(()=>{drawNetwork();drawProfile()});\n}\nfunction completionData(){\n  const checks=[\n    [\"Projeto\",!!state.project.name&&state.project.name!==\"Novo projeto\"],\n    [\"Equa\u00e7\u00e3o IDF\",!!state.idf.source&&idfIntensity()>0],\n    [\"Bacias\",state.basins.length>0&&state.basins.every(b=>basinArea(b)>0&&basinC(b)>0)],\n    [\"Tempo de concentra\u00e7\u00e3o\",state.basins.length>0&&state.basins.every(b=>asNumber(b.tc)>0)],\n    [\"Vaz\u00f5es\",state.basins.length>0&&state.basins.every(b=>rationalForBasin(b).q>0)],\n    [\"Dispositivos\",state.gutters.length+state.inlets.length>0],\n    [\"Rede\",state.pipes.length>0&&state.pipes.every(p=>p.from&&p.to)],\n    [\"Relat\u00f3rio\",state.project.engineer&&state.project.registry]\n  ];\n  return {checks,done:checks.filter(x=>x[1]).length,pct:checks.filter(x=>x[1]).length/checks.length*100};\n}\nfunction renderDashboard(){\n  const areas=state.basins.reduce((s,b)=>s+basinArea(b),0),maxQ=state.pipes.length?Math.max(...state.pipes.map(p=>asNumber(p.qAccum))):state.basins.reduce((s,b)=>s+rationalForBasin(b).q,0);\n  $(\"mArea\").textContent=`${fmt(areas,2)} ha`;$(\"mFlow\").textContent=`${fmt(maxQ,3)} m\u00b3/s`;\n  $(\"mPipe\").textContent=`${fmt(state.pipes.reduce((s,p)=>s+asNumber(p.length),0),0)} m`;\n  $(\"mDevices\").textContent=state.gutters.length+state.inlets.length+state.structures.length+state.channels.length;\n  const critical=lastChecks.filter(x=>x.level===\"danger\").length;$(\"mCritical\").textContent=critical;\n  const c=completionData();$(\"completionPct\").textContent=`${fmt(c.pct,0)}%`;$(\"completionBar\").style.width=`${c.pct}%`;\n  $(\"completionSteps\").innerHTML=c.checks.map(([n,ok])=>`<div class=\"step ${ok?\"done\":\"\"}\"><i>${ok?\"\u2713\":\"\u25cb\"}<\u002Fi><span>${escapeHTML(n)}<\u002Fspan><\u002Fdiv>`).join(\"\");\n  const top=lastChecks.filter(x=>x.level!==\"ok\").slice(0,5);\n  $(\"dashboardChecks\").innerHTML=top.length?top.map(x=>`<div class=\"alert ${x.level}\"><b>${escapeHTML(x.title)}<\u002Fb><small>${escapeHTML(x.detail)}<\u002Fsmall><\u002Fdiv>`).join(\"\"):'<div class=\"alert ok\"><b>Nenhuma ressalva ativa<\u002Fb><small>Os itens cadastrados atendem aos crit\u00e9rios configurados.<\u002Fsmall><\u002Fdiv>';\n  requestAnimationFrame(drawBasinChart);\n}\nfunction renderSettings(){\n  const s=state.settings,map={sMinV:\"minV\",sMaxV:\"maxV\",sMaxFill:\"maxFill\",sMinCover:\"minCover\",sMaxSpread:\"maxSpread\",sMaxGutterDepth:\"maxGutterDepth\",sWarnUtil:\"warnUtil\",sDecimals:\"decimals\",sMinFreeboard:\"minFreeboard\",sMinInletEff:\"minInletEff\",sDefaultClog:\"defaultClog\",sSafety:\"safety\",sCriteriaSource:\"criteriaSource\"};\n  for(const [id,k] of Object.entries(map))$(id).value=s[k]??\"\";\n  $(\"sDiameters\").value=s.diameters.join(\", \");\n  $(\"coeffRows\").innerHTML=s.coefficients.map((x,i)=>`<tr><td><input data-coeff-name=\"${i}\" value=\"${escapeHTML(x.name)}\"><\u002Ftd><td><input type=\"number\" step=\"any\" min=\"0\" max=\"1\" data-coeff-c=\"${i}\" value=\"${x.c}\"><\u002Ftd><td><button class=\"btn small danger\" data-remove-coeff=\"${i}\">\u00d7<\u002Fbutton><\u002Ftd><\u002Ftr>`).join(\"\");\n  $(\"manningRows\").innerHTML=s.mannings.map((x,i)=>`<tr><td><input data-man-name=\"${i}\" value=\"${escapeHTML(x.name)}\"><\u002Ftd><td><input type=\"number\" step=\"any\" min=\"0.001\" data-man-n=\"${i}\" value=\"${x.n}\"><\u002Ftd><td><button class=\"btn small danger\" data-remove-man=\"${i}\">\u00d7<\u002Fbutton><\u002Ftd><\u002Ftr>`).join(\"\");\n}\n\n/* ===================== VERIFICA\u00c7\u00d5ES ===================== */\nfunction getChecks(){\n  calculateNetworkFlows();\n  const list=[],add=(level,category,title,detail,suggestion=\"\")=>list.push({level,category,title,detail,suggestion});\n  const ok=(category,title,detail)=>add(\"ok\",category,title,detail,\"\");\n\n  if(!state.project.name||state.project.name===\"Novo projeto\")add(\"warn\",\"Projeto\",\"Identifica\u00e7\u00e3o incompleta\",\"O projeto ainda est\u00e1 com o nome padr\u00e3o.\",\"Preencha a identifica\u00e7\u00e3o do projeto.\");\n  else ok(\"Projeto\",\"Projeto identificado\",`Projeto: ${state.project.name}.`);\n  if(!state.project.engineer||!state.project.registry)add(\"warn\",\"Projeto\",\"Responsabilidade t\u00e9cnica incompleta\",\"Nome ou registro profissional n\u00e3o informado.\",\"Preencha o respons\u00e1vel e o registro antes de emitir o relat\u00f3rio.\");\n  else ok(\"Projeto\",\"Respons\u00e1vel identificado\",`${state.project.engineer} \u2014 ${state.project.registry}.`);\n\n  const i=idfIntensity();\n  if(!Number.isFinite(i)||i<=0)add(\"danger\",\"Hidrologia\",\"Equa\u00e7\u00e3o IDF inv\u00e1lida\",\"Os par\u00e2metros n\u00e3o resultam em intensidade positiva.\",\"Revise K, a, b, c, Tr e dura\u00e7\u00e3o.\");\n  else ok(\"Hidrologia\",\"Intensidade calculada\",`i = ${fmt(i,2)} mm/h para Tr = ${fmt(state.idf.tr,1)} anos e t = ${fmt(state.idf.t,1)} min.`);\n  if(!state.idf.source)add(\"warn\",\"Hidrologia\",\"Fonte da IDF n\u00e3o registrada\",\"Sem refer\u00eancia para os par\u00e2metros pluviom\u00e9tricos.\",\"Informe publica\u00e7\u00e3o, esta\u00e7\u00e3o, autor e per\u00edodo de dados.\");\n  else ok(\"Hidrologia\",\"Fonte da IDF registrada\",state.idf.source);\n\n  if(!state.basins.length)add(\"danger\",\"Bacias\",\"Nenhuma bacia cadastrada\",\"N\u00e3o h\u00e1 \u00e1rea contribuinte para o c\u00e1lculo.\",\"Cadastre ao menos uma bacia.\");\n  state.basins.forEach(b=>{\n    const A=basinArea(b),As=basinSurfaceArea(b),C=basinC(b),r=rationalForBasin(b);\n    if(A<=0)add(\"danger\",\"Bacias\",`${b.code}: \u00e1rea inv\u00e1lida`,`\u00c1rea = ${fmt(A,3)} ha.`,\"Informe a \u00e1rea total e as superf\u00edcies.\");\n    else ok(\"Bacias\",`${b.code}: \u00e1rea positiva`,`\u00c1rea de c\u00e1lculo = ${fmt(A,3)} ha.`);\n    if(Math.abs(A-As)>Math.max(.001,A*.01))add(\"warn\",\"Bacias\",`${b.code}: \u00e1reas n\u00e3o fecham`,`\u00c1rea declarada ${fmt(A,3)} ha; superf\u00edcies ${fmt(As,3)} ha.`,\"Ajuste as superf\u00edcies ou a \u00e1rea declarada.\");\n    else if(A>0)ok(\"Bacias\",`${b.code}: superf\u00edcies compat\u00edveis`,`Diferen\u00e7a = ${fmt(A-As,4)} ha.`);\n    if(C<0||C>1||!Number.isFinite(C))add(\"danger\",\"Bacias\",`${b.code}: coeficiente inv\u00e1lido`,`C = ${fmt(C,3)}.`,\"Adote valor entre 0 e 1.\");\n    else ok(\"Bacias\",`${b.code}: coeficiente v\u00e1lido`,`C ponderado = ${fmt(C,3)}.`);\n    if(asNumber(b.tc)<=0)add(\"danger\",\"Tempo de concentra\u00e7\u00e3o\",`${b.code}: Tc ausente`,`Tc = ${fmt(b.tc,2)} min.`,\"Calcule ou informe um tempo de concentra\u00e7\u00e3o.\");\n    else if(asNumber(b.tc)<5)add(\"warn\",\"Tempo de concentra\u00e7\u00e3o\",`${b.code}: Tc muito baixo`,`Tc = ${fmt(b.tc,2)} min.`,\"Confirme percurso, declividade e limite m\u00ednimo da refer\u00eancia local.\");\n    else ok(\"Tempo de concentra\u00e7\u00e3o\",`${b.code}: Tc definido`,`Tc adotado = ${fmt(b.tc,2)} min.`);\n    if(!Number.isFinite(r.q)||r.q<=0)add(\"danger\",\"M\u00e9todo Racional\",`${b.code}: vaz\u00e3o inv\u00e1lida`,\"N\u00e3o foi poss\u00edvel obter a vaz\u00e3o de projeto.\",\"Revise \u00e1rea, C, Tc e IDF.\");\n    else ok(\"M\u00e9todo Racional\",`${b.code}: vaz\u00e3o calculada`,`Q = ${fmt(r.q,4)} m\u00b3/s.`);\n    if(b.outlet&&!state.pipes.some(p=>p.code===b.outlet||p.id===b.outlet))add(\"warn\",\"Rede\",`${b.code}: trecho receptor inexistente`,`Ponto informado: ${b.outlet}.`,\"Associe a bacia a um c\u00f3digo de galeria existente.\");\n  });\n\n  state.gutters.forEach(g=>{\n    const m=gutterMetrics(g);\n    if(asNumber(g.slopeLong)<=0||asNumber(g.crossSlope)<=0)add(\"danger\",\"Sarjetas\",`${g.code}: declividade inv\u00e1lida`,\"Declividades devem ser positivas.\",\"Revise a geometria da sarjeta.\");\n    if(m.util>1)add(\"danger\",\"Sarjetas\",`${g.code}: capacidade insuficiente`,`Q/Qcap = ${pct(m.util,1)}.`,\"Aumente a se\u00e7\u00e3o, a declividade ou instale capta\u00e7\u00e3o a montante.\");\n    else if(m.util>=state.settings.warnUtil/100)add(\"warn\",\"Sarjetas\",`${g.code}: pr\u00f3xima ao limite`,`Q/Qcap = ${pct(m.util,1)}.`,\"Verifique margem de seguran\u00e7a e obstru\u00e7\u00f5es.\");\n    else ok(\"Sarjetas\",`${g.code}: capacidade adequada`,`Q/Qcap = ${pct(m.util,1)}.`);\n    if(m.spread>asNumber(g.maxSpread,state.settings.maxSpread))add(\"danger\",\"Sarjetas\",`${g.code}: espalhamento excessivo`,`T = ${fmt(m.spread,2)} m.`,\"Reduza o espa\u00e7amento entre capta\u00e7\u00f5es ou reveja a se\u00e7\u00e3o.\");\n    if(m.q>0&&m.velocity<state.settings.minV)add(\"warn\",\"Sarjetas\",`${g.code}: velocidade baixa`,`V = ${fmt(m.velocity,2)} m/s.`,\"Avalie risco de deposi\u00e7\u00e3o.\");\n    if(m.velocity>state.settings.maxV)add(\"danger\",\"Sarjetas\",`${g.code}: velocidade elevada`,`V = ${fmt(m.velocity,2)} m/s.`,\"Avalie eros\u00e3o e prote\u00e7\u00e3o do pavimento.\");\n  });\n\n  state.inlets.forEach(x=>{\n    const m=inletMetrics(x);\n    if(m.residual>1e-7)add(\"danger\",\"Bocas de lobo\",`${x.code}: vaz\u00e3o residual`,`Q residual = ${fmt(m.residual,4)} m\u00b3/s.`,\"Aumente o dispositivo, reduza o espa\u00e7amento ou use unidades adicionais.\");\n    else ok(\"Bocas de lobo\",`${x.code}: capta\u00e7\u00e3o atende`,`Efici\u00eancia = ${pct(m.eff,1)}.`);\n    if(m.eff<state.settings.minInletEff/100)add(\"warn\",\"Bocas de lobo\",`${x.code}: baixa efici\u00eancia`,`Efici\u00eancia = ${pct(m.eff,1)}.`,\"Revise geometria, obstru\u00e7\u00e3o e condi\u00e7\u00e3o de aproxima\u00e7\u00e3o.\");\n    if(m.clog>.5)add(\"warn\",\"Bocas de lobo\",`${x.code}: obstru\u00e7\u00e3o severa`,`Obstru\u00e7\u00e3o adotada = ${pct(m.clog,0)}.`,\"Justifique o cen\u00e1rio e preveja manuten\u00e7\u00e3o.\");\n  });\n\n  if(!state.pipes.length)add(\"danger\",\"Galerias\",\"Nenhum trecho cadastrado\",\"A rede de galerias est\u00e1 vazia.\",\"Cadastre os trechos ou justifique solu\u00e7\u00e3o superficial.\");\n  state.pipes.forEach(p=>{\n    const m=p.metrics||pipeMetrics(p),dim=pipeDimension(p);\n    const dimensionOk=p.shape===\"rectangular\"?dim.w>0&&dim.h>0:dim.D>0;\n    if(!p.code||!p.from||!p.to)add(\"danger\",\"Rede\",`${p.code||\"Trecho\"}: conectividade incompleta`,\"C\u00f3digo, n\u00f3 de montante ou n\u00f3 de jusante ausente.\",\"Preencha os identificadores.\");\n    if(!dimensionOk)add(\"danger\",\"Galerias\",`${p.code}: se\u00e7\u00e3o inv\u00e1lida`,`Dimens\u00e3o: ${pipeDimLabel(p)}.`,\"Informe di\u00e2metro, largura e altura positivos.\");\n    if(asNumber(p.slope)<=0)add(\"danger\",\"Galerias\",`${p.code}: declividade n\u00e3o positiva`,`S = ${fmt(p.slope,5)} m/m.`,\"Corrija as cotas ou a declividade.\");\n    if(m.util>1)add(\"danger\",\"Galerias\",`${p.code}: capacidade insuficiente`,`Q = ${fmt(m.q,4)} m\u00b3/s; capacidade no enchimento-limite = ${fmt(m.cap,4)} m\u00b3/s.`,\"Aumente a se\u00e7\u00e3o ou a declividade.\");\n    else if(m.util>=state.settings.warnUtil/100)add(\"warn\",\"Galerias\",`${p.code}: utiliza\u00e7\u00e3o elevada`,`Q/Qcap = ${pct(m.util,1)}.`,\"Verifique margem, perdas e condi\u00e7\u00e3o de jusante.\");\n    else ok(\"Galerias\",`${p.code}: capacidade adequada`,`Q/Qcap = ${pct(m.util,1)}.`);\n    if(m.q>0&&m.velocity<state.settings.minV)add(\"warn\",\"Galerias\",`${p.code}: velocidade abaixo do crit\u00e9rio`,`V = ${fmt(m.velocity,2)} m/s; m\u00ednimo = ${fmt(state.settings.minV,2)} m/s.`,\"Avalie autolimpeza, declividade e opera\u00e7\u00e3o.\");\n    if(m.velocity>state.settings.maxV)add(\"danger\",\"Galerias\",`${p.code}: velocidade acima do crit\u00e9rio`,`V = ${fmt(m.velocity,2)} m/s; m\u00e1ximo = ${fmt(state.settings.maxV,2)} m/s.`,\"Avalie abras\u00e3o, dissipa\u00e7\u00e3o e material.\");\n    if(Number.isFinite(m.cover)&&m.cover<state.settings.minCover)add(\"danger\",\"Galerias\",`${p.code}: recobrimento insuficiente`,`Recobrimento m\u00ednimo calculado = ${fmt(m.cover,2)} m.`,\"Ajuste cotas, se\u00e7\u00e3o ou solu\u00e7\u00e3o estrutural.\");\n    if(hasNumber(p.invertUp)&&hasNumber(p.invertDown)&&asNumber(p.length)>0){\n      const sC=(asNumber(p.invertUp)-asNumber(p.invertDown))/asNumber(p.length);\n      if(Math.abs(sC-asNumber(p.slope))>Math.max(.0005,Math.abs(asNumber(p.slope))*.05))add(\"warn\",\"Cotas\",`${p.code}: declividade e cotas divergem`,`S informada = ${fmt(p.slope,5)}; S pelas cotas = ${fmt(sC,5)}.`,\"Compatibilize cotas e declividade.\");\n      else ok(\"Cotas\",`${p.code}: cotas compat\u00edveis`,`S pelas cotas = ${fmt(sC,5)}.`);\n    }\n    const downs=state.pipes.filter(d=>String(d.from)===String(p.to));\n    downs.forEach(d=>{\n      if(p.shape===\"circular\"&&d.shape===\"circular\"&&asNumber(d.diameter)<asNumber(p.diameter))\n        add(\"warn\",\"Galerias\",`${p.code} \u2192 ${d.code}: redu\u00e7\u00e3o de di\u00e2metro`,`DN ${fmt(p.diameter,0)} para DN ${fmt(d.diameter,0)} mm.`,\"Justifique hidraulicamente ou elimine a redu\u00e7\u00e3o a jusante.\");\n    });\n  });\n  if(networkCycles.length)add(\"danger\",\"Rede\",\"Ciclo hidr\u00e1ulico detectado\",`Trechos envolvidos: ${networkCycles.join(\", \")}.`,\"Corrija a conectividade para formar um sentido de escoamento ac\u00edclico.\");\n\n  state.structures.forEach(st=>{\n    const dep=asNumber(st.ground)-asNumber(st.invert),c=structureConnections(st);\n    if(dep<=0)add(\"danger\",\"Estruturas\",`${st.code}: profundidade inv\u00e1lida`,`Terreno = ${fmt(st.ground,2)} m; fundo = ${fmt(st.invert,2)} m.`,\"Corrija as cotas.\");\n    else ok(\"Estruturas\",`${st.code}: profundidade positiva`,`Profundidade = ${fmt(dep,2)} m.`);\n    if(!c.incoming.length&&!c.outgoing.length)add(\"warn\",\"Estruturas\",`${st.code}: estrutura desconectada`,\"Nenhum trecho usa este c\u00f3digo como n\u00f3.\",\"Associe a estrutura \u00e0 rede ou remova o cadastro.\");\n  });\n\n  state.channels.forEach(ch=>{\n    const m=channelMetrics(ch);\n    if(asNumber(ch.slope)<=0||asNumber(ch.n)<=0)add(\"danger\",\"Canais\",`${ch.code}: par\u00e2metros inv\u00e1lidos`,\"Declividade e rugosidade devem ser positivas.\",\"Revise os dados.\");\n    if(Number.isFinite(m.freeboard)&&m.freeboard<0)add(\"danger\",\"Canais\",`${ch.code}: transbordamento`,`Profundidade normal ${fmt(m.yn,3)} m excede a se\u00e7\u00e3o ${fmt(ch.designDepth,3)} m.`,\"Amplie a se\u00e7\u00e3o ou reduza a vaz\u00e3o.\");\n    else if(Number.isFinite(m.freeboard)&&m.freeboard<state.settings.minFreeboard)add(\"warn\",\"Canais\",`${ch.code}: bordo livre reduzido`,`Bordo livre = ${fmt(m.freeboard,2)} m.`,\"Aumente a profundidade total ou reveja o crit\u00e9rio.\");\n    else ok(\"Canais\",`${ch.code}: bordo livre verificado`,`Bordo livre = ${fmt(m.freeboard,2)} m.`);\n    if(m.V>asNumber(ch.maxV,state.settings.maxV))add(\"danger\",\"Canais\",`${ch.code}: velocidade excessiva`,`V = ${fmt(m.V,2)} m/s.`,\"Escolha revestimento compat\u00edvel ou dissipe energia.\");\n    if(asNumber(ch.tauAdmissible)>0&&m.tau>asNumber(ch.tauAdmissible))add(\"danger\",\"Canais\",`${ch.code}: tens\u00e3o trativa excessiva`,`\u03c4 = ${fmt(m.tau,1)} Pa; admiss\u00edvel = ${fmt(ch.tauAdmissible,1)} Pa.`,\"Reveja revestimento, declividade ou se\u00e7\u00e3o.\");\n  });\n  return list;\n}\nfunction renderChecks(){\n  const filter=$(\"checkFilter\")?.value||\"all\",term=($(\"checkSearch\")?.value||\"\").toLowerCase();\n  const view=lastChecks.filter(x=>(filter===\"all\"||x.level===filter)&&(`${x.category} ${x.title} ${x.detail}`.toLowerCase().includes(term)));\n  $(\"cTotal\").textContent=lastChecks.length;$(\"cOk\").textContent=lastChecks.filter(x=>x.level===\"ok\").length;\n  $(\"cWarn\").textContent=lastChecks.filter(x=>x.level===\"warn\").length;$(\"cDanger\").textContent=lastChecks.filter(x=>x.level===\"danger\").length;\n  $(\"checkList\").innerHTML=view.map(x=>`<div class=\"check-item ${x.level}\"><div class=\"check-icon\">${x.level===\"ok\"?\"\u2713\":x.level===\"warn\"?\"!\":\"\u00d7\"}<\u002Fdiv><div><b>${escapeHTML(x.title)}<\u002Fb><div>${escapeHTML(x.detail)}<\u002Fdiv>${x.suggestion?`<small class=\"muted\"><b style=\"display:inline\">Sugest\u00e3o:<\u002Fb> ${escapeHTML(x.suggestion)}<\u002Fsmall>`:\"\"}<\u002Fdiv><span class=\"badge ${x.level}\">${escapeHTML(x.category)}<\u002Fspan><\u002Fdiv>`).join(\"\")||'<div class=\"muted center\" style=\"padding:30px\">Nenhum item corresponde ao filtro.<\u002Fdiv>';\n}\n\n/* ===================== MEMORIAL E RELAT\u00d3RIO ===================== */\nfunction simpleTable(headers,rows){\n  return `<div class=\"table-wrap\"><table><thead><tr>${headers.map(h=>`<th>${escapeHTML(h)}<\u002Fth>`).join(\"\")}<\u002Ftr><\u002Fthead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}<\u002Ftd>`).join(\"\")}<\u002Ftr>`).join(\"\")}<\u002Ftbody><\u002Ftable><\u002Fdiv>`;\n}\nfunction memoryHTML(){\n  calculateNetworkFlows();\n  const basinRows=state.basins.map(b=>{const r=rationalForBasin(b);return [escapeHTML(b.code),fmt(r.area,3),fmt(r.C,3),fmt(r.tc,2),fmt(r.i,2),`<b>${fmt(r.q,4)}<\u002Fb>`]});\n  const gutterRows=state.gutters.map(g=>{const m=gutterMetrics(g);return [escapeHTML(g.code),fmt(m.q,4),fmt(m.cap,4),fmt(m.depth,3),fmt(m.spread,2),fmt(m.velocity,2),statusBadge(gutterLevel(g,m),labelForLevel(gutterLevel(g,m)))]});\n  const inletRows=state.inlets.map(x=>{const m=inletMetrics(x);return [escapeHTML(x.code),escapeHTML(x.type),fmt(m.q,4),fmt(m.cap,4),fmt(m.captured,4),fmt(m.residual,4),pct(m.eff,1)]});\n  const pipeRows=state.pipes.map(p=>{const m=p.metrics;return [escapeHTML(p.code),`${escapeHTML(p.from)} \u2192 ${escapeHTML(p.to)}`,fmt(p.qAccum,4),pipeDimLabel(p),fmt(p.slope,5),fmt(m.fill*100,1),fmt(m.velocity,2),fmt(m.cap,4),statusBadge(pipeLevel(p,m),labelForLevel(pipeLevel(p,m)))]});\n  const structureRows=state.structures.map(st=>[escapeHTML(st.code),escapeHTML(st.type),fmt(st.ground,2),fmt(st.invert,2),fmt(asNumber(st.ground)-asNumber(st.invert),2),fmt(st.k,2)]);\n  const channelRows=state.channels.map(ch=>{const m=channelMetrics(ch);return [escapeHTML(ch.code),escapeHTML(ch.shape),fmt(ch.q,4),fmt(m.yn,3),fmt(m.yc,3),fmt(m.V,2),fmt(m.Fr,2),m.regime,fmt(m.freeboard,2),statusBadge(channelLevel(ch,m),labelForLevel(channelLevel(ch,m)))]});\n  return `\n  <h1>Memorial de C\u00e1lculo \u2014 ${escapeHTML(state.project.name)}<\u002Fh1>\n  <p><b>Projeto:<\u002Fb> ${escapeHTML(state.project.code||\"\u2014\")} \u2022 <b>Vers\u00e3o:<\u002Fb> ${escapeHTML(state.project.version||\"\u2014\")} \u2022 <b>Data:<\u002Fb> ${formatDate(state.project.date)}<\u002Fp>\n  <h2>1. Identifica\u00e7\u00e3o e objetivo<\u002Fh2>\n  <p>${escapeHTML(state.project.description||\"O presente estudo realiza o pr\u00e9-dimensionamento hidrol\u00f3gico e hidr\u00e1ulico do sistema de drenagem urbana.\")}<\u002Fp>\n  <p><b>Local:<\u002Fb> ${escapeHTML([state.project.address,state.project.city,state.project.state].filter(Boolean).join(\", \")||\"N\u00e3o informado\")}<br>\n  <b>Respons\u00e1vel:<\u002Fb> ${escapeHTML(state.project.engineer||\"N\u00e3o informado\")} \u2014 ${escapeHTML(state.project.registry||\"registro n\u00e3o informado\")}<br>\n  <b>Contratante:<\u002Fb> ${escapeHTML(state.project.client||\"N\u00e3o informado\")}<\u002Fp>\n\n  <h2>2. Crit\u00e9rios pluviom\u00e9tricos<\u002Fh2>\n  <p>Foi empregada a forma configur\u00e1vel <b>i = K \u00d7 Tr\u1d43 / (t + b)\u1d9c<\u002Fb>, com intensidade em mm/h.<\u002Fp>\n  <div class=\"code\">K = ${fmt(state.idf.K,4)}\na = ${fmt(state.idf.a,4)}\nb = ${fmt(state.idf.b,4)}\nc = ${fmt(state.idf.c,4)}\nTr = ${fmt(state.idf.tr,2)} anos\nt de refer\u00eancia = ${fmt(state.idf.t,2)} min\ni = ${fmt(idfIntensity(),3)} mm/h = ${fmt(idfIntensity()/3.6,3)} L/s\u00b7ha<\u002Fdiv>\n  <p><b>Esta\u00e7\u00e3o/localidade:<\u002Fb> ${escapeHTML(state.idf.station||\"N\u00e3o informada\")}<br><b>Fonte:<\u002Fb> ${escapeHTML(state.idf.source||\"N\u00e3o registrada\")}<\u002Fp>\n\n  <h2>3. Bacias, coeficientes e tempo de concentra\u00e7\u00e3o<\u002Fh2>\n  <p>O coeficiente composto de cada bacia foi obtido por <b>C = \u03a3(C\u1d62A\u1d62) / \u03a3A\u1d62<\u002Fb>. O tempo de concentra\u00e7\u00e3o adotado controla a dura\u00e7\u00e3o aplicada \u00e0 IDF.<\u002Fp>\n  ${simpleTable([\"Bacia\",\"\u00c1rea (ha)\",\"C ponderado\",\"Tc (min)\",\"i (mm/h)\",\"Q (m\u00b3/s)\"],basinRows)}\n  ${state.basins.map(b=>{const r=rationalForBasin(b);return `<h3>${escapeHTML(b.code)} \u2014 ${escapeHTML(b.name||\"\")}<\u002Fh3>\n    <div class=\"code\">C = \u03a3(C\u1d62 \u00d7 A\u1d62) / \u03a3A\u1d62 = ${fmt(r.C,4)}\ni(${fmt(r.tc,2)} min; Tr ${fmt(state.idf.tr,1)} anos) = ${fmt(r.i,3)} mm/h\nQ = C \u00d7 i \u00d7 A / 360\nQ = ${fmt(r.C,4)} \u00d7 ${fmt(r.i,3)} \u00d7 ${fmt(r.area,4)} / 360\nQ = ${fmt(r.q,5)} m\u00b3/s = ${fmt(r.ls,2)} L/s<\u002Fdiv>\n    <p><b>M\u00e9todo de Tc:<\u002Fb> ${escapeHTML(b.tcMethod||\"entrada adotada\")} \u2022 <b>Justificativa:<\u002Fb> ${escapeHTML(b.tcJustification||\"n\u00e3o registrada\")}<\u002Fp>`}).join(\"\")}\n\n  <h2>4. Sarjetas<\u002Fh2>\n  <p>A capacidade foi determinada pela equa\u00e7\u00e3o de Manning, <b>Q = (1/n) A R^(2/3) S^(1/2)<\u002Fb>, com solu\u00e7\u00e3o iterativa da profundidade na se\u00e7\u00e3o triangular.<\u002Fp>\n  ${gutterRows.length?simpleTable([\"C\u00f3digo\",\"Q\",\"Capacidade\",\"y (m)\",\"T (m)\",\"V (m/s)\",\"Conclus\u00e3o\"],gutterRows):\"<p>Nenhuma sarjeta cadastrada.<\u002Fp>\"}\n\n  <h2>5. Bocas de lobo<\u002Fh2>\n  <p>As capacidades preliminares combinam rela\u00e7\u00f5es simplificadas de vertedouro e/ou orif\u00edcio, multiplicadas pela quantidade e reduzidas pela obstru\u00e7\u00e3o e pelo fator de seguran\u00e7a.<\u002Fp>\n  ${inletRows.length?simpleTable([\"C\u00f3digo\",\"Tipo\",\"Q afluente\",\"Capacidade\",\"Captada\",\"Residual\",\"Efici\u00eancia\"],inletRows):\"<p>Nenhuma boca de lobo cadastrada.<\u002Fp>\"}\n\n  <h2>6. Galerias e rede<\u002Fh2>\n  <p>As vaz\u00f5es s\u00e3o acumuladas dos trechos de montante para jusante. A capacidade no enchimento m\u00e1ximo configurado \u00e9 calculada por Manning. Para se\u00e7\u00e3o circular parcialmente cheia s\u00e3o usados \u00e1rea e per\u00edmetro do segmento circular.<\u002Fp>\n  ${pipeRows.length?simpleTable([\"Trecho\",\"N\u00f3s\",\"Q acum.\",\"Dimens\u00e3o\",\"S\",\"y/D (%)\",\"V\",\"Qcap.\",\"Conclus\u00e3o\"],pipeRows):\"<p>Nenhuma galeria cadastrada.<\u002Fp>\"}\n  ${state.pipes.map(p=>{const m=p.metrics;return `<h3>${escapeHTML(p.code)}<\u002Fh3><div class=\"code\">Q acumulada = ${fmt(p.qAccum,5)} m\u00b3/s\nSe\u00e7\u00e3o = ${pipeDimLabel(p)}\nS = ${fmt(p.slope,6)} m/m; n = ${fmt(p.n,4)}\nQcap (enchimento ${fmt(state.settings.maxFill,0)}%) = ${fmt(m.cap,5)} m\u00b3/s\ny = ${fmt(m.depth,4)} m; y/D = ${fmt(m.fill*100,2)}%\nV = Q/A = ${fmt(m.velocity,3)} m/s\nRecobrimento m\u00ednimo = ${fmt(m.cover,3)} m\nUtiliza\u00e7\u00e3o = ${fmt(m.util*100,2)}%<\u002Fdiv>`}).join(\"\")}\n\n  <h2>7. Po\u00e7os de visita e caixas<\u002Fh2>\n  ${structureRows.length?simpleTable([\"C\u00f3digo\",\"Tipo\",\"Terreno\",\"Fundo\",\"Profundidade\",\"K local\"],structureRows):\"<p>Nenhuma estrutura cadastrada.<\u002Fp>\"}\n\n  <h2>8. Canais<\u002Fh2>\n  <p>A profundidade normal \u00e9 obtida iterativamente por Manning. A profundidade cr\u00edtica satisfaz Fr = 1 e o regime \u00e9 classificado pelo n\u00famero de Froude.<\u002Fp>\n  ${channelRows.length?simpleTable([\"Canal\",\"Se\u00e7\u00e3o\",\"Q\",\"yn\",\"yc\",\"V\",\"Fr\",\"Regime\",\"Bordo livre\",\"Conclus\u00e3o\"],channelRows):\"<p>Nenhum canal cadastrado.<\u002Fp>\"}\n\n  <h2>9. Verifica\u00e7\u00f5es e conclus\u00e3o<\u002Fh2>\n  <p>Foram registrados <b>${lastChecks.filter(x=>x.level===\"danger\").length}<\u002Fb> itens cr\u00edticos, <b>${lastChecks.filter(x=>x.level===\"warn\").length}<\u002Fb> itens de aten\u00e7\u00e3o e <b>${lastChecks.filter(x=>x.level===\"ok\").length}<\u002Fb> verifica\u00e7\u00f5es adequadas.<\u002Fp>\n  ${lastChecks.filter(x=>x.level!==\"ok\").map(x=>`<div class=\"alert ${x.level}\"><b>${escapeHTML(x.category)} \u2014 ${escapeHTML(x.title)}<\u002Fb><small>${escapeHTML(x.detail)} ${escapeHTML(x.suggestion||\"\")}<\u002Fsmall><\u002Fdiv>`).join(\"\")||'<div class=\"alert ok\"><b>Sem ressalvas pelos crit\u00e9rios configurados.<\u002Fb><\u002Fdiv>'}\n  <p><b>Refer\u00eancia dos limites:<\u002Fb> ${escapeHTML(state.settings.criteriaSource||\"N\u00e3o informada\")}<\u002Fp>\n  <p><b>Nota t\u00e9cnica:<\u002Fb> Este memorial \u00e9 um apoio ao pr\u00e9-dimensionamento. Perdas localizadas, remanso, transientes, interfer\u00eancias, condi\u00e7\u00f5es de lan\u00e7amento, m\u00e9todo espec\u00edfico de capta\u00e7\u00e3o e crit\u00e9rios normativos locais devem ser verificados no projeto executivo.<\u002Fp>`;\n}\nfunction renderMemory(){$(\"memoryContent\").innerHTML=memoryHTML()}\nfunction memoryText(){\n  const d=document.createElement(\"div\");d.innerHTML=memoryHTML();return d.innerText.replace(/\\n{3,}/g,\"\\n\\n\");\n}\nfunction reportHeader(){\n  return `<div class=\"cover\"><div class=\"logo-water\">\u2248<\u002Fdiv><h1>DrenaPro<\u002Fh1><h2 style=\"border:0\">Relat\u00f3rio de Drenagem Urbana<\u002Fh2><h3>${escapeHTML(state.project.name)}<\u002Fh3><p>${escapeHTML(state.project.code||\"\")} \u2022 Vers\u00e3o ${escapeHTML(state.project.version||\"1.0\")}<\u002Fp><p>${escapeHTML([state.project.city,state.project.state].filter(Boolean).join(\" / \"))}<br>${formatDate(state.project.date)}<\u002Fp><div style=\"margin-top:80px\"><b>${escapeHTML(state.project.engineer||\"Respons\u00e1vel t\u00e9cnico n\u00e3o informado\")}<\u002Fb><br>${escapeHTML(state.project.registry||\"Registro n\u00e3o informado\")}<\u002Fdiv><\u002Fdiv>`;\n}\nfunction summaryHTML(){\n  const area=state.basins.reduce((s,b)=>s+basinArea(b),0),flow=state.pipes.length?Math.max(...state.pipes.map(p=>asNumber(p.qAccum))):state.basins.reduce((s,b)=>s+rationalForBasin(b).q,0);\n  return `<h2>Resumo executivo<\u002Fh2><p>O estudo contempla ${state.basins.length} bacia(s), \u00e1rea contribuinte de <b>${fmt(area,2)} ha<\u002Fb>, intensidade de refer\u00eancia de <b>${fmt(idfIntensity(),2)} mm/h<\u002Fb> e vaz\u00e3o m\u00e1xima acumulada de <b>${fmt(flow,4)} m\u00b3/s<\u002Fb>.<\u002Fp>\n  <div class=\"grid g4\"><div class=\"result\"><small>Bacias<\u002Fsmall><div class=\"big\">${state.basins.length}<\u002Fdiv><\u002Fdiv><div class=\"result\"><small>Galerias<\u002Fsmall><div class=\"big\">${state.pipes.length}<\u002Fdiv><\u002Fdiv><div class=\"result\"><small>Cr\u00edticos<\u002Fsmall><div class=\"big\">${lastChecks.filter(x=>x.level===\"danger\").length}<\u002Fdiv><\u002Fdiv><div class=\"result\"><small>Aten\u00e7\u00e3o<\u002Fsmall><div class=\"big\">${lastChecks.filter(x=>x.level===\"warn\").length}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <h2>Conclus\u00e3o preliminar<\u002Fh2><p>${lastChecks.some(x=>x.level===\"danger\")?\"Existem itens cr\u00edticos que devem ser corrigidos antes da consolida\u00e7\u00e3o do projeto.\":\"Os elementos cadastrados n\u00e3o apresentam insufici\u00eancias cr\u00edticas segundo os crit\u00e9rios configurados; permanecem necess\u00e1rias a valida\u00e7\u00e3o profissional e a confer\u00eancia das refer\u00eancias locais.\"}<\u002Fp>`;\n}\nfunction tablesHTML(){\n  const b=state.basins.map(x=>{const r=rationalForBasin(x);return [escapeHTML(x.code),fmt(r.area,3),fmt(r.C,3),fmt(r.tc,2),fmt(r.i,2),fmt(r.q,4)]});\n  const p=state.pipes.map(x=>[escapeHTML(x.code),escapeHTML(x.from),escapeHTML(x.to),fmt(x.qAccum,4),pipeDimLabel(x),fmt(x.slope,5),fmt(x.metrics?.velocity,2),fmt(x.metrics?.util*100,1)]);\n  return `<h2>Tabelas de s\u00edntese<\u002Fh2>${simpleTable([\"Bacia\",\"\u00c1rea\",\"C\",\"Tc\",\"i\",\"Q\"],b)}<h3>Galerias<\u002Fh3>${simpleTable([\"Trecho\",\"Montante\",\"Jusante\",\"Q\",\"Dimens\u00e3o\",\"S\",\"V\",\"Util. (%)\"],p)}`;\n}\nfunction renderReport(){\n  if(!$(\"reportContent\"))return;\n  lastChecks=getChecks();\n  const mode=$(\"reportMode\")?.value||\"complete\";\n  let body=reportHeader();\n  if(mode===\"summary\")body+=summaryHTML();\n  else if(mode===\"memory\")body+=`<div class=\"page-break\">${memoryHTML()}<\u002Fdiv>`;\n  else if(mode===\"tables\")body+=tablesHTML();\n  else if(mode===\"critical\")body+=`<h2>Itens cr\u00edticos<\u002Fh2>${lastChecks.filter(x=>x.level===\"danger\").map(x=>`<div class=\"alert danger\"><b>${escapeHTML(x.category)} \u2014 ${escapeHTML(x.title)}<\u002Fb><p>${escapeHTML(x.detail)}<\u002Fp><small>${escapeHTML(x.suggestion)}<\u002Fsmall><\u002Fdiv>`).join(\"\")||\"<p>Nenhum item cr\u00edtico.<\u002Fp>\"}`;\n  else body+=`${summaryHTML()}<div class=\"page-break\">${memoryHTML()}<\u002Fdiv>`;\n  body+=`<hr style=\"margin-top:50px\"><p class=\"center\"><small>Relat\u00f3rio gerado pelo DrenaPro em ${new Date().toLocaleString(\"pt-BR\")}. Crit\u00e9rios e resultados sujeitos \u00e0 valida\u00e7\u00e3o t\u00e9cnica.<\u002Fsmall><\u002Fp>`;\n  $(\"reportContent\").innerHTML=body;\n}\nfunction buildAllCSV(){\n  const rows=[],section=(name,headers,data)=>{rows.push([name]);rows.push(headers);data.forEach(r=>rows.push(r));rows.push([])};\n  section(\"DADOS GERAIS\",[\"Campo\",\"Valor\"],Object.entries(state.project).map(([k,v])=>[k,v]));\n  section(\"IDF\",[\"K\",\"a\",\"b\",\"c\",\"Tr (anos)\",\"t (min)\",\"i (mm/h)\",\"Fonte\"],[[state.idf.K,state.idf.a,state.idf.b,state.idf.c,state.idf.tr,state.idf.t,idfIntensity(),state.idf.source]]);\n  section(\"BACIAS\",[\"C\u00f3digo\",\"Nome\",\"\u00c1rea (ha)\",\"C\",\"Tc (min)\",\"i (mm/h)\",\"Q (m\u00b3/s)\",\"Trecho\"],state.basins.map(b=>{const r=rationalForBasin(b);return [b.code,b.name,r.area,r.C,r.tc,r.i,r.q,b.outlet]}));\n  section(\"SUPERF\u00cdCIES\",[\"Bacia\",\"Tipo\",\"\u00c1rea (ha)\",\"C\"],state.basins.flatMap(b=>(b.surfaces||[]).map(s=>[b.code,s.type,s.area,s.c])));\n  section(\"SARJETAS\",[\"C\u00f3digo\",\"Q\",\"Capacidade\",\"Profundidade\",\"Espalhamento\",\"Velocidade\"],state.gutters.map(g=>{const m=gutterMetrics(g);return [g.code,m.q,m.cap,m.depth,m.spread,m.velocity]}));\n  section(\"BOCAS DE LOBO\",[\"C\u00f3digo\",\"Tipo\",\"Q\",\"Capacidade\",\"Captada\",\"Residual\",\"Efici\u00eancia\"],state.inlets.map(x=>{const m=inletMetrics(x);return [x.code,x.type,m.q,m.cap,m.captured,m.residual,m.eff]}));\n  section(\"GALERIAS\",[\"Trecho\",\"De\",\"Para\",\"Q local\",\"Q acumulada\",\"Se\u00e7\u00e3o\",\"Dimens\u00e3o\",\"S\",\"n\",\"L\",\"y/D\",\"V\",\"Capacidade\",\"Recobrimento\"],state.pipes.map(p=>[p.code,p.from,p.to,p.qLocal,p.qAccum,p.shape,pipeDimLabel(p),p.slope,p.n,p.length,p.metrics?.fill,p.metrics?.velocity,p.metrics?.cap,p.metrics?.cover]));\n  section(\"ESTRUTURAS\",[\"C\u00f3digo\",\"Tipo\",\"Terreno\",\"Fundo\",\"Profundidade\",\"K\"],state.structures.map(s=>[s.code,s.type,s.ground,s.invert,asNumber(s.ground)-asNumber(s.invert),s.k]));\n  section(\"CANAIS\",[\"C\u00f3digo\",\"Se\u00e7\u00e3o\",\"Q\",\"yn\",\"yc\",\"V\",\"Fr\",\"Regime\",\"Bordo livre\"],state.channels.map(ch=>{const m=channelMetrics(ch);return [ch.code,ch.shape,ch.q,m.yn,m.yc,m.V,m.Fr,m.regime,m.freeboard]}));\n  section(\"ALERTAS\",[\"N\u00edvel\",\"Categoria\",\"T\u00edtulo\",\"Detalhe\",\"Sugest\u00e3o\"],lastChecks.map(x=>[x.level,x.category,x.title,x.detail,x.suggestion]));\n  return \"\\ufeff\"+rows.map(r=>r.map(csvCell).join(\";\")).join(\"\\r\\n\");\n}\n\n/* ===================== GR\u00c1FICOS EM CANVAS ===================== */\nfunction prepareCanvas(canvas){\n  if(!canvas)return null;\n  const rect=canvas.getBoundingClientRect(),w=Math.max(320,Math.round(rect.width||800)),h=Math.max(220,Math.round(rect.height||280)),dpr=Math.min(2,window.devicePixelRatio||1);\n  canvas.width=w*dpr;canvas.height=h*dpr;const ctx=canvas.getContext(\"2d\");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);\n  const cs=getComputedStyle(document.documentElement);\n  return {ctx,w,h,text:cs.getPropertyValue(\"--text\").trim(),muted:cs.getPropertyValue(\"--muted\").trim(),line:cs.getPropertyValue(\"--line\").trim(),surface:cs.getPropertyValue(\"--surface\").trim(),primary:cs.getPropertyValue(\"--primary\").trim(),ok:cs.getPropertyValue(\"--ok\").trim(),warn:cs.getPropertyValue(\"--warn\").trim(),danger:cs.getPropertyValue(\"--danger\").trim()};\n}\nfunction drawEmpty(c,msg){const {ctx,w,h,muted}=c;ctx.fillStyle=muted;ctx.font=\"13px system-ui\";ctx.textAlign=\"center\";ctx.fillText(msg,w/2,h/2)}\nfunction drawIdfChart(){\n  const c=prepareCanvas($(\"idfChart\"));if(!c)return;const {ctx,w,h,text,muted,line}=c;\n  const durations=[5,10,15,20,30,45,60,90,120,180],periods=[2,5,10,25,50,100],colors=[\"#0077b6\",\"#00a896\",\"#ffb703\",\"#f77f00\",\"#d62828\",\"#8338ec\"];\n  const vals=periods.flatMap(T=>durations.map(t=>idfIntensity(t,T))),max=Math.max(...vals.filter(Number.isFinite),1);\n  const pad={l:55,r:18,t:20,b:42},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  ctx.strokeStyle=line;ctx.lineWidth=1;ctx.fillStyle=muted;ctx.font=\"11px system-ui\";ctx.textAlign=\"right\";\n  for(let j=0;j<=5;j++){const y=pad.t+ph*j/5,v=max*(1-j/5);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(fmt(v,0),pad.l-7,y+4)}\n  ctx.textAlign=\"center\";durations.forEach((t,i)=>{const x=pad.l+pw*i/(durations.length-1);ctx.fillText(String(t),x,h-17)});\n  periods.forEach((T,k)=>{ctx.strokeStyle=colors[k];ctx.lineWidth=T===state.idf.tr?3:1.7;ctx.beginPath();durations.forEach((t,i)=>{const x=pad.l+pw*i/(durations.length-1),y=pad.t+ph*(1-idfIntensity(t,T)/max);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});\n  ctx.fillStyle=text;ctx.font=\"12px system-ui\";ctx.fillText(\"Dura\u00e7\u00e3o (min)\",pad.l+pw/2,h-2);ctx.save();ctx.translate(13,pad.t+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText(\"Intensidade (mm/h)\",0,0);ctx.restore();\n  $(\"idfLegend\").innerHTML=periods.map((T,k)=>`<span><i style=\"background:${colors[k]}\"><\u002Fi>Tr ${T} anos<\u002Fspan>`).join(\"\");\n}\nfunction drawBasinChart(){\n  const c=prepareCanvas($(\"basinChart\"));if(!c)return;if(!state.basins.length){drawEmpty(c,\"Cadastre bacias para visualizar as \u00e1reas.\");return}\n  const {ctx,w,h,text,muted,line,primary}=c,pad={l:52,r:18,t:20,b:48},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;\n  const data=state.basins.map(b=>({label:b.code,value:basinArea(b)})),max=Math.max(...data.map(x=>x.value),.01);\n  ctx.strokeStyle=line;ctx.fillStyle=muted;ctx.font=\"11px system-ui\";ctx.textAlign=\"right\";\n  for(let j=0;j<=4;j++){const y=pad.t+ph*j/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(fmt(max*(1-j/4),2),pad.l-6,y+4)}\n  const slot=pw/data.length,bw=Math.min(70,slot*.62);\n  data.forEach((d,i)=>{const bh=ph*d.value/max,x=pad.l+slot*i+(slot-bw)/2,y=pad.t+ph-bh;ctx.fillStyle=primary;ctx.fillRect(x,y,bw,bh);ctx.fillStyle=text;ctx.textAlign=\"center\";ctx.fillText(d.label,x+bw/2,h-25);ctx.fillText(fmt(d.value,2),x+bw/2,y-5)});\n  ctx.save();ctx.translate(13,pad.t+ph/2);ctx.rotate(-Math.PI/2);ctx.fillStyle=text;ctx.fillText(\"\u00c1rea (ha)\",0,0);ctx.restore();\n}\nfunction drawNetwork(){\n  const c=prepareCanvas($(\"networkChart\") escription:\"Compare m\u00e9todos, selecione o resultado tecnicamente aplic\u00e1vel e justifique a escolha.\",checklist:[\"Selecione a bacia.\",\"Confira L, S, \u00e1rea, C, velocidade e K do DNOS.\",\"Calcule os m\u00e9todos dispon\u00edveis.\",\"Analise a faixa de aplica\u00e7\u00e3o.\",\"Selecione, justifique e aplique o Tc.\"],tip:\"O Tc controla a dura\u00e7\u00e3o usada na IDF de cada bacia; adot\u00e1-lo sem justificativa pode superestimar ou subestimar a vaz\u00e3o.\"},\n  {page:\"rational\",title:\"Calcule as vaz\u00f5es de projeto\",description:\"Revise Q = C \u00d7 i \u00d7 A \u00f7 360 e teste cen\u00e1rios alternativos.\",checklist:[\"Recalcule todas as bacias.\",\"Confira \u00e1rea, C, Tc e intensidade.\",\"Verifique a substitui\u00e7\u00e3o num\u00e9rica.\",\"Teste impermeabiliza\u00e7\u00e3o e Tr alternativo.\",\"Defina o cen\u00e1rio que orientar\u00e1 o dimensionamento.\"],tip:\"A tabela permite rastrear cada parcela do c\u00e1lculo e identificar rapidamente qual par\u00e2metro explica uma vaz\u00e3o inesperada.\"},\n  {page:\"gutters\",title:\"Dimensione as sarjetas\",description:\"Verifique condu\u00e7\u00e3o superficial, espalhamento, profundidade e velocidade.\",checklist:[\"Informe a vaz\u00e3o afluente.\",\"Cadastre declividades longitudinal e transversal.\",\"Defina n de Manning.\",\"Informe profundidade e espalhamento admiss\u00edveis.\",\"Revise capacidade, velocidade e situa\u00e7\u00e3o.\"],tip:\"Uma sarjeta pode ter capacidade hidr\u00e1ulica e ainda ser inadequada por espalhamento excessivo ou velocidade incompat\u00edvel.\"},\n  {page:\"inlets\",title:\"Dimensione as bocas de lobo\",description:\"Estime a capta\u00e7\u00e3o com geometria, carga, quantidade e obstru\u00e7\u00e3o realistas.\",checklist:[\"Selecione o tipo de dispositivo.\",\"Informe dimens\u00f5es e carga hidr\u00e1ulica.\",\"Adote cen\u00e1rio de obstru\u00e7\u00e3o.\",\"Confira capacidade, efici\u00eancia e residual.\",\"Redimensione ou acrescente unidades quando necess\u00e1rio.\"],tip:\"A vaz\u00e3o residual precisa seguir para outra capta\u00e7\u00e3o ou dispositivo; ignor\u00e1-la quebra a continuidade do escoamento superficial.\"},\n  {page:\"pipes\",title:\"Cadastre e dimensione as galerias\",description:\"Modele os trechos, suas se\u00e7\u00f5es, cotas e condi\u00e7\u00f5es hidr\u00e1ulicas.\",checklist:[\"Informe c\u00f3digos e n\u00f3s De/Para.\",\"Cadastre se\u00e7\u00e3o, dimens\u00e3o, S, n e comprimento.\",\"Preencha cotas de terreno e fundo.\",\"Execute o dimensionamento autom\u00e1tico, se aplic\u00e1vel.\",\"Revise y/D, velocidade, capacidade e recobrimento.\"],tip:\"A conectividade define a acumula\u00e7\u00e3o das vaz\u00f5es. C\u00f3digos inconsistentes podem produzir trechos sem contribui\u00e7\u00e3o ou uma rede incorreta.\"},\n  {page:\"structures\",title:\"Compatibilize po\u00e7os e caixas\",description:\"Cadastre os n\u00f3s f\u00edsicos da rede e verifique profundidades e conex\u00f5es.\",checklist:[\"Use c\u00f3digos iguais aos n\u00f3s das galerias.\",\"Selecione o tipo de estrutura.\",\"Informe terreno, fundo e dimens\u00f5es.\",\"Registre o coeficiente K.\",\"Revise entradas, sa\u00eddas e estruturas desconectadas.\"],tip:\"As perdas localizadas, mudan\u00e7as de dire\u00e7\u00e3o e quedas podem ser relevantes mesmo quando a capacidade do tubo \u00e9 suficiente.\"},\n  {page:\"channels\",title:\"Verifique os canais abertos\",description:\"Calcule profundidade normal e cr\u00edtica, regime, bordo livre e tens\u00e3o trativa.\",checklist:[\"Escolha a geometria da se\u00e7\u00e3o.\",\"Informe Q, b, z, S e n.\",\"Defina profundidade total e limites.\",\"Confira yn, yc, V e Fr.\",\"Valide bordo livre e revestimento.\"],tip:\"Regime supercr\u00edtico, tens\u00e3o elevada ou bordo livre pequeno exigem an\u00e1lise de transi\u00e7\u00f5es, prote\u00e7\u00e3o e dissipa\u00e7\u00e3o de energia.\"},\n  {page:\"network\",title:\"Recalcule e leia a rede integrada\",description:\"Acumule as vaz\u00f5es por conectividade e examine topologia e perfil longitudinal.\",checklist:[\"Confirme as associa\u00e7\u00f5es das bacias.\",\"Recalcule a rede.\",\"Examine o diagrama topol\u00f3gico.\",\"Selecione percursos no perfil.\",\"Corrija ciclos, desconex\u00f5es e cotas incoerentes.\"],tip:\"A visualiza\u00e7\u00e3o integrada revela problemas que n\u00e3o aparecem quando os trechos s\u00e3o avaliados isoladamente.\"},\n  {page:\"checks\",title:\"Resolva as verifica\u00e7\u00f5es\",description:\"Fa\u00e7a a revis\u00e3o sistem\u00e1tica dos dados e resultados antes de emitir documentos.\",checklist:[\"Atualize as verifica\u00e7\u00f5es.\",\"Filtre os itens cr\u00edticos.\",\"Corrija as causas, n\u00e3o apenas os sintomas.\",\"Revise os itens de aten\u00e7\u00e3o.\",\"Exporte o CSV da checagem.\"],tip:\"Um relat\u00f3rio sem alertas cr\u00edticos \u00e9 apenas um marco de revis\u00e3o; ainda s\u00e3o necess\u00e1rias valida\u00e7\u00e3o t\u00e9cnica e confer\u00eancia das premissas.\"},\n  {page:\"memory\",title:\"Revise o memorial de c\u00e1lculo\",description:\"Confira f\u00f3rmulas, substitui\u00e7\u00f5es, fontes e conclus\u00f5es geradas automaticamente.\",checklist:[\"Leia a identifica\u00e7\u00e3o e os crit\u00e9rios pluviom\u00e9tricos.\",\"Confira C, Tc, i e Q por bacia.\",\"Revise dispositivos, galerias e canais.\",\"Verifique alertas e refer\u00eancia dos limites.\",\"Copie ou baixe o texto, se necess\u00e1rio.\"],tip:\"O memorial mostra como o resultado foi obtido. Use-o para localizar premissas ausentes antes de montar o relat\u00f3rio final.\"},\n  {page:\"report\",title:\"Emita e confira o relat\u00f3rio\",description:\"Escolha a abrang\u00eancia, atualize o documento e use a impress\u00e3o do navegador para gerar PDF.\",checklist:[\"Escolha o modo do relat\u00f3rio.\",\"Pressione Atualizar.\",\"Revise capa, resumo, tabelas e alertas.\",\"Exporte os dados em CSV.\",\"Imprima ou salve em PDF e fa\u00e7a a confer\u00eancia final.\"],tip:\"O relat\u00f3rio precisa ser complementado por pe\u00e7as gr\u00e1ficas, especifica\u00e7\u00f5es e assinatura profissional conforme o escopo do projeto.\"},\n  {page:\"saved\",title:\"Salve e fa\u00e7a c\u00f3pia de seguran\u00e7a\",description:\"Preserve o projeto na biblioteca local e mantenha um arquivo JSON externo.\",checklist:[\"Salve o projeto na biblioteca.\",\"Exporte o JSON do projeto.\",\"Exporte a biblioteca completa periodicamente.\",\"Duplique antes de testar cen\u00e1rios.\",\"Teste a importa\u00e7\u00e3o do backup quando conveniente.\"],tip:\"O armazenamento local pode ser apagado pelo navegador. O JSON externo \u00e9 a c\u00f3pia port\u00e1til e independente do computador atual.\"}\n];\nlet manualStepIndex=0;\nfunction manualProgress(){\n  try{\n    const raw=JSON.parse(safeStorage.getItem(MANUAL_PROGRESS_KEY)||\"[]\");\n    return MANUAL_STEPS.map((_,i)=>Boolean(raw[i]));\n  }catch{return MANUAL_STEPS.map(()=>false)}\n}\nfunction saveManualProgress(progress){safeStorage.setItem(MANUAL_PROGRESS_KEY,JSON.stringify(progress))}\nfunction manualPageLabel(page){return PAGE_INFO[page]?.[0]||page}\nfunction renderManual(){\n  if(!$(\"manualStepList\"))return;\n  manualStepIndex=clamp(manualStepIndex,0,MANUAL_STEPS.length-1);\n  const progress=manualProgress(),done=progress.filter(Boolean).length,percent=MANUAL_STEPS.length?done/MANUAL_STEPS.length*100:0;\n  $(\"manualHeroProgress\").textContent=`${fmt(percent,0)}%`;\n  $(\"manualHeroBar\").style.width=`${percent}%`;\n  $(\"manualHeroCaption\").textContent=`${done} de ${MANUAL_STEPS.length} etapas conclu\u00eddas`;\n  $(\"manualStepList\").innerHTML=MANUAL_STEPS.map((step,i)=>`<button class=\"manual-step-row ${i===manualStepIndex?\"active\":\"\"} ${progress[i]?\"done\":\"\"}\" data-manual-step=\"${i}\" title=\"Ver instru\u00e7\u00f5es desta etapa\"><span class=\"manual-step-number\">${progress[i]?\"\u2713\":i+1}<\u002Fspan><span><b>${escapeHTML(step.title)}<\u002Fb><small>${escapeHTML(manualPageLabel(step.page))}<\u002Fsmall><\u002Fspan><
