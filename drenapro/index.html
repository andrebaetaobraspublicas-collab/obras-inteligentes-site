Fspan><\u002Fbutton>\n    <button class=\"icon-btn\" id=\"themeBtn\" title=\"Alternar tema\">\u25d0<\u002Fbutton>\n    <button class=\"btn primary\" id=\"topSaveBtn\">Salvar projeto<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"content\">\n<section class=\"section active\" id=\"sec-dashboard\">\n  <div class=\"hero\">\n    <div>\n      <div class=\"badge\" style=\"background:rgba(255,255,255,.16);color:#fff\">Aplica\u00e7\u00e3o offline \u2022 arquivo \u00fanico<\u002Fdiv>\n      <h2>Dimensionamento hidrol\u00f3gico e hidr\u00e1ulico em um fluxo integrado.<\u002Fh2>\n      <p>Cadastre as bacias, determine a chuva de projeto, dimensione dispositivos e gere um memorial audit\u00e1vel com f\u00f3rmulas, unidades e verifica\u00e7\u00f5es autom\u00e1ticas.<\u002Fp>\n      <div class=\"actions mt\"><button class=\"btn\" data-go=\"project\">Come\u00e7ar projeto<\u002Fbutton><button class=\"btn ghost\" style=\"color:#fff;border-color:rgba(255,255,255,.5)\" id=\"dashSample\">Carregar exemplo<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hero-side\">\n      <div style=\"display:flex;justify-content:space-between\"><b>Completude do estudo<\u002Fb><b id=\"completionPct\">0%<\u002Fb><\u002Fdiv>\n      <div class=\"progress mt\"><i id=\"completionBar\"><\u002Fi><\u002Fdiv>\n      <div id=\"completionSteps\" class=\"step-list mt\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"grid g5 mt\">\n    <div class=\"metric\"><small>\u00c1rea contribuinte<\u002Fsmall><strong id=\"mArea\">0,00 ha<\u002Fstrong><span>Soma das bacias<\u002Fspan><\u002Fdiv>\n    <div class=\"metric\"><small>Vaz\u00e3o de pico<\u002Fsmall><strong id=\"mFlow\">0,000 m\u00b3/s<\u002Fstrong><span>Maior vaz\u00e3o acumulada<\u002Fspan><\u002Fdiv>\n    <div class=\"metric\"><small>Galerias<\u002Fsmall><strong id=\"mPipe\">0 m<\u002Fstrong><span>Extens\u00e3o cadastrada<\u002Fspan><\u002Fdiv>\n    <div class=\"metric\"><small>Dispositivos<\u002Fsmall><strong id=\"mDevices\">0<\u002Fstrong><span>Sarjetas, capta\u00e7\u00f5es e estruturas<\u002Fspan><\u002Fdiv>\n    <div class=\"metric\"><small>Alertas cr\u00edticos<\u002Fsmall><strong id=\"mCritical\">0<\u002Fstrong><span>Requerem revis\u00e3o<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"grid g2 mt\">\n    <div class=\"card\"><div class=\"card-head\"><h3>Distribui\u00e7\u00e3o das \u00e1reas<\u002Fh3><span class=\"badge info\">Bacias<\u002Fspan><\u002Fdiv><canvas id=\"basinChart\" class=\"chart\"><\u002Fcanvas><\u002Fdiv>\n    <div class=\"card\"><div class=\"card-head\"><h3>Resumo de consist\u00eancia<\u002Fh3><button class=\"btn small\" data-go=\"checks\">Abrir verifica\u00e7\u00f5es<\u002Fbutton><\u002Fdiv><div id=\"dashboardChecks\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-project\">\n  <div class=\"page-head\"><div><h2>Dados do projeto<\u002Fh2><p>Informa\u00e7\u00f5es de identifica\u00e7\u00e3o, localiza\u00e7\u00e3o, respons\u00e1vel e crit\u00e9rios gerais do estudo.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn\" id=\"duplicateProject\">Duplicar<\u002Fbutton><button class=\"btn primary\" id=\"saveProjectForm\">Aplicar dados<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\">\n    <div class=\"form-grid\">\n      <div class=\"field span2\"><label>Nome do projeto *<\u002Flabel><input id=\"pName\" placeholder=\"Ex.: Microdrenagem do Loteamento Primavera\"><\u002Fdiv>\n      <div class=\"field\"><label>C\u00f3digo<\u002Flabel><input id=\"pCode\" placeholder=\"DRN-001\"><\u002Fdiv>\n      <div class=\"field\"><label>Vers\u00e3o<\u002Flabel><input id=\"pVersion\" placeholder=\"1.0\"><\u002Fdiv>\n      <div class=\"field\"><label>Respons\u00e1vel t\u00e9cnico<\u002Flabel><input id=\"pEngineer\"><\u002Fdiv>\n      <div class=\"field\"><label>Registro profissional<\u002Flabel><input id=\"pRegistry\"><\u002Fdiv>\n      <div class=\"field\"><label>Contratante<\u002Flabel><input id=\"pClient\"><\u002Fdiv>\n      <div class=\"field\"><label>Data do estudo<\u002Flabel><input type=\"date\" id=\"pDate\"><\u002Fdiv>\n      <div class=\"field\"><label>Munic\u00edpio<\u002Flabel><input id=\"pCity\"><\u002Fdiv>\n      <div class=\"field\"><label>Estado<\u002Flabel><input id=\"pState\" maxlength=\"2\" placeholder=\"UF\"><\u002Fdiv>\n      <div class=\"field span2\"><label>Endere\u00e7o/localiza\u00e7\u00e3o<\u002Flabel><input id=\"pAddress\"><\u002Fdiv>\n      <div class=\"field\"><label>Tipo de ocupa\u00e7\u00e3o<\u002Flabel><select id=\"pOccupation\"><option>Residencial<\u002Foption><option>Comercial<\u002Foption><option>Industrial<\u002Foption><option>Mista<\u002Foption><option>Vi\u00e1ria<\u002Foption><option>Outro<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"field\"><label>Sistema de coordenadas<\u002Flabel><input id=\"pCrs\" placeholder=\"SIRGAS 2000 / UTM\"><\u002Fdiv>\n      <div class=\"field span2\"><label>Descri\u00e7\u00e3o<\u002Flabel><textarea id=\"pDescription\"><\u002Ftextarea><\u002Fdiv>\n      <div class=\"field span2\"><label>Observa\u00e7\u00f5es gerais<\u002Flabel><textarea id=\"pNotes\"><\u002Ftextarea><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"alert warn mt\"><b>Responsabilidade t\u00e9cnica<\u002Fb><small>Os resultados s\u00e3o de apoio ao pr\u00e9-dimensionamento. A sele\u00e7\u00e3o de crit\u00e9rios, dados pluviom\u00e9tricos e faixas admiss\u00edveis deve ser validada pelo profissional habilitado e pelo \u00f3rg\u00e3o competente.<\u002Fsmall><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-saved\">\n  <div class=\"page-head\"><div><h2>Projetos salvos<\u002Fh2><p>Biblioteca local armazenada neste navegador. Exporte JSON para criar uma c\u00f3pia externa.<\u002Fp><\u002Fdiv><div class=\"actions\"><label class=\"btn\" for=\"jsonImport\">Importar JSON<\u002Flabel><input class=\"hidden\" type=\"file\" accept=\".json,application/json\" id=\"jsonImport\"><button class=\"btn primary\" id=\"saveSnapshot\">Salvar vers\u00e3o atual<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><div id=\"savedProjects\"><\u002Fdiv><\u002Fdiv>\n  <div class=\"card mt\"><h3>C\u00f3pia de seguran\u00e7a<\u002Fh3><div class=\"grid g3\"><button class=\"btn full\" id=\"backupAll\">Exportar biblioteca completa<\u002Fbutton><button class=\"btn full\" id=\"restoreLast\">Restaurar \u00faltimo autosave<\u002Fbutton><button class=\"btn danger full\" id=\"clearLibrary\">Excluir biblioteca local<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-idf\">\n  <div class=\"page-head\"><div><h2>Chuva de projeto e equa\u00e7\u00e3o IDF<\u002Fh2><p>Equa\u00e7\u00e3o gen\u00e9rica configur\u00e1vel: i = K \u00d7 Tr\u1d43 \u00f7 (t + b)\u1d9c. Registre sempre a fonte dos par\u00e2metros locais.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn\" id=\"idfCompare\">Comparar per\u00edodos<\u002Fbutton><button class=\"btn primary\" id=\"applyIdf\">Aplicar IDF<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h3>Par\u00e2metros<\u002Fh3>\n      <div class=\"form-grid\">\n        <div class=\"field\"><label>K<\u002Flabel><input type=\"number\" step=\"any\" id=\"idfK\"><\u002Fdiv>\n        <div class=\"field\"><label>Expoente a<\u002Flabel><input type=\"number\" step=\"any\" id=\"idfA\"><\u002Fdiv>\n        <div class=\"field\"><label>Par\u00e2metro b<\u002Flabel><input type=\"number\" step=\"any\" id=\"idfB\"><\u002Fdiv>\n        <div class=\"field\"><label>Expoente c<\u002Flabel><input type=\"number\" step=\"any\" id=\"idfC\"><\u002Fdiv>\n        <div class=\"field\"><label>Per\u00edodo de retorno<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" min=\"0.1\" id=\"idfTr\"><span>anos<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><label>Dura\u00e7\u00e3o da chuva<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" min=\"0.1\" id=\"idfT\"><span>min<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"field span2\"><label>Munic\u00edpio / esta\u00e7\u00e3o<\u002Flabel><input id=\"idfStation\" placeholder=\"Identifica\u00e7\u00e3o da equa\u00e7\u00e3o\"><\u002Fdiv>\n        <div class=\"field span4\"><label>Fonte e refer\u00eancia<\u002Flabel><textarea id=\"idfSource\" placeholder=\"Publica\u00e7\u00e3o, autor, ano, \u00f3rg\u00e3o, esta\u00e7\u00e3o e per\u00edodo de dados\"><\u002Ftextarea><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"result mt\" id=\"idfResult\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\"><div class=\"card-head\"><h3>Curvas intensidade \u00d7 dura\u00e7\u00e3o<\u002Fh3><button class=\"btn small\" id=\"downloadIdfChart\">Exportar imagem<\u002Fbutton><\u002Fdiv><canvas class=\"chart\" id=\"idfChart\"><\u002Fcanvas><div class=\"legend mt\" id=\"idfLegend\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card mt\"><h3>Crit\u00e9rios orientativos<\u002Fh3><div class=\"grid g3\"><div class=\"alert\"><b>Per\u00edodo de retorno<\u002Fb><small>Defina por criticidade, uso da via, consequ\u00eancias da falha e diretriz local.<\u002Fsmall><\u002Fdiv><div class=\"alert\"><b>Dura\u00e7\u00e3o<\u002Fb><small>No M\u00e9todo Racional, a dura\u00e7\u00e3o de c\u00e1lculo costuma ser associada ao tempo de concentra\u00e7\u00e3o adotado.<\u002Fsmall><\u002Fdiv><div class=\"alert\"><b>Unidades<\u002Fb><small>O resultado \u00e9 apresentado em mm/h e convertido para L/s\u00b7ha por divis\u00e3o por 3,6.<\u002Fsmall><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-basins\">\n  <div class=\"page-head\"><div><h2>Bacias e superf\u00edcies<\u002Fh2><p>Cadastre sub-bacias e decomponha cada uma em superf\u00edcies para obter o coeficiente de escoamento ponderado.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn primary\" id=\"addBasin\">+ Nova bacia<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\">\n    <div class=\"table-wrap\"><table><thead><tr><th>C\u00f3digo<\u002Fth><th>Nome<\u002Fth><th>\u00c1rea (ha)<\u002Fth><th>C ponderado<\u002Fth><th>L (m)<\u002Fth><th>\u0394H (m)<\u002Fth><th>Tc adotado (min)<\u002Fth><th>Ponto/trecho<\u002Fth><th>Situa\u00e7\u00e3o<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody id=\"basinRows\"><\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"basinEditor\" class=\"card mt hidden\">\n    <div class=\"card-head\"><h3 id=\"basinEditorTitle\">Editar bacia<\u002Fh3><button class=\"icon-btn\" id=\"closeBasinEditor\">\u00d7<\u002Fbutton><\u002Fdiv>\n    <div class=\"form-grid\">\n      <input type=\"hidden\" id=\"bId\">\n      <div class=\"field\"><label>C\u00f3digo *<\u002Flabel><input id=\"bCode\"><\u002Fdiv>\n      <div class=\"field span2\"><label>Nome<\u002Flabel><input id=\"bName\"><\u002Fdiv>\n      <div class=\"field\"><label>\u00c1rea declarada<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"bArea\"><span>ha<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Comprimento hidr\u00e1ulico<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"bLength\"><span>m<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Desn\u00edvel<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"bDrop\"><span>m<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Declividade informada<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"bSlope\"><span>m/m<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Tc adotado<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"bTc\"><span>min<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Cota inicial<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"bElevUp\"><span>m<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Cota final<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"bElevDown\"><span>m<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Ponto de lan\u00e7amento<\u002Flabel><input id=\"bOutlet\"><\u002Fdiv>\n      <div class=\"field span2\"><label>Observa\u00e7\u00f5es<\u002Flabel><input id=\"bNotes\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card-head mt\"><h3>Superf\u00edcies contribuintes<\u002Fh3><button class=\"btn small\" id=\"addSurface\">+ Superf\u00edcie<\u002Fbutton><\u002Fdiv>\n    <div class=\"table-wrap\"><table><thead><tr><th>Tipo<\u002Fth><th>\u00c1rea (ha)<\u002Fth><th>C<\u002Fth><th>Participa\u00e7\u00e3o<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody id=\"surfaceRows\"><\u002Ftbody><\u002Ftable><\u002Fdiv>\n    <div class=\"grid g3 mt\"><div class=\"result\"><small>\u00c1rea das superf\u00edcies<\u002Fsmall><div class=\"big\" id=\"surfaceAreaSum\">0,00 ha<\u002Fdiv><\u002Fdiv><div class=\"result\"><small>Coeficiente ponderado<\u002Fsmall><div class=\"big\" id=\"surfaceC\">0,000<\u002Fdiv><\u002Fdiv><div class=\"result\"><small>Diferen\u00e7a declarada<\u002Fsmall><div class=\"big\" id=\"surfaceDiff\">0,00 ha<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"actions mt\"><button class=\"btn danger\" id=\"deleteBasin\">Excluir bacia<\u002Fbutton><span style=\"flex:1\"><\u002Fspan><button class=\"btn\" id=\"cancelBasin\">Cancelar<\u002Fbutton><button class=\"btn primary\" id=\"saveBasin\">Salvar bacia<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-tc\">\n  <div class=\"page-head\"><div><h2>Tempo de concentra\u00e7\u00e3o<\u002Fh2><p>Compare diferentes formula\u00e7\u00f5es, verifique a faixa de aplica\u00e7\u00e3o e registre a justificativa do valor adotado em cada bacia.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn primary\" id=\"calculateTc\">Calcular m\u00e9todos<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h3>Dados de c\u00e1lculo<\u002Fh3>\n      <div class=\"form-grid\">\n        <div class=\"field span2\"><label>Bacia<\u002Flabel><select id=\"tcBasin\"><\u002Fselect><\u002Fdiv>\n        <div class=\"field\"><label>Comprimento L<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"tcL\"><span>m<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><label>Declividade S<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"tcS\"><span>m/m<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><label>\u00c1rea A<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"tcArea\"><span>km\u00b2<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><label>Coeficiente C<\u002Flabel><input type=\"number\" min=\"0\" max=\"1\" step=\"any\" id=\"tcC\"><\u002Fdiv>\n        <div class=\"field\"><label>Velocidade cinem\u00e1tica<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"tcV\"><span>m/s<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><label>Tc manual<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"tcManual\"><span>min<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><label>K do m\u00e9todo DNOS<\u002Flabel><input type=\"number\" min=\"2\" max=\"5.5\" step=\"0.1\" id=\"tcK\" value=\"4\"><small>Valor de refer\u00eancia edit\u00e1vel: 2,0 a 5,5; condi\u00e7\u00e3o m\u00e9dia: 4,0.<\u002Fsmall><\u002Fdiv>\n        <div class=\"field span4\"><label>Justificativa da sele\u00e7\u00e3o<\u002Flabel><textarea id=\"tcJustification\"><\u002Ftextarea><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"actions mt\"><button class=\"btn\" id=\"tcUseSelected\">Aplicar resultado selecionado \u00e0 bacia<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\"><h3>Compara\u00e7\u00e3o<\u002Fh3><div id=\"tcResults\"><div class=\"muted center\">Preencha os dados e calcule.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card mt\">\n    <h3>Express\u00f5es implementadas<\u002Fh3>\n    <details><summary>Kirpich<\u002Fsummary><div class=\"code\">Tc = 0,0195 \u00d7 L^0,77 \u00d7 S^-0,385<\u002Fdiv><\u002Fdetails>\n    <details><summary>California Culverts Practice<\u002Fsummary><div class=\"code\">Tc = 57 \u00d7 (L\u00b3 / \u0394H)^0,385, com L em km e \u0394H em m<\u002Fdiv><\u002Fdetails>\n    <details><summary>Ven Te Chow<\u002Fsummary><div class=\"code\">Tc = 25,2 \u00d7 (L / \u221aI)^0,64, com L em km e I em %<\u002Fdiv><\u002Fdetails>\n    <details><summary>George Ribeiro<\u002Fsummary><div class=\"code\">Tc = 16 \u00d7 L / ((1,05 \u2212 0,2p) \u00d7 (100S)^0,04), com L em km e p = fra\u00e7\u00e3o vegetada<\u002Fdiv><\u002Fdetails>\n    <details><summary>DNOS<\u002Fsummary><div class=\"code\">Tc = (10 / K) \u00d7 A^0,3 \u00d7 L^0,2 / I^0,4, com A em ha, L em m, I em % e K conforme as caracter\u00edsticas da bacia<\u002Fdiv><\u002Fdetails>\n    <details><summary>FAA e cinem\u00e1tico<\u002Fsummary><div class=\"code\">FAA: Tc = 3,260334 \u00d7 (1,1 \u2212 C) \u00d7 \u221aL / I^(1/3), com L em m e I em %\nCinem\u00e1tico: Tc = L / (60 \u00d7 V)<\u002Fdiv><\u002Fdetails>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-rational\">\n  <div class=\"page-head\"><div><h2>M\u00e9todo Racional e vaz\u00f5es de projeto<\u002Fh2><p>Q = C \u00d7 i \u00d7 A \u00f7 360, para Q em m\u00b3/s, i em mm/h e A em hectares.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn\" id=\"syncTcIdf\">Usar Tc como dura\u00e7\u00e3o<\u002Fbutton><button class=\"btn primary\" id=\"calculateRational\">Recalcular todas<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"grid g4\">\n    <div class=\"metric\"><small>\u00c1rea total<\u002Fsmall><strong id=\"rArea\">0,00 ha<\u002Fstrong><span>\u00c1rea das bacias<\u002Fspan><\u002Fdiv>\n    <div class=\"metric\"><small>Vaz\u00e3o local total<\u002Fsmall><strong id=\"rFlow\">0,000 m\u00b3/s<\u002Fstrong><span>Soma sem considerar simultaneidade<\u002Fspan><\u002Fdiv>\n    <div class=\"metric\"><small>Maior intensidade<\u002Fsmall><strong id=\"rIntensity\">0,0 mm/h<\u002Fstrong><span>Entre as bacias<\u002Fspan><\u002Fdiv>\n    <div class=\"metric\"><small>Tr adotado<\u002Fsmall><strong id=\"rTr\">0 anos<\u002Fstrong><span>Equa\u00e7\u00e3o IDF ativa<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card mt\">\n    <div class=\"table-wrap\"><table><thead><tr><th>Bacia<\u002Fth><th>\u00c1rea (ha)<\u002Fth><th>C<\u002Fth><th>Tc (min)<\u002Fth><th>i (mm/h)<\u002Fth><th>Q (m\u00b3/s)<\u002Fth><th>Q (L/s)<\u002Fth><th>Substitui\u00e7\u00e3o num\u00e9rica<\u002Fth><\u002Ftr><\u002Fthead><tbody id=\"rationalRows\"><\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card mt\"><h3>An\u00e1lise de cen\u00e1rios de impermeabiliza\u00e7\u00e3o<\u002Fh3><div class=\"form-grid\"><div class=\"field\"><label>Aumento relativo de C<\u002Flabel><div class=\"input-unit\"><input type=\"number\" id=\"scenarioC\" value=\"15\" step=\"any\"><span>%<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"field\"><label>Per\u00edodo de retorno alternativo<\u002Flabel><div class=\"input-unit\"><input type=\"number\" id=\"scenarioTr\" value=\"25\" step=\"any\"><span>anos<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"field\"><label>Fator de seguran\u00e7a<\u002Flabel><input type=\"number\" id=\"scenarioFs\" value=\"1\" min=\"0.1\" step=\"any\"><\u002Fdiv><div class=\"field\" style=\"justify-content:end\"><button class=\"btn primary\" id=\"runScenario\">Comparar cen\u00e1rio<\u002Fbutton><\u002Fdiv><\u002Fdiv><div id=\"scenarioResult\" class=\"mt\"><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-gutters\">\n  <div class=\"page-head\"><div><h2>Sarjetas<\u002Fh2><p>Verifica\u00e7\u00e3o pela equa\u00e7\u00e3o de Manning aplicada \u00e0 se\u00e7\u00e3o triangular junto ao meio-fio, com c\u00e1lculo iterativo da profundidade.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn primary\" id=\"addGutter\">+ Nova sarjeta<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\">\n    <div class=\"table-wrap\"><table><thead><tr><th>C\u00f3digo<\u002Fth><th>Q projeto<\u002Fth><th>S longitudinal<\u002Fth><th>S transversal<\u002Fth><th>n<\u002Fth><th>Profundidade<\u002Fth><th>Espalhamento<\u002Fth><th>Velocidade<\u002Fth><th>Capacidade<\u002Fth><th>Situa\u00e7\u00e3o<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody id=\"gutterRows\"><\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-inlets\">\n  <div class=\"page-head\"><div><h2>Bocas de lobo<\u002Fh2><p>Estimativa de capta\u00e7\u00e3o por abertura lateral, grelha ou dispositivo combinado, com redu\u00e7\u00e3o por obstru\u00e7\u00e3o e c\u00e1lculo da vaz\u00e3o residual.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn primary\" id=\"addInlet\">+ Nova boca de lobo<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\">\n    <div class=\"table-wrap\"><table><thead><tr><th>C\u00f3digo<\u002Fth><th>Tipo<\u002Fth><th>Q afluente<\u002Fth><th>Dimens\u00f5es<\u002Fth><th>Obstru\u00e7\u00e3o<\u002Fth><th>Capacidade<\u002Fth><th>Captada<\u002Fth><th>Residual<\u002Fth><th>Efici\u00eancia<\u002Fth><th>Situa\u00e7\u00e3o<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody id=\"inletRows\"><\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"alert warn mt\"><b>Modelo simplificado<\u002Fb><small>A capacidade \u00e9 estimada por rela\u00e7\u00f5es de vertedouro e orif\u00edcio. Fatores de geometria, depress\u00e3o local, aproxima\u00e7\u00e3o pela sarjeta e ensaios do dispositivo devem ser verificados no manual adotado.<\u002Fsmall><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-pipes\">\n  <div class=\"page-head\"><div><h2>Galerias de \u00e1guas pluviais<\u002Fh2><p>Dimensionamento de se\u00e7\u00f5es circulares e retangulares, verifica\u00e7\u00e3o parcial, di\u00e2metro comercial, velocidade, recobrimento e cotas.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn\" id=\"sizeAllPipes\">Dimensionar automaticamente<\u002Fbutton><button class=\"btn primary\" id=\"addPipe\">+ Novo trecho<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\">\n    <div class=\"table-wrap\"><table><thead><tr><th>Trecho<\u002Fth><th>De \u2192 Para<\u002Fth><th>Q local<\u002Fth><th>Q acumulada<\u002Fth><th>Se\u00e7\u00e3o<\u002Fth><th>Dimens\u00e3o<\u002Fth><th>S<\u002Fth><th>n<\u002Fth><th>L<\u002Fth><th>y/D<\u002Fth><th>V<\u002Fth><th>Capacidade<\u002Fth><th>Recobr.<\u002Fth><th>Situa\u00e7\u00e3o<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody id=\"pipeRows\"><\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-structures\">\n  <div class=\"page-head\"><div><h2>Po\u00e7os de visita e caixas<\u002Fh2><p>Controle de n\u00f3s, profundidades, perdas localizadas e compatibilidade das cotas de entrada e sa\u00edda.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn primary\" id=\"addStructure\">+ Nova estrutura<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\">\n    <div class=\"table-wrap\"><table><thead><tr><th>C\u00f3digo<\u002Fth><th>Tipo<\u002Fth><th>Cota terreno<\u002Fth><th>Cota fundo<\u002Fth><th>Profundidade<\u002Fth><th>Dimens\u00f5es<\u002Fth><th>K local<\u002Fth><th>Entradas<\u002Fth><th>Sa\u00eddas<\u002Fth><th>Situa\u00e7\u00e3o<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody id=\"structureRows\"><\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-channels\">\n  <div class=\"page-head\"><div><h2>Canais abertos<\u002Fh2><p>Se\u00e7\u00f5es retangulares, trapezoidais e triangulares com profundidade normal e cr\u00edtica, n\u00famero de Froude, bordo livre e tens\u00e3o trativa.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn primary\" id=\"addChannel\">+ Novo canal<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\">\n    <div class=\"table-wrap\"><table><thead><tr><th>C\u00f3digo<\u002Fth><th>Se\u00e7\u00e3o<\u002Fth><th>Q<\u002Fth><th>b<\u002Fth><th>z<\u002Fth><th>S<\u002Fth><th>n<\u002Fth><th>yn<\u002Fth><th>yc<\u002Fth><th>V<\u002Fth><th>Fr<\u002Fth><th>Regime<\u002Fth><th>Bordo livre<\u002Fth><th>Situa\u00e7\u00e3o<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody id=\"channelRows\"><\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-network\">\n  <div class=\"page-head\"><div><h2>Rede integrada de drenagem<\u002Fh2><p>Acumula\u00e7\u00e3o autom\u00e1tica de vaz\u00f5es por conectividade, visualiza\u00e7\u00e3o esquem\u00e1tica e perfil longitudinal simplificado.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn\" id=\"autoConnectBasins\">Associar bacias por trecho<\u002Fbutton><button class=\"btn primary\" id=\"recalcNetwork\">Recalcular rede<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"grid g4\">\n    <div class=\"metric\"><small>N\u00f3s<\u002Fsmall><strong id=\"nNodes\">0<\u002Fstrong><span>Estruturas e extremidades<\u002Fspan><\u002Fdiv>\n    <div class=\"metric\"><small>Trechos<\u002Fsmall><strong id=\"nEdges\">0<\u002Fstrong><span>Galerias cadastradas<\u002Fspan><\u002Fdiv>\n    <div class=\"metric\"><small>Q de sa\u00edda<\u002Fsmall><strong id=\"nOutletFlow\">0,000 m\u00b3/s<\u002Fstrong><span>Maior vaz\u00e3o acumulada<\u002Fspan><\u002Fdiv>\n    <div class=\"metric\"><small>Capacidade m\u00ednima<\u002Fsmall><strong id=\"nMinUtil\">0%<\u002Fstrong><span>Maior utiliza\u00e7\u00e3o Q/Qcap.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"grid g2 mt\">\n    <div class=\"card\"><div class=\"card-head\"><h3>Esquema topol\u00f3gico<\u002Fh3><button class=\"btn small\" id=\"downloadNetworkChart\">Exportar imagem<\u002Fbutton><\u002Fdiv><canvas class=\"chart network-canvas\" id=\"networkChart\"><\u002Fcanvas><div class=\"legend mt\"><span><i style=\"background:#18864b\"><\u002Fi>Adequado<\u002Fspan><span><i style=\"background:#b56a00\"><\u002Fi>Pr\u00f3ximo ao limite<\u002Fspan><span><i style=\"background:#c93737\"><\u002Fi>Insuficiente<\u002Fspan><span><i style=\"background:#627189\"><\u002Fi>Incompleto<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"card-head\"><h3>Perfil longitudinal<\u002Fh3><select id=\"profilePath\"><\u002Fselect><\u002Fdiv><canvas class=\"chart network-canvas\" id=\"profileChart\"><\u002Fcanvas><div id=\"profileSummary\" class=\"mt\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card mt\"><h3>Resumo dos trechos<\u002Fh3><div class=\"table-wrap\"><table><thead><tr><th>Trecho<\u002Fth><th>N\u00f3 montante<\u002Fth><th>N\u00f3 jusante<\u002Fth><th>Bacias<\u002Fth><th>Q local<\u002Fth><th>Q acumulada<\u002Fth><th>Capacidade<\u002Fth><th>Utiliza\u00e7\u00e3o<\u002Fth><th>Tempo percurso<\u002Fth><th>Situa\u00e7\u00e3o<\u002Fth><\u002Ftr><\u002Fthead><tbody id=\"networkRows\"><\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-checks\">\n  <div class=\"page-head\"><div><h2>Verifica\u00e7\u00f5es autom\u00e1ticas<\u002Fh2><p>Consist\u00eancia de entradas, capacidade, velocidade, cotas, conectividade e crit\u00e9rios configur\u00e1veis.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn\" id=\"exportChecks\">Exportar CSV<\u002Fbutton><button class=\"btn primary\" id=\"runChecks\">Atualizar verifica\u00e7\u00f5es<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"grid g4\">\n    <div class=\"metric\"><small>Total<\u002Fsmall><strong id=\"cTotal\">0<\u002Fstrong><span>Itens verificados<\u002Fspan><\u002Fdiv>\n    <div class=\"metric\"><small>Adequados<\u002Fsmall><strong id=\"cOk\">0<\u002Fstrong><span>Sem ressalvas<\u002Fspan><\u002Fdiv>\n    <div class=\"metric\"><small>Aten\u00e7\u00e3o<\u002Fsmall><strong id=\"cWarn\">0<\u002Fstrong><span>Revis\u00e3o recomendada<\u002Fspan><\u002Fdiv>\n    <div class=\"metric\"><small>Cr\u00edticos<\u002Fsmall><strong id=\"cDanger\">0<\u002Fstrong><span>Corre\u00e7\u00e3o necess\u00e1ria<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card mt\"><div class=\"toolbar\"><select id=\"checkFilter\"><option value=\"all\">Todos os n\u00edveis<\u002Foption><option value=\"danger\">Somente cr\u00edticos<\u002Foption><option value=\"warn\">Somente aten\u00e7\u00e3o<\u002Foption><option value=\"ok\">Somente adequados<\u002Foption><\u002Fselect><input id=\"checkSearch\" placeholder=\"Filtrar por texto\" style=\"min-width:260px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:8px\"><\u002Fdiv><div id=\"checkList\"><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-memory\">\n  <div class=\"page-head\"><div><h2>Memorial de c\u00e1lculo<\u002Fh2><p>Documento t\u00e9cnico gerado a partir dos dados ativos, com f\u00f3rmulas, substitui\u00e7\u00f5es, resultados e conclus\u00f5es.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn\" id=\"copyMemory\">Copiar texto<\u002Fbutton><button class=\"btn\" id=\"downloadMemory\">Baixar TXT<\u002Fbutton><button class=\"btn primary\" data-go=\"report\">Montar relat\u00f3rio<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><div id=\"memoryContent\"><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-report\">\n  <div class=\"page-head\"><div><h2>Relat\u00f3rio t\u00e9cnico<\u002Fh2><p>Selecione a abrang\u00eancia e use a impress\u00e3o do navegador para salvar em PDF.<\u002Fp><\u002Fdiv><div class=\"actions\"><select id=\"reportMode\"><option value=\"complete\">Relat\u00f3rio completo<\u002Foption><option value=\"summary\">Relat\u00f3rio resumido<\u002Foption><option value=\"memory\">Apenas memorial<\u002Foption><option value=\"tables\">Apenas tabelas<\u002Foption><option value=\"critical\">Apenas itens cr\u00edticos<\u002Foption><\u002Fselect><button class=\"btn\" id=\"refreshReport\">Atualizar<\u002Fbutton><button class=\"btn\" id=\"exportAllCsv\">Exportar CSV<\u002Fbutton><button class=\"btn primary\" id=\"printReport\">Imprimir / PDF<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><article class=\"report-sheet\" id=\"reportContent\"><\u002Farticle><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-settings\">\n  <div class=\"page-head\"><div><h2>Configura\u00e7\u00f5es e crit\u00e9rios<\u002Fh2><p>Valores iniciais edit\u00e1veis. Registre na mem\u00f3ria t\u00e9cnica a refer\u00eancia adotada para cada limite.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn\" id=\"restoreDefaults\">Restaurar padr\u00f5es<\u002Fbutton><button class=\"btn primary\" id=\"saveSettings\">Aplicar configura\u00e7\u00f5es<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"grid g2\">\n    <div class=\"card\"><h3>Galerias e sarjetas<\u002Fh3><div class=\"form-grid\">\n      <div class=\"field\"><label>Velocidade m\u00ednima<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"sMinV\"><span>m/s<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Velocidade m\u00e1xima<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"sMaxV\"><span>m/s<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Enchimento m\u00e1ximo<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"sMaxFill\"><span>%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Recobrimento m\u00ednimo<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"sMinCover\"><span>m<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Espalhamento m\u00e1x. sarjeta<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"sMaxSpread\"><span>m<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Profundidade m\u00e1x. sarjeta<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"sMaxGutterDepth\"><span>m<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Utiliza\u00e7\u00e3o de aten\u00e7\u00e3o<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"sWarnUtil\"><span>%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Casas decimais<\u002Flabel><input type=\"number\" min=\"1\" max=\"6\" id=\"sDecimals\"><\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><h3>Canais e capta\u00e7\u00f5es<\u002Fh3><div class=\"form-grid\">\n      <div class=\"field\"><label>Bordo livre m\u00ednimo<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"sMinFreeboard\"><span>m<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Efici\u00eancia m\u00ednima da boca<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"sMinInletEff\"><span>%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Obstru\u00e7\u00e3o padr\u00e3o<\u002Flabel><div class=\"input-unit\"><input type=\"number\" step=\"any\" id=\"sDefaultClog\"><span>%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"field\"><label>Fator de seguran\u00e7a<\u002Flabel><input type=\"number\" step=\"any\" id=\"sSafety\"><\u002Fdiv>\n      <div class=\"field span4\"><label>Refer\u00eancia dos crit\u00e9rios<\u002Flabel><textarea id=\"sCriteriaSource\"><\u002Ftextarea><\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card mt\"><h3>Di\u00e2metros comerciais (mm)<\u002Fh3><div class=\"field\"><input id=\"sDiameters\" placeholder=\"300, 400, 500, 600, 800...\"><span class=\"help\">Separar por v\u00edrgulas. A sele\u00e7\u00e3o autom\u00e1tica usa o primeiro di\u00e2metro que atende aos crit\u00e9rios.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div class=\"card mt\"><h3>Biblioteca de coeficientes de escoamento<\u002Fh3><div class=\"table-wrap\"><table><thead><tr><th>Superf\u00edcie<\u002Fth><th>C sugerido<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody id=\"coeffRows\"><\u002Ftbody><\u002Ftable><\u002Fdiv><button class=\"btn small mt\" id=\"addCoeff\">+ Coeficiente<\u002Fbutton><\u002Fdiv>\n  <div class=\"card mt\"><h3>Coeficientes de Manning<\u002Fh3><div class=\"table-wrap\"><table><thead><tr><th>Material<\u002Fth><th>n sugerido<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody id=\"manningRows\"><\u002Ftbody><\u002Ftable><\u002Fdiv><button class=\"btn small mt\" id=\"addManning\">+ Material<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"sec-manual\">\n  <div class=\"manual-hero\">\n    <div class=\"manual-hero-copy\">\n      <span class=\"manual-eyebrow\">Manual integrado \u2022 uso offline<\u002Fspan>\n      <h2>Aprenda o DrenaPro no mesmo lugar em que desenvolve o estudo.<\u002Fh2>\n      <p>Siga o roteiro guiado do cadastro inicial ao relat\u00f3rio t\u00e9cnico, pesquise d\u00favidas por assunto e abra diretamente o m\u00f3dulo correspondente sem sair do sistema.<\u002Fp>\n      <div class=\"actions mt\"><button class=\"btn\" id=\"manualStartTour\">\u25b6 Iniciar roteiro guiado<\u002Fbutton><button class=\"btn ghost\" id=\"manualLoadSample\">\u25eb Explorar projeto de exemplo<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"manual-hero-status\">\n      <small>Progresso do roteiro<\u002Fsmall><strong id=\"manualHeroProgress\">0%<\u002Fstrong>\n      <div class=\"progress\"><i id=\"manualHeroBar\"><\u002Fi><\u002Fdiv><span id=\"manualHeroCaption\">0 etapas conclu\u00eddas<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card manual-toolbar mt\">\n    <div class=\"manual-search-field\"><span aria-hidden=\"true\">\u2315<\u002Fspan><input id=\"manualSearch\" type=\"search\" placeholder=\"Pesquisar: IDF, bacias, galerias, relat\u00f3rio\u2026\" autocomplete=\"off\"><button class=\"icon-btn\" id=\"manualClearSearch\" title=\"Limpar pesquisa\" aria-label=\"Limpar pesquisa\">\u00d7<\u002Fbutton><\u002Fdiv>\n    <select id=\"manualCategory\" aria-label=\"Filtrar assuntos do manual\">\n      <option value=\"all\">Todos os assuntos<\u002Foption><option value=\"inicio\">Primeiros passos<\u002Foption><option value=\"hidrologia\">Hidrologia<\u002Foption><option value=\"hidraulica\">Hidr\u00e1ulica<\u002Foption><option value=\"entrega\">Verifica\u00e7\u00e3o e entrega<\u002Foption><option value=\"dados\">Dados e configura\u00e7\u00f5es<\u002Foption><option value=\"ajuda\">Gloss\u00e1rio e d\u00favidas<\u002Foption>\n    <\u002Fselect>\n    <span class=\"manual-result-count\" id=\"manualResultCount\">Todos os t\u00f3picos<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"manual-layout mt\">\n    <aside class=\"card manual-sidebar\">\n      <div class=\"manual-sidebar-head\"><h3>Roteiro de utiliza\u00e7\u00e3o<\u002Fh3><button class=\"btn small\" id=\"manualResetProgress\">Reiniciar<\u002Fbutton><\u002Fdiv>\n      <p>Selecione uma etapa para ver as instru\u00e7\u00f5es. Marque-a como conclu\u00edda ao terminar.<\u002Fp>\n      <div class=\"manual-step-list\" id=\"manualStepList\"><\u002Fdiv>\n      <div class=\"manual-sidebar-note\"><b>Atalho:<\u002Fb> pressione <b>F1<\u002Fb> em qualquer tela para reabrir este manual. O progresso fica salvo apenas neste navegador.<\u002Fdiv>\n    <\u002Faside>\n\n    <div class=\"manual-main\">\n      <div class=\"card manual-guide\" id=\"manualGuideCard\">\n        <div class=\"manual-guide-top\"><span class=\"manual-kicker\">Roteiro guiado<\u002Fspan><span class=\"manual-step-counter\" id=\"manualGuideCounter\">Etapa 1<\u002Fspan><\u002Fdiv>\n        <h3 id=\"manualGuideTitle\">Comece pelos dados do projeto<\u002Fh3><p id=\"manualGuideDescription\"><\u002Fp>\n        <div class=\"manual-guide-grid\"><div><h4>O que fazer<\u002Fh4><ol id=\"manualGuideChecklist\"><\u002Fol><\u002Fdiv><div class=\"manual-tip\"><h4>Por que isso importa<\u002Fh4><p id=\"manualGuideTip\"><\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"manual-guide-actions\"><button class=\"btn\" id=\"manualGuidePrev\">\u2190 Anterior<\u002Fbutton><button class=\"btn\" id=\"manualGuideDone\">\u2713 Marcar conclu\u00edda<\u002Fbutton><span class=\"manual-spacer\"><\u002Fspan><button class=\"btn primary\" id=\"manualGuideOpen\">Abrir m\u00f3dulo<\u002Fbutton><button class=\"btn\" id=\"manualGuideNext\">Pr\u00f3xima \u2192<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"alert warn manual-empty hidden\" id=\"manualNoResults\"><b>Nenhum t\u00f3pico encontrado<\u002Fb><small>Altere o termo pesquisado ou selecione \u201cTodos os assuntos\u201d.<\u002Fsmall><\u002Fdiv>\n\n      <div class=\"manual-topics\" id=\"manualTopics\">\n        <details class=\"manual-topic\" data-manual-topic data-category=\"inicio\" data-keywords=\"fluxo ordem sequ\u00eancia come\u00e7ar projeto exemplo roteiro\" open>\n          <summary><span class=\"manual-topic-icon\">\u25ce<\u002Fspan><span><b>Fluxo recomendado do estudo<\u002Fb><small>A ordem mais segura para preencher, calcular, verificar e emitir os documentos.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <p>O DrenaPro organiza o trabalho em uma sequ\u00eancia integrada. Dados cadastrados nas etapas anteriores alimentam os c\u00e1lculos e verifica\u00e7\u00f5es posteriores.<\u002Fp>\n            <div class=\"manual-flow\"><span>Projeto<\u002Fspan><i>\u2192<\u002Fi><span>Crit\u00e9rios<\u002Fspan><i>\u2192<\u002Fi><span>IDF<\u002Fspan><i>\u2192<\u002Fi><span>Bacias<\u002Fspan><i>\u2192<\u002Fi><span>Tc<\u002Fspan><i>\u2192<\u002Fi><span>Vaz\u00f5es<\u002Fspan><i>\u2192<\u002Fi><span>Dispositivos<\u002Fspan><i>\u2192<\u002Fi><span>Rede<\u002Fspan><i>\u2192<\u002Fi><span>Verifica\u00e7\u00f5es<\u002Fspan><i>\u2192<\u002Fi><span>Relat\u00f3rio<\u002Fspan><\u002Fdiv>\n            <div class=\"manual-topic-grid\"><div class=\"manual-mini-card\"><b>Para aprender<\u002Fb><p>Carregue o projeto de exemplo e percorra cada tela observando como os resultados se propagam.<\u002Fp><\u002Fdiv><div class=\"manual-mini-card\"><b>Para um projeto real<\u002Fb><p>Comece em branco, registre as fontes adotadas e valide cada premissa antes de avan\u00e7ar.<\u002Fp><\u002Fdiv><\u002Fdiv>\n            <div class=\"manual-callout warn\"><b>Aten\u00e7\u00e3o:<\u002Fb> o programa apoia o pr\u00e9-dimensionamento. Dados pluviom\u00e9tricos, crit\u00e9rios locais, condi\u00e7\u00f5es de jusante, interfer\u00eancias e resultados devem ser validados por profissional habilitado.<\u002Fdiv>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"project\">Come\u00e7ar projeto<\u002Fbutton><button class=\"btn small\" id=\"manualTopicSample\">Carregar exemplo<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"inicio\" data-keywords=\"dados projeto nome c\u00f3digo vers\u00e3o respons\u00e1vel crea cau local endere\u00e7o contratante\">\n          <summary><span class=\"manual-topic-icon\">1<\u002Fspan><span><b>Dados do projeto<\u002Fb><small>Identifica\u00e7\u00e3o, localiza\u00e7\u00e3o, respons\u00e1vel t\u00e9cnico e premissas gerais.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <ol><li>Informe nome, c\u00f3digo, vers\u00e3o e data do estudo.<\u002Fli><li>Registre munic\u00edpio, UF, endere\u00e7o, ocupa\u00e7\u00e3o e sistema de coordenadas.<\u002Fli><li>Preencha contratante, respons\u00e1vel t\u00e9cnico e registro profissional.<\u002Fli><li>Descreva o objeto, o est\u00e1gio do estudo e as limita\u00e7\u00f5es conhecidas.<\u002Fli><li>Pressione <b>Aplicar dados<\u002Fb> para atualizar o projeto.<\u002Fli><\u002Fol>\n            <div class=\"manual-callout ok\">Essas informa\u00e7\u00f5es aparecem no memorial e na capa do relat\u00f3rio. Evite emitir documentos com os campos de responsabilidade t\u00e9cnica em branco.<\u002Fdiv>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"project\">Abrir Dados do projeto<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"dados\" data-keywords=\"configura\u00e7\u00f5es crit\u00e9rios velocidade enchimento recobrimento espalhamento bordo livre efici\u00eancia obstru\u00e7\u00e3o fator seguran\u00e7a manning coeficiente\">\n          <summary><span class=\"manual-topic-icon\">2<\u002Fspan><span><b>Configura\u00e7\u00f5es e crit\u00e9rios de verifica\u00e7\u00e3o<\u002Fb><small>Limites edit\u00e1veis que controlam alertas, dimensionamento e conclus\u00f5es.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <p>Revise os crit\u00e9rios antes de dimensionar. O sistema inicia com valores preliminares, mas eles devem ser substitu\u00eddos pelos limites do \u00f3rg\u00e3o, manual municipal, contratante e refer\u00eancias aplic\u00e1veis.<\u002Fp>\n            <div class=\"manual-topic-grid\"><div class=\"manual-mini-card\"><b>Galerias e sarjetas<\u002Fb><p>Velocidades m\u00ednima e m\u00e1xima, enchimento, recobrimento, espalhamento, profundidade e faixa de aten\u00e7\u00e3o.<\u002Fp><\u002Fdiv><div class=\"manual-mini-card\"><b>Canais e capta\u00e7\u00f5es<\u002Fb><p>Bordo livre, efici\u00eancia m\u00ednima, obstru\u00e7\u00e3o padr\u00e3o e fator de seguran\u00e7a.<\u002Fp><\u002Fdiv><div class=\"manual-mini-card\"><b>Bibliotecas<\u002Fb><p>Coeficientes de escoamento por superf\u00edcie e rugosidades de Manning por material.<\u002Fp><\u002Fdiv><div class=\"manual-mini-card\"><b>Di\u00e2metros comerciais<\u002Fb><p>Lista usada pelo dimensionamento autom\u00e1tico das galerias circulares.<\u002Fp><\u002Fdiv><\u002Fdiv>\n            <div class=\"manual-callout\"><b>Boa pr\u00e1tica:<\u002Fb> preencha \u201cRefer\u00eancia dos crit\u00e9rios\u201d. O texto \u00e9 levado ao memorial t\u00e9cnico e torna a decis\u00e3o audit\u00e1vel.<\u002Fdiv>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"settings\">Abrir Configura\u00e7\u00f5es<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"hidrologia\" data-keywords=\"chuva idf intensidade dura\u00e7\u00e3o frequ\u00eancia K a b c per\u00edodo retorno esta\u00e7\u00e3o fonte mm h\">\n          <summary><span class=\"manual-topic-icon\">3<\u002Fspan><span><b>Chuva de projeto e equa\u00e7\u00e3o IDF<\u002Fb><small>Defini\u00e7\u00e3o da intensidade de precipita\u00e7\u00e3o com fonte e par\u00e2metros locais.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <p>A forma implementada \u00e9 <b>i = K \u00d7 Tr\u1d43 \u00f7 (t + b)\u1d9c<\u002Fb>, com intensidade apresentada em mm/h e em L/s\u00b7ha.<\u002Fp>\n            <ol><li>Transcreva os par\u00e2metros K, a, b e c da equa\u00e7\u00e3o v\u00e1lida para a localidade.<\u002Fli><li>Defina o per\u00edodo de retorno coerente com a criticidade e o padr\u00e3o adotado.<\u002Fli><li>Informe uma dura\u00e7\u00e3o inicial; no c\u00e1lculo por bacia o sistema usa o Tc cadastrado.<\u002Fli><li>Registre esta\u00e7\u00e3o, publica\u00e7\u00e3o, autor, ano e per\u00edodo dos dados.<\u002Fli><li>Clique em <b>Aplicar IDF<\u002Fb> e examine o gr\u00e1fico para diferentes per\u00edodos de retorno.<\u002Fli><\u002Fol>\n            <div class=\"manual-callout warn\">N\u00e3o use os par\u00e2metros ilustrativos do projeto de exemplo em um estudo real. A aus\u00eancia da fonte da IDF gera alerta autom\u00e1tico.<\u002Fdiv>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"idf\">Abrir Chuva e IDF<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"hidrologia\" data-keywords=\"bacias superf\u00edcies \u00e1rea contribuinte coeficiente escoamento ponderado C comprimento desn\u00edvel declividade lan\u00e7amento trecho\">\n          <summary><span class=\"manual-topic-icon\">4<\u002Fspan><span><b>Bacias e superf\u00edcies contribuintes<\u002Fb><small>\u00c1reas, coeficiente C ponderado, percurso hidr\u00e1ulico e associa\u00e7\u00e3o \u00e0 rede.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <ol><li>Crie uma bacia e atribua c\u00f3digo \u00fanico e nome descritivo.<\u002Fli><li>Informe \u00e1rea, comprimento hidr\u00e1ulico e desn\u00edvel ou declividade.<\u002Fli><li>Cadastre as superf\u00edcies: telhado, pavimento, \u00e1rea verde e outras.<\u002Fli><li>Confira se a soma das superf\u00edcies coincide com a \u00e1rea declarada.<\u002Fli><li>Revise o coeficiente ponderado calculado por <b>C = \u03a3(C\u1d62A\u1d62) \u00f7 \u03a3A\u1d62<\u002Fb>.<\u002Fli><li>Associe o ponto de lan\u00e7amento ao c\u00f3digo de um trecho de galeria, quando aplic\u00e1vel.<\u002Fli><\u002Fol>\n            <div class=\"manual-callout\">A diferen\u00e7a entre \u00e1rea declarada e soma das superf\u00edcies recebe alerta. Para melhor rastreabilidade, decomponha a bacia em superf\u00edcies reais em vez de informar apenas um C global.<\u002Fdiv>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"basins\">Abrir Bacias<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"hidrologia\" data-keywords=\"tempo concentra\u00e7\u00e3o tc kirpich california ven te chow george ribeiro dnos faa cinem\u00e1tico m\u00e9todo justificar\">\n          <summary><span class=\"manual-topic-icon\">5<\u002Fspan><span><b>Tempo de concentra\u00e7\u00e3o<\u002Fb><small>Compara\u00e7\u00e3o de m\u00e9todos e registro da justificativa do valor adotado.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <p>O m\u00f3dulo compara Kirpich, California Culverts, Ven Te Chow, George Ribeiro, DNOS, FAA, m\u00e9todo cinem\u00e1tico e entrada manual.<\u002Fp>\n            <ol><li>Selecione a bacia; os dados geom\u00e9tricos s\u00e3o transferidos para a tela.<\u002Fli><li>Confira comprimento, declividade, \u00e1rea, C, velocidade e K do DNOS.<\u002Fli><li>Calcule os m\u00e9todos e descarte resultados fora da faixa de aplica\u00e7\u00e3o.<\u002Fli><li>Escolha um resultado, redija a justificativa e aplique-o \u00e0 bacia.<\u002Fli><li>Repita o procedimento para cada bacia.<\u002Fli><\u002Fol>\n            <div class=\"manual-callout warn\">N\u00e3o adote automaticamente o menor, a m\u00e9dia ou o m\u00e9todo que produz a menor se\u00e7\u00e3o. Compare premissas, escala, urbaniza\u00e7\u00e3o, percurso e refer\u00eancia t\u00e9cnica.<\u002Fdiv>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"tc\">Abrir Tempo de concentra\u00e7\u00e3o<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"hidrologia\" data-keywords=\"m\u00e9todo racional vaz\u00e3o pico Q C i A cen\u00e1rio impermeabiliza\u00e7\u00e3o retorno fator seguran\u00e7a\">\n          <summary><span class=\"manual-topic-icon\">6<\u002Fspan><span><b>M\u00e9todo Racional e cen\u00e1rios<\u002Fb><small>Vaz\u00e3o de pico por bacia e sensibilidade \u00e0 impermeabiliza\u00e7\u00e3o.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <p>A vaz\u00e3o \u00e9 calculada por <b>Q = C \u00d7 i \u00d7 A \u00f7 360<\u002Fb>, para Q em m\u00b3/s, intensidade em mm/h e \u00e1rea em hectares.<\u002Fp>\n            <ol><li>Confirme se cada bacia possui \u00e1rea, C e Tc v\u00e1lidos.<\u002Fli><li>Clique em <b>Recalcular todas<\u002Fb> e verifique as substitui\u00e7\u00f5es num\u00e9ricas.<\u002Fli><li>Use \u201cUsar Tc como dura\u00e7\u00e3o\u201d apenas para ajustar a dura\u00e7\u00e3o geral exibida; cada bacia continua usando seu pr\u00f3prio Tc.<\u002Fli><li>Simule aumento de C, per\u00edodo de retorno alternativo e fator de seguran\u00e7a.<\u002Fli><li>Registre no estudo qual cen\u00e1rio orientou o dimensionamento.<\u002Fli><\u002Fol>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"rational\">Abrir M\u00e9todo racional<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"hidraulica\" data-keywords=\"sarjetas bocas lobo capta\u00e7\u00e3o espalhamento profundidade manning abertura lateral grelha combinada obstru\u00e7\u00e3o residual efici\u00eancia\">\n          <summary><span class=\"manual-topic-icon\">7<\u002Fspan><span><b>Sarjetas e bocas de lobo<\u002Fb><small>Condu\u00e7\u00e3o superficial, capacidade de capta\u00e7\u00e3o, obstru\u00e7\u00e3o e vaz\u00e3o residual.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <div class=\"manual-topic-grid\"><div class=\"manual-mini-card\"><b>Sarjetas<\u002Fb><p>Informe Q, declividades longitudinal e transversal, Manning n, profundidade e espalhamento admiss\u00edveis. O sistema resolve iterativamente a se\u00e7\u00e3o triangular.<\u002Fp><\u002Fdiv><div class=\"manual-mini-card\"><b>Bocas de lobo<\u002Fb><p>Escolha abertura lateral, grelha ou combinada; informe geometria, carga, quantidade e obstru\u00e7\u00e3o. O sistema estima capacidade, vaz\u00e3o captada, residual e efici\u00eancia.<\u002Fp><\u002Fdiv><\u002Fdiv>\n            <h4>Sequ\u00eancia pr\u00e1tica<\u002Fh4><ol><li>Dimensione a sarjeta para a vaz\u00e3o afluente e verifique profundidade, espalhamento e velocidade.<\u002Fli><li>Insira a boca de lobo no ponto de capta\u00e7\u00e3o com cen\u00e1rio realista de obstru\u00e7\u00e3o.<\u002Fli><li>Se houver vaz\u00e3o residual, avalie unidade adicional, geometria maior ou menor espa\u00e7amento.<\u002Fli><li>Compatibilize o dispositivo com detalhes construtivos e manuten\u00e7\u00e3o.<\u002Fli><\u002Fol>\n            <div class=\"manual-callout warn\">A modelagem de capta\u00e7\u00e3o \u00e9 simplificada. Geometria local, depress\u00e3o, aproxima\u00e7\u00e3o do escoamento e dados de ensaio do dispositivo devem ser conferidos na refer\u00eancia adotada.<\u002Fdiv>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"gutters\">Abrir Sarjetas<\u002Fbutton><button class=\"btn small\" data-go=\"inlets\">Abrir Bocas de lobo<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"hidraulica\" data-keywords=\"galerias tubos circular retangular manning di\u00e2metro comercial dimensionar autom\u00e1tico enchimento velocidade recobrimento cotas declividade\">\n          <summary><span class=\"manual-topic-icon\">8<\u002Fspan><span><b>Galerias de \u00e1guas pluviais<\u002Fb><small>Trechos, conectividade, se\u00e7\u00e3o, capacidade, velocidade, enchimento e recobrimento.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <ol><li>Crie c\u00f3digos \u00fanicos e informe n\u00f3 de montante e n\u00f3 de jusante.<\u002Fli><li>Informe vaz\u00e3o local adicional apenas quando houver contribui\u00e7\u00e3o n\u00e3o representada por bacias.<\u002Fli><li>Escolha se\u00e7\u00e3o circular ou retangular, dimens\u00f5es, declividade, n e comprimento.<\u002Fli><li>Preencha cotas de terreno e fundo para verificar recobrimento e consist\u00eancia da declividade.<\u002Fli><li>Use <b>Dimensionar automaticamente<\u002Fb> para testar os di\u00e2metros comerciais configurados.<\u002Fli><li>Revise capacidade no enchimento-limite, y/D, velocidade e utiliza\u00e7\u00e3o Q/Qcap.<\u002Fli><\u002Fol>\n            <div class=\"manual-callout\">O dimensionamento autom\u00e1tico procura o primeiro di\u00e2metro que atende \u00e0 capacidade com fator de seguran\u00e7a e aos limites de velocidade. Ele n\u00e3o substitui a compatibiliza\u00e7\u00e3o geom\u00e9trica, estrutural e executiva.<\u002Fdiv>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"pipes\">Abrir Galerias<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"hidraulica\" data-keywords=\"po\u00e7o visita caixas estruturas n\u00f3s cota terreno fundo profundidade perda localizada K entrada sa\u00edda conex\u00e3o\">\n          <summary><span class=\"manual-topic-icon\">9<\u002Fspan><span><b>Po\u00e7os de visita e caixas<\u002Fb><small>N\u00f3s hidr\u00e1ulicos, profundidades, dimens\u00f5es e perdas localizadas.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <ol><li>Use exatamente o mesmo c\u00f3digo empregado nos campos \u201cDe\u201d ou \u201cPara\u201d das galerias.<\u002Fli><li>Selecione o tipo de estrutura e informe cotas de terreno e fundo.<\u002Fli><li>Registre dimens\u00f5es internas e o coeficiente de perda localizada K.<\u002Fli><li>Verifique profundidade, trechos de entrada e sa\u00edda e estruturas desconectadas.<\u002Fli><li>Analise degraus, quedas, mudan\u00e7as de dire\u00e7\u00e3o e acessibilidade para manuten\u00e7\u00e3o fora do modelo simplificado.<\u002Fli><\u002Fol>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"structures\">Abrir Po\u00e7os e caixas<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"hidraulica\" data-keywords=\"canais retangular trapezoidal triangular profundidade normal cr\u00edtica froude regime bordo livre tens\u00e3o trativa revestimento\">\n          <summary><span class=\"manual-topic-icon\">10<\u002Fspan><span><b>Canais abertos<\u002Fb><small>Se\u00e7\u00e3o, profundidades normal e cr\u00edtica, regime, bordo livre e eros\u00e3o.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <ol><li>Escolha se\u00e7\u00e3o retangular, trapezoidal ou triangular.<\u002Fli><li>Informe Q, largura de fundo, talude z, declividade e Manning n.<\u002Fli><li>Defina profundidade total, velocidade m\u00e1xima e tens\u00e3o trativa admiss\u00edvel.<\u002Fli><li>Confira profundidade normal, profundidade cr\u00edtica, velocidade e n\u00famero de Froude.<\u002Fli><li>Valide bordo livre e compatibilidade do revestimento com a tens\u00e3o calculada.<\u002Fli><\u002Fol>\n            <div class=\"manual-callout warn\">Condi\u00e7\u00f5es de entrada e sa\u00edda, curvas, transi\u00e7\u00f5es, ressalto hidr\u00e1ulico, remanso e dissipa\u00e7\u00e3o de energia exigem an\u00e1lise complementar.<\u002Fdiv>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"channels\">Abrir Canais<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"hidraulica\" data-keywords=\"rede integrada conectividade acumula\u00e7\u00e3o vaz\u00e3o topologia diagrama perfil longitudinal ciclo percurso n\u00f3s trechos\">\n          <summary><span class=\"manual-topic-icon\">11<\u002Fspan><span><b>Rede integrada e perfil longitudinal<\u002Fb><small>Acumula\u00e7\u00e3o de vaz\u00f5es por conectividade e leitura gr\u00e1fica da rede.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <ol><li>Confirme a associa\u00e7\u00e3o das bacias aos c\u00f3digos de trecho.<\u002Fli><li>Verifique se todos os trechos t\u00eam n\u00f3s de montante e jusante coerentes.<\u002Fli><li>Clique em <b>Recalcular rede<\u002Fb> para acumular as contribui\u00e7\u00f5es de montante.<\u002Fli><li>Use o esquema topol\u00f3gico para identificar conex\u00f5es, ramifica\u00e7\u00f5es e trechos cr\u00edticos.<\u002Fli><li>Selecione um percurso no perfil longitudinal e confira terreno, fundo, geratriz superior e extens\u00e3o.<\u002Fli><li>Corrija ciclos hidr\u00e1ulicos, trechos desconectados ou sentidos incoerentes.<\u002Fli><\u002Fol>\n            <div class=\"manual-callout\">A cor dos trechos reflete os crit\u00e9rios configurados: adequado, pr\u00f3ximo ao limite, insuficiente ou incompleto.<\u002Fdiv>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"network\">Abrir Rede integrada<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"entrega\" data-keywords=\"verifica\u00e7\u00f5es alertas cr\u00edtico aten\u00e7\u00e3o adequado consist\u00eancia capacidade velocidade cotas conectividade filtro csv\">\n          <summary><span class=\"manual-topic-icon\">12<\u002Fspan><span><b>Verifica\u00e7\u00f5es autom\u00e1ticas<\u002Fb><small>Revis\u00e3o sistem\u00e1tica das entradas e dos resultados antes da emiss\u00e3o.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <p>As verifica\u00e7\u00f5es cobrem identifica\u00e7\u00e3o, IDF, bacias, Tc, vaz\u00f5es, sarjetas, capta\u00e7\u00f5es, galerias, cotas, rede, estruturas e canais.<\u002Fp>\n            <div class=\"manual-topic-grid\"><div class=\"manual-mini-card\"><b>Adequado<\u002Fb><p>Item atende aos crit\u00e9rios configurados.<\u002Fp><\u002Fdiv><div class=\"manual-mini-card\"><b>Aten\u00e7\u00e3o<\u002Fb><p>Resultado pr\u00f3ximo ao limite, informa\u00e7\u00e3o incompleta ou revis\u00e3o recomendada.<\u002Fp><\u002Fdiv><div class=\"manual-mini-card\"><b>Cr\u00edtico<\u002Fb><p>Inconsist\u00eancia ou insufici\u00eancia que requer corre\u00e7\u00e3o.<\u002Fp><\u002Fdiv><div class=\"manual-mini-card\"><b>Filtro e exporta\u00e7\u00e3o<\u002Fb><p>Pesquise por texto, filtre o n\u00edvel e exporte a lista em CSV.<\u002Fp><\u002Fdiv><\u002Fdiv>\n            <ol><li>Atualize as verifica\u00e7\u00f5es ap\u00f3s qualquer mudan\u00e7a relevante.<\u002Fli><li>Resolva primeiro os itens cr\u00edticos e depois os de aten\u00e7\u00e3o.<\u002Fli><li>N\u00e3o ignore alertas apenas para \u201cfechar\u201d o relat\u00f3rio; ajuste dados ou justifique tecnicamente.<\u002Fli><li>Guarde o CSV como registro da revis\u00e3o.<\u002Fli><\u002Fol>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"checks\">Abrir Verifica\u00e7\u00f5es<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"entrega\" data-keywords=\"memorial c\u00e1lculo f\u00f3rmulas substitui\u00e7\u00f5es conclus\u00e3o copiar txt relat\u00f3rio completo resumido tabelas cr\u00edtico imprimir pdf csv\">\n          <summary><span class=\"manual-topic-icon\">13<\u002Fspan><span><b>Memorial de c\u00e1lculo e relat\u00f3rio<\u002Fb><small>Documenta\u00e7\u00e3o autom\u00e1tica, revis\u00e3o final, impress\u00e3o e exporta\u00e7\u00e3o.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <div class=\"manual-topic-grid\"><div class=\"manual-mini-card\"><b>Memorial<\u002Fb><p>Re\u00fane dados, f\u00f3rmulas, substitui\u00e7\u00f5es, resultados e conclus\u00f5es. Pode ser copiado ou baixado em TXT.<\u002Fp><\u002Fdiv><div class=\"manual-mini-card\"><b>Relat\u00f3rio<\u002Fb><p>Possui modos completo, resumido, apenas memorial, tabelas ou itens cr\u00edticos. A impress\u00e3o do navegador permite salvar em PDF.<\u002Fp><\u002Fdiv><\u002Fdiv>\n            <ol><li>Atualize as verifica\u00e7\u00f5es e elimine inconsist\u00eancias.<\u002Fli><li>Abra o memorial e confira fontes, unidades, justificativas e substitui\u00e7\u00f5es.<\u002Fli><li>Escolha o modo de relat\u00f3rio e pressione <b>Atualizar<\u002Fb>.<\u002Fli><li>Use <b>Exportar CSV<\u002Fb> para obter as tabelas em formato estruturado.<\u002Fli><li>Use <b>Imprimir / PDF<\u002Fb> e revise a visualiza\u00e7\u00e3o antes de salvar.<\u002Fli><\u002Fol>\n            <div class=\"manual-callout warn\">O documento gerado ainda precisa de revis\u00e3o t\u00e9cnica, complementa\u00e7\u00e3o com plantas, detalhes, especifica\u00e7\u00f5es, estudos de lan\u00e7amento e assinatura do respons\u00e1vel.<\u002Fdiv>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"memory\">Abrir Memorial<\u002Fbutton><button class=\"btn small\" data-go=\"report\">Abrir Relat\u00f3rio<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"dados\" data-keywords=\"salvar projeto biblioteca local autosave backup json importar exportar duplicar restaurar navegador arquivo \u00fanico offline\">\n          <summary><span class=\"manual-topic-icon\">14<\u002Fspan><span><b>Salvamento, biblioteca e c\u00f3pias de seguran\u00e7a<\u002Fb><small>Como preservar, duplicar, transportar e restaurar os dados.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <ol><li>O autosave mant\u00e9m o projeto corrente no armazenamento local do navegador.<\u002Fli><li>Use <b>Salvar projeto<\u002Fb> para criar ou atualizar uma entrada na biblioteca local.<\u002Fli><li>Use <b>JSON<\u002Fb> para exportar o projeto corrente e transportar os dados para outro navegador.<\u002Fli><li>Na tela Projetos salvos, exporte a biblioteca completa para uma c\u00f3pia de seguran\u00e7a.<\u002Fli><li>Importe JSON para restaurar um projeto ou biblioteca compat\u00edvel.<\u002Fli><li>Use \u201cDuplicar\u201d antes de testar cen\u00e1rios que n\u00e3o devem alterar a vers\u00e3o principal.<\u002Fli><\u002Fol>\n            <div class=\"manual-callout warn\">Limpar dados do navegador, usar modo privado ou trocar de computador pode remover a biblioteca local. Mantenha arquivos JSON externos para projetos relevantes.<\u002Fdiv>\n            <div class=\"manual-shortcuts\"><button class=\"btn small primary\" data-go=\"saved\">Abrir Projetos salvos<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"ajuda\" data-keywords=\"gloss\u00e1rio significado termos C IDF Tr Tc Manning y D Froude recobrimento bordo livre tens\u00e3o trativa\">\n          <summary><span class=\"manual-topic-icon\">A\u2013Z<\u002Fspan><span><b>Gloss\u00e1rio essencial<\u002Fb><small>Significado dos principais s\u00edmbolos e indicadores apresentados.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\"><div class=\"manual-glossary\">\n            <div><b>A<\u002Fb><span>\u00c1rea contribuinte da bacia.<\u002Fspan><\u002Fdiv><div><b>C<\u002Fb><span>Coeficiente de escoamento superficial.<\u002Fspan><\u002Fdiv><div><b>IDF<\u002Fb><span>Rela\u00e7\u00e3o intensidade\u2013dura\u00e7\u00e3o\u2013frequ\u00eancia da chuva.<\u002Fspan><\u002Fdiv><div><b>Tr<\u002Fb><span>Per\u00edodo de retorno adotado para o evento.<\u002Fspan><\u002Fdiv><div><b>Tc<\u002Fb><span>Tempo de concentra\u00e7\u00e3o da bacia.<\u002Fspan><\u002Fdiv><div><b>Q<\u002Fb><span>Vaz\u00e3o de projeto ou capacidade hidr\u00e1ulica.<\u002Fspan><\u002Fdiv><div><b>n de Manning<\u002Fb><span>Coeficiente de rugosidade da superf\u00edcie ou conduto.<\u002Fspan><\u002Fdiv><div><b>y/D<\u002Fb><span>Rela\u00e7\u00e3o entre l\u00e2mina calculada e altura ou di\u00e2metro da se\u00e7\u00e3o.<\u002Fspan><\u002Fdiv><div><b>Q/Qcap.<\u002Fb><span>Percentual de utiliza\u00e7\u00e3o da capacidade.<\u002Fspan><\u002Fdiv><div><b>Recobrimento<\u002Fb><span>Dist\u00e2ncia entre terreno e geratriz superior da galeria.<\u002Fspan><\u002Fdiv><div><b>Fr<\u002Fb><span>N\u00famero de Froude usado para classificar o regime do canal.<\u002Fspan><\u002Fdiv><div><b>Bordo livre<\u002Fb><span>Folga vertical entre a l\u00e2mina e o topo da se\u00e7\u00e3o.<\u002Fspan><\u002Fdiv><div><b>Tens\u00e3o trativa<\u002Fb><span>Esfor\u00e7o hidr\u00e1ulico atuante sobre o revestimento do canal.<\u002Fspan><\u002Fdiv><div><b>Vaz\u00e3o residual<\u002Fb><span>Parcela n\u00e3o captada pela boca de lobo.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fdetails>\n\n        <details class=\"manual-topic\" data-manual-topic data-category=\"ajuda\" data-keywords=\"problemas erro n\u00e3o abre bot\u00e3o dados sumiram gr\u00e1fico vazio pdf impress\u00e3o alerta ciclo capacidade insuficiente troubleshooting d\u00favidas\">\n          <summary><span class=\"manual-topic-icon\">?<\u002Fspan><span><b>Solu\u00e7\u00e3o de problemas frequentes<\u002Fb><small>Diagn\u00f3stico r\u00e1pido para situa\u00e7\u00f5es comuns durante o uso.<\u002Fsmall><\u002Fspan><span class=\"manual-chevron\">\u2304<\u002Fspan><\u002Fsummary>\n          <div class=\"manual-topic-body\">\n            <h4>O gr\u00e1fico ou a tabela est\u00e1 vazio<\u002Fh4><p>Confirme se os dados da etapa anterior foram cadastrados e aplicados. Por exemplo, a rede depende de galerias conectadas e o perfil depende das cotas.<\u002Fp>\n            <h4>A vaz\u00e3o n\u00e3o aparece na galeria<\u002Fh4><p>Verifique se o campo \u201cPonto de lan\u00e7amento\u201d da bacia corresponde exatamente ao c\u00f3digo do trecho. Depois, recalcule a rede.<\u002Fp>\n            <h4>O sistema acusa ciclo hidr\u00e1ulico<\u002Fh4><p>H\u00e1 uma sequ\u00eancia de trechos que retorna a um n\u00f3 anterior. Corrija os campos de montante e jusante para estabelecer um sentido ac\u00edclico.<\u002Fp>\n            <h4>O dimensionamento autom\u00e1tico n\u00e3o encontra di\u00e2metro<\u002Fh4><p>Revise vaz\u00e3o, declividade, n, limites de velocidade, fator de seguran\u00e7a e a lista de di\u00e2metros comerciais.<\u002Fp>\n            <h4>Os dados desapareceram<\u002Fh4><p>Procure em Projetos salvos ou restaure o \u00faltimo autosave. Se o armazenamento local foi apagado, importe o JSON de backup.<\u002Fp>\n            <h4>O PDF sai incompleto<\u002Fh4><p>Abra Relat\u00f3rio, selecione o modo desejado, pressione Atualizar e use a impress\u00e3o do navegador. Na visualiza\u00e7\u00e3o, escolha escala e margens adequadas.<\u002Fp>\n            <h4>O bot\u00e3o \u201cEntrar no sistema\u201d n\u00e3o habilita<\u002Fh4><p>Marque a caixa de concord\u00e2ncia do aviso legal. O bot\u00e3o permanece desabilitado enquanto a confirma\u00e7\u00e3o n\u00e3o estiver selecionada.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fmain>\n<\u002Fdiv>\n\n<div class=\"modal\" id=\"editorModal\"><div class=\"modal-box\"><div class=\"card-head\"><h3 id=\"modalTitle\">Editar item<\u002Fh3><button class=\"icon-btn\" id=\"closeModal\">\u00d7<\u002Fbutton><\u002Fdiv><div id=\"modalBody\"><\u002Fdiv><div class=\"actions mt\"><button class=\"btn danger\" id=\"modalDelete\">Excluir<\u002Fbutton><span style=\"flex:1\"><\u002Fspan><button class=\"btn\" id=\"modalCancel\">Cancelar<\u002Fbutton><button class=\"btn primary\" id=\"modalSave\">Salvar<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"toast-wrap\" id=\"toasts\"><\u002Fdiv>\n\n<script>\n\"use strict\";\nconst safeStorage = {\n  getItem(key){try{return window.localStorage.getItem(key)}catch{return null}},\n  setItem(key,value){try{window.localStorage.setItem(key,value);return true}catch{return false}},\n  removeItem(key){try{window.localStorage.removeItem(key);return true}catch{return false}},\n  clear(){try{window.localStorage.clear();return true}catch{return false}}\n};\n\nconst $ = id => document.getElementById(id);\nconst $$ = (sel, root=document) => [...root.querySelectorAll(sel)];\nconst deepClone = obj => JSON.parse(JSON.stringify(obj));\nconst uid = (prefix=\"id\") => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;\nconst clamp = (v,a,b) => Math.min(b,Math.max(a,v));\nconst hasNumber = v => v !== null && v !== \"\" && v !== undefined && Number.isFinite(Number(v));\nconst asNumber = (v, fallback=0) => {\n  if (v === null || v === undefined || v === \"\") return fallback;\n  const n = Number(String(v).replace(\",\", \".\"));\n  return Number.isFinite(n) ? n : fallback;\n};\nconst nval = (id, fallback=0) => asNumber($(id)?.value, fallback);\nconst sval = id => String($(id)?.value ?? \"\").trim();\nconst escapeHTML = s => String(s ?? \"\").replace(/[&<>\"']/g,m=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#039;\"}[m]));\nconst formatDate = d => {\n  if(!d) return \"\u2014\";\n  const x = new Date(`${d}T12:00:00`);\n  return Number.isNaN(x.getTime()) ? d : x.toLocaleDateString(\"pt-BR\");\n};\nconst todayISO = () => new Date().toISOString().slice(0,10);\nconst fmt = (v,d) => Number.isFinite(Number(v)) ? Number(v).toLocaleString(\"pt-BR\",{minimumFractionDigits:d ?? state.settings.decimals,maximumFractionDigits:d ?? state.settings.decimals}) : \"\u2014\";\nconst pct = (v,d=1) => Number.isFinite(Number(v)) ? `${fmt(Number(v)*100,d)}%` : \"\u2014\";\nconst statusBadge = (level,label) => `<span class=\"badge ${level}\">${level===\"ok\"?\"\u2713\":level===\"danger\"?\"!\":\"\u2022\"} ${escapeHTML(label)}<\u002Fspan>`;\nconst calcStatus = (util) => !Number.isFinite(util) ? [\"info\",\"Incompleto\"] : util>1 ? [\"danger\",\"Insuficiente\"] : util>=state.settings.warnUtil/100 ? [\"warn\",\"Pr\u00f3ximo ao limite\"] : [\"ok\",\"Adequado\"];\nconst debounce = (fn,ms=350) => {let t;return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};\nconst downloadBlob = (name, content, type=\"text/plain;charset=utf-8\") => {\n  const blob = content instanceof Blob ? content : new Blob([content],{type});\n  const url = URL.createObjectURL(blob), a=document.createElement(\"a\");\n  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);\n};\nconst csvCell = v => `\"${String(v ?? \"\").replace(/\"/g,'\"\"')}\"`;\nconst toast = (msg) => {\n  const el=document.createElement(\"div\");el.className=\"toast\";el.textContent=msg;$(\"toasts\").appendChild(el);\n  setTimeout(()=>el.remove(),2800);\n};\n\nconst DEFAULT_SETTINGS = {\n  minV:0.75,maxV:5,maxFill:85,minCover:0.60,maxSpread:3,maxGutterDepth:0.15,warnUtil:80,decimals:3,\n  minFreeboard:0.30,minInletEff:60,defaultClog:30,safety:1.10,\n  criteriaSource:\"Crit\u00e9rios preliminares edit\u00e1veis. Substituir pelos limites do manual municipal, \u00f3rg\u00e3o contratante e normas aplic\u00e1veis.\",\n  diameters:[300,400,500,600,800,1000,1200,1500,1800,2000],\n  coefficients:[\n    {name:\"Telhado\",c:0.90},{name:\"Pavimento asf\u00e1ltico\",c:0.85},{name:\"Concreto\",c:0.90},\n    {name:\"Cal\u00e7ada\",c:0.75},{name:\"Estacionamento pavimentado\",c:0.80},{name:\"Solo compactado\",c:0.55},\n    {name:\"\u00c1rea verde\",c:0.25},{name:\"Terreno natural\",c:0.20},{name:\"Residencial\",c:0.60},{name:\"Comercial\",c:0.80}\n  ],\n  mannings:[\n    {name:\"Concreto liso\",n:0.013},{name:\"Concreto comum\",n:0.015},{name:\"PVC/PEAD liso\",n:0.011},\n    {name:\"Alvenaria revestida\",n:0.015},{name:\"Canal de terra regular\",n:0.025},{name:\"Canal vegetado\",n:0.035}\n  ]\n};\nfunction blankState(){\n  return {\n    schema:2,modified:new Date().toISOString(),\n    project:{id:uid(\"prj\"),name:\"Novo projeto\",code:\"\",version:\"1.0\",engineer:\"\",registry:\"\",client:\"\",date:todayISO(),city:\"\",state:\"\",address:\"\",occupation:\"Residencial\",crs:\"\",description:\"\",notes:\"\"},\n    idf:{K:1100,a:0.15,b:12,c:0.75,tr:10,t:15,station:\"\",source:\"\"},\n    basins:[],gutters:[],inlets:[],pipes:[],structures:[],channels:[],\n    settings:deepClone(DEFAULT_SETTINGS),tcSelection:null\n  };\n}\nlet state=blankState();\nlet lastChecks=[];\nlet modalContext=null;\nlet tcComparison=[];\nconst CURRENT_KEY=\"drenapro_current_v2\";\nconst LIB_KEY=\"drenapro_library_v2\";\nconst AUTOSAVE_KEY=\"drenapro_autosave_v2\";\n\nfunction normalizeState(raw){\n  const base=blankState(), s=Object.assign(base,raw||{});\n  s.project=Object.assign(base.project,raw?.project||{});\n  s.idf=Object.assign(base.idf,raw?.idf||{});\n  s.settings=Object.assign(deepClone(DEFAULT_SETTINGS),raw?.settings||{});\n  for(const k of [\"basins\",\"gutters\",\"inlets\",\"pipes\",\"structures\",\"channels\"]) if(!Array.isArray(s[k])) s[k]=[];\n  s.settings.coefficients=Array.isArray(s.settings.coefficients)?s.settings.coefficients:deepClone(DEFAULT_SETTINGS.coefficients);\n  s.settings.mannings=Array.isArray(s.settings.mannings)?s.settings.mannings:deepClone(DEFAULT_SETTINGS.mannings);\n  s.settings.diameters=(s.settings.diameters||DEFAULT_SETTINGS.diameters).map(Number).filter(v=>v>0).sort((a,b)=>a-b);\n  return s;\n}\nfunction getLibrary(){\n  try{const x=JSON.parse(safeStorage.getItem(LIB_KEY)||\"[]\");return Array.isArray(x)?x:[]}catch{return []}\n}\nfunction setLibrary(lib){safeStorage.setItem(LIB_KEY,JSON.stringify(lib))}\nconst autosave=debounce(()=>{\n  state.modified=new Date().toISOString();\n  safeStorage.setItem(CURRENT_KEY,JSON.stringify(state));\n  safeStorage.setItem(AUTOSAVE_KEY,JSON.stringify(state));\n  $(\"saveState\").innerHTML='<span class=\"status-dot\"><\u002Fspan>Salvo automaticamente';\n  updateSideProject();\n},250);\nfunction persist(render=false){autosave();if(render) renderAll()}\nfunction saveToLibrary(asCopy=false){\n  let lib=getLibrary();\n  if(asCopy){state.project.id=uid(\"prj\");state.project.name=`${state.project.name} \u2014 c\u00f3pia`}\n  const snapshot=deepClone(state);snapshot.modified=new Date().toISOString();\n  const idx=lib.findIndex(x=>x.project?.id===snapshot.project.id);\n  if(idx>=0) lib[idx]=snapshot; else lib.unshift(snapshot);\n  setLibrary(lib);state=snapshot;safeStorage.setItem(CURRENT_KEY,JSON.stringify(state));renderAll();toast(\"Projeto salvo na biblioteca local.\");\n}\nfunction updateSideProject(){\n  $(\"sideProjectName\").textContent=state.project.name||\"Novo projeto\";\n  $(\"sideProjectMeta\").textContent=`${state.project.code||\"Sem c\u00f3digo\"} \u2022 v${state.project.version||\"1.0\"}`;\n}\nfunction loadInitial(){\n  try{\n    const saved=safeStorage.getItem(CURRENT_KEY);\n    state=saved?normalizeState(JSON.parse(saved)):blankState();\n  }catch{state=blankState()}\n}\n\n/* ===================== C\u00c1LCULOS HIDROL\u00d3GICOS ===================== */\nfunction idfIntensity(duration=state.idf.t,tr=state.idf.tr,idf=state.idf){\n  const K=asNumber(idf.K),a=asNumber(idf.a),b=asNumber(idf.b),c=asNumber(idf.c),t=asNumber(duration),T=asNumber(tr);\n  if(K<=0||T<=0||t+b<=0) return NaN;\n  return K*Math.pow(T,a)/Math.pow(t+b,c);\n}\nfunction basinArea(b){\n  const sum=(b.surfaces||[]).reduce((a,s)=>a+Math.max(0,asNumber(s.area)),0);\n  return asNumber(b.area)>0?asNumber(b.area):sum;\n}\nfunction basinSurfaceArea(b){return (b.surfaces||[]).reduce((a,s)=>a+Math.max(0,asNumber(s.area)),0)}\nfunction basinC(b){\n  const items=(b.surfaces||[]).filter(s=>asNumber(s.area)>0);\n
