document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\">\n          Li e concordo com os termos do Aviso Legal\n        <\/label>\n        <div style=\"display:flex; gap:12px; justify-content:flex-end; align-items:center;\">\n          <div style=\"flex:1; color:#5f728a; font-size:11px;\">v1.4.0 · parâmetros normativos editáveis<\/div>\n          <button sc-camel-on-click=\"{{ onAccept }}\" disabled=\"{{ notAgreed }}\" style=\"border:none; border-radius:11px; padding:12px 26px; font-size:14px; font-weight:700; cursor:pointer; color:#fff; background:linear-gradient(135deg,#35c2ff,#2478ff); box-shadow:0 10px 28px rgba(36,120,255,.4); opacity:{{ acceptOpacity }}; transition:opacity .25s, transform .15s;\" style-hover=\"transform:translateY(-1px);\">{{ acceptLabel }}<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{ opened }}\" hint-placeholder-val=\"{{ false }}\">\n    <iframe src=\"{{ appSrc }}\" title=\"ProtendPro\" style=\"position:absolute; inset:0; width:100%; height:100%; border:none; z-index:80; background:#07111f; animation:fadeIn .5s ease both;\"><\/iframe>\n  <\/sc-if>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;duracaoSegundos&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:6,&quot;min&quot;:4,&quot;max&quot;:12,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Animação&quot;},&quot;mostrarBotaoPular&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Animação&quot;}}\">\nclass Component extends DCLogic {\n  state = { showModal: false, agreed: false, leaving: false, opened: false };\n  mountRef = el => { this.mount = el; };\n  cMomentRef = el => { this.cMoment = el; };\n  cShearRef = el => { this.cShear = el; };\n  cMohrRef = el => { this.cMohr = el; };\n  cSectionRef = el => { this.cSection = el; };\n  barRef = el => { this.bar = el; };\n  phaseRef = el => { this.phaseEl = el; };\n\n  renderVals() {\n    return {\n      mountRef: this.mountRef, cMomentRef: this.cMomentRef, cShearRef: this.cShearRef,\n      cMohrRef: this.cMohrRef, cSectionRef: this.cSectionRef, barRef: this.barRef, phaseRef: this.phaseRef,\n      showModal: this.state.showModal && !this.state.opened,\n      opened: this.state.opened,\n      appSrc: (window.__resources && window.__resources.appHtml) || 'uploads/ProtendPro.html',\n      showSkip: (this.props.mostrarBotaoPular ?? true) && !this.state.showModal,\n      agreed: this.state.agreed,\n      notAgreed: !this.state.agreed || this.state.leaving,\n      acceptOpacity: this.state.agreed ? 1 : 0.45,\n      acceptLabel: this.state.leaving ? 'Acesso liberado ✓' : 'Acessar o ProtendPro',\n      onAgree: e => this.setState({ agreed: e.target.checked }),\n      onAccept: () => {\n        if (!this.state.agreed) return;\n        this.setState({ leaving: true });\n        try { localStorage.setItem('protendpro_disclaimer_ok', new Date().toISOString()); } catch (e) {}\n        setTimeout(() => { cancelAnimationFrame(this.raf); this.setState({ opened: true }); }, 700);\n      },\n      onSkip: () => { if (this.fallback) this.setState({ showModal: true }); else this.t0 = performance.now() - this.DUR * 1000; }\n    };\n  }\n\n  componentDidMount() {\n    window.__pp = this;\n    this.DUR = Math.max(3, this.props.duracaoSegundos ?? 6);\n    this.dead = false;\n    this.waitAttempts = 0;\n    const wait = () => {\n      if (this.dead) return;\n      if (window.THREE && this.mount) {\n        if (!this.canUseWebGL()) this.initFallback();\n        else {\n          try { this.init(); }\n          catch (err) {\n            console.warn('ProtendPro: abertura 3D indisponível; usando modo simplificado.');\n            this.initFallback();\n          }\n        }\n      } else if (++this.waitAttempts >= 120) {\n        console.warn('ProtendPro: Three.js não carregou; usando abertura simplificada.');\n        this.initFallback();\n      } else setTimeout(wait, 60);\n    };\n    wait();\n  }\n  componentWillUnmount() { this.dead = true; cancelAnimationFrame(this.raf); if (this.renderer) this.renderer.dispose(); }\n\n  canUseWebGL() {\n    try {\n      if (navigator.webdriver && /HeadlessChrome/i.test(navigator.userAgent || '')) return false;\n      const canvas = document.createElement('canvas');\n      const attrs = { alpha: true, antialias: true, failIfMajorPerformanceCaveat: true };\n      const gl = canvas.getContext('webgl2', attrs) || canvas.getContext('webgl', attrs) || canvas.getContext('experimental-webgl', attrs);\n      if (gl) {\n        const ext = gl.getExtension && gl.getExtension('WEBGL_lose_context');\n        if (ext && ext.loseContext) ext.loseContext();\n      }\n      return !!gl;\n    } catch (err) { return false; }\n  }\n\n  initFallback() {\n    if (this.fallback || this.dead) return;\n    this.fallback = true;\n    this.setupCanvas(this.cMoment); this.setupCanvas(this.cShear); this.setupCanvas(this.cMohr); this.setupCanvas(this.cSection);\n    this.drawMoment(1, 0); this.drawShear(1); this.drawMohr(1, 0); this.drawSection(1, 1);\n    if (this.bar) this.bar.style.width = '100%';\n    if (this.phaseEl) this.phaseEl.textContent = 'Abertura simplificada — pronto';\n    setTimeout(() => { if (!this.dead && !this.state.opened) this.setState({ showModal: true }); }, 180);\n  }\n\n  init() {\n    const T = window.THREE, m = this.mount;\n    const W = m.clientWidth, H = m.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);\n    this.scene = new T.Scene();\n    this.scene.fog = new T.Fog(0x081527, 18, 42);\n    this.camera = new T.PerspectiveCamera(38, W / H, 0.1, 100);\n    this.renderer = new T.WebGLRenderer({ antialias: true, alpha: true });\n    this.renderer.setPixelRatio(dpr);\n    this.renderer.setSize(W, H);\n    this.renderer.shadowMap.enabled = true;\n    this.renderer.shadowMap.type = T.PCFSoftShadowMap;\n    m.appendChild(this.renderer.domElement);\n\n    this.scene.add(new T.AmbientLight(0xbfd4ff, 0.55));\n    const sun = new T.DirectionalLight(0xffffff, 0.95); sun.position.set(6, 12, 8); sun.castShadow = true;\n    sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;\n    sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -6;\n    this.scene.add(sun);\n    const rim = new T.PointLight(0x35c2ff, 0.9, 30); rim.position.set(-8, 3, -6); this.scene.add(rim);\n    const rim2 = new T.PointLight(0x9e8cff, 0.55, 30); rim2.position.set(8, 2, 6); this.scene.add(rim2);\n\n    this.group = new T.Group(); this.scene.add(this.group);\n    this.L = 10;\n\n    // ground grid\n    const grid = new T.GridHelper(40, 40, 0x1d3453, 0x14263f);\n    grid.position.y = -2.05; this.scene.add(grid);\n    const ground = new T.Mesh(new T.PlaneGeometry(60, 60), new T.ShadowMaterial({ opacity: 0.35 }));\n    ground.rotation.x = -Math.PI / 2; ground.position.y = -2.04; ground.receiveShadow = true; this.scene.add(ground);\n\n    // beam with vertex colors\n    const geo = new T.BoxGeometry(this.L, 1, 0.9, 96, 8, 2);\n    this.orig = geo.attributes.position.array.slice();\n    geo.setAttribute('color', new T.BufferAttribute(new Float32Array(geo.attributes.position.count * 3), 3));\n    this.beam = new T.Mesh(geo, new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.42, metalness: 0.12 }));\n    this.beam.castShadow = true;\n    this.group.add(this.beam);\n\n    // tendon (parabolic, low at midspan)\n    const pts = [];\n    for (let i = 0; i <= 60; i++) {\n      const x = -this.L / 2 + (i / 60) * this.L;\n      const u = (2 * x) / this.L;\n      pts.push(new T.Vector3(x, -0.32 * (1 - u * u), 0));\n    }\n    const tube = new T.TubeGeometry(new T.CatmullRomCurve3(pts), 120, 0.055, 10, false);\n    this.tendonTotal = tube.index.count;\n    this.tendonMat = new T.MeshStandardMaterial({ color: 0xff6b3d, emissive: 0xff3d1f, emissiveIntensity: 0.35, roughness: 0.3, metalness: 0.6 });\n    this.tendon = new T.Mesh(tube, this.tendonMat);\n    this.tendon.geometry.setDrawRange(0, 0);\n    this.group.add(this.tendon);\n\n    // anchor plates + jacking arrows\n    this.anchors = [];\n    [-1, 1].forEach(s => {\n      const plate = new T.Mesh(new T.BoxGeometry(0.12, 1.15, 1.05), new T.MeshStandardMaterial({ color: 0x8fa5c4, metalness: 0.8, roughness: 0.3 }));\n      plate.position.x = s * (this.L / 2 + 0.06); this.group.add(plate);\n      const arr = new T.Group();\n      const shaft = new T.Mesh(new T.CylinderGeometry(0.06, 0.06, 1.1, 12), new T.MeshStandardMaterial({ color: 0xff4d5e, emissive: 0xff2233, emissiveIntensity: 0.5 }));\n      shaft.rotation.z = Math.PI / 2; shaft.position.x = 0.75; arr.add(shaft);\n      const head = new T.Mesh(new T.ConeGeometry(0.16, 0.4, 16), new T.MeshStandardMaterial({ color: 0xff4d5e, emissive: 0xff2233, emissiveIntensity: 0.5 }));\n      head.rotation.z = Math.PI / 2; head.position.x = 0.1; arr.add(head);\n      arr.position.set(s * (this.L / 2 + 0.25), -0.32, 0);\n      if (s === 1) arr.rotation.y = Math.PI;\n      arr.scale.setScalar(0.001);\n      this.group.add(arr); this.anchors.push(arr);\n    });\n\n    // supports\n    [-1, 1].forEach(s => {\n      const sup = new T.Mesh(new T.CylinderGeometry(0.28, 0.42, 1.35, 4), new T.MeshStandardMaterial({ color: 0x33507a, roughness: 0.6 }));\n      sup.rotation.y = Math.PI / 4; sup.position.set(s * (this.L / 2 - 0.6), -1.35, 0); sup.castShadow = true;\n      this.scene.add(sup);\n    });\n\n    this.group.scale.setScalar(0.001);\n    this.setupCanvas(this.cMoment); this.setupCanvas(this.cShear); this.setupCanvas(this.cMohr); this.setupCanvas(this.cSection);\n\n    this.onResize = () => {\n      const w = m.clientWidth, h = m.clientHeight;\n      this.camera.aspect = w / h; this.camera.updateProjectionMatrix(); this.renderer.setSize(w, h);\n    };\n    window.addEventListener('resize', this.onResize);\n\n    this.t0 = performance.now();\n    const loop = () => {\n      if (this.dead) return;\n      this.raf = requestAnimationFrame(loop);\n      this.tick((performance.now() - this.t0) / 1000);\n    };\n    loop();\n  }\n\n  setupCanvas(c) {\n    if (!c) return;\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;\n    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);\n  }\n\n  ease(x) { return x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3); }\n  ph(t, a, b) { return this.ease((t - a) / (b - a)); }\n\n  tick(t) {\n    const D = this.DUR, f = 6 / D, ts = t * f; // normalized to 6s script\n    const appear = this.ph(ts, 0, 1.0);\n    const thread = this.ph(ts, 0.8, 2.3);\n    const jack = this.ph(ts, 2.2, 3.4);\n    const pM = this.ph(ts, 2.4, 3.8), pV = this.ph(ts, 3.0, 4.4), pMo = this.ph(ts, 3.8, 5.6), pS = this.ph(ts, 2.2, 3.6);\n\n    this.group.scale.setScalar(Math.max(0.001, appear));\n    this.tendon.geometry.setDrawRange(0, Math.floor(thread * this.tendonTotal));\n    this.tendonMat.emissiveIntensity = 0.35 + jack * 0.55 + 0.15 * Math.sin(t * 6) * jack;\n    this.anchors.forEach(a => { a.scale.setScalar(Math.max(0.001, jack)); a.position.y = -0.32 + jack * 0.1; });\n\n    // beam deform + stress colors\n    const pos = this.beam.geometry.attributes.position, col = this.beam.geometry.attributes.color;\n    const tmp = new window.THREE.Color();\n    for (let i = 0; i < pos.count; i++) {\n      const x = this.orig[i * 3], y = this.orig[i * 3 + 1];\n      const u = (2 * x) / this.L, shape = 1 - u * u;\n      pos.array[i * 3 + 1] = y + jack * 0.34 * shape;\n      // prestress: strong compression bottom, mild tension top at midspan\n      const sig = jack * (-0.35 - 1.15 * y * shape); // y=-0.5 bottom -> very negative\n      const n = Math.min(1, Math.max(0, (sig + 1) / 1.25));\n      tmp.setHSL((240 - 240 * (1 - n)) / 360, 0.8, 0.5 + 0.1 * (1 - jack));\n      // idle grey before jacking\n      if (jack < 0.02) tmp.setHSL(0.58, 0.15, 0.55);\n      col.array[i * 3] = tmp.r; col.array[i * 3 + 1] = tmp.g; col.array[i * 3 + 2] = tmp.b;\n    }\n    pos.needsUpdate = true; col.needsUpdate = true;\n    this.beam.geometry.computeVertexNormals();\n\n    // camera\n    const a = -0.55 + 0.1 * Math.sin(t * 0.45) + t * 0.018;\n    const r = 15.5 - 2.5 * appear;\n    this.camera.position.set(Math.sin(a) * r, 3.6 + 1.2 * Math.cos(t * 0.3), Math.cos(a) * r);\n    this.camera.lookAt(0, 0.1, 0);\n    this.renderer.render(this.scene, this.camera);\n\n    this.drawMoment(pM, t); this.drawShear(pV); this.drawMohr(pMo, t); this.drawSection(pS, jack);\n\n    // progress + phase\n    const prog = Math.min(1, ts / 6);\n    if (this.bar) this.bar.style.width = (prog * 100).toFixed(1) + '%';\n    const labels = [[0, 'Modelando a viga…'], [0.8, 'Traçando o cabo de protensão…'], [2.2, 'Aplicando a força de protensão…'], [3.0, 'Gerando diagramas de esforços…'], [3.8, 'Análise de tensões — Círculo de Mohr…'], [5.7, 'Pronto']];\n    let lab = labels[0][1]; labels.forEach(l => { if (ts >= l[0]) lab = l[1]; });\n    if (this.phaseEl && this.phaseEl.textContent !== lab) this.phaseEl.textContent = lab;\n\n    if (ts >= 6.15 && !this.state.showModal) this.setState({ showModal: true });\n  }\n\n  chart(c) {\n    if (!c) return null;\n    const ctx = c.getContext('2d'), W = c.clientWidth, H = c.clientHeight;\n    ctx.clearRect(0, 0, W, H);\n    return { ctx, W, H };\n  }\n  axes(ctx, W, y0, x0) {\n    ctx.strokeStyle = 'rgba(148,163,184,.4)'; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(W - 8, y0); ctx.stroke();\n  }\n\n  drawMoment(p, t) {\n    const s = this.chart(this.cMoment); if (!s) return;\n    const { ctx, W, H } = s, x0 = 14, x1 = W - 14, y0 = H * 0.34;\n    this.axes(ctx, W, y0, 10);\n    // M_q sagging (drawn downward, tension side) — cyan fill\n    const g = ctx.createLinearGradient(0, y0, 0, H);\n    g.addColorStop(0, 'rgba(53,194,255,.55)'); g.addColorStop(1, 'rgba(36,120,255,.08)');\n    ctx.beginPath(); ctx.moveTo(x0, y0);\n    const n = Math.max(2, Math.floor(80 * p));\n    for (let i = 0; i <= n; i++) {\n      const q = (i / 80), x = x0 + q * (x1 - x0);\n      ctx.lineTo(x, y0 + 4 * q * (1 - q) * (H * 0.56) * p);\n    }\n    ctx.lineTo(x0 + (n / 80) * (x1 - x0), y0); ctx.closePath();\n    ctx.fillStyle = g; ctx.fill();\n    ctx.strokeStyle = '#35c2ff'; ctx.lineWidth = 2;\n    ctx.beginPath();\n    for (let i = 0; i <= n; i++) {\n      const q = i / 80, x = x0 + q * (x1 - x0), y = y0 + 4 * q * (1 - q) * (H * 0.56) * p;\n      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);\n    }\n    ctx.stroke();\n    // M_p (prestress balancing, upward) — dashed orange\n    if (p > 0.35) {\n      const pp = this.ease((p - 0.35) / 0.65);\n      ctx.setLineDash([5, 4]); ctx.strokeStyle = '#ff9b5a'; ctx.lineWidth = 1.8;\n      ctx.beginPath();\n      const n2 = Math.floor(80 * pp);\n      for (let i = 0; i <= n2; i++) {\n        const q = i / 80, x = x0 + q * (x1 - x0), y = y0 - 4 * q * (1 - q) * (H * 0.26) * pp;\n        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);\n      }\n      ctx.stroke(); ctx.setLineDash([]);\n      ctx.fillStyle = '#ff9b5a'; ctx.font = '600 10px Inter'; ctx.fillText('M·P (protensão)', x0 + 4, y0 - H * 0.28);\n    }\n    ctx.fillStyle = '#35c2ff'; ctx.font = '600 10px Inter';\n    if (p > 0.15) ctx.fillText('Mmáx = ' + (842 * p).toFixed(0) + ' kN·m', W / 2 - 40, H - 8);\n  }\n\n  drawShear(p) {\n    const s = this.chart(this.cShear); if (!s) return;\n    const { ctx, W, H } = s, x0 = 14, x1 = W - 14, y0 = H / 2, amp = H * 0.36 * p;\n    this.axes(ctx, W, y0, 10);\n    const xm = x0 + (x1 - x0) * Math.min(1, p * 1.15);\n    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y0 - amp);\n    ctx.lineTo(xm, y0 - amp + (xm - x0) / (x1 - x0) * 2 * amp); ctx.lineTo(xm, y0); ctx.closePath();\n    const g1 = ctx.createLinearGradient(0, y0 - amp, 0, y0 + amp);\n    g1.addColorStop(0, 'rgba(61,220,151,.5)'); g1.addColorStop(0.5, 'rgba(61,220,151,.06)');\n    g1.addColorStop(0.5, 'rgba(255,107,122,.06)'); g1.addColorStop(1, 'rgba(255,107,122,.5)');\n    ctx.fillStyle = g1; ctx.fill();\n    ctx.strokeStyle = '#3ddc97'; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.moveTo(x0, y0 - amp); ctx.lineTo(xm, y0 - amp + (xm - x0) / (x1 - x0) * 2 * amp); ctx.stroke();\n    ctx.fillStyle = '#3ddc97'; ctx.font = '600 10px Inter';\n    if (p > 0.15) { ctx.fillText('+V = ' + (337 * p).toFixed(0) + ' kN', x0 + 2, y0 - amp - 4); }\n    ctx.fillStyle = '#ff6b7a';\n    if (p > 0.6) { ctx.fillText('−V', x1 - 22, y0 + amp + 2); }\n  }\n\n  drawMohr(p, t) {\n    const s = this.chart(this.cMohr); if (!s) return;\n    const { ctx, W, H } = s, cy = H * 0.52, ax = W * 0.56;\n    ctx.strokeStyle = 'rgba(148,163,184,.4)'; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(8, cy); ctx.lineTo(W - 8, cy); ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(ax, 8); ctx.lineTo(ax, H - 8); ctx.stroke();\n    ctx.fillStyle = '#95a8c2'; ctx.font = '600 10px Inter';\n    ctx.fillText('σ', W - 16, cy - 5); ctx.fillText('τ', ax + 5, 15);\n    if (p <= 0.01) return;\n    const sc = W * 0.026, c = -8, R = 6;\n    const ccx = ax + c * sc;\n    // circle progressive\n    ctx.strokeStyle = '#9e8cff'; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.arc(ccx, cy, R * sc, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ctx.stroke();\n    const gg = ctx.createRadialGradient(ccx, cy, 0, ccx, cy, R * sc);\n    gg.addColorStop(0, 'rgba(158,140,255,.16)'); gg.addColorStop(1, 'rgba(158,140,255,.03)');\n    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(ccx, cy, R * sc, 0, Math.PI * 2); ctx.fill();\n    // sigma1 / sigma2 ticks\n    if (p > 0.5) {\n      ctx.fillStyle = '#3ddc97'; ctx.beginPath(); ctx.arc(ccx + R * sc, cy, 3.4, 0, 7); ctx.fill();\n      ctx.fillStyle = '#ff6b7a'; ctx.beginPath(); ctx.arc(ccx - R * sc, cy, 3.4, 0, 7); ctx.fill();\n      ctx.fillStyle = '#3ddc97'; ctx.font = '700 10px Inter'; ctx.fillText('σ₁', ccx + R * sc - 6, cy + 16);\n      ctx.fillStyle = '#ff6b7a'; ctx.fillText('σ₂', ccx - R * sc - 6, cy + 16);\n    }\n    // rotating diameter (plane rotation 2θ)\n    if (p > 0.7) {\n      const phi = t * 1.5;\n      const px = ccx + R * sc * Math.cos(phi), py = cy + R * sc * Math.sin(phi);\n      ctx.strokeStyle = 'rgba(53,194,255,.8)'; ctx.lineWidth = 1.6;\n      ctx.beginPath(); ctx.moveTo(2 * ccx - px, 2 * cy - py); ctx.lineTo(px, py); ctx.stroke();\n      ctx.fillStyle = '#35c2ff'; ctx.beginPath(); ctx.arc(px, py, 4, 0, 7); ctx.fill();\n      ctx.fillStyle = '#ffbf5a'; ctx.font = '600 10px Inter';\n      ctx.fillText('τmáx = ' + R.toFixed(1) + ' MPa', ccx - 32, cy - R * sc - 8);\n    }\n  }\n\n  drawSection(p, jack) {\n    const s = this.chart(this.cSection); if (!s) return;\n    const { ctx, W, H } = s;\n    if (p <= 0.01) return;\n    // cross-section rect\n    const bx = 22, by = 12, bw = 44, bh = H - 26;\n    const g = ctx.createLinearGradient(0, by, 0, by + bh);\n    // top mild (red-ish tension→neutral), bottom strong compression (blue)\n    g.addColorStop(0, 'hsl(' + (200 - 190 * jack) + ',75%,55%)');\n    g.addColorStop(1, 'hsl(228,85%,' + (60 - 8 * jack) + '%)');\n    ctx.globalAlpha = p;\n    ctx.fillStyle = g; ctx.fillRect(bx, by, bw, bh);\n    ctx.strokeStyle = 'rgba(231,238,248,.5)'; ctx.strokeRect(bx, by, bw, bh);\n    // tendon dot\n    ctx.fillStyle = '#ff6b3d'; ctx.beginPath(); ctx.arc(bx + bw / 2, by + bh * 0.78, 4, 0, 7); ctx.fill();\n    // stress diagram (trapezoid)\n    const dx = bx + bw + 26, zero = dx, maxw = W - dx - 46;\n    const topS = jack * 0.12 * maxw, botS = jack * maxw; // top ~0, bottom large compression\n    ctx.strokeStyle = 'rgba(148,163,184,.4)'; ctx.beginPath(); ctx.moveTo(zero, by); ctx.lineTo(zero, by + bh); ctx.stroke();\n    const g2 = ctx.createLinearGradient(zero, 0, zero + maxw, 0);\n    g2.addColorStop(0, 'rgba(53,194,255,.15)'); g2.addColorStop(1, 'rgba(36,120,255,.6)');\n    ctx.beginPath(); ctx.moveTo(zero, by); ctx.lineTo(zero + topS * p, by);\n    ctx.lineTo(zero + botS * p, by + bh); ctx.lineTo(zero, by + bh); ctx.closePath();\n    ctx.fillStyle = g2; ctx.fill(); ctx.strokeStyle = '#35c2ff'; ctx.lineWidth = 1.6; ctx.stroke();\n    ctx.fillStyle = '#e7eef8'; ctx.font = '700 11px Inter';\n    ctx.fillText('σc = ' + (14.2 * jack * p).toFixed(1) + ' MPa', zero + 6, by + bh - 6);\n    ctx.fillStyle = '#95a8c2'; ctx.font = '600 9px Inter';\n    ctx.fillText('P·e', bx + bw / 2 + 8, by + bh * 0.78 + 3);\n    ctx.globalAlpha = 1;\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
