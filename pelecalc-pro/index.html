<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeleCalc Pro — Fachada em Pele de Vidro</title>
<meta name="description" content="Dimensionamento de fachada-cortina em pele de vidro: vento (NBR 6123) por município, vidros, perfis de alumínio, ancoragens, silicone estrutural, quantitativos e exportação BIM IFC 4.">
<style>:root{
  --bg:#f4f6f8;--panel:#ffffff;--panel2:#f8fafc;--ink:#14212b;--ink2:#4a5966;--mute:#7b8a97;--line:#dbe2e8;
  --acc:#0b6e8a;--acc2:#0f8fb3;--accbg:#e3f3f8;--ok:#1e8a4c;--okbg:#e5f5ec;--warn:#b7791f;--warnbg:#fdf3e1;--bad:#c0392b;--badbg:#fbe9e7;
  --glass:#8ec6dc;--alu:#9aa3ad;--shadow:0 1px 2px rgba(16,24,32,.06),0 4px 14px rgba(16,24,32,.06);
  --r:10px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#0f151b;--panel:#16202a;--panel2:#1b2733;--ink:#e6edf3;--ink2:#b3c0cc;--mute:#7f8f9d;--line:#2a3846;
  --acc:#39b7d8;--acc2:#5fd0ee;--accbg:#123241;--ok:#4cc286;--okbg:#12301f;--warn:#e0a84a;--warnbg:#33270f;--bad:#f07167;--badbg:#3a1714;
  --glass:#3f8aa6;--alu:#6b7682;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--acc)}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;min-width:220px}
.brand svg{flex:none}
.brand b{font-size:16px;letter-spacing:.2px}.brand small{display:block;color:var(--mute);font-size:11px}
.top .proj{flex:1;min-width:120px}
.top .proj input{width:100%;max-width:520px;border:1px solid transparent;background:transparent;font-weight:600;font-size:14px;padding:6px 8px;border-radius:8px;color:var(--ink)}
.top .proj input:hover,.top .proj input:focus{border-color:var(--line);background:var(--panel2);outline:none}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:7px 11px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:var(--acc2);color:#fff}
.btn.sm{padding:4px 8px;font-size:12px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:14px;padding:14px;max-width:1700px;margin:0 auto}
nav.side{position:sticky;top:66px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;box-shadow:var(--shadow)}
nav.side button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;color:var(--ink2);padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer}
nav.side button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:11px;color:var(--mute)}
nav.side button:hover{background:var(--panel2);color:var(--ink)}
nav.side button.on{background:var(--accbg);color:var(--acc);font-weight:600}
nav.side button.on .n{background:var(--acc);border-color:var(--acc);color:#fff}
nav.side hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
main{min-width:0}
section.tab{display:none}section.tab.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:17px}.card h3{margin:14px 0 8px;font-size:14px;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.card .sub{color:var(--mute);margin:0 0 12px;font-size:12.5px}
.grid{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
label.f span.h{color:var(--mute);font-size:11px}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accbg);border-color:var(--acc)}
input[type=checkbox],input[type=radio]{accent-color:var(--acc)}
label.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
table.t th{color:var(--mute);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;background:var(--panel2)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.sel td{background:var(--accbg)}
.scroll{overflow:auto;max-height:420px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.mute{background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.bar{position:relative;height:9px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden;min-width:80px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--ok)}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.kv{display:grid;grid-template-columns:minmax(0,max-content) minmax(130px,1fr);gap:4px 12px;font-size:12.5px}.kv b{font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--ink2);background:var(--panel2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.alert{font-size:12.5px;border-radius:8px;padding:8px 10px;margin:6px 0;border:1px solid}
.alert.warn{background:var(--warnbg);border-color:var(--warn);color:var(--ink)}.alert.bad{background:var(--badbg);border-color:var(--bad)}.alert.ok{background:var(--okbg);border-color:var(--ok)}
aside.sum{position:sticky;top:66px;align-self:start;display:flex;flex-direction:column;gap:12px}
aside.sum .card{margin:0}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.muni{position:relative}
.muni .list{position:absolute;z-index:30;left:0;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto;box-shadow:var(--shadow);display:none}
.muni .list div{padding:6px 9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.muni .list div:hover,.muni .list div.hl{background:var(--accbg)}
canvas.map{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:crosshair;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.svgbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;overflow:auto}
.svgbox svg{display:block;max-width:100%;height:auto;margin:0 auto}
.src{font-size:11.5px;color:var(--mute)}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.modal{position:fixed;inset:0;background:rgba(10,16,22,.55);display:grid;place-items:center;z-index:100;padding:20px}
.modal .box{background:var(--panel);color:var(--ink);max-width:640px;width:100%;border-radius:14px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:90vh;overflow:auto}
.modal h2{margin-top:0}
.man{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}
.man nav{border-right:1px solid var(--line);padding-right:8px}
.man nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink2);padding:6px 8px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
.man nav button.on{background:var(--accbg);color:var(--acc);font-weight:600}
.man article h3{margin-top:0;text-transform:none;letter-spacing:0;font-size:16px;color:var(--ink)}
.man article p,.man article li{font-size:13.5px}
code,.mono{font-family:var(--mono);font-size:12px}
.formula{font-family:var(--mono);font-size:12.5px;background:var(--panel2);border-left:3px solid var(--acc);padding:6px 10px;border-radius:4px;margin:6px 0;overflow-x:auto;white-space:pre-wrap}
footer.foot{color:var(--mute);font-size:11.5px;text-align:center;padding:10px 0 24px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s}
.toast.on{opacity:.95}
@media (max-width:1250px){.layout{grid-template-columns:200px minmax(0,1fr)}aside.sum{grid-column:2;position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
@media (max-width:820px){.layout{grid-template-columns:1fr}nav.side{position:static;display:flex;overflow-x:auto}nav.side button{white-space:nowrap}nav.side hr{display:none}aside.sum{grid-column:1}.grid.g2,.grid.g3{grid-template-columns:1fr}.man{grid-template-columns:1fr}.brand{min-width:0}}
@media print{header.top,nav.side,aside.sum,.noprint{display:none!important}.layout{display:block;padding:0}.card{box-shadow:none;break-inside:avoid}}
/* ---- v2: classes de preço, orçamento */
.pill.cls{min-width:22px;text-align:center;padding:2px 7px;border:1px solid transparent}
.clsA,.pill.clsA{background:#1e8a4c;color:#fff}.clsB,.pill.clsB{background:#2f80b7;color:#fff}.clsC,.pill.clsC{background:#8a63c9;color:#fff}.clsD,.pill.clsD{background:#d08a1f;color:#fff}.clsU,.pill.clsU{background:#5c6b78;color:#fff}
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin:8px 0 4px}.stack i{display:block;height:100%}
table.orc tr.grp td{background:var(--panel2);font-size:12px;color:var(--ink2);padding-top:9px}
table.orc input::placeholder{color:var(--mute);opacity:1}
optgroup{font-weight:700}
/* ---- v2: abertura animada */
body.bloqueado{overflow:hidden}
#abertura{position:fixed;inset:0;z-index:1000;background:#02060c;overflow:hidden;transition:opacity .38s ease}
#abertura canvas{position:absolute;inset:0;display:block}
#abertura.sai{opacity:0}
#abertura .ab-txt{position:absolute;left:0;right:0;bottom:9vh;text-align:center;color:#eef6fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Arial,sans-serif;text-shadow:0 2px 18px rgba(0,0,0,.55);pointer-events:none}
#abertura .ab-logo{display:inline-flex;align-items:center;gap:16px}
#abertura .ab-logo b{font-size:clamp(34px,5.4vw,66px);font-weight:750;letter-spacing:.5px}
#abertura .ab-logo b span{font-weight:300;color:#9fe6fa}
#abertura .ab-sub{font-size:clamp(15px,1.7vw,21px);letter-spacing:4px;text-transform:uppercase;color:#cfe7f2;margin-top:6px}
#abertura .ab-tags{font-size:clamp(11px,1.05vw,13.5px);color:#a9c4d3;margin-top:10px;letter-spacing:.4px}
#abertura .ab-ver{font-size:11px;color:#7fa3b6;margin-top:8px;letter-spacing:2px;text-transform:uppercase}
#abertura .ab-bar{width:min(320px,60vw);height:2px;margin:14px auto 0;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
#abertura .ab-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#39b7d8,#bff2ff)}
#abertura .ab-logo,#abertura .ab-sub,#abertura .ab-tags,#abertura .ab-ver{opacity:0;transform:translateY(14px)}
#abertura.anima .ab-logo{animation:abIn .9s cubic-bezier(.2,.7,.2,1) 2.25s forwards}
#abertura.anima .ab-sub{animation:abIn .9s cubic-bezier(.2,.7,.2,1) 2.55s forwards}
#abertura.anima .ab-tags{animation:abIn .9s cubic-bezier(.2,.7,.2,1) 2.8s forwards}
#abertura.anima .ab-ver{animation:abIn .9s cubic-bezier(.2,.7,.2,1) 3.0s forwards}
#abertura.anima .ab-bar i{animation:abBar 4s linear forwards}
#abertura.pronto .ab-logo,#abertura.pronto .ab-sub,#abertura.pronto .ab-tags,#abertura.pronto .ab-ver{opacity:1;transform:none}
#abertura .ab-pular{position:absolute;right:20px;top:18px;background:rgba(255,255,255,.08);color:#d8eef7;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;font:13px system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(4px)}
#abertura .ab-pular:hover{background:rgba(255,255,255,.18)}
@keyframes abIn{to{opacity:1;transform:none}}
@keyframes abBar{to{width:100%}}
@media (prefers-reduced-motion:reduce){#abertura,#abertura *{animation:none!important;transition:none!important}}
/* ---- v2: avisos legais */
#legal{position:fixed;inset:0;z-index:900;display:grid;place-items:center;padding:18px;background:radial-gradient(1200px 600px at 70% 10%,rgba(57,183,216,.18),transparent),rgba(6,12,20,.88);backdrop-filter:blur(3px)}
#legal .lg-box{background:var(--panel);color:var(--ink);width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.45);border:1px solid var(--line);overflow:hidden}
#legal .lg-cab{display:flex;gap:12px;align-items:center;padding:18px 22px 12px;border-bottom:1px solid var(--line)}
#legal .lg-cab h2{margin:0;font-size:19px}#legal .lg-cab small{color:var(--mute)}
#legal .lg-txt{overflow:auto;padding:4px 22px 10px;font-size:13.5px;line-height:1.55}
#legal .lg-txt h3{font-size:13.5px;margin:14px 0 4px;color:var(--acc)}
#legal .lg-txt p{margin:0 0 6px;color:var(--ink2)}
#legal .lg-chk{display:flex;gap:10px;align-items:center;padding:12px 22px;border-top:1px solid var(--line);font-weight:600;cursor:pointer}
#legal .lg-chk input{width:18px;height:18px}
#legal .lg-acoes{display:flex;gap:10px;justify-content:flex-end;padding:0 22px 12px}
#legal .btn.pri[disabled]{opacity:.45;cursor:not-allowed}
#legal .lg-msg{padding:0 22px;color:var(--warn);font-size:13px;min-height:4px}
#legal .lg-ult{padding:4px 22px 14px;color:var(--mute);font-size:11.5px}
</style>
</head>

  <main id="main">
    <section class="tab on" id="tab-vento"></section>
    <section class="tab" id="tab-fachada"></section>
    <section class="tab" id="tab-sistema"></section>
    <section class="tab" id="tab-vidro"></section>
    <section class="tab" id="tab-fixacao"></section>
    <section class="tab" id="tab-verif"></section>
    <section class="tab" id="tab-desemp"></section>
    <section class="tab" id="tab-quant"></section>
    <section class="tab" id="tab-bim"></section>

</div>

  /* ----- desempenho térmico/óptico: EN 673 (Ug) e EN 410 simplificado (g, TL) para insulado montado */
  function UgEN673(e1, e2, s, gasId, espVidros) {

  // Completa as propriedades ópticas de um vidro do catálogo. Quando faltam dados, estima a partir do que foi publicado:

  const CLARO = { tvis: 0.89, rvis1: 0.08, rvis2: 0.08, tsol: 0.81, rsol1: 0.07, rsol2: 0.07, e1: 0.837, e2: 0.837 };
  function completaOptico(v) {

  function opticoInsulado(v1, v2, ht) {

  const vidroProd = (id) => byId(CAT.vidros, id) || byId(CAT.laminadosPublicados, id);
  function desempenhoVidro(Vd) {
    const ext = vidroProd(Vd.ext.produto) || CAT.vidros[0];
    if (Vd.tipo !== 'insulado') {

  /* ---------------------------------------------------------------- PERFIS */
  const RHO_AL = 2.70e-3; // kg/(mm²·m)
  function perfilById(sisId, cod) {
    const s = byId(CAT.sistemas, sisId); if (!s) return null;
    const p = s.perfis.find(x => x.codigo === cod); if (!p) return null;
    const q = Object.assign({}, p);
    if (!q.Wx && q.Ix && q.h) { q.Wx = 2 * q.Ix / (q.h / 10); q.wEst = true; }
    if (!q.kgm) {
      const b = s.face || 50, h = q.h || 50;
      if (q.A) q.kgm = q.A * 100 * RHO_AL;
      else if (q.Ix && h) { const t = q.Ix * 1e4 / (h ** 3 / 6 + b * h * h / 2); q.kgm = 1.1 * 2 * t * (h + b - 2 * t) * RHO_AL; }
      if (q.kgm) q.kgEst = true;
    }
    return q;
  }
  function ligaById(id) { return byId(CAT.ligas, id) || CAT.ligas[0]; }

  /* ---------------------------------------------------------------- FLAMBAGEM (EN 1999-1-1)
   * Seção caixão equivalente: altura h (profundidade do perfil), largura b (face) e espessura t.
   * t: informada pelo usuário, do catálogo ou equivalente (caixão de paredes finas com a mesma inércia: I ≈ t·h³/6 + b·t·h²/2). */
  function secaoEq(perfil, faceMm, tUsuario) {
    const h = +perfil.h || 50, b = Math.max(+faceMm || 50, 20);

    else if (perfil.t) { t = +perfil.t; tFonte = 'catálogo'; }
    else { t = perfil.Ix * 1e4 / (h ** 3 / 6 + b * h * h / 2); tEst = true; tFonte = 'equivalente (caixão de mesma inércia)'; }
    t = clamp(t, 0.8, Math.min(h, b) / 4);
    const Iz = perfil.Iy ? perfil.Iy * 1e4 : (h * b ** 3 - (h - 2 * t) * (b - 2 * t) ** 3) / 12;
    const hm = h - t, bm = b - t;
    const It = 2 * t * hm * hm * bm * bm / (hm + bm); // Bredt, seção fechada

  }
  // Classe A de flambagem (ligas 6xxx tratadas termicamente), sem solda — EN 1999-1-1, Tab. 6.2 e 6.3
  function flambagem(sec, Wel, liga, MEd, NEd, Lb, Lspan, C) {
    const fo = liga.fy, E = liga.E, G = E / 2.6, gM1 = +C.gM1 || 1.1;
    const eps = Math.sqrt(250 / fo);
    const lim = [11, 16, 22].map(x => x * eps);
    const cls = (beta) => beta <= lim[0] ? 1 : beta <= lim[1] ? 2 : beta <= lim[2] ? 3 : 4;
    const rho = (beta) => { if (beta <= lim[2]) return 1; const r = beta / eps; return clamp(32 / r - 220 / (r * r), 0.05, 1); };
    const bw = sec.h - 2 * sec.t, bf = sec.b - 2 * sec.t;
    const beta = { alma: 0.40 * bw / sec.t, mesa: bf / sec.t, almaN: bw / sec.t }; // alma em flexão (ψ = −1 → η = 0,40); mesa comprimida (η = 1)
    const classe = Math.max(cls(beta.alma), cls(beta.mesa));

  // Montante: viga sob carga distribuída w (N/mm) = p·B; vão L (mm)
  function verificaMontante(P, perfil, liga, pd) {
    const C = P.criterios, f = P.fachada, sis = P.sistema;
    const B = +f.modulo * 1000, L = +f.peDireito * 1000; // mm
    const E = liga.E, I = perfil.Ix * 1e4, W = perfil.Wx * 1e3; // mm4, mm3
    const est = sis.estatica || 'biapoiada';
    const kM = 1 / 8, kD = est === 'continua2' ? 1 / 185 : 5 / 384, kR = est === 'continua2' ? 1.25 : 1.0;
    const pp = pd * 1e-6; // N/mm²
    const w = pp * B;     // N/mm (característica)
    const M = kM * w * L * L;       // N·mm
    const d = kD * w * L ** 4 / (E * I);
    const lim = Math.min(L / (+C.flechaMont || 175), +C.flechaAbs > 0 ? +C.flechaAbs : 1e9);
    // carga axial: peso do vidro do módulo em um pavimento + perfil. Suspenso no topo → tração; apoiado na base → compressão
    const N = (P._pesoModulo || 0) * 9.81 + (perfil.kgm || 0) * (L / 1000) * 9.81; // N
    const apoiado = sis.apoio === 'apoiado';
    const A = (perfil.A ? perfil.A * 100 : null);
    const sigN = A && !apoiado ? N / A : 0;
    const m1 = { nome: 'NBR 10821-2 (Pe = 1,2·pp; Ps = 1,5·Pe)', d: d * 1.2, dLim: lim, sig: M * 1.8 / W + sigN, sLim: liga.fy / (+C.gM1 || 1.1) };
    const m2 = { nome: 'Estados-limites (NBR 8681 + EN 1999-1-1)', d: d, dLim: lim, sig: (+C.gq * M) / W + (+C.gg * sigN), sLim: liga.fy / (+C.gM1 || 1.1) };
    const m3 = liga.sadm ? { nome: 'Tensões admissíveis (catálogo)', d: d, dLim: lim, sig: M / W + sigN, sLim: liga.sadm } : null;
    const metodos = [m1, m2, m3].filter(Boolean).map(m => Object.assign(m, { uD: m.d / m.dLim, uS: m.sig / m.sLim }));
    // flambagem local e lateral com torção (EN 1999-1-1); comprimento destravado da mesa interna
    const Lb = sis.contencao === 'travessas' && P._LbTrav ? Math.min(P._LbTrav, L) : L;
    const sec = secaoEq(perfil, +sis.face || 50, sis.tParede);
    const fl = flambagem(sec, W, liga, +C.gq * M, apoiado ? +C.gg * N : 0, Lb, L, C);
    fl.apoio = apoiado ? 'apoiado' : 'suspenso';
    const u = Math.max(...metodos.map(m => Math.max(m.uD, m.uS)), fl.u);
    return { perfil: perfil.codigo, B, L, w, M, d, lim, N, kR, reacao: kR * w * L, metodos, flamb: fl, u, ok: u <= 1, wEst: !!perfil.wEst, conf: !!perfil.conf };
  }

  // Travessa: vento (carga trapezoidal dos painéis acima/abaixo) + peso do vidro sobre 2 calços
  function verificaTravessa(P, perfil, liga, pd, hAcima, hAbaixo, pesoVidroKg) {
    const C = P.criterios;
    const L = +P.fachada.modulo * 1000;
    const E = liga.E, pp = pd * 1e-6;
    const out = { perfil: perfil.codigo, liga: liga.nome, L, avisos: [] };
    // vento — trapézios
    let M = 0, dcoef = 0;
    [hAcima, hAbaixo].forEach(h => {
      if (!h) return;
      const c = Math.min(h * 1000 / 2, L / 2), al = c / L, w0 = pp * c;
      M += w0 * L * L / 24 * (3 - 4 * al * al);
      dcoef += w0 * L ** 4 / 1920 * (25 - 40 * al * al + 16 * al ** 4);
    });
    out.Mv = M;
    if (perfil.Ix && perfil.Wx) {
      out.dv = dcoef / (E * perfil.Ix * 1e4);
      out.dvLim = Math.min(L / (+C.flechaMont || 175), +C.flechaAbs > 0 ? +C.flechaAbs : 1e9);
      out.sv = (+C.gq * M) / (perfil.Wx * 1e3);
      out.uV = Math.max(out.dv / out.dvLim, out.sv / (liga.fy / (+C.gM1 || 1.1)));

    } else { out.uV = null; out.avisos.push('Inércia/módulo da travessa para vento não informados no catálogo — verificação não realizada.'); }

    const Pc = pesoVidroKg * 9.81 / 2, a = Math.min(+C.posCalco > 0 ? L * +C.posCalco : L / 4, L / 2);

      out.dgLim = Math.min(L / (+C.flechaTravPP || 500), +C.flechaTravAbs || 3);
      out.sg = (+C.gg * Mg) / (perfil.Wy * 1e3);
      out.uG = Math.max(out.dg / out.dgLim, out.sg / (liga.fy / (+C.gM1 || 1.1)));
    } else { out.uG = null; out.avisos.push('Inércia/módulo da travessa para peso próprio (eixo vertical) não informados — verificação não realizada.'); }

      out.uComb = out.sComb / (liga.fy / (+C.gM1 || 1.1));
    }
    const us = [out.uV, out.uG, out.uComb, out.flamb ? out.flamb.u : null].filter(x => x != null);
    out.u = us.length ? Math.max(...us) : null;
    out.ok = out.u != null ? out.u <= 1 : null;
    return out;
  }

  /* ---------------------------------------------------------------- ANCORAGEM */
  function verificaAncoragem(P, H, G) {
    // H = reação horizontal característica (N), G = peso próprio característico (N) por console
    const A = P.ancoragem, C = P.criterios;
    const ch = byId(CAT.chumbadores, A.chumbador);
    const n = Math.max(1, +A.n || 2), e = +A.e || 150, z = Math.max(+A.z || 100, 10);
    const Hd = +C.gq * H, Gd = +C.gg * G;
    let NEd, VEd;
    const hH = +A.hH >= 0 ? +A.hH : 60; // altura do parafuso do montante acima da face da laje (console no topo)
    if (A.config === 'testeira') { NEd = (Hd + Gd * e / z) / n; VEd = Gd / n; }
    else { NEd = (Gd * e / z + Hd * hH / z) / n; VEd = Hd / n; }
    NEd /= 1000; VEd /= 1000; // kN
    const out = { chumbador: ch ? ch.produto : '—', n, NEd, VEd, config: A.config, avisos: [] };
    let NRd = null, VRd = null;
    if (ch && ch.NRd) {
      const k = A.concreto === 'naoFissurado' ? 'nf' : 'f';
      NRd = ch.NRd[k]; VRd = ch.VRd[k];
      if (ch.parcial) out.avisos.push('Perfil de ancoragem: verificação apenas do aço (lábios). Verifique a ruptura do concreto no software do fabricante.');
    } else if (+A.NRdManual > 0 && +A.VRdManual > 0) { NRd = +A.NRdManual; VRd = +A.VRdManual; out.avisos.push('Resistências do chumbador informadas pelo usuário.'); }
    if (NRd && VRd) {
      const bN = NEd / NRd, bV = VEd / VRd;
      out.NRd = NRd; out.VRd = VRd; out.bN = bN; out.bV = bV;
      out.inter = Math.pow(bN, 1.5) + Math.pow(bV, 1.5);
      out.u = Math.max(bN, bV, out.inter);
      out.ok = out.u <= 1;
    } else { out.u = null; out.ok = null; out.avisos.push('Resistências do chumbador não disponíveis — informe NRd e VRd do fabricante.'); }
    // Parafuso passante do montante (corte duplo) + esmagamento da parede do perfil (EN 1999-1-1, simplificado)
    const pf = byId(CAT.parafusos, A.parafuso);
    if (pf) {
      const Fv = Math.hypot(Hd, Gd) / 1000; // kN por console (1 parafuso)
      const FvRd = 2 * 0.5 * pf.fub * pf.As / 1.25 / 1000; // 2 planos de corte, αv = 0,5 (a favor da segurança), γM2 = 1,25
      const liga = ligaById(P.sistema.liga);
      const t = +A.tParede || 3;
      const FbRd = 2 * 1.5 * liga.fu * pf.d * t / 1.25 / 1000; // 2 paredes, k1·αb = 1,5 (simplificado)
      out.parafuso = { nome: pf.nome, Fv, FvRd, FbRd, uV: Fv / FvRd, uB: Fv / FbRd, u: Math.max(Fv / FvRd, Fv / FbRd) };
    }
    return out;
  }

  /* ---------------------------------------------------------------- SILICONE ESTRUTURAL E JUNTAS */
  function verificaSSG(P, a, b, pk, painelKg) {
    const s = byId(CAT.selantes, P.selantes.estrutural);
    const C = P.criterios;
    if (!s) return null;
    const out = { selante: s.produto, sdes: s.sdes, avisos: [] };
    // Bite (pega): c ≥ p·a/(2·σdes) — a = menor lado (ETAG 002 / ASTM C1401; vento característico)
    out.biteReq = Math.max(pk * 1e-6 * a / (2 * s.sdes), 6);
    out.biteAdot = Math.max(+P.ssg.bite || 0, 0);
    // Espessura: e ≥ Δ/√(δ(2+δ)), Δ = movimento térmico diferencial na meia-diagonal
    const diag = Math.hypot(a, b) / 2;
    const delta = diag * Math.abs(23e-6 * (+C.dTperfil || 40) - 9e-6 * (+C.dTvidro || 30));
    const dl = +C.deformSil || 0.125;
    out.delta = delta;
    out.espReq = Math.max(delta / Math.sqrt(dl * (2 + dl)), 6);
    out.espAdot = +P.ssg.espessura || 0;
    if (s.funcao === 'fita estrutural') { out.espReq = s.esp; out.avisos.push('Fita estrutural: espessura fixa ' + s.esp + ' mm; exige apoio mecânico do peso próprio.'); }
    const rel = out.biteAdot / Math.max(out.espAdot, 1e-9);
    out.relacao = rel;
    out.uBite = out.biteReq / Math.max(out.biteAdot, 1e-9);
    out.uEsp = s.funcao === 'fita estrutural' ? 0 : out.espReq / Math.max(out.espAdot, 1e-9);
    if (s.funcao !== 'fita estrutural' && (rel < 1 || rel > 3)) out.avisos.push('Relação pega/espessura fora do intervalo 1:1 a 3:1 (ASTM C1401).');
    // peso próprio sem calços (somente informativo)
    if (s.sest) out.pesoSemCalco = painelKg * 9.81 / (2 * (a + b) * 1e-3) / 1000; // kN/m de junta
    out.u = Math.max(out.uBite, out.uEsp);
    out.ok = out.u <= 1;
    return out;
  }
  function juntas(P) {
    const C = P.criterios, f = P.fachada;
    const sel = byId(CAT.selantes, P.selantes.vedacao);
    const mov = sel && sel.mov ? sel.mov : 0.25;
    const dT = +C.dTperfil || 40;
    const dL = 23e-6 * dT * +f.modulo * 1000; // mm entre módulos
    const larg = Math.max(dL / mov, 6);
    const prof = larg <= 12 ? 6 : Math.min(larg / 2, 12.7);
    const dLvert = 23e-6 * dT * +f.peDireito * 1000;
    const folgaLuva = dLvert + (+C.deslocLaje || 10) + 3;
    return { selante: sel ? sel.produto : '—', mov, dL, larguraMin: larg, profundidade: prof, dLvert, folgaLuva };
  }
  function calcos(area, espTotal) {
    const c = CAT.calcos;
    return { comprimento: Math.max(c.mmPorM2 * area, c.minimo), largura: espTotal, shore: c.shore, posicao: c.posicao, n: 2 };
  }

  /* ---------------------------------------------------------------- GEOMETRIA DOS PAINÉIS */
  function saneia(P) {
    // limites físicos mínimos para evitar geometrias degeneradas (entradas vazias ou absurdas)
    const f = P.fachada, e = P.edif;
    const lim = (v, a, b, d) => { v = +v; return isFinite(v) ? clamp(v, a, b) : d; };
    f.largura = lim(f.largura, 0.5, 500, 10); f.altura = lim(f.altura, 0.5, 500, 10); f.zBase = lim(f.zBase, 0, 400, 0);
    f.peDireito = lim(f.peDireito, 0.5, 12, 3); f.modulo = lim(f.modulo, 0.2, 6, 1.25);
    f.modulo = Math.max(f.modulo, f.largura / 400); f.peDireito = Math.max(f.peDireito, f.altura / 200);
    e.a = lim(e.a, 1, 2000, 30); e.b = lim(e.b, 1, 2000, 20); e.h = lim(e.h, 1, 1000, 30);
    P.local.V0 = lim(P.local.V0, 10, 80, 30);
    return P;
  }
  function geometria(P) {
    const f = P.fachada;
    const W = +f.largura, H = +f.altura, Lp = +f.peDireito;
    const nMod = Math.max(1, Math.round(W / +f.modulo));
    const B = W / nMod;
    const nPav = Math.max(1, Math.round(H / Lp));
    const tr = (f.travessas || [0]).map(Number).filter(x => x >= 0 && x < Lp).sort((a, b) => a - b);
    if (tr[0] !== 0) tr.unshift(0);
    const alturas = tr.map((t, i) => (i < tr.length - 1 ? tr[i + 1] : Lp) - t);
    const paineis = [];
    for (let k = 0; k < nPav; k++) for (let j = 0; j < nMod; j++) tr.forEach((t, i) => {
      paineis.push({ pav: k + 1, col: j, x: j * B, z: k * Lp + t, w: B, h: alturas[i], idxTr: i });
    });
    return { W, H, B, nMod, nPav, Lp, tr, alturas, paineis };
  }

  /* ---------------------------------------------------------------- PREÇOS INTERNOS */
  const ORD_CLASSE = { A: 1, B: 2, C: 3, D: 4 };
  const pior = (...cs) => cs.filter(Boolean).reduce((m, c) => (ORD_CLASSE[c] > ORD_CLASSE[m] ? c : m), 'A');
  const pr = (id) => byId(CAT.precos.itens, id);
  const refTxt = (it) => it ? `${it.desc}: R$ ${it.valor.toFixed(2).replace('.', ',')}/${it.un}${it.codigo ? ' — ' + it.codigo + ' (' + it.data + ')' : ''}${it.calculo ? ' — ' + it.calculo : ''}` : '';
  // Preço de uma chapa (R$/m²) por espessura e tratamento, a partir das referências SINAPI
  function precoChapa(t, trat) {
    t = +t;
    if (trat === 'recozido') {
      const a = pr('vid-float-4'), b = pr('vid-float-8');
      const v = a.valor + (t - 4) * (b.valor - a.valor) / 4;
      return { valor: Math.max(v, a.valor * t / 4), classe: (t === 4 || t === 8) ? 'A' : 'B', ref: (t === 4 ? a : t === 8 ? b : null), calculo: `float incolor ${t} mm: interpolação linear entre ${a.codigo} (4 mm) e ${b.codigo} (8 mm)` };
    }
    const tab = [[6, pr('vid-temp-6')], [8, pr('vid-temp-8')], [10, pr('vid-temp-10')]];
    const exato = tab.find(x => x[0] === t);
    let v;
    if (exato) v = exato[1].valor;
    else if (t < 6) v = tab[0][1].valor * t / 6;
    else if (t > 10) v = tab[2][1].valor * t / 10;
    else { const k = t < 8 ? 0 : 1; const [t0, a] = tab[k], [t1, b] = tab[k + 1]; v = a.valor + (t - t0) * (b.valor - a.valor) / (t1 - t0); }
    const nome = trat === 'termoendurecido' ? 'termoendurecido (adotado o preço do temperado)' : 'temperado';
    return { valor: v, classe: exato && trat === 'temperado' ? 'A' : (trat === 'temperado' ? 'B' : 'D'), calculo: `${nome} ${t} mm: ${exato ? exato[1].codigo : 'interpolação/proporção entre SINAPI 10505, 10506 e 10507'}` };
  }
  function precoLamina(L) {
    const plies = (L.plies || [L.esp]).map(Number);
    const partes = plies.map(t => precoChapa(t, L.trat));
    let bv = partes.reduce((s2, x) => s2 + x.valor, 0), bc = pior(...partes.map(x => x.classe));
    const calc = partes.map(x => x.calculo);
    if (plies.length > 1) { const pvb = pr('vid-lam-pvb'); bv += (plies.length - 1) * pvb.valor; bc = pior(bc, pvb.classe); calc.push(`${plies.length - 1} × laminação PVB (${pvb.valor.toFixed(2)}; classe ${pvb.classe})`); }
    const base = { valor: bv, classe: bc, calculo: calc.join(' + ') };
    const prod = vidroProd(L.produto);
    let adic = null;
    if (prod && prod.classe === 'cor') { const c = pr('vid-cor'); adic = { valor: c.valor, classe: c.classe, calculo: `cor na massa (${prod.produto}): ${c.calculo}` }; }
    if (prod && prod.classe === 'revestido') { const c = pr('vid-revest'); adic = { valor: c.valor, classe: c.classe, calculo: `revestimento (${prod.produto}): ${c.calculo}` }; }
    return { valor: bv + (adic ? adic.valor : 0), classe: pior(bc, adic && adic.classe), calculo: base.calculo + (adic ? ' + adicional (' + adic.valor.toFixed(2) + '; classe ' + adic.classe + ')' : ''), base, adic };
  }
  // Preço do vidro por m², separado em partes com classes próprias (chapas/laminação, adicional de cor ou revestimento, insulado)
  function precoVidro(Vd) {
    const L = Vd.tipo === 'insulado' ? [precoLamina(Vd.ext), precoLamina(Vd.int)] : [precoLamina(Vd.ext)];
    const nome = Vd.tipo === 'insulado' ? ['externo', 'interno'] : [''];
    const partes = [{ id: 'chapas', valor: L.reduce((s2, x) => s2 + x.base.valor, 0), classe: pior(...L.map(x => x.base.classe)), calculo: L.map((x, i) => (nome[i] ? nome[i] + ': ' : '') + x.base.calculo).join(' | ') }];
    const ad = L.filter(x => x.adic);
    if (ad.length) partes.push({ id: 'adic', valor: ad.reduce((s2, x) => s2 + x.adic.valor, 0), classe: pior(...ad.map(x => x.adic.classe)), calculo: ad.map(x => x.adic.calculo).join(' | ') });
    if (Vd.tipo === 'insulado') { const igu = pr('vid-igu'); partes.push({ id: 'igu', valor: igu.valor, classe: igu.classe, calculo: igu.calculo }); }
    return { valor: partes.reduce((s2, x) => s2 + x.valor, 0), classe: pior(...partes.map(x => x.classe)), calculo: partes.map(x => x.calculo).join(' + '), partes };
  }
  function precoChumbador(ch) {
    if (!ch || ch.parcial) return null;
    const d = ch.d || 10;
    const base = d <= 10 ? pr('parabolt-38') : d <= 12 ? pr('parabolt-12') : d <= 16 ? pr('parabolt-58') : pr('parabolt-58-200');
    if (ch.inox) { const f = pr('fator-inox'); return { valor: base.valor * f.valor, classe: 'D', calculo: `equivalente ${base.codigo} (${base.desc}) × fator inox ${f.valor} (estimativa) — produto com ETA: substitua pela cotação` }; }
    return { valor: base.valor, classe: 'B', calculo: `equivalente funcional: ${base.desc} (${base.codigo}, ${base.data}). Produtos com ETA tendem a custar mais — confirme` };
  }
  function precoParafuso(pf) {
    if (!pf) return null;
    const m12 = pr('paraf-inox-m12');
    const fA4 = /A4/.test(pf.nome) ? 1.3 : 1;
    if (Math.abs(pf.d - 12) < 0.6 && fA4 === 1) return { valor: m12.valor, classe: 'A', calculo: `${m12.desc} — ${m12.codigo} (${m12.data})` };
    return { valor: m12.valor * (pf.d / 12) ** 2 * fA4, classe: 'D', calculo: `${m12.codigo} × (d/12)²${fA4 > 1 ? ' × 1,3 (A4)' : ''} — estimativa` };
  }

  /* ---------------------------------------------------------------- QUANTITATIVOS */
  function quantitativos(P, G, sel, vidroRes) {
    const s = byId(CAT.sistemas, P.sistema.linha);
    const mont = sel.montante, trav = sel.travessa;

    const nLinTr = G.nPav * G.tr.length + 1; // inclui travessa do topo

    const areaVidro = G.paineis.reduce((s2, p) => s2 + p.w * p.h, 0);
    const perimVidro = G.paineis.reduce((s2, p) => s2 + 2 * (p.w + p.h), 0);
    const nCons = nMont * (G.nPav + 1);
    const areaFach = G.W * G.H;
    const fp = +s.fatorPreco || 1;
    const al = pr('al-anod-kg');
    const it = [];
    const add = (key, grupo, desc, un, qtd, preco, ref) => it.push({ key, grupo, desc, un, qtd, preco: preco || null, ref: ref || '' });
    const pAl = { valor: al.valor * fp, classe: fp === 1 ? 'A' : 'D', calculo: `${al.desc} — ${al.codigo} (${al.data})${fp !== 1 ? ' × fator do sistema ' + fp : ''}` };
    add('montante', 'Alumínio', `Montante ${mont.codigo} — ${mont.desc} (${(compMont).toFixed(2)} m × ${mont.kgm ? mont.kgm.toFixed(3) : '?'} kg/m)`, 'kg', mont.kgm ? compMont * mont.kgm : null, mont.kgm ? Object.assign({}, pAl, mont.kgEst ? { classe: 'D', calculo: pAl.calculo + '; massa linear estimada pela seção equivalente' } : {}) : null, `${s.fabricante} — ${s.linha}`);
    add('travessa', 'Alumínio', `Travessa ${trav.codigo} — ${trav.desc} (${compTrav.toFixed(2)} m × ${trav.kgm ? trav.kgm.toFixed(3) : '?'} kg/m)`, 'kg', trav.kgm ? compTrav * trav.kgm : null, trav.kgm ? Object.assign({}, pAl, trav.kgEst ? { classe: 'D', calculo: pAl.calculo + '; massa linear estimada' } : {}) : null, `${s.fabricante} — ${s.linha}`);
    const nLuvas = nMont * Math.max(G.nPav - 1, 0);
    const luva = s.perfis.find(p => p.funcao === 'luva' && p.para === mont.codigo) || s.perfis.find(p => p.funcao === 'luva' && !p.para);
    const luvaAc = !luva && (s.acessorios || []).find(a => a.tipo === 'luva' && a.para === mont.codigo);
    if (luva && nLuvas) add('luva', 'Alumínio', `Luva de dilatação ${luva.codigo} (${nLuvas} × 0,40 m)`, 'kg', nLuvas * 0.40 * (luva.kgm || 0), luva.kgm ? pAl : null, s.fabricante);
    else if (luvaAc && nLuvas) add('luva', 'Alumínio', `Luva de dilatação ${luvaAc.codigo} — ${luvaAc.desc}`, 'un', nLuvas, null, 'massa não informada no catálogo');
    const pv = precoVidro(P.vidro), pp = (id) => pv.partes.find(x => x.id === id);
    add('vidro', 'Vidro', `Vidro ${vidroRes.descricao} — chapas, têmpera e laminação`, 'm²', areaVidro, pp('chapas'), '');
    if (pp('adic')) add('vidro-adic', 'Vidro', 'Adicional de vidro colorido ou revestido (controle solar / baixo emissivo)', 'm²', areaVidro, pp('adic'), '');
    if (pp('igu')) add('vidro-igu', 'Vidro', 'Montagem do vidro insulado (espaçador, butil, selagem secundária, dessecante)', 'm²', areaVidro, pp('igu'), '');
    add('massa-vidro', 'Vidro', 'Massa total de vidro (informativo)', 'kg', areaVidro * vidroRes.espNom * 2.5, null, '2,5 kg/m²/mm');
    const ep = pr('epdm-m');
    const tipoF = P.fachada.tipo, fGax = tipoF === 'captado' ? 2 : tipoF === 'ssg2' ? 1.5 : 1;
    add('gaxeta', 'Vedação', tipoF === 'captado' ? 'Gaxeta EPDM (interna + externa)' : tipoF === 'ssg2' ? 'Gaxeta EPDM (lados captados + quadro × estrutura)' : 'Gaxeta EPDM (quadro × estrutura)', 'm', fGax * perimVidro, { valor: ep.valor, classe: ep.classe, calculo: `${ep.desc} — ${ep.codigo} (${ep.data})` }, '');

      add('sil-ved', 'Selantes', `Silicone de vedação (juntas entre vidros) — ${J.selante}`, 'L', (perimVidro / 2) * J.larguraMin * J.profundidade * 1e-3 * 1.1, { valor: sv.valor, classe: 'B', calculo: `equivalente: ${sv.desc} — ${sv.codigo} (${sv.data})` }, '+10% de perdas');
      const fi = pr('fita-m');
      add('espacador', 'Selantes', 'Espaçador / fita de posicionamento', 'm', perimVidro, { valor: fi.valor, classe: fi.classe, calculo: fi.calculo }, '');
    }

    add('console', 'Fixação', 'Console de ancoragem em alumínio', 'un', nCons, { valor: ck.valor * al.valor, classe: 'D', calculo: `massa adotada ${ck.valor} kg × ${al.codigo} (R$ ${al.valor.toFixed(2)}/kg)` }, '');
    const ch = byId(CAT.chumbadores, P.ancoragem.chumbador);
    add('chumbador', 'Fixação', `Chumbador — ${(ch || {}).produto || ''}`, 'un', nCons * (+P.ancoragem.n || 2), precoChumbador(ch), ch && ch.parcial ? 'perfil de ancoragem: sem referência pública de preço' : '');
    const pf = byId(CAT.parafusos, P.ancoragem.parafuso);
    add('parafuso', 'Fixação', `Parafuso passante com porca e arruelas — ${(pf || {}).nome || ''}`, 'un', nCons, precoParafuso(pf), '');
    const compCalco = Math.max(CAT.calcos.minimo, 0) / 1000;
    add('calco', 'Acessórios', 'Calço de apoio (85 ± 5 Shore A)', 'un', G.paineis.length * 2, { valor: ep.valor * compCalco, classe: 'B', calculo: `${ep.codigo} (R$ ${ep.valor.toFixed(2)}/m) × ${CAT.calcos.minimo} mm` }, CAT.calcos.fonte);
    add('sil-perim', 'Acessórios', 'Selante de vedação perimetral (fachada × estrutura), seção 12 × 8 mm', 'm', 2 * (G.W + G.H), { valor: sv.valor * 0.096, classe: 'B', calculo: `0,096 L/m × ${sv.codigo} (R$ ${sv.valor.toFixed(2)}/L)` }, '');

    const ms = (c) => ({ valor: ser.valor, classe: 'A', calculo: `${ser.codigo} (${ser.data}); coeficiente da SINAPI ${c}` });
    add('mo-estr-vid', 'Mão de obra', `Montagem da estrutura — vidraceiro (${cE.vidraceiro} h/m² de fachada)`, 'h', cE.vidraceiro * areaFach, mo('104099'), cE.desc);

  const MANUAL = [
    { id: 'inicio', t: 'Visão geral', h: `<p>O PeleCalc Pro faz o pré-dimensionamento de fachadas-cortina em pele de vidro (stick, montante e travessa) e gera o modelo BIM em IFC 4. O fluxo segue as abas numeradas:</p><ol><li><b>Local e vento</b>: o município define V0; os demais fatores da NBR 6123 definem as pressões por pavimento.</li><li><b>Geometria</b>: largura, altura, pé-direito, módulo e travessas.</li><li><b>Sistema e perfis</b>: linha do fabricante; o montante pode ser escolhido automaticamente.</li><li><b>Vidro</b>: composição, tensões, flechas e desempenho (62 produtos do catálogo).</li><li><b>Fixação e selantes</b>: chumbadores, parafuso, silicone estrutural, juntas e calços.</li><li><b>Verificações</b>: quadro-resumo, flambagem dos perfis (EN 1999-1-1) e critérios.</li><li><b>Desempenho</b> (Ucw, g e TL), <b>Quantitativos</b> com preços internos e <b>BIM</b>.</li></ol><p>Todos os resultados são recalculados a cada alteração e o projeto fica salvo no navegador. Use <b>Salvar</b>/<b>Abrir</b> para arquivos .json e <b>Memorial</b> para o relatório imprimível.</p>` },
    { id: 'vento', t: 'Vento — NBR 6123', h: `<p>A velocidade característica é <span class="mono">Vk = V0·S1·S2·S3</span> e a pressão dinâmica <span class="mono">q = 0,613·Vk²</span> (N/m², Vk em m/s).</p><div class="formula">S2 = b · Fr · (z/10)^p     (Tabela 1; Fr sempre da categoria II)</div><p>Para unidades de vedação e seus elementos de fixação, a norma enquadra a peça na <b>classe A</b>. A pressão líquida em cada face é <span class="mono">p = q·(Cpe − Cpi)</span>. O programa usa os coeficientes da Tabela 4 (paredes de edificações de planta retangular): sobrepressão na face de barlavento, sucção geral e o <b>Cpe médio</b> nas faixas junto às arestas de barlavento (largura igual ao menor valor entre 0,2·b e h).</p><p><b>V0 por município.</b> A NBR 6123:2023 manteve o mapa de isopletas de 1988. A base do programa associa cada município (IBGE) à faixa entre isopletas, com o valor da isopleta superior. Municípios entre 45 e 50 m/s aparecem como “sob consulta” e o programa adota 50 m/s. Você pode informar V0 manualmente com a leitura do mapa da norma.</p><p><b>NBR 10821-2.</b> Para edificações de até 30 pavimentos (90 m), a Tabela 1 dá pressões mínimas de ensaio por região; com a opção ativa, a pressão de projeto não fica abaixo de Pe/1,2.</p>` },
    { id: 'vidro', t: 'Vidros', h: `<p>Cada painel é tratado como placa retangular apoiada nos 4 lados sob pressão uniforme (Timoshenko). Coeficientes α e β interpolados pela relação b/a.</p><div class="formula">σ = 6·β·p·a²/h²        w = α·p·a⁴/D,  D = E·h³/(12·(1−ν²))</div><p><b>Laminado</b>: espessura efetiva sem transferência de cisalhamento (ω = 0): h,ef,w = (Σh³)^(1/3); h,ef,σ,j = √(h,ef,w³/hj). <b>Insulado</b>: a carga é dividida entre as lâminas pela rigidez (h,ef,w³).</p><p><b>Resistência de cálculo</b> (EN 16612): <span class="mono">fg,d = kmod·ksp·fg,k/γM,A + kv·(fb,k − fg,k)/γM,v</span>, com fg,k = 45 MPa; fb,k = 70 MPa (termoendurecido) e 120 MPa (temperado).</p><p>A <b>NBR 7199</b> define onde o vidro de segurança é obrigatório (laminado, temperado, aramado) conforme a posição de uso: confira sempre essa exigência.</p><p><b>Desempenho</b>: para insulados montados, Ug é calculado pela EN 673 (convecção na cavidade e emissividade das faces) e g/TL pela EN 410 (método simplificado com propriedades integradas). Quando o fabricante publica o desempenho do insulado, o valor aparece para comparação.</p>` },
    { id: 'perfis', t: 'Montantes e travessas', h: `<p>O montante é uma viga sob carga distribuída w = p·B (B = módulo), com vão L igual ao pé-direito. Três critérios são verificados e vale o mais desfavorável:</p><ul><li><b>NBR 10821-2</b>: flecha sob Pe = 1,2·pp ≤ L/175 (e limite absoluto); tensão sob Ps = 1,5·Pe ≤ fy.</li><li><b>Estados-limites</b>: flecha sob pp; γq·M/W ≤ fy/γM1 (EN 1999-1-1).</li><li><b>Tensões admissíveis</b>: M/W ≤ σadm do catálogo, quando informado.</li></ul><p>A travessa recebe o vento dos painéis acima e abaixo (carga trapezoidal) e o peso do vidro em dois calços a L/4 das extremidades; a flecha por peso próprio é limitada a L/500 e 3 mm.</p><div class="formula">M = w0·L²/24·(3 − 4α²)     δ = w0·L⁴/(1920·E·I)·(25 − 40α² + 16α⁴)</div><p><b>Seleção automática</b>: o programa testa todos os montantes da linha e adota o mais leve (ou de menor inércia) que atende na faixa de borda.</p>` },
    { id: 'flambagem', t: 'Flambagem dos perfis (EN 1999-1-1)', h: `<p>Além da flexão e da flecha, o programa verifica a estabilidade dos perfis pela EN 1999-1-1 (Eurocódigo 9), já que a ABNT não tem norma de dimensionamento de estruturas de alumínio.</p>
      <p><b>Seção equivalente.</b> Cada perfil é tratado como um caixão de paredes finas com a profundidade h do catálogo, a largura de face b e espessura t. Quando o catálogo não informa t, o programa usa a espessura que reproduz a inércia publicada: <span class="mono">Ix ≈ t·h³/6 + b·t·h²/2</span>. Informe a espessura real da alma em <i>Sistema e perfis</i> sempre que tiver o desenho do perfil.</p>
      <p><b>Flambagem local (classificação).</b> Esbeltez das paredes <span class="mono">β = η·b/t</span>, com η = 0,40 na alma em flexão e 1,0 na mesa comprimida. Para ligas 6xxx tratadas termicamente (classe A de flambagem), os limites são 11ε, 16ε e 22ε, com <span class="mono">ε = √(250/f0)</span>. Acima de 22ε a seção é de classe 4 e a resistência cai pelo fator <span class="mono">ρc = 32/(β/ε) − 220/(β/ε)²</span>. Nas classes 1 a 3 o programa não usa a reserva plástica (a favor da segurança).</p>
      <p><b>Flambagem lateral com torção.</b> Sob sucção, a mesa interna do montante fica comprimida. O momento crítico é <span class="mono">Mcr = C1·π/L·√(E·Iz·G·It)</span> (seção fechada, empenamento desprezível, C1 = 1,13 para carga distribuída). Com <span class="mono">λ̄LT = √(α·Wel·f0/Mcr)</span>, o fator χLT segue a curva com αLT = 0,10 e λ̄0 = 0,6 (classes 1–2) ou αLT = 0,20 e λ̄0 = 0,4 (classes 3–4). O comprimento destravado é o vão ou, se as travessas travam a mesa interna, o maior trecho entre travessas.</p>
      <p><b>Flexo-compressão.</b> Com o montante apoiado no console inferior, o peso do vidro e do perfil comprime a peça. O programa verifica a flambagem por flexão (curva da classe A: α = 0,20, λ̄0 = 0,10) e a interação <span class="mono">(N/Nb,Rd)^0,8 + (M/Mb,Rd)^0,8 ≤ 1</span>. Montantes suspensos no console superior ficam tracionados.</p>
      <div class="formula">Mb,Rd = χLT · α · Wel · f0 / γM1       Nb,Rd = χ · ρc · A · f0 / γM1</div>` },
    { id: 'desempenho', t: 'Desempenho térmico (Ucw, Uf, ψg)', h: `<p>O Ucw do sistema é a média ponderada por área (EN ISO 12631, método simplificado): <span class="mono">Ucw = (Ag·Ug + Af·Uf + lg·ψg)/Acw</span>.</p><ul><li><b>Ug</b>: calculado pela EN 673 a partir das emissividades e da cavidade (insulado) ou publicado pelo fabricante (monolítico e laminado).</li><li><b>Uf</b>: valor informado; se vazio, o publicado pelo fabricante; se não houver, 5,9 W/m²K (EN ISO 10077-1, perfil metálico sem ruptura de ponte térmica).</li><li><b>ψg</b>: valor informado; se vazio, o da EN ISO 10077-1 para espaçador de alumínio: 0,02 ou 0,05 W/mK sem ruptura de ponte térmica e 0,08 ou 0,11 com ruptura (vidro sem revestimento ou revestido). Para vidro monolítico ou laminado não há espaçador (ψg = 0).</li></ul><p>Quando um vidro do catálogo não traz todas as propriedades, o programa estima a emissividade da face 2 pelo U do monolítico (EN 673) e a refletância solar pelo fator solar (EN 410), e informa quais valores foram estimados.</p>` },
    { id: 'precos', t: 'Preços e orçamento', h: `<p>Cada item do quantitativo recebe um preço interno com a classe de confiabilidade:</p><ul><li><b>A</b>: referência oficial com código (SINAPI ou ORSE), na data-base indicada.</li><li><b>B</b>: derivado de referências oficiais por cálculo explícito (por exemplo, a laminação com PVB = laminado 4+4 SINAPI − 2 chapas de 4 mm − mão de obra de colocação).</li><li><b>C</b>: cotação pública identificada.</li><li><b>D</b>: estimativa sem referência pública (vidro revestido, insulado, silicone estrutural, chumbadores inox). Substitua pela cotação do fornecedor.</li><li><b>U</b>: preço informado por você.</li></ul><p>O alumínio é orçado em kg (SINAPI 34360) pela massa linear do catálogo. O vidro soma as chapas pela espessura e têmpera (SINAPI 10492, 34385, 10505 a 10507), a laminação, o adicional de cor ou revestimento e a montagem do insulado. A mão de obra usa os coeficientes das composições SINAPI 104099 (montagem da fachada stick) e 102173 (instalação de vidro com silicone estrutural).</p><p>Os preços SINAPI são o custo médio nacional sem desoneração. Use o <b>ajuste regional</b> para aproximar a praça da obra e o <b>BDI</b> para o preço de venda. O gráfico de confiabilidade mostra quanto do custo depende de estimativas. Acesso (balancim, andaime), frete e projeto não estão incluídos.</p>` },
    { id: 'fixacao', t: 'Ancoragens, silicone e juntas', h: `<p><b>Chumbadores.</b> Resistências de cálculo do fabricante (ancoragem isolada, C20/25, sem efeito de borda e espaçamento). Para consoles próximos à borda da laje ou com espaçamento reduzido, refaça a verificação no software do fabricante.</p><p><b>Silicone estrutural.</b> Pega mínima pela pressão de vento e espessura mínima pelo movimento térmico diferencial entre vidro e alumínio, ambas com mínimo de 6 mm; a relação pega/espessura deve ficar entre 1:1 e 3:1.</p><p><b>Juntas.</b> A largura mínima da junta de vedação é o movimento térmico dividido pela capacidade de movimentação do selante (±50% ou ±25%). A folga da luva de dilatação soma movimento térmico, deslocamento da laje e tolerância de montagem.</p><p><b>Calços.</b> Dois por painel, comprimento de 27,3 mm por m² de vidro (mínimo 102 mm), dureza 85 ± 5 Shore A, a L/4 das extremidades (GANA Glazing Manual).</p>` },
    { id: 'bim', t: 'Modelo BIM (IFC 4)', h: `<p>O arquivo IFC segue o esquema IFC4 e foi validado contra as regras do esquema. Cada componente tem tipo, material, propriedades e quantidades. Para abrir: Revit (Inserir → Vincular IFC), ArchiCAD (Arquivo → Abrir), Tekla, Solibri, BIMcollab Zoom, BlenderBIM.</p><p>Coordenadas: X ao longo da fachada, Z vertical, Y negativo para o exterior (vidro) e positivo para o interior (perfis, consoles e laje). Origem na base esquerda da fachada.</p>` },
    { id: 'catalogo', t: 'Catálogo e fontes', h: `<p>Os itens do catálogo vêm de documentos de fabricantes, avaliações técnicas europeias (ETA), declarações de desempenho e normas, com a fonte em cada item. Sinalizações:</p><ul><li><b>W est.</b>: o catálogo publica só a inércia; o módulo resistente foi estimado como 2·I/h (seção simétrica).</li><li><b>conf.</b>: o pareamento entre código e inércia foi inferido da tabela do fabricante; confira no desenho do perfil.</li><li><b>Face adotada</b>: a largura de face não consta do catálogo; ela afeta o modelo BIM, o cálculo térmico e a seção equivalente da flambagem.</li><li><b>≈ (massa estimada)</b>: o catálogo não informa a massa linear; ela foi estimada pela seção equivalente.</li></ul><p>Conteúdo da versão 2.0: 8 linhas de perfis (Texa, Hydro Argentina ×2, Schüco, Kawneer, Reynaers, Belmetal Atlanta e Hydro Città), 62 vidros com propriedades ópticas completas do catálogo CB3E/UFSC–ABIVIDRO, 7 selantes, 37 chumbadores (Hilti HST3 e fischer FAZ II) e a base de preços com 25 referências.</p><p>Você pode cadastrar perfis próprios ou importar uma linha em JSON (mesma estrutura do catálogo exportado).</p>` },
    { id: 'limites', t: 'Limitações', h: `<ul><li>Pré-dimensionamento: não substitui o projeto executivo, a verificação do fabricante do sistema e a ART do responsável técnico.</li><li>Edificações com h/b > 6, formas não retangulares, efeitos de vizinhança ou dinâmicos exigem ensaio em túnel de vento.</li><li>Teoria linear de placas (sem membrana): conservadora para tensões em vidros finos sob cargas altas.</li><li>Flambagem verificada com seção caixão equivalente: perfis multicelulares ou abertos podem ter comportamento diferente; confirme com as propriedades do fabricante.</li><li>Preços de classe D são estimativas sem referência pública e devem ser substituídos por cotações.</li><li>Consoles: o programa verifica chumbadores, parafuso e esmagamento; a chapa do console deve ser dimensionada à parte.</li><li>Cargas climáticas em insulados (variação de pressão na cavidade) não são consideradas.</li></ul>` },
    { id: 'lab', t: 'Laboratório: placa de vidro', h: `<p>Teste rapidamente uma chapa monolítica com o mesmo motor de cálculo do programa.</p><div class="grid"><label class="f">a (mm)<input id="lpA" type="number" value="1250"></label><label class="f">b (mm)<input id="lpB" type="number" value="2000"></label><label class="f">Espessura (mm)<input id="lpT" type="number" value="8"></label><label class="f">p (Pa)<input id="lpP" type="number" value="1500"></label><label class="f">Tratamento<select id="lpTr">${CAT.tratamentos.map(t => `<option value="${t.id}" ${t.id === 'temperado' ? 'selected' : ''}>${t.nome}</option>`).join('')}</select></label></div><div id="lpRes" style="margin-top:10px"></div>` }
  ];
  TABS.manual = {
    form() {
      const cur = lsGet(LS.man) || 'inicio';
      return `<div class="card"><div class="flex" style="margin-bottom:10px"><h2 style="margin:0">Manual</h2><input id="manBusca" placeholder="Buscar no manual" class="right" style="min-width:220px"></div>
      <div class="man"><nav id="manNav">${MANUAL.map(m => `<button data-man="${m.id}" class="${m.id === cur ? 'on' : ''}">${esc(m.t)}</button>`).join('')}</nav><article id="manArt"></article></div></div>`;
    },
    after() {
      const mostra = (id) => {
        const m = MANUAL.find(x => x.id === id) || MANUAL[0]; lsSet(LS.man, m.id);
        $('#manArt').innerHTML = `<h3>${esc(m.t)}</h3>${m.h}`; $$('#manNav button').forEach(b => b.classList.toggle('on', b.dataset.man === m.id));
        if (m.id === 'lab') {
          const calc = () => {
            const a = +$('#lpA').value, b = +$('#lpB').value, t = +$('#lpT').value, p = +$('#lpP').value;
            const r = PC.verificaPainel({ tipo: 'monolitico', ext: { plies: [t], trat: $('#lpTr').value } }, a, b, p, S.criterios);
            $('#lpRes').innerHTML = `<div class="kv"><span>b/a · α · β</span><b>${fmt(r.ba, 2)} · ${fmt(r.alfa, 5)} · ${fmt(r.beta, 4)}</b><span>σd / fg,d</span><b>${fmt(r.laminas[0].sigD, 1)} / ${fmt(r.laminas[0].fgd, 1)} MPa</b><span>Flecha / limite</span><b>${fmt(r.w, 1)} / ${fmt(r.wLim, 1)} mm</b><span>Massa</span><b>${fmt(r.massa, 1)} kg</b></div>${bar(Math.max(r.uS, r.uW))}`;
          };
          $$('#manArt input, #manArt select').forEach(i => i.addEventListener('input', calc)); calc();
        }
      };
      $('#manNav').addEventListener('click', e => { const b = e.target.closest('button[data-man]'); if (b) mostra(b.dataset.man); });
      $('#manBusca').addEventListener('input', e => { const q = norm(e.target.value); $$('#manNav button').forEach(b => { const m = MANUAL.find(x => x.id === b.dataset.man); b.style.display = !q || norm(m.t + ' ' + m.h.replace(/<[^>]+>/g, ' ')).includes(q) ? '' : 'none'; }); });
      mostra(lsGet(LS.man) || 'inicio');
    }
  };

  /* ---------------------------------------------------------- resumo lateral */
  function renderResumo() {
    const el = $('#resumo'); if (!el) return;
    if (ERR || !R) { el.innerHTML = `<div class="card"><div class="alert bad">Não foi possível calcular: ${esc(ERR ? ERR.message : '')}</div></div>`; return; }
    el.innerHTML = `<div class="card"><div class="src">Situação geral</div><div class="flex"><span class="big">${pct(R.uMax)}</span>${pill(R.ok, 'Atende', 'Revisar')}</div><div class="src">maior utilização entre as verificações</div></div>
    <div class="card"><div class="kv"><span>Local</span><b>${esc(S.local.nome)}/${esc(S.local.uf)}</b><span>V0</span><b>${fmt(R.W.V0, 0)} m/s</b><span>p projeto (borda)</span><b>${fmt(R.W.pDesign.borda, 0)} Pa</b><span>p projeto (central)</span><b>${fmt(R.W.pDesign.central, 0)} Pa</b><span>Montante</span><b>${esc(R.montante.p.codigo)}</b><span>Travessa</span><b>${esc(R.travessa.perfil.codigo)}</b><span>Vidro</span><b>${fmt(R.vidroCrit.borda.espNom, 0)} mm ${S.vidro.tipo}</b><span>Área</span><b>${fmt(R.G.W * R.G.H, 1)} m²</b></div></div>
    <div class="card">${R.resumo.map(x => `<div style="margin-bottom:7px"><div class="src">${esc(x.item)}</div>${bar(x.u)}</div>`).join('')}</div>
    <div class="card"><div class="kv"><span>Custo estimado</span><b>R$ ${fmt(R.orc.porM2, 0)}/m²</b><span>Total com BDI</span><b>R$ ${fmt(R.orc.total, 0)}</b><span>Ucw · g</span><b>${fmt(R.D.Ucw, 2)} · ${fmt(R.D.gSis, 2)}</b></div>${R.orc.porClasse.D / (R.orc.CD || 1) > 0.3 ? '<div class="src" style="margin-top:4px">Parte relevante do custo usa estimativas (classe D).</div>' : ''}</div>
    ${R.avisos.length ? `<div class="card"><div class="src" style="margin-bottom:4px">${R.avisos.length} aviso(s)</div>${R.avisos.slice(0, 3).map(a => `<div class="alert warn" style="font-size:12px">${esc(a)}</div>`).join('')}</div>` : ''}`;
  }

  /* ---------------------------------------------------------- render/abas */
  function renderTab(nome) {
    const t = TABS[nome], el = $('#tab-' + nome); if (!t || !el) return;
    el.innerHTML = t.form();
    if (t.after) t.after();
    if (t.res) { try { t.res(); } catch (e) { console.error(e); } }
  }
  function abre(nome) {
    aba = nome; lsSet(LS.tab, nome);
    $$('nav.side button').forEach(b => b.classList.toggle('on', b.dataset.tab === nome));
    $$('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + nome));
    renderTab(nome); window.scrollTo && window.scrollTo(0, 0);
  }
  function lerValor(inp) {
    const t = inp.dataset.t;
    if (t === 'b') return inp.checked;
    if (t === 'n') { const v = String(inp.value).replace(',', '.'); return (v === '' || !isFinite(+v)) ? undefined : +v; }
    if (t === 'list') return String(inp.value).split(/[;\s]+/).map(x => x.replace(',', '.')).filter(x => x !== '' && isFinite(+x)).map(Number);
    if (t === 'plies') return String(inp.value).split(/[+\s]+/).map(x => x.replace(',', '.')).filter(x => x !== '' && isFinite(+x) && +x > 0).map(Number);
    return inp.value;
  }
  function onChange(e) {
    const inp = e.target.closest('[data-k]'); if (!inp) return;
    const k = inp.dataset.k, v = lerValor(inp);
    if (v === undefined) return; // campo numérico vazio ou inválido: mantém o valor anterior
    if (k === 'sistema.linha' && v !== S.sistema.linha) {
      const s = PC.byId(CAT.sistemas, v);
      S.sistema.linha = v; S.sistema.montante = 'auto'; S.sistema.liga = s.liga; S.sistema.face = s.face;
      const tr = s.perfis.find(p => p.funcao === 'travessa' && (p.Ix || p.Iy)) || s.perfis.find(p => p.funcao === 'travessa') || s.perfis.find(p => p.funcao === 'montante');
      S.sistema.travessa = tr ? tr.codigo : '';
    } else if (k === 'vidro.tipo') {
      S.vidro.tipo = v;
      if (v === 'monolitico' && S.vidro.ext.plies.length > 1) S.vidro.ext.plies = [8];
      if (v === 'laminado' && S.vidro.ext.plies.length < 2) S.vidro.ext.plies = [4, 4];
    } else if (k === 'local.manual' && !v) { S.local.manual = false; S.local.V0 = S.local.V0auto; }
    else setP(S, k, v);
    if (k === 'meta.nome') { salva(); return; }
    if (inp.dataset.re && e.type === 'change') { salva(); recalc(); renderTab(aba); return; }
    if (e.type === 'change' || inp.tagName === 'INPUT') agenda();
  }

  /* ---------------------------------------------------------- ações */
  function salvarJSON() { download(slug(S.meta.nome) + '.pelecalc.json', JSON.stringify(S, null, 2), 'application/json'); toast('Projeto salvo.'); }
  function exportaIFC() {
    if (!R) { toast('Corrija os dados antes de exportar.'); return; }
    const nome = slug(S.meta.nome);
    const out = IFC.gerarIFC(S, R, { nomeArquivo: nome });
    ultimaIFC = { nome: nome + '.ifc', entidades: out.entidades, contagem: out.contagem };
    download(nome + '.ifc', out.texto, 'application/x-step');
    toast('Arquivo IFC 4 gerado: ' + out.entidades.toLocaleString('pt-BR') + ' entidades.');
    if (aba === 'bim') TABS.bim.res();
    return out;
  }
  function exportaCSV() {
    const O = R.orc, n = (x, d = 2) => x == null ? '' : x.toFixed(d).replace('.', ',');
    const linhas = [['Grupo', 'Item', 'Unidade', 'Quantidade', 'Preço unitário (R$)', 'Origem', 'Classe', 'Subtotal (R$)', 'Fonte / cálculo']].concat(O.itens.map(it => [it.grupo, it.desc, it.un, n(it.qtd, 3), n(it.pu), it.origem || '', it.classe || '', n(it.subtotal), it.preco ? it.preco.calculo : '']));
    linhas.push([], ['', 'Custo direto', '', '', '', '', '', n(O.CD)], ['', 'BDI ' + n(O.bdi) + '%', '', '', '', '', '', n(O.BDI)], ['', 'Total com BDI', '', '', '', '', '', n(O.total)], ['', 'Custo por m² de fachada', '', '', '', '', '', n(O.porM2)], ['', 'Base de preços: ' + O.dataBase]);
    download(slug(S.meta.nome) + '-orcamento.csv', '﻿' + linhas.map(l => l.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n'), 'text/csv');
  }
  function memorial() {
    if (!R) { toast('Sem resultados para o memorial.'); return; }
    const html = MEMORIAL.gerar(S, R, { fmt, esc });
    const w = window.open ? window.open('', '_blank') : null;
    if (w && w.document) { w.document.open(); w.document.write(html); w.document.close(); }
    else download(slug(S.meta.nome) + '-memorial.html', html, 'text/html');
  }
  function aviso() {
    if (!window.ABERTURA) return;
    if (window.PELECALC_SEM_ABERTURA) window.ABERTURA.avisos(); else window.ABERTURA.iniciar();
  }
  function tema(t) { document.documentElement.setAttribute('data-theme', t); lsSet(LS.tema, t); if (aba === 'vento') desenhaMapa(); }

  /* ---------------------------------------------------------- inicialização */
  function init() {
    carregaCatalogoUsuario(); carregaEstado();
    tema(lsGet(LS.tema) || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'));
    $('#projNome').value = S.meta.nome;
    $('#nav').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) abre(b.dataset.tab); });
    $('#main').addEventListener('change', onChange); $('#main').addEventListener('input', e => { if (e.target.matches('input[data-k]:not([type=checkbox])')) onChange(e); });
    $('#projNome').addEventListener('input', e => { S.meta.nome = e.target.value; salva(); });
    $('#btnNovo').addEventListener('click', () => { if (!window.confirm || window.confirm('Iniciar um novo projeto? Os dados atuais serão substituídos.')) { S = PC.projetoPadrao(); $('#projNome').value = S.meta.nome; salva(); recalc(); abre('vento'); } });
    $('#btnSalvar').addEventListener('click', salvarJSON);
    $('#btnAbrir').addEventListener('click', () => $('#fileAbrir').click());
    $('#fileAbrir').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      try { const j = JSON.parse(await f.text()); if (!j || !j.local || !j.fachada) throw new Error('não é um projeto do PeleCalc'); S = merge(PC.projetoPadrao(), j); $('#projNome').value = S.meta.nome; salva(); recalc(); abre('vento'); toast('Projeto aberto.'); }
      catch (er) { toast('Não foi possível abrir: ' + er.message); }
      e.target.value = '';
    });
    $('#btnIFC').addEventListener('click', exportaIFC);
    $('#btnMemorial').addEventListener('click', memorial);
    $('#btnTema').addEventListener('click', () => tema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
    window.addEventListener('resize', () => { if (aba === 'vento') desenhaMapa(); });
    recalc();
    abre(lsGet(LS.tab) && TABS[lsGet(LS.tab)] ? lsGet(LS.tab) : 'vento');
    aviso();
    window.PELECALC = { get estado() { return S; }, get resultado() { return R; }, recalc, abre, selecionaMunicipio, buscaMunicipios, exportaIFC, MUN };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
