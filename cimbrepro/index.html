á declaradas */\nvar VIGAS_IND = {\n  'H20':{n:'Viga de madeira H20 (treliçada/alma cheia)',h:.20,b:.08,Mrd:5.0,Vrd:11.0,EI:460,pe:.05},\n  'H16':{n:'Viga de madeira H16',h:.16,b:.08,Mrd:3.3,Vrd:8.0,EI:210,pe:.042},\n  'VM20':{n:'Viga metálica de escoramento 20 cm',h:.20,b:.09,Mrd:11.5,Vrd:30.0,EI:1100,pe:.11},\n  'VM24':{n:'Viga metálica de escoramento 24 cm',h:.24,b:.10,Mrd:17.0,Vrd:42.0,EI:1900,pe:.15}\n};\n\n/* Escoras e torres — capacidade típica declarada (confirmar em catálogo) */\nvar ESCORAS = {\n  'ESC-L':{n:'Escora metálica leve — tubo 48,3×2,0 (1,8 a 3,2 m)',Nrd:15,D:48.3,t:2.0,pernas:1,bx:.12,by:.12,pe:.12,hmax:3.2},\n  'ESC-M':{n:'Escora metálica média — tubo 48,3×2,65 (2,0 a 3,5 m)',Nrd:20,D:48.3,t:2.65,pernas:1,bx:.12,by:.12,pe:.15,hmax:3.5},\n  'ESC-P':{n:'Escora metálica pesada — tubo 60,3×3,0 (2,5 a 4,5 m)',Nrd:30,D:60.3,t:3.0,pernas:1,bx:.14,by:.14,pe:.22,hmax:4.5},\n  'TOR-L':{n:'Torre modular 4 montantes 1,0×1,0 m — 20 kN/montante',Nrd:80,D:48.3,t:2.65,pernas:4,bx:1.0,by:1.0,pe:.60,hmax:12},\n  'TOR-P':{n:'Torre de carga pesada 1,2×1,2 m — 40 kN/montante',Nrd:160,D:60.3,t:3.2,pernas:4,bx:1.2,by:1.2,pe:.95,hmax:15},\n  'CIM-P':{n:'Cimbre tubular pesado 1,5×1,5 m — 60 kN/montante',Nrd:240,D:76.1,t:4.0,pernas:4,bx:1.5,by:1.5,pe:1.4,hmax:20},\n  'PERS':{n:'Personalizada — informar capacidade',Nrd:20,D:48.3,t:3.0,pernas:1,bx:.12,by:.12,pe:.15,hmax:99}\n};\n\n/* Compensado plastificado — fmd em MPa (valor de cálculo), E em MPa */\nvar COMPENSADO = {12:{fmd:11,E:7000,pe:.075},15:{fmd:11,E:7000,pe:.094},\n                  18:{fmd:11,E:7000,pe:.113},20:{fmd:11,E:7000,pe:.125}};\n\n/* Prazos mínimos indicativos para retirada de fôrmas e escoramentos (NBR 14931) */\nvar PRAZOS_MIN = {lateral:3, parcial:14, total:21, balanco:28};\nvar CRIT_NOME  = {lateral:'Fôrmas laterais', parcial:'Fôrma retirada, reescoramento mantido',\n                  total:'Retirada total do escoramento', balanco:'Peças em balanço'};\n\n/* ---------------------- utilitários ---------------------- */\nfunction num(v,d){ v=parseFloat(v); return (isFinite(v)?v:(d===undefined?0:d)); }\nfunction r(v,n){ n=(n===undefined?2:n); var p=Math.pow(10,n); return Math.round(v*p)/p; }\nfunction clamp(v,a,b){ return v<a?a:(v>b?b:v); }\nfunction fmt(v,n){ n=(n===undefined?2:n);\n  if(!isFinite(v)) return '—';\n  return v.toFixed(n).replace('.',','); }\nfunction statusFU(fu){ return fu<=1 ? (fu<=0.85?'ok':'warn') : 'bad'; }\n\n/* coeficientes de esquema estático: M = cM·q·L², V = cV·q·L, δ = cD·q·L⁴/EI */\nfunction coefs(esq){\n  return esq==='cont' ? {cM:1/10, cV:0.60, cD:0.0069, nome:'contínua (≥3 vãos)'}\n                      : {cM:1/8,  cV:0.50, cD:5/384,  nome:'biapoiada'};\n}\n\n/* ==========================================================================\n   1. CARGAS\n   ========================================================================== */\nfunction calcCargas(i){\n  var hEf = num(i.h);\n  if(i.tipoLaje==='nervurada') hEf = hEf*(1-clamp(num(i.redNerv)/100,0,0.8));\n  var g1 = hEf*num(i.gc);                       // concreto fresco\n  var g2 = num(i.pf);                           // fôrma + escoramento\n  var q1 = num(i.q) + (i.bomba?0.5:0);          // sobrecarga de serviço\n  var g1d = g1*num(i.phi,1);                    // com impacto de lançamento\n  var qd  = num(i.gg)*(g1d+g2) + num(i.gq)*q1;  // ELU\n  var qk  = g1+g2+q1;                           // característica\n  var qser= g1+g2+num(i.psi,1)*q1;              // ELS\n  var A   = num(i.lx)*num(i.ly);\n  return {hEf:hEf,g1:g1,g2:g2,q1:q1,g1d:g1d,qd:qd,qk:qk,qser:qser,\n          area:A, Qd:qd*A, Qk:qk*A,\n          volConc:hEf*A, massaConc:hEf*A*num(i.gc)/9.81*1000,\n          fhTotal:qk*A*num(i.fhPct,1.5)/100};\n}\n\n/* ==========================================================================\n   2. VERIFICAÇÃO DE VIGAS\n   ========================================================================== */\nfunction propsViga(fam,sec,km){\n  /* devolve {tipo,nome,h,b,pe,Mrd,Vrd,EI,W,A,Ix} em kN·m, kN, kN·m², cm³, cm², cm⁴ */\n  var o={fam:fam,sec:sec};\n  if(fam==='ind'){\n    var v=VIGAS_IND[sec]; if(!v) return null;\n    o.tipo='ind'; o.nome=v.n; o.h=v.h; o.b=v.b; o.pe=v.pe;\n    o.Mrd=v.Mrd; o.Vrd=v.Vrd; o.EI=v.EI; o.W=null; o.A=null; o.Ix=null;\n    return o;\n  }\n  if(fam==='aco'){\n    var p=PERFIS[sec]; if(!p) return null;\n    var fy=250;\n    o.tipo='aco'; o.nome='Perfil '+sec; o.h=p.d/100; o.b=p.bf/100; o.pe=p.pe;\n    o.W=p.Wx; o.Zx=p.Zx; o.A=p.A; o.Ix=p.Ix; o.Iy=p.Iy; o.ry=p.ry; o.J=p.J; o.Cw=p.Cw; o.fy=fy;\n    o.Mpl = Math.min(p.Zx, 1.5*p.Wx)*fy/1000;         // kN·m\n    o.Mrd = o.Mpl/GA1;\n    o.Vrd = 0.06*fy*(p.d*p.tw)/GA1;                    // kN\n    o.EI  = E_ACO*p.Ix*1e-5;                           // kN·m²\n    return o;\n  }\n  /* madeira serrada */\n  var m=MADEIRA[fam]; if(!m) return null;\n  var s=null; for(var k=0;k<SECOES_MAD.length;k++) if(SECOES_MAD[k].id===sec) s=SECOES_MAD[k];\n  if(!s) return null;\n  var W=s.b*s.h*s.h/6, I=s.b*Math.pow(s.h,3)/12, A=s.b*s.h;\n  var fmd=km*m.fmk/GW_M, fvd=km*m.fvk/GW_V, Eef=km*m.E;\n  o.tipo='mad'; o.nome=m.n+' '+s.id+' cm'; o.h=s.h/100; o.b=s.b/100; o.pe=A*1e-4*m.pe;\n  o.W=W; o.A=A; o.Ix=I; o.fmd=fmd; o.fvd=fvd; o.Eef=Eef; o.kmod=km;\n  o.Mrd = fmd*W/1000;                                  // kN·m\n  o.Vrd = fvd*A/15;                                    // kN (τ=1,5V/A)\n  o.EI  = Eef*I*1e-5;                                  // kN·m²\n  return o;\n}\n\n/* FLT simplificada NBR 8800 (anexo G) para perfil I duplamente simétrico */\nfunction reduzFLT(p,Lb,Cb){\n  if(p.tipo!=='aco') return {fator:1,regime:'—'};\n  Cb=Cb||1.14;\n  var lam = Lb*100/p.ry;\n  var lp  = 1.76*Math.sqrt(E_ACO/p.fy);\n  var sr  = 0.3*p.fy;\n  var b1  = (p.fy-sr)*p.W/(E_ACO*p.J);\n  var lr  = (1.38*Math.sqrt(p.Iy*p.J)/(p.ry*p.J*b1))*Math.sqrt(1+Math.sqrt(1+27*p.Cw*b1*b1/p.Iy));\n  var Mpl = p.Mpl*GA1*0+Math.min(p.Zx,1.5*p.W)*p.fy/1000;\n  var Mr  = (p.fy-sr)*p.W/1000;\n  var Mn;\n  if(lam<=lp){ Mn=Mpl; }\n  else if(lam<=lr){ Mn = Cb*(Mpl-(Mpl-Mr)*(lam-lp)/(lr-lp)); if(Mn>Mpl) Mn=Mpl; }\n  else {\n    var Mcr = Cb*Math.PI*Math.PI*E_ACO*p.Iy/Math.pow(Lb*100,2)*\n              Math.sqrt(p.Cw/p.Iy*(1+0.039*p.J*Math.pow(Lb*100,2)/p.Cw))/1000*100;\n    Mn = Math.min(Mcr,Mpl);\n  }\n  return {fator:Mn/Mpl, regime:(lam<=lp?'compacta':(lam<=lr?'inelástica':'elástica')),\n          lam:lam, lp:lp, lr:lr, Mn:Mn};\n}\n\nfunction verificaViga(o){\n  /* o = {props, vao, qd, qser, esq, limFl, flAbs, gg, travada, Cb} */\n  var p=o.props, c=coefs(o.esq), L=o.vao;\n  var pp = num(o.gg,1.4)*(p.pe||0);\n  var qd = o.qd + pp, qs = o.qser + (p.pe||0);\n  var Msd = c.cM*qd*L*L, Vsd = c.cV*qd*L;\n  var Mrd = p.Mrd, flt={fator:1,regime:'—'};\n  var Lb = (o.Lb!==undefined && o.Lb!==null) ? o.Lb : L;\n  if(p.tipo==='aco' && !o.travada){ flt = reduzFLT(p,Lb,o.Cb); Mrd = p.Mrd*flt.fator; flt.Lb=Lb; }\n  var fl  = c.cD*qs*Math.pow(L,4)/p.EI*1000;            // mm\n  var flLim = Math.min(L*1000/num(o.limFl,400), num(o.flAbs,5));\n  var fuM = Msd/Mrd, fuV = Vsd/p.Vrd, fuF = fl/flLim;\n  var fu = Math.max(fuM,fuV,fuF);\n  return {q:qd, qs:qs, pp:pp, L:L, esq:c.nome, Msd:Msd, Vsd:Vsd, Mrd:Mrd, Vrd:p.Vrd,\n          flecha:fl, flechaLim:flLim, fuM:fuM, fuV:fuV, fuF:fuF, fu:fu,\n          ok:(fu<=1.0), flt:flt, props:p,\n          sigma:(p.W? Msd*1000/p.W*1000/1000 : null)};\n}\n\n/* maior espaçamento (passo 5 cm) que ainda satisfaz a viga */\nfunction maxVao(props,cargaPorMetroPorLargura,largura,o,lim){\n  var best=0;\n  for(var L=0.30; L<=lim+1e-9; L+=0.05){\n    var v=verificaViga({props:props, vao:r(L,2), qd:cargaPorMetroPorLargura*largura,\n      qser:o.qserA*largura, esq:o.esq, limFl:o.limFl, flAbs:o.flAbs, gg:o.gg,\n      travada:o.travada, Cb:o.Cb});\n    if(v.ok) best=r(L,2); else break;\n  }\n  return best;\n}\n\n/* ==========================================================================\n   3. ESCORA / TORRE — flambagem NBR 8800\n   ========================================================================== */\nfunction tuboProps(D,t){\n  var Dc=D/10, tc=t/10, di=Dc-2*tc;\n  var A = Math.PI/4*(Dc*Dc-di*di);\n  var I = Math.PI/64*(Math.pow(Dc,4)-Math.pow(di,4));\n  return {A:A, I:I, ri:Math.sqrt(I/A)};\n}\nfunction flambagem(D,t,fy,K,L,pernas){\n  var tp=tuboProps(D,t);\n  var EI = E_ACO*tp.I*1e-5;\n  var Ne = Math.PI*Math.PI*EI/Math.pow(K*L,2);\n  var Npl= tp.A*fy*0.1;\n  var l0 = Math.sqrt(Npl/Ne);\n  var chi= l0<=1.5 ? Math.pow(0.658, l0*l0) : 0.877/(l0*l0);\n  var Nrd= chi*Npl/GA1;\n  return {A:tp.A, I:tp.I, ri:tp.ri, Ne:Ne, Npl:Npl, lam0:l0, chi:chi,\n          NrdPerna:Nrd, Nrd:Nrd*(pernas||1), esbeltez:K*L*100/tp.ri, pernas:pernas||1};\n}\n\n/* ==========================================================================\n   4. MALHA — otimização e verificação\n   ========================================================================== */\nfunction resolveMalha(i,cg){\n  var km = num(i.km1,.8)*num(i.km2,.8)*num(i.km3,.8);\n  var pSomb = propsViga(i.sombFam, i.sombSec, km);\n  var pLong = i.usaLong ? propsViga(i.longFam, i.longSec, km) : null;\n  if(!pSomb) return {erro:'Seção de sombriga inválida.'};\n  if(i.usaLong && !pLong) return {erro:'Seção de longarina inválida.'};\n\n  var base={qserA:cg.qser, limFl:i.limFl, flAbs:i.flAbs, gg:i.gg, travada:!!i.travada, Cb:num(i.Cb,1.14)};\n\n  /* capacidade da escora */\n  var esc = ESCORAS[i.escoraId]||ESCORAS['PERS'];\n  var flamb=null, Nrd=num(i.Nrd,20);\n  if(i.calcFlamb){\n    flamb = flambagem(num(i.Dt,48.3), num(i.Tt,3), num(i.fyT,250), num(i.K,1), num(i.pd,3), esc.pernas);\n    Nrd = flamb.Nrd;\n  }\n\n  /* compensado: maior St admissível */\n  var stComp = num(i.stMax,.6), compRes=null;\n  if(num(i.comp,0)>0){\n    compRes = verificaCompensado(num(i.comp), cg, i, num(i.stMax,.6));\n    stComp = Math.min(num(i.stMax,.6), compRes.stMax);\n  }\n\n  var oS = Object.assign({},base,{esq:i.sombEsq});\n  var oL = Object.assign({},base,{esq:i.longEsq});\n\n  var melhor=null;\n  var syTop = num(i.syMax,2), sxTop = num(i.sxMax,2);\n  var syIni = i.otimizar ? 0.30 : syTop, sxIni = i.otimizar ? 0.30 : sxTop;\n\n  for(var sy=syTop; sy>=syIni-1e-9; sy-=0.05){\n    sy=r(sy,2);\n    var vaoSomb = i.usaLong ? sy : null;      // sem longarina o vão da sombriga é Sx\n    for(var sx=sxTop; sx>=sxIni-1e-9; sx-=0.05){\n      sx=r(sx,2);\n      var vS = i.usaLong ? sy : sx;\n      /* maior St que a sombriga aceita neste vão */\n      var stS = 0;\n      for(var st=0.15; st<=stComp+1e-9; st+=0.05){\n        var t=verificaViga(Object.assign({props:pSomb, vao:vS, qd:cg.qd*st, qser:cg.qser*st},oS));\n        if(t.ok) stS=r(st,2); else break;\n      }\n      if(stS<0.15) continue;\n      var vSomb = verificaViga(Object.assign({props:pSomb, vao:vS, qd:cg.qd*stS, qser:cg.qser*stS},oS));\n      var vLong = null;\n      if(i.usaLong){\n        vLong = verificaViga(Object.assign({props:pLong, vao:sx, qd:cg.qd*sy, qser:cg.qser*sy, Lb:stS},oL));\n        if(!vLong.ok) continue;\n      }\n      var P = cg.qd*sx*sy + (i.usaLong? num(i.gg,1.4)*(pLong.pe||0)*sx : 0);\n      if(P>Nrd) continue;\n      var score = sx*sy;\n      if(!melhor || score>melhor.score+1e-9 || (Math.abs(score-melhor.score)<1e-9 && stS>melhor.st)){\n        melhor={sx:sx, sy:sy, st:stS, score:score, P:P, vSomb:vSomb, vLong:vLong};\n      }\n      if(!i.otimizar) break;\n    }\n    if(!i.otimizar) break;\n  }\n\n  if(!melhor){\n    /* devolve o cenário adotado mesmo reprovando, para diagnóstico */\n    var sx0=sxTop, sy0=syTop, st0=Math.min(num(i.stMax,.6),stComp||num(i.stMax,.6));\n    var vS0=i.usaLong?sy0:sx0;\n    var s0=verificaViga(Object.assign({props:pSomb, vao:vS0, qd:cg.qd*st0, qser:cg.qser*st0},oS));\n    var l0=i.usaLong?verificaViga(Object.assign({props:pLong, vao:sx0, qd:cg.qd*sy0, qser:cg.qser*sy0, Lb:st0},oL)):null;\n    melhor={sx:sx0, sy:sy0, st:st0, score:sx0*sy0, P:cg.qd*sx0*sy0, vSomb:s0, vLong:l0, reprovado:true};\n  }\n\n  var nx = Math.max(2, Math.ceil(num(i.lx)/melhor.sx)+1);\n  var ny = Math.max(2, Math.ceil(num(i.ly)/melhor.sy)+1);\n  var sxReal = num(i.lx)/(nx-1), syReal = num(i.ly)/(ny-1);\n  var nTorres = nx*ny;\n  var Preal = cg.qd*sxReal*syReal;\n  var APLACA = 0.15*0.15;                                  // placa de base 15 × 15 cm\n  var areaOcup = nTorres*(esc.pernas||1)*APLACA;           // contato efetivo com o apoio\n  var areaProj = nTorres*(esc.pernas>1? esc.bx*esc.by : Math.PI/4*Math.pow(esc.bx,2));\n  var taxa = cg.area>0 ? areaOcup/cg.area*100 : 0;\n  var taxaProj = cg.area>0 ? areaProj/cg.area*100 : 0;\n\n  var nSomb = Math.max(2, Math.round(num(i.lx)/melhor.st)+1);\n  var compSomb = nSomb*num(i.ly);\n  var nLong = i.usaLong? ny : 0;\n  var compLong = nLong*num(i.lx);\n\n  return {\n    km:km, pSomb:pSomb, pLong:pLong, esc:esc, Nrd:Nrd, flamb:flamb,\n    sx:melhor.sx, sy:melhor.sy, st:melhor.st,\n    sxReal:r(sxReal,3), syReal:r(syReal,3),\n    nx:nx, ny:ny, nTorres:nTorres, P:melhor.P, Preal:Preal,\n    fuTorre:Preal/Nrd, taxaOcup:taxa, areaOcup:areaOcup,\n    taxaProjecao:taxaProj, areaProjecao:areaProj,\n    vSomb:melhor.vSomb, vLong:melhor.vLong, comp:compRes,\n    nSomb:nSomb, compSomb:compSomb, nLong:nLong, compLong:compLong,\n    reprovado:!!melhor.reprovado,\n    stComp:stComp,\n    ok:(!melhor.reprovado && Preal<=Nrd && melhor.vSomb.ok && (!melhor.vLong||melhor.vLong.ok))\n  };\n}\n\n/* ==========================================================================\n   5. COMPENSADO\n   ========================================================================== */\nfunction verificaCompensado(esp,cg,i,stAlvo){\n  var c=COMPENSADO[esp]; if(!c) return null;\n  var t=esp/1000;\n  var W = 1*t*t/6, I = 1*Math.pow(t,3)/12;             // por metro de largura, m³ e m⁴\n  var Mrd = c.fmd*1000*W;                              // kN·m/m\n  var EI  = c.E*1000*I;                                // kN·m²/m\n  var stMax=0;\n  for(var s=0.10; s<=1.2; s+=0.025){\n    var M=cg.qd*s*s/10, fl=0.0069*cg.qser*Math.pow(s,4)/EI*1000;\n    var flLim=Math.min(s*1000/num(i.limFl,400), num(i.flAbs,5));\n    if(M<=Mrd && fl<=flLim) stMax=r(s,3); else break;\n  }\n  var st=Math.min(stAlvo,stMax);\n  var Msd=cg.qd*st*st/10, fl=0.0069*cg.qser*Math.pow(st,4)/EI*1000;\n  var flLim=Math.min(st*1000/num(i.limFl,400), num(i.flAbs,5));\n  return {esp:esp, Mrd:Mrd, Msd:Msd, EI:EI, flecha:fl, flechaLim:flLim,\n          stMax:stMax, st:st, pe:c.pe,\n          fuM:Msd/Mrd, fuF:fl/flLim, fu:Math.max(Msd/Mrd,fl/flLim),\n          ok:(Msd<=Mrd && fl<=flLim)};\n}\n\n/* ==========================================================================\n   6. ESTABILIDADE HORIZONTAL E APOIO INFERIOR\n   ========================================================================== */\nfunction estabilidade(i,cg,m){\n  var Fh = cg.Qk*num(i.fhPct,1.5)/100;\n  var linhas = m.ny;                                     // linhas de contraventamento em X\n  var FhLinha = Fh/Math.max(1,linhas);\n  var theta = Math.atan(num(i.pd,3)/m.sxReal);\n  var Fdiag = FhLinha/Math.cos(theta);\n  var MTomb = Fh*num(i.pd,3)/2;\n  var Nest = cg.Qk;\n  var bMin = m.sxReal*(m.nx-1);\n  var MEstab = Nest*bMin/2;\n  return {Fh:Fh, FhLinha:FhLinha, linhas:linhas, theta:theta*180/Math.PI, Fdiag:Fdiag,\n          MTomb:MTomb, MEstab:MEstab, fsTomb:MEstab/Math.max(MTomb,1e-6),\n          desaprumo:num(i.pd,3)/500*1000};\n}\nfunction apoioInferior(i,cg,m){\n  var pesoEsc = m.nTorres*(m.esc.pe||0)*num(i.pd,3)/3;\n  var qLaje = cg.qk + pesoEsc/cg.area;\n  var P = m.Preal;\n  var areaBase = m.esc.pernas>1 ? 4*0.15*0.15 : 0.15*0.15;\n  var sigma = P/areaBase;\n  var prancha = Math.sqrt(P/300);                       // 300 kPa como referência de solo médio\n  return {pesoEsc:pesoEsc, qLajeInferior:qLaje, P:P, sigmaBase:sigma,\n          areaBase:areaBase, ladoPrancha:prancha,\n          tensaoSoloRef:300, larguraSugerida:Math.max(0.25, r(prancha,2))};\n}\n\n/* ==========================================================================\n   7. GANHO DE RESISTÊNCIA E PRAZO DE DESFORMA (NBR 12655 / NBR 6118)\n   ========================================================================== */\nfunction fatorMaturidade(T,modo,Tref){\n  Tref = Tref===undefined?20:Tref;\n  if(modo==='none') return 1;\n  if(modo==='ns'){ var T0=-10; return Math.max(0,(T-T0)/(Tref-T0)); }\n  var Ea = T>=20 ? 33500 : 33500+1470*(20-T);\n  return Math.exp(-Ea/R_GAS*(1/(273.15+T)-1/(273.15+Tref)));\n}\nfunction betaCC(te,s){ if(te<=0) return 0; return Math.exp(s*(1-Math.sqrt(28/te))); }\nfunction idadeParaBeta(bAlvo,s){\n  if(bAlvo<=0) return 0;\n  if(bAlvo>=Math.exp(s)) return Infinity;               // limite assintótico\n  var d = 1 - Math.log(bAlvo)/s;\n  return 28/(d*d);\n}\nfunction desforma(i,cg,m){\n  var fck=num(i.fck,30), s=num(i.s,.25), T=num(i.temp,28), modo=i.matModo||'arr';\n  var aE=num(i.alfaE,1.0);\n  var kT = fatorMaturidade(T,modo);\n  var Eci28 = aE*5600*Math.sqrt(fck);\n  var kappa = clamp(num(i.kappa,.7),.05,1.0);\n\n  var teReq = idadeParaBeta(kappa,s);\n  var tReq  = isFinite(teReq)? teReq/Math.max(kT,1e-6) : Infinity;\n  var prazoNorma = PRAZOS_MIN[i.criterio]||14;\n  var usaMin = (i.prazoMin!==false) && !i.usaCP;\n  var tAdot = usaMin ? Math.max(tReq, prazoNorma) : tReq;\n\n  var linhas=[], marcos=[.3,.5,.7,.8,.9,1.0], achados={};\n  var passos=[0.5,1,1.5,2,3,4,5,6,7,10,14,21,28];\n  for(var k=0;k<passos.length;k++){\n    var t=passos[k], te=t*kT, b=betaCC(te,s);\n    linhas.push({t:t, te:te, beta:b, fcj:b*fck, Eci:Math.sqrt(b)*Eci28,\n                 razaoE:Math.sqrt(b), atinge:b>=kappa});\n  }\n  for(var j=0;j<marcos.length;j++){\n    var tm=idadeParaBeta(marcos[j],s);\n    achados[marcos[j]] = isFinite(tm)? tm/Math.max(kT,1e-6) : Infinity;\n  }\n  var curva=[];\n  for(var d=0.25; d<=28.01; d+=0.25){\n    var te2=d*kT, b2=betaCC(te2,s);\n    curva.push({t:d, beta:b2, razaoE:Math.sqrt(b2)});\n  }\n  var dataCon = i.dataConc? new Date(i.dataConc+'T12:00:00') : null;\n  var dataDesf=null;\n  if(dataCon && isFinite(tAdot)){\n    dataDesf=new Date(dataCon.getTime()+Math.ceil(tAdot)*86400000);\n  }\n  var crono=[];\n  var etapas=[['lateral',3],['parcial',14],['total',21],['balanco',28]];\n  for(var e=0;e<etapas.length;e++){\n    var kap = {lateral:0.30,parcial:0.60,total:0.80,balanco:1.00}[etapas[e][0]];\n    var tt = idadeParaBeta(kap,s); tt = isFinite(tt)? tt/Math.max(kT,1e-6):Infinity;\n    var ta = usaMin ? Math.max(tt,etapas[e][1]) : tt;\n    var dd = dataCon && isFinite(ta) ? new Date(dataCon.getTime()+Math.ceil(ta)*86400000) : null;\n    crono.push({etapa:etapas[e][0], nome:CRIT_NOME[etapas[e][0]], kappa:kap,\n                tCalc:tt, tMin:etapas[e][1], tAdot:ta, data:dd,\n                fcj:betaCC(Math.min(ta,3650)*kT,s)*fck});\n  }\n  return {fck:fck, s:s, T:T, kT:kT, modo:modo, Eci28:Eci28, kappa:kappa,\n          fcjReq:kappa*fck, teReq:teReq, tReq:tReq, prazoNorma:prazoNorma,\n          tAdot:tAdot, usaMin:usaMin, linhas:linhas, curva:curva, marcos:achados,\n          dataConc:dataCon, dataDesf:dataDesf, crono:crono,\n          reesc:num(i.reesc,2), criterio:i.criterio,\n          betaNaDesforma:betaCC(Math.min(tAdot,3650)*kT,s)};\n}\n\n/* ==========================================================================\n   8. GEOMETRIA 3D (compartilhada pela vista isométrica e pelo IFC)\n   ========================================================================== */\nfunction geometria(i,cg,m,z0){\n  z0=num(z0,0);\n  var Lx=num(i.lx), Ly=num(i.ly), Ht=num(i.pd,3);\n  var hLong = m.pLong? m.pLong.h : 0;\n  var hSomb = m.pSomb.h;\n  var tComp = num(i.comp,0)/1000;\n  var zTopoTorre = z0+Ht;\n  var zLong = zTopoTorre;\n  var zSomb = zTopoTorre + hLong;\n  var zForma= zSomb + hSomb;\n  var zLaje = zForma + tComp;\n\n  var torres=[], longs=[], sombs=[];\n  var x,y,k;\n  for(k=0;k<m.nx;k++){\n    x = k*m.sxReal;\n    for(var j=0;j<m.ny;j++){\n      y = j*m.syReal;\n      torres.push({x:x, y:y, z:z0, h:Ht, ix:k, iy:j});\n    }\n  }\n  if(m.pLong){\n    for(var j2=0;j2<m.ny;j2++){\n      longs.push({x0:0, y:j2*m.syReal, z:zLong, L:Lx, h:m.pLong.h, b:m.pLong.b});\n    }\n  }\n  var nS = m.nSomb;\n  for(k=0;k<nS;k++){\n    x = (nS>1)? k*(Lx/(nS-1)) : Lx/2;\n    sombs.push({x:x, y0:0, z:zSomb, L:Ly, h:m.pSomb.h, b:m.pSomb.b});\n  }\n  return {Lx:Lx, Ly:Ly, Ht:Ht, z0:z0, zTopoTorre:zTopoTorre, zLong:zLong,\n          zSomb:zSomb, zForma:zForma, zLaje:zLaje, hLaje:num(i.h),\n          torres:torres, longs:longs, sombs:sombs, tComp:tComp};\n}\n\n/* ==========================================================================\n   9. EXPORTAÇÃO IFC4\n   ========================================================================== */\nvar IFC_ALFA = \"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_$\";\nfunction ifcGuid(rndFn){\n  var rnd = rndFn||Math.random, hex='';\n  for(var i=0;i<32;i++) hex += Math.floor(rnd()*16).toString(16);\n  var v = BigInt('0x'+hex), out=new Array(22);\n  for(var k=21;k>=1;k--){ out[k]=IFC_ALFA[Number(v & 63n)]; v >>= 6n; }\n  out[0]=IFC_ALFA[Number(v & 3n)];\n  return out.join('');\n}\nfunction esc(s){ return String(s==null?'':s).replace(/\\\\/g,'\\\\\\\\').replace(/'/g,\"\\\\'\"); }\n\nfunction gerarIFC(opt){\n  var i=opt.i, cg=opt.cg, m=opt.m, g=opt.g, df=opt.df;\n  var rnd = opt.rnd || Math.random;\n  var L=[], id=0;\n  function add(txt){ id++; L.push('#'+id+'='+txt+';'); return '#'+id; }\n  function G(){ return ifcGuid(rnd); }\n  function pt(x,y,z){ return add('IFCCARTESIANPOINT(('+r(x,6)+','+r(y,6)+','+r(z,6)+'))'); }\n  function dir(x,y,z){ return add('IFCDIRECTION(('+r(x,6)+','+r(y,6)+','+r(z,6)+'))'); }\n\n  /* --- cabeçalho --- */\n  var agora = new Date().toISOString().replace(/\\.\\d+Z$/,'');\n  var head =\n   \"ISO-10303-21;\\nHEADER;\\n\"+\n   \"FILE_DESCRIPTION(('ViewDefinition [CoordinationView]','Escoramento de laje'),'2;1');\\n\"+\n   \"FILE_NAME('\"+esc((opt.nomeArq||'escoramento')+'.ifc')+\"','\"+agora+\"',('\"+esc(i.resp||'Nao informado')+\"'),\"+\n   \"('\"+esc(i.obra||'Obra')+\"'),'CimbrePro 1.0','CimbrePro 1.0','');\\n\"+\n   \"FILE_SCHEMA(('IFC Sec:'sombSec',iStMax:'stMax',iSombEsq:'sombEsq',\n    iLongFam:'longFam',iLongSec:'longSec',iLongEsq:'longEsq',iComp:'comp',iFlecha:'limFl',iFlAbs:'flAbs',\n    iKm1:'km1',iKm2:'km2',iKm3:'km3',iFck:'fck',iCim:'s',iTemp:'temp',iMat:'matModo',iAgreg:'alfaE',\n    iCrit:'criterio',iKappa:'kappa',iReesc:'reesc',iIfcX0:'ifcX0',iIfcY0:'ifcY0',iIfcZ0:'ifcZ0'};\n  Object.keys(map).forEach(function(k){ if(d[map[k]]!==undefined && $(k)) $(k).value=d[map[k]]; });\n  [['iBomba','bomba'],['iCalcFlamb','calcFlamb'],['iOtim','otimizar'],['iUsaLong','usaLong'],\n   ['iPrazoMin','prazoMin'],['iCP','usaCP']].forEach(function(p){\n     if(d[p[1]]!==undefined && $(p[0])) $(p[0]).checked=!!d[p[1]]; });\n  sincroniza();\n}\n\n/* ---------------- povoamento dos selects ---------------- */\nfunction famOpts(){\n  var h='<optgroup label=\"Vigas industrializadas de escoramento\">';\n  Object.keys(E.VIGAS_IND).forEach(function(k){h+='<option value=\"ind::'+k+'\">'+E.VIGAS_IND[k].n+'<\u002Foption>';});\n  h+='<\u002Foptgroup><optgroup label=\"Perfil I laminado (aço)\"><option value=\"aco::*\">Perfil I laminado<\u002Foption><\u002Foptgroup>';\n  h+='<optgroup label=\"Madeira serrada (NBR 7190)\">';\n  Object.keys(E.MADEIRA).forEach(function(k){h+='<option value=\"mad::'+k+'\">'+E.MADEIRA[k].n+'<\u002Foption>';});\n  h+='<\u002Foptgroup>';\n  return h;\n}\nfunction popularFamilias(){\n  ['iSombFam','iLongFam'].forEach(function(id){ $(id).innerHTML=famOpts(); });\n  $('iEscora').innerHTML=Object.keys(E.ESCORAS).map(function(k){\n    return '<option value=\"'+k+'\">'+E.ESCORAS[k].n+'<\u002Foption>';}).join('');\n  $('iEscora').value='TOR-L';\n  $('iSombFam').value='ind::H20';\n  $('iLongFam').value='aco::*';\n  atualizaSecoes('iSombFam','iSombSec','H20');\n  atualizaSecoes('iLongFam','iLongSec','W200x22.5');\n}\nfunction atualizaSecoes(famId,secId,pref){\n  var v=$(famId).value, parts=v.split('::'), tipo=parts[0], chave=parts[1], h='';\n  if(tipo==='ind'){ h='<option value=\"'+chave+'\">'+E.VIGAS_IND[chave].n+'<\u002Foption>'; }\n  else if(tipo==='aco'){ h=Object.keys(E.PERFIS).map(function(k){\n      var p=E.PERFIS[k]; return '<option value=\"'+k+'\">'+k+' — Wx '+p.Wx+' cm³, Ix '+p.Ix+' cm⁴<\u002Foption>';}).join(''); }\n  else { h=E.SECOES_MAD.map(function(s){\n      return '<option value=\"'+s.id+'\">'+s.id+' cm — W '+r(s.b*s.h*s.h/6,0)+' cm³<\u002Foption>';}).join(''); }\n  $(secId).innerHTML=h;\n  if(pref){var o=$(secId).querySelector('option[value=\"'+pref+'\"]'); if(o)$(secId).value=pref;}\n}\nfunction famReal(id){ return $(id).value.split('::')[0]==='mad' ? $(id).value.split('::')[1]\n                     : ($(id).value.split('::')[0]==='ind' ? 'ind' : 'aco'); }\n\n/* ---------------- sincronização de campos ---------------- */\nfunction sincroniza(){\n  $('oRedNerv').textContent=$('iRedNerv').value+'%';\n  $('oFh').textContent=f(n($('iFh').value),1)+'%';\n  $('oTemp').textContent=$('iTemp').value+' °C';\n  $('oKappa').textContent=f(n($('iKappa').value),2);\n  $('wrapNerv').style.display = $('iTipoLaje').value==='nervurada'?'':'none';\n  $('wrapFlamb').style.display = $('iCalcFlamb').checked?'':'none';\n  $('wrapLong').style.display = $('iUsaLong').checked?'':'none';\n  var e=E.ESCORAS[$('iEscora').value];\n  if(e && $('iEscora')._last!==$('iEscora').value){\n    $('iEscora')._last=$('iEscora').value;\n    if($('iEscora').value!=='PERS'){ $('iNrd').value=e.Nrd; $('iDt').value=e.D; $('iTt').value=e.t; }\n  }\n  var crit=$('iCrit').value;\n  var kdef={lateral:0.30,parcial:0.60,total:0.80,balanco:1.00}[crit];\n  if($('iCrit')._last!==crit){ $('iCrit')._last=crit; $('iKappa').value=kdef; $('oKappa').textContent=f(kdef,2); }\n}\n\n/* ==========================================================================\n   RENDERIZAÇÃO\n   ========================================================================== */\nfunction calcular(){\n  var i=ler();\n  i.sombFam=famReal('iSombFam'); i.sombSec=$('iSombSec').value;\n  i.longFam=famReal('iLongFam'); i.longSec=$('iLongSec').value;\n  var res=E.calcular(i);\n  if(res.erro){ toast(res.erro); return; }\n  EST=res;\n  renderCargas(res); renderMalha(res); renderVigas(res); renderEscoras(res);\n  renderDesforma(res); renderRelatorio(res); render3D(res); renderIfcResumo(res);\n  salvarAuto();\n  return res;\n}\n\n/* -------- 02 CARGAS -------- */\nfunction renderCargas(R){\n  var c=R.cg;\n  $('kCargas').innerHTML =\n    kpi('Peso do concreto fresco',f(c.g1,2),'kN/m² — g₁','hi')+\n    kpi('Fôrma + escoramento',f(c.g2,2),'kN/m² — g₂')+\n    kpi('Sobrecarga de serviço',f(c.q1,2),'kN/m² — q₁')+\n    kpi('Carga característica',f(c.qk,2),'kN/m² — qk')+\n    kpi('Carga de serviço',f(c.qser,2),'kN/m² — ELS')+\n    kpi('Carga de cálculo',f(c.qd,2),'kN/m² — ELU','hi');\n  $('memCargas').innerHTML =\n    '<div class=\"eq\">g₁ = h_ef · γc = '+f(c.hEf,3)+' · '+f(R.i.gc,1)+' = '+f(c.g1,2)+' kN/m²<\u002Fdiv>'+\n    '<div class=\"eq\">g₁,din = g₁ · φ = '+f(c.g1,2)+' · '+f(R.i.phi,2)+' = '+f(c.g1d,2)+' kN/m²<\u002Fdiv>'+\n    '<div class=\"eq\">qd = γg·(g₁,din + g₂) + γq·q₁\\n   = '+f(R.i.gg,2)+'·('+f(c.g1d,2)+' + '+f(c.g2,2)+\n      ') + '+f(R.i.gq,2)+'·'+f(c.q1,2)+' = '+f(c.qd,2)+' kN/m²<\u002Fdiv>'+\n    '<div class=\"eq\">q,ser = g₁ + g₂ + ψ·q₁ = '+f(c.qser,2)+' kN/m²<\u002Fdiv>'+\n    (R.i.tipoLaje==='nervurada'?'<div class=\"hint\">Espessura equivalente reduzida em '+R.i.redNerv+\n      '% pelo volume das cubetas.<\u002Fdiv>':'');\n  /* barras de participação */\n  var W=560,H=150,pad=110, itens=[['Concreto fresco',c.g1,CO.amber],['Fôrma + escoramento',c.g2,CO.steel],\n    ['Sobrecarga de serviço',c.q1,CO.mut]];\n  var max=c.qk, s='';\n  itens.forEach(function(it,k){\n    var y=24+k*38, w=(W-pad-30)*it[1]/max;\n    s+=txt(pad-8,y+13,it[0],{a:'end',s:10.5});\n    s+=rect(pad,y,w,18,it[2],{rx:2});\n    s+=txt(pad+w+6,y+13,f(it[1],2)+' kN/m² ('+f(it[1]/max*100,0)+'%)',{s:10});\n  });\n  s+=ln(pad,138,W-20,138,CO.line,1);\n  s+=txt(pad,150,'Total característico qk = '+f(c.qk,2)+' kN/m²',{s:10.5,w:700,c:CO.amber});\n  $('chartCargas').innerHTML=svg(W,H,s);\n\n  $('tbCargas').innerHTML='<thead><tr><th>Grandeza<\u002Fth><th class=\"n\">Valor<\u002Fth><th>Unidade<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+\n   [['Área do painel',f(c.area,2),'m²'],\n    ['Espessura efetiva de concreto',f(c.hEf,3),'m'],\n    ['Volume de concreto',f(c.volConc,2),'m³'],\n    ['Massa de concreto (referência)',f(c.massaConc/1000,2),'t'],\n    ['Carga total característica Qk',f(c.Qk,1),'kN'],\n    ['Carga total de cálculo Qd',f(c.Qd,1),'kN'],\n    ['Ação horizontal mínima Fh',f(c.fhTotal,2),'kN']\n   ].map(function(l){return '<tr><td>'+l[0]+'<\u002Ftd><td class=\"n\">'+l[1]+'<\u002Ftd><td>'+l[2]+'<\u002Ftd><\u002Ftr>';}).join('')+\n   '<\u002Ftbody>';\n}\n\n/* -------- 03 MALHA -------- */\nfunction renderMalha(R){\n  var m=R.m, i=R.i;\n  var st=E.statusFU(m.fuTorre);\n  $('kMalha').innerHTML =\n    kpi('Espaçamento Sx',f(m.sxReal,2),'m — direção X','hi')+\n    kpi('Espaçamento Sy',f(m.syReal,2),'m — direção Y','hi')+\n    kpi('Sombrigas a cada',f(m.st,2),'m — St')+\n    kpi('Torres / escoras',m.nTorres,m.nx+' × '+m.ny+' pontos')+\n    kpi('Carga por ponto',f(m.Preal,2),'kN — Nrd '+f(m.Nrd,1)+' kN',st)+\n    kpi('Utilização da escora',f(m.fuTorre*100,1)+'%',(m.fuTorre<=1?'dentro do limite':'excedido'),st)+\n    kpi('Taxa de ocupação',f(m.taxaOcup,2)+'%','placas de base / área da laje')+\n    kpi('Projeção em planta',f(m.taxaProjecao,1)+'%','área tomada pelas torres')+\n    kpi('Densidade',f(m.nTorres/R.cg.area,2),'torres por m²');\n  var av=[];\n  if(m.reprovado) av.push({t:'e',b:'Nenhuma malha atende com os componentes atuais',\n    x:'Reduza o espaçamento máximo, aumente a seção das vigas ou adote escora de maior capacidade. Os valores mostrados são o cenário limite adotado, apenas para diagnóstico.'});\n  if(m.taxaOcup>8) av.push({t:'w',b:'Escoramento muito denso',x:'Taxa de ocupação de '+f(m.taxaOcup,2)+\n    '% (faixa usual de 3% a 7%) indica malha antieconômica. Avalie longarinas mais rígidas ou torres de maior capacidade.'});\n  if(m.taxaOcup<2 && !m.reprovado) av.push({t:'w',b:'Malha bastante aberta',\n    x:'Taxa de ocupação de '+f(m.taxaOcup,2)+'%, abaixo da faixa usual. Confirme em campo o travamento horizontal e a regularidade do apoio inferior.'});\n  if(m.taxaProjecao>45) av.push({t:'w',b:'Circulação comprometida',\n    x:'As torres tomam '+f(m.taxaProjecao,0)+'% da projeção em planta. Planeje os acessos da equipe de lançamento e o caminhamento da mangueira.'});\n  if(m.fuTorre>0.85 && m.fuTorre<=1) av.push({t:'w',b:'Escora próxima do limite',\n    x:'Utilização de '+f(m.fuTorre*100,1)+'%. Deixe margem para desvios de montagem e concentração de lançamento.'});\n  if(i.pd>m.esc.hmax) av.push({t:'w',b:'Altura acima da faixa do modelo',\n    x:'A altura livre de '+f(i.pd,2)+' m supera o limite típico de '+f(m.esc.hmax,2)+\n      ' m para '+m.esc.n+'. Verifique o catálogo ou adote torre modular.'});\n  if(!av.length) av.push({t:'g',b:'Malha verificada',x:'Todos os elementos atendem aos critérios de resistência e de flecha adotados.'});\n  $('msgMalha').innerHTML=av.map(function(a){return '<div class=\"msg '+a.t+'\"><b>'+a.b+'<\u002Fb>'+a.x+'<\u002Fdiv>';}).join('');\n\n  /* planta */\n  var W=560,H=420,pad=44;\n  var sc=Math.min((W-2*pad)/i.lx,(H-2*pad)/i.ly);\n  var ox=(W-i.lx*sc)/2, oy=(H-i.ly*sc)/2;\n  var s=rect(ox,oy,i.lx*sc,i.ly*sc,'none',{st:CO.line,sw:1.2});\n  var k,j;\n  for(k=0;k<m.nSomb;k++){ var xs=ox+(m.nSomb>1?k*(i.lx/(m.nSomb-1)):i.lx/2)*sc;\n    s+=ln(xs,oy,xs,oy+i.ly*sc,CO.mut,0.6,'2 3'); }\n  if(m.pLong) for(j=0;j<m.ny;j++){ var yl=oy+j*m.syReal*sc; s+=ln(ox,yl,ox+i.lx*sc,yl,CO.steel,2); }\n  for(k=0;k<m.nx;k++) for(j=0;j<m.ny;j++){\n    s+=circ(ox+k*m.sxReal*sc, oy+j*m.syReal*sc, 4.2, CO.amber,{st:'#8a5c00',sw:.8}); }\n  s+=ln(ox,oy+i.ly*sc+16,ox+m.sxReal*sc,oy+i.ly*sc+16,CO.amber,1.4);\n  s+=txt(ox+m.sxReal*sc/2,oy+i.ly*sc+30,'Sx '+f(m.sxReal,2)+' m',{a:'middle',s:10,c:CO.amber,w:700});\n  s+=ln(ox-16,oy,ox-16,oy+m.syReal*sc,CO.amber,1.4);\n  s+=txt(ox-20,oy+m.syReal*sc/2,'Sy '+f(m.syReal,2),{a:'end',s:10,c:CO.amber,w:700});\n  s+=txt(ox,oy-12,'Painel '+f(i.lx,2)+' × '+f(i.ly,2)+' m — '+m.nTorres+' pontos de apoio',{s:10.5,w:700});\n  $('plantaMalha').innerHTML=svg(W,H,s);\n\n  /* sensibilidade */\n  var W2=560,H2=250,p2=52;\n  var Smin=0.5,Smax=Math.max(3,Math.max(i.sxMax,i.syMax)+0.5);\n  var pts=[],Pmax=0;\n  for(var S=Smin;S<=Smax+1e-9;S+=0.05){ var P=R.cg.qd*S*S; pts.push([S,P]); if(P>Pmax)Pmax=P; }\n  Pmax=Math.max(Pmax,m.Nrd*1.15);\n  function X(v){return p2+(v-Smin)/(Smax-Smin)*(W2-p2-24);}\n  function Y(v){return H2-34-(v/Pmax)*(H2-34-18);}\n  var g2=ln(p2,H2-34,W2-24,H2-34,CO.line,1)+ln(p2,18,p2,H2-34,CO.line,1);\n  for(var t=0;t<=4;t++){ var vv=Pmax*t/4; g2+=ln(p2-4,Y(vv),W2-24,Y(vv),CO.line,t?0.4:1,t?'2 3':null);\n    g2+=txt(p2-7,Y(vv)+3,f(vv,0),{a:'end',s:9}); }\n  for(var sv=Math.ceil(Smin*2)/2; sv<=Smax; sv+=0.5){ g2+=txt(X(sv),H2-20,f(sv,1),{a:'middle',s:9}); }\n  g2+=path(pts.map(function(p){return [X(p[0]),Y(p[1])];}),CO.amber,2);\n  g2+=ln(p2,Y(m.Nrd),W2-24,Y(m.Nrd),CO.bad,1.4,'5 4');\n  g2+=txt(W2-26,Y(m.Nrd)-5,'Nrd = '+f(m.Nrd,1)+' kN',{a:'end',s:9.5,c:CO.bad,w:700});\n  var Slim=Math.sqrt(m.Nrd/R.cg.qd);\n  if(Slim>=Smin&&Slim<=Smax){ g2+=ln(X(Slim),18,X(Slim),H2-34,CO.steel,1,'3 3');\n    g2+=txt(X(Slim)+4,28,'S limite '+f(Slim,2)+' m',{s:9.5,c:CO.steel,w:700}); }\n  g2+=txt(W2/2,H2-6,'Espaçamento uniforme S (m)',{a:'middle',s:10});\n  g2+=txt(12,14,'P (kN)',{s:10});\n  $('chartSens').innerHTML=svg(W2,H2,g2);\n}\n\n/* -------- vista isométrica -------- */\nfunction iso3d(R,alvo,rot,mostraLaje){\n  var g=R.g, m=R.m, W=560,H=430;\n  rot=rot||0;\n  function P(x,y,z){\n    var a=rot*Math.PI/180;\n    var xr=x*Math.cos(a)-y*Math.sin(a), yr=x*Math.sin(a)+y*Math.cos(a);\n    return [(xr-yr)*0.866, (xr+yr)*0.5-z];\n  }\n  var cx=g.Lx/2, cy=g.Ly/2;\n  var cands=[[0,0,g.z0],[g.Lx,0,g.z0],[0,g.Ly,g.z0],[g.Lx,g.Ly,g.z0],\n             [0,0,g.zLaje+g.hLaje],[g.Lx,0,g.zLaje+g.hLaje],[0,g.Ly,g.zLaje+g.hLaje],[g.Lx,g.Ly,g.zLaje+g.hLaje]];\n  var xs=[],ys=[];\n  cands.forEach(function(c){var p=P(c[0]-cx,c[1]-cy,c[2]-g.z0); xs.push(p[0]); ys.push(p[1]);});\n  var minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs);\n  var miny=Math.min.apply(null,ys),maxy=Math.max.apply(null,ys);\n  var sc=Math.min((W-60)/(maxx-minx||1),(H-60)/(maxy-miny||1));\n  var ox=W/2-((minx+maxx)/2)*sc, oy=H/2-((miny+maxy)/2)*sc;\n  function pr(x,y,z){var p=P(x-cx,y-cy,z-g.z0); return [ox+p[0]*sc, oy+p[1]*sc];}\n  var s='';\n  /* piso de referência */\n  var b=[pr(0,0,g.z0),pr(g.Lx,0,g.z0),pr(g.Lx,g.Ly,g.z0),pr(0,g.Ly,g.z0)];\n  s+=poly(b,CO.mut,{op:.10,st:CO.line,sw:.8});\n  /* torres com ordenação por profundidade */\n  var itens=[];\n  m && g.torres.forEach(function(T){\n    var a=pr(T.x,T.y,T.z), c=pr(T.x,T.y,T.z+T.h);\n    itens.push({d:T.x+T.y, s:ln(a[0],a[1],c[0],c[1],CO.amber,m.esc.pernas>1?3.4:2.2)+\n      circ(a[0],a[1],2.2,CO.amber,{op:.6})});\n  });\n  itens.sort(function(x,y){return x.d-y.d;});\n  s+=itens.map(function(x){return x.s;}).join('');\n  /* longarinas */\n  g.longs.forEach(function(L){ var a=pr(L.x0,L.y,L.z+L.h/2), c=pr(L.x0+L.L,L.y,L.z+L.h/2);\n    s+=ln(a[0],a[1],c[0],c[1],CO.steel,3); });\n  /* sombrigas */\n  g.sombs.forEach(function(S){ var a=pr(S.x,S.y0,S.z+S.h/2), c=pr(S.x,S.y0+S.L,S.z+S.h/2);\n    s+=ln(a[0],a[1],c[0],c[1],CO.mut,1.6); });\n  /* laje */\n  if(mostraLaje!==false){\n    var zt=g.zLaje+g.hLaje;\n    var top=[pr(0,0,zt),pr(g.Lx,0,zt),pr(g.Lx,g.Ly,zt),pr(0,g.Ly,zt)];\n    var f1=[pr(0,g.Ly,g.zLaje),pr(g.Lx,g.Ly,g.zLaje),pr(g.Lx,g.Ly,zt),pr(0,g.Ly,zt)];\n    var f2=[pr(g.Lx,0,g.zLaje),pr(g.Lx,g.Ly,g.zLaje),pr(g.Lx,g.Ly,zt),pr(g.Lx,0,zt)];\n    s+=poly(f1,'#9AA5AD',{op:.85,st:'#6d777e',sw:.6});\n    s+=poly(f2,'#8b959c',{op:.85,st:'#6d777e',sw:.6});\n    s+=poly(top,'#C4CCD1',{op:.92,st:'#6d777e',sw:.8});\n  }\n  /* cotas */\n  s+=txt(14,20,'Altura livre '+f(g.Ht,2)+' m · '+g.torres.length+' torres · '+\n    g.longs.length+' longarinas · '+g.sombs.length+' sombrigas',{s:10,w:700});\n  $(alvo).innerHTML=svg(W,H,s);\n}\nfunction render3D(R){\n  iso3d(R,'iso3d',-12,true);\n  iso3d(R,'ifc3d',n($('iRot').value,0),$('iShowLaje').checked);\n}\n\n/* -------- 04 VIGAS -------- */\nfunction blocoViga(v,titulo){\n  var p=v.props;\n  var h=kpi('Vão de cálculo',f(v.L,2),'m — '+v.esq)+\n    kpi('Momento solicitante',f(v.Msd,2),'kN·m — Msd',E.statusFU(v.fuM))+\n    kpi('Momento resistente',f(v.Mrd,2),'kN·m — Mrd')+\n    kpi('Cortante solicitante',f(v.Vsd,2),'kN — Vsd',E.statusFU(v.fuV))+\n    kpi('Cortante resistente',f(v.Vrd,2),'kN — Vrd')+\n    kpi('Flecha',f(v.flecha,2),'mm — limite '+f(v.flechaLim,2)+' mm',E.statusFU(v.fuF))+\n    kpi('Utilização governante',f(v.fu*100,1)+'%',(v.ok?'aprovado':'reprovado'),E.statusFU(v.fu));\n  return h;\n}\nfunction detalheViga(v,carga){\n  var p=v.props, linhas=[\n    ['Elemento',p.nome],\n    ['Carga distribuída de cálculo',f(v.q,2)+' kN/m'],\n    ['Peso próprio incluído',f(v.pp,3)+' kN/m'],\n    ['Momento resistente Mrd',f(v.Mrd,2)+' kN·m'],\n    ['Cortante resistente Vrd',f(v.Vrd,2)+' kN'],\n    ['Rigidez EI',f(p.EI,1)+' kN·m²']\n  ];\n  if(p.tipo==='mad') linhas.push(['fmd / fvd',f(p.fmd,2)+' / '+f(p.fvd,2)+' MPa (kmod '+f(p.kmod,3)+')'],\n    ['Módulo resistente W',f(p.W,1)+' cm³'],['Inércia I',f(p.Ix,0)+' cm⁴']);\n  if(p.tipo==='aco') linhas.push(['Wx / Zx',f(p.W,1)+' / '+f(p.Zx,1)+' cm³'],\n    ['Inércia Ix',f(p.Ix,0)+' cm⁴'],['fy',f(p.fy,0)+' MPa'],\n    ['Regime de FLT',v.flt.regime+(v.flt.Lb!==undefined?' (Lb '+f(v.flt.Lb,2)+' m)':'')]);\n  if(p.tipo==='ind') linhas.push(['Altura',f(p.h*100,0)+' cm'],\n    ['Observação','Resistências de catálogo — confirmar com o fabricante']);\n  var t='<div class=\"tw\"><table><tbody>'+linhas.map(function(l){\n    return '<tr><td>'+l[0]+'<\u002Ftd><td class=\"n\">'+l[1]+'<\u002Ftd><\u002Ftr>';}).join('')+'<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n  t+='<div style=\"margin-top:10px\">'+\n    ['<b>Flexão<\u002Fb> '+f(v.fuM*100,1)+'%'+barra(v.fuM),\n     '<b>Cortante<\u002Fb> '+f(v.fuV*100,1)+'%'+barra(v.fuV),\n     '<b>Flecha<\u002Fb> '+f(v.fuF*100,1)+'%'+barra(v.fuF)].join('')+'<\u002Fdiv>';\n  t+='<div class=\"eq\">Msd = '+f(E.coefs(v.esq==='biapoiada'?'simples':'cont').cM,4)+' · q · L²  →  '+\n     f(v.q,2)+' · '+f(v.L,2)+'² = '+f(v.Msd,2)+' kN·m<\u002Fdiv>';\n  return t;\n}\nfunction renderVigas(R){\n  var m=R.m;\n  $('tagSomb').textContent=m.pSomb.nome;\n  $('kSomb').innerHTML=blocoViga(m.vSomb);\n  $('detSomb').innerHTML=detalheViga(m.vSomb);\n  if(m.vLong){ $('cardLong').style.display='';\n    $('tagLong').textContent=m.pLong.nome;\n    $('kLong').innerHTML=blocoViga(m.vLong);\n    $('detLong').innerHTML=detalheViga(m.vLong);\n  } else { $('cardLong').style.display='none'; }\n\n  /* diagramas da sombriga */\n  var v=m.vSomb, W=520,H=250,p=44,L=v.L;\n  var cont=(v.esq.indexOf('contínua')>=0);\n  var s=txt(p,16,'Momento fletor (kN·m)',{s:10,w:700,c:CO.amber});\n  var ym=90, esc=48/Math.max(v.Msd,1e-6);\n  var ptsM=[];\n  for(var x=0;x<=1.0001;x+=0.02){\n    var Mx = cont ? (v.q*L*L)*( -0.5*x*x + 0.4*x - 0.0333 )*(-1) : v.q*L*L*(x-x*x)/2;\n    ptsM.push([p+x*(W-p-24), ym - Mx*esc*0.9]);\n  }\n  s+=ln(p,ym,W-24,ym,CO.line,1);\n  s+=path(ptsM,CO.amber,1.8);\n  s+=txt(W-26,ym-52,'Msd máx = '+f(v.Msd,2),{a:'end',s:9.5,c:CO.amber,w:700});\n  var yv=195;\n  s+=txt(p,150,'Força cortante (kN)',{s:10,w:700,c:CO.steel});\n  var escV=32/Math.max(v.Vsd,1e-6);\n  s+=ln(p,yv,W-24,yv,CO.line,1);\n  s+=path([[p,yv-v.Vsd*escV],[W-24,yv+v.Vsd*escV]],CO.steel,1.8);\n  s+=txt(W-26,yv+44,'Vsd máx = '+f(v.Vsd,2),{a:'end',s:9.5,c:CO.steel,w:700});\n  s+=txt(p,238,'Vão L = '+f(L,2)+' m — '+v.esq,{s:10});\n  $('diagSomb').innerHTML=svg(W,H,s);\n\n  /* compensado */\n  if(m.comp){\n    var c=m.comp;\n    $('detComp').innerHTML=\n      '<div class=\"kpis\">'+\n      kpi('Espessura',c.esp,'mm')+\n      kpi('Vão adotado',f(c.st,2),'m — St')+\n      kpi('Vão máximo',f(c.stMax,2),'m — limite')+\n      kpi('Utilização',f(c.fu*100,1)+'%',(c.ok?'aprovado':'reprovado'),E.statusFU(c.fu))+\n      '<\u002Fdiv>'+\n      '<div class=\"eq\">Msd = qd·St²/10 = '+f(R.cg.qd,2)+'·'+f(c.st,2)+'²/10 = '+f(c.Msd,3)+' kN·m/m\\n'+\n      'Mrd = fmd·W = '+f(c.Mrd,3)+' kN·m/m\\n'+\n      'Flecha = '+f(c.flecha,2)+' mm  ≤  '+f(c.flechaLim,2)+' mm<\u002Fdiv>'+\n      (c.ok?'<div class=\"msg g\"><b>Chapa verificada<\u002Fb>Espaçamento entre sombrigas compatível com a chapa adotada.<\u002Fdiv>'\n           :'<div class=\"msg e\"><b>Chapa insuficiente<\u002Fb>Reduza St para no máximo '+f(c.stMax,2)+' m ou aumente a espessura.<\u002Fdiv>');\n  } else {\n    $('detComp').innerHTML='<div class=\"msg\"><b>Chapa não verificada<\u002Fb>Selecione uma espessura de compensado na aba Entrada para incluir a verificação.<\u002Fdiv>';\n  }\n}\n\n/* -------- 05 ESCORAS -------- */\nfunction renderEscoras(R){\n  var m=R.m, i=R.i, st=E.statusFU(m.fuTorre);\n  $('kEsc').innerHTML=\n    kpi('Modelo',m.esc.pernas>1?'Torre':'Escora',m.esc.n.split('—')[0])+\n    kpi('Carga de cálculo',f(m.Preal,2),'kN por ponto',st)+\n    kpi('Capacidade Nrd',f(m.Nrd,2),'kN',st)+\n    kpi('Utilização',f(m.fuTorre*100,1)+'%',(m.fuTorre<=1?'aprovado':'reprovado'),st)+\n    kpi('Área de influência',f(m.sxReal*m.syReal,2),'m² por ponto')+\n    kpi('Altura livre',f(i.pd,2),'m');\n  var d='<div style=\"margin-bottom:10px\"><b>Utilização axial<\u002Fb> '+f(m.fuTorre*100,1)+'%'+barra(m.fuTorre)+'<\u002Fdiv>';\n  d+='<div class=\"eq\">P = qd · Sx · Sy = '+f(R.cg.qd,2)+' · '+f(m.sxReal,2)+' · '+f(m.syReal,2)+\n     ' = '+f(R.cg.qd*m.sxReal*m.syReal,2)+' kN<\u002Fdiv>';\n  if(m.flamb){\n    var fl=m.flamb;\n    d+='<div class=\"tw\"><table><thead><tr><th>Grandeza<\u002Fth><th class=\"n\">Valor<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+\n      [['Área da seção tubular',f(fl.A,2)+' cm²'],['Inércia',f(fl.I,2)+' cm⁴'],\n       ['Raio de giração',f(fl.ri,2)+' cm'],['Esbeltez K·L/r',f(fl.esbeltez,0)],\n       ['Carga crítica de Euler Ne',f(fl.Ne,2)+' kN'],['Npl (escoamento)',f(fl.Npl,2)+' kN'],\n       ['Índice de esbeltez reduzido λ₀',f(fl.lam0,3)],['Fator de redução χ',f(fl.chi,3)],\n       ['Nrd por montante',f(fl.NrdPerna,2)+' kN'],['Montantes por ponto',fl.pernas],\n       ['Nrd total do ponto',f(fl.Nrd,2)+' kN']\n      ].map(function(l){return '<tr><td>'+l[0]+'<\u002Ftd><td class=\"n\">'+l[1]+'<\u002Ftd><\u002Ftr>';}).join('')+'<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n    d+='<div class=\"eq\">λ₀ = √(Npl/Ne) = '+f(fl.lam0,3)+'   →   χ = '+\n       (fl.lam0<=1.5?'0,658^λ₀²':'0,877/λ₀²')+' = '+f(fl.chi,3)+'\\nNrd = χ · Npl / γa1 = '+f(fl.NrdPerna,2)+' kN por montante<\u002Fdiv>';\n  } else {\n    d+='<div class=\"msg\"><b>Capacidade declarada<\u002Fb>Adotado Nrd = '+f(m.Nrd,1)+\n       ' kN informado pelo usuário. Ative a verificação por flambagem para calcular a partir da seção tubular.<\u002Fdiv>';\n  }\n  $('detEsc').innerHTML=d;\n\n  var e=R.est;\n  $('detEstab').innerHTML=\n    '<div class=\"kpis\">'+\n    kpi('Ação horizontal total',f(e.Fh,2),'kN — '+f(i.fhPct,1)+'% de Qk')+\n    kpi('Por linha de contraventamento',f(e.FhLinha,2),'kN — '+e.linhas+' linhas')+\n    kpi('Esforço na diagonal',f(e.Fdiag,2),'kN — θ '+f(e.theta,0)+'°')+\n    kpi('Fator ao tombamento',f(e.fsTomb,2),(e.fsTomb>=1.5?'adequado':'insuficiente'),(e.fsTomb>=1.5?'ok':'bad'))+\n    '<\u002Fdiv>'+\n    '<div class=\"msg '+(e.fsTomb>=1.5?'g':'e')+'\"><b>Contraventamento<\u002Fb>'+\n    'Prever diagonais em ambas as direções capazes de absorver '+f(e.Fdiag,2)+\n    ' kN por linha. Travar as torres nos dois sentidos a cada 2 módulos de altura e amarrar o conjunto '+\n    'a elementos estruturais já concretados sempre que possível.<\u002Fdiv>'+\n    '<div class=\"hint\">Desaprumo de referência para montagem: '+f(e.desaprumo,1)+' mm no topo (H/500).<\u002Fdiv>';\n\n  var a=R.ap;\n  $('detApoio').innerHTML=\n    '<div class=\"kpis\">'+\n    kpi('Carga na base',f(a.P,2),'kN por ponto')+\n    kpi('Peso do escoramento',f(a.pesoEsc,1),'kN no painel')+\n    kpi('Carga na laje inferior',f(a.qLajeInferior,2),'kN/m²')+\n    kpi('Prancha sugerida',f(a.larguraSugerida,2)+' m','lado, para solo de '+a.tensaoSoloRef+' kPa')+\n    '<\u002Fdiv>'+\n    '<div class=\"msg w\"><b>Verifique a estrutura de apoio<\u002Fb>'+\n    'A laje ou o terreno abaixo recebe '+f(a.qLajeInferior,2)+' kN/m² distribuídos e '+f(a.P,2)+\n    ' kN concentrados por ponto. Quando o apoio for laje jovem, mantenha o reescoramento alinhado '+\n    'verticalmente com as torres do pavimento superior.<\u002Fdiv>';\n\n  /* curva de capacidade × altura */\n  var W=560,H=250,p=52;\n  var D=i.calcFlamb?i.Dt:m.esc.D, T=i.calcFlamb?i.Tt:m.esc.t, fy=i.calcFlamb?i.fyT:250;\n  var pts=[],Nmax=0,Lmin=1.0,Lmax=Math.max(6,i.pd+2);\n  for(var LL=Lmin;LL<=Lmax+1e-9;LL+=0.1){\n    var fl2=E.flambagem(D,T,fy,i.K,LL,m.esc.pernas);\n    pts.push([LL,fl2.Nrd]); if(fl2.Nrd>Nmax)Nmax=fl2.Nrd;\n  }\n  Nmax=Math.max(Nmax,m.Preal*1.2);\n  function X(v){return p+(v-Lmin)/(Lmax-Lmin)*(W-p-24);}\n  function Y(v){return H-34-(v/Nmax)*(H-34-18);}\n  var g=ln(p,H-34,W-24,H-34,CO.line,1)+ln(p,18,p,H-34,CO.line,1);\n  for(var t2=0;t2<=4;t2++){var vv=Nmax*t2/4; g+=ln(p,Y(vv),W-24,Y(vv),CO.line,t2?.4:1,t2?'2 3':null);\n    g+=txt(p-7,Y(vv)+3,f(vv,0),{a:'end',s:9});}\n  for(var lv=Math.ceil(Lmin);lv<=Lmax;lv++) g+=txt(X(lv),H-20,lv+' m',{a:'middle',s:9});\n  g+=path(pts.map(function(q){return [X(q[0]),Y(q[1])];}),CO.steel,2);\n  g+=ln(p,Y(m.Preal),W-24,Y(m.Preal),CO.amber,1.4,'5 4');\n  g+=txt(W-26,Y(m.Preal)-5,'Carga atuante '+f(m.Preal,1)+' kN',{a:'end',s:9.5,c:CO.amber,w:700});\n  g+=ln(X(i.pd),18,X(i.pd),H-34,CO.bad,1.2,'3 3');\n  g+=txt(X(i.pd)+4,30,'Altura de projeto '+f(i.pd,2)+' m',{s:9.5,c:CO.bad,w:700});\n  g+=txt(W/2,H-6,'Altura livre de escoramento (m)',{a:'middle',s:10});\n  g+=txt(12,14,'Nrd (kN)',{s:10});\n  $('chartFlamb').innerHTML=svg(W,H,g);\n}\n\n/* -------- 06 DESFORMA -------- */\nfunction renderDesforma(R){\n  var d=R.df;\n  var okPrazo=isFinite(d.tAdot);\n  $('kDesf').innerHTML=\n    kpi('Prazo de desforma',okPrazo?f(d.tAdot,1):'—','dias após a concretagem','hi')+\n    kpi('fcj necessária',f(d.fcjReq,1),'MPa — κ = '+f(d.kappa,2))+\n    kpi('fcj no prazo adotado',f(d.betaNaDesforma*d.fck,1),'MPa')+\n    kpi('Fator de maturidade',f(d.kT,3),'a '+f(d.T,0)+' °C')+\n    kpi('Idade equivalente exigida',isFinite(d.teReq)?f(d.teReq,1):'—','dias a 20 °C')+\n    kpi('Eci aos 28 dias',f(d.Eci28,0),'MPa');\n  var msgs=[];\n  if(!isFinite(d.tReq)) msgs.push({t:'e',b:'Alvo inatingível',\n    x:'O valor de κ escolhido supera o limite assintótico do modelo para este tipo de cimento. Reduza κ ou reveja o fck especificado.'});\n  else msgs.push({t:'g',b:'Liberação prevista',\n    x:'Resistência de '+f(d.fcjReq,1)+' MPa alcançada aos '+f(d.tReq,1)+' dias de idade real a '+f(d.T,0)+\n      ' °C.'+(d.usaMin && d.prazoNorma>d.tReq? ' O prazo adotado de '+f(d.tAdot,0)+\n      ' dias decorre do prazo mínimo indicativo da NBR 14931 para a etapa selecionada.':'')});\n  if(d.usaCP) msgs.push({t:'w',b:'Controle por corpos de prova',\n    x:'Com controle por CPs moldados e curados junto à peça (NBR 5738/5739), os prazos mínimos podem ser antecipados mediante ensaio que comprove a resistência exigida. Registre os resultados no diário de obra.'});\n  if(d.T<15) msgs.push({t:'w',b:'Cura em temperatura baixa',\n    x:'A '+f(d.T,0)+' °C o ganho de resistência é significativamente mais lento. Considere proteção térmica e reavalie o cronograma.'});\n  if(d.dataDesf) msgs.push({t:'',b:'Data prevista',\n    x:'Concretagem em '+d.dataConc.toLocaleDateString('pt-BR')+' → liberação a partir de '+\n      d.dataDesf.toLocaleDateString('pt-BR')+'.'});\n  msgs.push({t:'w',b:'Reescoramento',\n    x:'Manter reescoramento em '+d.reesc+' pavimento(s) abaixo, alinhado verticalmente e com pré-carga apenas de contato, sem forçar a peça.'});\n  $('msgDesf').innerHTML=msgs.map(function(a){return '<div class=\"msg '+a.t+'\"><b>'+a.b+'<\u002Fb>'+a.x+'<\u002Fdiv>';}).join('');\n\n  /* gráfico */\n  var W=560,H=280,p=48;\n  var tmax=Math.min(28,Math.max(14,(isFinite(d.tAdot)?d.tAdot:14)*1.6));\n  function X(v){return p+v/tmax*(W-p-26);}\n  function Y(v){return H-38-v*(H-38-18);}\n  var g=ln(p,H-38,W-26,H-38,CO.line,1)+ln(p,18,p,H-38,CO.line,1);\n  for(var t=0;t<=5;t++){var vv=t/5; g+=ln(p,Y(vv),W-26,Y(vv),CO.line,t?.4:1,t?'2 3':null);\n    g+=txt(p-7,Y(vv)+3,f(vv*100,0)+'%',{a:'end',s:9});}\n  var step=tmax<=14?2:4;\n  for(var dd=0;dd<=tmax;dd+=step) g+=txt(X(dd),H-22,dd+'d',{a:'middle',s:9});\n  var cB=[],cE=[];\n  d.curva.forEach(function(c){ if(c.t<=tmax){cB.push([X(c.t),Y(Math.min(1.2,c.beta))]); cE.push([X(c.t),Y(Math.min(1.2,c.razaoE))]);} });\n  g+=path(cE,CO.steel,1.6);\n  g+=path(cB,CO.amber,2.2);\n  g+=ln(p,Y(d.kappa),W-26,Y(d.kappa),CO.bad,1.3,'5 4');\n  g+=txt(W-28,Y(d.kappa)-5,'κ = '+f(d.kappa,2),{a:'end',s:9.5,c:CO.bad,w:700});\n  if(isFinite(d.tAdot)&&d.tAdot<=tmax){\n    g+=ln(X(d.tAdot),18,X(d.tAdot),H-38,CO.ok,1.4,'3 3');\n    g+=circ(X(d.tAdot),Y(Math.min(1,d.betaNaDesforma)),4,CO.ok);\n    g+=txt(X(d.tAdot)+5,32,'Desforma '+f(d.tAdot,1)+' d',{s:9.5,c:CO.ok,w:700});\n  }\n  g+=txt(W/2,H-6,'Idade real (dias) a '+f(d.T,0)+' °C',{a:'middle',s:10});\n  $('chartFcj').innerHTML=svg(W,H,g);\n\n  $('tbFcj').innerHTML='<thead><tr><th>Idade real<\u002Fth><th class=\"n\">Idade equiv.<\u002Fth><th class=\"n\">βcc<\u002Fth>'+\n    '<th class=\"n\">fcj<\u002Fth><th class=\"n\">Eci(t)<\u002Fth><th>Alvo<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+\n    d.linhas.map(function(l){\n      return '<tr><td class=\"n\">'+f(l.t,1)+' d<\u002Ftd><td class=\"n\">'+f(l.te,1)+' d<\u002Ftd><td class=\"n\">'+\n        f(l.beta,3)+'<\u002Ftd><td class=\"n\">'+f(l.fcj,1)+' MPa<\u002Ftd><td class=\"n\">'+f(l.Eci,0)+' MPa<\u002Ftd><td>'+\n        (l.atinge?'<span class=\"sel ok\">atinge<\u002Fspan>':'<span class=\"sel warn\">abaixo<\u002Fspan>')+'<\u002Ftd><\u002Ftr>';\n    }).join('')+'<\u002Ftbody>';\n\n  $('tbCrono').innerHTML='<thead><tr><th> a livre de escoramento',f(i.pd,2)+' m'],\n     ['Carga de cálculo qd',f(cg.qd,2)+' kN/m²'],\n     ['Malha de torres',f(m.sxReal,2)+' × '+f(m.syReal,2)+' m — '+m.nTorres+' pontos'],\n     ['Escora / torre',m.esc.n],\n     ['Carga por ponto',f(m.Preal,2)+' kN de '+f(m.Nrd,1)+' kN ('+f(m.fuTorre*100,0)+'%)'],\n     ['Sombrigas',m.pSomb.nome+' a cada '+f(m.st,2)+' m'],\n     ['Longarinas',m.pLong? m.pLong.nome+' a cada '+f(m.syReal,2)+' m' : 'não utilizadas'],\n     ['Chapa de fôrma',m.comp? m.comp.esp+' mm' : 'não verificada'],\n     ['Concreto',('C'+f(d.fck,0))+' — cura a '+f(d.T,0)+' °C'],\n     ['Prazo de desforma',(isFinite(d.tAdot)?f(d.tAdot,1)+' dias':'—')+' — '+(E.CRIT_NOME[d.criterio]||'')],\n     ['Data prevista de liberação',d.dataDesf? d.dataDesf.toLocaleDateString('pt-BR') : 'informe a data de concretagem']\n    ].map(function(l){return '<tr><td>'+l[0]+'<\u002Ftd><td class=\"n\">'+l[1]+'<\u002Ftd><\u002Ftr>';}).join('')+'<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n\n  $('tbVerif').innerHTML='<thead><tr><th>Verificação<\u002Fth><th class=\"n\">Solicitante<\u002Fth><th class=\"n\">Resistente<\u002Fth>'+\n    '<th class=\"n\">Utilização<\u002Fth><th>Situação<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+\n    R.verif.map(function(v){\n      return '<tr><td>'+v.item+'<\u002Ftd><td class=\"n\">'+f(v.sol,2)+' '+v.un+'<\u002Ftd><td class=\"n\">'+\n        f(v.res,2)+' '+v.un+'<\u002Ftd><td class=\"n\">'+f(v.fu*100,1)+'%<\u002Ftd><td>'+sel(v.ok)+'<\u002Ftd><\u002Ftr>';\n    }).join('')+'<\u002Ftbody>';\n\n  var q=[\n    ['Torres / escoras','un',m.nTorres],\n    ['Montantes tubulares','un',m.nTorres*(m.esc.pernas||1)],\n    ['Cabeçotes / forcados','un',m.nTorres],\n    ['Longarinas — comprimento total','m',m.compLong],\n    ['Sombrigas — quantidade','un',m.nSomb],\n    ['Sombrigas — comprimento total','m',m.compSomb],\n    ['Chapa de compensado','m²',cg.area],\n    ['Concreto da laje','m³',cg.volConc],\n    ['Área de fôrma','m²',cg.area]\n  ];\n  $('tbQuant').innerHTML='<thead><tr><th>Item<\u002Fth><th>Unidade<\u002Fth><th class=\"n\">Quantidade<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+\n    q.map(function(l){return '<tr><td>'+l[0]+'<\u002Ftd><td>'+l[1]+'<\u002Ftd><td class=\"n\">'+f(l[2],2)+'<\u002Ftd><\u002Ftr>';}).join('')+\n    '<\u002Ftbody>';\n\n  var rec=[];\n  rec.push('Montar a malha em '+f(m.sxReal,2)+' × '+f(m.syReal,2)+' m, iniciando pelo alinhamento das torres com a estrutura de apoio inferior.');\n  rec.push('Distribuir as sombrigas a cada '+f(m.st,2)+' m, com apoio mínimo de 5 cm sobre as longarinas e travamento das extremidades.');\n  if(m.pLong) rec.push('Posicionar as longarinas sobre os cabeçotes, garantindo excentricidade nula em relação ao eixo da torre.');\n  rec.push('Contraventar nas duas direções com diagonais dimensionadas para '+f(R.est.Fdiag,2)+' kN por linha.');\n  rec.push('Nivelar as bases com pranchas de ao menos '+f(R.ap.larguraSugerida,2)+' m de lado quando o apoio for o terreno.');\n  rec.push('Manter a sobrecarga de lançamento limitada a '+f(cg.q1,2)+' kN/m², evitando acúmulo de concreto em um único ponto.');\n  rec.push('Liberar a desforma somente após '+(isFinite(d.tAdot)?f(d.tAdot,0):'—')+' dias, mantendo reescoramento em '+d.reesc+' pavimento(s).');\n  if(m.fuTorre>0.85) rec.push('Reforçar a inspeção das torres mais carregadas: a utilização de '+f(m.fuTorre*100,0)+'% deixa pouca margem para desvios.');\n  $('relRec').innerHTML='<ul>'+rec.map(function(x){return '<li>'+x+'<\u002Fli>';}).join('')+'<\u002Ful>';\n\n  var chk=['Projeto de escoramento assinado por responsável técnico habilitado',\n    'Conferência do prumo das torres (desvio máximo '+f(R.est.desaprumo,0)+' mm no topo)',\n    'Travamento horizontal executado nas duas direções',\n    'Cabeçotes e bases regulados, sem folga e sem rosca exposta além do permitido',\n    'Apoio inferior nivelado e com capacidade verificada',\n    'Chapas de fôrma limpas, desmoldadas e com juntas vedadas',\n    'Caminho de circulação e guarda-corpo definidos para a equipe de lançamento',\n    'Corpos de prova moldados e mantidos junto à peça para controle da desforma',\n    'Plano de concretagem com sequência de lançamento definida'];\n  $('relCheck').innerHTML='<ul>'+chk.map(function(x){return '<li>'+x+'<\u002Fli>';}).join('')+'<\u002Ful>';\n}\n\n/* -------- 08 IFC -------- */\nfunction opcoesIfc(){\n  return {torres:$('iIfcTorres').checked, longarinas:$('iIfcLong').checked,\n    sombrigas:$('iIfcSomb').checked, laje:$('iIfcLaje').checked,\n    cabecotes:$('iIfcCabec').checked, pset:$('iIfcPset').checked,\n    nomeProj:$('iIfcNome').value, nomeArq:'escoramento'};\n}\nfunction gerarIfcAtual(){\n  if(!EST) calcular();\n  if(!EST) return null;\n  var i=EST.i;\n  i.ifcX0=n($('iIfcX0').value,0); i.ifcY0=n($('iIfcY0').value,0); i.ifcZ0=n($('iIfcZ0').value,0);\n  var g=E.geometria(i,EST.cg,EST.m,i.ifcZ0);\n  EST.g=g;\n  var o=opcoesIfc(); o.i=i; o.cg=EST.cg; o.m=EST.m; o.g=g; o.df=EST.df;\n  return E.gerarIFC(o);\n}\nfunction renderIfcResumo(R){\n  var g=R.g, m=R.m;\n  var nTubos=m.nTorres*(m.esc.pernas||1);\n  $('ifcResumo').innerHTML=\n    '<div class=\"kpis\">'+\n    kpi('Colunas (torres)',nTubos,'IfcColumn · .POST.')+\n    kpi('Vigas',(m.pLong?m.ny:0)+m.nSomb,'IfcBeam · .BEAM. / .JOIST.')+\n    kpi('Acessórios',m.nTorres,'IfcDiscreteAccessory')+\n    kpi('Laje',1,'IfcSlab · .FLOOR.')+\n    '<\u002Fdiv>'+\n    '<div class=\"tw\" style=\"margin-top:12px\"><table><thead><tr><th>Nível<\u002Fth><th class=\"n\">Cota (m)<\u002Fth><th>Conteúdo<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+\n    [['Base do escoramento',g.z0,'Pés reguláveis / pranchas de distribuição'],\n     ['Topo das torres',g.zTopoTorre,'Cabeçotes e forcados'],\n     ['Face inferior das sombrigas',g.zSomb,'Apoio sobre longarinas'],\n     ['Face da fôrma',g.zForma,'Chapa de compensado'],\n     ['Face inferior da laje',g.zLaje,'Concreto'],\n     ['Face superior da laje',g.zLaje+g.hLaje,'Cota de arrasamento']\n    ].map(function(l){return '<tr><td>'+l[0]+'<\u002Ftd><td class=\"n\">'+f(l[1],3)+'<\u002Ftd><td>'+l[2]+'<\u002Ftd><\u002Ftr>';}).join('')+\n    '<\u002Ftbody><\u002Ftable><\u002Fdiv>'+\n    '<div class=\"hint\">Arquivo IFC4 no formato STEP, com estrutura espacial IfcProject → IfcSite → IfcBuilding → IfcBuildingStorey '+\n    'e conjunto de propriedades Pset_CimbrePro_Escoramento anexado aos elementos.<\u002Fdiv>';\n}\n\n/* -------- 10 AUTOTESTE -------- */\nfunction autoteste(){\n  var out=[], pass=0, fail=0;\n  function ok(nome,cond,det){ if(cond){pass++; out.push('<span class=\"p\">PASSA<\u002Fspan>  '+nome);}\n    else {fail++; out.push('<span class=\"f\">FALHA<\u002Fspan>  '+nome+(det?'  → '+det:''));} }\n  function prox(a,b,tol,nome){ ok(nome, Math.abs(a-b)<=tol, 'obtido '+r(a,4)+', esperado '+r(b,4)); }\n\n  var i0={h:.20,gc:25,pf:.5,q:1.5,phi:1.1,gg:1.4,gq:1.4,psi:1,lx:8,ly:6,tipoLaje:'macica',fhPct:1.5};\n  var c=E.calcCargas(i0);\n  prox(c.g1,5.0,1e-9,'Peso do concreto fresco para h = 0,20 m');\n  prox(c.g1d,5.5,1e-9,'Impacto de lançamento φ = 1,10');\n  prox(c.qd,1.4*(5.5+0.5)+1.4*1.5,1e-9,'Carga de cálculo qd');\n  prox(c.qk,7.0,1e-9,'Carga característica qk');\n  prox(c.area,48,1e-9,'Área do painel');\n  prox(c.Qd,c.qd*48,1e-6,'Carga total de cálculo');\n  ok('Laje nervurada reduz a espessura efetiva',\n     E.calcCargas(Object.assign({},i0,{tipoLaje:'nervurada',redNerv:40})).g1 < c.g1);\n  ok('Bomba lança acresce 0,5 kN/m² à sobrecarga',\n     Math.abs(E.calcCargas(Object.assign({},i0,{bomba:true})).q1-2.0)<1e-9);\n\n  var km=0.8*0.8*0.8;\n  var pm=E.propsViga('D60','6x12',km);\n  prox(pm.W,6*144/6,1e-9,'Módulo resistente da seção 6×12 cm');\n  prox(pm.Ix,6*Math.pow(12,3)/12,1e-9,'Inércia da seção 6×12 cm');\n  prox(pm.fmd,km*60/1.4,1e-9,'fmd da madeira D60');\n  prox(pm.fvd,km*4.5/1.8,1e-9,'fvd da madeira D60');\n  ok('Mrd da madeira é positivo e coerente', pm.Mrd>0 && pm.Mrd<50);\n  ok('EI da madeira compatível com a seção', pm.EI>50 && pm.EI<400);\n\n  var pa=E.propsViga('aco','W200x22.5',km);\n  prox(pa.EI,200000*2029*1e-5,1e-6,'EI do perfil W200x22.5');\n  ok('Mrd do perfil limitado por Zx ou 1,5·Wx',\n     Math.abs(pa.Mrd-Math.min(225.5,1.5*197)*250/1000/1.1)<1e-6);\n  ok('Vrd do perfil na faixa esperada', pa.Vrd>100 && pa.Vrd<250);\n\n  var pi=E.propsViga('ind','H20',km);\n  ok('Viga H20 usa valores de catálogo', pi.Mrd===5.0 && pi.Vrd===11.0 && pi.EI===460);\n\n  var cS=E.coefs('simples'), cC=E.coefs('cont');\n  prox(cS.cM,0.125,1e-9,'Coeficiente de momento biapoiada');\n  prox(cC.cM,0.1,1e-9,'Coeficiente de momento contínua');\n  ok('Viga contínua tem menor coeficiente de flecha', cC.cD<cS.cD);\n\n  var v1=E.verificaViga({props:pi,vao:2.0,qd:10,qser:7,esq:'simples',limFl:400,flAbs:5,gg:1.4});\n  prox(v1.Msd,(10+1.4*0.05)*4/8,1e-6,'Msd de viga biapoiada com peso próprio');\n  ok('Flecha calculada positiva', v1.flecha>0);\n  ok('Utilização governante é o maior dos três índices',\n     Math.abs(v1.fu-Math.max(v1.fuM,v1.fuV,v1.fuF))<1e-12);\n  var v2=E.verificaViga({props:pi,vao:2.0,qd:10,qser:7,esq:'cont',limFl:400,flAbs:5,gg:1.4});\n  ok('Esquema contínuo reduz o momento', v2.Msd<v1.Msd);\n  ok('Esquema contínuo reduz a flecha', v2.flecha<v1.flecha);\n  var v3=E.verificaViga({props:pi,vao:4.0,qd:10,qser:7,esq:'simples',limFl:400,flAbs:5,gg:1.4});\n  ok('Dobrar o vão multiplica o momento por ~4', Math.abs(v3.Msd/v1.Msd-4)<0.05);\n  ok('Vão maior aumenta a flecha', v3.flecha>v1.flecha);\n  ok('Vão de 4 m reprova a viga H20 com 10 kN/m', !v3.ok);\n  var v4=E.verificaViga({props:pi,vao:2.0,qd:10,qser:7,esq:'simples',limFl:400,flAbs:5,gg:1.4});\n  var v5=E.verificaViga({props:pi,vao:2.0,qd:10,qser:7,esq:'simples',limFl:300,flAbs:50,gg:1.4});\n  ok('Limite de flecha mais tolerante reduz a utilização por flecha', v5.fuF<v4.fuF);\n\n  var tb=E.tuboProps(48.3,3.0);\n  prox(tb.A,Math.PI/4*(4.83*4.83-4.23*4.23),1e-9,'Área do tubo 48,3×3,0');\n  ok('Raio de giração do tubo entre 1,5 e 2,0 cm', tb.ri>1.5 && tb.ri<2.0);\n  var fl=E.flambagem(48.3,3.0,250,1.0,3.0,1);\n  ok('Nrd do tubo 48,3×3,0 com 3 m entre 12 e 30 kN', fl.Nrd>12 && fl.Nrd<30, 'Nrd='+r(fl.Nrd,2));\n  ok('Índice de esbeltez reduzido maior que 1,5 para 3 m', fl.lam0>1.5);\n  var fl2=E.flambagem(48.3,3.0,250,1.0,2.0,1);\n  ok('Reduzir a altura aumenta a capacidade', fl2.Nrd>fl.Nrd);\n  var fl4=E.flambagem(48.3,3.0,250,1.0,3.0,4);\n  prox(fl4.Nrd,fl.Nrd*4,1e-6,'Torre de 4 montantes multiplica a capacidade');\n  ok('Fator χ sempre menor ou igual a 1', fl.chi<=1 && fl2.chi<=1);\n\n  var kT20=E.fatorMaturidade(20,'arr');\n  prox(kT20,1,1e-9,'Fator de maturidade unitário a 20 °C');\n  ok('Temperatura maior acelera a maturidade', E.fatorMaturidade(35,'arr')>1);\n  ok('Temperatura menor retarda a maturidade', E.fatorMaturidade(10,'arr')<1);\n  prox(E.fatorMaturidade(20,'ns'),1,1e-9,'Nurse-Saul unitário a 20 °C');\n  prox(E.fatorMaturidade(30,'ns'),40/30,1e-9,'Nurse-Saul a 30 °C');\n  prox(E.fatorMaturidade(25,'none'),1,1e-9,'Sem correção de temperatura');\n  prox(E.betaCC(28,0.25),1,1e-9,'βcc igual a 1 aos 28 dias');\n  ok('βcc cresce com o tempo', E.betaCC(7,0.25)<E.betaCC(14,0.25));\n  ok('CP III é mais lento que CP V nas primeiras idades', E.betaCC(3,0.38)<E.betaCC(3,0.20));\n  ok('βcc aos 3 dias com s=0,25 entre 0,55 e 0,70',\n     E.betaCC(3,0.25)>0.55 && E.betaCC(3,0.25)<0.70, 'β='+r(E.betaCC(3,0.25),4));\n  var tInv=E.idadeParaBeta(0.7,0.25);\n  prox(E.betaCC(tInv,0.25),0.7,1e-6,'Inversão de βcc é consistente');\n  ok('Alvo acima do limite assintótico devolve infinito', !isFinite(E.idadeParaBeta(1.3,0.25)));\n  prox(E.idadeParaBeta(1.0,0.25),28,1e-6,'β igual a 1 corresponde a 28 dias');\n\n  var iD={fck:30,s:0.25,temp:20,matModo:'arr',alfaE:1,kappa:0.7,criterio:'total',prazoMin:false,reesc:2};\n  var d1=E.desforma(iD,c,{});\n  prox(d1.tReq,E.idadeParaBeta(0.7,0.25),1e-6,'Prazo calculado sem correção de temperatura');\n  prox(d1.Eci28,1.0*5600*Math.sqrt(30),1e-6,'Eci aos 28 dias');\n  var d2=E.desforma(Object.assign({},iD,{temp:35}),c,{});\n  ok('Cura a 35 °C antecipa a desforma', d2.tReq<d1.tReq);\n  var d3=E.desforma(Object.assign({},iD,{temp:10}),c,{});\n  ok('Cura a 10 °C atrasa a desforma', d3.tReq>d1.tReq);\n  var d4=E.desforma(Object.assign({},iD,{prazoMin:true}),c,{});\n  ok('Prazo mínimo da norma prevalece quando maior', d4.tAdot>=21-1e-9);\n  var d5=E.desforma(Object.assign({},iD,{prazoMin:true,usaCP:true}),c,{});\n  ok('Controle por corpos de prova dispensa o prazo mínimo', d5.tAdot<d4.tAdot);\n  ok('Cronograma cobre as quatro etapas', d1.crono.length===4);\n  ok('Cronograma é monotônico nas exigências',\n     d1.crono[0].kappa<d1.crono[1].kappa && d1.crono[1].kappa<d1.crono[2].kappa);\n  prox(d1.fcjReq,21,1e-9,'fcj exigida para κ = 0,70 e fck = 30 MPa');\n  ok('Módulo de elasticidade evolui com a raiz de βcc',\n     Math.abs(d1.linhas[0].razaoE-Math.sqrt(d1.linhas[0].beta))<1e-12);\n\n  var iM={h:.20,gc:25,pf:.5,q:1.5,phi:1.1,gg:1.4,gq:1.4,psi:1,lx:8,ly:6,tipoLaje:'macica',\n    sombFam:'ind',sombSec:'H20',sombEsq:'cont',stMax:0.6,usaLong:true,longFam:'aco',\n    longSec:'W200x22.5',longEsq:'cont',escoraId:'TOR-L',Nrd:80,pd:2.9,K:1,\n    sxMax:2.0,syMax:2.0,otimizar:true,comp:18,limFl:400,flAbs:5,km1:.8,km2:.8,km3:.8,\n    travada:true,fhPct:1.5};\n  var cM=E.calcCargas(iM), mM=E.resolveMalha(iM,cM);\n  ok('Malha resolvida sem erro', !mM.erro);\n  ok('Malha otimizada aprovada', mM.ok===true);\n  ok('Espaçamentos dentro dos limites informados', mM.sx<=2.0+1e-9 && mM.sy<=2.0+1e-9);\n  ok('Carga por ponto não excede a capacidade', mM.Preal<=mM.Nrd+1e-6, 'P='+r(mM.Preal,2));\n  ok('Número de torres coerente com a geometria', mM.nTorres===mM.nx*mM.ny && mM.nTorres>0);\n  ok('Espaçamento real recalculado a partir do número de vãos',\n     Math.abs(mM.sxReal*(mM.nx-1)-iM.lx)<1e-6 && Math.abs(mM.syReal*(mM.ny-1)-iM.ly)<1e-6);\n  ok('Taxa de ocupação na faixa usual de canteiro', mM.taxaOcup>1 && mM.taxaOcup<10,\n     'taxa='+r(mM.taxaOcup,2)+'%');\n  ok('Taxa de ocupação medida pelas placas de base',\n     Math.abs(mM.areaOcup - mM.nTorres*(mM.esc.pernas||1)*0.0225)<1e-9);\n  ok('Projeção em planta maior que a área das placas', mM.taxaProjecao>mM.taxaOcup);\n  ok('Painel de área nula não gera divisão inválida',\n     isFinite(E.resolveMalha(Object.assign({},iM,{lx:0,ly:0}),E.calcCargas(Object.assign({},iM,{lx:0,ly:0}))).taxaOcup));\n  var mLim=E.resolveMalha(Object.assign({},iM,{Nrd:12,escoraId:'PERS',otimizar:true}),cM);\n  ok('Capacidade menor reduz o espaçamento adotado', mLim.sx*mLim.sy<=mM.sx*mM.sy+1e-9);\n  var mSem=E.resolveMalha(Object.assign({},iM,{usaLong:false}),cM);\n  ok('Sistema sem longarina usa Sx como vão da sombriga', mSem.vLong===null);\n  var mPes=E.resolveMalha(Object.assign({},iM,{h:0.60}),E.calcCargas(Object.assign({},iM,{h:0.60})));\n  ok('Laje mais espessa exige malha mais fechada', mPes.sx*mPes.sy<=mM.sx*mM.sy+1e-9);\n\n  var cp=E.verificaCompensado(18,cM,iM,0.6);\n  ok('Compensado de 18 mm tem vão máximo entre 0,2 e 1,2 m', cp.stMax>0.2 && cp.stMax<=1.2, 'stMax='+r(cp.stMax,3));\n  ok('Compensado aprovado no vão adotado', cp.ok);\n  var cp12=E.verificaCompensado(12,cM,iM,0.6);\n  ok('Chapa mais fina admite vão menor', cp12.stMax<=cp.stMax);\n\n  var est=E.estabilidade(iM,cM,mM);\n  prox(est.Fh,cM.Qk*0.015,1e-9,'Ação horizontal igual a 1,5% de Qk');\n  ok('Esforço na diagonal maior que a força horizontal por linha', est.Fdiag>est.FhLinha);\n  var ap=E.apoioInferior(iM,cM,mM);\n  ok('Carga na laje inferior maior que a característica', ap.qLajeInferior>cM.qk);\n\n  var gg=E.geometria(iM,cM,mM,0);\n  ok('Cotas do modelo em ordem crescente',\n     gg.z0<gg.zTopoTorre && gg.zTopoTorre<=gg.zSomb && gg.zSomb<gg.zForma && gg.zForma<=gg.zLaje);\n  ok('Quantidade de torres na geometria confere', gg.torres.length===mM.nTorres);\n  ok('Uma longarina por linha de torres em Y', gg.longs.length===mM.ny);\n  ok('Sombrigas geradas conforme o espaçamento St', gg.sombs.length===mM.nSomb);\n\n  var seed=12345;\n  function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7ff rramenta de apoio ao projeto. Capacidades de escoras, torres e vigas devem ser confirmadas');\n  L.push('nos catálogos dos fabricantes. Projeto de escoramento exige responsável técnico habilitado.');\n  return L.join('\\n');\n}\nfunction csvRel(R){\n  var l=[['Grandeza','Valor','Unidade']];\n  l.push(['Obra',R.i.obra,'']); l.push(['Peça',R.i.peca,'']);\n  l.push(['Área do painel',r(R.cg.area,2),'m2']);\n  l.push(['qd',r(R.cg.qd,3),'kN/m2']); l.push(['qk',r(R.cg.qk,3),'kN/m2']);\n  l.push(['Sx',r(R.m.sxReal,3),'m']); l.push(['Sy',r(R.m.syReal,3),'m']);\n  l.push(['St',r(R.m.st,3),'m']); l.push(['Torres',R.m.nTorres,'un']);\n  l.push(['Carga por ponto',r(R.m.Preal,3),'kN']); l.push(['Nrd',r(R.m.Nrd,3),'kN']);\n  l.push(['Prazo de desforma',isFinite(R.df.tAdot)?r(R.df.tAdot,2):'',\n    'dias']);\n  l.push([]); l.push(['Verificação','Solicitante','Resistente','Unidade','Utilização (%)','Situação']);\n  R.verif.forEach(function(v){ l.push([v.item,r(v.sol,3),r(v.res,3),v.un,r(v.fu*100,1),v.ok?'Aprovado':'Reprovado']); });\n  return '\\ufeff'+l.map(function(row){return row.map(function(x){\n    return '\"'+String(x==null?'':x).replace(/\"/g,'\"\"')+'\"';}).join(';');}).join('\\n');\n}\n\n/* -------- referências e formulário -------- */\nfunction renderNormas(){\n  var refs=[\n    ['ABNT NBR 15696','Fôrmas e escoramentos para estruturas de concreto — projeto, dimensionamento e procedimentos executivos. Base das cargas de serviço e das ações horizontais mínimas.'],\n    ['ABNT NBR 14931','Execução de estruturas de concreto. Prazos indicativos e condições para retirada de fôrmas e escoramentos.'],\n    ['ABNT NBR 12655','Concreto de cimento Portland — preparo, controle, recebimento e aceitação. Controle da resistência para liberação da desforma.'],\n    ['ABNT NBR 6118','Projeto de estruturas de concreto. Evolução da resistência βcc(t) e do módulo Eci(t).'],\n    ['ABNT NBR 8681','Ações e segurança nas estruturas. Coeficientes de ponderação e combinações.'],\n    ['ABNT NBR 8800','Projeto de estruturas de aço. Flambagem por compressão, FLT e resistências de cálculo.'],\n    ['ABNT NBR 7190','Projeto de estruturas de madeira. Classes de resistência, kmod e resistências de cálculo.'],\n    ['ABNT NBR 5738 / 5739','Moldagem, cura e ensaio de corpos de prova cilíndricos para controle da desforma.'],\n    ['ABNT NBR 6122','Projeto e execução de fundações. Referência para a verificação do apoio inferior sobre o terreno.']\n  ];\n  $('normasLista').innerHTML='<div class=\"tw\"><table><tbody>'+refs.map(function(x){\n    return '<tr><td style=\"white-space:nowrap\"><b>'+x[0]+'<\u002Fb><\u002Ftd><td>'+x[1]+'<\u002Ftd><\u002Ftr>';}).join('')+'<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n\n  $('formulario').innerHTML=\n    '<details open><summary>Carregamento<\u002Fsummary>'+\n    '<div class=\"eq\">g₁ = h_ef · γc\\ng₁,din = g₁ · φ\\nqd = γg·(g₁,din + g₂) + γq·q₁\\nq,ser = g₁ + g₂ + ψ·q₁<\u002Fdiv><\u002Fdetails>'+\n    '<details><summary>Vigas — esforços e flecha<\u002Fsummary>'+\n    '<div class=\"eq\">Biapoiada:  M = qL²/8    V = qL/2    δ = 5qL⁴/(384·EI)\\nContínua:   M = qL²/10   V = 0,6qL   δ = 0,0069·qL⁴/EI<\u002Fdiv><\u002Fdetails>'+\n    '<details><summary>Madeira (NBR 7190)<\u002Fsummary>'+\n    '<div class=\"eq\">kmod = kmod1 · kmod2 · kmod3\\nfmd = kmod · fm,k / 1,4      fvd = kmod · fv,k / 1,8\\nMrd = fmd · W               Vrd = (2/3)·fvd·A\\nE,ef = kmod · E,co,m<\u002Fdiv><\u002Fdetails>'+\n    '<details><summary>Aço (NBR 8800)<\u002Fsummary>'+\n    '<div class=\"eq\">Mrd = min(Zx ; 1,5·Wx) · fy / γa1        γa1 = 1,10\\nVrd = 0,60 · fy · Aw / γa1\\nFLT: λ = Lb/ry ; λp = 1,76·√(E/fy) ; interpolação até λr<\u002Fdiv><\u002Fdetails>'+\n    '<details><summary>Escora — flambagem (NBR 8800)<\u002Fsummary>'+\n    '<div class=\"eq\">Ne = π²·E·I/(K·L)²\\nλ₀ = √(Npl/Ne)\\nχ = 0,658^(λ₀²)   para λ₀ ≤ 1,5\\nχ = 0,877/λ₀²     para λ₀ > 1,5\\nNrd = χ · Npl / γa1<\u002Fdiv><\u002Fdetails>'+\n    '<details><summary>Malha<\u002Fsummary>'+\n    '<div class=\"eq\">P = qd · Sx · Sy\\nSombriga: q = qd · St , vão = Sy\\nLongarina: q = qd · Sy , vão = Sx\\nS,limite = √(Nrd/qd)<\u002Fdiv><\u002Fdetails>'+\n    '<details><summary>Ganho de resistência (NBR 6118 / NBR 12655)<\u002Fsummary>'+\n    '<div class=\"eq\">βcc(t) = exp{ s · [1 − (28/t)^0,5] }\\nfcj = βcc(t) · fck\\nEci(t) = [βcc(t)]^0,5 · Eci,28      Eci,28 = αE · 5600 · √fck\\n\\nIdade equivalente (Arrhenius):\\nt_eq = t · exp[ −Ea/R · (1/T − 1/T_ref) ]     Ea = 33500 J/mol (T ≥ 20 °C)\\nIdade equivalente (Nurse-Saul):\\nt_eq = t · (T + 10)/(T_ref + 10)\\n\\nPrazo: t = 28 / [1 − ln(κ)/s]²   com κ = fcj,req/fck<\u002Fdiv><\u002Fdetails>'+\n    '<details><summary>Estabilidade<\u002Fsummary>'+\n    '<div class=\"eq\">Fh = α · Qk        (α mínimo usual: 1,5%)\\nF,diagonal = (Fh/n,linhas) / cos θ\\nM,tombamento = Fh · H/2      M,estabilizante = Qk · B/2<\u002Fdiv><\u002Fdetails>';\n\n  var lib='<h4 style=\"font-size:12px;margin:6px 0\">Escoras e torres<\u002Fh4><div class=\"tw\"><table><thead><tr>'+\n    '<th>Modelo<\u002Fth><th class=\"n\">Nrd (kN)<\u002Fth><th class=\"n\">Tubo<\u002Fth><th class=\"n\">Montantes<\u002Fth><th class=\"n\">Altura máx.<\u002Fth>'+\n    '<\u002Ftr><\u002Fthead><tbody>'+Object.keys(E.ESCORAS).map(function(k){var e=E.ESCORAS[k];\n      return '<tr><td>'+e.n+'<\u002Ftd><td class=\"n\">'+e.Nrd+'<\u002Ftd><td class=\"n\">Ø'+e.D+'×'+e.t+'<\u002Ftd><td class=\"n\">'+\n        e.pernas+'<\u002Ftd><td class=\"n\">'+(e.hmax<50?e.hmax+' m':'—')+'<\u002Ftd><\u002Ftr>';}).join('')+'<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n  lib+='<h4 style=\"font-size:12px;margin:14px 0 6px\">Vigas industrializadas<\u002Fh4><div class=\"tw\"><table><thead><tr>'+\n    '<th>Viga<\u002Fth><th class=\"n\">Mrd (kN·m)<\u002Fth><th class=\"n\">Vrd (kN)<\u002Fth><th class=\"n\">EI (kN·m²)<\u002Fth><\u002Ftr><\u002Fthead><tbody>'+\n    Object.keys(E.VIGAS_IND).map(function(k){var v=E.VIGAS_IND[k];\n      return '<tr><td>'+v.n+'<\u002Ftd><td class=\"n\">'+v.Mrd+'<\u002Ftd><td class=\"n\">'+v.Vrd+'<\u002Ftd><td class=\"n\">'+v.EI+'<\u002Ftd><\u002Ftr>';}).join('')+\n    '<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n  lib+='<h4 style=\"font-size:12px;margin:14px 0 6px\">Madeira serrada (NBR 7190)<\u002Fh4><div class=\"tw\"><table><thead><tr>'+\n    '<th>Classe<\u002Fth><th class=\"n\">fm,k (MPa)<\u002Fth><th class=\"n\">fv,k (MPa)<\u002Fth><th class=\"n\">E (MPa)<\u002Fth><th class=\"n\">γ (kN/m³)<\u002Fth>'+\n    '<\u002Ftr><\u002Fthead><tbody>'+Object.keys(E.MADEIRA).map(function(k){var m=E.MADEIRA[k];\n      return '<tr><td>'+m.n+'<\u002Ftd><td class=\"n\">'+m.fmk+'<\u002Ftd><td class=\"n\">'+m.fvk+'<\u002Ftd><td class=\"n\">'+m.E+\n        '<\u002Ftd><td class=\"n\">'+m.pe+'<\u002Ftd><\u002Ftr>';}).join('')+'<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n  lib+='<div class=\"hint\" style=\"margin-top:10px\">Os valores de escoras, torres e vigas industrializadas são típicos de mercado, '+\n    'oferecidos como ponto de partida. Substitua sempre pelos dados do catálogo e do laudo do fabricante efetivamente empregado.<\u002Fdiv>';\n  $('libs').innerHTML=lib;\n}\n\n/* -------- inicialização -------- */\nfunction init(){\n  popularFamilias();\n  $('iData').value=new Date().toISOString().slice(0,10);\n  renderNormas();\n\n  document.querySelectorAll('.tab').forEach(function(t){\n    t.addEventListener('click',function(){\n      document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});\n      document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('on');});\n      t.classList.add('on'); $(t.dataset.p).classList.add('on');\n      window.scrollTo({top:0,behavior:'smooth'});\n    });\n  });\n\n  $('iSombFam').addEventListener('change',function(){atualizaSecoes('iSombFam','iSombSec'); calcular();});\n  $('iLongFam').addEventListener('change',function(){atualizaSecoes('iLongFam','iLongSec'); calcular();});\n\n  var campos=document.querySelectorAll('input,select');\n  campos.forEach(function(c){\n    if(c.id==='iRot'||c.id==='iShowLaje') return;\n    c.addEventListener('change',function(){ sincroniza(); calcular(); });\n    if(c.type==='range') c.addEventListener('input',sincroniza);\n  });\n  $('iRot').addEventListener('input',function(){ if(EST) render3D(EST); });\n  $('iShowLaje').addEventListener('change',function(){ if(EST) render3D(EST); });\n\n  $('bCalc').addEventListener('click',function(){ calcular(); toast('Cálculo atualizado'); });\n  $('bSave').addEventListener('click',salvar);\n  $('bLoad').addEventListener('click',abrir);\n  $('bJson').addEventListener('click',function(){\n    baixar('cimbrepro-projeto.json',JSON.stringify(ler(),null,2),'application/json'); toast('JSON exportado'); });\n  $('bTheme').addEventListener('click',function(){\n    var d=document.documentElement.getAttribute('data-theme')==='dark';\n    document.documentElement.setAttribute('data-theme',d?'light':'dark');\n    try{localStorage.setItem('cimbrepro.tema',d?'light':'dark');}catch(e){}\n    if(EST) render3D(EST);\n  });\n  $('bPrint').addEventListener('click',function(){window.print();});\n  $('bCsv').addEventListener('click',function(){ if(!EST)calcular();\n    baixar('cimbrepro-relatorio.csv',csvRel(EST),'text/csv'); toast('CSV exportado'); });\n  $('bTxt').addEventListener('click',function(){ if(!EST)calcular();\n    baixar('cimbrepro-memorial.txt',memorialTXT(EST)); toast('Memorial exportado'); });\n\n  function exportarIfc(){\n    var res=gerarIfcAtual();\n    if(!res){ toast('Calcule antes de exportar'); return; }\n    var nome=($('iIfcNome').value||'escoramento').replace(/[^\\w\\-]+/g,'_').toLowerCase()+'.ifc';\n    baixar(nome,res.texto,'application/x-step');\n    $('ifcStat').innerHTML='<div class=\"msg g\"><b>Arquivo gerado<\u002Fb>'+res.entidades+\n      ' entidades IFC, '+res.elementos+' elementos construtivos. Compatível com visualizadores IFC4.<\u002Fdiv>';\n    toast('IFC4 exportado');\n  }\n  $('bIfc').addEventListener('click',exportarIfc);\n  $('bIfc2').addEventListener('click',exportarIfc);\n  $('bIfcPrev').addEventListener('click',function(){\n    var res=gerarIfcAtual(); if(!res) return;\n    var p=$('ifcPrev'), linhas=res.texto.split('\\n');\n    p.style.display=''; p.textContent=linhas.slice(0,60).join('\\n')+\n      '\\n\\n... ('+(linhas.length-70)+' linhas omitidas) ...\\n\\n'+linhas.slice(-10).join('\\n');\n  });\n  $('bTest').addEventListener('click',function(){\n    var t=autoteste();\n    $('testOut').innerHTML=t.out.join('\\n');\n    $('testResumo').innerHTML='<span class=\"sel '+(t.fail?'bad':'ok')+'\">'+t.pass+' de '+t.total+\n      ' testes aprovados<\u002Fspan>'+(t.fail?' <span class=\"sel bad\">'+t.fail+' falha(s)<\u002Fspan>':'');\n    toast(t.fail? t.fail+' teste(s) falharam' : 'Todos os '+t.total+' testes passaram');\n  });\n\n  try{ var tm=localStorage.getItem('cimbrepro.tema'); if(tm) document.documentElement.setAttribute('data-theme',tm); }catch(e){}\n  restaurar();\n  sincroniza();\n  calcular();\n}\n\nif(typeof window!=='undefined'){\n  window.CIMBRE={ler:ler, escrever:escrever, calcular:calcular, autoteste:autoteste,\n                 memorialTXT:memorialTXT, csvRel:csvRel, gerarIfcAtual:gerarIfcAtual,\n                 estado:function(){return EST;}};\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);\n  else init();\n}\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
