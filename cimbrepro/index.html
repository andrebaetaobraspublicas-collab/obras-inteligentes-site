  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"pt-BR\" data-theme=\"light\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>CimbrePro — Calculadora de Esforços em Escoramentos e Cimbres Metálicos<\u002Ftitle>\n<meta name=\"description\" content=\"Dimensionamento e verificação de escoramento metálico de lajes: cargas, malha de torres, sombrigas, longarinas, prazo de desforma e exportação IFC4.\">\n<style>\n/* ============================================================\n   CimbrePro — identidade visual\n   Graphite + amarelo de capacete (canteiro) + aço oxidado\n   ============================================================ */\n:root{\n  --bg:#F2F3F0; --bg2:#E7E9E4; --surf:#FFFFFF; --surf2:#FAFAF8;\n  --ink:#15181B; --ink2:#4A545D; --mut:#79848E; --line:#D6DBD5; --line2:#C2C9BF;\n  --amber:#E09600; --amber-s:#FFF3D6; --steel:#1F4E5F; --steel-s:#DFEBEF;\n  --ok:#1B7A46; --ok-s:#DDF1E5; --warn:#A96700; --warn-s:#FFF0DA;\n  --bad:#B5342A; --bad-s:#FBE3E0;\n  --shadow:0 1px 2px rgba(20,25,30,.06),0 6px 18px rgba(20,25,30,.06);\n  --r:4px; --r2:10px;\n  --fd:\"Helvetica Neue\",Inter,-apple-system,\"Segoe UI\",Roboto,Arial,sans-serif;\n  --fb:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --fm:ui-monospace,\"SF Mono\",\"Cascadia Mono\",\"Roboto Mono\",Menlo,Consolas,monospace;\n}\n[data-theme=\"dark\"]{\n  --bg:#111417; --bg2:#171B1F; --surf:#1B2025; --surf2:#20262C;\n  --ink:#E9EDF0; --ink2:#B3BEC7; --mut:#7E8B95; --line:#2A3238; --line2:#3A444C;\n  --amber:#F2AE1C; --amber-s:#3A2E10; --steel:#63B4CE; --steel-s:#13303A;\n  --ok:#4FBE85; --ok-s:#123526; --warn:#E0A24A; --warn-s:#3A2C12;\n  --bad:#F0796C; --bad-s:#3A1A17;\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{\n  background:var(--bg); color:var(--ink); font-family:var(--fb);\n  font-size:14px; line-height:1.55; -webkit-text-size-adjust:100%;\n}\nh1,h2,h3,h4{font-family:var(--fd); margin:0; line-height:1.2; letter-spacing:-.01em}\na{color:var(--steel)}\n\n/* ---------- Cabeçalho ---------- */\n.top{\n  position:sticky; top:0; z-index:50; background:var(--surf);\n  border-bottom:1px solid var(--line);\n}\n.top-in{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}\n.brand{display:flex;align-items:center;gap:11px;min-width:0}\n.mark{\n  width:34px;height:34px;flex:0 0 34px;border-radius:var(--r);\n  background:var(--ink); display:grid;place-items:center;\n}\n[data-theme=\"dark\"] .mark{background:var(--amber)}\n.mark svg{width:22px;height:22px}\n.brand-t{font-family:var(--fd);font-weight:800;font-size:16px;letter-spacing:.12em;text-transform:uppercase}\n.brand-t em{font-style:normal;color:var(--amber)}\n.brand-s{font-size:10.5px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;font-family:var(--fm)}\n.top-sp{flex:1}\n.tbtns{display:flex;gap:6px;flex-wrap:wrap}\n\n/* ---------- Botões ---------- */\nbutton{font-family:inherit;font-size:inherit}\n.btn{\n  border:1px solid var(--line2); background:var(--surf); color:var(--ink);\n  padding:7px 12px; border-radius:var(--r); cursor:pointer; font-size:12.5px;\n  font-weight:600; display:inline-flex;align-items:center;gap:6px;\n  transition:background .13s,border-color .13s,transform .06s;\n}\n.btn:hover{background:var(--bg2);border-color:var(--mut)}\n.btn:active{transform:translateY(1px)}\n.btn:focus-visible{outline:2px solid var(--steel);outline-offset:2px}\n.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}\n[data-theme=\"dark\"] .btn.pri{background:var(--amber);color:#151515;border-color:var(--amber)}\n.btn.pri:hover{opacity:.88;background:var(--ink)}\n[data-theme=\"dark\"] .btn.pri:hover{background:var(--amber)}\n.btn.amb{background:var(--amber);color:#1a1400;border-color:var(--amber)}\n.btn.sm{padding:4px 9px;font-size:11.5px}\n\n/* ---------- Abas ---------- */\n.tabs{background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:55px;z-index:49}\n.tabs-in{max-width:1280px;margin:0 auto;padding:0 10px;display:flex;gap:0;overflow-x:auto;scrollbar-width:thin}\n.tab{\n  border:0;background:none;color:var(--ink2);padding:11px 13px;cursor:pointer;\n  font-size:12.5px;font-weight:600;white-space:nowrap;border-bottom:2.5px solid transparent;\n  display:flex;align-items:center;gap:7px;\n}\n.tab .n{font-family:var(--fm);font-size:10px;color:var(--mut);font-weight:700}\n.tab:hover{color:var(--ink);background:var(--bg2)}\n.tab.on{color:var(--ink);border-bottom-color:var(--amber)}\n.tab.on .n{color:var(--amber)}\n.tab:focus-visible{outline:2px solid var(--steel);outline-offset:-2px}\n\n/* ---------- Layout ---------- */\n.wrap{max-width:1280px;margin:0 auto;padding:18px}\n.panel{display:none;animation:fade .18s ease}\n.panel.on{display:block}\n@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n.grid{display:grid;gap:14px}\n.g2{grid-template-columns:repeat(2,minmax(0,1fr))}\n.g3{grid-template-columns:repeat(3,minmax(0,1fr))}\n.g4{grid-template-columns:repeat(4,minmax(0,1fr))}\n@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}\n\n/* ---------- Cartões ---------- */\n.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);padding:15px 16px;box-shadow:var(--shadow)}\n.card+.card{margin-top:14px}\n.card>h3{font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink2);\n  display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:800}\n.card>h3::before{content:\"\";width:3px;height:13px;background:var(--amber);border-radius:2px;flex:0 0 3px}\n.card>h3 .tagn{margin-left:auto;font-family:var(--fm);font-size:9.5px;color:var(--mut);letter-spacing:.04em;text-transform:none}\n.hint{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.45}\n\n/* ---------- Formulários ---------- */\n.f{margin-bottom:11px}\n.f>label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:4px;letter-spacing:.02em}\n.f>label .u{color:var(--mut);font-weight:500;font-family:var(--fm);font-size:10.5px}\ninput[type=text],input[type=number],input[type=date],select,textarea{\n  width:100%;padding:7px 9px;border:1px solid var(--line2);border-radius:var(--r);\n  background:var(--surf2);color:var(--ink);font-family:var(--fm);font-size:13px;\n}\nselect{font-family:var(--fb);font-size:12.5px}\ninput:focus,select:focus,textarea:focus{outline:2px solid var(--steel);outline-offset:-1px;border-color:var(--steel)}\ninput.err{border-color:var(--bad);background:var(--bad-s)}\n.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:8px 0;cursor:pointer}\n.chk input{width:16px;height:16px;accent-color:var(--amber);cursor:pointer}\n.rng{display:flex;align-items:center;gap:9px}\n.rng input[type=range]{flex:1;accent-color:var(--amber)}\n.rng output{font-family:var(--fm);font-size:12px;min-width:44px;text-align:right;font-weight:700}\nfieldset{border:1px solid var(--line);border-radius:var(--r);padding:11px 12px 4px;margin:0 0 12px}\nlegend{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--mut);padding:0 5px}\n\n/* ---------- Métricas ---------- */\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}\n.kpi{border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;background:var(--surf2)}\n.kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700}\n.kpi .v{font-family:var(--fm);font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:3px;line-height:1.1}\n.kpi .s{font-size:11px;color:var(--mut);margin-top:2px}\n.kpi.ok{border-left:3px solid var(--ok)} .kpi.warn{border-left:3px solid var(--warn)}\n.kpi.bad{border-left:3px solid var(--bad)} .kpi.hi{border-left:3px solid var(--amber)}\n\n/* ---------- Tabelas ---------- */\n.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}\ntable{width:100%;border-collapse:collapse;font-size:12.5px}\nth,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}\nth{background:var(--bg2);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;\n  color:var(--ink2);font-weight:800;white-space:nowrap;position:sticky;top:0}\ntd.n,th.n{text-align:right;font-family:var(--fm)}\ntbody tr:last-child td{border-bottom:0}\ntbody tr:hover{background:var(--bg2)}\ntr.tot td{font-weight:800;background:var(--bg2)}\n\n/* ---------- Selos ---------- */\n.sel{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:100px;\n  font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}\n.sel.ok{background:var(--ok-s);color:var(--ok)}\n.sel.warn{background:var(--warn-s);color:var(--warn)}\n.sel.bad{background:var(--bad-s);color:var(--bad)}\n.sel.info{background:var(--steel-s);color:var(--steel)}\n.sel.amb{background:var(--amber-s);color:var(--warn)}\n\n/* ---------- Avisos ---------- */\n.msg{border-left:3px solid var(--steel);background:var(--steel-s);padding:10px 13px;\n  border-radius:0 var(--r) var(--r) 0;font-size:12.5px;margin:10px 0}\n.msg.w{border-color:var(--warn);background:var(--warn-s)}\n.msg.e{border-color:var(--bad);background:var(--bad-s)}\n.msg.g{border-color:var(--ok);background:var(--ok-s)}\n.msg b{display:block;margin-bottom:2px}\n.msg ul{margin:5px 0 0;padding-left:17px}\n\n/* ---------- Barra de utilização ---------- */\n.bar{height:7px;background:var(--bg2);border-radius:100px;overflow:hidden;margin-top:5px;border:1px solid var(--line)}\n.bar i{display:block;height:100%;border-radius:100px;transition:width .3s}\n.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}\n\n/* ---------- Gráficos / desenhos ---------- */\n.plot{width:100%;height:auto;display:block;background:var(--surf2);border:1px solid var(--line);border-radius:var(--r)}\n.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-top:8px}\n.leg span{display:flex;align-items:center;gap:5px}\n.leg i{width:11px;height:11px;border-radius:2px;display:inline-block}\n\n/* ---------- Diversos ---------- */\n.mono{font-family:var(--fm)}\n.eq{font-family:var(--fm);font-size:12px;background:var(--bg2);border:1px solid var(--line);\n  border-radius:var(--r);padding:8px 11px;margin:7px 0;overflow-x:auto;white-space:pre;line-height:1.6}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.sp{flex:1}\ndetails{border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;margin:8px 0;background:var(--surf2)}\nsummary{cursor:pointer;font-weight:700;font-size:12.5px}\n.foot{max-width:1280px;margin:0 auto;padding:22px 18px 40px;color:var(--mut);font-size:11.5px;line-height:1.6}\n.pill{font-family:var(--fm);font-size:10.5px;background:var(--bg2);border:1px solid var(--line);\n  padding:1px 6px;border-radius:3px;color:var(--ink2)}\n.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(70px);\n  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:100px;font-size:12.5px;\n  font-weight:600;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:200;pointer-events:none}\n.toast.on{opacity:1;transform:translateX(-50%)}\n[data-theme=\"dark\"] .toast{background:var(--amber);color:#151515}\n.tst{font-family:var(--fm);font-size:11.5px;max-height:440px;overflow:auto;\n  border:1px solid var(--line);border-radius:var(--r);padding:11px;background:var(--surf2);white-space:pre-wrap}\n.tst .p{color:var(--ok)} .tst .f{color:var(--bad);font-weight:700}\n@media print{\n  .top,.tabs,.tbtns,.noprint{display:none!important}\n  .panel{display:block!important}\n  body{background:#fff}\n  .card{break-inside:avoid;box-shadow:none}\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<!-- ===================== CimbrePro · tela de abertura ===================== -->\n<div id=\"cpSplash\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Abertura do CimbrePro\">\n  <style>\n  #cpSplash{position:fixed;inset:0;z-index:9999;background:\n      radial-gradient(120% 90% at 50% 8%,#243038 0%,#161c21 45%,#0d1113 100%);\n      color:#EDF1F3;font-family:var(--fb);overflow:hidden;display:block}\n  #cpSplash *{box-sizing:border-box}\n  #cpSplash .grid-floor{position:absolute;inset:0;opacity:.35;\n      background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),\n                       linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);\n      background-size:64px 64px;mask-image:radial-gradient(60% 55% at 50% 62%,#000 0%,transparent 78%)}\n  #cpSplash .vig{position:absolute;inset:0;pointer-events:none;\n      background:radial-gradient(75% 60% at 50% 52%,transparent 40%,rgba(0,0,0,.55) 100%)}\n\n  /* ---- palco 3D ---- */\n  #cpStage{position:absolute;inset:0;perspective:1600px;perspective-origin:50% 44%;\n      transition:filter .7s ease,opacity .7s ease}\n  #cpScene{position:absolute;left:50%;top:56%;width:0;height:0;transform-style:preserve-3d;\n      animation:cpOrbit 5.2s cubic-bezier(.25,.7,.25,1) both}\n  @keyframes cpOrbit{\n    0%{transform:scale(.44) rotateX(-6deg) rotateY(58deg)}\n    100%{transform:scale(.63) rotateX(-19deg) rotateY(26deg)}\n  }\n  #cpScene .ps{position:absolute;left:0;top:0;transform-style:preserve-3d}\n  #cpScene .an{position:absolute;left:0;top:0;transform-style:preserve-3d}\n  #cpScene .fc{position:absolute;left:0;top:0;backface-visibility:hidden}\n\n  /* materiais */\n  .m-steel{background:linear-gradient(180deg,#b9c4cb 0%,#7c888f 38%,#59646b 62%,#8e9aa1 100%)}\n  .m-steel.f-top{background:linear-gradient(90deg,#d7e0e5,#9aa6ad)}\n  .m-steel.f-side{background:linear-gradient(180deg,#6d787f,#3f484e)}\n  .m-amb{background:linear-gradient(180deg,#ffd472 0%,#E09600 42%,#a96b00 100%)}\n  .m-amb.f-top{background:linear-gradient(90deg,#ffe3a1,#e5a41c)}\n  .m-amb.f-side{background:linear-gradient(180deg,#c07d00,#7d5100)}\n  .m-plate{background:linear-gradient(180deg,#6f7a81,#48525a)}\n  .m-conc{background:\n      repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 46px),\n      linear-gradient(160deg,#cfd2cd 0%,#b7bcb7 45%,#a2a8a3 100%)}\n  .m-conc.f-side{background:linear-gradient(180deg,#8e948f,#6c726e)}\n  .m-conc.f-front{background:linear-gradient(180deg,#9ea4a0,#7b817d)}\n  .m-wood{background:linear-gradient(180deg,#c9a06a,#9a7444 55%,#7d5c33)}\n  .m-wood.f-top{background:linear-gradient(90deg,#dcb681,#b98f56)}\n\n  /* sombra de contato */\n  #cpScene .shadow{position:absolute;left:0;top:0;border-radius:50%;\n      background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent 78%)}\n\n  /* animações de montagem */\n  @keyframes cpRise{from{transform:scaleY(.001)}to{transform:scaleY(1)}}\n  @keyframes cpPop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}\n  @keyframes cpSlide{from{opacity:0;transform:translate3d(-90px,-40px,0)}to{opacity:1;transform:none}}\n  @keyframes cpSlideZ{from{opacity:0;transform:translate3d(0,-40px,120px)}to{opacity:1;transform:none}}\n  @keyframes cpDrop{\n    0%{opacity:0;transform:translateY(-340px)}\n    55%{opacity:1}\n    82%{transform:translateY(6px)}\n    100%{opacity:1;transform:translateY(0)}\n  }\n\n  /* ---- wordmark ---- */\n  #cpHud{position:absolute;left:0;right:0;bottom:8.5vh;text-align:center;padding:0 24px}\n  #cpHud .wm{font-family:var(--fd);font-weight:800;font-size:clamp(30px,5.2vw,62px);\n      letter-spacing:.22em;text-transform:uppercase;opacity:0;\n      animation:cpFadeUp .9s cubic-bezier(.22,1,.36,1) .35s both}\n  #cpHud .wm em{font-style:normal;color:#F2AE1C}\n  #cpHud .sub{margin-top:10px;font-family:var(--fm);font-size:clamp(10px,1.1vw,12.5px);\n      letter-spacing:.24em;text-transform:uppercase;color:#93A1AA;opacity:0;\n      animation:cpFadeUp .9s cubic-bezier(.22,1,.36,1) .75s both}\n  @keyframes cpFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n  #cpBar{margin:26px auto 0;width:min(320px,60vw);height:2px;background:rgba(255,255,255,.14);overflow:hidden}\n  #cpBar i{display:block;height:100%;width:100%;background:#F2AE1C;transform-origin:0 50%;\n      animation:cpLoad 3.95s cubic-bezier(.3,.5,.4,1) 0s both}\n  @keyframes cpLoad{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n  #cpHud .step{margin-top:12px;font-family:var(--fm);font-size:10.5px;letter-spacing:.16em;\n      text-transform:uppercase;color:#6E7C86;min-height:14px}\n\n  /* ---- aviso legal ---- */\n  #cpLegal{position:absolute;inset:0;display:none;place-items:center;padding:4vh 18px;\n      background:rgba(8,11,13,.55);opacity:0;overflow:auto}\n  #cpLegal.on{display:grid;animation:cpLegalIn .55s cubic-bezier(.22,1,.36,1) both}\n  @keyframes cpLegalIn{from{opacity:0}to{opacity:1}}\n  #cpCard{width:min(760px,100%);background:#FBFBF9;color:#15181B;border-radius:12px;\n      box-shadow:0 30px 80px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.4) inset;\n      overflow:hidden;transform:translateY(18px);animation:cpCardIn .6s cubic-bezier(.22,1,.36,1) .06s both}\n  @keyframes cpCardIn{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}\n  #cpCard header{padding:18px 24px 14px;border-bottom:1px solid #E2E6E0;display:flex;gap:12px;align-items:center}\n  #cpCard .badge{width:34px;height:34px;flex:0 0 34px;border-radius:4px;background:#15181B;\n      display:grid;place-items:center;color:#F2AE1C;font-family:var(--fm);font-weight:700;font-size:15px}\n  #cpCard h2{font-family:var(--fd);font-size:17px;font-weight:800;letter-spacing:-.01em;margin:0}\n  #cpCard .k{font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#79848E;margin-top:2px}\n  #cpBody{padding:18px 24px 6px;max-height:44vh;overflow:auto;font-size:13px;line-height:1.6;color:#3A444C}\n  #cpBody h3{font-family:var(--fd);font-size:11.5px;text-transform:uppercase;letter-spacing:.11em;\n      color:#15181B;margin:16px 0 5px;font-weight:800}\n  #cpBody h3:first-child{margin-top:0}\n  #cpBody p{margin:0 0 8px}\n  #cpBody ul{margin:0 0 8px;padding-left:18px}\n  #cpBody li{margin-bottom:4px}\n  #cpBody strong{color:#15181B}\n  #cpCard footer{padding:14px 24px 20px;border-top:1px solid #E2E6E0;background:#F2F3F0;\n      display:flex;flex-wrap:wrap;gap:14px;align-items:center}\n  #cpAgreeRow{display:flex;gap:10px;align-items:flex-start;flex:1;min-width:260px;cursor:pointer;\n      font-size:12.5px;line-height:1.45;color:#15181B}\n  #cpChk{width:18px;height:18px;flex:0 0 18px;margin-top:1px;accent-color:#15181B}\n  #cpActions{display:flex;gap:8px;margin-left:auto}\n  #cpSplash .cbtn{font-family:inherit;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:4px;\n      border:1px solid #C2C9BF;background:#fff;color:#15181B;cursor:pointer;transition:background .13s,opacity .13s}\n  #cpSplash .cbtn:hover{background:#EDEFEA}\n  #cpSplash .cbtn.pri{background:#15181B;border-color:#15181B;color:#F2F3F0}\n  #cpSplash .cbtn.pri:hover{background:#000}\n  #cpSplash .cbtn[disabled]{opacity:.4;cursor:not-allowed}\n  #cpDeny{padding:20px 24px 24px;font-size:13px;line-height:1.6;color:#3A444C;display:none}\n  #cpDeny.on{display:block}\n  @media (max-width:560px){\n    #cpBody{max-height:38vh}\n    #cpActions{margin-left:0;width:100%}\n    #cpSplash .cbtn{flex:1}\n  }\n  @media (prefers-reduced-motion:reduce){\n    #cpScene,#cpScene .an,#cpBar i,#cpHud .wm,#cpHud .sub{animation-duration:.01s!important;animation-delay:0s!important}\n  }\n  html.cp-lock,body.cp-lock{overflow:hidden!important}\n  <\u002Fstyle>\n\n  <div class=\"grid-floor\"><\u002Fdiv>\n  <div id=\"cpStage\"><div id=\"cpScene\"><\u002Fdiv><\u002Fdiv>\n  <div class=\"vig\"><\u002Fdiv>\n\n  <div id=\"cpHud\">\n    <div class=\"wm\">Cimbre<em>Pro<\u002Fem><\u002Fdiv>\n    <div class=\"sub\">Esforços em escoramentos e cimbres metálicos<\u002Fdiv>\n    <div id=\"cpBar\"><i><\u002Fi><\u002Fdiv>\n    <div class=\"step\" id=\"cpStep\">Iniciando montagem<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"cpLegal\">\n    <div id=\"cpCard\">\n      <header>\n        <div class=\"badge\">§<\u002Fdiv>\n        <div>\n          <h2>Aviso legal e termo de uso<\u002Fh2>\n          <div class=\"k\">Leia antes de acessar o sistema<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fheader>\n      <div id=\"cpBody\">\n        <h3>1. Natureza da ferramenta<\u002Fh3>\n        <p>O <strong>CimbrePro<\u002Fstrong> é uma ferramenta de <strong>apoio ao cálculo<\u002Fstrong> de esforços em escoramentos e cimbres metálicos. Os resultados são estimativas obtidas a partir dos dados informados pelo usuário e das hipóteses simplificadoras adotadas no modelo.<\u002Fp>\n        <h3>2. Responsabilidade técnica<\u002Fh3>\n        <p>O software <strong>não substitui<\u002Fstrong> o projeto, a verificação e a responsabilidade técnica de profissional legalmente habilitado. Todo resultado deve ser conferido e formalizado por engenheiro com registro ativo no CREA e anotação de responsabilidade técnica (ART) sobre o projeto de escoramento.<\u002Fp>\n        <h3>3. Normas e catálogos<\u002Fh3>\n        <ul>\n          <li>Confira sempre as capacidades admissíveis nos <strong>catálogos do fabricante<\u002Fstrong> dos equipamentos efetivamente empregados em obra.<\u002Fli>\n          <li>Observe as normas aplicáveis (entre outras, ABNT NBR 14931, NBR 6118, NBR 8800, NBR 15696) e a NR-18 quanto à segurança do trabalho.<\u002Fli>\n        <\u002Ful>\n        <h3>4. Limitação de garantias<\u002Fh3>\n        <p>A ferramenta é fornecida <strong>“no estado em que se encontra”<\u002Fstrong>, sem garantia de adequação a finalidade específica. O autor e os distribuidores não respondem por perdas, danos materiais, atrasos, acidentes ou prejuízos decorrentes do uso, uso indevido ou interpretação dos resultados.<\u002Fp>\n        <h3>5. Dados e privacidade<\u002Fh3>\n        <p>Os dados inseridos permanecem no seu navegador; nada é enviado a servidores por esta interface. Cabe ao usuário guardar cópias e proteger informações sigilosas do empreendimento.<\u002Fp>\n      <\u002Fdiv>\n      <footer>\n        <label id=\"cpAgreeRow\" for=\"cpChk\">\n          <input type=\"checkbox\" id=\"cpChk\">\n          <span>Li e concordo. Declaro ser profissional habilitado — ou atuar sob supervisão de um — e assumo a verificação técnica dos resultados.<\u002Fspan>\n        <\u002Flabel>\n        <div id=\"cpActions\">\n          <button class=\"cbtn\" id=\"cpNo\" type=\"button\">Não concordo<\u002Fbutton>\n          <button class=\"cbtn pri\" id=\"cpYes\" type=\"button\" disabled=\"\">Concordar e acessar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Ffooter>\n      <div id=\"cpDeny\">\n        <strong>Acesso não liberado.<\u002Fstrong> O uso do CimbrePro depende da aceitação do aviso legal. Você pode fechar esta aba ou voltar e revisar os termos.\n        <div style=\"margin-top:14px\"><button class=\"cbtn\" id=\"cpBack\" type=\"button\">Voltar aos termos<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<script>\n/* ===== CimbrePro — abertura 3D (escoramento) + aviso legal ===== */\n(function(){\n  var scene=document.getElementById('cpScene');\n  if(!scene) return;\n  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;\n  var D=function(v){return reduce?0:v;};\n\n  function node(cls,tf){var d=document.createElement('div');d.className=cls;if(tf)d.style.transform=tf;return d;}\n  function ps(x,y,z,rot){return node('ps','translate3d('+x+'px,'+y+'px,'+z+'px)'+(rot?' '+rot:''));}\n  function an(anim,dur,delay,ease){\n    var d=node('an');\n    d.style.animation=anim+' '+dur+'s '+(ease||'cubic-bezier(.22,1,.36,1)')+' '+D(delay)+'s both';\n    return d;\n  }\n  function face(cls,w,h,tf){var d=node('fc '+cls,tf);d.style.width=w+'px';d.style.height=h+'px';return d;}\n\n  /* barra horizontal (eixo x local), centro no ponto dado */\n  function bar(host,x,y,z,L,T,mat,rotY,a){\n    var p=ps(x,y,z,rotY?'rotateY('+rotY+'deg)':'');\n    p.appendChild(a);\n    a.appendChild(face(mat+' f-front',L,T,'translate(-50%,-50%) translateZ('+(T/2)+'px)'));\n    a.appendChild(face(mat+' f-top',L,T,'translate(-50%,-50%) translateY('+(-T/2)+'px) rotateX(-90deg)'));\n    host.appendChild(p);return p;\n  }\n  /* barra inclinada no plano da face (diagonal) */\n  function diag(host,x,y,z,L,T,mat,rotY,rotZ,a){\n    var p=ps(x,y,z,(rotY?'rotateY('+rotY+'deg) ':'')+'rotateZ('+rotZ+'deg)');\n    p.appendChild(a);\n    a.appendChild(face(mat+' f-front',L,T,'translate(-50%,-50%) translateZ('+(T/2)+'px)'));\n    a.appendChild(face(mat+' f-top',L,T,'translate(-50%,-50%) translateY('+(-T/2)+'px) rotateX(-90deg)'));\n    host.appendChild(p);return p;\n  }\n  /* montante vertical, ancorado na base */\n  function post(host,x,y,z,L,T,mat,a){\n    var p=ps(x,y,z);p.appendChild(a);\n    a.appendChild(face(mat+' f-front',T,L,'translate(-50%,-50%) translateY('+(-L/2)+'px) translateZ('+(T/2)+'px)'));\n    a.appendChild(face(mat+' f-side',T,L,'translate(-50%,-50%) translateY('+(-L/2)+'px) translateX('+(T/2)+'px) rotateY(90deg)'));\n    host.appendChild(p);return p;\n  }\n  /* painel horizontal (laje, placa de base) */\n  function panel(host,x,y,z,W,Dp,TH,mat,a){\n    var p=ps(x,y,z);p.appendChild(a);\n    a.appendChild(face(mat+' f-topface',W,Dp,'translate(-50%,-50%) rotateX(-90deg)'));\n    a.appendChild(face(mat+' f-front',W,TH,'translate(-50%,-50%) translateY('+(TH/2)+'px) translateZ('+(Dp/2)+'px)'));\n    a.appendChild(face(mat+' f-side',Dp,TH,'translate(-50%,-50%) translateY('+(TH/2)+'px) translateX('+(W/2)+'px) rotateY(90deg)'));\n    host.appendChild(p);return p;\n  }\n  function shadow(host,x,z,w,h,delay){\n    var p=ps(x,2,z,'rotateX(90deg)');\n    var a=an('cpPop',.5,delay);p.appendChild(a);\n    var s=node('shadow','translate(-50%,-50%)');s.style.width=w+'px';s.style.height=h+'px';\n    a.appendChild(s);host.appendChild(p);return p;\n  }\n\n  /* ---------- geometria ---------- */\n  var HT=150/2;                 /* meia base da torre */\n  var LV=[0,-92,-184],TOP=-262; /* níveis de travessas */\n  var TX=[-175,175],TZ=[-165,165];\n  var t=0;\n\n  TX.forEach(function(tx,ti){\n    TZ.forEach(function(tz,zi){\n      var g=ps(tx,0,tz);scene.appendChild(g);\n      var base=.18+(ti*2+zi)*.07;\n      shadow(g,0,0,300,300,base-.1);\n      /* placas de base + fusos */\n      [[-HT,-HT],[HT,-HT],[-HT,HT],[HT,HT]].forEach(function(c,i){\n        panel(g,c[0],-4,c[1],40,40,7,'m-plate',an('cpPop',.42,base+i*.03));\n        post(g,c[0],-4,c[1],262,15,'m-steel',an('cpRise',.62,base+.2+i*.05));\n      });\n      /* travessas horizontais */\n      LV.concat([TOP]).forEach(function(yv,li){\n        var d=base+.62+li*.17;\n        bar(g,0,yv,-HT,150,9,'m-amb',0,an('cpPop',.34,d));\n        bar(g,0,yv,HT,150,9,'m-amb',0,an('cpPop',.34,d+.04));\n        bar(g,-HT,yv,0,150,9,'m-amb',90,an('cpPop',.34,d+.08));\n        bar(g,HT,yv,0,150,9,'m-amb',90,an('cpPop',.34,d+.12));\n      });\n      /* diagonais nos dois primeiros vãos */\n      [0,1].forEach(function(k){\n        var yc=(LV[k]+LV[k+1])/2,Ld=Math.hypot(150,92),ang=-Math.atan2(92,150)*180/Math.PI;\n        var d=base+1.26+k*.12;\n        diag(g,0,yc,-HT,Ld,7,'m-steel',0,ang,an('cpPop',.3,d));\n        diag(g,-HT,yc,0,Ld,7,'m-steel',90,-ang,an('cpPop',.3,d+.06));\n      });\n    });\n  });\n\n  /* longarinas (eixo x) sobre as linhas de montantes */\n  var LGZ=[-165-HT,-165+HT,165-HT,165+HT];\n  LGZ.forEach(function(z,i){\n    bar(scene,0,TOP-14,z,760,16,'m-steel',0,an('cpSlide',.5,2.0+i*.08));\n  });\n  /* sombrigas (eixo z) */\n  for(var i=0;i<9;i++){\n    var x=-360+i*90;\n    bar(scene,x,TOP-32,0,520,13,'m-wood',90,an('cpSlideZ',.45,2.42+i*.045));\n  }\n  /* laje */\n  panel(scene,0,TOP-40,0,800,600,26,'m-conc',an('cpDrop',1,2.92,'cubic-bezier(.34,1.2,.4,1)'));\n\n  /* ---------- HUD ---------- */\n  var stepEl=document.getElementById('cpStep');\n  var steps=[[0,'Placas de base e fusos'],[700,'Montantes das torres'],[1400,'Travessas e diagonais'],\n             [2050,'Longarinas metálicas'],[2500,'Sombrigas'],[3050,'Lançamento da laje'],[3700,'Verificação concluída']];\n  var timers=[];\n  if(!reduce) steps.forEach(function(s){timers.push(setTimeout(function(){stepEl.textContent=s[1];},s[0]));});\n  else stepEl.textContent='Verificação concluída';\n\n  /* ---------- aviso legal ---------- */\n  var splash=document.getElementById('cpSplash'),stage=document.getElementById('cpStage'),\n      legal=document.getElementById('cpLegal'),chk=document.getElementById('cpChk'),\n      yes=document.getElementById('cpYes'),no=document.getElementById('cpNo'),\n      back=document.getElementById('cpBack'),deny=document.getElementById('cpDeny'),\n      bodyTxt=document.getElementById('cpBody'),foot=document.querySelector('#cpCard footer');\n\n  document.documentElement.classList.add('cp-lock');\n  document.body.classList.add('cp-lock');\n\n  function openLegal(){\n    stage.style.filter='blur(4px) saturate(.8) brightness(.65)';\n    legal.classList.add('on');\n    setTimeout(function(){chk.focus();},420);\n  }\n  timers.push(setTimeout(openLegal,reduce?60:4050));\n\n  chk.addEventListener('change',function(){yes.disabled=!chk.checked;});\n  no.addEventListener('click',function(){bodyTxt.style.display='none';foot.style.display='none';deny.classList.add('on');});\n  back.addEventListener('click',function(){deny.classList.remove('on');bodyTxt.style.display='';foot.style.display='';chk.focus();});\n  yes.addEventListener('click',function(){\n    if(!chk.checked) return;\n    timers.forEach(clearTimeout);\n    splash.style.transition='opacity .5s ease';\n    splash.style.opacity='0';\n    setTimeout(function(){\n      splash.remove();\n      document.documentElement.classList.remove('cp-lock');\n      document.body.classList.remove('cp-lock');\n    },520);\n  });\n  document.addEventListener('keydown',function(e){\n    if(!legal.classList.contains('on')) return;\n    if(e.key==='Enter'&&chk.checked) yes.click();\n  });\n})();\n<\u002Fscript>\n<!-- =================== fim da tela de abertura =================== -->\n<header class=\"top\">\n  <div class=\"top-in\">\n    <div class=\"brand\">\n      <div class=\"mark\" aria-hidden=\"true\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E09600\" stroke-width=\"1.9\" stroke-linecap=\"round\">\n          <path d=\"M2 5h20M4 5v15M20 5v15M4 20h16\"><\u002Fpath><path d=\"M4 12h16M4 5l16 15M20 5L4 20\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div>\n        <div class=\"brand-t\">Cimbre<em>Pro<\u002Fem><\u002Fdiv>\n        <div class=\"brand-s\">Escoramentos e cimbres metálicos · v1.0<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"top-sp\"><\u002Fdiv>\n    <div class=\"tbtns noprint\">\n      <button class=\"btn pri\" id=\"bCalc\">Calcular<\u002Fbutton>\n      <button class=\"btn\" id=\"bSave\">Salvar<\u002Fbutton>\n      <button class=\"btn\" id=\"bLoad\">Abrir<\u002Fbutton>\n      <button class=\"btn\" id=\"bJson\">Exportar JSON<\u002Fbutton>\n      <button class=\"btn\" id=\"bTheme\" title=\"Alternar tema\">Tema<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<nav class=\"tabs noprint\" role=\"tablist\">\n  <div class=\"tabs-in\">\n    <button class=\"tab on\" data-p=\"pEntrada\" role=\"tab\"><span class=\"n\">01<\u002Fspan>Entrada<\u002Fbutton>\n    <button class=\"tab\" data-p=\"pCargas\" role=\"tab\"><span class=\"n\">02<\u002Fspan>Cargas<\u002Fbutton>\n    <button class=\"tab\" data-p=\"pMalha\" role=\"tab\"><span class=\"n\">03<\u002Fspan>Malha<\u002Fbutton>\n    <button class=\"tab\" data-p=\"pVigas\" role=\"tab\"><span class=\"n\">04<\u002Fspan>Vigas<\u002Fbutton>\n    <button class=\"tab\" data-p=\"pEscoras\" role=\"tab\"><span class=\"n\">05<\u002Fspan>Escoras<\u002Fbutton>\n    <button class=\"tab\" data-p=\"pDesforma\" role=\"tab\"><span class=\"n\">06<\u002Fspan>Desforma<\u002Fbutton>\n    <button class=\"tab\" data-p=\"pRelatorio\" role=\"tab\"><span class=\"n\">07<\u002Fspan>Relatório<\u002Fbutton>\n    <button class=\"tab\" data-p=\"pIfc\" role=\"tab\"><span class=\"n\">08<\u002Fspan>BIM / IFC<\u002Fbutton>\n    <button class=\"tab\" data-p=\"pNormas\" role=\"tab\"><span class=\"n\">09<\u002Fspan>Normas<\u002Fbutton>\n    <button class=\"tab\" data-p=\"pTestes\" role=\"tab\"><span class=\"n\">10<\u002Fspan>Autoteste<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<main class=\"wrap\">\n\n<!-- ============ 01 ENTRADA ============ -->\n<section class=\"panel on\" id=\"pEntrada\">\n  <div class=\"grid g3\">\n    <div>\n      <div class=\"card\">\n        <h3>Identificação<\u002Fh3>\n        <div class=\"f\"><label for=\"iObra\">Obra<\u002Flabel><input type=\"text\" id=\"iObra\" value=\"Edifício — Bloco A\"><\u002Fdiv>\n        <div class=\"f\"><label for=\"iPeca\">Peça / pavimento<\u002Flabel><input type=\"text\" id=\"iPeca\" value=\"Laje do 3º pavimento\"><\u002Fdiv>\n        <div class=\"f\"><label for=\"iResp\">Responsável técnico<\u002Flabel><input type=\"text\" id=\"iResp\" value=\"\"><\u002Fdiv>\n        <div class=\"f\"><label for=\"iData\">Data da concretagem<\u002Flabel><input type=\"date\" id=\"iData\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <h3>Geometria da laje<span class=\"tagn\">painel de escoramento<\u002Fspan><\u002Fh3>\n        <div class=\"f\"><label for=\"iH\">Espessura da laje <span class=\"u\">h (m)<\u002Fspan><\u002Flabel>\n          <input type=\"number\" id=\"iH\" value=\"0.20\" step=\"0.01\" min=\"0.06\" max=\"1.5\"><\u002Fdiv>\n        <div class=\"grid g2\" style=\"gap:0 12px\">\n          <div class=\"f\"><label for=\"iLx\">Vão / dimensão X <span class=\"u\">(m)<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"iLx\" value=\"8.00\" step=\"0.1\" min=\"1\" max=\"60\"><\u002Fdiv>\n          <div class=\"f\"><label for=\"iLy\">Vão / dimensão Y <span class=\"u\">(m)<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"iLy\" value=\"6.00\" step=\"0.1\" min=\"1\" max=\"60\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"f\"><label for=\"iTipoLaje\">Tipo de laje<\u002Flabel>\n          <select id=\"iTipoLaje\">\n            <option value=\"macica\">Maciça<\u002Foption>\n            <option value=\"nervurada\">Nervurada (com cubetas)<\u002Foption>\n            <option value=\"cogumelo\">Cogumelo / lisa com capitel<\u002Foption>\n            <option value=\"premold\">Pré-moldada com capa<\u002Foption>\n          <\u002Fselect><\u002Fdiv>\n        <div class=\"f\" id=\"wrapNerv\" style=\"display:none\"><label for=\"iRedNerv\">Redução de volume por nervuras <span class=\"u\">(%)<\u002Fspan><\u002Flabel>\n          <div class=\"rng\"><input type=\"range\" id=\"iRedNerv\" min=\"0\" max=\"60\" step=\"1\" value=\"35\"><output id=\"oRedNerv\">35%<\u002Foutput><\u002Fdiv><\u002Fdiv>\n        <div class=\"f\"><label for=\"iPd\">Altura livre de escoramento (base → face inferior da fôrma) <span class=\"u\">(m)<\u002Fspan><\u002Flabel>\n          <input type=\"number\" id=\"iPd\" value=\"2.90\" step=\"0.05\" min=\"0.5\" max=\"20\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div class=\"card\">\n        <h3>Ações e coeficientes<span class=\"tagn\">NBR 15696 / NBR 8681<\u002Fspan><\u002Fh3>\n        <div class=\"grid g2\" style=\"gap:0 12px\">\n          <div class=\"f\"><label for=\"iGc\">Peso específico do concreto fresco <span class=\"u\">γc (kN/m³)<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"iGc\" value=\"25.0\" step=\"0.5\" min=\"20\" max=\"28\"><\u002Fdiv>\n          <div class=\"f\"><label for=\"iPf\">Peso próprio de fôrma + escoramento <span class=\"u\">(kN/m²)<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"iPf\" value=\"0.50\" step=\"0.05\" min=\"0\" max=\"3\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"grid g2\" style=\"gap:0 12px\">\n          <div class=\"f\"><label for=\"iQ\">Sobrecarga de lançamento e serviço <span class=\"u\">(kN/m²)<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"iQ\" value=\"1.50\" step=\"0.1\" min=\"0.5\" max=\"6\"><\u002Fdiv>\n          <div class=\"f\"><label for=\"iPhi\">Coeficiente de impacto/vibração <span class=\"u\">φ<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"iPhi\" value=\"1.10\" step=\"0.05\" min=\"1\" max=\"1.5\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"grid g3\" style=\"gap:0 10px\">\n          <div class=\"f\"><label for=\"iGg\">γg <span class=\"u\">permanente<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"iGg\" value=\"1.40\" step=\"0.05\" min=\"1\" max=\"1.8\"><\u002Fdiv>\n          <div class=\"f\"><label for=\"iGq\">γq <span class=\"u\">variável<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"iGq\" value=\"1.40\" step=\"0.05\" min=\"1\" max=\"1.8\"><\u002Fdiv>\n          <div class=\"f\"><label for=\"iPsi\">ψ <span class=\"u\">serviço<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"iPsi\" value=\"1.00\" step=\"0.05\" min=\"0\" max=\"1\"><\u002Fdiv>\n        <\u002Fdiv>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"iBomba\"> Concretagem por bomba lança (majora sobrecarga em 0,5 kN/m²)<\u002Flabel>\n        <div class=\"f\"><label for=\"iFh\">Ação horizontal mínima <span class=\"u\">(% da carga vertical)<\u002Fspan><\u002Flabel>\n          <div class=\"rng\"><input type=\"range\" id=\"iFh\" min=\"0.5\" max=\"5\" step=\"0.1\" value=\"1.5\"><output id=\"oFh\">1,5%<\u002Foutput><\u002Fdiv><\u002Fdiv>\n        <div class=\"hint\">A ação horizontal mínima cobre desaprumo, empuxo do lançamento e movimentação de equipes. Compare com a ação do vento quando o escoramento ficar exposto.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <h3>Escora / torre<\u002Fh3>\n        <div class=\"f\"><label for=\"iEscora\">Modelo<\u002Flabel>\n          <select id=\"iEscora\"><\u002Fselect><\u002Fdiv>\n        <div class=\"grid g2\" style=\"gap:0 12px\">\n          <div class=\"f\"><label for=\"iNrd\">Capacidade individual declarada <span class=\"u\">Nrd (kN)<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"iNrd\" value=\"20\" step=\"1\" min=\"2\" max=\"600\"><\u002Fdiv>\n          <div class=\"f\"><label for=\"iK\">Coef. de flambagem <span class=\"u\">K<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"iK\" value=\"1.00\" step=\"0.05\" min=\"0.5\" max=\"2.2\"><\u002Fdiv>\n        <\u002Fdiv>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"iCalcFlamb\"> Verificar por flambagem (NBR 8800) em vez de usar o valor declarado<\u002Flabel>\n        <div id=\"wrapFlamb\" style=\"display:none\">\n          <div class=\"grid g3\" style=\"gap:0 10px\">\n            <div class=\"f\"><label for=\"iDt\">Ø externo <span class=\"u\">(mm)<\u002Fspan><\u002Flabel><input type=\"number\" id=\"iDt\" value=\"48.3\" step=\"0.1\"><\u002Fdiv>\n            <div class=\"f\"><label for=\"iTt\">Espessura <span class=\"u\">(mm)<\u002Fspan><\u002Flabel><input type=\"number\" id=\"iTt\" value=\"3.00\" step=\"0.05\"><\u002Fdiv>\n            <div class=\"f\"><label for=\"iFyT\">fy <span class=\"u\">(MPa)<\u002Fspan><\u002Flabel><input type=\"number\" id=\"iFyT\" value=\"250\" step=\"5\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"grid g2\" style=\"gap:0 12px\">\n          <div class=\"f\"><label for=\"iSxMax\">Espaçamento máximo em X <span class=\"u\">Sx (m)<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"iSxMax\" value=\"2.00\" step=\"0.05\" min=\"0.3\" max=\"5\"><\u002Fdiv>\n          <div class=\"f\"><label for=\"iSyMax\">Espaçamento máximo em Y <span class=\"u\">Sy (m)<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"iSyMax\" value=\"2.00\" step=\"0.05\" min=\"0.3\" max=\"5\"><\u002Fdiv>\n        <\u002Fdiv>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"iOtim\" checked=\"\"> Otimizar a malha automaticamente (maior espaçamento que passa em todas as verificações)<\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div class=\"card\">\n        <h3>Sombrigas <span class=\"tagn\">secundárias · vão = Sy<\u002Fspan><\u002Fh3>\n        <div class=\"f\"><label for=\"iSombFam\">Família<\u002Flabel><select id=\"iSombFam\"><\u002Fselect><\u002Fdiv>\n        <div class=\"f\"><label for=\"iSombSec\">Seção / perfil<\u002Flabel><select id=\"iSombSec\"><\u002Fselect><\u002Fdiv>\n        <div class=\"f\"><label for=\"iStMax\">Espaçamento máximo entre sombrigas <span class=\"u\">St (m)<\u002Fspan><\u002Flabel>\n          <input type=\"number\" id=\"iStMax\" value=\"0.60\" step=\"0.05\" min=\"0.15\" max=\"2\"><\u002Fdiv>\n        <div class=\"f\"><label for=\"iSombEsq\">Esquema estático<\u002Flabel>\n          <select id=\"iSombEsq\"><option value=\"cont\">Contínua (3 ou mais vãos)<\u002Foption><option value=\"simples\">Vão simples (biapoiada)<\u002Foption><\u002Fselect><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <h3>Longarinas <span class=\"tagn\">primárias · vão = Sx<\u002Fspan><\u002Fh3>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"iUsaLong\" checked=\"\"> Sistema com longarinas apoiadas nas torres<\u002Flabel>\n        <div id=\"wrapLong\">\n          <div class=\"f\"><label for=\"iLongFam\">Família<\u002Flabel><select id=\"iLongFam\"><\u002Fselect><\u002Fdiv>\n          <div class=\"f\"><label for=\"iLongSec\">Seção / perfil<\u002Flabel><select id=\"iLongSec\"><\u002Fselect><\u002Fdiv>\n          <div class=\"f\"><label for=\"iLongEsq\">Esquema estático<\u002Flabel>\n            <select id=\"iLongEsq\"><option value=\"cont\">Contínua (3 ou mais vãos)<\u002Foption><option value=\"simples\">Vão simples (biapoiada)<\u002Foption><\u002Fselect><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"hint\">Sem longarinas, as sombrigas apoiam-se diretamente nos cabeçotes das torres e o vão da sombriga passa a ser Sx.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <h3>Fôrma e critérios de serviço<\u002Fh3>\n        <div class=\"f\"><label for=\"iComp\">Chapa de compensado<\u002Flabel>\n          <select id=\"iComp\">\n            <option value=\"0\">Não verificar<\u002Foption>\n            <option value=\"12\">12 mm plastificado<\u002Foption>\n            <option value=\"15\">15 mm plastificado<\u002Foption>\n            <option value=\"18\" selected=\"\">18 mm plastificado<\u002Foption>\n            <option value=\"20\">20 mm plastificado<\u002Foption>\n          <\u002Fselect><\u002Fdiv>\n        <div class=\"f\"><label for=\"iFlecha\">Limite de flecha<\u002Flabel>\n          <select id=\"iFlecha\">\n            <option value=\"500\">L/500 — concreto aparente<\u002Foption>\n            <option value=\"400\" selected=\"\">L/400 — padrão<\u002Foption>\n            <option value=\"360\">L/360<\u002Foption>\n            <option value=\"300\">L/300 — tolerante<\u002Foption>\n          <\u002Fselect><\u002Fdiv>\n        <div class=\"f\"><label for=\"iFlAbs\">Flecha absoluta máxima <span class=\"u\">(mm)<\u002Fspan><\u002Flabel>\n          <input type=\"number\" id=\"iFlAbs\" value=\"5.0\" step=\"0.5\" min=\"1\" max=\"30\"><\u002Fdiv>\n        <fieldset><legend>Madeira — kmod (NBR 7190)<\u002Flegend>\n          <div class=\"grid g3\" style=\"gap:0 8px\">\n            <div class=\"f\"><label for=\"iKm1\">kmod1<\u002Flabel>\n              <select id=\"iKm1\"><option value=\"0.6\">0,60 permanente<\u002Foption><option value=\"0.7\">0,70 longa<\u002Foption>\n              <option value=\"0.8\" selected=\"\">0,80 média<\u002Foption><option value=\"0.9\">0,90 curta<\u002Foption><\u002Fselect><\u002Fdiv>\n            <div class=\"f\"><label for=\"iKm2\">kmod2<\u002Flabel>\n              <select id=\"iKm2\"><option value=\"1.0\">1,00 classe 1-2<\u002Foption><option value=\"0.8\" selected=\"\">0,80 classe 3-4<\u002Foption><\u002Fselect><\u002Fdiv>\n            <div class=\"f\"><label for=\"iKm3\">kmod3<\u002Flabel>\n              <select id=\"iKm3\"><option value=\"1.0\">1,00 1ª cat.<\u002Foption><option value=\"0.8\" selected=\"\">0,80 2ª cat.<\u002Foption><\u002Fselect><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Ffieldset>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"msg\" id=\"mEntrada\"><b>Como o modelo funciona<\u002Fb>\n    Chapa de compensado → sombrigas (vão Sy, espaçadas St) → longarinas (vão Sx, espaçadas Sy) → torres/escoras em malha Sx × Sy.\n    Todas as verificações usam o mesmo carregamento de cálculo qd e limitam a flecha ao critério escolhido.<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 02 CARGAS ============ -->\n<section class=\"panel\" id=\"pCargas\">\n  <div class=\"card\"><h3>Composição do carregamento<span class=\"tagn\">por m² de laje<\u002Fspan><\u002Fh3>\n    <div class=\"kpis\" id=\"kCargas\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"grid g2\">\n    <div class=\"card\"><h3>Memória de cálculo<\u002Fh3><div id=\"memCargas\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><h3>Participação das ações<\u002Fh3><div id=\"chartCargas\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><h3>Carga total no painel<\u002Fh3><div class=\"tw\"><table id=\"tbCargas\"><\u002Ftable><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 03 MALHA ============ -->\n<section class=\"panel\" id=\"pMalha\">\n  <div class=\"card\"><h3>Malha de escoramento adotada<\u002Fh3><div class=\"kpis\" id=\"kMalha\"><\u002Fdiv>\n    <div id=\"msgMalha\"><\u002Fdiv><\u002Fdiv>\n  <div class=\"grid g2\">\n    <div class=\"card\"><h3>Planta da malha <span class=\"tagn\">posição das torres<\u002Fspan><\u002Fh3>\n      <div id=\"plantaMalha\"><\u002Fdiv>\n      <div class=\"leg\"><span><i style=\"background:#E09600\"><\u002Fi>Torre / escora<\u002Fspan>\n        <span><i style=\"background:#1F4E5F\"><\u002Fi>Longarina (X)<\u002Fspan>\n        <span><i style=\"background:#79848E\"><\u002Fi>Sombriga (Y)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><h3>Perspectiva isométrica <span class=\"tagn\">montagem<\u002Fspan><\u002Fh3>\n      <div id=\"iso3d\"><\u002Fdiv>\n      <div class=\"hint\">Vista gerada a partir da mesma geometria exportada em IFC4.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><h3>Estudo de sensibilidade do espaçamento<\u002Fh3>\n    <div id=\"chartSens\"><\u002Fdiv>\n    <div class=\"hint\">Carga por ponto de apoio em função do espaçamento uniforme S (malha S × S), comparada à capacidade da escora adotada.<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 04 VIGAS ============ -->\n<section class=\"panel\" id=\"pVigas\">\n  <div class=\"card\"><h3>Sombrigas (vigas secundárias)<span class=\"tagn\" id=\"tagSomb\"><\u002Fspan><\u002Fh3>\n    <div class=\"kpis\" id=\"kSomb\"><\u002Fdiv>\n    <div id=\"detSomb\"><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\" id=\"cardLong\"><h3>Longarinas (vigas primárias)<span class=\"tagn\" id=\"tagLong\"><\u002Fspan><\u002Fh3>\n    <div class=\"kpis\" id=\"kLong\"><\u002Fdiv>\n    <div id=\"detLong\"><\u002Fdiv><\u002Fdiv>\n  <div class=\"grid g2\">\n    <div class=\"card\"><h3>Diagramas — sombriga<\u002Fh3><div id=\"diagSomb\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><h3>Chapa de compensado<\u002Fh3><div id=\"detComp\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 05 ESCORAS ============ -->\n<section class=\"panel\" id=\"pEscoras\">\n  <div class=\"card\"><h3>Verificação da escora / torre<\u002Fh3><div class=\"kpis\" id=\"kEsc\"><\u002Fdiv><div id=\"detEsc\"><\u002Fdiv><\u002Fdiv>\n  <div class=\"grid g2\">\n    <div class=\"card\"><h3>Estabilidade horizontal e contraventamento<\u002Fh3><div id=\"detEstab\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><h3>Estrutura de apoio inferior<\u002Fh3><div id=\"detApoio\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><h3>Curva de capacidade × altura livre<\u002Fh3><div id=\"chartFlamb\"><\u002Fdiv>\n    <div class=\"hint\">Força axial resistente de cálculo pela curva de flambagem da NBR 8800, para a seção tubular informada.<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 06 DESFORMA ============ -->\n<section class=\"panel\" id=\"pDesforma\">\n  <div class=\"grid g3\">\n    <div class=\"card\"><h3>Concreto e cura<span class=\"tagn\">NBR 12655 / NBR 6118<\u002Fspan><\u002Fh3>\n      <div class=\"f\"><label for=\"iFck\">Resistência característica <span class=\"u\">fck (MPa)<\u002Fspan><\u002Flabel>\n        <input type=\"number\" id=\"iFck\" value=\"30\" step=\"1\" min=\"15\" max=\"90\"><\u002Fdiv>\n      <div class=\"f\"><label for=\"iCim\">Tipo de cimento<\u002Flabel>\n        <select id=\"iCim\">\n          <option value=\"0.38\">CP III / CP IV — s = 0,38<\u002Foption>\n          <option value=\"0.25\" selected=\"\">CP I / CP II — s = 0,25<\u002Foption>\n          <option value=\"0.20\">CP V-ARI — s = 0,20<\u002Foption>\n        <\u002Fselect><\u002Fdiv>\n      <div class=\"f\"><label for=\"iTemp\">Temperatura média de cura <span class=\"u\">(°C)<\u002Fspan><\u002Flabel>\n        <div class=\"rng\"><input type=\"range\" id=\"iTemp\" min=\"5\" max=\"45\" step=\"1\" value=\"28\"><output id=\"oTemp\">28 °C<\u002Foutput><\u002Fdiv><\u002Fdiv>\n      <div class=\"f\"><label for=\"iMat\">Modelo de maturidade<\u002Flabel>\n        <select id=\"iMat\">\n          <option value=\"arr\" selected=\"\">Arrhenius — idade equivalente (Tref 20 °C)<\u002Foption>\n          <option value=\"ns\">Nurse-Saul — graus-dia (T0 = −10 °C)<\u002Foption>\n          <option value=\"none\">Sem correção de temperatura<\u002Foption>\n        <\u002Fselect><\u002Fdiv>\n      <div class=\"f\"><label for=\"iAgreg\">Agregado graúdo <span class=\"u\">αE<\u002Fspan><\u002Flabel>\n        <select id=\"iAgreg\">\n          <option value=\"1.2\">Basalto / diabásio — 1,2<\u002Foption>\n          <option value=\"1.0\" selected=\"\">Granito / gnaisse — 1,0<\u002Foption>\n          <option value=\"0.9\">Calcário — 0,9<\u002Foption>\n          <option value=\"0.7\">Arenito — 0,7<\u002Foption>\n        <\u002Fselect><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\"><h3>Critério de desforma<\u002Fh3>\n      <div class=\"f\"><label for=\"iCrit\">Etapa<\u002Flabel>\n        <select id=\"iCrit\">\n          <option value=\"lateral\">Fôrmas laterais (vigas, faces sem função de apoio)<\u002Foption>\n          <option value=\"parcial\" selected=\"\">Retirada da fôrma mantendo o reescoramento<\u002Foption>\n          <option value=\"total\">Retirada total do escoramento<\u002Foption>\n          <option value=\"balanco\">Peças em balanço<\u002Foption>\n        <\u002Fselect><\u002Fdiv>\n      <div class=\"f\"><label for=\"iKappa\">Grau de carregamento na desforma <span class=\"u\">κ = fcj,req / fck<\u002Fspan><\u002Flabel>\n        <div class=\"rng\"><input type=\"range\" id=\"iKappa\" min=\"0.20\" max=\"1.00\" step=\"0.01\" value=\"0.70\"><output id=\"oKappa\">0,70<\u002Foutput><\u002Fdiv><\u002Fdiv>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"iPrazoMin\" checked=\"\"> Respeitar os prazos mínimos indicativos da NBR 14931<\u002Flabel>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"iCP\"> Controle por corpos de prova curados junto à peça (NBR 5738/5739)<\u002Flabel>\n      <div class=\"f\"><label for=\"iReesc\">Vãos mantidos com reescoramento<\u002Flabel>\n        <select id=\"iReesc\"><option value=\"1\">1 pavimento abaixo<\u002Foption><option value=\"2\" selected=\"\">2 pavimentos abaixo<\u002Foption><option value=\"3\">3 pavimentos abaixo<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"hint\">κ representa a fração de fck necessária para que a peça suporte, com segurança, as ações presentes no instante da desforma.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\"><h3>Resultado<\u002Fh3><div class=\"kpis\" id=\"kDesf\"><\u002Fdiv><div id=\"msgDesf\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"grid g2\">\n    <div class=\"card\"><h3>Evolução da resistência e do módulo<\u002Fh3><div id=\"chartFcj\"><\u002Fdiv>\n      <div class=\"leg\"><span><i style=\"background:#E09600\"><\u002Fi>fcj / fck<\u002Fspan><span><i style=\"background:#1F4E5F\"><\u002Fi>Eci(t) / Eci28<\u002Fspan>\n        <span><i style=\"background:#B5342A\"><\u002Fi>Alvo κ<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><h3>Tabela de evolução<\u002Fh3><div class=\"tw\" style=\"max-height:400px;overflow:auto\"><table id=\"tbFcj\"><\u002Ftable><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><h3>Cronograma de liberação<\u002Fh3><div class=\"tw\"><table id=\"tbCrono\"><\u002Ftable><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 07 RELATÓRIO ============ -->\n<section class=\"panel\" id=\"pRelatorio\">\n  <div class=\"card noprint\"><h3>Ações<\u002Fh3>\n    <div class=\"row\">\n      <button class=\"btn pri\" id=\"bPrint\">Imprimir / salvar em PDF<\u002Fbutton>\n      <button class=\"btn\" id=\"bCsv\">Exportar CSV<\u002Fbutton>\n      <button class=\"btn\" id=\"bTxt\">Exportar memorial (TXT)<\u002Fbutton>\n      <button class=\"btn\" id=\"bIfc2\">Exportar IFC4<\u002Fbutton>\n    <\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><h3>Veredicto geral<\u002Fh3><div id=\"relVeredicto\"><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><h3>Resumo executivo<\u002Fh3><div id=\"relResumo\"><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><h3>Quadro de verificações<\u002Fh3><div class=\"tw\"><table id=\"tbVerif\"><\u002Ftable><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><h3>Quantitativos do painel<\u002Fh3><div class=\"tw\"><table id=\"tbQuant\"><\u002Ftable><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><h3>Recomendações de canteiro<\u002Fh3><div id=\"relRec\"><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><h3>Checklist de liberação da concretagem<\u002Fh3><div id=\"relCheck\"><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 08 IFC ============ -->\n<section class=\"panel\" id=\"pIfc\">\n  <div class=\"grid g2\">\n    <div class=\"card\"><h3>Exportação BIM<span class=\"tagn\">IFC4 · STEP Physical File<\u002Fspan><\u002Fh3>\n      <div class=\"f\"><label for=\"iIfcNome\">Nome do projeto no IFC<\u002Flabel><input type=\"text\" id=\"iIfcNome\" value=\"Escoramento — Laje\"><\u002Fdiv>\n      <div class=\"grid g2\" style=\"gap:0 12px\">\n        <div class=\"f\"><label for=\"iIfcX0\">Origem X <span class=\"u\">(m)<\u002Fspan><\u002Flabel><input type=\"number\" id=\"iIfcX0\" value=\"0\" step=\"0.1\"><\u002Fdiv>\n        <div class=\"f\"><label for=\"iIfcY0\">Origem Y <span class=\"u\">(m)<\u002Fspan><\u002Flabel><input type=\"number\" id=\"iIfcY0\" value=\"0\" step=\"0.1\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"f\"><label for=\"iIfcZ0\">Cota da base do escoramento <span class=\"u\">(m)<\u002Fspan><\u002Flabel><input type=\"number\" id=\"iIfcZ0\" value=\"0\" step=\"0.05\"><\u002Fdiv>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"iIfcTorres\" checked=\"\"> Exportar torres / escoras (IfcColumn)<\u002Flabel>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"iIfcLong\" checked=\"\"> Exportar longarinas (IfcBeam)<\u002Flabel>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"iIfcSomb\" checked=\"\"> Exportar sombrigas (IfcBeam)<\u002Flabel>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"iIfcLaje\" checked=\"\"> Exportar laje de referência (IfcSlab)<\u002Flabel>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"iIfcCabec\" checked=\"\"> Exportar cabeçotes / forcados (IfcDiscreteAccessory)<\u002Flabel>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"iIfcPset\" checked=\"\"> Anexar conjuntos de propriedades com as cargas verificadas<\u002Flabel>\n      <div class=\"row\" style=\"margin-top:12px\">\n        <button class=\"btn pri\" id=\"bIfc\">Gerar e baixar IFC4<\u002Fbutton>\n        <button class=\"btn\" id=\"bIfcPrev\">Ver trecho do arquivo<\u002Fbutton>\n      <\u002Fdiv>\n      <div id=\"ifcStat\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\"><h3>Modelo 3D<\u002Fh3><div id=\"ifc3d\"><\u002Fdiv>\n      <div class=\"leg\"><span><i style=\"background:#E09600\"><\u002Fi>Torres<\u002Fspan><span><i style=\"background:#1F4E5F\"><\u002Fi>Longarinas<\u002Fspan>\n        <span><i style=\"background:#79848E\"><\u002Fi>Sombrigas<\u002Fspan><span><i style=\"background:#B8C0C6\"><\u002Fi>Laje<\u002Fspan><\u002Fdiv>\n      <div class=\"row\" style=\"margin-top:10px\">\n        <label class=\"chk\" style=\"margin:0\"><input type=\"checkbox\" id=\"iShowLaje\" checked=\"\"> Mostrar laje<\u002Flabel>\n        <div class=\"sp\"><\u002Fdiv>\n        <span class=\"pill\">Giro<\u002Fspan>\n        <input type=\"range\" id=\"iRot\" min=\"-60\" max=\"60\" step=\"1\" value=\"0\" style=\"width:130px\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><h3>Conteúdo do arquivo<\u002Fh3><div id=\"ifcResumo\"><\u002Fdiv>\n    <div class=\"tst\" id=\"ifcPrev\" style=\"display:none\"><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 09 NORMAS ============ -->\n<section class=\"panel\" id=\"pNormas\">\n  <div class=\"grid g2\">\n    <div class=\"card\"><h3>Referências normativas<\u002Fh3><div id=\"normasLista\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><h3>Formulação empregada<\u002Fh3><div id=\"formulario\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\"><h3>Bibliotecas internas<\u002Fh3><div id=\"libs\"><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\"><h3>Limites de uso<\u002Fh3>\n    <div class=\"msg w\"><b>Ferramenta de apoio ao projeto<\u002Fb>\n      Os resultados são estimativas baseadas em modelos simplificados de viga e nas propriedades declaradas pelo usuário.\n      Capacidades de escoras, torres e vigas de escoramento devem ser confirmadas nos catálogos e laudos dos fabricantes.\n      O projeto de escoramento é peça técnica que exige responsável técnico habilitado, com ART/RRT e verificação em obra.<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 10 TESTES ============ -->\n<section class=\"panel\" id=\"pTestes\">\n  <div class=\"card\"><h3>Autoteste do motor de cálculo<\u002Fh3>\n    <div class=\"row\"><button class=\"btn pri\" id=\"bTest\">Executar autoteste<\u002Fbutton>\n      <span id=\"testResumo\"><\u002Fspan><\u002Fdiv>\n    <div class=\"tst\" id=\"testOut\" style=\"margin-top:12px\">Pronto para executar.<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer class=\"foot\">\n  <b>CimbrePro v1.0<\u002Fb> — calculadora de esforços em escoramentos e cimbres metálicos para lajes.\n  Aplicação de arquivo único, funciona integralmente sem conexão. Os dados ficam apenas neste navegador.\n  <br>Elaborado para engenheiros de produção e projetistas de canteiro. Confirme sempre capacidades de catálogo e execute inspeção antes da concretagem.\n<\u002Ffooter>\n<div class=\"toast\" id=\"toast\"><\u002Fdiv>\n<script>\n/* ==========================================================================\n   CimbrePro — motor de cálculo\n   Unidades internas: kN, m, MPa, cm (seções), °C, dias\n   ========================================================================== */\nvar ESC = (function(){\n'use strict';\n\nvar R_GAS = 8.314;                 // J/(mol·K)\nvar GA1   = 1.10;                  // γa1 — aço, escoamento (NBR 8800)\nvar GW_M  = 1.40;                  // γw — madeira, flexão/compressão (NBR 7190)\nvar GW_V  = 1.80;                  // γw — madeira, cisalhamento\nvar E_ACO = 200000;                // MPa\nvar G_ACO = 77000;                 // MPa\n\n/* ---------------------- bibliotecas ---------------------- */\n\n/* Madeira serrada — classes da NBR 7190. fmk/fvk em MPa, E em MPa, γ em kN/m³ */\nvar MADEIRA = {\n  C20:{n:'Conífera C20',fmk:20,fvk:3.6,E:9500,pe:5.0},\n  C25:{n:'Conífera C25',fmk:25,fvk:3.8,E:10000,pe:5.5},\n  C30:{n:'Conífera C30',fmk:30,fvk:4.0,E:11000,pe:6.0},\n  C40:{n:'Conífera C40',fmk:40,fvk:4.0,E:13000,pe:6.5},\n  D30:{n:'Folhosa D30',fmk:30,fvk:4.0,E:11000,pe:8.0},\n  D40:{n:'Folhosa D40',fmk:40,fvk:4.0,E:13000,pe:9.5},\n  D50:{n:'Folhosa D50',fmk:50,fvk:4.0,E:14000,pe:10.5},\n  D60:{n:'Folhosa D60 (ipê, cumaru)',fmk:60,fvk:4.5,E:17000,pe:11.5}\n};\n\n/* Seções retangulares usuais de sombriga/vinhote — b × h em cm */\nvar SECOES_MAD = [\n  {id:'6x12',b:6,h:12},{id:'6x16',b:6,h:16},{id:'7.5x15',b:7.5,h:15},\n  {id:'7.5x20',b:7.5,h:20},{id:'10x10',b:10,h:10},{id:'10x15',b:10,h:15},\n  {id:'10x20',b:10,h:20},{id:'12x12',b:12,h:12},{id:'12x20',b:12,h:20}\n];\n\n/* Perfis I laminados — d,bf,tw,tf em cm; A cm²; Ix,Iy,J cm⁴; Wx,Zx cm³; Cw cm⁶ */\nvar PERFIS = {\n  'W150x13.0':{d:14.8,bf:10.0,tw:.43,tf:.49,A:16.6,Ix:635,Wx:85.8,Zx:96.4,Iy:82,ry:2.22,J:2.65,Cw:4300,pe:.13},\n  'W150x18.0':{d:15.3,bf:10.2,tw:.58,tf:.71,A:23.4,Ix:939,Wx:122.8,Zx:139.4,Iy:126,ry:2.32,J:5.10,Cw:6580,pe:.18},\n  'W200x15.0':{d:20.0,bf:10.0,tw:.43,tf:.52,A:19.4,Ix:1305,Wx:130.5,Zx:147.9,Iy:87,ry:2.12,J:2.05,Cw:8100,pe:.15},\n  'W200x19.3':{d:20.3,bf:10.2,tw:.58,tf:.65,A:25.1,Ix:1686,Wx:166.1,Zx:190.6,Iy:115,ry:2.14,J:3.65,Cw:10800,pe:.19},\n  'W200x22.5':{d:20.6,bf:10.2,tw:.62,tf:.80,A:29.0,Ix:2029,Wx:197.0,Zx:225.5,Iy:142,ry:2.21,J:5.51,Cw:13500,pe:.23},\n  'W250x17.9':{d:25.1,bf:10.1,tw:.48,tf:.53,A:23.1,Ix:2291,Wx:182.6,Zx:211.0,Iy:91,ry:1.99,J:2.51,Cw:13300,pe:.18},\n  'W250x22.3':{d:25.4,bf:10.2,tw:.58,tf:.69,A:28.9,Ix:2939,Wx:231.4,Zx:267.7,Iy:123,ry:2.06,J:4.77,Cw:18300,pe:.22},\n  'W310x21.0':{d:30.3,bf:10.1,tw:.51,tf:.57,A:27.2,Ix:3776,Wx:249.3,Zx:291.6,Iy:98,ry:1.90,J:3.20,Cw:21400,pe:.21},\n  'W310x28.3':{d:30.9,bf:10.2,tw:.60,tf:.89,A:36.5,Ix:5500,Wx:356.0,Zx:409.0,Iy:158,ry:2.08,J:8.40,Cw:35100,pe:.28}\n};\n\n/* Vigas industrializadas de escoramento — resistências de cálculo j
