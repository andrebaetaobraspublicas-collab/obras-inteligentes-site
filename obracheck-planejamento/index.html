      { id: "E7.132", etapa: "E7", grupo: "Abastecimento de água", titulo: "Estação de tratamento de água", desc: "Processos, dimensionamento das unidades e controle da qualidade da água.", base: "NBR 12216; padrão de potabilidade do Ministério da Saúde", crit: "critico", aplica: { all: [{ se: "saneamento.agua" }, { se: "saneamento.eta" }] } },
      { id: "E7.133", etapa: "E7", grupo: "Abastecimento de água", titulo: "Reservatórios", desc: "Volume de reservação, estrutura e equipamentos.", base: "NBR 12217", crit: "critico", aplica: { se: "saneamento.agua" } },
      { id: "E7.134", etapa: "E7", grupo: "Abastecimento de água", titulo: "Rede de distribuição", desc: "Setorização, dimensionamento, pressões e materiais.", base: "NBR 12218", crit: "critico", aplica: { se: "saneamento.agua" } },
      { id: "E7.135", etapa: "E7", grupo: "Abastecimento de água", titulo: "Ligações prediais e hidrometração", desc: "Padrão de ligação, hidrômetros e cadastro de usuários.", base: "Lei 11.445/2007", crit: "importante", aplica: { se: "saneamento.agua" } },
      { id: "E7.136", etapa: "E7", grupo: "Abastecimento de água", titulo: "Redução de perdas e moderação do consumo", desc: "Estudo de perdas físicas e aparentes (setorização, controle de pressão e macromedição) e medidas de fomento à moderação do consumo.", base: "Lei 11.445/2007; OT-IBR 001/2006 R2026, Tabela 8", crit: "importante", aplica: { se: "saneamento.agua" } },

      { id: "E7.140", etapa: "E7", grupo: "Esgotamento sanitário", titulo: "Rede coletora", desc: "Traçado, profundidades, declividades, rede simples ou dupla, poços de visita ou terminais de inspeção e limpeza e materiais.", base: "NBR 9649", crit: "critico", aplica: { se: "saneamento.esgoto" } },
      { id: "E7.141", etapa: "E7", grupo: "Esgotamento sanitário", titulo: "Interceptores e emissários", desc: "Coletores-tronco, interceptores e emissários até o tratamento.", base: "NBR 12207", crit: "importante", aplica: { se: "saneamento.esgoto" } },
      { id: "E7.142", etapa: "E7", grupo: "Esgotamento sanitário", titulo: "Estação de tratamento de esgoto", desc: "Processo, dimensionamento, eficiência e disposição do lodo, atendidos os padrões de lançamento.", base: "NBR 12209; Res. CONAMA 430/2011", crit: "critico", aplica: { all: [{ se: "saneamento.esgoto" }, { se: "saneamento.ete" }] } },
      { id: "E7.143", etapa: "E7", grupo: "Esgotamento sanitário", titulo: "Ligações domiciliares e intradomiciliares", desc: "Ramais prediais, caixas de inspeção e estratégia de adesão dos usuários à rede.", base: "Lei 11.445/2007, art. 45", crit: "critico", aplica: { se: "saneamento.esgoto" } },
      { id: "E7.145", etapa: "E7", grupo: "Esgotamento sanitário", titulo: "Estações elevatórias", desc: "Poço de sucção, bombas, tubulações, extravasor, gerador e proteção contra transientes.", base: "NBR 12214 (água); NBR 12208 (esgoto)", crit: "critico", aplica: { all: [SANEAMENTO, { se: "saneamento.elevatorias" }] } },

      { id: "E7.150", etapa: "E7", grupo: "Drenagem urbana", titulo: "Microdrenagem", desc: "Sarjetas, bocas de lobo, galerias e poços de visita.", base: "Manual de drenagem do órgão; Plano Diretor de Drenagem", crit: "critico", aplica: { se: "saneamento.drenagem" } },
      { id: "E7.151", etapa: "E7", grupo: "Drenagem urbana", titulo: "Macrodrenagem", desc: "Canais, bacias de detenção ou retenção e travessias.", base: "Manual de drenagem do órgão", crit: "importante", aplica: { se: "saneamento.drenagem" } },
      { id: "E7.152", etapa: "E7", grupo: "Drenagem urbana", titulo: "Dissipadores e proteção dos lançamentos", desc: "Estruturas de dissipação de energia e controle de erosão nos pontos de descarga.", base: "Manual de drenagem do órgão", crit: "importante", aplica: { se: "saneamento.drenagem" } },
      { id: "E7.153", etapa: "E7", grupo: "Drenagem urbana", titulo: "Vazões de restrição e não agravamento a jusante", desc: "Comprovação de que a intervenção respeita as vazões e os volumes de restrição e não agrava as condições a jusante, verificados remanso, erosão e extravasamento.", base: "NR ANA 12/2025; OT-IBR 001/2006 R2026, Tabela 6", crit: "critico", aplica: DRENAGEM_URBANA },
      { id: "E7.154", etapa: "E7", grupo: "Drenagem urbana", titulo: "Projeto estrutural de galerias, canais e reservatórios", desc: "Galerias celulares, reservatórios, poços, caixas, lajes, tampas, alas, muros e estruturas de controle, com dimensionamento, detalhamento e controle tecnológico.", base: "NBR 6118; NBR 6122; OT-IBR 001/2006 R2026, Tabela 6", crit: "critico", aplica: DRENAGEM_URBANA },
      { id: "E7.155", etapa: "E7", grupo: "Drenagem urbana", titulo: "Qualidade das águas pluviais e ligações irregulares de esgoto", desc: "Corpo receptor, poluição difusa, sedimentos e resíduos, identificação de ligações irregulares de esgoto e medidas de controle e monitoramento.", base: "NR ANA 12/2025; OT-IBR 001/2006 R2026, Tabelas 6 e 7", crit: "importante", aplica: DRENAGEM_URBANA },
      { id: "E7.156", etapa: "E7", grupo: "Drenagem urbana", titulo: "Soluções verdes e azuis e integração urbanística", desc: "Controle na fonte, jardins de chuva, biovaletas, parques inundáveis e renaturalização de cursos d'água integrados ao sistema viário, às praças e aos usos da área.", base: "NR ANA 12/2025; OT-IBR 001/2006 R2026, Tabela 6", crit: "recomendado", aplica: DRENAGEM_URBANA },

      { id: "E7.160", etapa: "E7", grupo: "Unidades de saneamento", titulo: "Projeto elétrico e de automação das unidades", desc: "Alimentação, comandos, telemetria e proteção de elevatórias e estações.", base: "NBR 5410; NBR 14039", crit: "critico", aplica: { all: [SANEAMENTO, { any: [{ se: "saneamento.elevatorias" }, { se: "saneamento.eta" }, { se: "saneamento.ete" }] }] } },
      { id: "E7.161", etapa: "E7", grupo: "Unidades de saneamento", titulo: "Estruturas hidráulicas", desc: "Reservatórios, tanques e caixas de concreto com estanqueidade e durabilidade.", base: "NBR 6118; NBR 6122", crit: "critico", aplica: { any: [{ se: "saneamento.agua" }, { se: "saneamento.eta" }, { se: "saneamento.ete" }] } },
      { id: "E7.162", etapa: "E7", grupo: "Unidades de saneamento", titulo: "Manual de operação e manutenção", desc: "Rotinas de operação, manutenção e controle das unidades.", base: "Boa prática; Lei 14.133/2021, art. 18, §1º, VII", crit: "importante", aplica: SANEAMENTO },
      { id: "E7.163", etapa: "E7", grupo: "Unidades de saneamento", titulo: "Reposição de pavimentos e travessias", desc: "Recomposição de vias e calçadas e travessias de rodovias, ferrovias e cursos d'água, com as autorizações necessárias.", base: "Normas do titular da via; Lei 9.433/1997 (obras hidráulicas)", crit: "importante", aplica: SANEAMENTO },
      { id: "E7.164", etapa: "E7", grupo: "Unidades de saneamento", titulo: "Interface com a drenagem urbana e proteção contra inundações", desc: "Compatibilização das unidades e redes de água e esgoto com galerias, canais e cursos d'água, proteção contra submersão e drenagem das áreas das unidades.", base: "OT-IBR 001/2006 R2026, Tabela 7", crit: "importante", aplica: AGUA_ESGOTO },
      { id: "E7.165", etapa: "E7", grupo: "Unidades de saneamento", titulo: "Gestão e destinação de lodos de ETA e ETE", desc: "Quantidades de lodo, tratamento, desaguamento, transporte e destinação final adequada, com custos no orçamento.", base: "Lei 12.305/2010; Res. CONAMA 498/2020 (lodo de esgoto); OT-IBR 001/2006 R2026, Tabela 8", crit: "importante", aplica: { any: [{ se: "saneamento.eta" }, { se: "saneamento.ete" }] } },
      { id: "E7.166", etapa: "E7", grupo: "Unidades de saneamento", titulo: "Pré-operação e operação assistida", desc: "Testes, partida e operação assistida das unidades, com treinamento da equipe do operador, previstos no cronograma e no orçamento.", base: "OT-IBR 001/2006 R2026, Tabelas 6 e 7", crit: "importante", aplica: { all: [SANEAMENTO, { any: [{ se: "saneamento.eta" }, { se: "saneamento.ete" }, { se: "saneamento.elevatorias" }] }] } },

      { id: "E7.170", etapa: "E7", grupo: "Infraestrutura urbana", titulo: "Projeto urbanístico e paisagístico", desc: "Desenho urbano, pavimentações, áreas verdes, mobiliário e drenagem superficial.", base: "Lei 10.257/2001; normas municipais", crit: "critico", aplica: { all: [URBANA, { se: "urbana.urbanizacao" }] } },
      { id: "E7.171", etapa: "E7", grupo: "Infraestrutura urbana", titulo: "Contenção de encostas", desc: "Solução de estabilização com drenagem e monitoramento.", base: "NBR 11682", crit: "critico", aplica: { all: [URBANA, { se: "urbana.contencao" }] } },
      { id: "E7.172", etapa: "E7", grupo: "Infraestrutura urbana", titulo: "Iluminação pública", desc: "Níveis de iluminância, eficiência energética e manutenção.", base: "NBR 5101", crit: "critico", aplica: { all: [URBANA, { se: "urbana.iluminacao" }] } },
      { id: "E7.173", etapa: "E7", grupo: "Infraestrutura urbana", titulo: "Equipamentos de lazer e playgrounds", desc: "Brinquedos, pisos de segurança e áreas de queda.", base: "NBR 16071", crit: "importante", aplica: { all: [URBANA, { se: "urbana.urbanizacao" }] } },
      { id: "E7.174", etapa: "E7", grupo: "Infraestrutura urbana", titulo: "Acessibilidade em espaços públicos", desc: "Rotas acessíveis, rampas, rebaixamentos e sinalização tátil.", base: "NBR 9050; NBR 16537; Lei 13.146/2015", crit: "critico", aplica: URBANA },
      { id: "E7.175", etapa: "E7", grupo: "Infraestrutura urbana", titulo: "Drenagem associada à intervenção", desc: "Captação e condução das águas pluviais da área tratada.", base: "Manual de drenagem do órgão", crit: "importante", aplica: URBANA },

      /* ============================ E9 ============================ */
      { id: "E9.01", etapa: "E9", grupo: "E9.1 Mapa de riscos", titulo: "Mapa de riscos elaborado", desc: "Ao menos um evento identificado, analisado e registrado no mapa.", base: "Lei 14.133/2021, art. 18, X", crit: "critico", auto: "mapa_existe" },
      { id: "E9.02", etapa: "E9", grupo: "E9.1 Mapa de riscos", titulo: "Mapa abrange riscos ao sucesso da licitação", desc: "Eventos como certame deserto ou fracassado, impugnações, suspensão judicial ou determinação de órgão de controle.", base: "Lei 14.133/2021, art. 18, X", crit: "critico", auto: "mapa_licitacao" },
      { id: "E9.03", etapa: "E9", grupo: "E9.1 Mapa de riscos", titulo: "Mapa abrange riscos de planejamento e de execução", desc: "Eventos da fase preparatória (inclusive riscos de projeto, de orçamento e de demanda) e da execução contratual, além dos riscos do certame.", base: "Lei 14.133/2021, art. 18, X", crit: "importante", auto: "mapa_fases" },
      { id: "E9.04", etapa: "E9", grupo: "E9.1 Mapa de riscos", titulo: "Riscos altos e críticos com tratamento definido", desc: "Medida de tratamento, providência e responsável registrados para cada risco alto ou crítico.", base: "Lei 14.133/2021, art. 18, X", crit: "critico", auto: "mapa_tratamento" },
      { id: "E9.05", etapa: "E9", grupo: "E9.1 Mapa de riscos", titulo: "Medidas dos riscos críticos em andamento ou concluídas", desc: "Providências preventivas iniciadas antes da liberação para licitação.", base: "Lei 14.133/2021, art. 18, X", crit: "importante", auto: "mapa_medidas" },
      { id: "E9.18", etapa: "E9", grupo: "E9.1 Mapa de riscos", titulo: "Revisões de riscos atendidas", desc: "Mapa e matriz revistos após alterações de projeto, orçamento ou dados da obra.", base: "Lei 14.133/2021, art. 18, X", crit: "importante", auto: "revisoes" },
      { id: "E9.19", etapa: "E9", grupo: "E9.1 Mapa de riscos", titulo: "Mapa atualizado após a elaboração do termo de referência", desc: "Revisão final do mapa com as decisões do termo de referência, do orçamento e da minuta, antes da remessa à assessoria jurídica.", base: "Lei 14.133/2021, art. 18, X; no âmbito federal, IN SEGES/MPDG 5/2017, art. 26, §1º (lista de verificação da AGU, item 16)", crit: "importante" },
      { id: "E9.06", etapa: "E9", grupo: "E9.2 Matriz de riscos", titulo: "Matriz de riscos elaborada", desc: "Obrigatória em obras de grande vulto e nos regimes de contratação integrada e semi-integrada; facultativa nos demais casos.", base: "Lei 14.133/2021, art. 22, caput e §3º, e art. 103", crit: "importante", auto: "matriz_existe", ajustes: [crit("critico", { se: "matrizObrigatoria" })] },
      { id: "E9.07", etapa: "E9", grupo: "E9.2 Matriz de riscos", titulo: "Alocação e mecanismo de tratamento definidos", desc: "Cada risco com responsável (contratante, contratado ou compartilhado) e mecanismo vinculado.", base: "Lei 14.133/2021, art. 22, §1º, e art. 103, caput", crit: "critico", auto: "matriz_alocacao", aplica: MATRIZ_EM_USO },
      { id: "E9.08", etapa: "E9", grupo: "E9.2 Matriz de riscos", titulo: "Cláusula contratual correspondente indicada", desc: "O contrato deve refletir a alocação realizada pela matriz.", base: "Lei 14.133/2021, art. 22, §2º, e art. 92, IX", crit: "critico", auto: "matriz_clausula", aplica: MATRIZ_EM_USO },
      { id: "E9.09", etapa: "E9", grupo: "E9.2 Matriz de riscos", titulo: "Escopo restrito ao equilíbrio econômico-financeiro", desc: "Somente eventos supervenientes à assinatura que possam impactar o equilíbrio econômico-financeiro do contrato.", base: "Lei 14.133/2021, art. 6º, XXVII, a, e arts. 22 e 103", crit: "critico", auto: "matriz_escopo", aplica: MATRIZ_EM_USO },
      { id: "E9.10", etapa: "E9", grupo: "E9.2 Matriz de riscos", titulo: "Riscos relevantes do mapa refletidos na matriz", desc: "Riscos altos ou críticos do mapa que afetam o equilíbrio do contrato têm correspondência na matriz.", base: "Lei 14.133/2021, art. 22, §1º", crit: "importante", auto: "matriz_cobertura", aplica: MATRIZ_EM_USO },
      { id: "E9.11", etapa: "E9", grupo: "E9.2 Matriz de riscos", titulo: "Riscos do contratado quantificados no valor estimado", desc: "Reflexo dos riscos atribuídos ao contratado no valor estimado (taxa de risco).", base: "Lei 14.133/2021, art. 22, caput, e art. 103, §3º", crit: "importante", auto: "matriz_orcamento", aplica: MATRIZ_EM_USO },
      { id: "E9.12", etapa: "E9", grupo: "E9.2 Matriz de riscos", titulo: "Riscos seguráveis transferidos ao contratado", desc: "Riscos com cobertura oferecida por seguradoras alocados preferencialmente ao contratado.", base: "Lei 14.133/2021, art. 103, §2º", crit: "importante", auto: "matriz_seguro", aplica: MATRIZ_EM_USO },
      { id: "E9.13", etapa: "E9", grupo: "E9.2 Matriz de riscos", titulo: "Frações com liberdade de inovação (obrigações de resultado)", desc: "Frações do objeto em que o contratado poderá inovar em soluções metodológicas ou tecnológicas.", base: "Lei 14.133/2021, art. 6º, XXVII, b", crit: "critico", aplica: { regime: ["integrada", "semi"] } },
      { id: "E9.14", etapa: "E9", grupo: "E9.2 Matriz de riscos", titulo: "Frações sem liberdade de inovação (obrigações de meio)", desc: "Frações em que a execução deve aderir à solução predefinida no projeto básico.", base: "Lei 14.133/2021, art. 6º, XXVII, c", crit: "importante", aplica: { all: [MATRIZ_EM_USO, { not: { regime: ["integrada"] } }] } },
      { id: "E9.15", etapa: "E9", grupo: "E9.2 Matriz de riscos", titulo: "Matriz compatível com a minuta contratual", desc: "Conferência entre cada risco alocado e as cláusulas da minuta.", base: "Lei 14.133/2021, art. 22, §2º, e art. 92, IX", crit: "critico", aplica: MATRIZ_EM_USO },
      { id: "E9.16", etapa: "E9", grupo: "E9.2 Matriz de riscos", titulo: "Desapropriação em contratação integrada ou semi-integrada", desc: "Responsáveis, indenizações, estimativa de valor, distribuição de riscos e registro da imissão na posse.", base: "Lei 14.133/2021, art. 46, §4º", crit: "critico", aplica: { all: [{ regime: ["integrada", "semi"] }, DESAPROPRIAR] } },
      { id: "E9.17", etapa: "E9", grupo: "E9.2 Matriz de riscos", titulo: "Matriz concluída com a versão final da minuta", desc: "A matriz só é considerada concluída quando a minuta contratual estiver em versão final.", base: "Lei 14.133/2021, art. 22, §2º", crit: "importante", auto: "matriz_concluida", aplica: MATRIZ_EM_USO },
      /* E9.3: tópicos do termo de justificativas técnicas relevantes (modelo da AGU para obras e serviços de engenharia) */
      { id: "E9.20", etapa: "E9", grupo: TJTR, titulo: "1. Enquadramento do objeto", desc: "Classificação justificada como obra ou serviço de engenharia e, no caso de serviço, como comum ou especial. O enquadramento define, por exemplo, o cabimento do pregão.", base: "Lei 14.133/2021, art. 6º, XII e XXI, e art. 29, parágrafo único", crit: "critico" },
      { id: "E9.21", etapa: "E9", grupo: TJTR, titulo: "2. Regime de execução", desc: "Regime adotado entre os do art. 46, com justificativa técnica baseada no nível de definição do projeto e na natureza do objeto (refletido em E11.11).", base: "Lei 14.133/2021, art. 18, VII, e art. 46", crit: "importante" },
      { id: "E9.22", etapa: "E9", grupo: TJTR, titulo: "2. Subestimativas e superestimativas técnicas relevantes", desc: "Em empreitada por preço global ou integral, declarar se o projeto básico definiu as subestimativas e superestimativas relevantes e os parâmetros adotados, ou justificar por que não as definiu.", base: "Acórdão 1.977/2013-TCU-Plenário; Lei 14.133/2021, art. 46, II e III", crit: "importante", aplica: { regime: ["global", "integral"] } },
      { id: "E9.23", etapa: "E9", grupo: TJTR, titulo: "3. Responsabilidade técnica pelas peças técnicas", desc: "Projeto básico e demais documentos técnicos, inclusive planilhas orçamentárias, elaborados por profissional habilitado de engenharia, arquitetura ou técnico industrial, com ART, RRT ou TRT (E6.13); ausências justificadas.", base: "Lei 6.496/1977, arts. 1º e 2º; Lei 12.378/2010, art. 45; Lei 13.639/2018; Decreto 7.983/2013, art. 10", crit: "importante" },
      { id: "E9.24", etapa: "E9", grupo: TJTR, titulo: "4. Custos unitários de referência", desc: "Ordem de parâmetros do art. 23, §2º, observada; custos iguais ou inferiores aos do SINAPI ou do SICRO ou, se superiores, justificados em relatório técnico; fontes usadas para itens sem referência citadas e juntadas aos autos.", base: "Lei 14.133/2021, art. 23, §§ 2º e 3º; Decreto 7.983/2013, arts. 3º e 4º (recursos da União)", crit: "importante" },
      { id: "E9.25", etapa: "E9", grupo: TJTR, titulo: "5. Orçamento detalhado em planilhas", desc: "Planilhas sintética e analítica juntadas, com documento de responsabilidade técnica, elaboradas com as tabelas de referência mais atualizadas.", base: "Lei 14.133/2021, art. 18, IV; Decreto 7.983/2013, art. 10", crit: "importante" },
      { id: "E9.26", etapa: "E9", grupo: TJTR, titulo: "6. Composições de custos unitários", desc: "Composições do SINAPI sem adaptação, adaptadas com relatório técnico ou próprias de fontes admitidas, juntadas aos autos para conhecimento dos licitantes.", base: "Decreto 7.983/2013, art. 8º; Lei 14.133/2021, art. 23, §2º", crit: "importante" },
      { id: "E9.27", etapa: "E9", grupo: TJTR, titulo: "7. Custos diretos e administração local", desc: "Custos diretos restritos ao que é identificável e mensurável na planilha; administração local nos parâmetros do Acórdão 2.622/2013, com o quartil adotado justificado, e paga proporcionalmente à execução no cronograma, não em percentuais fixos.", base: "Acórdão 2.622/2013-TCU-Plenário", crit: "importante" },
      { id: "E9.28", etapa: "E9", grupo: TJTR, titulo: "8. Curvas ABC de serviços e de insumos", desc: "Declaração de juntada das curvas ABC (E10.10) ou justificativa da ausência.", base: "TCU, Orientações para elaboração de planilhas orçamentárias de obras públicas (2014)", crit: "importante" },
      { id: "E9.29", etapa: "E9", grupo: TJTR, titulo: "9. Regime de desoneração", desc: "Custos de referência desonerados ou não desonerados, conforme a opção mais vantajosa demonstrada em simulação juntada aos autos (E10.21).", base: "Parecer 44/2019/DECOR/CGU/AGU; Lei 12.546/2011; Lei 14.973/2024", crit: "importante" },
      { id: "E9.30", etapa: "E9", grupo: TJTR, titulo: "10. Composição do BDI", desc: "Administração central, seguro e garantia, risco, despesa financeira e lucro nos quartis do Acórdão 2.622/2013, com justificativa quando diferentes do médio ou acima do 3º quartil (E10.07).", base: "Acórdão 2.622/2013-TCU-Plenário", crit: "importante" },
      { id: "E9.31", etapa: "E9", grupo: TJTR, titulo: "11. BDI reduzido de materiais e equipamentos", desc: "Decisão justificada sobre a adoção de BDI reduzido para fornecimentos relevantes e o quartil adotado (E10.08).", base: "Súmula TCU 253; Acórdão 2.622/2013-TCU-Plenário", crit: "importante" },
      { id: "E9.32", etapa: "E9", grupo: TJTR, titulo: "12. Cronograma físico-financeiro", desc: "Cronograma juntado aos autos; no preço global, etapas definidas com clareza para guiar a aceitabilidade dos preços e os pagamentos (E6.10 e eventograma, quando exigido).", base: "Lei 14.133/2021, art. 46, §9º", crit: "importante" },
      { id: "E9.33", etapa: "E9", grupo: TJTR, titulo: "13. Projeto executivo", desc: "Projetos executivos elaborados e divulgados com o edital ou, se atribuídos ao contratado com custos na planilha, atestado de que o projeto básico tem detalhamento suficiente para elaborá-los.", base: "Lei 14.133/2021, art. 46, §§ 1º e 6º", crit: "importante", aplica: PE_PELA_ADMINISTRACAO },
      { id: "E9.34", etapa: "E9", grupo: TJTR, titulo: "14. Qualificação técnica", desc: "Registro da empresa no CREA, CAU ou CRT; parcelas de maior relevância e quantitativos mínimos (técnico-operacional); aceitação ou vedação do somatório de atestados; capacidade técnico-profissional e, excepcionalmente, quantitativos em ART ou RRT; instalações, aparelhamento e pessoal (E11.13).", base: "Lei 14.133/2021, art. 67, e art. 18, IX", crit: "importante" },
      { id: "E9.35", etapa: "E9", grupo: TJTR, titulo: "15. Vistoria", desc: "Vistoria facultativa ou obrigatória e possibilidade de substituí-la por declaração de pleno conhecimento das condições de execução, com justificativa (E11.17).", base: "Lei 14.133/2021, art. 63, §§ 2º e 3º", crit: "importante" },
      { id: "E9.36", etapa: "E9", grupo: TJTR, titulo: "16. Subcontratação", desc: "Admissão ou não da subcontratação parcial, com condições e justificativas técnicas (E11.16).", base: "Lei 14.133/2021, art. 122", crit: "importante" },
      { id: "E9.37", etapa: "E9", grupo: TJTR, titulo: "17. Capital ou patrimônio líquido mínimo", desc: "Exigência de capital mínimo ou de patrimônio líquido mínimo e percentual adotado, limitado a 10% do valor estimado, com justificativa (E11.14).", base: "Lei 14.133/2021, art. 69, §4º", crit: "importante" },
      { id: "E9.38", etapa: "E9", grupo: TJTR, titulo: "18. Participação de consórcios", desc: "Permissão (que dispensa justificativa) ou vedação justificada da participação de consórcios (E11.15).", base: "Lei 14.133/2021, art. 15", crit: "importante" },
      { id: "E9.39", etapa: "E9", grupo: TJTR, titulo: "19. Participação de cooperativas", desc: "Permissão ou vedação justificada da participação de cooperativas (E11.15).", base: "Lei 14.133/2021, art. 16", crit: "importante" },
      { id: "E9.40", etapa: "E9", grupo: TJTR, titulo: "20. Garantia da execução", desc: "Exigência ou dispensa justificada da garantia de execução contratual (E11.18).", base: "Lei 14.133/2021, arts. 96 a 102", crit: "importante" },
      { id: "E9.41", etapa: "E9", grupo: TJTR, titulo: "21. Sustentabilidade", desc: "Critérios e práticas sustentáveis definidos de forma objetiva, preservada a competitividade; normas de acessibilidade verificadas; alinhamento ao Plano de Logística Sustentável; ou justificativa para não adotá-los (E11.28).", base: "Lei 14.133/2021, arts. 5º e 11, IV; Lei 13.146/2015; Decreto 6.949/2009", crit: "importante" },
      { id: "E9.42", etapa: "E9", grupo: TJTR, titulo: "Termo assinado por profissional habilitado e juntado aos autos", desc: "Todos os tópicos analisados e preenchidos com justificativa técnica concreta, assinatura de profissional habilitado (CREA, CAU ou CFT) e juntada antes da remessa à assessoria jurídica. A ausência pode levar à devolução dos autos ou a ressalvas no parecer.", base: "Modelo de termo de justificativas técnicas relevantes da AGU (obras e serviços de engenharia); lista de verificação da AGU, item 13; Lei 14.133/2021, art. 53", crit: "importante", ajustes: [crit("critico", FEDERAL)], encerraGrupo: true },

      /* ============================ E10 ============================ */
      { id: "E10.01", etapa: "E10", grupo: "Composição do orçamento", titulo: "Planilha sintética e composições de custo unitário", desc: "Orçamento sintético e analítico, com composições de custo unitário de todos os serviços, inclusive auxiliares, e a fonte de cada composição explicitada.", base: "Lei 14.133/2021, art. 18, IV", crit: "critico", aplica: NAO_INTEGRADA },
      { id: "E10.02", etapa: "E10", grupo: "Composição do orçamento", titulo: "Estimativa nos regimes integrado e semi-integrado", desc: "Orçamento sintético balizado em SINAPI ou SICRO; métodos expeditos ou paramétricos só para frações não detalhadas; parcela de risco, se adotada.", base: "Lei 14.133/2021, art. 23, §5º", crit: "critico", aplica: { regime: ["integrada", "semi"] } },
      { id: "E10.20", etapa: "E10", grupo: "Composição do orçamento", titulo: "Orçamentos por edificação, etapa ou trecho, com consolidação e resumo", desc: "Em empreendimentos com várias edificações, etapas, parcelas ou trechos: orçamento sintético de cada parte, planilha orçamentária de consolidação e orçamento resumido com os subtotais.", base: "TCU, Orientações para elaboração de planilhas orçamentárias de obras públicas (2014); lista de verificação da AGU, itens 31 a 33", crit: "importante" },
      { id: "E10.09", etapa: "E10", grupo: "Composição do orçamento", titulo: "Administração local e canteiro na planilha", desc: "Administração local, canteiro e mobilização discriminados como custos diretos, e não no BDI.", base: "Acórdão 2.622/2013-TCU-Plenário", crit: "importante" },
      { id: "E10.12", etapa: "E10", grupo: "Composição do orçamento", titulo: "Quantitativos do orçamento conferidos com o projeto", desc: "Rastreabilidade entre planilha, memórias de cálculo e desenhos.", base: "Lei 14.133/2021, art. 6º, XXV, f", crit: "critico" },
      { id: "E10.11", etapa: "E10", grupo: "Composição do orçamento", titulo: "Pesquisa de preços de materiais e equipamentos sem referência", desc: "Pesquisa restrita a materiais e equipamentos específicos, preferencialmente com no mínimo três cotações válidas, data e memória; vedada a cotação de serviços completos (empreitada).", base: "Lei 14.133/2021, art. 23, §§ 1º e 2º, II a IV; OT-IBR 001/2006 R2026, item 8", crit: "importante" },
      { id: "E10.10", etapa: "E10", grupo: "Composição do orçamento", titulo: "Curvas ABC de serviços e de insumos", desc: "Curvas ABC da planilha de consolidação, para conferência dos itens de maior peso em preços e quantidades.", base: "TCU, Orientações para elaboração de planilhas orçamentárias de obras públicas (2014)", crit: "importante" },
      { id: "E10.13", etapa: "E10", grupo: "Composição do orçamento", titulo: "Cronograma de desembolso compatível com o orçamento", desc: "Desembolso por etapa coerente com a programação financeira, sem pagamentos antecipados em relação ao avanço físico.", base: "Lei 14.133/2021, art. 18, caput", crit: "critico" },
      { id: "E10.18", etapa: "E10", grupo: "Composição do orçamento", titulo: "Eventograma (eventos geradores de pagamento)", desc: "Tabela de eventos geradores de pagamento vinculados às etapas do cronograma físico-financeiro e a metas de resultado, com critério objetivo de aferição e percentual ou valor de cada evento. Nesses regimes, é vedada a remuneração por preços unitários ou por quantidades de itens unitários.", base: "Lei 14.133/2021, art. 46, §9º, e art. 6º, XXIII, g", crit: "critico", aplica: PRECO_GLOBAL },
      { id: "E10.23", etapa: "E10", grupo: "Composição do orçamento", titulo: "Conteúdo mínimo da planilha orçamentária e das composições", desc: "Planilha com código e fonte de cada composição, BDI por serviço, datas-base e identificação do responsável técnico; composições com coeficientes e preços dos insumos.", base: "OT-IBR 001/2006 R2026, itens 8.2 e 8.3; Decreto 7.983/2013, art. 10", crit: "importante", aplica: NAO_INTEGRADA },
      { id: "E10.24", etapa: "E10", grupo: "Composição do orçamento", titulo: "Sem itens genéricos (verba) ou desprovidos de quantitativos", desc: "Todos os serviços com unidade de medida e quantidade aferível; vedadas apropriações genéricas ou imprecisas.", base: "Lei 14.133/2021, art. 6º, XXV, f; OT-IBR 001/2006 R2026, item 8", crit: "importante" },
      { id: "E10.03", etapa: "E10", grupo: "Referências e parâmetros", titulo: "Fontes de preço na ordem do art. 23, §2º", desc: "SINAPI ou SICRO; pesquisa em mídia especializada e tabelas oficiais; contratações similares; base de notas fiscais. Fora dessa ordem, comprovar a inviabilidade dos parâmetros precedentes.", base: "Lei 14.133/2021, art. 23, §2º", crit: "critico" },
      { id: "E10.19", etapa: "E10", grupo: "Referências e parâmetros", titulo: "Manifestação técnica sobre a metodologia de custos", desc: "Nota do setor competente com a análise e a justificativa da metodologia de obtenção dos custos global e unitários de referência.", base: "Lei 14.133/2021, art. 23, §2º; lista de verificação da AGU, itens 28 a 30", crit: "importante" },
      { id: "E10.04", etapa: "E10", grupo: "Referências e parâmetros", titulo: "Sistema de custos do ente, quando adotado", desc: "Estados e municípios sem recursos da União podem usar sistema de custos próprio.", base: "Lei 14.133/2021, art. 23, §3º", crit: "recomendado", aplica: { all: [{ nao: "recursosUniao" }, { campo: "esfera", op: "ne", valor: "federal" }] } },
      { id: "E10.05", etapa: "E10", grupo: "Referências e parâmetros", titulo: "Data-base definida e atualizada", desc: "Data-base informada e compatível com a data prevista para a licitação.", base: "Lei 14.133/2021, art. 25, §7º (vínculo do reajuste à data do orçamento)", crit: "critico", auto: "orc_database" },
      { id: "E10.06", etapa: "E10", grupo: "Referências e parâmetros", titulo: "Encargos sociais definidos", desc: "Demonstrativo analítico dos encargos sociais da mão de obra horista e mensalista, com ou sem desoneração, coerente com a legislação vigente e com a transição da CPRB.", base: "Lei 14.973/2024; referenciais SINAPI/SICRO", crit: "importante" },
      { id: "E10.21", etapa: "E10", grupo: "Referências e parâmetros", titulo: "Simulação da desoneração da folha (CPRB)", desc: "Demonstrativo da opção mais vantajosa entre custos com e sem desoneração, considerada a reoneração gradual prevista para o período de execução.", base: "Parecer 44/2019/DECOR/CGU/AGU; Lei 12.546/2011, com a transição da Lei 14.973/2024", crit: "importante" },
      { id: "E10.07", etapa: "E10", grupo: "Referências e parâmetros", titulo: "BDI detalhado e justificado", desc: "Composição analítica com administração central, riscos, seguros, garantias, despesas financeiras, lucro e tributos, sem parcela genérica de contingência para incertezas do projeto.", base: "Acórdão 2.622/2013-TCU-Plenário", crit: "critico", auto: "orc_bdi" },
      { id: "E10.08", etapa: "E10", grupo: "Referências e parâmetros", titulo: "BDI diferenciado para fornecimentos relevantes", desc: "Taxa reduzida para materiais e equipamentos de natureza específica com peso significativo no preço.", base: "Súmula TCU 253", crit: "importante" },
      { id: "E10.16", etapa: "E10", grupo: "Referências e parâmetros", titulo: "Riscos altos e críticos considerados no orçamento", desc: "Taxa de risco ou provisão compatível com os riscos alocados ao contratado.", base: "Lei 14.133/2021, art. 22, caput, e art. 103, §3º", crit: "importante", auto: "orc_riscos" },
      { id: "E10.17", etapa: "E10", grupo: "Referências e parâmetros", titulo: "Efeitos da reforma tributária no período de execução", desc: "Composição dos tributos no BDI e no fluxo de preços durante a transição para IBS e CBS.", base: "LC 214/2025; Lei 14.133/2021, art. 134", crit: "importante" },
      { id: "E10.14", etapa: "E10", grupo: "Sigilo e adequação orçamentária", titulo: "Decisão sobre sigilo e momento de divulgação do orçamento", desc: "Motivação do caráter sigiloso, se adotado, e do momento de divulgação.", base: "Lei 14.133/2021, art. 24 e art. 18, XI", crit: "critico" },
      { id: "E10.15", etapa: "E10", grupo: "Sigilo e adequação orçamentária", titulo: "Adequação orçamentária e indicação dos créditos", desc: "Créditos para as parcelas do exercício e previsão no PPA quando plurianual.", base: "Lei 14.133/2021, art. 150 e art. 105", crit: "critico" },
      { id: "E10.22", etapa: "E10", grupo: "Sigilo e adequação orçamentária", titulo: "Declaração do ordenador de despesa", desc: "Declaração de que a despesa tem previsão de recursos orçamentários que assegurem o pagamento das obrigações no exercício e, se a execução for plurianual, de compatibilidade com o PPA.", base: "CF, art. 167, II; Lei 14.133/2021, art. 6º, XXIII, j, e art. 18, caput; lista de verificação da AGU, itens 7 e 8", crit: "importante" },

      /* ============================ E11 ============================ */
      { id: "E11.01", etapa: "E11", grupo: "Elementos do termo de referência (art. 6º, XXIII)", titulo: "a) Definição do objeto", desc: "Natureza (obra ou serviço comum ou especial de engenharia), quantitativos, prazo do contrato e, se for o caso, possibilidade de prorrogação, sem detalhamento excessivo que restrinja a competição. Em obras, a definição do objeto pode se dar por TR, anteprojeto, projeto básico ou executivo (art. 18, II).", base: "Lei 14.133/2021, art. 6º, XXIII, a, e art. 18, II; Acórdão 1.668/2021-TCU-Plenário", crit: "critico" },
      { id: "E11.02", etapa: "E11", grupo: "Elementos do termo de referência (art. 6º, XXIII)", titulo: "b) Fundamentação da contratação", desc: "Referência ao ETP, juntado como apêndice, ou extrato das partes não sigilosas, com a identificação da contratação no PCA publicado no PNCP.", base: "Lei 14.133/2021, art. 6º, XXIII, b", crit: "critico" },
      { id: "E11.03", etapa: "E11", grupo: "Elementos do termo de referência (art. 6º, XXIII)", titulo: "c) Descrição da solução como um todo", desc: "Considerado todo o ciclo de vida do objeto.", base: "Lei 14.133/2021, art. 6º, XXIII, c", crit: "critico" },
      { id: "E11.04", etapa: "E11", grupo: "Elementos do termo de referência (art. 6º, XXIII)", titulo: "d) Requisitos da contratação", desc: "Requisitos técnicos, de sustentabilidade, de qualificação e de execução, inclusive a indicação ou a vedação justificada de marcas (art. 41), certificações motivadas (art. 42) e a exigência de estrutura local, quando imprescindível.", base: "Lei 14.133/2021, art. 6º, XXIII, d", crit: "critico" },
      { id: "E11.05", etapa: "E11", grupo: "Elementos do termo de referência (art. 6º, XXIII)", titulo: "e) Modelo de execução do objeto", desc: "Início a partir da ordem de serviço, etapas e prazos, métodos, local e horários de trabalho, materiais e equipamentos a cargo do contratado, informações para dimensionar a proposta e regras de ordens de serviço, de suspensão e de redução de ritmo.", base: "Lei 14.133/2021, art. 6º, XXIII, e", crit: "critico" },
      { id: "E11.06", etapa: "E11", grupo: "Elementos do termo de referência (art. 6º, XXIII)", titulo: "f) Modelo de gestão do contrato", desc: "Atores da fiscalização e suas atribuições, preposto do contratado, protocolo de comunicação e reunião inicial com plano de fiscalização, método de avaliação de conformidade para os recebimentos, diário de obra e verificação da manutenção das condições de habilitação.", base: "Lei 14.133/2021, art. 6º, XXIII, f, e arts. 117 e 118", crit: "critico" },
      { id: "E11.07", etapa: "E11", grupo: "Elementos do termo de referência (art. 6º, XXIII)", titulo: "g) Critérios de medição e de pagamento", desc: "Nos regimes de preço global, integral, tarefa, integrada e semi-integrada, medição por etapas do cronograma vinculadas a metas de resultado, conforme o eventograma (E10.18); no preço unitário, pelas quantidades executadas, com memória de cálculo.", base: "Lei 14.133/2021, art. 6º, XXIII, g, e art. 46, §9º", crit: "critico" },
      { id: "E11.08", etapa: "E11", grupo: "Elementos do termo de referência (art. 6º, XXIII)", titulo: "h) Forma e critérios de seleção do fornecedor", desc: "Modalidade, critério de julgamento e requisitos de habilitação.", base: "Lei 14.133/2021, art. 6º, XXIII, h", crit: "critico" },
      { id: "E11.09", etapa: "E11", grupo: "Elementos do termo de referência (art. 6º, XXIII)", titulo: "i) Estimativas do valor da contratação", desc: "Preços unitários referenciais, memórias de cálculo e documentos de suporte, considerados os riscos alocados na matriz; quando sigiloso, em documento classificado, divulgado após o julgamento.", base: "Lei 14.133/2021, art. 6º, XXIII, i, e art. 24", crit: "critico" },
      { id: "E11.10", etapa: "E11", grupo: "Elementos do termo de referência (art. 6º, XXIII)", titulo: "j) Adequação orçamentária", desc: "Dotação (unidade gestora, fonte, programa de trabalho, elemento de despesa e plano interno) e compatibilidade com as leis orçamentárias; dotações dos exercícios seguintes indicadas por apostilamento.", base: "Lei 14.133/2021, art. 6º, XXIII, j", crit: "critico" },
      { id: "E11.47", etapa: "E11", grupo: "Conteúdo complementar do termo de referência", titulo: "Normas técnicas e legais aplicáveis ao objeto", desc: "Relação das normas que disciplinam a execução, os materiais e a operação do objeto, como as da ABNT, dos órgãos reguladores e das concessionárias.", base: "Lei 14.133/2021, art. 6º, XXIII, d; TCU, tópicos do termo de referência", crit: "importante" },
      { id: "E11.48", etapa: "E11", grupo: "Conteúdo complementar do termo de referência", titulo: "Obrigações do contratante e do contratado", desc: "Deveres das partes na execução, inclusive liberação de áreas e frentes, fornecimento de informações, documentação e regularidade do contratado.", base: "Lei 14.133/2021, art. 92; modelo de termo de referência da AGU", crit: "importante" },
      { id: "E11.49", etapa: "E11", grupo: "Conteúdo complementar do termo de referência", titulo: "Forma de adjudicação e parcelamento do objeto", desc: "Adjudicação por item, lote ou preço global coerente com a análise de parcelamento do ETP; objeto divisível licitado por itens sempre que não houver prejuízo ao conjunto nem perda de escala.", base: "Lei 14.133/2021, art. 18, §1º, VIII; Súmula TCU 247", crit: "importante" },
      { id: "E11.50", etapa: "E11", grupo: "Conteúdo complementar do termo de referência", titulo: "Projetos elaborados pelo contratado: produtos, prazos, aprovação e remuneração", desc: "Quando o contratado elaborar projeto básico ou executivo: produtos a entregar, prazos de elaboração e de análise pela Administração no cronograma, aprovação antes de cada etapa da obra e remuneração dos projetos com critérios de medição.", base: "Lei 14.133/2021, art. 46, §§ 1º, 3º e 6º; OT-IBR 001/2006 R2026, item 9", crit: "importante", ajustes: [crit("critico", { regime: ["integrada", "semi"] })] },
      { id: "E11.51", etapa: "E11", grupo: "Conteúdo complementar do termo de referência", titulo: "Orçamento detalhado a ser apresentado pelo contratado", desc: "Na contratação integrada, com o projeto básico; na semi-integrada, antes do projeto executivo. O orçamento aprovado substitui o sintético como referência para a fiscalização.", base: "Lei 14.133/2021, art. 23, §5º; OT-IBR 001/2006 R2026, item 8.1", crit: "importante", aplica: { regime: ["integrada", "semi"] } },
      { id: "E11.52", etapa: "E11", grupo: "Conteúdo complementar do termo de referência", titulo: "Convivência com a unidade em funcionamento", desc: "Faseamento, horários, isolamento de áreas, acessos e segurança dos usuários, com as providências da Administração para adequar o ambiente e seus responsáveis.", base: "Lei 14.133/2021, art. 6º, XXIII, e; TCU, tópicos do termo de referência", crit: "importante", aplica: { all: [EDIF, { se: "edif.emUso" }] } },
      { id: "E11.53", etapa: "E11", grupo: "Conteúdo complementar do termo de referência", titulo: "Contrato de eficiência: economia estimada, remuneração e penalidades", desc: "Parâmetros para medir a economia gerada, base de cálculo da remuneração do contratado e consequências do não atingimento da economia contratada.", base: "Lei 14.133/2021, art. 6º, LIII, e art. 39", crit: "critico", aplica: { campo: "contratacao.criterio", op: "eq", valor: "maior_retorno" } },
      { id: "E11.54", etapa: "E11", grupo: "Conteúdo complementar do termo de referência", titulo: "Requisitos de troca de informação (EIR) e caderno de encargos BIM", desc: "Exigências da Administração para os modelos: nível de necessidade de informação, diretrizes de modelagem, nomenclatura, matriz de responsabilidades e ambiente comum de dados.", base: "Lei 14.133/2021, art. 19, §3º; Decreto 11.888/2024; NBR ISO 19650; OT-IBR 001/2006 R2026, item 14", crit: "critico", aplica: BIM },
      { id: "E11.55", etapa: "E11", grupo: "Conteúdo complementar do termo de referência", titulo: "Plano de execução BIM (PEB) e ambiente comum de dados (CDE)", desc: "Exigência de plano de execução BIM pelo contratado, com o fluxo de solicitação, validação e aceite dos modelos em ambiente comum de dados.", base: "NBR ISO 19650; OT-IBR 001/2006 R2026, item 14", crit: "importante", aplica: BIM },
      { id: "E11.30", etapa: "E11", grupo: "Conteúdo complementar do termo de referência", titulo: "Entregáveis em BIM e formato aberto IFC", desc: "Modelos e documentos entregues em formato aberto IFC, com o nível de necessidade de informação definido para cada entrega.", base: "Lei 14.133/2021, art. 19, §3º; OT-IBR 001/2006 R2026, item 14", crit: "importante", aplica: BIM },
      { id: "E11.11", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Regime de execução definido", desc: "Regime indicado no TR e no edital, coerente com a justificativa do TJTR (E9.21) e com o nível de definição do projeto.", base: "Lei 14.133/2021, art. 18, VII, e art. 46", crit: "critico" },
      { id: "E11.12", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Modalidade, critério de julgamento e modo de disputa", desc: "Combinação de parâmetros apta a gerar a contratação mais vantajosa: forma eletrônica, modo de disputa, intervalo mínimo entre lances e, quando mensuráveis, custos do ciclo de vida no julgamento (art. 34).", base: "Lei 14.133/2021, art. 18, VIII, art. 17, §2º, e art. 34", crit: "critico" },
      { id: "E11.56", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Prazo mínimo entre a divulgação do edital e as propostas", desc: "Prazo em dias úteis conforme o enquadramento do objeto, o critério de julgamento e o regime de execução; alterações que afetem as propostas exigem nova divulgação e reabertura do prazo.", base: "Lei 14.133/2021, art. 55", crit: "importante", ajuda: "prazoArt55" },
      { id: "E11.57", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Técnica e preço motivado e critérios de pontuação", desc: "Critérios objetivos de pontuação das propostas técnicas e ponderação entre técnica e preço, com no máximo 70% para a técnica, coerentes com a relevância da qualidade técnica demonstrada no ETP (E4.19).", base: "Lei 14.133/2021, art. 36, §§ 1º e 2º, e art. 18, IX", crit: "critico", aplica: { campo: "contratacao.criterio", op: "eq", valor: "tecnica_preco" } },
      { id: "E11.23", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Critérios de aceitabilidade e de exequibilidade de preços", desc: "Critérios de aceitabilidade dos preços unitários e global, com preços máximos fixados no edital mesmo na empreitada por preço global, análise de exequibilidade e garantia adicional.", base: "Lei 14.133/2021, art. 59, §§ 3º a 5º; Súmula TCU 259; Acórdão 1.695/2018-TCU-Plenário", crit: "critico" },
      { id: "E11.58", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Regras de julgamento e de saneamento de erros nas propostas", desc: "Correção de erros aritméticos e de preenchimento por diligência, sem alterar o valor global proposto, e tratamento de divergências entre preços e composições.", base: "Lei 14.133/2021, arts. 12, III, e 59; Acórdãos 2.742/2017 e 830/2018-TCU-Plenário", crit: "importante" },
      { id: "E11.13", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Qualificação técnica motivada", desc: "Registro no conselho profissional, capacidade técnico-operacional e técnico-profissional nas parcelas de maior relevância (ao menos 4% do total), quantitativos mínimos de até 50%, regra para somatório de atestados e para atestados de consórcio (art. 67, §§ 10 e 11).", base: "Lei 14.133/2021, art. 67, §§ 1º e 2º, e art. 18, IX", crit: "critico" },
      { id: "E11.14", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Qualificação econômico-financeira justificada", desc: "Índices proporcionais ao objeto e, se exigido, capital mínimo ou patrimônio líquido mínimo de até 10% do valor estimado, com a justificativa do TJTR (E9.37).", base: "Lei 14.133/2021, art. 69, §4º, e art. 18, IX", crit: "importante" },
      { id: "E11.32", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Habilitação jurídica, fiscal, social e trabalhista", desc: "Documentos exigidos conforme a natureza do licitante, inclusive consórcios e cooperativas, e comprovação da regularidade fiscal, social e trabalhista.", base: "Lei 14.133/2021, arts. 66 e 68", crit: "importante" },
      { id: "E11.15", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Participação de consórcios e de cooperativas", desc: "Admissão ou vedação justificada de consórcios e regras para a participação de cooperativas.", base: "Lei 14.133/2021, arts. 15 e 16, e art. 18, IX", crit: "importante" },
      { id: "E11.16", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Subcontratação: limites e condições", desc: "Parcelas passíveis de subcontratação e limite percentual, vedação da parcela principal, autorização prévia com comprovação da capacidade técnica do subcontratado, documentação exigida, vedações de vínculo e eventual pagamento direto.", base: "Lei 14.133/2021, art. 122", crit: "importante" },
      { id: "E11.33", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Tratamento diferenciado a microempresas e empresas de pequeno porte", desc: "Benefícios da LC 123/2006, como a participação exclusiva até R$ 80 mil, a subcontratação de ME e EPP, o empate ficto e a prioridade a empresas sediadas local ou regionalmente, quando justificada, ou motivação para não aplicá-los (art. 49). Não se aplicam quando o valor estimado supera a receita bruta máxima de EPP.", base: "LC 123/2006, arts. 44 a 49; Lei 14.133/2021, art. 4º, §1º, II", crit: "importante", aplica: { se: "beneficioMeEpp" } },
      { id: "E11.17", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Vistoria prévia com declaração substitutiva", desc: "Vistoria facultativa ou obrigatória, em datas e horários distintos para cada interessado; quando exigida, substituição por declaração do responsável técnico e declaração de conhecimento das condições locais.", base: "Lei 14.133/2021, art. 63, §§ 2º e 3º, e art. 67, VI", crit: "importante" },
      { id: "E11.24", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Programa de integridade do vencedor", desc: "Obrigatoriedade de implantação em até seis meses da celebração do contrato.", base: "Lei 14.133/2021, art. 25, §4º", crit: "critico", aplica: { se: "grandeVulto" } },
      { id: "E11.59", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Consulta ou audiência pública, quando conveniente", desc: "Avaliação da conveniência de consulta ou audiência pública sobre a licitação, com antecedência e divulgação adequadas.", base: "Lei 14.133/2021, art. 21", crit: "recomendado", ajustes: [crit("importante", GRANDE_VULTO)] },
      { id: "E11.60", etapa: "E11", grupo: "Seleção do fornecedor e condições de participação", titulo: "Reserva de vagas de mão de obra, quando cabível", desc: "Avaliação de percentual mínimo de mão de obra de mulheres vítimas de violência doméstica e de egressos do sistema prisional.", base: "Lei 14.133/2021, art. 25, §9º", crit: "recomendado" },
      { id: "E11.21", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Prazos de execução e de vigência", desc: "Prazos compatíveis com o cronograma físico-financeiro e com a programação orçamentária, contrato por escopo e regras de prorrogação do prazo de execução.", base: "Lei 14.133/2021, art. 6º, XXIII, a, e arts. 105 e 111", crit: "critico" },
      { id: "E11.18", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Garantias contratuais", desc: "Garantia de proposta, se exigida, e garantia de execução: modalidades (caução, seguro-garantia, fiança bancária ou título de capitalização) e percentual; em grande vulto, seguro-garantia com cláusula de retomada de até 30%; garantia adicional para propostas abaixo de 85% do orçado.", base: "Lei 14.133/2021, arts. 58 e 96 a 102 e art. 59, §5º", crit: "importante" },
      { id: "E11.19", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Índice de reajuste com data-base do orçamento", desc: "Índice específico ou setorial, com data-base vinculada à data do orçamento estimado.", base: "Lei 14.133/2021, art. 25, §7º, e art. 92, §3º", crit: "critico" },
      { id: "E11.37", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Revisão pela reoneração gradual da folha de pagamento", desc: "Com orçamento desonerado, cláusula que admite a revisão do preço, a pedido do contratado e durante a vigência, após a majoração efetiva das alíquotas na transição da CPRB.", base: "Lei 14.133/2021, art. 134 c/c art. 136, I; Lei 12.546/2011, arts. 9º-A e 9º-B, incluídos pela Lei 14.973/2024", crit: "importante", aplica: { campo: "orcamento.encargos", op: "eq", valor: "desonerado" } },
      { id: "E11.38", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Hipóteses de alteração de valores na contratação integrada ou semi-integrada", desc: "Vedação de alterar os valores contratuais, salvo caso fortuito ou força maior, alteração de projeto a pedido da Administração sem erro do contratado, alteração do projeto básico na semi-integrada e evento alocado à Administração na matriz.", base: "Lei 14.133/2021, art. 133", crit: "importante", aplica: { regime: ["integrada", "semi"] } },
      { id: "E11.61", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Preços de serviços novos e manutenção do desconto em aditivos", desc: "Regra para preços de serviços não previstos (relação entre proposta e orçamento-base aplicada aos referenciais da data do aditamento), BDI e fontes, sem redução do desconto global em favor do contratado.", base: "Lei 14.133/2021, arts. 127 e 128", crit: "importante" },
      { id: "E11.20", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Condições de recebimento provisório e definitivo", desc: "Responsáveis, prazos e critérios de aceitação; recebimento provisório por etapa integralmente concluída, com medição prévia, planilha e memória de cálculo.", base: "Lei 14.133/2021, art. 18, III, e art. 140", crit: "critico" },
      { id: "E11.34", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Documentos exigidos para o recebimento definitivo", desc: "Conforme a tipologia: projeto como construído (as built), com preço e prazo definidos quando a cargo do contratado, manuais de operação e manutenção, comprovação das ligações definitivas de água, esgoto, energia, gás e telefonia, laudo de vistoria do Corpo de Bombeiros, habite-se e certidão negativa de débitos previdenciários específica da obra, para averbação no registro de imóveis.", base: "Lei 14.133/2021, art. 140; modelo de termo de referência da AGU (obrigações do contratante)", crit: "importante" },
      { id: "E11.35", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Prazo de garantia da obra e responsabilidade pela solidez", desc: "Responsabilidade objetiva do contratado, por no mínimo cinco anos após o recebimento definitivo, pela solidez e segurança dos materiais e serviços e pela funcionalidade da obra, admitido prazo maior no edital; garantia complementar dos serviços e assistência técnica de equipamentos, quando for o caso.", base: "Lei 14.133/2021, art. 140, §6º; Código Civil, art. 618; Lei 8.078/1990", crit: "importante" },
      { id: "E11.36", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Liquidação, pagamento e retenções", desc: "Periodicidade das medições, prazos de liquidação e de pagamento, documentos de cobrança, retenções tributárias, ordem cronológica de pagamentos, pagamento da parcela incontroversa e atualização monetária por atraso.", base: "Lei 14.133/2021, arts. 92, V e VI, 141 e 143; no âmbito federal, IN SEGES/ME 77/2022", crit: "importante" },
      { id: "E11.39", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Antecipação de pagamento, se prevista", desc: "Somente com sensível economia de recursos ou como condição indispensável, justificada no processo e prevista no edital, com garantia adicional e devolução do valor se o objeto não for executado.", base: "Lei 14.133/2021, art. 145, §§ 1º a 3º", crit: "recomendado" },
      { id: "E11.62", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Remuneração variável vinculada ao desempenho, se prevista", desc: "Metas, padrões de qualidade, critérios de sustentabilidade e prazos que alteram a remuneração, dentro do limite orçamentário fixado.", base: "Lei 14.133/2021, art. 144", crit: "recomendado" },
      { id: "E11.22", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Sanções e critérios de aplicação", desc: "Infrações e sanções com fatos geradores, dosimetria e bases de cálculo justificadas, multa moratória por atraso no início e na execução e tratamento da reincidência.", base: "Lei 14.133/2021, arts. 155 a 163", crit: "importante" },
      { id: "E11.63", etapa: "E11", grupo: "Execução, medição, pagamento e recebimento", titulo: "Meios alternativos de resolução de controvérsias", desc: "Conciliação, mediação, comitê de resolução de disputas ou arbitragem para direitos patrimoniais disponíveis, com regras de escolha e custeio.", base: "Lei 14.133/2021, arts. 151 a 154", crit: "recomendado", ajustes: [crit("importante", GRANDE_VULTO)] },
      { id: "E11.40", etapa: "E11", grupo: "Registro de preços", titulo: "Cabimento do registro de preços para obra ou serviço de engenharia", desc: "Justificativa do uso do sistema de registro de preços, com projeto padronizado, sem complexidade técnica e operacional, e necessidade permanente ou frequente do objeto.", base: "Lei 14.133/2021, art. 85; no âmbito federal, Decreto 11.462/2023, art. 3º", crit: "critico", aplica: SRP },
      { id: "E11.41", etapa: "E11", grupo: "Registro de preços", titulo: "Intenção de registro de preços (IRP)", desc: "Procedimento público de intenção de registro de preços para a participação de outros órgãos, ou justificativa da dispensa quando o gerenciador for o único contratante.", base: "Lei 14.133/2021, art. 86, caput e §1º; no âmbito federal, Decreto 11.462/2023", crit: "importante", aplica: SRP },
      { id: "E11.42", etapa: "E11", grupo: "Registro de preços", titulo: "Minuta da ata de registro de preços", desc: "Minuta anexada aos autos, preferencialmente conforme o modelo padronizado, com as alterações justificadas e destacadas.", base: "Lei 14.133/2021, art. 82, e art. 19, IV e §2º", crit: "critico", aplica: SRP },
      { id: "E11.25", etapa: "E11", grupo: "Minuta contratual", titulo: "Matriz de riscos anexa ao edital e ao contrato", desc: "Matriz de alocação de riscos (E9.2) integrada aos documentos da licitação.", base: "Lei 14.133/2021, art. 22 e art. 92, IX", crit: "importante", ajustes: [crit("critico", { se: "matrizObrigatoria" })] },
      { id: "E11.26", etapa: "E11", grupo: "Minuta contratual", titulo: "Minuta contratual com cláusulas essenciais", desc: "Cláusulas do art. 92, inclusive hipóteses de extinção e direitos das partes, em versão final compatível com o TR e a matriz.", base: "Lei 14.133/2021, art. 92, e art. 18, VI", crit: "critico" },
      { id: "E11.27", etapa: "E11", grupo: "Minuta contratual", titulo: "Responsabilidade por licenciamento e desapropriação", desc: "Definição no edital de quem obtém as licenças e realiza a desapropriação; na contratação integrada ou semi-integrada, providências, responsáveis por fase, indenizações, estimativa e distribuição de riscos (art. 46, §4º).", base: "Lei 14.133/2021, art. 25, §5º, e art. 46, §4º", crit: "critico", aplica: { any: [LICENCIAMENTO, DESAPROPRIAR] } },
      { id: "E11.28", etapa: "E11", grupo: "Minuta contratual", titulo: "Critérios de sustentabilidade e gestão de resíduos", desc: "Critérios definidos com base no Guia Nacional de Contratações Sustentáveis, ou dispensa justificada (TJTR, E9.41); destinação de resíduos, inclusive perigosos, e condicionantes do licenciamento.", base: "Lei 14.133/2021, arts. 5º, 11, IV, e 45; Guia Nacional de Contratações Sustentáveis (AGU)", crit: "importante" },
      { id: "E11.29", etapa: "E11", grupo: "Minuta contratual", titulo: "Seguros obrigatórios definidos", desc: "Seguros previstos no contrato, com custo integrado ao preço.", base: "Lei 14.133/2021, art. 22, §2º, III", crit: "importante" },
      { id: "E11.31", etapa: "E11", grupo: "Minuta contratual", titulo: "Documentos prontos para divulgação simultânea", desc: "Edital, TR, projetos, anteprojeto, minuta e anexos disponíveis na mesma data.", base: "Lei 14.133/2021, art. 25, §3º", crit: "importante" },
      { id: "E11.43", etapa: "E11", grupo: "Instrução do processo", titulo: "Modelos padronizados utilizados ou alterações justificadas", desc: "Uso dos modelos de edital, termo de referência, contrato e ata do ente (no âmbito federal, os da AGU, com a declaração de utilização de modelos) e consulta ao catálogo eletrônico de padronização, quando houver, com as alterações justificadas e destacadas no processo.", base: "Lei 14.133/2021, art. 19, II e IV, e §2º; lista de verificação da AGU, itens 14.1 e 22", crit: "importante" },
      { id: "E11.44", etapa: "E11", grupo: "Instrução do processo", titulo: "Termo de referência elaborado no Sistema TR digital", desc: "Elaboração e registro do termo de referência no sistema eletrônico do governo federal.", base: "IN SEGES/ME 81/2022; lista de verificação da AGU, item 14", crit: "importante", aplica: FEDERAL },
      { id: "E11.45", etapa: "E11", grupo: "Instrução do processo", titulo: "Alinhamento ao Plano de Logística Sustentável", desc: "Certificação de que a contratação está alinhada ao Plano de Gestão de Logística Sustentável do órgão, quando houver.", base: "Decreto 7.746/2012, art. 16 (âmbito federal); lista de verificação da AGU, item 14.2", crit: "recomendado", ajustes: [crit("importante", FEDERAL)] },
      { id: "E11.46", etapa: "E11", grupo: APROVACAO, titulo: "Aprovação do projeto básico e do termo de referência pela autoridade competente", desc: "Ato formal que aprova o projeto básico (ou o anteprojeto, na contratação integrada), o orçamento e o termo de referência em versão final, depois da análise técnica e antes da remessa à assessoria jurídica.", base: "Lei 14.133/2021, art. 11, parágrafo único, e art. 18, II; regulamento do ente (a aprovação do projeto básico pela autoridade competente era exigência expressa da Lei 8.666/1993, art. 7º, §2º, I)", crit: "critico", encerra: ["E5", "E6", "E7", "E9", "E10", "E11"] },

      /* ============================ E12 ============================ */
      { id: "E12.01", etapa: "E12", grupo: "Verificações automáticas", titulo: "Itens críticos das etapas E1 a E11 atendidos ou justificados", desc: "Nenhum item crítico pendente nas etapas anteriores.", base: "Lei 14.133/2021, art. 18", crit: "critico", auto: "gate_itens" },
      { id: "E12.02", etapa: "E12", grupo: "Verificações automáticas", titulo: "Aprovações exigidas antes do edital obtidas", desc: "Inclui a licença prévia quando o licenciamento couber à Administração.", base: "Lei 14.133/2021, art. 115, §4º", crit: "critico", auto: "gate_aprovacoes" },
      { id: "E12.03", etapa: "E12", grupo: "Verificações automáticas", titulo: "Riscos críticos do mapa com tratamento e responsável", desc: "Medidas registradas e iniciadas para os riscos críticos.", base: "Lei 14.133/2021, art. 18, X", crit: "critico", auto: "gate_riscos" },
      { id: "E12.04", etapa: "E12", grupo: "Verificações automáticas", titulo: "Matriz de riscos válida e concluída", desc: "Quando obrigatória, matriz completa, restrita ao equilíbrio e concluída com a minuta final.", base: "Lei 14.133/2021, art. 22, §3º", crit: "critico", auto: "gate_matriz", aplica: { se: "matrizObrigatoria" } },
      { id: "E12.05", etapa: "E12", grupo: "Verificações automáticas", titulo: "Sem inconsistências bloqueantes", desc: "Nenhuma inconsistência de nível impeditivo nos documentos e parâmetros.", base: "Lei 14.133/2021, art. 18", crit: "critico", auto: "gate_inconsistencias" },
      { id: "E12.11", etapa: "E12", grupo: "Atos finais", titulo: "Lista de verificação da AGU preenchida e juntada", desc: "Lista de verificação para obras e serviços de engenharia preenchida pelo órgão e juntada ao processo antes da remessa à assessoria jurídica.", base: "Modelo de lista de verificação da AGU (obras e serviços de engenharia, Lei 14.133/2021)", crit: "importante", aplica: FEDERAL },
      { id: "E12.06", etapa: "E12", grupo: "Atos finais", titulo: "Parecer jurídico (controle prévio de legalidade)", desc: "Análise jurídica da contratação ao final da fase preparatória.", base: "Lei 14.133/2021, art. 53", crit: "critico" },
      { id: "E12.07", etapa: "E12", grupo: "Atos finais", titulo: "Pregoeiro, agente de contratação ou comissão designados", desc: "Ato de designação juntado aos autos: pregoeiro e equipe de apoio, no pregão; agente de contratação ou comissão de contratação, com substitutos, na concorrência; observada a segregação de funções.", base: "Lei 14.133/2021, arts. 7º e 8º", crit: "importante" },

    /* ------------------------- ALERTAS POR TIPOLOGIA ------------------------- */
    alertas: [
      { id: "AT.01", titulo: "Corpo de Bombeiros", texto: "A aprovação do projeto de segurança contra incêndio e pânico é exigida conforme ocupação, área e altura definidas no regulamento estadual (Lei 13.425/2017). Verifique a norma vigente em {uf}.", se: EDIF },
      { id: "AT.02", titulo: "Prefeitura", texto: "Verifique os parâmetros do Plano Diretor e da lei de uso do solo de {municipio}, a aprovação do projeto legal e o alvará de construção. O habite-se, emitido após a conclusão, entra no termo de referência entre os documentos do recebimento definitivo (E11.34).", se: { all: [EDIF, ZONA_URBANA] } },
      { id: "AT.03", titulo: "Responsabilidade técnica", texto: "Cada disciplina de projeto, levantamento e orçamento deve ter ART (CREA) ou RRT (CAU) do respectivo autor." },
      { id: "AT.04", titulo: "Obra viária", texto: "Adote as instruções de projeto do órgão contratante (DNIT, DER ou normas municipais) e o SICRO como referência de custos de infraestrutura de transportes (art. 23, §2º, I).", se: VIARIA },
      { id: "AT.05", titulo: "Estudo ambiental", texto: "A Res. CONAMA 01/1986 (art. 2º, I) relaciona estradas de rodagem com duas ou mais faixas de rolamento entre as atividades sujeitas a EIA/RIMA. Confirme com o órgão ambiental o tipo de estudo exigido.", se: { all: [VIA_RODOVIARIA, { campo: "viaria.faixas", op: "gte", valor: 2 }] } },
      { id: "AT.06", titulo: "Saneamento", texto: "Verifique a compatibilidade com o Plano Municipal ou Regional de Saneamento Básico (Lei 11.445/2007), as normas de referência da ANA, a outorga de recursos hídricos e a licença de operação.", se: SANEAMENTO },
      { id: "AT.07", titulo: "Estabelecimento de saúde", texto: "O projeto físico deve atender à RDC ANVISA 50/2002 e ser aprovado pela vigilância sanitária. Planeje equipamentos, mobiliário e custeio como contratações correlatas.", se: SAUDE },
      { id: "AT.08", titulo: "Edificação escolar", texto: "Dimensione os ambientes pelo número de alunos e pelas etapas de ensino e garanta mobiliário, equipamentos e quadro de pessoal para o funcionamento.", se: ESCOLAR },
      { id: "AT.09", titulo: "Grande vulto", texto: "Valor estimado acima de {grandeVulto}: matriz de riscos obrigatória (art. 22, §3º), programa de integridade do vencedor em até seis meses (art. 25, §4º) e possibilidade de seguro-garantia com cláusula de retomada de até 30% (art. 99).", se: { se: "grandeVulto" } },
      { id: "AT.10", titulo: "Contratação integrada", texto: "Elabore o anteprojeto conforme o art. 6º, XXIV, e o ato do órgão (art. 46, §2º). A matriz de riscos é obrigatória e os riscos da solução de projeto cabem ao contratado (art. 22, §§ 3º e 4º).", se: INTEGRADA },
      { id: "AT.11", titulo: "Contratação semi-integrada", texto: "A Administração entrega o projeto básico; alterações propostas pelo contratado dependem de autorização e transferem a ele os riscos correspondentes (art. 46, §5º). Matriz de riscos obrigatória (art. 22, §3º).", se: SEMI },
      { id: "AT.12", titulo: "Transferência voluntária da União", texto: "Observe o Decreto 11.531/2023 e a Portaria Conjunta MGI/MF/CGU 33/2023: titularidade da área, aceite do projeto pela concedente ou mandatária e uso dos referenciais SINAPI ou SICRO.", se: { campo: "fonte", op: "eq", valor: "uniao_voluntaria" } },
      { id: "AT.13", titulo: "Patrimônio protegido", texto: "Intervenções em bem tombado ou em seu entorno dependem de autorização do órgão de patrimônio (Decreto-Lei 25/1937, arts. 17 e 18).", se: { campo: "local.tombamento", op: "in", valor: ["tombado", "entorno"] } },
      { id: "AT.14", titulo: "Área protegida", texto: "Intervenção em APP só nas hipóteses do Código Florestal (Lei 12.651/2012, art. 8º); em unidade de conservação ou zona de amortecimento, o licenciamento depende de manifestação do órgão gestor (Lei 9.985/2000, art. 36, §3º).", se: { campo: "local.areaProtegida", op: "in", valor: ["app", "uc", "amortecimento"] } },
      { id: "AT.15", titulo: "Edificação em funcionamento", texto: "Preveja faseamento, horários de trabalho, isolamento de áreas e segurança dos usuários no projeto e no termo de referência.", se: { all: [EDIF, { se: "edif.emUso" }] } },
      { id: "AT.16", titulo: "Aeródromo próximo", texto: "Objetos projetados no espaço aéreo dependem de análise do COMAER (Portaria 957/GC3/2015).", se: { any: [{ se: "local.aerodromo" }, { se: "saude.heliponto" }] } },
      { id: "AT.17", titulo: "Desapropriação", texto: "Declaração de utilidade pública, avaliação dos imóveis (NBR 14653) e recursos para indenizações antes do edital. Em contratação integrada ou semi-integrada, siga o art. 46, §4º.", se: DESAPROPRIAR },
      { id: "AT.18", titulo: "Risco geológico", texto: "Investigue a estabilidade e preveja soluções de contenção e drenagem (NBR 11682).", se: { campo: "local.riscoGeologico", op: "in", valor: ["sim", "a_verificar"] } },
      { id: "AT.19", titulo: "Licença prévia antes do edital", texto: "Com o licenciamento a cargo da Administração, a licença prévia ou a manifestação prévia deve ser obtida antes da divulgação do edital (art. 115, §4º).", se: { campo: "licResp", op: "in", valor: ["administracao", "a_verificar"] } },
      { id: "AT.20", titulo: "Licenciamento pelo contratado", texto: "Com o licenciamento atribuído ao contratado (art. 25, §5º, I), registre o risco na matriz e reflita-o no valor estimado.", se: { campo: "licResp", op: "eq", valor: "contratado" } },
      { id: "AT.21", titulo: "Financiamento internacional", texto: "Com recursos de organismo internacional, podem ser admitidas condições e procedimentos do financiador (art. 1º, §3º).", se: { campo: "fonte", op: "eq", valor: "internacional" } },
      { id: "AT.22", titulo: "Execução plurianual", texto: "Verifique a previsão no PPA e a disponibilidade de créditos a cada exercício (art. 105).", se: { campo: "prazoMeses", op: "gt", valor: 12 } },
      { id: "AT.23", titulo: "Regime de preço global", texto: "A escolha do regime deve ser motivada (art. 18, VII). A medição e o pagamento seguem etapas do cronograma vinculadas a metas de resultado (art. 46, §9º), detalhadas no eventograma (E10.18).", se: PRECO_GLOBAL },
      { id: "AT.24", titulo: "Área rural ou remota", texto: "Considere logística, mobilização e sazonalidade no orçamento e no prazo, e o risco de baixa atratividade da licitação.", se: { campo: "local.zona", op: "eq", valor: "rural" } },
      { id: "AT.25", titulo: "Diagnóstico por imagem", texto: "Preveja projeto de blindagem e licenciamento das instalações radiativas (RDC ANVISA 611/2022).", se: { all: [SAUDE, { se: "saude.imagem" }] } },
      { id: "AT.26", titulo: "Referenciais de custo do ente", texto: "Sem recursos da União, além de SINAPI e SICRO, admite-se sistema de custos adotado pelo ente (art. 23, §3º).", se: { all: [{ nao: "recursosUniao" }, { campo: "esfera", op: "in", valor: ["estadual", "distrital", "municipal"] }] } },
      { id: "AT.27", titulo: "Licenciamento a definir", texto: "Defina quem conduzirá o licenciamento ambiental e qual é o enquadramento da atividade; enquanto isso, o sistema trata o licenciamento como responsabilidade da Administração.", se: { campo: "licResp", op: "eq", valor: "a_verificar" } },
      { id: "AT.28", titulo: "Instrução para a assessoria jurídica", texto: "No âmbito federal, junte ao processo o termo de justificativas técnicas relevantes (E9.3) e a lista de verificação da AGU antes da remessa à assessoria jurídica; a ausência pode levar à devolução dos autos ou a ressalvas no parecer.", se: FEDERAL },
      { id: "AT.29", titulo: "Microempresas e empresas de pequeno porte", texto: "Valor estimado até {limiteEpp}: aplicam-se os benefícios da LC 123/2006 (art. 4º, §1º, II, da Lei 14.133/2021), como a participação exclusiva até R$ 80 mil e a subcontratação de ME e EPP, salvo as hipóteses do art. 49 da LC 123/2006.", se: { se: "beneficioMeEpp" } },
      { id: "AT.30", titulo: "Escolha do regime de execução", texto: "O Acórdão 1.977/2013-TCU-Plenário indica a empreitada por preço global quando os quantitativos podem ser definidos com boa precisão no projeto e a empreitada por preço unitário para objetos com imprecisão inerente de quantitativos, como reformas, grandes movimentações de terra, interferências e manutenção rodoviária. Motive a escolha no TJTR (E9.21).", se: { all: [{ regime: ["global", "integral"] }, { any: [{ campo: "natureza", op: "in", valor: ["reforma", "recuperacao"] }, { all: [VIARIA, { campo: "viaria.intervencao", op: "in", valor: ["implantacao", "duplicacao", "restauracao"] }] }, SANEAMENTO] }] } },
