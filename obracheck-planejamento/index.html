<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ObraCheck Planejamento</title>
<meta name="description" content="Acompanhamento da fase preparatória da contratação de obras públicas (Lei 14.133/2021): etapas com portões, exigências por tipologia, aprovações, mapa e matriz de riscos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%2316202a%22%2F%3E%3Cpath%20d%3D%22M3%2019h26%22%20stroke%3D%22%238db4e8%22%20stroke-width%3D%222.2%22%2F%3E%3Ccircle%20cx%3D%227%22%20cy%3D%2219%22%20r%3D%223.6%22%20fill%3D%22%238db4e8%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2219%22%20r%3D%223.6%22%20fill%3D%22%238db4e8%22%2F%3E%3Ccircle%20cx%3D%2225%22%20cy%3D%2219%22%20r%3D%223.4%22%20fill%3D%22%2316202a%22%20stroke%3D%22%23e9eef2%22%20stroke-width%3D%222.2%22%2F%3E%3Cpath%20d%3D%22M20.3%2018.6%2023.6%209%22%20stroke%3D%22%23f08a80%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>
/* =====================================================================
   ObraCheck · Planejamento — estilos
   Papel e nanquim: superfície clara e fria, tinta azul-grafite, vermelho
   reservado a bloqueios e revisões. O elemento marcante é o trilho de
   etapas com portões (E1 a E12).
   ===================================================================== */
:root {
  --papel: #edf0f2;
  --superficie: #ffffff;
  --superficie-2: #f5f7f8;
  --tinta: #16202a;
  --grafite: #52606d;
  --linha: #cad2d9;
  --linha-forte: #8f9ca8;
  --azul: #1e4e8c;
  --azul-texto: #1e4e8c;
  --azul-suave: #e3ecf6;
  --vermelho: #b3261e;
  --vermelho-suave: #f8e3e0;
  --ocre: #9a6206;
  --ocre-suave: #f7ebd3;
  --verde: #2b7a4b;
  --verde-suave: #dff0e5;
  --cinza: #8a949e;
  --cinza-suave: #e8ecef;
  --topo: #16202a;
  --topo-texto: #e9eef2;
  --topo-mudo: #a9b6c2;
  --sombra-modal: 0 18px 48px rgba(16, 24, 32, .28);
  --fonte-titulo: "Bahnschrift", "DIN Alternate", "DIN Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --fonte-texto: "Segoe UI", system-ui, -apple-system, "Roboto", "Helvetica Neue", Arial, sans-serif;
  --raio-p: 3px;
  --raio-m: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #10161c; --superficie: #17202a; --superficie-2: #1c2733; --tinta: #e4eaf0; --grafite: #9aa8b5;
    --linha: #2b3846; --linha-forte: #4a5a6a; --azul: #8db4e8; --azul-texto: #a9c8f0; --azul-suave: #1c2d44;
    --vermelho: #f08a80; --vermelho-suave: #3a1f1f; --ocre: #e4b04f; --ocre-suave: #3a2e16; --verde: #6cc793;
    --verde-suave: #183226; --cinza: #7d8995; --cinza-suave: #222d38; --topo: #0d1319; --topo-texto: #e4eaf0; --topo-mudo: #8c9aa8;
    --sombra-modal: 0 18px 48px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #10161c; --superficie: #17202a; --superficie-2: #1c2733; --tinta: #e4eaf0; --grafite: #9aa8b5;
  --linha: #2b3846; --linha-forte: #4a5a6a; --azul: #8db4e8; --azul-texto: #a9c8f0; --azul-suave: #1c2d44;
  --vermelho: #f08a80; --vermelho-suave: #3a1f1f; --ocre: #e4b04f; --ocre-suave: #3a2e16; --verde: #6cc793;
  --verde-suave: #183226; --cinza: #7d8995; --cinza-suave: #222d38; --topo: #0d1319; --topo-texto: #e4eaf0; --topo-mudo: #8c9aa8;
  --sombra-modal: 0 18px 48px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--papel); color: var(--tinta);
  font-family: var(--fonte-texto); font-size: 15px; line-height: 1.5;
}
h1, h2, h3, h4 { font-family: var(--fonte-titulo); font-weight: 600; line-height: 1.2; margin: 0; letter-spacing: .1px; }
h1 { font-size: 28px; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
p { margin: 0 0 10px; }
a { color: var(--azul-texto); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pular-link { position: absolute; left: 8px; top: -60px; background: var(--azul); color: #fff; padding: 8px 12px; z-index: 300; border-radius: var(--raio-p); }
.pular-link:focus { top: 8px; }
.num { font-variant-numeric: tabular-nums; }
.mudo { color: var(--grafite); }
.pequeno { font-size: 13px; }

/* ----------------------------- estrutura ----------------------------- */
.app {
  min-height: 100vh; display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  grid-template-rows: 56px minmax(0, 1fr);
  grid-template-areas: "topo topo" "nav main";
}
.topo {
  grid-area: topo; background: var(--topo); color: var(--topo-texto);
  display: flex; align-items: center; gap: 18px; padding: 0 18px; position: sticky; top: 0; z-index: 50;
}
.marca { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.marca svg { align-self: center; flex: none; }
.marca-nome { font-family: var(--fonte-titulo); font-size: 21px; font-weight: 600; letter-spacing: .3px; }
.marca-mod { font-family: var(--fonte-titulo); font-size: 15px; color: var(--topo-mudo); }
.topo-obra { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.topo-obra select {
  max-width: 420px; width: 100%; background: transparent; color: var(--topo-texto);
  border: 1px solid rgba(233, 238, 242, .28); border-radius: var(--raio-p); padding: 6px 30px 6px 10px; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--topo-mudo) 50%), linear-gradient(135deg, var(--topo-mudo) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat;
}
.topo-obra select option { color: #16202a; background: #fff; }
.topo-acoes { display: flex; gap: 4px; }
.topo-acoes button {
  background: transparent; border: 1px solid transparent; color: var(--topo-texto); padding: 6px 10px;
  border-radius: var(--raio-p); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.topo-acoes button:hover { border-color: rgba(233, 238, 242, .3); }
.topo-acoes svg { width: 16px; height: 16px; }

.lateral { grid-area: nav; border-right: 1px solid var(--linha); background: var(--superficie); padding: 14px 10px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
.lateral ul { list-style: none; margin: 0; padding: 0; }
.lateral li + li { margin-top: 2px; }
.lateral button {
  width: 100%; text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: var(--raio-p); cursor: pointer;
  display: flex; align-items: center; gap: 10px; color: var(--tinta);
}
.lateral button:hover { background: var(--superficie-2); }
.lateral button[aria-current="page"] { background: var(--azul-suave); color: var(--azul-texto); font-weight: 600; }
.lateral button:disabled { color: var(--cinza); cursor: not-allowed; background: none; }
.lateral svg { width: 18px; height: 18px; flex: none; }
.lateral .contagem { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; padding: 1px 7px; border-radius: 10px; background: var(--cinza-suave); color: var(--grafite); }
.lateral .contagem.alerta { background: var(--vermelho-suave); color: var(--vermelho); font-weight: 600; }
.lateral-rodape { margin-top: 18px; padding: 12px; border-top: 1px solid var(--linha); font-size: 12px; color: var(--grafite); }

main { grid-area: main; min-width: 0; padding: 28px 32px 64px; outline: none; }
.pagina { max-width: 1180px; }
.pagina-cabeca { margin-bottom: 22px; }
.pagina-cabeca p { color: var(--grafite); margin: 6px 0 0; max-width: 78ch; }
.pagina-cabeca .acoes { margin-top: 14px; }

/* ----------------------------- componentes ----------------------------- */
.bloco { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-m); padding: 20px 22px; }
.bloco + .bloco { margin-top: 18px; }
.grade-2 > .bloco, .grade-3 > .bloco, .colunas > .bloco, .indicadores > .bloco { margin-top: 0; }
.bloco h2 { font-size: 18px; margin-bottom: 12px; }
.bloco-cabeca { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.bloco-cabeca h2 { margin: 0; }
.grade-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grade-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--linha-forte); background: var(--superficie); color: var(--tinta); font-weight: 500; text-decoration: none; line-height: 1.3;
}
.btn:hover { border-color: var(--tinta); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
:root[data-theme="dark"] .btn.primario { color: #0d1319; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primario { color: #0d1319; } }
.btn.primario:hover { filter: brightness(1.08); }
.btn.perigo { color: var(--vermelho); border-color: var(--vermelho); background: var(--superficie); }
.btn.sutil { border-color: transparent; background: transparent; color: var(--azul-texto); padding: 6px 8px; }
.btn.sutil:hover { background: var(--azul-suave); }
.btn.pequeno { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.etiqueta {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; line-height: 1;
  padding: 4px 7px; border-radius: var(--raio-p); border: 1px solid currentColor; white-space: nowrap;
}
.etiqueta.critico { color: var(--vermelho); }
.etiqueta.importante { color: var(--ocre); }
.etiqueta.recomendado { color: var(--grafite); }
.etiqueta.cheia-critico { background: var(--vermelho-suave); color: var(--vermelho); border-color: transparent; }
.etiqueta.cheia-ok { background: var(--verde-suave); color: var(--verde); border-color: transparent; }
.etiqueta.cheia-aviso { background: var(--ocre-suave); color: var(--ocre); border-color: transparent; }
.etiqueta.cheia-info { background: var(--azul-suave); color: var(--azul-texto); border-color: transparent; }
.etiqueta.cheia-neutra { background: var(--cinza-suave); color: var(--grafite); border-color: transparent; }

.faixa { border-left: 4px solid var(--azul); background: var(--azul-suave); padding: 12px 16px; border-radius: 0 var(--raio-m) var(--raio-m) 0; margin: 0 0 18px; }
.faixa.aviso { border-color: var(--ocre); background: var(--ocre-suave); }
.faixa.erro { border-color: var(--vermelho); background: var(--vermelho-suave); }
.faixa.ok { border-color: var(--verde); background: var(--verde-suave); }
.faixa p:last-child { margin: 0; }

.barra { height: 8px; background: var(--cinza-suave); border-radius: 4px; overflow: hidden; }
.barra span { display: block; height: 100%; background: var(--azul); border-radius: 4px; }
.barra.verde span { background: var(--verde); }

.vazio { text-align: left; padding: 22px; border: 1px dashed var(--linha-forte); border-radius: var(--raio-m); color: var(--grafite); }
.vazio p { margin-bottom: 12px; }

/* ----------------------------- trilho de etapas ----------------------------- */
.trilho { list-style: none; margin: 0; padding: 4px 2px 10px; display: flex; align-items: flex-start; overflow-x: auto; scrollbar-width: thin; }
.estacao { flex: 0 0 auto; width: 72px; }
.estacao button { width: 100%; background: none; border: 0; padding: 4px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--tinta); border-radius: var(--raio-m); }
.estacao button:hover .no { transform: translateY(-1px); }
.no {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; position: relative;
  border: 2px solid var(--cinza); background: var(--superficie); color: var(--grafite);
  font-family: var(--fonte-titulo); font-weight: 600; font-size: 13px; transition: transform .12s ease;
}
.estacao-nome { font-size: 12px; text-align: center; line-height: 1.25; color: var(--grafite); max-width: 76px; }
.estacao-pct { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--grafite); }
.s-verde .no { background: var(--verde); border-color: var(--verde); color: #fff; }
:root[data-theme="dark"] .s-verde .no { color: #0d1319; }
.s-amarelo .no { border-color: var(--ocre); color: var(--ocre); background: conic-gradient(var(--ocre-suave) 0 50%, var(--superficie) 50% 100%); }
.s-vermelho .no { border-color: var(--vermelho); color: var(--vermelho); background: var(--vermelho-suave); }
.s-vermelho .no::after { content: ""; position: absolute; top: -3px; right: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--vermelho); border: 2px solid var(--superficie); }
.estacao.atual .no { box-shadow: 0 0 0 3px var(--superficie), 0 0 0 5px var(--tinta); }
.estacao.atual .estacao-nome { color: var(--tinta); font-weight: 600; }
.portao { flex: 1 1 16px; min-width: 16px; position: relative; height: 46px; }
.portao::before { content: ""; position: absolute; left: -2px; right: -2px; top: 23px; height: 2px; background: var(--linha-forte); }
/* portão fechado: barra vermelha que interrompe o trilho; aberto: braço levantado sobre o trilho */
.portao span { position: absolute; left: 50%; top: 11px; width: 4px; height: 25px; margin-left: -2px; border-radius: 2px; background: var(--vermelho); box-shadow: 0 0 0 3px var(--superficie); transform-origin: 50% 100%; transition: transform .25s ease; }
.portao.aberto span { width: 3px; margin-left: -1.5px; background: var(--linha-forte); box-shadow: none; transform: translateY(-12px) rotate(-58deg); }
.trilho.compacto .estacao { width: 54px; }
.trilho.compacto .no { width: 32px; height: 32px; font-size: 12px; }
.trilho.compacto .estacao-nome { display: none; }
.trilho.compacto .portao { height: 40px; }
.trilho.compacto .portao::before { top: 20px; }
.trilho.compacto .portao span { top: 9px; height: 22px; }
.trilho.compacto .portao.aberto span { transform: translateY(-11px) rotate(-58deg); }
.legenda-trilho { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--grafite); margin-top: 6px; }
.legenda-trilho span { display: inline-flex; align-items: center; gap: 6px; }
.legenda-trilho i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--cinza); display: inline-block; }
.legenda-trilho i.v { background: var(--verde); border-color: var(--verde); }
.legenda-trilho i.a { border-color: var(--ocre); background: conic-gradient(var(--ocre-suave) 0 50%, var(--superficie) 50% 100%); }
.legenda-trilho i.r { border-color: var(--vermelho); background: var(--vermelho-suave); }
.legenda-trilho b { display: inline-block; width: 4px; height: 14px; background: var(--vermelho); border-radius: 2px; }
.legenda-trilho em { display: inline-block; width: 3px; height: 13px; margin: 0 4px 0 6px; background: var(--linha-forte); border-radius: 2px; transform: rotate(-58deg); }

/* ----------------------------- painel ----------------------------- */
.painel-topo { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; margin-bottom: 18px; }
.ficha { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--linha-forte); border-radius: var(--raio-m); overflow: hidden; background: var(--superficie); }
.ficha > div { padding: 10px 12px; border-right: 1px solid var(--linha); border-bottom: 1px solid var(--linha); min-width: 0; }
.ficha > div:nth-child(4n) { border-right: 0; }
.ficha .r { display: block; font-size: 12px; color: var(--grafite); }
.ficha .v { font-weight: 600; overflow-wrap: anywhere; }
.ficha .largo { grid-column: span 2; }
.liberacao { border: 2px solid var(--vermelho); border-radius: var(--raio-m); padding: 16px 18px; background: var(--superficie); }
.liberacao.ok { border-color: var(--verde); }
.liberacao h2 { font-size: 15px; color: var(--grafite); font-family: var(--fonte-texto); font-weight: 600; }
.liberacao-estado { font-family: var(--fonte-titulo); font-size: 30px; font-weight: 600; margin: 4px 0 6px; color: var(--vermelho); }
.liberacao.ok .liberacao-estado { color: var(--verde); }
.liberacao ul { margin: 8px 0 12px; padding-left: 18px; font-size: 14px; }
.colunas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; }
.lista-acoes { list-style: none; margin: 0; padding: 0; }
.lista-acoes li { border-top: 1px solid var(--linha); }
.lista-acoes li:first-child { border-top: 0; }
.lista-acoes button { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: start; width: 100%; text-align: left; background: none; border: 0; padding: 10px 4px; cursor: pointer; border-radius: var(--raio-p); }
.lista-acoes button:hover { background: var(--superficie-2); }
.lista-acoes .id { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--grafite); font-size: 13px; padding-top: 1px; }
.lista-acoes .t { min-width: 0; }
.lista-acoes .t small { display: block; color: var(--grafite); }
.indicadores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
.indicador h3 { font-size: 16px; margin-bottom: 10px; }
.indicador dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.indicador dt { color: var(--grafite); }
.indicador dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.indicador dd.alerta { color: var(--vermelho); }

/* ----------------------------- formulário ----------------------------- */
.form-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.secao-form { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-m); padding: 18px 20px 20px; margin: 0 0 18px; }
.secao-form legend { float: left; width: 100%; padding: 0; margin: 0 0 14px; }
.secao-form legend h2 { font-size: 17px; margin: 0; }
.secao-form legend + * { clear: both; }
.campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo.largo { grid-column: 1 / -1; }
.campo label, .campo .rotulo { font-size: 13px; font-weight: 600; color: var(--tinta); }
.campo .ajuda { font-size: 12px; color: var(--grafite); }
.campo input[type="text"], .campo input[type="number"], .campo input[type="date"], .campo input[type="month"], .campo select, .campo textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--linha-forte); border-radius: 4px; background: var(--superficie); color: var(--tinta); min-height: 38px;
}
.campo textarea { min-height: 72px; resize: vertical; }
.campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--azul); outline: 2px solid var(--azul-suave); outline-offset: 0; }
.campo.obrigatorio label::after { content: " *"; color: var(--vermelho); }
.marcador { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; font-size: 14px; padding: 4px 0; }
.marcador input { width: 18px; height: 18px; margin: 1px 0 0; flex: none; accent-color: var(--azul); }
.impacto { position: sticky; top: 76px; }
.impacto h2 { font-size: 16px; margin-bottom: 10px; }
.impacto dl { margin: 0 0 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 14px; }
.impacto dt { color: var(--grafite); }

/* ----------------------------- abertura (4 s) ----------------------------- */
.abertura {
  position: fixed; inset: 0; z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  background-color: #141c24; color: #e9eef2;

}

.ab-linha { fill: none; stroke: #4a6a8f; stroke-width: 2; stroke-dasharray: 800; stroke-dashoffset: 800; animation: ab-tracar 1.5s cubic-bezier(.5, 0, .2, 1) .15s forwards; }
.ab-no { fill: #141c24; stroke: #8db4e8; stroke-width: 2; transform-box: fill-box; transform-origin: center; transform: scale(0); animation: ab-surgir .3s ease forwards, ab-marcar .3s ease forwards; }

.ab-anel { fill: none; stroke: #6cc793; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ab-anel .7s ease 2.15s forwards; }
.ab-titulo { display: flex; align-items: baseline; gap: 12px; opacity: 0; transform: translateY(8px); animation: ab-subir .55s ease 2.35s forwards; margin-top: 4px; }
.ab-titulo .n { font-family: var(--fonte-titulo); font-size: clamp(34px, 6vw, 54px); font-weight: 600; letter-spacing: .5px; }
.ab-titulo .m { font-family: var(--fonte-titulo); font-size: clamp(20px, 3.2vw, 30px); color: #8db4e8; }
.ab-sub { margin: 0; color: #a9b6c2; font-size: 15px; opacity: 0; animation: ab-fade .5s ease 2.7s forwards; text-align: center; padding: 0 18px; }
.ab-barra { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(233, 238, 242, .08); }
.ab-barra span { display: block; height: 100%; width: 0; background: #8db4e8; animation: ab-progresso 4s linear forwards; }
.ab-pular { position: absolute; right: 18px; bottom: 18px; background: none; border: 1px solid rgba(233, 238, 242, .25); color: #a9b6c2; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.ab-pular:hover { color: #e9eef2; border-color: rgba(233, 238, 242, .5); }
.ab-autor { position: absolute; left: 18px; bottom: 20px; color: #6f7f8f; font-size: 12px; }
@keyframes ab-tracar { to { stroke-dashoffset: 0; } }
@keyframes ab-tracar-selo { to { stroke-dashoffset: 0; } }
@keyframes ab-surgir { to { transform: scale(1); } }
@keyframes ab-marcar { to { fill: #1e4e8c; } }
@keyframes ab-fade { to { opacity: 1; } }
@keyframes ab-levantar { to { transform: translateY(-10px) rotate(-58deg); stroke: #4a6a8f; } }
@keyframes ab-anel { 0% { opacity: .9; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.2); } }
@keyframes ab-subir { to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {

}

      { id: "E1.08", etapa: "E1", titulo: "Previsão no PPA para execução em mais de um exercício", desc: "Quando a execução ultrapassar um exercício financeiro, verificar a previsão no plano plurianual, com declaração do ordenador de despesa, e a disponibilidade de créditos a cada exercício.", base: "Lei 14.133/2021, art. 105", crit: "importante", ajustes: [crit("critico", { campo: "prazoMeses", op: "gt", valor: 12 })] },
      { id: "E1.09", etapa: "E1", titulo: "Estimativa de impacto orçamentário-financeiro", desc: "Na criação ou expansão de ação governamental: impacto no exercício e nos dois seguintes e declaração do ordenador de despesa.", base: "LC 101/2000 (LRF), art. 16", crit: "importante", aplica: { campo: "natureza", op: "in", valor: ["nova", "ampliacao"] } },
      { id: "E1.10", etapa: "E1", titulo: "Custeio de operação e manutenção após a conclusão", desc: "Fonte e responsável pelo custeio de pessoal, equipamentos, insumos e manutenção, para que o empreendimento entre em funcionamento.", base: "Lei 14.133/2021, art. 18, §1º, VII e IX; LC 101/2000, art. 16", crit: "importante", ajustes: [crit("critico", { tip: ["saude", "escolar"] })] },
      { id: "E1.11", etapa: "E1", titulo: "Participação do futuro operador ou usuário", desc: "Unidade que operará o empreendimento (unidade de saúde, escola, prestador de saneamento) valida o programa.", base: "Boa prática; Lei 14.133/2021, art. 18, §1º, III", crit: "recomendado", ajustes: [crit("importante", { tip: ["saude", "escolar", "saneamento"] })] },
      { id: "E1.12", etapa: "E1", titulo: "Processo administrativo eletrônico autuado", desc: "Processo registrado em sistema informatizado de gestão e trâmite de processos eletrônicos, que reunirá os documentos da fase preparatória.", base: "Lei 14.133/2021, art. 12, VI; no âmbito federal, Decreto 8.539/2015, art. 4º", crit: "recomendado", ajustes: [crit("importante", FEDERAL)] },
      { id: "E1.13", etapa: "E1", grupo: APROVACAO, titulo: "Aprovação do DFD pela autoridade competente", desc: "Ato formal que aprova a demanda e autoriza o prosseguimento do planejamento (levantamentos, estudos e ETP), registrado depois de concluídos os demais elementos desta etapa.", base: "Lei 14.133/2021, art. 11, parágrafo único (governança das contratações); regulamento do ente", crit: "critico", encerra: ["E1"] },

      /* ============================ E2 ============================ */
      { id: "E2.01", etapa: "E2", titulo: "Levantamento topográfico planialtimétrico cadastral", desc: "Curvas de nível, divisas, edificações, árvores e redes visíveis, com ART ou RRT do responsável.", base: "Lei 14.133/2021, art. 6º, XXIV, h, e XXV, a; NBR 13133", crit: "critico" },
      { id: "E2.02", etapa: "E2", titulo: "Georreferenciamento e amarração a marcos oficiais", desc: "Levantamento referenciado ao Sistema Geodésico Brasileiro (SIRGAS 2000), essencial em obras lineares e em desapropriações.", base: "NBR 13133; NBR 14166", crit: "importante", aplica: { any: [VIARIA, SANEAMENTO, URBANA, DESAPROPRIAR] } },
      { id: "E2.03", etapa: "E2", titulo: "Sondagens a percussão (SPT)", desc: "Investigação geotécnica com número e profundidade de furos compatíveis com a obra, inclusive ao longo do traçado de redes e canais. Em edificações, programação mínima conforme NBR 8036.", base: "Lei 14.133/2021, art. 6º, XXIV, i, e XXV, a; NBR 6484; NBR 8036", crit: "critico", ajuda: "sondagem8036", aplica: { any: [EDIF, { se: "viaria.oae" }, { se: "urbana.contencao" }, SANEAMENTO] } },
      { id: "E2.04", etapa: "E2", titulo: "Sondagens rotativas ou mistas", desc: "Quando houver rocha, matacões ou impenetrável ao SPT em cotas de interesse, e em fundações de obras de arte e contenções.", base: "NBR 6484; NBR 6122", crit: "importante", aplica: { any: [{ campo: "terreno.solo", op: "eq", valor: "rocha" }, { se: "viaria.oae" }, { se: "urbana.contencao" }, { campo: "local.riscoGeologico", op: "eq", valor: "sim" }] } },
      { id: "E2.05", etapa: "E2", titulo: "Estudos geotécnicos do subleito e ensaios de laboratório", desc: "Sondagens a trado ao longo do eixo, caracterização, compactação e Índice de Suporte Califórnia (CBR) do subleito.", base: "Lei 14.133/2021, art. 6º, XXV, a; NBR 9895; instruções do órgão rodoviário (p. ex., DNIT)", crit: "critico", aplica: VIARIA },
      { id: "E2.06", etapa: "E2", titulo: "Estudo de ocorrências de materiais (jazidas, areais e pedreiras)", desc: "Localização, volumes, qualidade e distâncias de transporte, com a situação do licenciamento mineral e ambiental.", base: "Lei 14.133/2021, art. 6º, XXV, a; instruções do órgão rodoviário", crit: "critico", aplica: { all: [VIARIA, { campo: "viaria.intervencao", op: "in", valor: ["implantacao", "pavimentacao", "duplicacao"] }] }, ajustes: [crit("importante", VIA_URBANA)] },
      { id: "E2.07", etapa: "E2", titulo: "Estudos de tráfego", desc: "Contagens volumétricas e classificatórias, volume diário médio, projeção do tráfego e número N para o dimensionamento do pavimento.", base: "Manual de Estudos de Tráfego do DNIT; instruções do órgão contratante", crit: "critico", aplica: VIARIA },
      { id: "E2.08", etapa: "E2", titulo: "Estudos hidrológicos", desc: "Chuvas intensas (curvas IDF), bacias de contribuição, tempos de recorrência e vazões de projeto.", base: "Lei 14.133/2021, art. 6º, XXV, a; manual de hidrologia do órgão (p. ex., DNIT)", crit: "critico", aplica: { any: [{ all: [VIARIA, { se: "viaria.drenagem" }] }, { se: "saneamento.drenagem" }, URBANA] }, ajustes: [crit("importante", URBANA)] },
      { id: "E2.09", etapa: "E2", titulo: "Cadastro de redes e interferências existentes", desc: "Consulta formal às concessionárias e levantamento de redes de água, esgoto, drenagem, energia, gás e telecomunicações na área de intervenção.", base: "Lei 14.133/2021, art. 6º, XXV, a (levantamentos cadastrais)", crit: "importante", ajustes: [crit("critico", { any: [{ tip: ["viaria", "saneamento", "urbana"] }, { se: "terreno.interferencias" }] })] },
      { id: "E2.10", etapa: "E2", titulo: "Levantamento da edificação existente e inspeção predial", desc: "Levantamento arquitetônico (as built) e laudo de inspeção com anomalias, falhas e prioridades de intervenção.", base: "NBR 16747", crit: "critico", aplica: { all: [EDIF, EXISTENTE] } },
      { id: "E2.11", etapa: "E2", titulo: "Avaliação estrutural da edificação existente", desc: "Verificação da capacidade da estrutura diante de acréscimo de cargas, ampliação vertical ou manifestações patológicas.", base: "NBR 6118; NBR 16747", crit: "importante", aplica: { all: [EDIF, { campo: "natureza", op: "in", valor: ["ampliacao", "reforma", "restauracao"] }] } },
      { id: "E2.12", etapa: "E2", titulo: "Estudo populacional e de consumo", desc: "Projeção populacional no horizonte de projeto, consumo per capita e coeficientes de maior consumo.", base: "NBR 12211 (água); NBR 9648 (esgoto)", crit: "critico", aplica: { any: [{ se: "saneamento.agua" }, { se: "saneamento.esgoto" }] } },
      { id: "E2.13", etapa: "E2", titulo: "Caracterização do manancial ou do corpo receptor", desc: "Disponibilidade hídrica e qualidade do manancial; capacidade de autodepuração e enquadramento do corpo receptor.", base: "Lei 9.433/1997; Res. CONAMA 357/2005 e 430/2011", crit: "critico", aplica: { any: [{ all: [{ se: "saneamento.agua" }, { se: "saneamento.captacao" }] }, { all: [{ se: "saneamento.esgoto" }, { se: "saneamento.ete" }] }] } },
      { id: "E2.14", etapa: "E2", titulo: "Diagnóstico socioambiental preliminar", desc: "Vegetação, cursos d'água, APP, unidades de conservação, comunidades afetadas e passivos existentes.", base: "Lei 14.133/2021, art. 6º, XXV, a, e art. 18, §1º, XII", crit: "importante", ajustes: [crit("critico", { any: [{ campo: "local.areaProtegida", op: "nin", valor: ["nenhuma"] }, { tip: ["viaria", "saneamento"] }] })] },
      { id: "E2.15", etapa: "E2", titulo: "Vistoria técnica e registro fotográfico do local", desc: "Condições existentes, acessos, áreas para canteiro, vizinhança e restrições operacionais.", base: "Boa prática; subsidia o art. 6º, XXV, d, da Lei 14.133/2021", crit: "importante" },
      { id: "E2.16", etapa: "E2", titulo: "Investigação de passivo ambiental do solo", desc: "Avaliação preliminar e, se necessário, investigação confirmatória de contaminação.", base: "Res. CONAMA 420/2009", crit: "importante", aplica: { se: "terreno.contaminacao" } },
      { id: "E2.17", etapa: "E2", titulo: "Levantamento métrico-arquitetônico e mapeamento de danos", desc: "Documentação do bem protegido, prospecções e diagnóstico do estado de conservação.", base: "Decreto-Lei 25/1937; normas do IPHAN ou do órgão de patrimônio", crit: "critico", aplica: { campo: "local.tombamento", op: "eq", valor: "tombado" } },
      { id: "E2.18", etapa: "E2", titulo: "Cadastro e avaliação dos imóveis a desapropriar", desc: "Planta cadastral, identificação dos proprietários e laudos de avaliação.", base: "Decreto-Lei 3.365/1941; NBR 14653", crit: "critico", aplica: DESAPROPRIAR },
      { id: "E2.19", etapa: "E2", titulo: "Estudo geológico-geotécnico de encostas e áreas de risco", desc: "Mapeamento de risco, parâmetros de resistência e verificação de estabilidade.", base: "NBR 11682", crit: "critico", aplica: { any: [{ campo: "local.riscoGeologico", op: "eq", valor: "sim" }, { se: "urbana.contencao" }, { campo: "terreno.declividade", op: "eq", valor: "acentuada" }] }, ajustes: [crit("importante", { all: [{ campo: "local.riscoGeologico", op: "ne", valor: "sim" }, { nao: "urbana.contencao" }] })] },
      { id: "E2.20", etapa: "E2", titulo: "Avaliação do potencial arqueológico", desc: "Caracterização da área para manifestação do IPHAN no licenciamento, quando houver potencial arqueológico.", base: "IN IPHAN 1/2015", crit: "importante", aplica: { campo: "local.arqueologia", op: "in", valor: ["sim", "a_verificar"] } },
      { id: "E2.21", etapa: "E2", titulo: "Nível d'água e permeabilidade do terreno", desc: "Posição do lençol freático e necessidade de rebaixamento, escoramento ou impermeabilização.", base: "NBR 6484; NBR 6122", crit: "importante", aplica: { any: [{ campo: "terreno.agua", op: "in", valor: ["freatico", "curso", "intervencao"] }, { se: "saneamento.esgoto" }] } },
      { id: "E2.22", etapa: "E2", titulo: "Levantamento cadastral e documental do imóvel", desc: "Matrícula atualizada e cadeia dominial, certidão de ônus reais, confrontações e área registrada comparada à levantada, cadastro imobiliário municipal ou rural (CCIR, CAR e certificação no SIGEF) e situação patrimonial no ente ou na SPU.", base: "Lei 6.015/1973 (registros públicos); Lei 10.267/2001; Lei 9.636/1998; lista de verificação da AGU, item 10", crit: "critico", ajustes: [crit("importante", FAIXA_DOMINIO)] },
      { id: "E2.23", etapa: "E2", titulo: "Análise da regularização fundiária do imóvel", desc: "Divergências entre a situação de fato e a registral (ocupações, posse, área, confrontações e gravames), com as providências e os prazos para regularizar: retificação, unificação ou desmembramento, transferência, cessão, desapropriação ou regularização fundiária urbana (Reurb).", base: "Lei 6.015/1973, arts. 212 e 213; Lei 13.465/2017; Decreto-Lei 3.365/1941", crit: "critico", ajustes: [crit("importante", FAIXA_DOMINIO)] },
      { id: "E2.24", etapa: "E2", titulo: "Estudo de tratabilidade e qualidade da água bruta", desc: "Caracterização da água do manancial e ensaios de tratabilidade que definem a tecnologia de tratamento e as unidades da ETA.", base: "NBR 12216; padrão de potabilidade do Ministério da Saúde; OT-IBR 001/2006 R2026, Tabela 8", crit: "critico", aplica: { all: [{ se: "saneamento.agua" }, { se: "saneamento.eta" }] } },
      { id: "E2.25", etapa: "E2", titulo: "Cadastro socioeconômico das famílias e atividades afetadas", desc: "Famílias, atividades econômicas e benfeitorias atingidas, com data de corte do cadastro, para dimensionar o reassentamento e as indenizações.", base: "OT-IBR 001/2006 R2026, item 12; Lei 14.133/2021, art. 6º, XXV, a (estudos socioambientais)", crit: "critico", aplica: REASSENTAR },
      { id: "E2.26", etapa: "E2", titulo: "Diagnóstico da bacia de contribuição e histórico de eventos críticos", desc: "Uso e ocupação do solo, impermeabilização, áreas suscetíveis a alagamentos, enxurradas e inundações, eventos e danos observados e desenvolvimento urbano previsto.", base: "NR ANA 12/2025; OT-IBR 001/2006 R2026, Tabela 6", crit: "importante", aplica: DRENAGEM_URBANA },
      { id: "E2.27", etapa: "E2", titulo: "Estudos de infiltração e permeabilidade para controle na fonte", desc: "Capacidade de infiltração, nível do lençol freático e riscos de colmatação e de contaminação, para jardins de chuva, trincheiras, pavimentos permeáveis e bacias vegetadas.", base: "NR ANA 12/2025; OT-IBR 001/2006 R2026, Tabela 6", crit: "recomendado", aplica: DRENAGEM_URBANA },

      /* ============================ E3 ============================ */
      { id: "E3.01", etapa: "E3", titulo: "Viabilidade técnica", desc: "Exequibilidade da solução diante das condicionantes do sítio, das normas técnicas e da capacidade do mercado.", base: "Lei 14.133/2021, art. 18, §1º, caput", crit: "critico" },
      { id: "E3.02", etapa: "E3", titulo: "Viabilidade econômica e custo do ciclo de vida", desc: "Comparação de alternativas pelo custo total (implantação, operação, manutenção e desfazimento) e pelos benefícios.", base: "Lei 14.133/2021, art. 11, I, art. 18, VIII, e art. 18, §1º, VII", crit: "critico" },
      { id: "E3.03", etapa: "E3", titulo: "Viabilidade financeira", desc: "Compatibilidade do cronograma de desembolso com a disponibilidade orçamentária, as contrapartidas e o custeio futuro.", base: "Lei 14.133/2021, art. 18, caput, e art. 150", crit: "critico" },
      { id: "E3.04", etapa: "E3", titulo: "Viabilidade ambiental e enquadramento no licenciamento", desc: "Órgão competente, tipo de licença e de estudo exigido (EIA/RIMA, estudo simplificado ou dispensa), prazos e condicionantes prováveis.", base: "LC 140/2011; Res. CONAMA 237/1997 e 01/1986; Lei 14.133/2021, art. 18, §1º, XII", crit: "critico" },
      { id: "E3.05", etapa: "E3", titulo: "Viabilidade jurídico-dominial", desc: "Titularidade do terreno, servidões, faixa de domínio, ocupações e necessidade de desapropriação, com base no levantamento cadastral e documental (E2.22) e na análise da regularização fundiária (E2.23).", base: "Lei 14.133/2021, art. 18, caput; Decreto-Lei 3.365/1941", crit: "critico" },
      { id: "E3.06", etapa: "E3", titulo: "Parâmetros urbanísticos e uso do solo", desc: "Zoneamento, taxa de ocupação, coeficiente de aproveitamento, recuos, gabarito e exigências do Plano Diretor.", base: "Lei 10.257/2001 (Estatuto da Cidade); Plano Diretor e lei de uso do solo municipais", crit: "critico", aplica: { any: [EDIF, URBANA] }, ajustes: [crit("importante", { campo: "local.zona", op: "eq", valor: "rural" })] },
      { id: "E3.07", etapa: "E3", titulo: "Viabilidade de atendimento pelas concessionárias", desc: "Capacidade de fornecimento de energia, água, coleta de esgoto e telecomunicações no local.", base: "Boa prática; Lei 14.133/2021, art. 18, §1º, X", crit: "importante", aplica: { any: [EDIF, SANEAMENTO] }, ajustes: [crit("critico", SAUDE)] },
      { id: "E3.08", etapa: "E3", titulo: "Estudo de viabilidade técnica, econômica e ambiental (EVTEA)", desc: "Estudo exigido por órgãos rodoviários para justificar a intervenção e a alternativa de traçado.", base: "Instruções do órgão rodoviário (p. ex., DNIT)", crit: "importante", aplica: VIA_RODOVIARIA },
      { id: "E3.09", etapa: "E3", titulo: "Compatibilidade com planos setoriais", desc: "Plano Municipal ou Regional de Saneamento Básico, Plano Diretor de Drenagem, Plano de Bacia Hidrográfica, planos de redução de riscos, Plano de Mobilidade Urbana ou outro plano setorial aplicável.", base: "Lei 11.445/2007, art. 19; Lei 12.587/2012; NR ANA 12/2025 (drenagem)", crit: "importante", aplica: { tip: ["saneamento", "viaria", "urbana"] }, ajustes: [crit("critico", SANEAMENTO)] },
      { id: "E3.10", etapa: "E3", titulo: "Avaliação de alternativas de localização", desc: "Comparação de terrenos ou traçados possíveis quando a localização ainda não estiver definida.", base: "Lei 14.133/2021, art. 18, §1º, V", crit: "recomendado" },
      { id: "E3.11", etapa: "E3", titulo: "Adesão dos usuários e efetividade do sistema", desc: "Estratégia para ligações domiciliares e demanda efetiva, evitando sistemas implantados sem uso.", base: "Lei 11.445/2007, art. 45", crit: "importante", aplica: { any: [{ se: "saneamento.agua" }, { se: "saneamento.esgoto" }] } },

      /* ============================ E4 ============================ */
      { id: "E4.01", etapa: "E4", grupo: "Elementos do ETP (art. 18, §1º)", titulo: "I. Descrição da necessidade", desc: "Problema a ser resolvido, sob a perspectiva do interesse público. Elemento mínimo obrigatório.", base: "Lei 14.133/2021, art. 18, §1º, I, e §2º", crit: "critico", naProibido: true },
      { id: "E4.02", etapa: "E4", grupo: "Elementos do ETP (art. 18, §1º)", titulo: "II. Previsão no plano de contratações anual", desc: "Demonstração do alinhamento com o planejamento da Administração.", base: "Lei 14.133/2021, art. 18, §1º, II", crit: "critico" },
      { id: "E4.03", etapa: "E4", grupo: "Elementos do ETP (art. 18, §1º)", titulo: "III. Requisitos da contratação", desc: "Requisitos técnicos, de desempenho, de sustentabilidade e de qualificação necessários à solução.", base: "Lei 14.133/2021, art. 18, §1º, III", crit: "critico" },
      { id: "E4.04", etapa: "E4", grupo: "Elementos do ETP (art. 18, §1º)", titulo: "IV. Estimativa das quantidades com memórias de cálculo", desc: "Quantidades e documentos de suporte, consideradas as interdependências com outras contratações. Elemento mínimo obrigatório.", base: "Lei 14.133/2021, art. 18, §1º, IV, e §2º", crit: "critico", naProibido: true },
      { id: "E4.05", etapa: "E4", grupo: "Elementos do ETP (art. 18, §1º)", titulo: "V. Levantamento de mercado e escolha da solução", desc: "Alternativas possíveis, contratações similares, lições de contratações anteriores do órgão e justificativa técnica e econômica do tipo de solução a contratar.", base: "Lei 14.133/2021, art. 18, §1º, V", crit: "critico" },
      { id: "E4.06", etapa: "E4", grupo: "Elementos do ETP (art. 18, §1º)", titulo: "VI. Estimativa do valor da contratação", desc: "Preços unitários referenciais, memórias de cálculo e documentos de suporte, que podem constar de anexo classificado. Serve para aferir a viabilidade econômica e não se confunde com o orçamento de referência da licitação. Elemento mínimo obrigatório.", base: "Lei 14.133/2021, art. 18, §1º, VI, e §2º", crit: "critico", naProibido: true },
      { id: "E4.07", etapa: "E4", grupo: "Elementos do ETP (art. 18, §1º)", titulo: "VII. Descrição da solução como um todo", desc: "Inclusive exigências de manutenção e assistência técnica, considerado o ciclo de vida do objeto.", base: "Lei 14.133/2021, art. 18, §1º, VII", crit: "critico" },
      { id: "E4.08", etapa: "E4", grupo: "Elementos do ETP (art. 18, §1º)", titulo: "VIII. Justificativa para o parcelamento ou não", desc: "Análise da divisibilidade do objeto sem prejuízo do conjunto e sem perda de economia de escala. Elemento mínimo obrigatório.", base: "Lei 14.133/2021, art. 18, §1º, VIII, e §2º; Súmula TCU 247", crit: "critico", naProibido: true },
      { id: "E4.09", etapa: "E4", grupo: "Elementos do ETP (art. 18, §1º)", titulo: "IX. Resultados pretendidos", desc: "Ganhos de economicidade e de melhor aproveitamento dos recursos humanos, materiais e financeiros.", base: "Lei 14.133/2021, art. 18, §1º, IX", crit: "critico" },
      { id: "E4.10", etapa: "E4", grupo: "Elementos do ETP (art. 18, §1º)", titulo: "X. Providências prévias à celebração do contrato", desc: "Inclusive capacitação de servidores para a fiscalização e a gestão contratual.", base: "Lei 14.133/2021, art. 18, §1º, X", crit: "critico" },
      { id: "E4.11", etapa: "E4", grupo: "Elementos do ETP (art. 18, §1º)", titulo: "XI. Contratações correlatas e interdependentes", desc: "Equipamentos, mobiliário, supervisão, ligações definitivas e outros objetos necessários ao funcionamento.", base: "Lei 14.133/2021, art. 18, §1º, XI", crit: "critico" },
      { id: "E4.12", etapa: "E4", grupo: "Elementos do ETP (art. 18, §1º)", titulo: "XII. Impactos ambientais e medidas mitigadoras", desc: "Inclusive baixo consumo de energia e de recursos e logística reversa, quando aplicável.", base: "Lei 14.133/2021, art. 18, §1º, XII", crit: "critico" },
      { id: "E4.13", etapa: "E4", grupo: "Elementos do ETP (art. 18, §1º)", titulo: "XIII. Posicionamento conclusivo", desc: "Conclusão sobre a adequação da contratação para atender à necessidade. Elemento mínimo obrigatório.", base: "Lei 14.133/2021, art. 18, §1º, XIII, e §2º", crit: "critico", naProibido: true },
      { id: "E4.16", etapa: "E4", grupo: OUTROS_ETP, titulo: "Necessidade ou não de projeto executivo", desc: "Em obras e serviços comuns de engenharia, registrar se haverá projeto executivo, regra do art. 46, §1º, ou se a especificação constará apenas do termo de referência ou do projeto básico, com dispensa dos projetos. A dispensa só é admitida se o ETP demonstrar que não há prejuízo para aferir os padrões de desempenho e qualidade almejados.", base: "Lei 14.133/2021, art. 18, §3º, e art. 46, §1º", crit: "importante", aplica: { all: [PE_PELA_ADMINISTRACAO, NAO_ESPECIAL] } },
      { id: "E4.18", etapa: "E4", grupo: OUTROS_ETP, titulo: "Mão de obra, materiais, tecnologias e matérias-primas locais", desc: "Avaliar se o edital poderá prever mão de obra, materiais, tecnologias e matérias-primas existentes no local da execução, da conservação e da operação, desde que o ETP demonstre que não haverá prejuízo à competitividade da licitação nem à eficiência do contrato.", base: "Lei 14.133/2021, art. 25, §2º", crit: "recomendado" },
      { id: "E4.19", etapa: "E4", grupo: OUTROS_ETP, titulo: "Relevância da qualidade técnica para adotar técnica e preço", desc: "A técnica e preço só pode ser escolhida se o ETP demonstrar que avaliar e ponderar a qualidade técnica das propostas que superarem os requisitos mínimos é relevante aos fins pretendidos. Em obras, cabe sobretudo em obras e serviços especiais de engenharia (inciso IV) e em objetos que admitam soluções alternativas e variações de execução à escolha dos licitantes, com efeitos mensuráveis na qualidade, produtividade, rendimento e durabilidade (inciso V).", base: "Lei 14.133/2021, art. 36, §1º", crit: "importante", aplica: { any: [TECNICA_PRECO, OBJETO_ESPECIAL] }, ajustes: [crit("critico", TECNICA_PRECO)] },
      { id: "E4.20", etapa: "E4", grupo: OUTROS_ETP, titulo: "Garantia, manutenção e assistência técnica", desc: "Especificar a garantia exigida e as condições de manutenção e assistência técnica dos equipamentos e sistemas a fornecer, como elevadores, climatização, geradores, bombas, equipamentos de tratamento e iluminação. Exigir atendimento por deslocamento de técnico ou em unidade de assistência a distância compatível depende de fundamentação no ETP.", base: "Lei 14.133/2021, art. 40, §1º, III, e §4º; art. 18, §1º, VII", crit: "recomendado", aplica: { any: [EDIF, { se: "saneamento.captacao" }, { se: "saneamento.eta" }, { se: "saneamento.ete" }, { se: "saneamento.elevatorias" }, { se: "urbana.iluminacao" }, { regime: ["fornecimento"] }, { tip: ["outra"] }] }, ajustes: [crit("importante", { any: [SAUDE, { regime: ["fornecimento"] }, { se: "saneamento.eta" }, { se: "saneamento.ete" }, { all: [EDIF, { campo: "edif.pavimentos", op: "gte", valor: 2 }] }] })] },
      { id: "E4.21", etapa: "E4", grupo: OUTROS_ETP, titulo: "Locação ou aquisição: custos e benefícios de cada opção", desc: "Quando houver a possibilidade de locar em vez de construir ou adquirir (imóvel pronto, locação sob medida ou equipamentos), comparar os custos e os benefícios de cada opção e indicar a alternativa mais vantajosa.", base: "Lei 14.133/2021, arts. 44 e 51; Lei 8.245/1991, art. 54-A (locação sob medida)", crit: "recomendado", aplica: { any: [EDIF, { regime: ["fornecimento"] }, { tip: ["outra"] }] }, ajustes: [crit("importante", { all: [EDIF, { campo: "natureza", op: "in", valor: ["nova", "ampliacao"] }] })] },
      { id: "E4.14", etapa: "E4", grupo: "Complementos", titulo: "Mapa de riscos preliminar integrado ao ETP", desc: "Riscos que podem comprometer o sucesso da licitação e a boa execução contratual, detalhados no módulo E9.1.", base: "Lei 14.133/2021, art. 18, X", crit: "critico", auto: "mapa_existe" },
      { id: "E4.17", etapa: "E4", grupo: "Complementos", titulo: "ETP elaborado no Sistema ETP digital", desc: "Elaboração e registro do ETP no sistema eletrônico do governo federal.", base: "IN SEGES/ME 58/2022; lista de verificação da AGU, item 4", crit: "importante", aplica: FEDERAL },
      { id: "E4.15", etapa: "E4", grupo: APROVACAO, titulo: "Aprovação do ETP pela autoridade competente", desc: "Ato formal que aprova o ETP e a solução escolhida, depois do posicionamento conclusivo (XIII) e do mapa de riscos preliminar, com publicação ou registro conforme o regulamento.", base: "Lei 14.133/2021, art. 11, parágrafo único, e art. 18, §1º; regulamento do ente (no âmbito federal, IN SEGES/ME 58/2022)", crit: "critico", encerra: ["E4"] },

      /* ============================ E5 ============================ */
      { id: "E5.01", etapa: "E5", grupo: "Concepção", titulo: "Estudo de concepção com alternativas avaliadas", desc: "Alternativas comparadas por custo, prazo, desempenho, impacto ambiental e manutenção.", base: "Lei 14.133/2021, art. 18, §1º, V, e art. 6º, XXIV, f e g", crit: "critico" },
      { id: "E5.02", etapa: "E5", grupo: "Concepção", titulo: "Justificativa da solução escolhida", desc: "Fundamentação técnica, econômica e ambiental da alternativa adotada, registrada no processo.", base: "Lei 14.133/2021, art. 18, §1º, V", crit: "critico" },
      { id: "E5.03", etapa: "E5", grupo: "Concepção", titulo: "Estudo preliminar de arquitetura", desc: "Partido arquitetônico, implantação, setorização e pré-dimensionamento compatíveis com o programa.", base: "NBR 16636", crit: "critico", aplica: EDIF },
      { id: "E5.04", etapa: "E5", grupo: "Concepção", titulo: "Estudo de traçado e alternativas de diretriz", desc: "Diretriz da via, greide preliminar e comparação de traçados.", base: "Manual de Projeto Geométrico do DNIT (rodovias); normas municipais", crit: "critico", aplica: VIARIA, ajustes: [crit("importante", { campo: "viaria.intervencao", op: "in", valor: ["restauracao", "pavimentacao"] })] },
      { id: "E5.05", etapa: "E5", grupo: "Concepção", titulo: "Concepção do sistema de abastecimento de água", desc: "Manancial, captação, tratamento, reservação e distribuição, com estudo de alternativas.", base: "NBR 12211", crit: "critico", aplica: { se: "saneamento.agua" } },
      { id: "E5.06", etapa: "E5", grupo: "Concepção", titulo: "Concepção do sistema de esgotamento sanitário", desc: "Bacias de esgotamento, traçado de coletores, elevatórias, tratamento e disposição final.", base: "NBR 9648", crit: "critico", aplica: { se: "saneamento.esgoto" } },
      { id: "E5.07", etapa: "E5", grupo: "Concepção", titulo: "Concepção do sistema de drenagem", desc: "Microdrenagem e macrodrenagem, tempos de recorrência adotados e pontos de lançamento.", base: "Manual de drenagem do órgão; Plano Diretor de Drenagem, se houver", crit: "critico", aplica: { any: [{ se: "saneamento.drenagem" }, { all: [VIARIA, { se: "viaria.drenagem" }] }] }, ajustes: [crit("importante", VIARIA)] },
      { id: "E5.08", etapa: "E5", grupo: "Concepção", titulo: "Validação da concepção pelo demandante e pelo operador", desc: "Aprovação formal pela unidade demandante e, quando houver, pelo futuro operador.", base: "Boa prática", crit: "importante" },
      { id: "E5.09", etapa: "E5", grupo: "Anteprojeto (art. 6º, XXIV)", titulo: "Metodologia do anteprojeto definida em ato do órgão", desc: "Ato do órgão competente que define a metodologia de elaboração do anteprojeto.", base: "Lei 14.133/2021, art. 46, §2º", crit: "critico", aplica: INTEGRADA },
      { id: "E5.10", etapa: "E5", grupo: "Anteprojeto (art. 6º, XXIV)", titulo: "a) Programa de necessidades, demanda e nível de serviço", desc: "Demonstração do programa, avaliação da demanda do público-alvo, motivação técnico-econômico-social e visão global dos investimentos.", base: "Lei 14.133/2021, art. 6º, XXIV, a", crit: "critico", aplica: INTEGRADA },
      { id: "E5.11", etapa: "E5", grupo: "Anteprojeto (art. 6º, XXIV)", titulo: "b) Condições de solidez, segurança e durabilidade", desc: "Parâmetros mínimos a serem atendidos pela solução do contratado.", base: "Lei 14.133/2021, art. 6º, XXIV, b", crit: "critico", aplica: INTEGRADA },
      { id: "E5.12", etapa: "E5", grupo: "Anteprojeto (art. 6º, XXIV)", titulo: "c) Prazo de entrega", desc: "Prazo global e marcos intermediários.", base: "Lei 14.133/2021, art. 6º, XXIV, c", crit: "critico", aplica: INTEGRADA },
      { id: "E5.13", etapa: "E5", grupo: "Anteprojeto (art. 6º, XXIV)", titulo: "d) Estética arquitetônica, traçado ou área de influência", desc: "Diretrizes de arquitetura, traçado geométrico ou projeto da área de influência, quando cabível.", base: "Lei 14.133/2021, art. 6º, XXIV, d", crit: "critico", aplica: INTEGRADA },
      { id: "E5.14", etapa: "E5", grupo: "Anteprojeto (art. 6º, XXIV)", titulo: "e) Parâmetros de interesse público, economia, execução, impacto ambiental e acessibilidade", desc: "Critérios objetivos para avaliar a solução proposta.", base: "Lei 14.133/2021, art. 6º, XXIV, e", crit: "critico", aplica: INTEGRADA },
      { id: "E5.15", etapa: "E5", grupo: "Anteprojeto (art. 6º, XXIV)", titulo: "f) Proposta de concepção da obra", desc: "Concepção que orienta o projeto básico a ser desenvolvido pelo contratado.", base: "Lei 14.133/2021, art. 6º, XXIV, f", crit: "critico", aplica: INTEGRADA },
      { id: "E5.16", etapa: "E5", grupo: "Anteprojeto (art. 6º, XXIV)", titulo: "g) Projetos anteriores ou estudos preliminares", desc: "Estudos que embasaram a concepção proposta.", base: "Lei 14.133/2021, art. 6º, XXIV, g", crit: "critico", aplica: INTEGRADA },
      { id: "E5.17", etapa: "E5", grupo: "Anteprojeto (art. 6º, XXIV)", titulo: "h) Levantamento topográfico e cadastral", desc: "Base topográfica e cadastral disponibilizada aos licitantes.", base: "Lei 14.133/2021, art. 6º, XXIV, h", crit: "critico", aplica: INTEGRADA },
      { id: "E5.18", etapa: "E5", grupo: "Anteprojeto (art. 6º, XXIV)", titulo: "i) Pareceres de sondagem", desc: "Investigações geotécnicas que reduzam a incerteza da solução.", base: "Lei 14.133/2021, art. 6º, XXIV, i", crit: "critico", aplica: INTEGRADA },
      { id: "E5.19", etapa: "E5", grupo: "Anteprojeto (art. 6º, XXIV)", titulo: "j) Memorial descritivo com padrões mínimos", desc: "Elementos da edificação, componentes construtivos e materiais de construção.", base: "Lei 14.133/2021, art. 6º, XXIV, j", crit: "critico", aplica: INTEGRADA },

      /* ============================ E6 ============================ */
      { id: "E6.01", etapa: "E6", grupo: "Elementos do projeto básico (art. 6º, XXV)", titulo: "a) Levantamentos, sondagens, ensaios e estudos socioambientais", desc: "Dados de campo e estudos necessários à execução da solução escolhida, consolidados no projeto básico.", base: "Lei 14.133/2021, art. 6º, XXV, a", crit: "critico", aplica: NAO_INTEGRADA },
      { id: "E6.02", etapa: "E6", grupo: "Elementos do projeto básico (art. 6º, XXV)", titulo: "b) Soluções técnicas globais e localizadas suficientemente detalhadas", desc: "Detalhamento que evite reformulações ou variantes de qualidade, preço e prazo na fase executiva.", base: "Lei 14.133/2021, art. 6º, XXV, b", crit: "critico", aplica: NAO_INTEGRADA },
      { id: "E6.03", etapa: "E6", grupo: "Elementos do projeto básico (art. 6º, XXV)", titulo: "c) Serviços, materiais e equipamentos identificados e especificados", desc: "Especificações que assegurem o resultado e a segurança sem frustrar a competitividade.", base: "Lei 14.133/2021, art. 6º, XXV, c", crit: "critico", aplica: NAO_INTEGRADA },
      { id: "E6.04", etapa: "E6", grupo: "Elementos do projeto básico (art. 6º, XXV)", titulo: "d) Métodos construtivos, instalações provisórias e condições organizacionais", desc: "Elementos para definição de métodos, logística, acessos e canteiro.", base: "Lei 14.133/2021, art. 6º, XXV, d", crit: "critico", aplica: NAO_INTEGRADA },
      { id: "E6.05", etapa: "E6", grupo: "Elementos do projeto básico (art. 6º, XXV)", titulo: "e) Subsídios para o plano de licitação e de gestão da obra", desc: "Programação, estratégia de suprimentos, normas de fiscalização e demais dados de gestão.", base: "Lei 14.133/2021, art. 6º, XXV, e", crit: "critico", aplica: NAO_INTEGRADA },
      { id: "E6.06", etapa: "E6", grupo: "Elementos do projeto básico (art. 6º, XXV)", titulo: "f) Orçamento detalhado do custo global", desc: "Fundamentado em quantitativos propriamente avaliados; obrigatório nos regimes de preço unitário, global, integral, tarefa e fornecimento com serviço associado.", base: "Lei 14.133/2021, art. 6º, XXV, f, e art. 46, I a IV e VII", crit: "critico", aplica: { regime: ["unitario", "global", "integral", "tarefa", "fornecimento"] } },
      { id: "E6.07", etapa: "E6", grupo: "Elementos do projeto básico (art. 6º, XXV)", titulo: "Estimativa de valor na contratação semi-integrada", desc: "Orçamento sintético balizado em SINAPI ou SICRO; métodos expeditos ou paramétricos apenas para frações não detalhadas.", base: "Lei 14.133/2021, art. 23, §5º", crit: "critico", aplica: SEMI },
      { id: "E6.08", etapa: "E6", grupo: "Documentos complementares", titulo: "Memorial descritivo e especificações técnicas", desc: "Caderno de especificações e encargos coerente com desenhos e planilha.", base: "Lei 14.133/2021, art. 6º, XXV, c", crit: "critico", aplica: NAO_INTEGRADA },
      { id: "E6.09", etapa: "E6", grupo: "Documentos complementares", titulo: "Memória de cálculo dos quantitativos", desc: "Quantitativos rastreáveis aos desenhos, por serviço da planilha.", base: "Lei 14.133/2021, art. 18, §1º, IV, e art. 6º, XXV, f", crit: "critico", aplica: NAO_INTEGRADA },
      { id: "E6.10", etapa: "E6", grupo: "Documentos complementares", titulo: "Cronograma físico-financeiro", desc: "Etapas, prazos e desembolsos compatíveis com o método construtivo e a disponibilidade de recursos.", base: "Lei 14.133/2021, art. 6º, XXV, e, e art. 46, §9º", crit: "critico", aplica: NAO_INTEGRADA },
      { id: "E6.11", etapa: "E6", grupo: "Documentos complementares", titulo: "Desenhos de todas as disciplinas em nível de projeto básico", desc: "Pranchas em escalas adequadas, com selo de identificação, controle de revisões e responsável técnico, cobrindo todas as disciplinas exigidas pela natureza do objeto.", base: "Lei 14.133/2021, art. 6º, XXV", crit: "critico", aplica: NAO_INTEGRADA },
      { id: "E6.12", etapa: "E6", grupo: "Documentos complementares", titulo: "Compatibilização entre disciplinas", desc: "Verificação de interferências entre arquitetura, estrutura e instalações, com registro das soluções.", base: "Lei 14.133/2021, art. 6º, XXV, b, e art. 19, §3º", crit: "importante", aplica: NAO_INTEGRADA, ajustes: [crit("critico", EDIF)] },
      { id: "E6.13", etapa: "E6", grupo: "Documentos complementares", titulo: "ART, RRT ou TRT dos projetos, levantamentos e orçamento", desc: "Registro de responsabilidade técnica de cada autor, devidamente identificado, inclusive das planilhas orçamentárias.", base: "Lei 6.496/1977; Lei 12.378/2010, art. 45; Lei 13.639/2018; Decreto 7.983/2013, art. 10", crit: "critico" },
      { id: "E6.14", etapa: "E6", grupo: "Documentos complementares", titulo: "Especificações sem direcionamento de marca", desc: "Indicação de marca ou modelo apenas nas hipóteses legais e com justificativa; quando indicada como referência, admitir expressamente produto equivalente, com análise efetiva da equivalência.", base: "Lei 14.133/2021, art. 41, I", crit: "importante" },
      { id: "E6.18", etapa: "E6", grupo: "Documentos complementares", titulo: "Diretrizes do art. 45 observadas no projeto", desc: "Resíduos sólidos, condicionantes e compensação ambiental, redução do consumo de energia e de recursos, impacto de vizinhança, proteção do patrimônio e acessibilidade.", base: "Lei 14.133/2021, art. 45", crit: "importante", aplica: NAO_INTEGRADA },
      { id: "E6.19", etapa: "E6", grupo: "Documentos complementares", titulo: "Projeto básico atualizado para a data do edital", desc: "Projeto revisto às circunstâncias da data de publicação do edital: normas técnicas, condições do local, aprovações e preços.", base: "Acórdãos 1.169/2013 e 1.576/2022-TCU-Plenário", crit: "importante", aplica: NAO_INTEGRADA },
      { id: "E6.20", etapa: "E6", grupo: "Documentos complementares", titulo: "Critérios de medição e de aceitação de cada serviço", desc: "Regras objetivas de medição para pagamento e critérios e tolerâncias de aceitação de cada serviço, base da fiscalização do contrato.", base: "Lei 14.133/2021, art. 6º, XXV, e; OT-IBR 001/2006 R2026, item 7.3", crit: "importante", aplica: NAO_INTEGRADA },
      { id: "E6.21", etapa: "E6", grupo: "Documentos complementares", titulo: "Viabilidade técnica e dominial ratificada no projeto básico", desc: "O projeto confirma, com base nas investigações e levantamentos, a viabilidade avaliada no ETP e a disponibilidade das áreas; se a solução se mostrar inviável, o processo volta ao ETP ou o planejamento é encerrado por decisão motivada.", base: "Lei 14.133/2021, art. 6º, XXV; OT-IBR 001/2006 R2026, item 11", crit: "importante", aplica: NAO_INTEGRADA },
      { id: "E6.22", etapa: "E6", grupo: "Documentos complementares", titulo: "Condicionantes ambientais incorporadas ao projeto e ao orçamento", desc: "Condicionantes da licença prévia, ou parâmetros já identificados quando o licenciamento couber ao contratado, refletidos no projeto, nas especificações, nos programas ambientais e no orçamento.", base: "Lei 14.133/2021, art. 25, §5º, I, e art. 45, II; OT-IBR 001/2006 R2026, item 12", crit: "importante", aplica: LICENCIAMENTO },
      { id: "E6.15", etapa: "E6", grupo: "Documentos complementares", titulo: "Análise técnica e aceitação formal do projeto básico", desc: "Verificação pela equipe técnica do órgão, com registro das pendências e do aceite.", base: "Lei 14.133/2021, art. 18, II; regulamento do órgão", crit: "critico", aplica: NAO_INTEGRADA },
      { id: "E6.16", etapa: "E6", grupo: "Regimes integrado e semi-integrado", titulo: "Critérios de aceitação do projeto básico a cargo do contratado", desc: "Parâmetros para análise e aprovação, vedadas alterações que reduzam a qualidade ou a vida útil.", base: "Lei 14.133/2021, art. 46, §3º", crit: "critico", aplica: INTEGRADA },
      { id: "E6.17", etapa: "E6", grupo: "Regimes integrado e semi-integrado", titulo: "Frações do projeto básico passíveis de alteração pelo contratado", desc: "Delimitação e condições para inovações, com assunção dos riscos correspondentes pelo contratado.", base: "Lei 14.133/2021, art. 46, §5º", crit: "importante", aplica: SEMI },

      /* ============================ E7 ============================ */
      { id: "E7.01", etapa: "E7", grupo: "Geral", titulo: "Responsável e momento do projeto executivo definidos", desc: "Quem elabora o executivo (Administração ou contratado), prazo e aprovação antes da execução de cada etapa.", base: "Lei 14.133/2021, art. 46, §§ 1º e 6º", crit: "critico" },
      { id: "E7.08", etapa: "E7", grupo: "Geral", titulo: "Projeto executivo completo e fiel ao projeto básico", desc: "Quando elaborado antes da licitação: elementos necessários e suficientes à execução completa da obra, respeitadas as bases do projeto básico. Se atribuído ao contratado, marque como não aplicável e registre a justificativa (TJTR, E9.33).", base: "Lei 14.133/2021, art. 6º, XXVI; Acórdão 1.016/2011-TCU-Plenário", crit: "importante", aplica: PE_PELA_ADMINISTRACAO },
      { id: "E7.02", etapa: "E7", grupo: "Geral", titulo: "Análise crítica dos projetos pela equipe do órgão", desc: "Conferência de cada disciplina com lista de verificação, registro de comentários e controle de revisões.", base: "Boa prática", crit: "importante" },
      { id: "E7.03", etapa: "E7", grupo: "Geral", titulo: "Avaliação da adoção de BIM", desc: "Modelagem da informação da construção, preferencial quando adequada ao objeto.", base: "Lei 14.133/2021, art. 19, §3º; Decreto 10.306/2020 (órgãos federais); Decreto 11.888/2024 (Estratégia BIM BR)", crit: "recomendado", ajustes: [crit("importante", { all: [EDIF, { campo: "esfera", op: "eq", valor: "federal" }] })] },
      { id: "E7.04", etapa: "E7", grupo: "Geral", titulo: "Remanejamento de interferências", desc: "Projetos de relocação de redes de concessionárias, com anuência dos responsáveis.", base: "Lei 14.133/2021, art. 6º, XXV, a e b", crit: "importante", aplica: { any: [{ se: "terreno.interferencias" }, VIA_URBANA, SANEAMENTO] }, ajustes: [crit("critico", { se: "terreno.interferencias" })] },
      { id: "E7.05", etapa: "E7", grupo: "Geral", titulo: "Projeto de desapropriação", desc: "Planta de desapropriação, planta cadastral individual dos imóveis, cadastro dos proprietários e custo estimado de cada unidade.", base: "Decreto-Lei 3.365/1941; NBR 14653", crit: "critico", aplica: DESAPROPRIAR },
