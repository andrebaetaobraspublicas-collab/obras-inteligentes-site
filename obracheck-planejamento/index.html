      return true;
    });
    if (ui.celula) h.push('<p class="pequeno">Filtrando pela célula probabilidade ' + ui.celula[0] + " e impacto " + ui.celula[1] + '. <button type="button" class="btn sutil pequeno" data-acao="limpar-celula">Limpar</button></p>');
    if (!A.mapa.length) {
      h.push('<div class="vazio"><p>O mapa de riscos ainda não tem eventos. Comece pelos riscos típicos da tipologia ou registre um risco próprio.</p><div class="acoes"><button type="button" class="btn primario" data-acao="sugerir-mapa">Adicionar riscos típicos</button><button type="button" class="btn" data-acao="novo-mapa">Novo risco</button></div></div>');
      return h.join("");
    }
    h.push('<div class="tabela-wrap"><table class="tabela" id="tabela-mapa"><thead><tr><th>ID</th><th>Evento</th><th>Fase</th><th>Nível</th><th>Tratamento e providência</th><th>Responsável pela medida</th><th>Medida</th><th>Afeta o equilíbrio</th><th>Matriz</th><th><span class="sr">Ações</span></th></tr></thead><tbody>');
    lista.forEach(function (a) {
      var r = a.r;
      var matrizCel = a.cobertoPor.length ? esc(a.cobertoPor.join(", ")) : (r.afetaEquilibrio && r.fase !== "licitacao" && r.fase !== "operacao" ? '<button type="button" class="btn sutil pequeno" data-acao="levar-matriz" data-id="' + attr(r.id) + '">Levar para a matriz</button>' : '<span class="mudo curto" title="Evento analisado apenas no mapa: não afeta o equilíbrio do contrato ou ocorre antes da assinatura">Só no mapa</span>');
      var origem = r.origem === "aprovacao" ? '<span class="sub">Gerado pela aprovação ' + esc(r.aprovRef) + "</span>" : (r.origem === "modelo" ? '<span class="sub">Modelo ' + esc(r.modeloId) + "</span>" : "");
      h.push('<tr><td class="id">' + esc(r.id) + "</td><td>" + esc(r.evento) + (r.causa ? '<span class="sub causa" title="' + attr(r.causa) + '">Causa: ' + esc(r.causa) + "</span>" : "") + origem + "</td><td>" + esc(M.rotuloLista(CFG.escalas.fases, r.fase)) + "</td><td>" + nivelTag(a.nivel) + '<span class="sub">P' + esc(r.p) + " × I" + esc(r.i) + "</span></td><td>" + esc(M.rotuloLista(CFG.escalas.tratamentos, r.tratamento)) + '<span class="sub">' + esc(r.providencia || "Sem providência registrada") + "</span></td><td>" + (r.responsavel ? esc(r.responsavel) : '<span class="mudo">A definir</span>') + (r.prazo ? '<span class="sub">até ' + dataBR(r.prazo) + "</span>" : "") + "</td><td>" + esc(M.rotuloLista(CFG.escalas.statusMedida, r.statusMedida)) + "</td><td>" + (r.afetaEquilibrio ? "Sim" : "Não") + "</td><td>" + matrizCel + '</td><td class="acoes-linha"><button type="button" class="btn sutil pequeno" data-acao="editar-mapa" data-id="' + attr(r.id) + '" aria-label="Editar ' + attr(r.id) + '">' + IC.editar + '</button><button type="button" class="btn sutil pequeno" data-acao="excluir-mapa" data-id="' + attr(r.id) + '" aria-label="Excluir ' + attr(r.id) + '">' + IC.lixo + "</button></td></tr>");
    });
    if (!lista.length) h.push('<tr><td colspan="10" class="mudo">Nenhum risco com os filtros escolhidos.</td></tr>');
    h.push("</tbody></table></div>");
    h.push('<p class="pequeno mudo" style="margin-top:10px">O mapa registra quem conduz cada medida preventiva na Administração, mas não distribui riscos entre contratante e contratado. A alocação contratual é feita somente na matriz (E9.2).</p>');
    return h.join("");
  }

  function abaMatriz() {
    var d = doc(), A = calc.riscos;
    var sug = M.sugestoesMatriz(CFG, d).length;
    var desc = A.descobertos.length;
    var h = [];
    var concl = !!d.matrizInfo.concluida;
    h.push('<div class="faixa ' + (calc.ctx.matrizObrigatoria ? "aviso" : "") + '"><p><b>' + (calc.ctx.matrizObrigatoria ? "Matriz obrigatória" : "Matriz facultativa") + ".</b> " +
      (calc.ctx.matrizObrigatoria ? (calc.ctx.grandeVulto ? "Obra de grande vulto" : "Regime de " + M.rotuloCampo(CFG, "regime", calc.ctx.regime).toLowerCase()) + " (art. 22, §3º)." : "O edital poderá contemplar a matriz (art. 22, caput); recomenda-se elaborá-la para os riscos relevantes.") +
      " Situação: " + (concl ? "<b>concluída</b>" : "em elaboração") + ". " +
      '<button type="button" class="btn sutil pequeno" data-acao="matriz-concluir">' + (concl ? "Reabrir matriz" : "Marcar como concluída") + "</button></p></div>");
    h.push('<div class="barra-ferramentas"><div class="acoes">' +
      seletor("fx-aloc", "Responsável", ui.fMatriz.aloc, CFG.escalas.alocacoes, "matriz-aloc") +
      seletor("fx-mec", "Mecanismo", ui.fMatriz.mec, CFG.escalas.mecanismos, "matriz-mec") + "</div>" +
      '<div class="acoes"><button type="button" class="btn" data-acao="importar-mapa"' + (desc ? "" : " disabled") + ">Do mapa sem correspondência (" + desc + ")</button>" +
      '<button type="button" class="btn" data-acao="sugerir-matriz"' + (sug ? "" : " disabled") + ">Modelos típicos (" + sug + ")</button>" +
      '<button type="button" class="btn primario" data-acao="novo-matriz">' + IC.mais + "Novo risco</button></div></div>");
    if (!A.matriz.length) {
      h.push('<div class="vazio"><p>A matriz ainda não tem riscos alocados. Use os modelos típicos (já ajustados ao regime de execução) ou traga do mapa os riscos que afetam o equilíbrio do contrato.</p><div class="acoes"><button type="button" class="btn primario" data-acao="sugerir-matriz">Adicionar modelos típicos</button><button type="button" class="btn" data-acao="novo-matriz">Novo risco</button></div></div>');
      return h.join("");
    }
    var lista = A.matriz.filter(function (a) {
      if (ui.fMatriz.aloc && a.m.alocacao !== ui.fMatriz.aloc) return false;
      if (ui.fMatriz.mec && a.m.mecanismo !== ui.fMatriz.mec) return false;
      return true;
    });
    h.push('<div class="tabela-wrap"><table class="tabela" id="tabela-matriz"><thead><tr><th>ID</th><th>Risco</th><th>Categoria</th><th>Responsável</th><th>Mecanismo</th><th>Cláusula e parâmetros</th><th>Mapa</th><th>Orçamento</th><th><span class="sr">Ações</span></th></tr></thead><tbody>');
    lista.forEach(function (a) {
      var m = a.m;
      var probs = a.problemas.length ? '<ul class="problemas">' + a.problemas.map(function (p) { return '<li class="' + p.nivel + '">' + (p.nivel === "erro" ? IC.erro : IC.aviso) + "<span>" + esc(p.texto) + "</span></li>"; }).join("") + "</ul>" : "";
      h.push('<tr><td class="id">' + esc(m.id) + "</td><td>" + esc(m.descricao) + probs + "</td><td>" + esc(m.categoria) + "</td><td>" + (m.alocacao ? "<b>" + esc(M.rotuloLista(CFG.escalas.alocacoes, m.alocacao)) + "</b>" : '<span style="color:var(--vermelho)">A definir</span>') + (m.alocacao === "compartilhado" && m.criterio ? '<span class="sub">' + esc(m.criterio) + "</span>" : "") + "</td><td>" + (m.mecanismo ? esc(M.rotuloLista(CFG.escalas.mecanismos, m.mecanismo)) : '<span style="color:var(--vermelho)">A definir</span>') + "</td><td>" + (m.clausula ? esc(m.clausula) : '<span style="color:var(--vermelho)">Sem cláusula</span>') + (m.parametros ? '<span class="sub">' + esc(m.parametros) + "</span>" : "") + "</td><td>" + (a.refs.length ? esc(a.refs.join(", ")) + (a.nivel ? '<span class="sub">' + nivelTag(a.nivel) + "</span>" : "") : '<span class="mudo">Sem vínculo</span>') + "</td><td>" + (m.alocacao === "contratante" ? '<span class="mudo">Não se aplica</span>' : (m.mecanismo === "reajuste" ? '<span class="mudo">Coberto pelo reajuste</span>' : (m.noOrcamento ? "Refletido" + (m.quantificacao ? '<span class="sub">' + esc(m.quantificacao) + "</span>" : "") : '<span style="color:var(--ocre)">A quantificar</span>'))) + '</td><td class="acoes-linha"><button type="button" class="btn sutil pequeno" data-acao="editar-matriz" data-id="' + attr(m.id) + '" aria-label="Editar ' + attr(m.id) + '">' + IC.editar + '</button><button type="button" class="btn sutil pequeno" data-acao="excluir-matriz" data-id="' + attr(m.id) + '" aria-label="Excluir ' + attr(m.id) + '">' + IC.lixo + "</button></td></tr>");
    });
    if (!lista.length) h.push('<tr><td colspan="9" class="mudo">Nenhum risco com os filtros escolhidos.</td></tr>');
    h.push("</tbody></table></div>");
    return h.join("");
  }

  function abaCalor() {
    var A = calc.riscos;
    var cont = {};
    A.mapa.forEach(function (a) { var k = a.r.p + "-" + a.r.i; cont[k] = (cont[k] || 0) + 1; });
    var P = CFG.escalas.probabilidade, I = CFG.escalas.impacto;
    var h = ['<p class="mudo">Distribuição dos riscos do mapa por probabilidade e impacto. Selecione uma célula para ver os riscos correspondentes na aba do mapa.</p>'];
    h.push('<div class="calor" role="grid" aria-label="Mapa de calor dos riscos">');
    h.push('<div class="cab"></div>' + I.map(function (x) { return '<div class="cab">' + x.valor + " " + esc(x.rotulo) + "</div>"; }).join(""));
    P.slice().reverse().forEach(function (p) {
      h.push('<div class="cab y">' + p.valor + " " + esc(p.rotulo) + "</div>");
      I.forEach(function (i) {
        var n = cont[p.valor + "-" + i.valor] || 0;
        var nv = M.nivel(CFG, p.valor, i.valor);
        h.push('<button type="button" class="' + nv.id + (n ? "" : " vazia") + '" data-acao="celula" data-p="' + p.valor + '" data-i="' + i.valor + '" aria-label="Probabilidade ' + p.valor + ", impacto " + i.valor + ", nível " + attr(nv.rotulo) + ": " + n + ' risco(s)">' + (n || "0") + "</button>");
      });
    });
    h.push("</div><p class=\"eixo\">Linhas: probabilidade. Colunas: impacto. Níveis: baixo (até 4), moderado (5 a 9), alto (10 a 15) e crítico (16 a 25), conforme a base configurada.</p>");
    return h.join("");
  }

  /* ---------------------------- formulários de risco ---------------------------- */

      campoModal("mr-trat", "Medida de tratamento", '<select id="mr-trat" name="tratamento">' + opcoesHtml(CFG.escalas.tratamentos, r.tratamento) + "</select>") +

      campoModal("mx-quant", "Quantificação no valor estimado", '<input type="text" id="mx-quant" name="quantificacao" value="' + attr(mx.quantificacao) + '">', true, "Art. 103, §3º: taxa de risco no BDI ou provisão específica.") +

  function lerForm(f) {
    var v = {};
    $$("input, select, textarea", f).forEach(function (el) {
      if (!el.name) return;
      if (el.type === "checkbox") {
        if (el.name === "mrRefs") { v.mrRefs = v.mrRefs || []; if (el.checked) v.mrRefs.push(el.value); }
        else v[el.name] = el.checked;
      } else v[el.name] = el.value;
    });
    return v;
  }

  function seletorModelos(titulo, descricao, itens, rotuloOk, aoAdicionar) {
    var corpo = '<ul class="lista-sel">' + itens.map(function (t) {
      return '<li><label><input type="checkbox" name="sel" value="' + attr(t.id) + '" checked><span class="id">' + esc(t.id) + "</span><span>" + esc(t.titulo) + "<small>" + esc(t.sub) + "</small></span></label></li>";
    }).join("") + "</ul>";
    abrirModal({
      titulo: titulo, descricao: descricao, corpo: corpo, largo: true,
      botoes: [{ rotulo: "Cancelar" }, {
        rotulo: rotuloOk, classe: "primario", acao: function (m) {
          var sel = $$("input[name=sel]:checked", m).map(function (x) { return x.value; });
          if (!sel.length) { avisar("Selecione ao menos um item."); return false; }
          aoAdicionar(sel);
        }
      }]
    });
  }

      h.push('<ul class="alerta-lista">' + r.inconsistencias.map(function (i) {

      }).join("") + "</ul>");
    }
    h.push("</section>");

    h.push("</section>");
    h.push('<section class="bloco"><h2>Alertas para esta tipologia (' + r.alertas.length + ")</h2>");
    if (!r.alertas.length) h.push('<p class="mudo">Sem alertas específicos com os dados atuais.</p>');
    else h.push('<ul class="alerta-lista">' + r.alertas.map(function (a) { return '<li class="alerta info">' + IC.info + "<div><b>" + esc(a.titulo) + "</b><p>" + esc(a.texto) + '</p><p class="motivo-linha">Ativado porque: ' + esc(M.explicarAtivo(CFG.alertas.filter(function (x) { return x.id === a.id; })[0].se, r.ctx, CFG)) + "</p></div><span></span></li>"; }).join("") + "</ul>");
    h.push("</section>");

      h.push('<section class="bloco"><h2>Avanços de etapa com ressalva</h2><div class="tabela-wrap"><table class="tabela"><thead><tr><th>Data</th><th>Etapas</th><th>Pendências críticas</th><th>Motivação</th></tr></thead><tbody>' + d.ressalvas.map(function (x) { return "<tr><td>" + dataBR(x.em) + "</td><td>" + esc(x.de + " para " + x.para) + "</td><td>" + esc((x.pendentes || []).join(", ")) + "</td><td>" + esc(x.texto) + "</td></tr>"; }).join("") + "</tbody></table></div></section>");

  }
  function baixar(nome, conteudo, tipo) {
    var blob = new Blob([conteudo], { type: tipo });
    var U = window.URL || window.webkitURL;
    if (!U || !U.createObjectURL) { avisar("O navegador não permitiu o download do arquivo."); return false; }
    var url = U.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nome; a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { U.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 800);
    return true;
  }

  function importarTexto(texto) {
    var j;

      var erroB = M.validarConfig(j);

      avisar("Base normativa importada: versão " + (j.versao || "sem número") + ".");
      render(); return;
    }
    var lista = j && j.obras && typeof j.obras === "object" && !j.obra ? Object.keys(j.obras).map(function (k) { return j.obras[k]; }) : [j];
    var importadas = 0, ultimo = null, erro = null;
    lista.forEach(function (d) {
      var e = M.validarDoc(d);
      if (e) { erro = e; return; }
      M.migrar(CFG, d);
      if (dados.obras[d.id]) { d.id = M.uid("ob"); d.obra.nome = (d.obra.nome || "Obra") + " (importada)"; }
      dados.obras[d.id] = d;
      importadas++; ultimo = d.id;

    if (!importadas) { avisar("Nada importado: " + (erro || "arquivo sem obras.")); return; }
    dados.ativa = ultimo;

      d.matrizInfo.concluida = true; d.matrizInfo.concluidaEm = M.agora();
      historico("Matriz de riscos marcada como concluída");
      salvar(); render(); avisar("Matriz marcada como concluída.");
    },
    "revisao-ok": function (el) {
      var r = doc().revisoes.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      if (r) { r.resolvida = true; r.resolvidaEm = M.agora(); historico("Revisão de riscos registrada: " + r.motivo); salvar(); render(); }
    },
    "revisoes-ok": function () {
      doc().revisoes.forEach(function (r) { if (!r.resolvida) { r.resolvida = true; r.resolvidaEm = M.agora(); } });
      historico("Revisões de riscos registradas");
      salvar(); render(); avisar("Revisões registradas.");
    },
    "imprimir": function () {
      var html = Relatorio.gerar(CFG, doc(), calc);
      var ifr = document.createElement("iframe");
      ifr.setAttribute("aria-hidden", "true");
      ifr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;";
      document.body.appendChild(ifr);
      try {
        var w = ifr.contentWindow;
        w.document.open(); w.document.write(html); w.document.close();
        setTimeout(function () {
          try { w.focus(); w.print(); } catch (e) { avisar("Não foi possível abrir a impressão. Use Baixar relatório e imprima pelo navegador."); }
          setTimeout(function () { if (ifr.parentNode) ifr.parentNode.removeChild(ifr); }, 60000);
        }, 300);
      } catch (e) { avisar("Não foi possível preparar a impressão. Use Baixar relatório."); }
    },
    "baixar-relatorio": function () {
      var d = doc();
      if (baixar("relatorio-situacao-" + slug(d.obra.nome) + "-" + M.hoje() + ".html", Relatorio.gerar(CFG, d, calc), "text/html")) avisar("Relatório baixado.");
    }
  };

  /* ------------------------------- eventos ------------------------------- */
  var CHAVES_REVISAO = /^(tipologia|natureza|regime|valorEstimado|prazoMeses|licResp|despResp|fonte|terreno\.|local\.|edif\.|saude\.|viaria\.|saneamento\.|urbana\.)/;

  function valorDoCampo(el) {
    var t = el.getAttribute("data-tipo");
    if (el.type === "checkbox") return el.checked;
    if (t === "numero" || t === "moeda") { var n = M.num(el.value); return n; }
    return el.value;
  }

  function aoMudarCampo(el) {
    var d = doc();
    if (!d) return;
    var caminho = el.getAttribute("data-campo");
    var antes = M.obter(d, caminho);
    var v = valorDoCampo(el);
    M.definir(d, caminho, v);
    var sujo = !!ui.sujos[caminho];
    delete ui.sujos[caminho];
    if (antes === v && !sujo) return;
    var chave = caminho.replace(/^obra\./, "");
    var rotulo = (M.mapaRotulos(CFG)[chave] || {}).rotulo || chave;
    if (CHAVES_REVISAO.test(chave)) M.registrarRevisao(d, "cadastro", "Dados da obra alterados (" + rotulo + ")");
    if (/^orcamento\./.test(chave)) M.registrarRevisao(d, "orcamento", "Parâmetros do orçamento alterados (" + rotulo + ")");
    M.sincronizarRiscosAprovacoes(CFG, d);
    if (el.type !== "text" && el.tagName !== "TEXTAREA") historico(rotulo + " alterado");
    salvar();
    renderSeguro();
  }

  function mudarStatus(id, novo, el) {
    var d = doc(), it = calc.porId[id];
    if (!it) return;
    d.itens[id] = d.itens[id] || {};
    var reg = d.itens[id], anterior = reg.status || "nao_iniciado";
    var lista = it.tipo === "aprovacao" ? M.STATUS_APROV : M.STATUS;
    if (novo === "na") {
      if (it.naProibido) { avisar("Elemento obrigatório do ETP (art. 18, §2º): não pode ser marcado como não aplicável."); el.value = anterior; return; }
      abrirModal({
        titulo: "Justificar não aplicabilidade", descricao: id + " " + it.titulo,
        corpo: '<div class="campo"><label for="just-na">Justificativa (obrigatória)</label><textarea id="just-na">' + esc(reg.justificativa || "") + "</textarea></div>",
        foco: "#just-na",
        botoes: [{ rotulo: "Cancelar", acao: function () { render(); } }, {
          rotulo: "Marcar como não aplicável", classe: "primario", acao: function (m) {
            var t = $("#just-na", m).value.trim();
            if (!t) { avisar("A justificativa é obrigatória para marcar o item como não aplicável."); $("#just-na", m).focus(); return false; }
            reg.status = "na"; reg.justificativa = t;
            concluirMudanca(it, anterior, "na", lista);
          }
        }]
      });
      return;
    }
    reg.status = novo;
    if (novo === "concluido" && !reg.dataRealizada && it.tipo !== "aprovacao") reg.dataRealizada = M.hoje();
    if (novo === "concluido" && it.tipo === "aprovacao" && !reg.dataEmissao) reg.dataEmissao = M.hoje();
    concluirMudanca(it, anterior, novo, lista);
  }
  function concluirMudanca(it, anterior, novo, lista) {
    var d = doc();
    historico(it.id + ": " + M.rotuloLista(lista, anterior) + " para " + M.rotuloLista(lista, novo));
    if (it.tipo === "aprovacao") M.sincronizarRiscosAprovacoes(CFG, d);
    if (["E2", "E6", "E7", "E10"].indexOf(it.etapa) >= 0) {
      var vinc = M.riscosVinculados(d, it.id, it.etapa);
      if (vinc.length) M.registrarRevisao(d, "item:" + it.id, "Item " + it.id + " (" + it.titulo + ") alterado, com riscos vinculados " + vinc.slice(0, 6).join(", ") + (vinc.length > 6 ? " e outros" : ""));
    }
    salvar();
    render();
  }

  /* conferência do conteúdo mínimo (marcações gravadas no registro do item) */
  function marcarConteudo(id, todos) {
    var d = doc(), it = calc && calc.porId[id];
    if (!d || !it || !it.conteudo) return;
    var reg = d.itens[id] = d.itens[id] || {};
    reg.conferidos = todos ? M.chavesConteudo(it.conteudo) : [];
    historico(id + ": conteúdo mínimo " + (todos ? "todo conferido" : "desmarcado"));
    salvar();
    render();
  }
  function alternarConferencia(el) {
    var d = doc(), id = el.getAttribute("data-conferir"), k = el.getAttribute("data-chave");
    if (!d) return;
    var reg = d.itens[id] = d.itens[id] || {};
    var l = Array.isArray(reg.conferidos) ? reg.conferidos.slice() : [];
    var i = l.indexOf(k);
    if (el.checked && i < 0) l.push(k);
    if (!el.checked && i >= 0) l.splice(i, 1);
    reg.conferidos = l;
    salvar();
    renderSeguro();
  }

  function aoInput(ev) {
    var el = ev.target;
    if (el.hasAttribute("data-campo")) {
      var t = el.getAttribute("data-tipo");
      if (t === "texto" || t === "textoLongo" || t === "numero" || t === "moeda" || t === "mes") {
        var d = doc();
        if (!d) return;
        M.definir(d, el.getAttribute("data-campo"), valorDoCampo(el));
        ui.sujos[el.getAttribute("data-campo")] = true;
        if (t === "moeda") { var f = document.getElementById(el.id + "-fmt"); if (f) f.textContent = el.value ? M.moeda(el.value) : ""; }
        salvar();
      }
      return;
    }
    if (el.hasAttribute("data-reg") && (el.tagName === "TEXTAREA" || el.type === "text")) {
      var dd = doc(), id = el.getAttribute("data-item");
      dd.itens[id] = dd.itens[id] || {};
      dd.itens[id][el.getAttribute("data-reg")] = el.value;
      salvar();
      return;
    }
    if (el.hasAttribute("data-filtro-base") && el.type === "text") {
      ui.fBase.busca = el.value;
      clearTimeout(ui.tBusca);
      ui.tBusca = setTimeout(function () { render(); }, 220);
    }
  }

  function aoChange(ev) {
    var el = ev.target;
    if (el.id === "sel-obra") { if (el.value) { dados.ativa = el.value; gravarAgora(); ir(ui.visao === "inicio" ? "painel" : ui.visao); } return; }
    if (el.id === "arquivo") {
      var arq = el.files && el.files[0];
      if (!arq) return;
      var leitor = new FileReader();
      leitor.onload = function () { importarTexto(String(leitor.result || "")); };
      leitor.onerror = function () { avisar("Não foi possível ler o arquivo."); };
      leitor.readAsText(arq, "utf-8");
      return;
    }
    if (el.hasAttribute("data-status-item")) { mudarStatus(el.getAttribute("data-status-item"), el.value, el); return; }
    if (el.hasAttribute("data-conferir")) { alternarConferencia(el); return; }
    if (el.hasAttribute("data-campo")) { aoMudarCampo(el); return; }
    if (el.hasAttribute("data-reg")) {
      var d = doc(), id = el.getAttribute("data-item"), campo = el.getAttribute("data-reg");
      d.itens[id] = d.itens[id] || {};
      d.itens[id][campo] = el.value;
      if (campo === "respObtencao") { historico(id + ": responsável pela obtenção definido"); M.sincronizarRiscosAprovacoes(CFG, d); }
      salvar();
      if (el.type === "date" || el.tagName === "SELECT") renderSeguro();
      return;
    }
    if (el.hasAttribute("data-filtro-risco")) {
      var k = el.getAttribute("data-filtro-risco");
      var mapa = { "mapa-fase": ["fMapa", "fase"], "mapa-nivel": ["fMapa", "nivel"], "mapa-medida": ["fMapa", "medida"], "matriz-aloc": ["fMatriz", "aloc"], "matriz-mec": ["fMatriz", "mec"] }[k];
      if (mapa) { ui[mapa[0]][mapa[1]] = el.value; render(); }
      return;
    }
    if (el.hasAttribute("data-filtro-base") && el.tagName === "SELECT") { ui.fBase.etapa = el.value; render(); }
  }

  function aoClicar(ev) {
    var mb = ev.target.closest("[data-modal-acao]");
    if (mb && modal) {
      var atual = modal;
      var b = atual.o.botoes[+mb.getAttribute("data-modal-acao")];
      var r = b && b.acao ? b.acao($(".modal")) : undefined;
      if (r !== false && modal === atual) fecharModal();
      return;
    }
    var fundo = ev.target.classList && ev.target.classList.contains("modal-fundo") && ev.target.hasAttribute("data-fundo");
    if (fundo) { fecharModal(); return; }
    var alvo = ev.target.closest("[data-acao]");
    if (!alvo || alvo.disabled) return;
    var acao = alvo.getAttribute("data-acao");
    if (ACOES[acao]) { ev.preventDefault(); ACOES[acao](alvo, ev); }
  }

  function aoTeclar(ev) {
    if (!modal) return;
    if (ev.key === "Escape" && !modal.o.bloqueante) { ev.preventDefault(); fecharModal(); return; }
    if (ev.key === "Tab") {
      var foc = $$('.modal button:not([disabled]), .modal input:not([disabled]), .modal select, .modal textarea, .modal [href]').filter(function (x) { return x.offsetParent !== null || x === document.activeElement; });
      if (!foc.length) return;
      var pri = foc[0], ult = foc[foc.length - 1];
      if (ev.shiftKey && document.activeElement === pri) { ev.preventDefault(); ult.focus(); }
      else if (!ev.shiftKey && document.activeElement === ult) { ev.preventDefault(); pri.focus(); }
    }
  }

  /* ------------------------------- início ------------------------------- */
  function iniciar() {
    carregar();
    aplicarTema();
    $(".marca").insertAdjacentHTML("afterbegin", LOGO);
    if (doc()) ui.visao = "painel";
    document.addEventListener("click", aoClicar);
    document.addEventListener("change", aoChange);
    document.addEventListener("input", aoInput);
    document.addEventListener("keydown", aoTeclar);
    document.addEventListener("pointerdown", function () { ponteiroAbaixo = true; }, true);
    document.addEventListener("pointerup", function () {
      ponteiroAbaixo = false;
      if (renderPendente) setTimeout(function () { if (renderPendente) render(); }, 0);
    }, true);
    document.addEventListener("pointercancel", function () { ponteiroAbaixo = false; if (renderPendente) render(); }, true);
    window.addEventListener("beforeunload", function () { if (timerSalvar) gravarAgora(); });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden" && timerSalvar) gravarAgora(); });
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var f = function () { if (dados.prefs.tema === "auto") renderTopo(); };
      if (mq.addEventListener) mq.addEventListener("change", f); else if (mq.addListener) mq.addListener(f);
    }
    render();
    mostrarAbertura();
  }

  window.ObraCheck = { versao: CFG_ORIGINAL.versao, duracaoAbertura: DURACAO_ABERTURA, estado: function () { return { dados: dados, ui: ui, calc: calc, cfg: CFG }; } };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
  else iniciar();
})();

</script>
</body>
</html>
