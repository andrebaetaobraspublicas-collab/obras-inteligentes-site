      var d = res.riscos.descobertos;
      return { ok: d.length === 0, parcial: true, detalhe: d.length ? "Sem correspondência na matriz: " + d.map(function (a) { return a.r.id; }).join(", ") : "Riscos relevantes do mapa refletidos na matriz" };
    },
    matriz_orcamento: function (cfg, doc, res) {
      if (!(doc.matriz || []).length) return { ok: false, detalhe: "Matriz vazia" };
      var f = res.riscos.matriz.filter(function (a) { return a.problemas.some(function (p) { return p.cod === "orcamento"; }); });
      return { ok: f.length === 0, parcial: true, detalhe: f.length ? "Sem reflexo no valor estimado: " + f.map(function (a) { return a.m.id; }).join(", ") : "Riscos do contratado refletidos no valor estimado" };
    },
    matriz_seguro: function (cfg, doc, res) {
      if (!(doc.matriz || []).length) return { ok: false, detalhe: "Matriz vazia" };
      var f = res.riscos.matriz.filter(function (a) { return a.problemas.some(function (p) { return p.cod === "seguro"; }); });
      return { ok: f.length === 0, parcial: true, detalhe: f.length ? "Seguráveis com a contratante: " + f.map(function (a) { return a.m.id; }).join(", ") : "Riscos seguráveis com o contratado" };
    },
    matriz_concluida: function (cfg, doc) {
      var c = !!(doc.matrizInfo && doc.matrizInfo.concluida);
      return { ok: c, parcial: (doc.matriz || []).length > 0, detalhe: c ? "Matriz marcada como concluída" : "Matriz em elaboração" };
    },
    revisoes: function (cfg, doc) {
      var p = (doc.revisoes || []).filter(function (r) { return !r.resolvida; }).length;
      if (!(doc.mapa || []).length && !(doc.matriz || []).length) return { ok: false, detalhe: "Riscos ainda não identificados" };
      return { ok: p === 0, parcial: true, detalhe: p ? p + " revisão(ões) pendente(s)" : "Nenhuma revisão pendente" };
    },
    orc_database: function (cfg, doc) {
      var db = obter(doc, "obra.orcamento.dataBase");
      if (!db) return { ok: false, detalhe: "Data-base não informada" };
      var idade = mesesEntre(db, hoje());
      var lim = cfg.parametros.idadeMaxDataBaseMeses;
      if (idade != null && idade > lim) return { ok: false, parcial: true, detalhe: "Data-base com " + idade + " meses (referência configurada: até " + lim + ")" };
      return { ok: true, detalhe: "Data-base " + db.split("-").reverse().join("/") };
    },
    orc_bdi: function (cfg, doc) {
      var b = num(obter(doc, "obra.orcamento.bdi"));
      return { ok: b != null && b > 0, detalhe: b != null && b > 0 ? "BDI informado: " + numero(b, 2) + "%" : "BDI não informado" };
    },
    orc_riscos: function (cfg, doc, res) {
      if (!(doc.mapa || []).length && !(doc.matriz || []).length) return { ok: false, detalhe: "Riscos ainda não identificados" };
      var relevantes = res.riscos.matriz.filter(function (a) {
        return (a.m.alocacao === "contratado" || a.m.alocacao === "compartilhado") && a.m.mecanismo !== "reajuste" && nivelAlto(a.nivel);
      });
      var f = relevantes.filter(function (a) { return !a.m.noOrcamento; });
      return { ok: f.length === 0, vazio: relevantes.length === 0, parcial: true, detalhe: f.length ? "Riscos altos ou críticos do contratado sem reflexo no orçamento: " + f.map(function (a) { return a.m.id; }).join(", ") : "Sem riscos altos do contratado pendentes de quantificação" };
    },
    gate_itens: function (cfg, doc, res) {
      var pend = res.ativos.filter(function (it) {
        return it.etapa !== "E12" && it.crit === "critico" && res.estados[it.id] && !res.estados[it.id].resolvido;
      });
      return { ok: pend.length === 0, parcial: pend.length < res.ativos.length, detalhe: pend.length ? pend.length + " item(ns) crítico(s) pendente(s) em E1 a E11" : "Todos os itens críticos atendidos ou justificados" };
    },
    gate_aprovacoes: function (cfg, doc, res) {
      var ap = res.ativos.filter(function (it) { return it.tipo === "aprovacao" && it.momento === "antes_edital" && it.crit === "critico"; });
      if (!ap.length) return { ok: true, vazio: true, detalhe: "Nenhuma aprovação crítica exigida antes do edital" };
      var pend = ap.filter(function (it) { return !res.estados[it.id].resolvido; });
      return { ok: pend.length === 0, parcial: pend.length < ap.length, detalhe: pend.length ? "Pendentes: " + pend.map(function (it) { return it.id; }).join(", ") : "Aprovações exigidas antes do edital obtidas" };
    },
    gate_riscos: function (cfg, doc, res) {
      if (!(doc.mapa || []).length) return { ok: false, detalhe: "Mapa de riscos vazio" };
      var a = AUTO.mapa_tratamento(cfg, doc, res), b = AUTO.mapa_medidas(cfg, doc, res);
      return { ok: a.ok && b.ok, parcial: true, detalhe: a.ok && b.ok ? "Riscos críticos tratados" : [a.ok ? "" : a.detalhe, b.ok ? "" : b.detalhe].filter(Boolean).join("; ") };
    },
    gate_matriz: function (cfg, doc, res) {
      var checks = ["matriz_existe", "matriz_alocacao", "matriz_clausula", "matriz_escopo", "matriz_concluida"].map(function (k) { return AUTO[k](cfg, doc, res); });
      var falhas = checks.filter(function (c) { return !c.ok; });
      return { ok: falhas.length === 0, parcial: (doc.matriz || []).length > 0, detalhe: falhas.length ? falhas.map(function (c) { return c.detalhe; }).join("; ") : "Matriz válida e concluída" };
    },
    gate_inconsistencias: function (cfg, doc, res) {
      var erros = (res.inconsistencias || []).filter(function (i) { return i.nivel === "erro"; });
      if (!etapaIniciada(res, "E11")) return { ok: false, detalhe: erros.length ? erros.length + " inconsistência(s) bloqueante(s)" : "Aguardando a elaboração dos documentos da licitação (E11)" };
      return { ok: erros.length === 0, parcial: true, detalhe: erros.length ? erros.length + " inconsistência(s) bloqueante(s)" : "Nenhuma inconsistência bloqueante" };
    }
  };

  function estadoItem(cfg, doc, it, res) {
    var reg = registro(doc, it.id), status, autoRes = null;
    if (it.auto) {
      autoRes = AUTO[it.auto] ? AUTO[it.auto](cfg, doc, res) : { ok: false, detalhe: "Verificação não encontrada" };
      status = autoRes.ok ? "concluido" : (autoRes.parcial ? "em_elaboracao" : "nao_iniciado");
    } else status = reg.status || "nao_iniciado";
    var ok = resolvido(it, reg, status);
    var atrasado = !ok && !!reg.dataPrevista && reg.dataPrevista < hoje();
    var conferencia = null;
    if (it.conteudo) {
      var ks = chavesConteudo(it.conteudo), marcados = Array.isArray(reg.conferidos) ? reg.conferidos : [];
      conferencia = { total: ks.length, feitos: ks.filter(function (k) { return marcados.indexOf(k) >= 0; }).length };
    }
    return { status: status, resolvido: ok, auto: autoRes, reg: reg, atrasado: atrasado, vazio: !!(autoRes && autoRes.vazio), conferencia: conferencia };
  }

  /* --------------------------- inconsistências --------------------------- */
  function inconsistencias(cfg, doc, res) {
    var L = [];
    var o = doc.obra || {}, ctx = res.ctx;
    var est = function (id) { return res.estados[id] || null; };
    var concl = function (id) { var e = est(id); return !!(e && e.status === "concluido"); };
    var add = function (id, nivelI, titulo, detalhe, etapa, extra) { L.push(mesclar({ id: id, nivel: nivelI, titulo: titulo, detalhe: detalhe || "", etapa: etapa || null }, extra || {})); };
    var orc = o.orcamento || {};

    // cadastro essencial
    var faltam = [];
    if (!o.nome) faltam.push("nome");
    if (!o.tipologia) faltam.push("tipologia");
    if (!o.regime) faltam.push("regime de execução");
    if (num(o.valorEstimado) == null) faltam.push("valor estimado");
    if (num(o.prazoMeses) == null) faltam.push("prazo");
    if (faltam.length) add("INC.01", "aviso", "Cadastro incompleto", "Preencha: " + faltam.join(", ") + ". As exigências dependem desses dados.", null, { visao: "cadastro" });

    if (o.terreno && o.terreno.dominio === "indefinido") add("INC.02", "erro", "Situação dominial indefinida", "Sem titularidade ou posse comprovada não é possível licitar a obra com segurança.", "E3");

    // orçamento
    var e10Ini = etapaIniciada(res, "E10") || num(orc.valorOrcado) != null;
    if (e10Ini && !(num(orc.bdi) > 0)) add("INC.03", "erro", "Orçamento sem BDI informado", "Informe o BDI nos parâmetros do orçamento (E10).", "E10");
    if (orc.sigiloso && o.contratacao && o.contratacao.criterio === "maior_desconto") add("INC.04", "erro", "Orçamento sigiloso com critério de maior desconto", "No critério de maior desconto, o preço estimado ou o máximo aceitável deve constar do edital (art. 24, parágrafo único).", "E10");
    if (orc.sigiloso && !(orc.justSigilo && String(orc.justSigilo).trim())) add("INC.05", "aviso", "Sigilo do orçamento sem justificativa", "O caráter sigiloso depende de justificativa (art. 24) e de motivação sobre o momento da divulgação (art. 18, XI).", "E10");
    if (orc.dataBase) {
      var idade = mesesEntre(orc.dataBase, hoje());
      if (idade != null && idade > cfg.parametros.idadeMaxDataBaseMeses) add("INC.06", "aviso", "Data-base do orçamento antiga", "A data-base tem " + idade + " meses. Orçamentos defasados aumentam o risco de licitação deserta; avalie a atualização.", "E10");
    }
    var bdi = num(orc.bdi), faixaId = cfg.parametros.bdiFaixaPorTipologia ? cfg.parametros.bdiFaixaPorTipologia[o.tipologia] : null, faixa = faixaId ? cfg.parametros.bdiFaixas[faixaId] : null;
    if (bdi != null && bdi > 0 && faixa && (bdi < faixa.q1 || bdi > faixa.q3)) add("INC.07", "aviso", "BDI fora da faixa referencial", "BDI de " + numero(bdi, 2) + "% fora da faixa de " + numero(faixa.q1, 2) + "% a " + numero(faixa.q3, 2) + "% (" + faixa.rotulo + ", " + cfg.parametros.bdiRef + "). Registre a justificativa.", "E10");
    if (o.tipologia === "viaria" && obter(o, "viaria.ambito") === "rodoviaria" && orc.referencia === "sinapi") add("INC.08", "aviso", "Obra rodoviária referenciada apenas no SINAPI", "Para infraestrutura de transportes, o art. 23, §2º, I, indica o SICRO como referência.", "E10");
    var vo = num(orc.valorOrcado), ve = num(o.valorEstimado);
    if (vo != null && ve != null && ve > 0) {
      var dif = Math.abs(vo - ve) / ve * 100;
      if (dif > cfg.parametros.divergenciaValorPct) add("INC.09", "aviso", "Valor orçado diverge do valor estimado no ETP", "Diferença de " + numero(dif, 1) + "%. Atualize a estimativa do ETP (art. 18, §1º, VI) e verifique o enquadramento em grande vulto.", "E4");
      if (vo > cfg.parametros.grandeVulto && ve <= cfg.parametros.grandeVulto) add("INC.10", "erro", "Orçamento ultrapassa o limite de grande vulto", "O valor orçado supera " + moeda(cfg.parametros.grandeVulto) + ". Atualize o valor estimado no cadastro: a matriz de riscos e o programa de integridade passam a ser obrigatórios.", "E10", { visao: "cadastro" });
    }

    // ETP, projeto e TR
    var e4Concluidos = res.ativos.filter(function (it) { return it.etapa === "E4" && !it.auto && concl(it.id); }).length;
    if (est("E4.13") && !concl("E4.13") && (etapaIniciada(res, "E5") || etapaIniciada(res, "E6"))) add("INC.11", "erro", "ETP sem posicionamento conclusivo", "Concepção ou projeto básico em andamento sem a conclusão sobre a adequação da contratação (art. 18, §1º, XIII).", "E4");
    if (e4Concluidos > 0 && !(doc.mapa || []).length) add("INC.12", "erro", "ETP sem mapa de riscos", "O ETP está em elaboração e o mapa de riscos (art. 18, X) ainda não foi iniciado.", "E9", { visao: "riscos" });
    var sond = est("E2.03");
    var pbIniciado = ["E6.01", "E6.02", "E7.20"].some(function (id) { return concl(id); });
    if (sond && !sond.resolvido && pbIniciado) add("INC.13", "erro", "Projeto básico sem sondagem para obra com fundações", "Há elementos do projeto básico concluídos sem a investigação geotécnica (E2.03).", "E2");
    var e11Ini = etapaIniciada(res, "E11");
    if (e11Ini && num(o.prazoMeses) == null) add("INC.14", "erro", "Termo de referência sem prazo", "Defina o prazo de execução no cadastro e no termo de referência (art. 6º, XXIII, a).", "E11", { visao: "cadastro" });
    if (concl("E11.21") && num(o.prazoMeses) == null) add("INC.14b", "erro", "Prazo marcado como definido sem valor no cadastro", "Informe o prazo em meses no cadastro.", "E11");
    if ((e11Ini || concl("E11.25")) && ctx.matrizObrigatoria && !(doc.matriz || []).length) add("INC.15", "erro", "Termo de referência sem matriz de riscos anexa", "A matriz é obrigatória para esta contratação (art. 22, §3º).", "E9", { visao: "riscos", aba: "matriz" });
    else if (concl("E11.25") && !(doc.matriz || []).length) add("INC.15", "erro", "Matriz indicada como anexa, mas não elaborada", "Elabore a matriz no módulo E9.2.", "E9", { visao: "riscos", aba: "matriz" });
    if (ctx.matrizObrigatoria && !(doc.matriz || []).length && (etapaIniciada(res, "E4") || etapaIniciada(res, "E6")) && !e11Ini) add("INC.16", "aviso", "Matriz de riscos obrigatória ainda não iniciada", (ctx.grandeVulto ? "Obra de grande vulto" : "Regime de contratação integrada ou semi-integrada") + ": a matriz é obrigatória (art. 22, §3º).", "E9", { visao: "riscos", aba: "matriz" });
    if (o.regime === "integrada" && e11Ini) {
      var antep = res.ativos.filter(function (it) { return /^E5\.(09|1\d)$/.test(it.id) && !res.estados[it.id].resolvido; });
      if (antep.length) add("INC.17", "erro", "Contratação integrada sem anteprojeto completo", antep.length + " elemento(s) do anteprojeto pendente(s) (art. 6º, XXIV, e art. 46, §2º).", "E5");
    }
    var mod = obter(o, "contratacao.modalidade"), enq = o.enquadramento || "";
    if (mod === "pregao" && enq && enq !== "servico_comum") add("INC.18", "erro", "Pregão incompatível com o enquadramento do objeto", "O objeto foi enquadrado como " + rotuloCampo(cfg, "enquadramento", enq).toLowerCase() + "; o pregão só se aplica a serviço comum de engenharia (art. 29, parágrafo único).", "E11");
    else if (mod === "pregao" && !enq && ["nova", "ampliacao"].indexOf(o.natureza) >= 0) add("INC.18", "erro", "Pregão indicado para obra", "O pregão não se aplica a obras (art. 29, parágrafo único).", "E11");
    else if (mod === "pregao" && !enq && o.natureza === "reforma") add("INC.18", "aviso", "Pregão em reforma", "Confirme o enquadramento como serviço comum de engenharia (art. 6º, XXI, a, e art. 29, parágrafo único).", "E11");

    // licenciamento
    var ap09 = est("AP.09");
    if (ap09 && ctx.licResp !== "contratado" && !ap09.resolvido && e11Ini) add("INC.19", "erro", "Licença prévia pendente com licenciamento a cargo da Administração", "A licença prévia ou a manifestação prévia deve ser obtida antes da divulgação do edital (art. 115, §4º).", "E8");
    if (ctx.licResp === "contratado" && !(doc.matriz || []).some(function (m) { return m.categoria === "Licenciamento"; })) add("INC.20", "aviso", "Licenciamento a cargo do contratado sem risco na matriz", "Registre o risco de licenciamento na matriz e reflita-o no valor estimado (art. 25, §5º, I).", "E9", { visao: "riscos", aba: "matriz" });

    // riscos
    var rm = res.riscos;
    var semEscopo = rm.matriz.filter(function (a) { return a.problemas.some(function (p) { return p.cod === "escopo"; }); });
    if (semEscopo.length) add("INC.21", "erro", "Matriz com evento fora do escopo", semEscopo.map(function (a) { return a.m.id; }).join(", ") + ": a matriz se limita a eventos supervenientes que afetam o equilíbrio econômico-financeiro (arts. 22 e 103).", "E9", { visao: "riscos", aba: "matriz" });
    var incompletos = rm.matriz.filter(function (a) { return a.problemas.some(function (p) { return ["alocacao", "mecanismo", "clausula"].indexOf(p.cod) >= 0; }); });
    if (incompletos.length) add("INC.22", "erro", "Riscos da matriz incompletos", incompletos.map(function (a) { return a.m.id; }).join(", ") + ": faltam responsável, mecanismo de tratamento ou cláusula contratual.", "E9", { visao: "riscos", aba: "matriz" });
    if (rm.descobertos.length && (doc.matriz || []).length + (ctx.matrizObrigatoria ? 1 : 0) > 0) add("INC.23", "aviso", "Riscos do mapa sem correspondência na matriz", rm.descobertos.map(function (a) { return a.r.id; }).join(", ") + ": riscos altos ou críticos que afetam o equilíbrio do contrato.", "E9", { visao: "riscos", aba: "mapa" });
    var semOrc = rm.matriz.filter(function (a) { return a.problemas.some(function (p) { return p.cod === "orcamento"; }) && nivelAlto(a.nivel); });
    if (semOrc.length) add("INC.24", "aviso", "Riscos altos do contratado sem reflexo no orçamento", semOrc.map(function (a) { return a.m.id; }).join(", ") + ": quantifique-os no valor estimado (art. 22, caput, e art. 103, §3º).", "E10");
    var seg = rm.matriz.filter(function (a) { return a.problemas.some(function (p) { return p.cod === "seguro"; }); });
    if (seg.length) add("INC.25", "aviso", "Risco segurável alocado à contratante", seg.map(function (a) { return a.m.id; }).join(", ") + ": riscos com cobertura securitária devem ser preferencialmente transferidos ao contratado (art. 103, §2º).", "E9", { visao: "riscos", aba: "matriz" });
    var assum = rm.matriz.filter(function (a) { return a.problemas.some(function (p) { return p.cod === "assuncao"; }); });
    if (assum.length) add("INC.26", "aviso", "Risco do contratado com mecanismo de revisão", assum.map(function (a) { return a.m.id; }).join(", ") + ": atendidas as condições da matriz, o equilíbrio é considerado mantido para os riscos assumidos (art. 103, §5º).", "E9", { visao: "riscos", aba: "matriz" });
    if ((doc.mapa || []).length && !(doc.mapa || []).some(function (r) { return r.fase === "licitacao"; })) add("INC.27", "aviso", "Mapa sem riscos do certame", "O mapa deve abranger eventos que comprometem a licitação, como certame deserto, impugnações ou suspensão judicial.", "E9", { visao: "riscos", aba: "mapa" });
    if (doc.matrizInfo && doc.matrizInfo.concluida && !concl("E11.26")) add("INC.28", "aviso", "Matriz concluída antes da minuta final", "A matriz só é considerada concluída com a versão final da minuta contratual (E11.26).", "E11");
    var rev = (doc.revisoes || []).filter(function (r) { return !r.resolvida; });
    if (rev.length) add("INC.29", "aviso", "Revisão do mapa e da matriz pendente", rev.length + " alteração(ões) com risco vinculado aguardam revisão.", "E9", { visao: "alertas" });

    // itens e aprovações
    var naSem = res.ativos.filter(function (it) { var e = est(it.id); return e && e.status === "na" && !e.resolvido; });
    if (naSem.length) add("INC.30", "erro", "Itens não aplicáveis sem justificativa", naSem.map(function (it) { return it.id; }).join(", "), naSem[0].etapa);
    var atr = res.ativos.filter(function (it) { var e = est(it.id); return e && e.atrasado && it.crit === "critico"; });
    if (atr.length) add("INC.31", "aviso", "Itens críticos com prazo vencido", atr.map(function (it) { return it.id; }).join(", "), atr[0].etapa);
    var venc = res.ativos.filter(function (it) {
      if (it.tipo !== "aprovacao") return false;
      var e = est(it.id);
      return e && e.status === "concluido" && e.reg.validade && e.reg.validade < somarDias(hoje(), 60);
    });
    if (venc.length) add("INC.32", "aviso", "Aprovações vencidas ou a vencer em 60 dias", venc.map(function (it) { return it.id + " (" + it.titulo + ")"; }).join("; "), "E8");
    if ((doc.ressalvas || []).length) add("INC.33", "info", "Avanços de etapa com ressalva", (doc.ressalvas || []).length + " registro(s) de avanço com itens críticos pendentes.", null, { visao: "alertas" });

    // atos de encerramento: aprovações da autoridade competente e documentos que consolidam um bloco
    var pendente = function (x) { var e = est(x.id); return !!(e && !e.resolvido); };
    var listar = function (l) { var ids = l.map(function (x) { return x.id; }); return ids.slice(0, 8).join(", ") + (ids.length > 8 ? " e mais " + (ids.length - 8) : ""); };
    res.ativos.forEach(function (it) {
      if (!concl(it.id)) return;
      if (it.encerra) {
        var crits = res.ativos.filter(function (x) { return x.id !== it.id && it.encerra.indexOf(x.etapa) >= 0 && x.crit === "critico" && pendente(x); });
        if (crits.length) add("INC.34", "aviso", "Aprovação registrada antes da conclusão da etapa", it.id + " (" + it.titulo + ") consta como concluída, mas há " + crits.length + " item(ns) crítico(s) pendente(s): " + listar(crits) + ". A aprovação da autoridade competente deve ser o ato final.", it.etapa);
      }
      if (it.encerraGrupo) {
        var topicos = res.ativos.filter(function (x) { return x.id !== it.id && x.etapa === it.etapa && x.grupo === it.grupo && pendente(x); });
        if (topicos.length) add("INC.36", "aviso", "Documento concluído com tópicos pendentes", it.id + " (" + it.titulo + ") consta como concluído, mas há " + topicos.length + " tópico(s) pendente(s) no bloco: " + listar(topicos) + ".", it.etapa);
      }
    });
    var parciais = res.ativos.filter(function (it) {
      var e = est(it.id);
      return e && e.conferencia && e.status === "concluido" && e.conferencia.feitos > 0 && e.conferencia.feitos < e.conferencia.total;
    });
    if (parciais.length) add("INC.37", "aviso", "Itens concluídos com conferência parcial do conteúdo mínimo", parciais.map(function (it) { var c = est(it.id).conferencia; return it.id + " (" + c.feitos + " de " + c.total + ")"; }).join(", ") + ". Confira os elementos restantes ou registre por que não se aplicam.", parciais[0].etapa);
    var ev = est("E10.18");
    if (ev && !ev.resolvido && concl("E11.07")) add("INC.35", "aviso", "Critérios de medição definidos sem eventograma", "Nos regimes do art. 46, §9º, a medição e o pagamento seguem etapas do cronograma vinculadas a metas de resultado. Conclua o eventograma (E10.18) antes de fechar os critérios do termo de referência (E11.07).", "E10");

    var ordem = { erro: 1, aviso: 2, info: 3 };
    L.sort(function (a, b) { return ordem[a.nivel] - ordem[b.nivel]; });
    return L;
  }

  /* --------------- prazo mínimo para as propostas (art. 55) --------------- */
  function prazoMinimoPropostas(ctx) {
    var crit = ctx["contratacao.criterio"], reg = ctx.regime, enq = ctx.enquadramento;
    if (reg === "integrada") return { dias: 60, fundamento: "art. 55, II, c", motivo: "contratação integrada" };
    if (crit === "tecnica_preco") return { dias: 35, fundamento: "art. 55, IV", motivo: "critério de técnica e preço" };
    if (reg === "semi") return { dias: 35, fundamento: "art. 55, II, d", motivo: "contratação semi-integrada" };
    if (crit === "menor_preco" || crit === "maior_desconto") {
      if (enq === "obra_comum" || enq === "servico_comum") return { dias: 10, fundamento: "art. 55, II, a", motivo: "menor preço ou maior desconto em obra ou serviço comum de engenharia" };
      if (enq === "obra_especial" || enq === "servico_especial") return { dias: 25, fundamento: "art. 55, II, b", motivo: "menor preço ou maior desconto em obra ou serviço especial de engenharia" };
      return { dias: null, fundamento: "art. 55, II, a e b", motivo: "10 dias úteis se o objeto for comum e 25 se for especial; informe o enquadramento no cadastro" };
    }
    if (crit === "maior_retorno") return { dias: 35, fundamento: "art. 55, II, d", motivo: "hipótese não abrangida pelas alíneas a a c" };
    return null;
  }

  /* --------------------------- alertas por tipologia --------------------------- */
  function alertasTipologia(cfg, doc, ctx) {
    var o = doc.obra || {};
    var subs = {
      uf: (o.local && o.local.uf) || "sua UF",
      municipio: (o.local && o.local.municipio) || "seu município",
      grandeVulto: moeda(cfg.parametros.grandeVulto),
      limiteEpp: moeda(cfg.parametros.limiteReceitaEpp)
    };
    return (cfg.alertas || []).filter(function (a) { return avaliar(a.se, ctx); }).map(function (a) {
      return {
        id: a.id, titulo: a.titulo,
        texto: a.texto.replace(/\{(\w+)\}/g, function (_, k) { return subs[k] != null ? subs[k] : "{" + k + "}"; }),
        motivo: a.se ? explicar(a.se, cfg) : "Aplicável a todas as obras"
      };
    });
  }

  /* --------------------------- cálculo consolidado --------------------------- */
  function normalizar(doc) {
    doc.itens = doc.itens || {};
    doc.itensCustom = doc.itensCustom || [];
    doc.mapa = doc.mapa || [];
    doc.matriz = doc.matriz || [];
    doc.matriz.forEach(function (m) { if (!Array.isArray(m.mrRefs)) m.mrRefs = m.mrRef ? [m.mrRef] : []; delete m.mrRef; });
    doc.matrizInfo = doc.matrizInfo || { concluida: false };
    doc.revisoes = doc.revisoes || [];
    doc.ressalvas = doc.ressalvas || [];
    doc.historico = doc.historico || [];
    doc.obra = doc.obra || {};
    return doc;
  }

  function progressoEtapa(etapa, res) {
    var itens = res.ativos.filter(function (it) { return it.etapa === etapa.id; });
    var resolvidos = 0, crit = [], pend = [], iniciados = 0;
    itens.forEach(function (it) {
      var s = res.estados[it.id];
      if (s.resolvido) resolvidos++;
      else { pend.push(it.id); if (it.crit === "critico") crit.push(it.id); }
      var iniciou = it.auto ? (!!(s.auto && s.auto.ok) && !s.vazio) : (s.status !== "nao_iniciado" || s.resolvido);
      if (iniciou) iniciados++;
    });
    var total = itens.length;
    var sem = total === 0 || resolvidos === total ? "verde" : (iniciados === 0 ? "cinza" : (crit.length ? "vermelho" : "amarelo"));
    return {
      id: etapa.id, titulo: etapa.titulo, curto: etapa.curto, total: total, resolvidos: resolvidos,
      pct: total ? Math.round(100 * resolvidos / total) : 100, criticosPendentes: crit, pendentes: pend, iniciados: iniciados, semaforo: sem
    };
  }

  function calcular(cfg, doc) {
    normalizar(doc);
    var ctx = contexto(cfg, doc);
    var ativos = itensAtivos(cfg, doc, ctx);
    var porId = {};
    ativos.forEach(function (it) { porId[it.id] = it; });
    var res = { ctx: ctx, ativos: ativos, porId: porId, estados: {}, inconsistencias: [] };
    res.riscos = analisarRiscos(cfg, doc);
    ativos.forEach(function (it) { if (it.etapa !== "E12") res.estados[it.id] = estadoItem(cfg, doc, it, res); });
    res.inconsistencias = inconsistencias(cfg, doc, res);
    ativos.forEach(function (it) { if (it.etapa === "E12") res.estados[it.id] = estadoItem(cfg, doc, it, res); });

    res.etapas = cfg.etapas.map(function (e) { return progressoEtapa(e, res); });
    var porEtapa = {};
    res.etapas.forEach(function (p) { porEtapa[p.id] = p; });
    res.porEtapa = porEtapa;
    cfg.etapas.forEach(function (e) {
      var bloq = (e.prereq || []).filter(function (pid) { return porEtapa[pid] && porEtapa[pid].criticosPendentes.length; })
        .map(function (pid) { return { etapa: pid, n: porEtapa[pid].criticosPendentes.length }; });
      porEtapa[e.id].entrada = { liberada: bloq.length === 0, bloqueios: bloq };
    });

    res.total = ativos.length;
    res.resolvidos = ativos.filter(function (it) { return res.estados[it.id].resolvido; }).length;
    res.pct = res.total ? Math.round(100 * res.resolvidos / res.total) : 0;
    res.criticosPendentes = ativos.filter(function (it) { return it.crit === "critico" && !res.estados[it.id].resolvido; });
    var erros = res.inconsistencias.filter(function (i) { return i.nivel === "erro"; });
    var aprovEdital = ativos.filter(function (it) { return it.tipo === "aprovacao" && it.momento === "antes_edital"; });
    res.aprovacoesEdital = { total: aprovEdital.length, resolvidas: aprovEdital.filter(function (it) { return res.estados[it.id].resolvido; }).length };
    res.gate = {
      apto: res.criticosPendentes.length === 0 && erros.length === 0,
      criticos: res.criticosPendentes.length,
      erros: erros.length,
      aprovacoesPendentes: aprovEdital.filter(function (it) { return it.crit === "critico" && !res.estados[it.id].resolvido; }).length
    };
    res.alertas = alertasTipologia(cfg, doc, ctx);
    res.bloqueios = bloqueios(cfg, doc, res);
    res.proximas = proximasAcoes(cfg, doc, res);
    res.resumoRiscos = resumoRiscos(res);
    return res;
  }

  function resumoRiscos(res) {
    var m = res.riscos.mapa, x = res.riscos.matriz;
    var aberto = function (a) { return a.r.statusMedida !== "concluida"; };
    return {
      mapaTotal: m.length,
      mapaCriticosAbertos: m.filter(function (a) { return a.nivel.id === "critico" && aberto(a); }).length,
      mapaAltosAbertos: m.filter(function (a) { return a.nivel.id === "alto" && aberto(a); }).length,
      mapaLicitacao: m.filter(function (a) { return a.r.fase === "licitacao"; }).length,
      matrizTotal: x.length,
      matrizCriticos: x.filter(function (a) { return a.nivel && a.nivel.id === "critico"; }).length,
      matrizAltos: x.filter(function (a) { return a.nivel && a.nivel.id === "alto"; }).length,
      matrizComProblema: x.filter(function (a) { return a.problemas.some(function (p) { return p.nivel === "erro"; }); }).length,
      descobertos: res.riscos.descobertos.length
    };
  }

  function bloqueios(cfg, doc, res) {
    var L = [];
    res.inconsistencias.filter(function (i) { return i.nivel === "erro"; }).forEach(function (i) {
      L.push({ tipo: "inconsistencia", peso: 100, texto: i.titulo, detalhe: i.detalhe, etapa: i.etapa, ref: i.id, visao: i.visao, aba: i.aba });
    });
    res.ativos.forEach(function (it) {
      if (it.tipo === "aprovacao" && it.momento === "antes_edital" && it.crit === "critico" && !res.estados[it.id].resolvido) {
        L.push({ tipo: "aprovacao", peso: 80, texto: it.titulo, detalhe: it.orgao + " (exigida antes do edital)", etapa: "E8", ref: it.id });
      }
    });
    res.riscos.mapa.forEach(function (a) {
      if (a.nivel.id === "critico" && (!a.r.tratamento || !a.r.responsavel || a.r.statusMedida === "nao_iniciada")) {
        L.push({ tipo: "risco", peso: 70, texto: a.r.evento, detalhe: a.r.id + " de nível crítico sem medida iniciada ou sem responsável", etapa: "E9", ref: a.r.id, visao: "riscos", aba: "mapa" });
      }
    });
    res.ativos.forEach(function (it) {
      var e = res.estados[it.id];
      if (e.atrasado && it.crit === "critico") L.push({ tipo: "prazo", peso: 60, texto: it.titulo, detalhe: it.id + " com data prevista vencida (" + e.reg.dataPrevista.split("-").reverse().join("/") + ")", etapa: it.etapa, ref: it.id });
    });
    L.sort(function (a, b) { return b.peso - a.peso; });
    return L;
  }

  function proximasAcoes(cfg, doc, res) {
    var idx = {};
    cfg.etapas.forEach(function (e, i) { idx[e.id] = i; });
    var L = res.ativos.filter(function (it) { return !it.auto && !res.estados[it.id].resolvido; }).map(function (it) {
      var e = res.estados[it.id];
      var pontos = (CRIT[it.crit] ? CRIT[it.crit].peso * 10 : 10) + (12 - idx[it.etapa]) * 2 + (e.atrasado ? 100 : 0) +
        (e.status === "em_elaboracao" || e.status === "pendente_aprovacao" ? 5 : 0) +
        (res.porEtapa[it.etapa] && res.porEtapa[it.etapa].entrada.liberada ? 8 : 0);
      return { id: it.id, etapa: it.etapa, titulo: it.titulo, crit: it.crit, status: e.status, dataPrevista: e.reg.dataPrevista || "", atrasado: e.atrasado, pontos: pontos, tipo: it.tipo };
    });
    L.sort(function (a, b) { return b.pontos - a.pontos || (a.id < b.id ? -1 : 1); });
    return L;
  }

  /* --------------------------- operações sobre riscos --------------------------- */
  function proximoId(lista, prefixo) {
    var max = 0;
    lista.forEach(function (x) {
      var m = new RegExp("^" + prefixo.replace(".", "\\.") + "(\\d+)$").exec(x.id || "");
      if (m) max = Math.max(max, +m[1]);
    });
    return prefixo + pad(max + 1);
  }

  function novoRiscoMapa(doc, dados) {
    var r = mesclar({
      id: proximoId(doc.mapa, "MR."), evento: "", causa: "", consequencia: "", fase: "planejamento", etapaRef: "", itemRef: "",
      afetaEquilibrio: false, p: 3, i: 3, tratamento: "mitigar", providencia: "", responsavel: "", prazo: "", statusMedida: "nao_iniciada",
      origem: "manual", modeloId: "", aprovRef: "", editado: false, obs: "", criadoEm: agora()
    }, dados || {});
    // o mapa nunca carrega alocação contratual
    delete r.alocacao; delete r.mecanismo; delete r.clausula;
    doc.mapa.push(r);
    return r;
  }

  function novoRiscoMatriz(doc, dados) {
    var m = mesclar({
      id: proximoId(doc.matriz, "MA."), descricao: "", categoria: "Outro", fonte: "manual", mrRefs: [], alocacao: "", criterio: "", mecanismo: "",
      clausula: "", parametros: "", seguravel: false, noOrcamento: false, quantificacao: "", justificativa: "", afetaEquilibrio: true,
      modeloId: "", obs: "", criadoEm: agora()
    }, dados || {});
    if (!Array.isArray(m.mrRefs)) m.mrRefs = [];
    doc.matriz.push(m);
    return m;
  }

  function sugestoesMapa(cfg, doc) {
    var ctx = contexto(cfg, doc);
    return (cfg.modelosMapa || []).filter(function (t) {
      return avaliar(t.se, ctx) && !(doc.mapa || []).some(function (r) { return r.modeloId === t.id; });
    });
  }

  function adicionarModeloMapa(cfg, doc, modeloId) {
    var t = (cfg.modelosMapa || []).filter(function (x) { return x.id === modeloId; })[0];
    if (!t) return null;
    normalizar(doc);
    var r = novoRiscoMapa(doc, {
      evento: t.evento, causa: t.causa, consequencia: t.consequencia, fase: t.fase, etapaRef: t.etapaRef || "",
      afetaEquilibrio: !!t.afetaEquilibrio, p: t.p, i: t.i, tratamento: t.tratamento, providencia: t.providencia,
      origem: "modelo", modeloId: t.id
    });
    // vincula a entradas da matriz que já apontam para este modelo
    (doc.matriz || []).forEach(function (m) {
      var tm = (cfg.modelosMatriz || []).filter(function (x) { return x.id === m.modeloId; })[0];
      if (tm && listaMrt(tm).indexOf(t.id) >= 0 && m.mrRefs.indexOf(r.id) < 0) m.mrRefs.push(r.id);
    });
    return r;
  }

  function listaMrt(t) { return !t || !t.mrt ? [] : (Array.isArray(t.mrt) ? t.mrt : [t.mrt]); }

  function modeloMatrizAjustado(cfg, t, ctx) {
    var c = clone(t);
    if (t.porRegime && t.porRegime[ctx.regime]) mesclar(c, t.porRegime[ctx.regime]);
    return c;
  }

  function sugestoesMatriz(cfg, doc) {
    var ctx = contexto(cfg, doc);
    return (cfg.modelosMatriz || []).filter(function (t) {
      return avaliar(t.se, ctx) && !(doc.matriz || []).some(function (m) { return m.modeloId === t.id; });
    }).map(function (t) { return modeloMatrizAjustado(cfg, t, ctx); });
  }

  function adicionarModeloMatriz(cfg, doc, modeloId) {
    var t0 = (cfg.modelosMatriz || []).filter(function (x) { return x.id === modeloId; })[0];
    if (!t0) return null;
    normalizar(doc);
    var t = modeloMatrizAjustado(cfg, t0, contexto(cfg, doc));
    var refs = [];
    (doc.mapa || []).forEach(function (r) {
      if ((r.modeloId && listaMrt(t).indexOf(r.modeloId) >= 0) || (t.aprovRefs && r.aprovRef && t.aprovRefs.indexOf(r.aprovRef) >= 0)) refs.push(r.id);
    });
    return novoRiscoMatriz(doc, {
      descricao: t.descricao, categoria: t.categoria, fonte: "modelo", mrRefs: refs, alocacao: t.alocacao, mecanismo: t.mecanismo,
      clausula: t.clausula, parametros: t.parametros || "", criterio: t.criterio || "", seguravel: !!t.seguravel, afetaEquilibrio: true, modeloId: t.id,
      justificativa: t.base ? "Fundamento: Lei 14.133/2021, " + t.base : ""
    });
  }

  function levarParaMatriz(doc, mrId) {
    normalizar(doc);
    var r = (doc.mapa || []).filter(function (x) { return x.id === mrId; })[0];
    if (!r) return null;
    var existente = (doc.matriz || []).filter(function (m) { return m.mrRefs.indexOf(mrId) >= 0; })[0];
    if (existente) return existente;
    return novoRiscoMatriz(doc, { descricao: r.evento, categoria: "Outro", fonte: "mapa", mrRefs: [mrId], afetaEquilibrio: true });
  }

  function moverParaMapa(doc, maId, fase) {
    normalizar(doc);
    var m = (doc.matriz || []).filter(function (x) { return x.id === maId; })[0];
    if (!m) return null;
    var r = novoRiscoMapa(doc, {
      evento: m.descricao, causa: "", consequencia: "", fase: fase || "licitacao", afetaEquilibrio: false,
      providencia: "", origem: "manual", obs: "Transferido da matriz (" + m.id + ") por não afetar o equilíbrio econômico-financeiro."
    });
    doc.matriz = doc.matriz.filter(function (x) { return x.id !== maId; });
    return r;
  }

  function removerRiscoMapa(doc, id) {
    doc.mapa = (doc.mapa || []).filter(function (r) { return r.id !== id; });
    (doc.matriz || []).forEach(function (m) { m.mrRefs = (m.mrRefs || []).filter(function (x) { return x !== id; }); });
  }
  function removerRiscoMatriz(doc, id) { doc.matriz = (doc.matriz || []).filter(function (m) { return m.id !== id; }); }

  /* Aprovações pendentes geram riscos vinculados no mapa (E9.1) */
  function sincronizarRiscosAprovacoes(cfg, doc) {
    normalizar(doc);
    var ctx = contexto(cfg, doc);
    var ativos = itensAtivos(cfg, doc, ctx).filter(function (it) { return it.tipo === "aprovacao"; });
    var ativosIds = {};
    var alterou = false;
    ativos.forEach(function (ap) {
      if (ap.crit === "recomendado" || ap.momento === "antes_operacao") return;
      ativosIds[ap.id] = true;
      var reg = registro(doc, ap.id), st = reg.status || "nao_iniciado";
      var concluida = st === "concluido" || (st === "na" && reg.justificativa);
      var risco = doc.mapa.filter(function (r) { return r.aprovRef === ap.id; })[0];
      var edital = ap.momento === "antes_edital";
      if (!risco) {
        if (concluida) return;
        risco = novoRiscoMapa(doc, {
          evento: "Atraso ou não obtenção: " + ap.titulo,
          causa: "Tramitação no órgão (" + ap.orgao + "), exigências complementares ou projeto incompatível",
          consequencia: edital ? "Impede ou atrasa a divulgação do edital e pode exigir alterações de projeto" : "Atrasa a ordem de serviço e pode gerar pleitos de reequilíbrio",
          fase: edital ? "planejamento" : "execucao", etapaRef: "E8", itemRef: ap.id, afetaEquilibrio: !edital,
          p: 3, i: ap.crit === "critico" ? 4 : 3, tratamento: "mitigar",
          providencia: "Protocolar com antecedência e acompanhar a tramitação (prazo típico: " + (ap.prazo || "—") + ")",
          statusMedida: st === "nao_iniciado" ? "nao_iniciada" : "andamento", origem: "aprovacao", aprovRef: ap.id
        });
        (doc.matriz || []).forEach(function (m) {
          var tm = (cfg.modelosMatriz || []).filter(function (x) { return x.id === m.modeloId; })[0];
          if (tm && tm.aprovRefs && tm.aprovRefs.indexOf(ap.id) >= 0 && m.mrRefs.indexOf(risco.id) < 0) m.mrRefs.push(risco.id);
        });
        alterou = true;
      } else {
        var novo = concluida ? "concluida" : (st === "nao_iniciado" ? (risco.statusMedida === "concluida" ? "andamento" : risco.statusMedida) : (risco.statusMedida === "concluida" ? "andamento" : (risco.statusMedida === "nao_iniciada" ? "andamento" : risco.statusMedida)));
        if (novo !== risco.statusMedida) { risco.statusMedida = novo; alterou = true; }
        var fase = edital ? "planejamento" : "execucao";
        if (!risco.editado && (risco.fase !== fase || risco.afetaEquilibrio !== !edital)) { risco.fase = fase; risco.afetaEquilibrio = !edital; alterou = true; }
      }
    });
    var antes = doc.mapa.length;
    var removidos = doc.mapa.filter(function (r) { return r.origem === "aprovacao" && !ativosIds[r.aprovRef] && !r.editado; }).map(function (r) { return r.id; });
    removidos.forEach(function (id) { removerRiscoMapa(doc, id); });
    if (doc.mapa.length !== antes) alterou = true;
    return alterou;
  }

  function registrarRevisao(doc, chave, motivo) {
    normalizar(doc);
    if (!(doc.mapa.length || doc.matriz.length)) return false;
    var ex = doc.revisoes.filter(function (r) { return r.chave === chave && !r.resolvida; })[0];
    if (ex) { ex.em = agora(); ex.motivo = motivo; return true; }
    doc.revisoes.push({ id: uid("rv"), chave: chave, motivo: motivo, em: agora(), resolvida: false });
    return true;
  }
  function riscosVinculados(doc, itemId, etapaId) {
    var mr = (doc.mapa || []).filter(function (r) { return r.itemRef === itemId || (etapaId && r.etapaRef === etapaId); }).map(function (r) { return r.id; });
    var ma = (doc.matriz || []).filter(function (m) { return (m.mrRefs || []).some(function (id) { return mr.indexOf(id) >= 0; }); }).map(function (m) { return m.id; });
    return mr.concat(ma);
  }

  /* --------------------------- obra e cenários --------------------------- */
  function novaObra(cfg) {
    return {
      schemaVersion: cfg.schemaVersion || "1.0", app: "ObraCheck", modulo: "planejamento", id: uid("ob"),
      criadoEm: agora(), atualizadoEm: agora(), baseNormativa: cfg.versao,
      obra: {
        nome: "", orgao: "", unidade: "", processo: "", esfera: "municipal", descricao: "",
        tipologia: "", tipologiaOutra: "", natureza: "nova", regime: "", enquadramento: "", bim: false,
        local: { municipio: "", uf: "", zona: "urbana", areaProtegida: "nenhuma", tombamento: "nao", arqueologia: "nao", riscoGeologico: "nao", aerodromo: false },
        terreno: { dominio: "proprio", declividade: "plana", agua: "nao", solo: "desconhecido", areaTerreno: null, interferencias: false, contaminacao: false, demolicao: false, faixaRodovia: false, semRedeEsgoto: false, reassentamento: false },

  function criarCenario(cfg, idCenario) {

  }

  function validarDoc(d) {
    if (!d || typeof d !== "object") return "Arquivo sem conteúdo válido.";
    if (!d.obra || typeof d.obra !== "object") return "O arquivo não contém os dados de uma obra (campo obra).";

    if (d.itens && typeof d.itens !== "object") return "Campo itens inválido.";

    if (d.matriz && !Array.isArray(d.matriz)) return "Campo matriz inválido.";

  }

  function migrar(cfg, d) {
    var base = novaObra(cfg);
    var o = mesclar(clone(base.obra), d.obra || {});
    d.obra = o;
    d.schemaVersion = d.schemaVersion || cfg.schemaVersion;
    d.app = "ObraCheck"; d.modulo = "planejamento";
    if (!d.id) d.id = uid("ob");

  }

  function validarConfig(c) {
    if (!c || typeof c !== "object") return "Base inválida.";
    var req = ["etapas", "itens", "aprovacoes", "formulario", "escalas", "parametros"];
    for (var i = 0; i < req.length; i++) if (!c[req[i]]) return "A base não contém o campo " + req[i] + ".";
    if (!Array.isArray(c.etapas) || !Array.isArray(c.itens) || !Array.isArray(c.aprovacoes)) return "Etapas, itens e aprovações devem ser listas.";
    var ids = {};
    for (var j = 0; j < c.itens.length; j++) {
      var it = c.itens[j];
      if (!it.id || !it.etapa || !it.titulo) return "Item sem id, etapa ou título na posição " + (j + 1) + ".";
      if (ids[it.id]) return "Identificador repetido: " + it.id + ".";
      ids[it.id] = true;
    }
    return null;
  }

  function contarPorTipologia(cfg) {
    var tipos = (mapaRotulos(cfg).tipologia || { opcoes: [] }).opcoes;
    return tipos.map(function (t) {
      var d = novaObra(cfg);
      d.obra.tipologia = t[0];
      d.obra.regime = "global";
      if (t[0] === "saneamento") { d.obra.saneamento.agua = true; d.obra.saneamento.esgoto = true; }
      if (t[0] === "urbana") d.obra.urbana.urbanizacao = true;
      if (t[0] === "saude") d.obra.edif.uso = "saude";
      if (t[0] === "escolar") d.obra.edif.uso = "educacional";
      var ctx = contexto(cfg, d);
      var a = itensAtivos(cfg, d, ctx);
      return {
        id: t[0], rotulo: t[1], itens: a.filter(function (x) { return x.tipo === "item"; }).length,
        aprovacoes: a.filter(function (x) { return x.tipo === "aprovacao"; }).length,
        criticos: a.filter(function (x) { return x.crit === "critico"; }).length,
        alertas: alertasTipologia(cfg, d, ctx).length
      };
    });
  }

  return {
    STATUS: STATUS, STATUS_APROV: STATUS_APROV, CRIT: CRIT, MOMENTOS: MOMENTOS, ORDEM_NIVEL: ORDEM_NIVEL,
    hoje: hoje, definirHoje: definirHoje, agora: agora, somarDias: somarDias, uid: uid, clone: clone, obter: obter, definir: definir,
    num: num, mesclar: mesclar, moeda: moeda, numero: numero, mesesEntre: mesesEntre,
    mapaRotulos: mapaRotulos, rotuloCampo: rotuloCampo, rotuloOpcao: rotuloOpcao, rotuloLista: rotuloLista,

    calcular: calcular, normalizar: normalizar, AUTO: AUTO,
    novoRiscoMapa: novoRiscoMapa, novoRiscoMatriz: novoRiscoMatriz, sugestoesMapa: sugestoesMapa, sugestoesMatriz: sugestoesMatriz,
    adicionarModeloMapa: adicionarModeloMapa, adicionarModeloMatriz: adicionarModeloMatriz, levarParaMatriz: levarParaMatriz,
    moverParaMapa: moverParaMapa, removerRiscoMapa: removerRiscoMapa, removerRiscoMatriz: removerRiscoMatriz,
    sincronizarRiscosAprovacoes: sincronizarRiscosAprovacoes, registrarRevisao: registrarRevisao, riscosVinculados: riscosVinculados,
    novaObra: novaObra, criarCenario: criarCenario, validarDoc: validarDoc, migrar: migrar, validarConfig: validarConfig,
    contarPorTipologia: contarPorTipologia, alertasTipologia: alertasTipologia,
    chaveTexto: chaveTexto, conteudoAtivo: conteudoAtivo, chavesConteudo: chavesConteudo, prazoMinimoPropostas: prazoMinimoPropostas
  };
})();

<script>
/* =====================================================================
   ObraCheck · Planejamento — RELATÓRIO DE SITUAÇÃO (HTML imprimível)
   Gera um documento autônomo, com estilos próprios, para impressão,

var Relatorio = (function () {
  "use strict";

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function data(iso) { return iso ? String(iso).slice(0, 10).split("-").reverse().join("/") : "—"; }
  function dataHora(d) {
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  var SEM = { verde: "Concluída", amarelo: "Em andamento", vermelho: "Com pendência crítica", cinza: "Não iniciada" };

  function estilos() {

      ".carimbo{width:100%;border-collapse:collapse;border:1.4pt solid #16202a;margin-top:3mm}",

      ".nums span{font-size:8pt;color:#52606d}",

      ".s-verde{color:#2b7a4b}.s-amarelo{color:#8a5a05}.s-vermelho{color:#b3261e}.s-cinza{color:#52606d}",
      ".n-critico{background:#f8e3e0}.n-alto{background:#fbeedd}.n-moderado{background:#f7f3dc}.n-baixo{background:#e5f2ea}",
      ".lista{margin:0;padding-left:5mm}",
      ".lista li{margin-bottom:1mm}",
      ".mini{margin:0;padding-left:4mm}.mini li{margin:0 0 .4mm}",
      ".nota{font-size:8.4pt;color:#52606d}",

    ].join("\n");
  }

  function gerar(cfg, doc, res, opcoes) {
    opcoes = opcoes || {};
    var M = Motor, o = doc.obra || {};
    var agoraD = opcoes.data || new Date();
    var rot = function (chave, v) { return esc(M.rotuloCampo(cfg, chave, v)); };
    var h = [];
    h.push("<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>");
    h.push("<title>Relatório de situação — " + esc(o.nome || "Obra") + "</title><style>" + estilos() + "</style></head><body><div class='folha'>");

    // cabeçalho em forma de carimbo de prancha
    h.push("<h1>Relatório de situação da fase preparatória</h1>");
    h.push("<p class='nota'>ObraCheck Planejamento. Base normativa de " + esc(cfg.dataBaseNormativa) + " (versão " + esc(cfg.versao) + ").</p>");
    h.push("<table class='carimbo'><tr>");
    h.push("<td colspan='3'><span class='r'>Obra</span><span class='v'>" + esc(o.nome || "—") + "</span></td>");
    h.push("<td><span class='r'>Processo</span><span class='v'>" + esc(o.processo || "—") + "</span></td></tr><tr>");
    h.push("<td colspan='2'><span class='r'>Órgão ou entidade</span><span class='v'>" + esc(o.orgao || "—") + "</span></td>");
    h.push("<td colspan='2'><span class='r'>Unidade demandante</span><span class='v'>" + esc(o.unidade || "—") + "</span></td></tr><tr>");
    h.push("<td><span class='r'>Tipologia</span><span class='v'>" + rot("tipologia", o.tipologia) + "</span></td>");
    h.push("<td><span class='r'>Natureza</span><span class='v'>" + rot("natureza", o.natureza) + "</span></td>");
    h.push("<td><span class='r'>Regime de execução</span><span class='v'>" + rot("regime", o.regime) + "</span></td>");
    h.push("<td><span class='r'>Local</span><span class='v'>" + esc(((o.local && o.local.municipio) || "—") + "/" + ((o.local && o.local.uf) || "—")) + "</span></td></tr><tr>");
    h.push("<td><span class='r'>Valor estimado</span><span class='v'>" + esc(M.moeda(o.valorEstimado)) + "</span></td>");
    h.push("<td><span class='r'>Prazo previsto</span><span class='v'>" + esc(o.prazoMeses ? o.prazoMeses + " meses" : "—") + "</span></td>");

    h.push("<td><span class='r'>Emitido em</span><span class='v'>" + esc(dataHora(agoraD)) + "</span></td></tr></table>");

    // situação geral
    var g = res.gate;
    h.push("<h2>Situação geral</h2><div class='situacao'>");

    h.push("<div><b>" + (res.aprovacoesEdital.total - res.aprovacoesEdital.resolvidas) + "</b><span>aprovações antes do edital pendentes</span></div>");

    }

    // etapas
    h.push("<h2>Situação por etapa</h2><table class='t'><thead><tr><th>Etapa</th><th>Situação</th><th>Resolvidos</th><th>%</th><th>Críticos pendentes</th></tr></thead><tbody>");
    res.etapas.forEach(function (e) {
      h.push("<tr><td><span class='id'>" + e.id + "</span> " + esc(e.titulo) + "</td><td class='s-" + e.semaforo + "'>" + SEM[e.semaforo] + "</td><td>" + e.resolvidos + "/" + e.total + "</td><td>" + e.pct + "%</td><td>" + (e.criticosPendentes.length ? esc(e.criticosPendentes.join(", ")) : "—") + "</td></tr>");

    // bloqueios

        h.push("<tr><td class='id'>" + esc(it.id) + "</td><td>" + esc(it.titulo) + "</td><td>" + esc(M.rotuloLista(M.STATUS, s.status)) + "</td><td>" + c.feitos + "/" + c.total + "</td><td>" + pendTxt + "</td></tr>");

    // mapa de riscos
    h.push("<h2>Mapa de riscos (E9.1)</h2>");
    h.push("<p class='nota'>Análise ampla dos riscos que podem comprometer o sucesso da licitação e a boa execução contratual (art. 18, X). O mapa não aloca riscos entre as partes.</p>");

  /* ----------------------------- renderização ----------------------------- */
  function render(opcoes) {
    opcoes = opcoes || {};
    renderPendente = false;
    recalcular();
    var v = ui.visao;
    var def = VISOES.filter(function (x) { return x.id === v; })[0];
    if (!def || (!doc() && !def.semObra)) { v = ui.visao = "inicio"; }
    renderTopo();
    renderNav();
    var main = $("#conteudo");
    var ativo = document.activeElement;
    var idFoco = ativo && ativo.id && main.contains(ativo) ? ativo.id : null;
    var sel = null;
    try { if (idFoco && typeof ativo.selectionStart === "number") sel = [ativo.selectionStart, ativo.selectionEnd]; } catch (e) { sel = null; }
    var rolagem = window.pageYOffset;
    main.innerHTML = VIEWS[v]();
    if (idFoco) {
      var novo = document.getElementById(idFoco);
      if (novo) { try { novo.focus({ preventScroll: true }); } catch (e) { novo.focus(); } if (sel && novo.setSelectionRange) { try { novo.setSelectionRange(sel[0], sel[1]); } catch (e) { /* tipo sem seleção */ } } }
    }
    if (opcoes.topo) { window.scrollTo(0, 0); if (!idFoco) main.focus({ preventScroll: true }); }
    else window.scrollTo(0, rolagem);
    if (POS[v]) POS[v]();
  }

    var itens = r.ativos.filter(function (it) { return it.tipo !== "aprovacao"; }).length;

    var inc = r.inconsistencias.filter(function (i) { return i.id === "INC.01"; })[0];
    var h = ["<h2>Impacto do cadastro</h2><dl>"];
    h.push("<dt>Itens de checklist ativos</dt><dd>" + itens + "</dd>");
    h.push("<dt>Itens críticos</dt><dd>" + r.ativos.filter(function (it) { return it.crit === "critico"; }).length + "</dd>");
    h.push("<dt>Aprovações aplicáveis</dt><dd>" + ap.length + "</dd>");
    h.push("<dt>Exigidas antes do edital</dt><dd>" + ap.filter(function (it) { return it.momento === "antes_edital"; }).length + "</dd>");
    h.push("<dt>Alertas por tipologia</dt><dd>" + r.alertas.length + "</dd>");
    h.push('<dt>Grande vulto</dt><dd class="' + (r.ctx.grandeVulto ? "sim" : "") + '">' + (r.ctx.grandeVulto ? "Sim" : "Não") + "</dd>");
    h.push('<dt>Matriz de riscos</dt><dd class="' + (r.ctx.matrizObrigatoria ? "sim" : "") + '">' + (r.ctx.matrizObrigatoria ? "Obrigatória" : "Facultativa") + "</dd></dl>");
    if (inc) h.push('<div class="faixa aviso"><p>' + esc(inc.detalhe) + "</p></div>");
    h.push('<p class="pequeno mudo">Limite de grande vulto: ' + esc(M.moeda(CFG.parametros.grandeVulto)) + ".</p>");
    h.push('<div class="acoes"><button type="button" class="btn primario" data-acao="ir" data-visao="painel">Ver painel</button><button type="button" class="btn" data-acao="ir" data-visao="alertas">Por que cada exigência</button></div>');
    return h.join("");
  }

  /* ------------------------------- etapas ------------------------------- */
  VIEWS.etapas = function () {
    var e = etapaDef(ui.etapa) || CFG.etapas[0];
    ui.etapa = e.id;
    var p = calc.porEtapa[e.id];
    var itens = calc.ativos.filter(function (it) { return it.etapa === e.id; });
    var h = ['<div class="pagina">'];
    h.push('<section class="bloco" style="padding:12px 16px 4px">' + trilhoHtml(true, e.id) + "</section>");
    h.push('<div class="etapa-cabeca"><div class="etapa-titulo"><span class="etapa-marca">' + e.id + "</span><div><h1>" + esc(e.titulo) + "</h1><p>" + esc(e.desc) + "</p></div></div>");
    h.push('<div class="etapa-progresso"><div class="linha1"><span>Resolvidos</span><b>' + p.resolvidos + "/" + p.total + " (" + p.pct + '%)</b></div><div class="barra' + (p.semaforo === "verde" ? " verde" : "") + '"><span style="width:' + p.pct + '%"></span></div><div class="linha1" style="margin-top:6px"><span>Críticos pendentes</span><b>' + p.criticosPendentes.length + "</b></div></div></div>");
    if (!p.entrada.liberada) {
      h.push('<div class="faixa aviso"><p><b>Portão de entrada fechado.</b> Etapas anteriores com itens críticos pendentes: ' + p.entrada.bloqueios.map(function (b) { return '<button type="button" class="btn sutil pequeno" data-acao="abrir-etapa" data-etapa="' + b.etapa + '">' + b.etapa + " (" + b.n + ")</button>"; }).join(" ") + ". Você pode adiantar esta etapa, mas a conclusão depende das anteriores.</p></div>");
    }
    if (e.id === "E8") h.push('<div class="faixa"><p>Os itens desta etapa são as aprovações aplicáveis à obra. Exigidas antes do edital precisam estar emitidas; as demais pedem a definição de quem as obterá e a previsão no cronograma. <button type="button" class="btn sutil pequeno" data-acao="ir" data-visao="aprovacoes">Abrir módulo de aprovações</button></p></div>');
    if (e.id === "E9") h.push('<div class="faixa"><p>Os blocos E9.1 e E9.2 são verificados, em sua maior parte, automaticamente a partir do <b>mapa de riscos</b> (análise ampla, elaborado no ETP) e da <b>matriz de riscos</b> (alocação contratual, restrita ao equilíbrio econômico-financeiro). O bloco E9.3 segue os 21 tópicos do <b>termo de justificativas técnicas relevantes</b> (modelo da AGU), a ser preenchido e assinado por profissional habilitado. <button type="button" class="btn sutil pequeno" data-acao="ir" data-visao="riscos" data-aba="mapa">Abrir mapa</button> <button type="button" class="btn sutil pequeno" data-acao="ir" data-visao="riscos" data-aba="matriz">Abrir matriz</button></p></div>');
    if (e.id === "E12") h.push('<div class="faixa ' + (calc.gate.apto ? "ok" : "erro") + '"><p><b>' + (calc.gate.apto ? "Liberação para licitação: apta." : "Liberação para licitação: não apta.") + "</b> " + (calc.gate.apto ? "Todos os itens críticos estão atendidos ou justificados e não há inconsistências bloqueantes." : calc.gate.criticos + " item(ns) crítico(s) pendente(s) e " + calc.gate.erros + " inconsistência(s) bloqueante(s).") + "</p></div>");
    var painel = CFG.paineisEtapa && CFG.paineisEtapa[e.id];
    if (painel) {
      h.push('<fieldset class="secao-form painel-etapa"><legend><h2>' + esc(painel.titulo) + '</h2></legend><div class="campos">' + painel.campos.map(function (c) { return campoHtml(c, "obra.", calc.ctx); }).join("") + "</div></fieldset>");
    }
    var cont = { todos: itens.length, pendentes: 0, criticos: 0, concluidos: 0 };
    itens.forEach(function (it) {
      var s = calc.estados[it.id];
      if (s.resolvido) cont.concluidos++; else { cont.pendentes++; if (it.crit === "critico") cont.criticos++; }
    });
    var chips = [["todos", "Todos"], ["pendentes", "Pendentes"], ["criticos", "Críticos pendentes"], ["concluidos", "Resolvidos"]];
    h.push('<div class="filtros" role="group" aria-label="Filtrar itens">' + chips.map(function (c) { return '<button type="button" class="chip" data-acao="filtro" data-filtro="' + c[0] + '" aria-pressed="' + (ui.filtro === c[0]) + '">' + c[1] + " (" + cont[c[0]] + ")</button>"; }).join("") +
      '<span style="flex:1"></span>' + (e.id !== "E8" ? '<button type="button" class="btn sutil pequeno" data-acao="novo-item" data-etapa="' + e.id + '">' + IC.mais + "Item adicional</button>" : "") + "</div>");
    var filtrados = itens.filter(function (it) {
      var s = calc.estados[it.id];
      if (ui.filtro === "pendentes") return !s.resolvido;
      if (ui.filtro === "criticos") return !s.resolvido && it.crit === "critico";
      if (ui.filtro === "concluidos") return s.resolvido;
      return true;
    });
    if (!filtrados.length) h.push('<div class="vazio"><p>Nenhum item neste filtro.</p></div>');
    var grupos = [];
    filtrados.forEach(function (it) {
      var g = it.grupo || "";
      var ult = grupos[grupos.length - 1];
      if (!ult || ult.nome !== g) grupos.push({ nome: g, itens: [it] }); else ult.itens.push(it);
    });
    grupos.forEach(function (g) {
      h.push('<section class="grupo-itens">' + (g.nome ? "<h3>" + esc(g.nome) + "</h3>" : "") + '<ul class="itens">' + g.itens.map(itemHtml).join("") + "</ul></section>");
    });
    var i = idxEtapa(e.id);
    h.push('<div class="rodape-etapa">' + (i > 0 ? '<button type="button" class="btn" data-acao="abrir-etapa" data-etapa="' + CFG.etapas[i - 1].id + '">' + IC.anterior + CFG.etapas[i - 1].id + " " + esc(CFG.etapas[i - 1].curto) + "</button>" : "<span></span>") +
      (i < CFG.etapas.length - 1 ? '<button type="button" class="btn primario" data-acao="avancar">Avançar para ' + CFG.etapas[i + 1].id + " " + esc(CFG.etapas[i + 1].curto) + IC.proxima + "</button>" : '<button type="button" class="btn primario" data-acao="ir" data-visao="relatorio">Emitir relatório de situação</button>') + "</div>");
    h.push("</div>");
    return h.join("");
  };

  function glifoItem(it, s) {
    if (s.status === "concluido") return GLIFO.concluido;
    if (s.status === "na") return GLIFO.na;
    if (s.status === "em_elaboracao") return GLIFO.em_elaboracao;
    if (s.status === "pendente_aprovacao") return GLIFO.pendente_aprovacao;
    if (it.crit === "critico") return GLIFO.critico;
    return GLIFO.nao_iniciado;
  }

  function itemHtml(it) {
    var s = calc.estados[it.id], reg = s.reg, aberto = !!ui.abertos[it.id];
    var sid = idSeguro(it.id);
    var cls = "item st-" + s.status + (it.crit === "critico" && !s.resolvido ? " pend-critico" : "");
    var listaSt = it.tipo === "aprovacao" ? M.STATUS_APROV : M.STATUS;
    var estado;
    if (it.auto) {
      estado = '<span class="auto-estado item-estado">' + esc(s.auto ? s.auto.detalhe : "") + "</span>";
    } else {
      estado = '<select class="item-estado" id="st-' + sid + '" data-status-item="' + attr(it.id) + '" aria-label="Situação de ' + attr(it.id) + '">' + listaSt.map(function (o) {
        var proib = o[0] === "na" && it.naProibido;
        return '<option value="' + o[0] + '"' + (o[0] === s.status ? " selected" : "") + (proib ? " disabled" : "") + ">" + esc(o[1]) + (proib ? " (não admitido)" : "") + "</option>";
      }).join("") + "</select>";
    }
    var sub = it.tipo === "aprovacao" ? esc(it.orgao) + (it.momento !== "antes_edital" ? ", exigida " + esc(M.MOMENTOS[it.momento]).toLowerCase() : "") : (s.atrasado ? '<span style="color:var(--vermelho)">Prazo vencido em ' + dataBR(reg.dataPrevista) + "</span>" : (reg.responsavel ? "Responsável: " + esc(reg.responsavel) + (reg.dataPrevista ? ", previsto para " + dataBR(reg.dataPrevista) : "") : ""));
    if (s.conferencia) sub += (sub ? " · " : "") + '<span class="conf-resumo">Conteúdo mínimo: ' + s.conferencia.feitos + " de " + s.conferencia.total + " conferidos</span>";
    var h = ['<li class="' + cls + '" id="item-' + sid + '">'];
    h.push('<div class="item-linha">' + glifoItem(it, s) + '<span class="item-id">' + esc(it.id) + '</span><span class="item-titulo"><span class="t">' + esc(it.titulo) + "</span>" + (sub ? "<small>" + sub + "</small>" : "") + "</span>" +
      '<span class="etiqueta ' + it.crit + '">' + esc(M.CRIT[it.crit].rotulo) + "</span>" + estado +
      '<button type="button" class="expandir" id="exp-' + sid + '" data-acao="expandir" data-item="' + attr(it.id) + '" aria-expanded="' + aberto + '" aria-controls="det-' + sid + '" aria-label="Detalhes de ' + attr(it.id) + '">' + IC.seta + "</button></div>");
    if (aberto) h.push('<div class="item-detalhe" id="det-' + sid + '">' + detalheItem(it, s) + "</div>");
    h.push("</li>");
    return h.join("");
  }

  function campoReg(id, campo, rotulo, tipo, valor, largo, opcoes) {
    var fid = "r-" + idSeguro(id) + "-" + campo;
    var a = ' id="' + fid + '" data-item="' + attr(id) + '" data-reg="' + campo + '"';
    var ctrl;
    if (tipo === "textarea") ctrl = "<textarea" + a + ">" + esc(valor || "") + "</textarea>";
    else if (tipo === "select") ctrl = "<select" + a + ">" + opcoes.map(function (o) { return '<option value="' + attr(o[0]) + '"' + (o[0] === (valor || "") ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") + "</select>";
    else ctrl = '<input type="' + tipo + '"' + a + ' value="' + attr(valor || "") + '">';
    return '<div class="campo' + (largo ? " largo" : "") + '"><label for="' + fid + '">' + esc(rotulo) + "</label>" + ctrl + "</div>";
  }

  function detalheItem(it, s) {
    var reg = s.reg, h = [];
    h.push('<p class="desc">' + esc(it.desc) + "</p>");
    h.push('<p class="base-legal"><b>Base:</b> ' + esc(it.base) + "</p>");
    if (it.tipo !== "custom") {
      var mot = it.regra ? M.explicarAtivo(it.regra, calc.ctx, CFG) : "Aplicável a todas as obras";
      h.push('<div class="motivo"><b>Por que está ativo:</b> ' + esc(mot) + (it.motivoCrit ? ". <b>Criticidade ajustada porque:</b> " + esc(M.explicarAtivo(it.motivoCrit, calc.ctx, CFG)) : "") + "</div>");
    }
    if (it.nota) h.push('<div class="faixa aviso"><p>' + esc(it.nota) + "</p></div>");
    if (it.ajuda === "sondagem8036") h.push(ajudaSondagem());
    if (it.ajuda === "prazoArt55") h.push(ajudaPrazoArt55());
    if (it.conteudo && s.conferencia) h.push(conteudoHtml(it, s));
    if (it.auto) {
      h.push('<div class="ajuda-calc"><b>Verificação automática.</b> ' + esc(s.auto ? s.auto.detalhe : "") + "</div>");
      var dest = it.etapa === "E9" || /^orc_riscos$/.test(it.auto) ? '<button type="button" class="btn pequeno" data-acao="ir" data-visao="riscos">Abrir riscos</button>' :
        it.etapa === "E12" ? '<button type="button" class="btn pequeno" data-acao="ir" data-visao="alertas">Ver alertas e inconsistências</button>' : "";
      if (it.auto === "mapa_existe") dest = '<button type="button" class="btn pequeno" data-acao="ir" data-visao="riscos" data-aba="mapa">Abrir mapa de riscos</button>';
      if (dest) h.push('<div class="acoes">' + dest + "</div>");
      return h.join("");
    }
    if (it.tipo === "aprovacao") {
      if (it.momento !== "antes_edital") h.push('<p class="pequeno mudo">Exigida ' + esc(M.MOMENTOS[it.momento]).toLowerCase() + ". No planejamento, defina quem obterá o documento e preveja-o no cronograma e na matriz de riscos.</p>");
      h.push('<div class="campos">' +
        campoReg(it.id, "respObtencao", "Responsável pela obtenção", "select", reg.respObtencao, false, [["", "A definir"], ["administracao", "Administração"], ["contratado", "Contratado"]]) +
        campoReg(it.id, "protocolo", "Nº do protocolo", "text", reg.protocolo) +
        campoReg(it.id, "dataProtocolo", "Data do protocolo", "date", reg.dataProtocolo) +
        campoReg(it.id, "numero", "Nº do documento emitido", "text", reg.numero) +
        campoReg(it.id, "dataEmissao", "Data de emissão", "date", reg.dataEmissao) +
        campoReg(it.id, "validade", "Validade", "date", reg.validade) +
        campoReg(it.id, "responsavel", "Servidor ou unidade responsável", "text", reg.responsavel) +
        campoReg(it.id, "dataPrevista", "Data prevista", "date", reg.dataPrevista) +
        campoReg(it.id, "documento", "Referência no processo", "text", reg.documento) +
        campoReg(it.id, "obs", "Observações e exigências do órgão", "textarea", reg.obs, true) +
        "</div>");
    } else {
      h.push('<div class="campos">' +
        campoReg(it.id, "responsavel", "Responsável", "text", reg.responsavel) +
        campoReg(it.id, "dataPrevista", "Data prevista", "date", reg.dataPrevista) +
        campoReg(it.id, "dataRealizada", "Data realizada", "date", reg.dataRealizada) +
        campoReg(it.id, "documento", "Documento comprobatório (nº, link ou referência)", "text", reg.documento, true) +
        campoReg(it.id, "obs", "Observações", "textarea", reg.obs, true) +
        campoReg(it.id, "pendencias", "Pendências registradas", "textarea", reg.pendencias, true) +
        "</div>");
    }
    if (s.status === "na" || reg.justificativa) h.push('<div class="campos">' + campoReg(it.id, "justificativa", "Justificativa da não aplicabilidade", "textarea", reg.justificativa, true) + "</div>");
    if (it.tipo === "custom") h.push('<div class="acoes"><button type="button" class="btn perigo pequeno" data-acao="excluir-item" data-item="' + attr(it.id) + '">' + IC.lixo + "Excluir item adicional</button></div>");
    return h.join("");
  }

  function conteudoHtml(it, s) {
    var sid = idSeguro(it.id), marc = Array.isArray(s.reg.conferidos) ? s.reg.conferidos : [], c = s.conferencia;
    var h = ['<section class="conteudo-min" aria-labelledby="cm-' + sid + '"><div class="conteudo-cabeca"><h4 id="cm-' + sid + '">Conteúdo mínimo para conferência</h4>' +
      '<span class="etiqueta ' + (c.feitos === c.total ? "cheia-ok" : c.feitos ? "cheia-aviso" : "cheia-neutra") + '" id="cm-conta-' + sid + '">' + c.feitos + " de " + c.total + " conferidos</span>" +
      '<span class="acoes"><button type="button" class="btn sutil pequeno" data-acao="conferir-todos" data-item="' + attr(it.id) + '">Marcar todos</button><button type="button" class="btn sutil pequeno" data-acao="conferir-nenhum" data-item="' + attr(it.id) + '">Limpar</button></span></div>'];
    it.conteudo.forEach(function (b) {
      h.push('<p class="conteudo-fonte">' + esc(b.fonte) + "</p>");
      b.elementos.forEach(function (e) {
        h.push('<div class="conteudo-grupo" role="group" aria-label="' + attr(e.tipo) + '"><h5>' + esc(e.tipo) + "</h5><ul>" + e.itens.map(function (x) {
          var id = "cf-" + sid + "-" + x.chave;
          return '<li><label class="marcador" for="' + id + '"><input type="checkbox" id="' + id + '" data-conferir="' + attr(it.id) + '" data-chave="' + x.chave + '"' + (marc.indexOf(x.chave) >= 0 ? " checked" : "") + "><span>" + esc(x.texto) + "</span></label></li>";
        }).join("") + "</ul></div>");
      });
    });
    h.push("</section>");
    return h.join("");
  }

  function ajudaPrazoArt55() {
    var p = M.prazoMinimoPropostas(calc.ctx);
    var nota = " Contagem em dias úteis a partir da divulgação do edital; alterações que afetem a formulação das propostas exigem nova divulgação e reabertura do prazo (art. 55, §1º).";
    if (!p) return '<div class="ajuda-calc">Defina o regime no cadastro e o critério de julgamento nos parâmetros desta etapa para obter o prazo mínimo do art. 55.' + esc(nota) + "</div>";
    if (p.dias == null) return '<div class="ajuda-calc"><b>Prazo mínimo (' + esc(p.fundamento) + "):</b> " + esc(p.motivo) + "." + esc(nota) + "</div>";
    return '<div class="ajuda-calc"><b>Prazo mínimo: ' + p.dias + " dias úteis</b> (" + esc(p.fundamento) + ", " + esc(p.motivo) + ")." + esc(nota) + "</div>";
  }

  function ajudaSondagem() {
    var a = M.num(M.obter(doc(), "obra.edif.areaProjecao"));
    if (!calc.ctx.isEdif) return '<div class="ajuda-calc">Programe o número e a profundidade dos furos conforme a solução de fundação e as instruções do órgão.</div>';
    if (a == null) return '<div class="ajuda-calc">Informe a área de projeção da edificação no cadastro para obter o número mínimo de furos sugerido pela NBR 8036.</div>';
    var n, extra = "";
    if (a <= 200) n = 2;
    else if (a <= 400) n = 3;
    else if (a <= 1200) n = Math.ceil(a / 200);
    else if (a <= 2400) n = 6 + Math.ceil((a - 1200) / 400);
    else { n = 9; extra = " Acima de 2.400 m², o número é fixado conforme o plano particular da construção."; }
    return '<div class="ajuda-calc"><b>Programação mínima sugerida (NBR 8036):</b> área de projeção de ' + esc(M.numero(a, 0)) + " m², ao menos " + n + " furo(s)." + esc(extra) + " Confira a profundidade e a distribuição na norma e no projeto de fundações.</div>";
  }

  /* ------------------------------- aprovações ------------------------------- */
  VIEWS.aprovacoes = function () {
    var ap = calc.ativos.filter(function (it) { return it.tipo === "aprovacao"; });
    var h = ['<div class="pagina">'];
    h.push('<header class="pagina-cabeca"><h1>Projeto legal, aprovações e licenciamentos</h1><p>Aprovações aplicáveis à obra, com o momento em que cada uma é exigida. As exigidas antes do edital bloqueiam a liberação para licitação; as demais exigem, no planejamento, a definição de quem as obterá. Aprovações pendentes geram automaticamente riscos vinculados no mapa de riscos.</p></header>');
    if (!ap.length) h.push('<div class="vazio"><p>Nenhuma aprovação aplicável com os dados atuais. Complete o cadastro da obra.</p><button type="button" class="btn" data-acao="ir" data-visao="cadastro">Abrir cadastro</button></div>');
    ["antes_edital", "antes_obra", "antes_operacao"].forEach(function (m) {
      var l = ap.filter(function (it) { return it.momento === m; });
      if (!l.length) return;
      var ok = l.filter(function (it) { return calc.estados[it.id].resolvido; }).length;
      h.push('<section class="grupo-itens"><div class="bloco-cabeca"><h2>' + esc(M.MOMENTOS[m]) + '</h2><span class="etiqueta ' + (ok === l.length ? "cheia-ok" : "cheia-neutra") + '">' + ok + " de " + l.length + (m === "antes_edital" ? " obtidas" : " com responsável definido") + '</span></div><ul class="itens">' + l.map(itemHtml).join("") + "</ul></section>");
    });
    var inativas = M.itensInativos(CFG, calc.ctx).filter(function (x) { return x.tipo === "aprovacao"; });
    h.push('<div style="margin-top:22px"><button type="button" class="btn sutil" data-acao="alternar-inativas" aria-expanded="' + ui.mostrarInativas + '">' + (ui.mostrarInativas ? "Ocultar" : "Mostrar") + " aprovações não aplicáveis (" + inativas.length + ")</button></div>");
    if (ui.mostrarInativas) {
      h.push('<div class="tabela-wrap" style="margin-top:10px"><table class="tabela"><thead><tr><th>ID</th><th>Órgão e documento</th><th>Seria aplicável quando</th></tr></thead><tbody>' + inativas.map(function (x) {
        return '<tr><td class="id">' + esc(x.id) + "</td><td><b>" + esc(x.orgao) + '</b><span class="sub">' + esc(x.titulo) + "</span></td><td>" + esc(M.explicar(x.regra, CFG)) + "</td></tr>";
      }).join("") + "</tbody></table></div>");
    }
    h.push("</div>");
    return h.join("");
  };

  /* ------------------------------- riscos ------------------------------- */
  VIEWS.riscos = function () {
    var d = doc();
    var h = ['<div class="pagina">'];

  };
  function abaBtn(id, rotulo) { return '<button type="button" role="tab" id="aba-' + id + '" data-acao="aba" data-aba="' + id + '" aria-selected="' + (ui.aba === id || (id === "mapa" && ["matriz", "calor"].indexOf(ui.aba) < 0)) + '">' + esc(rotulo) + "</button>"; }
  function seletor(id, rotulo, valor, opcoes, acao) {
    return '<div class="campo"><label for="' + id + '">' + esc(rotulo) + '</label><select id="' + id + '" data-filtro-risco="' + acao + '"><option value="">Todos</option>' + opcoes.map(function (o) { return '<option value="' + attr(o[0]) + '"' + (o[0] === valor ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") + "</select></div>";
  }
  function nivelTag(n) { return n && n.id ? '<span class="nivel ' + n.id + '">' + esc(n.rotulo) + " " + n.valor + "</span>" : '<span class="nivel">Sem avaliação</span>'; }

  function abaMapa() {
    var d = doc(), A = calc.riscos;
    var sug = M.sugestoesMapa(CFG, d).length;
    var h = [];
    h.push('<div class="barra-ferramentas"><div class="acoes">' +
      seletor("fm-fase", "Fase", ui.fMapa.fase, CFG.escalas.fases, "mapa-fase") +
      seletor("fm-nivel", "Nível", ui.fMapa.nivel, CFG.escalas.niveis.map(function (n) { return [n.id, n.rotulo]; }), "mapa-nivel") +
      seletor("fm-medida", "Medida", ui.fMapa.medida, CFG.escalas.statusMedida, "mapa-medida") + "</div>" +
      '<div class="acoes"><button type="button" class="btn" data-acao="sugerir-mapa"' + (sug ? "" : " disabled") + ">Riscos típicos (" + sug + ")</button>" +
      '<button type="button" class="btn primario" data-acao="novo-mapa">' + IC.mais + "Novo risco</button></div></div>");
    var lista = A.mapa.filter(function (a) {
      if (ui.fMapa.fase && a.r.fase !== ui.fMapa.fase) return false;

      if (ui.fMapa.medida && a.r.statusMedida !== ui.fMapa.medida) return false;
