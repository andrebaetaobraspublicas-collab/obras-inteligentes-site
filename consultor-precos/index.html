<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Pesquisa de preços de referência em fontes governamentais: Painel de Preços (Compras.gov.br), contratações publicadas no PNCP, atas de registro de preços e notas fiscais eletrônicas.">
<title>Consultor de Preços Governamentais</title>
<style>/* Consultor de Preços Governamentais — estilos
   Metáfora: mapa de preços revisado à caneta. Azul-caneta = amostra válida;
   vermelho-revisão = amostra desconsiderada; verde-carimbo = valor estimado. */
:root{
  --paper:#ECF0E9; --surface:#FAFBF8; --surface-2:#F2F5EF; --sunk:#E3E8E0;
  --ink:#16212B; --ink-2:#36434E; --muted:#5B6771;
  --rule:#CED6CB; --rule-strong:#A8B3A5;
  --bar:#16212B; --bar-ink:#E7ECEE; --bar-muted:#9FB0BC;
  --pen:#2141C4; --pen-hover:#1A34A3; --pen-weak:rgba(33,65,196,.11); --on-pen:#FFFFFF;
  --red:#BE3127; --red-weak:rgba(190,49,39,.10);
  --stamp:#0B7653; --stamp-weak:rgba(11,118,83,.10);
  --amber:#8F5B00; --amber-weak:rgba(176,116,0,.13);
  --head:"Bahnschrift","DIN Alternate","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Segoe UI","Avenir Next",system-ui,-apple-system,"Roboto","Helvetica Neue",Arial,sans-serif;
  --r:4px; --shadow:0 18px 48px rgba(12,20,26,.22);
  color-scheme:light;
}
[data-theme="dark"]{
  --paper:#0E1418; --surface:#141C22; --surface-2:#19232A; --sunk:#0B1014;
  --ink:#DCE4E7; --ink-2:#B9C5CB; --muted:#8C9AA3;
  --rule:#26323A; --rule-strong:#3A4852;
  --bar:#090D10; --bar-ink:#DCE4E7; --bar-muted:#7F909B;
  --pen:#8CA0FF; --pen-hover:#A9B8FF; --pen-weak:rgba(140,160,255,.14); --on-pen:#0B1020;
  --red:#FF7F73; --red-weak:rgba(255,127,115,.13);
  --stamp:#4CC795; --stamp-weak:rgba(76,199,149,.13);
  --amber:#F0B44C; --amber-weak:rgba(240,180,76,.13);
  --shadow:0 18px 48px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--body);min-height:100vh}
h1,h2,h3,h4{font-family:var(--head);font-weight:600;letter-spacing:.005em;margin:0;line-height:1.2}
h2{font-size:19px}h3{font-size:15.5px}h4{font-size:14px}
p{margin:0 0 .6em}
a{color:var(--pen)}a:hover{color:var(--pen-hover)}
small,.small{font-size:12.5px}
.muted{color:var(--muted)}
.num,.tnum{font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.nowrap{white-space:nowrap}
.hide{display:none!important}
.skip{position:absolute;left:-999px;top:0;background:var(--pen);color:var(--on-pen);padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- barra superior ---------- */
.topbar{display:flex;align-items:stretch;gap:18px;background:var(--bar);color:var(--bar-ink);padding:0 18px;min-height:54px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;padding:8px 0;margin-right:6px}
.brand-mark{width:30px;height:30px;flex:none}
.brand strong{display:block;font-family:var(--head);font-size:16.5px;font-weight:600}
.brand span{display:block;font-size:11.5px;color:var(--bar-muted)}
.topbar nav{display:flex;align-items:stretch;gap:2px}
.topbar nav a{display:flex;align-items:center;gap:7px;padding:0 12px;color:var(--bar-ink);text-decoration:none;font-size:13.5px;border-bottom:3px solid transparent;border-top:3px solid transparent}
.topbar nav a:hover{background:rgba(255,255,255,.05)}
.topbar nav a[aria-current="page"]{border-bottom-color:var(--pen);background:rgba(255,255,255,.06)}
[data-theme="light"] .topbar nav a[aria-current="page"]{border-bottom-color:#8CA0FF}
.steps a b{font-family:var(--head);font-weight:600;display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid var(--bar-muted);border-radius:3px;font-size:12px}
.steps a[aria-current="page"] b{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink)}
.topbar .tools{margin-left:auto}
.count{font-family:var(--head);font-size:11.5px;background:#8CA0FF;color:#0B1020;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.count:empty{display:none}
.icon-btn{background:none;border:1px solid transparent;color:inherit;font-size:17px;padding:0 10px;cursor:pointer;border-radius:var(--r)}
.icon-btn:hover{border-color:var(--bar-muted)}

/* ---------- barra do processo ---------- */
.projbar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:9px 20px;background:var(--surface);border-bottom:1px solid var(--rule)}
.projbar .campo{display:flex;flex-direction:column;min-width:0}
.projbar .campo span{font-size:11.5px;color:var(--muted)}
.projbar .campo b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.projbar .acoes{margin-left:auto;display:flex;gap:8px}

main{padding:18px 20px 60px}
.tab-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.tab-head p{margin:4px 0 0;color:var(--muted);max-width:78ch}
.tab-head .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- layout ---------- */
.duas{display:grid;grid-template-columns:minmax(270px,330px) minmax(0,1fr);gap:22px;align-items:start}
.painel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
.painel+.painel{margin-top:14px}
.secao{border-top:1px solid var(--rule-strong);padding-top:12px;margin-top:18px}
.secao:first-child{border-top:0;padding-top:0;margin-top:0}
.secao>header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.secao>header .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.linha{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.linha>.grow{flex:1 1 220px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px}
.sticky{position:sticky;top:12px}

/* ---------- formulários ---------- */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);min-width:0}
label.f>span{font-weight:600}
label.f>em{font-style:normal;color:var(--muted);font-size:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule-strong);border-radius:var(--r);padding:7px 9px;min-width:0;width:100%}
input[type="checkbox"],input[type="radio"]{width:auto;accent-color:var(--pen);margin:0}
input[type="date"]{min-width:132px}
textarea{resize:vertical;min-height:84px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pen);outline-offset:0;border-color:var(--pen)}
.check{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none}
.check em{font-style:normal;color:var(--muted);font-size:12px}
.fontes{display:flex;flex-wrap:wrap;gap:6px 16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 13px/1.1 var(--body);padding:8px 13px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);border-radius:var(--r);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primario{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn.primario:hover{background:var(--pen-hover);border-color:var(--pen-hover)}
.btn.perigo{color:var(--red)}
.btn.perigo:hover{border-color:var(--red)}
.btn.leve{border-color:transparent;background:transparent;padding:6px 8px}
.btn.leve:hover{background:var(--surface-2)}
.btn.pq{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:var(--r);overflow:hidden}
.seg button{font:600 12.5px var(--body);background:var(--surface);color:var(--ink-2);border:0;padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--ink);color:var(--sunk)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-strong);background:var(--surface);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;max-width:100%}
.chip b{font-family:var(--head);font-weight:600}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 5px;border-radius:50%}
.chip button:hover{color:var(--red)}
.chip.ativo{border-color:var(--pen);background:var(--pen-weak)}
button.chip{cursor:pointer;padding:3px 10px;font:inherit;font-size:12.5px;color:var(--ink)}

/* ---------- tabelas ---------- */
.tabela-wrap{overflow:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);max-height:70vh}
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
table.t th{position:sticky;top:0;background:var(--surface);text-align:left;font:600 12px var(--head);color:var(--muted);border-bottom:1px solid var(--rule-strong);padding:7px 8px;white-space:nowrap;z-index:1}
table.t th button{all:unset;cursor:pointer}
table.t th button:hover{color:var(--ink)}
table.t td{border-bottom:1px solid var(--rule);padding:6px 8px;vertical-align:top}
table.t tbody tr:hover td{background:var(--surface-2)}
table.t tr.sel td{background:var(--pen-weak)}
table.t tr.excl td{color:var(--muted)}
table.t tr.excl td.preco{color:var(--red);text-decoration:line-through;text-decoration-thickness:1.5px}
table.t td.desc{min-width:240px;max-width:520px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
table.t td .sub{display:block;color:var(--muted);font-size:11.8px}
table.t input,table.t select{padding:4px 6px;font-size:12.5px}
table.t td.preco{font-weight:600}
.pag{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:8px 0;font-size:12.5px}

.src{display:inline-block;font:600 11px var(--head);padding:1px 6px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.src-painel{color:var(--pen)}.src-pncp{color:var(--ink-2)}.src-arp{color:var(--amber)}
.src-nfe-portal,.src-nfe-xml{color:var(--stamp)}.src-manual,.src-importacao{color:var(--muted)}
.par{font:600 11.5px var(--head);color:var(--ink-2)}

/* ---------- estatísticas e régua ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);margin:8px 0 12px}
.stats div{padding:7px 10px 8px;border-right:1px solid var(--rule)}
.stats div:last-child{border-right:0}
.stats span{display:block;font-size:11.5px;color:var(--muted)}
.stats b{display:block;font:600 16.5px var(--head);font-variant-numeric:tabular-nums;white-space:nowrap}
.regua{width:100%;display:block}
.regua .rg-base{stroke:var(--ink-2);stroke-width:1.2}
.regua .rg-tick{stroke:var(--ink-2);stroke-width:1}
.regua .rg-tick.menor{stroke:var(--rule-strong)}
.regua .rg-lbl{fill:var(--muted);font:11px var(--head);font-variant-numeric:tabular-nums}
.regua .rg-band{fill:var(--pen-weak)}
.regua .rg-lim{stroke:var(--pen);stroke-width:1;stroke-dasharray:3 3}
.regua .rg-dot{fill:var(--pen)}
.regua .rg-dot.x{fill:var(--surface);stroke:var(--red);stroke-width:1.6}
.regua .rg-med{fill:var(--ink)}
.regua .rg-medlbl{fill:var(--ink-2);font:600 11px var(--head)}
.regua .rg-est{stroke:var(--stamp);stroke-width:2}
.regua .rg-estlbl{fill:var(--stamp);font:600 12px var(--head)}
.regua .rg-edge{fill:var(--red);font:600 11px var(--head)}
.regua .rg-grid{stroke:var(--rule);stroke-width:1}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.legenda i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legenda .l-ok{background:var(--pen)}.legenda .l-x{border:1.6px solid var(--red)}
.legenda .l-band{border-radius:2px;background:var(--pen-weak);border:1px dashed var(--pen);width:14px}
.legenda .l-est{border-radius:0;width:3px;height:12px;background:var(--stamp)}

.carimbo{display:inline-flex;flex-direction:column;border:3px double var(--stamp);color:var(--stamp);padding:6px 12px 7px;border-radius:3px}
.carimbo span{font-size:11.5px}
.carimbo b{font:600 23px var(--head);font-variant-numeric:tabular-nums;line-height:1.1}
.carimbo em{font-style:normal;font-size:12px}

/* ---------- avisos ---------- */
.aviso{border-left:3px solid var(--amber);background:var(--amber-weak);padding:8px 11px;border-radius:0 var(--r) var(--r) 0;font-size:13px;margin:6px 0}
.aviso.erro{border-color:var(--red);background:var(--red-weak)}
.aviso.ok{border-color:var(--stamp);background:var(--stamp-weak)}
.aviso.info{border-color:var(--pen);background:var(--pen-weak)}
.aviso p:last-child{margin:0}
.vazio{padding:26px 18px;text-align:left;color:var(--muted);border:1px dashed var(--rule-strong);border-radius:var(--r);background:var(--surface)}
.vazio strong{display:block;color:var(--ink);font-family:var(--head);font-size:15.5px;margin-bottom:4px}

/* ---------- status das consultas ---------- */
.status-lista{list-style:none;margin:8px 0 0;padding:0;font-size:12.8px}
.status-lista li{display:flex;gap:10px;align-items:baseline;padding:4px 0;border-bottom:1px dotted var(--rule)}
.status-lista li .st{font:600 11.5px var(--head);min-width:76px}
.st.ok{color:var(--stamp)}.st.erro{color:var(--red)}.st.rodando{color:var(--pen)}.st.aviso{color:var(--amber)}
.status-lista li .det{margin-left:auto;color:var(--muted);text-align:right}
.barra{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--pen);width:0;transition:width .25s}

/* ---------- catálogo (coluna esquerda) ---------- */
.cat-lista{list-style:none;margin:8px 0 0;padding:0;max-height:52vh;overflow:auto;border-top:1px solid var(--rule)}
.cat-lista li{padding:7px 2px 8px;border-bottom:1px solid var(--rule)}
.cat-lista li .nome{font-size:13px;font-weight:600}
.cat-lista li .meta{font-size:11.8px;color:var(--muted)}
.cat-lista li .acoes{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.cat-lista li.inativo{opacity:.55}

/* ---------- cesta ---------- */
.itens-lista{list-style:none;margin:0;padding:0}
.itens-lista li{border-bottom:1px solid var(--rule)}
.itens-lista button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;width:100%;padding:9px 6px;cursor:pointer;border-left:3px solid transparent}
.itens-lista button:hover{background:var(--surface-2)}
.itens-lista button[aria-current="true"]{border-left-color:var(--pen);background:var(--pen-weak)}
.itens-lista .n{font:600 13px var(--head);color:var(--muted)}
.itens-lista .d{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itens-lista .v{font:600 13px var(--head);font-variant-numeric:tabular-nums;text-align:right}
.itens-lista .sub{grid-column:2/4;font-size:11.8px;color:var(--muted)}
.total-geral{display:flex;justify-content:space-between;align-items:baseline;padding:10px 6px 2px;font-family:var(--head)}
.total-geral b{font-size:17px;font-variant-numeric:tabular-nums}
.analise{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}

/* ---------- modal e toasts ---------- */
.modal-fundo{position:fixed;inset:0;background:rgba(8,12,16,.48);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;z-index:50;overflow:auto}
.modal{background:var(--surface);color:var(--ink);border-radius:6px;box-shadow:var(--shadow);width:min(760px,100%);padding:18px 20px 16px;border:1px solid var(--rule-strong)}
.modal.largo{width:min(1080px,100%)}
.modal>header{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.modal>header h2{flex:1}
.modal>footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}
.modal pre{background:var(--sunk);padding:10px;border-radius:var(--r);overflow:auto;max-height:340px;font-size:12px}
dl.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:5px 14px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;word-break:break-word}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(440px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:var(--r);box-shadow:var(--shadow);font-size:13px;border-left:4px solid var(--pen)}
.toast.ok{border-left-color:var(--stamp)}.toast.erro{border-left-color:var(--red)}
.drop{border:1.5px dashed var(--rule-strong);border-radius:var(--r);padding:22px;text-align:left;background:var(--surface);cursor:pointer}
.drop.sobre{border-color:var(--pen);background:var(--pen-weak)}

/* ---------- manual ---------- */
.manual{display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;align-items:start}
.manual nav{position:sticky;top:12px}
.manual nav ul{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--rule)}
.manual nav li a{display:flex;gap:8px;align-items:baseline;padding:7px 4px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);font-size:13px}
.manual nav li a[aria-current="true"]{color:var(--pen);font-weight:600}
.manual nav li a .lido{margin-left:auto;color:var(--stamp);font-size:12px}
.manual article{max-width:76ch}
.manual article h2{margin:4px 0 10px}
.manual article h3{margin:16px 0 6px}
.manual article p,.manual article li{line-height:1.6}
.manual article table{border-collapse:collapse;font-size:12.8px;margin:8px 0}
.manual article td,.manual article th{border-bottom:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
.manual code,.cfg code{background:var(--sunk);padding:1px 5px;border-radius:3px;font-size:12.3px;word-break:break-all}
.lab{border:1px solid var(--rule-strong);border-radius:var(--r);padding:12px 14px;margin:14px 0;background:var(--surface)}
.lab>h3{margin-top:0}
.codigo{background:var(--sunk);border-radius:var(--r);padding:10px;font:12px/1.45 ui-monospace,Consolas,"Cascadia Mono",Menlo,monospace;white-space:pre;overflow:auto;max-height:300px}

/* ---------- relatório ---------- */
.doc{background:#fff;color:#111a22;max-width:1000px;padding:34px 40px;border:1px solid var(--rule);font:13px/1.5 var(--body)}
[data-theme="dark"] .doc{box-shadow:0 0 0 1px #000}
.doc h1{font-size:21px;margin-bottom:2px}
.doc h2{font-size:16px;margin:22px 0 8px;padding-bottom:4px;border-bottom:1.5px solid #111a22}
.doc h3{font-size:14px;margin:16px 0 6px}
.doc table{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0 10px}
.doc th{text-align:left;border-bottom:1.2px solid #111a22;padding:4px 5px;font-family:var(--head);font-weight:600}
.doc td{border-bottom:1px solid #c9d0d5;padding:4px 5px;vertical-align:top}
.doc td.num,.doc th.num{text-align:right}
.doc .excl td{color:#6a747b}.doc .excl td.preco{text-decoration:line-through;color:#a3241b}
.doc .meta-doc{display:grid;grid-template-columns:170px 1fr;gap:3px 12px;font-size:12.5px}
.doc .meta-doc dt{color:#55606a}.doc .meta-doc dd{margin:0}
.doc .assin{margin-top:46px;display:flex;gap:60px}
.doc .assin div{border-top:1px solid #111a22;padding-top:4px;min-width:240px;font-size:12px}
.doc .regua .rg-lbl,.doc .regua .rg-medlbl{fill:#3b4650}
.doc .regua .rg-dot{fill:#2141C4}.doc .regua .rg-dot.x{fill:#fff;stroke:#BE3127}
.doc .regua .rg-band{fill:rgba(33,65,196,.11)}.doc .regua .rg-est{stroke:#0B7653}.doc .regua .rg-estlbl{fill:#0B7653}
.doc .regua .rg-base,.doc .regua .rg-tick{stroke:#36434E}
.doc .url{word-break:break-all;color:#3b4650;font-size:10.5px}

#print-area{display:none}

@media print{
  body{background:#fff}

}
@media (max-width:980px){
  .duas,.manual,.analise{grid-template-columns:1fr}

/* ---------- aviso de conexão com as APIs ---------- */
.aviso-conexao{background:var(--surface);border-bottom:1px solid var(--rule-strong);border-left:5px solid var(--red);padding:16px 22px 14px}
.aviso-conexao.leve{border-left-color:var(--amber)}
.aviso-conexao h2{font-size:18.5px;margin:0 0 6px}
.aviso-conexao>p{max-width:98ch;margin:0 0 6px}
.aviso-conexao ol.passos{margin:12px 0 14px;padding-left:24px;max-width:104ch}
.aviso-conexao ol.passos li{margin:9px 0;line-height:1.55}
.aviso-conexao ol.passos li::marker{font-family:var(--head);font-weight:600}
.aviso-conexao details{margin-top:12px}
.aviso-conexao details ul{margin:6px 0 0;padding-left:20px}
.aviso-conexao details li{margin:6px 0}
.ponto{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted);vertical-align:1px}
.ponto.ok{background:var(--stamp)}.ponto.erro{background:var(--red)}.ponto.aviso{background:var(--amber)}
/* ---------- verificação de conformidade ---------- */
.pontos{margin-top:14px}
.pontos h4{margin:0 0 2px}
ul.verif{list-style:none;margin:6px 0 6px;padding:0}
ul.verif li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:7px 0;border-bottom:1px dotted var(--rule);font-size:13px;line-height:1.45}
ul.verif li:last-child{border-bottom:0}
ul.verif li .ic{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font:700 12px var(--head);color:#fff;background:var(--muted);margin-top:1px}
ul.verif li.v-erro .ic{background:var(--red)}
ul.verif li.v-aviso .ic{background:var(--amber)}
ul.verif li.v-ok .ic{background:var(--stamp)}
ul.verif li em{display:block;font-style:normal;color:var(--muted);font-size:11.8px;margin-top:2px}
ul.verif.compacta{margin:0}
ul.verif.compacta li{padding:3px 0;font-size:12.5px;border-bottom:0}
ul.verif.compacta li .ic{width:17px;height:17px;font-size:10.5px}
.verif-ok{display:flex;align-items:center;gap:6px;color:var(--stamp);font-weight:600;font-size:13.5px;margin:6px 0}
.marca{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font:700 10.5px/1 var(--head);color:#fff;margin-right:5px;vertical-align:-3px;flex:none}
.marca.v-ok{background:var(--stamp)}.marca.v-aviso{background:var(--amber)}.marca.v-erro{background:var(--red)}
.verif-resumo{display:flex;gap:8px;flex-wrap:wrap}
.verif-resumo span{border:1px solid var(--rule-strong);border-radius:999px;padding:3px 11px;font-size:12.5px;background:var(--surface);font-weight:600}
.verif-resumo span.v-erro{border-color:var(--red);color:var(--red);background:var(--red-weak)}
.verif-resumo span.v-aviso{border-color:var(--amber);color:var(--amber);background:var(--amber-weak)}
.verif-resumo span.v-ok{border-color:var(--stamp);color:var(--stamp)}
#rl-verif{margin-bottom:22px}
#rl-verif .tabela-wrap{max-height:none}
/* ---------- sensibilidade ---------- */
details.sens{margin-top:16px;border-top:1px solid var(--rule);padding-top:10px}
details.sens summary{font:600 14.5px var(--head);cursor:pointer;list-style-position:outside}
.sens-wrap{max-height:none;margin-top:8px;display:inline-block;max-width:100%}
table.sens{width:auto;min-width:520px}
table.sens tbody th{position:static;background:none;font:600 12.8px var(--body);color:var(--ink);border-bottom:1px solid var(--rule);padding:6px 10px 6px 8px;text-align:left;white-space:nowrap}
table.sens tbody th .sub{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
table.sens td{padding:3px 4px;vertical-align:middle}
table.sens td button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;min-width:92px;text-align:right;padding:5px 8px;border-radius:3px;font-variant-numeric:tabular-nums}
table.sens td button:hover{background:var(--pen-weak)}
table.sens td button:focus-visible{outline:2px solid var(--pen);outline-offset:1px}
table.sens td.atual button{background:var(--pen);color:var(--on-pen);font-weight:700}
table.sens td.poucas button{color:var(--muted);font-style:italic}
table.sens td.atual.poucas button{color:var(--on-pen)}
/* ---------- escala, semelhança e motivos ---------- */
.razao{font-variant-numeric:tabular-nums}
.razao.fora{color:var(--amber);font-weight:600}
table.t td.situacao{min-width:150px}
table.t td.situacao select,table.t td.situacao input{display:block;width:100%;min-width:150px}
table.t td.situacao select+select,table.t td.situacao select+input{margin-top:4px}
table.t select.inciso{min-width:58px;width:auto}
table.t input.fator{width:74px}
table.t td .sub.motivo-auto{color:var(--red)}
table.t td .sub.aviso-txt{color:var(--amber)}
table.t td.acoes-am{width:1%}
table.t td.acoes-am .btn{display:block;width:100%;padding:4px 6px;text-align:center}
.stats div.faixa b{white-space:normal;font-size:15px;line-height:1.25}
.stats div.faixa b small{font-weight:400;color:var(--muted);font-size:12px}
.duas>*{min-width:0}
table.t select.falta{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
/* ---------- pesquisa assistida ---------- */
ol.etapas{list-style:none;margin:0;padding:0;counter-reset:etapa}
ol.etapas li{position:relative;padding:8px 0 9px 36px;border-bottom:1px dotted var(--rule);font-size:13.5px;counter-increment:etapa}
ol.etapas li::before{content:counter(etapa);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--head);background:var(--sunk);color:var(--ink-2)}
ol.etapas li.ok::before{content:'✓';background:var(--stamp);color:#fff}
ol.etapas li.rodando::before{background:var(--pen);color:var(--on-pen)}
ol.etapas li.aviso::before{content:'!';background:var(--amber);color:#fff}
ol.etapas li.erro::before{content:'×';background:var(--red);color:#fff}
ol.etapas li b{font-family:var(--head);margin-right:6px}
ol.etapas li span{color:var(--ink-2)}
/* ---------- abertura ---------- */
.abertura{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 38%,#1E2C39 0%,#111A22 62%,#0B1116 100%);color:#E7ECEE;overflow:auto;padding:24px}
body.abrindo{overflow:hidden}
.abertura.saindo{animation:ab-sair .45s ease forwards}
.ab-cena{width:min(940px,96vw);transition:opacity .5s ease,filter .5s ease}
.ab-cena svg{width:100%;height:auto;display:block}
.abertura.termo .ab-cena{opacity:.2;filter:blur(1.5px)}

.ab-pular:hover{color:#fff;border-color:#8CA0FF}
.abertura.termo .ab-pular{display:none}

.ab-cartao h2{font-size:23px;margin:4px 0 10px}
.ab-cartao .ab-versao{font:600 12px var(--head);color:#5B6771}
.ab-cartao p,.ab-cartao li{font-size:14px;line-height:1.55}
.ab-cartao ul{padding-left:20px;margin:8px 0 14px}
.ab-cartao li{margin:5px 0}
.ab-cartao footer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid #CED6CB;padding-top:14px;margin-top:6px}
.ab-cartao .btn.primario{background:#2141C4;border-color:#2141C4;color:#fff;padding:10px 18px;font-size:14px}
.ab-cartao small{color:#5B6771}
.ab-fonte{opacity:0;animation:ab-entrar .45s ease-out forwards;animation-delay:var(--d)}
.ab-fonte rect{fill:#1E2C39;stroke:#3A4852}
.ab-fonte text{fill:#DCE4E7;font:600 15px var(--head)}
.ab-regua{stroke:#C9D3D9;stroke-width:2;stroke-dasharray:760;stroke-dashoffset:760;animation:ab-tracar .55s ease-out forwards .1s}
.ab-tick{stroke:#7F909B;stroke-width:1.2;opacity:0;animation:ab-surgir .3s ease forwards;animation-delay:var(--d)}
.ab-tick.maior{stroke:#C9D3D9}
.ab-tag{opacity:0;animation:ab-cair .62s cubic-bezier(.45,.05,.55,.95) both;animation-delay:var(--d)}
.ab-tag rect{fill:#F2F4EF}
.ab-tag text{fill:#16212B;font:700 10.5px var(--head)}
.ab-ponto{fill:#8CA0FF;opacity:0;transform-box:fill-box;transform-origin:center;animation:ab-pousar .28s ease-out forwards;animation-delay:calc(var(--d) + .56s)}
.ab-ponto.fora{animation:ab-pousar .28s ease-out forwards,ab-fora .3s ease forwards;animation-delay:calc(var(--d) + .56s),var(--dx)}
.ab-lupa{opacity:0;animation:ab-varrer 1.5s cubic-bezier(.4,0,.6,1) forwards 1.15s}
.ab-lupa circle{fill:rgba(140,160,255,.10);stroke:#E7ECEE;stroke-width:3}
.ab-lupa line{stroke:#E7ECEE;stroke-width:6;stroke-linecap:round}
.ab-faixa{fill:rgba(140,160,255,.16);stroke:#8CA0FF;stroke-dasharray:4 4;opacity:0;animation:ab-surgir .45s ease forwards 2.55s}
.ab-mediana{fill:#E7ECEE;opacity:0;animation:ab-descer .35s ease-out forwards 2.75s}
.ab-est{stroke:#4CC795;stroke-width:3;stroke-dasharray:170;stroke-dashoffset:170;animation:ab-tracar .4s ease-out forwards 2.9s}
.ab-carimbo{opacity:0;transform-box:fill-box;transform-origin:center;animation:ab-carimbar .38s cubic-bezier(.2,1.5,.4,1) forwards 3.1s}
.ab-carimbo rect{fill:rgba(17,26,34,.88);stroke:#4CC795;stroke-width:2.5}
.ab-carimbo .ab-c-in{fill:none;stroke-width:1.2}
.ab-carimbo .ab-c1{fill:#4CC795;font:600 12px var(--head);letter-spacing:.06em}
.ab-carimbo .ab-c2{fill:#4CC795;font:700 27px var(--head)}
.ab-titulo{opacity:0;animation:ab-surgir .5s ease forwards 3.3s}
.ab-titulo .t1{fill:#F2F4EF;font:600 34px var(--head)}
.ab-titulo .t2{fill:#9FB0BC;font:15px var(--body)}
.abertura.estatica .ab-tag,.abertura.estatica .ab-lupa{display:none}
.abertura.estatica .ab-fonte,.abertura.estatica .ab-tick,.abertura.estatica .ab-ponto,.abertura.estatica .ab-faixa,.abertura.estatica .ab-mediana,.abertura.estatica .ab-titulo{opacity:1;animation:none}
.abertura.estatica .ab-carimbo{opacity:1;animation:none;transform:rotate(-4deg)}
.abertura.estatica .ab-regua,.abertura.estatica .ab-est{stroke-dashoffset:0;animation:none}
.abertura.estatica .ab-ponto.fora{fill:#111A22;stroke:#FF7F73;stroke-width:2.4}
@keyframes ab-tracar{to{stroke-dashoffset:0}}
@keyframes ab-surgir{to{opacity:1}}
@keyframes ab-entrar{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes ab-cair{0%{transform:translate(var(--x0),var(--y0)) rotate(var(--r));opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translate(var(--x1),var(--y1)) rotate(0deg);opacity:0}}
@keyframes ab-pousar{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes ab-fora{to{fill:#111A22;stroke:#FF7F73;stroke-width:2.4}}
@keyframes ab-varrer{0%{transform:translate(40px,0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translate(860px,0);opacity:0}}
@keyframes ab-descer{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes ab-carimbar{0%{opacity:0;transform:scale(1.7) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}
@keyframes ab-subir{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes ab-sair{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ===== 00-core.js ===== */
'use strict';
/* Consultor de Preços Governamentais — núcleo
   Zero dependências; roda aberto direto do disco (file://) ou hospedado. */
const CP = (window.CP = window.CP || {});
CP.VERSION = '1.3.0';
// Proxy em nuvem (ex.: Cloudflare Worker) usado por padrão quando o sistema é publicado num site.
// Fica vazio no uso local, que passa pelo iniciador.
CP.PROXY_PADRAO = '';
CP.BUILD = '2026-10-31 16:16';

CP.util = (() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC[c]);
  const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
  const pad = (n) => String(n).padStart(2, '0');

  const nfCache = {};
  function fmtNum(v, max = 2, min = max) {
    if (!isNum(v)) return '—';
    const k = min + ':' + max;
    nfCache[k] = nfCache[k] || new Intl.NumberFormat('pt-BR', { minimumFractionDigits: min, maximumFractionDigits: max });
    return nfCache[k].format(v);
  }
  const fmtBRL = (v) => (isNum(v) ? 'R$ ' + fmtNum(v, 2) : '—');
  // preços unitários pequenos precisam de mais casas (ex.: R$ 0,0345 por folha)
  function fmtPrice(v) {
    if (!isNum(v)) return '—';
    return 'R$ ' + (Math.abs(v) < 1 && v !== 0 ? fmtNum(v, 4, 2) : fmtNum(v, 2));
  }
  const fmtPct = (v, d = 1) => (isNum(v) ? fmtNum(v * 100, d) + '%' : '—');
  const fmtInt = (v) => (isNum(v) ? fmtNum(v, 0) : '—');
  function fmtQtd(v) { return isNum(v) ? fmtNum(v, Number.isInteger(v) ? 0 : 3, 0) : '—'; }

  function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  const nowISO = () => new Date().toISOString();
  function parseDate(s) {
    if (s == null || s === '') return null;
    if (s instanceof Date) return isNaN(s) ? null : `${s.getFullYear()}-${pad(s.getMonth() + 1)}-${pad(s.getDate())}`;
    s = String(s).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) { const b = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if (b) m = [0, b[3], b[2], b[1]]; }
    if (!m) { const c = s.match(/^(\d{4})(\d{2})(\d{2})$/); if (c) m = c; }
    if (!m) { const d = s.match(/^(\d{2})\/(\d{4})$/); if (d) m = [0, d[2], d[1], '01']; }
    if (!m) return null;
    const mo = Number(m[2]), da = Number(m[3]);
    if (mo < 1 || mo > 12 || da < 1 || da > 31) return null;
    return `${m[1]}-${m[2]}-${m[3]}`;
  }
  function fmtDate(iso) { const d = parseDate(iso); if (!d) return '—'; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; }
  function fmtDateTime(v) {
    if (!v) return '—';
    const d = new Date(v);
    if (isNaN(d)) return fmtDate(v);
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  const toUTC = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const fromUTC = (dt) => dt.toISOString().slice(0, 10);
  function addDays(iso, n) { const d = toUTC(iso); d.setUTCDate(d.getUTCDate() + n); return fromUTC(d); }
  function addMonths(iso, n) {
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1 + n, 1));
    const ult = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate();
    dt.setUTCDate(Math.min(d, ult));
    return fromUTC(dt);
  }
  const daysBetween = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 86400000);

  const STOP = new Set(['de', 'da', 'do', 'das', 'dos', 'e', 'em', 'para', 'com', 'sem', 'a', 'o', 'as', 'os', 'por', 'um', 'uma', 'na', 'no', 'nas', 'nos', 'ou']);
  function norm(s) { return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
  function tokens(s) { return norm(s).split(' ').filter((t) => t && (t.length > 1 || /\d/.test(t)) && !STOP.has(t)); }
  // fração dos termos da consulta presentes (por prefixo) no texto
  function matchScore(texto, qTok, palavras) {
    if (!qTok.length) return 0;
    const w = palavras || norm(texto).split(' ');
    let hit = 0;
    for (const t of qTok) if (w.some((x) => x.startsWith(t))) hit++;
    return hit / qTok.length;
  }

  // aceita 1234.56, "1.234,56", "1234,56", "R$ 12,00"
  function parseNum(v) {
    if (typeof v === 'number') return Number.isFinite(v) ? v : NaN;
    if (v == null) return NaN;
    let s = String(v).trim().replace(/[R$\s\u00a0]/g, '');

/* Unidades de fornecimento: rótulos diferentes para a mesma unidade ("UN", "UNIDADE", "Und.")
   precisam cair na mesma chave antes de comparar preços. */
CP.units = (() => {
  const SIN = {
    UN: ['UN', 'UND', 'UNID', 'UNIDADE', 'UNIDADES', 'U', 'UNI', 'UNIT'],
    CX: ['CX', 'CAIXA', 'CAIXAS'], PCT: ['PCT', 'PACOTE', 'PACOTES', 'PCTE'], RESMA: ['RESMA', 'RESMAS', 'RM', 'RES'],
    KG: ['KG', 'QUILOGRAMA', 'QUILO', 'KILO', 'KILOGRAMA', 'QUILOGRAMAS'], G: ['G', 'GR', 'GRAMA', 'GRAMAS'],
    L: ['L', 'LT', 'LITRO', 'LITROS'], ML: ['ML', 'MILILITRO', 'MILILITROS'], M: ['M', 'MT', 'METRO', 'METROS', 'MTS'], CM: ['CM', 'CENTIMETRO', 'CENTIMETROS'], MM: ['MM', 'MILIMETRO', 'MILIMETROS'],
    M2: ['M2', 'METRO QUADRADO', 'METROS QUADRADOS'], M3: ['M3', 'METRO CUBICO', 'METROS CUBICOS'],
    SERV: ['SV', 'SERV', 'SERVICO', 'SERVICOS'], MES: ['MES', 'MESES', 'MENSAL'], H: ['H', 'HR', 'HORA', 'HORAS'],
    DIA: ['DIA', 'DIAS', 'DIARIA', 'DIARIAS'], PAR: ['PAR', 'PARES'], FR: ['FR', 'FRASCO', 'FRASCOS'], GL: ['GL', 'GALAO', 'GALOES'],
    RL: ['RL', 'RO', 'ROLO', 'ROLOS'], JG: ['JG', 'JOGO', 'JOGOS'], KIT: ['KIT', 'KITS'], CJ: ['CJ', 'CONJUNTO', 'CONJUNTOS'],
    TB: ['TB', 'TUBO', 'TUBOS'], SC: ['SC', 'SACO', 'SACOS'], BL: ['BL', 'BLOCO', 'BLOCOS'], FL: ['FL', 'FOLHA', 'FOLHAS'],
    PECA: ['PC', 'PCA', 'PECA', 'PECAS'], AMP: ['AMP', 'AMPOLA', 'AMPOLAS'], CP: ['CP', 'COMP', 'COMPRIMIDO', 'COMPRIMIDOS'],
    T: ['T', 'TON', 'TONELADA', 'TONELADAS'], KM: ['KM', 'QUILOMETRO', 'QUILOMETROS'], BD: ['BD', 'BALDE', 'BALDES'],
    LATA: ['LATA', 'LATAS', 'LT.'], GARRAFA: ['GARRAFA', 'GARRAFAS', 'GRF'], ENV: ['ENV', 'ENVELOPE', 'ENVELOPES'],
  };
  const MAPA = new Map();
  for (const [k, vs] of Object.entries(SIN)) for (const v of vs) MAPA.set(v, k);
  const limpar = (s) => {
    const t = String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[²]/g, '2').replace(/[³]/g, '3').replace(/[^A-Z0-9 ,.]/g, ' ').replace(/\s+/g, ' ').trim();
    return t;
  };
  function unidade(tok) { const t = tok.replace(/\.$/, ''); return MAPA.get(t) || MAPA.get(tok) || t; }

  function key(rotulo) {
    const b = limpar(rotulo);
    if (!b) return '';
    if (MAPA.has(b)) return MAPA.get(b);
    const m = b.match(/^([A-Z][A-Z .]*?)\s+(\d+(?:[.,]\d+)?)\s*([A-Z][A-Z0-9 ]*)$/);
    if (m) {
      const cap = CP.util.parseNum(m[2]);
      const u1 = unidade(m[1].trim()), u2 = unidade(m[3].trim());
      if (cap === 1) return u1 === u2 || u2 === 'UN' ? u1 : `${u1}:1:${u2}`;
      return `${u1}:${cap}:${u2}`;
    }
    return unidade(b);
  }
  // rótulo → embalagem, capacidade e unidade-base ("CX 50 UN" → CX, 50, UN)
  function parse(rotulo) {
    const k = key(rotulo);

    return p.length === 3 ? { emb: p[0], cap: Number(p[1]), base: p[2] } : { emb: k, cap: 1, base: k };
  }

  function base(rotulo) {
    const p = parse(rotulo);
    if (!p || !(p.cap > 0)) return null;
    const d = DIM[p.base];
    return d ? { rotulo: d[0], qtd: p.cap * d[1] } : { rotulo: p.base, qtd: p.cap };

  }
  return { key, parse, base, converter };
})();

CP.ui = (() => {
  const U = CP.util;
  function toast(msg, tipo = 'info', ms = 5200) {
    const box = document.getElementById('toasts');
    if (!box) return;
    const el = document.createElement('div');
    el.className = 'toast ' + tipo;
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => el.remove(), ms);
  }
  let pilha = [];
  function modal({ titulo, corpo, acoes = [{ rotulo: 'Fechar' }], largo = false, aoAbrir } = {}) {
    const root = document.getElementById('modal-root');
    const fundo = document.createElement('div');
    fundo.className = 'modal-fundo';
    const id = U.uid('m');
    fundo.innerHTML = `<div class="modal${largo ? ' largo' : ''}" role="dialog" aria-modal="true" aria-labelledby="${id}">
      <header><h2 id="${id}">${U.esc(titulo || '')}</h2><button type="button" class="btn leve" data-fechar aria-label="Fechar">✕</button></header>
      <div class="modal-corpo"></div><footer></footer></div>`;
    const corpoEl = fundo.querySelector('.modal-corpo');
    if (typeof corpo === 'string') corpoEl.innerHTML = corpo; else if (corpo) corpoEl.appendChild(corpo);
    const rodape = fundo.querySelector('footer');
    const anterior = document.activeElement;
    const fechar = () => { fundo.remove(); pilha = pilha.filter((x) => x !== fechar); document.removeEventListener('keydown', tecla); if (anterior && anterior.focus) anterior.focus(); };
    acoes.forEach((a) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn' + (a.primario ? ' primario' : '') + (a.perigo ? ' perigo' : '');
      b.textContent = a.rotulo;
      b.addEventListener('click', async () => { if (a.acao) { const r = await a.acao(corpoEl, fechar); if (r === false) return; } fechar(); });
      rodape.appendChild(b);
    });
    if (!acoes.length) rodape.remove();
    fundo.addEventListener('click', (e) => { if (e.target === fundo || e.target.closest('[data-fechar]')) fechar(); });
    function tecla(e) { if (e.key === 'Escape' && pilha[pilha.length - 1] === fechar) fechar(); }
    document.addEventListener('keydown', tecla);
    root.appendChild(fundo);
    pilha.push(fechar);
    const foco = corpoEl.querySelector('input,select,textarea,button') || rodape.querySelector('.primario') || fundo.querySelector('[data-fechar]');
    if (foco) setTimeout(() => foco.focus(), 0);
    if (aoAbrir) aoAbrir(corpoEl, fechar);
    return { fechar, corpo: corpoEl };
  }
  function confirmar(msg, { rotulo = 'Confirmar', perigo = false } = {}) {
    return new Promise((res) => {
      let ok = false;
      const m = modal({ titulo: 'Confirmação', corpo: `<p>${U.esc(msg)}</p>`, acoes: [{ rotulo: 'Cancelar' }, { rotulo, primario: !perigo, perigo, acao: () => { ok = true; } }] });
      const obs = new MutationObserver(() => { if (!document.body.contains(m.corpo)) { obs.disconnect(); res(ok); } });
      obs.observe(document.getElementById('modal-root'), { childList: true });
    });
  }
  // delegação de eventos: on(root, 'click', '[data-acao]', fn)
  function on(root, ev, sel, fn) {
    root.addEventListener(ev, (e) => { const t = e.target.closest(sel); if (t && root.contains(t)) fn(e, t); });
  }
  function vazio(titulo, texto, acaoHtml = '') { return `<div class="vazio"><strong>${U.esc(titulo)}</strong><p>${texto}</p>${acaoHtml}</div>`; }
  return { toast, modal, confirmar, on, vazio };
})();

CP.store = (() => {
  const P = 'cpgov.';
  let ok = true;
  const mem = {};
  try { localStorage.setItem(P + '__t', '1'); localStorage.removeItem(P + '__t'); } catch (e) { ok = false; }
  function get(k, def) {
    try { const v = ok ? localStorage.getItem(P + k) : mem[k]; return v == null ? def : JSON.parse(v); } catch (e) { return def; }
  }
  function set(k, v) {
    const s = JSON.stringify(v);
    try { if (ok) localStorage.setItem(P + k, s); else mem[k] = s; return true; } catch (e) {
      CP.ui.toast('O armazenamento do navegador está cheio. Exporte o projeto e libere espaço em Configurações (índice do catálogo ou base de NF-e).', 'erro', 9000);
      return false;
    }
  }
  function del(k) { try { if (ok) localStorage.removeItem(P + k); else delete mem[k]; } catch (e) { /* sem ação */ } }

    let t = 0;
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(P)) t += (localStorage.getItem(k) || '').length + k.length; } } catch (e) { /* sem ação */ }

  }
  function chaves() { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(P)) out.push(k.slice(P.length)); } } catch (e) { /* sem ação */ } return out; }

})();
