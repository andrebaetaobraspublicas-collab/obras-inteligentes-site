  }

  async function testar() {
    const s = S(), out = document.getElementById('cf-teste');
    const casos = [
      { nome: 'Dados Abertos do Compras.gov.br', url: CP.http.montarURL(s.endpoints.dadosAbertos, '/modulo-material/1_consultarGrupoMaterial', { codigoGrupo: 75, pagina: 1 }) },
      { nome: 'Portal da Transparência (NF-e)', url: CP.http.montarURL(s.endpoints.transparencia, '/api-de-dados/notas-fiscais', { nomeProduto: 'papel', pagina: 1 }), chave: true },
      { nome: 'Banco Central (IPCA)', url: CP.http.montarURL(s.endpoints.bcb, '/dados/serie/bcdata.sgs.433/dados/ultimos/1', { formato: 'json' }) },
    ];
    const res = casos.map((c) => ({ nome: c.nome, st: 'rodando', msg: 'Testando…' }));
    const desenhar = () => { out.innerHTML = `<ul class="status-lista">${res.map((r) => `<li><span class="st ${r.st}">${r.st === 'ok' ? 'Conectado' : r.st === 'erro' ? 'Falhou' : r.st === 'aviso' ? 'Pendente' : 'Testando'}</span><span>${esc(r.nome)}</span><span class="det">${esc(r.msg)}</span></li>`).join('')}</ul>`; };
    desenhar();
    await Promise.all(casos.map(async (c, i) => {
      if (c.chave && !s.chaveTransparencia) { res[i] = { nome: c.nome, st: 'aviso', msg: 'Informe a chave na aba Notas fiscais.' }; desenhar(); return; }
      try {
        const r = await CP.http.pedir(c.url, { headers: c.chave ? { Accept: 'application/json', 'chave-api-dados': s.chaveTransparencia } : undefined });
        res[i] = { nome: c.nome, st: 'ok', msg: r.viaProxy ? 'Pelo proxy' : 'Diretamente' };
      } catch (e) { res[i] = { nome: c.nome, st: 'erro', msg: CP.http.explicar(e) }; }
      desenhar();
    }));
    return res;
  }
  async function restaurar(file) {
    try {
      const obj = JSON.parse(await U.lerTexto(file));
      if (!obj || obj.formato !== 'consultor-precos-backup') throw new Error('O arquivo não é uma cópia de segurança do Consultor de Preços.');
      if (!(await CP.ui.confirmar('Restaurar a cópia? Projeto, configurações e base de NF-e atuais serão substituídos.', { rotulo: 'Restaurar', perigo: true }))) return;
      CP.state.settings = CP.mesclar(CP.defaults.settings(), obj.settings || {});
      CP.state.projeto = CP.mesclar(CP.defaults.projeto(), obj.projeto || {});
      CP.state.nfe = Array.isArray(obj.nfe) ? obj.nfe : [];
      CP.state.ui.itemSel = (CP.state.projeto.itens[0] || {}).id || null;
      CP.salvar.settings(); CP.salvar.projetoJa(); CP.salvar.nfe();
      CP.bus.emit('projeto'); CP.bus.emit('nfe');
      render();
      CP.ui.toast('Cópia restaurada.', 'ok');
    } catch (e) { CP.ui.toast(e.message || String(e), 'erro', 8000); }
  }
  function ligar() {
    const r = raiz();
    CP.ui.on(r, 'click', '[data-acao]', async (e, t) => {
      const a = t.dataset.acao;
      if (a === 'testar') testar();
      else if (a === 'baixar-worker') U.download('worker.js', WORKER, 'text/javascript;charset=utf-8');
      else if (a === 'copiar-worker') { try { await navigator.clipboard.writeText(WORKER); CP.ui.toast('Código copiado.', 'ok'); } catch (er) { CP.ui.toast('Não foi possível copiar; use “Baixar worker.js”.', 'erro'); } }
      else if (a === 'backup') U.download(`consultor-precos-copia-${U.todayISO()}.json`, JSON.stringify({ formato: 'consultor-precos-backup', versao: 1, exportadoEm: U.nowISO(), settings: S(), projeto: CP.state.projeto, nfe: CP.state.nfe }), 'application/json');
      else if (a === 'limpar-catalogo') { CP.state.catalogo = { pdm: [], serv: [], baixadoEm: null }; CP.salvar.catalogo(); CP.api.catalogo.resetIndice(); render(); CP.ui.toast('Índice do catálogo apagado.', 'ok'); }
      else if (a === 'limpar-ipca') { CP.state.ipca = { serie: {}, atualizadoEm: null }; CP.salvar.ipca(); CP.ui.toast('Série do IPCA apagada.', 'ok'); }
      else if (a === 'padroes') {
        if (!(await CP.ui.confirmar('Restaurar as configurações padrão? A chave do Portal da Transparência e a API própria serão mantidas.', { rotulo: 'Restaurar' }))) return;
        const { chaveTransparencia, apiPropria, tema } = S();
        CP.state.settings = { ...CP.defaults.settings(), chaveTransparencia, apiPropria, tema };
        CP.salvar.settings(); render(); CP.ui.toast('Configurações restauradas.', 'ok');
      }
    });
    r.addEventListener('change', (e) => {
      const t = e.target;
      if (t.id === 'cf-restaurar' && t.files[0]) { restaurar(t.files[0]); t.value = ''; return; }
      const path = t.dataset.cfg;
      if (!path) return;
      const tp = t.dataset.t;
      let v;
      if (tp === 'bool') v = t.checked;
      else if (tp === 'num' || tp === 'pct') {
        v = U.parseNum(t.value);
        if (!U.isNum(v) || v < 0) { CP.ui.toast('Informe um número válido.', 'erro'); t.value = tp === 'pct' ? obter(path) * 100 : obter(path); return; }
        if (tp === 'pct') v /= 100;
        if (path === 'tamanhoPagina') v = Math.min(500, Math.max(10, Math.round(v)));
        if (path === 'concorrencia') v = Math.min(4, Math.max(1, Math.round(v)));
      } else v = t.value.trim();
      definir(path, v);
    });
  }
  return { iniciar: ligar, mostrar: render, testar, WORKER };
})();

    { id: 'inicio', titulo: 'Para que serve', html: () => `
      <p>O Consultor de Preços reúne, numa só tela, preços praticados pela Administração em fontes oficiais e organiza a análise crítica exigida para estimar o valor de uma contratação de bens e serviços em geral.</p>

    { id: 'fluxo', titulo: 'Fluxo de trabalho', html: () => `
      <ol>

        <li><b>Dados do processo.</b> Informe objeto, processo e, sobretudo, a data de referência (data prevista de divulgação do edital). Os prazos de cada fonte contam a partir dela.</li>
        <li><b>Pesquisa.</b> No modo Assistida, descreva o item e clique em “Montar a cesta automaticamente”; com muitos itens, use “Lista de itens”. No modo Manual, você localiza o código e escolhe os preços um a um.</li>
        <li><b>Seleção.</b> Os preços enviados automaticamente vêm do mesmo código do catálogo ou de descrição semelhante, com unidade conversível. Confira-os na cesta.</li>
        <li><b>Análise crítica.</b> Na cesta, confira os pontos de atenção, ajuste o critério de saneamento, o método, a escala e a independência com apoio do painel de sensibilidade, revise as exclusões e adote ou edite o rascunho da justificativa.</li>
        <li><b>Relatório.</b> Confira o painel de verificação, imprima ou salve em PDF e exporte a planilha para os autos.</li>
      </ol>` },
    { id: 'assistida', titulo: 'Pesquisa assistida e lista de itens', html: () => `
      <p>No modo <b>Assistida</b>, você descreve o item e o sistema executa quatro etapas, mostrando cada uma: encontra o código no catálogo, pesquisa nas fontes, seleciona os preços comparáveis e cria o item na cesta com o valor estimado.</p>
      <h3>Como o código é escolhido</h3>
      <p>O sistema procura no índice do catálogo os produtos (PDM) cujo nome aparece na descrição e compara a descrição com cada item desses produtos, conferindo números com unidade (305 m, 24 AWG, 75 g/m²), códigos técnicos (categoria 6, A4, RJ45) e cores. Quando vários itens empatam e nada os diferencia, pesquisa o produto inteiro. Se não houver código claramente correspondente, para e pede a sua escolha.</p>
      <h3>Como os preços são selecionados</h3>
      <p>Vão para a cesta os preços do mesmo código escolhido ou de descrição semelhante (acima do mínimo configurado, 50% por padrão), sem atributos divergentes e com unidade conversível para a do item. Preços sem unidade informada pela API, como os de algumas atas, ficam de fora da seleção automática e podem ser incluídos no modo Manual.</p>
      <h3>Lista de itens</h3>
      <p>Cole as linhas da planilha do termo de referência ou escolha o arquivo .xlsx ou .csv. O sistema reconhece as colunas, encontra os códigos de todos os itens e pesquisa um por um, mostrando a situação de cada linha. Você pode pausar, trocar o código de uma linha e pesquisar de novo. Códigos informados na planilha são usados como estão.</p>
      <p>Tudo o que o sistema escolhe sozinho é sugestão: revise cada item na cesta antes de emitir o relatório.</p>` },
    { id: 'unidades', titulo: 'Unidades e conversões', html: () => `
      <p>Preços só se comparam na mesma unidade. O sistema entende rótulos como “CX 50 UN”, “Caixa 50,00 un”, “RO 2,5 M” e “PCT 500 G” e converte o preço para a unidade-base: por unidade, por metro, por quilo ou por litro.</p>
      <p>Na Pesquisa, a opção “Preço por unidade-base” agrupa e compara os preços já convertidos. Na cesta, uma amostra em “CX 50 UN” num item cotado em “UN” é dividida por 50; o fator aparece na amostra e no relatório. Unidades sem relação conhecida (por exemplo, “CX” sem a quantidade) não são convertidas e ficam fora da análise.</p>` },
    { id: 'fontes', titulo: 'Fontes de dados', html: () => `
      <table><thead><tr><th>Fonte</th><th>Origem dos dados</th><th>Inciso</th><th>Observações</th></tr></thead><tbody>
        <tr><td>Painel de Preços</td><td><code>/modulo-pesquisa-preco/1_consultarMaterial</code> e <code>3_consultarServico</code></td><td>I</td><td>Compras homologadas no Compras.gov.br. Filtra por período da compra e UF.</td></tr>
        <tr><td>Contratações no PNCP</td><td><code>/modulo-contratacoes/2_consultarItensContratacoes_PNCP_14133</code></td><td>II</td><td>Valor homologado por item da Lei 14.133. Órgão, UF e modalidade são completados pela rota <code>1.1_consultarContratacoes_PNCP_14133_Id</code>.</td></tr>

        <tr><td>NF-e do Portal da Transparência</td><td><code>/api-de-dados/notas-fiscais</code> e <code>notas-fiscais-por-chave</code></td><td>V</td><td>Notas destinadas ao Poder Executivo Federal. Opcional: só é consultada quando há chave gratuita cadastrada.</td></tr>
        <tr><td>NF-e importadas</td><td>Arquivos XML ou ZIP</td><td>V</td><td>Lidos no navegador; preço líquido de desconto.</td></tr>
        <tr><td>Registro manual e planilhas</td><td>Cotações, sítios, tabelas e outros portais</td><td>III ou IV</td><td>Informe data, fonte e, para sítios, data e hora de acesso.</td></tr>
      </tbody></table>
      <p>Os endereços-base das APIs ficam em Configurações e podem ser alterados se o governo mudar os domínios.</p>` },
    { id: 'catalogo', titulo: 'Catálogo CATMAT e CATSER', html: () => `
      <p>Os preços do Painel, das contratações e das atas são consultados pelo código do catálogo, e não por texto. Por isso a pesquisa começa no catálogo.</p>
      <h3>Item ou PDM</h3>
      <p>No CATMAT, cada <b>item</b> é uma especificação completa (por exemplo, caneta esferográfica azul com corpo de plástico). O <b>PDM</b> (Padrão Descritivo de Material) agrupa todos os itens do mesmo produto. Pesquisar o PDM inteiro traz mais preços, mas mistura variações: filtre pela unidade e leia as descrições antes de enviar à cesta.</p>
      <h3>Índice local</h3>
      <p>A busca textual da API de catálogo deixou de filtrar e passou a devolver o catálogo inteiro. O sistema contorna isso baixando, uma única vez, um índice com os PDMs e os serviços e buscando nele localmente. Códigos numéricos funcionam mesmo sem índice.</p>` },
    { id: 'analise', titulo: 'Análise crítica', lab: 'criterios', html: () => `
      <p>Cada amostra passa por três peneiras. A primeira é qualitativa: preços fora do prazo do inciso, em unidade não conversível, com medidas, categoria ou formato diferentes da descrição do item, fora da escala de quantidade escolhida ou repetidos da mesma compra são desconsiderados (o comportamento pode ser mudado em Configurações). A segunda, opcional, garante a independência: no máximo uma amostra por compra ou por fornecedor. A terceira é estatística, aplicada às amostras restantes quando há pelo menos três:</p>
      <ul>
        <li><b>Intervalo interquartil (Tukey):</b> desconsidera valores abaixo de Q1 − k×AIQ ou acima de Q3 + k×AIQ, com AIQ = Q3 − Q1 e k = 1,5 por padrão. É pouco sensível aos próprios valores extremos.</li>
        <li><b>Média ± k desvios-padrão:</b> desconsidera valores fora de μ ± kσ. Valores muito discrepantes inflam σ e podem esconder outros extremos.</li>
        <li><b>Faixa sobre a mediana:</b> desconsidera valores abaixo de um percentual mínimo ou acima de um máximo da mediana (50% e 150% por padrão).</li>
      </ul>
      <p>O analista pode manter uma amostra sinalizada ou desconsiderar uma válida. Ao fazê-lo, escolhe o motivo numa lista padronizada (preço inexequível, excessivamente elevado, objeto não equivalente, condições comerciais distintas, documento incompleto, entre outros) e pode acrescentar um detalhe. O sistema sugere o motivo mais provável a partir das sinalizações da amostra. Os motivos alimentam a justificativa, que agrupa as exclusões por categoria. A IN 65/2021 exige critérios fundamentados e descritos no processo para desconsiderar preços inexequíveis, inconsistentes ou excessivamente elevados (art. 6º, §3º).</p>` },
    { id: 'comparabilidade', titulo: 'Equivalência, escala e independência', html: () => `
      <h3>Equivalência da descrição</h3>
      <p>A descrição de cada amostra é comparada com a do item. A coluna “Semelh.” da cesta mostra quanto dos termos do item aparece na amostra; passe o mouse para ver o que confere e o que diverge. Medidas com unidade (305 m, 0,7 mm, 75 g/m², 9.000 BTU), categorias e formatos (categoria 6, A4) diferentes indicam objeto não equivalente e, por padrão, levam à exclusão automática, com o motivo à vista. Cor diferente e descrição pouco semelhante geram apenas aviso, porque nem sempre alteram o preço.</p>
      <h3>Escala de quantidade</h3>
      <p>O art. 23 da Lei 14.133/2021 manda considerar as quantidades a contratar e a economia de escala. Na cesta, cada amostra mostra a razão entre a quantidade adquirida (convertida para a unidade do item) e a quantidade estimada: 0,05× é uma compra vinte vezes menor; 4× é quatro vezes maior. Em “Escala de quantidade” você pode considerar só as aquisições entre dois limites (0,1× e 10× por padrão). A “média ponderada pela quantidade” dá mais peso às aquisições maiores; é método alternativo, que exige justificativa e aprovação da autoridade competente (art. 6º, §1º, da IN 65/2021).</p>
      <h3>Independência das amostras</h3>
      <p>Várias amostras do mesmo fornecedor, do mesmo órgão comprador ou da mesma compra não são observações independentes do mercado. O sistema aponta essas concentrações e permite limitar a cesta a uma amostra por compra ou por fornecedor; nesse caso, fica a de valor mais próximo da mediana do grupo. Registros da mesma compra, item e fornecedor vindos de fontes diferentes (por exemplo, Painel de Preços e PNCP) são contados uma única vez.</p>` },
    { id: 'metodo', titulo: 'Método e valor estimado', html: () => `
      <p>A estimativa usa a média, a mediana ou o menor valor das amostras válidas, desde que haja ao menos três preços. Com menos de três, o sistema alerta: a estimativa é excepcional e precisa de justificativa e aprovação da autoridade competente.</p>
      <p>No modo automático, o sistema usa a média quando o coeficiente de variação (CV = desvio-padrão ÷ média) não passa da referência configurada (25% por padrão) e a mediana quando passa. O valor de 25% é uma referência prática de homogeneidade, não um número fixado em lei; ajuste-o se o seu órgão adotar outro.</p>
      <p>Também é possível aplicar um percentual sobre o valor obtido, para cima ou para baixo, com justificativa (art. 6º, §2º, da IN 65/2021). Outros métodos, como a média ponderada pela quantidade, exigem justificativa e aprovação da autoridade competente (art. 6º, §1º).</p>
      <h3>Painel de sensibilidade</h3>
      <p>Abaixo da análise de cada item, uma tabela mostra o valor estimado em cada combinação de critério de saneamento e método. Se os valores ficam próximos, a escolha é praticamente indiferente, o que fortalece a justificativa; se um deles destoa, você vê antes de decidir. Clique num valor para adotar a combinação correspondente. A amplitude entre o menor e o maior valor entra no rascunho da justificativa.</p>
      <h3>Rascunho da justificativa</h3>
      <p>Cada item novo recebe um rascunho de justificativa escrito a partir da análise: fontes, exclusões agrupadas por motivo, critério, escala, independência, dispersão, método e sensibilidade. O rascunho acompanha as mudanças da cesta até você editá-lo ou clicar em “Adotar este texto”.</p>
      <p>Quando há amostras do Painel de Preços, o sistema compara o valor estimado com a mediana delas e alerta se ele a superar, porque o art. 23, §1º, I, da Lei 14.133/2021 trata de composições menores ou iguais à mediana do item no painel.</p>` },
    { id: 'ipca', titulo: 'Atualização monetária', html: () => `
      <p>O art. 23, §1º, II, da Lei 14.133/2021 manda observar o índice de atualização de preços correspondente. O botão “Atualizar pelo IPCA” busca a série 433 do Banco Central (IPCA mensal do IBGE) e calcula, para cada amostra, o produto das variações dos meses seguintes ao da data da amostra até o mês de referência, parando no último mês já publicado.</p>
      <p>Se a série não puder ser obtida, ou se outro índice for mais adequado ao objeto, digite o fator na coluna “Fator” da amostra.</p>` },
    { id: 'nfe', titulo: 'Notas fiscais eletrônicas', lab: 'chave', html: () => `
      <p>A SEFAZ só entrega notas a quem tem certificado digital ICP-Brasil e conexão autenticada, o que uma página no navegador não faz. Por isso o sistema oferece três caminhos:</p>
      <ul>
        <li><b>Portal da Transparência:</b> API pública com as notas destinadas ao Poder Executivo Federal, com busca por nome de produto, CNPJ do emitente ou órgão e detalhamento por chave. A chave de acesso é gratuita e opcional: sem ela, essa fonte apenas não é consultada.</li>
        <li><b>Arquivos XML ou ZIP:</b> notas de NF-e (modelo 55) ou NFC-e (modelo 65). O preço considerado é o líquido: valor dos produtos menos o desconto, dividido pela quantidade comercial.</li>
        <li><b>API própria:</b> se o seu órgão mantém um serviço que devolve o XML pela chave, ele pode ser ligado na aba Notas fiscais.</li>
      </ul>
      <h3>Chave de acesso</h3>
      <p>A chave tem 44 posições: UF (2), ano e mês de emissão (4), CNPJ do emitente (14), modelo (2), série (3), número (9), tipo de emissão (1), código numérico (8) e dígito verificador (1), calculado por módulo 11 com pesos de 2 a 9 da direita para a esquerda. Com o CNPJ alfanumérico, cada letra vale o seu código ASCII menos 48.</p>` },
    { id: 'relatorio', titulo: 'Relatório e rastreabilidade', html: () => `

    { id: 'conexao', titulo: 'Serviço local, CORS e proxy', html: () => `
      <p>Navegadores só deixam uma página ler a resposta de outro site quando esse site autoriza (regra chamada CORS). As APIs do governo não autorizam páginas abertas como arquivo do computador. E nenhuma página consegue executar programas no computador por conta própria, por segurança; por isso o serviço local precisa ser instalado, uma única vez.</p>

  function visiveis() {
    const q = U.tokens(busca);
    if (!q.length) return SECOES;
    return SECOES.filter((s) => U.matchScore('', q, textoSecao(s).split(' ')) === 1);
  }

  function labCriterios() {
    return `<div class="lab"><h3>Laboratório: critérios de saneamento</h3>
      <p class="small">Digite preços separados por ponto e vírgula ou por linha. O cálculo usa o mesmo motor da cesta.</p>
      <label class="f"><span>Preços</span><textarea id="lab-vals" rows="3">10,50; 11,20; 9,80; 12,00; 10,90; 11,40; 25,00; 4,10</textarea></label>
      <div class="grade" style="margin-top:8px"><label class="f"><span>Critério</span><select id="lab-crit">${Object.entries(CP.stats.CRITERIOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
      <label class="f"><span>Método</span><select id="lab-met">${Object.entries(CP.stats.METODOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label></div>
      <div id="lab-res" style="margin-top:8px"></div></div>`;
  }
  function calcularLab() {
    const el = document.getElementById('lab-res');
    if (!el) return;
    const vals = document.getElementById('lab-vals').value.split(/[;\n]+/).map(U.parseNum).filter((v) => v > 0);
    const s = CP.state.settings;
    const item = { unidade: '', quantidade: 1, criterio: { ...s.criterio, tipo: document.getElementById('lab-crit').value }, metodo: document.getElementById('lab-met').value, ajustePct: 0, amostras: vals.map((v, i) => ({ id: 'l' + i, parametro: 'II', preco: v, unidade: '', fator: 1, manual: null })) };
    const an = CP.stats.analisarItem(item, { ...s, janelas: {} }, null);
    const exc = an.linhas.filter((l) => l.excluida).map((l) => U.fmtPrice(l.valor));
    el.innerHTML = `<div class="stats">${[['Válidas', `${an.nValidas} de ${an.n}`], ['Mediana', U.fmtPrice(an.resumo.mediana)], ['Média', U.fmtPrice(an.resumo.media)], ['CV', U.fmtPct(an.resumo.cv)], ['Estimado', U.fmtPrice(an.estimativa.unitario)]].map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>
      ${CP.graficos.regua(an.linhas.map((l) => ({ v: l.valor, x: l.excluida })), { limites: an.limites, mediana: an.resumo.mediana, estimado: an.estimativa.unitario, largura: CP.graficos.largura(el) })}
      <p class="small">${exc.length ? `Desconsiderados: ${exc.join(', ')}.` : 'Nenhum valor desconsiderado.'} ${an.limites.aplicado ? `Faixa aceita: ${U.fmtPrice(Math.max(0, an.limites.lo))} a ${U.fmtPrice(an.limites.hi)}.` : 'Critério não aplicado (menos de três valores ou sem critério).'}</p>`;
  }
  function labChave() {
    return `<div class="lab"><h3>Laboratório: chave de acesso</h3>
      <label class="f"><span>Chave de 44 caracteres</span><input id="lab-chave" autocomplete="off" placeholder="Cole uma chave para decompor e conferir o dígito"></label>
      <div id="lab-chave-res"></div></div>`;
  }

  function render() {
    const vis = visiveis();
    if (!vis.some((s) => s.id === atual) && vis.length) atual = vis[0].id;
    const s = SECOES.find((x) => x.id === atual) || SECOES[0];
    const l = lidos(), i = SECOES.indexOf(s);
    raiz().innerHTML = `<div class="tab-head"><div><h2>Manual</h2><p>Como pesquisar, analisar e documentar preços de referência com o sistema.</p></div></div>
      <div class="manual">
        <nav aria-label="Seções do manual">
          <label class="f"><span>Buscar no manual</span><input id="man-busca" value="${esc(busca)}" placeholder="ex.: proxy, mediana, chave"></label>
          <p class="small muted" style="margin:10px 0 4px">${l.size} de ${SECOES.length} seções lidas</p>
          <div class="barra"><i style="width:${Math.round((l.size / SECOES.length) * 100)}%"></i></div>
          <ul>${vis.map((x) => `<li><a href="#manual" data-sec="${x.id}" aria-current="${x.id === s.id}">${esc(x.titulo)}${l.has(x.id) ? '<span class="lido">lida</span>' : ''}</a></li>`).join('') || '<li class="small muted" style="padding:8px 0">Nenhuma seção encontrada.</li>'}</ul>
        </nav>
        <article id="man-art">
          <h2>${esc(s.titulo)}</h2>${s.html()}
          ${s.lab === 'criterios' ? labCriterios() : s.lab === 'chave' ? labChave() : ''}
          <p style="margin-top:18px"><label class="check"><input type="checkbox" id="man-lido" ${l.has(s.id) ? 'checked' : ''}> Marcar seção como lida</label></p>
          <div class="linha" style="margin-top:12px">${i > 0 ? `<button type="button" class="btn pq" data-ir="${SECOES[i - 1].id}">← ${esc(SECOES[i - 1].titulo)}</button>` : ''}${i < SECOES.length - 1 ? `<button type="button" class="btn pq" data-ir="${SECOES[i + 1].id}">${esc(SECOES[i + 1].titulo)} →</button>` : ''}</div>
        </article>
      </div>`;
    if (s.lab === 'criterios') calcularLab();
  }
  const refazerBusca = U.debounce(() => { render(); const n = document.getElementById('man-busca'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 200);
  function ligar() {
    const r = raiz();
    CP.ui.on(r, 'click', '[data-sec],[data-ir]', (e, t) => { e.preventDefault(); atual = t.dataset.sec || t.dataset.ir; render(); const a = document.getElementById('man-art'); if (a && a.scrollIntoView) a.scrollIntoView({ block: 'start' }); });
    r.addEventListener('input', (e) => {

    });
    r.addEventListener('change', (e) => {
      const t = e.target;

    });
  }
  return { iniciar: ligar, mostrar: render, redimensionar: () => { if (document.getElementById('lab-res')) calcularLab(); }, SECOES };
})();

$HTML_INFORMADO = '%%CAMINHO_HTML%%'
$AUTOINICIO = '%%AUTOINICIO%%'
$ICONE = '%%ICONE%%'
$VERSAO_SERVICO = '1.2'
$PERMITIDOS = @('dadosabertos.compras.gov.br', 'api.portaldatransparencia.gov.br', 'api.bcb.gov.br', 'pncp.gov.br')
$PORTA_INICIAL = 8787
$CRLF = [string][char]13 + [string][char]10
$EH_WINDOWS = ($env:OS -eq 'Windows_NT')
$DESTINO = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'ConsultorPrecos'
if ($env:CONSULTOR_DESTINO) { $DESTINO = $env:CONSULTOR_DESTINO }
$SERVIDOR = Join-Path $DESTINO 'servidor.ps1'
$ARQ_ICONE = Join-Path $DESTINO 'consultor.ico'
$EXE = (Get-Process -Id $PID).Path
$modo = 'portatil'
if ($args -contains '-Oculto') { $modo = 'oculto' }
elseif ($args -contains '-Abrir') { $modo = 'abrir' }
elseif ($env:CONSULTOR_ACAO -eq 'instalar') { $modo = 'instalar' }
elseif ($env:CONSULTOR_ACAO -eq 'desinstalar') { $modo = 'desinstalar' }
$interativo = ($modo -eq 'portatil' -or $modo -eq 'instalar' -or $modo -eq 'desinstalar')
try { if ($interativo) { $Host.UI.RawUI.WindowTitle = 'Consultor de Precos Governamentais' } } catch { }
try { [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]'Tls13' } catch { try { [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 } catch { } }
try { [Net.WebRequest]::DefaultWebProxy.Credentials = [Net.CredentialCache]::DefaultNetworkCredentials } catch { }
Add-Type -AssemblyName System.Net.Http

function Registrar([string]$msg) {
  if ($interativo) { Write-Host ('  ' + $msg); return }
  try {
    $arq = Join-Path $DESTINO 'servidor.log'
    if ((Test-Path -LiteralPath $arq) -and ((Get-Item -LiteralPath $arq).Length -gt 1048576)) { Remove-Item -LiteralPath $arq -Force }
    Add-Content -LiteralPath $arq -Value ((Get-Date -Format 'yyyy-MM-dd HH:mm:ss') + '  ' + $msg)
  } catch { }
}
function Sair([string]$msg, [int]$codigo) {
  Registrar $msg
  if ($interativo) { Write-Host ''; try { [void](Read-Host '  Pressione Enter para fechar') } catch { } }
  exit $codigo
}
function Sondar([int]$p) {
  $c = [Net.Sockets.TcpClient]::new()
  try {
    $ar = $c.BeginConnect('127.0.0.1', $p, $null, $null)
    if (-not $ar.AsyncWaitHandle.WaitOne(600)) { return $false }
    $c.EndConnect($ar)
    $s = $c.GetStream()
    $s.ReadTimeout = 2000
    $pedido = [Text.Encoding]::ASCII.GetBytes('GET /__consultor__/status HTTP/1.1' + $CRLF + 'Host: 127.0.0.1' + $CRLF + 'Connection: close' + $CRLF + $CRLF)
    $s.Write($pedido, 0, $pedido.Length)
    $buf = New-Object byte[] 4096
    $txt = ''
    for ($i = 0; $i -lt 20; $i++) {
      $n = $s.Read($buf, 0, $buf.Length)
      if ($n -le 0) { break }
      $txt += [Text.Encoding]::ASCII.GetString($buf, 0, $n)
      if ($txt -like '*"consultor":true*') { break }
    }
    return ($txt -like '*"consultor":true*')
  } catch { return $false } finally { $c.Close() }
}
function Localizar-Html {
  if ($modo -eq 'oculto' -or $modo -eq 'abrir') {
    $instalado = Join-Path $DESTINO 'consultor-precos.html'
    if (Test-Path -LiteralPath $instalado -PathType Leaf) { return $instalado }
  }
  if ($HTML_INFORMADO -and ($HTML_INFORMADO -notlike '*CAMINHO_HTML*') -and (Test-Path -LiteralPath $HTML_INFORMADO -PathType Leaf)) { return $HTML_INFORMADO }
  $pastas = @()
  if ($env:CONSULTOR_BAT) { $pastas += (Split-Path -Parent $env:CONSULTOR_BAT) }
  if ($PSCommandPath) { $pastas += (Split-Path -Parent $PSCommandPath) }
  $pastas += (Get-Location).Path
  foreach ($p in $pastas) {
    $achado = Get-ChildItem -LiteralPath $p -Filter 'consultor-precos*.html' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
    if ($achado) { return $achado.FullName }
  }
  return $null
}
function Parar-Servidores {
  if (-not $EH_WINDOWS) { return }
  try {
    foreach ($pr in (Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe' OR Name = 'pwsh.exe'")) {
      if ($pr.ProcessId -eq $PID -or -not $pr.CommandLine) { continue }
      if ($pr.CommandLine -like '*ConsultorPrecos*servidor.ps1*' -or $pr.CommandLine -like '*CONSULTOR_BAT*') { try { Stop-Process -Id $pr.ProcessId -Force } catch { } }
    }
    Start-Sleep -Milliseconds 700
  } catch { }
}
function Criar-Atalho([string]$arquivo, [string]$argumentos, [string]$descricao) {
  $ws = New-Object -ComObject WScript.Shell
  $s = $ws.CreateShortcut($arquivo)
  $s.TargetPath = $EXE
  $s.Arguments = $argumentos
  $s.WorkingDirectory = $DESTINO
  $s.WindowStyle = 7
  $s.Description = $descricao
  if (Test-Path -LiteralPath $ARQ_ICONE) { $s.IconLocation = $ARQ_ICONE + ',0' }
  $s.Save()
}
function Registrar-Protocolo([string]$argumentos) {
  $raiz = 'HKCU:\Software\Classes\consultor-precos'
  New-Item -Path $raiz -Force | Out-Null
  Set-Item -Path $raiz -Value 'URL:Consultor de Precos'
  New-ItemProperty -Path $raiz -Name 'URL Protocol' -Value '' -PropertyType String -Force | Out-Null
  New-Item -Path ($raiz + '\shell\open\command') -Force | Out-Null
  Set-Item -Path ($raiz + '\shell\open\command') -Value ('"' + $EXE + '" ' + $argumentos)
}
function Esperar-Servico {
  for ($i = 0; $i -lt 40; $i++) {
    for ($p = $PORTA_INICIAL; $p -lt ($PORTA_INICIAL + 10); $p++) { if (Sondar $p) { return $p } }
    Start-Sleep -Milliseconds 500
  }
  return 0
}
function Instalar {
  Write-Host ''
  Write-Host '  Consultor de Precos Governamentais: instalacao do servico local'
  Write-Host ''
  $origem = Localizar-Html
  if (-not $origem) { Sair 'Nao encontrei o arquivo consultor-precos.html. Coloque o instalador na mesma pasta dele e tente de novo.' 1 }
  Parar-Servidores
  New-Item -ItemType Directory -Force -Path $DESTINO | Out-Null
  $alvoHtml = Join-Path $DESTINO 'consultor-precos.html'
  if ([IO.Path]::GetFullPath($origem) -ne [IO.Path]::GetFullPath($alvoHtml)) { Copy-Item -LiteralPath $origem -Destination $alvoHtml -Force }
  $texto = [IO.File]::ReadAllText($env:CONSULTOR_BAT, [Text.Encoding]::UTF8)
  [IO.File]::WriteAllText($SERVIDOR, $texto, [Text.UTF8Encoding]::new($true))
  if ($ICONE -and ($ICONE -notlike '*ICONE*')) { try { [IO.File]::WriteAllBytes($ARQ_ICONE, [Convert]::FromBase64String($ICONE)) } catch { } }
  Write-Host ('  Sistema copiado para ' + $DESTINO)
  $argOculto = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "' + $SERVIDOR + '" -Oculto'
  $argAbrir = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "' + $SERVIDOR + '" -Abrir'
  if ($EH_WINDOWS) {
    try { Criar-Atalho (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Consultor de Precos.lnk') $argAbrir 'Abrir o Consultor de Precos Governamentais'; Write-Host '  Atalho "Consultor de Precos" criado na area de trabalho.' } catch { Write-Host ('  Aviso: nao foi possivel criar o atalho: ' + $_.Exception.Message) }
    $inicio = Join-Path ([Environment]::GetFolderPath('Startup')) 'Consultor de Precos.lnk'
    if ($AUTOINICIO -eq 'nao') { Remove-Item -LiteralPath $inicio -Force -ErrorAction SilentlyContinue; Write-Host '  Inicio automatico desligado: use o atalho para abrir.' }
    else { try { Criar-Atalho $inicio $argOculto 'Servico local do Consultor de Precos'; Write-Host '  O servico vai iniciar sozinho com o Windows, sem janela.' } catch { Write-Host ('  Aviso: nao foi possivel ligar o inicio automatico: ' + $_.Exception.Message) } }
    try { Registrar-Protocolo $argOculto } catch { }
    Start-Process -FilePath $EXE -ArgumentList $argOculto -WindowStyle Hidden
  } else {
    Start-Process -FilePath $EXE -ArgumentList ('-NoProfile -File "' + $SERVIDOR + '" -Oculto')
  }
  $porta = Esperar-Servico
  if (-not $porta) { Sair 'O servico foi instalado, mas nao respondeu. Use o atalho Consultor de Precos na area de trabalho.' 1 }
  $endereco = 'http://127.0.0.1:' + $porta + '/'
  Write-Host ''
  Write-Host ('  Pronto. O sistema esta funcionando em ' + $endereco)
  Write-Host '  Nas proximas vezes, use o atalho da area de trabalho ou abra o arquivo .html.'
  try { Start-Process $endereco } catch { }
  Write-Host '  Esta janela vai fechar sozinha.'
  Start-Sleep -Seconds 5
  exit 0
}
function Desinstalar {
  Write-Host ''
  Write-Host '  Consultor de Precos Governamentais: remocao do servico local'
  Parar-Servidores
  if ($EH_WINDOWS) {
    foreach ($pasta in @([Environment]::GetFolderPath('Startup'), [Environment]::GetFolderPath('Desktop'))) { Remove-Item -LiteralPath (Join-Path $pasta 'Consultor de Precos.lnk') -Force -ErrorAction SilentlyContinue }
    Remove-Item -Path 'HKCU:\Software\Classes\consultor-precos' -Recurse -Force -ErrorAction SilentlyContinue
  }
  Remove-Item -LiteralPath $DESTINO -Recurse -Force -ErrorAction SilentlyContinue
  Write-Host '  Servico removido. Os projetos salvos no navegador continuam guardados nele.'
  Write-Host ''
  try { [void](Read-Host '  Pressione Enter para fechar') } catch { }
  exit 0
}

if ($modo -eq 'instalar') { Instalar }
if ($modo -eq 'desinstalar') { Desinstalar }
$html = Localizar-Html
if (-not $html) { Sair 'Nao encontrei o arquivo consultor-precos.html. Coloque este arquivo na mesma pasta dele e tente de novo.' 1 }
$instalado = $html.StartsWith($DESTINO, [StringComparison]::OrdinalIgnoreCase)
$abrirNavegador = ($modo -ne 'oculto')
$ouvinte = $null
$porta = 0
for ($p = $PORTA_INICIAL; $p -lt ($PORTA_INICIAL + 10); $p++) {
  try {
    $tentativa = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, $p)
    $tentativa.Start()
    $ouvinte = $tentativa
    $porta = $p
    break
  } catch {
    if (Sondar $p) {
      if ($abrirNavegador) { try { Start-Process ('http://127.0.0.1:' + $p + '/') } catch { } }
      Registrar ('O Consultor de Precos ja estava aberto em http://127.0.0.1:' + $p + '/')
      if ($interativo) { Start-Sleep -Seconds 2 }
      exit 0
    }
  }
}
if (-not $ouvinte) { Sair 'Nao consegui abrir uma porta local entre 8787 e 8796. Feche outros programas e tente de novo.' 1 }

$manipulador = [Net.Http.HttpClientHandler]::new()
$manipulador.AutomaticDecompression = [Net.DecompressionMethods]::GZip -bor [Net.DecompressionMethods]::Deflate
$cliente = [Net.Http.HttpClient]::new($manipulador)
$cliente.Timeout = [TimeSpan]::FromSeconds(150)
$utf8 = [Text.UTF8Encoding]::new($false)
$conexoes = [Collections.ArrayList]::new()
$buffer = New-Object byte[] 65536
$CORS = 'Access-Control-Allow-Origin: *' + $CRLF + 'Access-Control-Allow-Methods: GET, OPTIONS' + $CRLF + 'Access-Control-Allow-Headers: *' + $CRLF + 'Access-Control-Allow-Private-Network: true' + $CRLF + 'Access-Control-Max-Age: 600' + $CRLF
$estadoVersao = @{ data = [DateTime]::MinValue; versao = '' }

function Versao-Sistema {
  try {
    $d = [IO.File]::GetLastWriteTimeUtc($html)
    if ($d -ne $estadoVersao.data) {
      $t = [IO.File]::ReadAllText($html, [Text.Encoding]::UTF8)
      $m = [regex]::Match($t, "CP\.VERSION = '([0-9.]+)'")
      $estadoVersao.versao = ''
      if ($m.Success) { $estadoVersao.versao = $m.Groups[1].Value }
      $estadoVersao.data = $d
    }
  } catch { }
  return $estadoVersao.versao
}
function Enviar($x, [int]$status, [string]$tipo, [byte[]]$corpo, [string]$extra) {
  if ($null -eq $corpo) { $corpo = [byte[]]@() }
  $motivo = 'OK'
  if ($status -eq 204) { $motivo = 'No Content' } elseif ($status -eq 403) { $motivo = 'Forbidden' } elseif ($status -eq 404) { $motivo = 'Not Found' } elseif ($status -ge 400) { $motivo = 'Error' }
  $cab = 'HTTP/1.1 ' + $status + ' ' + $motivo + $CRLF + 'Content-Type: ' + $tipo + $CRLF + 'Cache-Control: no-store' + $CRLF + 'Connection: close' + $CRLF
  if ($extra) { $cab += $extra }
  if ($status -ne 204) { $cab += 'Content-Length: ' + $corpo.Length + $CRLF }
  $cab += $CRLF
  $bytes = [Text.Encoding]::ASCII.GetBytes($cab)
  $s = $x.c.GetStream()
  $s.Write($bytes, 0, $bytes.Length)
  if ($status -ne 204 -and $corpo.Length -gt 0) { $s.Write($corpo, 0, $corpo.Length) }
  $s.Flush()
  $x.fim = $true
}
function Texto($x, [int]$status, [string]$msg) { Enviar $x $status 'text/plain; charset=utf-8' ($utf8.GetBytes($msg)) }
function Encaminhar($x, [string]$consulta, $cab) {
  $destino = $null
  foreach ($par in $consulta.Split('&')) { if ($par.StartsWith('url=')) { $destino = [Uri]::UnescapeDataString($par.Substring(4)) } }
  $u = $null
  $valido = $false
  if ($destino) { $valido = [Uri]::TryCreate($destino, [UriKind]::Absolute, [ref]$u) }
  if (-not $valido -or $u.Scheme -ne 'https' -or ($PERMITIDOS -notcontains $u.Host)) { Texto $x 403 'Destino nao permitido'; return }
  $msg = [Net.Http.HttpRequestMessage]::new([Net.Http.HttpMethod]::Get, $u)
  $aceita = 'application/json'
  if ($cab['accept']) { $aceita = $cab['accept'] }
  [void]$msg.Headers.TryAddWithoutValidation('Accept', $aceita)
  [void]$msg.Headers.TryAddWithoutValidation('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ConsultorPrecos/1.2')
  if ($cab['chave-api-dados']) { [void]$msg.Headers.TryAddWithoutValidation('chave-api-dados', $cab['chave-api-dados']) }
  $x.alvoHost = $u.Host
  $x.tarefa = $cliente.SendAsync($msg)
}
function Atender($x, [string]$txt) {
  $linhas = $txt.Split([string[]]@($CRLF), [StringSplitOptions]::None)
  $partes = $linhas[0].Split(' ')
  if ($partes.Length -lt 2) { Texto $x 400 'Requisicao invalida'; return }
  $metodo = $partes[0]
  $alvo = $partes[1]
  $cab = @{}
  for ($i = 1; $i -lt $linhas.Length; $i++) {
    $k = $linhas[$i].IndexOf(':')
    if ($k -gt 0) { $cab[$linhas[$i].Substring(0, $k).Trim().ToLower()] = $linhas[$i].Substring($k + 1).Trim() }
  }
  $caminho = $alvo
  $consulta = ''
  $q = $alvo.IndexOf('?')
  if ($q -ge 0) { $caminho = $alvo.Substring(0, $q); $consulta = $alvo.Substring($q + 1) }
  if ($metodo -eq 'OPTIONS' -and $caminho -eq '/__consultor__/status') { Enviar $x 204 'text/plain' ([byte[]]@()) $CORS; return }
  if ($metodo -ne 'GET') { Texto $x 400 'Metodo nao suportado'; return }
  if ($caminho -eq '/' -or $caminho -eq '/index.html') { Enviar $x 200 'text/html; charset=utf-8' ([IO.File]::ReadAllBytes($html)); return }
  if ($caminho -eq '/__consultor__/status') {
    $inst = 'false'
    if ($instalado) { $inst = 'true' }
    $json = '{"consultor":true,"versao":"' + $VERSAO_SERVICO + '","porta":' + $porta + ',"sistema":"' + (Versao-Sistema) + '","instalado":' + $inst + '}'
    Enviar $x 200 'application/json; charset=utf-8' ($utf8.GetBytes($json)) $CORS
    return
  }
  if ($caminho -eq '/favicon.ico') { Enviar $x 204 'image/x-icon' ([byte[]]@()); return }
  if ($caminho -eq '/__consultor__/proxy') { Encaminhar $x $consulta $cab; return }
  Texto $x 404 'Nao encontrado'
}

$endereco = 'http://127.0.0.1:' + $porta + '/'
if ($interativo) {
  Write-Host ''
  Write-Host '  Consultor de Precos Governamentais'
  Write-Host ('  Arquivo do sistema: ' + $html)
  Write-Host ('  Endereco no navegador: ' + $endereco)
  Write-Host ''
  Write-Host '  O navegador vai abrir sozinho. Deixe esta janela aberta enquanto usar o sistema.'
  Write-Host '  Para encerrar, feche esta janela.'
  Write-Host ''
}
Registrar ('Servico iniciado em ' + $endereco + ' (' + $modo + ')')
if ($abrirNavegador) { try { Start-Process $endereco } catch { Registrar ('Abra no navegador: ' + $endereco) } }

while ($true) {
  $ativo = $false
  while ($ouvinte.Pending()) {
    $novo = $ouvinte.AcceptTcpClient()
    $novo.NoDelay = $true
    [void]$conexoes.Add(@{ c = $novo; ms = [IO.MemoryStream]::new(); t = [DateTime]::UtcNow; fim = $false; lido = $false; tarefa = $null; conteudo = $null; resposta = $null; alvoHost = '' })
    $ativo = $true
  }
  foreach ($x in @($conexoes)) {
    try {
      if (-not $x.lido) {
        if ($x.c.Available -gt 0) {
          $ativo = $true
          $n = $x.c.GetStream().Read($buffer, 0, $buffer.Length)
          if ($n -gt 0) { $x.ms.Write($buffer, 0, $n) }
          $txt = [Text.Encoding]::ASCII.GetString($x.ms.ToArray())
          $fimCab = $txt.IndexOf($CRLF + $CRLF)
          if ($fimCab -ge 0) { $x.lido = $true; Atender $x $txt.Substring(0, $fimCab) }
          elseif ($x.ms.Length -gt 65536) { Texto $x 400 'Requisicao muito grande' }
        } elseif (([DateTime]::UtcNow - $x.t).TotalSeconds -gt 30) { $x.fim = $true }
      }
      if ($x.tarefa -and $x.tarefa.IsCompleted) {
        $ativo = $true
        $t = $x.tarefa
        $x.tarefa = $null
        if ($t.IsFaulted -or $t.IsCanceled) {
          $motivo = 'tempo esgotado'
          if ($t.Exception) { $motivo = $t.Exception.GetBaseException().Message }
          Registrar ('Falha ao consultar ' + $x.alvoHost + ': ' + $motivo)
          Texto $x 502 ('Falha ao consultar ' + $x.alvoHost + ': ' + $motivo)
        } else {
          $x.resposta = $t.Result
          $x.conteudo = $x.resposta.Content.ReadAsByteArrayAsync()
        }
      }
      if ($x.conteudo -and $x.conteudo.IsCompleted) {
        $ativo = $true
        $t = $x.conteudo
        $x.conteudo = $null
        if ($t.IsFaulted -or $t.IsCanceled) { Texto $x 502 ('Falha ao ler a resposta de ' + $x.alvoHost) }
        else {
          $tipo = 'application/json'
          if ($x.resposta.Content.Headers.ContentType) { $tipo = $x.resposta.Content.Headers.ContentType.ToString() }
          Enviar $x ([int]$x.resposta.StatusCode) $tipo $t.Result
        }
      }
    } catch {
      try { Texto $x 500 ('Erro interno do servico: ' + $_.Exception.Message) } catch { }
      $x.fim = $true
    }
    if ($x.fim) {
      try { $x.c.Close() } catch { }
      if ($x.resposta) { try { $x.resposta.Dispose() } catch { } }
      $conexoes.Remove($x)
    }
  }
  if (-not $ativo) { Start-Sleep -Milliseconds 10 }
}

  const PY = String.raw`#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""Consultor de Preços Governamentais: iniciador local (Windows, macOS e Linux).

Abre o sistema em http://127.0.0.1:8787/ e encaminha as consultas às APIs públicas.
O navegador bloqueia essas consultas quando o sistema é aberto como arquivo (CORS).
Uso: na pasta do consultor-precos.html, execute  python3 iniciar_consultor.py
Escuta somente neste computador e só encaminha para as APIs listadas em PERMITIDOS."""
import glob
import json
import os
import re
import sys
import threading
import urllib.error
import urllib.parse
import urllib.request
import webbrowser
from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

CAMINHO_HTML = "%%CAMINHO_HTML%%"
PERMITIDOS = {'dadosabertos.compras.gov.br', 'api.portaldatransparencia.gov.br', 'api.bcb.gov.br', 'pncp.gov.br'}
PORTA_INICIAL = 8787
PASTA = os.path.dirname(os.path.abspath(__file__))
SEM_PROXY = urllib.request.build_opener(urllib.request.ProxyHandler({}))
CORS = {'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Methods': 'GET, OPTIONS', 'Access-Control-Allow-Headers': '*', 'Access-Control-Allow-Private-Network': 'true', 'Access-Control-Max-Age': '600'}
HTML = None


def localizar_html():
    if CAMINHO_HTML and 'CAMINHO_HTML' not in CAMINHO_HTML and os.path.isfile(CAMINHO_HTML):
        return CAMINHO_HTML
    achados = sorted(glob.glob(os.path.join(PASTA, 'consultor-precos*.html')), key=os.path.getmtime, reverse=True)
    return achados[0] if achados else None


def versao_sistema():
    try:
        with open(HTML, encoding='utf-8') as arq:
            m = re.search(r"CP\.VERSION = '([0-9.]+)'", arq.read())
            return m.group(1) if m else ''
    except OSError:
        return ''


class Servidor(ThreadingHTTPServer):
    allow_reuse_address = os.name != 'nt'
    daemon_threads = True


class Iniciador(BaseHTTPRequestHandler):
    def _enviar(self, status, tipo, corpo=b'', extras=None):
        self.send_response(status)
        self.send_header('Content-Type', tipo)
        self.send_header('Cache-Control', 'no-store')
        self.send_header('Connection', 'close')
        for chave, valor in (extras or {}).items():
            self.send_header(chave, valor)
        if status != 204:
            self.send_header('Content-Length', str(len(corpo)))
        self.end_headers()
        if status != 204 and corpo:
            self.wfile.write(corpo)
        self.close_connection = True

    def do_OPTIONS(self):
        if urllib.parse.urlparse(self.path).path == '/__consultor__/status':
            return self._enviar(204, 'text/plain', b'', CORS)
        return self._enviar(400, 'text/plain; charset=utf-8', 'Método não suportado'.encode('utf-8'))

    def do_GET(self):
        url = urllib.parse.urlparse(self.path)
        if url.path in ('/', '/index.html'):
            with open(HTML, 'rb') as arq:
                return self._enviar(200, 'text/html; charset=utf-8', arq.read())
        if url.path == '/__consultor__/status':

        <li>As escolhas automáticas (código do catálogo, preços comparáveis, conversão de unidades, exclusões, verificação de conformidade e rascunho da justificativa) são sugestões e devem ser revisadas.</li>
        <li>Projetos e configurações ficam guardados apenas neste computador; as consultas vão às APIs oficiais diretamente ou pelo serviço local deste computador.</li>
        <li>A ferramenta é fornecida no estado em que se encontra, sem garantia de resultado.</li>
      </ul>
      <footer><button type="button" class="btn primario" data-ab="aceitar">Concordo e quero entrar</button><small>${esc(nota)}</small></footer></div>`;
  }
  function bloquear(sim) {
    ['.topbar', '#projbar', '#aviso-conexao', '#main'].forEach((s) => { const e = document.querySelector(s); if (e) e.inert = sim; });
    document.body.classList.toggle('abrindo', sim);
  }
  function tecla(e) {
    const a = raiz();
    if (a && e.key === 'Escape' && !a.classList.contains('termo')) { e.preventDefault(); mostrarTermo(); }
  }
  function iniciar() {
    const a = raiz();
    if (!a) return;
    if (window.__SEM_ABERTURA__) { a.remove(); return; }
    bloquear(true);
    const reduzido = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const animar = CP.state.settings.abertura !== false && !reduzido;
    a.querySelector('.ab-cena').innerHTML = cena();
    if (!animar) a.classList.add('estatica');
    a.addEventListener('click', (e) => {
      if (e.target.closest('[data-ab="pular"]')) mostrarTermo();
      else if (e.target.closest('[data-ab="aceitar"]')) aceitar();
    });
    document.addEventListener('keydown', tecla);
    timer = setTimeout(mostrarTermo, animar ? DURACAO : 300);
    const p = a.querySelector('[data-ab="pular"]');
    if (p) p.focus();
  }
  function mostrarTermo() {
    const a = raiz();
    if (!a || a.classList.contains('termo')) return;
    clearTimeout(timer);
    a.classList.add('termo');
    a.setAttribute('aria-labelledby', 'ab-titulo');
    const t = a.querySelector('.ab-termo');
    t.innerHTML = termoHtml();
    t.hidden = false;
    const b = t.querySelector('[data-ab="aceitar"]');
    if (b) b.focus();
  }
  function aceitar() {
    CP.store.set('termo', { versao: VERSAO_TERMO, em: U.nowISO() });
    const a = raiz();
    if (!a) return;
    document.removeEventListener('keydown', tecla);
    a.classList.add('saindo');
    bloquear(false);
    setTimeout(() => a.remove(), 460);
  }
  return { iniciar, mostrarTermo, aceitar, cena, VERSAO_TERMO };
})();

/* ===== 99-main.js ===== */
/* Inicialização e navegação */
(function main() {
  const U = CP.util;
  const esc = U.esc;
  CP.carregar();
  CP.abertura.iniciar();
  const ABAS = { pesquisa: CP.pesquisa, cesta: CP.cesta, relatorio: CP.relatorio, nfe: CP.nfeUI, config: CP.config, manual: CP.manual };

  function aplicarTema() {
    const s = CP.state.settings;
    const escuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = s.tema || (escuro ? 'dark' : 'light');
  }
  function renderProjbar() {
    const p = CP.state.projeto;
    document.getElementById('projbar').innerHTML = `
      <div class="campo"><span>Objeto</span><b title="${esc(p.objeto)}">${esc(p.objeto || 'Não informado')}</b></div>
      <div class="campo"><span>Processo</span><b>${esc(p.processo || '—')}</b></div>
      <div class="campo"><span>Órgão</span><b title="${esc(p.orgao)}">${esc(p.orgao || '—')}</b></div>
      <div class="campo"><span>Data de referência</span><b>${U.fmtDate(p.dataReferencia)}</b></div>
      <div class="campo"><span>APIs do governo</span><b id="pb-conexao">${CP.conexao.indicador()}</b></div>
      <div class="acoes"><button type="button" class="btn pq" id="btn-processo">Dados do processo</button></div>`;
  }
  function dialogoProcesso() {
    const p = CP.state.projeto;
    const c = (id, rot, v, tipo = 'text', extra = '') => `<label class="f"${extra}><span>${rot}</span><input id="pr-${id}" type="${tipo}" value="${esc(v || '')}"></label>`;
    CP.ui.modal({
      titulo: 'Dados do processo', largo: true,
      corpo: `<div class="grade">${c('objeto', 'Objeto', p.objeto, 'text', ' style="grid-column:1/-1"')}${c('orgao', 'Órgão ou entidade', p.orgao)}${c('uasg', 'UASG', p.uasg)}${c('processo', 'Número do processo', p.processo)}${c('responsavel', 'Responsável pela pesquisa', p.responsavel)}${c('cargo', 'Cargo ou função', p.cargo)}
        <label class="f"><span>Data de referência</span><input id="pr-data" type="date" value="${esc(p.dataReferencia)}"><em>Data prevista de divulgação do edital. Os prazos de cada fonte contam a partir dela.</em></label>
        <label class="f" style="grid-column:1/-1"><span>Observações para o relatório</span><textarea id="pr-obs" rows="3">${esc(p.observacoes || '')}</textarea></label></div>`,
      acoes: [{ rotulo: 'Cancelar' }, { rotulo: 'Salvar', primario: true, acao: (corpo) => {
        const v = (id) => corpo.querySelector('#pr-' + id).value.trim();
        const data = U.parseDate(v('data'));
        if (!data) { CP.ui.toast('Informe uma data de referência válida.', 'erro'); return false; }
        const mudouData = data !== p.dataReferencia;
        Object.assign(p, { objeto: v('objeto'), orgao: v('orgao'), uasg: v('uasg'), processo: v('processo'), responsavel: v('responsavel'), cargo: v('cargo'), dataReferencia: data, observacoes: corpo.querySelector('#pr-obs').value });
        CP.salvar.projetoJa(); CP.bus.emit('projeto');
        if (ABAS[CP.state.ui.tab] && CP.state.ui.tab !== 'pesquisa') ABAS[CP.state.ui.tab].mostrar();
        CP.ui.toast(mudouData ? 'Dados salvos. Os prazos das amostras foram recalculados com a nova data.' : 'Dados do processo salvos.', 'ok');
      } }],
    });
  }
  function contador() {
    const n = CP.state.projeto.itens.length;
    document.getElementById('cesta-count').textContent = n ? String(n) : '';
  }
  function irPara(tab) {
    if (!ABAS[tab]) return false;
    CP.state.ui.tab = tab;
    document.querySelectorAll('[data-tab-panel]').forEach((s) => { s.hidden = s.dataset.tabPanel !== tab; });
    document.querySelectorAll('.topbar nav a[data-tab]').forEach((a) => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    ABAS[tab].mostrar();
    CP.store.set('aba', tab);
    return true;
  }
  function recarregar() { renderProjbar(); contador(); irPara(CP.state.ui.tab); }

  aplicarTema();
  renderProjbar();
  Object.values(ABAS).forEach((m) => { if (m.iniciar) m.iniciar(); });
  CP.lote.iniciar();
  contador();
  CP.bus.on('projeto', () => { contador(); renderProjbar(); });

  document.getElementById('projbar').addEventListener('click', (e) => { if (e.target.closest('#btn-processo')) dialogoProcesso(); });
  document.getElementById('btn-tema').addEventListener('click', () => {
    const atual = document.documentElement.dataset.theme;
    CP.state.settings.tema = atual === 'dark' ? 'light' : 'dark';
    CP.salvar.settings(); aplicarTema();
  });
  window.addEventListener('hashchange', () => { irPara(location.hash.slice(1)); });
  window.addEventListener('resize', U.debounce(() => { const m = ABAS[CP.state.ui.tab]; if (m && m.redimensionar) m.redimensionar(); }, 200));
  document.addEventListener('keydown', (e) => {
    const alvo = e.target, digitando = alvo && (alvo.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(alvo.tagName));
    if (e.altKey && ['1', '2', '3'].includes(e.key)) { e.preventDefault(); location.hash = ['pesquisa', 'cesta', 'relatorio'][Number(e.key) - 1]; return; }
    if (e.key === '/' && !digitando && !document.querySelector('.modal-fundo')) {
      e.preventDefault();
      if (CP.state.ui.tab !== 'pesquisa') location.hash = 'pesquisa';
      setTimeout(() => { const t = document.getElementById('pq-termo'); if (t) t.focus(); }, 30);
    }
  });
  window.addEventListener('error', (e) => { console.error(e.error || e.message); });

  CP.app = { irPara, recarregar, renderProjbar, dialogoProcesso };
  const inicial = location.hash.slice(1);
  if (!irPara(inicial)) irPara(CP.store.get('aba', 'pesquisa')) || irPara('pesquisa');
  CP.conexao.iniciar();
})();

</script>
