  function dv(c43) {
    let soma = 0, peso = 2;
    for (let i = c43.length - 1; i >= 0; i--) { soma += (c43.charCodeAt(i) - 48) * peso; peso = peso === 9 ? 2 : peso + 1; }
    const r = soma % 11;
    return r < 2 ? 0 : 11 - r;
  }
  function validarChave(entrada) {
    const c = U.onlyAlnum(entrada);
    if (c.length !== 44) return { ok: false, chave: c, erros: [`A chave deve ter 44 caracteres; foram informados ${c.length}.`] };
    const erros = [];
    if ([...c].some((ch, i) => /[A-Z]/.test(ch) && (i < 6 || i > 19))) erros.push('Letras só são admitidas na posição do CNPJ do emitente (CNPJ alfanumérico).');
    const p = { cUF: c.slice(0, 2), aamm: c.slice(2, 6), doc: c.slice(6, 20), mod: c.slice(20, 22), serie: c.slice(22, 25), nNF: c.slice(25, 34), tpEmis: c.slice(34, 35), cNF: c.slice(35, 43), cDV: c.slice(43) };
    const uf = UF[Number(p.cUF)];
    if (!uf) erros.push(`Código de UF inválido (${p.cUF}).`);
    const mes = Number(p.aamm.slice(2));
    if (!(mes >= 1 && mes <= 12)) erros.push(`Mês de emissão inválido (${p.aamm.slice(2)}).`);
    if (!MODELOS[Number(p.mod)]) erros.push(`Modelo ${p.mod} não corresponde a NF-e (55) nem NFC-e (65).`);

    const dvOk = String(calc) === p.cDV;

    return { ok: erros.length === 0, dvOk, chave: c, uf: uf || '—', emissao: `${p.aamm.slice(2)}/20${p.aamm.slice(0, 2)}`, modelo: MODELOS[Number(p.mod)] || p.mod, serie: Number(p.serie), numero: Number(p.nNF), tpEmis: EMISSAO[Number(p.tpEmis)] || p.tpEmis, cnpj: p.doc, partes: p, dvCalculado: calc, erros };
  }

  const filho = (el, n) => { if (!el) return null; for (const c of el.children) if (c.localName === n) return c; return null; };
  const caminho = (el, ...ns) => { let e = el; for (const n of ns) { e = filho(e, n); if (!e) return null; } return e; };

    const doc = new DOMParser().parseFromString(texto, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error(`${nome}: XML inválido.`);
    const infs = todos(doc, 'infNFe');
    if (!infs.length) throw new Error(`${nome}: o arquivo não contém NF-e (grupo infNFe ausente).`);
    const prots = todos(doc, 'infProt');
    return infs.map((inf) => {
      let chave = U.onlyAlnum((inf.getAttribute('Id') || '').replace(/^NFe/i, ''));
      const prot = prots.find((p) => U.onlyAlnum(txt(p, 'chNFe')) === chave) || (infs.length === 1 ? prots[0] : null);
      if (!chave && prot) chave = U.onlyAlnum(txt(prot, 'chNFe'));
      const ide = filho(inf, 'ide'), emit = filho(inf, 'emit'), dest = filho(inf, 'dest');
      const itens = Array.from(inf.children).filter((c) => c.localName === 'det').map((det) => {
        const p = filho(det, 'prod');
        const q = U.parseNum(txt(p, 'qCom')), vProd = U.parseNum(txt(p, 'vProd')), vDesc = U.parseNum(txt(p, 'vDesc')) || 0, vUn = U.parseNum(txt(p, 'vUnCom'));
        const preco = q > 0 && vProd > 0 ? (vProd - vDesc) / q : vUn;
        return { n: Number(det.getAttribute('nItem')) || 0, cProd: txt(p, 'cProd'), ean: txt(p, 'cEAN'), descricao: txt(p, 'xProd'), ncm: txt(p, 'NCM'), cfop: txt(p, 'CFOP'), unidade: txt(p, 'uCom'), qtd: q, vUnCom: vUn, vProd, vDesc, preco };
      });
      return {
        chave, numero: Number(txt(ide, 'nNF')) || null, serie: txt(ide, 'serie'), modelo: txt(ide, 'mod'), data: U.parseDate(txt(ide, 'dhEmi') || txt(ide, 'dEmi')), natOp: txt(ide, 'natOp'),
        emitDoc: txt(emit, 'CNPJ') || txt(emit, 'CPF'), emitNome: txt(emit, 'xNome'), emitUF: txt(emit, 'enderEmit', 'UF'), emitMun: txt(emit, 'enderEmit', 'xMun'),
        destDoc: txt(dest, 'CNPJ') || txt(dest, 'CPF') || txt(dest, 'idEstrangeiro'), destNome: txt(dest, 'xNome'), destUF: txt(dest, 'enderDest', 'UF'),
        valorTotal: U.parseNum(txt(inf, 'total', 'ICMSTot', 'vNF')), itens, situacao: prot ? `${txt(prot, 'cStat')} ${txt(prot, 'xMotivo')}`.trim() : '', origem: 'XML', importadaEm: U.nowISO(),

    });

  /* ZIP: lê o diretório central e descompacta entradas "deflate" com DecompressionStream */
  function lerZip(buf) {

    for (let k = 0; k < total; k++) {
      if (dv2.getUint32(off, true) !== 0x02014b50) throw new Error('Diretório do ZIP corrompido.');
      const metodo = dv2.getUint16(off + 10, true), comp = dv2.getUint32(off + 20, true), nLen = dv2.getUint16(off + 28, true), xLen = dv2.getUint16(off + 30, true), cLen = dv2.getUint16(off + 32, true), loc = dv2.getUint32(off + 42, true);

    return new Uint8Array(await new Response(fluxo).arrayBuffer());
  }

  function adicionar(notas) {
    let novas = 0, repetidas = 0;
    const mapa = new Map(CP.state.nfe.map((n) => [n.chave, n]));
    for (const n of notas) {
      const k = n.chave || U.uid('nf');
      if (mapa.has(k)) { repetidas++; continue; }
      mapa.set(k, n); novas++;

    CP.state.nfe = [...mapa.values()].sort((a, b) => String(b.data || '').localeCompare(String(a.data || '')));

    return { novas, repetidas };
  }
  async function importarArquivos(files) {
    const notas = [], erros = [];
    for (const f of files) {
      try {
        if (/\.zip$/i.test(f.name)) {
          for (const e of lerZip(await U.lerBuffer(f))) {
            if (!/\.xml$/i.test(e.nome)) continue;
            try { notas.push(...lerXML(new TextDecoder('utf-8').decode(await inflar(e)), e.nome)); } catch (er) { erros.push(er.message); }
          }

  }

  function limpar() { CP.state.nfe = []; CP.salvar.nfe(); CP.bus.emit('nfe'); }

  async function consultarApiPropria(chave, signal) {
    const c = CP.state.settings.apiPropria || {};
    if (!c.url) throw new Error('Informe o endereço da API própria em Notas fiscais › API própria.');
    let headers = {};
    if ((c.headers || '').trim()) { try { headers = JSON.parse(c.headers); } catch (e) { throw new Error('Os cabeçalhos devem estar em JSON válido, por exemplo {"Authorization": "Bearer ..."}.'); } }

      const obj = JSON.parse(xml);

      try { xml = new TextDecoder().decode(Uint8Array.from(atob(xml), (ch) => ch.charCodeAt(0))); } catch (e) { throw new Error('A resposta não é XML nem XML em Base64.'); }

  }

  return { validarChave, dv, lerXML, lerZip, inflar, adicionar, importarArquivos, remover, limpar, consultarApiPropria, UF };
})();

/* ===== 06-arquivos.js ===== */
/* CSV (leitura e geração para Excel pt-BR) e XLSX mínimo (OOXML em ZIP sem compressão) */
CP.csv = (() => {
  function separador(linha) {
    const c = { ';': 0, ',': 0, '\t': 0, '|': 0 };
    let q = false;
    for (const ch of linha) { if (ch === '"') q = !q; else if (!q && ch in c) c[ch]++; }
    const m = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
    return m[1] ? m[0] : ';';
  }
  function ler(texto) {
    texto = String(texto).replace(/^\uFEFF/, '');
    const sep = separador(texto.split(/\r?\n/, 1)[0] || '');
    const linhas = [];
    let campo = '', linha = [], q = false;
    for (let i = 0; i < texto.length; i++) {
      const ch = texto[i];
      if (q) { if (ch === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else q = false; } else campo += ch; }
      else if (ch === '"') q = true;
      else if (ch === sep) { linha.push(campo); campo = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && texto[i + 1] === '\n') i++; linha.push(campo); campo = ''; if (linha.some((x) => x.trim() !== '')) linhas.push(linha); linha = []; }
      else campo += ch;
    }
    if (campo !== '' || linha.length) { linha.push(campo); if (linha.some((x) => x.trim() !== '')) linhas.push(linha); }
    const cabecalho = (linhas.shift() || []).map((s) => s.trim());
    return { sep, cabecalho, linhas };
  }
  function gerar(cab, linhas, sep = ';') {
    const f = (v) => {
      if (v == null || (typeof v === 'number' && !Number.isFinite(v))) return '';
      const s = typeof v === 'number' ? String(v).replace('.', ',') : String(v);
      return /["\n\r]/.test(s) || s.includes(sep) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return '\uFEFF' + [cab, ...linhas].map((l) => l.map(f).join(sep)).join('\r\n');
  }
  return { ler, gerar };
})();

CP.xlsx = (() => {
  const TAB = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  function zip(arquivos) {
    const enc = new TextEncoder();
    const d = new Date();
    const hora = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const dia = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const partes = [], central = [];
    let off = 0;
    for (const a of arquivos) {
      const nome = enc.encode(a.nome), dados = a.dados, crc = crc32(dados);
      const l = new DataView(new ArrayBuffer(30));
      l.setUint32(0, 0x04034b50, true); l.setUint16(4, 20, true); l.setUint16(6, 0x0800, true); l.setUint16(8, 0, true);
      l.setUint16(10, hora, true); l.setUint16(12, dia, true); l.setUint32(14, crc, true); l.setUint32(18, dados.length, true);
      l.setUint32(22, dados.length, true); l.setUint16(26, nome.length, true); l.setUint16(28, 0, true);
      partes.push(new Uint8Array(l.buffer), nome, dados);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, hora, true); c.setUint16(14, dia, true); c.setUint32(16, crc, true); c.setUint32(20, dados.length, true); c.setUint32(24, dados.length, true);
      c.setUint16(28, nome.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), nome);
      off += 30 + nome.length + dados.length;
    }
    const tam = central.reduce((s, p) => s + p.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, arquivos.length, true); e.setUint16(10, arquivos.length, true); e.setUint32(12, tam, true); e.setUint32(16, off, true);
    const todas = [...partes, ...central, new Uint8Array(e.buffer)];
    const out = new Uint8Array(todas.reduce((s, p) => s + p.length, 0));
    let p = 0;
    for (const x of todas) { out.set(x, p); p += x.length; }
    return out;
  }
  const xesc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  function coluna(i) { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  // célula: número, texto ou {v, s} com s = 1 (negrito), 2 (moeda/decimal), 3 (percentual)
  function folha(linhas, larguras) {
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
    if (larguras && larguras.length) x += '<cols>' + larguras.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('') + '</cols>';
    x += '<sheetData>';
    linhas.forEach((l, r) => {
      x += `<row r="${r + 1}">`;
      l.forEach((cel, c) => {
        let v = cel, s = 0;
        if (cel && typeof cel === 'object') { v = cel.v; s = cel.s || 0; }
        if (v == null || v === '' || (typeof v === 'number' && !Number.isFinite(v))) return;
        const ref = coluna(c) + (r + 1), st = s ? ` s="${s}"` : '';
        x += typeof v === 'number' ? `<c r="${ref}"${st}><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
      });
      x += '</row>';
    });
    return x + '</sheetData></worksheet>';
  }
  const ESTILOS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00##"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="10" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  function gerar(abas) {
    const enc = new TextEncoder();
    const nomes = abas.map((a, i) => (a.nome || `Planilha${i + 1}`).replace(/[\\/?*[\]:]/g, ' ').slice(0, 31));
    const arq = [
      { nome: '[Content_Types].xml', dados: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${abas.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`) },
      { nome: '_rels/.rels', dados: enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>') },
      { nome: 'xl/workbook.xml', dados: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${nomes.map((n, i) => `<sheet name="${xesc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`) },
      { nome: 'xl/_rels/workbook.xml.rels', dados: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${abas.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${abas.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`) },
      { nome: 'xl/styles.xml', dados: enc.encode(ESTILOS) },
      ...abas.map((a, i) => ({ nome: `xl/worksheets/sheet${i + 1}.xml`, dados: enc.encode(folha(a.linhas, a.larguras)) })),
    ];
    return zip(arq);
  }
  return { gerar, zip, crc32 };
})();

/* ===== 07-graficos.js ===== */
/* Régua de preços: cada amostra é um ponto empilhado sobre uma régua graduada;
   a faixa aceita pelo critério aparece sombreada, a mediana marcada sob a régua
   e o valor estimado em verde. */
CP.graficos = (() => {
  const U = CP.util;
  function passo(range, alvo = 6) {
    if (!(range > 0)) return 1;
    const bruto = range / alvo, pot = Math.pow(10, Math.floor(Math.log10(bruto))), f = bruto / pot;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * pot;
  }
  function rotulo(v, st) { const d = st >= 1 ? 0 : Math.min(4, Math.ceil(-Math.log10(st) - 1e-9)); return U.fmtNum(v, d, d); }
  const n1 = (x) => (Math.round(x * 10) / 10).toString();

  function regua(pontos, opt = {}) {
    const W = Math.max(320, Math.round(opt.largura || 820)), H = opt.altura || 134, ml = 18, mr = 18, base = H - 36;
    const vals = pontos.map((p) => p.v).filter(U.isNum);
    if (!vals.length) return `<svg class="regua" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sem preços para exibir"></svg>`;
    const validos = pontos.filter((p) => !p.x).map((p) => p.v);
    const ref = validos.length ? validos : vals;
    let lo = Math.min(...ref), hi = Math.max(...ref);
    const lim = opt.limites;
    if (lim && lim.aplicado && U.isNum(lim.lo)) lo = Math.min(lo, Math.max(0, lim.lo));
    if (lim && lim.aplicado && U.isNum(lim.hi)) hi = Math.max(hi, lim.hi);
    if (U.isNum(opt.estimado)) { lo = Math.min(lo, opt.estimado); hi = Math.max(hi, opt.estimado); }
    let span = hi - lo;
    if (span <= 0) { span = Math.abs(hi) * 0.2 || 1; lo -= span / 2; hi += span / 2; }
    lo = Math.max(0, lo - span * 0.06); hi += span * 0.06;
    const X = (v) => ml + ((v - lo) / (hi - lo)) * (W - ml - mr);
    let s = '';
    if (lim && lim.aplicado) {
      const a = X(Math.max(lo, lim.lo)), b = X(Math.min(hi, lim.hi));
      if (b > a) s += `<rect class="rg-band" x="${n1(a)}" y="14" width="${n1(b - a)}" height="${base - 14}"/><line class="rg-lim" x1="${n1(a)}" x2="${n1(a)}" y1="14" y2="${base}"/><line class="rg-lim" x1="${n1(b)}" x2="${n1(b)}" y1="14" y2="${base}"/>`;
    }
    const st = passo(hi - lo, Math.max(3, Math.round(W / 130))), menor = st / 5;
    let cont = 0;
    for (let k = Math.ceil(lo / menor - 1e-9); k * menor <= hi + 1e-9 && cont < 400; k++, cont++) {
      const v = k * menor, x = X(v), maior = k % 5 === 0;
      s += `<line class="rg-tick${maior ? '' : ' menor'}" x1="${n1(x)}" x2="${n1(x)}" y1="${base}" y2="${base + (maior ? 8 : 4)}"/>`;
      if (maior) s += `<text class="rg-lbl" x="${n1(x)}" y="${base + 22}" text-anchor="middle">${rotulo(v, st)}</text>`;
    }
    s += `<line class="rg-base" x1="${ml}" x2="${W - mr}" y1="${base}" y2="${base}"/>`;
    const r = 3.4, bin = r * 2 + 1.2, pilhas = new Map(), pos = [];
    let maxP = 0, esq = 0, dir = 0;
    const ord = [...pontos].filter((p) => U.isNum(p.v)).sort((a, b) => (a.x === b.x ? a.v - b.v : a.x ? 1 : -1));
    for (const p of ord) {
      if (p.v < lo) { esq++; continue; }
      if (p.v > hi) { dir++; continue; }
      const k = Math.round(X(p.v) / bin), n = pilhas.get(k) || 0;
      pilhas.set(k, n + 1); maxP = Math.max(maxP, n + 1);
      pos.push({ x: k * bin, n, ex: p.x });
    }
    const dy = Math.min(bin, (base - 22) / Math.max(1, maxP));
    for (const p of pos) s += `<circle class="rg-dot${p.ex ? ' x' : ''}" cx="${n1(p.x)}" cy="${n1(base - r - 2 - p.n * dy)}" r="${r}"/>`;
    if (esq) s += `<text class="rg-edge" x="${ml}" y="26">◂ ${esq} abaixo</text>`;
    if (dir) s += `<text class="rg-edge" x="${W - mr}" y="26" text-anchor="end">${dir} acima ▸</text>`;
    if (U.isNum(opt.mediana)) { const x = X(opt.mediana); s += `<path class="rg-med" d="M${n1(x)} ${base + 1} l-5 8 h10 z"><title>Mediana ${U.esc(U.fmtPrice(opt.mediana))}</title></path>`; }
    if (U.isNum(opt.estimado)) {
      const x = X(opt.estimado), anc = x > W * 0.72 ? 'end' : x < W * 0.28 ? 'start' : 'middle', tx = anc === 'end' ? x - 4 : anc === 'start' ? x + 4 : x;
      s += `<line class="rg-est" x1="${n1(x)}" x2="${n1(x)}" y1="13" y2="${base}"/><text class="rg-estlbl" x="${n1(tx)}" y="10" text-anchor="${anc}">${U.esc((opt.rotuloEstimado || 'estimado') + ' ' + U.fmtPrice(opt.estimado))}</text>`;
    }
    const aria = `Distribuição de ${vals.length} preço(s) entre ${U.fmtPrice(Math.min(...vals))} e ${U.fmtPrice(Math.max(...vals))}` + (U.isNum(opt.mediana) ? `; mediana ${U.fmtPrice(opt.mediana)}` : '');
    return `<svg class="regua" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${U.esc(aria)}">${s}</svg>`;
  }

  function linhaTempo(pontos, opt = {}) {
    const W = Math.max(320, Math.round(opt.largura || 820)), H = opt.altura || 190, ml = 70, mr = 14, mt = 14, mb = 30;
    const ps = pontos.filter((p) => p.d && U.isNum(p.v));
    if (ps.length < 2) return '';
    const ts = ps.map((p) => Date.parse(p.d + 'T00:00:00Z'));
    let t0 = Math.min(...ts), t1 = Math.max(...ts);
    if (t1 === t0) { t0 -= 20 * 864e5; t1 += 20 * 864e5; }
    const v1 = Math.max(...ps.map((p) => p.v), U.isNum(opt.estimado) ? opt.estimado : 0) * 1.08;
    const X = (t) => ml + ((t - t0) / (t1 - t0)) * (W - ml - mr);
    const Y = (v) => mt + (1 - v / v1) * (H - mt - mb);
    let s = '';
    const st = passo(v1, 4);
    for (let k = 0; k * st <= v1 + 1e-9 && k < 50; k++) {
      const v = k * st, y = Y(v);
      s += `<line class="rg-grid" x1="${ml}" x2="${W - mr}" y1="${n1(y)}" y2="${n1(y)}"/><text class="rg-lbl" x="${ml - 6}" y="${n1(y + 4)}" text-anchor="end">${rotulo(v, st)}</text>`;
    }
    const d0 = new Date(t0), d1 = new Date(t1);
    const totMeses = (d1.getUTCFullYear() - d0.getUTCFullYear()) * 12 + d1.getUTCMonth() - d0.getUTCMonth() + 1;
    const salto = Math.max(1, Math.ceil(totMeses / Math.max(3, Math.round(W / 95))));
    for (let c = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1)), k = 0; c.getTime() <= t1 && k < 200; c = new Date(Date.UTC(c.getUTCFullYear(), c.getUTCMonth() + salto, 1)), k++) {
      const x = X(c.getTime());
      s += `<line class="rg-tick menor" x1="${n1(x)}" x2="${n1(x)}" y1="${H - mb}" y2="${H - mb + 4}"/><text class="rg-lbl" x="${n1(x)}" y="${H - mb + 17}" text-anchor="middle">${U.pad(c.getUTCMonth() + 1)}/${String(c.getUTCFullYear()).slice(2)}</text>`;
    }
    s += `<line class="rg-base" x1="${ml}" x2="${W - mr}" y1="${H - mb}" y2="${H - mb}"/>`;
    if (U.isNum(opt.estimado)) s += `<line class="rg-est" x1="${ml}" x2="${W - mr}" y1="${n1(Y(opt.estimado))}" y2="${n1(Y(opt.estimado))}" stroke-dasharray="5 4"/>`;
    ps.forEach((p, i) => { s += `<circle class="rg-dot${p.x ? ' x' : ''}" cx="${n1(X(ts[i]))}" cy="${n1(Y(p.v))}" r="3.2"/>`; });
    return `<svg class="regua" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Preços ao longo do tempo">${s}</svg>`;
  }

  const largura = (el) => Math.max(320, Math.min(1400, (el && el.clientWidth) || 820));
  const legenda = (comFaixa = true, comEst = true) => `<div class="legenda"><span><i class="l-ok"></i>preço válido</span><span><i class="l-x"></i>desconsiderado</span>${comFaixa ? '<span><i class="l-band"></i>faixa aceita pelo critério</span>' : ''}<span>▲ mediana</span>${comEst ? '<span><i class="l-est"></i>valor estimado</span>' : ''}</div>`;

  return { regua, linhaTempo, largura, legenda, passo };
})();

    } else if (cat.resultados.length) {

        : `<li><div class="nome">${U.esc(r.descricao)}</div><div class="meta">PDM ${U.esc(r.codigo)}${r.nomeClasse ? `, classe ${U.esc(r.codigoClasse)} (${U.esc(r.nomeClasse)})` : ''}</div><div class="acoes"><button class="btn pq" data-acao="cat-itens" data-cod="${U.esc(r.codigo)}">Ver itens</button><button class="btn pq leve" data-acao="chip-pdm" data-cod="${U.esc(r.codigo)}">PDM inteiro</button></div></li>`).join('')}</ul>`;

      <h3>Catálogo de materiais e serviços</h3>
      <div class="seg" role="group" aria-label="Tipo de item" style="margin:10px 0">
        <button type="button" data-acao="tipo" data-v="M" aria-pressed="${b.tipo === 'M'}">Material</button><button type="button" data-acao="tipo" data-v="S" aria-pressed="${b.tipo === 'S'}">Serviço</button>
      </div>
      <form id="pq-cat-form" class="linha" autocomplete="off">
        <label class="f grow"><span>Descrição ou código ${b.tipo === 'S' ? 'CATSER' : 'CATMAT'}</span><input id="pq-termo" value="${U.esc(b.termo)}" placeholder="${b.tipo === 'S' ? 'ex.: limpeza predial' : 'ex.: caneta esferográfica'}"></label>
        <button class="btn" type="submit">Buscar</button>
      </form>
      ${c.baixadoEm ? `<p class="small muted" style="margin:8px 0 0">${U.esc(statusIndice())} <button class="btn leve pq" data-acao="baixar-indice">Atualizar</button></p>`
        : `<p class="small muted" style="margin:8px 0 0">Na primeira busca por descrição, o sistema baixa o catálogo oficial uma única vez (pode levar alguns minutos). Códigos numéricos funcionam direto.</p>`}
      ${lista}
      <p class="small" style="margin-top:12px"><a href="https://catalogo.compras.gov.br/cnbs-web/busca" target="_blank" rel="noopener">Abrir o catálogo oficial do Compras.gov.br</a></p>`;
  }

  function nfeNaBase() { return CP.state.nfe.reduce((s, n) => s + (n.itens || []).length, 0); }
  function renderForm() {
    const f = b.filtros, fo = b.fontes, temChave = !!(CP.state.settings.chaveTransparencia || '').trim();
    sec('pq-form').innerHTML = `
      <header><h3>Itens a pesquisar</h3></header>
      <div class="chips" id="pq-chips">${b.chips.length ? b.chips.map((c, i) => `<span class="chip" title="${U.esc(c.descricao)}"><b>${c.tipo === 'S' ? 'CATSER' : c.nivel === 'pdm' ? 'PDM' : 'CATMAT'} ${U.esc(c.codigo)}</b><span>${U.esc(c.descricao || 'sem descrição')}</span><button type="button" data-acao="chip-remover" data-i="${i}" aria-label="Remover ${U.esc(c.codigo)}">×</button></span>`).join('') : '<p class="small muted" style="margin:0">Nenhum código escolhido. Busque no catálogo ao lado ou digite o código e clique em Buscar. As fontes de notas fiscais funcionam só com o texto abaixo.</p>'}</div>
      <div class="grade" style="margin-top:12px">
        <label class="f" style="grid-column:span 2"><span>Texto para notas fiscais</span><input id="pq-texto" value="${U.esc(b.textoNfe)}" placeholder="ex.: caneta esferográfica azul"><em>As fontes de NF-e buscam por texto, não por código de catálogo.</em></label>
        <label class="f"><span>De</span><input type="date" id="pq-de" value="${U.esc(f.de)}"></label>
        <label class="f"><span>Até</span><input type="date" id="pq-ate" value="${U.esc(f.ate)}"></label>
        <label class="f"><span>UF</span><select id="pq-uf"><option value="">Todas</option>${UFS.map((u) => `<option ${f.uf === u ? 'selected' : ''}>${u}</option>`).join('')}</select></label>
        <label class="f"><span>Esfera</span><select id="pq-esfera"><option value="">Todas</option>${['Federal', 'Estadual', 'Municipal', 'Distrital'].map((e) => `<option ${f.esfera === e ? 'selected' : ''}>${e}</option>`).join('')}</select></label>
      </div>
      <div class="chips" style="margin-top:8px" aria-label="Períodos rápidos">${[6, 12, 24].map((m) => `<button type="button" class="chip" data-acao="periodo" data-m="${m}">Últimos ${m} meses</button>`).join('')}</div>
      <fieldset style="border:0;padding:0;margin:14px 0 0"><legend class="small" style="font-weight:600;margin-bottom:6px">Fontes</legend>
        <div class="fontes">
          <label class="check"><input type="checkbox" data-fonte="painel" ${fo.painel ? 'checked' : ''}> Painel de Preços <em>inciso I</em></label>
          <label class="check"><input type="checkbox" data-fonte="pncp" ${fo.pncp ? 'checked' : ''}> Contratações no PNCP <em>inciso II</em></label>
          <label class="check"><input type="checkbox" data-fonte="arp" ${fo.arp ? 'checked' : ''}> Atas de registro de preços <em>inciso II</em></label>
          ${temChave ? `<label class="check"><input type="checkbox" data-fonte="nfePortal" ${fo.nfePortal ? 'checked' : ''}> NF-e do Portal da Transparência <em>inciso V</em></label>` : ''}
          <label class="check"><input type="checkbox" data-fonte="nfeLocal" ${fo.nfeLocal ? 'checked' : ''}> NF-e importadas <em>${U.plural(nfeNaBase(), 'item', 'itens')} na base</em></label>
        </div>
        <div class="fontes" style="margin-top:8px">
          <label class="check"><input type="checkbox" id="pq-homolog" ${f.somenteHomologados ? 'checked' : ''}> Somente contratações com resultado</label>
          <label class="check"><input type="checkbox" id="pq-estim" ${f.incluirEstimados ? 'checked' : ''}> Incluir valores estimados de itens sem resultado</label>
        </div>
      </fieldset>
      <div class="linha" style="margin-top:14px">
        <button type="button" class="btn primario" data-acao="pesquisar" ${b.rodando ? 'disabled' : ''}>Pesquisar preços</button>
        <button type="button" class="btn" data-acao="cancelar" ${b.rodando ? '' : 'hidden'}>Cancelar</button>
        <button type="button" class="btn leve" data-acao="importar-json">Importar resposta JSON</button>
        <span class="small muted">Período, UF e esfera valem para todas as fontes.</span>
      </div>`;
  }

  const ROT_ESTADO = { aguardando: 'Aguardando', rodando: 'Consultando', ok: 'Concluído', erro: 'Falhou', cancelado: 'Cancelado' };
  function renderStatus() {
    const el = sec('pq-status');
    if (!el) return;
    if (!b.resumo.length) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = `<header><h3>Andamento das consultas</h3></header><ul class="status-lista">${b.resumo.map((s) => `
      <li><span class="st ${s.estado === 'ok' ? (s.truncado ? 'aviso' : 'ok') : s.estado === 'erro' ? 'erro' : s.estado === 'rodando' ? 'rodando' : ''}">${ROT_ESTADO[s.estado] || s.estado}</span>
        <span>${U.esc(s.rotulo)}${s.estado === 'rodando' ? `<div class="barra" style="width:180px;margin-top:4px"><i style="width:${Math.round((s.progresso || 0) * 100)}%"></i></div>` : ''}
        ${s.erro ? `<br><span class="small" style="color:var(--red)">${U.esc(s.erro)}</span>${s.url ? ` <a class="small" href="${U.esc(s.url)}" target="_blank" rel="noopener">Abrir a consulta no navegador</a>` : ''}` : ''}
        ${s.nota ? `<br><span class="small muted">${U.esc(s.nota)}</span>` : ''}</span>
        <span class="det">${s.estado === 'ok' ? `${U.plural(s.n, 'preço', 'preços')}${s.truncado ? ` de ${U.fmtInt(s.total)} registros` : ''}` : U.esc(s.det || '')}</span></li>`).join('')}</ul>
      ${b.duplicados ? `<p class="small muted">${U.plural(b.duplicados, 'registro repetido entre fontes foi unificado', 'registros repetidos entre fontes foram unificados')}.</p>` : ''}
      ${b.resumo.some((s) => s.tipoErro === 'RedeError') ? `<div class="aviso erro"><p>O navegador não conseguiu consultar as APIs. Siga as instruções do aviso no topo da página para abrir o sistema pelo iniciador local.</p></div>` : ''}`;
  }

  /* ---------- resultados ---------- */
  const porBase = () => b.porBase !== false;
  function chaveUn(l) { if (porBase()) { const x = CP.units.base(l.unidade); return x ? x.rotulo : '(sem unidade)'; } return CP.units.key(l.unidade) || '(sem unidade)'; }
  function precoVis(l) { if (porBase()) { const x = CP.units.base(l.unidade); if (x && x.qtd > 0) return l.preco / x.qtd; } return l.preco; }
  const refDesc = () => (b.chips[0] && b.chips[0].descricao) || b.textoNfe || '';
  function simDe(l) { const ref = refDesc(); if (!ref) return null; if (l._simRef !== ref) { l._sim = CP.texto.similaridade(ref, l.descricao); l._simRef = ref; } return l._sim; }
  function unidadesDisponiveis() {
    const m = new Map();
    for (const l of b.linhas) { const k = chaveUn(l); const x = m.get(k) || { k, n: 0, rot: porBase() ? k : (l.unidade || '(sem unidade)') }; x.n++; m.set(k, x); }
    return [...m.values()].sort((a, c) => c.n - a.n);
  }
  function criterioPadrao() { return CP.state.settings.criterio; }
  function filtradas() {
    let ls = b.linhas;
    if (b.unidade !== '*') ls = ls.filter((l) => chaveUn(l) === b.unidade);
    if (b.filtro) { const q = U.tokens(b.filtro); ls = ls.filter((l) => U.matchScore(`${l.descricao} ${l.fornecedor} ${l.orgao} ${l.uf} ${l.municipio} ${l.marca} ${l.ref}`, q) === 1); }
    const lim = CP.stats.limites(ls.map(precoVis), criterioPadrao());
    if (b.ocultarFora && lim.aplicado) ls = ls.filter((l) => precoVis(l) >= lim.lo && precoVis(l) <= lim.hi);
    const { col, dir } = b.ordem;
    const val = (l) => (col === 'preco' ? precoVis(l) : col === 'sim' ? (simDe(l) ? simDe(l).score : -1) : col === 'data' ? l.data || '' : col === 'qtd' ? (U.isNum(l.quantidade) ? l.quantidade : -1) : String(l[col] || '').toLowerCase());
    ls = [...ls].sort((x, y) => { const a = val(x), c = val(y); return (a < c ? -1 : a > c ? 1 : 0) * dir; });
    return { ls, lim };
  }
  const fora = (l, lim) => lim.aplicado && (precoVis(l) < lim.lo || precoVis(l) > lim.hi);

  function renderResultados() {
    const el = sec('pq-res');
    if (!el) return;
    if (!b.linhas.length) {
      el.innerHTML = b.resumo.length && !b.rodando
        ? CP.ui.vazio('Nenhum preço encontrado', 'Amplie o período, remova o filtro de UF ou inclua outras fontes. Para materiais, experimente pesquisar o PDM inteiro em vez de um item específico.')
        : b.rodando ? '' : CP.ui.vazio('Os preços aparecem aqui', 'Escolha ao menos um código do catálogo (ou informe um texto para as notas fiscais) e clique em “Pesquisar preços”.');
      return;
    }
    const uns = unidadesDisponiveis();
    const { ls, lim } = filtradas();
    const r = CP.stats.resumo(ls.map(precoVis));
    const paginas = Math.max(1, Math.ceil(ls.length / POR_PAGINA));
    if (b.pagina > paginas) b.pagina = paginas;
    const vis = ls.slice((b.pagina - 1) * POR_PAGINA, b.pagina * POR_PAGINA);
    const selVis = ls.filter((l) => b.sel.has(l.uid)).length;
    const seta = (c) => (b.ordem.col === c ? (b.ordem.dir > 0 ? ' ▲' : ' ▼') : '');
    const th = (c, t, cls = '') => `<th class="${cls}"><button type="button" data-acao="ordenar" data-col="${c}">${t}${seta(c)}</button></th>`;
    const comRef = !!refDesc();
    const rotPreco = porBase() && b.unidade !== '*' && b.unidade !== '(sem unidade)' ? `Preço por ${U.esc(b.unidade)}` : 'Preço unit.';
    el.innerHTML = `
      <header><h3>Resultados</h3><span class="small muted">${U.plural(b.linhas.length, 'preço', 'preços')} no total, ${U.fmtInt(ls.length)} exibidos</span>
        <div class="acoes">${comRef ? '<button type="button" class="btn" data-acao="comparaveis">Selecionar comparáveis</button>' : ''}<button type="button" class="btn" data-acao="exportar-csv">Exportar CSV</button><button type="button" class="btn primario" data-acao="enviar-cesta" ${b.sel.size ? '' : 'disabled'}>Adicionar ${U.fmtInt(b.sel.size)} à cesta</button></div></header>
      <div class="chips" aria-label="Unidade">${uns.slice(0, 10).map((u) => `<button type="button" class="chip ${b.unidade === u.k ? 'ativo' : ''}" data-acao="unidade" data-k="${U.esc(u.k)}">${U.esc(u.rot)} <span class="muted">(${u.n})</span></button>`).join('')}<button type="button" class="chip ${b.unidade === '*' ? 'ativo' : ''}" data-acao="unidade" data-k="*">Todas as unidades</button></div>
      ${b.unidade === '*' && uns.length > 1 ? '<div class="aviso">Há unidades diferentes misturadas. Estatísticas só fazem sentido dentro da mesma unidade.</div>' : ''}
      <div class="linha" style="margin-top:10px"><label class="f grow"><span>Filtrar resultados</span><input id="pq-filtro" value="${U.esc(b.filtro)}" placeholder="descrição, fornecedor, órgão, UF, marca"></label>
        <label class="check" title="Converte caixas, pacotes e rolos para a unidade-base (por exemplo, CX 50 UN vira preço por UN)"><input type="checkbox" id="pq-base" ${porBase() ? 'checked' : ''}> Preço por unidade-base</label>
        <label class="check"><input type="checkbox" id="pq-fora" ${b.ocultarFora ? 'checked' : ''}> Ocultar fora da faixa</label></div>
      <div class="stats" aria-label="Estatísticas dos preços exibidos">
        ${[['Amostras', U.fmtInt(r.n)], ['Mínimo', U.fmtPrice(r.min)], ['1º quartil', U.fmtPrice(r.q1)], ['Mediana', U.fmtPrice(r.mediana)], ['Média', U.fmtPrice(r.media)], ['3º quartil', U.fmtPrice(r.q3)], ['Máximo', U.fmtPrice(r.max)], ['Coef. de variação', U.fmtPct(r.cv)]].map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}
      </div>
      <div id="pq-regua"></div>
      ${CP.graficos.legenda(true, false)}
      <p class="small muted" style="margin:4px 0 0">Faixa calculada pelo critério padrão (${U.esc(CP.stats.CRITERIOS[criterioPadrao().tipo])}). Na cesta, cada item pode usar outro critério.</p>
      <details style="margin:8px 0 12px"><summary class="small">Preços ao longo do tempo</summary><div id="pq-tempo"></div></details>
      <div class="tabela-wrap"><table class="t"><thead><tr>
        <th><input type="checkbox" id="pq-todos" aria-label="Selecionar todos os exibidos" ${selVis && selVis === ls.length ? 'checked' : ''}></th>
        ${th('origem', 'Fonte')}${th('data', 'Data')}${th('descricao', 'Descrição')}${comRef ? th('sim', 'Semelhança', 'num') : ''}${th('unidade', 'Unid.')}${th('qtd', 'Qtd.', 'num')}${th('preco', rotPreco, 'num')}${th('fornecedor', 'Fornecedor')}${th('orgao', 'Órgão')}${th('uf', 'UF')}<th></th></tr></thead>
        <tbody>${vis.map((l) => { const s = comRef ? simDe(l) : null; const pv = precoVis(l); return `<tr class="${b.sel.has(l.uid) ? 'sel' : ''}">
          <td><input type="checkbox" data-sel="${l.uid}" ${b.sel.has(l.uid) ? 'checked' : ''} aria-label="Selecionar"></td>
          <td><span class="src src-${l.origem}">${U.esc(CP.api.NOMES_FONTE[l.origem] || l.origem)}</span>${l.tipoValor === 'estimado' ? '<span class="sub">estimado</span>' : ''}</td>
          <td class="nowrap tnum">${U.fmtDate(l.data)}</td>
          <td class="desc"><span class="clamp">${U.esc(l.descricao)}</span>${l.marca ? `<span class="sub">Marca: ${U.esc(l.marca)}</span>` : ''}${s && s.diverge.length ? `<span class="sub" style="color:var(--red)">Diverge: ${U.esc(s.diverge.join('; '))}</span>` : ''}</td>
          ${comRef ? `<td class="num" title="${U.esc(s && s.confere.length ? 'Confere: ' + s.confere.join(', ') : '')}">${s ? U.fmtPct(s.score, 0) : '—'}</td>` : ''}
          <td>${U.esc(l.unidade)}</td><td class="num">${U.fmtQtd(l.quantidade)}</td>
          <td class="num preco" ${fora(l, lim) ? 'style="color:var(--red)" title="Fora da faixa do critério padrão"' : ''}>${U.fmtPrice(pv)}${pv !== l.preco ? `<span class="sub">${U.fmtPrice(l.preco)} por ${U.esc(l.unidade)}</span>` : ''}</td>
          <td><span class="clamp">${U.esc(l.fornecedor)}</span></td><td><span class="clamp">${U.esc(l.orgao)}</span></td><td>${U.esc(l.uf)}</td>
          <td><button type="button" class="btn leve pq" data-acao="detalhe" data-uid="${l.uid}" aria-label="Detalhes">Detalhes</button></td></tr>`; }).join('')}</tbody></table></div>
      <div class="pag"><span>Página ${b.pagina} de ${paginas}</span><button type="button" class="btn pq" data-acao="pag" data-d="-1" ${b.pagina <= 1 ? 'disabled' : ''}>Anterior</button><button type="button" class="btn pq" data-acao="pag" data-d="1" ${b.pagina >= paginas ? 'disabled' : ''}>Próxima</button></div>`;
    desenharGraficos(ls, lim, r);
  }
  function desenharGraficos(ls, lim, r) {
    const rg = sec('pq-regua'), tp = sec('pq-tempo');
    if (rg) rg.innerHTML = CP.graficos.regua(ls.map((l) => ({ v: precoVis(l), x: fora(l, lim) })), { limites: lim, mediana: r.mediana, largura: CP.graficos.largura(rg) });
    if (tp) tp.innerHTML = CP.graficos.linhaTempo(ls.map((l) => ({ d: l.data, v: precoVis(l), x: fora(l, lim) })), { largura: CP.graficos.largura(rg) }) || '<p class="small muted">Datas insuficientes para o gráfico.</p>';
  }

  /* ---------- ações ---------- */
  function adicionarChip(c) {
    if (b.chips.some((x) => x.tipo === c.tipo && x.nivel === c.nivel && x.codigo === c.codigo)) { CP.ui.toast('Este código já está na pesquisa.'); return; }
    b.chips.push(c);
    if (!b.textoNfe && c.descricao) b.textoNfe = c.descricao.split(/[,;]/)[0].slice(0, 60).trim();
    persistir(); renderForm();
    CP.ui.toast(`${c.tipo === 'S' ? 'CATSER' : c.nivel === 'pdm' ? 'PDM' : 'CATMAT'} ${c.codigo} adicionado à pesquisa.`, 'ok', 2600);
  }
  async function buscarCatalogo() {
    const termo = b.termo.trim();
    const cat = b.cat;
    if (!termo) return;
    if (/^\d{3,9}$/.test(termo)) {
      cat.carregando = true; cat.msg = 'Consultando o código no catálogo…'; renderCatalogo();
      try {
        const it = b.tipo === 'S' ? await CP.api.catalogo.itemServico(termo) : await CP.api.catalogo.itemMaterial(termo);
        cat.carregando = false;
        if (it) { cat.msg = ''; adicionarChip(it); }
        else {
          cat.msg = '';
          renderCatalogo();
          const pdm = b.tipo === 'M' && CP.state.catalogo.pdm.find((p) => String(p[0]) === termo);
          CP.ui.modal({ titulo: 'Código não encontrado como item', corpo: `<p>O código ${U.esc(termo)} não foi encontrado como item ${b.tipo === 'S' ? 'CATSER' : 'CATMAT'} ativo.${pdm ? ` Ele corresponde ao PDM “${U.esc(pdm[1])}”.` : ''}</p><p>Você pode usá-lo assim mesmo; a consulta de preços dirá se há registros.</p>`, acoes: [{ rotulo: 'Cancelar' }, ...(b.tipo === 'M' ? [{ rotulo: 'Usar como PDM', acao: () => adicionarChip({ tipo: 'M', nivel: 'pdm', codigo: termo, descricao: pdm ? pdm[1] : '' }) }] : []), { rotulo: 'Usar como item', primario: true, acao: () => adicionarChip({ tipo: b.tipo, nivel: 'item', codigo: termo, descricao: '' }) }] });
        }
      } catch (e) {
        cat.carregando = false; cat.msg = '';
        renderCatalogo();
        if (e instanceof CP.http.RedeError) { CP.conexao.notificarFalha(); return; }
        CP.ui.modal({ titulo: 'Catálogo indisponível', corpo: `<p>${U.esc(CP.http.explicar(e))}</p><p>Você pode adicionar o código sem validação; a pesquisa de preços tentará usá-lo.</p>`, acoes: [{ rotulo: 'Cancelar' }, { rotulo: 'Adicionar sem validar', primario: true, acao: () => adicionarChip({ tipo: b.tipo, nivel: 'item', codigo: termo, descricao: '' }) }] });
      }
      renderCatalogo();
      return;
    }
    if (!CP.state.catalogo.baixadoEm) { await baixarIndice(); if (!CP.state.catalogo.baixadoEm) return; }
    cat.modo = 'lista';
    cat.resultados = CP.api.catalogo.buscarLocal(termo, b.tipo);
    cat.msg = cat.resultados.length ? '' : 'Nada encontrado no índice. Tente termos mais curtos (ex.: “caneta” em vez de “canetas esferográficas”).';
    renderCatalogo();
  }
  async function abrirPdm(cod) {
    const cat = b.cat;
    const p = cat.resultados.find((r) => r.codigo === cod) || { codigo: cod, descricao: '' };
    cat.carregando = true; cat.msg = 'Carregando os itens do PDM…'; renderCatalogo();
    try {
      cat.itens = await CP.api.catalogo.itensDoPdm(cod);
      cat.pdm = p; cat.modo = 'itens'; cat.filtro = '';
    } catch (e) { CP.ui.toast(CP.http.explicar(e), 'erro', 8000); }
    cat.carregando = false; cat.msg = ''; renderCatalogo();
  }
  async function baixarIndice() {
    const cat = b.cat;
    const ctrl = new AbortController();
    cat.carregando = true; cat.msg = 'Baixando o índice do catálogo…'; cat.prog = 0; renderCatalogo();
    try {
      await CP.api.catalogo.baixarIndice((nome, p, tp) => { cat.msg = `Baixando ${nome}: página ${p} de ${tp}`; cat.prog = tp ? p / tp : 0; renderCatalogo(); }, ctrl.signal);
      CP.ui.toast('Índice do catálogo baixado.', 'ok');
      cat.msg = '';
    } catch (e) { cat.msg = CP.http.explicar(e); if (e instanceof CP.http.RedeError) CP.conexao.notificarFalha(); else CP.ui.toast(cat.msg, 'erro', 9000); }
    cat.carregando = false; renderCatalogo();
  }

  async function pesquisar() {
    if (b.rodando) return;
    const f = b.filtros;
    if (!f.de || !f.ate || f.de > f.ate) { CP.ui.toast('Informe um período válido (data inicial anterior à final).', 'erro'); return; }
    const precisaCodigo = b.fontes.painel || b.fontes.pncp || b.fontes.arp;
    const temTexto = !!b.textoNfe.trim();
    if (!b.chips.length && !(temTexto && (b.fontes.nfePortal || b.fontes.nfeLocal))) {
      CP.ui.toast(precisaCodigo ? 'Escolha ao menos um código do catálogo para Painel, PNCP e atas, ou informe o texto e marque uma fonte de notas fiscais.' : 'Informe o texto para as notas fiscais.', 'erro', 7000);
      return;
    }
    b.rodando = true; b.ctrl = new AbortController(); b.linhas = []; b.sel = new Set(); b.pagina = 1; b.resumo = []; b.duplicados = 0;
    renderForm(); renderResultados();
    const atualizar = U.debounce(() => renderStatus(), 120);
    try {
      const r = await CP.api.pesquisar({ chips: b.chips, texto: b.textoNfe.trim(), filtros: { ...f }, fontes: b.fontes }, { signal: b.ctrl.signal }, (res) => { b.resumo = res; atualizar(); });
      b.linhas = r.linhas; b.resumo = r.resumo; b.duplicados = r.duplicados;
      const uns = unidadesDisponiveis();
      b.unidade = uns.length > 1 ? uns[0].k : '*';
      if (r.resumo.some((s) => s.tipoErro === 'RedeError')) CP.conexao.notificarFalha();
      const erros = r.resumo.filter((s) => s.estado === 'erro').length;
      CP.ui.toast(`${U.plural(r.linhas.length, 'preço encontrado', 'preços encontrados')}${erros ? `; ${erros} fonte(s) com falha` : ''}.`, erros ? 'erro' : 'ok');
    } catch (e) {
      if (e.name !== 'AbortError') CP.ui.toast(CP.http.explicar(e), 'erro', 8000);
      else CP.ui.toast('Pesquisa cancelada.');
    }
    b.rodando = false; b.ctrl = null;
    renderForm(); renderStatus(); renderResultados();
  }

  function detalhe(l) {
    const campos = [
      ['Fonte', `${CP.api.NOMES_FONTE[l.origem] || l.origem} (inciso ${l.parametro} do art. 23, §1º)`], ['Descrição', l.descricao], ['Descrição detalhada', l.descricaoDetalhada],
      ['Código de catálogo', l.codigo], ['Unidade', l.unidade], ['Quantidade', U.fmtQtd(l.quantidade)],
      ['Preço unitário', `${U.fmtPrice(l.preco)}${l.tipoValor === 'estimado' ? ' (valor estimado, sem resultado)' : ''}`], ['Maior desconto', U.isNum(l.desconto) ? U.fmtNum(l.desconto, 2) + '%' : ''],
      ['Data', U.fmtDate(l.data)], ['Fornecedor', `${l.fornecedor || '—'}${l.ni ? ' (' + U.fmtDoc(l.ni) + ')' : ''}`], ['Marca', l.marca],
      ['Órgão / unidade', `${l.orgao || '—'}${l.uasg ? ' (UASG ' + l.uasg + ')' : ''}`], ['Município / UF', [l.municipio, l.uf].filter(Boolean).join(' / ')], ['Esfera', l.esfera],
      ['Modalidade', l.modalidade], ['Forma', l.forma], ['Situação do item', l.situacao], ['Vigência da ata', l.vigencia], ['NCM', l.ncm], ['Referência', l.ref], ['Objeto da contratação', l.objeto],
      ['Consultado em', U.fmtDateTime(l.acessoEm)],
    ].filter(([, v]) => v && v !== '—' && v !== '— / —');
    const links = [l.url && `<a href="${U.esc(l.url)}" target="_blank" rel="noopener">${/pncp\.gov\.br/.test(l.url) ? 'Abrir no PNCP' : 'Abrir documento'}</a>`, l.urlCompra && `<a href="${U.esc(l.urlCompra)}" target="_blank" rel="noopener">Abrir a compra no Compras.gov.br</a>`].filter(Boolean).join(' &nbsp; ');
    CP.ui.modal({
      titulo: 'Detalhes do preço', largo: true,
      corpo: `<dl class="kv">${campos.map(([k, v]) => `<dt>${k}</dt><dd>${U.esc(v)}</dd>`).join('')}</dl>${links ? `<p style="margin-top:12px">${links}</p>` : ''}<details style="margin-top:10px"><summary class="small">Registro original da API</summary><pre>${U.esc(JSON.stringify(l.bruto, null, 2))}</pre></details>`,
      acoes: [{ rotulo: 'Fechar' }, { rotulo: 'Adicionar à cesta', primario: true, acao: () => { CP.cesta.dialogoAdicionar([l], sugestao()); } }],
    });
  }
  function sugestao() {
    const c = b.chips[0];
    const uns = unidadesDisponiveis();
    const un = b.unidade !== '*' ? (uns.find((u) => u.k === b.unidade) || {}).rot : '';
    return { descricao: c ? c.descricao : b.textoNfe, codigo: c ? c.codigo : '', tipo: c ? c.tipo : b.tipo, unidade: un && un !== '(sem unidade)' ? un : '' };
  }
  function exportarCSV() {
    const { ls } = filtradas();
    const cab = ['Fonte', 'Inciso', 'Data', 'Descrição', 'Código', 'Unidade', 'Quantidade', 'Preço unitário', 'Tipo de valor', 'Fornecedor', 'CNPJ/CPF', 'Órgão', 'UASG', 'Município', 'UF', 'Esfera', 'Marca', 'Referência', 'Link', 'Consultado em'];
    const linhas = ls.map((l) => [CP.api.NOMES_FONTE[l.origem] || l.origem, l.parametro, U.fmtDate(l.data), l.descricao, l.codigo, l.unidade, U.isNum(l.quantidade) ? l.quantidade : '', l.preco, l.tipoValor, l.fornecedor, U.fmtDoc(l.ni), l.orgao, l.uasg, l.municipio, l.uf, l.esfera, l.marca, l.ref, l.url || l.urlCompra, U.fmtDateTime(l.acessoEm)]);
    U.download(`precos-${U.slug(b.textoNfe || (b.chips[0] && b.chips[0].codigo) || 'pesquisa')}.csv`, CP.csv.gerar(cab, linhas), 'text/csv;charset=utf-8');
  }
  function importarJSON() {
    CP.ui.modal({
      titulo: 'Importar resposta JSON', largo: true,
      corpo: `<p class="small">Use quando o navegador bloquear a chamada direta: abra a consulta numa nova aba (link “Abrir a consulta no navegador”), salve a página como arquivo .json e importe aqui, ou cole o conteúdo.</p>
        <label class="f"><span>Arquivo</span><input type="file" id="imp-arq" accept=".json,application/json"></label>
        <label class="f" style="margin-top:10px"><span>Ou cole o JSON</span><textarea id="imp-txt" rows="8" placeholder='{"resultado":[...]}'></textarea></label>`,
      acoes: [{ rotulo: 'Cancelar' }, { rotulo: 'Importar', primario: true, acao: async (c) => {
        try {
          const f = c.querySelector('#imp-arq').files[0];
          const txt = f ? await U.lerTexto(f) : c.querySelector('#imp-txt').value;
          const novas = CP.api.importarJSON(JSON.parse(txt));
          b.linhas = b.linhas.concat(novas);
          b.pagina = 1;
          renderResultados();
          CP.ui.toast(`${U.plural(novas.length, 'preço importado', 'preços importados')}.`, 'ok');
        } catch (e) { CP.ui.toast(e.message || String(e), 'erro', 8000); return false; }
      } }],
    });
  }

  /* ---------- eventos ---------- */
  function ligar() {
    const r = raiz();
    CP.ui.on(r, 'click', '[data-acao]', (e, t) => {
      const a = t.dataset.acao;
      if (a === 'tipo') { b.tipo = t.dataset.v; b.cat = { ...b.cat, modo: 'lista', resultados: [], msg: '' }; persistir(); renderCatalogo(); }
      else if (a === 'baixar-indice') baixarIndice();
      else if (a === 'cat-itens') abrirPdm(t.dataset.cod);
      else if (a === 'cat-voltar') { b.cat.modo = 'lista'; renderCatalogo(); }
      else if (a === 'chip-pdm') { const p = b.cat.resultados.find((x) => x.codigo === t.dataset.cod) || b.cat.pdm || {}; adicionarChip({ tipo: 'M', nivel: 'pdm', codigo: t.dataset.cod, descricao: p.descricao || '', codigoClasse: p.codigoClasse, codigoGrupo: p.codigoGrupo }); }
      else if (a === 'chip-item') { const it = b.cat.itens.find((x) => x.codigo === t.dataset.cod); if (it) adicionarChip(it); }
      else if (a === 'chip-serv') { const s = b.cat.resultados.find((x) => x.codigo === t.dataset.cod); if (s) adicionarChip(s); }
      else if (a === 'chip-remover') { b.chips.splice(Number(t.dataset.i), 1); persistir(); renderForm(); }
      else if (a === 'periodo') { const ref = CP.state.projeto.dataReferencia || U.todayISO(); b.filtros.ate = ref; b.filtros.de = U.addMonths(ref, -Number(t.dataset.m)); persistir(); renderForm(); }
      else if (a === 'pesquisar') pesquisar();
      else if (a === 'cancelar') { if (b.ctrl) b.ctrl.abort(); }
      else if (a === 'importar-json') importarJSON();
      else if (a === 'unidade') { b.unidade = t.dataset.k; b.pagina = 1; renderResultados(); }
      else if (a === 'ordenar') { const c = t.dataset.col; b.ordem = { col: c, dir: b.ordem.col === c ? -b.ordem.dir : 1 }; renderResultados(); }
      else if (a === 'pag') { b.pagina += Number(t.dataset.d); renderResultados(); }
      else if (a === 'detalhe') { const l = b.linhas.find((x) => x.uid === t.dataset.uid); if (l) detalhe(l); }
      else if (a === 'enviar-cesta') { const sel = b.linhas.filter((l) => b.sel.has(l.uid)); if (sel.length) CP.cesta.dialogoAdicionar(sel, sugestao(), () => { b.sel = new Set(); renderResultados(); }); }
      else if (a === 'modo') { b.modo = t.dataset.v; persistir(); render(); }
      else if (a === 'comparaveis') {
        const { ls } = filtradas();
        const lim = U.isNum(CP.state.settings.limiarSemelhanca) ? CP.state.settings.limiarSemelhanca : 0.5;
        let n = 0;
        for (const l of ls) { const s = simDe(l); if (s && s.score >= lim && !s.diverge.length) { b.sel.add(l.uid); n++; } }
        renderResultados();
        CP.ui.toast(`${U.plural(n, 'preço comparável selecionado', 'preços comparáveis selecionados')}.`, 'ok');
      }
      else if (a === 'exportar-csv') exportarCSV();
    });
    r.addEventListener('submit', (e) => { if (e.target.id === 'pq-cat-form') { e.preventDefault(); b.termo = sec('pq-termo').value; persistir(); buscarCatalogo(); } });
    r.addEventListener('input', (e) => {
      const t = e.target;
      if (t.id === 'pq-termo') { b.termo = t.value; persistir(); }
      else if (t.id === 'pq-texto') { b.textoNfe = t.value; persistir(); }
      else if (t.id === 'pq-cat-filtro') { b.cat.filtro = t.value; refazerFiltroCat(); }
      else if (t.id === 'pq-filtro') { b.filtro = t.value; b.pagina = 1; refazerResultados(); }
    });
    r.addEventListener('change', (e) => {
      const t = e.target;
      if (t.id === 'pq-de') b.filtros.de = t.value;
      else if (t.id === 'pq-ate') b.filtros.ate = t.value;
      else if (t.id === 'pq-uf') b.filtros.uf = t.value;
      else if (t.id === 'pq-esfera') b.filtros.esfera = t.value;
      else if (t.id === 'pq-homolog') b.filtros.somenteHomologados = t.checked;
      else if (t.id === 'pq-estim') b.filtros.incluirEstimados = t.checked;
      else if (t.dataset.fonte) b.fontes[t.dataset.fonte] = t.checked;
      else if (t.id === 'pq-cat-inativos') { b.cat.inativos = t.checked; renderCatalogo(); return; }
      else if (t.id === 'pq-base') { b.porBase = t.checked; const uns = unidadesDisponiveis(); b.unidade = uns.length > 1 ? uns[0].k : '*'; b.pagina = 1; persistir(); renderResultados(); return; }
      else if (t.id === 'pq-fora') { b.ocultarFora = t.checked; b.pagina = 1; renderResultados(); return; }
      else if (t.id === 'pq-todos') { const { ls } = filtradas(); ls.forEach((l) => (t.checked ? b.sel.add(l.uid) : b.sel.delete(l.uid))); renderResultados(); return; }
      else if (t.dataset.sel) { if (t.checked) b.sel.add(t.dataset.sel); else b.sel.delete(t.dataset.sel); t.closest('tr').classList.toggle('sel', t.checked); atualizarBotaoCesta(); return; }
      else return;
      persistir();
    });
  }
  const refazerFiltroCat = U.debounce(() => { const el = sec('pq-cat-filtro'); const pos = el ? el.selectionStart : 0; renderCatalogo(); const n = sec('pq-cat-filtro'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 200);
  const refazerResultados = U.debounce(() => { const pos = sec('pq-filtro') ? sec('pq-filtro').selectionStart : 0; renderResultados(); const n = sec('pq-filtro'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250);
  function atualizarBotaoCesta() { const bt = raiz().querySelector('[data-acao="enviar-cesta"]'); if (bt) { bt.disabled = !b.sel.size; bt.textContent = `Adicionar ${U.fmtInt(b.sel.size)} à cesta`; } }

  function iniciar() { estadoInicial(); ligar(); CP.bus.on('nfe', () => { if (!b.rodando && raiz().innerHTML) renderForm(); }); }
  function mostrar() { render(); }
  function redimensionar() { if (b && b.linhas.length) { const { ls, lim } = filtradas(); desenharGraficos(ls, lim, CP.stats.resumo(ls.map(precoVis))); } }
  return { iniciar, mostrar, redimensionar, estado: () => b, pesquisar, adicionarChip, filtradas, salvarBusca: () => persistir(), precoVis, chaveUn };
})();

/* ===== 085-ui-lote.js ===== */
/* Pesquisa assistida (um item) e em lote (lista de itens). O sistema casa a descrição com o catálogo,
   pesquisa nas fontes e envia à cesta somente os preços comparáveis (mesmo código ou descrição
   semelhante e unidade conversível). Tudo fica como sugestão revisável na cesta. */
CP.lote = (() => {
  const U = CP.util;
  const esc = U.esc;
  const P = () => CP.state.projeto;
  const cfg = () => CP.state.settings;
  const raiz = () => document.getElementById('tab-pesquisa');
  const sec = (id) => document.getElementById(id);
  const UFS = ['AC', 'AL', 'AM', 'AP', 'BA', 'CE', 'DF', 'ES', 'GO', 'MA', 'MG', 'MS', 'MT', 'PA', 'PB', 'PE', 'PI', 'PR', 'RJ', 'RN', 'RO', 'RR', 'RS', 'SC', 'SE', 'SP', 'TO'];
  const cacheItens = new Map();
  let ctrl = null;
  let leitura = null;
  const as = { desc: '', tipo: 'M', unidade: '', quantidade: 1, etapas: [], cands: null, pausa: false, rodando: false, itemId: null };
  const rotCod = (c) => (c ? `${c.tipo === 'S' ? 'CATSER' : c.nivel === 'pdm' ? 'PDM' : 'CATMAT'} ${c.codigo}` : 'Sem código');
  const limiar = () => (U.isNum(cfg().limiarSemelhanca) ? cfg().limiarSemelhanca : 0.5);

  /* ---------- motor ---------- */
  async function itensPdm(cod, signal) {
    if (!cacheItens.has(cod)) cacheItens.set(cod, await CP.api.catalogo.itensDoPdm(cod, signal));
    return cacheItens.get(cod);
  }
  async function casar(desc, tipo = 'M', signal) {
    if (!CP.state.catalogo.baixadoEm) await CP.api.catalogo.baixarIndice(null, signal);
    const base = CP.texto.rankCatalogo(desc, tipo, 4);
    if (tipo === 'S') {
      return base.map((s) => { const sim = CP.texto.similaridade(desc, s.descricao); return { ...s, sim, score: 0.5 * s.score + 0.5 * sim.score }; }).sort((a, b) => b.score - a.score);
    }
    const out = [];
    for (const p of base.filter((x) => x.score >= 0.5).slice(0, 2)) {
      let itens = [];
      try { itens = await itensPdm(p.codigo, signal); } catch (e) { if (e.name === 'AbortError' || e instanceof CP.http.RedeError) throw e; }
      for (const it of itens) {
        if (!it.ativo) continue;
        const sim = CP.texto.similaridade(desc, it.descricao);
        out.push({ ...it, sim, score: 0.35 * p.score + 0.65 * sim.score });
      }
      out.push({ tipo: 'M', nivel: 'pdm', codigo: p.codigo, descricao: p.descricao, codigoClasse: p.codigoClasse, codigoGrupo: p.codigoGrupo, sim: null, score: 0.35 * p.score + 0.65 * 0.55 });
    }
    out.sort((a, b) => b.score - a.score);
    // especificação genérica: itens empatados e nenhum atributo confirmado → pesquisar o produto (PDM) inteiro
    const itens = out.filter((x) => x.nivel === 'item');
    if (itens.length >= 3 && itens[0].score - itens[2].score < 0.03 && !(itens[0].sim && itens[0].sim.confere.length)) {
      const pdm = out.find((x) => x.nivel === 'pdm');
      if (pdm) { out.splice(out.indexOf(pdm), 1); out.unshift({ ...pdm, score: Math.max(pdm.score, itens[0].score) }); }
    }
    return out.slice(0, 5);
  }
  function confianca(c) {
    if (!c || !c.length) return 'nenhuma';
    const t = c[0], seg = c[1];
    if (t.sim && t.sim.diverge.length) return 'baixa';
    if (t.score >= 0.7 && (!seg || t.nivel === 'pdm' || t.score - seg.score >= 0.04)) return 'alta';
    return t.score >= 0.5 ? 'média' : 'baixa';
  }
  const compacto = (c) => ({ tipo: c.tipo, nivel: c.nivel, codigo: String(c.codigo), descricao: String(c.descricao || '').slice(0, 500), score: c.score, confere: c.sim ? c.sim.confere : [], diverge: c.sim ? c.sim.diverge : [], codigoClasse: c.codigoClasse, codigoGrupo: c.codigoGrupo, ncm: c.ncm || '' });
  const textoBusca = (desc) => CP.texto.palavras(desc).slice(0, 5).join(' ');

  function avaliar(l, item, chip) {
    const mesmo = !!(chip && chip.nivel === 'item' && String(l.codigo) === String(chip.codigo));
    const sim = CP.texto.similaridade(item.descricao, l.descricao);
    const conv = item.unidade ? (l.unidade ? CP.units.converter(l.unidade, item.unidade) || (CP.units.key(l.unidade) === CP.units.key(item.unidade) ? { fator: 1 } : null) : null) : { fator: 1 };
    return { mesmo, sim, conv };
  }
  function selecionar(linhas, item, chip) {
    const ok = [];
    for (const l of linhas) {
      if (!(l.preco > 0) || l.tipoValor === 'estimado') continue;
      const v = avaliar(l, item, chip);
      if (!v.conv) continue;
      if (!v.mesmo && (v.sim.score < limiar() || v.sim.diverge.length)) continue;
      if (v.mesmo && v.sim.diverge.length && v.sim.score < limiar()) continue;
      ok.push({ l, v });
    }
    ok.sort((a, b) => (b.v.mesmo - a.v.mesmo) || (b.v.sim.score - a.v.sim.score) || String(b.l.data || '').localeCompare(String(a.l.data || '')));
    return ok.slice(0, 150).map((x) => x.l);
  }
  function unidadeSugerida(linhas, item, chip) {
    const cont = new Map();
    for (const l of linhas) {
      if (!l.unidade || !(l.preco > 0)) continue;
      const v = avaliar(l, { ...item, unidade: '' }, chip);
      if (!v.mesmo && v.sim.score < limiar()) continue;
      const b = CP.units.base(l.unidade);
      if (b) cont.set(b.rotulo, (cont.get(b.rotulo) || 0) + 1);
    }
    return [...cont.entries()].sort((a, b) => b[1] - a[1]).map((x) => x[0])[0] || '';
  }
  async function processar(linha, chip, signal, aoStatus) {
    const b = CP.pesquisa.estado();
    const filtros = { ...b.filtros, somenteHomologados: true, incluirEstimados: false };
    const r = await CP.api.pesquisar({ chips: chip ? [chip] : [], texto: textoBusca(linha.descricao), filtros, fontes: { ...b.fontes } }, { signal }, aoStatus);
    let item = linha.itemId ? P().itens.find((i) => i.id === linha.itemId) : null;
    if (item && linha.refazer) item.amostras = item.amostras.filter((a) => a.origem === 'manual');
    if (!item) {
      item = CP.cesta.novoItem({ descricao: linha.descricao, unidade: linha.unidade || '', quantidade: U.isNum(linha.quantidade) && linha.quantidade > 0 ? linha.quantidade : 1, tipo: linha.tipo || (chip ? chip.tipo : 'M'), codigo: chip ? String(chip.codigo) : '' });
      linha.itemId = item.id;
    }
    if (!item.unidade) item.unidade = unidadeSugerida(r.linhas, item, chip);
    const sel = selecionar(r.linhas, item, chip);
    const ad = CP.cesta.adicionarLinhas(item, sel);
    if (!String(item.justificativa || '').trim()) item.justificativaAuto = true;
    const an = CP.cesta.analisar(item);
    if (CP.cesta.sincronizarJustificativa(item, an)) CP.salvar.projeto();
    const pend = CP.conformidade.pendencias(CP.conformidade.item(item, an, cfg()));
    return { itemId: item.id, encontrados: r.linhas.length, selecionados: ad.n, valor: an.estimativa.unitario, nValidas: an.nValidas, alertas: pend.length, falhas: r.resumo.filter((s) => s.estado === 'erro').map((s) => s.erro) };
  }

  /* ---------- planilhas ---------- */
  async function lerXlsx(buf) {
    const ents = CP.nfe.lerZip(buf);
    const ler = async (nome) => { const e = ents.find((x) => x.nome === nome); return e ? new TextDecoder('utf-8').decode(await CP.nfe.inflar(e)) : null; };
    const xml = (t) => new DOMParser().parseFromString(t, 'application/xml');
    const todos = (d, n) => Array.from(d.getElementsByTagNameNS('*', n));
    const ss = await ler('xl/sharedStrings.xml');
    const strings = ss ? todos(xml(ss), 'si').map((si) => todos(si, 't').map((t) => t.textContent).join('')) : [];
    const folhas = ents.map((e) => e.nome).filter((n) => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a, b) => Number(a.match(/(\d+)\.xml$/)[1]) - Number(b.match(/(\d+)\.xml$/)[1]));
    if (!folhas.length) throw new Error('A planilha não tem abas legíveis.');
    const d = xml(await ler(folhas[0]));
    const col = (ref) => { const m = /^([A-Z]+)/.exec(ref || ''); if (!m) return -1; let n = 0; for (const ch of m[1]) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
    const linhas = todos(d, 'row').map((r) => {
      const out = [];
      let prox = 0;
      for (const c of todos(r, 'c')) {
        const t = c.getAttribute('t');
        const v = todos(c, 'v')[0];
        let val = '';
        if (t === 's') val = strings[Number(v && v.textContent)] ?? '';
        else if (t === 'inlineStr') val = todos(c, 't').map((x) => x.textContent).join('');
        else val = v ? v.textContent : '';
        const k = col(c.getAttribute('r'));
        out[k >= 0 ? k : prox] = val;
        prox = (k >= 0 ? k : prox) + 1;
      }
      return Array.from(out, (x) => (x == null ? '' : String(x)));
    }).filter((l) => l.some((x) => x.trim()));
    return { cabecalho: (linhas.shift() || []).map((s) => s.trim()), linhas };
  }
  const CAMPOS = [
    ['descricao', 'Descrição', /descri|especifica|objeto|produto|servi[cç]o/i],
    ['unidade', 'Unidade', /unid|^un\.?$|medida/i],
    ['quantidade', 'Quantidade', /qtd|quant/i],
    ['codigo', 'Código CATMAT/CATSER', /catmat|catser|c[oó]d/i],
    ['numero', 'Nº do item', /^item$|^n[º°o.]*$|n[uú]mero|^seq/i],
  ];
  function mapaPadrao() {
    const usados = new Set(), m = {};
    for (const [k, , re] of CAMPOS) {
      let idx = leitura.cabecalho.findIndex((h, i) => !usados.has(i) && re.test(h));
      if (k === 'descricao' && idx < 0) {
        const med = leitura.cabecalho.map((_, i) => leitura.linhas.reduce((s, l) => s + String(l[i] || '').length, 0));
        idx = med.indexOf(Math.max(...med));
      }
      if (idx >= 0) usados.add(idx);
      m[k] = idx;
    }
    return m;
  }

  /* ---------- pesquisa assistida ---------- */
  function controlesFiltro(p) {
    const b = CP.pesquisa.estado(), ref = P().dataReferencia || U.todayISO();
    const meses = [6, 12, 24].find((m) => b.filtros.de === U.addMonths(ref, -m) && b.filtros.ate === ref) || 0;
    return `<label class="f"><span>Período</span><select id="${p}-periodo">${[6, 12, 24].map((m) => `<option value="${m}" ${meses === m ? 'selected' : ''}>Últimos ${m} meses</option>`).join('')}${meses ? '' : `<option value="0" selected>${U.fmtDate(b.filtros.de)} a ${U.fmtDate(b.filtros.ate)}</option>`}</select></label>
      <label class="f"><span>UF</span><select id="${p}-uf"><option value="">Todas</option>${UFS.map((u) => `<option ${b.filtros.uf === u ? 'selected' : ''}>${u}</option>`).join('')}</select></label>`;
  }
  function andamento() {

    if (as.pausa && as.cands) {
      h += `<div class="aviso info"><p>Não há um código claramente correspondente. Escolha o que descreve o item ou siga sem código (só notas fiscais).</p></div><ul class="cat-lista">${as.cands.map((c, i) => `<li><div class="small">${esc(c.descricao)}</div><div class="meta">${esc(rotCod(c))}, semelhança ${U.fmtPct(c.score, 0)}${c.sim && c.sim.confere.length ? `; confere: ${esc(c.sim.confere.join(', '))}` : ''}${c.sim && c.sim.diverge.length ? `; diverge: ${esc(c.sim.diverge.join(', '))}` : ''}</div><div class="acoes"><button type="button" class="btn pq" data-acao="lt-usar" data-i="${i}">Usar este</button></div></li>`).join('')}<li><button type="button" class="btn pq leve" data-acao="lt-usar" data-i="-1">Seguir sem código</button></li></ul>`;
    }
