  const RE_NUM = new RegExp('(\\d+(?:[.,]\\d+)?)\\s*(' + Object.keys(UNID).sort((a, b) => b.length - a.length).join('|') + ')(?![a-z0-9])', 'g');
  const RE_COD = /\b(a[0-6]|rj ?45|rj ?11|usb ?(?:2|3|c)?|hdmi|vga|utp|ftp|stp|oled|led|lcd|ssd|hdd|ddr ?[2-5]|sata|nvme|bivolt|inox)\b/g;
  const RE_CAT = /\b(?:cat|categoria)\s*\.?\s*(\d+[a-z]?)\b/g;
  const RE_DIM = /\b(\d+(?:[.,]\d+)?)\s*x\s*(\d+(?:[.,]\d+)?)(?:\s*x\s*(\d+(?:[.,]\d+)?))?\b/g;
  const CORES = { azul: 'azul', preto: 'preto', preta: 'preto', branco: 'branco', branca: 'branco', vermelho: 'vermelho', vermelha: 'vermelho', verde: 'verde', amarelo: 'amarelo', amarela: 'amarelo', cinza: 'cinza', laranja: 'laranja', rosa: 'rosa', roxo: 'roxo', roxa: 'roxo', marrom: 'marrom', bege: 'bege', transparente: 'transparente', incolor: 'transparente', prata: 'prata', dourado: 'dourado', dourada: 'dourado' };

  function prep(s) {
    return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
      .replace(/²/g, '2').replace(/³/g, '3').replace(/["”]/g, ' pol ')
      .replace(/(\d)\s*g\s*\/\s*m\s*2/g, '$1 gm2')
      .replace(/(\d)\.(\d{3})(?!\d)/g, '$1$2')
      .replace(/[^a-z0-9.,/ ]+/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function atributos(texto) {
    const s = prep(texto);
    const nums = [], cods = new Set(), cores = new Set();
    let m;
    RE_NUM.lastIndex = 0;
    while ((m = RE_NUM.exec(s))) { const u = UNID[m[2]]; const v = U.parseNum(m[1]); if (u && v >= 0) nums.push({ dim: u[0], v: v * u[1], rotulo: m[0].trim() }); }
    for (const x of s.matchAll(RE_CAT)) cods.add('cat' + x[1]);
    for (const x of s.matchAll(RE_COD)) cods.add(x[1].replace(/\s/g, ''));
    for (const x of s.matchAll(RE_DIM)) cods.add('dim' + x.slice(1).filter(Boolean).map((v) => U.parseNum(v)).join('x'));
    for (const w of s.split(/[^a-z]+/)) if (CORES[w]) cores.add(CORES[w]);
    return { nums, cods, cores };
  }
  const familia = (c) => c.replace(/[\d.x]+[a-z]?$/, '');

  /* quanto da descrição de referência aparece na outra, com atributos que conferem ou divergem.
     divergencias traz cada diferença com o tipo: numero (medida com unidade), codigo (categoria,
     formato, padrão) ou cor; diverge mantém só os textos, para compatibilidade. */
  const cacheSim = new Map();
  function similaridade(ref, cand) {
    const chave = String(ref ?? '') + '\u0001' + String(cand ?? '');
    const memo = cacheSim.get(chave);
    if (memo) return memo;
    const A = [...new Set(palavras(ref))];
    const B = U.norm(cand).split(' ');
    let hit = 0;
    for (const t of A) if (B.some((w) => w.startsWith(t) || (t.length >= 4 && w.length >= 4 && t.startsWith(w)))) hit++;
    const cobertura = A.length ? hit / A.length : 0;
    const ra = atributos(ref), ca = atributos(cand);
    const confere = [], divergencias = [];
    const porDim = (l) => l.reduce((o, x) => { (o[x.dim] = o[x.dim] || []).push(x); return o; }, {});
    const dr = porDim(ra.nums), dc = porDim(ca.nums);
    for (const [dim, xs] of Object.entries(dr)) {
      if (!dc[dim]) continue;
      for (const x of xs) {
        const igual = dc[dim].some((y) => Math.abs(y.v - x.v) <= 0.01 * Math.max(Math.abs(x.v), Math.abs(y.v), 1e-9));
        if (igual) confere.push(x.rotulo); else divergencias.push({ tipo: 'numero', dim, texto: `${x.rotulo} ≠ ${dc[dim].map((y) => y.rotulo).join(' / ')}` });
      }
    }
    const nomeCod = (c) => c.replace(/^dim/, '').toUpperCase();
    for (const c of ra.cods) {
      if (ca.cods.has(c)) { confere.push(nomeCod(c)); continue; }
      const f = familia(c);
      const outro = [...ca.cods].find((k) => k !== c && f && familia(k) === f && /\d/.test(k));
      if (outro) divergencias.push({ tipo: c.startsWith('dim') ? 'numero' : 'codigo', dim: f, texto: `${nomeCod(c)} ≠ ${nomeCod(outro)}` });
    }
    if (ra.cores.size && ca.cores.size) {
      const comum = [...ra.cores].filter((c) => ca.cores.has(c));
      if (comum.length) confere.push(...comum); else divergencias.push({ tipo: 'cor', dim: 'cor', texto: `cor ${[...ra.cores].join('/')} ≠ ${[...ca.cores].join('/')}` });
    }
    const diverge = divergencias.map((d) => d.texto);
    const score = Math.max(0, Math.min(1, cobertura * (1 - 0.3 * Math.min(diverge.length, 3)) + 0.05 * Math.min(confere.length, 4)));
    const res = { score, cobertura, confere, diverge, divergencias };
    if (cacheSim.size > 5000) cacheSim.clear();
    cacheSim.set(chave, res);
    return res;
  }

  /* produtos (PDM) ou serviços do índice local mais prováveis para uma descrição livre */
  let cache = { chave: null };
  function tokens(tipo) {
    const c = CP.state.catalogo;
    if (cache.chave !== c.baixadoEm) cache = { chave: c.baixadoEm };
    const k = tipo === 'S' ? 'serv' : 'pdm';
    if (!cache[k]) cache[k] = (c[k] || []).map((r) => palavras(r[1]));
    return cache[k];
  }
  function rankCatalogo(descricao, tipo = 'M', limite = 5) {
    const c = CP.state.catalogo;
    const fonte = (tipo === 'S' ? c.serv : c.pdm) || [];
    const A = palavras(descricao);
    if (!A.length || !fonte.length) return [];
    const toks = tokens(tipo);
    const casa = (p) => A.some((a) => a.startsWith(p) || (p.length >= 4 && a.length >= 4 && p.startsWith(a)));
    const res = [];
    for (let i = 0; i < fonte.length; i++) {
      const P = toks[i];
      if (!P.length || !casa(P[0])) continue;
      let hit = 0;
      for (const p of P) if (casa(p)) hit++;
      let sc = hit / P.length + 0.02 * Math.min(hit, 4);
      if (A[0].startsWith(P[0]) || P[0].startsWith(A[0])) sc += 0.25;
      res.push([i, sc]);
    }
    res.sort((x, y) => y[1] - x[1] || fonte[x[0]][1].length - fonte[y[0]][1].length);
    return res.slice(0, limite).map(([i, sc]) => {
      const r = fonte[i];
      return tipo === 'S'
        ? { tipo: 'S', nivel: 'item', codigo: String(r[0]), descricao: r[1], codigoGrupo: r[2], codigoClasse: r[3], nomeClasse: r[4], score: Math.min(1, sc) }
        : { tipo: 'M', nivel: 'pdm', codigo: String(r[0]), descricao: r[1], codigoClasse: r[2], nomeClasse: r[3], codigoGrupo: r[4], score: Math.min(1, sc) };
    });
  }
  return { palavras, atributos, similaridade, rankCatalogo };
})();

/* ===== 02-stats.js ===== */
/* Motor estatístico e análise crítica da cesta de preços.
   Para cada amostra: prazo, unidade (com conversão), equivalência da descrição, escala de quantidade e
   duplicidade; depois a independência (uma por compra ou por fornecedor), o critério estatístico, as
   decisões do analista, o método de cálculo e o painel de sensibilidade. */
CP.stats = (() => {
  const U = CP.util;
  const asc = (v) => [...v].sort((a, b) => a - b);
  // quantil com interpolação linear (equivale a QUARTIL.INC do Excel)
  function quantil(s, p) {
    const n = s.length;
    if (!n) return NaN;
    if (n === 1) return s[0];
    const h = (n - 1) * p, lo = Math.floor(h), hi = Math.ceil(h);
    return s[lo] + (h - lo) * (s[hi] - s[lo]);
  }
  const media = (v) => (v.length ? v.reduce((a, b) => a + b, 0) / v.length : NaN);
  const mediana = (v) => quantil(asc(v), 0.5);
  function desvio(v) {
    if (v.length < 2) return NaN;
    const m = media(v);
    return Math.sqrt(v.reduce((a, x) => a + (x - m) ** 2, 0) / (v.length - 1));
  }
  function resumo(v) {
    const s = asc(v.filter(U.isNum));
    const n = s.length;
    const m = media(s), d = desvio(s);
    return { n, min: n ? s[0] : NaN, q1: quantil(s, 0.25), mediana: quantil(s, 0.5), media: m, q3: quantil(s, 0.75), max: n ? s[n - 1] : NaN, desvio: d, cv: n > 1 && m ? d / m : NaN };
  }

  /* ---------- critérios de saneamento ---------- */
  const CRITERIOS = {
    iqr: 'Intervalo interquartil (Tukey)',
    sigma: 'Média ± k desvios-padrão',
    mediana: 'Faixa percentual em torno da mediana',
    nenhum: 'Sem critério estatístico (somente exclusões manuais)',
  };
  function descreverCriterio(c) {
    if (!c || c.tipo === 'nenhum') return 'Sem critério estatístico automático: as exclusões são feitas manualmente pelo analista, com motivo registrado.';
    if (c.tipo === 'iqr') return `Intervalo interquartil (Tukey): desconsiderados os valores abaixo de Q1 − ${U.fmtNum(c.kIqr ?? 1.5, 2, 0)}×AIQ ou acima de Q3 + ${U.fmtNum(c.kIqr ?? 1.5, 2, 0)}×AIQ, sendo AIQ = Q3 − Q1.`;
    if (c.tipo === 'sigma') return `Média ± ${U.fmtNum(c.kSigma ?? 1, 2, 0)} desvio(s)-padrão: desconsiderados os valores fora do intervalo [μ − ${U.fmtNum(c.kSigma ?? 1, 2, 0)}σ; μ + ${U.fmtNum(c.kSigma ?? 1, 2, 0)}σ].`;
    if (c.tipo === 'mediana') return `Faixa relativa à mediana: desconsiderados os valores inferiores a ${U.fmtNum(c.inf ?? 50, 0)}% ou superiores a ${U.fmtNum(c.sup ?? 150, 0)}% da mediana do conjunto.`;
    return '';
  }
  // limites inferior/superior; com menos de 3 valores o critério não é aplicado
  function limites(vals, c) {
    const s = asc(vals.filter(U.isNum));
    if (s.length < 3 || !c || c.tipo === 'nenhum') return { lo: -Infinity, hi: Infinity, aplicado: false };
    if (c.tipo === 'iqr') { const q1 = quantil(s, 0.25), q3 = quantil(s, 0.75), k = c.kIqr ?? 1.5; return { lo: q1 - k * (q3 - q1), hi: q3 + k * (q3 - q1), aplicado: true }; }
    if (c.tipo === 'sigma') { const m = media(s), d = desvio(s), k = c.kSigma ?? 1; return { lo: m - k * d, hi: m + k * d, aplicado: true }; }
    if (c.tipo === 'mediana') { const md = quantil(s, 0.5); return { lo: (md * (c.inf ?? 50)) / 100, hi: (md * (c.sup ?? 150)) / 100, aplicado: true }; }
    return { lo: -Infinity, hi: Infinity, aplicado: false };
  }

  /* ---------- métodos de cálculo ---------- */
  const METODOS = { auto: 'Automático pelo coeficiente de variação', media: 'Média', mediana: 'Mediana', menor: 'Menor valor', ponderada: 'Média ponderada pela quantidade' };
  const NOME_METODO = { media: 'média', mediana: 'mediana', menor: 'menor valor', ponderada: 'média ponderada pela quantidade' };
  const COM_ARTIGO = { media: 'a média', mediana: 'a mediana', menor: 'o menor valor', ponderada: 'a média ponderada pela quantidade' };
  // pesos: quantidades na unidade do item, paralelas a vals (NaN quando não informadas)
  function estimar(vals, metodo, cvLimite = 0.25, pesos) {
    const idx = vals.map((_, i) => i).filter((i) => U.isNum(vals[i]));
    const s = asc(idx.map((i) => vals[i]));
    if (!s.length) return { valor: NaN, efetivo: null, cv: NaN };
    const m = media(s), md = quantil(s, 0.5), cv = s.length > 1 ? desvio(s) / m : 0;
    let ef = metodo || 'auto';
    if (ef === 'auto') ef = s.length > 1 && cv > cvLimite ? 'mediana' : 'media';
    if (ef === 'ponderada') {
      const ps = pesos ? idx.filter((i) => pesos[i] > 0) : [];
      if (!ps.length) return { valor: m, efetivo: 'media', cv, fallback: true, nPond: 0 };
      const soma = ps.reduce((a, i) => a + pesos[i], 0);
      return { valor: ps.reduce((a, i) => a + vals[i] * pesos[i], 0) / soma, efetivo: 'ponderada', cv, nPond: ps.length };
    }
    return { valor: ef === 'media' ? m : ef === 'mediana' ? md : s[0], efetivo: ef, cv };
  }

  function verificarPrazo(a, janelas, refISO) {
    const meses = janelas && janelas[a.parametro];
    if (!meses || !a.data || !refISO) return null;
    const limite = U.addMonths(refISO, -meses);
    if (a.data < limite) return `Fora do prazo do inciso ${a.parametro} (${U.fmtDate(a.data)}; admite-se até ${meses} meses antes de ${U.fmtDate(refISO)})`;
    return null;
  }
  // posição de um preço em relação às amostras válidas (percentil empírico)
  function posicao(valor, vals) {
    const s = asc(vals);
    if (!s.length || !U.isNum(valor)) return NaN;
    return s.filter((x) => x <= valor).length / s.length;
  }
  function fmtRazao(r) {
    if (!U.isNum(r)) return '—';
    const d = r >= 10 ? 0 : r >= 1 ? 1 : Math.min(4, Math.ceil(-Math.log10(r)) + 1);
    return U.fmtNum(r, d, 0) + '×';
  }

  /* ---------- motivos padronizados ---------- */
  const MOTIVOS_EXCLUSAO = [
    ['inexequivel', 'Preço inexequível'],
    ['excessivo', 'Preço excessivamente elevado'],
    ['inconsistente', 'Preço inconsistente com os demais'],
    ['nao-equivalente', 'Objeto não equivalente ao especificado'],
    ['unidade', 'Unidade ou embalagem incompatível'],
    ['quantidade', 'Quantidade ou escala não comparável'],
    ['condicoes', 'Condições comerciais distintas (frete, prazo, garantia)'],
    ['prazo', 'Data fora do prazo admitido'],
    ['fornecedor', 'Fornecedor sem lastro ou com restrição'],
    ['documento', 'Documento de origem incompleto ou sem validade'],
    ['duplicada', 'Registro repetido de outra amostra'],
    ['outro', 'Outro motivo'],
  ];
  const MOTIVOS_MANTER = [
    ['equivalente', 'Objeto verificado como equivalente'],
    ['mercado', 'Preço compatível com o mercado'],
    ['unica', 'Referência necessária pela escassez de preços'],
    ['outro', 'Outro motivo'],
  ];
  const ROT_EXCL = Object.fromEntries(MOTIVOS_EXCLUSAO), ROT_MANTER = Object.fromEntries(MOTIVOS_MANTER);
  // como cada motivo entra na justificativa ("2 por …")
  const NA_JUSTIFICATIVA = {
    prazo: 'data fora do prazo admitido', unidade: 'unidade de fornecimento incompatível', invalido: 'preço ausente ou inválido',
    'nao-equivalente': 'objeto não equivalente ao especificado', quantidade: 'quantidade de aquisição fora da escala considerada',
    duplicada: 'registro repetido de outra amostra', independencia: 'mais de uma amostra da mesma compra ou do mesmo fornecedor',
    inexequivel: 'preço inexequível', excessivo: 'preço excessivamente elevado', inconsistente: 'preço inconsistente com os demais',
    condicoes: 'condições comerciais distintas', fornecedor: 'fornecedor sem lastro ou com restrição', documento: 'documento de origem incompleto ou sem validade',
    outro: 'outros motivos registrados no mapa de preços',
  };
  function textoMotivoManual(a) {
    const tab = a.manual === 'incluir' ? ROT_MANTER : ROT_EXCL;
    const det = String(a.motivo || '').trim();
    if (a.motivoCod && a.motivoCod !== 'outro' && tab[a.motivoCod]) return tab[a.motivoCod] + (det ? ': ' + det : '');
    return det;
  }
  const motivoRegistrado = (a) => !!((a.motivoCod && a.motivoCod !== 'outro' && (a.manual === 'incluir' ? ROT_MANTER : ROT_EXCL)[a.motivoCod]) || String(a.motivo || '').trim());

  /* ---------- identidade da compra, do fornecedor e do órgão ---------- */
  function chaveCompra(a) {
    if (a.idCompra) return 'c' + a.idCompra;
    if (a.chave) return 'n' + a.chave;
    const r = String(a.referencia || '');
    let m = r.match(/NF-e\s+([0-9A-Z]{44})/);
    if (m) return 'n' + m[1];
    m = r.match(/^Compra\s+(\d{17})/);
    if (m) return 'c' + m[1];
    m = r.match(/^([0-9A-Z]{14}-\d+-\d+\/\d{4})/);
    if (m) return 'p' + m[1];
    m = r.match(/^Ata\s+([^,]+)/);
    return m ? 'a' + m[1].trim() : '';
  }
  function chaveItemCompra(a) {
    if (a.numeroItem !== undefined && a.numeroItem !== null && a.numeroItem !== '') return String(a.numeroItem);
    const m = String(a.referencia || '').match(/item\s+([^\s,]+)\s*$/i);
    return m ? m[1] : '';
  }
  function chaveFornecedor(a) {
    const d = U.onlyAlnum(a.niFornecedor);
    if (d.length >= 11) return 'd' + d;
    const n = U.norm(a.fornecedor);
    return n ? 'n' + n : '';
  }
  function chaveOrgao(a) {
    if (a.uasg) return 'u' + String(a.uasg);
    const n = U.norm(a.orgao);
    return n ? 'o' + n : '';
  }
  function chaveDuplicidade(a) {
    const ck = chaveCompra(a), fk = chaveFornecedor(a);
    if (!ck || !fk) return '';
    let ik = ck[0] === 'n' ? '' : chaveItemCompra(a);
    if (!ik) ik = 'd' + U.norm(a.descricao).slice(0, 80) + '|' + (U.isNum(a.preco) ? a.preco.toFixed(4) : '');
    return ck + '|' + ik + '|' + fk;
  }
  function rotuloCompra(a) {
    if (a.idCompra) return `compra ${a.idCompra}`;
    const r = String(a.referencia || '').replace(/,\s*item\s+\S+\s*$/i, '').trim();
    return r || 'compra não identificada';
  }
  const nomeFornecedor = (a) => a.fornecedor || U.fmtDoc(a.niFornecedor) || 'fornecedor não identificado';
  const nomeFonte = (a) => (CP.api && CP.api.NOMES_FONTE[a.origem]) || a.origem || 'fonte';

  /* ---------- etapa 1: fatos de cada amostra (não dependem do critério nem do método) ---------- */
  function preparar(item, cfg, refISO) {
    const unidadeItem = CP.units.key(item.unidade);
    const descItem = String(item.descricao || '').trim();
    const qItem = U.isNum(item.quantidade) && item.quantidade > 0 ? item.quantidade : NaN;
    const escala = { ativo: false, min: 0.1, max: 10, ...(cfg.escala || {}), ...(item.escala || {}) };
    const limiar = U.isNum(cfg.limiarSemelhanca) ? cfg.limiarSemelhanca : 0.5;
    const vistos = new Map();
    const linhas = item.amostras.map((a) => {
      const fator = U.isNum(a.fator) && a.fator > 0 ? a.fator : 1;
      const qualit = [], alertas = [];
      let conv = null, unidadeOk = true;
      const prazo = verificarPrazo(a, cfg.janelas, refISO);
      if (prazo) (cfg.excluirForaPrazo ? qualit : alertas).push({ cod: 'prazo', texto: prazo });
      if (unidadeItem && a.unidade && CP.units.key(a.unidade) !== unidadeItem) {
        conv = cfg.normalizarUnidades === false ? null : CP.units.converter(a.unidade, item.unidade);
        if (!conv) { unidadeOk = false; (cfg.excluirUnidadeDivergente ? qualit : alertas).push({ cod: 'unidade', texto: `Unidade divergente (${a.unidade} ≠ ${item.unidade})` }); }
      }
      const fConv = conv ? conv.fator : 1;
      const valor = U.isNum(a.preco) ? a.preco * fator * fConv : NaN;
      if (!(valor > 0)) qualit.push({ cod: 'invalido', texto: 'Preço ausente ou inválido' });
      if (a.parametro === 'III' && !a.acessoEm) alertas.push({ cod: 'acesso', texto: 'Informe data e hora de acesso ao sítio (art. 23, §1º, III, da Lei 14.133/2021)' });
      let sim = null;
      if (descItem && String(a.descricao || '').trim()) {
        sim = CP.texto.similaridade(descItem, a.descricao);
        const fortes = sim.divergencias.filter((d) => d.tipo !== 'cor');
        const cores = sim.divergencias.filter((d) => d.tipo === 'cor');
        if (fortes.length) (cfg.excluirDivergentes !== false ? qualit : alertas).push({ cod: 'nao-equivalente', texto: `Objeto possivelmente não equivalente: ${fortes.map((d) => d.texto).join('; ')}` });
        if (cores.length) alertas.push({ cod: 'cor', texto: `Cor diferente da especificada (${cores.map((d) => d.texto.replace(/^cor /, '')).join('; ')})` });
        if (!fortes.length && !cores.length && sim.score < limiar) alertas.push({ cod: 'semelhanca', texto: `Descrição pouco semelhante à do item (${U.fmtPct(sim.score, 0)})` });
      }
      let qtd = NaN, razao = NaN;
      if (unidadeOk && U.isNum(a.quantidade) && a.quantidade > 0) { qtd = a.quantidade / fConv; if (qItem > 0) razao = qtd / qItem; }
      if (escala.ativo && U.isNum(razao) && (razao < (escala.min ?? 0) * (1 - 1e-9) || razao > (escala.max ?? Infinity) * (1 + 1e-9))) {
        qualit.push({ cod: 'quantidade', texto: `Quantidade fora da escala considerada (${fmtRazao(razao)} da quantidade estimada; faixa de ${fmtRazao(escala.min)} a ${fmtRazao(escala.max)})` });
      }
      const kd = chaveDuplicidade(a);
      if (kd) {
        if (vistos.has(kd)) qualit.push({ cod: 'duplicada', texto: `Registro repetido: mesma compra, item e fornecedor de outra amostra (${vistos.get(kd)})` });
        else vistos.set(kd, `${nomeFonte(a)}${a.referencia ? ', ' + a.referencia : ''}`);
      }
      return { a, valor, fator, conversao: conv ? conv.texto : '', sim, qtd, razao, qualit, alertas, indep: null, auto: [], motivos: [], excluida: false, motivo: '' };
    });
    return { linhas, escala, unidadeItem, qItem };
  }

  /* ---------- etapa 2: independência (no máximo uma amostra por compra ou por fornecedor) ---------- */
  function aplicarIndependencia(linhas, modo) {
    if (modo !== 'compra' && modo !== 'fornecedor') return;
    const fn = modo === 'compra' ? chaveCompra : chaveFornecedor;
    const grupos = new Map();
    for (const l of linhas) {
      if (l.a.manual === 'excluir' || !(l.valor > 0)) continue;
      if (l.qualit.length && l.a.manual !== 'incluir') continue;
      const k = fn(l.a);
      if (!k) continue;
      if (!grupos.has(k)) grupos.set(k, []);
      grupos.get(k).push(l);
    }
    for (const g of grupos.values()) {
      if (g.length < 2) continue;
      const md = mediana(g.map((l) => l.valor));
      const fixas = g.filter((l) => l.a.manual === 'incluir');
      const ordem = [...g].sort((x, y) => Math.abs(x.valor - md) - Math.abs(y.valor - md) || String(y.a.data || '').localeCompare(String(x.a.data || '')) || ((U.isNum(y.qtd) ? y.qtd : 0) - (U.isNum(x.qtd) ? x.qtd : 0)));
      const mantidas = fixas.length ? fixas : [ordem[0]];
      const ref = mantidas[0];
      const quem = modo === 'compra' ? `da mesma compra (${rotuloCompra(ref.a)})` : `do mesmo fornecedor (${nomeFornecedor(ref.a)})`;
      for (const l of g) if (!mantidas.includes(l)) l.indep = { cod: 'independencia', texto: `Mais de uma amostra ${quem}; mantida a de valor central, ${U.fmtPrice(ref.valor)}` };
    }
  }

  /* ---------- etapa 3: critério estatístico e decisões do analista (sem alterar as linhas) ---------- */
  function decidir(linhas, criterio) {
    const cands = new Set(linhas.filter((l) => l.a.manual !== 'excluir' && l.valor > 0 && ((!l.qualit.length && !l.indep) || l.a.manual === 'incluir')));
    const lim = limites([...cands].map((l) => l.valor), criterio);
    const decisoes = linhas.map((l) => {
      const auto = [...l.qualit, ...(l.indep ? [l.indep] : [])];
      if (lim.aplicado && cands.has(l)) {
        if (l.valor < lim.lo - 1e-9) auto.push({ cod: 'inexequivel', texto: `Abaixo do limite inferior de ${U.fmtPrice(lim.lo)} (possível preço inexequível)` });
        else if (l.valor > lim.hi + 1e-9) auto.push({ cod: 'excessivo', texto: `Acima do limite superior de ${U.fmtPrice(lim.hi)} (possível preço excessivamente elevado)` });
      }
      const a = l.a;
      if (a.manual === 'excluir') return { auto, excluida: true, motivos: [{ cod: a.motivoCod || 'outro', texto: textoMotivoManual(a) || 'Desconsiderada pelo analista', manual: true }] };
      if (a.manual === 'incluir' && l.valor > 0) return { auto, excluida: false, motivos: [] };
      return { auto, excluida: auto.length > 0, motivos: auto };
    });
    return { lim, decisoes };
  }

  /* ---------- concentração das amostras válidas ---------- */
  function independencia(validas) {
    const n = validas.length;
    const contar = (fn) => {
      const grupos = new Map();
      let sem = 0;
      for (const l of validas) { const k = fn(l.a); if (!k) { sem++; continue; } if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(l); }
      return { grupos, distintos: grupos.size + sem };
    };
    const f = contar(chaveFornecedor), o = contar(chaveOrgao), c = contar(chaveCompra);
    const topo = (x) => [...x.grupos.values()].sort((p, q) => q.length - p.length)[0];
    const achados = [];
    if (n >= 2) {
      const tf = topo(f);
      if (tf && tf.length >= 2 && tf.length / n > 1 / 3) achados.push({ tipo: 'fornecedor', n: tf.length, texto: `${tf.length} das ${n} amostras válidas são do mesmo fornecedor (${nomeFornecedor(tf[0].a)})` });
      const to = topo(o);
      if (to && to.length >= 2 && to.length / n > 1 / 3) achados.push({ tipo: 'orgao', n: to.length, texto: `${to.length} das ${n} amostras válidas são do mesmo órgão comprador (${to[0].a.orgao || 'UASG ' + to[0].a.uasg})` });
      for (const g of c.grupos.values()) if (g.length >= 2) achados.push({ tipo: 'compra', n: g.length, texto: `${g.length} amostras válidas vêm da mesma compra (${rotuloCompra(g[0].a)})` });
    }
    return { achados, fornecedores: f.distintos, orgaos: o.distintos, compras: c.distintos };
  }

  /* ---------- painel de sensibilidade ---------- */
  const CRIT_SENS = ['iqr', 'sigma', 'mediana', 'nenhum'];
  const MET_SENS = ['media', 'mediana', 'menor', 'ponderada'];
  function sensibilidade(linhas, item, cfg, ajuste) {
    const base = item.criterio || {};
    const f = 1 + (U.isNum(ajuste) ? ajuste : 0) / 100;
    const tabela = CRIT_SENS.map((tipo) => {
      const { decisoes } = decidir(linhas, { ...(cfg.criterio || {}), ...base, tipo });
      const val = linhas.filter((_, i) => !decisoes[i].excluida);
      const vs = val.map((l) => l.valor), ps = val.map((l) => l.qtd);
      return {
        tipo, n: vs.length,
        valores: MET_SENS.map((m) => { const e = estimar(vs, m, cfg.cvLimite, ps); return { metodo: m, valor: U.isNum(e.valor) ? e.valor * f : NaN, fallback: !!e.fallback, n: vs.length }; }),
      };
    });
    const todos = tabela.flatMap((x) => x.valores.filter((v) => U.isNum(v.valor) && !v.fallback).map((v) => v.valor));
    return { linhas: tabela, min: todos.length ? Math.min(...todos) : NaN, max: todos.length ? Math.max(...todos) : NaN };
  }

  /* ---------- análise completa do item ---------- */
  function analisarItem(item, cfg, refISO) {
    const prep = preparar(item, cfg, refISO);
    const linhas = prep.linhas;
    const modoIndep = item.independencia || cfg.independencia || 'livre';
    aplicarIndependencia(linhas, modoIndep);
    const { lim, decisoes } = decidir(linhas, item.criterio);
    linhas.forEach((l, i) => {
      const d = decisoes[i];
      l.auto = d.auto; l.excluida = d.excluida; l.motivos = d.motivos;
      if (l.a.manual === 'excluir') l.motivo = d.motivos[0].texto;
      else if (l.a.manual === 'incluir' && l.valor > 0) {
        const t = textoMotivoManual(l.a);
        l.motivo = d.auto.length ? `Mantida pelo analista${t ? ': ' + t : ''} (sinalizações: ${d.auto.map((x) => x.texto).join('; ')})` : t ? `Mantida pelo analista: ${t}` : '';
      } else l.motivo = d.auto.map((x) => x.texto).join('; ');
    });
    const validas = linhas.filter((l) => !l.excluida);
    const vals = validas.map((l) => l.valor);
    const r = resumo(vals);
    const est = estimar(vals, item.metodo, cfg.cvLimite, validas.map((l) => l.qtd));
    const ajuste = U.isNum(item.ajustePct) ? item.ajustePct : 0;
    const unitario = U.isNum(est.valor) ? est.valor * (1 + ajuste / 100) : NaN;
    const total = U.isNum(unitario) ? unitario * (U.isNum(item.quantidade) ? item.quantidade : 0) : NaN;
    const indep = independencia(validas);

    const alertas = [];
    const norma = cfg.norma || 'IN SEGES/ME nº 65/2021';
    if (!linhas.length) alertas.push({ nivel: 'info', texto: 'Nenhuma amostra nesta cesta. Use a Pesquisa ou adicione cotações manualmente.' });
    else if (vals.length < 3) alertas.push({ nivel: 'atencao', texto: `Menos de três preços válidos (${vals.length}). A estimativa com menos de três preços é excepcional e exige justificativa nos autos e aprovação da autoridade competente (${norma}, art. 6º, §5º).` });
    if (vals.length > 1 && r.cv > cfg.cvLimite) alertas.push({ nivel: 'atencao', texto: `Alta dispersão: coeficiente de variação de ${U.fmtPct(r.cv)} (referência configurada: ${U.fmtPct(cfg.cvLimite, 0)}). Os preços devem ser analisados de forma crítica (${norma}, art. 6º, §4º).` });
    const params = new Set(validas.map((l) => l.a.parametro));
    if (validas.length && !params.has('I') && !params.has('II')) alertas.push({ nivel: 'atencao', texto: `Não há preços válidos dos parâmetros I ou II, que devem ser priorizados; registre a justificativa (${norma}, art. 5º, §1º).` });
    const fornIV = new Set(validas.filter((l) => l.a.parametro === 'IV').map((l) => U.onlyAlnum(l.a.niFornecedor) || U.norm(l.a.fornecedor)));
    if (fornIV.size > 0 && fornIV.size < 3) alertas.push({ nivel: 'atencao', texto: `Pesquisa direta com ${fornIV.size} fornecedor(es). A Lei 14.133/2021 exige no mínimo três, com justificativa da escolha (art. 23, §1º, IV).` });
    const painel = validas.filter((l) => l.a.parametro === 'I').map((l) => l.valor);
    const medianaPainel = painel.length ? mediana(painel) : NaN;
    if (painel.length && unitario > medianaPainel * (1 + 1e-9)) alertas.push({ nivel: 'atencao', texto: `O valor estimado (${U.fmtPrice(unitario)}) supera a mediana das amostras do Painel de Preços (${U.fmtPrice(medianaPainel)}). O parâmetro do art. 23, §1º, I, da Lei 14.133/2021 considera composições menores ou iguais à mediana do item no painel.` });
    const unidades = new Set(validas.map((l) => (l.conversao ? prep.unidadeItem : CP.units.key(l.a.unidade))).filter(Boolean));
    const unidadesMistas = unidades.size > 1;
    if (unidadesMistas) alertas.push({ nivel: 'atencao', texto: `As amostras válidas usam unidades diferentes (${[...unidades].join(', ')}). Padronize a unidade antes de estimar o preço.` });
    if (!item.unidade && linhas.length) alertas.push({ nivel: 'info', texto: 'Informe a unidade do item para que o sistema detecte amostras em unidades incompatíveis.' });
    for (const x of indep.achados) alertas.push({ nivel: 'atencao', texto: `${x.texto}.` });

    return {
      linhas, validas, resumo: r, limites: lim, estimativa: { ...est, ajustePct: ajuste, unitario, total }, alertas, medianaPainel,
      n: linhas.length, nValidas: validas.length, escala: prep.escala, unidadeItem: prep.unidadeItem, unidadesMistas,
      independencia: { modo: modoIndep, ...indep }, sensibilidade: sensibilidade(linhas, item, cfg, ajuste),
    };
  }

  /* ---------- justificativa ---------- */
  function listaPt(itens, sep = '; ') {
    if (itens.length <= 1) return itens.join('');
    if (itens.length === 2) return itens.join(' e ');
    return itens.slice(0, -1).join(sep) + (sep === '; ' ? '; e ' : ' e ') + itens[itens.length - 1];
  }
  function categoria(l) {
    const m = l.motivos[0];
    if (!m) return { chave: 'a:outro', rot: NA_JUSTIFICATIVA.outro };
    let rot = NA_JUSTIFICATIVA[m.cod] || NA_JUSTIFICATIVA.outro;
    if (!m.manual && (m.cod === 'inexequivel' || m.cod === 'excessivo')) rot += ', segundo o critério estatístico';
    if (m.manual && m.cod !== 'outro' && NA_JUSTIFICATIVA[m.cod]) rot += ', segundo avaliação do analista';
    return { chave: (m.manual ? 'm:' : 'a:') + m.cod, rot };
  }
  function resumoExclusoes(excl) {
    const g = new Map();
    for (const l of excl) { const c = categoria(l); const x = g.get(c.chave) || { rot: c.rot, n: 0 }; x.n++; g.set(c.chave, x); }
    return listaPt([...g.values()].sort((a, b) => b.n - a.n).map((x) => `${x.n} por ${x.rot}`));
  }
  function textoJustificativa(item, an, cfg) {
    const nomesOrig = { painel: 'Painel de Preços (inciso I)', pncp: 'contratações publicadas no PNCP (inciso II)', arp: 'atas de registro de preços (inciso II)', 'nfe-portal': 'notas fiscais do Portal da Transparência (inciso V)', 'nfe-xml': 'notas fiscais eletrônicas (inciso V)', manual: 'cotações e consultas registradas manualmente', importacao: 'planilhas importadas' };
    const norma = cfg.norma || 'IN SEGES/ME nº 65/2021';
    const fontes = [...new Set(an.linhas.map((l) => nomesOrig[l.a.origem] || l.a.origem))];
    const excl = an.linhas.filter((l) => l.excluida);
    let t = `${an.n === 1 ? 'Foi coletado 1 preço' : `Foram coletados ${an.n} preços`} para o item, provenientes de ${listaPt(fontes, ', ') || '—'}. `;
    t += excl.length ? `Na análise crítica, ${excl.length === 1 ? '1 preço foi desconsiderado' : excl.length + ' preços foram desconsiderados'}: ${resumoExclusoes(excl)}. ` : 'Na análise crítica, nenhum preço foi desconsiderado. ';
    const mantidas = an.linhas.filter((l) => !l.excluida && l.a.manual === 'incluir' && l.auto.length);
    if (mantidas.length) t += `${mantidas.length === 1 ? '1 preço sinalizado foi mantido' : mantidas.length + ' preços sinalizados foram mantidos'} pelo analista, com o motivo registrado no mapa de preços. `;
    t += `Critério de saneamento: ${descreverCriterio(item.criterio)} `;
    const esc = an.escala || {};
    if (esc.ativo) t += `Para preservar a comparabilidade de escala, consideraram-se apenas aquisições com quantidade entre ${fmtRazao(esc.min)} e ${fmtRazao(esc.max)} da quantidade estimada. `;
    const modo = an.independencia && an.independencia.modo;
    if (modo === 'compra') t += 'Para preservar a independência da amostra, considerou-se no máximo um preço por compra. ';
    else if (modo === 'fornecedor') t += 'Para preservar a independência da amostra, considerou-se no máximo um preço por fornecedor. ';
    if (an.nValidas > 1) t += `O coeficiente de variação das ${an.nValidas} amostras válidas é de ${U.fmtPct(an.resumo.cv)}. `;
    const e = an.estimativa;
    if (e.efetivo === 'ponderada') t += `Adotou-se a média ponderada pela quantidade de cada aquisição (${e.nPond} de ${an.nValidas} amostras com quantidade informada), método admitido mediante justificativa nos autos e aprovação da autoridade competente (art. 6º, §1º, da ${norma}). `;
    else if (item.metodo === 'auto') t += `Adotou-se ${COM_ARTIGO[e.efetivo] || '—'} porque o coeficiente de variação ${an.resumo.cv > cfg.cvLimite ? 'supera' : 'não supera'} a referência de ${U.fmtPct(cfg.cvLimite, 0)}, nos termos do art. 6º da ${norma}. `;
    else t += `Adotou-se ${COM_ARTIGO[e.efetivo] || '—'} das amostras válidas, nos termos do art. 6º da ${norma}. `;
    if (e.fallback) t += 'Como nenhuma amostra válida informa a quantidade adquirida, usou-se a média simples. ';
    const s = an.sensibilidade;
    if (s && U.isNum(s.min) && U.isNum(e.unitario) && e.unitario > 0 && s.max > s.min) t += `No painel de sensibilidade, o valor estimado variou de ${U.fmtPrice(s.min)} a ${U.fmtPrice(s.max)} entre os critérios e métodos avaliados, amplitude de ${U.fmtPct((s.max - s.min) / e.unitario)} sobre o valor adotado. `;
    if (e.ajustePct) t += `Aplicou-se ajuste de ${U.fmtNum(e.ajustePct, 2, 0)}% sobre o valor obtido (art. 6º, §2º, da ${norma}). `;
    t += `Valor unitário estimado: ${U.fmtPrice(e.unitario)}.`;
    return t;
  }

  // atualização monetária pelo IPCA: aplica as variações dos meses posteriores ao da amostra até o mês de referência
  function fatorIPCA(dataISO, refISO, serie) {
    if (!dataISO || !refISO || !serie) return { fator: 1, meses: 0, ate: null };
    let [y, m] = dataISO.slice(0, 7).split('-').map(Number);
    const [ry, rm] = refISO.slice(0, 7).split('-').map(Number);
    let f = 1, meses = 0, ate = null;
    for (;;) {
      m++; if (m > 12) { m = 1; y++; }
      if (y > ry || (y === ry && m > rm)) break;
      const k = `${y}-${U.pad(m)}`;
      if (serie[k] == null) break;
      f *= 1 + serie[k] / 100; meses++; ate = k;
    }
    return { fator: f, meses, ate };
  }

  return {
    quantil, media, mediana, desvio, resumo, limites, estimar, descreverCriterio, CRITERIOS, METODOS, NOME_METODO, verificarPrazo, posicao, fmtRazao,
    analisarItem, textoJustificativa, resumoExclusoes, fatorIPCA, MOTIVOS_EXCLUSAO, MOTIVOS_MANTER, textoMotivoManual, motivoRegistrado,
    chaveCompra, chaveFornecedor, chaveOrgao, rotuloCompra, CRIT_SENS, MET_SENS,
  };
})();

/* ===== 025-conformidade.js ===== */
/* Verificação de conformidade da pesquisa de preços (Lei 14.133/2021, art. 23; IN SEGES/ME nº 65/2021).
   Cada verificação termina como ok, aviso (pede atenção ou justificativa nos autos), erro (pendência a
   resolver antes de emitir o relatório) ou na (não se aplica ao item). */
CP.conformidade = (() => {
  const U = CP.util;
  const ORDEM = { erro: 0, aviso: 1, ok: 2, na: 3 };
  const v = (id, titulo, status, texto, ref) => ({ id, titulo, status, texto, ref });
  const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

  function item(it, an, cfg) {
    const norma = cfg.norma || 'IN SEGES/ME nº 65/2021';
    const L = [];
    const validas = an.validas;
    const n = an.nValidas;
    const e = an.estimativa;
    // o rascunho automático existe sempre que há amostras, mesmo antes de a cesta ser aberta
    const rascunho = !!it.justificativaAuto && an.n > 0;
    const justUsuario = !it.justificativaAuto ? String(it.justificativa || '').trim() : '';

    // 1. mínimo de três preços
    const T1 = 'Mínimo de três preços válidos';
    if (!an.n) L.push(v('amostras', T1, 'erro', 'O item não tem preços coletados.', `${norma}, art. 6º`));
    else if (!n) L.push(v('amostras', T1, 'erro', 'Todas as amostras foram desconsideradas; não há valor estimado.', `${norma}, art. 6º`));
    else if (n < 3) L.push(v('amostras', T1, justUsuario ? 'aviso' : 'erro', `${n === 1 ? 'Só 1 preço válido' : `Só ${n} preços válidos`}. A estimativa com menos de três preços é excepcional e exige justificativa nos autos e aprovação da autoridade competente.`, `${norma}, art. 6º, §5º`));
    else L.push(v('amostras', T1, 'ok', `${n} preços válidos.`, `${norma}, art. 6º`));

    // 2. prioridade dos parâmetros I e II
    const T2 = 'Prioridade dos parâmetros I e II';
    if (!n) L.push(v('prioridade', T2, 'na', '', `${norma}, art. 5º, §1º`));
    else if (validas.some((l) => l.a.parametro === 'I' || l.a.parametro === 'II')) L.push(v('prioridade', T2, 'ok', 'Há preços do Painel de Preços ou de contratações similares.', `${norma}, art. 5º, §1º`));
    else L.push(v('prioridade', T2, 'aviso', 'Não há preços válidos dos parâmetros I ou II. Registre nos autos por que não foi possível usá-los.', `${norma}, art. 5º, §1º`));

    // 3. pesquisa direta com fornecedores
    const T3 = 'Pesquisa direta com fornecedores';
    const iv = an.linhas.filter((l) => l.a.parametro === 'IV');
    if (!iv.length) L.push(v('direta', T3, 'na', '', 'Lei 14.133/2021, art. 23, §1º, IV'));
    else {
      const forn = new Set(iv.map((l) => CP.stats.chaveFornecedor(l.a) || l.a.id));
      const semDados = iv.filter((l) => !U.onlyAlnum(l.a.niFornecedor) || !l.a.data);
      const poucos = forn.size < 3 ? ` Pesquisa direta com ${plural(forn.size, 'fornecedor', 'fornecedores')}: a lei exige consulta a no mínimo três.` : '';
      if (semDados.length) L.push(v('direta', T3, 'erro', `${plural(semDados.length, 'cotação sem', 'cotações sem')} CNPJ ou CPF do proponente ou sem data de emissão.${poucos}`, `${norma}, art. 5º, §2º, II`));
      else if (forn.size < 3) L.push(v('direta', T3, 'aviso', `Pesquisa direta com ${plural(forn.size, 'fornecedor', 'fornecedores')}. A lei exige consulta a no mínimo três; registre nos autos os consultados que não responderam e a justificativa da escolha.`, `Lei 14.133/2021, art. 23, §1º, IV; ${norma}, art. 5º, §2º, IV`));
      else L.push(v('direta', T3, 'ok', `${forn.size} fornecedores consultados. Registre nos autos a justificativa da escolha.`, `${norma}, art. 3º, VIII`));
    }

    // 4. data e hora de acesso (parâmetro III)
    const T4 = 'Data e hora de acesso às fontes do parâmetro III';
    const iii = validas.filter((l) => l.a.parametro === 'III');
    if (!iii.length) L.push(v('acesso', T4, 'na', '', 'Lei 14.133/2021, art. 23, §1º, III'));
    else {
      const sem = iii.filter((l) => !l.a.acessoEm);
      L.push(sem.length ? v('acesso', T4, 'erro', `${plural(sem.length, 'preço de sítio eletrônico, mídia ou tabela sem', 'preços de sítios eletrônicos, mídia ou tabelas sem')} data e hora de acesso.`, 'Lei 14.133/2021, art. 23, §1º, III')
        : v('acesso', T4, 'ok', 'Data e hora de acesso registradas.', 'Lei 14.133/2021, art. 23, §1º, III'));
    }

    // 5. prazos de cada parâmetro
    const T5 = 'Prazos de cada parâmetro';
    const forPrazo = validas.filter((l) => l.alertas.some((x) => x.cod === 'prazo') || l.auto.some((x) => x.cod === 'prazo'));
    if (!n) L.push(v('prazo', T5, 'na', '', `${norma}, art. 5º`));
    else L.push(forPrazo.length ? v('prazo', T5, 'aviso', `${plural(forPrazo.length, 'preço válido está', 'preços válidos estão')} fora do prazo do respectivo parâmetro; justifique a manutenção.`, `${norma}, art. 5º`)
      : v('prazo', T5, 'ok', 'Preços dentro dos prazos admitidos.', `${norma}, art. 5º`));

    // 6. justificativa
    const T6 = 'Justificativa da metodologia';
    if (!rascunho && !justUsuario) L.push(v('justificativa', T6, 'erro', 'Registre a justificativa da metodologia e das exclusões.', `${norma}, art. 3º, VI`));
    else if (rascunho) L.push(v('justificativa', T6, 'aviso', 'O texto é um rascunho gerado pelo sistema; revise-o e clique em “Adotar este texto”.', `${norma}, art. 3º, VI`));
    else L.push(v('justificativa', T6, 'ok', 'Justificativa registrada.', `${norma}, art. 3º, VI`));

    // 7. motivos das decisões do analista
    const T7 = 'Motivo de cada decisão do analista';
    const manuais = an.linhas.filter((l) => l.a.manual);
    const semMotivo = manuais.filter((l) => !CP.stats.motivoRegistrado(l.a));
    if (!manuais.length) L.push(v('motivos', T7, 'na', '', `${norma}, art. 6º, §3º`));
    else L.push(semMotivo.length ? v('motivos', T7, 'erro', `${plural(semMotivo.length, 'decisão sem', 'decisões sem')} motivo registrado. Escolha o motivo na coluna Situação da tabela de amostras.`, `${norma}, art. 6º, §3º`)
      : v('motivos', T7, 'ok', `${plural(manuais.length, 'decisão', 'decisões')} com motivo registrado.`, `${norma}, art. 6º, §3º`));

    // 8. método de cálculo
    const T8 = 'Método de cálculo';
    if (!n) L.push(v('metodo', T8, 'na', '', `${norma}, art. 6º`));
    else {
      const extras = [];
      if (e.efetivo === 'ponderada') extras.push('média ponderada é método alternativo (art. 6º, §1º)');
      if (e.ajustePct) extras.push(`ajuste de ${U.fmtNum(e.ajustePct, 2, 0)}% sobre o valor obtido (art. 6º, §2º)`);
      L.push(extras.length ? v('metodo', T8, 'aviso', `Exige justificativa nos autos e aprovação da autoridade competente: ${extras.join('; ')}.`, `${norma}, art. 6º`)
        : v('metodo', T8, 'ok', `Método previsto na norma: ${CP.stats.NOME_METODO[e.efetivo] || '—'}.`, `${norma}, art. 6º`));
    }

    // 9. dispersão
    const T9 = 'Análise crítica da dispersão';
    if (n < 2) L.push(v('dispersao', T9, 'na', '', `${norma}, art. 6º, §4º`));
    else if (an.resumo.cv > cfg.cvLimite) L.push(v('dispersao', T9, 'aviso', `Coeficiente de variação de ${U.fmtPct(an.resumo.cv)}, acima da referência de ${U.fmtPct(cfg.cvLimite, 0)}. A justificativa deve tratar da variação entre os preços.`, `${norma}, art. 6º, §4º`));
    else L.push(v('dispersao', T9, 'ok', `Coeficiente de variação de ${U.fmtPct(an.resumo.cv)}.`, `${norma}, art. 6º, §4º`));

    // 10. mediana do Painel de Preços
    const T10 = 'Valor em relação à mediana do Painel de Preços';
    const painel = validas.filter((l) => l.a.parametro === 'I');
    if (!painel.length || !U.isNum(e.unitario)) L.push(v('painel', T10, 'na', '', `${norma}, art. 6º, §6º`));
    else if (e.unitario > an.medianaPainel * (1 + 1e-9)) {
      L.push(painel.length === n ? v('painel', T10, 'erro', `Com base só no Painel de Preços, o valor estimado (${U.fmtPrice(e.unitario)}) não pode superar a mediana do item (${U.fmtPrice(an.medianaPainel)}).`, `${norma}, art. 6º, §6º`)
        : v('painel', T10, 'aviso', `O valor estimado (${U.fmtPrice(e.unitario)}) supera a mediana das amostras do Painel de Preços (${U.fmtPrice(an.medianaPainel)}).`, 'Lei 14.133/2021, art. 23, §1º, I'));
    } else L.push(v('painel', T10, 'ok', `Valor estimado igual ou inferior à mediana do Painel de Preços (${U.fmtPrice(an.medianaPainel)}).`, 'Lei 14.133/2021, art. 23, §1º, I'));

    // 11. equivalência das descrições
    const T11 = 'Equivalência das descrições';
    if (!String(it.descricao || '').trim() || !n) L.push(v('equivalencia', T11, 'na', '', 'Lei 14.133/2021, art. 23, §1º, II'));
    else {
      const duv = validas.filter((l) => l.alertas.some((x) => x.cod === 'cor' || x.cod === 'semelhanca' || x.cod === 'nao-equivalente') || (l.a.manual === 'incluir' && l.auto.some((x) => x.cod === 'nao-equivalente')));
      L.push(duv.length ? v('equivalencia', T11, 'aviso', `Confira a equivalência de ${plural(duv.length, 'amostra válida', 'amostras válidas')} com descrição pouco semelhante, cor diferente ou atributo divergente.`, 'Lei 14.133/2021, art. 23, §1º, II')
        : v('equivalencia', T11, 'ok', 'Descrições das amostras válidas compatíveis com a do item.', 'Lei 14.133/2021, art. 23, §1º, II'));
    }

    // 12. unidade e quantidade
    const T12 = 'Unidade e quantidade do item';
    const falta = [];
    if (!String(it.unidade || '').trim()) falta.push('informe a unidade de fornecimento do item');
    if (!(U.isNum(it.quantidade) && it.quantidade > 0)) falta.push('informe a quantidade estimada');
    if (an.unidadesMistas) falta.push('as amostras válidas usam unidades diferentes; padronize a unidade');
    L.push(falta.length ? v('unidade', T12, 'aviso', falta.join('; ').replace(/^./, (c) => c.toUpperCase()) + '.', 'Lei 14.133/2021, art. 23, caput')
      : v('unidade', T12, 'ok', `${U.fmtQtd(it.quantidade)} ${it.unidade}.`, 'Lei 14.133/2021, art. 23, caput'));

    // 13. independência das amostras
    const T13 = 'Independência das amostras';
    const ind = an.independencia;
    if (n < 2) L.push(v('independencia', T13, 'na', '', `${norma}, art. 6º, §4º`));
    else if (ind.achados.length) L.push(v('independencia', T13, 'aviso', `${ind.achados.map((x) => x.texto).join('; ')}. Avalie se a amostra representa o mercado ou limite a uma amostra por compra ou por fornecedor.`, `${norma}, art. 6º, §4º`));
    else L.push(v('independencia', T13, 'ok', `${plural(ind.fornecedores, 'fornecedor', 'fornecedores')}, ${plural(ind.orgaos, 'órgão', 'órgãos')} e ${plural(ind.compras, 'compra', 'compras')} distintos.`, `${norma}, art. 6º, §4º`));

    // 14. escala de quantidade
    const T14 = 'Escala de quantidade';
    const comQtd = validas.filter((l) => U.isNum(l.razao));
    const fx = { min: 0.1, max: 10, ...(cfg.escala || {}) };
    if (!comQtd.length) L.push(v('escala', T14, 'na', 'As amostras válidas não informam a quantidade adquirida.', 'Lei 14.133/2021, art. 23, caput'));
    else if (an.escala.ativo) L.push(v('escala', T14, 'ok', `Consideradas só aquisições entre ${CP.stats.fmtRazao(an.escala.min)} e ${CP.stats.fmtRazao(an.escala.max)} da quantidade estimada.`, 'Lei 14.133/2021, art. 23, caput'));
    else {
      const fora = comQtd.filter((l) => l.razao < fx.min || l.razao > fx.max);
      L.push(fora.length ? v('escala', T14, 'aviso', `${plural(fora.length, 'amostra válida vem', 'amostras válidas vêm')} de aquisições com quantidade fora de ${CP.stats.fmtRazao(fx.min)} a ${CP.stats.fmtRazao(fx.max)} da estimada. A lei manda considerar a economia de escala; avalie limitar a escala.`, 'Lei 14.133/2021, art. 23, caput')
        : v('escala', T14, 'ok', 'Quantidades das aquisições compatíveis com a estimada.', 'Lei 14.133/2021, art. 23, caput'));
    }
    return L;
  }

  function projeto(p, cfg) {
    const norma = cfg.norma || 'IN SEGES/ME nº 65/2021';
    const geral = [];
    geral.push(String(p.objeto || '').trim() ? v('objeto', 'Descrição do objeto', 'ok', 'Objeto informado.', `${norma}, art. 3º, I`) : v('objeto', 'Descrição do objeto', 'erro', 'Informe o objeto em Dados do processo.', `${norma}, art. 3º, I`));
    geral.push(String(p.responsavel || '').trim() ? v('responsavel', 'Agente responsável pela pesquisa', 'ok', 'Responsável informado.', `${norma}, art. 3º, II`) : v('responsavel', 'Agente responsável pela pesquisa', 'erro', 'Informe o responsável em Dados do processo.', `${norma}, art. 3º, II`));
    geral.push(p.itens.length ? v('itens', 'Itens pesquisados', 'ok', `${plural(p.itens.length, 'item', 'itens')}.`, `${norma}, art. 3º, IV`) : v('itens', 'Itens pesquisados', 'erro', 'A cesta não tem itens.', `${norma}, art. 3º, IV`));
    const itens = p.itens.map((it) => {
      const an = CP.stats.analisarItem(it, cfg, p.dataReferencia);
      const checks = item(it, an, cfg);
      return { it, an, checks, pior: pior(checks) };
    });
    const semFonte = itens.flatMap((x) => x.an.validas).filter((l) => !l.a.consultaId && !String(l.a.referencia || '').trim() && !l.a.url);
    geral.push(semFonte.length ? v('fontes', 'Caracterização das fontes', 'aviso', `${plural(semFonte.length, 'preço válido sem', 'preços válidos sem')} referência ao documento de origem.`, `${norma}, art. 3º, III`) : v('fontes', 'Caracterização das fontes', 'ok', 'Todas as amostras válidas identificam a origem.', `${norma}, art. 3º, III`));
    const todos = [...geral, ...itens.flatMap((x) => x.checks)];
    const resumo = { erros: todos.filter((c) => c.status === 'erro').length, avisos: todos.filter((c) => c.status === 'aviso').length, ok: todos.filter((c) => c.status === 'ok').length };
    return { geral, itens, resumo };
  }
  function pior(checks) { return checks.reduce((p, c) => (c.status !== 'na' && ORDEM[c.status] < ORDEM[p] ? c.status : p), 'ok'); }
  function pendencias(checks) { return checks.filter((c) => c.status === 'erro' || c.status === 'aviso').sort((a, b) => ORDEM[a.status] - ORDEM[b.status]); }
  const ROTULO = { erro: 'Pendência', aviso: 'Atenção', ok: 'Atendida', na: 'Não se aplica' };
  return { item, projeto, pior, pendencias, ROTULO, ORDEM };
})();

/* ===== 03-http.js ===== */
/* Camada HTTP com tolerância às limitações das APIs públicas:
   - tempo limite e cancelamento;
   - cadência mínima por servidor (o Portal da Transparência limita requisições por minuto);
   - novas tentativas em 429/502/503/504;
   - proxy de reserva quando o navegador bloqueia a chamada direta (CORS). */
CP.http = (() => {
  const U = CP.util;
  class HttpError extends Error { constructor(status, url, corpo) { super('HTTP ' + status); this.name = 'HttpError'; this.status = status; this.url = url; this.corpo = corpo || ''; } }
  class RedeError extends Error { constructor(url, causa) { super('Sem resposta do servidor'); this.name = 'RedeError'; this.url = url; this.causa = causa; } }
  const ultimo = new Map();
  const diagnostico = {};
  const cfg = () => CP.state.settings;

  function intervalo(host) { return /portaldatransparencia/.test(host) ? Math.max(300, cfg().nfeIntervaloMs || 2100) : 60; }
  async function aguardarVez(host, signal) {
    const agora = Date.now();
    const prox = Math.max(agora, (ultimo.get(host) || 0) + intervalo(host));
    ultimo.set(host, prox);
    if (prox > agora) await U.sleep(prox - agora, signal);
  }
  const iniciador = () => !!(CP.state.ambiente && CP.state.ambiente.iniciador);
  function viaProxy(url) {
    // aberto pelo iniciador local: o próprio servidor da página encaminha as consultas
    if (iniciador()) return `${location.origin}/__consultor__/proxy?url=${encodeURIComponent(url)}`;
    const t = (cfg().proxy || CP.PROXY_PADRAO || '').trim();
    if (!t) return null;
    return t.includes('{url}') ? t.replace('{url}', encodeURIComponent(url)) : t + encodeURIComponent(url);
  }
  function montarURL(base, caminho, params = {}) {
    const qs = new URLSearchParams();
    for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== null && v !== '') qs.append(k, String(v));
    const s = qs.toString();
    return String(base).replace(/\/+$/, '') + caminho + (s ? '?' + s : '');
  }

  async function tentar(url, opt, signal) {
    const ctrl = new AbortController();
    let estourou = false;
    const tm = setTimeout(() => { estourou = true; ctrl.abort(); }, opt.timeoutMs || (cfg().timeoutSeg || 60) * 1000);
    const repassa = () => ctrl.abort();
    if (signal) signal.addEventListener('abort', repassa, { once: true });
    try {
      const headers = opt.headers || { Accept: opt.tipo === 'text' ? '*/*' : 'application/json' };
      const res = await fetch(url, { headers, signal: ctrl.signal, cache: 'no-store', credentials: 'omit' });
      if (res.status === 204) return { status: 204, dados: null };
      const texto = await res.text();
      if (!res.ok) throw new HttpError(res.status, url, texto.slice(0, 600));
      if (opt.tipo === 'text') return { status: res.status, dados: texto };
      if (!texto.trim()) return { status: res.status, dados: null };
      try { return { status: res.status, dados: JSON.parse(texto) }; } catch (e) { throw new HttpError(res.status, url, 'A resposta não é JSON: ' + texto.slice(0, 160)); }
    } catch (e) {
      if (signal && signal.aborted) throw new DOMException('Cancelado', 'AbortError');
      if (e instanceof HttpError) throw e;
      throw new RedeError(url, estourou ? 'tempo esgotado' : e);
    } finally {
      clearTimeout(tm);
      if (signal) signal.removeEventListener('abort', repassa);
    }
  }

  async function pedir(url, opt = {}) {
    const signal = opt.signal;
    const host = new URL(url).host;
    const px = viaProxy(url);
    const ordem = px ? (iniciador() || cfg().proxyModo === 'sempre' ? [px] : [url, px]) : [url];
    const tentativas = opt.semRepeticao ? 1 : 3;
    let erro;
    for (const alvo of ordem) {
      for (let t = 0; t < tentativas; t++) {
        await aguardarVez(host, signal);
        try {
          const r = await tentar(alvo, opt, signal);
          r.viaProxy = alvo !== url;
          diagnostico[host] = { ok: true, viaProxy: r.viaProxy, quando: U.nowISO() };
          return r;
        } catch (e) {
          if (e.name === 'AbortError') throw e;
          erro = e;
          if (e instanceof HttpError && [429, 502, 503, 504].includes(e.status) && t < tentativas - 1) { await U.sleep(1500 * (t + 1) * (e.status === 429 ? 3 : 1), signal); continue; }
          break;
        }
      }
      if (!(erro instanceof RedeError)) break;
    }
    diagnostico[host] = { ok: false, erro: explicar(erro), quando: U.nowISO() };
    throw erro;
  }

  async function emLotes(itens, n, fn, signal) {
    const out = new Array(itens.length);
    let i = 0;
    const trab = Array.from({ length: Math.max(1, Math.min(n, itens.length)) }, async () => {
      while (i < itens.length) {
        if (signal && signal.aborted) throw new DOMException('Cancelado', 'AbortError');
        const k = i++;
        out[k] = await fn(itens[k], k);
      }
    });
    await Promise.all(trab);
    return out;
  }

  function explicar(e) {
    if (!e) return '';
    if (e.name === 'AbortError') return 'Consulta cancelada.';
    if (e instanceof RedeError) {
      if (e.causa === 'tempo esgotado') return 'O servidor não respondeu dentro do tempo limite. Tente um período menor ou aumente o tempo limite em Configurações.';
      if (iniciador()) return 'O serviço local não respondeu. Se você usa o iniciador portátil, abra-o de novo; se instalou o serviço, use o atalho Consultor de Precos.';
      return 'O navegador não conseguiu consultar a API: ele bloqueia consultas de páginas abertas como arquivo (regra chamada CORS), ou não há conexão. Siga as instruções do aviso no topo da página.';
    }
    if (e instanceof HttpError) {
      if (e.status === 404) return 'A API respondeu 404. Nesta API isso costuma indicar parâmetro obrigatório ausente ou assinatura de consulta alterada, e não ausência de dados.';
      if (e.status === 403 && /Destino n[aã]o permitido/.test(e.corpo)) return 'O iniciador só encaminha consultas para as APIs oficiais. Confira os endereços em Configurações.';
      if (e.status === 401 || e.status === 403) return `Acesso negado (HTTP ${e.status}). Confira a chave de acesso da API.`;
      if (e.status === 429) return 'Limite de requisições atingido (HTTP 429). Aguarde alguns minutos ou aumente o intervalo entre consultas.';
      if (e.status === 400) return 'A API recusou os parâmetros (HTTP 400). ' + String(e.corpo || '').replace(/\s+/g, ' ').slice(0, 180);
      if (e.status === 502 && /^Falha ao consultar/.test(e.corpo)) return e.corpo.trim() + '. Verifique a conexão com a internet ou se a rede do órgão bloqueia esse endereço.';
      if (e.status >= 500) return `O servidor da API está com falha (HTTP ${e.status}). Tente novamente mais tarde.`;
      return `Erro HTTP ${e.status}.`;
    }
    return String(e.message || e);
  }

  return { pedir, montarURL, emLotes, explicar, viaProxy, HttpError, RedeError, diagnostico };
})();

/* ===== 04-apis.js ===== */
/* Integrações com APIs oficiais.
   Fontes de verdade: Manual da API do Compras.gov.br (v2.0, fev/2026), contrato OpenAPI publicado em
   dadosabertos.compras.gov.br/v3/api-docs e OpenAPI do Portal da Transparência. Comportamentos
   divergentes do manual (ex.: troca de assinatura da rota 1_consultarMaterial em 08/2026) são
   tratados com tentativa alternativa automática. */
CP.api = (() => {
  const U = CP.util;
  const H = CP.http;
  const cfg = () => CP.state.settings;
  const DA = () => cfg().endpoints.dadosAbertos;
  const PT = () => cfg().endpoints.transparencia;
  const BCB = () => cfg().endpoints.bcb;
  const url = (b, p, q) => H.montarURL(b, p, q);

  const ESFERA = { F: 'Federal', U: 'Federal', E: 'Estadual', M: 'Municipal', D: 'Distrital' };
  const MODALIDADE = { 1: 'Convite', 2: 'Tomada de preços', 3: 'Concorrência', 4: 'Concorrência internacional', 5: 'Pregão', 6: 'Dispensa', 7: 'Inexigibilidade', 12: 'Credenciamento', 20: 'Concurso', 22: 'Tomada de preços (técnica e preço)', 33: 'Concorrência (técnica e preço)', 44: 'Concorrência internacional (técnica e preço)', 57: 'Convênio' };
  const NOMES_FONTE = { painel: 'Painel de Preços', pncp: 'Contratações PNCP', arp: 'Atas de registro de preços', 'nfe-portal': 'NF-e (Portal da Transparência)', 'nfe-xml': 'NF-e importadas', manual: 'Registro manual', importacao: 'Planilha importada' };
  const PARAMETRO = { painel: 'I', pncp: 'II', arp: 'II', 'nfe-portal': 'V', 'nfe-xml': 'V', manual: 'IV', importacao: 'III' };

  function linkPncp(numeroControle) {
    const m = String(numeroControle || '').match(/^([0-9A-Z]{14})-\d+-(\d+)\/(\d{4})/);
    return m ? `https://pncp.gov.br/app/editais/${m[1]}/${m[3]}/${Number(m[2])}` : '';
  }
  function linkCompras(idCompra) {
    return /^\d{17}$/.test(String(idCompra || '')) ? `https://cnetmobile.estaleiro.serpro.gov.br/comprasnet-web/public/landing?destino=quadro-informativo&compra=${idCompra}` : '';
  }
  function linha(o) {
    return Object.assign({ uid: U.uid('r'), origem: '', parametro: '', descricao: '', codigo: '', unidade: '', quantidade: NaN, preco: NaN, data: null, fornecedor: '', ni: '', orgao: '', uasg: '', uf: '', municipio: '', esfera: '', marca: '', modalidade: '', ref: '', url: '', urlCompra: '', idCompra: '', numeroItem: '', tipoValor: 'homologado', bruto: null }, o);
  }
  const valida = (r) => r.preco > 0;

  /* ---------- paginação dos Dados Abertos (tamanhoPagina entre 10 e 500) ---------- */
  async function paginar(base, path, params, ctx = {}) {
    const tam = Math.min(500, Math.max(10, cfg().tamanhoPagina || 500));
    const lim = ctx.maxPaginas || cfg().maxPaginas || 10;
    const u1 = url(base, path, { ...params, pagina: 1, tamanhoPagina: tam });
    const { dados } = await H.pedir(u1, { signal: ctx.signal });
    let regs = Array.isArray(dados && dados.resultado) ? dados.resultado : Array.isArray(dados) ? dados : [];
    const total = Number(dados && dados.totalRegistros) || regs.length;
    const totPag = Math.max(1, Number(dados && dados.totalPaginas) || 1);
    const ultima = Math.min(totPag, lim);
    const urls = [u1];
    if (ctx.onPagina) ctx.onPagina(1, ultima, regs.length, total);
    if (ultima > 1) {
      const paginas = Array.from({ length: ultima - 1 }, (_, i) => i + 2);
      let feitas = 1;
      const res = await H.emLotes(paginas, Math.max(1, Math.min(4, cfg().concorrencia || 3)), async (p) => {
        const u = url(base, path, { ...params, pagina: p, tamanhoPagina: tam });
        urls.push(u);
        const r = await H.pedir(u, { signal: ctx.signal });
        feitas++;
        const lista = Array.isArray(r.dados && r.dados.resultado) ? r.dados.resultado : [];
        if (ctx.onPagina) ctx.onPagina(feitas, ultima, null, total);
        return lista;
      }, ctx.signal);
      for (const l of res) regs = regs.concat(l);
    }
    return { registros: regs, total, truncado: regs.length < total, urls };
  }

  /* ---------- catálogo CATMAT/CATSER ----------
     A busca textual da API (descricaoItem) é ignorada pelo servidor desde 05/2026 e devolve o
     catálogo inteiro; por isso o sistema baixa um índice de PDMs e serviços e busca localmente. */
  function mapItemMaterial(r) {
    return { tipo: 'M', nivel: 'item', codigo: String(r.codigoItem), descricao: r.descricaoItem || '', codigoPdm: r.codigoPdm, nomePdm: r.nomePdm || '', codigoClasse: r.codigoClasse, nomeClasse: r.nomeClasse || '', codigoGrupo: r.codigoGrupo, ncm: r.codigo_ncm || '', ativo: r.statusItem !== false, sustentavel: !!r.itemSustentavel };
  }
  function mapServico(r) {
    return { tipo: 'S', nivel: 'item', codigo: String(r.codigoServico), descricao: r.nomeServico || '', codigoGrupo: r.codigoGrupo, codigoClasse: r.codigoClasse, nomeClasse: r.nomeClasse || r.nomeGrupo || '', ativo: r.statusServico !== false };
  }
  let indiceNorm = null;
  const catalogo = {
    async baixarIndice(onProg, signal) {

  /* ---------- Painel de Preços (Módulo Pesquisa de Preço) ---------- */
  async function painel(chip, f, ctx) {
    const base = { dataCompraInicio: f.de, dataCompraFim: f.ate, estado: f.uf || undefined };
    let path, params, alt = null;
    if (chip.tipo === 'S') {
      path = '/modulo-pesquisa-preco/3_consultarServico';
      params = { codigoItemCatalogo: chip.codigo, ...base };
      alt = { tipo: 'codigoItemCatalogo', codigo: chip.codigo, ...base };
    } else {
      path = '/modulo-pesquisa-preco/1_consultarMaterial';
      params = { tipo: chip.nivel === 'pdm' ? 'codigoPdm' : 'codigoItemCatalogo', codigo: chip.codigo, ...base };
      if (chip.nivel !== 'pdm') alt = { codigoItemCatalogo: chip.codigo, ...base };
      if (chip.nivel !== 'pdm' && cfg().painelAssinatura === 'legado') [params, alt] = [alt, params];
    }
    let r, nota = '';
    try { r = await paginar(DA(), path, params, ctx); } catch (e) {
      if (alt && cfg().painelAssinatura !== 'fixa' && e instanceof H.HttpError && e.status === 404) {
        r = await paginar(DA(), path, alt, ctx);
        nota = 'A assinatura padrão da rota foi recusada (404); a consulta usou a assinatura alternativa.';
      } else throw e;
    }
    let linhas = r.registros.map(mapPainel).filter(valida);
    if (f.esfera) linhas = linhas.filter((x) => x.esfera === f.esfera);
    return { linhas, total: r.total, truncado: r.truncado, urls: r.urls, nota };
  }

  /* ---------- contratações publicadas no PNCP (Lei 14.133) ---------- */
  function janelas(de, ate, dias) {
    const out = [];
    let ini = de;
    while (ini <= ate) { let fim = U.addDays(ini, dias - 1); if (fim > ate) fim = ate; out.push([ini, fim]); ini = U.addDays(fim, 1); }
    return out;
  }
  async function porJanelas(path, montar, f, ctx, diasMax) {
    const fila = janelas(f.de, f.ate, diasMax);
    let registros = [], urls = [], total = 0, truncado = false, nota = '';
    while (fila.length) {
      const [a, b] = fila.shift();
      try {
        const r = await paginar(DA(), path, montar(a, b), ctx);
        registros = registros.concat(r.registros); urls = urls.concat(r.urls); total += r.total; truncado = truncado || r.truncado;
      } catch (e) {
        if (e instanceof H.HttpError && e.status === 400 && U.daysBetween(a, b) > 31) {
          const meio = U.addDays(a, Math.floor(U.daysBetween(a, b) / 2));
          fila.unshift([U.addDays(meio, 1), b]); fila.unshift([a, meio]);
          nota = 'O período foi dividido em janelas menores por exigência da API.';
          continue;
        }
        throw e;
      }
    }
    return { registros, urls, total, truncado, nota };
  }
  async function contratacoes(chip, f, ctx) {
    const extra = { materialOuServico: chip.tipo, temResultado: f.somenteHomologados ? 'true' : undefined };
    if (chip.nivel === 'pdm') extra.codigoPdm = chip.codigo; else extra.codItemCatalogo = chip.codigo;
    const r = await porJanelas('/modulo-contratacoes/2_consultarItensContratacoes_PNCP_14133', (a, b) => ({ dataInclusaoPncpInicial: a, dataInclusaoPncpFinal: b, ...extra }), f, ctx, Math.max(31, cfg().janelaContratacoesDias || 365));
    let linhas = r.registros.map((x) => mapContratacao(x, f.incluirEstimados)).filter((x) => x && valida(x));
    if (cfg().completarOrgao && linhas.length) await completarOrgaos(linhas, ctx);
    let nota = r.nota;
    if (f.uf) { const antes = linhas.length; linhas = linhas.filter((x) => !x.uf || x.uf === f.uf); if (linhas.some((x) => !x.uf)) nota = (nota ? nota + ' ' : '') + 'Itens sem UF identificada foram mantidos.'; if (antes !== linhas.length) nota = (nota ? nota + ' ' : '') + `${antes - linhas.length} itens de outras UFs foram removidos.`; }
    if (f.esfera) linhas = linhas.filter((x) => !x.esfera || x.esfera === f.esfera);
    return { linhas, total: r.total, truncado: r.truncado, urls: r.urls, nota };
  }
  async function completarOrgaos(linhas, ctx) {
    const ids = [...new Set(linhas.map((x) => x.idCompra).filter(Boolean))].slice(0, cfg().maxEnriquecimento || 40);
    const info = new Map();
    await H.emLotes(ids, Math.max(1, Math.min(4, cfg().concorrencia || 3)), async (id) => {
      try {
        const { dados } = await H.pedir(url(DA(), '/modulo-contratacoes/1.1_consultarContratacoes_PNCP_14133_Id', { tipo: 'idCompra', codigo: id, pagina: 1, tamanhoPagina: 10 }), { signal: ctx.signal });
        const c = dados && dados.resultado && dados.resultado[0];
        if (c) info.set(id, c);
      } catch (e) { if (e.name === 'AbortError') throw e; }
    }, ctx.signal);
    for (const x of linhas) {
      const c = info.get(x.idCompra);
      if (!c) continue;
      x.orgao = c.orgaoEntidadeRazaoSocial || c.unidadeOrgaoNomeUnidade || x.orgao;
      x.unidadeCompradora = c.unidadeOrgaoNomeUnidade || '';
      x.uf = c.unidadeOrgaoUfSigla || x.uf;
      x.municipio = c.unidadeOrgaoMunicipioNome || x.municipio;
      x.modalidade = c.modalidadeNome || x.modalidade;
      x.esfera = ESFERA[c.orgaoEntidadeEsferaId] || x.esfera;
      x.objeto = c.objetoCompra || '';
      x.srp = c.srp;
      if (!x.url) x.url = linkPncp(c.numeroControlePNCP);
    }
  }

  /* ---------- NF-e do Poder Executivo Federal (Portal da Transparência) ---------- */
  function cabNota(n) {
    n = n || {};
    return {
      chave: U.onlyAlnum(U.pick(n, 'chaveNotaFiscal', 'chave', 'chaveUnicaNotaFiscal', 'chaveAcesso') || ''),
      numero: U.pick(n, 'numero', 'numeroNotaFiscal') || '', data: U.parseDate(U.pick(n, 'dataEmissao', 'dataEmissaoNotaFiscal')),
      emitente: U.pick(n, 'nomeFornecedor', 'nomeEmitente', 'razaoSocialEmitente') || '', cnpj: U.pick(n, 'cnpjFornecedor', 'cnpjEmitente') || '',
      orgao: U.pick(n, 'orgaoDestinatario', 'nomeOrgaoDestinatario', 'orgaoSuperiorDestinatario') || '',
      uf: U.pick(n, 'ufFornecedor', 'ufEmitente') || '', municipio: U.pick(n, 'municipioFornecedor', 'municipioEmitente') || '',
      valor: U.parseNum(U.pick(n, 'valorNotaFiscal', 'valor')), bruto: n,

  }
  // o detalhe da nota traz uma lista de itens; o mapeamento procura os campos por nome
  function itensDetalhe(det) {
    let achado = null;
    (function busca(o, prof) {
      if (achado || !o || typeof o !== 'object' || prof > 5) return;
      if (Array.isArray(o)) {
        const p = o[0];
        if (p && typeof p === 'object' && !Array.isArray(p)) {
          const ks = Object.keys(p);
          if (ks.some((k) => /descri/i.test(k)) && ks.some((k) => /valor|preco/i.test(k))) { achado = o; return; }
        }
        for (const x of o) busca(x, prof + 1);
        return;
      }
      for (const k of Object.keys(o)) busca(o[k], prof + 1);
    })(det, 0);
    if (!achado) return [];
    return achado.map((it) => {
      const ks = Object.keys(it);
      const k = (...res) => { for (const re of res) { const x = ks.find((y) => re.test(y)); if (x) return x; } return null; };
      const kd = k(/descri\w*produto|produto\w*descri/i, /^descri(?!.*ncm)/i, /descri(?!.*ncm)/i);
      const kn = k(/codigo\w*ncm|^ncm/i, /ncm/i);
      const ku = k(/^unidade|^unid/i, /unidade/i);
      const kq = k(/^quantidade/i, /quant/i);
      const kv = k(/valorunit|unitario|precounit/i);
      const kt = k(/^valor$|valortotal|valorproduto|valoritem/i);
      const qtd = U.parseNum(it[kq]);
      let unit = kv ? U.parseNum(it[kv]) : NaN;
      if (!(unit > 0) && kt && qtd > 0) unit = U.parseNum(it[kt]) / qtd;
      return { descricao: kd ? String(it[kd] || '') : '', ncm: kn ? String(it[kn] ?? '') : '', unidade: ku ? String(it[ku] ?? '') : '', qtd, unit, bruto: it };
    }).filter((x) => x.descricao && x.unit > 0);
  }
  function cabecalhosPT() {
    const key = (cfg().chaveTransparencia || '').trim();
    if (!key) throw new Error('Informe a chave de acesso da API do Portal da Transparência (aba Notas fiscais). O cadastro é gratuito.');
    return { Accept: 'application/json', 'chave-api-dados': key };
  }
  async function notaPorChave(chave, signal) {
    const u = url(PT(), '/api-de-dados/notas-fiscais-por-chave', { chaveUnicaNotaFiscal: U.onlyAlnum(chave) });
    const { dados } = await H.pedir(u, { headers: cabecalhosPT(), signal });
    return { dados, url: u };
  }
  async function nfePortal(texto, f, ctx) {
    const headers = cabecalhosPT();
    const notas = [], urls = [];
    for (let p = 1; p <= Math.max(1, cfg().nfePaginas || 1); p++) {
      const u = url(PT(), '/api-de-dados/notas-fiscais', { nomeProduto: texto, cnpjEmitente: f.cnpjEmitente || undefined, codigoOrgao: f.codigoOrgao || undefined, pagina: p });
      urls.push(u);
      const { dados } = await H.pedir(u, { headers, signal: ctx.signal });
      const lista = Array.isArray(dados) ? dados : (dados && dados.resultado) || [];
      notas.push(...lista);
      if (ctx.onPagina) ctx.onPagina(p, cfg().nfePaginas || 1, notas.length, null);
      if (!lista.length) break;
    }
    const cab = notas.map(cabNota).filter((n) => n.chave && (!n.data || ((!f.de || n.data >= f.de) && (!f.ate || n.data <= f.ate))));
    const alvo = cab.slice(0, cfg().nfeMaxNotas || 20);
    const q = U.tokens(texto);
    const linhas = [];
    let i = 0;
    for (const n of alvo) {
      i++;
      if (ctx.onDetalhe) ctx.onDetalhe(i, alvo.length);
      let det;
      try { const r = await notaPorChave(n.chave, ctx.signal); det = r.dados; urls.push(r.url); } catch (e) { if (e.name === 'AbortError') throw e; continue; }
      const cd = cabNota((det && (det.notaFiscal || det.nota)) || det || {});
      for (const it of itensDetalhe(det)) {
        if (q.length && U.matchScore(it.descricao, q) < 1) continue;
        linhas.push(linha({
          origem: 'nfe-portal', parametro: 'V', descricao: it.descricao, unidade: it.unidade, quantidade: it.qtd, preco: it.unit,
          data: n.data || cd.data, fornecedor: n.emitente || cd.emitente, ni: n.cnpj || cd.cnpj, orgao: n.orgao || cd.orgao,
          uf: n.uf || cd.uf, municipio: n.municipio || cd.municipio, ncm: it.ncm, ref: `NF-e ${n.chave}`, chave: n.chave, bruto: { nota: n.bruto, item: it.bruto },
        }));
      }
    }
    return { linhas, total: cab.length, truncado: cab.length > alvo.length, urls, nota: cab.length > alvo.length ? `Foram detalhadas ${alvo.length} de ${cab.length} notas (limite ajustável em Configurações).` : '' };
  }
  function notaPortalParaLocal(det, chave) {
    const cd = cabNota((det && (det.notaFiscal || det.nota)) || det || {});
    const itens = itensDetalhe(det).map((it, k) => ({ n: k + 1, cProd: '', ean: '', descricao: it.descricao, ncm: it.ncm, cfop: '', unidade: it.unidade, qtd: it.qtd, vUnCom: it.unit, vProd: it.qtd * it.unit, vDesc: 0, preco: it.unit }));
    return { chave: cd.chave || U.onlyAlnum(chave), numero: cd.numero || null, serie: '', modelo: '55', data: cd.data, natOp: '', emitDoc: cd.cnpj, emitNome: cd.emitente, emitUF: cd.uf, emitMun: cd.municipio, destDoc: '', destNome: cd.orgao, destUF: '', valorTotal: cd.valor, itens, situacao: '', origem: 'Portal da Transparência', importadaEm: U.nowISO() };
  }

  /* ---------- NF-e importadas (base local) ---------- */
  function nfeLocal(texto, f, ncms) {
    const q = U.tokens(texto);
    const linhas = [];
    for (const n of CP.state.nfe) {
      if (f.de && n.data && n.data < f.de) continue;
      if (f.ate && n.data && n.data > f.ate) continue;
      for (const it of n.itens || []) {
        const sc = q.length ? U.matchScore(it.descricao, q) : 0;
        const ncmOk = ncms && ncms.size > 0 && ncms.has(U.onlyAlnum(it.ncm));
        if (!(sc === 1 || (ncmOk && sc >= 0.5))) continue;
        linhas.push(linha({
          origem: 'nfe-xml', parametro: 'V', descricao: it.descricao, unidade: it.unidade, quantidade: it.qtd, preco: it.preco,
          data: n.data, fornecedor: n.emitNome, ni: n.emitDoc, orgao: n.destNome, uf: n.emitUF, municipio: n.emitMun, ncm: it.ncm,
          ref: `NF-e ${n.chave}, item ${it.n}`, chave: n.chave, ncmConfere: !!ncmOk, bruto: { nota: { chave: n.chave, numero: n.numero, serie: n.serie, emitente: n.emitNome }, item: it },
        }));
      }

  }

  /* ---------- IPCA (BCB/SGS, série 433) ---------- */
  const ipca = {
    async atualizar(desdeISO, signal) {
      const ini = U.addMonths(desdeISO || U.addMonths(U.todayISO(), -36), -1);
      const u = url(BCB(), '/dados/serie/bcdata.sgs.433/dados', { formato: 'json', dataInicial: U.fmtDate(ini), dataFinal: U.fmtDate(U.todayISO()) });
      const { dados } = await H.pedir(u, { signal });
      const serie = { ...(CP.state.ipca.serie || {}) };
      for (const p of dados || []) { const d = U.parseDate(p.data); const v = U.parseNum(p.valor); if (d && Number.isFinite(v)) serie[d.slice(0, 7)] = v; }
      CP.state.ipca = { serie, atualizadoEm: U.nowISO() };

    },
  };

  /* ---------- orquestração da pesquisa ---------- */
  function rotuloChip(c) { return `${c.tipo === 'S' ? 'CATSER' : c.nivel === 'pdm' ? 'PDM' : 'CATMAT'} ${c.codigo}`; }
  async function pesquisar({ chips, texto, filtros, fontes }, ctx, aoStatus) {
    const tarefas = [];
    for (const c of chips) {
      if (fontes.painel) tarefas.push({ fonte: 'painel', rotulo: `Painel de Preços · ${rotuloChip(c)}`, fn: (cx) => painel(c, filtros, cx) });
      if (fontes.pncp) tarefas.push({ fonte: 'pncp', rotulo: `Contratações PNCP · ${rotuloChip(c)}`, fn: (cx) => contratacoes(c, filtros, cx) });
      if (fontes.arp) tarefas.push({ fonte: 'arp', rotulo: `Atas de registro de preços · ${rotuloChip(c)}`, fn: (cx) => atas(c, filtros, cx) });
    }
    const ncms = new Set(chips.map((c) => U.onlyAlnum(c.ncm)).filter(Boolean));
    if (texto && fontes.nfePortal && (cfg().chaveTransparencia || '').trim()) tarefas.push({ fonte: 'nfe-portal', rotulo: `NF-e Portal da Transparência · “${texto}”`, fn: (cx) => nfePortal(texto, filtros, cx) });
    if ((texto || ncms.size) && fontes.nfeLocal) tarefas.push({ fonte: 'nfe-xml', rotulo: `NF-e importadas · “${texto || 'NCM'}”`, fn: async () => nfeLocal(texto, filtros, ncms) });
    const resumo = tarefas.map((t) => ({ fonte: t.fonte, rotulo: t.rotulo, estado: 'aguardando', n: 0, total: 0, progresso: 0 }));
    const linhas = [];
    await H.emLotes(tarefas, 2, async (t, k) => {
      const s = resumo[k];
      s.estado = 'rodando'; aoStatus && aoStatus(resumo);
      const cx = { signal: ctx.signal, onPagina: (p, tp) => { s.progresso = tp ? p / tp : 0; aoStatus && aoStatus(resumo); }, onDetalhe: (i, n) => { s.progresso = i / n; s.det = `nota ${i} de ${n}`; aoStatus && aoStatus(resumo); } };
      try {
        const r = await t.fn(cx);
        const reg = CP.registro.adicionar({ fonte: t.fonte, rotulo: t.rotulo, filtros: { de: filtros.de, ate: filtros.ate, uf: filtros.uf || '' }, urls: r.urls, registros: r.linhas.length, total: r.total, status: 'ok', nota: r.nota || '' });
        for (const l of r.linhas) { l.consultaId = reg.id; l.acessoEm = reg.quando; }
        linhas.push(...r.linhas);
        Object.assign(s, { estado: 'ok', n: r.linhas.length, total: r.total, truncado: r.truncado, nota: r.nota, urls: r.urls, progresso: 1, det: '' });
      } catch (e) {
        if (e.name === 'AbortError') { s.estado = 'cancelado'; throw e; }
        const msg = H.explicar(e);
        CP.registro.adicionar({ fonte: t.fonte, rotulo: t.rotulo, filtros: { de: filtros.de, ate: filtros.ate, uf: filtros.uf || '' }, urls: e.url ? [e.url] : [], registros: 0, status: 'erro', erro: msg });
        Object.assign(s, { estado: 'erro', erro: msg, url: e.url || '', tipoErro: e.name });
      }
      aoStatus && aoStatus(resumo);
    }, ctx.signal);
    // mesma compra/item vinda de duas fontes conta uma vez só
    const vistos = new Set();
    let duplicados = 0;
    const unicos = [];
    for (const l of linhas) {
      const k = l.idCompra && l.numeroItem !== '' ? `${l.idCompra}|${l.numeroItem}|${U.onlyAlnum(l.ni)}` : l.chave ? `${l.chave}|${U.norm(l.descricao)}|${l.preco}` : null;
      if (k && vistos.has(k)) { duplicados++; continue; }

  /* ---------- importação de respostas salvas pelo navegador ---------- */
  function importarJSON(obj) {
    const arr = Array.isArray(obj) ? obj : Array.isArray(obj && obj.resultado) ? obj.resultado : Array.isArray(obj && obj.data) ? obj.data : null;
    if (!arr || !arr.length) throw new Error('O JSON não contém registros reconhecíveis (esperado: lista ou campo "resultado").');
    const a = arr[0] || {};
    let linhas;
    if ('precoUnitario' in a) linhas = arr.map(mapPainel);
    else if ('valorUnitarioResultado' in a || 'valorUnitarioEstimado' in a) linhas = arr.map((r) => mapContratacao(r, false)).filter(Boolean);
    else if ('numeroControlePncpAta' in a || ('valorUnitario' in a && 'numeroItem' in a)) linhas = arr.map((r) => mapAta(r));
    else if (U.pick(a, 'chaveNotaFiscal')) throw new Error('Este JSON é uma lista de notas sem os itens. Consulte as notas pela chave na aba Notas fiscais.');
    else throw new Error('Formato de JSON não reconhecido. Use respostas das rotas de pesquisa de preço, itens de contratações ou itens de atas.');
    const ok = linhas.filter(valida);
    const quando = U.nowISO();
    const reg = CP.registro.adicionar({ fonte: ok[0] ? ok[0].origem : 'importacao', rotulo: 'Importação de resposta JSON salva pelo navegador', registros: ok.length, total: arr.length, status: 'ok', urls: [] });
    ok.forEach((l) => { l.consultaId = reg.id; l.acessoEm = quando; });
    return ok;
  }

  return { catalogo, painel, contratacoes, atas, nfePortal, notaPorChave, notaPortalParaLocal, itensDetalhe, nfeLocal, ipca, pesquisar, importarJSON, mapPainel, mapContratacao, mapAta, linkPncp, linkCompras, janelas, NOMES_FONTE, PARAMETRO, MODALIDADE, linha };
})();

/* ===== 05-nfe.js ===== */
/* Notas fiscais eletrônicas: chave de acesso, leitura de XML (NF-e/NFC-e) e ZIP, base local.
   A consulta direta à SEFAZ exige certificado ICP-Brasil e TLS mútuo, o que o navegador não faz;
   por isso a integração por chave usa o Portal da Transparência ou uma API própria do órgão. */
CP.nfe = (() => {
  const U = CP.util;
  const UF = { 11: 'RO', 12: 'AC', 13: 'AM', 14: 'RR', 15: 'PA', 16: 'AP', 17: 'TO', 21: 'MA', 22: 'PI', 23: 'CE', 24: 'RN', 25: 'PB', 26: 'PE', 27: 'AL', 28: 'SE', 29: 'BA', 31: 'MG', 32: 'ES', 33: 'RJ', 35: 'SP', 41: 'PR', 42: 'SC', 43: 'RS', 50: 'MS', 51: 'MT', 52: 'GO', 53: 'DF' };
  const MODELOS = { 55: 'NF-e (modelo 55)', 65: 'NFC-e (modelo 65)' };
  const EMISSAO = { 1: 'Normal', 2: 'Contingência FS-IA', 3: 'Regime especial (NFF)', 4: 'Contingência EPEC', 5: 'Contingência FS-DA', 6: 'Contingência SVC-AN', 7: 'Contingência SVC-RS', 9: 'Contingência off-line NFC-e' };
