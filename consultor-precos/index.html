    return h;
  }
  function renderAssistida() {
    const el = sec('pq-modo-assistida');
    if (!el) return;
    el.innerHTML = `<section class="secao"><div class="grade">
        <label class="f" style="grid-column:1/-1"><span>Descrição do item</span><textarea id="lt-desc" rows="3" placeholder="Ex.: Cabo de rede UTP categoria 6, caixa com 305 metros, cor azul">${esc(as.desc)}</textarea><em>Escreva como no termo de referência. O sistema encontra o código no catálogo, pesquisa nas fontes e envia à cesta os preços comparáveis.</em></label>
        <label class="f"><span>Tipo</span><select id="lt-tipo"><option value="M" ${as.tipo !== 'S' ? 'selected' : ''}>Material</option><option value="S" ${as.tipo === 'S' ? 'selected' : ''}>Serviço</option></select></label>
        <label class="f"><span>Unidade</span><input id="lt-un" value="${esc(as.unidade)}" placeholder="ex.: UN, M, CX 12 UN"><em>Se ficar vazia, vale a mais frequente</em></label>
        <label class="f"><span>Quantidade</span><input id="lt-qtd" type="number" min="0" step="any" value="${esc(as.quantidade)}"></label>
        ${controlesFiltro('lt')}
      </div>
      <div class="linha" style="margin-top:12px"><button type="button" class="btn primario" data-acao="lt-montar" ${as.rodando ? 'disabled' : ''}>Montar a cesta automaticamente</button><button type="button" class="btn" data-acao="lt-cancelar" ${as.rodando ? '' : 'hidden'}>Cancelar</button></div></section>
      <section class="secao" id="lt-andamento" ${as.etapas.length ? '' : 'hidden'}>${andamento()}</section>`;
  }
  const atualizarAndamento = () => { const el = sec('lt-andamento'); if (el) { el.hidden = !as.etapas.length; el.innerHTML = andamento(); } };
  function lerCamposAssistida() {
    if (sec('lt-desc')) as.desc = sec('lt-desc').value.trim();
    if (sec('lt-tipo')) as.tipo = sec('lt-tipo').value;
    if (sec('lt-un')) as.unidade = sec('lt-un').value.trim();
    if (sec('lt-qtd')) as.quantidade = U.parseNum(sec('lt-qtd').value) || 1;
  }
  async function montar(escolha) {
    if (as.rodando) return;
    lerCamposAssistida();
    if (!as.desc) { CP.ui.toast('Descreva o item a pesquisar.', 'erro'); return; }
    as.rodando = true; as.itemId = null; as.pausa = false;
    ctrl = new AbortController();
    as.etapas = [{ t: 'Catálogo', st: 'rodando', det: CP.state.catalogo.baixadoEm ? 'procurando o código…' : 'baixando o catálogo oficial (só na primeira vez; leva alguns minutos)…' }];
    renderAssistida();
    try {
      let chip = escolha;
      if (chip === undefined) {
        const cands = await casar(as.desc, as.tipo, ctrl.signal);
        as.cands = cands;
        const conf = confianca(cands);
        if (conf === 'baixa' || conf === 'nenhuma') {
          as.etapas[0] = { t: 'Catálogo', st: 'aviso', det: cands.length ? 'há mais de um código possível' : 'nenhum código encontrado no catálogo' };
          as.pausa = true; as.rodando = false; ctrl = null; renderAssistida();
          return;
        }
        chip = cands[0];
        as.etapas[0] = { t: 'Catálogo', st: 'ok', det: `${rotCod(chip)}: ${String(chip.descricao).slice(0, 150)} (confiança ${conf})` };
      } else as.etapas[0] = { t: 'Catálogo', st: 'ok', det: chip ? `${rotCod(chip)}: ${String(chip.descricao).slice(0, 150)} (escolhido por você)` : 'sem código: pesquisa por texto nas notas fiscais' };
      as.etapas.push({ t: 'Pesquisa', st: 'rodando', det: 'consultando as fontes…' });
      atualizarAndamento();
      const r = await processar({ descricao: as.desc, unidade: as.unidade, quantidade: as.quantidade, tipo: as.tipo }, chip || null, ctrl.signal, (res) => {
        const k = res.filter((s) => s.estado === 'ok' || s.estado === 'erro').length;
        as.etapas[1].det = `${k} de ${res.length} consultas concluídas`;
        atualizarAndamento();
      });
      as.itemId = r.itemId;
      as.etapas[1] = { t: 'Pesquisa', st: r.falhas.length ? 'aviso' : 'ok', det: `${U.plural(r.encontrados, 'preço encontrado', 'preços encontrados')}${r.falhas.length ? `; ${U.plural(r.falhas.length, 'fonte falhou', 'fontes falharam')}` : ''}` };
      as.etapas.push({ t: 'Seleção', st: r.selecionados >= 3 ? 'ok' : 'aviso', det: `${U.plural(r.selecionados, 'preço comparável enviado', 'preços comparáveis enviados')} à cesta (mesmo código ou descrição semelhante, com unidade conversível)` });
      as.etapas.push({ t: 'Cesta', st: r.alertas ? 'aviso' : 'ok', det: `valor unitário estimado ${U.fmtPrice(r.valor)}${r.alertas ? `; ${U.plural(r.alertas, 'ponto de atenção', 'pontos de atenção')} para revisar` : ''}` });
    } catch (e) {
      if (e.name === 'AbortError') as.etapas.push({ t: 'Cancelado', st: 'aviso', det: 'a pesquisa foi interrompida' });
      else { as.etapas.push({ t: 'Falha', st: 'erro', det: CP.http.explicar(e) }); if (e instanceof CP.http.RedeError) CP.conexao.notificarFalha(); }
    }
    as.rodando = false; ctrl = null;
    renderAssistida();
  }

  /* ---------- lista de itens ---------- */
  const SIT = { novo: ['', 'A casar'], casando: ['rodando', 'Procurando código…'], casado: ['ok', 'Código encontrado'], revisar: ['aviso', 'Conferir o código'], pesquisando: ['rodando', 'Pesquisando…'], pronto: ['ok', 'Pronto'], 'sem-preco': ['aviso', 'Sem preço comparável'], erro: ['erro', 'Falhou'] };
  const L = () => P().lote || null;
  function escolhido(l) {
    if (l.codigoInformado) return { tipo: l.tipo || 'M', nivel: 'item', codigo: String(l.codigoInformado), descricao: l.descricao };
    if (!l.cands || l.escolha == null || l.escolha < 0) return null;
    return l.cands[l.escolha] || null;
  }
  function linhaHtml(l, i) {
    const sit = SIT[l.estado] || ['', l.estado];
    const opcoes = (l.cands || []).map((c, k) => `<option value="${k}" ${l.escolha === k ? 'selected' : ''}>${esc(rotCod(c))} (${U.fmtPct(c.score, 0)}): ${esc(c.descricao.slice(0, 80))}</option>`).join('');
    const cod = l.codigoInformado ? `${l.tipo === 'S' ? 'CATSER' : 'CATMAT'} ${esc(l.codigoInformado)}`
      : l.cands ? `<select data-ltsel="${i}" aria-label="Código do item ${esc(l.numero)}" style="max-width:340px">${opcoes}<option value="-1" ${l.escolha === -1 ? 'selected' : ''}>Sem código (só texto)</option></select>` : '<span class="muted">—</span>';
    return `<tr><td>${esc(l.numero)}</td><td class="desc"><span class="clamp">${esc(l.descricao)}</span>${l.conf ? `<span class="sub">confiança ${esc(l.conf)}</span>` : ''}</td><td>${esc(l.unidade)}</td><td class="num">${U.fmtQtd(U.isNum(l.quantidade) ? l.quantidade : NaN)}</td><td>${cod}</td>
      <td><span class="st ${sit[0]}">${sit[1]}</span>${l.erro ? `<span class="sub" style="color:var(--red)">${esc(l.erro)}</span>` : ''}</td>
      <td class="num">${l.res ? `${l.res.selecionados} de ${l.res.encontrados}` : '—'}</td><td class="num">${l.res ? U.fmtPrice(l.res.valor) : '—'}</td>
      <td>${l.itemId ? `<button type="button" class="btn leve pq" data-acao="lt-revisar" data-id="${esc(l.itemId)}">Revisar</button>` : ''}</td></tr>`;
  }
  function renderLote() {
    const el = sec('pq-modo-lote');
    if (!el) return;
    const lote = L();
    if (lote && lote.rodando && !ctrl) { lote.rodando = false; lote.linhas.forEach((l) => { if (l.estado === 'pesquisando') l.estado = 'casado'; if (l.estado === 'casando') l.estado = 'novo'; }); }
    if (!lote) {
      el.innerHTML = `<section class="secao"><header><h3>Lista de itens</h3><div class="acoes"><button type="button" class="btn pq" data-acao="lt-modelo">Baixar planilha modelo</button></div></header>
        <p class="small">Cole as linhas copiadas da planilha do termo de referência, com a linha de títulos, ou escolha o arquivo (.xlsx ou .csv). Colunas reconhecidas: descrição (obrigatória), unidade, quantidade, código CATMAT/CATSER e número do item. O sistema encontra os códigos, pesquisa cada item e monta a cesta para revisão.</p>
        <div class="grade"><label class="f"><span>Arquivo</span><input type="file" id="lt-arq" accept=".xlsx,.csv,.txt"></label>
        <label class="f" style="grid-column:1/-1"><span>Ou cole aqui</span><textarea id="lt-txt" rows="6" placeholder="Item&#9;Descrição&#9;Unidade&#9;Quantidade"></textarea></label></div>
        <p style="margin-top:8px"><button type="button" class="btn" data-acao="lt-ler">Ler a lista</button></p><div id="lt-mapa">${mapaHtml()}</div></section>`;
      return;
    }
    const ls = lote.linhas;
    const cont = (e) => ls.filter((l) => l.estado === e).length;
    const pend = ls.filter((l) => !['pronto', 'sem-preco'].includes(l.estado) || l.refazer).length;
    el.innerHTML = `<section class="secao"><header><h3>${U.plural(ls.length, 'item na lista', 'itens na lista')}</h3><span class="small muted">${cont('pronto')} prontos, ${cont('revisar')} para conferir, ${pend} pendentes</span>
        <div class="acoes"><button type="button" class="btn" data-acao="lt-casar" ${lote.rodando ? 'disabled' : ''}>Encontrar códigos</button><button type="button" class="btn primario" data-acao="lt-pesquisar" ${lote.rodando || !pend ? 'disabled' : ''}>Pesquisar ${pend ? U.plural(pend, 'item pendente', 'itens pendentes') : 'itens'}</button><button type="button" class="btn" data-acao="lt-parar" ${lote.rodando ? '' : 'hidden'}>Pausar</button><button type="button" class="btn pq perigo" data-acao="lt-limpar" ${lote.rodando ? 'disabled' : ''}>Começar outra lista</button></div></header>
      <div class="grade" style="margin-bottom:10px">${controlesFiltro('ll')}</div>
      ${lote.rodando ? `<p class="small" style="margin:0 0 4px">${esc(lote.msg || '')}</p><div class="barra" style="margin-bottom:10px"><i style="width:${Math.round((lote.prog || 0) * 100)}%"></i></div>` : ''}
      <div class="tabela-wrap"><table class="t"><thead><tr><th>Nº</th><th>Descrição</th><th>Unid.</th><th class="num">Qtd.</th><th>Código</th><th>Situação</th><th class="num">Preços</th><th class="num">Valor unit.</th><th></th></tr></thead><tbody>
      ${ls.map(linhaHtml).join('')}</tbody></table></div>
      <p class="small muted" style="margin-top:8px">“Preços” mostra quantos dos encontrados foram enviados à cesta. Troque o código de uma linha pronta e clique em pesquisar para refazê-la.</p></section>`;
  }
  function mapaHtml() {
    if (!leitura) return '';
    const m = mapaPadrao();
    return `<p class="small" style="margin-top:10px">${U.plural(leitura.linhas.length, 'linha lida', 'linhas lidas')}. Confira as colunas:</p><div class="grade">${CAMPOS.map(([k, rot]) => `<label class="f"><span>${rot}${k === 'descricao' ? ' (obrigatória)' : ''}</span><select data-ltmap="${k}"><option value="-1">Não usar</option>${leitura.cabecalho.map((h, i) => `<option value="${i}" ${m[k] === i ? 'selected' : ''}>${esc(h || 'coluna ' + (i + 1))}</option>`).join('')}</select></label>`).join('')}
      <label class="f"><span>Tipo dos itens</span><select id="lt-tipo-lista"><option value="M">Material</option><option value="S">Serviço</option></select></label></div>
      <p style="margin-top:10px"><button type="button" class="btn primario" data-acao="lt-criar">Criar a lista e encontrar os códigos</button></p>`;
  }
  async function lerLista() {
    try {
      const f = sec('lt-arq') && sec('lt-arq').files[0];
      if (f && /\.xlsx$/i.test(f.name)) leitura = await lerXlsx(await U.lerBuffer(f));
      else {
        const txt = f ? await U.lerTexto(f) : (sec('lt-txt') ? sec('lt-txt').value : '');
        if (!txt.trim()) { CP.ui.toast('Escolha um arquivo ou cole as linhas da planilha.', 'erro'); return; }
        leitura = CP.csv.ler(txt);
      }
      if (!leitura.linhas.length) { leitura = null; CP.ui.toast('Não encontrei linhas de itens abaixo da linha de títulos.', 'erro'); return; }
      const el = sec('lt-mapa');
      if (el) el.innerHTML = mapaHtml();
    } catch (e) { leitura = null; CP.ui.toast(e.message || String(e), 'erro', 8000); }
  }
  function criarLista() {
    if (!leitura) return;
    const m = {};
    raiz().querySelectorAll('[data-ltmap]').forEach((s) => { m[s.dataset.ltmap] = Number(s.value); });
    if (!(m.descricao >= 0)) { CP.ui.toast('Indique a coluna da descrição.', 'erro'); return; }
    const tipo = sec('lt-tipo-lista') ? sec('lt-tipo-lista').value : 'M';
    const g = (l, k) => (m[k] >= 0 ? String(l[m[k]] ?? '').trim() : '');
    const linhas = leitura.linhas.map((l, i) => {
      const cod = g(l, 'codigo').replace(/\D/g, '');
      return { id: U.uid('l'), numero: g(l, 'numero') || String(i + 1), descricao: g(l, 'descricao'), unidade: g(l, 'unidade'), quantidade: U.parseNum(g(l, 'quantidade')), tipo, codigoInformado: cod.length >= 3 ? cod : '', cands: null, escolha: null, conf: '', estado: cod.length >= 3 ? 'casado' : 'novo', itemId: null, res: null, erro: '' };
    }).filter((l) => l.descricao);
    if (!linhas.length) { CP.ui.toast('Nenhuma linha com descrição.', 'erro'); return; }
    P().lote = { linhas, criadoEm: U.nowISO(), rodando: false };
    leitura = null;
    CP.salvar.projeto();
    renderLote();
    casarTodos();
  }
  async function casarTodos() {
    const lote = L();
    if (!lote || lote.rodando) return;
    const alvo = lote.linhas.filter((l) => !l.codigoInformado && (l.estado === 'novo' || l.estado === 'erro'));
    if (!alvo.length) return;
    lote.rodando = true; ctrl = new AbortController();
    try {
      let k = 0;
      for (const l of alvo) {
        k++;
        lote.msg = CP.state.catalogo.baixadoEm ? `Procurando os códigos: ${k} de ${alvo.length}` : 'Baixando o catálogo oficial (só na primeira vez; leva alguns minutos)…';
        lote.prog = (k - 1) / alvo.length; l.estado = 'casando'; l.erro = '';
        renderLote();
        try {
          const c = await casar(l.descricao, l.tipo, ctrl.signal);
          l.cands = c.map(compacto); l.conf = confianca(c); l.escolha = c.length ? 0 : -1;
          l.estado = l.conf === 'alta' || l.conf === 'média' ? 'casado' : 'revisar';
        } catch (e) {
          if (e.name === 'AbortError') { l.estado = 'novo'; throw e; }
          l.estado = 'erro'; l.erro = CP.http.explicar(e);
          if (e instanceof CP.http.RedeError) { CP.conexao.notificarFalha(); throw e; }
        }
        CP.salvar.projeto();
      }
    } catch (e) { /* pausado ou sem conexão: as linhas restantes ficam pendentes */ }
    lote.rodando = false; lote.msg = ''; ctrl = null;
    CP.salvar.projeto(); renderLote();
  }
  async function pesquisarTodos() {
    let lote = L();
    if (!lote || lote.rodando) return;
    if (lote.linhas.some((l) => !l.codigoInformado && (l.estado === 'novo' || l.estado === 'erro'))) await casarTodos();
    lote = L();
    const alvo = lote.linhas.filter((l) => (!['pronto', 'sem-preco', 'novo', 'erro', 'casando'].includes(l.estado)) || l.refazer);
    if (!alvo.length) { renderLote(); return; }
    lote.rodando = true; ctrl = new AbortController();
    try {
      let k = 0;
      for (const l of alvo) {
        k++;
        lote.msg = `Pesquisando o item ${l.numero} (${k} de ${alvo.length})`; lote.prog = (k - 1) / alvo.length; l.estado = 'pesquisando'; l.erro = '';
        renderLote();
        try {
          const r = await processar(l, escolhido(l), ctrl.signal, null);
          l.res = { encontrados: r.encontrados, selecionados: r.selecionados, valor: r.valor, alertas: r.alertas };
          l.estado = r.nValidas ? 'pronto' : 'sem-preco'; l.refazer = false;
          if (r.falhas.length) l.erro = r.falhas[0];
        } catch (e) {
          if (e.name === 'AbortError') { l.estado = 'casado'; throw e; }
          l.estado = 'erro'; l.erro = CP.http.explicar(e);
          if (e instanceof CP.http.RedeError) { CP.conexao.notificarFalha(); throw e; }
        }
        CP.salvar.projeto();
      }
    } catch (e) { /* pausado ou sem conexão */ }
    lote.rodando = false; lote.msg = ''; ctrl = null;
    CP.salvar.projeto(); renderLote();
    const prontos = lote.linhas.filter((l) => l.estado === 'pronto').length;
    if (prontos) CP.ui.toast(`${U.plural(prontos, 'item pronto', 'itens prontos')} para revisão na cesta.`, 'ok');
  }

  /* ---------- eventos ---------- */
  function aplicarPeriodo(v) {
    const b = CP.pesquisa.estado(), m = Number(v);
    if (!m) return;
    const ref = P().dataReferencia || U.todayISO();
    b.filtros.ate = ref; b.filtros.de = U.addMonths(ref, -m);
    CP.pesquisa.salvarBusca();
  }
  function iniciar() {
    const r = raiz();
    CP.ui.on(r, 'click', '[data-acao^="lt-"]', async (e, t) => {
      const a = t.dataset.acao;
      if (a === 'lt-montar') montar();
      else if (a === 'lt-cancelar' || a === 'lt-parar') { if (ctrl) ctrl.abort(); }
      else if (a === 'lt-usar') { const i = Number(t.dataset.i); montar(i >= 0 && as.cands ? as.cands[i] : null); }
      else if (a === 'lt-revisar') { CP.state.ui.itemSel = t.dataset.id; if (CP.app) CP.app.irPara('cesta'); if (location.hash !== '#cesta') history.replaceState(null, '', '#cesta'); }
      else if (a === 'lt-novo') { Object.assign(as, { desc: '', unidade: '', quantidade: 1, etapas: [], cands: null, pausa: false, itemId: null }); renderAssistida(); }
      else if (a === 'lt-ler') lerLista();
      else if (a === 'lt-criar') criarLista();
      else if (a === 'lt-casar') casarTodos();
      else if (a === 'lt-pesquisar') pesquisarTodos();
      else if (a === 'lt-modelo') U.download('modelo-lista-de-itens.csv', CP.csv.gerar(['Item', 'Descrição', 'Unidade', 'Quantidade', 'Código CATMAT/CATSER'], [[1, 'Caneta esferográfica azul, ponta média 1,0 mm', 'UN', 500, ''], [2, 'Papel A4 75 g/m2, branco', 'RESMA', 200, ''], [3, 'Cabo de rede UTP categoria 6, caixa com 305 m', 'CX 305 M', 10, '']]), 'text/csv;charset=utf-8');
      else if (a === 'lt-limpar') {
        if (!(await CP.ui.confirmar('Começar outra lista? Os itens já enviados à cesta continuam nela.', { rotulo: 'Começar outra lista' }))) return;
        P().lote = null; CP.salvar.projeto(); renderLote();
      }
    });
    r.addEventListener('input', (e) => {
      const t = e.target;
      if (t.id === 'lt-desc') as.desc = t.value;
      else if (t.id === 'lt-un') as.unidade = t.value;
      else if (t.id === 'lt-qtd') as.quantidade = U.parseNum(t.value) || 1;
    });
    r.addEventListener('change', (e) => {
      const t = e.target;
      if (t.id === 'lt-tipo') as.tipo = t.value;
      else if (t.id === 'lt-periodo' || t.id === 'll-periodo') aplicarPeriodo(t.value);
      else if (t.id === 'lt-uf' || t.id === 'll-uf') { CP.pesquisa.estado().filtros.uf = t.value; CP.pesquisa.salvarBusca(); }
      else if (t.id === 'lt-arq' && t.files && t.files[0]) lerLista();
      else if (t.dataset.ltsel !== undefined) {
        const l = L() && L().linhas[Number(t.dataset.ltsel)];
        if (!l) return;
        l.escolha = Number(t.value);
        if (l.estado === 'pronto' || l.estado === 'sem-preco') l.refazer = true;
        if (l.estado === 'revisar') l.estado = 'casado';
        CP.salvar.projeto(); renderLote();
      }
    });
  }
  return { iniciar, renderAssistida, renderLote, casar, confianca, selecionar, processar, lerXlsx, casarTodos, pesquisarTodos, montar, estadoAssistida: () => as };
})();

/* ===== 09-ui-cesta.js ===== */
/* Aba 2 — Cesta de preços: análise crítica item a item */
CP.cesta = (() => {
  const U = CP.util;
  const esc = U.esc;
  const P = () => CP.state.projeto;
  const cfg = () => CP.state.settings;
  const raiz = () => document.getElementById('tab-cesta');
  const sec = (id) => document.getElementById(id);
  const ROT_PAR = {
    I: 'I — Painel de Preços ou banco de preços em saúde',
    II: 'II — Contratações similares, inclusive atas de registro de preços',
    III: 'III — Mídia especializada, tabela oficial ou sítio eletrônico',
    IV: 'IV — Pesquisa direta com fornecedores',
    V: 'V — Notas fiscais eletrônicas',
  };
  const ROT_CRIT = { iqr: 'Intervalo interquartil', sigma: 'Média ± desvios', mediana: 'Faixa sobre a mediana', nenhum: 'Sem critério estatístico' };
  const ROT_MET = { media: 'Média', mediana: 'Mediana', menor: 'Menor valor', ponderada: 'Média ponderada' };
  let sensAberto = true;

  function itemAtual() {
    const p = P();
    let it = p.itens.find((i) => i.id === CP.state.ui.itemSel);
    if (!it && p.itens.length) { it = p.itens[0]; CP.state.ui.itemSel = it.id; }
    return it || null;
  }
  const analisar = (it) => CP.stats.analisarItem(it, cfg(), P().dataReferencia);
  const verificar = (it, an) => CP.conformidade.item(it, an, cfg());
  function salvar() { CP.salvar.projeto(); CP.bus.emit('projeto'); }
  function renumerar() { P().itens.forEach((it, i) => { it.numero = i + 1; }); }
  function novoItem(d = {}) {
    const p = P();
    const it = { ...CP.defaults.item(p.itens.length + 1), ...d };
    p.itens.push(it);
    CP.state.ui.itemSel = it.id;
    salvar();
    return it;
  }
  function linhaParaAmostra(l) {
    return {
      id: U.uid('a'), origem: l.origem, parametro: l.parametro || CP.api.PARAMETRO[l.origem] || 'III', descricao: l.descricao || '', unidade: l.unidade || '',
      quantidade: U.isNum(l.quantidade) ? l.quantidade : null, preco: l.preco, data: l.data || null, fornecedor: l.fornecedor || '', niFornecedor: l.ni || '',
      orgao: l.orgao || '', uasg: l.uasg || '', uf: l.uf || '', municipio: l.municipio || '', marca: l.marca || '', referencia: l.ref || '',
      url: l.url || l.urlCompra || '', acessoEm: l.acessoEm || U.nowISO(), consultaId: l.consultaId || '', tipoValor: l.tipoValor || 'homologado',
      idCompra: l.idCompra || '', numeroItem: l.numeroItem ?? '', chave: l.chave || '',
      fator: 1, fatorOrigem: '', manual: null, motivoCod: '', motivo: '', obs: l.tipoValor === 'estimado' ? 'Valor estimado de contratação ainda sem resultado' : '',
    };
  }
  function adicionarLinhas(it, linhas) {
    const chave = (a) => `${a.origem}|${a.referencia}|${a.preco}|${U.onlyAlnum(a.niFornecedor)}`;
    const existe = new Set(it.amostras.map(chave));
    let n = 0, rep = 0;
    for (const l of linhas) {
      const a = linhaParaAmostra(l);
      if (!(a.preco > 0)) continue;
      const k = chave(a);
      if (existe.has(k)) { rep++; continue; }
      existe.add(k); it.amostras.push(a); n++;
    }
    salvar();
    return { n, rep };
  }

  /* ---------- justificativa: rascunho que acompanha a análise até o analista assumir o texto ---------- */
  const rascunho = (it, an) => (an.n ? CP.stats.textoJustificativa(it, an, cfg()) : '');
  function justificativaDe(it, an) { return it.justificativaAuto ? rascunho(it, an || analisar(it)) : it.justificativa || ''; }
  function sincronizarJustificativa(it, an) {
    if (!it.justificativaAuto) return false;
    const t = rascunho(it, an);
    if (t === (it.justificativa || '')) return false;
    it.justificativa = t;
    return true;
  }

    CP.ui.modal({
      titulo: 'Adicionar à cesta',

          <label class="f"><span>Quantidade estimada</span><input id="ad-qtd" type="number" min="0" step="any" value="1"></label>

          <label class="f"><span>Código CATMAT/CATSER</span><input id="ad-cod" value="${esc(sug.codigo || '')}"></label>

      aoAbrir: (c) => { c.querySelector('#ad-dest').addEventListener('change', (e) => { c.querySelector('#ad-novo').hidden = e.target.value !== '__novo'; }); },
      acoes: [{ rotulo: 'Cancelar' }, { rotulo: 'Adicionar', primario: true, acao: (c) => {
        const dest = c.querySelector('#ad-dest').value;

        if (dest === '__novo') {

          it = novoItem({ descricao: desc, unidade: c.querySelector('#ad-un').value.trim(), quantidade: U.parseNum(c.querySelector('#ad-qtd').value) || 1, tipo: c.querySelector('#ad-tipo').value, codigo: c.querySelector('#ad-cod').value.trim() });
        } else it = p.itens.find((i) => i.id === dest);
        if (!it) return false;
        const r = adicionarLinhas(it, linhas);
        CP.state.ui.itemSel = it.id;
        CP.ui.toast(`${U.plural(r.n, 'amostra adicionada', 'amostras adicionadas')} ao item ${it.numero}${r.rep ? ` (${r.rep} já estavam na cesta)` : ''}.`, 'ok');
        if (aoConcluir) aoConcluir(it);
        if (CP.state.ui.tab === 'cesta') render();
      } }],
    });
  }

  /* ---------- renderização ---------- */
  function render() {
    const p = P();
    raiz().innerHTML = `
      <div class="tab-head"><div><h2>Cesta de preços</h2><p>Revise as amostras de cada item, escolha o critério de saneamento e o método de cálculo e confira os pontos de atenção. Amostras desconsideradas continuam visíveis, riscadas, com o motivo.</p></div>
        <div class="acoes"><button type="button" class="btn primario" data-acao="novo-item">Novo item</button></div></div>
      ${p.itens.length ? '<div class="duas"><aside class="painel sticky" id="ce-lista"></aside><div id="ce-item"></div></div>'
        : CP.ui.vazio('A cesta está vazia', 'Crie um item e registre cotações, ou vá para a Pesquisa e use o modo Assistida, a Lista de itens ou “Adicionar à cesta”.', '<p><button type="button" class="btn primario" data-acao="novo-item">Novo item</button> <a class="btn" href="#pesquisa">Ir para a Pesquisa</a></p>')}`;
    if (p.itens.length) { renderLista(); renderItem(); }
  }
  const MARCA = { ok: ['v-ok', '✓', 'Conforme'], aviso: ['v-aviso', '!', 'Há pontos de atenção'], erro: ['v-erro', '✗', 'Há pendências'] };
  function renderLista() {
    const el = sec('ce-lista');
    if (!el) return;
    let total = 0, faltam = 0;
    const lis = P().itens.map((it) => {
      const an = analisar(it);
      if (U.isNum(an.estimativa.total)) total += an.estimativa.total; else faltam++;
      const m = MARCA[CP.conformidade.pior(verificar(it, an))];
      return `<li><button type="button" data-acao="sel-item" data-id="${it.id}" aria-current="${it.id === CP.state.ui.itemSel}"><span class="n">${it.numero}</span><span class="d" title="${esc(it.descricao)}">${esc(it.descricao || 'Item sem descrição')}</span><span class="v">${U.fmtPrice(an.estimativa.unitario)}</span><span class="sub"><span class="marca ${m[0]}" title="${m[2]}" aria-label="${m[2]}">${m[1]}</span>${an.nValidas} de ${an.n} válidas</span></button></li>`;
    }).join('');
    el.innerHTML = `<h3>Itens</h3><ul class="itens-lista" style="margin-top:8px">${lis}</ul><div class="total-geral"><span>Total estimado</span><b>${U.fmtBRL(total)}</b></div>${faltam ? `<p class="small muted">${U.plural(faltam, 'item ainda sem valor', 'itens ainda sem valor')}.</p>` : ''}`;

  function renderItem() {

      <div class="grade">
        <label class="f" style="grid-column:1/-1"><span>Descrição do item</span><textarea data-campo="descricao" rows="2">${esc(it.descricao)}</textarea><em>As descrições das amostras são comparadas com esta: medidas, categoria, formato e cor diferentes são apontados.</em></label>
        <label class="f"><span>Unidade de fornecimento</span><input data-campo="unidade" value="${esc(it.unidade)}" placeholder="ex.: UN, CX 12 UN, RESMA"></label>

        <label class="f"><span>Código CATMAT/CATSER</span><input data-campo="codigo" value="${esc(it.codigo)}"></label>
      </div>`;
  }
  function nomeMetodo(an) {
    const e = an.estimativa;
    if (!e.efetivo) return 'Sem amostras válidas';
    let t = 'Método: ' + CP.stats.NOME_METODO[e.efetivo];
    if (e.efetivo === 'ponderada') t += ` (${e.nPond} de ${an.nValidas} com quantidade)`;
    if (e.fallback) t += ' (sem quantidades informadas)';
    return t;
  }
  function renderAnalise(it, an = analisar(it)) {
    const c = it.criterio || {}, e = an.estimativa, r = an.resumo, escala = an.escala;
    const indep = it.independencia || cfg().independencia || 'livre';

    const checks = verificar(it, an);
    sec('ce-analise').innerHTML = `<header><h3>Análise crítica</h3></header>
      <div class="analise"><div>
        <div class="grade">
          <label class="f"><span>Critério de saneamento</span><select data-crit="tipo">${Object.entries(CP.stats.CRITERIOS).map(([k, v]) => `<option value="${k}" ${c.tipo === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
          ${par}
          <label class="f"><span>Método de cálculo</span><select data-campo="metodo">${Object.entries(CP.stats.METODOS).map(([k, v]) => `<option value="${k}" ${it.metodo === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
          <label class="f"><span>Ajuste sobre o valor (%)</span><input data-campo="ajustePct" type="number" step="0.01" value="${it.ajustePct || 0}"><em>Opcional (art. 6º, §2º)</em></label>
        </div>
        <div class="grade" style="margin-top:10px">
          <label class="f"><span>Escala de quantidade</span><select data-escala="ativo"><option value="0" ${escala.ativo ? '' : 'selected'}>Considerar todas as quantidades</option><option value="1" ${escala.ativo ? 'selected' : ''}>Só entre os limites</option></select><em>Quantidade da aquisição ÷ quantidade estimada</em></label>
          ${escala.ativo ? `<label class="f"><span>Mínimo (× a estimada)</span><input data-escala="min" type="number" step="any" min="0" value="${escala.min ?? 0.1}"></label><label class="f"><span>Máximo (× a estimada)</span><input data-escala="max" type="number" step="any" min="0" value="${escala.max ?? 10}"></label>` : ''}
          <label class="f"><span>Independência das amostras</span><select data-campo="independencia">${[['livre', 'Sem restrição (só alertas)'], ['compra', 'No máximo uma por compra'], ['fornecedor', 'No máximo uma por fornecedor']].map(([k, v]) => `<option value="${k}" ${indep === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        </div>
        <div class="stats">${[['Amostras válidas', `${an.nValidas} de ${an.n}`], ['Mínimo', U.fmtPrice(r.min)], ['Mediana', U.fmtPrice(r.mediana)], ['Média', U.fmtPrice(r.media)], ['Máximo', U.fmtPrice(r.max)], ['Coef. de variação', U.fmtPct(r.cv)], ['Faixa aceita', an.limites.aplicado ? `${U.fmtPrice(Math.max(0, an.limites.lo))} <small>a</small> ${U.fmtPrice(an.limites.hi)}` : '—', 'faixa'], ['Fornecedores', an.nValidas ? U.fmtInt(an.independencia.fornecedores) : '—']].map(([k, v, c]) => `<div${c ? ` class="${c}"` : ''}><span>${k}</span><b>${v}</b></div>`).join('')}</div>
        <div id="ce-regua"></div>${CP.graficos.legenda(an.limites.aplicado, true)}
      </div>
      <div class="carimbo" aria-live="polite"><span>Valor unitário estimado</span><b>${U.fmtPrice(e.unitario)}</b><em>${esc(nomeMetodo(an))}${e.ajustePct ? `, ajuste de ${U.fmtNum(e.ajustePct, 2, 0)}%` : ''}</em><em>Total para ${U.fmtQtd(it.quantidade)} ${esc(it.unidade || 'un.')}: ${U.fmtBRL(e.total)}</em></div></div>
      <div class="pontos" id="ce-pontos">${pontosHtml(checks)}</div>
      <details class="sens" id="ce-sens" ${sensAberto ? 'open' : ''}><summary>Sensibilidade do valor estimado</summary>${sensHtml(it, an)}</details>
      <div class="linha" style="margin-top:12px"><label class="f" style="max-width:240px"><span>Comparar um preço com a cesta</span><input id="ce-comparar" inputmode="decimal" placeholder="ex.: 12,50"></label><p id="ce-comparar-res" class="small" style="margin:0 0 8px;flex:1 1 300px"></p></div>`;
    desenharRegua(it, an);
  }
  function pontosHtml(checks) {
    const pend = CP.conformidade.pendencias(checks);
    const nOk = checks.filter((x) => x.status === 'ok').length;
    if (!pend.length) return `<p class="verif-ok"><span class="marca v-ok" aria-hidden="true">✓</span>Item conforme: ${U.plural(nOk, 'verificação atendida', 'verificações atendidas')}.</p>`;
    return `<h4>Pontos de atenção</h4><ul class="verif">${pend.map((x) => `<li class="v-${x.status}"><span class="ic" aria-label="${CP.conformidade.ROTULO[x.status]}">${x.status === 'erro' ? '✗' : '!'}</span><div><b>${esc(x.titulo)}.</b> ${esc(x.texto)}<em>${esc(x.ref)}</em></div></li>`).join('')}</ul>
      <p class="small muted">${U.plural(nOk, 'verificação atendida', 'verificações atendidas')}. ✗ indica pendência a resolver antes de emitir o relatório; ! pede atenção ou justificativa nos autos.</p>`;
  }
  function sensHtml(it, an) {
    const s = an.sensibilidade, e = an.estimativa;
    if (!an.nValidas) return '<p class="small muted">Sem amostras válidas.</p>';
    const atualC = (it.criterio || {}).tipo;
    const cab = CP.stats.MET_SENS.map((m) => `<th class="num">${ROT_MET[m]}</th>`).join('');
    const linhas = s.linhas.map((ln) => `<tr><th scope="row">${esc(ROT_CRIT[ln.tipo])}<span class="sub">${U.plural(ln.n, 'válida', 'válidas')}</span></th>${ln.valores.map((x) => {

      return `<td class="num${atual ? ' atual' : ''}${ln.n < 3 ? ' poucas' : ''}"><button type="button" data-acao="sens-adotar" data-c="${ln.tipo}" data-m="${x.metodo}" aria-pressed="${atual}" title="${ln.n < 3 ? 'Menos de três preços válidos. ' : ''}Adotar ${esc(ROT_CRIT[ln.tipo].toLowerCase())} e ${esc(ROT_MET[x.metodo].toLowerCase())}">${U.fmtPrice(x.valor)}</button></td>`;
    }).join('')}</tr>`).join('');
    let veredito = '';
    if (U.isNum(s.min) && e.unitario > 0) {
      const amp = (s.max - s.min) / e.unitario;
      const txt = amp <= 0.05 ? 'A escolha do critério e do método praticamente não altera o resultado.' : amp <= 0.15 ? 'A escolha altera moderadamente o resultado; registre o motivo da opção adotada.' : 'A escolha altera bastante o resultado; fundamente a opção na justificativa.';
      veredito = `<p class="small" style="margin-top:6px">De ${U.fmtPrice(s.min)} a ${U.fmtPrice(s.max)}: amplitude de ${U.fmtPct(amp)} sobre o valor adotado. ${txt}</p>`;
    }
    return `<div class="tabela-wrap sens-wrap"><table class="t sens"><thead><tr><th>Critério de saneamento</th>${cab}</tr></thead><tbody>${linhas}</tbody></table></div>${veredito}
      <p class="small muted">Valor estimado em cada combinação, com o ajuste percentual do item. Clique num valor para adotar o critério e o método correspondentes.</p>`;
  }
  function desenharRegua(it, an = analisar(it)) {
    const rg = sec('ce-regua');
    if (rg) rg.innerHTML = CP.graficos.regua(an.linhas.map((l) => ({ v: l.valor, x: l.excluida })), { limites: an.limites, mediana: an.resumo.mediana, estimado: an.estimativa.unitario, largura: CP.graficos.largura(rg) });
  }
  function comparar(it, valor) {
    const an = analisar(it), est = an.estimativa.unitario;
    if (!(valor > 0) || !U.isNum(est)) return '';
    const dif = valor / est - 1;
    const pos = CP.stats.posicao(valor, an.validas.map((l) => l.valor));
    let faixa = '';
    if (an.limites.aplicado) faixa = valor < an.limites.lo ? '; abaixo da faixa aceita (indício de inexequibilidade)' : valor > an.limites.hi ? '; acima da faixa aceita (indício de sobrepreço)' : '; dentro da faixa aceita';
    return `${U.fmtPrice(valor)} está ${U.fmtPct(Math.abs(dif))} ${dif >= 0 ? 'acima' : 'abaixo'} do valor estimado e é maior ou igual a ${U.fmtPct(pos, 0)} das amostras válidas${faixa}.`;
  }
  function foraDaFaixa(l, an) {
    const fx = an.escala.ativo ? an.escala : { min: 0.1, max: 10, ...(cfg().escala || {}) };
    return U.isNum(l.razao) && (l.razao < fx.min || l.razao > fx.max);
  }
  function controlesMotivo(a) {
    const lista = a.manual === 'excluir' ? CP.stats.MOTIVOS_EXCLUSAO : CP.stats.MOTIVOS_MANTER;
    const cod = a.motivoCod || (String(a.motivo || '').trim() ? 'outro' : '');
    const falta = !CP.stats.motivoRegistrado(a);
    return `<select data-am="motivoCod" class="${falta ? 'falta' : ''}" aria-label="Motivo da decisão"><option value="">Escolha o motivo…</option>${lista.map(([k, t]) => `<option value="${k}" ${cod === k ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
      <input data-am="motivo" value="${esc(a.motivo)}" placeholder="${cod && cod !== 'outro' ? 'Detalhe (opcional)' : 'Descreva o motivo'}" aria-label="Detalhe do motivo">`;
  }
  function linhaHtml(l, an) {
    const a = l.a, s = l.sim;
    const rotAuto = l.excluida && !a.manual ? 'Automático: desconsiderada' : 'Automático: válida';
    const limiar = U.isNum(cfg().limiarSemelhanca) ? cfg().limiarSemelhanca : 0.5;
    const corSim = !s ? '' : s.divergencias.some((d) => d.tipo !== 'cor') ? 'color:var(--red)' : s.score < limiar || s.divergencias.length ? 'color:var(--amber)' : '';
    const titSim = s ? [s.confere.length ? 'Confere: ' + s.confere.join(', ') : '', s.diverge.length ? 'Diverge: ' + s.diverge.join('; ') : ''].filter(Boolean).join('. ') || 'Sem atributos para comparar' : 'Sem descrição para comparar';
    const fora = foraDaFaixa(l, an);
    const motivoAuto = !a.manual && l.excluida ? `<span class="sub motivo-auto">Desconsiderada: ${esc(l.motivo)}</span>` : '';
    const sinal = a.manual === 'incluir' && l.auto.length ? `<span class="sub">Sinalizações: ${esc(l.auto.map((x) => x.texto).join('; '))}</span>` : '';
    const orig = (l.fator !== 1 || l.conversao) && U.isNum(a.preco) ? `<span class="sub">${U.fmtPrice(a.preco)}${l.fator !== 1 ? ' × ' + U.fmtNum(l.fator, 4, 0) : ''}${l.conversao ? '; ' + esc(l.conversao) : ''}</span>` : '';
    const razao = U.isNum(l.razao) ? ` · <span class="razao${fora ? ' fora' : ''}" title="Quantidade desta aquisição, na unidade do item, dividida pela quantidade estimada">${CP.stats.fmtRazao(l.razao)}</span>` : '';
    return `<tr class="${l.excluida ? 'excl' : ''}" data-id="${a.id}">
      <td class="situacao"><select data-am="manual" aria-label="Situação da amostra"><option value="" ${!a.manual ? 'selected' : ''}>${rotAuto}</option><option value="incluir" ${a.manual === 'incluir' ? 'selected' : ''}>Manter</option><option value="excluir" ${a.manual === 'excluir' ? 'selected' : ''}>Desconsiderar</option></select>${a.manual ? controlesMotivo(a) : ''}</td>
      <td><select data-am="parametro" class="inciso" aria-label="Inciso">${['I', 'II', 'III', 'IV', 'V'].map((x) => `<option ${a.parametro === x ? 'selected' : ''}>${x}</option>`).join('')}</select></td>
      <td class="nowrap"><span class="src src-${a.origem}">${esc(CP.api.NOMES_FONTE[a.origem] || a.origem)}</span><span class="sub">${U.fmtDate(a.data)}</span></td>
      <td class="desc"><span class="clamp">${esc(a.descricao)}</span><span class="sub">${esc(a.fornecedor || '—')}${a.orgao ? ' para ' + esc(a.orgao) : ''}${a.uf ? ' (' + esc(a.uf) + ')' : ''}</span>${motivoAuto}${l.alertas.map((x) => `<span class="sub aviso-txt">${esc(x.texto)}</span>`).join('')}${sinal}</td>
      <td class="num" title="${esc(titSim)}" style="${corSim}">${s ? U.fmtPct(s.score, 0) : '—'}</td>
      <td class="num">${U.fmtQtd(U.isNum(a.quantidade) ? a.quantidade : NaN)}<span class="sub">${esc(a.unidade || '—')}${razao}</span></td>
      <td class="num preco">${U.fmtPrice(l.valor)}${orig}</td>
      <td class="num"><input data-am="fator" type="number" step="0.0001" min="0" value="${U.isNum(a.fator) ? a.fator : 1}" class="fator" title="${esc(a.fatorOrigem || 'Fator de atualização (1 = sem atualização)')}" aria-label="Fator de atualização"></td>
      <td class="acoes-am"><button type="button" class="btn leve pq" data-acao="am-detalhe" data-id="${a.id}">Detalhes</button><button type="button" class="btn leve pq perigo" data-acao="am-remover" data-id="${a.id}" aria-label="Remover amostra" title="Remover amostra">✕</button></td></tr>`;
  }
  function renderAmostras(it, an = analisar(it)) {
    const ls = [...an.linhas].sort((a, b) => (a.excluida - b.excluida) || (a.valor - b.valor));
    sec('ce-amostras').innerHTML = `<header><h3>Amostras</h3><span class="small muted">${an.nValidas} válidas de ${an.n}</span>
        <div class="acoes"><button type="button" class="btn pq" data-acao="manual">Registrar cotação ou consulta</button><button type="button" class="btn pq" data-acao="importar-csv">Importar planilha</button><button type="button" class="btn pq" data-acao="ipca">Atualizar pelo IPCA</button><a class="btn pq" href="#pesquisa">Buscar mais preços</a></div></header>
      ${an.n ? `<div class="tabela-wrap"><table class="t"><thead><tr><th>Situação e motivo</th><th>Inciso</th><th>Fonte e data</th><th>Descrição e fornecedor</th><th class="num" title="Semelhança com a descrição do item">Semelh.</th><th class="num" title="Quantidade adquirida, unidade e razão em relação à quantidade estimada">Qtd.</th><th class="num" title="Preço considerado, na unidade do item e já atualizado">Considerado</th><th class="num">Fator</th><th></th></tr></thead><tbody>
      ${ls.map((l) => linhaHtml(l, an)).join('')}</tbody></table></div>` : CP.ui.vazio('Nenhuma amostra neste item', 'Adicione preços pela Pesquisa ou registre cotações e consultas manualmente.')}`;
  }
  function renderJust(it) {
    const auto = !!it.justificativaAuto && !!String(it.justificativa || '').trim();
    sec('ce-just').innerHTML = `<header><h3>Justificativa</h3><div class="acoes">${auto ? '<button type="button" class="btn pq primario" data-acao="adotar-just">Adotar este texto</button>' : ''}<button type="button" class="btn pq" data-acao="gerar-just">${it.justificativaAuto ? 'Atualizar rascunho' : 'Gerar rascunho a partir da análise'}</button></div></header>
      ${auto ? '<div class="aviso info"><p>Rascunho escrito pelo sistema a partir da análise. Ele acompanha as mudanças até você editá-lo ou clicar em “Adotar este texto”.</p></div>' : ''}
      <label class="f"><span>Texto que irá para o relatório</span><textarea id="ce-just-txt" rows="7" placeholder="Explique as fontes, as exclusões e a escolha do método.">${esc(it.justificativa || '')}</textarea></label>`;
  }
  function atualizarTudo(it) {
    const an = analisar(it);
    if (sincronizarJustificativa(it, an)) { CP.salvar.projeto(); if (sec('ce-just')) renderJust(it); }
    renderAnalise(it, an); renderAmostras(it, an); renderLista(); CP.bus.emit('projeto');
  }

  /* ---------- registro manual (cotações, sítios, tabelas) ---------- */
  const paraLocal = (iso) => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}-${U.pad(d.getDate())}T${U.pad(d.getHours())}:${U.pad(d.getMinutes())}`; };
  const deLocal = (v) => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? '' : d.toISOString(); };
  function dialogoManual(it, existente) {
    const a = existente || { parametro: 'IV', data: U.todayISO() };
    CP.ui.modal({
      titulo: existente ? 'Editar registro' : 'Registrar cotação ou consulta', largo: true,
      corpo: `<div class="grade">
        <label class="f" style="grid-column:1/-1"><span>Parâmetro (art. 23, §1º, da Lei 14.133/2021)</span><select id="mn-par">${Object.entries(ROT_PAR).map(([k, v]) => `<option value="${k}" ${a.parametro === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label class="f" style="grid-column:1/-1"><span>Descrição do produto ou serviço cotado</span><input id="mn-desc" value="${esc(a.descricao || it.descricao)}"></label>
        <label class="f"><span>Fornecedor ou fonte</span><input id="mn-forn" value="${esc(a.fornecedor || '')}" placeholder="Razão social, sítio ou publicação"></label>
        <label class="f"><span>CNPJ ou CPF</span><input id="mn-doc" value="${esc(a.niFornecedor || '')}"></label>
        <label class="f"><span>Preço unitário (R$)</span><input id="mn-preco" inputmode="decimal" value="${a.preco ? U.fmtNum(a.preco, 4, 2) : ''}"></label>
        <label class="f"><span>Unidade</span><input id="mn-un" value="${esc(a.unidade || it.unidade)}"></label>
        <label class="f"><span>Quantidade cotada</span><input id="mn-qtd" type="number" min="0" step="any" value="${a.quantidade ?? ''}"></label>
        <label class="f"><span>Data do orçamento ou da publicação</span><input id="mn-data" type="date" value="${esc(a.data || '')}"></label>
        <label class="f"><span>Data e hora de acesso</span><input id="mn-acesso" type="datetime-local" value="${esc(existente ? paraLocal(a.acessoEm) : '')}"><em>Obrigatória para sítios eletrônicos (inciso III)</em></label>
        <label class="f" style="grid-column:1/-1"><span>Link ou referência do documento</span><input id="mn-ref" value="${esc(a.referencia || a.url || '')}" placeholder="URL, ofício, e-mail ou folha do processo"></label>
        <label class="f" style="grid-column:1/-1"><span>Observações</span><textarea id="mn-obs" rows="2">${esc(a.obs || '')}</textarea></label></div>`,
      acoes: [{ rotulo: 'Cancelar' }, { rotulo: 'Salvar', primario: true, acao: (c) => {
        const v = (id) => c.querySelector(id).value.trim();
        const preco = U.parseNum(v('#mn-preco')), par = v('#mn-par'), doc = U.onlyAlnum(v('#mn-doc'));
        if (!(preco > 0)) { CP.ui.toast('Informe um preço unitário maior que zero.', 'erro'); return false; }
        if (doc && !(doc.length === 14 ? U.cnpjValido(doc) : doc.length === 11 ? U.cpfValido(doc) : false)) { CP.ui.toast('CNPJ ou CPF com dígitos verificadores inválidos.', 'erro'); return false; }
        if (par === 'III' && !v('#mn-acesso')) { CP.ui.toast('Para sítios eletrônicos, informe a data e a hora de acesso.', 'erro'); return false; }
        const ref = v('#mn-ref');
        const dados = { parametro: par, descricao: v('#mn-desc'), fornecedor: v('#mn-forn'), niFornecedor: doc, preco, unidade: v('#mn-un'), quantidade: U.parseNum(v('#mn-qtd')) || null, data: v('#mn-data') || null, acessoEm: deLocal(v('#mn-acesso')) || (existente ? existente.acessoEm : U.nowISO()), referencia: ref, url: /^https?:\/\//i.test(ref) ? ref : '', obs: v('#mn-obs') };
        if (existente) Object.assign(existente, dados);
        else it.amostras.push({ id: U.uid('a'), origem: 'manual', orgao: '', uasg: '', uf: '', municipio: '', marca: '', consultaId: '', tipoValor: 'cotacao', idCompra: '', numeroItem: '', chave: '', fator: 1, fatorOrigem: '', manual: null, motivoCod: '', motivo: '', ...dados });
        salvar(); atualizarTudo(it);
        CP.ui.toast(existente ? 'Registro atualizado.' : 'Registro adicionado à cesta.', 'ok');
      } }],
    });
  }

  /* ---------- planilhas de outros portais ---------- */
  const CAMPOS = [
    ['descricao', 'Descrição', /descri|produto|^item$|objeto|especifica/i], ['preco', 'Preço unitário', /pre[cç]o|valor.*unit|unit[aá]rio|^valor$/i],
    ['data', 'Data', /^data|^dt|emiss|homolog/i], ['fornecedor', 'Fornecedor', /fornecedor|raz[aã]o|empresa|emitente|vencedor|contratad/i],
    ['ni', 'CNPJ ou CPF', /cnpj|cpf|documento|^ni$/i], ['unidade', 'Unidade', /unid/i], ['quantidade', 'Quantidade', /qtd|quant/i],
    ['orgao', 'Órgão', /[oó]rg[aã]o|uasg|comprador|entidade|contratante/i], ['uf', 'UF', /^uf$|^estado$/i], ['ref', 'Referência ou link', /link|url|refer|fonte|processo|edital|ata/i],
  ];
  function dialogoCSV(it) {
    let dados = null;
    CP.ui.modal({
      titulo: 'Importar planilha de preços', largo: true,
      corpo: `<p class="small">Para preços de outros portais (bancos de preços de tribunais de contas, portais estaduais) ou cotações tabuladas. Aceita CSV ou dados colados de uma planilha.</p>
        <div class="grade"><label class="f"><span>Arquivo CSV</span><input type="file" id="cv-arq" accept=".csv,.txt,text/csv"></label>
        <label class="f" style="grid-column:1/-1"><span>Ou cole os dados (com a linha de títulos)</span><textarea id="cv-txt" rows="5"></textarea></label></div>
        <p style="margin-top:8px"><button type="button" class="btn pq" id="cv-ler">Ler colunas</button></p><div id="cv-map"></div>`,
      aoAbrir: (c) => {
        const ler = async () => {
          const f = c.querySelector('#cv-arq').files[0];
          const txt = f ? await U.lerTexto(f) : c.querySelector('#cv-txt').value;
          if (!txt.trim()) { CP.ui.toast('Escolha um arquivo ou cole os dados.', 'erro'); return; }
          dados = CP.csv.ler(txt);
          const usados = new Set();
          const sel = CAMPOS.map(([k, rot, re]) => {
            const idx = dados.cabecalho.findIndex((h, i) => !usados.has(i) && re.test(h));
            if (idx >= 0) usados.add(idx);
            return `<label class="f"><span>${rot}${k === 'preco' ? ' (obrigatório)' : ''}</span><select data-map="${k}"><option value="-1">Não importar</option>${dados.cabecalho.map((h, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>${esc(h || 'coluna ' + (i + 1))}</option>`).join('')}</select></label>`;
          }).join('');
          c.querySelector('#cv-map').innerHTML = `<p class="small">${U.plural(dados.linhas.length, 'linha lida', 'linhas lidas')}.</p><div class="grade">${sel}<label class="f"><span>Parâmetro</span><select id="cv-par">${Object.entries(ROT_PAR).map(([k, v]) => `<option value="${k}" ${k === 'III' ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>`;
        };
        c.querySelector('#cv-ler').addEventListener('click', ler);
        c.querySelector('#cv-arq').addEventListener('change', ler);
      },
      acoes: [{ rotulo: 'Cancelar' }, { rotulo: 'Importar', primario: true, acao: (c) => {
        if (!dados) { CP.ui.toast('Clique em “Ler colunas” antes de importar.', 'erro'); return false; }
        const mapa = {};
        c.querySelectorAll('[data-map]').forEach((s) => { mapa[s.dataset.map] = Number(s.value); });
        if (!(mapa.preco >= 0)) { CP.ui.toast('Indique a coluna do preço unitário.', 'erro'); return false; }
        const par = c.querySelector('#cv-par').value, quando = U.nowISO();
        const linhas = dados.linhas.map((l) => {
          const g = (k) => (mapa[k] >= 0 ? String(l[mapa[k]] ?? '').trim() : '');
          return CP.api.linha({ origem: 'importacao', parametro: par, descricao: g('descricao'), preco: U.parseNum(g('preco')), data: U.parseDate(g('data')), fornecedor: g('fornecedor'), ni: g('ni'), unidade: g('unidade'), quantidade: U.parseNum(g('quantidade')), orgao: g('orgao'), uf: g('uf').toUpperCase().slice(0, 2), ref: g('ref'), url: /^https?:\/\//i.test(g('ref')) ? g('ref') : '', acessoEm: quando });
        }).filter((l) => l.preco > 0);
        if (!linhas.length) { CP.ui.toast('Nenhuma linha com preço válido.', 'erro'); return false; }
        const reg = CP.registro.adicionar({ fonte: 'importacao', rotulo: 'Planilha importada', registros: linhas.length, total: dados.linhas.length, status: 'ok', urls: [] });
        linhas.forEach((l) => { l.consultaId = reg.id; });
        const r = adicionarLinhas(it, linhas);
        CP.ui.toast(`${U.plural(r.n, 'preço importado', 'preços importados')}${r.rep ? `; ${r.rep} repetidos ignorados` : ''}.`, 'ok');
        atualizarTudo(it);
      } }],
    });
  }

  /* ---------- atualização monetária ---------- */
  const mesSeguinte = (iso) => { const d = U.addMonths(iso.slice(0, 7) + '-01', 1); return `${d.slice(5, 7)}/${d.slice(0, 4)}`; };
  const fmtMes = (k) => `${k.slice(5, 7)}/${k.slice(0, 4)}`;
  async function atualizarIPCA(it) {
    const comData = it.amostras.filter((a) => a.data);
    if (!comData.length) { CP.ui.toast('As amostras não têm data; não há o que atualizar.'); return; }
    const ref = P().dataReferencia;
    const ok = await CP.ui.confirmar(`Atualizar ${U.plural(comData.length, 'amostra', 'amostras')} pelo IPCA (série 433 do Banco Central) até ${fmtMes(ref)}? Os fatores atuais serão substituídos.`, { rotulo: 'Atualizar' });
    if (!ok) return;
    const desde = comData.map((a) => a.data).sort()[0];
    try {
      const ip = CP.state.ipca;
      const velho = !ip.atualizadoEm || Date.now() - Date.parse(ip.atualizadoEm) > 6 * 3600e3;
      if (velho || ip.serie[U.addMonths(desde, 1).slice(0, 7)] == null) {
        const r = await CP.api.ipca.atualizar(desde);
        CP.registro.adicionar({ fonte: 'ipca', rotulo: 'IPCA mensal (IBGE), série 433 do SGS/Banco Central', urls: [r.url], registros: Object.keys(r.serie).length, status: 'ok' });
      }
    } catch (e) {
      CP.ui.toast(`Não foi possível obter o IPCA. ${CP.http.explicar(e)} Você pode digitar o fator na coluna “Fator”.`, 'erro', 10000);
      return;
    }
    let n = 0, ate = null;
    for (const a of comData) {
      const f = CP.stats.fatorIPCA(a.data, ref, CP.state.ipca.serie);
      a.fator = Math.round(f.fator * 1e6) / 1e6;
      a.fatorOrigem = f.meses ? `IPCA de ${mesSeguinte(a.data)} a ${fmtMes(f.ate)} (${f.meses} meses)` : 'IPCA: sem meses a atualizar';
      if (f.meses) { n++; ate = f.ate; }
    }
    salvar(); atualizarTudo(it);
    CP.ui.toast(`${U.plural(n, 'amostra atualizada', 'amostras atualizadas')} pelo IPCA${ate ? ' até ' + fmtMes(ate) : ''}.`, 'ok');
  }

  function detalheAmostra(it, a) {
    const l = analisar(it).linhas.find((x) => x.a.id === a.id) || {};
    const c = a.consultaId ? CP.registro.porId(a.consultaId) : null;
    const s = l.sim;
    const campos = [['Fonte', CP.api.NOMES_FONTE[a.origem] || a.origem], ['Parâmetro', ROT_PAR[a.parametro]], ['Descrição', a.descricao], ['Fornecedor', `${a.fornecedor || '—'}${a.niFornecedor ? ' (' + U.fmtDoc(a.niFornecedor) + ')' : ''}`],
      ['Órgão', [a.orgao, a.uasg && 'UASG ' + a.uasg].filter(Boolean).join(', ')], ['Município e UF', [a.municipio, a.uf].filter(Boolean).join(' / ')], ['Unidade', a.unidade], ['Quantidade', U.fmtQtd(a.quantidade ?? NaN)],
      ['Escala', U.isNum(l.razao) ? `${CP.stats.fmtRazao(l.razao)} da quantidade estimada do item` : ''],
      ['Semelhança com o item', s ? `${U.fmtPct(s.score, 0)}${s.confere.length ? '; confere: ' + s.confere.join(', ') : ''}${s.diverge.length ? '; diverge: ' + s.diverge.join('; ') : ''}` : ''],
      ['Preço unitário', U.fmtPrice(a.preco)], ['Fator de atualização', `${U.fmtNum(a.fator || 1, 6, 0)}${a.fatorOrigem ? ' (' + a.fatorOrigem + ')' : ''}`], ['Conversão de unidade', l.conversao || ''],
      ['Data', U.fmtDate(a.data)], ['Data e hora de acesso', U.fmtDateTime(a.acessoEm)], ['Compra', a.idCompra ? `${a.idCompra}${a.numeroItem !== '' ? ', item ' + a.numeroItem : ''}` : ''],
      ['Referência', a.referencia], ['Observações', a.obs], ['Consulta de origem', c ? `${c.rotulo}, em ${U.fmtDateTime(c.quando)}` : '']].filter(([, v]) => v && v !== '—');
    const link = a.url ? `<p style="margin-top:10px"><a href="${esc(a.url)}" target="_blank" rel="noopener">Abrir o documento de origem</a></p>` : '';
    const urls = c && c.urls && c.urls.length ? `<details style="margin-top:8px"><summary class="small">Endereços consultados</summary><pre>${esc(c.urls.join('\n'))}</pre></details>` : '';
    CP.ui.modal({ titulo: 'Amostra', largo: true, corpo: `<dl class="kv">${campos.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>${link}${urls}`, acoes: a.origem === 'manual' ? [{ rotulo: 'Fechar' }, { rotulo: 'Editar', primario: true, acao: () => { dialogoManual(it, a); } }] : [{ rotulo: 'Fechar' }] });
  }

  /* ---------- motivo sugerido quando o analista decide ---------- */
  function sugerirMotivo(l, modo) {
    if (!l) return '';
    const cods = new Set([...(l.alertas || []), ...(l.auto || [])].map((x) => x.cod));
    if (modo === 'excluir') {
      for (const [de, para] of [['nao-equivalente', 'nao-equivalente'], ['cor', 'nao-equivalente'], ['semelhanca', 'nao-equivalente'], ['excessivo', 'excessivo'], ['inexequivel', 'inexequivel'], ['prazo', 'prazo'], ['quantidade', 'quantidade'], ['duplicada', 'duplicada'], ['unidade', 'unidade']]) if (cods.has(de)) return para;
      return '';
    }
    if (cods.has('nao-equivalente')) return 'equivalente';
    if (cods.has('excessivo') || cods.has('inexequivel')) return 'mercado';
    return '';
  }

  /* ---------- eventos ---------- */
  const amostraDe = (t, it) => { const tr = t.closest('tr[data-id]'); return tr ? it.amostras.find((x) => x.id === tr.dataset.id) : null; };
  function ligar() {
    const r = raiz();
    CP.ui.on(r, 'click', '[data-acao]', async (e, t) => {
      const a = t.dataset.acao;
      if (a === 'novo-item') { novoItem(); render(); return; }
      if (a === 'sel-item') { CP.state.ui.itemSel = t.dataset.id; renderLista(); renderItem(); return; }
      const it = itemAtual();
      if (!it) return;
      if (a === 'mover') {
        const lista = P().itens, i = lista.indexOf(it), j = i + Number(t.dataset.d);
        if (j < 0 || j >= lista.length) return;
        [lista[i], lista[j]] = [lista[j], lista[i]]; renumerar(); salvar(); renderLista(); renderItem();
      } else if (a === 'duplicar') {
        const c = JSON.parse(JSON.stringify(it));
        c.id = U.uid('i'); c.descricao = (c.descricao || 'Item') + ' (cópia)'; c.amostras.forEach((x) => { x.id = U.uid('a'); });
        P().itens.splice(P().itens.indexOf(it) + 1, 0, c); renumerar(); CP.state.ui.itemSel = c.id; salvar(); render();
      } else if (a === 'excluir-item') {
        if (!(await CP.ui.confirmar(`Excluir o item ${it.numero} e suas ${U.plural(it.amostras.length, 'amostra', 'amostras')}?`, { rotulo: 'Excluir', perigo: true }))) return;
        P().itens = P().itens.filter((x) => x !== it); renumerar(); CP.state.ui.itemSel = (P().itens[0] || {}).id || null; salvar(); render();
      } else if (a === 'manual') dialogoManual(it);
      else if (a === 'importar-csv') dialogoCSV(it);
      else if (a === 'ipca') atualizarIPCA(it);
      else if (a === 'gerar-just') {
        if (!it.justificativaAuto && it.justificativa && it.justificativa.trim() && !(await CP.ui.confirmar('Substituir o texto atual por um rascunho gerado a partir da análise?', { rotulo: 'Substituir' }))) return;
        it.justificativaAuto = true;
        it.justificativa = rascunho(it, analisar(it));
        salvar(); renderJust(it); atualizarTudo(it);
      } else if (a === 'adotar-just') {
        it.justificativaAuto = false; salvar(); renderJust(it); atualizarTudo(it);
        CP.ui.toast('Texto adotado. Daqui em diante ele só muda quando você o editar.', 'ok');
      } else if (a === 'sens-adotar') {
        it.criterio = { ...(cfg().criterio || {}), ...(it.criterio || {}), tipo: t.dataset.c };
        it.metodo = t.dataset.m;
        salvar(); atualizarTudo(it);
        CP.ui.toast(`Adotados: ${ROT_CRIT[t.dataset.c].toLowerCase()} e ${ROT_MET[t.dataset.m].toLowerCase()}.`, 'ok');
      } else if (a === 'am-remover') { it.amostras = it.amostras.filter((x) => x.id !== t.dataset.id); salvar(); atualizarTudo(it); }
      else if (a === 'am-detalhe') { const am = it.amostras.find((x) => x.id === t.dataset.id); if (am) detalheAmostra(it, am); }
    });
    const refazer = U.debounce(() => { const it = itemAtual(); if (it && sec('ce-analise')) atualizarTudo(it); }, 350);
    const refazerPontos = U.debounce(() => { const it = itemAtual(); if (it && sec('ce-analise')) { renderAnalise(it); renderLista(); } }, 400);
    r.addEventListener('input', (e) => {
      const t = e.target, it = itemAtual();
      if (!it) return;
      if (t.dataset.campo && t.closest('#ce-cab')) {
        const k = t.dataset.campo;
        it[k] = k === 'quantidade' ? (U.parseNum(t.value) >= 0 ? U.parseNum(t.value) : null) : t.value;
        salvar(); refazer();
      } else if (t.id === 'ce-just-txt') {
        it.justificativa = t.value;
        if (it.justificativaAuto) { it.justificativaAuto = false; const av = sec('ce-just') && sec('ce-just').querySelector('.aviso.info'); if (av) av.remove(); const b = r.querySelector('[data-acao="adotar-just"]'); if (b) b.remove(); }
        salvar(); refazerPontos();
      } else if (t.id === 'ce-comparar') { sec('ce-comparar-res').textContent = comparar(it, U.parseNum(t.value)); }
      else if (t.dataset.am === 'motivo') { const am = amostraDe(t, it); if (am) { am.motivo = t.value; salvar(); refazerPontos(); } }
    });
    r.addEventListener('change', (e) => {
      const t = e.target, it = itemAtual();
      if (!it) return;
      if (t.dataset.crit) {
        const k = t.dataset.crit;
        it.criterio = { ...it.criterio, [k]: k === 'tipo' ? t.value : (U.parseNum(t.value) >= 0 ? U.parseNum(t.value) : it.criterio[k]) };
        salvar(); atualizarTudo(it);
      } else if (t.dataset.escala) {
        const k = t.dataset.escala, atual = { ativo: false, min: 0.1, max: 10, ...(cfg().escala || {}), ...(it.escala || {}) };
        if (k === 'ativo') atual.ativo = t.value === '1';
        else { const v = U.parseNum(t.value); if (v >= 0) atual[k] = v; }
        it.escala = atual; salvar(); atualizarTudo(it);
      } else if (t.dataset.campo && t.closest('#ce-analise')) {
        if (t.dataset.campo === 'metodo') it.metodo = t.value;
        else if (t.dataset.campo === 'ajustePct') it.ajustePct = U.isNum(U.parseNum(t.value)) ? U.parseNum(t.value) : 0;
        else if (t.dataset.campo === 'independencia') it.independencia = t.value;
        salvar(); atualizarTudo(it);
      } else if (t.dataset.am) {
        const am = amostraDe(t, it);
        if (!am) return;
        if (t.dataset.am === 'manual') {
          const novo = t.value || null;
          if (novo !== am.manual) {
            const linha = novo ? analisar(it).linhas.find((x) => x.a.id === am.id) : null;
            am.manual = novo; am.motivo = ''; am.motivoCod = novo ? sugerirMotivo(linha, novo) : '';
          }
        } else if (t.dataset.am === 'motivoCod') am.motivoCod = t.value;
        else if (t.dataset.am === 'parametro') am.parametro = t.value;
        else if (t.dataset.am === 'fator') { const v = U.parseNum(t.value); am.fator = v > 0 ? v : 1; am.fatorOrigem = v > 0 && v !== 1 ? 'Informado pelo analista' : ''; }
        else if (t.dataset.am === 'motivo') { am.motivo = t.value; salvar(); refazerPontos(); return; }
        salvar(); atualizarTudo(it);
      }
    });
    r.addEventListener('toggle', (e) => { if (e.target && e.target.id === 'ce-sens') sensAberto = e.target.open; }, true);
  }

  function iniciar() { ligar(); }
  function mostrar() { render(); }
  function redimensionar() { const it = itemAtual(); if (it && sec('ce-regua')) desenharRegua(it); }
  return { iniciar, mostrar, redimensionar, dialogoAdicionar, novoItem, adicionarLinhas, analisar, itemAtual, justificativaDe, sincronizarJustificativa, ROT_PAR, ROT_CRIT, ROT_MET };
})();

  async function consultarPortal() {

      const { dados, url } = await CP.api.notaPorChave(ch);

    } catch (e) { CP.ui.toast(CP.http.explicar(e), 'erro', 9000); }
  }
  async function consultarApi() {
    const ch = U.onlyAlnum(sec('nf-api-chave').value);
    if (!CP.nfe.validarChave(ch).dvOk) { CP.ui.toast('Informe uma chave de acesso válida.', 'erro'); return; }
    try {
      const notas = await CP.nfe.consultarApiPropria(ch);
      notas.forEach((n) => { n.origem = 'API própria'; });
      const r = CP.nfe.adicionar(notas);
      CP.ui.toast(r.novas ? 'Nota guardada na base.' : 'A nota já estava na base.', 'ok');
    } catch (e) { CP.ui.toast(CP.http.explicar(e), 'erro', 9000); }
  }

  function ligar() {
    const r = raiz();
    CP.ui.on(r, 'click', '[data-acao]', async (e, t) => {
      const a = t.dataset.acao;
      if (a === 'salvar-chave') { cfg().chaveTransparencia = sec('nf-key').value.trim(); CP.salvar.settings(); CP.ui.toast(cfg().chaveTransparencia ? 'Chave salva neste navegador.' : 'Chave removida.', 'ok'); }
      else if (a === 'mostrar-chave') { const k = sec('nf-key'); k.type = k.type === 'password' ? 'text' : 'password'; t.textContent = k.type === 'password' ? 'Mostrar' : 'Ocultar'; }
      else if (a === 'pt-chave') consultarPortal();
      else if (a === 'api-consultar') consultarApi();
      else if (a === 'ver-itens') verItens(t.dataset.chave);
      else if (a === 'remover-nota') { if (await CP.ui.confirmar('Remover esta nota da base?', { rotulo: 'Remover', perigo: true })) { CP.nfe.remover(t.dataset.chave); } }
      else if (a === 'limpar-base') { if (await CP.ui.confirmar('Remover todas as notas da base local?', { rotulo: 'Limpar', perigo: true })) { CP.nfe.limpar(); sel = new Set(); } }
      else if (a === 'add-sel') enviar(itensFiltrados().filter((x) => sel.has(x.k)));
    });
    const refazerBusca = U.debounce(() => { const el = sec('nf-busca'); const pos = el ? el.selectionStart : 0; renderBase(); const n = sec('nf-busca'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250);
    r.addEventListener('input', (e) => {
      const t = e.target;
      if (t.id === 'nf-val') { chaveDigitada = t.value; sec('nf-val-res').innerHTML = resultadoChave(CP.nfe.validarChave(t.value)); }
      else if (t.id === 'nf-busca') { busca = t.value; refazerBusca(); }
      else if (t.dataset.cfgnf) { cfg().apiPropria = { ...cfg().apiPropria, [t.dataset.cfgnf]: t.value }; CP.salvar.settings(); }
    });
    r.addEventListener('change', (e) => {
      const t = e.target;
      if (t.id === 'nf-arq') { importar(Array.from(t.files || [])); t.value = ''; }
      else if (t.dataset.isel) { if (t.checked) sel.add(t.dataset.isel); else sel.delete(t.dataset.isel); renderBase(); }
      else if (t.dataset.cfgnf) { cfg().apiPropria = { ...cfg().apiPropria, [t.dataset.cfgnf]: t.value }; CP.salvar.settings(); }
    });
    r.addEventListener('dragover', (e) => { const d = e.target.closest && e.target.closest('#nf-drop'); if (d) { e.preventDefault(); d.classList.add('sobre'); } });
    r.addEventListener('dragleave', (e) => { const d = e.target.closest && e.target.closest('#nf-drop'); if (d) d.classList.remove('sobre'); });
    r.addEventListener('drop', (e) => { const d = e.target.closest && e.target.closest('#nf-drop'); if (d) { e.preventDefault(); d.classList.remove('sobre'); importar(Array.from((e.dataTransfer && e.dataTransfer.files) || [])); } });
    CP.bus.on('nfe', () => { if (CP.state.ui.tab === 'nfe' && sec('nf-base')) renderBase(); });
  }
  return { iniciar: ligar, mostrar: render, importar, resultadoChave };
})();

CP.relatorio = (() => {
  const U = CP.util;

  const ESTILO_DOC = '<style>.doc .regua .rg-lim{stroke:#2141C4}.doc .regua .rg-edge{fill:#BE3127}.doc .regua .rg-med{fill:#111a22}.doc .regua .rg-tick.menor{stroke:#A8B3A5}.doc .alerta{border-left:3px solid #8F5B00;background:#FBF1DC;padding:6px 9px;margin:6px 0;font-size:11.5px}.doc .pend{color:#a3241b;font-weight:600}.doc .atn{color:#8F5B00;font-weight:600}.doc table.sens td.atual{font-weight:700;background:#E8ECFA}.doc .nota{font-size:11px;color:#55606a}</style>';
  const VERIFICACOES = 'mínimo de três preços; prioridade dos parâmetros I e II; pesquisa direta com fornecedores; data e hora de acesso; prazos de cada parâmetro; justificativa; motivo das decisões do analista; método de cálculo; dispersão; mediana do Painel de Preços; equivalência das descrições; unidade e quantidade; independência das amostras; escala de quantidade';

  const verificacao = () => CP.conformidade.projeto(P(), cfg());
  function consultasUsadas(itens) {

    if (!l.excluida) return l.a.manual === 'incluir' ? 'Mantida pelo analista' : '';
    const m = l.motivos[0];
    if (!m) return '';
    const rot = Object.fromEntries(CP.stats.MOTIVOS_EXCLUSAO)[m.cod];

    const amp = U.isNum(s.min) && an.estimativa.unitario > 0 ? ` Amplitude de ${U.fmtPct((s.max - s.min) / an.estimativa.unitario)} sobre o valor adotado.` : '';
    return `<p class="nota" style="margin-top:8px">Sensibilidade do valor estimado a critérios e métodos (entre parênteses, preços válidos; em destaque, a combinação adotada).${amp}</p>
      <table class="sens"><thead><tr><th>Critério</th>${CP.stats.MET_SENS.map((m) => `<th class="num">${NOME_METODO[m]}</th>`).join('')}</tr></thead><tbody>${linhas}</tbody></table>`;
  }

    const metodo = it.metodo === 'auto' ? `Automático pelo coeficiente de variação: ${NOME_METODO[e.efetivo] || '—'} (CV de ${U.fmtPct(r.cv)}; referência de ${U.fmtPct(cfg().cvLimite, 0)})` : (NOME_METODO[e.efetivo] || '—') + (e.efetivo === 'ponderada' ? ` pela quantidade (${e.nPond} de ${an.nValidas} amostras com quantidade)` : '') + (e.fallback ? ' (sem quantidades: média simples)' : '');
    const ind = an.independencia;

      <table><thead><tr><th>Inciso</th><th>Fonte e referência</th><th>Data</th><th>Fornecedor</th><th>Órgão e UF</th><th>Unid.</th><th class="num">Qtd.</th><th class="num">Preço</th><th class="num">Fator</th><th class="num">Considerado</th><th>Situação</th></tr></thead><tbody>
      ${ls.map((l) => { const a = l.a; return `<tr class="${l.excluida ? 'excl' : ''}"><td>${a.parametro}</td><td>${esc(nomeFonte(a.origem))}${a.referencia ? `<br><span class="url">${esc(a.referencia)}</span>` : ''}${a.parametro === 'III' && a.acessoEm ? `<br><span class="url">Acesso em ${U.fmtDateTime(a.acessoEm)}</span>` : ''}</td><td>${U.fmtDate(a.data)}</td><td>${esc(a.fornecedor || '—')}${a.niFornecedor ? `<br>${esc(U.fmtDoc(a.niFornecedor))}` : ''}</td><td>${esc([a.orgao, a.uf].filter(Boolean).join(', ') || '—')}</td><td>${esc(a.unidade)}</td><td class="num">${U.fmtQtd(U.isNum(a.quantidade) ? a.quantidade : NaN)}${U.isNum(l.razao) ? `<br><span class="url">${CP.stats.fmtRazao(l.razao)}</span>` : ''}</td><td class="num preco">${U.fmtPrice(a.preco)}</td><td class="num">${U.fmtNum(l.fator, 4, 0)}</td><td class="num">${U.fmtPrice(l.valor)}${l.conversao ? `<br><span class="url">${esc(l.conversao)}</span>` : ''}</td><td>${esc(situacao(l))}</td></tr>`; }).join('') || '<tr><td colspan="11">Sem amostras.</td></tr>'}
      </tbody></table>
      ${sensTabela(it, an)}
      ${cfg().verificacaoNoRelatorio !== false

        : pend.map((x) => `<div class="alerta"><b>${esc(x.titulo)}.</b> ${esc(x.texto)} <span class="nota">(${esc(x.ref)})</span></div>`).join('')}
      <p><b>Justificativa.</b> ${CP.cesta.justificativaDe(it, an) ? esc(CP.cesta.justificativaDe(it, an)).replace(/\n/g, '<br>') : '<i>Não registrada.</i>'}</p>`;

      <p class="nota">Verificações realizadas: ${VERIFICACOES}; e, no processo, objeto, responsável e caracterização das fontes.</p>`;
  }

  function gerarHTML(vf = verificacao()) {
    const p = P(), s = cfg(), itens = vf.itens;
    const total = itens.reduce((t, d) => t + (U.isNum(d.an.estimativa.total) ? d.an.estimativa.total : 0), 0);
    const inc = {};
    itens.forEach((d) => d.an.linhas.forEach((l) => { const k = l.a.parametro; inc[k] = inc[k] || { n: 0, v: 0 }; inc[k].n++; if (!l.excluida) inc[k].v++; }));

      <p>Prazos admitidos, contados para trás a partir da data de referência: ${['I', 'II', 'III', 'IV', 'V'].map((k) => `inciso ${k}, ${s.janelas[k]} meses`).join('; ')}. ${s.excluirForaPrazo ? 'Amostras fora desses prazos foram desconsideradas automaticamente, salvo decisão registrada do analista.' : 'Amostras fora desses prazos foram sinalizadas para avaliação.'} ${s.normalizarUnidades !== false ? 'Amostras em unidades conversíveis (por exemplo, caixa com 50 unidades) foram convertidas para a unidade do item, com o fator registrado. ' : ''}${s.excluirUnidadeDivergente ? 'Amostras em unidades não conversíveis foram desconsideradas.' : ''} ${s.excluirDivergentes !== false ? 'A descrição de cada amostra foi comparada com a do item; amostras com medidas, categoria ou formato diferentes foram desconsideradas por objeto não equivalente, salvo decisão registrada do analista.' : 'A descrição de cada amostra foi comparada com a do item, e as divergências foram sinalizadas para avaliação.'} Registros repetidos da mesma compra, item e fornecedor foram contados uma única vez. ${temIPCA ? 'Quando indicado, os valores foram atualizados pelo IPCA (IBGE), série 433 do Banco Central.' : ''} O critério de saneamento, o método de cálculo e a sensibilidade do valor estimado a essas escolhas constam da seção 3.</p>
      <h2>2. Mapa de preços</h2>
      <table><thead><tr><th>Item</th><th>Descrição</th><th>Unid.</th><th class="num">Qtd.</th><th class="num">Válidas</th><th>Método</th><th class="num">Valor unitário</th><th class="num">Valor total</th></tr></thead><tbody>
      ${itens.map(({ it, an }) => `<tr><td>${it.numero}</td><td>${esc(it.descricao || '—')}</td><td>${esc(it.unidade)}</td><td class="num">${U.fmtQtd(it.quantidade)}</td><td class="num">${an.nValidas} de ${an.n}</td><td>${an.estimativa.efetivo ? NOME_METODO[an.estimativa.efetivo] : '—'}</td><td class="num">${U.fmtPrice(an.estimativa.unitario)}</td><td class="num">${U.fmtBRL(an.estimativa.total)}</td></tr>`).join('') || '<tr><td colspan="8">Nenhum item.</td></tr>'}
      </tbody><tfoot><tr><th colspan="7">Valor total estimado</th><th class="num">${U.fmtBRL(total)}</th></tr></tfoot></table>
      <h2>3. Análise por item</h2>
      ${itens.map(blocoItem).join('') || '<p>Nenhum item na cesta.</p>'}
      <h2>4. Fontes consultadas</h2>
      ${consultas.length ? `<table><thead><tr><th>Data e hora</th><th>Fonte</th><th>Consulta</th><th class="num">Registros</th><th>Endereço consultado</th></tr></thead><tbody>
        ${consultas.map((c) => `<tr><td class="nowrap">${U.fmtDateTime(c.quando)}</td><td>${esc(nomeFonte(c.fonte))}</td><td>${esc(c.rotulo)}${c.filtros ? `<br><span class="url">Período de ${U.fmtDate(c.filtros.de)} a ${U.fmtDate(c.filtros.ate)}${c.filtros.uf ? ', UF ' + esc(c.filtros.uf) : ''}</span>` : ''}${c.nota ? `<br><span class="url">${esc(c.nota)}</span>` : ''}</td><td class="num">${U.fmtInt(c.registros)}${c.total && c.total !== c.registros ? ` de ${U.fmtInt(c.total)}` : ''}</td><td><span class="url">${esc((c.urls || [])[0] || '—')}${(c.urls || []).length > 1 ? ` (e mais ${c.urls.length - 1})` : ''}</span></td></tr>`).join('')}
      </tbody></table>` : '<p>As amostras vieram de registros manuais e de arquivos importados, identificados na seção 3.</p>'}
      ${secVerif}${secObs}
      <div class="assin"><div>${esc(p.responsavel || 'Responsável pela pesquisa')}${p.cargo ? '<br>' + esc(p.cargo) : ''}</div><div>Autoridade competente</div></div>
    </div>`;
  }

  function planilha(vf = verificacao()) {
    const itens = vf.itens;
    const b = (v) => ({ v, s: 1 }), m = (v) => ({ v, s: 2 }), pc = (v) => ({ v, s: 3 });
    const mapa = [['Item', 'Descrição', 'Código', 'Unidade', 'Quantidade', 'Amostras', 'Válidas', 'Critério', 'Método', 'CV', 'Valor unitário', 'Valor total', 'Verificação'].map(b)];
    let total = 0;
    itens.forEach(({ it, an, pior }) => {
      if (U.isNum(an.estimativa.total)) total += an.estimativa.total;
      mapa.push([it.numero, it.descricao, it.codigo, it.unidade, U.isNum(it.quantidade) ? it.quantidade : '', an.n, an.nValidas, CP.stats.CRITERIOS[(it.criterio || {}).tipo] || '', NOME_METODO[an.estimativa.efetivo] || '', pc(an.resumo.cv), m(an.estimativa.unitario), m(an.estimativa.total), { erro: 'Com pendências', aviso: 'Com pontos de atenção', ok: 'Conforme' }[pior]]);
    });
    mapa.push(['', b('Total'), '', '', '', '', '', '', '', '', '', m(total), '']);

    itens.forEach(({ it, an }) => an.linhas.forEach((l) => { const a = l.a; am.push([it.numero, a.parametro, nomeFonte(a.origem), U.fmtDate(a.data), a.descricao, a.fornecedor, U.fmtDoc(a.niFornecedor), a.orgao, a.uf, a.unidade, U.isNum(a.quantidade) ? a.quantidade : '', U.isNum(l.razao) ? l.razao : '', l.sim ? pc(l.sim.score) : '', l.sim ? l.sim.diverge.join('; ') : '', m(a.preco), l.fator, l.conversao, m(l.valor), l.excluida ? 'Desconsiderada' : 'Válida', motivoPadrao(l), l.motivo, a.referencia, a.url, U.fmtDateTime(a.acessoEm)]); }));

  function csvAmostras(vf = verificacao()) {

  function painelVerificacao(vf) {

    };

  }
  return { iniciar: ligar, mostrar: render, gerarHTML, planilha, csvAmostras, htmlAvulso, abrirProjeto, verificacao, emitir };
})();

const PERMITIDOS = ${JSON.stringify(HOSTS)};

};
export default {
  async fetch(req) {
    if (req.method === 'OPTIONS') return new Response(null, { headers: CORS });
    const alvo = new URL(req.url).searchParams.get('url');
    let u;
    try { u = new URL(alvo); } catch (e) { return new Response('Parâmetro url inválido', { status: 400, headers: CORS }); }
    if (u.protocol !== 'https:' || !PERMITIDOS.includes(u.hostname)) return new Response('Destino não permitido', { status: 403, headers: CORS });

    const chave = req.headers.get('chave-api-dados');
    if (chave) h.set('chave-api-dados', chave);
    const r = await fetch(u.toString(), { headers: h });
    const out = new Response(r.body, r);
    for (const [k, v] of Object.entries(CORS)) out.headers.set(k, v);
    return out;
  },
};
