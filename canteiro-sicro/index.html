function parseInputValue(el){if(el.type==="checkbox")return el.checked;if(el.type==="number")return el.value===""?null:Number(el.value);return el.value;}
function markDirty(){state.dirty=true;const i=state.projects.findIndex(x=>x.id===state.project?.id);if(i>=0)state.projects[i]=deepClone(state.project);updateSaveIndicator();clearTimeout(state.saveTimer);state.saveTimer=setTimeout(()=>saveCurrent(true),650);}
async function saveCurrent(silent=false){if(!state.project)return;state.project.updatedAt=Date.now();state.project.version=APP_VERSION;try{await Storage.putProject(deepClone(state.project));const i=state.projects.findIndex(x=>x.id===state.project.id);if(i>=0)state.projects[i]=deepClone(state.project);else state.projects.push(deepClone(state.project));await Storage.setSetting("lastProjectId",state.project.id);state.dirty=false;updateSaveIndicator();updateStorageIndicator();if(!silent)toast("Projeto salvo com sucesso.","ok");}catch(err){console.error(err);toast("Não foi possível salvar: "+err.message,"error");}}
function updateSaveIndicator(){const el=document.getElementById("saveState");if(!el)return;el.className="save-state "+(state.dirty?"dirty":"saved");el.textContent=state.dirty?"Alterações pendentes":"Salvo localmente";}
function updateStorageIndicator(){const dot=document.getElementById("storageDot"),lab=document.getElementById("storageLabel");if(state.storageMode==="idb"){dot.className="storage-dot ok";lab.textContent="IndexedDB ativo";}else if(state.storageMode==="local"){dot.className="storage-dot";lab.textContent="Fallback localStorage";}else if(state.storageMode==="memory"){dot.className="storage-dot error";lab.textContent="Sessão temporária";}else{dot.className="storage-dot error";lab.textContent="Indisponível";}}
function showPage(page,scroll=true){state.activePage=page;document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id==="page-"+page));document.querySelectorAll(".nav-btn[data-page]").forEach(x=>x.classList.toggle("active",x.dataset.page===page));closeSidebar();if(scroll)window.scrollTo({top:0,behavior:"smooth"});}
function applyCompTemplate(index,template){const c=state.project.complementaries[index];if(!c)return;AREA_ORDER.forEach(k=>c.areaSettings[k]=defaultAreaSetting(k,template));markDirty();renderAll();toast(template==="demo50"?"Modelo demonstrativo aplicado.":"Instalações fixas integrais aplicadas.","ok");}
function bindDynamicEvents(){
  document.querySelectorAll("[data-path]").forEach(el=>el.addEventListener("change",()=>{const path=el.dataset.path;if(path.startsWith("_"))return;setPath(state.project,path,parseInputValue(el));if(path==="labor.method"&&el.value==="histogram")ensureHistogram();markDirty();renderAll();}));
  document.querySelectorAll("input[name='laborMethod']").forEach(el=>el.addEventListener("change",()=>{state.project.labor.method=el.value;if(el.value==="histogram")ensureHistogram();markDirty();renderAll();}));document.querySelectorAll("[data-go]").forEach(el=>el.addEventListener("click",()=>showPage(el.dataset.go)));
  document.querySelectorAll(".area-input").forEach(el=>el.addEventListener("change",()=>{const key=el.dataset.areaKey,row=calculate(state.project).rows.find(r=>r.key===key),v=Number(el.value);if(Math.abs(v-row.baseValue)<.005)delete state.project.overrides.areas[key];else state.project.overrides.areas[key]={...(state.project.overrides.areas[key]||{}),adopted:v,justification:state.project.overrides.areas[key]?.justification||""};markDirty();renderAll();}));document.querySelectorAll(".area-just").forEach(el=>el.addEventListener("change",()=>{const key=el.dataset.areaJustKey,row=calculate(state.project).rows.find(r=>r.key===key);if(!state.project.overrides.areas[key])state.project.overrides.areas[key]={adopted:row.adopted,justification:el.value};else state.project.overrides.areas[key].justification=el.value;markDirty();renderAll();}));document.querySelectorAll(".hist-input").forEach(el=>el.addEventListener("change",()=>{const i=Number(el.dataset.histIndex),k=el.dataset.histKey;ensureHistogram();state.project.labor.histogram[i][k]=Number(el.value)||0;markDirty();renderAll();}));const rct=document.querySelector("[data-path='_rctPercent']");if(rct)rct.addEventListener("change",()=>{const v=Number(rct.value),c=calculate(state.project);state.project.overrides.factors.rct=Math.abs(v/100-c.autoRct)<.000001?null:v/100;markDirty();renderAll();});
  document.querySelectorAll("[data-comp-template]").forEach(b=>b.addEventListener("click",()=>applyCompTemplate(Number(b.dataset.compIndex),b.dataset.compTemplate)));document.querySelectorAll("[data-remove-comp]").forEach(b=>b.addEventListener("click",()=>{state.project.complementaries.splice(Number(b.dataset.removeComp),1);markDirty();renderAll();}));document.querySelectorAll("[data-remove-industrial]").forEach(b=>b.addEventListener("click",()=>{state.project.industrials.splice(Number(b.dataset.removeIndustrial),1);markDirty();renderAll();}));document.querySelectorAll("[data-remove-hydro-item]").forEach(b=>b.addEventListener("click",()=>{state.project.hydro.customItems.splice(Number(b.dataset.removeHydroItem),1);markDirty();renderAll();}));
  document.querySelectorAll("[data-select-template]").forEach(b=>b.addEventListener("click",()=>{state.project.tomoLibrary.selectedId=b.dataset.selectTemplate;markDirty();renderAll();}));document.querySelectorAll("[data-remove-template]").forEach(b=>b.addEventListener("click",async()=>{const i=Number(b.dataset.removeTemplate),tpl=state.project.tomoLibrary.templates[i];if(!tpl)return;for(const id of tpl.assetIds||[])await deleteDrawingAsset(id);state.project.tomoLibrary.templates.splice(i,1);state.project.tomoLibrary.selectedId=state.project.tomoLibrary.templates[0]?.id||null;markDirty();renderAll();}));document.querySelectorAll("[data-remove-tomo-service]").forEach(b=>b.addEventListener("click",()=>{const ti=Number(b.dataset.templateIndex),si=Number(b.dataset.removeTomoService);state.project.tomoLibrary.templates[ti].services.splice(si,1);markDirty();renderAll();}));document.querySelectorAll("[data-open-asset]").forEach(b=>b.addEventListener("click",()=>openDrawingAsset(b.dataset.openAsset)));document.querySelectorAll("[data-delete-asset]").forEach(b=>b.addEventListener("click",()=>deleteDrawingAsset(b.dataset.deleteAsset)));
  on("btnNewProject",createNewProject);on("btnNewProject2",createNewProject);on("btnResetFactors",()=>{state.project.overrides.factors={k1:null,k2:null,k3:null,rct:null};state.project.overrides.factorJustifications={k1:"",k2:"",k3:"",rct:""};markDirty();renderAll();toast("Fatores restaurados.","ok");});on("btnResetAreas",()=>{state.project.overrides.areas={};markDirty();renderAll();toast("Áreas restauradas.","ok");});on("btnFillHistogram",()=>{ensureHistogram();state.project.labor.histogram.forEach(r=>{r.ordinary=Number(state.project.labor.ordinaryAverage)||0;r.variable=Number(state.project.labor.variableAverage)||0;});markDirty();renderAll();});on("btnClearHistogram",()=>{ensureHistogram();state.project.labor.histogram.forEach(r=>{r.ordinary=0;r.variable=0;});markDirty();renderAll();});on("btnAddComplement",()=>{state.project.complementaries.push(newComplementary("integral"));markDirty();renderAll();toast("Obra complementar adicionada.","ok");});on("btnResetContainerPrices",()=>{state.project.containerLibrary.prices=defaultContainerPrices();state.project.containerLibrary.justifications={};markDirty();renderAll();toast("Preços de referência restaurados.","ok");});on("btnAddIndustrial",()=>{const t=document.getElementById("newIndustrialType")?.value||"IV";state.project.industrials.push(newIndustrial(t));markDirty();renderAll();toast("Instalação industrial adicionada.","ok");});on("btnAddHydroItem",()=>{state.project.hydro.customItems.push(newHydroCustomItem());markDirty();renderAll();});
  on("btnAddTemplate",()=>{const t=newTomoTemplate();state.project.tomoLibrary.templates.push(t);state.project.tomoLibrary.selectedId=t.id;markDirty();renderAll();});on("btnResetTomoLibrary",()=>{state.project.tomoLibrary={selectedId:"tpl_rail_medium",templates:defaultTomoTemplates()};markDirty();renderAll();toast("Catálogo parcial restaurado.","ok");});on("btnAddTomoService",()=>{const t=selectedTemplateRaw();if(t){t.services.push(tomoService());markDirty();renderAll();}});on("btnAttachDrawing",()=>document.getElementById("tomoDrawingInput")?.click());on("btnImportTomoRows",()=>document.getElementById("tomoQuantityInput")?.click());const di=document.getElementById("tomoDrawingInput");if(di)di.addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;try{await attachDrawingFile(f);toast("Arquivo armazenado no IndexedDB.","ok");}catch(err){toast(err.message,"error");}e.target.value="";});const qi=document.getElementById("tomoQuantityInput");if(qi)qi.addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;try{await importTomoRowsFile(f);}catch(err){toast("Falha na importação: "+err.message,"error");}e.target.value="";});
  on("btnCopyMemory",async()=>{try{await navigator.clipboard.writeText(buildMemoryText(calculate(state.project)));toast("Memória copiada.","ok");}catch{toast("Não foi possível copiar.","error");}});on("btnPrintMemory",()=>{showPage("memory",false);setTimeout(()=>window.print(),100);});on("btnRunTests",()=>{runOfficialTests(true);renderAll();showPage("validation",false);toast("Autotestes executados.",state.testScore===100?"ok":"error");});on("btnLoadRoadOfficial",()=>loadOfficial("road",true));on("btnLoadPointOfficial",()=>loadOfficial("point",true));on("btnExportCurrent",exportCurrent);on("btnExportAll",exportAll);on("btnImport",triggerImport);on("btnImport2",triggerImport);on("btnStorageTest",async()=>{try{await Storage.test();toast("Armazenamento aprovado.","ok");}catch(e){toast("Falha: "+e.message,"error");}});document.querySelectorAll("[data-load-project]").forEach(b=>b.addEventListener("click",()=>loadProject(b.dataset.loadProject)));document.querySelectorAll("[data-duplicate-project]").forEach(b=>b.addEventListener("click",()=>duplicateProject(b.dataset.duplicateProject)));document.querySelectorAll("[data-delete-project]").forEach(b=>b.addEventListener("click",()=>confirmDeleteProject(b.dataset.deleteProject)));const fi=document.getElementById("fileImport");if(fi)fi.addEventListener("change",importFile);
}

function on(id,fn){const el=document.getElementById(id);if(el)el.addEventListener("click",fn);}
function buildMemoryText(c){const p=state.project,l=c.labor,lines=["CANTEIROSICRO — MEMÓRIA DE CÁLCULO",`Projeto: ${p.name}`,`Natureza: ${natureLabel(p.work.nature)}`,`Porte: ${porteLabel(c.classification.porte)}`,`Prazo: ${c.months} meses`,`NPF=${l.npf}; NMO=${l.nmo}; NPV=${l.npv}; NPF-V=${l.npfv}; NFA=${l.nfa}; NMAX=${l.nmax}`,`Principal=${c.mainCost??"pendente"}`,`Complementares=${c.complementaryCost}`,`CII=${c.cii}`,`CCI=${c.cci}`,`Analítico incluído=${c.analyticIncluded}`,`Total=${c.grandTotal}`];c.complementaries.forEach(x=>lines.push(`Complementar ${x.name}: AC=${x.ac}; eq=${x.eq}; CCOC=${x.cost}`));c.industrials.forEach(x=>lines.push(`${x.def.label}: área=${x.eq}; contêiner=${x.aggregate.total}; CDI=${x.cdi}; CII=${x.total}`));if(c.mobile)lines.push(`${c.mobile.type}: contêineres=${c.mobile.aggregate.total}; AT=${c.mobile.at}; custo=${c.mobile.cost}`);if(c.railway)lines.push(`Ferroviário ${c.railway.mode}: custo=${c.railway.cost??"pendente"}`);if(c.hydro)lines.push(`Hidroviário: custo=${c.hydro.cost??"pendente"}`);c.tomo.templates.forEach(t=>lines.push(`Projeto-tipo ${t.name}: serviços=${t.services.length}; total=${t.total}; tratamento=${t.include?"incluir":"comparar"}`));return lines.join("\n");}

async function createNewProject(){await saveCurrent(true);const p=blankProject();state.project=p;state.assets=[];state.projects.push(deepClone(p));state.dirty=true;await saveCurrent(true);renderAll();showPage("project");toast("Novo projeto criado.","ok");}

async function loadProject(id){await saveCurrent(true);const p=state.projects.find(x=>x.id===id);if(!p)return;state.project=normalizeProject(deepClone(p));state.dirty=false;await Storage.setSetting("lastProjectId",id);await loadAssetsForCurrent();renderAll();showPage("dashboard");}

async function duplicateProject(id){const source=state.projects.find(x=>x.id===id);if(!source)return;const oldAssets=await Storage.getAssets(id),p=normalizeProject(deepClone(source));p.id=uid();p.name=source.name+" — cópia";p.createdAt=p.updatedAt=Date.now();p.flags={officialExample:false,officialPointExample:false};const map={};for(const a of oldAssets){const n={...a,id:uid(),projectId:p.id,createdAt:Date.now()};map[a.id]=n.id;await Storage.putAsset(n);}p.tomoLibrary.templates.forEach(t=>t.assetIds=(t.assetIds||[]).map(x=>map[x]).filter(Boolean));await Storage.putProject(p);state.projects.push(deepClone(p));state.project=p;await loadAssetsForCurrent();renderAll();showPage("project");toast("Projeto e arquivos duplicados.","ok");}

function confirmDeleteProject(id){const p=state.projects.find(x=>x.id===id);if(!p)return;showModal("Excluir projeto",`<div class="alert danger"><span class="alert-icon">!</span><div>Excluir <strong>${esc(p.name)}</strong> e seus arquivos visuais?</div></div>`,[{label:"Cancelar"},{label:"Excluir",cls:"danger",action:async()=>{await Storage.deleteAssetsByProject(id);await Storage.deleteProject(id);state.projects=state.projects.filter(x=>x.id!==id);if(state.project.id===id){state.project=state.projects[0]?normalizeProject(deepClone(state.projects[0])):blankProject();if(!state.projects.length){state.projects.push(deepClone(state.project));await Storage.putProject(state.project);}await loadAssetsForCurrent();}closeModal();renderAll();toast("Projeto excluído.","ok");}}]);}

async function loadOfficial(kind="road",confirmReplace=false){const action=async()=>{const p=kind==="point"?officialPointProject():officialProject();const i=state.projects.findIndex(x=>x.id===p.id);if(i>=0)state.projects[i]=deepClone(p);else state.projects.push(deepClone(p));state.project=p;await Storage.deleteAssetsByProject(p.id);state.assets=[];await Storage.putProject(p);await Storage.setSetting("lastProjectId",p.id);state.dirty=false;closeModal();renderAll();showPage("dashboard");toast("Exemplo oficial carregado.","ok");};if(confirmReplace&&state.dirty){showModal("Carregar exemplo oficial","<p>O projeto atual será salvo antes da troca.</p>",[{label:"Cancelar"},{label:"Continuar",cls:"primary",action:async()=>{await saveCurrent(true);await action();}}]);}else await action();}
function chooseOfficial(){showModal("Exemplos oficiais","<p>Selecione o caso de validação a carregar.</p><div class='grid cols-2'><div class='card flat'><div class='card-title'>Construção rodoviária completa</div><div class='card-sub'>Principal + OAE complementar + britagem + solos + asfalto.</div></div><div class='card flat'><div class='card-title'>Intervenção pontual</div><div class='card-sub'>Contêineres e Equação 17.</div></div></div>",[{label:"Cancelar"},{label:"Intervenção pontual",action:()=>loadOfficial("point",true)},{label:"Construção rodoviária",cls:"primary",action:()=>loadOfficial("road",true)}]);}
async function exportCurrent(){await saveCurrent(true);const p=deepClone(state.project),assets=await Storage.getAssets(p.id);download(`CanteiroSICRO_${sanitizeName(p.name)}.json`,JSON.stringify({format:"CanteiroSICRO-project",version:APP_VERSION,exportedAt:new Date().toISOString(),project:p,assets},null,2));}

async function exportAll(){await saveCurrent(true);const assets=[];for(const p of state.projects)assets.push(...await Storage.getAssets(p.id));download(`CanteiroSICRO_backup_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({format:"CanteiroSICRO-backup",version:APP_VERSION,exportedAt:new Date().toISOString(),projects:state.projects,assets},null,2));}

function triggerImport(){document.getElementById("fileImport")?.click();}
async function importFile(ev){const file=ev.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());let incoming=[];if(data.project)incoming=[data.project];else if(Array.isArray(data.projects))incoming=data.projects;else if(data.id)incoming=[data];else throw new Error("Formato não reconhecido");const allAssets=Array.isArray(data.assets)?data.assets:[];let last=null;for(const raw of incoming){const oldPid=raw.id,p=normalizeProject(raw);if(state.projects.some(x=>x.id===p.id))p.id=uid();const idMap={};for(const a of allAssets.filter(x=>x.projectId===oldPid||(incoming.length===1&&!x.projectId))){const n={...a,id:uid(),projectId:p.id,createdAt:Date.now()};idMap[a.id]=n.id;await Storage.putAsset(n);}p.tomoLibrary.templates.forEach(t=>t.assetIds=(t.assetIds||[]).map(x=>idMap[x]||x).filter(Boolean));p.updatedAt=Date.now();await Storage.putProject(p);state.projects.push(deepClone(p));last=p;}if(last){state.project=last;await loadAssetsForCurrent();}renderAll();showPage("projects");toast(`${incoming.length} projeto(s) importado(s).`,"ok");}catch(e){console.error(e);toast("Falha na importação: "+e.message,"error");}ev.target.value="";}

function showModal(title,body,buttons=[]){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;const foot=document.getElementById("modalFoot");foot.innerHTML="";buttons.forEach(b=>{const btn=document.createElement("button");btn.className="btn "+(b.cls||"");btn.textContent=b.label;btn.addEventListener("click",b.action||closeModal);foot.appendChild(btn);});document.getElementById("modalBackdrop").classList.add("show");}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("show");}
function toast(msg,type=""){const el=document.getElementById("toast");el.textContent=msg;el.className="toast show "+type;clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),3300);}
function openSidebar(){document.getElementById("sidebar").classList.add("open");document.getElementById("mobileOverlay").classList.add("show");}
function closeSidebar(){document.getElementById("sidebar").classList.remove("open");document.getElementById("mobileOverlay").classList.remove("show");}

async function init(){document.querySelectorAll(".nav-btn[data-page]").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));document.getElementById("hamburger").addEventListener("click",openSidebar);document.getElementById("mobileOverlay").addEventListener("click",closeSidebar);document.getElementById("btnSave").addEventListener("click",()=>saveCurrent(false));document.getElementById("btnOfficial").addEventListener("click",chooseOfficial);document.getElementById("modalClose").addEventListener("click",closeModal);document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal();});window.addEventListener("beforeunload",e=>{if(state.dirty){e.preventDefault();e.returnValue="";}});await Storage.init();updateStorageIndicator();state.projects=(await Storage.getAllProjects()).map(normalizeProject);if(!state.projects.length){const off=officialProject();state.projects=[deepClone(off)];await Storage.putProject(off);}const last=await Storage.getSetting("lastProjectId");state.project=normalizeProject(deepClone(state.projects.find(x=>x.id===last)||state.projects[0]));await loadAssetsForCurrent();runOfficialTests(true);renderAll();console.info(`CanteiroSICRO v${APP_VERSION} inicializado. Armazenamento: ${state.storageMode}. Autoteste: ${state.testScore}%.`);}

document.addEventListener("DOMContentLoaded",()=>init().catch(err=>{console.error(err);document.body.innerHTML=`<div style="font-family:Arial;padding:30px"><h1>Falha ao iniciar o CanteiroSICRO</h1><pre>${esc(err.stack||err.message)}</pre></div>`;}));
</script>
</body>
