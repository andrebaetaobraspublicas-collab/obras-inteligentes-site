<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>CanteiroSICRO — Calculadora de Canteiro de Obras</title>
<style>
  :root{
    --navy:#0b2f5b;
    --navy-2:#123f75;
    --blue:#0e74c8;
    --blue-soft:#eaf4ff;
    --cyan:#16a3c7;
    --ink:#172334;
    --muted:#607087;
    --line:#d8e1ec;
    --line-2:#e9eef5;
    --bg:#f3f6fa;
    --card:#ffffff;
    --ok:#147d4d;
    --ok-bg:#eaf8f1;
    --warn:#a15b00;
    --warn-bg:#fff4df;
    --danger:#b42318;
    --danger-bg:#fff0ef;
    --shadow:0 10px 28px rgba(12,47,91,.08);
    --radius:14px;
    --radius-sm:9px;
    --sidebar:278px;
    --topbar:70px;
    --font:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  .app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
  .sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--navy),#071f3d 78%);color:#fff;padding:20px 14px 16px;display:flex;flex-direction:column;z-index:30;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:12px;padding:4px 10px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
  .brand-mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#1ca6dc,#2e7bd5);box-shadow:0 8px 20px rgba(0,0,0,.18)}
  .brand-mark svg{width:29px;height:29px}
  .brand-name{font-weight:800;font-size:19px;letter-spacing:-.02em}
  .brand-sub{font-size:12px;color:#b9cbe0;margin-top:1px}
  .nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:#8fa9c5;margin:18px 12px 8px;font-weight:700}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav-btn{border:0;background:transparent;color:#dce7f4;display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-weight:600;font-size:14px;transition:.18s}
  .nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav-btn.active{background:linear-gradient(90deg,rgba(31,153,218,.33),rgba(31,153,218,.16));color:#fff;box-shadow:inset 3px 0 0 #39b5ee}
  .nav-icon{width:22px;text-align:center;font-size:17px;opacity:.95}
  .sidebar-footer{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.12)}
  .storage-pill{display:flex;align-items:center;gap:8px;font-size:12px;color:#c7d6e7}
  .storage-dot{width:9px;height:9px;border-radius:50%;background:#f3b63a;box-shadow:0 0 0 4px rgba(243,182,58,.12)}
  .storage-dot.ok{background:#3fd28d;box-shadow:0 0 0 4px rgba(63,210,141,.12)}
  .storage-dot.error{background:#ff7066;box-shadow:0 0 0 4px rgba(255,112,102,.12)}
  .version{font-size:11px;color:#7f9ab6;margin-top:8px}
  .main{min-width:0}
  .topbar{height:var(--topbar);position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(9px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .top-left{display:flex;align-items:center;gap:13px;min-width:0}
  .hamburger{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;width:40px;height:40px}
  .project-head{min-width:0}
  .project-title{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
  .project-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:1px}
  .stage-chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;background:var(--blue-soft);color:var(--navy-2);font-weight:700}
  .save-state{display:flex;align-items:center;gap:6px}
  .save-state::before{content:"";width:7px;height:7px;border-radius:50%;background:#7b8ca0}
  .save-state.dirty::before{background:#e09a24}
  .save-state.saved::before{background:#15905b}
  .top-actions{display:flex;align-items:center;gap:8px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 13px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.16s;min-height:39px}
  .btn:hover{border-color:#aebed1;transform:translateY(-1px)}
  .btn.primary{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
  .btn.primary:hover{background:#0d3768}
  .btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.success{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.danger{color:var(--danger);border-color:#efc8c5;background:#fff}
  .btn.ghost{background:transparent}
  .btn.small{padding:6px 9px;min-height:32px;font-size:12px;border-radius:7px}
  .content{padding:22px 24px 50px;max-width:1680px;margin:0 auto}
  .page{display:none;animation:fade .18s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}
  .page-title{margin:0;font-size:27px;letter-spacing:-.03em;color:#10243d}
  .page-desc{color:var(--muted);margin:5px 0 0;max-width:900px}
  .page-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .grid{display:grid;gap:16px}
  .grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}
  .card.flat{box-shadow:none}
  .card-title{font-size:16px;font-weight:800;color:#17314e;margin:0 0 4px}
  .card-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
  .metric{padding:17px 18px}
  .metric-label{font-size:12px;text-transform:uppercase;letter-spacing:.055em;color:var(--muted);font-weight:800}
  .metric-value{font-size:27px;font-weight:850;letter-spacing:-.035em;color:#102d50;margin-top:5px}
  .metric-foot{font-size:12px;color:var(--muted);margin-top:4px}
  .metric.ok .metric-value{color:var(--ok)}
  .metric.warn .metric-value{color:var(--warn)}
  .section{margin-top:17px}
  .section-title{font-size:18px;margin:0 0 11px;color:#17314e;letter-spacing:-.015em}
  .form-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
  .field{grid-column:span 3;min-width:0}
  .field.span-2{grid-column:span 2}.field.span-4{grid-column:span 4}.field.span-5{grid-column:span 5}.field.span-6{grid-column:span 6}.field.span-8{grid-column:span 8}.field.span-12{grid-column:span 12}
  label.field-label{display:block;font-weight:750;font-size:13px;color:#2b425e;margin:0 0 6px}
  .hint{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:4px}
  input[type="text"],input[type="number"],input[type="month"],select,textarea{width:100%;border:1px solid #cbd6e3;background:#fff;color:var(--ink);border-radius:8px;padding:10px 11px;outline:none;transition:.15s}
  textarea{min-height:88px;resize:vertical}
  input:focus,select:focus,textarea:focus{border-color:#4a9ed8;box-shadow:0 0 0 3px rgba(14,116,200,.12)}
  input[readonly]{background:#f5f7fa;color:#4e6177}
  .checkline{display:flex;align-items:flex-start;gap:9px;padding-top:5px}
  .checkline input{margin-top:3px;width:17px;height:17px}
  .switch-row{display:flex;gap:10px;flex-wrap:wrap}
  .choice{position:relative}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .choice label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer}
  .choice input:checked+label{border-color:#3d8fc9;background:var(--blue-soft);color:#114f80;box-shadow:0 0 0 2px rgba(14,116,200,.07)}
  .alert{border-radius:11px;padding:12px 14px;border:1px solid;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;font-size:14px}
  .alert.info{background:#edf6ff;border-color:#c7e1f8;color:#184e78}
  .alert.warn{background:var(--warn-bg);border-color:#f2d49b;color:#7b4905}
  .alert.danger{background:var(--danger-bg);border-color:#efc5c1;color:#8c2119}
  .alert.ok{background:var(--ok-bg);border-color:#bfe6d2;color:#14643f}
  .alert-icon{font-weight:900;font-size:17px;line-height:1.2}
  .badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;white-space:nowrap}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.info{background:var(--blue-soft);color:#175b8f}
  .badge.gray{background:#eef1f5;color:#5c6c7e}
  .badge.danger{background:var(--danger-bg);color:var(--danger)}
  .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}
  table{border-collapse:collapse;width:100%;min-width:720px}
  th{background:#f3f6fa;color:#334b67;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.035em;padding:10px 11px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
  td{padding:10px 11px;border-bottom:1px solid var(--line-2);vertical-align:top;font-size:14px}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fafcff}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .table-input{min-width:105px;padding:7px 8px!important}
  .justify-input{min-width:220px;padding:7px 8px!important}
  .formula{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;background:#f4f7fb;border:1px solid #e0e7f0;border-radius:8px;padding:9px 11px;color:#223c5a;font-size:13px;overflow:auto}
  .kv{display:grid;grid-template-columns:minmax(150px,1fr) minmax(110px,auto);gap:8px 14px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}.kv .v{font-weight:800;text-align:right}
  .progress{height:10px;border-radius:999px;background:#e8eef5;overflow:hidden}
  .progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:inherit;transition:width .3s}
  .bar-list{display:flex;flex-direction:column;gap:12px}
  .bar-row{display:grid;grid-template-columns:190px minmax(80px,1fr) 110px;gap:12px;align-items:center;font-size:13px}
  .bar-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#3a5069}
  .bar-value{text-align:right;font-weight:750;font-variant-numeric:tabular-nums}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .classification-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
  .result-box{border:1px solid #c7dcf0;background:linear-gradient(135deg,#f4faff,#e8f4ff);border-radius:13px;padding:20px}
  .result-label{font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:.06em;color:#487194}
  .result-main{font-size:32px;font-weight:900;color:#0d477b;margin-top:4px;letter-spacing:-.04em}
  .result-detail{margin-top:6px;color:#47647e}
  .steps{counter-reset:step;display:flex;flex-direction:column;gap:12px}
  .step{position:relative;padding:14px 15px 14px 54px;border:1px solid var(--line);border-radius:11px;background:#fff}
  .step::before{counter-increment:step;content:counter(step);position:absolute;left:14px;top:13px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--navy-2);color:#fff;font-weight:850;font-size:13px}
  .step-title{font-weight:850;color:#1c3654;margin-bottom:5px}
  .step-source{font-size:11px;color:var(--muted);margin-top:7px}
  .test-summary{display:flex;align-items:center;gap:15px}
  .score-ring{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) var(--score,0%),#e3eaf2 0);position:relative}
  .score-ring::after{content:"";position:absolute;inset:8px;background:#fff;border-radius:50%}
  .score-ring span{position:relative;z-index:1;font-weight:900;color:#173c2d;font-size:18px}
  .histogram-wrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .hist-bar{height:8px;background:#d8eafa;border-radius:999px;overflow:hidden;min-width:100px}
  .hist-bar span{display:block;height:100%;background:#1685cc}
  .project-list{display:grid;gap:10px}
  .project-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:#fff}
  .project-item.current{border-color:#69a9d5;background:#f2f9ff}
  .project-name{font-weight:800;color:#193754}
  .project-small{font-size:12px;color:var(--muted);margin-top:2px}
  .project-actions{display:flex;gap:6px;flex-wrap:wrap}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  .code-ref{font-size:12px;color:#496682;background:#f4f7fb;border-radius:6px;padding:3px 6px;display:inline-block}
  details{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:9px}
  summary{cursor:pointer;padding:12px 14px;font-weight:800;color:#294763}
  details>div{padding:0 14px 14px;color:#4c6077}
  .toast{position:fixed;right:22px;bottom:22px;z-index:100;min-width:280px;max-width:430px;background:#122f4e;color:#fff;border-radius:11px;padding:13px 15px;box-shadow:0 15px 38px rgba(0,0,0,.23);opacity:0;transform:translateY(15px);pointer-events:none;transition:.22s}
  .toast.show{opacity:1;transform:none}
  .toast.error{background:#8f2119}.toast.ok{background:#176642}
  .modal-backdrop{position:fixed;inset:0;background:rgba(6,24,43,.56);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
  .modal-backdrop.show{display:flex}
  .modal{background:#fff;border-radius:15px;box-shadow:0 24px 70px rgba(0,0,0,.3);width:min(720px,100%);max-height:90vh;overflow:auto}
  .modal-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal-title{font-size:18px;font-weight:850}
  .modal-body{padding:18px 19px}.modal-foot{padding:14px 19px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .close-btn{border:0;background:#eef2f6;width:34px;height:34px;border-radius:8px;font-size:20px}
  .mobile-overlay{display:none}
  .muted{color:var(--muted)}.small-text{font-size:12px}.strong{font-weight:800}.nowrap{white-space:nowrap}
  .text-ok{color:var(--ok)}.text-warn{color:var(--warn)}.text-danger{color:var(--danger)}
  .right{text-align:right}.center{text-align:center}.mt-0{margin-top:0}.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mb-0{margin-bottom:0}
  .hidden{display:none!important}
  @media(max-width:1180px){
    .grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
    .field{grid-column:span 4}.field.span-2{grid-column:span 4}
  }
  @media(max-width:900px){
    :root{--sidebar:270px}
    .app{display:block}
    .sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);transition:.22s;width:var(--sidebar);box-shadow:12px 0 35px rgba(0,0,0,.22)}
    .sidebar.open{transform:none}
    .mobile-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:25;opacity:0;pointer-events:none;transition:.2s}
    .mobile-overlay.show{opacity:1;pointer-events:auto}
    .hamburger{display:inline-grid;place-items:center}
    .topbar{padding:0 14px}
    .content{padding:18px 14px 42px}
    .grid.cols-2,.grid.cols-3,.grid.cols-4,.classification-hero{grid-template-columns:1fr}
    .page-head{flex-direction:column}.page-actions{justify-content:flex-start}
    .field,.field.span-2,.field.span-4,.field.span-5,.field.span-6,.field.span-8{grid-column:span 6}
    .bar-row{grid-template-columns:130px 1fr 90px}
    .top-actions .hide-mobile{display:none}
  }
  @media(max-width:620px){
    body{font-size:15px}
    .field,.field.span-2,.field.span-4,.field.span-5,.field.span-6,.field.span-8,.field.span-12{grid-column:span 12}
    .grid.cols-4{grid-template-columns:1fr}
    .project-title{max-width:55vw}
    .project-meta .stage-chip{display:none}
    .bar-row{grid-template-columns:1fr;gap:5px}.bar-value{text-align:left}
    .top-actions .btn:not(.primary){display:none}
  }
  @media print{
    body{background:#fff;font-size:11pt}
    .sidebar,.topbar,.page:not(#page-memory),#page-memory .page-actions,.no-print,.toast,.modal-backdrop{display:none!important}
    .app,.main,.content{display:block!important;margin:0!important;padding:0!important;max-width:none!important}
    #page-memory{display:block!important}
    .card,.step{box-shadow:none;break-inside:avoid;border-color:#bbb}
    .page-title{font-size:20pt}
    .table-wrap{overflow:visible;border-color:#bbb}
    table{min-width:0;font-size:9pt}
    th{position:static;background:#eee!important;color:#000!important}
    @page{size:A4;margin:14mm}
  }

  .table-select,.compact-select{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:7px 8px;font-size:13px}
  .compact-select{width:auto;min-width:270px;padding:9px 10px}
  details.card{padding:0;overflow:hidden}
  details.card>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;cursor:pointer;background:linear-gradient(180deg,#fff,#f8fbff);border-bottom:1px solid transparent}
  details.card[open]>summary{border-bottom-color:var(--line)}
  details.card>summary::-webkit-details-marker{display:none}
  details.card>summary:before{content:"▸";font-size:16px;color:var(--blue);transition:.2s}
  details.card[open]>summary:before{transform:rotate(90deg)}
  details.card>summary>span:first-of-type{flex:1}
  details.card>.mt-2{padding:0 18px 18px}
  .complement-card,.industrial-card{margin-bottom:16px}
  .card.flat{box-shadow:none;background:#fbfdff}
  .strong{font-weight:750}
  .kv.strong{font-weight:800;border-top:2px solid var(--navy);margin-top:6px}
  .nav-divider{height:1px;background:rgba(255,255,255,.12);margin:9px 8px}
  .nav .nav-btn{min-height:40px}
  .sidebar{padding-bottom:12px}
  .sidebar-footer{position:relative}
  .content{max-width:1760px}
  .table-wrap table td .table-input{min-width:82px}
  .table-wrap table td .justify-input{min-width:190px}
  .table-wrap table td .table-select{min-width:145px}
  @media(max-width:760px){.compact-select{width:100%;min-width:0}.page-actions{width:100%}.page-actions .compact-select{flex:1}.complement-card>.mt-2,.industrial-card>.mt-2{padding:0 12px 12px}}

  .advanced-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:16px}
  .library-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
  .template-list{display:grid;gap:10px;max-height:72vh;overflow:auto;padding-right:4px}
  .template-item{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;cursor:pointer;transition:.18s ease}
  .template-item:hover{border-color:#9fc3e8;transform:translateY(-1px)}
  .template-item.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(14,116,200,.10)}
  .template-name{font-weight:800;color:var(--navy);margin-bottom:4px}
  .template-meta{font-size:12px;color:var(--muted)}
  .preview-shell{min-height:250px;border:1px dashed #b7c7da;border-radius:12px;background:#f8fbff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
  .preview-shell img{max-width:100%;max-height:440px;object-fit:contain;border-radius:8px}
  .preview-shell iframe{width:100%;height:520px;border:0;border-radius:8px;background:#fff}
  .schematic{width:100%;min-height:230px;display:flex;align-items:center;justify-content:center}
  .schematic svg{width:100%;max-width:680px;height:auto}
  .asset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  .asset-card{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
  .asset-thumb{height:110px;border-radius:8px;background:#eef4fb;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px}

function round2(n){const x=Number(n);if(!Number.isFinite(x))return 0;return Math.sign(x)*Math.round((Math.abs(x)+1e-9)*100)/100;}
function roundBy(n,mode){return mode===ROUNDING_CADERNO?round2(n):Number(n)||0;}
function num(n,dec=2){const v=Number(n);if(!Number.isFinite(v))return "—";return new Intl.NumberFormat("pt-BR",{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(v);}
function money(n){const v=Number(n);if(!Number.isFinite(v))return "—";return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2,maximumFractionDigits:2}).format(v);}
function pct(n,dec=2){return num(Number(n)*100,dec)+"%";}

/* ---------- IndexedDB com fallback ---------- */
const Storage={
  memoryProjects:[],memorySettings:{},memoryAssets:[],
  async init(){
    const chooseFallback=()=>{try{const k=DB_NAME+"__probe";localStorage.setItem(k,"1");localStorage.removeItem(k);state.storageMode="local";}catch{state.storageMode="memory";}};
    if(!("indexedDB" in window)){chooseFallback();return;}
    try{state.db=await new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains("projects"))db.createObjectStore("projects",{keyPath:"id"});if(!db.objectStoreNames.contains("settings"))db.createObjectStore("settings",{keyPath:"key"});let a;if(!db.objectStoreNames.contains("assets"))a=db.createObjectStore("assets",{keyPath:"id"});else a=req.transaction.objectStore("assets");if(!a.indexNames.contains("projectId"))a.createIndex("projectId","projectId",{unique:false});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error("Falha ao abrir IndexedDB"));});state.storageMode="idb";}catch(err){console.warn("IndexedDB indisponível; ativando armazenamento alternativo.",err);chooseFallback();}
  },
  tx(store,mode="readonly"){return state.db.transaction(store,mode).objectStore(store);},
  async getAllProjects(){if(state.storageMode==="idb")return new Promise((resolve,reject)=>{const r=this.tx("projects").getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});if(state.storageMode==="memory")return deepClone(this.memoryProjects);try{return JSON.parse(localStorage.getItem(DB_NAME+"_projects")||"[]");}catch{return [];}}
  ,async putProject(p){if(state.storageMode==="idb")return new Promise((resolve,reject)=>{const r=this.tx("projects","readwrite").put(p);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error);});if(state.storageMode==="memory"){const i=this.memoryProjects.findIndex(x=>x.id===p.id);if(i>=0)this.memoryProjects[i]=deepClone(p);else this.memoryProjects.push(deepClone(p));return;}const list=await this.getAllProjects();const i=list.findIndex(x=>x.id===p.id);if(i>=0)list[i]=p;else list.push(p);localStorage.setItem(DB_NAME+"_projects",JSON.stringify(list));}
  ,async deleteProject(id){if(state.storageMode==="idb")return new Promise((resolve,reject)=>{const r=this.tx("projects","readwrite").delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error);});if(state.storageMode==="memory"){this.memoryProjects=this.memoryProjects.filter(x=>x.id!==id);return;}const list=(await this.getAllProjects()).filter(x=>x.id!==id);localStorage.setItem(DB_NAME+"_projects",JSON.stringify(list));}
  ,async getSetting(key){if(state.storageMode==="idb")return new Promise((resolve,reject)=>{const r=this.tx("settings").get(key);r.onsuccess=()=>resolve(r.result?.value);r.onerror=()=>reject(r.error);});if(state.storageMode==="memory")return this.memorySettings[key];return localStorage.getItem(DB_NAME+"_setting_"+key);}
  ,async setSetting(key,value){if(state.storageMode==="idb")return new Promise((resolve,reject)=>{const r=this.tx("settings","readwrite").put({key,value});r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error);});if(state.storageMode==="memory"){this.memorySettings[key]=value;return;}localStorage.setItem(DB_NAME+"_setting_"+key,String(value));}
  ,async getAssets(projectId){if(state.storageMode==="idb")return new Promise((resolve,reject)=>{const s=this.tx("assets"),r=s.index("projectId").getAll(projectId);r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});if(state.storageMode==="memory")return deepClone(this.memoryAssets.filter(x=>x.projectId===projectId));try{return JSON.parse(localStorage.getItem(DB_NAME+"_assets")||"[]").filter(x=>x.projectId===projectId);}catch{return [];}}
  ,async putAsset(a){if(state.storageMode==="idb")return new Promise((resolve,reject)=>{const r=this.tx("assets","readwrite").put(a);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error);});if(state.storageMode==="memory"){const i=this.memoryAssets.findIndex(x=>x.id===a.id);if(i>=0)this.memoryAssets[i]=deepClone(a);else this.memoryAssets.push(deepClone(a));return;}const all=(()=>{try{return JSON.parse(localStorage.getItem(DB_NAME+"_assets")||"[]");}catch{return [];}})();const i=all.findIndex(x=>x.id===a.id);if(i>=0)all[i]=a;else all.push(a);localStorage.setItem(DB_NAME+"_assets",JSON.stringify(all));}
  ,async deleteAsset(id){if(state.storageMode==="idb")return new Promise((resolve,reject)=>{const r=this.tx("assets","readwrite").delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error);});if(state.storageMode==="memory"){this.memoryAssets=this.memoryAssets.filter(x=>x.id!==id);return;}const all=(()=>{try{return JSON.parse(localStorage.getItem(DB_NAME+"_assets")||"[]");}catch{return [];}})().filter(x=>x.id!==id);localStorage.setItem(DB_NAME+"_assets",JSON.stringify(all));}
  ,async deleteAssetsByProject(projectId){const rows=await this.getAssets(projectId);for(const a of rows)await this.deleteAsset(a.id);}

};

  document.getElementById("page-project").innerHTML=pageHead("Dados da obra","Entradas gerais que controlam todos os módulos do sistema.",`<button class="btn" id="btnNewProject">＋ Novo</button><button class="btn primary" data-go="classification">Calcular e classificar</button>`)+`<div class="card"><h2 class="section-title mt-0">Identificação</h2><div class="form-grid">${field("Nome do projeto","name",p.name,{span:6})}${field("Órgão ou entidade","meta.agency",m.agency,{span:3})}${field("Contrato / processo","meta.contract",m.contract,{span:3})}${field("Responsável pelo orçamento","meta.responsible",m.responsible,{span:4})}${field("UF","meta.uf",m.uf,{span:2,max:2})}${field("Município","meta.municipality",m.municipality,{span:3})}${field("Mês-base","meta.baseMonth",m.baseMonth,{type:"month",span:3})}${field("Custo estimado da obra sem BDI (R$)","meta.workCost",m.workCost,{type:"number",span:4,min:0,step:.01})}</div><div class="divider"></div><h2 class="section-title">Caracterização técnica</h2><div class="form-grid">${selectField("Natureza da obra","work.nature",w.nature,NATURE_OPTIONS,{span:6})}${showExt?field(extLabel,"work.extension",w.extension,{type:"number",span:3,min:0,step:.01}):""}${field("Prazo contratual (meses)","work.contractMonths",w.contractMonths,{type:"number",span:3,min:1,step:1})}${specific}${selectField("Forma de informar o prazo efetivo","work.durationMode",w.durationMode,[["range","Meses inicial e final"],["direct","Prazo direto em meses"]],{span:3})}${durationFields}${selectField("Padrão de construção","work.constructionPattern",w.constructionPattern,[["provisional","Provisório — k1 = 0,80"],["permanent","Permanente — k1 = 1,00"]],{span:3})}${field("Distância ao centro fornecedor (km)","work.supplierDistance",w.supplierDistance,{type:"number",span:3,min:0,step:.01})}${selectField("Condição do acesso","work.pavement",w.pavement,[["natural","Leito natural"],["primary","Revestimento primário"],["paved","Rodovia pavimentada"]],{span:3})}${field("CMCC (R$/m²)","work.cmcc",w.cmcc,{type:"number",span:3,min:0,step:.01,hint:"Entrada manual/offline"})}${selectField("Critério de arredondamento","work.roundingMode",w.roundingMode,[[ROUNDING_CADERNO,"Reprodução do Caderno"],[ROUNDING_PRECISION,"Alta precisão"]],{span:6})}${textareaField("Justificativa para distância inferior a 50 km","work.distanceJustification",w.distanceJustification,{span:6})}${textareaField("Observações gerais","meta.notes",m.notes,{span:12})}</div><div class="divider"></div><div class="grid cols-3"><button class="btn" data-go="complementaries">Obras complementares (${p.complementaries.length})</button><button class="btn" data-go="mobile">Canteiros móveis</button><button class="btn" data-go="industrials">Instalações industriais (${p.industrials.length})</button><button class="btn" data-go="advanced">Ferroviário / hidro / itinerante</button><button class="btn" data-go="tomo">Projetos-tipo e Tomos</button><button class="btn primary" data-go="budget">Orçamento consolidado</button></div></div>`;

function renderClassification(c){
  const p=state.project,cls=c.classification,rule=SICRO_RULES.classification[p.work.nature];let scale="";if(rule){const max=Math.max(rule.mediumMax*1.25,cls.productivity||1),pos=clamp((cls.productivity||0)/max*100,0,100);scale=`<div class="card"><div class="card-title">Faixas de classificação</div><div class="bar-list"><div class="bar-row"><div class="bar-label">Pequeno</div><div class="progress"><span style="width:${rule.smallMax/max*100}%"></span></div><div class="bar-value">até ${num(rule.smallMax,0)} ${rule.unit}</div></div><div class="bar-row"><div class="bar-label">Médio</div><div class="progress"><span style="width:${rule.mediumMax/max*100}%"></span></div><div class="bar-value">até ${num(rule.mediumMax,0)} ${rule.unit}</div></div><div class="bar-row"><div class="bar-label">Projeto</div><div class="progress"><span style="width:${pos}%"></span></div><div class="bar-value">${num(cls.productivity)} ${rule.unit}</div></div></div></div>`;}else scale=`<div class="card"><div class="card-title">Tratamento metodológico</div><div class="alert info"><span class="alert-icon">i</span><div>${esc(cls.source)}</div></div></div>`;
  const comps=c.complementaries.length?`<div class="card section"><div class="card-title">Obras complementares classificadas</div><div class="table-wrap mt-1"><table><thead><tr><th>Obra</th><th>Natureza</th><th class="num">Produção anual</th><th>Porte</th><th>Status</th></tr></thead><tbody>${c.complementaries.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(natureLabel(x.nature))}</td><td class="num">${x.classification.productivity!=null?`${num(x.classification.productivity)} ${esc(x.classification.unit)}`:"—"}</td><td>${esc(porteLabel(x.classification.porte))}</td><td>${x.supported?badge("Orçável","ok"):badge("Revisar","warn")}</td></tr>`).join("")}</tbody></table></div></div>`:"";
  document.getElementById("page-classification").innerHTML=pageHead("Classificação da obra","Enquadramento da obra principal e das naturezas complementares.",`<button class="btn" data-go="project">← Rever entradas</button><button class="btn primary" data-go="labor">Mão de obra →</button>`)+`<div class="classification-hero"><div class="result-box"><div class="result-label">Resultado</div><div class="result-main">${esc(porteLabel(cls.porte))}</div><div class="result-detail">${esc(natureLabel(p.work.nature))}${cls.productivity!=null?` · ${num(cls.productivity)} ${esc(cls.unit)}`:""}</div><div class="mt-2">${statusForCost(c)}</div></div><div class="card"><div class="card-title">Memória resumida</div><div class="formula">Produção anual = ${num(Number(p.work.extension)||0)} ÷ (${num(c.months,0)} / 12) = ${cls.productivity!=null?num(cls.productivity):"—"} ${esc(cls.unit)}</div><div class="step-source">Fonte: ${esc(cls.source||"Metodologia específica")}</div>${cls.validPoint===false?`<div class="alert danger mt-1"><span class="alert-icon">!</span><div>Intervenção contínua acima de 5 km/ano.</div></div>`:""}</div></div><div class="grid cols-2 section">${scale}<div class="card"><div class="card-title">Dados utilizados</div><div class="kv"><div class="k">Extensão</div><div class="v">${num(p.work.extension)} ${p.work.nature.startsWith("oae_")?"m":"km"}</div></div><div class="kv"><div class="k">Prazo efetivo</div><div class="v">${num(c.months,0)} meses</div></div><div class="kv"><div class="k">Referência</div><div class="v"><span class="code-ref">${esc(cls.source)}</span></div></div></div></div>${comps}`;
}

function ensureHistogram(){const p=state.project,n=Math.max(1,Math.round(effectiveMonths(p)||p.work.contractMonths||12));if(!Array.isArray(p.labor.histogram))p.labor.histogram=[];const old=p.labor.histogram;p.labor.histogram=Array.from({length:n},(_,i)=>old[i]||{month:i+1,ordinary:0,variable:0});}
function renderHistogramTable(rows){const max=Math.max(1,...rows.flatMap(r=>[Number(r.ordinary)||0,Number(r.variable)||0]));return `<div class="alert info"><span class="alert-icon">i</span><div>Os máximos mensais são utilizados como NMO e NPV.</div></div><div class="page-actions mb-0"><button class="btn small" id="btnFillHistogram">Preencher pelas médias</button><button class="btn small" id="btnClearHistogram">Zerar</button></div><div class="histogram-wrap mt-1"><table><thead><tr><th>Mês</th><th class="num">Ordinária</th><th>Intensidade</th><th class="num">Variável</th><th>Intensidade</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td class="num"><input class="table-input hist-input" data-hist-index="${i}" data-hist-key="ordinary" type="number" min="0" step=".01" value="${esc(r.ordinary||0)}"></td><td><div class="hist-bar"><span style="width:${clamp((Number(r.ordinary)||0)/max*100,0,100)}%"></span></div></td><td class="num"><input class="table-input hist-input" data-hist-index="${i}" data-hist-key="variable" type="number" min="0" step=".01" value="${esc(r.variable||0)}"></td><td><div class="hist-bar"><span style="width:${clamp((Number(r.variable)||0)/max*100,0,100)}%"></span></div></td></tr>`).join("")}</tbody></table></div>`;}
function renderLabor(c){const p=state.project,l=p.labor,cl=c.labor;if(l.method==="histogram")ensureHistogram();const inputs=l.method==="average"?`<div class="form-grid">${field("Mão de obra ordinária média","labor.ordinaryAverage",l.ordinaryAverage,{type:"number",span:4,min:0,step:.01})}${field("Parcela variável média","labor.variableAverage",l.variableAverage,{type:"number",span:4,min:0,step:.01})}<div class="field span-4"><label class="field-label">Fator de pico</label><input value="1,33" readonly></div></div>`:l.method==="peak"?`<div class="form-grid">${field("NMO informado","labor.ordinaryPeak",l.ordinaryPeak,{type:"number",span:6,min:0,step:.01})}${field("NPV informado","labor.variablePeak",l.variablePeak,{type:"number",span:6,min:0,step:.01})}</div>`:renderHistogramTable(l.histogram);document.getElementById("page-labor").innerHTML=pageHead("Mão de obra","Parâmetros de ocupação utilizados no canteiro fixo, complementares e intervenção pontual.",`<button class="btn" data-go="classification">← Classificação</button><button class="btn primary" data-go="factors">Fatores →</button>`)+`<div class="card"><div class="card-title">Método para o pico</div><div class="switch-row">${[["average","Média × 1,33"],["peak","Pico informado"],["histogram","Histograma"]].map(([v,t])=>`<div class="choice"><input type="radio" name="laborMethod" id="lm_${v}" value="${v}" ${l.method===v?"checked":""}><label for="lm_${v}">${t}</label></div>`).join("")}</div><div class="divider"></div>${inputs}<div class="divider"></div><div class="form-grid">${field("Parcela fixa — NPF","labor.fixed",l.fixed,{type:"number",span:4,min:0,step:.01})}${field("Parcela vinculada","labor.linked",l.linked,{type:"number",span:4,min:0,step:.01})}${selectField("Funcionários alojados — NFA","labor.nfaMode",l.nfaMode,[["automatic","Regra automática"],["manual","Informar manualmente"]],{span:4})}${l.nfaMode==="manual"?field("NFA adotado","labor.nfaManual",l.nfaManual,{type:"number",span:4,min:0,step:.01}):""}</div></div><div class="grid cols-4 section">${metric("NPF",num(cl.npf,2),"Parcela fixa")}${metric("NMO",num(cl.nmo,2),"Ordinária no pico")}${metric("NPV",num(cl.npv,2),"Variável no pico")}${metric("NPF-V",num(cl.npfv,2),"Fixa + vinculada")}${metric("NFA",num(cl.nfa,2),l.nfaMode==="manual"?"Informado":"Automático")}${metric("NMAX",num(cl.nmax,2),"Máximo total","ok")}</div><div class="card section"><div class="card-title">Memória</div><div class="grid cols-3"><div class="formula">NMO = ${num(cl.nmo,2)}<br>NPV = ${num(cl.npv,2)}</div><div class="formula">NPF-V = ${num(cl.npf,2)} + ${num(cl.linked,2)} = ${num(cl.npfv,2)}</div><div class="formula">NMAX = ${num(cl.npfv,2)} + ${num(cl.npv,2)} + ${num(cl.nmo,2)} = ${num(cl.nmax,2)}</div></div></div>`;}

function renderFactors(c){const p=state.project,ov=p.overrides.factors,j=p.overrides.factorJustifications;const factorCard=(key,label,auto,adopted,source,detail)=>`<div class="card"><div class="card-title">${label}</div><div class="card-sub">${detail}</div><div class="grid cols-2"><div><div class="metric-label">Automático</div><div class="metric-value">${num(auto,4)}</div></div><div><div class="metric-label">Adotado</div><div class="metric-value">${num(adopted,4)}</div></div></div><div class="divider"></div><div class="form-grid">${field("Substituição manual",`overrides.factors.${key}`,isFiniteNumber(ov[key])?ov[key]:"",{type:"number",span:12,step:.0001,placeholder:"vazio = automático"})}${textareaField("Justificativa",`overrides.factorJustifications.${key}`,j[key],{span:12})}</div><div class="step-source">Fonte: ${source}</div></div>`;document.getElementById("page-factors").innerHTML=pageHead("Fatores SICRO","Fatores aplicados ao canteiro principal e herdados pelas obras complementares e instalações industriais.",`<button class="btn" id="btnResetFactors">Restaurar automáticos</button><button class="btn primary" data-go="areas">Áreas →</button>`)+`<div class="grid cols-3">${factorCard("k1","k1 — padrão",c.autoFactors.k1,c.factors.k1,SICRO_RULES.sources.k1,patternLabel(p.work.constructionPattern))}${factorCard("k2","k2 — mobiliário",c.autoFactors.k2,c.factors.k2,SICRO_RULES.sources.k2,`${natureLabel(p.work.nature)} · ${porteLabel(c.classification.porte)}`)}${factorCard("k3","k3 — distância",c.autoFactors.k3,c.factors.k3,SICRO_RULES.sources.k3,`${num(p.work.supplierDistance)} km · ${pavementLabel(p.work.pavement)}`)}</div><div class="grid cols-4 section">${metric("FEAD",pct(SICRO_RULES.fead),"Áreas descobertas")}${metric("FEAT conservação",pct(SICRO_RULES.feat.road_conservation),"Equação 16")}${metric("FEAT intervenção",pct(SICRO_RULES.feat.point),"Equação 17")}${metric("Vida útil dos contêineres",num(p.containerLibrary.lifeMonths,0)+" meses","Referência = 120 meses")}</div><div class="card section"><div class="card-title">RCT do canteiro principal</div><div class="form-grid">${field("RCT automático (%)","_autoRct",c.autoRct?c.autoRct*100:"",{type:"number",span:3,readonly:true})}${field("RCT adotado (%)","_rctPercent",c.rct?c.rct*100:"",{type:"number",span:3,min:.01,max:100,step:.01})}${textareaField("Justificativa",`overrides.factorJustifications.rct`,j.rct,{span:6})}</div></div>`;}

function renderAreas(c){const rows=c.rows;document.getElementById("page-areas").innerHTML=pageHead("Áreas do canteiro principal","Equações 1 a 11 e áreas de referência da obra principal.",`<button class="btn" id="btnResetAreas">Restaurar áreas</button><button class="btn primary" data-go="complementaries">Complementares →</button>`)+(!c.fixedSupported?`<div class="alert info"><span class="alert-icon">i</span><div>Para canteiros móveis, ferroviários ou hidroviários, consulte também as abas específicas. No modo ferroviário fixo, as áreas abaixo integram a aplicação assistida da Equação 15 após definição do RCT e das áreas adicionais.</div></div>`:"")+`<div class="table-wrap"><table><thead><tr><th>Instalação</th><th>Regra / fonte</th><th class="num">Referência</th><th class="num">Adotada</th><th class="num">FEAC</th><th class="num">Equivalente</th><th>Justificativa</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.label)}</strong>${r.hasOverride?`<div>${badge("Alterada","warn")}</div>`:""}</td><td><div class="small-text">${esc(r.formula)}</div><div class="code-ref">${esc(r.source)}</div></td><td class="num">${num(r.baseValue)}</td><td class="num"><input class="table-input area-input" data-area-key="${r.key}" type="number" min="0" step=".01" value="${esc(r.adopted)}"></td><td class="num">${pct(r.feac)}</td><td class="num strong">${num(r.equivalent)}</td><td><input class="justify-input area-just" data-area-just-key="${r.key}" value="${esc(r.justification)}" placeholder="Justifique alterações"></td></tr>`).join("")}</tbody><tfoot><tr><td colspan="2"><strong>Totais</strong></td><td class="num">${num(rows.reduce((s,r)=>s+r.baseValue,0))}</td><td class="num"><strong>${num(c.ac)}</strong></td><td></td><td class="num"><strong>${num(c.eq)}</strong></td><td></td></tr></tfoot></table></div><div class="grid cols-4 section">${metric("AC",num(c.ac)+" m²","Área coberta")}${metric("RCT",c.rct>0?pct(c.rct):"—","Relação coberta/total")}${metric("AT",c.rct>0?num(c.at)+" m²":"—","Equação 8")}${metric("AD",c.rct>0?num(c.ad)+" m²":"—","Equação 9")}</div>`;}

function complementaryModeInput(i,key,s){const base=`complementaries.${i}.areaSettings.${key}`;const mode=miniSelect(`${base}.mode`,s.mode,[["full","Integral"],["percent","Percentual"],["suppress","Suprimir/compartilhar"],["manual","Área manual"]]);const value=s.mode==="percent"?smallInput(`${base}.percent`,s.percent,{step:".01"}):s.mode==="manual"?smallInput(`${base}.manual`,s.manual,{step:".01"}):"—";return {mode,value};}
function renderComplementaries(c){const p=state.project;const body=c.complementaries.length?c.complementaries.map((x,i)=>{const raw=p.complementaries.find(z=>z.id===x.id)||p.complementaries[i];return `<details class="card complement-card" open><summary><span><strong>${esc(x.name)}</strong> · ${esc(porteLabel(x.classification.porte))}</span><span>${!x.enabled?badge("Desativado","gray"):x.supported?badge(money(x.cost),"ok"):badge("Revisar","warn")}</span></summary><div class="mt-2"><div class="form-grid">${checkboxField("Incluir no orçamento",`complementaries.${i}.enabled`,raw.enabled!==false,{span:3})}${field("Nome",`complementaries.${i}.name`,raw.name,{span:3})}${selectField("Natureza",`complementaries.${i}.nature`,raw.nature,COMPLEMENTARY_NATURE_OPTIONS,{span:3})}${field(raw.nature.startsWith("oae_")?"Extensão (m)":"Extensão (km)",`complementaries.${i}.extension`,raw.extension,{type:"number",span:3,min:0,step:.01})}${field("Prazo (meses)",`complementaries.${i}.months`,raw.months,{type:"number",span:3,min:1,step:1})}${selectField("Padrão",`complementaries.${i}.constructionPattern`,raw.constructionPattern,[["inherit","Herdar do principal"],["provisional","Provisório"],["permanent","Permanente"]],{span:3})}${selectField("Acesso",`complementaries.${i}.pavement`,raw.pavement,[["inherit","Herdar do principal"],["natural","Leito natural"],["primary","Revestimento primário"],["paved","Pavimentado"]],{span:3})}${field("Distância própria (km)",`complementaries.${i}.supplierDistance`,raw.supplierDistance,{type:"number",span:3,min:0,step:.01,placeholder:"vazio = principal"})}</div><div class="page-actions" style="justify-content:flex-start"><button class="btn small" data-comp-template="demo50" data-comp-index="${i}">Modelo demonstrativo 50%</button><button class="btn small" data-comp-template="integral" data-comp-index="${i}">Instalações fixas integrais</button><button class="btn small danger" data-remove-comp="${i}">Excluir</button></div><div class="grid cols-4 mt-1">${metric("Porte",porteLabel(x.classification.porte),x.classification.productivity!=null?`${num(x.classification.productivity)} ${x.classification.unit}`:"")}${metric("AC complementar",num(x.ac)+" m²","Após decisões")}${metric("Área equivalente",num(x.eq)+" m²","Σ ACi × FEACi")}${metric("CCOC",x.supported?money(x.cost):"—","Equação 15",x.supported?"ok":"")}</div><div class="alert info mt-2"><span class="alert-icon">i</span><div>As áreas variáveis iniciam suprimidas por pressupor que a mão de obra complementar foi incorporada ao dimensionamento principal. A decisão deve ser revista e justificada.</div></div><div class="table-wrap mt-1"><table><thead><tr><th>Instalação</th><th class="num">Área principal</th><th class="num">Referência complementar</th><th>Decisão</th><th>Valor</th><th class="num">Adotada</th><th class="num">FEAC</th><th>Justificativa</th></tr></thead><tbody>${x.rows.map(r=>{const ui=complementaryModeInput(i,r.key,r.setting);const mainRow=c.rows.find(z=>z.key===r.key);return `<tr><td><strong>${esc(r.label)}</strong></td><td class="num">${num(mainRow?.adopted||0)}</td><td class="num">${num(r.baseValue)}</td><td>${ui.mode}</td><td>${ui.value}</td><td class="num strong">${num(r.adopted)}</td><td class="num">${pct(r.feac)}</td><td>${smallInput(`complementaries.${i}.areaSettings.${r.key}.justification`,r.setting.justification,{type:"text",step:"",min:"",placeholder:"Fundamentação técnica"})}</td></tr>`;}).join("")}</tbody></table></div>${x.warnings.length?`<div class="alert warn mt-2"><span class="alert-icon">△</span><div>${x.warnings.map(esc).join("<br>")}</div></div>`:""}</div></details>`;}).join(""):`<div class="empty card">Nenhuma obra complementar cadastrada.</div>`;document.getElementById("page-complementaries").innerHTML=pageHead("Obras complementares","Matriz de sobreposição, compartilhamento, supressão e complementação das instalações.",`<button class="btn" id="btnAddComplement">＋ Adicionar complementar</button><button class="btn primary" data-go="mobile">Canteiros móveis →</button>`)+`<div class="grid cols-4">${metric("Complementares",c.complementaries.filter(x=>x.enabled).length,"Ativas")}${metric("Custo complementar",money(c.complementaryCost),"Somatório dos CCOC")}${metric("Custo principal",c.mainCost!=null?money(c.mainCost):"—","Sem complementares")}${metric("Principal + complementares",c.mainCost!=null?money((c.mainCost||0)+c.complementaryCost):"—","Antes do CII","ok")}</div><div class="section">${body}</div>`;}

function renderContainerLibrary(){const p=state.project;const rows=Object.entries(SICRO_RULES.containers);document.getElementById("page-containers").innerHTML=pageHead("Biblioteca de contêineres","Preços locais editáveis utilizados nos canteiros móveis e nas instalações industriais.",`<button class="btn" id="btnResetContainerPrices">Restaurar referências</button><button class="btn primary" data-go="mobile">Usar no canteiro móvel →</button>`)+`<div class="alert info"><span class="alert-icon">i</span><div>Os preços de julho/2023 reproduzem o Caderno de Aplicação. O M0066 não teve preço informado nos arquivos fornecidos e deve ser preenchido pelo usuário para calcular a conservação rodoviária.</div></div><div class="card"><div class="form-grid">${field("Vida útil adotada (meses)","containerLibrary.lifeMonths",p.containerLibrary.lifeMonths,{type:"number",span:3,min:1,step:1,hint:"Referência = 120 meses"})}${field("Mês-base do projeto","meta.baseMonth",p.meta.baseMonth,{type:"month",span:3})}</div></div><div class="table-wrap section"><table><thead><tr><th>Código</th><th>Descrição</th><th class="num">Área</th><th class="num">Preço de referência</th><th class="num">Preço adotado</th><th>Fonte</th><th>Justificativa</th></tr></thead><tbody>${rows.map(([code,d])=>`<tr><td><span class="code-ref">${code}</span></td><td>${esc(d.description)}<div class="small-text muted">${esc(d.teu)}</div></td><td class="num">${num(d.area)} m²</td><td class="num">${sourceCostLabel(d)}</td><td class="num">${smallInput(`containerLibrary.prices.${code}`,isFiniteNumber(p.containerLibrary.prices?.[code])?p.containerLibrary.prices[code]:"",{step:".000001",placeholder:"informar"})}</td><td class="small-text">${esc(d.source)}</td><td>${smallInput(`containerLibrary.justifications.${code}`,p.containerLibrary.justifications?.[code]||"",{type:"text",step:"",min:"",placeholder:"Mudança ou fonte local"})}</td></tr>`).join("")}</tbody></table></div>`;}

function pointCriterion(id,l,p){const map={office:`1 escritório para até 2 pessoas da NPF-V`,technical:`ceil(max(NPF-V − 2, 0) / 3)`,meal:`ceil(50% × NMAX / 48)`,kitchen:`1 unidade quando há refeitório`,lodging:`ceil(50% × (NMO + NPV) / 6)`,sanitary:`ceil((NMO + NPV) / 20)`,residence:`ceil(NPF-V / 3)`,ambulatory:`ceil((0,25 × NMAX) / 14,86)`,guard:`1 unidade`,warehouse:`Decisão do orçamentista`,cement:`Previsão de sacos de cimento`,workshop:`Manutenção de veículos/equipamentos`,laboratory:`Programa de controle tecnológico`};return map[id]||"";}
function renderPointMobile(c){const p=state.project,m=c.mobile;return `<div class="card"><div class="card-title">Configuração da intervenção pontual</div><div class="form-grid">${selectField("Modelo inicial","mobile.pointTemplate",p.mobile.pointTemplate,[["auto","Critérios automáticos + decisões do orçamentista"],["official","Exemplo oficial do Caderno"],["module1","Módulo demonstrativo 1"],["module2","Módulo demonstrativo 2"],["module3","Módulo demonstrativo 3"],["custom","Personalizado a partir dos critérios automáticos"]],{span:6})}${checkboxField("Prever alojamento","mobile.pointIncludeLodging",p.mobile.pointIncludeLodging,{span:3})}${checkboxField("Prever residências","mobile.pointIncludeResidence",p.mobile.pointIncludeResidence,{span:3})}</div>${["auto","custom"].includes(p.mobile.pointTemplate)?`<div class="divider"></div><div class="form-grid">${field("Almoxarifado — contêineres","mobile.pointDiscretionary.warehouse",p.mobile.pointDiscretionary.warehouse,{type:"number",span:3,min:0,step:1})}${field("Depósito de cimento","mobile.pointDiscretionary.cement",p.mobile.pointDiscretionary.cement,{type:"number",span:3,min:0,step:1})}${field("Oficina","mobile.pointDiscretionary.workshop",p.mobile.pointDiscretionary.workshop,{type:"number",span:3,min:0,step:1})}${field("Laboratórios","mobile.pointDiscretionary.laboratory",p.mobile.pointDiscretionary.laboratory,{type:"number",span:3,min:0,step:1})}</div>`:""}</div><div class="grid cols-4 section">${metric("AC em contêineres",num(m.aggregate.area)+" m²","Somatório")}${metric("AT",num(m.at)+" m²",`RCT = ${pct(m.rct)}`)}${metric("Custo dos contêineres",m.aggregate.missing.length?"Pendente":money(m.aggregate.total),"Σ QCi × CCi")}${metric("CIP",m.cost==null?"—":money(m.cost),"Equação 17",m.complete?"ok":"")}</div><div class="table-wrap section"><table><thead><tr><th>Instalação</th><th>Critério</th><th>Código</th><th class="num">Base</th><th class="num">Adotada</th><th class="num">Área</th><th class="num">Custo integral</th><th>Justificativa</th></tr></thead><tbody>${m.rows.map(r=>`<tr><td><strong>${esc(r.label)}</strong><div class="small-text">${esc(r.capacity)}</div></td><td class="small-text">${esc(pointCriterion(r.id,c.labor,p))}</td><td><span class="code-ref">${r.code}</span></td><td class="num">${num(r.baseQty,0)}</td><td class="num">${smallInput(`mobile.pointOverrides.${r.id}`,isFiniteNumber(p.mobile.pointOverrides?.[r.id])?p.mobile.pointOverrides[r.id]:r.qty,{step:"1"})}</td><td class="num">${num(r.area)} m²</td><td class="num">${getContainerPrice(p,r.code)==null?"—":money(r.qty*getContainerPrice(p,r.code))}</td><td>${smallInput(`mobile.pointJustifications.${r.id}`,r.justification,{type:"text",step:"",min:"",placeholder:"Se alterada"})}</td></tr>`).join("")}</tbody></table></div><div class="card section"><div class="card-title">Equação 17 — Errata 1 incorporada</div><div class="formula">CIP = P/n × (k2 × Σ QCi × CCi) + AT × FEAT × CMCC</div><div class="formula mt-1">CIP = ${num(m.months,0)}/${num(m.life,0)} × (${num(m.k2,2)} × ${money(m.aggregate.total)}) + ${num(m.at)} × ${pct(m.feat)} × ${money(m.cmcc)} = ${m.cost==null?"Pendente":money(m.cost)}</div></div>`;}
function renderConservationMobile(c){const p=state.project,m=c.mobile;return `<div class="card"><div class="card-title">Canteiro-tipo de conservação rodoviária</div><div class="card-sub">Configuração da Tabela 21, referenciada para 200 km de faixas de rolamento.</div><div class="form-grid">${field("Extensão de faixas (km)","work.conservationLaneKm",p.work.conservationLaneKm,{type:"number",span:4,min:0,step:.01})}${field("Coeficiente CP","_cp",m.cp,{type:"number",span:4,readonly:true,step:.0001})}${field("Prazo do canteiro (meses)","_months",m.months,{type:"number",span:4,readonly:true})}</div></div><div class="grid cols-4 section">${metric("AC",num(m.aggregate.area)+" m²","Contêineres")}${metric("AT",num(m.at)+" m²",`RCT = ${pct(m.rct)}`)}${metric("Custo dos contêineres",m.aggregate.missing.length?"Pendente":money(m.aggregate.total),"Configuração de referência")}${metric("CCR",m.cost==null?"—":money(m.cost),"Equação 16",m.complete?"ok":"")}</div><div class="table-wrap section"><table><thead><tr><th>Instalação</th><th>Código</th><th class="num">Base</th><th class="num">Adotada</th><th class="num">Área</th><th class="num">Preço unitário</th><th class="num">Custo integral</th><th>Justificativa</th></tr></thead><tbody>${m.rows.map(r=>`<tr><td>${esc(r.label)}</td><td><span class="code-ref">${r.code}</span></td><td class="num">${num(r.baseQty,0)}</td><td class="num">${smallInput(`mobile.conservationOverrides.${r.id}`,isFiniteNumber(p.mobile.conservationOverrides?.[r.id])?p.mobile.conservationOverrides[r.id]:r.qty,{step:"1"})}</td><td class="num">${num(r.area)} m²</td><td class="num">${getContainerPrice(p,r.code)==null?badge("Preço pendente","warn"):money(getContainerPrice(p,r.code))}</td><td class="num">${getContainerPrice(p,r.code)==null?"—":money(r.qty*getContainerPrice(p,r.code))}</td><td>${smallInput(`mobile.conservationJustifications.${r.id}`,r.justification,{type:"text",step:"",min:"",placeholder:"Se alterada"})}</td></tr>`).join("")}</tbody></table></div><div class="card section"><div class="card-title">Equação 16</div><div class="formula">CCR = [P/n × (k2 × Σ QCi × CCi) + AT × FEAT × CMCC] × CP</div><div class="formula mt-1">CCR = [${num(m.months,0)}/${num(m.life,0)} × (${num(m.k2,2)} × ${money(m.aggregate.total)}) + ${num(m.at)} × ${pct(m.feat)} × ${money(m.cmcc)}] × ${num(m.cp,4)} = ${m.cost==null?"Pendente":money(m.cost)}</div></div>`;}

function industrialDetail(i,x,p,c){const raw=p.industrials[i];return `<details class="card industrial-card" open><summary><span><strong>${esc(x.def.label)}</strong> · ${x.quantity} un</span><span>${!x.enabled?badge("Desativada","gray"):x.complete?badge(money(x.total),"ok"):badge(money(x.total)+" · pendente","warn")}</span></summary><div class="mt-2"><div class="form-grid">${checkboxField("Incluir",`industrials.${i}.enabled`,raw.enabled!==false,{span:2})}${selectField("Tipo",`industrials.${i}.type`,raw.type,Object.keys(SICRO_RULES.industrialTypes).map(k=>[k,SICRO_RULES.industrialTypes[k].label]),{span:4})}${field("Quantidade",`industrials.${i}.quantity`,raw.quantity,{type:"number",span:2,min:0,step:1})}${field("Prazo próprio (meses)",`industrials.${i}.durationMonths`,raw.durationMonths,{type:"number",span:2,min:0,step:1,placeholder:"vazio = obra"})}${field("Custo da composição CDI (R$)",`industrials.${i}.cdi`,raw.cdi,{type:"number",span:2,min:0,step:.01})}${textareaField("Fonte/observação do CDI",`industrials.${i}.cdiSource`,raw.cdiSource,{span:9})}<div class="field span-3"><label class="field-label">Composição SICRO</label><input value="${esc(x.def.composition)}" readonly><span class="hint">${esc(x.def.compositionLabel)}</span></div></div><div class="page-actions" style="justify-content:flex-start"><button class="btn small danger" data-remove-industrial="${i}">Excluir instalação</button></div><div class="grid cols-4 mt-1">${metric("Área equivalente",num(x.eq)+" m²",x.def.mode==="container"?"Não aplicada na Equação 14":"Parcela in loco")}${metric("Parcela in loco",money(x.areaPart),"k1 × k2 × k3 × área eq. × CMCC")}${metric("Parcela contêiner",money(x.containerPart),"k2 × P/n × ΣQCiCCi")}${metric("CII da instalação",money(x.total),`Composição ${x.def.composition}`,x.complete?"ok":"")}</div><div class="grid cols-2 section"><div><div class="card-title">Áreas montadas in loco</div>${x.inSitu.length?`<div class="table-wrap"><table><thead><tr><th>Instalação</th><th class="num">Referência</th><th class="num">Adotada</th><th class="num">FEAC</th><th class="num">Equivalente</th><th>Justificativa</th></tr></thead><tbody>${x.inSitu.map(r=>`<tr><td>${esc(r.label)}</td><td class="num">${num(r.baseArea)}</td><td class="num">${smallInput(`industrials.${i}.areaOverrides.${r.id}`,isFiniteNumber(raw.areaOverrides?.[r.id])?raw.areaOverrides[r.id]:r.adoptedArea,{step:".01"})}</td><td class="num">${pct(r.feac)}</td><td class="num">${num(r.equivalentDisplay)}</td><td>${smallInput(`industrials.${i}.areaJustifications.${r.id}`,r.justification,{type:"text",step:"",min:""})}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Instalação exclusivamente em contêineres: aplica-se a Equação 14.</div>`}</div><div><div class="card-title">Contêineres</div>${x.containers.length?`<div class="table-wrap"><table><thead><tr><th>Instalação</th><th>Código</th><th class="num">Base</th><th class="num">Adotada</th><th class="num">Custo integral</th><th>Justificativa</th></tr></thead><tbody>${x.containers.map(r=>`<tr><td>${esc(r.label)}</td><td><span class="code-ref">${r.container}</span></td><td class="num">${num(r.baseQty,0)}</td><td class="num">${smallInput(`industrials.${i}.containerOverrides.${r.id}`,isFiniteNumber(raw.containerOverrides?.[r.id])?raw.containerOverrides[r.id]:r.qty,{step:"1"})}</td><td class="num">${getContainerPrice(p,r.container)==null?"—":money(r.qty*getContainerPrice(p,r.container))}</td><td>${smallInput(`industrials.${i}.containerJustifications.${r.id}`,r.justification,{type:"text",step:"",min:""})}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Sem contêineres previstos.</div>`}</div></div><div class="card section flat"><div class="formula">${x.def.mode==="container"?"Equação 14":"Equação 13"}: CII = ${money(x.areaPart)} + ${money(x.containerPart)} + ${money(x.cdi)} = ${money(x.unitCost)} por unidade</div></div>${x.warnings.length?`<div class="alert warn mt-2"><span class="alert-icon">△</span><div>${x.warnings.map(esc).join("<br>")}</div></div>`:""}</div></details>`;}
function renderIndustrials(c){const p=state.project;document.getElementById("page-industrials").innerHTML=pageHead("Instalações industriais","Tipos I a VII, áreas da Tabela 38, contêineres da Tabela 39 e composições da Tabela 40.",`<select id="newIndustrialType" class="compact-select">${Object.keys(SICRO_RULES.industrialTypes).map(k=>`<option value="${k}">${esc(SICRO_RULES.industrialTypes[k].label)}</option>`).join("")}</select><button class="btn" id="btnAddIndustrial">＋ Adicionar</button><button class="btn primary" data-go="advanced">Etapa 6 →</button>`)+`<div class="grid cols-4">${metric("Instalações",c.industrials.filter(x=>x.enabled).length,"Ativas")}${metric("CII total",money(c.cii),"Somatório")}${metric("CMCC",money(c.cmcc)+"/m²","Parcela in loco")}${metric("Vida dos contêineres",num(p.containerLibrary.lifeMonths,0)+" meses","Parcela depreciada")}</div><div class="alert info section"><span class="alert-icon">i</span><div>Os custos das áreas descobertas, bases, rampas e montagens devem ser apropriados no campo CDI pela composição SICRO correspondente. FEAD e FEAT não são aplicados às áreas descobertas industriais.</div></div><div class="section">${c.industrials.length?c.industrials.map((x,i)=>industrialDetail(i,x,p,c)).join(""):`<div class="empty card">Nenhuma instalação industrial cadastrada.</div>`}</div>`;}


function renderRailway(c){const p=state.project,r=c.railway,raw=p.railway;if(!r)return `<div class="empty card">Selecione “Construção ferroviária” para ativar este módulo.</div>`;if(r.mode==="fixed")return `<div class="alert info"><span class="alert-icon">i</span><div>O Manual admite canteiro ferroviário fixo adaptado aos modelos rodoviários. Defina áreas adicionais e RCT nas abas “Áreas” e “Fatores”.</div></div><div class="card"><div class="form-grid">${selectField("Padrão do canteiro ferroviário","railway.mode",raw.mode,[["mobile","Móvel — vagões e contêiner"],["fixed","Fixo adaptado"]],{span:6})}${textareaField("Fundamentação do canteiro fixo","railway.fixedJustification",raw.fixedJustification,{span:6})}</div></div><div class="grid cols-4 section">${metric("AC",num(r.ac)+" m²","Equações 1 a 7 + áreas adotadas")}${metric("RCT",r.rct?pct(r.rct):"—","Entrada necessária")}${metric("Área equivalente",num(r.eq)+" m²","Equação 11")}${metric("Custo ferroviário",r.cost==null?"—":money(r.cost),"Equação 15 assistida",r.complete?"ok":"")}</div><div class="page-actions"><button class="btn" data-go="areas">Editar áreas</button><button class="btn primary" data-go="factors">Editar fatores e RCT</button></div>`;

function testAdd(tests,group,name,expected,actual,tol=.011){const pass=typeof expected==="string"?String(actual)===expected:Math.abs(Number(actual)-Number(expected))<=tol;tests.push({group,name,expected,actual,pass});}
function runOfficialTests(updateState=true){const tests=[];const r=calculate(officialProject());testAdd(tests,"Rodoviário principal","Porte","medium",r.classification.porte,0);testAdd(tests,"Rodoviário principal","NMO",252,r.labor.nmo);testAdd(tests,"Rodoviário principal","NPV",36,r.labor.npv);testAdd(tests,"Rodoviário principal","NFA",191,r.labor.nfa);testAdd(tests,"Rodoviário principal","NMAX",335,r.labor.nmax);testAdd(tests,"Rodoviário principal","AC",2415.50,r.ac);testAdd(tests,"Rodoviário principal","Área equivalente",1527.32,r.eq);testAdd(tests,"Rodoviário principal","AT",6038.75,r.at);testAdd(tests,"Rodoviário principal","AD",3623.25,r.ad);testAdd(tests,"Rodoviário principal","CCOP",2943514.03,r.baseCost);const co=r.complementaries[0];testAdd(tests,"OAE complementar","Porte","medium",co.classification.porte,0);testAdd(tests,"OAE complementar","AC",261.47,co.ac);testAdd(tests,"OAE complementar","Área equivalente",133.99,co.eq);testAdd(tests,"OAE complementar","AT",747.06,co.at);testAdd(tests,"OAE complementar","AD",485.59,co.ad);testAdd(tests,"OAE complementar","CCOC",272326.97,co.cost);const iv=r.industrials.find(x=>x.type==="IV"),v=r.industrials.find(x=>x.type==="V"),vii=r.industrials.find(x=>x.type==="VII");testAdd(tests,"Instalações industriais","Central de britagem",116490.48,iv.total);testAdd(tests,"Instalações industriais","Usina de solos",137895.12,v.total);testAdd(tests,"Instalações industriais","Área equivalente usina de asfalto",141.45,vii.eq);testAdd(tests,"Instalações industriais","Usina de asfalto",431006.42,vii.total);testAdd(tests,"Instalações industriais","CII",685392.02,r.cii);testAdd(tests,"Consolidação rodoviária","CCO total",3901233.02,r.grandTotal);const q=calculate(officialPointProject());testAdd(tests,"Intervenção pontual","NMO",56,q.labor.nmo);testAdd(tests,"Intervenção pontual","NPV",3,q.labor.npv);testAdd(tests,"Intervenção pontual","NPF-V",7.25,q.labor.npfv);testAdd(tests,"Intervenção pontual","NMAX",67,q.labor.nmax);testAdd(tests,"Intervenção pontual","k2",1.13,q.mobile.k2,.00001);testAdd(tests,"Intervenção pontual","AC",260.06,q.mobile.aggregate.area);testAdd(tests,"Intervenção pontual","AT",1111.37,q.mobile.at);testAdd(tests,"Intervenção pontual","Custo integral dos contêineres",1056619.83,q.mobile.aggregate.total);testAdd(tests,"Intervenção pontual","CIP",150898.23,q.mobile.cost);const rail=blankProject();rail.work.nature="railway_construction";rail.work.extension=25;rail.work.campMonths=12;const rc=calculate(rail);testAdd(tests,"Etapa 6 — ferroviário","Porte","medium",rc.classification.porte,0);testAdd(tests,"Etapa 6 — ferroviário","Total de vagões",26,rc.railway.totalWagons,0);testAdd(tests,"Etapa 6 — ferroviário","Vagões fechados",23,rc.railway.totals.closed,0);const it=blankProject();it.work.cmcc=1000;it.itinerant.enabled=true;it.itinerant.teamCount=2;it.itinerant.months=3;it.itinerant.distanceToFront=300;const ic=calculate(it);testAdd(tests,"Etapa 6 — itinerante","Efs",6,ic.itinerant.efs);testAdd(tests,"Etapa 6 — itinerante","CCI",2100,ic.itinerant.cost);const hy=blankProject();hy.work.nature="hydro";hy.hydro.confirmed=true;hy.hydro.supportRows[0].quantity=2;hy.hydro.supportRows[0].unitPrice=5000;const hc=calculate(hy);testAdd(tests,"Etapa 6 — hidroviário","Apoio náutico",10000,hc.hydro.cost);const tl=blankProject();const tc=calculate(tl);testAdd(tests,"Etapa 7 — biblioteca","Projetos-tipo nativos",6,tc.tomo.templates.length,0);testAdd(tests,"Etapa 7 — biblioteca","M0059 vinculado",getContainerPrice(tl,"M0059"),tc.tomo.templates.find(x=>x.id==="tpl_ind_IV").services.find(s=>s.linkedContainer==="M0059").price,.001);if(updateState){state.tests=tests;state.testScore=Math.round(100*tests.filter(t=>t.pass).length/tests.length);}return tests;}

function renderValidation(){const tests=runOfficialTests(true),pass=tests.filter(t=>t.pass).length,groups=[...new Set(tests.map(t=>t.group))].map(g=>({g,total:tests.filter(t=>t.group===g).length,pass:tests.filter(t=>t.group===g&&t.pass).length}));document.getElementById("page-validation").innerHTML=pageHead("Autotestes SICRO","Regressão dos exemplos oficiais e verificações estruturais das Etapas 6 e 7.",`<button class="btn" id="btnRunTests">↻ Executar</button><button class="btn" id="btnLoadRoadOfficial">Carregar rodoviário</button><button class="btn primary" id="btnLoadPointOfficial">Carregar intervenção</button>`)+`<div class="grid cols-2"><div class="card"><div class="test-summary"><div class="score-ring" style="--score:${state.testScore}%"><span>${state.testScore}%</span></div><div><div class="card-title">${pass===tests.length?"Todos os testes aprovados":"Divergências encontradas"}</div><div class="card-sub mb-0">${pass} de ${tests.length} verificações.</div></div></div></div><div class="card"><div class="card-title">Cobertura</div>${groups.map(x=>`<div class="kv"><div class="k">${esc(x.g)}</div><div class="v">${x.pass}/${x.total} ${x.pass===x.total?badge("Aprovado","ok"):badge("Revisar","danger")}</div></div>`).join("")}</div></div><div class="alert info section"><span class="alert-icon">i</span><div>Os valores oficiais das Etapas 1 a 7 permanecem preservados. Os testes das Etapas 6 e 7 verificam quantidades ferroviárias, Equação 12, somatório hidroviário e vínculo da biblioteca analítica.</div></div><div class="table-wrap"><table><thead><tr><th>Grupo</th><th>Verificação</th><th class="num">Esperado</th><th class="num">Calculado</th><th class="num">Diferença</th><th>Status</th></tr></thead><tbody>${tests.map(t=>{const numeric=typeof t.expected!=="string",diff=numeric?Number(t.actual)-Number(t.expected):"";return `<tr><td>${esc(t.group)}</td><td>${esc(t.name)}</td><td class="num">${numeric?num(t.expected,2):esc(t.expected)}</td><td class="num">${numeric?num(t.actual,2):esc(t.actual)}</td><td class="num">${numeric?num(diff,4):"—"}</td><td>${t.pass?badge("Aprovado","ok"):badge("Reprovado","danger")}</td></tr>`;}).join("")}</tbody></table></div>`;}

function renderProjects(){const p=state.project;document.getElementById("page-projects").innerHTML=pageHead("Projetos e backup","Gerencie projetos, dados analíticos e arquivos visuais no IndexedDB.",`<button class="btn" id="btnImport">Importar JSON</button><button class="btn primary" id="btnNewProject2">＋ Novo projeto</button>`)+`<div class="grid cols-2"><div class="card"><div class="card-title">Projetos armazenados</div><div class="project-list">${state.projects.length?state.projects.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).map(x=>`<div class="project-item ${x.id===p.id?"current":""}"><div><div class="project-name">${esc(x.name)}</div><div class="project-small">${dateTime(x.updatedAt)} · ${esc(natureLabel(x.work?.nature))}</div></div><div class="project-actions"><button class="btn small" data-load-project="${esc(x.id)}">Abrir</button><button class="btn small" data-duplicate-project="${esc(x.id)}">Duplicar</button><button class="btn small danger" data-delete-project="${esc(x.id)}">Excluir</button></div></div>`).join(""):"<div class='empty'>Nenhum projeto.</div>"}</div></div><div class="grid"><div class="card"><div class="card-title">Backup</div><div class="card-sub">Os arquivos visuais do projeto são incorporados ao JSON em formato data URL.</div><div class="page-actions" style="justify-content:flex-start"><button class="btn" id="btnExportCurrent">Exportar atual</button><button class="btn" id="btnExportAll">Backup completo</button><button class="btn" id="btnImport2">Restaurar</button></div></div><div class="card"><div class="card-title">Armazenamento</div><div class="kv"><div class="k">Tecnologia</div><div class="v">${state.storageMode==="idb"?"IndexedDB":state.storageMode}</div></div><div class="kv"><div class="k">Projetos</div><div class="v">${state.projects.length}</div></div><div class="kv"><div class="k">Arquivos do projeto atual</div><div class="v">${state.assets.length}</div></div><button class="btn success mt-2" id="btnStorageTest">Testar</button></div></div></div><input type="file" id="fileImport" accept="application/json,.json" class="hidden">`;}

function renderHelp(){document.getElementById("page-help").innerHTML=pageHead("Ajuda e escopo","Guia resumido das funcionalidades implementadas até a Etapa 7.",`<button class="btn primary" data-go="project">Iniciar cálculo</button>`)+`<div class="alert info"><span class="alert-icon">i</span><div><strong>Versão 3.0 — Etapas 1 a 7.</strong> O sistema permanece integralmente local, em arquivo HTML único, e não elimina a análise de engenharia.</div></div><div class="grid cols-2"><div class="card"><div class="card-title">Fluxo recomendado</div><div class="steps"><div class="step"><div class="step-title">1 a 5. Núcleo metodológico</div><div class="muted small-text">Dados, classificação, mão de obra, áreas, complementares, móveis e instalações industriais.</div></div><div class="step"><div class="step-title">6. Modais especiais</div><div class="muted small-text">Escolha o padrão ferroviário, dimensione apoio hidroviário e avalie o canteiro itinerante.</div></div><div class="step"><div class="step-title">7. Projetos-tipo e Tomos</div><div class="muted small-text">Anexe pranchas, importe serviços/quantidades, forme orçamento analítico e compare com o método simplificado.</div></div></div></div><div class="card"><div class="card-title">Limitações documentais preservadas</div><div class="steps"><div class="step"><div class="step-title">Tomo 1 e Tomo 2 não anexados</div><div class="muted small-text">A aplicação contém a estrutura completa de importação, mas não inventa pranchas ou quantitativos ausentes.</div></div><div class="step"><div class="step-title">Ferroviário móvel</div><div class="muted small-text">O Manual fornece quantidades e dimensões; preços, vida útil e FEAT devem ser informados.</div></div><div class="step"><div class="step-title">Hidroviário</div><div class="muted small-text">Não há canteiro-tipo padronizado. O orçamento é específico, com composições de apoio náutico e itens do projeto.</div></div><div class="step"><div class="step-title">Inclusão analítica</div><div class="muted small-text">Projetos-tipo iniciam em modo comparação para evitar dupla contagem.</div></div></div></div></div><div class="card section"><div class="card-title">Perguntas frequentes</div><details open><summary>Como usar o canteiro ferroviário móvel?</summary><div>Revise as quantidades das Tabelas 26 e 27, informe preços e vida útil dos vagões, AT e FEAT. O sistema mantém o cálculo pendente enquanto faltarem parâmetros.</div></details><details><summary>Como calcular o canteiro itinerante?</summary><div>Informe Efs em equipe × mês, diretamente ou pelo produto entre equipes simultâneas e meses. A aplicação utiliza CCI = kCI × CMCC × Efs.</div></details><details><summary>Como integrar o Tomo 2?</summary><div>Na aba Projetos-tipo e Tomos, selecione um projeto e importe CSV ou JSON com código, descrição, unidade, quantidade e preço unitário.</div></details><details><summary>Os itens analíticos entram automaticamente no orçamento?</summary><div>Não. O padrão é apenas comparação. A inclusão exige seleção expressa e justificativa para controle de dupla contagem.</div></details></div><div class="alert warn section"><span class="alert-icon">△</span><div>Verifique edição, base SICRO, CMCC, preços, normas e condições locais. Parâmetros alterados permanecem sob responsabilidade técnica do usuário.</div></div>`;}

function renderAll(){if(!state.project)return;const c=calculate(state.project);document.getElementById("topProjectTitle").textContent=state.project.name;renderDashboard(c);renderProject(c);renderClassification(c);renderLabor(c);renderFactors(c);renderAreas(c);renderComplementaries(c);renderContainerLibrary();renderMobile(c);renderIndustrials(c);renderAdvanced(c);renderTomoLibrary(c);renderBudget(c);renderMemory(c);renderValidation();renderProjects();renderHelp();bindDynamicEvents();showPage(state.activePage,false);updateSaveIndicator();}


async function attachDrawingFile(file){const tpl=selectedTemplateRaw();if(!tpl)throw new Error("Selecione um projeto-tipo");if(file.size>12*1024*1024)throw new Error("Arquivo maior que 12 MB");const dataUrl=await readAsDataURL(file),a={id:uid(),projectId:state.project.id,templateId:tpl.id,name:file.name,mime:file.type||"application/octet-stream",size:file.size,dataUrl,createdAt:Date.now()};await Storage.putAsset(a);state.assets.push(a);tpl.assetIds=[...(tpl.assetIds||[]),a.id];markDirty();await saveCurrent(true);renderAll();}
async function deleteDrawingAsset(id){await Storage.deleteAsset(id);state.assets=state.assets.filter(a=>a.id!==id);state.project.tomoLibrary.templates.forEach(t=>t.assetIds=(t.assetIds||[]).filter(x=>x!==id));markDirty();renderAll();}
function openDrawingAsset(id){const a=state.assets.find(x=>x.id===id);if(!a)return;const body=a.mime.startsWith("image/")?`<div class="preview-shell"><img src="${a.dataUrl}" alt="${esc(a.name)}"></div>`:a.mime==="application/pdf"?`<div class="preview-shell" style="padding:0"><iframe src="${a.dataUrl}" title="${esc(a.name)}"></iframe></div>`:`<p>Visualização não disponível.</p>`;showModal(a.name,body,[{label:"Fechar"}]);}
async function importTomoRowsFile(file){const tpl=selectedTemplateRaw();if(!tpl)throw new Error("Selecione um projeto-tipo");const txt=await file.text();let rows;if(file.name.toLowerCase().endsWith(".json")){const j=JSON.parse(txt);rows=Array.isArray(j)?j:(Array.isArray(j.services)?j.services:[]);}else rows=parseCSV(txt);const services=rowsToServices(rows);if(!services.length)throw new Error("Nenhuma linha reconhecida");tpl.services.push(...services);markDirty();renderAll();toast(`${services.length} serviço(s) importado(s).`,"ok");}
