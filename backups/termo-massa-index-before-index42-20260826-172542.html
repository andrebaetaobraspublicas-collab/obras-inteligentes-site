  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"pt-BR\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>TermoMassa — Controle térmico de concreto massa<\u002Ftitle>\n<style>\n:root{\n  --paper:#eef1f5;\n  --card:#ffffff;\n  --card2:#f6f8fa;\n  --line:#dbe2e9;\n  --line2:#c2ccd6;\n  --txt:#17212b;\n  --txt2:#4d6070;\n  --txt3:#7d8fa0;\n  --ember:#c9560f;\n  --ember-l:#fdf1e8;\n  --cool:#0d7690;\n  --cool-l:#e9f4f7;\n  --ok:#1a7549;\n  --ok-l:#e9f5ee;\n  --warn:#a2740a;\n  --warn-l:#fdf6e4;\n  --bad:#bb3025;\n  --bad-l:#fdeceb;\n  --mono:ui-monospace,\"SF Mono\",\"Cascadia Mono\",\"Roboto Mono\",\"JetBrains Mono\",Consolas,monospace;\n  --sans:\"Inter\",\"Segoe UI\",-apple-system,BlinkMacSystemFont,Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --r:4px;\n  --sh:0 1px 2px rgba(23,33,43,.05);\n  --sh2:0 2px 8px rgba(23,33,43,.07);\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{-webkit-text-size-adjust:100%}\nbody{\n  background:var(--paper);color:var(--txt);font-family:var(--sans);\n  font-size:14px;line-height:1.5;min-height:100vh;\n  background-image:radial-gradient(ellipse 900px 480px at 12% -6%, rgba(201,86,15,.05), transparent 62%),\n                   radial-gradient(ellipse 760px 480px at 94% 4%, rgba(13,118,144,.05), transparent 60%);\n  background-attachment:fixed;\n}\nbutton,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}\nbutton{cursor:pointer;background:none;border:none}\na{color:var(--cool)}\n\n/* ---------- cabeçalho ---------- */\n.top{border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50}\n.top-in{max-width:1560px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}\n.brand{display:flex;align-items:baseline;gap:9px}\n.brand h1{font-size:19px;font-weight:800;letter-spacing:-.035em}\n.brand h1 span{color:var(--ember)}\n.brand .sub{font-family:var(--mono);font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.13em}\n.top-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}\n.btn{border:1px solid var(--line2);background:var(--card);border-radius:var(--r);padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--txt2);transition:.14s;white-space:nowrap;box-shadow:var(--sh)}\n.btn:hover{border-color:var(--ember);color:var(--ember);background:var(--ember-l)}\n.btn:focus-visible{outline:2px solid var(--ember);outline-offset:2px}\n.btn-p{background:var(--ember);border-color:var(--ember);color:#fff;font-weight:700}\n.btn-p:hover{background:#e0651a;border-color:#e0651a;color:#fff}\n.btn:disabled{opacity:.45;cursor:not-allowed}\n\n/* ---------- layout ---------- */\n.shell{max-width:1560px;margin:0 auto;padding:18px 20px 70px;display:grid;grid-template-columns:378px 1fr;gap:20px;align-items:start}\n@media(max-width:1150px){.shell{grid-template-columns:1fr}}\n.rail{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow-y:auto;padding-right:5px}\n@media(max-width:1150px){.rail{position:static;max-height:none}}\n.rail::-webkit-scrollbar{width:8px}\n.rail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}\n\n/* ---------- blocos ---------- */\n.card{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}\n.card-h{padding:9px 13px;border-bottom:1px solid var(--line);background:var(--card2);display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}\n.card-h .idx{font-family:var(--mono);font-size:10px;color:var(--ember);border:1px solid var(--ember);border-radius:3px;padding:1px 5px;letter-spacing:.05em;background:var(--ember-l)}\n.card-h h3{font-size:12.5px;font-weight:700;letter-spacing:.02em;flex:1}\n.card-h .chev{color:var(--txt3);font-size:11px;transition:.2s}\n.card.collapsed .chev{transform:rotate(-90deg)}\n.card.collapsed .card-b{display:none}\n.card-b{padding:13px}\n\n/* ---------- campos ---------- */\n.f{margin-bottom:11px}\n.f:last-child{margin-bottom:0}\n.f label{display:block;font-size:10.5px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}\n.f label .u{color:var(--txt3);font-weight:400;text-transform:none;letter-spacing:0}\n.f .hint{font-size:11px;color:var(--txt3);margin-top:4px;line-height:1.45}\ninput[type=number],input[type=text],input[type=date],select,textarea{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:7px 9px;font-family:var(--mono);font-size:13px;transition:.14s}\nselect{font-family:var(--sans);font-size:13px;cursor:pointer}\ninput:focus,select:focus,textarea:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 3px rgba(201,86,15,.13)}\ninput[readonly]{color:var(--txt3);background:var(--card2);cursor:not-allowed}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}\n.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt2);cursor:pointer;margin-bottom:6px}\n.chk input{width:14px;height:14px;accent-color:var(--ember);cursor:pointer}\n.auto{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--cool);font-family:var(--mono);margin-top:4px}\n.auto button{color:var(--cool);text-decoration:underline;font-size:10.5px;font-family:var(--mono)}\n\n/* ---------- abas ---------- */\n.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin-bottom:16px;overflow-x:auto}\n.tab{padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--txt3);border-bottom:2px solid transparent;white-space:nowrap;transition:.14s}\n.tab:hover{color:var(--txt)}\n.tab.on{color:var(--ember);border-bottom-color:var(--ember)}\n.pane{display:none}\n.pane.on{display:block}\n\n/* ---------- placar de risco ---------- */\n.verdict{border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:16px;background:var(--card);box-shadow:var(--sh2)}\n.verdict-h{padding:15px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}\n.lamp{width:15px;height:15px;border-radius:50%;flex:none}\n.lamp.ok{background:var(--ok);box-shadow:0 0 0 4px var(--ok-l)}\n.lamp.warn{background:var(--warn);box-shadow:0 0 0 4px var(--warn-l)}\n.lamp.bad{background:var(--bad);box-shadow:0 0 0 4px var(--bad-l)}\n.verdict-t{font-size:17px;font-weight:800;letter-spacing:-.02em}\n.verdict-s{font-size:12.5px;color:var(--txt2);margin-top:2px}\n.verdict-tag{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;padding:4px 9px;border-radius:3px;border:1px solid;font-weight:700}\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--line)}\n.kpi{background:var(--card);padding:12px 14px}\n.kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt3);font-weight:700}\n.kpi .v{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:3px;line-height:1.1}\n.kpi .v small{font-size:12px;color:var(--txt3);font-weight:400;margin-left:2px}\n.kpi .n{font-size:11px;color:var(--txt3);margin-top:3px}\n.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)}\n.c-ember{color:var(--ember)} .c-cool{color:var(--cool)}\n\n/* ---------- corte térmico ---------- */\n.slab{background:var(--card);border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:16px;box-shadow:var(--sh)}\n.slab-h{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card2)}\n.slab-h h3{font-size:12.5px;font-weight:700;letter-spacing:.02em}\n.slab-h .eyebrow{font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:.11em;text-transform:uppercase}\n.slab-body{padding:16px 14px 12px}\n#cutCanvas{width:100%;height:auto;display:block;border-radius:3px}\n.scrub{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}\n.scrub input[type=range]{flex:1;min-width:180px;accent-color:var(--ember);height:4px;cursor:pointer}\n.scrub .rd{font-family:var(--mono);font-size:12px;color:var(--txt2);white-space:nowrap}\n.scrub .rd b{color:var(--ember);font-weight:700}\n.playbtn{border:1px solid var(--line2);background:var(--card);border-radius:var(--r);padding:5px 12px;font-family:var(--mono);font-size:11.5px;color:var(--txt2)}\n.playbtn:hover{border-color:var(--ember);color:var(--ember)}\n.ramp{display:flex;align-items:center;gap:8px;margin-top:12px;font-family:var(--mono);font-size:10px;color:var(--txt3)}\n.ramp .bar{flex:1;height:8px;border-radius:2px;background:linear-gradient(90deg,#1c4a8f,#2d9db2,#3f9f60,#c9b22a,#e0691c,#bd2a1f)}\n\n/* ---------- gráficos ---------- */\n.chart{background:var(--card);border:1px solid var(--line);border-radius:7px;margin-bottom:14px;overflow:hidden;box-shadow:var(--sh)}\n.chart-h{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card2)}\n.chart-h h3{font-size:12.5px;font-weight:700}\n.chart-h p{font-size:11.5px;color:var(--txt3);margin-top:2px}\n.chart-b{padding:12px}\n.chart canvas{width:100%;height:auto;display:block}\n.legend{display:flex;gap:15px;flex-wrap:wrap;padding:0 14px 12px;font-size:11.5px;color:var(--txt2)}\n.legend i{display:inline-block;width:14px;height:2.5px;margin-right:5px;vertical-align:middle;border-radius:2px}\n\n/* ---------- tabelas ---------- */\ntable{width:100%;border-collapse:collapse;font-size:12.5px}\nth{text-align:left;padding:7px 10px;background:var(--card2);color:var(--txt3);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;border-bottom:1px solid var(--line)}\ntd{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}\ntbody tr:last-child td{border-bottom:none}\ntd.num,th.num{text-align:right;font-family:var(--mono)}\ntbody tr:hover{background:var(--card2)}\n\n/* ---------- recomendações ---------- */\n.rec{border:1px solid var(--line);border-left:3px solid var(--txt3);border-radius:var(--r);padding:11px 14px;margin-bottom:9px;background:var(--card);box-shadow:var(--sh)}\n.rec.crit{border-left-color:var(--bad)}\n.rec.att{border-left-color:var(--warn)}\n.rec.info{border-left-color:var(--cool)}\n.rec.good{border-left-color:var(--ok)}\n.rec h4{font-size:12.5px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}\n.rec .pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid currentColor;font-weight:600}\n.rec.crit .pill{color:var(--bad)} .rec.att .pill{color:var(--warn)}\n.rec.info .pill{color:var(--cool)} .rec.good .pill{color:var(--ok)}\n.rec p{font-size:12.5px;color:var(--txt2);line-height:1.55}\n.rec .src{font-family:var(--mono);font-size:10.5px;color:var(--txt3);margin-top:6px}\n\n/* ---------- memória de cálculo ---------- */\n.mem{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:18px 20px;box-shadow:var(--sh)}\n.mem h3{font-size:13px;font-weight:800;margin:20px 0 8px;color:var(--ember);letter-spacing:-.01em}\n.mem h3:first-child{margin-top:0}\n.mem p{font-size:12.5px;color:var(--txt2);margin-bottom:8px;line-height:1.6}\n.eq{background:var(--card2);border:1px solid var(--line);border-left:2px solid var(--cool);border-radius:var(--r);padding:10px 13px;margin:8px 0;font-family:var(--mono);font-size:12.5px;color:var(--txt);overflow-x:auto;white-space:pre;line-height:1.7}\n.mem .note{font-size:11.5px;color:var(--txt3);font-style:italic}\n\n/* ---------- cenários ---------- */\n.scen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}\n.scen{border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden;box-shadow:var(--sh)}\n.scen.best{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-l)}\n.scen-h{padding:9px 12px;background:var(--card2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}\n.scen-h h4{font-size:12px;font-weight:700;flex:1}\n.scen-b{padding:11px 12px}\n.scen-row{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;border-bottom:1px dashed var(--line)}\n.scen-row:last-child{border-bottom:none}\n.scen-row span:first-child{color:var(--txt3)}\n.scen-row span:last-child{font-family:var(--mono);font-weight:600}\n\n/* ---------- módulo de gelo ---------- */\n.ice-wrap{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}\n@media(max-width:980px){.ice-wrap{grid-template-columns:1fr}}\n.ice-panel{background:var(--card);border:1px solid var(--line);border-radius:7px;box-shadow:var(--sh);overflow:hidden}\n.ice-panel .card-h{cursor:default}\n.ice-out{background:var(--card);border:1px solid var(--line);border-radius:7px;box-shadow:var(--sh2);overflow:hidden;margin-bottom:14px}\n.ice-hero{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;flex-wrap:wrap}\n.ice-hero .big{font-family:var(--mono);font-size:33px;font-weight:600;letter-spacing:-.03em;line-height:1}\n.ice-hero .big small{font-size:14px;color:var(--txt3);margin-left:3px;font-weight:400}\n.ice-hero .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt3);font-weight:700;margin-bottom:6px}\n.ice-hero .sep{width:1px;align-self:stretch;background:var(--line)}\n.ice-msg{padding:12px 18px;font-size:12.5px;line-height:1.55;border-bottom:1px solid var(--line)}\n.ice-msg.ok{background:var(--ok-l);color:#0f5233}\n.ice-msg.warn{background:var(--warn-l);color:#6d4e05}\n.ice-msg.bad{background:var(--bad-l);color:#8a231b}\n.balance tr.tot{background:var(--card2);font-weight:700}\n.balance tr.tot td{border-top:2px solid var(--line2);border-bottom:none}\n.sens{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:1px;background:var(--line)}\n.sens>div{background:var(--card);padding:10px 13px}\n.sens .sk{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);font-weight:700}\n.sens .sv{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px}\n.sens .sn{font-size:10.5px;color:var(--txt3);margin-top:2px}\n\n/* ---------- projetos ---------- */\n.proj{display:flex;align-items:center;gap:12px;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--card);box-shadow:var(--sh)}\n.proj .pn{flex:1;min-width:0}\n.proj .pn b{font-size:13px;display:block}\n.proj .pn small{font-size:11px;color:var(--txt3);font-family:var(--mono)}\n.empty{padding:40px 20px;text-align:center;color:var(--txt3);font-size:13px}\n.empty b{display:block;color:var(--txt2);font-size:14px;margin-bottom:5px}\n\n/* ---------- diversos ---------- */\n.warnbar{background:var(--bad-l);border:1px solid #f0c4c0;border-radius:var(--r);padding:9px 13px;font-size:12.5px;color:#8a231b;margin-bottom:12px;line-height:1.5}\n.infobar{background:var(--cool-l);border:1px solid #bcdde5;border-radius:var(--r);padding:9px 13px;font-size:12.5px;color:#0a5468;margin-bottom:12px;line-height:1.5}\n.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--txt);color:#fff;border-radius:6px;padding:10px 18px;font-size:13px;z-index:200;opacity:0;transition:.28s;pointer-events:none;box-shadow:0 8px 28px rgba(23,33,43,.28)}\n.toast.on{transform:translateX(-50%) translateY(0);opacity:1}\n.foot{max-width:1560px;margin:0 auto;padding:20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--txt3);line-height:1.6}\n.foot b{color:var(--txt2)}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n/* ---------- impressão ---------- */\n@media print{\n  body{background:#fff;background-image:none}\n  .top,.rail,.tabs,.top-actions,.scrub,.playbtn,.foot,#btnCenarios{display:none!important}\n  .shell{display:block;max-width:none;padding:0}\n  .pane{display:block!important;page-break-before:always}\n  .pane:first-of-type{page-break-before:auto}\n  .card,.chart,.slab,.verdict,.mem,.rec,.scen,.ice-out,.ice-panel{box-shadow:none;border-color:#bbb;break-inside:avoid}\n  .ice-wrap{display:block}\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<!-- ================= TELA DE ABERTURA / SPLASH 3D ================= -->\n<style id=\"tm-splash-css\">\n#tmSplash{position:fixed;inset:0;z-index:9999;background:#07090d;overflow:hidden;\n  font-family:\"Inter\",\"Segoe UI\",-apple-system,Roboto,Helvetica,Arial,sans-serif;\n  transition:opacity .55s ease}\n#tmSplash.tm-out{opacity:0;pointer-events:none}\n#tmCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;\n  transition:filter .7s ease, transform .9s ease, opacity .7s ease}\n#tmSplash.tm-legal #tmCanvas{filter:blur(9px) saturate(.85) brightness(.55);transform:scale(1.06)}\n#tmVig{position:absolute;inset:0;pointer-events:none;\n  background:radial-gradient(ellipse 120% 90% at 50% 45%,transparent 35%,rgba(7,9,13,.85) 100%)}\n.tm-ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;\n  padding:clamp(22px,4vw,54px);pointer-events:none}\n#tmSplash.tm-legal .tm-ui{opacity:0;transition:opacity .45s ease}\n.tm-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}\n.tm-mark{display:flex;align-items:center;gap:12px;opacity:0;animation:tmFade .9s .15s forwards}\n.tm-dot{width:11px;height:11px;border-radius:50%;background:#ff7a1a;box-shadow:0 0 0 5px rgba(255,122,26,.16),0 0 22px rgba(255,122,26,.9);\n  animation:tmPulse 2.1s ease-in-out infinite}\n.tm-mark span{font-family:ui-monospace,\"SF Mono\",\"Roboto Mono\",Consolas,monospace;font-size:10.5px;\n  letter-spacing:.28em;text-transform:uppercase;color:#8e9aa8}\n.tm-ver{font-family:ui-monospace,\"SF Mono\",\"Roboto Mono\",Consolas,monospace;font-size:10.5px;\n  letter-spacing:.2em;color:#5c6672;text-transform:uppercase;opacity:0;animation:tmFade .9s .3s forwards}\n.tm-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;flex-wrap:wrap}\n.tm-title{max-width:min(760px,72vw)}\n.tm-title h1{font-size:clamp(34px,6.2vw,78px);line-height:.94;letter-spacing:-.045em;font-weight:800;\n  color:#f2f5f8;margin:0;text-wrap:balance}\n.tm-title h1 em{font-style:normal;color:#ff8a2b}\n.tm-title p{margin:14px 0 0;font-size:clamp(13px,1.5vw,19px);color:#9aa7b4;letter-spacing:-.01em;max-width:34ch;text-wrap:pretty}\n.tm-title h1,.tm-title p{opacity:0;transform:translateY(16px);animation:tmRise 1s cubic-bezier(.2,.7,.2,1) forwards}\n.tm-title h1{animation-delay:.35s}\n.tm-title p{animation-delay:.6s}\n.tm-read{min-width:250px;opacity:0;animation:tmFade 1s .8s forwards}\n.tm-read-row{display:flex;align-items:baseline;gap:9px;font-family:ui-monospace,\"SF Mono\",\"Roboto Mono\",Consolas,monospace}\n.tm-read-row b{font-size:clamp(30px,4.4vw,54px);font-weight:600;color:#ffb066;letter-spacing:-.03em;font-variant-numeric:tabular-nums}\n.tm-read-row i{font-style:normal;font-size:13px;color:#7c8794;letter-spacing:.06em}\n.tm-read-lbl{font-family:ui-monospace,\"SF Mono\",\"Roboto Mono\",Consolas,monospace;font-size:10px;\n  letter-spacing:.22em;text-transform:uppercase;color:#6d7783;margin-bottom:6px}\n.tm-bar{margin-top:16px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}\n.tm-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7a3ad6,#e0451f,#ffb02e);border-radius:2px}\n.tm-steps{margin-top:10px;font-family:ui-monospace,\"SF Mono\",\"Roboto Mono\",Consolas,monospace;font-size:10.5px;\n  letter-spacing:.13em;text-transform:uppercase;color:#68727e;min-height:14px}\n#tmSkip{position:absolute;right:clamp(22px,4vw,54px);top:calc(clamp(22px,4vw,54px) + 26px);pointer-events:auto;\n  display:none;font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;\n  color:#7d8794;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);border-radius:4px;\n  padding:7px 13px;cursor:pointer;transition:.16s}\n#tmSkip:hover{color:#ffb066;border-color:rgba(255,138,43,.5)}\n\n/* -------- aviso legal -------- */\n#tmLegal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px}\n#tmSplash.tm-legal #tmLegal{display:flex}\n.tm-modal{width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;\n  background:rgba(15,18,24,.9);border:1px solid rgba(255,255,255,.11);border-radius:10px;\n  box-shadow:0 40px 120px rgba(0,0,0,.65);backdrop-filter:blur(18px);\n  opacity:0;transform:translateY(20px) scale(.985);animation:tmRise .6s .1s cubic-bezier(.2,.7,.2,1) forwards}\n.tm-modal-h{padding:20px 26px 16px;border-bottom:1px solid rgba(255,255,255,.09)}\n.tm-modal-h .tm-kicker{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.24em;\n  text-transform:uppercase;color:#ff8a2b;margin-bottom:8px}\n.tm-modal-h h2{margin:0;font-size:22px;font-weight:750;letter-spacing:-.03em;color:#f2f5f8}\n.tm-modal-h p{margin:6px 0 0;font-size:12.5px;color:#8b97a4}\n.tm-modal-b{padding:20px 26px;overflow-y:auto;overflow-x:hidden;color:#b3bec9;font-size:13.2px;line-height:1.62}\n.tm-modal-b::-webkit-scrollbar{width:9px}\n.tm-modal-b::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:5px}\n.tm-modal-b h4{margin:18px 0 5px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;\n  color:#ff9a4d;font-family:ui-monospace,monospace;font-weight:600}\n.tm-modal-b h4:first-child{margin-top:0}\n.tm-modal-b p{margin:0 0 8px}\n.tm-modal-b strong{color:#e6ecf2;font-weight:650}\n.tm-modal-f{padding:16px 26px 20px;border-top:1px solid rgba(255,255,255,.09);display:flex;\n  align-items:center;gap:16px;flex-wrap:wrap}\n.tm-agree{display:flex;align-items:flex-start;gap:10px;font-size:12.8px;color:#c3cdd7;cursor:pointer;flex:1;min-width:260px;line-height:1.45}\n.tm-agree input{width:17px;height:17px;accent-color:#ff7a1a;cursor:pointer;flex:none;margin-top:1px}\n.tm-btns{display:flex;gap:9px;margin-left:auto}\n.tm-btn{white-space:nowrap;border-radius:5px;padding:10px 17px;font-size:13px;font-weight:600;cursor:pointer;transition:.16s;\n  border:1px solid rgba(255,255,255,.18);background:transparent;color:#9aa6b2}\n.tm-btn:hover{color:#e6ecf2;border-color:rgba(255,255,255,.35)}\n.tm-btn-p{background:#c9560f;border-color:#c9560f;color:#fff;font-weight:700}\n.tm-btn-p:hover{background:#e0651a;border-color:#e0651a;color:#fff}\n.tm-btn-p:disabled{opacity:.35;cursor:not-allowed;background:#c9560f;color:#fff}\n.tm-deny{margin:0;font-size:12px;color:#ff8a7a;display:none;width:100%;font-family:ui-monospace,monospace}\n\n@keyframes tmFade{to{opacity:1}}\n@keyframes tmRise{to{opacity:1;transform:none}}\n@keyframes tmPulse{0%,100%{box-shadow:0 0 0 5px rgba(255,122,26,.16),0 0 22px rgba(255,122,26,.85)}\n  50%{box-shadow:0 0 0 11px rgba(255,122,26,.05),0 0 34px rgba(255,122,26,1)}}\n@media(max-width:640px){.tm-read{min-width:0}.tm-bottom{flex-direction:column;align-items:flex-start}}\n<\u002Fstyle>\n\n<div id=\"tmSplash\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Abertura do sistema Termo Massa\">\n  <canvas id=\"tmCanvas\"><\u002Fcanvas>\n  <div id=\"tmVig\"><\u002Fdiv>\n\n  <div class=\"tm-ui\">\n    <div class=\"tm-top\">\n      <div class=\"tm-mark\"><span class=\"tm-dot\"><\u002Fspan><span>Análise térmica de concreto massa<\u002Fspan><\u002Fdiv>\n      <div class=\"tm-ver\">simulação 3D · campo de temperatura<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tm-bottom\">\n      <div class=\"tm-title\">\n        <h1>Termo <em>Massa<\u002Fem><\u002Fh1>\n        <p>Analisador de Temperatura de Concretagem<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tm-read\">\n        <div class=\"tm-read-lbl\">Temperatura do núcleo<\u002Fdiv>\n        <div class=\"tm-read-row\"><b id=\"tmTemp\">22.0<\u002Fb><i>°C<\u002Fi><i id=\"tmDelta\" style=\"margin-left:8px;color:#ff8a2b\"><\u002Fi><\u002Fdiv>\n        <div class=\"tm-bar\"><i id=\"tmBar\"><\u002Fi><\u002Fdiv>\n        <div class=\"tm-steps\" id=\"tmStep\">inicializando malha térmica<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <button id=\"tmSkip\" type=\"button\">pular<\u002Fbutton>\n\n  <div id=\"tmLegal\">\n    <div class=\"tm-modal\">\n      <div class=\"tm-modal-h\">\n        <div class=\"tm-kicker\">Aviso legal · termo de uso e responsabilidade<\u002Fdiv>\n        <h2>Termo Massa — Analisador de Temperatura de Concretagem<\u002Fh2>\n        <p>Leia atentamente antes de acessar o sistema.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tm-modal-b\" id=\"tmLegalBody\">\n        <h4>1. Natureza da ferramenta<\u002Fh4>\n        <p>O <strong>Termo Massa<\u002Fstrong> é uma ferramenta de <strong>apoio à decisão de engenharia<\u002Fstrong>. Os resultados apresentados decorrem de modelos matemáticos simplificados de geração e transferência de calor, alimentados por parâmetros informados pelo próprio usuário. <strong>Não substituem<\u002Fstrong> projeto, memorial de cálculo, ensaios laboratoriais, instrumentação de campo, nem o julgamento técnico de profissional legalmente habilitado.<\u002Fp>\n\n        <h4>2. Responsabilidade técnica<\u002Fh4>\n        <p>A responsabilidade pela escolha dos dados de entrada, pela interpretação dos resultados, pela definição dos critérios de aceitação e por toda e qualquer decisão executiva é <strong>exclusiva do usuário<\u002Fstrong> e do responsável técnico da obra, com registro no respectivo conselho profissional (CREA/CAU) e ART/RRT quando aplicável.<\u002Fp>\n\n        <h4>3. Normas e critérios<\u002Fh4>\n        <p>As referências normativas eventualmente citadas (ABNT NBR, ACI, boas práticas de concreto massa) são indicativas. Cabe ao usuário verificar a <strong>vigência<\u002Fstrong>, a aplicabilidade e as exigências contratuais e editalícias específicas do empreendimento.<\u002Fp>\n\n        <h4>4. Ausência de garantias<\u002Fh4>\n        <p>O sistema é fornecido \"no estado em que se encontra\", sem garantia de exatidão, completude, disponibilidade contínua ou adequação a finalidade específica. Os autores e licenciantes não respondem por perdas, danos diretos ou indiretos, lucros cessantes, patologias, fissuração de origem térmica, retrabalhos ou custos decorrentes do uso ou da impossibilidade de uso desta ferramenta.<\u002Fp>\n\n        <h4>5. Dados e privacidade<\u002Fh4>\n        <p>Os cálculos são executados <strong>localmente no seu navegador<\u002Fstrong>. Dados de projeto salvos permanecem no armazenamento local do dispositivo, sob responsabilidade do usuário quanto à confidencialidade, ao sigilo contratual e à Lei nº 13.709/2018 (LGPD).<\u002Fp>\n\n        <h4>6. Propriedade intelectual<\u002Fh4>\n        <p>É vedada a redistribuição, revenda, descompilação ou incorporação do sistema a produtos de terceiros sem autorização expressa do titular.<\u002Fp>\n\n        <h4>7. Aceite<\u002Fh4>\n        <p>Ao marcar a caixa abaixo e prosseguir, você declara ter <strong>lido, compreendido e aceito<\u002Fstrong> integralmente as condições acima, assumindo a responsabilidade técnica pelo uso dos resultados.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tm-modal-f\">\n        <label class=\"tm-agree\"><input type=\"checkbox\" id=\"tmChk\"><span>Li e concordo com o aviso legal e assumo a responsabilidade técnica pelo uso dos resultados.<\u002Fspan><\u002Flabel>\n        <div class=\"tm-btns\">\n          <button class=\"tm-btn\" type=\"button\" id=\"tmDenyBtn\">Não concordo<\u002Fbutton>\n          <button class=\"tm-btn tm-btn-p\" type=\"button\" id=\"tmOkBtn\" disabled=\"\">Concordar e acessar<\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"tm-deny\" id=\"tmDenyMsg\">Sem o aceite do aviso legal o acesso ao sistema não é liberado. Marque a caixa acima para continuar ou feche esta janela.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script type=\"x-shader/x-fragment\" id=\"tmFrag\">#version 300 es\nprecision highp float;\nout vec4 fragColor;\nuniform vec2  uRes;\nuniform float uTime;   // segundos\nuniform float uProg;   // 0..1 progresso da animacao\n\nconst vec3 B = vec3(0.98, 0.56, 0.64);   // meia-dimensao do bloco\n\nfloat hash(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0;\n  return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }\nfloat noise(vec3 x){\n  vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);\n  return mix(mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),\n                 mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),\n             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),\n                 mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);\n}\nfloat fbm(vec3 p){ return 0.55*noise(p) + 0.28*noise(p*2.03) + 0.17*noise(p*4.11); }\n\n// paleta termica (frio -> incandescente)\nvec3 pal(float x){\n  x = clamp(x,0.0,1.0);\n  vec3 c = vec3(0.035,0.075,0.20);\n  c = mix(c, vec3(0.26,0.09,0.52), smoothstep(0.02,0.30,x));\n  c = mix(c, vec3(0.78,0.15,0.34), smoothstep(0.26,0.55,x));\n  c = mix(c, vec3(0.99,0.45,0.06), smoothstep(0.50,0.76,x));\n  c = mix(c, vec3(1.00,0.80,0.32), smoothstep(0.72,0.92,x));\n  c = mix(c, vec3(1.00,0.97,0.86), smoothstep(0.90,1.00,x));\n  return c;\n}\n\n// campo de temperatura normalizado dentro do bloco\nfloat heat(vec3 p, float t){\n  vec3 q = abs(p)/B;\n  float m = max(q.x, max(q.y, q.z));           // 0 = nucleo, 1 = face\n  float front = smoothstep(0.0,1.0,t)*1.22;    // frente de calor avancando\n  float h = 1.0 - smoothstep(front-0.60, front+0.02, m);\n  h *= mix(1.0, 0.55, m*m);                    // nucleo sempre mais quente\n  h *= smoothstep(0.0,0.16,t);\n  float n = fbm(p*2.6 + vec3(0.0, uTime*0.18, uTime*0.11));\n  h *= 0.80 + 0.34*n;\n  // pulsacao lenta da hidratacao\n  h *= 0.94 + 0.06*sin(uTime*1.7 + p.x*3.0 + p.y*2.0);\n  return clamp(h,0.0,1.0);\n}\n\nbool boxHit(vec3 ro, vec3 rd, out float t0, out float t1, out vec3 n0){\n  vec3 inv = 1.0/rd;\n  vec3 a = (-B - ro)*inv, b = ( B - ro)*inv;\n  vec3 mn = min(a,b), mx = max(a,b);\n  t0 = max(max(mn.x,mn.y),mn.z);\n  t1 = min(min(mx.x,mx.y),mx.z);\n  if(t1 <= max(t0,0.0)) return false;\n  vec3 s = step(vec3(t0), mn);  // face de entrada\n  n0 = -sign(rd)*s;\n  return true;\n}\n\nvoid main(){\n  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;\n\n  // camera em orbita\n  float ang = -0.75 + uTime*0.16;\n  float dist = 3.75 - 0.42*smoothstep(0.0,1.0,uProg);\n  float ey = 0.95 - 0.25*smoothstep(0.0,1.0,uProg);\n  vec3 ro = vec3(sin(ang)*dist, ey, cos(ang)*dist);\n  vec3 ta = vec3(0.0,-0.02,0.0);\n  vec3 ww = normalize(ta-ro), uu = normalize(cross(vec3(0,1,0),ww)), vv = cross(ww,uu);\n  vec3 rd = normalize(uv.x*uu + uv.y*vv + 1.55*ww);\n\n  // fundo\n  vec3 col = mix(vec3(0.022,0.027,0.038), vec3(0.045,0.050,0.070), smoothstep(0.7,-0.6,uv.y));\n  col += vec3(0.06,0.03,0.10)*exp(-3.2*length(uv-vec2(-0.55,0.35)));\n\n  // piso com sombra e reflexo quente\n  if(rd.y < -0.001){\n    float tf = (-0.70 - ro.y)/rd.y;\n    if(tf > 0.0){\n      vec3 fp = ro + rd*tf;\n      float d = length(fp.xz*vec2(0.72,0.95));\n      float g = exp(-1.05*d*d);\n      float grain = 0.5+0.5*fbm(fp*3.0);\n      vec3 floorc = vec3(0.055,0.058,0.068)*(0.55+0.65*grain);\n      floorc *= 1.0 - 0.75*exp(-2.6*d*d);                    // sombra de contato\n      floorc += pal(0.55+0.35*uProg)*g*0.30*smoothstep(0.05,0.8,uProg); // reflexo termico\n      col = mix(col, floorc, smoothstep(0.0,0.25,-rd.y));\n    }\n  }\n\n  float t0,t1; vec3 n;\n  if(boxHit(ro, rd, t0, t1, n)){\n    vec3 p0 = ro + rd*max(t0,0.0);\n\n    // ---- concreto: microtextura + agregados\n    float g1 = fbm(p0*13.0), g2 = fbm(p0*44.0);\n    vec3 alb = vec3(0.455,0.452,0.442)*(0.80+0.34*g1) + 0.055*vec3(g2);\n    // juntas de forma\n    float seam = smoothstep(0.018,0.0,abs(fract(p0.y*2.6+0.5)-0.5)/2.6);\n    alb *= 1.0 - 0.30*seam;\n\n    vec3 L1 = normalize(vec3(-0.55,0.85,0.42));\n    vec3 L2 = normalize(vec3(0.75,0.25,-0.55));\n    float dif = max(dot(n,L1),0.0), dif2 = max(dot(n,L2),0.0);\n    vec3 h1 = normalize(L1-rd);\n    float spe = pow(max(dot(n,h1),0.0), 26.0)*0.16*(0.4+0.6*g1);\n    vec3 surf = alb*(0.13 + 0.85*dif) + alb*dif2*0.22 + vec3(spe);\n\n    // temperatura na pele -> tinge a superficie\n    float hs = heat(p0*0.985, uProg);\n    surf = mix(surf, pal(min(hs*1.05,1.0)), clamp(hs*0.72,0.0,1.0));\n\n    // ---- integracao volumetrica do calor interno\n    const int N = 40;\n    float far = min(t1, max(t0,0.0) + 2.6);\n    float dt = (far - max(t0,0.0))/float(N);\n    vec3 glow = vec3(0.0);\n    float trans = 1.0, atten = 0.0;\n    for(int i=0;i<N;i++){\n      float tt = max(t0,0.0) + (float(i)+0.5)*dt;\n      vec3 p = ro + rd*tt;\n      float h = heat(p, uProg);\n      float dens = h*h*(1.7 + 1.5*h);\n      vec3 e = pal(h)*h;\n      // isotermas sutis\n      float iso = smoothstep(0.90,1.0,sin((h*11.0 - uTime*0.9)*3.14159));\n      e += pal(min(h+0.18,1.0))*iso*0.30*h;\n      glow += e*dens*dt*trans;\n      trans *= exp(-dens*dt*2.15);\n      atten += dens*dt;\n    }\n    float a = 1.0 - exp(-atten*1.05);\n    col = surf*(1.0-0.55*a) + glow*1.55;\n\n    // fresnel + halo incandescente nas arestas\n    float fres = pow(1.0-max(dot(n,-rd),0.0), 3.4);\n    col += vec3(0.35,0.55,0.85)*fres*0.10;\n    col += pal(min(hs+0.25,1.0))*fres*0.55*smoothstep(0.15,0.95,uProg);\n  } else {\n    // brilho difuso emanando do bloco\n    float t0b,t1b; vec3 nb;\n    vec3 rob = ro, rdb = rd;\n    float halo = 0.0;\n    for(int i=0;i<3;i++){\n      float s = 1.0 + 0.16*float(i+1);\n      vec3 Bx = B*s; vec3 inv = 1.0/rdb;\n      vec3 aa = (-Bx-rob)*inv, bb = (Bx-rob)*inv;\n      vec3 mn = min(aa,bb), mx = max(aa,bb);\n      float e0 = max(max(mn.x,mn.y),mn.z), e1 = min(min(mx.x,mx.y),mx.z);\n      if(e1 > max(e0,0.0)) halo += (e1-e0)*0.16/float(i+1);\n    }\n    col += pal(0.62+0.3*uProg)*halo*0.30*smoothstep(0.05,0.9,uProg);\n  }\n\n  // grade tecnica muito discreta no fundo\n  col += vec3(0.05,0.07,0.10)*0.35*smoothstep(0.995,1.0,max(\n      abs(fract(uv.x*7.0)-0.5)*2.0, abs(fract(uv.y*7.0)-0.5)*2.0));\n\n  // tonemap + vinheta + grao\n  col = col/(1.0+col*0.62);\n  col = pow(max(col,0.0), vec3(0.4545));\n  col *= 1.0 - 0.42*dot(uv,uv)*0.55;\n  col += (hash(vec3(gl_FragCoord.xy, floor(uTime*30.0))) - 0.5)*0.016;\n  fragColor = vec4(col,1.0);\n}\n<\u002Fscript>\n\n<script>\n(function(){\n  \"use strict\";\n  var DUR = 6.0;\n  var splash = document.getElementById('tmSplash');\n  var cv = document.getElementById('tmCanvas');\n  var elT = document.getElementById('tmTemp'), elD = document.getElementById('tmDelta');\n  var elBar = document.getElementById('tmBar'), elStep = document.getElementById('tmStep');\n  var skip = document.getElementById('tmSkip');\n  var prevOverflow = document.body.style.overflow;\n  document.body.style.overflow = 'hidden';\n\n  var gl = cv.getContext('webgl2', {antialias:false, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance'});\n  var raf = 0, start = performance.now(), legalShown = false, prog = 0;\n\n  function initGL(){\n    if(!gl) return false;\n    var vs = '#version 300 es\\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.0-1.0,0.0,1.0);}';\n    var fs = document.getElementById('tmFrag').textContent.trim();\n    function sh(t,src){var s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);\n      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(s));return null;}return s;}\n    var a=sh(gl.VERTEX_SHADER,vs), b=sh(gl.FRAGMENT_SHADER,fs);\n    if(!a||!b) return false;\n    var pr=gl.createProgram();gl.attachShader(pr,a);gl.attachShader(pr,b);gl.linkProgram(pr);\n    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){console.warn(gl.getProgramInfoLog(pr));return false;}\n    gl.useProgram(pr);\n    var uRes=gl.getUniformLocation(pr,'uRes'), uTime=gl.getUniformLocation(pr,'uTime'), uProg=gl.getUniformLocation(pr,'uProg');\n    var vao=gl.createVertexArray();gl.bindVertexArray(vao);\n    function size(){\n      var dpr = Math.min(window.devicePixelRatio||1, 2.5);\n      var w = Math.round(cv.clientWidth*dpr), h = Math.round(cv.clientHeight*dpr);\n      if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}\n      gl.viewport(0,0,cv.width,cv.height);\n      gl.uniform2f(uRes,cv.width,cv.height);\n    }\n    window.addEventListener('resize',size);\n    gl.__draw = function(tsec,p){ size(); gl.uniform1f(uTime,tsec); gl.uniform1f(uProg,p);\n      gl.drawArrays(gl.TRIANGLES,0,3); };\n    return true;\n  }\n\n  var ok = false;\n  try{ ok = initGL(); }catch(e){ ok = false; }\n  if(!ok){ splash.style.background = 'radial-gradient(ellipse at 50% 55%, #4a1d0c, #07090d 70%)'; cv.style.display='none'; }\n\n  var steps = [\n    [0.00,'inicializando malha térmica'],\n    [0.14,'gerando calor de hidratação · cimento'],\n    [0.34,'difusão de calor no núcleo'],\n    [0.56,'propagação para as faces · perda por convecção'],\n    [0.76,'gradiente térmico núcleo–superfície'],\n    [0.92,'campo de temperatura resolvido']\n  ];\n\n  function frame(now){\n    var tsec = (now - start)/1000;\n    prog = Math.min(tsec/DUR, 1);\n    if(ok) gl.__draw(tsec, prog);\n\n    var e = prog<0.5 ? 2*prog*prog : 1-Math.pow(-2*prog+2,2)/2;\n    var temp = 22 + e*46.4;\n    elT.textContent = temp.toFixed(1);\n    elD.textContent = '+' + (temp-22).toFixed(1) + ' K';\n    elBar.style.width = (prog*100).toFixed(1) + '%';\n    for(var i=steps.length-1;i>=0;i--){ if(prog>=steps[i][0]){ if(elStep.textContent!==steps[i][1]) elStep.textContent=steps[i][1]; break; } }\n\n    if(prog>=1 && !legalShown){ showLegal(); }\n    if(prog < 1 || !legalShown) raf = requestAnimationFrame(frame);\n  }\n\n  function showLegal(){\n    if(legalShown) return;\n    legalShown = true;\n    prog = 1;\n    if(ok) gl.__draw((performance.now()-start)/1000, 1);\n    splash.classList.add('tm-legal');\n    skip.style.display='none';\n    setTimeout(function(){ var c=document.getElementById('tmChk'); if(c) c.focus(); }, 500);\n  }\n\n  setTimeout(function(){ if(!legalShown) skip.style.display='block'; }, 1200);\n  skip.addEventListener('click', showLegal);\n  splash.addEventListener('keydown', function(ev){ if(ev.key==='Escape' && !legalShown) showLegal(); });\n\n  var chk = document.getElementById('tmChk'), okBtn = document.getElementById('tmOkBtn');\n  var denyBtn = document.getElementById('tmDenyBtn'), denyMsg = document.getElementById('tmDenyMsg');\n  chk.addEventListener('change', function(){ okBtn.disabled = !chk.checked; if(chk.checked) denyMsg.style.display='none'; });\n  denyBtn.addEventListener('click', function(){ chk.checked=false; okBtn.disabled=true; denyMsg.style.display='block'; });\n  okBtn.addEventListener('click', function(){\n    if(!chk.checked) return;\n    cancelAnimationFrame(raf);\n    splash.classList.add('tm-out');\n    document.body.style.overflow = prevOverflow;\n    try{ localStorage.setItem('tm_aviso_legal_aceite', new Date().toISOString()); }catch(e){}\n    setTimeout(function(){\n      splash.remove();\n      var css = document.getElementById('tm-splash-css'); if(css) css.remove();\n      window.dispatchEvent(new Event('resize'));\n    }, 620);\n  });\n\n  raf = requestAnimationFrame(frame);\n})();\n<\u002Fscript>\n<!-- =============== FIM DA TELA DE ABERTURA =============== -->\n\n<header class=\"top\">\n  <div class=\"top-in\">\n    <div class=\"brand\">\n      <h1>Termo<span>Massa<\u002Fspan><\u002Fh1>\n      <span class=\"sub\">Fissuração térmica · concreto massa<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"top-actions\">\n      <button class=\"btn\" id=\"btnNovo\">Limpar<\u002Fbutton>\n      <button class=\"btn\" id=\"btnSalvar\">Salvar projeto<\u002Fbutton>\n      <button class=\"btn\" id=\"btnJson\">Exportar JSON<\u002Fbutton>\n      <button class=\"btn\" id=\"btnCsv\">Exportar CSV<\u002Fbutton>\n      <button class=\"btn\" id=\"btnPdf\">Gerar relatório<\u002Fbutton>\n      <button class=\"btn btn-p\" id=\"btnCalc\">Calcular<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"shell\">\n\n<!-- ============== PAINEL DE ENTRADAS ============== -->\n<aside class=\"rail\">\n\n  <div class=\"card\" data-card=\"\">\n    <div class=\"card-h\"><span class=\"idx\">01<\u002Fspan><h3>Identificação<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n    <div class=\"card-b\">\n      <div class=\"f\"><label>Obra / contrato<\u002Flabel><input type=\"text\" id=\"obra\" placeholder=\"Ex.: Ponte sobre o Rio Preto — Lote 2\"><\u002Fdiv>\n      <div class=\"f\"><label>Peça analisada<\u002Flabel><input type=\"text\" id=\"peca\" placeholder=\"Ex.: Bloco de coroamento P-07\"><\u002Fdiv>\n      <div class=\"grid2\">\n        <div class=\"f\"><label>Data da concretagem<\u002Flabel><input type=\"date\" id=\"dataConc\"><\u002Fdiv>\n        <div class=\"f\"><label>Responsável técnico<\u002Flabel><input type=\"text\" id=\"resp\" placeholder=\"Nome / CREA\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\" data-card=\"\">\n    <div class=\"card-h\"><span class=\"idx\">02<\u002Fspan><h3>Geometria da peça<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n    <div class=\"card-b\">\n      <div class=\"f\">\n        <label>Tipo de peça<\u002Flabel>\n        <select id=\"tipoPeca\">\n          <option value=\"bloco\">Bloco de coroamento / fundação<\u002Foption>\n          <option value=\"sapata\">Sapata / radier<\u002Foption>\n          <option value=\"pilar\">Pilar ou encontro robusto<\u002Foption>\n          <option value=\"laje\">Laje ou plataforma espessa<\u002Foption>\n          <option value=\"muro\">Muro de arrimo / barragem<\u002Foption>\n          <option value=\"viga\">Viga de grande altura<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n      <div class=\"grid3\">\n        <div class=\"f\"><label>Compr. <span class=\"u\">m<\u002Fspan><\u002Flabel><input type=\"number\" id=\"dimA\" value=\"6.0\" step=\"0.05\" min=\"0.1\"><\u002Fdiv>\n        <div class=\"f\"><label>Larg. <span class=\"u\">m<\u002Fspan><\u002Flabel><input type=\"number\" id=\"dimB\" value=\"6.0\" step=\"0.05\" min=\"0.1\"><\u002Fdiv>\n        <div class=\"f\"><label>Altura <span class=\"u\">m<\u002Fspan><\u002Flabel><input type=\"number\" id=\"dimC\" value=\"1.5\" step=\"0.05\" min=\"0.1\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"f\">\n        <label>Faces em contato com solo / concreto antigo<\u002Flabel>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"fBase\" checked=\"\"> Face inferior (base)<\u002Flabel>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"fLat\"> Faces laterais confinadas<\u002Flabel>\n        <div class=\"hint\">Faces confinadas trocam pouco calor: entram com peso 0,30 no cálculo da espessura equivalente.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"f\">\n        <label>Espessura equivalente <span class=\"u\">m — 2V/A<\u002Fspan><\u002Flabel>\n        <input type=\"number\" id=\"eEq\" readonly=\"\">\n        <div class=\"auto\"><span>calculada da geometria<\u002Fspan><button type=\"button\" id=\"editEeq\">editar manualmente<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"f\"><label>Volume da peça <span class=\"u\">m³<\u002Fspan><\u002Flabel><input type=\"number\" id=\"volume\" readonly=\"\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\" data-card=\"\">\n    <div class=\"card-h\"><span class=\"idx\">03<\u002Fspan><h3>Concreto e traço<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n    <div class=\"card-b\">\n      <div class=\"grid2\">\n        <div class=\"f\">\n          <label>f<sub>ck<\u002Fsub> <span class=\"u\">MPa<\u002Fspan><\u002Flabel>\n          <select id=\"fck\">\n            <option>20<\u002Foption><option>25<\u002Foption><option selected=\"\">30<\u002Foption>\n            <option>35<\u002Foption><option>40<\u002Foption><option>45<\u002Foption><option>50<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div class=\"f\"><label>Abatimento <span class=\"u\">cm<\u002Fspan><\u002Flabel><input type=\"number\" id=\"slump\" value=\"10\" step=\"1\" min=\"4\" max=\"22\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"f\">\n        <label>Cimento<\u002Flabel>\n        <select id=\"cimento\"><\u002Fselect>\n        <div class=\"hint\" id=\"cimHint\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"grid2\">\n        <div class=\"f\"><label>Consumo cimento <span class=\"u\">kg/m³<\u002Fspan><\u002Flabel><input type=\"number\" id=\"consumo\" value=\"380\" step=\"5\" min=\"150\" max=\"600\"><\u002Fdiv>\n        <div class=\"f\"><label>Relação a/c<\u002Flabel><input type=\"number\" id=\"ac\" value=\"0.50\" step=\"0.01\" min=\"0.30\" max=\"0.80\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"auto\"><span>estimativa automática pelo f<sub>ck<\u002Fsub> e abatimento<\u002Fspan><button type=\"button\" id=\"btnEstTraco\">aplicar<\u002Fbutton><\u002Fdiv>\n      <div class=\"f\" style=\"margin-top:11px\">\n        <label>Substituição por adição <span class=\"u\">% em massa<\u002Fspan><\u002Flabel>\n        <input type=\"number\" id=\"scm\" value=\"0\" step=\"5\" min=\"0\" max=\"60\">\n        <div class=\"hint\">Escória, cinza volante ou metacaulim adicionados na central, além do teor já presente no cimento. Reduz proporcionalmente o calor liberado.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"f\">\n        <label>Agregado graúdo<\u002Flabel>\n        <select id=\"agregado\"><\u002Fselect>\n        <div class=\"hint\" id=\"agHint\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\" data-card=\"\">\n    <div class=\"card-h\"><span class=\"idx\">04<\u002Fspan><h3>Ambiente e lançamento<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n    <div class=\"card-b\">\n      <div class=\"grid2\">\n        <div class=\"f\"><label>Temp. ambiente média <span class=\"u\">°C<\u002Fspan><\u002Flabel><input type=\"number\" id=\"tamb\" value=\"25\" step=\"1\" min=\"-5\" max=\"45\"><\u002Fdiv>\n        <div class=\"f\"><label>Amplitude dia/noite <span class=\"u\">±°C<\u002Fspan><\u002Flabel><input type=\"number\" id=\"ampl\" value=\"6\" step=\"1\" min=\"0\" max=\"20\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"grid2\">\n        <div class=\"f\"><label>Temp. de lançamento <span class=\"u\">°C<\u002Fspan><\u002Flabel><input type=\"number\" id=\"tlanc\" value=\"28\" step=\"1\" min=\"0\" max=\"45\"><\u002Fdiv>\n        <div class=\"f\"><label>Umidade relativa <span class=\"u\">%<\u002Fspan><\u002Flabel><input type=\"number\" id=\"ur\" value=\"70\" step=\"5\" min=\"20\" max=\"100\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"f\">\n        <label>Temp. mínima de serviço <span class=\"u\">°C<\u002Fspan><\u002Flabel>\n        <input type=\"number\" id=\"tmin\" value=\"18\" step=\"1\" min=\"-10\" max=\"40\">\n        <div class=\"hint\">Menor temperatura média que a peça atingirá em serviço. É o ponto final do resfriamento que gera a fissura passante.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\" data-card=\"\">\n    <div class=\"card-h\"><span class=\"idx\">05<\u002Fspan><h3>Cura e proteção<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n    <div class=\"card-b\">\n      <div class=\"f\"><label>Face superior — até a desforma<\u002Flabel><select id=\"protTopo\"><\u002Fselect><\u002Fdiv>\n      <div class=\"f\"><label>Face superior — após a desforma<\u002Flabel><select id=\"protTopo2\"><\u002Fselect><\u002Fdiv>\n      <div class=\"f\"><label>Face inferior / base<\u002Flabel><select id=\"protBase\"><\u002Fselect><\u002Fdiv>\n      <div class=\"grid2\">\n        <div class=\"f\"><label>Idade de desforma <span class=\"u\">dias<\u002Fspan><\u002Flabel><input type=\"number\" id=\"tdesf\" value=\"3\" step=\"0.5\" min=\"0.5\" max=\"30\"><\u002Fdiv>\n        <div class=\"f\"><label>Período simulado <span class=\"u\">dias<\u002Fspan><\u002Flabel><input type=\"number\" id=\"dias\" value=\"21\" step=\"1\" min=\"3\" max=\"120\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"f\">\n        <label class=\"chk\" style=\"margin-bottom:2px\"><input type=\"checkbox\" id=\"preRefr\"> Pré-resfriamento do concreto<\u002Flabel>\n        <div class=\"hint\">Gelo em substituição parcial à água de amassamento ou nitrogênio líquido. Ajuste a temperatura de lançamento acima.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"f\">\n        <label class=\"chk\" style=\"margin-bottom:2px\"><input type=\"checkbox\" id=\"posRefr\"> Pós-resfriamento por serpentina<\u002Flabel>\n        <div class=\"hint\">Tubulação embutida com circulação de água. Reduz o pico de temperatura entre 8 °C e 20 °C conforme o espaçamento adotado.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"f\" id=\"serpWrap\" style=\"display:none\">\n        <label>Redução prevista pela serpentina <span class=\"u\">°C<\u002Fspan><\u002Flabel>\n        <input type=\"number\" id=\"serpDT\" value=\"12\" step=\"1\" min=\"3\" max=\"25\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card collapsed\" data-card=\"\">\n    <div class=\"card-h\"><span class=\"idx\">06<\u002Fspan><h3>Restrição e parâmetros avançados<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n    <div class=\"card-b\">\n      <div class=\"f\">\n        <label>Grau de restrição externa K<sub>R<\u002Fsub><\u002Flabel>\n        <select id=\"KR\">\n          <option value=\"0.20\">0,20 — peça isolada, base deslizante ou lona dupla<\u002Foption>\n          <option value=\"0.35\">0,35 — bloco sobre estacas, restrição baixa<\u002Foption>\n          <option value=\"0.50\" selected=\"\">0,50 — restrição moderada (caso usual)<\u002Foption>\n          <option value=\"0.70\">0,70 — concretagem contra estrutura antiga rígida<\u002Foption>\n          <option value=\"0.90\">0,90 — engastamento severo em rocha ou maciço<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n      <div class=\"grid2\">\n        <div class=\"f\"><label>Relaxação por fluência K<sub>f<\u002Fsub><\u002Flabel><input type=\"number\" id=\"Kf\" value=\"0.55\" step=\"0.05\" min=\"0.3\" max=\"1\"><\u002Fdiv>\n        <div class=\"f\"><label>Auto-restrição R<sub>int<\u002Fsub><\u002Flabel><input type=\"number\" id=\"Rself\" value=\"0.50\" step=\"0.05\" min=\"0.2\" max=\"1\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"grid3\">\n        <div class=\"f\"><label>k <span class=\"u\">W/m·K<\u002Fspan><\u002Flabel><input type=\"number\" id=\"condK\" value=\"2.6\" step=\"0.1\" min=\"1.5\" max=\"4\"><\u002Fdiv>\n        <div class=\"f\"><label>ρ <span class=\"u\">kg/m³<\u002Fspan><\u002Flabel><input type=\"number\" id=\"rho\" value=\"2400\" step=\"25\" min=\"2100\" max=\"2700\"><\u002Fdiv>\n        <div class=\"f\"><label>c <span class=\"u\">J/kg·K<\u002Fspan><\u002Flabel><input type=\"number\" id=\"cp\" value=\"1000\" step=\"10\" min=\"850\" max=\"1200\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"grid2\">\n        <div class=\"f\"><label>H<sub>u<\u002Fsub> do cimento <span class=\"u\">J/g<\u002Fspan><\u002Flabel><input type=\"number\" id=\"Hu\" value=\"370\" step=\"5\" min=\"150\" max=\"550\"><\u002Fdiv>\n        <div class=\"f\"><label>Gradiente admissível <span class=\"u\">°C<\u002Fspan><\u002Flabel><input type=\"number\" id=\"gradLim\" value=\"20\" step=\"1\" min=\"10\" max=\"35\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"grid2\">\n        <div class=\"f\"><label>τ hidratação <span class=\"u\">h<\u002Fspan><\u002Flabel><input type=\"number\" id=\"tau\" value=\"16\" step=\"1\" min=\"5\" max=\"40\"><\u002Fdiv>\n        <div class=\"f\"><label>β hidratação<\u002Flabel><input type=\"number\" id=\"betaH\" value=\"0.86\" step=\"0.02\" min=\"0.4\" max=\"1.4\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\">Os parâmetros H<sub>u<\u002Fsub>, τ e β são preenchidos pelo tipo de cimento escolhido. Substitua-os pelos valores do ensaio de calorimetria semiadiabática quando houver.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Faside>\n\n<!-- ============== RESULTADOS ============== -->\n<main>\n  <div class=\"tabs\">\n    <button class=\"tab on\" data-pane=\"p1\">Diagnóstico<\u002Fbutton>\n    <button class=\"tab\" data-pane=\"p2\">Evolução<\u002Fbutton>\n    <button class=\"tab\" data-pane=\"pg\">Gelo e pré-resfriamento<\u002Fbutton>\n    <button class=\"tab\" data-pane=\"p3\">Medidas<\u002Fbutton>\n    <button class=\"tab\" data-pane=\"p4\">Cenários<\u002Fbutton>\n    <button class=\"tab\" data-pane=\"p5\">Memória de cálculo<\u002Fbutton>\n    <button class=\"tab\" data-pane=\"p6\">Projetos<\u002Fbutton>\n  <\u002Fdiv>\n\n  <section class=\"pane on\" id=\"p1\">\n    <div id=\"verdictBox\"><\u002Fdiv>\n    <div class=\"slab\">\n      <div class=\"slab-h\">\n        <span class=\"eyebrow\">Assinatura<\u002Fspan>\n        <h3>Corte térmico da peça<\u002Fh3>\n        <button class=\"playbtn\" id=\"btnPlay\">▶ Animar<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"slab-body\">\n        <div class=\"slab-canvas-wrap\"><canvas id=\"cutCanvas\" width=\"1000\" height=\"300\"><\u002Fcanvas><\u002Fdiv>\n        <div class=\"scrub\">\n          <input type=\"range\" id=\"scrub\" min=\"0\" max=\"100\" value=\"0\">\n          <span class=\"rd\">Idade <b id=\"rdIdade\">0,00<\u002Fb> d · núcleo <b id=\"rdNucleo\">—<\u002Fb> °C · superfície <b id=\"rdSup\">—<\u002Fb> °C · Δ <b id=\"rdGrad\">—<\u002Fb> °C<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ramp\"><span id=\"rampMin\">—<\u002Fspan><div class=\"bar\"><\u002Fdiv><span id=\"rampMax\">—<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"resumoTab\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"pane\" id=\"p2\">\n    <div class=\"chart\">\n      <div class=\"chart-h\"><h3>Temperatura ao longo do tempo<\u002Fh3><p>Núcleo, superfície e ambiente durante a hidratação e o resfriamento.<\u002Fp><\u002Fdiv>\n      <div class=\"chart-b\"><canvas id=\"chTemp\" width=\"1000\" height=\"380\"><\u002Fcanvas><\u002Fdiv>\n      <div class=\"legend\">\n        <span><i style=\"background:#c9560f\"><\u002Fi>Núcleo<\u002Fspan>\n        <span><i style=\"background:#0d7690\"><\u002Fi>Superfície<\u002Fspan>\n        <span><i style=\"background:#8fa1b1\"><\u002Fi>Média da peça<\u002Fspan>\n        <span><i style=\"background:#a9b5c0\"><\u002Fi>Ambiente<\u002Fspan>\n        <span><i style=\"background:#bb3025\"><\u002Fi>Limite 70 °C (etringita tardia)<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"chart\">\n      <div class=\"chart-h\"><h3>Gradiente interno núcleo–superfície<\u002Fh3><p>Diferença térmica que provoca fissuras superficiais de mapa.<\u002Fp><\u002Fdiv>\n      <div class=\"chart-b\"><canvas id=\"chGrad\" width=\"1000\" height=\"290\"><\u002Fcanvas><\u002Fdiv>\n      <div class=\"legend\">\n        <span><i style=\"background:#c9560f\"><\u002Fi>Gradiente calculado<\u002Fspan>\n        <span><i style=\"background:#bb3025\"><\u002Fi>Gradiente admissível<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"chart\">\n      <div class=\"chart-h\"><h3>Tensão de tração × resistência disponível<\u002Fh3><p>A fissura ocorre quando a curva de tensão cruza a de resistência.<\u002Fp><\u002Fdiv>\n      <div class=\"chart-b\"><canvas id=\"chTens\" width=\"1000\" height=\"340\"><\u002Fcanvas><\u002Fdiv>\n      <div class=\"legend\">\n        <span><i style=\"background:#c9560f\"><\u002Fi>Tensão superficial (gradiente)<\u002Fspan>\n        <span><i style=\"background:#7e3aa3\"><\u002Fi>Tensão passante (restrição)<\u002Fspan>\n        <span><i style=\"background:#1a7549\"><\u002Fi>f<sub>ct<\u002Fsub> disponível na idade<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <section class=\"pane\" id=\"pg\">\n    <div class=\"infobar\">Cada grau a menos na temperatura de lançamento vale aproximadamente um grau a menos no pico do núcleo. O gelo entra <b>em substituição<\u002Fb> a parte da água de amassamento, nunca em adição: a água de fusão conta integralmente na relação a/c.<\u002Fdiv>\n    <div class=\"ice-wrap\">\n      <div class=\"ice-panel\">\n        <div class=\"card-h\"><span class=\"idx\">G<\u002Fspan><h3>Dados do traço e da central<\u002Fh3><\u002Fdiv>\n        <div class=\"card-b\">\n          <div class=\"f\">\n            <label>Massa total de agregados <span class=\"u\">kg/m³<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"gAgr\" value=\"1830\" step=\"10\" min=\"1200\" max=\"2200\">\n            <div class=\"auto\"><span>estimada por ρ − cimento − água<\u002Fspan><button type=\"button\" id=\"gEstAgr\">recalcular<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"grid2\">\n            <div class=\"f\"><label>Temp. agregados <span class=\"u\">°C<\u002Fspan><\u002Flabel><input type=\"number\" id=\"gTa\" value=\"30\" step=\"1\" min=\"0\" max=\"60\"><\u002Fdiv>\n            <div class=\"f\"><label>Temp. cimento <span class=\"u\">°C<\u002Fspan><\u002Flabel><input type=\"number\" id=\"gTc\" value=\"45\" step=\"1\" min=\"10\" max=\"90\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"hint\" style=\"font-size:11px;color:var(--txt3);margin:-4px 0 11px\">Cimento recém-produzido chega ao silo entre 50 °C e 70 °C. Meça antes de adotar o valor padrão.<\u002Fdiv>\n          <div class=\"grid2\">\n            <div class=\"f\"><label>Temp. água <span class=\"u\">°C<\u002Fspan><\u002Flabel><input type=\"number\" id=\"gTw\" value=\"25\" step=\"1\" min=\"0\" max=\"45\"><\u002Fdiv>\n            <div class=\"f\"><label>Umidade livre agreg. <span class=\"u\">%<\u002Fspan><\u002Flabel><input type=\"number\" id=\"gUmid\" value=\"2.0\" step=\"0.5\" min=\"0\" max=\"8\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"grid2\">\n            <div class=\"f\"><label>Temp. do gelo <span class=\"u\">°C<\u002Fspan><\u002Flabel><input type=\"number\" id=\"gTi\" value=\"-5\" step=\"1\" min=\"-25\" max=\"0\"><\u002Fdiv>\n            <div class=\"f\"><label>Substituição máx. <span class=\"u\">% da água<\u002Fspan><\u002Flabel><input type=\"number\" id=\"gFmax\" value=\"75\" step=\"5\" min=\"10\" max=\"100\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"f\">\n            <label>Ganho no transporte e lançamento <span class=\"u\">°C<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"gGanho\" value=\"2\" step=\"0.5\" min=\"0\" max=\"10\">\n            <div class=\"hint\">Aquecimento entre a saída do misturador e o lançamento na fôrma, por atrito no tambor e insolação do caminhão.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"f\">\n            <label>Temperatura-alvo no lançamento <span class=\"u\">°C<\u002Fspan><\u002Flabel>\n            <input type=\"number\" id=\"gAlvo\" value=\"20\" step=\"1\" min=\"5\" max=\"35\">\n          <\u002Fdiv>\n          <div class=\"grid2\">\n            <div class=\"f\"><label>Volume do caminhão <span class=\"u\">m³<\u002Fspan><\u002Flabel><input type=\"number\" id=\"gCam\" value=\"8\" step=\"1\" min=\"3\" max=\"12\"><\u002Fdiv>\n            <div class=\"f\"><label>Preço do gelo <span class=\"u\">R$/kg<\u002Fspan><\u002Flabel><input type=\"number\" id=\"gPreco\" value=\"1.20\" step=\"0.05\" min=\"0\" max=\"20\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"hint\" style=\"font-size:11px;color:var(--txt3);margin-top:-4px\">Preço apenas referencial. Cote gelo em escamas na região da obra e inclua a composição no orçamento antes de licitar.<\u002Fdiv>\n          <button class=\"btn btn-p\" id=\"btnGelo\" style=\"width:100%;margin-top:12px\">Calcular dosagem de gelo<\u002Fbutton>\n          <button class=\"btn\" id=\"btnAplicaGelo\" style=\"width:100%;margin-top:7px\">Aplicar temperatura ao cálculo térmico<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div><div id=\"iceBox\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"pane\" id=\"p3\"><div id=\"recBox\"><\u002Fdiv><\u002Fsection>\n\n  <section class=\"pane\" id=\"p4\">\n    <div class=\"infobar\">Cada cenário reexecuta a simulação completa alterando uma única variável de projeto. Compare o efeito real de cada medida antes de especificá-la.<\u002Fdiv>\n    <button class=\"btn btn-p\" id=\"btnCenarios\" style=\"margin-bottom:14px\">Rodar comparação de cenários<\u002Fbutton>\n    <div id=\"scenBox\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"pane\" id=\"p5\"><div class=\"mem\" id=\"memBox\"><\u002Fdiv><\u002Fsection>\n\n  <section class=\"pane\" id=\"p6\">\n    <div class=\"infobar\">Os projetos ficam gravados apenas neste navegador e neste dispositivo. Para levar um estudo a outro computador, use <b>Exportar JSON<\u002Fb>.<\u002Fdiv>\n    <div id=\"projBox\"><\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fdiv>\n\n<footer class=\"foot\">\n  <p><b>TermoMassa<\u002Fb> — verificação de fissuração de origem térmica em peças de concreto massa, segundo ABNT NBR 6118, NBR 14931, NBR 16697 e ACI 207.1R / 207.2R.<\u002Fp>\n  <p style=\"margin-top:6px\">Ferramenta de pré-dimensionamento e triagem. O modelo é unidimensional e não substitui análise por elementos finitos, ensaio de calorimetria semiadiabática do traço real nem instrumentação da peça com termopares. A responsabilidade técnica pelo plano de concretagem permanece do engenheiro responsável.<\u002Fp>\n<\u002Ffooter>\n<div class=\"toast\" id=\"toast\"><\u002Fdiv>\n<script>\n\"use strict\";\n/* ================================================================\n   TermoMassa — verificação de fissuração térmica em concreto massa\n   Arquivo único, sem dependências externas.\n   ================================================================ */\n\n/* ---------------- 1. Bases de dados ---------------- */\n\n// Hu = calor total de hidratação (J/g de cimento); tau/beta = modelo de hidratação\n// s = coeficiente de crescimento de resistência (NBR 6118 / fib MC)\nconst CIMENTOS = {\n  'CP I-32':          { Hu:420, tau:14, beta:0.90, s:0.25, txt
