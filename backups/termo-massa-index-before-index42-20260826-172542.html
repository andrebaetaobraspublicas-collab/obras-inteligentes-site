:'Portland comum. Maior liberação de calor entre os cimentos correntes.' },\n  'CP II-E-32':       { Hu:370, tau:16, beta:0.86, s:0.25, txt:'Composto com escória (6% a 34%). Boa disponibilidade no mercado brasileiro.' },\n  'CP II-F-32':       { Hu:400, tau:14, beta:0.90, s:0.25, txt:'Composto com fíler calcário. Calor próximo ao do CP I.' },\n  'CP II-Z-32':       { Hu:375, tau:16, beta:0.85, s:0.25, txt:'Composto com pozolana (6% a 14%).' },\n  'CP III-40':        { Hu:315, tau:21, beta:0.75, s:0.38, txt:'Alto-forno, 35% a 70% de escória. Primeira escolha para concreto massa.' },\n  'CP IV-32':         { Hu:330, tau:19, beta:0.78, s:0.38, txt:'Pozolânico, 15% a 50% de material pozolânico. Boa alternativa ao CP III.' },\n  'CP V-ARI':         { Hu:450, tau:10, beta:1.00, s:0.20, txt:'Alta resistência inicial. Contraindicado em peças massivas.' },\n  'BC — baixo calor': { Hu:260, tau:24, beta:0.70, s:0.38, txt:'Sufixo BC da NBR 16697: calor ≤ 260 J/g às 41 h. Especificação ideal, exige consulta prévia ao fornecedor.' }\n};\n\n// alfaE conforme NBR 6118 item 8.2.8; at = coef. de dilatação térmica (1e-6/°C)\nconst AGREGADOS = {\n  'Basalto / diabásio':   { alfaE:1.2, at:8.0,  txt:'Menor dilatação térmica: reduz diretamente a tensão gerada.' },\n  'Granito / gnaisse':    { alfaE:1.0, at:10.0, txt:'Comportamento médio. Valor de referência da NBR 6118.' },\n  'Calcário':             { alfaE:0.9, at:7.5,  txt:'Menor dilatação térmica do grupo. Excelente para concreto massa.' },\n  'Arenito':              { alfaE:0.7, at:11.5, txt:'Módulo mais baixo (favorável), dilatação mais alta (desfavorável).' },\n  'Quartzito / seixo':    { alfaE:1.0, at:12.5, txt:'Maior dilatação térmica: eleva a tensão em cerca de 25% frente ao calcário.' }\n};\n\n// coeficiente de troca térmica superficial equivalente (W/m²·K)\nconst PROTECOES = {\n  'Face exposta, com vento':      25.0,\n  'Face exposta, sem vento':      12.0,\n  'Forma metálica':               18.0,\n  'Forma de madeira 18 mm':        5.5,\n  'Forma de madeira 25 mm':        4.2,\n  'Lona plástica sobre a peça':    9.0,\n  \"Cura úmida com lâmina d'água\": 30.0,\n  'Areia úmida 100 mm':            3.5,\n  'Manta térmica 25 mm':           2.2,\n  'Manta térmica 50 mm':           1.3,\n  'Face contra o solo':            1.8,\n  'Face contra concreto antigo':   2.5\n};\n\nconst R_GAS = 8.314, EA = 33500, T_REF = 20;\nconst LIM_DEF = 70;   // temperatura máxima antes de risco de etringita tardia (DEF)\n\n/* ---------------- 2. Funções normativas ---------------- */\n\nfunction betaCC(t, s){ return t <= 0 ? 0 : Math.exp(s * (1 - Math.sqrt(28/t))); }\n\nfunction Eci28(fck, alfaE){                      // NBR 6118 - 8.2.8, MPa\n  return fck <= 50 ? alfaE*5600*Math.sqrt(fck)\n                   : alfaE*21500*Math.pow(fck/10 + 1.25, 1/3);\n}\nfunction EciT(fck, alfaE, t, s){ return Eci28(fck,alfaE) * Math.sqrt(betaCC(t,s)); }\n\nfunction fctm(fck){                              // NBR 6118 - 8.2.5, MPa\n  return fck <= 50 ? 0.3*Math.pow(fck,2/3) : 2.12*Math.log(1+0.11*fck);\n}\nfunction fctT(fck, t, s){ return fctm(fck) * betaCC(t,s); }\n\nfunction alfaUlt(ac){ return Math.min(1, 1.031*ac/(0.194+ac)); }   // Mills\n\n/* espessura equivalente 2V/A — faces confinadas com peso 0,30 */\nfunction espEquiv(a, b, c, baseSolo, latConf){\n  const V = a*b*c, w = 0.30;\n  let A = a*b;                       // topo sempre trocando\n  A += a*b * (baseSolo ? w : 1);     // base\n  A += 2*a*c * (latConf ? w : 1);\n  A += 2*b*c * (latConf ? w : 1);\n  return A > 0 ? 2*V/A : Math.min(a,b,c);\n}\n\n/* ---------------- 3. Simulação térmica 1D ---------------- */\n\nfunction simular(p){\n  const L  = Math.max(0.10, p.eEq);\n  const N  = Math.max(11, Math.min(41, 2*Math.round(L/0.08) + 1));\n  const dx = L/(N-1);\n  const k  = p.k, rc = p.rho*p.cp, ad = k/rc;\n\n  const hMax = Math.max(p.hTopo, p.hBase, p.hTopo2);\n  let dt = Math.min(0.35*dx*dx/ad, 0.8*(rc*dx/2)/(hMax + k/dx), 300);\n\n  const tFim = p.dias*86400, nSteps = Math.ceil(tFim/dt);\n  const T = new Float64Array(N).fill(p.Tlanc);\n  const te = new Float64Array(N), alf = new Float64Array(N), Tn = new Float64Array(N);\n  const q = new Float64Array(N);\n\n  const Qtot = p.C * p.Hu * 1000 * (1 - p.scm/100);   // J/m³\n  const serie = [];\n  const passo = Math.max(1, Math.floor(nSteps/700));\n\n  let TmaxN = p.Tlanc, tTmaxN = 0, TmedMax = p.Tlanc, tTmedMax = 0;\n\n  for(let st = 0; st <= nSteps; st++){\n    const tD = st*dt/86400;\n    const hT = tD < p.tdesf ? p.hTopo : p.hTopo2;\n    const hB = p.hBase;\n    const Tamb = p.Tamb + p.ampl*Math.sin(2*Math.PI*(tD - 0.35));\n\n    for(let i=0;i<N;i++){\n      const fA = Math.exp(-(EA/R_GAS)*(1/(T[i]+273.15) - 1/(T_REF+273.15)));\n      te[i] += (dt/3600)*fA;\n      const aN = te[i] > 0 ? p.alfaU*Math.exp(-Math.pow(p.tau/te[i], p.betaH)) : 0;\n      q[i] = Qtot*Math.max(0, aN - alf[i])/dt;\n      alf[i] = aN;\n    }\n    for(let i=1;i<N-1;i++)\n      Tn[i] = T[i] + dt*(ad*(T[i+1]-2*T[i]+T[i-1])/(dx*dx) + q[i]/rc);\n    Tn[0]   = T[0]   + (dt/(rc*dx/2))*(hT*(Tamb-T[0])   + k*(T[1]-T[0])/dx     + q[0]*dx/2);\n    Tn[N-1] = T[N-1] + (dt/(rc*dx/2))*(hB*(Tamb-T[N-1]) + k*(T[N-2]-T[N-1])/dx + q[N-1]*dx/2);\n    T.set(Tn);\n\n    let iM = 0; for(let i=1;i<N;i++) if(T[i] > T[iM]) iM = i;\n    const Tc = T[iM], Ts = Math.min(T[0], T[N-1]);\n    let Tm = 0; for(let i=0;i<N;i++) Tm += T[i]; Tm /= N;\n\n    if(Tc > TmaxN){ TmaxN = Tc; tTmaxN = tD; }\n    if(Tm > TmedMax){ TmedMax = Tm; tTmedMax = tD; }\n\n    if(st % passo === 0 || st === nSteps){\n      serie.push({ d:tD, Tc:Tc, Ts:Ts, Tm:Tm, Ta:Tamb, grad:Tc-Ts,\n                   te:te[iM], perfil:Array.from(T) });\n    }\n  }\n  // pós-resfriamento por serpentina: abatimento do pico\n  return { serie, TmaxN, tTmaxN, TmedMax, tTmedMax, N, dx, dt, alfaFinal:alf[Math.floor(N/2)] };\n}\n\n/* ---------------- 4. Verificação de fissuração ---------------- */\n\nfunction verificar(sim, p){\n  const at = p.at*1e-6;\n  const dados = [];\n  let IRsup = 0, tSup = 0, sSup = 0;\n  let IRres = 0, tRes = 0, sRes = 0;\n  let gradMax = 0, tGradMax = 0;\n\n  for(const s of sim.serie){\n    const tEq = Math.max(s.te/24, 0.05);\n    const E  = EciT(p.fck, p.alfaE, tEq, p.s);\n    const ft = fctT(p.fck, tEq, p.s);\n\n    const ssup = p.Kf * p.Rself * E * at * Math.max(0, s.grad);\n    const irs  = ft > 0.05 ? ssup/ft : 0;\n\n    const dTr  = s.d >= sim.tTmedMax ? Math.max(0, sim.TmedMax - Math.max(s.Tm, p.Tmin)) : 0;\n    const sres = p.Kf * p.KR * E * at * dTr;\n    const irr  = ft > 0.05 ? sres/ft : 0;\n\n    if(irs > IRsup){ IRsup = irs; tSup = s.d; sSup = ssup; }\n    if(irr > IRres){ IRres = irr; tRes = s.d; sRes = sres; }\n    if(s.grad > gradMax){ gradMax = s.grad; tGradMax = s.d; }\n\n    dados.push({ d:s.d, Tc:s.Tc, Ts:s.Ts, Tm:s.Tm, Ta:s.Ta, grad:s.grad,\n                 te:s.te, E:E, ft:ft, sSup:ssup, sRes:sres, IRs:irs, IRr:irr });\n  }\n\n  // resfriamento residual de longo prazo, com o concreto já maduro\n  const dTfinal = Math.max(0, sim.TmedMax - p.Tmin);\n  const E28  = EciT(p.fck, p.alfaE, 28, p.s);\n  const ft28 = fctT(p.fck, 28, p.s);\n  const sResFinal = p.Kf * p.KR * E28 * at * dTfinal;\n  const IRresFinal = sResFinal/ft28;\n  if(IRresFinal > IRres){ IRres = IRresFinal; sRes = sResFinal; tRes = sim.serie[sim.serie.length-1].d; }\n\n  // variação térmica admissível (retroanálise, IR = 1,0)\n  const dTadmPass = ft28 / (p.Kf * p.KR * E28 * at);\n  const dTadmSup  = ft28 / (p.Kf * p.Rself * E28 * at);\n\n  return { dados, IRsup, tSup, sSup, IRres, tRes, sRes,\n           gradMax, tGradMax, dTfinal, dTadmPass, dTadmSup, ft28, E28 };\n}\n<\u002Fscript>\n<script>\n/* ---------------- 5. Utilidades de interface ---------------- */\nconst $ = id => document.getElementById(id);\nconst nf = (v, d=1) => (isFinite(v) ? v : 0).toLocaleString('pt-BR',{minimumFractionDigits:d, maximumFractionDigits:d});\nfunction toast(msg){\n  const t = $('toast'); t.textContent = msg; t.classList.add('on');\n  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 2600);\n}\nfunction fill(sel, obj, def){\n  const el = $(sel); el.innerHTML = '';\n  Object.keys(obj).forEach(k=>{\n    const o = document.createElement('option'); o.value = k; o.textContent = k;\n    if(k === def) o.selected = true; el.appendChild(o);\n  });\n}\n\nfill('cimento', CIMENTOS, 'CP II-E-32');\nfill('agregado', AGREGADOS, 'Granito / gnaisse');\nfill('protTopo', PROTECOES, 'Lona plástica sobre a peça');\nfill('protTopo2', PROTECOES, 'Face exposta, sem vento');\nfill('protBase', PROTECOES, 'Face contra o solo');\n$('dataConc').valueAsDate = new Date();\n\ndocument.querySelectorAll('[data-card] .card-h').forEach(h=>{\n  h.addEventListener('click', ()=> h.parentElement.classList.toggle('collapsed'));\n});\ndocument.querySelectorAll('.tab').forEach(t=>{\n  t.addEventListener('click', ()=>{\n    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));\n    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));\n    t.classList.add('on'); $(t.dataset.pane).classList.add('on');\n    if(t.dataset.pane === 'p2') redesenharGraficos();\n  });\n});\n\n/* ---------------- 6. Vínculos automáticos entre campos ---------------- */\nlet eEqManual = false;\n\nfunction atualizarGeometria(){\n  const a = +$('dimA').value, b = +$('dimB').value, c = +$('dimC').value;\n  $('volume').value = (a*b*c).toFixed(2);\n  if(!eEqManual){\n    $('eEq').value = espEquiv(a, b, c, $('fBase').checked, $('fLat').checked).toFixed(3);\n  }\n}\nfunction aplicarCimento(){\n  const c = CIMENTOS[$('cimento').value];\n  $('Hu').value = c.Hu; $('tau').value = c.tau; $('betaH').value = c.beta;\n  $('cimHint').textContent = c.txt;\n}\nfunction aplicarAgregado(){\n  const a = AGREGADOS[$('agregado').value];\n  $('agHint').textContent = a.txt + ` · α_E = ${nf(a.alfaE,1)} · α_t = ${nf(a.at,1)}×10⁻⁶/°C`;\n}\nfunction estimarTraco(){\n  const fck = +$('fck').value, sl = +$('slump').value;\n  const agua = 178 + 3.6*(sl - 8);\n  const tab = {20:0.60, 25:0.55, 30:0.50, 35:0.46, 40:0.43, 45:0.40, 50:0.38};\n  const ac = tab[fck] ?? 0.50;\n  $('ac').value = ac.toFixed(2);\n  $('consumo').value = Math.round(agua/ac/5)*5;\n  toast('Traço estimado a partir do f_ck e do abatimento');\n}\n\n['dimA','dimB','dimC','fBase','fLat'].forEach(id=>$(id).addEventListener('input', atualizarGeometria));\n$('cimento').addEventListener('change', aplicarCimento);\n$('agregado').addEventListener('change', aplicarAgregado);\n$('btnEstTraco').addEventListener('click', estimarTraco);\n$('editEeq').addEventListener('click', ()=>{\n  eEqManual = !eEqManual;\n  $('eEq').readOnly = !eEqManual;\n  $('editEeq').textContent = eEqManual ? 'voltar ao cálculo automático' : 'editar manualmente';\n  if(!eEqManual) atualizarGeometria();\n});\n$('posRefr').addEventListener('change', e=>{ $('serpWrap').style.display = e.target.checked ? '' : 'none'; });\n\natualizarGeometria(); aplicarCimento(); aplicarAgregado();\n\n/* ---------------- 7. Coleta de parâmetros ---------------- */\nfunction coletar(){\n  const cim = CIMENTOS[$('cimento').value], ag = AGREGADOS[$('agregado').value];\n  return {\n    obra:$('obra').value, peca:$('peca').value, dataConc:$('dataConc').value, resp:$('resp').value,\n    tipoPeca:$('tipoPeca').value, dimA:+$('dimA').value, dimB:+$('dimB').value, dimC:+$('dimC').value,\n    baseSolo:$('fBase').checked, latConf:$('fLat').checked,\n    eEq:+$('eEq').value, volume:+$('volume').value,\n    fck:+$('fck').value, slump:+$('slump').value,\n    cimento:$('cimento').value, C:+$('consumo').value, ac:+$('ac').value, scm:+$('scm').value,\n    agregado:$('agregado').value, alfaE:ag.alfaE, at:ag.at, s:cim.s,\n    Hu:+$('Hu').value, tau:+$('tau').value, betaH:+$('betaH').value, alfaU:alfaUlt(+$('ac').value),\n    Tamb:+$('tamb').value, ampl:+$('ampl').value, Tlanc:+$('tlanc').value, ur:+$('ur').value, Tmin:+$('tmin').value,\n    protTopo:$('protTopo').value, protTopo2:$('protTopo2').value, protBase:$('protBase').value,\n    hTopo:PROTECOES[$('protTopo').value], hTopo2:PROTECOES[$('protTopo2').value], hBase:PROTECOES[$('protBase').value],\n    tdesf:+$('tdesf').value, dias:+$('dias').value,\n    preRefr:$('preRefr').checked, posRefr:$('posRefr').checked, serpDT:+$('serpDT').value,\n    KR:+$('KR').value, Kf:+$('Kf').value, Rself:+$('Rself').value,\n    k:+$('condK').value, rho:+$('rho').value, cp:+$('cp').value, gradLim:+$('gradLim').value\n  };\n}\nfunction aplicar(p){\n  Object.entries({obra:'obra',peca:'peca',dataConc:'dataConc',resp:'resp',tipoPeca:'tipoPeca',\n    dimA:'dimA',dimB:'dimB',dimC:'dimC',fck:'fck',slump:'slump',cimento:'cimento',\n    agregado:'agregado',tamb:'Tamb',ampl:'ampl',tlanc:'Tlanc',ur:'ur',tmin:'Tmin',\n    protTopo:'protTopo',protTopo2:'protTopo2',protBase:'protBase',tdesf:'tdesf',dias:'dias',\n    KR:'KR',Kf:'Kf',Rself:'Rself',condK:'k',rho:'rho',cp:'cp',gradLim:'gradLim',\n    consumo:'C',ac:'ac',scm:'scm',Hu:'Hu',tau:'tau',betaH:'betaH',serpDT:'serpDT'\n  }).forEach(([el,key])=>{ if($(el) && p[key] !== undefined) $(el).value = p[key]; });\n  $('fBase').checked = !!p.baseSolo; $('fLat').checked = !!p.latConf;\n  $('preRefr').checked = !!p.preRefr; $('posRefr').checked = !!p.posRefr;\n  $('serpWrap').style.display = p.posRefr ? '' : 'none';\n  aplicarCimento(); aplicarAgregado(); atualizarGeometria();\n  if(p.Hu) $('Hu').value = p.Hu;\n}\n\n/* ---------------- 8. Execução ---------------- */\nlet R = null;   // { p, sim, v }\n\nfunction executar(p){\n  const sim = simular(p);\n  if(p.posRefr){                       // abatimento do pico pela serpentina\n    const f = Math.max(0, 1 - p.serpDT/Math.max(1, sim.TmaxN - p.Tlanc));\n    sim.serie.forEach(s=>{\n      s.Tc = p.Tlanc + (s.Tc-p.Tlanc)*f; s.Ts = p.Tlanc + (s.Ts-p.Tlanc)*f;\n      s.Tm = p.Tlanc + (s.Tm-p.Tlanc)*f; s.grad = s.Tc - s.Ts;\n      s.perfil = s.perfil.map(t => p.Tlanc + (t-p.Tlanc)*f);\n    });\n    sim.TmaxN = p.Tlanc + (sim.TmaxN-p.Tlanc)*f;\n    sim.TmedMax = p.Tlanc + (sim.TmedMax-p.Tlanc)*f;\n  }\n  return { p, sim, v: verificar(sim, p) };\n}\n\nfunction calcular(){\n  const p = coletar();\n  const av = validar(p);\n  R = executar(p);\n  renderDiagnostico(av);\n  renderRecomendacoes();\n  renderMemoria();\n  redesenharGraficos();\n  prepararCorte();\n  toast('Cálculo concluído');\n}\n\nfunction validar(p){\n  const w = [];\n  if(p.eEq < 0.30) w.push('Espessura equivalente abaixo de 0,30 m: a peça dificilmente se comporta como concreto massa e o modelo perde significado.');\n  if(p.Tlanc < p.Tamb - 2) w.push('Temperatura de lançamento abaixo da ambiente sem pré-resfriamento marcado. Confirme a hipótese.');\n  if(p.C > 500) w.push('Consumo de cimento acima de 500 kg/m³ é atípico em peça massiva e eleva muito o calor liberado.');\n  if(p.tdesf > p.dias) w.push('Idade de desforma maior que o período simulado: a condição pós-desforma não será avaliada.');\n  if(p.Tmin > p.Tamb) w.push('Temperatura mínima de serviço maior que a ambiente média. Verifique o dado.');\n  return w;\n}\n\n/* ---------------- 9. Diagnóstico ---------------- */\nfunction classe(ir){ return ir < 0.60 ? 'ok' : ir < 0.90 ? 'warn' : 'bad'; }\nfunction rotulo(ir){ return ir < 0.60 ? 'Aceitável' : ir < 0.90 ? 'Atenção' : 'Crítico'; }\n\nfunction renderDiagnostico(avisos){\n  const {p, sim, v} = R;\n  const irMax = Math.max(v.IRsup, v.IRres);\n  const cls = classe(irMax);\n  const gradOk = v.gradMax <= p.gradLim;\n  const defOk = sim.TmaxN <= LIM_DEF;\n\n  let titulo, sub;\n  if(cls === 'bad'){\n    titulo = 'Fissuração térmica provável sem medidas adicionais';\n    sub = 'A tensão calculada supera ou se aproxima muito da resistência à tração disponível. Adote as medidas da aba Medidas antes de liberar a concretagem.';\n  } else if(cls === 'warn'){\n    titulo = 'Risco moderado — margem de segurança pequena';\n    sub = 'A peça fica próxima do limite. Especifique ao menos uma medida mitigadora e instrumente a peça com termopares.';\n  } else {\n    titulo = 'Risco baixo com as condições especificadas';\n    sub = 'As tensões térmicas ficam confortavelmente abaixo da resistência disponível. Mantenha as condições de cura previstas.';\n  }\n\n  const tag = {ok:'var(--ok)', warn:'var(--warn)', bad:'var(--bad)'}[cls];\n\n  let html = '';\n  avisos.forEach(a=> html += `<div class=\"warnbar\">${a}<\u002Fdiv>`);\n  if(!defOk) html += `<div class=\"warnbar\"><b>Temperatura de pico de ${nf(sim.TmaxN)} °C.<\u002Fb> Acima de ${LIM_DEF} °C há risco de formação de etringita tardia (DEF), patologia expansiva de manifestação lenta e sem reparo economicamente viável. Reduza o pico obrigatoriamente.<\u002Fdiv>`;\n  if(!gradOk) html += `<div class=\"warnbar\">Gradiente máximo de ${nf(v.gradMax)} °C supera o admissível de ${nf(p.gradLim,0)} °C adotado. Esperam-se fissuras superficiais em mapa nas faces desprotegidas.<\u002Fdiv>`;\n\n  html += `\n  <div class=\"verdict\">\n    <div class=\"verdict-h\">\n      <span class=\"lamp ${cls}\"><\u002Fspan>\n      <div><div class=\"verdict-t\">${titulo}<\u002Fdiv><div class=\"verdict-s\">${sub}<\u002Fdiv><\u002Fdiv>\n      <span class=\"verdict-tag\" style=\"color:${tag}\">IR = ${nf(irMax,2)}<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"kpis\">\n      <div class=\"kpi\"><div class=\"k\">Pico no núcleo<\u002Fdiv><div class=\"v ${defOk?'c-ember':'c-bad'}\">${nf(sim.TmaxN)}<small>°C<\u002Fsmall><\u002Fdiv><div class=\"n\">aos ${nf(sim.tTmaxN,2)} dias · elevação de ${nf(sim.TmaxN-p.Tlanc)} °C<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi\"><div class=\"k\">Gradiente máximo<\u002Fdiv><div class=\"v ${gradOk?'c-cool':'c-bad'}\">${nf(v.gradMax)}<small>°C<\u002Fsmall><\u002Fdiv><div class=\"n\">aos ${nf(v.tGradMax,2)} dias · limite ${nf(p.gradLim,0)} °C<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi\"><div class=\"k\">IR superficial<\u002Fdiv><div class=\"v c-${classe(v.IRsup)}\">${nf(v.IRsup,2)}<\u002Fdiv><div class=\"n\">${rotulo(v.IRsup)} · σ = ${nf(v.sSup,2)} MPa<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi\"><div class=\"k\">IR passante<\u002Fdiv><div class=\"v c-${classe(v.IRres)}\">${nf(v.IRres,2)}<\u002Fdiv><div class=\"n\">${rotulo(v.IRres)} · σ = ${nf(v.sRes,2)} MPa<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi\"><div class=\"k\">Queda térmica total<\u002Fdiv><div class=\"v\">${nf(v.dTfinal)}<small>°C<\u002Fsmall><\u002Fdiv><div class=\"n\">admissível ${nf(v.dTadmPass)} °C para IR = 1,0<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi\"><div class=\"k\">f<sub>ct<\u002Fsub> aos 28 dias<\u002Fdiv><div class=\"v c-cool\">${nf(v.ft28,2)}<small>MPa<\u002Fsmall><\u002Fdiv><div class=\"n\">E<sub>ci<\u002Fsub> = ${nf(v.E28/1000,1)} GPa<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n  $('verdictBox').innerHTML = html;\n\n  // tabela-resumo\n  const marcos = [0.5,1,2,3,5,7,10,14,21,28].filter(d=>d <= p.dias);\n  let linhas = '';\n  marcos.forEach(d=>{\n    const r = v.dados.reduce((a,b)=> Math.abs(b.d-d) < Math.abs(a.d-d) ? b : a);\n    linhas += `<tr><td class=\"num\">${nf(d,1)}<\u002Ftd><td class=\"num\">${nf(r.Tc)}<\u002Ftd><td class=\"num\">${nf(r.Ts)}<\u002Ftd>\n      <td class=\"num\" style=\"color:${r.grad>p.gradLim?'var(--bad)':'inherit'}\">${nf(r.grad)}<\u002Ftd>\n      <td class=\"num\">${nf(r.ft,2)}<\u002Ftd><td class=\"num\">${nf(r.sSup,2)}<\u002Ftd><td class=\"num\">${nf(r.sRes,2)}<\u002Ftd>\n      <td class=\"num\" style=\"color:var(--${classe(Math.max(r.IRs,r.IRr))==='ok'?'ok':classe(Math.max(r.IRs,r.IRr))==='warn'?'warn':'bad'})\">${nf(Math.max(r.IRs,r.IRr),2)}<\u002Ftd><\u002Ftr>`;\n  });\n  $('resumoTab').innerHTML = `\n  <div class=\"chart\"><div class=\"chart-h\"><h3>Quadro de verificação por idade<\u002Fh3>\n    <p>${p.peca||'Peça'} — ${p.obra||'obra não identificada'} · e<sub>eq<\u002Fsub> = ${nf(p.eEq,2)} m · ${p.cimento} · ${p.C} kg/m³<\u002Fp><\u002Fdiv>\n    <table><thead><tr>\n      <th class=\"num\">Idade<br>dias<\u002Fth><th class=\"num\">Núcleo<br>°C<\u002Fth><th class=\"num\">Superf.<br>°C<\u002Fth>\n      <th class=\"num\">Δ<br>°C<\u002Fth><th class=\"num\">f<sub>ct<\u002Fsub><br>MPa<\u002Fth>\n      <th class=\"num\">σ superf.<br>MPa<\u002Fth><th class=\"num\">σ passante<br>MPa<\u002Fth><th class=\"num\">IR<\u002Fth>\n    <\u002Ftr><\u002Fthead><tbody>${linhas}<\u002Ftbody><\u002Ftable><\u002Fdiv>`;\n}\n\n/* ---------------- 10. Escala de cor isotérmica ---------------- */\nconst RAMP = [[28,74,143],[46,163,184],[67,176,106],[216,194,46],[242,118,46],[211,50,39]];\nfunction cor(t, tmin, tmax){\n  const x = Math.max(0, Math.min(1, (t-tmin)/Math.max(0.1, tmax-tmin)));\n  const seg = x*(RAMP.length-1), i = Math.min(RAMP.length-2, Math.floor(seg)), f = seg-i;\n  const c = RAMP[i].map((v,j)=> Math.round(v + (RAMP[i+1][j]-v)*f));\n  return `rgb(${c[0]},${c[1]},${c[2]})`;\n}\n\n/* ---------------- 11. Corte térmico (elemento assinatura) ---------------- */\nlet animId = null;\n\nfunction prepararCorte(){\n  $('scrub').max = R.sim.serie.length - 1;\n  $('scrub').value = 0;\n  const ts = R.sim.serie.flatMap(s=>[s.Tc, s.Ts]);\n  R.tmin = Math.floor(Math.min(...ts, R.p.Tamb) - 1);\n  R.tmax = Math.ceil(Math.max(...ts) + 1);\n  $('rampMin').textContent = R.tmin + ' °C';\n  $('rampMax').textContent = R.tmax + ' °C';\n  desenharCorte(0);\n}\n\nfunction desenharCorte(idx){\n  if(!R) return;\n  const cv = $('cutCanvas'), ctx = cv.getContext('2d');\n  const dpr = Math.min(2, window.devicePixelRatio || 1);\n  const W = 1000, H = 300;\n  cv.width = W*dpr; cv.height = H*dpr; cv.style.height = 'auto';\n  ctx.setTransform(dpr,0,0,dpr,0,0);\n  ctx.clearRect(0,0,W,H);\n\n  const s = R.sim.serie[idx], perfil = s.perfil, N = perfil.length;\n  const x0 = 78, x1 = 560, y0 = 44, y1 = 262;\n  const hBand = (y1-y0)/N;\n\n  // faixas isotérmicas\n  for(let i=0;i<N;i++){\n    ctx.fillStyle = cor(perfil[i], R.tmin, R.tmax);\n    ctx.fillRect(x0, y0 + i*hBand, x1-x0, hBand + 0.6);\n  }\n  ctx.strokeStyle = '#c2ccd6'; ctx.lineWidth = 1;\n  ctx.strokeRect(x0+.5, y0+.5, x1-x0-1, y1-y0-1);\n\n  // hachura de solo na base, se houver\n  if(R.p.baseSolo){\n    ctx.strokeStyle = '#a9b5c0'; ctx.lineWidth = 1;\n    for(let x = x0; x < x1; x += 9){\n      ctx.beginPath(); ctx.moveTo(x, y1+2); ctx.lineTo(x+7, y1+11); ctx.stroke();\n    }\n  }\n\n  ctx.font = '600 10px ui-monospace,monospace'; ctx.fillStyle = '#4d6070';\n  ctx.textAlign = 'left';\n  ctx.fillText('FACE SUPERIOR — ' + R.p.protTopo2.toUpperCase(), x0, y0-11);\n  ctx.fillText(R.p.baseSolo ? 'BASE CONFINADA' : 'FACE INFERIOR', x0, y1+24);\n\n  // escala de profundidade\n  ctx.textAlign = 'right'; ctx.fillStyle = '#7d8fa0';\n  [0,0.25,0.5,0.75,1].forEach(f=>{\n    const y = y0 + f*(y1-y0);\n    ctx.fillText(nf(f*R.p.eEq,2)+' m', x0-8, y+3);\n    ctx.strokeStyle = '#c2ccd6'; ctx.beginPath(); ctx.moveTo(x0-5,y); ctx.lineTo(x0,y); ctx.stroke();\n  });\n\n  // marcação do núcleo\n  let iM = 0; for(let i=1;i<N;i++) if(perfil[i] > perfil[iM]) iM = i;\n  const yN = y0 + (iM+0.5)*hBand;\n  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.4;\n  ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(x0,yN); ctx.lineTo(x1,yN); ctx.stroke(); ctx.setLineDash([]);\n  const txtN = 'NÚCLEO ' + nf(perfil[iM]) + ' °C';\n  ctx.font = '700 10px ui-monospace,monospace'; ctx.textAlign = 'left';\n  const wN = ctx.measureText(txtN).width;\n  ctx.fillStyle = 'rgba(23,33,43,.86)';\n  ctx.fillRect(x0+6, yN-17, wN+11, 15);\n  ctx.fillStyle = '#fff'; ctx.fillText(txtN, x0+11, yN-6);\n\n  // perfil de temperatura ao lado, alinhado à profundidade\n  const px0 = 640, px1 = 968;\n  ctx.strokeStyle = '#c2ccd6'; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.moveTo(px0, y0); ctx.lineTo(px0, y1); ctx.lineTo(px1, y1); ctx.stroke();\n  ctx.font = '10px ui-monospace,monospace'; ctx.fillStyle = '#7d8fa0'; ctx.textAlign = 'center';\n  for(let t = Math.ceil(R.tmin/10)*10; t <= R.tmax; t += 10){\n    const x = px0 + (t-R.tmin)/(R.tmax-R.tmin)*(px1-px0);\n    ctx.fillText(t+'', x, y1+15);\n    ctx.strokeStyle = '#eaeff4'; ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();\n  }\n  ctx.textAlign = 'left'; ctx.fillStyle = '#4d6070'; ctx.font = '600 10px ui-monospace,monospace';\n  ctx.fillText('PERFIL DE TEMPERATURA NA ESPESSURA (°C)', px0, y0-11);\n\n  // linha do ambiente\n  const xa = px0 + (s.Ta-R.tmin)/(R.tmax-R.tmin)*(px1-px0);\n  ctx.strokeStyle = '#a9b5c0'; ctx.setLineDash([3,3]);\n  ctx.beginPath(); ctx.moveTo(xa,y0); ctx.lineTo(xa,y1); ctx.stroke(); ctx.setLineDash([]);\n  ctx.fillStyle = '#7d8fa0'; ctx.font = '9px ui-monospace,monospace';\n  ctx.fillText('amb', xa+3, y0+10);\n\n  ctx.beginPath();\n  for(let i=0;i<N;i++){\n    const x = px0 + (perfil[i]-R.tmin)/(R.tmax-R.tmin)*(px1-px0);\n    const y = y0 + (i+0.5)*hBand;\n    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);\n  }\n  ctx.strokeStyle = '#c9560f'; ctx.lineWidth = 2.2; ctx.stroke();\n  for(let i=0;i<N;i+=Math.ceil(N/9)){\n    const x = px0 + (perfil[i]-R.tmin)/(R.tmax-R.tmin)*(px1-px0);\n    const y = y0 + (i+0.5)*hBand;\n    ctx.fillStyle = cor(perfil[i], R.tmin, R.tmax);\n    ctx.beginPath(); ctx.arc(x,y,3,0,7); ctx.fill();\n    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4; ctx.stroke();\n  }\n\n  $('rdIdade').textContent = nf(s.d,2);\n  $('rdNucleo').textContent = nf(s.Tc);\n  $('rdSup').textContent = nf(s.Ts);\n  $('rdGrad').textContent = nf(s.grad);\n}\n\n$('scrub').addEventListener('input', e=> desenharCorte(+e.target.value));\n$('btnPlay').addEventListener('click', ()=>{\n  if(!R) return toast('Rode o cálculo primeiro');\n  if(animId){ clearInterval(animId); animId = null; $('btnPlay').textContent = '▶ Animar'; return; }\n  $('btnPlay').textContent = '❚❚ Pausar';\n  let i = +$('scrub').value;\n  animId = setInterval(()=>{\n    i = (i+2) % R.sim.serie.length;\n    $('scrub').value = i; desenharCorte(i);\n  }, 40);\n});\n<\u002Fscript>\n<script>\n/* ---------------- 12. Gráficos em canvas ---------------- */\nfunction plot(cv, series, opt){\n  const ctx = cv.getContext('2d');\n  const dpr = Math.min(2, window.devicePixelRatio || 1);\n  const W = cv.getAttribute('width')|0, H = cv.getAttribute('height')|0;\n  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);\n  ctx.clearRect(0,0,W,H);\n\n  const m = {l:58, r:18, t:16, b:34};\n  const x0 = m.l, x1 = W-m.r, y0 = m.t, y1 = H-m.b;\n  const todos = series.flatMap(s=>s.pts.map(p=>p.y)).filter(isFinite);\n  let ymin = opt.ymin ?? Math.min(...todos), ymax = opt.ymax ?? Math.max(...todos);\n  const pad = (ymax-ymin)*0.08 || 1; ymin -= pad; ymax += pad;\n  if(opt.zero) ymin = Math.min(0, ymin);\n  const xmax = opt.xmax;\n\n  const X = v => x0 + v/xmax*(x1-x0);\n  const Y = v => y1 - (v-ymin)/(ymax-ymin)*(y1-y0);\n\n  // grade\n  ctx.font = '10px ui-monospace,monospace'; ctx.strokeStyle = '#e4eaf0'; ctx.lineWidth = 1;\n  ctx.fillStyle = '#7d8fa0';\n  const nY = 5;\n  for(let i=0;i<=nY;i++){\n    const v = ymin + (ymax-ymin)*i/nY, y = Y(v);\n    ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();\n    ctx.textAlign = 'right'; ctx.fillText(nf(v, ymax-ymin < 6 ? 1 : 0), x0-7, y+3);\n  }\n  const passoX = xmax <= 10 ? 1 : xmax <= 30 ? 3 : xmax <= 60 ? 7 : 14;\n  ctx.textAlign = 'center';\n  for(let d=0; d<=xmax; d+=passoX){\n    const x = X(d);\n    ctx.strokeStyle = '#eff3f6'; ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();\n    ctx.fillStyle = '#7d8fa0'; ctx.fillText(d, x, y1+15);\n  }\n  ctx.fillStyle = '#7d8fa0'; ctx.fillText(opt.xl || 'idade (dias)', (x0+x1)/2, H-4);\n  ctx.save(); ctx.translate(13,(y0+y1)/2); ctx.rotate(-Math.PI/2);\n  ctx.textAlign = 'center'; ctx.fillText(opt.yl, 0, 0); ctx.restore();\n\n  // marcações horizontais\n  (opt.hlines||[]).forEach(h=>{\n    if(h.v < ymin || h.v > ymax) return;\n    const y = Y(h.v);\n    ctx.strokeStyle = h.c; ctx.lineWidth = 1.3; ctx.setLineDash([6,4]);\n    ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke(); ctx.setLineDash([]);\n    ctx.fillStyle = h.c; ctx.textAlign = 'left'; ctx.font = '600 10px ui-monospace,monospace';\n    ctx.fillText(h.t, x0+6, y-5);\n  });\n\n  (opt.vlines||[]).forEach(h=>{\n    if(h.v < 0 || h.v > xmax) return;\n    const x = X(h.v);\n    ctx.strokeStyle = h.c; ctx.lineWidth = 1.3; ctx.setLineDash([5,4]);\n    ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke(); ctx.setLineDash([]);\n    ctx.save(); ctx.translate(x-5, y0+6); ctx.rotate(Math.PI/2);\n    ctx.fillStyle = h.c; ctx.textAlign = 'left'; ctx.font = '600 10px ui-monospace,monospace';\n    ctx.fillText(h.t, 0, 0); ctx.restore();\n  });\n\n  // séries\n  series.forEach(s=>{\n    ctx.beginPath();\n    s.pts.forEach((p,i)=> i ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y)));\n    ctx.strokeStyle = s.c; ctx.lineWidth = s.w || 2;\n    if(s.dash) ctx.setLineDash(s.dash);\n    ctx.lineJoin = 'round'; ctx.stroke(); ctx.setLineDash([]);\n    if(s.fill){\n      ctx.lineTo(X(s.pts[s.pts.length-1].x), Y(ymin)); ctx.lineTo(X(s.pts[0].x), Y(ymin)); ctx.closePath();\n      ctx.fillStyle = s.fill; ctx.fill();\n    }\n  });\n\n  // ponto de máximo destacado\n  if(opt.marcarMax){\n    const s = series[0];\n    const mx = s.pts.reduce((a,b)=> b.y > a.y ? b : a);\n    ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(X(mx.x), Y(mx.y), 4, 0, 7); ctx.fill();\n    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.8; ctx.stroke();\n    ctx.fillStyle = '#17212b'; ctx.font = '700 11px ui-monospace,monospace'; ctx.textAlign = 'left';\n    ctx.fillText(nf(mx.y)+opt.un+' @ '+nf(mx.x,1)+'d', X(mx.x)+8, Y(mx.y)-7);\n  }\n}\n\nfunction redesenharGraficos(){\n  if(!R) return;\n  const {p, sim, v} = R, d = v.dados, xmax = p.dias;\n\n  plot($('chTemp'), [\n    {pts:d.map(r=>({x:r.d,y:r.Tc})), c:'#c9560f', w:2.4},\n    {pts:d.map(r=>({x:r.d,y:r.Ts})), c:'#0d7690', w:2},\n    {pts:d.map(r=>({x:r.d,y:r.Tm})), c:'#8fa1b1', w:1.4, dash:[5,4]},\n    {pts:d.map(r=>({x:r.d,y:r.Ta})), c:'#a9b5c0', w:1.2}\n  ], {xmax, yl:'temperatura (°C)', un:' °C', marcarMax:true,\n      hlines:[{v:LIM_DEF, c:'#bb3025', t:'70 °C — risco de etringita tardia'}]});\n\n  plot($('chGrad'), [\n    {pts:d.map(r=>({x:r.d,y:r.grad})), c:'#c9560f', w:2.4, fill:'rgba(201,86,15,.09)'}\n  ], {xmax, yl:'Δ núcleo − superfície (°C)', un:' °C', zero:true, marcarMax:true,\n      hlines:[{v:p.gradLim, c:'#bb3025', t:`admissível ${nf(p.gradLim,0)} °C`}]});\n\n  plot($('chTens'), [\n    {pts:d.map(r=>({x:r.d,y:r.sSup})), c:'#c9560f', w:2.2},\n    {pts:d.map(r=>({x:r.d,y:r.sRes})), c:'#7e3aa3', w:2.2},\n    {pts:d.map(r=>({x:r.d,y:r.ft})),  c:'#1a7549', w:2.4, dash:[6,4]}\n  ], {xmax, yl:'tensão / resistência (MPa)', un:' MPa', zero:true});\n}\nwindow.addEventListener('resize', ()=>{ redesenharGraficos(); if(R) desenharCorte(+$('scrub').value); });\n\n/* ---------------- 13. Medidas recomendadas ---------------- */\nfunction rec(nivel, pill, titulo, texto, fonte){\n  return `<div class=\"rec ${nivel}\"><h4>${titulo}<span class=\"pill\">${pill}<\u002Fspan><\u002Fh4><p>${texto}<\u002Fp>${fonte?`<div class=\"src\">${fonte}<\u002Fdiv>`:''}<\u002Fdiv>`;\n}\n\nfunction renderRecomendacoes(){\n  const {p, sim, v} = R;\n  const irMax = Math.max(v.IRsup, v.IRres);\n  let h = '';\n\n  h += `<div class=\"infobar\">As medidas abaixo são geradas a partir dos resultados desta peça e estão ordenadas por efeito esperado. Use a aba <b>Cenários<\u002Fb> para quantificar cada uma antes de especificar.<\u002Fdiv>`;\n\n  if(sim.TmaxN > LIM_DEF){\n    h += rec('crit','obrigatório','Reduzir o pico de temperatura abaixo de 70 °C',\n      `O pico calculado é de <b>${nf(sim.TmaxN)} °C<\u002Fb>. Acima de 70 °C parte da etringita primária se decompõe e pode se reformar anos depois, gerando expansão interna e fissuração generalizada. Não existe reparo economicamente viável para esta patologia: ela se resolve na fase de projeto do plano de concretagem. Combine troca de cimento, redução de consumo e pré-resfriamento até levar o pico abaixo do limite.`,\n      'ACI 201.2R · ACI 207.2R · NBR 12655');\n  }\n\n  if(v.IRres >= 0.90){\n    h += rec('crit','fissura passante','Limitar a queda térmica ou liberar a restrição',\n      `A queda de <b>${nf(v.dTfinal)} °C<\u002Fb> entre o pico e a temperatura de serviço, com grau de restrição K<sub>R<\u002Fsub> = ${nf(p.KR,2)}, gera <b>${nf(v.sRes,2)} MPa<\u002Fb> de tração contra ${nf(v.ft28,2)} MPa de resistência. A queda admissível é de aproximadamente <b>${nf(v.dTadmPass)} °C<\u002Fb>. Fissura passante compromete a estanqueidade e a durabilidade da peça, não apenas o aspecto. Caminhos: reduzir o pico, reduzir a restrição da base (dupla camada de lona ou areia sob a peça) ou prever juntas de contração com armadura de controle dimensionada para abertura limitada.`,\n      'ACI 207.2R · NBR 6118 item 17.3.3');\n  } else if(v.IRres >= 0.60){\n    h += rec('att','fissura passante','Margem estreita contra fissura passante',\n      `IR = ${nf(v.IRres,2)}. A queda térmica de ${nf(v.dTfinal)} °C está próxima do admissível de ${nf(v.dTadmPass)} °C. Reduzir a temperatura de lançamento em 5 °C costuma resolver, com custo baixo.`, null);\n  }\n\n  if(v.gradMax > p.gradLim){\n    h += rec('crit','fissura superficial','Proteger as faces para conter o gradiente interno',\n      `Gradiente máximo de <b>${nf(v.gradMax)} °C<\u002Fb> aos ${nf(v.tGradMax,2)} dias, contra ${nf(p.gradLim,0)} °C admitidos. O núcleo dilata e a superfície, mais fria e já rígida, é tracionada: surgem fissuras de mapa nas faces. A medida é isolar a superfície para que ela acompanhe o núcleo — manta térmica, areia úmida ou manutenção das formas de madeira até o resfriamento. <b>Atenção ao efeito colateral:<\u002Fb> isolar a face eleva o pico no núcleo e piora a fissura passante. Verifique as duas verificações juntas no comparador de cenários.`,\n      'ACI 207.1R · NBR 14931 item 10.2');\n  }\n\n  // medidas de projeto, por ordem de eficácia\n  const cim = CIMENTOS[p.cimento];\n  if(cim.Hu > 340){\n    h += rec('info','traço','Trocar por cimento de baixo calor de hidratação',\n      `O ${p.cimento} libera ${cim.Hu} J/g. Um CP III-40 (315 J/g) ou um cimento com sufixo BC (≤ 260 J/g pela NBR 16697) reduz o pico proporcionalmente. É a medida de maior efeito e menor custo, mas exige consulta antecipada ao fornecedor e revisão do cronograma, porque a resistência inicial cai — a desforma tende a atrasar.`,\n      'NBR 16697 · ACI 207.1R');\n  }\n  if(p.C > 320){\n    h += rec('info','traço','Reduzir o consumo de cimento',\n      `Consumo atual de ${p.C} kg/m³. Cada 100 kg/m³ a menos reduz a elevação adiabática em cerca de ${nf(100*p.Hu*1000*p.alfaU/(p.rho*p.cp))} °C. Em peça massiva, especificar a resistência aos 90 dias em vez dos 28 dias permite reduzir consumo mantendo o f<sub>ck<\u002Fsub> de projeto. Substituição parcial por escória ou cinza volante tem o mesmo efeito. Registre a alteração de idade de controle no memorial e no edital, porque muda o critério de aceitação do lote.`,\n      'NBR 12655 item 4.1 · NBR 6118 item 12.3');\n  }\n  if(p.Tlanc > 22){\n    h += rec('info','execução','Pré-resfriar o concreto no lançamento',\n      `Lançamento a ${nf(p.Tlanc,0)} °C. Cada grau a menos no lançamento reduz aproximadamente um grau no pico do núcleo — é a medida de melhor relação entre efeito e custo. Abra a aba <b>Gelo e pré-resfriamento<\u002Fb> para dimensionar a substituição de água por gelo em escamas, ver quanto vale resfriar os agregados e obter a quantidade por caminhão. Meta usual: lançar entre 18 °C e 22 °C.`,\n      'ACI 305R item 5.2 · ACI 207.4R · NBR 14931 item 8.3');\n  }\n  if(p.eEq > 1.2){\n    h += rec('info','plano de concretagem','Concretar em camadas de menor espessura',\n      `Espessura equivalente de ${nf(p.eEq,2)} m. Dividir a peça em camadas com intervalo suficiente para dissipação reduz o calor acumulado, mas cria juntas frias que precisam ser tratadas e elevam a restrição da camada nova sobre a antiga — o que piora a fissura passante. Só adote com verificação específica da interface.`,\n      'ACI 207.1R · NBR 14931 item 9.4');\n  }\n  if(!p.posRefr && p.eEq > 1.5 && sim.TmaxN > 60){\n    h += rec('info','execução','Avaliar pós-resfriamento por serpentina',\n      `Tubulação embutida de PEAD com circulação de água controlada. Reduz o pico de 8 °C a 20 °C conforme o espaçamento. É a medida mais cara e a que mais impacta o cronograma, mas é a única que garante controle em peças acima de 2 m. Exige monitoramento por termopares e limitação do gradiente entre a água e o concreto, sob pena de fissurar em torno dos tubos.`,\n      'ACI 207.4R');\n  }\n  const ag = AGREGADOS[p.agregado];\n  if(ag.at > 9){\n    h += rec('info','traço','Considerar agregado de menor dilatação térmica',\n      `O ${p.agregado} tem α<sub>t<\u002Fsub> = ${nf(ag.at,1)}×10⁻⁶/°C. Trocar por calcário (7,5) ou basalto (8,0) reduz a tensão térmica em até ${nf((1-7.5/ag.at)*100,0)}% para a mesma variação de temperatura, sem alterar nada mais no traço. Depende da disponibilidade regional e pode não ser exequível.`,\n      'NBR 6118 item 8.2.3');\n  }\n\n  h += rec('good','controle','Instrumentar a peça com termopares',\n    `Nenhum modelo substitui a medição. Instale ao menos três pontos: núcleo geométrico, ponto a 5 cm da face mais exposta e um sensor de ambiente. Registre a cada hora nas primeiras 72 h. Os dados medidos permitem calibrar este modelo para as próximas peças da mesma obra e servem de prova documental em eventual discussão contratual sobre a origem das fissuras.`,\n    'NBR 14931 item 10 · ACI 207.1R');\n\n  if(irMax < 0.60 && sim.TmaxN <= LIM_DEF && v.gradMax <= p.gradLim){\n    h = `<div class=\"rec good\"><h4>Nenhuma medida corretiva necessária<span class=\"pill\">verificado<\u002Fspan><\u002Fh4>\n      <p>As três verificações passaram com folga: pico de ${nf(sim.TmaxN)} °C, gradiente de ${nf(v.gradMax)} °C e IR máximo de ${nf(irMax,2)}. Mantenha as condições de cura especificadas e registre em diário de obra a temperatura de lançamento efetivamente praticada, que é a variável que mais costuma escapar do previsto.<\u002Fp><\u002Fdiv>` + h;\n  }\n  $('recBox').innerHTML = h;\n}\n\n/* ---------------- 14. Memória de cálculo ---------------- */\nfunction renderMemoria(){\n  const {p, sim, v} = R;\n  const dTad = p.C*p.Hu*1000*(1-p.scm/100)*p.alfaU/(p.rho*p.cp);\n  const at = p.at*1e-6;\n  $('memBox').innerHTML = `\n  <h3>1. Identificação<\u002Fh3>\n  <p>Obra: <b>${p.obra||'—'}<\u002Fb> · Peça: <b>${p.peca||'—'}<\u002Fb> · Concretagem: <b>${p.dataConc||'—'}<\u002Fb> · Responsável: <b>${p.resp||'—'}<\u002Fb><\u002Fp>\n  <p>Dimensões ${nf(p.dimA,2)} × ${nf(p.dimB,2)} × ${nf(p.dimC,2)} m · volume ${nf(p.volume,2)} m³.<\u002Fp>\n\n  <h3>2. Espessura equivalente<\u002Fh3>\n  <p>A peça tridimensional é reduzida a uma placa de espessura equivalente pela relação volume/área de troca. Faces contra o solo ou contra concreto antigo entram com peso 0,30, por trocarem pouco calor.<\u002Fp>\n  <div class=\"eq\">e_eq = 2·V / A_troca = 2 · ${nf(p.volume,2)} / A = ${nf(p.eEq,3)} m<\u002Fdiv>\n\n  <h3>3. Calor de hidratação e elevação adiabática<\u002Fh3>\n  <p>O calor liberado por unidade de volume é o produto do consumo de cimento pelo calor total do ligante e pelo grau último de hidratação, limitado pela relação água/cimento (equação de Mills).<\u002Fp>\n  <div class=\"eq\">α_u = 1,031 · (a/c) / (0,194 + a/c) = 1,031 · ${nf(p.ac,2)} / (0,194 + ${nf(p.ac,2)}) = ${nf(p.alfaU,3)}\nQ_total = C · H_u · (1 − adição) · α_u = ${p.C} · ${p.Hu} · ${nf(1-p.scm/100,2)} · ${nf(p.alfaU,3)} = ${nf(p.C*p.Hu*(1-p.scm/100)*p.alfaU/1000,1)} MJ/m³\nΔT_adiab = Q_total / (ρ·c) = ${nf(dTad,1)} °C<\u002Fdiv>\n  <p class=\"note\">Elevação adiabática é o limite teórico, com perda nula de calor. A peça real dissipa parte pelas faces: o modelo calcula o valor efetivo.<\u002Fp>\n\n  <h3>4. Evolução da hidratação<\u002Fh3>\n  <p>Grau de hidratação em função da idade equivalente, com correção de maturidade por Arrhenius (energia de ativação de 33.500 J/mol).<\u002Fp>\n  <div class=\"eq\">α(t_e) = α_u · exp[ −(τ / t_e)^β ]     com τ = ${nf(p.tau,0)} h e β = ${nf(p.betaH,2)}\nt_e = Σ Δt · exp[ −(E_a/R) · (1/T − 1/T_ref) ]     T_ref = 20 °C<\u002Fdiv>\n\n  <h3>5. Campo de temperaturas<\u002Fh3>\n  <p>Equação do calor unidimensional com geração interna, resolvida por diferenças finitas explícitas. Contorno de convecção nas duas faces, com o coeficiente equivalente de cada proteção especificada.<\u002Fp>\n  <div class=\"eq\">ρ·c · ∂T/∂t = k · ∂²T/∂x² + q(t)\nContorno:  −k · ∂T/∂x = h · (T_sup − T_amb)\nMalha: ${sim.N} nós · Δx = ${nf(sim.dx*100,2)} cm · Δt = ${nf(sim.dt,0)} s\nh face superior: ${nf(p.hTopo,1)} W/m²·K até ${nf(p.tdesf,1)} d, depois ${nf(p.hTopo2,1)}\nh face inferior: ${nf(p.hBase,1)} W/m²·K<\u002Fdiv>\n  <p>Resultado: pico no núcleo de <b>${nf(sim.TmaxN,1)} °C<\u002Fb> aos ${nf(sim.tTmaxN,2)} dias, correspondente a ${nf((sim.TmaxN-p.Tlanc)/dTad*100,0)}% da elevação adiabática. Temperatura média máxima da peça de ${nf(sim.TmedMax,1)} °C.<\u002Fp>\n\n  <h3>6. Propriedades mecânicas na idade<\u002Fh3>\n  <p>Crescimento conforme NBR 6118 e fib Model Code, com s = ${nf(p.s,2)} para o cimento adotado.<\u002Fp>\n  <div class=\"eq\">β_cc(t) = exp{ s · [1 − (28/t)^0,5] }\nE_ci(t) = α_E · 5600 · √f_ck · √β_cc(t)     α_E = ${nf(p.alfaE,1)} (${p.agregado})\nf_ct,m(t) = 0,3 · f_ck^(2/3) · β_cc(t)\nAos 28 dias:  E_ci = ${nf(v.E28/1000,1)} GPa   ·   f_ct,m = ${nf(v.ft28,2)} MPa<\u002Fdiv>\n\n  <h3>7. Verificação A — fissuração superficial por gradiente<\u002Fh3>\n  <p>O núcleo quente dilata e é contido pela camada externa, mais fria e já rígida. A tração se concentra na superfície.<\u002Fp>\n  <div class=\"eq\">σ_sup = K_f · R_int · E_ci(t) · α_t · ΔT_gradiente\n       = ${nf(p.Kf,2)} · ${nf(p.Rself,2)} · E · ${nf(p.at,1)}×10⁻⁶ · ΔT\nΔT_máx = ${nf(v.gradMax,1)} °C aos ${nf(v.tGradMax,2)} d   →   σ_sup = ${nf(v.sSup,2)} MPa\nIR_sup = σ_sup / f_ct = ${nf(v.IRsup,2)}   →   ${rotulo(v.IRsup).toUpperCase()}<\u002Fdiv>\n\n  <h3>8. Verificação B — fissuração passante por restrição externa<\u002Fh3>\n  <p>Ao resfriar do pico até a temperatura de serviço, a peça tenta encurtar. A base restringe o movimento e a tração atravessa a seção.<\u002Fp>\n  <div class=\"eq\">σ_res = K_f · K_R · E_ci · α_t · ΔT_resfriamento\nΔT = T_média,máx − T_mín,serviço = ${nf(sim.TmedMax,1)} − ${nf(p.Tmin,1)} = ${nf(v.dTfinal,1)} °C\nσ_res = ${nf(p.Kf,2)} · ${nf(p.KR,2)} · ${nf(v.E28,0)} · ${nf(p.at,1)}×10⁻⁶ · ${nf(v.dTfinal,1)} = ${nf(v.sRes,2)} MPa\nIR_pass = ${nf(v.IRres,2)}   →   ${rotulo(v.IRres).toUpperCase()}\n\nQueda térmica admissível para IR = 1,0:\nΔT_adm = f_ct / (K_f · K_R · E_ci · α_t) = ${nf(v.dTadmPass,1)} °C<\u002Fdiv>\n\n  <h3>9. Critérios de aceitação adotados<\u002Fh3>\n  <p>IR &lt; 0,60 aceitável · 0,60 ≤ IR &lt; 0,90 atenção · IR ≥ 0,90 crítico. Gradiente interno admissível de ${nf(p.gradLim,0)} °C. Pico limitado a ${LIM_DEF} °C para afastar o risco de etringita tardia.<\u002Fp>\n\n  <h3>10. Hipóteses e limitações<\u002Fh3>\n  <p>Modelo unidimensional: a geometria real é representada pela espessura equivalente, o que é adequado para peças com uma dimensão claramente menor que as outras e conservador para peças cúbicas. Propriedades térmicas constantes com a temperatura. Grau de restrição K<sub>R<\u002Fsub> arbitrado pelo projetista, não calculado a partir da rigidez da fundação. Fluência representada por um fator global K<sub>f<\u002Fsub>, sem integração no tempo. Sem consideração de armadura, de fissuração progressiva ou de retração por secagem, que se soma à térmica em idades mais avançadas.<\u002Fp>\n  <p class=\"note\">Ferramenta de triagem e pré-dimensionamento. Para peças de grande responsabilidade, confirme com análise térmica por elementos finitos, ensaio de calorimetria semiadiabática do traço real e instrumentação da peça.<\u002Fp>`;\n}\n\n/* ---------------- 15. Comparador de cenários ---------------- */\nfunction rodarCenarios(){\n  if(!R) return toast('Rode o cálculo primeiro');\n  const base = coletar();\n  const cenarios = [\n    ['Como especificado', x=>x],\n    ['Cimento CP III-40', x=>{ const c=CIMENTOS['CP III-40']; return {...x, cimento:'CP III-40', Hu:c.Hu, tau:c.tau, betaH:c.beta, s:c.s}; }],\n    ['Cimento BC (≤260 J/g)', x=>{ const c=CIMENTOS['BC — baixo calor']; return {...x, cimento:'BC', Hu:c.Hu, tau:c.tau, betaH:c.beta, s:c.s}; }],\n    ['Consumo −15%', x=>({...x, C:Math.round(x.C*0.85)})],\n    ['Lançamento a 18 °C (gelo)', x=>({...x, Tlanc:18})],\n    ['Manta térmica 50 mm', x=>({...x, hTopo:PROTECOES['Manta térmica 50 mm'], hTopo2:PROTECOES['Manta térmica 50 mm']})],\n    ['Serpentina (−12 °C)', x=>({...x, posRefr:true, serpDT:12})],\n    ['Base deslizante (K_R 0,20)', x=>({...x, KR:0.20})],\n    ['Camadas de metade da altura', x=>({...x, eEq:x.eEq/2})]\n  ];\n\n  const res = cenarios.map(([nome, f])=>{\n    const p = f({...base});\n    const r = executar(p);\n    return { nome, p, TmaxN:r.sim.TmaxN, grad:r.v.gradMax,\n             IRs:r.v.IRsup, IRr:r.v.IRres, ir:Math.max(r.v.IRsup, r.v.IRres) };\n  });\n\n  const irBase = res[0].ir;\n  const melhor = res.slice(1).reduce((a,b)=> b.ir < a.ir ? b : a, res[1]);\n\n  let h = `<div class=\"scen-grid\">`;\n  res.forEach((r,i)=>{\n    const cls = classe(r.ir);\n    const delta = i === 0 ? '' : ((r.ir-irBase)/irBase*100);\n    const dTxt = i === 0 ? 'referência'\n      : (delta < -1 ? `<span class=\"c-ok\">${nf(delta,0)}% no IR<\u002Fspan>`\n      : delta > 1 ? `<span class=\"c-bad\">+${nf(delta,0)}% no IR<\u002Fspan>`\n      : 'sem efeito relevante');\n    h += `<div class=\"scen ${r===melhor?'best':''}\">\n      <div class=\"scen-h\"><span class=\"lamp ${cls}\" style=\"width:9px;height:9px;box-shadow:none\"><\u002Fspan><h4>${r.nome}<\u002Fh4><\u002Fdiv>\n      <div class=\"scen-b\">\n        <div class=\"scen-row\"><span>Pico no núcleo<\u002Fspan><span class=\"${r.TmaxN>LIM_DEF?'c-bad':''}\">${nf(r.TmaxN)} °C<\u002Fspan><\u002Fdiv>\n        <div class=\"scen-row\"><span>Gradiente máximo<\u002Fspan><span>${nf(r.grad)} °C<\u002Fspan><\u002Fdiv>\n        <div class=\"scen-row\"><span>IR superficial<\u002Fspan><span class=\"c-${classe(r.IRs)}\">${nf(r.IRs,2)}<\u002Fspan><\u002Fdiv>\n        <div class=\"scen-row\"><span>IR passante<\u002Fspan><span class=\"c-${classe(r.IRr)}\">${nf(r.IRr,2)}<\u002Fspan><\u002Fdiv>\n        <div class=\"scen-row\"><span>Efeito<\u002Fspan><span>${dTxt}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>`;\n  });\n  h += `<\u002Fdiv>`;\n  h += `<div class=\"infobar\" style=\"margin-top:14px\">Nenhuma medida isolada costuma resolver os dois modos de fissuração ao mesmo tempo. Isolar a face reduz o gradiente e piora a fissura passante; reduzir o pico melhora as duas verificações. Combine uma medida de traço com uma de execução e reavalie.<\u002Fdiv>`;\n  $('scenBox').innerHTML = h;\n  toast('Cenários comparados');\n}\n$('btnCenarios').addEventListener('click', rodarCenarios);\n\n/* ---------------- 16. Persistência e exportação ---------------- */\nconst KEY = 'termomassa.projetos.v1';\nconst lerProjetos = ()=>{ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } };\nconst gravarProjetos = a => { try{ localStorage.setItem(KEY, JSON.stringify(a)); }catch(e){ toast('Não foi possível gravar neste navegador'); } };\n\nfunction renderProjetos(){\n  const ps = lerProjetos();\n  if(!ps.length){\n    $('projBox').innerHTML = `<div class=\"empty\"><b>Nenhum projeto salvo ainda<\u002Fb>Preencha os dados da peça, calcule e use <i>Salvar projeto<\u002Fi> para guardar o estudo neste navegador.<\u002Fdiv>`;\n    return;\n  }\n  $('projBox').innerHTML = ps.map((pr,i)=>`\n    <div class=\"proj\">\n      <span class=\"lamp ${pr.cls||'ok'}\" style=\"width:10px;height:10px;box-shadow:none\"><\u002Fspan>\n      <div class=\"pn\"><b>${pr.nome}<\u002Fb><small>${pr.data} · e_eq ${nf(pr.p.eEq,2)} m · ${pr.p.cimento} · pico ${nf(pr.pico||0)} °C · IR ${nf(pr.ir||0,2)}<\u002Fsmall><\u002Fdiv>\n      <button class=\"btn\" data-load=\"${i}\">Abrir<\u002Fbutton>\n      <button class=\"btn\" data-del=\"${i}\">Excluir<\u002Fbutton>\n    <\u002Fdiv>`).join('');\n  $('projBox').querySelectorAll('[data-load]').forEach(b=> b.onclick = ()=>{\n    aplicar(lerProjetos()[+b.dataset.load].p); calcular();\n    document.querySelector('.tab').click(); toast('Projeto carregado');\n  });\n  $('projBox').querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=>{\n    const ps = lerProjetos(); ps.splice(+b.dataset.del,1); gravarProjetos(ps); renderProjetos(); toast('Projeto excluído');\n  });\n}\n\n$('btnSalvar').addEventListener('click', ()=>{\n  if(!R) return toast('Rode o cálculo antes de salvar');\n  const nome = prompt('Nome do estudo:', (R.p.peca || 'Peça') + ' — ' + (R.p.obra || 'obra'));\n  if(!nome) return;\n  const ps = lerProjetos();\n  const ir = Math.max(R.v.IRsup, R.v.IRres);\n  ps.unshift({ nome, data:new Date().toLocaleString('pt-BR'), p:R.p, pico:R.sim.TmaxN, ir, cls:classe(ir) });\n  gravarProjetos(ps.slice(0,60)); renderProjetos(); toast('Projeto salvo neste navegador');\n});\n\n$('btnJson').addEventListener('click', ()=>{\n  if(!R) return toast('Rode o cálculo primeiro');\n  baixar(JSON.stringify({ versao:'TermoMassa 1.0', gerado:new Date().toISOString(), entradas:R.p,\n    resultados:{ TmaxNucleo:R.sim.TmaxN, tPico:R.sim.tTmaxN, TmediaMax:R.sim.TmedMax,\n      gradienteMax:R.v.gradMax, IRsuperficial:R.v.IRsup, IRpassante:R.v.IRres,\n      quedaTermica:R.v.dTfinal, quedaAdmissivel:R.v.dTadmPass, fct28:R.v.ft28, Eci28:R.v.E28 }\n  }, null, 2), 'termomassa.json', 'application/json');\n});\n\n$('btnCsv').addEventListener('click', ()=>{\n  if(!R) return toast('Rode o cálculo primeiro');\n  let csv = 'idade_dias;T_nucleo_C;T_superficie_C;T_media_C;T_ambiente_C;gradiente_C;idade_equiv_h;E_MPa;fct_MPa;sigma_sup_MPa;sigma_pass_MPa;IR_sup;IR_pass\\n';\n  R.v.dados.forEach(r=>{\n    csv += [r.d,r.Tc,r.Ts,r.Tm,r.Ta,r.grad,r.te,r.E,r.ft,r.sSup,r.sRes,r.IRs,r.IRr]\n      .map(x=> (+x).toFixed(4).replace('.',',')).join(';') + '\\n';\n  });\n  baixar('\\ufeff'+csv, 'termomassa_serie.csv', 'text/csv;charset=utf-8');\n});\n\n$('btnPdf').addEventListener('click', ()=>{\n  if(!R) return toast('Rode o cálculo primeiro');\n  document.querySelectorAll('.pane').forEach(x=>x.classList.add('on'));\n  redesenharGraficos(); desenharCorte(+$('scrub').value);\n  setTimeout(()=>window.print(), 200);\n});\n\nfunction baixar(txt, nome, tipo){\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(new Blob([txt], {type:tipo}));\n  a.download = nome; a.click(); URL.revokeObjectURL(a.href);\n  toast('Arquivo gerado: ' + nome);\n}\n\n$('btnNovo').addEventListener('click', ()=>{\n  if(confirm('Limpar todos os campos e voltar aos valores padrão?')) location.reload();\n});\n$('btnCalc').addEventListener('click', calcular);\ndocument.addEventListener('keydown', e=>{\n  if((e.ctrlKey||e.metaKey) && e.key === 'Enter'){ e.preventDefault(); calcular(); }\n});\n<\u002Fscript>\n<script>\n/* ================================================================\n   MÓDULO DE GELO — balanço térmico do concreto fresco\n   Base: ACI 305R (Hot Weather Concreting), item 5.2\n   Calores específicos em kJ/kg·K e calor latente em kJ/kg.\n   ================================================================ */\n\nconst C_SOL = 0.92;    // agregados e cimento\nconst C_AGU = 4.187;   // água\nconst C_GEL = 2.10;    // gelo\nconst L_FUS = 334;     // calor latente de fusão\n\n/* Retorna o balanço completo. A temperatura é LINEAR na massa de gelo,\n   porque o gelo derretido permanece no traço como água: o denominador\n   da equação de mistura não depende de Mi. Isso permite solução exata. */\nfunction balancoGelo(g){\n  const Mwa = g.Magr * g.umid/100;          // água livre trazida pelos agregados\n  const Mseco = g.Magr - Mwa;               // agregado seco\n  const Wtot = g.C * g.ac;                  // água total exigida pelo traço\n  const Wadd = Wtot - Mwa;                  // água a adicionar na central\n  const Mimax = Math.max(0, Wadd) * g.fmax/100;\n\n  const D = C_SOL*(Mseco + g.C) + C_AGU*Wtot;               // capacidade térmica total\n  const T0 = (C_SOL*(Mseco*g.Ta + g.C*g.Tc)\n            + C_AGU*(Mwa*g.Ta + Math.max(0,Wadd)*g.Tw)) / D; // sem gelo\n  const incl = (C_GEL*g.Ti - L_FUS - C_AGU*g.Tw) / D;        // °C por kg de gelo (negativo)\n\n  const alvoMist = g.alvo - g.ganho;                         // alvo na saída do misturador\n  const MiReq = incl < 0 ? (alvoMist - T0)/incl : Infinity;\n  const Mi = Math.max(0, Math.min(MiReq, Mimax));\n\n  const Tmist = T0 + Mi*incl;\n  const Tmin  = T0 + Mimax*incl;\n\n  return {\n    Mwa, Mseco, Wtot, Wadd, Mimax, D, T0, incl, alvoMist,\n    MiReq: Math.max(0, MiReq), Mi,\n    Tmist, Tlanc: Tmist + g.ganho,\n    Tmin, TminLanc: Tmin + g.ganho,\n    viavel: MiReq <= Mimax + 1e-6,\n    desnecessario: MiReq <= 0,\n    aguaFria: Math.max(0, Wadd) - Mi,\n    // sensibilidades (°C de concreto por °C do insumo)\n    sAgr: C_SOL*Mseco/D,\n    sCim: C_SOL*g.C/D,\n    sAgua: C_AGU*Math.max(0, Wadd - Mi)/D,\n    sUmid: C_AGU*Mwa/D,\n    // participação na massa térmica\n    pAgr: C_SOL*Mseco/D, pCim: C_SOL*g.C/D, pAgua: C_AGU*Wtot/D\n  };\n}\n\n/* ---------------- interface do módulo ---------------- */\nfunction estimarAgregados(){\n  const p = coletar();\n  const est = Math.round((p.rho - p.C - p.C*p.ac)/10)*10;\n  $('gAgr').value = est;\n  toast('Agregados estimados por ρ − cimento − água');\n}\n$('gEstAgr').addEventListener('click', ()=>{ estimarAgregados(); calcularGelo(); });\n$('gAlvo').addEventListener('input', ()=>{ if(G) calcularGelo(); });\n\nlet G = null;\n\nfunction coletarGelo(){\n  const p = coletar();\n  return { C:p.C, ac:p.ac, rho:p.rho, volume:p.volume,\n    Magr:+$('gAgr').value, Ta:+$('gTa').value, Tc:+$('gTc').value, Tw:+$('gTw').value,\n    umid:+$('gUmid').value, Ti:+$('gTi').value, fmax:+$('gFmax').value,\n    ganho:+$('gGanho').value, alvo:+$('gAlvo').value,\n    cam:+$('gCam').value, preco:+$('gPreco').value };\n}\n\nfunction calcularGelo(){\n  const g = coletarGelo();\n  const b = balancoGelo(g);\n  G = { g, b };\n\n  let cls, msg;\n  if(b.Wadd <= 0){\n    cls = 'bad';\n    msg = `<b>Os agregados já trazem mais água do que o traço admite.<\u002Fb> A umidade livre de ${nf(b.Mwa,1)} kg/m³ supera os ${nf(b.Wtot,1)} kg/m³ exigidos pela relação a/c de ${nf(g.ac,2)}. Não há água a substituir por gelo. Corrija a umidade dos agregados ou revise o traço antes de prosseguir.`;\n  } else if(b.desnecessario){\n    cls = 'ok';\n    msg = `<b>Gelo dispensável.<\u002Fb> Com os insumos nas temperaturas informadas o concreto já sai a ${nf(b.T0)} °C do misturador e chega à fôrma a ${nf(b.T0 + g.ganho)} °C, abaixo do alvo de ${nf(g.alvo,0)} °C. Registre as temperaturas de recebimento em diário de obra: agregado ao sol muda esse resultado em poucas horas.`;\n  } else if(b.viavel){\n    cls = 'ok';\n    msg = `<b>Alvo atingível só com gelo.<\u002Fb> Substituindo ${nf(b.Mi,1)} kg/m³ da água de amassamento — ${nf(b.Mi/b.Wadd*100,0)}% da água adicionada na central, dentro do limite de ${nf(g.fmax,0)}% — o concreto sai a ${nf(b.Tmist)} °C e é lançado a ${nf(b.Tlanc)} °C. Restam ${nf(b.aguaFria,1)} kg/m³ de água líquida.`;\n  } else {\n    cls = 'warn';\n    const falta = b.alvoMist - b.Tmin;\n    msg = `<b>Gelo sozinho não chega ao alvo.<\u002Fb> Seriam necessários ${nf(b.MiReq,1)} kg/m³, mas o limite de ${nf(g.fmax,0)}% da água permite apenas ${nf(b.Mimax,1)} kg/m³. Com a substituição máxima o lançamento fica em ${nf(b.TminLanc)} °C — faltam ${nf(Math.abs(falta))} °C. Combine com resfriamento dos agregados: cada 10 °C a menos neles vale ${nf(b.sAgr*10)} °C no concreto, e sombrear as pilhas com aspersão intermitente costuma render de 5 °C a 8 °C sem custo de equipamento.`;\n  }\n\n  const total = b.Mi * g.volume;\n  const porCam = b.Mi * g.cam;\n  const custo = total * g.preco;\n\n  let h = `<div class=\"ice-out\">\n    <div class=\"ice-hero\">\n      <div><div class=\"lbl\">Gelo em escamas<\u002Fdiv><div class=\"big c-cool\">${nf(b.Mi,1)}<small>kg/m³<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div class=\"sep\"><\u002Fdiv>\n      <div><div class=\"lbl\">Saída do misturador<\u002Fdiv><div class=\"big\">${nf(b.Tmist)}<small>°C<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div class=\"sep\"><\u002Fdiv>\n      <div><div class=\"lbl\">No lançamento<\u002Fdiv><div class=\"big ${b.Tlanc<=g.alvo+0.2?'c-ok':'c-warn'}\">${nf(b.Tlanc)}<small>°C<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div class=\"sep\"><\u002Fdiv>\n      <div><div class=\"lbl\">Sem nenhum gelo<\u002Fdiv><div class=\"big ${(b.T0+g.ganho)<=g.alvo+0.2?'c-ok':'c-bad'}\">${nf(b.T0+g.ganho)}<small>°C<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ice-msg ${cls}\">${msg}<\u002Fdiv>\n    <table class=\"balance\"><thead><tr>\n      <th>Componente<\u002Fth><th class=\"num\">Massa<br>kg/m³<\u002Fth><th class=\"num\">Temp.<br>°C<\u002Fth>\n      <th class=\"num\">Capac. térmica<br>kJ/K<\u002Fth><th class=\"num\">Participação<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n      <tr><td>Agregados secos<\u002Ftd><td class=\"num\">${nf(b.Mseco,0)}<\u002Ftd><td class=\"num\">${nf(g.Ta,0)}<\u002Ftd><td class=\"num\">${nf(C_SOL*b.Mseco,0)}<\u002Ftd><td class=\"num\">${nf(b.pAgr*100,0)}%<\u002Ftd><\u002Ftr>\n      <tr><td>Água livre nos agregados<\u002Ftd><td class=\"num\">${nf(b.Mwa,1)}<\u002Ftd><td class=\"num\">${nf(g.Ta,0)}<\u002Ftd><td class=\"num\">${nf(C_AGU*b.Mwa,0)}<\u002Ftd><td class=\"num\">${nf(C_AGU*b.Mwa/b.D*100,0)}%<\u002Ftd><\u002Ftr>\n      <tr><td>Cimento<\u002Ftd><td class=\"num\">${nf(g.C,0)}<\u002Ftd><td class=\"num\">${nf(g.Tc,0)}<\u002Ftd><td class=\"num\">${nf(C_SOL*g.C,0)}<\u002Ftd><td class=\"num\">${nf(b.pCim*100,0)}%<\u002Ftd><\u002Ftr>\n      <tr><td>Água adicionada líquida<\u002Ftd><td class=\"num\">${nf(b.aguaFria,1)}<\u002Ftd><td class=\"num\">${nf(g.Tw,0)}<\u002Ftd><td class=\"num\">${nf(C_AGU*b.aguaFria,0)}<\u002Ftd><td class=\"num\">${nf(C_AGU*b.aguaFria/b.D*100,0)}%<\u002Ftd><\u002Ftr>\n      <tr><td>Gelo em substituição<\u002Ftd><td class=\"num\">${nf(b.Mi,1)}<\u002Ftd><td class=\"num\">${nf(g.Ti,0)}<\u002Ftd><td class=\"num\">−${nf(b.Mi*L_FUS,0)} <span style=\"color:var(--txt3)\">latente<\u002Fspan><\u002Ftd><td class=\"num\">—<\u002Ftd><\u002Ftr>\n      <tr class=\"tot\"><td>Água total do traço (a/c ${nf(g.ac,2)})<\u002Ftd><td class=\"num\">${nf(b.Wtot,1)}<\u002Ftd><td class=\"num\">—<\u002Ftd><td class=\"num\">${nf(b.D,0)}<\u002Ftd><td class=\"num\">100%<\u002Ftd><\u002Ftr>\n    <\u002Ftbody><\u002Ftable>\n  <\u002Fdiv>\n\n  <div class=\"ice-out\">\n    <div class=\"chart-h\" style=\"border-bottom:1px solid var(--line)\"><h3>Onde vale a pena investir cada grau<\u002Fh3>\n      <p>Quanto cada insumo desloca a temperatura do concreto. Os agregados dominam por serem 80% da massa.<\u002Fp><\u002Fdiv>\n    <div class=\"sens\">\n      <div><div class=\"sk\">Agregados −10 °C<\u002Fdiv><div class=\"sv c-cool\">−${nf(b.sAgr*10)} °C<\u002Fdiv><div class=\"sn\">sombra e aspersão nas pilhas<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"sk\">Cimento −10 °C<\u002Fdiv><div class=\"sv\">−${nf(b.sCim*10)} °C<\u002Fdiv><div class=\"sn\">estocar antes de usar<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"sk\">Água −10 °C<\u002Fdiv><div class=\"sv\">−${nf(b.sAgua*10)} °C<\u002Fdiv><div class=\"sn\">chiller ou reservatório enterrado<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"sk\">Cada 10 kg de gelo<\u002Fdiv><div class=\"sv c-cool\">−${nf(Math.abs(b.incl)*10)} °C<\u002Fdiv><div class=\"sn\">por m³ de concreto<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ice-out\">\n    <div class=\"chart-h\" style=\"border-bottom:1px solid var(--line)\"><h3>Temperatura de lançamento × dosagem de gelo<\u002Fh3>\n      <p>Relação linear: o gelo derretido permanece como água e não altera a capacidade térmica do traço.<\u002Fp><\u002Fdiv>\n    <div class=\"chart-b\"><canvas id=\"chGelo\" width=\"1000\" height=\"300\"><\u002Fcanvas><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ice-out\">\n    <div class=\"chart-h\" style=\"border-bottom:1px solid var(--line)\"><h3>Logística e custo da concretagem<\u002Fh3>\n      <p>Peça de ${nf(g.volume,1)} m³ · caminhões de ${nf(g.cam,0)} m³ · ${Math.ceil(g.volume/g.cam)} viagens<\u002Fp><\u002Fdiv>\n    <table><tbody>\n      <tr><td>Gelo por caminhão<\u002Ftd><td class=\"num\"><b>${nf(porCam,0)} kg<\u002Fb><\u002Ftd><td style=\"color:var(--txt3);font-size:11.5px\">carregar antes da água, com o tambor girando<\u002Ftd><\u002Ftr>\n      <tr><td>Gelo para a peça inteira<\u002Ftd><td class=\"num\"><b>${nf(total,0)} kg<\u002Fb><\u002Ftd><td style=\"color:var(--txt3);font-size:11.5px\">prever 15% de perda por fusão no transporte e estoque<\u002Ftd><\u002Ftr>\n      <tr><td>Custo estimado do gelo<\u002Ftd><td class=\"num\"><b>R$ ${nf(custo,2)}<\u002Fb><\u002Ftd><td style=\"color:var(--txt3);font-size:11.5px\">a R$ ${nf(g.preco,2)}/kg — cotar na região<\u002Ftd><\u002Ftr>\n      <tr><td>Incidência por m³ de concreto<\u002Ftd><td class=\"num\"><b>R$ ${nf(g.volume>0?custo/g.volume:0,2)}<\u002Fb><\u002Ftd><td style=\"color:var(--txt3);font-size:11.5px\">acrescer à composição unitária do concreto<\u002Ftd><\u002Ftr>\n      <tr><td>Água líquida a dosar<\u002Ftd><td class=\"num\"><b>${nf(b.aguaFria,1)} kg/m³<\u002Fb><\u002Ftd><td style=\"color:var(--txt3);font-size:11.5px\">descontar a umidade dos agregados já medida<\u002Ftd><\u002Ftr>\n    <\u002Ftbody><\u002Ftable>\n  <\u002Fdiv>\n\n  <div class=\"rec info\"><h4>Condições de execução<span class=\"pill\">obrigatório<\u002Fspan><\u002Fh4>\n    <p>O gelo precisa estar <b>totalmente derretido<\u002Fb> ao fim da mistura: qualquer fragmento remanescente vira vazio no concreto endurecido. Use gelo em escamas ou triturado, nunca em barra, e amplie o tempo de mistura em cerca de 30 segundos. Meça a temperatura do concreto em cada caminhão, na chegada, e registre em planilha anexa ao diário de obra — é esse registro que sustenta a aceitação do lote e, se houver litígio sobre fissuras, demonstra que o plano de concretagem foi cumprido. Água de fusão do gelo conta integralmente na relação a/c: se o gelo for <b>adicionado<\u002Fb> em vez de <b>substituir<\u002Fb> a água, o traço perde resistência.<\u002Fp>\n    <div class=\"src\">ACI 305R item 5.2 · ACI 207.4R · NBR 14931 item 8.3 · NBR 12655<\u002Fdiv><\u002Fdiv>`;\n\n  $('iceBox').innerHTML = h;\n\n  // gráfico\n  const xmax = Math.max(b.Mimax*1.15, b.MiReq*1.15, 20);\n  const pts = [];\n  for(let m=0; m<=xmax; m+=xmax/120) pts.push({x:m, y:b.T0 + m*b.incl + g.ganho});\n  plot($('chGelo'), [{pts, c:'#0d7690', w:2.6, fill:'rgba(13,118,144,.08)'}], {\n    xmax, xl:'gelo em substituição à água (kg/m³)', yl:'temperatura no lançamento (°C)', un:' °C',\n    hlines:[{v:g.alvo, c:'#1a7549', t:`alvo ${nf(g.alvo,0)} °C`}],\n    vlines:[{v:b.Mimax, c:'#bb3025', t:`máx. ${nf(g.fmax,0)}% da água`}]\n  });\n}\n\n$('btnGelo').addEventListener('click', calcularGelo);\n$('btnAplicaGelo').addEventListener('click', ()=>{\n  if(!G) calcularGelo();\n  const T = Math.round(G.b.Tlanc*10)/10;\n  $('tlanc').value = T;\n  $('preRefr').checked = G.b.Mi > 0.5;\n  calcular(); calcularGelo();\n  document.querySelector('.tab').click();\n  toast(`Temperatura de lançamento ajustada para ${nf(T)} °C`);\n});\n<\u002Fscript>\n<script>\n/* ---------------- 18. Início ---------------- */\nrenderProjetos();\ncalcular();\nestimarAgregados();\ncalcularGelo();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
