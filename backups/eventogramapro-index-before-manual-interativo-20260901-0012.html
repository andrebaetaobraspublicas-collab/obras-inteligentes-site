document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ize:.66rem;color:#89a9c4}\n.ep-declined{border:1px solid #efb9b52e;background:#d34d4614;border-radius:10px;padding:11px 13px;font-size:.76rem;line-height:1.5;color:#f3c9c5}\n@keyframes epBlink{0%,100%{opacity:1}50%{opacity:.25}}\n@keyframes epFadeIn{from{opacity:0}to{opacity:1}}\n@keyframes epRiseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}\n@media(max-width:760px){.ep-legend{display:none}.ep-hud{padding:18px}}\n<\u002Fstyle>\n\n\n<\u002Fhead>\n<body>\n<div id=\"splash\" class=\"splash epsplash\">\n<div class=\"ep-stage\" id=\"epStage\">\n<canvas id=\"epCanvas\"><\u002Fcanvas>\n<div class=\"ep-vig\"><\u002Fdiv>\n<div class=\"ep-hud\">\n <div class=\"ep-hud-top\">\n  <div class=\"ep-brand\"><div class=\"ep-logo\">EP<\u002Fdiv><div><div class=\"ep-name\">Eventograma<span>Pro<\u002Fspan><\u002Fdiv><div class=\"ep-sub\">Gerador Automático de Eventograma para Edificações<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep-meta\"><div class=\"ep-chip\"><i><\u002Fi>MODELO FEDERADO · IFC 4 · LOD 350<\u002Fdiv><div class=\"ep-note\">carregando motor de eventos · v1.0<\u002Fdiv><\u002Fdiv>\n <\u002Fdiv>\n <div class=\"ep-hud-bottom\">\n  <div class=\"ep-prog\">\n   <div class=\"ep-prog-head\"><span id=\"epPhase\">Fundações, estacas e blocos de coroamento<\u002Fspan><b id=\"epPct\">0%<\u002Fb><\u002Fdiv>\n   <div class=\"ep-bar\"><i id=\"epBar\"><\u002Fi><\u002Fdiv>\n   <div class=\"ep-ticks\" id=\"epTicks\"><\u002Fdiv>\n   <div class=\"ep-stats\"><span>PAVIMENTOS <b id=\"epFloor\">00<\u002Fb>/<span id=\"epTotal\">10<\u002Fspan><\u002Fspan><span>ELEMENTOS <b id=\"epElem\">0<\u002Fb><\u002Fspan><span class=\"ep-dim\">SIMULAÇÃO 4D<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ep-legend\"><div class=\"ep-legend-t\">DISCIPLINAS<\u002Fdiv><div class=\"ep-legend-g\">\n   <span><i style=\"background:#8fa6bd\"><\u002Fi>Estrutura<\u002Fspan><span><i style=\"background:#c3cdd8\"><\u002Fi>Lajes<\u002Fspan>\n   <span><i style=\"background:#58c6e8\"><\u002Fi>Fachada<\u002Fspan><span><i style=\"background:#ef8429\"><\u002Fi>Climatização<\u002Fspan>\n   <span><i style=\"background:#3fa9e0\"><\u002Fi>Hidráulica<\u002Fspan><span><i style=\"background:#f2c94c\"><\u002Fi>Elétrica<\u002Fspan>\n  <\u002Fdiv><\u002Fdiv>\n <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ep-terms\" id=\"epTerms\">\n <div class=\"ep-modal\">\n  <div class=\"ep-modal-h\"><div class=\"ep-ic\">!<\u002Fdiv><div><h1>Aviso legal e termos de uso<\u002Fh1><p>EventogramaPro — Gerador Automático de Eventograma para Edificações · versão 1.0<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div class=\"ep-modal-b\">\n   <p><b>1. Natureza da ferramenta.<\u002Fb> O EventogramaPro produz uma <b>proposta técnica rastreável<\u002Fb> de eventograma a partir do orçamento fornecido pelo usuário. O resultado é instrumento de apoio à decisão e <b>não substitui<\u002Fb> o projeto, o orçamento detalhado, o plano de ataque da obra, o cronograma físico-financeiro nem o juízo técnico do profissional habilitado.<\u002Fp>\n   <p><b>2. Responsabilidade profissional.<\u002Fb> Toda saída do sistema deve ser conferida e validada pelo orçamentista, planejador, projetistas, fiscalização e assessoria jurídica antes de integrar edital, contrato, medição, aditivo ou processo de pagamento. A responsabilidade técnica e administrativa pelo uso permanece integralmente com o usuário e com o órgão ou empresa contratante.<\u002Fp>\n   <p><b>3. Dados de entrada e estimativas.<\u002Fb> A qualidade do eventograma depende da consistência da planilha importada. Quando o orçamento não informa localização física, quantitativos por pavimento, sequência executiva ou caminho crítico, o programa aplica critérios e rateios explícitos, sinalizados como <b>estimativas<\u002Fb>, que exigem revisão.<\u002Fp>\n   <p><b>4. Conformidade normativa.<\u002Fb> Os parâmetros seguem boas práticas de contratação pública e a Lei nº 14.133/2021 e normas correlatas, sem que isso constitua parecer jurídico ou garantia de aceitação por órgãos de controle. A adequação de cada eventograma ao caso concreto é atribuição do usuário.<\u002Fp>\n   <p><b>5. Dados e privacidade.<\u002Fb> A aplicação é executada localmente no navegador. Planilhas, projetos e resultados permanecem no dispositivo do usuário, sem transmissão a servidores. A guarda, o sigilo e o backup das informações — inclusive quanto à LGPD (Lei nº 13.709/2018) — são de responsabilidade do usuário. Limpar os dados do navegador apaga os projetos salvos.<\u002Fp>\n   <p><b>6. Limitação de garantias.<\u002Fb> O software é fornecido \"no estado em que se encontra\", sem garantia de ausência de erros, de aptidão a finalidade específica ou de continuidade. Os autores não respondem por perdas, atrasos, glosas, sanções ou prejuízos decorrentes do uso ou da impossibilidade de uso.<\u002Fp>\n   <p><b>7. Propriedade intelectual.<\u002Fb> É vedada a redistribuição, revenda, descompilação ou incorporação do sistema a outro produto sem autorização escrita do titular. O uso é pessoal e intransferível.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"ep-modal-f\">\n   <label class=\"ep-agree\"><input type=\"checkbox\" id=\"epAgree\"><span>Declaro que li e <b>concordo<\u002Fb> com o aviso legal e os termos de uso, e que os resultados serão validados por profissional habilitado antes de qualquer uso contratual.<\u002Fspan><\u002Flabel>\n   <div class=\"ep-actions\">\n    <button id=\"epAccept\" class=\"ep-btn-ok\" disabled=\"\">Concordar e acessar o sistema<\u002Fbutton>\n    <button id=\"epDecline\" class=\"ep-btn-no\">Não concordo<\u002Fbutton>\n    <span class=\"ep-spacer\"><\u002Fspan><span class=\"ep-stamp\" id=\"epStamp\"><\u002Fspan>\n   <\u002Fdiv>\n   <div class=\"ep-declined\" id=\"epDeclined\" hidden=\"\">O aceite do aviso legal é condição para o acesso. Sem a concordância, o sistema não pode ser utilizado — feche a janela ou marque a declaração acima.<\u002Fdiv>\n  <\u002Fdiv>\n <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"shell\">\n<aside id=\"sidebar\" class=\"sidebar\"><div class=\"brand\"><div class=\"brand-icon\">EP<\u002Fdiv><div><strong>EventogramaPro<\u002Fstrong><small>Edificações · versão 1.0<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n<nav id=\"mainNav\" class=\"nav\">\n<button class=\"active\" data-page=\"dashboard\"><span class=\"ico\">⌂<\u002Fspan><span class=\"lbl\">Visão geral<\u002Fspan><\u002Fbutton>\n<button data-page=\"project\"><span class=\"ico\">▣<\u002Fspan><span class=\"lbl\">Projeto<\u002Fspan><span id=\"badgeProject\" class=\"badge\">1<\u002Fspan><\u002Fbutton>\n<button data-page=\"import\"><span class=\"ico\">⇧<\u002Fspan><span class=\"lbl\">Orçamento<\u002Fspan><span id=\"badgeImport\" class=\"badge\">2<\u002Fspan><\u002Fbutton>\n<button data-page=\"classification\"><span class=\"ico\">⌘<\u002Fspan><span class=\"lbl\">Classificação<\u002Fspan><span id=\"badgeClass\" class=\"badge\">3<\u002Fspan><\u002Fbutton>\n<button data-page=\"preliminary\"><span class=\"ico\">☷<\u002Fspan><span class=\"lbl\">Preliminar<\u002Fspan><span id=\"badgePre\" class=\"badge\">4<\u002Fspan><\u002Fbutton>\n<button data-page=\"diluted\"><span class=\"ico\">↔<\u002Fspan><span class=\"lbl\">Custos diluídos<\u002Fspan><span id=\"badgeDil\" class=\"badge\">5<\u002Fspan><\u002Fbutton>\n<button data-page=\"final\"><span class=\"ico\">✓<\u002Fspan><span class=\"lbl\">Eventograma final<\u002Fspan><span id=\"badgeFinal\" class=\"badge\">6<\u002Fspan><\u002Fbutton>\n<button data-page=\"report\"><span class=\"ico\">▤<\u002Fspan><span class=\"lbl\">Relatório<\u002Fspan><span id=\"badgeReport\" class=\"badge\">7<\u002Fspan><\u002Fbutton>\n<button data-page=\"premises\"><span class=\"ico\">?<\u002Fspan><span class=\"lbl\">Premissas<\u002Fspan><\u002Fbutton>\n<\u002Fnav><div class=\"sidefoot\">Aplicação local e offline.<br>Os dados permanecem no navegador.<br><span id=\"appVersion\"><\u002Fspan><\u002Fdiv><\u002Faside>\n<main class=\"main\"><header class=\"topbar\"><div class=\"flex items gap12\"><button id=\"mobileMenu\" class=\"mobile\">☰<\u002Fbutton><div class=\"head\"><strong id=\"projectHeader\">Novo empreendimento<\u002Fstrong><span id=\"projectSubHeader\">Nenhum orçamento importado<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"top-actions\"><span id=\"saveStatus\" class=\"save-status hide-mobile\">Pronto<\u002Fspan><button id=\"btnLoadDemo\" class=\"btn btn-secondary hide-mobile\">Carregar exemplo<\u002Fbutton><button id=\"btnSave\" class=\"btn btn-primary\">Salvar<\u002Fbutton><\u002Fdiv><\u002Fheader>\n<div class=\"content\">\n<section id=\"page-dashboard\" class=\"page active\"><div class=\"page-title\"><div><h1>Visão geral<\u002Fh1><p>Acompanhe a transformação do orçamento em uma estrutura contratual de eventos físicos, estanques e auditáveis.<\u002Fp><\u002Fdiv><div class=\"flex gap8\"><button class=\"btn btn-secondary\" data-goto=\"import\">Importar orçamento<\u002Fbutton><button id=\"dashGenerate\" class=\"btn btn-orange\">Gerar eventograma<\u002Fbutton><\u002Fdiv><\u002Fdiv><div id=\"dashboardKpis\" class=\"grid g5\"><\u002Fdiv><div class=\"card\" style=\"margin-top:16px\"><div class=\"card-title\"><div><h2>Fluxo metodológico<\u002Fh2><p>Classificação, eventograma direto, rateio dos transversais e reserva para recebimentos.<\u002Fp><\u002Fdiv><\u002Fdiv><div id=\"workflow\" class=\"workflow\"><\u002Fdiv><\u002Fdiv><div class=\"grid g2\" style=\"margin-top:16px\"><div class=\"card\"><div class=\"card-title\"><div><h2>Distribuição do orçamento<\u002Fh2><p>Valores diretos, custos transversais e reservas finais.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"chart-box\"><canvas id=\"chartBudget\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"card\"><div class=\"card-title\"><div><h2>Diagnóstico rápido<\u002Fh2><p>Controles críticos do projeto atual.<\u002Fp><\u002Fdiv><\u002Fdiv><div id=\"quickDiagnostics\" class=\"validation-list\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section id=\"page-project\" class=\"page\"><div class=\"page-title\"><div><h1>Projeto e caracterização da edificação<\u002Fh1><p>As divisões físicas orientam a criação de eventos por pavimento, bloco, subsolo, setor e junta.<\u002Fp><\u002Fdiv><button id=\"btnProjectNext\" class=\"btn btn-green\">Salvar e avançar<\u002Fbutton><\u002Fdiv><div class=\"card\"><div class=\"tabs\" data-tabs=\"project\"><button class=\"active\" data-tab=\"general\">Dados gerais<\u002Fbutton><button data-tab=\"physical\">Divisões físicas<\u002Fbutton><button data-tab=\"systems\">Sistemas construtivos<\u002Fbutton><button data-tab=\"parameters\">Parâmetros<\u002Fbutton><\u002Fdiv>\n<div id=\"tab-general\" class=\"tab-panel active\"><div class=\"form-grid\"><div class=\"field w6\"><label>Nome do empreendimento<\u002Flabel><input data-bind=\"project.name\" placeholder=\"Ex.: Residencial Parque das Flores\"><\u002Fdiv><div class=\"field w3\"><label>Contratante<\u002Flabel><input data-bind=\"project.client\"><\u002Fdiv><div class=\"field w3\"><label>Local da obra<\u002Flabel><input data-bind=\"project.location\" placeholder=\"Município/UF\"><\u002Fdiv><div class=\"field w2\"><label>Área construída (m²)<\u002Flabel><input type=\"number\" step=\"0.01\" data-bind=\"project.area\"><\u002Fdiv><div class=\"field w2\"><label>Área equivalente (m²)<\u002Flabel><input type=\"number\" step=\"0.01\" data-bind=\"project.equivalentArea\"><\u002Fdiv><div class=\"field w2\"><label>Valor global informado (R$)<\u002Flabel><input type=\"number\" step=\"0.01\" data-bind=\"project.declaredValue\"><\u002Fdiv><div class=\"field w2\"><label>Prazo contratual (meses)<\u002Flabel><input type=\"number\" min=\"1\" data-bind=\"project.durationMonths\"><\u002Fdiv><div class=\"field w2\"><label>Início previsto<\u002Flabel><input type=\"date\" data-bind=\"project.startDate\"><\u002Fdiv><div class=\"field w2\"><label>Regime de execução<\u002Flabel><select data-bind=\"project.contractType\"><option>Empreitada por preço global<\u002Foption><option>Contratação integrada<\u002Foption><option>Contratação semi-integrada<\u002Foption><option>Empreitada por preço unitário<\u002Foption><\u002Fselect><\u002Fdiv><div class=\"field w12\"><label>Observações e particularidades<\u002Flabel><textarea data-bind=\"project.notes\" placeholder=\"Restrições, áreas especiais, repetitividade, frentes paralelas e outras particularidades.\"><\u002Ftextarea><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div id=\"tab-physical\" class=\"tab-panel\"><div class=\"grid g3\"><div class=\"card\"><div class=\"card-title\"><div><h3>Blocos ou torres<\u002Fh3><p>Pesos relativos para rateio.<\u002Fp><\u002Fdiv><button class=\"btn btn-sm btn-secondary\" data-add-unit=\"blocks\">+ Adicionar<\u002Fbutton><\u002Fdiv><div id=\"blocksTable\"><\u002Fdiv><\u002Fdiv><div class=\"card\"><div class=\"card-title\"><div><h3>Pavimentos e subsolos<\u002Fh3><p>Inclua térreo, pavimentos-tipo e cobertura.<\u002Fp><\u002Fdiv><button class=\"btn btn-sm btn-secondary\" data-add-unit=\"floors\">+ Adicionar<\u002Fbutton><\u002Fdiv><div id=\"floorsTable\"><\u002Fdiv><\u002Fdiv><div class=\"card\"><div class=\"card-title\"><div><h3>Juntas e setores<\u002Fh3><p>Estruturais, dilatação ou concretagem.<\u002Fp><\u002Fdiv><button class=\"btn btn-sm btn-secondary\" data-add-unit=\"joints\">+ Adicionar<\u002Fbutton><\u002Fdiv><div id=\"jointsTable\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"alert info\" style=\"margin-top:14px\"><span>ℹ<\u002Fspan><div><strong>Combinação controlada<\u002Fstrong>O motor cruza dimensões somente quando isso torna a entrega mais verificável e não provoca pulverização excessiva.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div id=\"tab-systems\" class=\"tab-panel\"><div class=\"form-grid\"><div class=\"field w4\"><label>Fundações<\u002Flabel><select data-bind=\"systems.foundation\"><option>Estacas<\u002Foption><option>Sapatas<\u002Foption><option>Radier<\u002Foption><option>Tubulões<\u002Foption><option>Fundações mistas<\u002Foption><option>Não definido<\u002Foption><\u002Fselect><\u002Fdiv><div class=\"field w4\"><label>Estrutura<\u002Flabel><select data-bind=\"systems.structure\"><option>Concreto armado moldado no local<\u002Foption><option>Concreto protendido<\u002Foption><option>Pré-moldada<\u002Foption><option>Metálica<\u002Foption><option>Alvenaria estrutural<\u002Foption><option>Parede de concreto<\u002Foption><option>Mista<\u002Foption><\u002Fselect><\u002Fdiv><div class=\"field w4\"><label>Tipo de laje<\u002Flabel><select data-bind=\"systems.slab\"><option>Maciça<\u002Foption><option>Nervurada<\u002Foption><option>Treliçada<\u002Foption><option>Protendida<\u002Foption><option>Steel deck<\u002Foption><option>Pré-moldada<\u002Foption><\u002Fselect><\u002Fdiv><div class=\"field w4\"><label>Vedações<\u002Flabel><select data-bind=\"systems.walls\"><option>Alvenaria cerâmica<\u002Foption><option>Blocos de concreto<\u002Foption><option>Drywall<\u002Foption><option>Painéis pré-fabricados<\u002Foption><option>Sistema misto<\u002Foption><\u002Fselect><\u002Fdiv><div class=\"field w4\"><label>Fachada<\u002Flabel><select data-bind=\"systems.facade\"><option>Argamassa e pintura<\u002Foption><option>Revestimento cerâmico<\u002Foption><option>Pele de vidro<\u002Foption><option>ACM<\u002Foption><option>Fachada ventilada<\u002Foption><option>Sistema misto<\u002Foption><\u002Fselect><\u002Fdiv><div class=\"field w4\"><label>Cobertura<\u002Flabel><select data-bind=\"systems.roof\"><option>Telhado em fibrocimento<\u002Foption><option>Telhado metálico<\u002Foption><option>Telhado cerâmico<\u002Foption><option>Laje impermeabilizada<\u002Foption><option>Cobertura termoacústica<\u002Foption><option>Sistema misto<\u002Foption><\u002Fselect><\u002Fdiv><div class=\"field w4\"><label>Padrão de acabamento<\u002Flabel><select data-bind=\"systems.finish\"><option>Econômico<\u002Foption><option>Normal<\u002Foption><option>Alto<\u002Foption><option>Especial<\u002Foption><option>Hospitalar<\u002Foption><option>Industrial<\u002Foption><option>Institucional<\u002Foption><\u002Fselect><\u002Fdiv><div class=\"field w8\"><label>Instalações existentes<\u002Flabel><div id=\"installationsChecks\" class=\"pill-list\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div id=\"tab-parameters\" class=\"tab-panel\"><div class=\"form-grid\"><div class=\"field w2\"><label>Mínimo de eventos<\u002Flabel><input type=\"number\" min=\"1\" data-bind=\"params.minEvents\"><\u002Fdiv><div class=\"field w2\"><label>Máximo de eventos<\u002Flabel><input type=\"number\" min=\"1\" data-bind=\"params.maxEvents\"><\u002Fdiv><div class=\"field w2\"><label>Meta de eventos<\u002Flabel><input type=\"number\" min=\"1\" data-bind=\"params.targetEvents\"><\u002Fdiv><div class=\"field w2\"><label>Máximo por evento (%)<\u002Flabel><input type=\"number\" min=\"0.1\" step=\"0.1\" data-bind=\"params.maxEventPct\"><\u002Fdiv><div class=\"field w2\"><label>Mínimo por evento (%)<\u002Flabel><input type=\"number\" min=\"0\" step=\"0.05\" data-bind=\"params.minEventPct\"><\u002Fdiv><div class=\"field w2\"><label>Duração máxima (dias)<\u002Flabel><input type=\"number\" min=\"1\" data-bind=\"params.maxEventDuration\"><\u002Fdiv><div class=\"field w2\"><label>Recebimento provisório (%)<\u002Flabel><input type=\"number\" min=\"0\" max=\"100\" step=\"0.1\" data-bind=\"params.provisionalPct\"><\u002Fdiv><div class=\"field w2\"><label>Recebimento definitivo (%)<\u002Flabel><input type=\"number\" min=\"0\" max=\"100\" step=\"0.1\" data-bind=\"params.definitivePct\"><\u002Fdiv><div class=\"field w2\"><label>PL de referência (%)<\u002Flabel><input type=\"number\" min=\"0\" step=\"0.1\" data-bind=\"params.plPct\"><\u002Fdiv><div class=\"field w2\"><label>CCL de referência (meses)<\u002Flabel><input type=\"number\" min=\"0\" step=\"0.5\" data-bind=\"params.cclMonths\"><\u002Fdiv><div class=\"field w2\"><label>Multa diária por etapa (%)<\u002Flabel><input type=\"number\" min=\"0\" step=\"0.001\" data-bind=\"params.dailyFinePct\"><\u002Fdiv><div class=\"field w2\"><label>Carência entre recebimentos (dias)<\u002Flabel><input type=\"number\" min=\"0\" data-bind=\"params.receiptGapDays\"><\u002Fdiv><div class=\"field w3\"><label class=\"check\"><input type=\"checkbox\" data-bind-check=\"params.splitByFloor\">Dividir por pavimento quando aplicável<\u002Flabel><\u002Fdiv><div class=\"field w3\"><label class=\"check\"><input type=\"checkbox\" data-bind-check=\"params.splitByBlock\">Dividir por bloco ou torre<\u002Flabel><\u002Fdiv><div class=\"field w3\"><label class=\"check\"><input type=\"checkbox\" data-bind-check=\"params.splitByJoint\">Dividir estrutura por junta/setor<\u002Flabel><\u002Fdiv><div class=\"field w3\"><label class=\"check\"><input type=\"checkbox\" data-bind-check=\"params.allowParallel\">Permitir eventos paralelos<\u002Flabel><\u002Fdiv><div class=\"field w4\"><label class=\"check\"><input type=\"checkbox\" data-bind-check=\"params.useImportedCodes\">Priorizar códigos de eventograma importados<\u002Flabel><\u002Fdiv><div class=\"field w4\"><label class=\"check\"><input type=\"checkbox\" data-bind-check=\"params.collapseUtilitySubcodes\">Consolidar subitens pouco representativos<\u002Flabel><\u002Fdiv><div class=\"field w4\"><label>Estratégia dos custos diluídos<\u002Flabel><select data-bind=\"params.defaultDilution\"><option value=\"proportional\">Proporcional ao valor direto<\u002Foption><option value=\"uniform\">Uniforme por evento<\u002Foption><option value=\"duration\">Proporcional à duração<\u002Foption><\u002Fselect><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section id=\"page-import\" class=\"page\"><div class=\"page-title\"><div><h1>Importação do orçamento<\u002Fh1><p>Leia XLSX ou CSV, identifique as colunas e mantenha somente serviços de custo efetivo.<\u002Fp><\u002Fdiv><button id=\"btnDemoImport\" class=\"btn btn-secondary\">Usar orçamento de exemplo<\u002Fbutton><\u002Fdiv><div class=\"card\"><div id=\"dropzone\" class=\"dropzone\"><strong>Arraste a planilha para esta área<\u002Fstrong><span class=\"muted small\">ou selecione um arquivo XLSX/CSV<\u002Fspan><div style=\"margin-top:13px\"><label class=\"btn btn-primary\">Selecionar arquivo<input id=\"budgetFile\" type=\"file\" accept=\".xlsx,.csv\" hidden=\"\"><\u002Flabel><\u002Fdiv><div id=\"fileInfo\" class=\"file-info\"><\u002Fdiv><\u002Fdiv><div id=\"importSummary\" style=\"margin-top:14px\"><\u002Fdiv><\u002Fdiv><div id=\"importWizard\" class=\"card hidden\"><div class=\"card-title\"><div><h2>Assistente de mapeamento<\u002Fh2><p>Escolha a aba, o cabeçalho e as colunas.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"form-grid\"><div class=\"field w3\"><label>Aba da planilha<\u002Flabel><select id=\"sheetSelect\"><\u002Fselect><\u002Fdiv><div class=\"field w2\"><label>Linha de cabeçalho<\u002Flabel><input id=\"headerRowInput\" type=\"number\" min=\"1\"><\u002Fdiv><div class=\"field w7\"><label>Opções<\u002Flabel><div class=\"flex gap12 wrap\" style=\"padding-top:7px\"><label class=\"check\"><input id=\"onlyLeafRows\" type=\"checkbox\" checked=\"\"> Ignorar subtotais<\u002Flabel><label class=\"check\"><input id=\"syncDeclaredValue\" type=\"checkbox\" checked=\"\"> Sincronizar valor global<\u002Flabel><\u002Fdiv><\u002Fdiv><\u002Fdiv><div id=\"columnMapping\" class=\"form-grid\" style=\"margin-top:14px\"><\u002Fdiv><div class=\"toolbar\" style=\"margin-top:14px\"><button id=\"btnRefreshPreview\" class=\"btn btn-secondary\">Atualizar prévia<\u002Fbutton><span class=\"spacer\"><\u002Fspan><button id=\"btnConfirmImport\" class=\"btn btn-green\">Importar itens<\u002Fbutton><\u002Fdiv><div id=\"sheetPreview\" class=\"table-wrap medium\"><\u002Fdiv><\u002Fdiv><div class=\"card\" style=\"margin-top:16px\"><div class=\"card-title\"><div><h2>Itens importados<\u002Fh2><p>O total é calculado apenas com as linhas consideradas serviços.<\u002Fp><\u002Fdiv><div class=\"flex gap8\"><button id=\"btnClearBudget\" class=\"btn btn-sm btn-secondary\">Limpar<\u002Fbutton><button class=\"btn btn-sm btn-primary\" data-goto=\"classification\">Classificar<\u002Fbutton><\u002Fdiv><\u002Fdiv><div id=\"budgetItemsTable\"><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section id=\"page-classification\" class=\"page\"><div class=\"page-title\"><div><h1>Classificação executiva<\u002Fh1><p>Cada item é associado a um evento direto, custo diluído ou pendência, com justificativa e confiança.<\u002Fp><\u002Fdiv><div class=\"flex gap8\"><button id=\"btnAutoClassify\" class=\"btn btn-secondary\">Reclassificar automaticamente<\u002Fbutton><button id=\"btnClassNext\" class=\"btn btn-green\">Gerar preliminar<\u002Fbutton><\u002Fdiv><\u002Fdiv><div id=\"classificationKpis\" class=\"grid g4\"><\u002Fdiv><div class=\"card\" style=\"margin-top:16px\"><div class=\"toolbar\"><div class=\"search\"><input id=\"classSearch\" placeholder=\"Buscar item, código ou descrição\"><\u002Fdiv><select id=\"classFilter\" class=\"btn btn-secondary\"><option value=\"all\">Todos<\u002Foption><option value=\"direct\">Eventos diretos<\u002Foption><option value=\"diluted\">Custos diluídos<\u002Foption><option value=\"review\">Revisar<\u002Foption><\u002Fselect><button class=\"btn btn-sm btn-secondary\" data-bulk=\"direct\">Marcar direto<\u002Fbutton><button class=\"btn btn-sm btn-secondary\" data-bulk=\"diluted\">Marcar diluído<\u002Fbutton><button class=\"btn btn-sm btn-secondary\" data-bulk=\"review\">Marcar revisar<\u002Fbutton><span class=\"spacer\"><\u002Fspan><span id=\"classPageInfo\" class=\"small muted\"><\u002Fspan><button id=\"classPrev\" class=\"btn btn-sm btn-secondary\">‹<\u002Fbutton><button id=\"classNext\" class=\"btn btn-sm btn-secondary\">›<\u002Fbutton><\u002Fdiv><div id=\"classificationTable\" class=\"table-wrap tall\"><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section id=\"page-preliminary\" class=\"page\"><div class=\"page-title\"><div><h1>Eventograma sem custos diluídos<\u002Fh1><p>Somente entregas físicas. Serviços inseparáveis são agregados, e cada item do orçamento é apropriado uma única vez.<\u002Fp><\u002Fdiv><div class=\"flex gap8\"><button id=\"btnGeneratePre\" class=\"btn btn-secondary\">Regenerar<\u002Fbutton><button id=\"btnPreNext\" class=\"btn btn-green\">Ratear custos diluídos<\u002Fbutton><\u002Fdiv><\u002Fdiv><div id=\"preKpis\" class=\"grid g4\"><\u002Fdiv><div class=\"card\" style=\"margin-top:16px\"><div class=\"toolbar\"><button id=\"btnExpandPre\" class=\"btn btn-sm btn-secondary\">Expandir tudo<\u002Fbutton><button id=\"btnCollapsePre\" class=\"btn btn-sm btn-secondary\">Somente eventos<\u002Fbutton><button id=\"btnAddEvent\" class=\"btn btn-sm btn-secondary\">+ Inserir evento<\u002Fbutton><span class=\"spacer\"><\u002Fspan><span class=\"small muted\">Linhas-resumo não são somadas novamente.<\u002Fspan><\u002Fdiv><div id=\"preliminaryTable\" class=\"table-wrap tall\"><\u002Fdiv><\u002Fdiv><div class=\"grid g2\" style=\"margin-top:16px\"><div class=\"card\"><div class=\"card-title\"><div><h2>Composição por macroetapa<\u002Fh2><\u002Fdiv><\u002Fdiv><div class=\"chart-box\"><canvas id=\"chartPre\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"card\"><div class=\"card-title\"><div><h2>Itens sem destinação<\u002Fh2><\u002Fdiv><\u002Fdiv><div id=\"unallocatedItems\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section id=\"page-diluted\" class=\"page\"><div class=\"page-title\"><div><h1>Rateio dos custos diluídos<\u002Fh1><p>Custos transversais são incorporados aos eventos beneficiados com memória integral do rateio.<\u002Fp><\u002Fdiv><div class=\"flex gap8\"><button id=\"btnCalcDilution\" class=\"btn btn-secondary\">Recalcular rateio<\u002Fbutton><button id=\"btnDilNext\" class=\"btn btn-green\">Montar eventograma final<\u002Fbutton><\u002Fdiv><\u002Fdiv><div id=\"dilutedKpis\" class=\"grid g4\"><\u002Fdiv><div class=\"grid g2\" style=\"margin-top:16px\"><div class=\"card\"><div class=\"card-title\"><div><h2>Custos transversais<\u002Fh2><p>Defina método e escopo de cada rubrica.<\u002Fp><\u002Fdiv><\u002Fdiv><div id=\"dilutedItemsTable\" class=\"table-wrap tall\"><\u002Fdiv><\u002Fdiv><div class=\"card\"><div class=\"card-title\"><div><h2>Memória de rateio<\u002Fh2><p>Maiores parcelas distribuídas.<\u002Fp><\u002Fdiv><\u002Fdiv><div id=\"allocationPreview\" class=\"table-wrap tall\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card\" style=\"margin-top:16px\"><div class=\"card-title\"><div><h2>Eventograma com custos diluídos<\u002Fh2><\u002Fdiv><\u002Fdiv><div id=\"withDilutedTable\" class=\"table-wrap tall\"><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section id=\"page-final\" class=\"page\"><div class=\"page-title\"><div><h1>Eventograma final e validações<\u002Fh1><p>Reserva para recebimentos, programação no tempo e controles de integridade e exposição financeira.<\u002Fp><\u002Fdiv><div class=\"flex gap8\"><button id=\"btnCalcFinal\" class=\"btn btn-secondary\">Recalcular<\u002Fbutton><button class=\"btn btn-green\" data-goto=\"report\">Emitir relatório<\u002Fbutton><\u002Fdiv><\u002Fdiv><div id=\"finalKpis\" class=\"grid g5\"><\u002Fdiv><div class=\"card\" style=\"margin-top:16px\"><div class=\"card-title\"><div><h2>Eventograma final<\u002Fh2><p>Edite prazos, predecessoras e critérios de aceite.<\u002Fp><\u002Fdiv><div class=\"flex gap8\"><button id=\"btnAutoSchedule\" class=\"btn btn-sm btn-secondary\">Reprogramar<\u002Fbutton><button id=\"btnRunValidations\" class=\"btn btn-sm btn-secondary\">Validar<\u002Fbutton><\u002Fdiv><\u002Fdiv><div id=\"finalTable\" class=\"table-wrap tall\"><\u002Fdiv><\u002Fdiv><div class=\"grid g2\" style=\"margin-top:16px\"><div class=\"card\"><div class=\"card-title\"><div><h2>Curva acumulada de pagamentos<\u002Fh2><\u002Fdiv><\u002Fdiv><div class=\"chart-box\"><canvas id=\"chartCurve\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"card\"><div class=\"card-title\"><div><h2>Validações automáticas<\u002Fh2><\u002Fdiv><span id=\"validationScore\" class=\"badge\"><\u002Fspan><\u002Fdiv><div id=\"validationList\" class=\"validation-list\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section id=\"page-report\" class=\"page\"><div class=\"page-title\"><div><h1>Relatório, memória e exportações<\u002Fh1><p>Exporte orçamento classificado, produtos intermediários, rateios, eventograma final e verificações.<\u002Fp><\u002Fdiv><div class=\"flex gap8\"><button id=\"btnRefreshReport\" class=\"btn btn-secondary\">Atualizar prévia<\u002Fbutton><button id=\"btnPrintReport\" class=\"btn btn-primary\">Imprimir / salvar PDF<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"grid g4\"><button id=\"btnExportXlsx\" class=\"card\" style=\"text-align:left\"><b>▦ Exportar Excel<\u002Fb><p class=\"small muted\">Sete abas com as memórias.<\u002Fp><\u002Fbutton><button id=\"btnExportCsv\" class=\"card\" style=\"text-align:left\"><b>≡ Exportar CSV<\u002Fb><p class=\"small muted\">Eventograma final.<\u002Fp><\u002Fbutton><button id=\"btnExportJson\" class=\"card\" style=\"text-align:left\"><b>{ } Exportar projeto<\u002Fb><p class=\"small muted\">Backup completo em JSON.<\u002Fp><\u002Fbutton><label class=\"card\" style=\"text-align:left;cursor:pointer\"><b>⇧ Importar projeto<\u002Fb><p class=\"small muted\">Restaurar backup.<\u002Fp><input id=\"projectJsonFile\" type=\"file\" accept=\".json\" hidden=\"\"><\u002Flabel><\u002Fdiv><div class=\"report-preview\" style=\"margin-top:16px\"><div id=\"reportPreview\"><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section id=\"page-premises\" class=\"page\"><div class=\"page-title\"><div><h1>Premissas metodológicas<\u002Fh1><p>Regras incorporadas para impedir que o eventograma seja apenas um agrupamento contábil do orçamento.<\u002Fp><\u002Fdiv><\u002Fdiv><div id=\"premisesGrid\" class=\"help-grid\"><\u002Fdiv><div class=\"card\" style=\"margin-top:16px\"><div class=\"callout\"><h4>Validação profissional obrigatória<\u002Fh4>O sistema produz uma proposta rastreável. Quando a planilha não informa localização, caminho crítico, quantitativos por pavimento ou plano de ataque, o programa utiliza rateios explícitos e os identifica como estimativas. O produto deve ser validado pelo orçamentist
