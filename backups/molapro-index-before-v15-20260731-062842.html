  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"pt-BR\" data-tema=\"claro\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>MolaPro v1.0 — Molas helicoidais de compressão, tração e torção<\u002Ftitle>\n<meta name=\"description\" content=\"Calculadora offline de molas helicoidais cilíndricas: rigidez, deflexão máxima, tensões, flambagem, frequência natural e fadiga, com biblioteca de 36 materiais.\">\n\n<style>\n:root{\n  --bg:#E9EDF1; --bg2:#DDE3E9; --surf:#FFFFFF; --surf2:#F4F7F9;\n  --ink:#141C25; --ink2:#4E5F70; --ink3:#7C8B9A;\n  --rule:#C6D0D9; --rule2:#DFE6EC;\n  --steel:#25607F; --steel2:#3B87AE; --steelBg:#E2EDF3;\n  --ok:#1B6E51; --okBg:#E1F0E9;\n  --warn:#96690A; --warnBg:#F7EED9;\n  --bad:#9C3324; --badBg:#F7E4E1;\n  --grid:#D3DCE3;\n  --mono:ui-monospace,\"SFMono-Regular\",\"Cascadia Mono\",\"Roboto Mono\",Menlo,Consolas,monospace;\n  --sans:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --r:3px; --sh:0 1px 2px rgba(20,28,37,.07),0 4px 12px rgba(20,28,37,.05);\n}\n[data-tema=\"escuro\"]{\n  --bg:#0E141A; --bg2:#141C24; --surf:#18212B; --surf2:#1E2833;\n  --ink:#DEE7EF; --ink2:#9BAAB8; --ink3:#6F7F8D;\n  --rule:#2B3945; --rule2:#232F3A;\n  --steel:#67ACD3; --steel2:#8AC4E5; --steelBg:#1B2E3B;\n  --ok:#5FC49B; --okBg:#16302A;\n  --warn:#E0AE49; --warnBg:#332813;\n  --bad:#EE8878; --badBg:#39201D;\n  --grid:#26333E;\n  --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{\n  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);\n  font-size:14px;line-height:1.5;\n}\nh1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}\na{color:var(--steel)}\nbutton,input,select{font-family:inherit;font-size:inherit;color:inherit}\n\n/* ---------- rotulos tecnicos: caixa alta tracada = vocabulario do painel ---------- */\n.eyebrow{\n  font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;\n  letter-spacing:.14em;color:var(--ink3);\n}\n.num{font-family:var(--mono);font-variant-numeric:tabular-nums}\n\n/* ------------------------------------------------------------------ CABECALHO */\nheader{\n  position:sticky;top:0;z-index:40;background:var(--surf);\n  border-bottom:1px solid var(--rule);\n}\n.hbar{\n  max-width:1520px;margin:0 auto;padding:9px 18px;\n  display:flex;align-items:center;gap:16px;flex-wrap:wrap;\n}\n.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}\n.brand b{font-size:17px;letter-spacing:-.02em}\n.brand b i{font-style:normal;color:var(--steel)}\n.brand span{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.1em}\n\n/* seletor rotativo de tipo de mola */\n.selector{display:flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--surf2)}\n.selector button{\n  border:0;background:transparent;padding:7px 15px;cursor:pointer;\n  font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;\n  color:var(--ink2);border-right:1px solid var(--rule);position:relative;\n}\n.selector button:last-child{border-right:0}\n.selector button[aria-selected=\"true\"]{background:var(--steel);color:#fff}\n.selector button:hover:not([aria-selected=\"true\"]){background:var(--bg2);color:var(--ink)}\n.selector button:focus-visible{outline:2px solid var(--steel2);outline-offset:-2px}\n\n.iconbtn{\n  border:1px solid var(--rule);background:var(--surf2);border-radius:var(--r);\n  padding:6px 11px;cursor:pointer;font-family:var(--mono);font-size:11px;\n  text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);\n}\n.iconbtn:hover{background:var(--steelBg);color:var(--steel);border-color:var(--steel2)}\n.iconbtn:focus-visible{outline:2px solid var(--steel2);outline-offset:1px}\n\n/* ------------------------------------------------------------------- LAYOUT */\nmain{max-width:1520px;margin:0 auto;padding:18px}\n.wrap{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}\n@media(max-width:1080px){.wrap{grid-template-columns:1fr}}\n\n.card{background:var(--surf);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--sh)}\n.card>h3{\n  padding:10px 14px;border-bottom:1px solid var(--rule2);font-size:12px;\n  text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono);color:var(--ink2);\n  display:flex;align-items:center;gap:8px;\n}\n.card>h3 em{margin-left:auto;font-style:normal;font-size:10px;color:var(--ink3);letter-spacing:.06em}\n.cbody{padding:14px}\n\naside{position:sticky;top:60px}\n@media(max-width:1080px){aside{position:static}}\n\n/* --------------------------------------------------------------- FORMULARIOS */\n.field{margin-bottom:11px}\n.field>label{display:block;margin-bottom:3px;font-size:11.5px;color:var(--ink2);font-weight:500}\n.field>label b{color:var(--ink);font-weight:600}\n.field>label u{text-decoration:none;font-family:var(--mono);color:var(--ink3);font-size:10.5px;margin-left:4px}\n.inp{\n  width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:var(--r);\n  background:var(--surf2);font-family:var(--mono);font-size:13px;\n}\n.inp:focus{outline:2px solid var(--steel2);outline-offset:-1px;background:var(--surf)}\nselect.inp{font-family:var(--sans);font-size:12.5px}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}\n.sep{border:0;border-top:1px solid var(--rule2);margin:14px 0 12px}\n.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-bottom:8px}\n.chk input{width:15px;height:15px;accent-color:var(--steel)}\n\n/* pastilha de material selecionado */\n.matchip{\n  border:1px solid var(--rule);background:var(--surf2);border-radius:var(--r);\n  padding:9px 10px;margin-top:7px;font-size:11.5px;color:var(--ink2);\n}\n.matchip dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}\n.matchip dt{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}\n.matchip dd{margin:0;font-family:var(--mono);font-size:11px;color:var(--ink)}\n\n/* ------------------------------------------------- SIGNATURE: painel de leitura */\n.readout{display:grid;grid-template-columns:78px 1fr;gap:0;border-bottom:1px solid var(--rule2)}\n@media(max-width:640px){.readout{grid-template-columns:1fr}}\n\n/* manometro vertical de utilizacao */\n.gauge{border-right:1px solid var(--rule2);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px}\n@media(max-width:640px){.gauge{border-right:0;border-bottom:1px solid var(--rule2);flex-direction:row;justify-content:center}}\n.gauge .tube{\n  position:relative;width:26px;height:150px;background:var(--bg2);\n  border:1px solid var(--rule);border-radius:2px;overflow:hidden;\n}\n@media(max-width:640px){.gauge .tube{width:150px;height:26px}}\n.gauge .fill{position:absolute;left:0;right:0;bottom:0;background:var(--ok);transition:height .35s ease,background .35s}\n@media(max-width:640px){.gauge .fill{top:0;bottom:0;left:0;right:auto;height:auto!important;transition:width .35s ease}}\n.gauge .tick{position:absolute;left:0;width:100%;height:1px;background:var(--rule)}\n.gauge .redline{position:absolute;left:0;width:100%;height:2px;background:var(--bad);opacity:.85}\n.gauge b{font-family:var(--mono);font-size:15px;font-weight:600}\n.gauge small{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);text-align:center;line-height:1.3}\n\n/* mostradores principais */\n.dials{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:0}\n.dial{padding:13px 14px;border-right:1px solid var(--rule2);border-bottom:1px solid var(--rule2)}\n.dial:last-child{border-right:0}\n.dial .eyebrow{display:block;margin-bottom:4px}\n.dial b{display:block;font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.1}\n.dial b u{text-decoration:none;font-size:11px;font-weight:500;color:var(--ink3);margin-left:3px}\n.dial i{font-style:normal;font-size:11px;color:var(--ink3);font-family:var(--mono)}\n.dial.ok b{color:var(--ok)} .dial.warn b{color:var(--warn)} .dial.bad b{color:var(--bad)}\n\n/* -------------------------------------------------------- ABAS DE RESULTADO */\n.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);overflow-x:auto;background:var(--surf2)}\n.tabs button{\n  border:0;border-bottom:2px solid transparent;background:transparent;cursor:pointer;\n  padding:10px 15px;white-space:nowrap;font-family:var(--mono);font-size:11px;\n  text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:600;\n}\n.tabs button[aria-selected=\"true\"]{color:var(--steel);border-bottom-color:var(--steel);background:var(--surf)}\n.tabs button:hover:not([aria-selected=\"true\"]){color:var(--ink)}\n.tabs button:focus-visible{outline:2px solid var(--steel2);outline-offset:-2px}\n.pane{padding:16px}\n.pane[hidden]{display:none}\n\n/* ------------------------------------------------------------------ TABELAS */\ntable{width:100%;border-collapse:collapse;font-size:12.5px}\nth,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--rule2);vertical-align:top}\nth{\n  font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;\n  color:var(--ink3);font-weight:600;background:var(--surf2);position:sticky;top:0;\n}\ntd.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}\ntbody tr:hover{background:var(--surf2)}\n.tsec td{background:var(--bg2);font-family:var(--mono);font-size:10px;text-transform:uppercase;\n  letter-spacing:.09em;color:var(--ink2);font-weight:600;border-bottom:1px solid var(--rule)}\n.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em}\n.pill.ok{background:var(--okBg);color:var(--ok)}\n.pill.warn{background:var(--warnBg);color:var(--warn)}\n.pill.bad{background:var(--badBg);color:var(--bad)}\n.pill.neutro{background:var(--bg2);color:var(--ink2)}\n.formula{font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap}\n\n/* ----------------------------------------------------------------- AVISOS */\n.msg{\n  display:flex;gap:9px;padding:9px 11px;border-radius:var(--r);margin-bottom:7px;\n  font-size:12.5px;border-left:3px solid;line-height:1.45;\n}\n.msg b{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;flex:0 0 62px;padding-top:1px}\n.msg.erro{background:var(--badBg);border-color:var(--bad);color:var(--ink)} .msg.erro b{color:var(--bad)}\n.msg.atencao{background:var(--warnBg);border-color:var(--warn);color:var(--ink)} .msg.atencao b{color:var(--warn)}\n.msg.info{background:var(--surf2);border-color:var(--rule);color:var(--ink2)} .msg.info b{color:var(--ink3)}\n.msg.aprovado{background:var(--okBg);border-color:var(--ok);color:var(--ink)} .msg.aprovado b{color:var(--ok)}\n\n/* ------------------------------------------------------------------ GRAFICOS */\n.plots{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}\n.plot{border:1px solid var(--rule);border-radius:var(--r);background:var(--surf);overflow:hidden}\n.plot h4{padding:8px 11px;border-bottom:1px solid var(--rule2);font-family:var(--mono);font-size:10.5px;\n  text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:600}\n.plot svg{display:block;width:100%;height:auto;background:var(--surf)}\n.legend{padding:7px 11px;border-top:1px solid var(--rule2);font-size:11px;color:var(--ink3);\n  display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono)}\n.legend i{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:5px}\n\n/* ------------------------------------------------------- BIBLIOTECA / FILTROS */\n.filtros{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:13px}\n.filtros .field{margin:0;min-width:130px}\n.tblwrap{max-height:620px;overflow:auto;border:1px solid var(--rule);border-radius:var(--r)}\n.matnome{font-weight:600;color:var(--ink)}\n.matnorma{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}\ndetails.obs{margin-top:3px}\ndetails.obs summary{cursor:pointer;font-family:var(--mono);font-size:10px;color:var(--steel);\n  text-transform:uppercase;letter-spacing:.07em}\ndetails.obs p{margin:5px 0 0;font-size:11.5px;color:var(--ink2);max-width:60ch}\n\n/* --------------------------------------------------------------- HISTORICO */\n.hitem{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule2);font-size:12px}\n.hitem .num{color:var(--ink3);font-size:11px}\n.hitem strong{flex:1;font-weight:600}\n\nfooter{max-width:1520px;margin:0 auto;padding:22px 18px 40px;color:var(--ink3);font-size:11.5px;line-height:1.6}\nfooter b{color:var(--ink2)}\n\n@media print{\n  header,aside,.tabs,.iconbtn,footer{display:none!important}\n  body{background:#fff}\n  .pane[hidden]{display:block!important}\n  .card{border:1px solid #999;box-shadow:none;break-inside:avoid}\n  main{max-width:none;padding:0}\n  .wrap{grid-template-columns:1fr}\n}\n@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<!-- ====================== TELA DE ABERTURA (SPLASH + AVISO LEGAL) ====================== -->\n<div id=\"splash\" aria-modal=\"true\" role=\"dialog\" aria-label=\"Abertura do MolaPro\">\n  <canvas id=\"spcv\"><\u002Fcanvas>\n  <div class=\"sp-vig\"><\u002Fdiv>\n\n  <button class=\"sp-skip\" id=\"spSkip\" type=\"button\">Pular&nbsp;›<\u002Fbutton>\n\n  <div class=\"sp-stage\">\n    <div class=\"sp-brandwrap\">\n      <div class=\"sp-brand\">Mola<i>Pro<\u002Fi><\u002Fdiv>\n      <div class=\"sp-ver\">v1.0 &nbsp;·&nbsp; MOLAS HELICOIDAIS DE COMPRESSÃO, TRAÇÃO E TORÇÃO<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sp-props\">\n      <div class=\"sp-chip\" id=\"spChip1\">\n        <span class=\"sp-ct\">Rigidez<\u002Fspan>\n        <span class=\"sp-cf\">k = G·d⁴ / 8·D³·n<sub>a<\u002Fsub><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"sp-chip\" id=\"spChip2\">\n        <span class=\"sp-ct\">Tensão de cisalhamento<\u002Fspan>\n        <span class=\"sp-cf\">τ = K<sub>w<\u002Fsub> · 8·F·D / π·d³<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"sp-chip\" id=\"spChip3\">\n        <span class=\"sp-ct\">Flambagem · Fadiga · f<sub>n<\u002Fsub><\u002Fspan>\n        <span class=\"sp-cf\">f<sub>n<\u002Fsub> = ½·√(k/m)<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sp-legal\" id=\"spLegal\">\n    <div class=\"sp-lcard\">\n      <div class=\"sp-lhead\">\n        <span class=\"sp-leyebrow\">Aviso legal e termos de uso<\u002Fspan>\n        <span class=\"sp-lver\">MolaPro v1.0<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"sp-lbody\" id=\"spLbody\" tabindex=\"0\">\n        <p><b>1. Natureza do software.<\u002Fb> O MolaPro é uma ferramenta de apoio ao cálculo de molas\n        helicoidais cilíndricas de seção circular, baseada na teoria clássica de molas (fator de\n        Wahl, teoria de torção de fio, critérios usuais de fadiga e de flambagem) e em dados\n        tabelados de materiais. Os resultados são <b>estimativas de engenharia<\u002Fb>.<\u002Fp>\n\n        <p><b>2. Ausência de garantia.<\u002Fb> O software é fornecido “no estado em que se encontra”,\n        sem garantias de qualquer natureza, expressas ou implícitas, incluindo, sem limitação,\n        garantias de exatidão, de adequação a uma finalidade específica ou de ausência de erros.<\u002Fp>\n\n        <p><b>3. Responsabilidade técnica.<\u002Fb> O uso dos resultados não substitui a verificação por\n        profissional legalmente habilitado, a consulta às normas aplicáveis (p. ex. ABNT, ASTM, DIN,\n        EN, SAE, JIS), aos catálogos e às especificações do fabricante do material, nem a validação\n        experimental do componente. Toda decisão de projeto, especificação, fabricação ou aprovação\n        permanece sob responsabilidade exclusiva do usuário e do responsável técnico da obra ou do\n        produto.<\u002Fp>\n\n        <p><b>4. Limitações do modelo.<\u002Fb> Não são cobertos, entre outros: molas de seção não\n        circular, molas cônicas ou de passo variável, efeitos de relaxação e fluência a alta\n        temperatura, corrosão sob tensão, impacto e efeitos dinâmicos de ordem superior,\n        empilhamento de tolerâncias de fabricação e tratamentos superficiais específicos.\n        Dados de material devem ser confirmados junto ao fornecedor.<\u002Fp>\n\n        <p><b>5. Isenção de responsabilidade.<\u002Fb> Em nenhuma hipótese os autores ou distribuidores\n        responderão por danos diretos, indiretos, incidentais, materiais, pessoais, lucros cessantes\n        ou perdas decorrentes do uso ou da impossibilidade de uso deste software.<\u002Fp>\n\n        <p><b>6. Dados.<\u002Fb> Todo o processamento ocorre localmente no navegador, sem envio de\n        informações a servidores. O histórico de cálculos e as preferências são gravados apenas no\n        armazenamento local do seu dispositivo e podem ser apagados por você a qualquer momento.<\u002Fp>\n\n        <p class=\"sp-lfoot\">Ao prosseguir, você declara ter lido, compreendido e aceito integralmente\n        as condições acima.<\u002Fp>\n      <\u002Fdiv>\n      <label class=\"sp-lchk\"><input type=\"checkbox\" id=\"spAgree\"><span>Li e concordo com o aviso legal e os termos de uso.<\u002Fspan><\u002Flabel>\n      <div class=\"sp-lact\">\n        <button type=\"button\" class=\"sp-btn sp-btn-ghost\" id=\"spDecline\">Não concordo<\u002Fbutton>\n        <button type=\"button\" class=\"sp-btn sp-btn-go\" id=\"spEnter\" disabled=\"\">Concordar e abrir o MolaPro<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<style>\n#splash{\n  position:fixed;inset:0;z-index:9000;backgrou (Math.max(0,(nx*hx+ny*hy+nz*hz)/hm),16);\n  var base=[104,132,152];\n  if(heat>0){\n    var t=Math.min(1,heat*(0.26+0.74*inner))*0.72;\n    var hot=[236,96,52], mid=[224,174,73];\n    var c1=t<0.5?[base[0]+(mid[0]-base[0])*(t/0.5),base[1]+(mid[1]-base[1])*(t/0.5),base[2]+(mid[2]-base[2])*(t/0.5)]\n                :[mid[0]+(hot[0]-mid[0])*((t-0.5)/0.5),mid[1]+(hot[1]-mid[1])*((t-0.5)/0.5),mid[2]+(hot[2]-mid[2])*((t-0.5)/0.5)];\n    base=c1;\n  }\n  var g=amb+diff*0.95, s=sp*118;\n  var r=Math.min(255,base[0]*g+s),gg=Math.min(255,base[1]*g+s),b=Math.min(255,base[2]*g+s*1.05);\n  return 'rgb('+(r|0)+','+(gg|0)+','+(b|0)+')';\n}\n\n/* ---------- malha do tubo helicoidal ---------- */\nvar quads=[],caps=[];\nfunction buildSpring(defl,grow,heat){\n  var L=L0*(1-defl), pitch=L/TURNS;\n  var last=Math.max(2,Math.round(NS*grow));\n  var rings=[],nrm=[];\n  for(var i=0;i<=last;i++){\n    var u=i/NS, t=u*TURNS*Math.PI*2, e=0.11, yf;\n    if(u<e) yf=0.018*(u/e);\n    else if(u>1-e) yf=0.982+0.018*((u-(1-e))/e);\n    else yf=0.018+0.964*(u-e)/(1-2*e);\n    var y=-L/2+yf*L;\n    var ct=Math.cos(t),st=Math.sin(t);\n    var c=[Rc*ct,y,Rc*st];\n    var dy=(u<e||u>1-e)?0.018*L/e:0.964*L/(1-2*e);\n    var tg=[-Rc*st*Math.PI*2*TURNS, dy, Rc*ct*Math.PI*2*TURNS];\n    var tm=Math.hypot(tg[0],tg[1],tg[2]);tg=[tg[0]/tm,tg[1]/tm,tg[2]/tm];\n    var n1=[ct,0,st];\n    var n2=[tg[1]*n1[2]-tg[2]*n1[1],tg[2]*n1[0]-tg[0]*n1[2],tg[0]*n1[1]-tg[1]*n1[0]];\n    var nm=Math.hypot(n2[0],n2[1],n2[2]);n2=[n2[0]/nm,n2[1]/nm,n2[2]/nm];\n    var rv=[],rn=[];\n    for(var j=0;j<NA;j++){\n      var a=j/NA*Math.PI*2,ca=Math.cos(a),sa=Math.sin(a);\n      var nx=n1[0]*ca+n2[0]*sa, ny=n1[1]*ca+n2[1]*sa, nz=n1[2]*ca+n2[2]*sa;\n      rv.push(proj(rot([c[0]+rw*nx,c[1]+rw*ny,c[2]+rw*nz])));\n      rn.push(rot([nx,ny,nz]));\n    }\n    rings.push(rv);nrm.push(rn);\n  }\n  quads.length=0;caps.length=0;\n  for(var i2=0;i2<rings.length-1;i2++){\n    var A=rings[i2],B=rings[i2+1],NAr=nrm[i2],NBr=nrm[i2+1];\n    for(var j tNode)return;\n  if(e.key==='Escape'&&!done)finishNow();\n  if(e.key==='Enter'&&done&&!el('spEnter').disabled)el('spEnter').click();\n});\n})();\n<\u002Fscript>\n<!-- ==================== FIM DA TELA DE ABERTURA ==================== -->\n\n<header>\n  <div class=\"hbar\">\n    <div class=\"brand\">\n      <b>Mola<i>Pro<\u002Fi><\u002Fb>\n      <span>v1.0<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"selector\" role=\"tablist\" aria-label=\"Tipo de mola\">\n      <button role=\"tab\" id=\"tp-compressao\" aria-selected=\"true\" data-tipo=\"compressao\">Compressão<\u002Fbutton>\n      <button role=\"tab\" id=\"tp-tracao\" aria-selected=\"false\" data-tipo=\"tracao\">Tração<\u002Fbutton>\n      <button role=\"tab\" id=\"tp-torcao\" aria-selected=\"false\" data-tipo=\"torcao\">Torção<\u002Fbutton>\n    <\u002Fdiv>\n    <button class=\"iconbtn\" id=\"btnExemplo\">Exemplo<\u002Fbutton>\n    <button class=\"iconbtn\" id=\"btnSalvar\">Salvar cálculo<\u002Fbutton>\n    <button class=\"iconbtn\" id=\"btnImprimir\">Imprimir<\u002Fbutton>\n    <button class=\"iconbtn\" id=\"btnTema\" aria-label=\"Alternar tema\">Tema<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main>\n<div class=\"wrap\">\n\n  <!-- ======================= COLUNA DE ENTRADA ======================= -->\n  <aside>\n    <div class=\"card\">\n      <h3>Dados de entrada <em id=\"rotuloTipo\">compressão<\u002Fem><\u002Fh3>\n      <div class=\"cbody\">\n\n        <!-- material -->\n        <div class=\"field\">\n          <label for=\"fFamilia\">Família do material<\u002Flabel>\n          <select class=\"inp\" id=\"fFamilia\"><\u002Fselect>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"fMaterial\">Material<\u002Flabel>\n          <select class=\"inp\" id=\"fMaterial\"><\u002Fselect>\n        <\u002Fdiv>\n        <div class=\"matchip\" id=\"chipMat\"><\u002Fdiv>\n\n        <hr class=\"sep\">\n\n        <!-- geometria comum -->\n        <div class=\"grid2\">\n          <div class=\"field 02Flabel>\n            <input class=\"inp\" id=\"ffExc\" inputmode=\"decimal\" value=\"10\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"fCriterio\">Critério de fadiga<\u002Flabel>\n          <select class=\"inp\" id=\"fCriterio\">\n            <option value=\"gerber\" selected=\"\">Gerber (parábola) — menos conservador<\u002Foption>\n            <option value=\"goodman\">Goodman modificado (reta)<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"fJateado\"> Arame jateado (shot peening)<\u002Flabel>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ======================= COLUNA DE RESULTADOS ======================= -->\n  <section>\n    <div class=\"card\" style=\"margin-bottom:18px\">\n      <div class=\"readout\">\n        <div class=\"gauge\">\n          <div class=\"tube\" id=\"gTube\">\n            <div class=\"fill\" id=\"gFill\" style=\"height:0%\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <b id=\"gVal\">—<\u002Fb>\n            <small id=\"gLbl\">τ / S<sub>sy<\u002Fsub><\u002Fsmall>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dials\" id=\"dials\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tabs\" role=\"tablist\" aria-label=\"Resultados\">\n        <button role=\"tab\" aria-selected=\"true\" data-pane=\"p-verif\">Verificações<\u002Fbutton>\n        <button role=\"tab\" aria-selected=\"false\" data-pane=\"p-calc\">Cálculo<\u002Fbutton>\n        <button role=\"tab\" aria-selected=\"false\" data-pane=\"p-fad\">Fadiga<\u002Fbutton>\n        <button role=\"tab\" aria-selected=\"false\" data-pane=\"p-diag\">Diagramas<\u002Fbutton>\n        <button role=\"tab\" aria-selected=\"false\" data-pane=\"p-mat\">Materiais<\u002Fbutton>\n        <button role=\"tab\" aria-selected=\"false\" data-pane=\"p-mem\">Memória e normas<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"pane\" id=\"p-verif\"><div id=\"avisos\"><\u002Fdiv><\u002Fdiv>\n\n      <div class=\"pane\" id=\"p-calc\" hidden=\"\"><div id=\"tabCalc\"><\u002Fdiv><\u002Fdiv>\n\n      <div class=\"pane\" id=\"p-fad\" hidden=\"\"><div id=\"tabFad\"><\u002Fdiv><\u002Fdiv>\n\n      <div class=\"pane\" id=\"p-diag\" hidden=\"\">\n        <div class=\"plots\">\n          <div class=\"plot\">\n            <h4>Croqui e geometria<\u002Fh4>\n            <div id=\"svgCroqui\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"plot\">\n            <h4 id=\"tCurva\">Curva carga × deflexão<\u002Fh4>\n            <div id=\"svgCurva\"><\u002Fdiv>\n            <div class=\"legend\" id=\"legCurva\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"plot\">\n            <h4 id=\"tGood\">Diagrama de fadiga<\u002Fh4>\n            <div id=\"svgGood\"><\u002Fdiv>\n            <div class=\"legend\" id=\"legGood\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"plot\">\n            <h4>Sensibilidade da bitola<\u002Fh4>\n            <div id=\"svgSens\"><\u002Fdiv>\n            <div class=\"legend\"><span><i style=\"background:var(--steel)\"><\u002Fi>fator ao escoamento<\u002Fspan><span><i style=\"background:var(--warn)\"><\u002Fi>fator à fadiga<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pane\" id=\"p-mat\" hidden=\"\">\n        <div class=\"filtros\">\n          <div class=\"field\">\n            <label for=\"bFam\">Família<\u002Flabel>\n            <select class=\"inp\" id=\"bFam\"><option value=\"\">Todas<\u002Foption><\u002Fselect>\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label for=\"bBusca\">Buscar<\u002Flabel>\n            <input class=\"inp\" id=\"bBusca\" placeholder=\"norma, nome, aplicação\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label for=\"bTmin\">Temp. mínima exigida <u>°C<\u002Fu><\u002Flabel>\n            <input class=\"inp\" id=\"bTmin\" inputmode=\"decimal\" placeholder=\"ex. 200\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label for=\"bCorr\">Corrosão mínima<\u002Flabel>\n            <select class=\"inp\" id=\"bCorr\">\n              <option value=\"0\">Qualquer<\u002Foption>\n              <option value=\"2\">Média ou melhor<\u002Foption>\n              <option value=\"3\">Alta ou melhor<\u002Foption>\n              <option value=\"4\">Excelente<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label for=\"bOrdem\">Ordenar por<\u002Flabel>\n            <select class=\"inp\" id=\"bOrdem\">\n              <option value=\"viab\">Adequação ao caso atual<\u002Foption>\n              <option value=\"sut\">Resistência S<sub>ut<\u002Fsub><\u002Foption>\n              <option value=\"custo\">Custo relativo<\u002Foption>\n              <option value=\"temp\">Temperatura máxima<\u002Foption>\n              <option value=\"nome\">Nome<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tblwrap\"><div id=\"tabBiblio\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pane\" id=\"p-mem\" hidden=\"\"><div id=\"tabMem\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <h3>Cálculos salvos <em id=\"histCount\"><\u002Fem><\u002Fh3>\n      <div class=\"cbody\"><div id=\"hist\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fmain>\n\n<footer>\n  <p><b>MolaPro v1.0<\u002Fb> — pré-dimensionamento e verificação de molas helicoidais cilíndricas de compressão, tração e torção. Ferramenta de apoio: os resultados não substituem a verificação por profissional habilitado nem o ensaio de protótipo. Dados de material de caráter indicativo — confirme S<sub>ut<\u002Fsub> e o comportamento em fadiga no certificado do lote e com o fabricante da mola.<\u002Fp>\n  <p>Funciona integralmente offline. Os cálculos salvos ficam apenas neste navegador.<\u002Fp>\n<\u002Ffooter>\n\n<script>\n/* ==========================================================================\n   MolaPro — BIBLIOTECA DE MATERIAIS PARA MOLAS\n   --------------------------------------------------------------------------\n   Campos de cada material:\n     id        identificador interno\n     nome      denominacao comercial/tecnica em pt-BR\n     norma     norma de referencia principal\n     equiv     equivalencias (ASTM / DIN / JIS / ABNT-SAE)\n     fam       familia: carbono | liga | inox | niquel | cobre | titanio\n     G         modulo de elasticidade transversal [MPa]\n     E         modulo de elasticidade longitudinal [MPa]\n     rho       massa especifica [kg/m3]\n     dmin,dmax faixa comercial de diametro de arame [mm]\n     sut       resistencia a tracao:\n                 {tipo:'pot', faixas:[{d1,d2,A,m}]}  ->  Sut = A * d^(-m)  [MPa]\n                 {tipo:'fixo', min, max}             ->  faixa direta [MPa]\n     kSsy      fator de escoamento em torcao: Ssy = kSsy * Sut\n     kSy       fator de escoamento em flexao (molas de torcao): Sy = kSy * Sut\n     kSsu      fator de ruptura em torcao: Ssu = kSsu * Sut  (usual 0,67)\n     fad       fadiga em torcao (10^6 ciclos, arame liso):\n                 {tipo:'zimmerli'}      -> Ssa=241 / Ssm=379 MPa (sem jateamento)\n                                           Ssa=398 / Ssm=534 MPa (jateado)\n                 {tipo:'frac', ka, km}  -> Ssa=ka*Sut, Ssm=km*Sut  (estimativa)\n     kFlex     fracao de Sut p/ resistencia a fadiga em flexao (molas de torcao)\n     tmin,tmax faixa de temperatura de trabalho [degC]\n     dG        coef. de variacao de G com temperatura [1/degC] (negativo)\n     corr      resistencia a corrosao: 0 nula | 1 baixa | 2 media | 3 alta | 4 excelente\n     mag       magnetico: true | false | 'leve'\n     cond      condutividade eletrica relativa (% IACS) ou null\n     custo     custo relativo indicativo (A227 = 1,0)\n     usos      aplicacoes tipicas\n     obs       observacoes tecnicas / limitacoes de dado\n   ==========================================================================\n   RASTREABILIDADE DOS COEFICIENTES A e m\n   Coeficientes da lei Sut = A*d^(-m) conforme tabulacao classica de arames\n   para molas (Associated Spring / Barnes Group; reproduzida em SHIGLEY,\n   Mechanical Engineering Design, 11a ed., Tab. 10-4). Materiais sem\n   coeficientes publicados usam faixa fixa e estao marcados em obs.\n   ========================================================================== */\n\nconst ZIM = { saSemJat: 241, smSemJat: 379, saJat: 398, smJat: 534 };\n\nconst MATERIAIS = [\n\n/* ---------------------------------------------------------------- CARBONO */\n{\n  id: 'A228', nome: 'Arame de corda de piano (music wire)',\n  norma: 'ASTM A228', equiv: 'DIN 17223 Cl. 3 · JIS G3522 SWP-B · SAE 1085',\n  fam: 'carbono',\n  G: 81700, E: 207000, rho: 7850, dmin: 0.10, dmax: 6.50,\n  sut: { tipo: 'pot', faixas: [{ d1: 0.10, d2: 6.50, A: 2211, m: 0.145 }] },\n  kSsy: 0.45, kSy: 0.78, kSsu: 0.67,\n  fad: { tipo: 'zimmerli' }, kFlex: 0.50,\n  tmin: -40, tmax: 120, dG: -0.00027, corr: 1, mag: true, cond: null, custo: 2.6,\n  usos: 'Molas pequenas de alta precisao, instrumentos, eletrodomesticos, travas, brinquedos tecnicos.',\n  obs: 'Maior resistencia entre os acos ao carbono e melhor qualidade de superficie. Nao indicado acima de 120 degC (relaxacao). Nao soldavel.'\n},\n{\n  id: 'A227', nome: 'Arame estirado duro (hard drawn)',\n  norma: 'ASTM A227', equiv: 'DIN 17223 Cl. 1/2 · JIS G3521 SW-C · SAE 1066',\n  fam: 'carbono',\n  G: 79300, E: 203400, rho: 7850, dmin: 0.70, dmax: 16.00,\n  sut: { tipo: 'pot', faixas: [{ d1: 0.70, d2: 12.70, A: 1783, m: 0.190 }] },\n  kSsy: 0.45, kSy: 0.78, kSsu: 0.67,\n  fad: { tipo: 'zimmerli' }, kFlex: 0.50,\n  tmin: -30, tmax: 120, dG: -0.00027, corr: 1, mag: true, cond: null, custo: 1.0,\n  usos: 'Molas de uso geral com solicitacao estatica ou fadiga moderada; ferragens, EN 1.4028',\n  equiv: 'AISI 420 · SUS420J2', fam: 'inox',\n  G: 77000, E: 200000, rho: 7750, dmin: 0.50, dmax: 10.00,\n  sut: { tipo: 'fixo', min: 1500, max: 1900 },\n  kSsy: 0.45, kSy: 0.75, kSsu: 0.67,\n  fad: { tipo: 'frac', ka: 0.20, km: 0.32 }, kFlex: 0.44,\n  tmin: -30, tmax: 400, dG: -0.00030, corr: 2, mag: true, cond: null, custo: 5.0,\n  usos: 'Molas com requisito de dureza e corrosao moderada; instrumentos cirurgicos, valvulas.',\n  obs: 'DADO LIMITADO: faixa fixa apos tempera e revenimento. Corrosao inferior aos austeniticos. Fragil se revenido em faixa inadequada (475 degC).'\n},\n{\n  id: 'AISI305', nome: 'Arame inox AISI 305 / 302HQ',\n  norma: 'ASTM A580 / EN 1.4303',\n  equiv: 'AISI 305 · SUS305', fam: 'inox',\n  G: 69000, E: 193000, rho: 7920, dmin: 0.20, dmax: 6.00,\n  sut: { tipo: 'fixo', min: 900, max: 1500 },\n  kSsy: 0.35, kSy: 0.65, kSsu: 0.67,\n  fad: { tipo: 'frac', ka: 0.18, km: 0.29 }, kFlex: 0.38,\n  tmin: -200, tmax: 290, dG: -0.00035, corr: 3, mag: false, cond: 2.5, custo: 4.6,\n  usos: 'Molas onde se exige minima permeabilidade magnetica; instrumentacao, sensores.',\n  obs: 'DADO LIMITADO: faixa fixa. Maior teor de niquel estabiliza a austenita e mantem o material praticamente nao magnetico mesmo encruado — em troca, Sut menor que o 302.'\n},\n\n/* --------------------------------------------------- LIGAS DE NIQUEL/COBALTO */\n{\n  id: 'INC600', nome: 'Inconel 600 (NiCr15Fe)',\n  norma: 'ASTM B166 / UNS N06600', equiv: 'Nicrofer 7216 · EN 2.4816',\n  fam: 'niquel',\n  G: 75800, E: 214000, rho: 8430, dmin: 0.30, dmax: 6.00,\n  sut: { tipo: 'fixo', min: 950, max: 1350 },\n  kSsy: 0.35, kSy: 0.65, kSsu: 0.67,\n  fad: { tipo: 'frac', ka: 0.17, km: 0.28 }, kFlex: 0.38,\n  tmin: -250, tmax: 370, dG: -0.00030, corr: 4, mag: false, cond: 1.7, custo: 14,\n  usos: 'Corrosao severa e temperatura moderada; trocadores, industria quimica, nuclear.',\n  obs: 'DADO LIMITADO: faixa fixa para condicao mola (spring temper). Nao endurecivel por precipitac DO LIMITADO: faixa fixa para condicao envelhecida (TH04/TM). Requer envelhecimento pos-conformacao (315-345 degC). ATENCAO: poeira e fumos de berilio sao toxicos — exigir controle na fabricacao.'\n},\n{\n  id: 'B134', nome: 'Latao para molas CuZn30',\n  norma: 'ASTM B134 / UNS C26000', equiv: 'EN CW505L',\n  fam: 'cobre',\n  G: 35000, E: 110000, rho: 8530, dmin: 0.10, dmax: 5.00,\n  sut: { tipo: 'fixo', min: 500, max: 750 },\n  kSsy: 0.30, kSy: 0.55, kSsu: 0.67,\n  fad: { tipo: 'frac', ka: 0.10, km: 0.20 }, kFlex: 0.28,\n  tmin: -200, tmax: 95, dG: -0.00042, corr: 2, mag: false, cond: 28, custo: 2.2,\n  usos: 'Molas leves decorativas, contatos de baixa solicitacao, instrumentos musicais.',\n  obs: 'DADO LIMITADO: faixa fixa para tempera de mola. Resistencia baixa e suscetibilidade a corrosao sob tensao (season cracking) em meio amoniacal. Uso estrutural limitado.'\n},\n{\n  id: 'C7541', nome: 'Cupro-niquel-zinco (prata alema) CuNi18Zn20',\n  norma: 'ASTM B122 / UNS C75400', equiv: 'EN CW409J',\n  fam: 'cobre',\n  G: 43000, E: 124000, rho: 8730, dmin: 0.10, dmax: 4.00,\n  sut: { tipo: 'fixo', min: 600, max: 850 },\n  kSsy: 0.32, kSy: 0.58, kSsu: 0.67,\n  fad: { tipo: 'frac', ka: 0.12, km: 0.22 }, kFlex: 0.30,\n  tmin: -200, tmax: 120, dG: -0.00040, corr: 3, mag: false, cond: 6, custo: 4.5,\n  usos: 'Molas de contato com boa resistencia ao deslustre; instrumentacao, telecomunicacoes.',\n  obs: 'DADO LIMITADO: faixa fixa. Menor condutividade que bronze fosforoso, melhor estabilidade de contato.'\n},\n\n/* --------------------------------------------------------------- TITANIO */\n{\n  id: 'TI64', nome: 'Titanio Ti-6Al-4V (Grau 5)',\n  norma: 'ASTM B348 / UNS R56400', equiv: 'EN 3.7165 · WL 3.7164',\n  fam: 'titanio',\n  G: 43000, E: 114000, rho: 4430, dmin: 0.80, dmax: 12.00,\n  sut: { tipo: 'fixo', min: 950, max: 1200 },\n  kSsy: 0.40, kSy: 0.68, kSsu: 0.67,\n  fad: { tipo: 'frac', ka: 0.18, km: 0.28 }, kFlex: 0.40,\n  tmin: -250, tmax: 315, dG: -0.00035, corr: 4, mag: false, cond: 3.1, custo: 20,\n  usos: 'Reducao de massa com corrosao alta; aeronautico, competicao, implantes, quimica.',\n  obs: 'DADO LIMITADO: faixa fixa. Massa especifica 44% menor que o aco. Conformacao a frio difícil — geralmente enrolado a quente. Risco de galling contra si mesmo.'\n},\n{\n  id: 'TIBETAC', nome: 'Titanio Beta-C (Ti-3Al-8V-6Cr-4Mo-4Zr)',\n  norma: 'ASTM B348 Grau 19 / UNS R58640', equiv: 'Ti-38644',\n  fam: 'titanio',\n  G: 41000, E: 103000, rho: 4820, dmin: 1.00, dmax: 14.00,\n  sut: { tipo: 'fixo', min: 1250, max: 1550 },\n  kSsy: 0.42, kSy: 0.70, kSsu: 0.67,\n  fad: { tipo: 'frac', ka: 0.20, km: 0.30 }, kFlex: 0.42,\n  tmin: -250, tmax: 315, dG: -0.00035, corr: 4, mag: false, cond: 2.5, custo: 30,\n  usos: 'Molas de suspensao de competicao, aeroespacial, molas leves de alta energia armazenada.',\n  obs: 'DADO LIMITADO: faixa fixa apos envelhecimento. Liga beta especificamente desenvolvida para molas: G baixo + Sut alto = maxima energia armazenada por unidade de massa.'\n}\n];\n\n/* Rotulos auxiliares */\nconst FAMILIAS = {\n  carbono: 'Aco ao carbono',\n  liga:    'Aco liga',\n  inox:    'Aco inoxidavel',\n  niquel:  'Liga de niquel/cobalto',\n  cobre:   'Liga de cobre',\n  titanio: 'Titanio'\n};\nconst CORR_LABEL = ['Nula', 'Baixa', 'Media', 'Alta', 'Excelente'];\n\n\n/* ==========================================================================\n   MolaPro — MOTOR DE CALCULO\n   Convencoes de unidades (SI-mm):\n     forca [N] · comprimento [mm] · tensao [MPa] · momento [N.mm]\n     rigidez linear [N/mm] · rigidez angular [N.mm/grau]\n     massa especifica [kg/m3] · massa [kg] · frequencia [Hz]\n   ========================================================================== */\n\n/* ------------------------------------------------- numeros em formato pt-BR */\nfunction parseNum(v) {\n  if (typeof v === 'number') return v;\n  if (v === null || v === undefined) return NaN;\n  const s = String(v).trim().replace(/\\s/g, '');\n  if (!s) return NaN;\n  // aceita \"1.234,56\" e \"1234.56\" e \"1234,56\"\n  let t = s;\n  if (t.includes(',')) t = t.replace(/\\./g, '').replace(',', '.');\n  const n = Number(t);\n  return Number.isFinite(n) ? n : NaN;\n}\n\nfunction fmt(n, dec = 2) {\n  if (!Number.isFinite(n)) return '—';\n  return n.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });\n}\n\n/* ---------------------------------------------------------- material: Sut(d) */\nfunction sutMaterial(mat, d) {\n  const s = mat.sut;\n  if (s.tipo === 'fixo') {\n    return { valor: (s.min + s.max) / 2, min: s.min, max: s.max, origem: 'faixa', extrapolado: false };\n  }\n  let faixa = s.faixas.find(f => d >= f.d1 && d <= f.d2);\n  let extrapolado = false;\n  if (!faixa) {\n    extrapolado = true;\n    faixa = d < s.faixas[0].d1 ? s.faixas[0] : s.faixas[s.faixas.length - 1];\n  }\n  const v = faixa.A * Math.pow(d, -faixa.m);\n  return { valor: v, min: v, max: v, origem: 'potencia', extrapolado, A: faixa.A, m: faixa.m };\n}\n\n/* ------------------------------------------- propriedades corrigidas por temp */\nfunction propsTemp(mat, T) {\n  const dT = (Number.isFinite(T) ? T : 20) - 20;\n  const f = 1 + mat.dG * dT;\n  return { G: mat.G * f, E: mat.E * f, fator: f };\n}\n\n/* ------------------------------------------------- fatores de concentracao */\n// Bergsstrasser (preferido em projeto de molas helicoidais)\nconst KB = C => (4 * C + 2) / (4 * C - 3);\n// Wahl (classico; inclui cisalhamento direto)\nconst KW = C => (4 * C - 1) / (4 * C - 4) + 0.615 / C;\n// Fator para tensao de flexao em molas de torcao (superficie interna da espira)\nconst KI = C => (4 * C * C - C - 1) / (4 * C * (C - 1));\n\n/* ============================ FADIGA ============================ */\n/* Resistencia a fadiga em torcao no ponto de 1e6 ciclos.\n   Ferrosos com d <= 10 mm: dados de Zimmerli (independentes de Sut).\n   Demais: fracao de Sut declarada no material (estimativa). */\nfunction dadosFadigaTorcao(mat, d, jateado, Sut) {\n  if (mat.fad.tipo === 'zimmerli') {\n    const ok = d <= 10;\n    return {\n      Ssa: jateado ? ZIM.saJat : ZIM.saSemJat,\n      Ssm: jateado ? ZIM.smJat : ZIM.smSemJat,\n      fonte: 'Zimmerli' + (ok ? '' : ' (extrapolado d>10 mm)'),\n      confiavel: ok\n    };\n  }\n  const g = jateado ? 1.35 : 1.0;\n  return {\n    Ssa: mat.fad.ka * Sut * g,\n    Ssm: mat.fad.km * Sut * g,\n    fonte: 'estimativa por fracao de Sut',\n    confiavel: false\n  };\n}\n\n/* Converte o par (Ssa,Ssm) no limite de resistencia Sse do criterio escolhido */\nfunction sseDe(Ssa, Ssm, Ssu, criterio) {\n  if (criterio === 'gerber') {\n    const den = 1 - Math.pow(Ssm / Ssu, 2);\n    return den > 0 ? Ssa / den : Infinity;\n  }\n  const den = 1 - Ssm / Ssu;\n  return den > 0 ? Ssa / den : Infinity;\n}\n\n/* Amplitude admissivel na reta de carga r = ta/tm */\nfunction amplitudeAdmissivel(r, Sse, Ssu, criterio) {\n  if (!Number.isFinite(r) || r <= 0) return NaN;\n  if (criterio === 'gerber') {\n    const k = (2 * Sse) / (r * Ssu);\n    return ((r * r * Ssu * Ssu) / (2 * Sse)) * (-1 + Math.sqrt(1 + k * k));\n  }\n  // Goodman modificado\n  const Sm = 1 / (r / Sse + 1 / Ssu);\n  return r * Sm;\n}\n\n/* Estimativa de vida em ciclos quando nf < 1 (interpolacao log-log 1e3..1e6) */\nfunction vidaEstimada(ta, Sse, Ssu) {\n  const S1e3 = 0.75 * Ssu;          // ponto de 1e3 ciclos em torcao (aprox.)\n  if (ta <= Sse) return Infinity;\n  if (ta >= S1e3) return 1e3;\n  const b = (Math.log10(S1e3) - Math.log10(Sse)) / (Math.log10(1e3) - Math.log10(1e6));\n  const a = Math.pow(10, Math.log10(S1e3) - b * 3);\n  return Math.pow(ta / a, 1 / b);\n}\n\n/* ==================== MOLA DE COMPRESSAO ==================== */\n/* ends: 'plana' | 'planaEsm' | 'esquadro' | 'esquadroEsm' */\nfunction geometriaCompressao(d, D, Nt, ends) {\n  let Na, Ls, tipo;\n  switch (ends) {\n    case 'plana':       Na = Nt;     Ls = d * (Nt + 1); tipo = 'Extremidades planas'; break;\n    case 'planaEsm':    Na = Nt - 1; Ls = d * Nt;       tipo = 'Planas e esmerilhadas'; break;\n    case 'esquadro':    Na = Nt - 2; Ls = d * (Nt + 1); tipo = 'Em esquadro (fechadas)'; break;\n    default:            Na = Nt - 2; Ls = d * Nt;       tipo = 'Em esquadro e esmerilhadas'; break;\n  }\n  return { Na, Ls, tipoExtremidade: tipo };\n}\n\nfunction calcCompressao(inp) {\n  const r = { avisos: [], erros: [] };\n  const mat = inp.mat;\n  const d = inp.d, D = inp.D, Nt = inp.Nt;\n\n  if (!(d > 0)) r.erros.push('Diametro do arame deve ser maior que zero.');\n  if (!(D > d)) r.erros.push('Diametro medio da mola deve ser maior que o diametro do arame.');\n  if (!(Nt > 0)) r.erros.push('Numero total de espiras deve ser maior que zero.');\n  if (r.erros.length) return r;\n\n  const p = propsTemp(mat, inp.T);\n  r.G = p.G; r.E = p.E; r.fatorTemp = p.fator;\n\n  const g = geometriaCompressao(d, D, Nt, inp.ends);\n  Object.assign(r, g);\n  if (!(g.Na > 0)) { r.erros.push('Numero de espiras ativas resultou nulo ou negativo para o tipo de extremidade escolhido.'); return r; }\n\n  r.C = D / d;\n  r.KB = KB(r.C);\n  r.KW = KW(r.C);\n  r.Dext = D + d;\n  r.Dint = D - d;\n\n  // rigidez\n  r.k = (p.G * Math.pow(d, 4)) / (8 * Math.pow(D, 3) * g.Na);\n\n  // resistencia do material\n  const su = sutMaterial(mat, d);\n  r.Sut = su.valor; r.SutInfo = su;\n  r.Ssy = mat.kSsy * r.Sut;\n  r.Ssu = mat.kSsu * r.Sut;\n\n  // comprimentos\n  r.L0 = inp.L0;\n  r.passo = (inp.ends === 'esquadroEsm') ? (r.L0 - 2 * d) / g.Na\n          : (inp.ends === 'esquadro')    ? (r.L0 - 3 * d) / g.Na\n          : (inp.ends === 'planaEsm')    ? r.L0 / (g.Na + 1)\n          :                                (r.L0 - d) / g.Na;\n  r.cursoTotal = r.L0 - g.Ls;\n\n  // cargas\n  const Fmax = inp.Fmax, Fmin = inp.Fmin;\n  r.Fmax = Fmax; r.Fmin = Fmin;\n  r.defMax = Fmax / r.k;\n  r.defMin = Fmin / r.k;\n  r.Lmax = r.L0 - r.defMax;                 // comprimento sob carga maxima\n  r.Fs = r.k * r.cursoTotal;                // forca para fechar totalmente a mola\n  r.deflexaoTotal = r.cursoTotal;\n\n  // tensoes\n  const tau = F => r.KB * (8 * F * D) / (Math.PI * Math.pow(d, 3));\n  r.tauMax = tau(Fmax);\n  r.tauMin = tau(Fmin);\n  r.tauS = tau(r.Fs);                       // tensao com a mola fechada\n  r.nEscoamento = r.Ssy / r.tauMax;\n  r.nFechada = r.Ssy / r.tauS;\n  r.utiliz = r.tauMax / r.Ssy;\n\n  // fadiga\n  const fd = dadosFadigaTorcao(mat, d, inp.jateado, r.Sut);\n  r.fadFonte = fd.fonte; r.fadConfiavel = fd.confiavel;\n  r.Fa = (Fmax - Fmin) / 2;\n  r.Fm = (Fmax + Fmin) / 2;\n  r.tauA = tau(r.Fa);\n  r.tauM = tau(r.Fm);\n  r.Sse = sseDe(fd.Ssa, fd.Ssm, r.Ssu, inp.criterio);\n  r.SsaRef = fd.Ssa; r.SsmRef = fd.Ssm;\n  if (r.tauA > 1e-9) {\n    const rr = r.tauA / r.tauM;\n    r.razaoCarga = rr;\n    r.SaAdm = amplitudeAdmissivel(rr, r.Sse, r.Ssu, inp.criterio);\n    r.nFadiga = r.SaAdm / r.tauA;\n    r.vida = r.nFadiga >= 1 ? Infinity : vidaEstimada(r.tauA, r.Sse, r.Ssu);\n  } else {\n    r.razaoCarga = 0; r.SaAdm = NaN; r.nFadiga = Infinity; r.vida = Infinity;\n  }\n\n  // flambagem (mola comprimida entre superficies paralelas)\n  r.alpha = inp.apoio === 'articulado' ? 0.707 : 0.5;\n  r.esbeltez = r.L0 / D;\n  r.L0critAbs = 2.63 * D / r.alpha;\n  r.estavelSempre = r.L0 < r.L0critAbs;\n  if (!r.estavelSempre) {\n    const C1 = p.E / (2 * (p.E - p.G));\n    const C2 = (2 * Math.PI * Math.PI * (p.E - p.G)) / (2 * p.G + p.E);\n    const lam = r.alpha * r.L0 / D;\n    const arg = 1 - C2 / (lam * lam);\n    r.defCritica = arg > 0 ? r.L0 * C1 * (1 - Math.sqrt(arg)) : 0;\n    r.FCritica = r.defCritica * r.k;\n  } else {\n    r.defCritica = Infinity; r.FCritica = Infinity;\n  }\n\n  // massa e frequencia natural\n  r.compArame = Math.PI * D * Nt;\n  r.massa = (Math.PI * d * d / 4) * r.compArame * mat.rho * 1e-9;   // kg\n  const massaAtiva = (Math.PI * d * d / 4) * (Math.PI * D * g.Na) * mat.rho * 1e-9;\n  r.massaAtiva = massaAtiva;\n  const kSI = r.k * 1000;                                          // N/m\n  r.f1 = massaAtiva > 0 ? 0.5 * Math.sqrt(kSI / massaAtiva) : NaN;  // ambas extremidades fixas\n  r.f1livre = massaAtiva > 0 ? 0.25 * Math.sqrt(kSI / massaAtiva) : NaN;\n  r.fExc = inp.fExc;\n  r.razaoFreq = inp.fExc > 0 ? r.f1 / inp.fExc : NaN;\n\n  avisosCompressao(r, inp, mat, su);\n  return r;\n}\n\nfunction avisosCompressao(r, inp, mat, su) {\n  const A = (n, t) => r.avisos.push({ nivel: n, texto: t });\n\n  if (r.C < 4) A('erro', `Indice de mola C = ${fmt(r.C)} abaixo de 4. Enrolamento sujeito a trincas e tolerancias ruins. Aumente D ou reduza d.`);\n  else if (r.C > 12) A('atencao', `Indice de mola C = ${fmt(r.C)} acima de 12. Mola frouxa, com risco de emaranhamento e variacao dimensional. Faixa preferencial: 4 a 12.`);\n\n  if (inp.d < mat.dmin || inp.d > mat.dmax)\n    A('atencao', `Diametro de arame ${fmt(inp.d)} mm fora da faixa comercial do material (${fmt(mat.dmin)} a ${fmt(mat.dmax)} mm).`);\n\n  if (su.extrapolado)\n    A('atencao', 'Sut extrapolado fora da faixa de validade da lei de potencia. Confirme a resistencia no certificado do arame.');\n  if (su.origem === 'faixa')\n    A('info', `Sut adotado como media da faixa do material (${fmt(mat.sut.min, 0)} a ${fmt(mat.sut.max, 0)} MPa). Confirme com o fornecedor.`);\n\n  if (r.cursoTotal <= 0) A('erro', 'Comprimento livre menor ou igual ao comprimento fechado. Aumente L0.');\n  if (r.Lmax < r.Ls) A('erro', `Sob carga maxima a mola fecha (L = ${fmt(r.Lmax)} mm < Ls = ${fmt(r.Ls)} mm). Reduza a carga, aumente L0 ou reduza a rigidez.`);\n  else if (r.defMax > 0.8 * r.cursoTotal) A('atencao', `Deflexao maxima consome ${fmt(100 * r.defMax / r.cursoTotal, 0)}% do curso disponivel. Reserve folga para sobrecarga.`);\n\n  if (r.nEscoamento < 1) A('erro', `Tensao de cisalhamento ${fmt(r.tauMax, 0)} MPa acima do escoamento admissivel ${fmt(r.Ssy, 0)} MPa. Fator ${fmt(r.nEscoamento)}.`);\n  else if (r.nEscoamento < 1.2) A('atencao', `Fator de seguranca ao escoamento ${fmt(r.nEscoamento)} — abaixo de 1,2. Deformacao permanente provavel.`);\n\n  if (r.nFechada < 1.2) A('atencao', `Se a mola for totalmente fechada o fator cai a ${fmt(r.nFechada)}. Prever batente ou aumentar o curso.`);\n\n  if (r.passo < 1.05 * inp.d && r.passo > 0) A('atencao', 'Passo proximo ao diametro do arame: espiras praticamente em contato no estado livre.');\n  if (r.passo > 0.5 * inp.D) A('atencao', 'Passo maior que metade do diametro medio — verificar estabilidade e tensao adicional de flexao.');\n\n  if (!r.estavelSempre) {\n    if (r.defMax >= r.defCritica) A('erro', `Flambagem: deflexao ${fmt(r.defMax)} mm atinge a critica ${fmt(r.defCritica)} mm. Use guia interna, tubo ou reduza L0.`);\n    else A('atencao', `Esbeltez L0/D = ${fmt(r.esbeltez)} exige verificacao. Deflexao critica ${fmt(r.defCritica)} mm — margem de ${fmt(100 * (1 - r.defMax / r.defCritica), 0)}%.`);\n  }\n\n  if (Number.isFinite(r.nFadiga)) {\n    if (r.nFadiga < 1) A('erro', `Fadiga: fator ${fmt(r.nFadiga)} (<1). Vida estimada ${r.vida === Infinity ? 'infinita' : fmt(r.vida, 0) + ' ciclos'}. Considere jateamento, bitola maior ou material de qualidade valvula.`);\n    else if (r.nFadiga < 1.3) A('atencao', `Fadiga: fator ${fmt(r.nFadiga)} — margem estreita para vida infinita.`);\n  }\n  if (!r.fadConfiavel)\n    A('info', `Dados de fadiga por ${r.fadFonte}. Trate o resultado como pre-dimensionamento e confirme com ensaio ou dados do fabricante.`);\n\n  if (inp.T > mat.tmax) A('erro', `Temperatura de ${fmt(inp.T, 0)} degC acima do limite do material (${fmt(mat.tmax, 0)} degC). Relaxacao e perda de carga permanente.`);\n  else if (inp.T > 0.85 * mat.tmax) A('atencao', `Temperatura proxima do limite (${fmt(mat.tmax, 0)} degC). Prever perda de carga por relaxacao.`);\n  if (inp.T < mat.tmin) A('atencao', `Temperatura abaixo do limite recomendado (${fmt(mat.tmin, 0)} degC) — risco de fragilizacao.`);\n\n  if (Number.isFinite(r.razaoFreq)) {\n    if (r.razaoFreq < 13) A('erro', `Frequencia natural ${fmt(r.f1, 1)} Hz e apenas ${fmt(r.razaoFreq, 1)}x a de excitacao. Ressonancia (surge) provavel — recomenda-se pelo menos 13x, preferencialmente 20x.`);\n    else if (r.razaoFreq < 20) A('atencao', `Razao de frequencias ${fmt(r.razaoFreq, 1)}x. Aceitavel, mas o ideal e no minimo 20x.`);\n  }\n  return r;\n}\n\n/* ==================== MOLA DE TRACAO ==================== */\nfunction calcTracao(inp) {\n  const r = { avisos: [], erros: [] };\n  const mat = inp.mat, d = inp.d, D = inp.D;\n\n  if (!(d > 0)) r.erros.push('Diametro do arame deve ser maior que zero.');\n  if (!(D > d)) r.erros.push('Diametro medio deve ser maior que o diametro do arame.');\n  if (!(inp.Nb > 0)) r.erros.push('Numero de espiras do corpo deve ser maior que zero.');\n  if (r.erros.length) return r;\n\n  const p = propsTemp(mat, inp.T);\n  r.G = p.G; r.E = p.E; r.fatorTemp = p.fator;\n  r.C = D / d;\n  r.KB = KB(r.C);\n  r.Dext = D + d; r.Dint = D - d;\n\n  // espiras ativas: corpo + correcao dos ganchos (Shigley: Na = Nb + G/E)\n  r.Nb = inp.Nb;\n  r.Na = inp.Nb + p.G / p.E;\n  r.k = (p.G * Math.pow(d, 4)) / (8 * Math.pow(D, 3) * r.Na);\n\n  const su = sutMaterial(mat, d);\n  r.Sut = su.valor; r.SutInfo = su;\n  r.Ssy = mat.kSsy * r.Sut;          // corpo, em torcao\n  r.Ssu = mat.kSsu * r.Sut;\n  r.SyGancho = 0.75 * r.Sut;         // gancho em flexao\n  r.SsyGancho = 0.40 * r.Sut;        // gancho em torcao\n\n  // geometria\n  r.Lcorpo = d * (inp.Nb + 1);\n  r.L0 = inp.L0 > 0 ? inp.L0 : r.Lcorpo + 2 * inp.r1 * 2;\n  r.compGanchos = r.L0 - r.Lcorpo;\n\n  // tensao inicial (pre-carga de enrolamento)\n  const tauiRec = 231 / Math.exp(0.105 * r.C);\n  r.tauiRec = tauiRec;\n  r.tauiRecMin = tauiRec * 0.85;\n  r.tauiRecMax = tauiRec * 1.15;\n  r.FiRec = tauiRec * Math.PI * Math.pow(d, 3) / (8 * D * r.KB);\n  r.Fi = Number.isFinite(inp.Fi) && inp.Fi >= 0 ? inp.Fi : r.FiRec;\n  r.taui = r.KB * 8 * r.Fi * D / (Math.PI * Math.pow(d, 3));\n\n  // cargas e deflexoes (deflexao so ocorre acima de Fi)\n  const Fmax = inp.Fmax, Fmin = inp.Fmin;\n  r.Fmax = Fmax; r.Fmin = Fmin;\n  r.defMax = Math.max(0, (Fmax - r.Fi)) / r.k;\n  r.defMin = Math.max(0, (Fmin - r.Fi)) / r.k;\n  r.Lmax = r.L0 + r.defMax;\n  r.alongPerc = 100 * r.defMax / r.Lcorpo;\n\n  // tensoes no corpo\n  const tau = F => r.KB * (8 * F * D) / (Math.PI * Math.pow(d, 3));\n  r.tauMax = tau(Fmax); r.tauMin = tau(Fmin);\n  r.nEscoamento = r.Ssy / r.tauMax;\n  r.utiliz = r.tauMax / r.Ssy;\n\n  // ganchos — flexao (ponto A) e torcao (ponto B)\n  const r1 = inp.r1 > 0 ? inp.r1 : D / 2;   // raio medio da curva do gancho (plano da espira)\n  const r2 = inp.r2 > 0 ? inp.r2 : d;       // raio medio da curva de transicao\n  r.r1 = r1; r.r2 = r2;\n  r.KA = r1 / (r1 - d / 2) > 0 ? r1 / (r1 - d / 2) : 1;\n  r.KBg = r2 / (r2 - d / 2) > 0 ? r2 / (r2 - d / 2) : 1;\n  r.sigmaA = Fmax * (r.KA * (16 * D) / (Math.PI * Math.pow(d, 3)) + 4 / (Math.PI * d * d));\n  r.tauB = r.KBg * (8 * Fmax * D) / (Math.PI * Math.pow(d, 3));\n  r.nGanchoFlexao = r.SyGancho / r.sigmaA;\n  r.nGanchoTorcao = r.SsyGancho / r.tauB;\n\n  // fadiga no corpo\n  const fd = dadosFadigaTorcao(mat, d, inp.jateado, r.Sut);\n  r.fadFonte = fd.fonte; r.fadConfiavel = fd.confiavel;\n  r.Fa = (Fmax - Fmin) / 2; r.Fm = (Fmax + Fmin) / 2;\n  r.tauA_amp = tau(r.Fa); r.tauM = tau(r.Fm);\n  r.Sse = sseDe(fd.Ssa, fd.Ssm, r.Ssu, inp.criterio);\n  r.SsaRef = fd.Ssa; r.SsmRef = fd.Ssm;\n  if (r.tauA_amp > 1e-9) {\n    const rr = r.tauA_amp / r.tauM;\n    r.razaoCarga = rr;\n    r.SaAdm = amplitudeAdmissivel(rr, r.Sse, r.Ssu, inp.criterio);\n    r.nFadiga = r.SaAdm / r.tauA_amp;\n    r.vida = r.nFadiga >= 1 ? Infinity : vidaEstimada(r.tauA_amp, r.Sse, r.Ssu);\n  } else { r.razaoCarga = 0; r.nFadiga = Infinity; r.vida = Infinity; r.SaAdm = NaN; }\n\n  // massa\n  r.compArame = Math.PI * D * inp.Nb + 2 * Math.PI * r1;\n  r.massa = (Math.PI * d * d / 4) * r.compArame * mat.rho * 1e-9;\n  const massaAtiva = (Math.PI * d * d / 4) * (Math.PI * D * r.Na) * mat.rho * 1e-9;\n  r.massaAtiva = massaAtiva;\n  r.f1 = massaAtiva > 0 ? 0.5 * Math.sqrt(r.k * 1000 / massaAtiva) : NaN;\n  r.f1livre = r.f1 / 2;\n  r.fExc = inp.fExc;\n  r.razaoFreq = inp.fExc > 0 ? r.f1 / inp.fExc : NaN;\n\n  avisosTracao(r, inp, mat, su);\n  return r;\n}\n\nfunction avisosTracao(r, inp, mat, su) {\n  const A = (n, t) => r.avisos.push({ nivel: n, texto: t });\n\n  if (r.C < 4) A('erro', `Indice de mola C = ${fmt(r.C)} abaixo de 4 — enrolamento inviavel ou com trincas.`);\n  else if (r.C > 12) A('atencao', `Indice C = ${fmt(r.C)} acima de 12. Faixa preferencial: 4 a 12.`);\n\n  if (inp.d < mat.dmin || inp.d > mat.dmax)\n    A('atencao', `Bitola fora da faixa comercial do material (${fmt(mat.dmin)} a ${fmt(mat.dmax)} mm).`);\n  if (su.extrapolado) A('atencao', 'Sut extrapolado — confirme no certificado do arame.');\n  if (su.origem === 'faixa') A('info', `Sut adotado como media da faixa (${fmt(mat.sut.min, 0)} a ${fmt(mat.sut.max, 0)} MPa).`);\n\n  if (inp.Fmax <= r.Fi) A('erro', `Carga maxima (${fmt(inp.Fmax)} N) nao supera a pre-carga de enrolamento (${fmt(r.Fi)} N): a mola nao se abre.`);\n  if (Number.isFinite(inp.Fi) && inp.Fi > 0) {\n    if (r.taui > r.tauiRecMax) A('atencao', `Tensao inicial ${fmt(r.taui, 0)} MPa acima da faixa recomendada para C = ${fmt(r.C)} (${fmt(r.tauiRecMin, 0)} a ${fmt(r.tauiRecMax, 0)} MPa). Dificil de obter no enrolamento.`);\n    else if (r.taui < r.tauiRecMin) A('info', `Tensao inicial ${fmt(r.taui, 0)} MPa abaixo da faixa usual — verificar se o fabricante consegue controlar.`);\n  } else {\n    A('info', `Pre-carga nao informada: adotada a recomendada de ${fmt(r.FiRec)} N (tensao inicial ${fmt(r.tauiRec, 0)} MPa).`);\n  }\n\n  if (r.nEscoamento < 1) A('erro', `Corpo: tensao ${fmt(r.tauMax, 0)} MPa acima do admissivel ${fmt(r.Ssy, 0)} MPa (fator ${fmt(r.nEscoamento)}).`);\n  else if (r.nEscoamento < 1.2) A('atencao', `Corpo: fator ao escoamento ${fmt(r.nEscoamento)} — abaixo de 1,2.`);\n\n  if (r.nGanchoFlexao < 1) A('erro', `Gancho em flexao: ${fmt(r.sigmaA, 0)} MPa acima do admissivel ${fmt(r.SyGancho, 0)} MPa (fator ${fmt(r.nGanchoFlexao)}). O gancho e quase sempre o ponto critico — aumente o raio r1.`);\n  else if (r.nGanchoFlexao < 1.2) A('atencao', `Gancho em flexao com fator ${fmt(r.nGanchoFlexao)}. Aumente r1 para reduzir KA.`);\n  if (r.nGanchoTorcao < 1) A('erro', `Gancho em torcao: ${fmt(r.tauB, 0)} MPa acima do admissivel ${fmt(r.SsyGancho, 0)} MPa (fator ${fmt(r.nGanchoTorcao)}). Aumente o raio r2.`);\n  else if (r.nGanchoTorcao < 1.2) A('atencao', `Gancho em torcao com fator ${fmt(r.nGanchoTorcao)}.`);\n\n  if (r.alongPerc > 100) A('atencao', `Alongamento de ${fmt(r.alongPerc, 0)}% do corpo. Molas de tracao raramente admitem mais de 100% — verificar deformacao permanente.`);\n\n  if (Number.isFinite(r.nFadiga)) {\n    if (r.nFadiga < 1) A('erro', `Fadiga no corpo: fator ${fmt(r.nFadiga)} (<1). Vida estimada ${r.vida === Infinity ? 'infinita' : fmt(r.vida, 0) + ' ciclos'}.`);\n    else if (r.nFadiga < 1.3) A('atencao', `Fadiga no corpo: fator ${fmt(r.nFadiga)} — margem estreita.`);\n  }\n  A('info', 'Molas de tracao nao permitem jateamento eficaz nos ganchos: a vida em fadiga e normalmente governada pelo gancho, nao pelo corpo.');\n  if (!r.fadConfiavel) A('info', `Dados de fadiga por ${r.fadFonte} — tratar como pre-dimensionamento.`);\n\n  if (inp.T > mat.tmax) A('erro', `Temperatura ${fmt(inp.T, 0)} degC acima do limite do material (${fmt(mat.tmax, 0)} degC).`);\n  else if (inp.T > 0.85 * mat.tmax) A('atencao', `Temperatura proxima do limite (${fmt(mat.tmax, 0)} degC) — prever relaxacao.`);\n\n  if (Number.isFinite(r.razaoFreq) && r.razaoFreq < 13)\n    A('erro', `Frequencia natural ${fmt(r.f1, 1)} Hz apenas ${fmt(r.razaoFreq, 1)}x a excitacao — risco de ressonancia.`);\n  return r;\n}\n\n/* ==================== MOLA DE TORCAO ==================== */\nfunction calcTorcao(inp) {\n  const r = { avisos: [], erros: [] };\n  const mat = inp.mat, d = inp.d, D = inp.D;\n\n  if (!(d > 0)) r.erros.push('Diametro do arame deve ser maior que zero.');\n  if (!(D > d)) r.erros.push('Diametro medio deve ser maior que o diametro do arame.');\n  if (!(inp.Nb > 0)) r.erros.push('Numero de espiras do corpo deve ser maior que zero.');\n  if (r.erros.length) return r;\n\n  const p = propsTemp(mat, inp.T);\n  r.G = p.G; r.E = p.E; r.fatorTemp = p.fator;\n  r.C = D / d;\n  r.Ki = KI(r.C);\n  r.Dint = D - d; r.Dext = D + d;\n\n  // espiras equivalentes das pernas\n  r.Nb = inp.Nb;\n  r.Ne = (inp.L1 + inp.L2) / (3 * Math.PI * D);\n  r.Na = inp.Nb + r.Ne;\n\n  // rigidez: k' = d^4 E / (10,8 D Na) por volta\n  r.kVolta = (Math.pow(d, 4) * p.E) / (10.8 * D * r.Na);   // N.mm/volta\n  r.kGrau = r.kVolta / 360;                                // N.mm/grau\n  r.kRad = r.kVolta / (2 * Math.PI);\n\n  const su = sutMaterial(mat, d);\n  r.Sut = su.valor; r.SutInfo = su;\n  r.Sy = mat.kSy * r.Sut;                    // escoamento em flexao\n  r.Sr = (inp.jateado ? 1.20 : 1.0) * mat.kFlex * r.Sut;  // resistencia a fadiga em flexao (1e6)\n  r.Su = r.Sut;\n\n  // momentos (por forca x braco, ou momento direto)\n  r.Mmax = inp.Mmax; r.Mmin = inp.Mmin;\n  r.thetaMaxGrau = r.Mmax / r.kGrau;\n  r.thetaMinGrau = r.Mmin / r.kGrau;\n  r.thetaMaxVolta = r.thetaMaxGrau / 360;\n  r.deltaThetaGrau = r.thetaMaxGrau - r.thetaMinGrau;\n\n  // tensoes de flexao\n  const sig = M => r.Ki * (32 * M) / (Math.PI * Math.pow(d, 3));\n  r.sigMax = sig(r.Mmax);\n  r.sigMin = sig(r.Mmin);\n  r.nEscoamento = r.Sy / r.sigMax;\n  r.utiliz = r.sigMax / r.Sy;\n\n  // fadiga em flexao (Goodman/Gerber com Sr em 1e6)\n  r.Ma = (r.Mmax - r.Mmin) / 2;\n  r.Mm = (r.Mmax + r.Mmin) / 2;\n  r.sigA = sig(r.Ma);\n  r.sigM = sig(r.Mm);\n  // Sr e publicado para carregamento repetido (Mmin=0), onde Sa = Sm = Sr/2.\n  // Converte-se esse ponto no limite equivalente Se do criterio adotado.\n  r.Se = sseDe(r.Sr / 2, r.Sr / 2, r.Su, inp.criterio);\n  if (r.sigA > 1e-9) {\n    const rr = r.sigA / r.sigM;\n    r.razaoCarga = rr;\n    r.SaAdm = amplitudeAdmissivel(rr, r.Se, r.Su, inp.criterio);\n    r.nFadiga = r.SaAdm / r.sigA;\n    r.vida = r.nFadiga >= 1 ? Infinity : vidaEstimada(r.sigA, r.Se, r.Su);\n  } else { r.razaoCarga = 0; r.nFadiga = Infinity; r.vida = Infinity; r.SaAdm = NaN; }\n\n  // geometria sob deflexao: o corpo fecha e o diametro diminui\n  r.LcorpoLivre = d * (inp.Nb + 1);\n  r.NbDefletido = inp.Nb + r.thetaMaxVolta;\n  r.DDefletido = (inp.Nb * D) / r.NbDefletido;\n  r.DintDefletido = r.DDefletido - d;\n  r.LcorpoMax = d * (r.NbDefletido + 1);\n  r.folgaMandril = inp.dMandril > 0 ? r.DintDefletido - inp.dMandril : NaN;\n  r.dMandrilMax = r.DintDefletido * 0.9;\n\n  // massa\n  r.compArame = Math.PI * D * inp.Nb + inp.L1 + inp.L2;\n  r.massa = (Math.PI * d * d / 4) * r.compArame * mat.rho * 1e-9;\n\n  avisosTorcao(r, inp, mat, su);\n  return r;\n}\n\nfunction avisosTorcao(r, inp, mat, su) {\n  const A = (n, t) => r.avisos.push({ nivel: n, texto: t });\n\n  if (r.C < 4) A('erro', `Indice C = ${fmt(r.C)} abaixo de 4 — inviavel para enrolamento.`);\n  else if (r.C > 12) A('atencao', `Indice C = ${fmt(r.C)} acima de 12. Faixa preferencial: 4 a 12.`);\n\n  if (inp.d < mat.dmin || inp.d > mat.dmax)\n    A('atencao', `Bitola fora da faixa comercial do material (${fmt(mat.dmin)} a ${fmt(mat.dmax)} mm).`);\n  if (su.extrapolado) A('atencao', 'Sut extrapolado — confirmar no certificado.');\n  if (su.origem === 'faixa') A('info', `Sut adotado como media da faixa (${fmt(mat.sut.min, 0)} a ${fmt(mat.sut.max, 0)} MPa).`);\n\n  if (r.nEscoamento < 1) A('erro', `Tensao de flexao ${fmt(r.sigMax, 0)} MPa acima do admissivel ${fmt(r.Sy, 0)} MPa (fator ${fmt(r.nEscoamento)}).`);\n  else if (r.nEscoamento < 1.2) A('atencao', `Fator ao escoamento ${fmt(r.nEscoamento)} — abaixo de 1,2.`);\n\n  if (r.thetaMaxGrau > 360) A('atencao', `Rotacao de ${fmt(r.thetaMaxGrau, 0)}deg (${fmt(r.thetaMaxVolta, 2)} voltas). Acima de 1 volta o corpo se alonga e o controle dimensional piora.`);\n  if (r.deltaThetaGrau < 0) A('erro', 'Mom
