ento minimo maior que o maximo — inverta os valores.');\n\n  if (inp.sentido === 'contra')\n    A('erro', 'Carregamento no sentido de abrir a espira: as tensoes residuais de enrolamento passam a ser desfavoraveis e a resistencia cai drasticamente. Molas de torcao devem ser carregadas no sentido de fechar o enrolamento.');\n\n  if (inp.dMandril > 0) {\n    if (r.folgaMandril <= 0) A('erro', `O mandril (${fmt(inp.dMandril)} mm) e maior que o diametro interno sob carga (${fmt(r.DintDefletido)} mm): a mola trava. Use no maximo ${fmt(r.dMandrilMax)} mm.`);\n    else if (r.folgaMandril < 0.1 * inp.d) A('atencao', `Folga radial de apenas ${fmt(r.folgaMandril, 2)} mm sobre o mandril. Recomenda-se pelo menos 10% do diametro do arame.`);\n  } else {\n    A('info', `Diametro maximo de mandril recomendado: ${fmt(r.dMandrilMax)} mm (90% do diametro interno sob carga maxima).`);\n  }\n\n  if (Number.isFinite(r.nFadiga)) {\n    if (r.nFadiga < 1) A('erro', `Fadiga em flexao: fator ${fmt(r.nFadiga)} (<1). Vida estimada ${r.vida === Infinity ? 'infinita' : fmt(r.vida, 0) + ' ciclos'}.`);\n    else if (r.nFadiga < 1.3) A('atencao', `Fadiga em flexao: fator ${fmt(r.nFadiga)} — margem estreita.`);\n  }\n  A('info', `Resistencia a fadiga em flexao adotada como ${fmt(100 * mat.kFlex, 0)}% de Sut${inp.jateado ? ' com bonus de 20% por jateamento' : ''}. Valor de referencia — confirmar com o fabricante para ciclagem critica.`);\n\n  if (inp.T > mat.tmax) A('erro', `Temperatura ${fmt(inp.T, 0)} degC acima do limite do material (${fmt(mat.tmax, 0)} degC).`);\n  else if (inp.T > 0.85 * mat.tmax) A('atencao', `Temperatura proxima do limite (${fmt(mat.tmax, 0)} degC).`);\n\n  A('info', 'Verificar tambem a flexao das pernas (L1/L2) como vigas engastadas — nao coberto por este modulo.');\n  return r;\n}\n\n/* ============ COMPARADOR: mesma geometria, todos os materiais ============ */\nfunction compararMateriais(inp, tipo) {\n  const out = [];\n  for (const m of MATERIAIS) {\n    const i = Object.assign({}, inp, { mat: m });\n    let res;\n    try {\n      res = tipo === 'compressao' ? calcCompressao(i)\n          : tipo === 'tracao'     ? calcTracao(i)\n          :                         calcTorcao(i);\n    } catch (e) { continue; }\n    if (res.erros && res.erros.length) continue;\n    const bitolaOk = inp.d >= m.dmin && inp.d <= m.dmax;\n    const tempOk = inp.T <= m.tmax && inp.T >= m.tmin;\n    const nEsc = res.nEscoamento, nFad = res.nFadiga;\n    out.push({\n      mat: m, k: res.k || res.kGrau, Sut: res.Sut,\n      nEscoamento: nEsc, nFadiga: nFad, massa: res.massa,\n      bitolaOk, tempOk,\n      viavel: nEsc >= 1.2 && (!Number.isFinite(nFad) || nFad >= 1) && bitolaOk && tempOk,\n      erros: (res.avisos || []).filter(a => a.nivel === 'erro').length\n    });\n  }\n  return out;\n}\n\n\n/* ==========================================================================\n   MolaPro — APLICACAO\n   ========================================================================== */\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s == null ? '' : s)\n  .replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\nconst KEY = 'molapro.v1';\n\nlet TIPO = 'compressao';\nlet R = null;          // ultimo resultado\nlet INP = null;        // ultima entrada\n\n/* ---------------------------------------------------- populacao dos selects */\nfunction popularMateriais() {\n  const fam = $('fFamilia'), mat = $('fMaterial'), bfam = $('bFam');\n  fam.innerHTML = '<option value=\"\">Todas as famílias<\u002Foption>' +\n    Object.entries(FAMILIAS).map(([k, v]) => `<option value=\"${k}\">${esc(v)}<\u002Foption>`).join('');\n  bfam.innerHTML = '<option value=\"\">Todas<\u002Foption>' +\n    Object.entries(FAMILIAS).map(([k, v]) => `<option value=\"${k}\">${esc(v)}<\u002Foption>`).join('');\n  atualizarListaMateriais();\n  mat.value = 'A229';\n}\nfunction atualizarListaMateriais() {\n  const f = $('fFamilia').value, mat = $('fMaterial'), atual = mat.value;\n  const lista = MATERIAIS.filter(m => !f || m.fam === f);\n  mat.innerHTML = lista.map(m =>\n    `<option value=\"${m.id}\">${esc(m.nome)} — ${esc(m.norma)}<\u002Foption>`).join('');\n  if (lista.some(m => m.id === atual)) mat.value = atual;\n}\nconst matAtual = () => MATERIAIS.find(m => m.id === $('fMaterial').value) || MATERIAIS[2];\n\nfunction renderChip() {\n  const m = matAtual(), d = parseNum($('fd').value);\n  const su = sutMaterial(m, Number.isFinite(d) && d > 0 ? d : 2);\n  const magTxt = m.mag === true ? 'Sim' : m.mag === 'leve' ? 'Leve (após encruar)' : 'Não';\n  $('chipMat').innerHTML = `<dl>\n    <dt>Família<\u002Fdt><dd>${esc(FAMILIAS[m.fam])}<\u002Fdd>\n    <dt>G<\u002Fdt><dd>${fmt(m.G / 1000, 1)} GPa<\u002Fdd>\n    <dt>E<\u002Fdt><dd>${fmt(m.E / 1000, 1)} GPa<\u002Fdd>\n    <dt>ρ<\u002Fdt><dd>${fmt(m.rho, 0)} kg/m³<\u002Fdd>\n    <dt>S<sub>ut<\u002Fsub><\u002Fdt><dd>${fmt(su.valor, 0)} MPa ${su.origem === 'potencia' ? '(lei de potência)' : '(média da faixa)'}<\u002Fdd>\n    <dt>Bitolas<\u002Fdt><dd>${fmt(m.dmin, 2)} a ${fmt(m.dmax, 2)} mm<\u002Fdd>\n    <dt>Temp.<\u002Fdt><dd>${fmt(m.tmin, 0)} a ${fmt(m.tmax, 0)} °C<\u002Fdd>\n    <dt>Corrosão<\u002Fdt><dd>${esc(CORR_LABEL[m.corr])}<\u002Fdd>\n    <dt>Magnético<\u002Fdt><dd>${esc(magTxt)}<\u002Fdd>\n    <dt>Custo rel.<\u002Fdt><dd>${fmt(m.custo, 1)}×<\u002Fdd>\n  <\u002Fdl>`;\n}\n\n/* ------------------------------------------------------------ coleta de dados */\nfunction coletar() {\n  const mat = matAtual();\n  const base = {\n    mat, d: parseNum($('fd').value), D: parseNum($('fD').value),\n    T: parseNum($('fT').value) || 20,\n    criterio: $('fCriterio').value, jateado: $('fJateado').checked,\n    fExc: parseNum($('ffExc').value) || 0\n  };\n  if (TIPO === 'compressao') {\n    return Object.assign(base, {\n      Nt: parseNum($('fNt').value), L0: parseNum($('fL0').value),\n      ends: $('fEnds').value, apoio: $('fApoio').value,\n      Fmin: parseNum($('fFmin').value) || 0, Fmax: parseNum($('fFmax').value) || 0\n    });\n  }\n  if (TIPO === 'tracao') {\n    return Object.assign(base, {\n      Nb: parseNum($('fNb').value), L0: parseNum($('fL0t').value),\n      Fi: parseNum($('fFi').value), r1: parseNum($('fr1').value) || 0, r2: parseNum($('fr2').value) || 0,\n      Fmin: parseNum($('fFmin').value) || 0, Fmax: parseNum($('fFmax').value) || 0\n    });\n  }\n  let Mmin, Mmax;\n  if ($('fModoM').value === 'forca') {\n    const b = parseNum($('fBraco').value) || 0;\n    Mmin = (parseNum($('fFmint').value) || 0) * b;\n    Mmax = (parseNum($('fFmaxt').value) || 0) * b;\n  } else {\n    Mmin = parseNum($('fMmin').value) || 0;\n    Mmax = parseNum($('fMmax').value) || 0;\n  }\n  return Object.assign(base, {\n    Nb: parseNum($('fNbt').value), L1: parseNum($('fL1').value) || 0, L2: parseNum($('fL2').value) || 0,\n    dMandril: parseNum($('fdMandril').value) || 0, sentido: $('fSentido').value,\n    Mmin, Mmax\n  });\n}\n\n/* ================================ RENDER ================================ */\nfunction render() {\n  renderChip();\n  INP = coletar();\n  R = TIPO === 'compressao' ? calcCompressao(INP)\n    : TIPO === 'tracao'     ? calcTracao(INP)\n    :                         calcTorcao(INP);\n\n  if (R.erros && R.erros.length) {\n    $('dials').innerHTML = `<div class=\"dial\"><span class=\"eyebrow\">Entrada<\u002Fspan><b class=\"num\">—<\u002Fb><\u002Fdiv>`;\n    $('avisos').innerHTML = R.erros.map(e => `<div class=\"msg erro\"><b>Entrada<\u002Fb><span>${esc(e)}<\u002Fspan><\u002Fdiv>`).join('');\n    $('tabCalc').innerHTML = '<p style=\"color:var(--ink3)\">Corrija os dados de entrada para ver o cálculo.<\u002Fp>';\n    $('tabFad').innerHTML = ''; $('tabMem').innerHTML = '';\n    setGauge(0, '—');\n    renderBiblio();\n    return;\n  }\n  renderDials(); renderAvisos(); renderCalc(); renderFadiga();\n  renderDiagramas(); renderBiblio(); renderMemoria();\n}\n\nfunction classe(n, lim1 = 1.2, lim2 = 1.0) {\n  if (!Number.isFinite(n)) return 'ok';\n  return n < lim2 ? 'bad' : n < lim1 ? 'warn' : 'ok';\n}\nfunction setGauge(frac, texto, label) {\n  const f = Math.max(0, Math.min(1.35, frac));\n  const pct = (f / 1.35) * 100;\n  const fill = $('gFill');\n  fill.style.height = pct + '%';\n  fill.style.width = pct + '%';\n  fill.style.background = f >= 1 ? 'var(--bad)' : f >= 0.83 ? 'var(--warn)' : 'var(--ok)';\n  $('gVal').textContent = texto;\n  if (label) $('gLbl').innerHTML = label;\n  const tube = $('gTube');\n  tube.querySelectorAll('.tick,.redline').forEach(e => e.remove());\n  [0.25, 0.5, 0.75].forEach(v => {\n    const t = document.createElement('div'); t.className = 'tick';\n    t.style.bottom = ((v / 1.35) * 100) + '%'; tube.appendChild(t);\n  });\n  const rl = document.createElement('div'); rl.className = 'redline';\n  rl.style.bottom = ((1 / 1.35) * 100) + '%'; tube.appendChild(rl);\n}\n\nfunction renderDials() {\n  let dials = [];\n  if (TIPO === 'torcao') {\n    setGauge(R.utiliz, fmt(100 * R.utiliz, 0) + '%', 'σ / S<sub>y<\u002Fsub>');\n    dials = [\n      { l: 'Rigidez', v: fmt(R.kGrau, 3), u: 'N·mm/°', i: fmt(R.kVolta, 0) + ' N·mm/volta' },\n      { l: 'Rotação máx.', v: fmt(R.thetaMaxGrau, 1), u: '°', i: fmt(R.thetaMaxVolta, 2) + ' voltas' },\n      { l: 'Tensão de flexão', v: fmt(R.sigMax, 0), u: 'MPa', i: 'S<sub>y<\u002Fsub> = ' + fmt(R.Sy, 0) + ' MPa' },\n      { l: 'Fator escoam.', v: fmt(R.nEscoamento), u: '', i: 'σ<sub>máx<\u002Fsub> vs S<sub>y<\u002Fsub>', c: classe(R.nEscoamento) },\n      { l: 'Fator fadiga', v: Number.isFinite(R.nFadiga) ? fmt(R.nFadiga) : '∞', u: '', i: R.vida === Infinity ? 'vida infinita' : fmt(R.vida, 0) + ' ciclos', c: classe(R.nFadiga, 1.3) },\n      { l: 'Índice C', v: fmt(R.C), u: '', i: 'faixa 4 a 12', c: (R.C < 4 || R.C > 12) ? 'warn' : 'ok' },\n      { l: 'Massa', v: fmt(R.massa * 1000, 1), u: 'g', i: fmt(R.compArame, 0) + ' mm de arame' }\n    ];\n  } else {\n    setGauge(R.utiliz, fmt(100 * R.utiliz, 0) + '%', 'τ / S<sub>sy<\u002Fsub>');\n    dials = [\n      { l: 'Rigidez k', v: fmt(R.k, 3), u: 'N/mm', i: fmt(R.k * 9.80665, 2) + ' N/mm por kgf' },\n      { l: 'Deflexão máx.', v: fmt(R.defMax, 2), u: 'mm', i: TIPO === 'compressao' ? 'L = ' + fmt(R.Lmax, 1) + ' mm' : 'L = ' + fmt(R.Lmax, 1) + ' mm' },\n      { l: 'Tensão τ máx.', v: fmt(R.tauMax, 0), u: 'MPa', i: 'S<sub>sy<\u002Fsub> = ' + fmt(R.Ssy, 0) + ' MPa' },\n      { l: 'Fator escoam.', v: fmt(R.nEscoamento), u: '', i: 'τ<sub>máx<\u002Fsub> vs S<sub>sy<\u002Fsub>', c: classe(R.nEscoamento) },\n      { l: 'Fator fadiga', v: Number.isFinite(R.nFadiga) ? fmt(R.nFadiga) : '∞', u: '', i: R.vida === Infinity ? 'vida infinita' : fmt(R.vida, 0) + ' ciclos', c: classe(R.nFadiga, 1.3) },\n      { l: 'Índice C', v: fmt(R.C), u: '', i: 'faixa 4 a 12', c: (R.C < 4 || R.C > 12) ? 'warn' : 'ok' },\n      { l: 'Freq. natural', v: fmt(R.f1, 0), u: 'Hz', i: R.fExc > 0 ? fmt(R.razaoFreq, 1) + '× a excitação' : 'ambas fixas' },\n      { l: 'Massa', v: fmt(R.massa * 1000, 1), u: 'g', i: fmt(R.compArame, 0) + ' mm de arame' }\n    ];\n    if (TIPO === 'compressao') dials.splice(6, 0,\n      { l: 'Flambagem', v: R.estavelSempre ? 'estável' : fmt(R.defCritica, 1), u: R.estavelSempre ? '' : 'mm',\n        i: R.estavelSempre ? 'L₀ < 2,63·D/α' : 'deflexão crítica',\n        c: R.estavelSempre ? 'ok' : (R.defMax >= R.defCritica ? 'bad' : 'warn') });\n    if (TIPO === 'tracao') dials.splice(6, 0,\n      { l: 'Gancho (flexão)', v: fmt(R.nGanchoFlexao), u: '', i: fmt(R.sigmaA, 0) + ' MPa', c: classe(R.nGanchoFlexao) });\n  }\n  $('dials').innerHTML = dials.map(d => `<div class=\"dial ${d.c || ''}\">\n    <span class=\"eyebrow\">${d.l}<\u002Fspan>\n    <b class=\"num\">${d.v}${d.u ? `<u>${d.u}<\u002Fu>` : ''}<\u002Fb>\n    <i>${d.i || ''}<\u002Fi><\u002Fdiv>`).join('');\n}\n\nfunction renderAvisos() {\n  const ordem = { erro: 0, atencao: 1, info: 2 };\n  const av = (R.avisos || []).slice().sort((a, b) => ordem[a.nivel] - ordem[b.nivel]);\n  const nErro = av.filter(a => a.nivel === 'erro').length;\n  const nAt = av.filter(a => a.nivel === 'atencao').length;\n  let head = '';\n  if (nErro === 0 && nAt === 0)\n    head = `<div class=\"msg aprovado\"><b>Aprovado<\u002Fb><span>Nenhuma reprovação ou ressalva. A mola atende aos critérios de escoamento, fadiga e estabilidade verificados.<\u002Fspan><\u002Fdiv>`;\n  else if (nErro === 0)\n    head = `<div class=\"msg atencao\"><b>Ressalvas<\u002Fb><span>Sem reprovações, mas há ${nAt} ${nAt === 1 ? 'ponto' : 'pontos'} a revisar antes de fechar o projeto.<\u002Fspan><\u002Fdiv>`;\n  else\n    head = `<div class=\"msg erro\"><b>Reprovado<\u002Fb><span>${nErro} ${nErro === 1 ? 'critério não atendido' : 'critérios não atendidos'}. Ajuste geometria, material ou carregamento.<\u002Fspan><\u002Fdiv>`;\n  const rot = { erro: 'Reprova', atencao: 'Atenção', info: 'Nota' };\n  $('avisos').innerHTML = head + av.map(a =>\n    `<div class=\"msg ${a.nivel}\"><b>${rot[a.nivel]}<\u002Fb><span>${esc(a.texto)}<\u002Fspan><\u002Fdiv>`).join('');\n}\n\n/* --------------------------------------------------------- tabela de calculo */\nfunction linha(desc, formula, valor, unid, extra) {\n  return `<tr><td>${desc}${extra ? `<br><span class=\"formula\">${extra}<\u002Fspan>` : ''}<\u002Ftd>\n    <td class=\"formula\">${formula || ''}<\u002Ftd>\n    <td class=\"n\">${valor}<\u002Ftd><td class=\"formula\">${unid || ''}<\u002Ftd><\u002Ftr>`;\n}\nconst secao = t => `<tr class=\"tsec\"><td colspan=\"4\">${t}<\u002Ftd><\u002Ftr>`;\n\nfunction renderCalc() {\n  let h = `<table><thead><tr><th>Grandeza<\u002Fth><th>Expressão<\u002Fth><th style=\"text-align:right\">Valor<\u002Fth><th>Unidade<\u002Fth><\u002Ftr><\u002Fthead><tbody>`;\n\n  h += secao('Material e propriedades');\n  h += linha('Material', esc(R === null ? '' : matAtual().norma), esc(matAtual().nome), '');\n  h += linha('Módulo transversal a ' + fmt(INP.T, 0) + ' °C', 'G<sub>T<\u002Fsub> = G·(1 + α<sub>G<\u002Fsub>·ΔT)', fmt(R.G / 1000, 2), 'GPa',\n    'correção de ' + fmt(100 * (R.fatorTemp !== undefined ? R.fatorTemp - 1 : 0), 2) + '%');\n  h += linha('Módulo longitudinal', 'E<sub>T<\u002Fsub>', fmt(R.E / 1000, 2), 'GPa');\n  h += linha('Resistência à tração', R.SutInfo.origem === 'potencia'\n      ? `S<sub>ut<\u002Fsub> = ${fmt(R.SutInfo.A, 0)}·d<sup>−${fmt(R.SutInfo.m, 3)}<\u002Fsup>` : 'média da faixa',\n    fmt(R.Sut, 0), 'MPa');\n\n  if (TIPO === 'torcao') {\n    h += linha('Escoamento em flexão', `S<sub>y<\u002Fsub> = ${fmt(matAtual().kSy, 2)}·S<sub>ut<\u002Fsub>`, fmt(R.Sy, 0), 'MPa');\n    h += secao('Geometria');\n    h += linha('Índice de mola', 'C = D / d', fmt(R.C, 3), '');\n    h += linha('Fator de concentração (flexão)', 'K<sub>i<\u002Fsub> = (4C² − C − 1) / (4C(C − 1))', fmt(R.Ki, 4), '');\n    h += linha('Espiras equivalentes das pernas', 'N<sub>e<\u002Fsub> = (L₁ + L₂) / (3πD)', fmt(R.Ne, 3), 'espiras');\n    h += linha('Espiras ativas', 'N<sub>a<\u002Fsub> = N<sub>b<\u002Fsub> + N<sub>e<\u002Fsub>', fmt(R.Na, 3), 'espiras');\n    h += linha('Diâmetro interno livre', 'D<sub>int<\u002Fsub> = D − d', fmt(R.Dint, 2), 'mm');\n    h += linha('Comprimento do corpo (livre)', 'L = d·(N<sub>b<\u002Fsub> + 1)', fmt(R.LcorpoLivre, 2), 'mm');\n    h += secao('Rigidez');\n    h += linha('Rigidez por volta', \"k' = d⁴·E / (10,8·D·N<sub>a<\u002Fsub>)\", fmt(R.kVolta, 1), 'N·mm/volta');\n    h += linha('Rigidez por grau', \"k'/360\", fmt(R.kGrau, 4), 'N·mm/°');\n    h += linha('Rigidez por radiano', \"k'/2π\", fmt(R.kRad, 1), 'N·mm/rad');\n    h += secao('Deflexão angular');\n    h += linha('Momento máximo', 'M<sub>máx<\u002Fsub>', fmt(R.Mmax, 1), 'N·mm');\n    h += linha('Rotação sob M<sub>máx<\u002Fsub>', 'θ = M / k′<sub>grau<\u002Fsub>', fmt(R.thetaMaxGrau, 2), '°',\n      fmt(R.thetaMaxVolta, 3) + ' voltas');\n    h += linha('Rotação sob M<sub>mín<\u002Fsub>', '', fmt(R.thetaMinGrau, 2), '°');\n    h += linha('Curso angular útil', 'Δθ', fmt(R.deltaThetaGrau, 2), '°');\n    h += secao('Geometria sob carga máxima');\n    h += linha('Espiras do corpo defletido', 'N<sub>b<\u002Fsub>′ = N<sub>b<\u002Fsub> + θ<sub>voltas<\u002Fsub>', fmt(R.NbDefletido, 3), 'espiras');\n    h += linha('Diâmetro médio reduzido', \"D′ = N<sub>b<\u002Fsub>·D / N<sub>b<\u002Fsub>′\", fmt(R.DDefletido, 2), 'mm');\n    h += linha('Diâmetro interno sob carga', 'D<sub>int<\u002Fsub>′ = D′ − d', fmt(R.DintDefletido, 2), 'mm');\n    h += linha('Mandril máximo recomendado', '0,90 · D<sub>int<\u002Fsub>′', fmt(R.dMandrilMax, 2), 'mm');\n    h += linha('Comprimento do corpo sob carga', 'd·(N<sub>b<\u002Fsub>′ + 1)', fmt(R.LcorpoMax, 2), 'mm');\n    h += secao('Tensões de flexão');\n    h += linha('Tensão máxima', 'σ = K<sub>i<\u002Fsub>·32M / (πd³)', fmt(R.sigMax, 1), 'MPa');\n    h += linha('Tensão mínima', '', fmt(R.sigMin, 1), 'MPa');\n    h += linha('Fator de segurança ao escoamento', 'n = S<sub>y<\u002Fsub> / σ<sub>máx<\u002Fsub>', fmt(R.nEscoamento, 3), '');\n  } else {\n    h += linha('Escoamento em torção', `S<sub>sy<\u002Fsub> = ${fmt(matAtual().kSsy, 2)}·S<sub>ut<\u002Fsub>`, fmt(R.Ssy, 0), 'MPa');\n    h += linha('Ruptura em torção', `S<sub>su<\u002Fsub> = ${fmt(matAtual().kSsu, 2)}·S<sub>ut<\u002Fsub>`, fmt(R.Ssu, 0), 'MPa');\n\n    h += secao('Geometria');\n    h += linha('Índice de mola', 'C = D / d', fmt(R.C, 3), '');\n    h += linha('Fator de Bergsträsser', 'K<sub>B<\u002Fsub> = (4C + 2) / (4C − 3)', fmt(R.KB, 4), '');\n    if (TIPO === 'compressao') h += linha('Fator de Wahl (comparação)', 'K<sub>W<\u002Fsub> = (4C − 1)/(4C − 4) + 0,615/C', fmt(R.KW, 4), '');\n    h += linha('Diâmetro externo', 'D<sub>e<\u002Fsub> = D + d', fmt(R.Dext, 2), 'mm');\n    h += linha('Diâmetro interno', 'D<sub>i<\u002Fsub> = D − d', fmt(R.Dint, 2), 'mm');\n    if (TIPO === 'compressao') {\n      h += linha('Extremidades', '', esc(R.tipoExtremidade), '');\n      h += linha('Espiras ativas', 'N<sub>a<\u002Fsub>', fmt(R.Na, 2), 'espiras');\n      h += linha('Passo no estado livre', 'p', fmt(R.passo, 2), 'mm');\n      h += linha('Comprimento fechado', 'L<sub>s<\u002Fsub>', fmt(R.Ls, 2), 'mm');\n    } else {\n      h += linha('Espiras do corpo', 'N<sub>b<\u002Fsub>', fmt(R.Nb, 2), 'espiras');\n      h += linha('Espiras ativas equivalentes', 'N<sub>a<\u002Fsub> = N<sub>b<\u002Fsub> + G/E', fmt(R.Na, 3), 'espiras');\n      h += linha('Comprimento do corpo', 'L<sub>corpo<\u002Fsub> = d·(N<sub>b<\u002Fsub> + 1)', fmt(R.Lcorpo, 2), 'mm');\n      h += linha('Comprimento dos ganchos', 'L₀ − L<sub>corpo<\u002Fsub>', fmt(R.compGanchos, 2), 'mm');\n    }\n    h += linha('Comprimento de arame', 'L<sub>a<\u002Fsub> ≈ π·D·N', fmt(R.compArame, 0), 'mm');\n    h += linha('Massa', 'm = (πd²/4)·L<sub>a<\u002Fsub>·ρ', fmt(R.massa * 1000, 2), 'g');\n\n    h += secao('Rigidez');\n    h += linha('Constante elástica', 'k = G·d⁴ / (8·D³·N<sub>a<\u002Fsub>)', fmt(R.k, 4), 'N/mm');\n    h += linha('Equivalente em kgf', 'k / 9,80665', fmt(R.k / 9.80665, 4), 'kgf/mm');\n\n    h += secao('Deflexão');\n    if (TIPO === 'tracao') {\n      h += linha('Tensão inicial recomendada', 'τ<sub>i<\u002Fsub> = 231 / e<sup>0,105C<\u002Fsup>', fmt(R.tauiRec, 1), 'MPa',\n        'faixa usual ' + fmt(R.tauiRecMin, 0) + ' a ' + fmt(R.tauiRecMax, 0) + ' MPa');\n      h += linha('Pré-carga adotada', 'F<sub>i<\u002Fsub>', fmt(R.Fi, 2), 'N', 'τ<sub>i<\u002Fsub> = ' + fmt(R.taui, 0) + ' MPa');\n      h += linha('Deflexão sob F<sub>máx<\u002Fsub>', 'y = (F − F<sub>i<\u002Fsub>) / k', fmt(R.defMax, 3), 'mm');\n      h += linha('Comprimento sob F<sub>máx<\u002Fsub>', 'L = L₀ + y', fmt(R.Lmax, 2), 'mm');\n      h += linha('Alongamento relativo do corpo', 'y / L<sub>corpo<\u002Fsub>', fmt(R.alongPerc, 1), '%');\n    } else {\n      h += linha('Deflexão sob F<sub>mín<\u002Fsub>', 'y = F / k', fmt(R.defMin, 3), 'mm');\n      h += linha('Deflexão sob F<sub>máx<\u002Fsub>', 'y = F / k', fmt(R.defMax, 3), 'mm');\n      h += linha('Comprimento sob F<sub>máx<\u002Fsub>', 'L = L₀ − y', fmt(R.Lmax, 2), 'mm');\n      h += linha('Curso total disponível', 'L₀ − L<sub>s<\u002Fsub>', fmt(R.cursoTotal, 2), 'mm');\n      h += linha('Força para fechar a mola', 'F<sub>s<\u002Fsub> = k·(L₀ − L<sub>s<\u002Fsub>)', fmt(R.Fs, 1), 'N');\n      h += linha('Uso do curso', 'y<sub>máx<\u002Fsub> / curso', fmt(100 * R.defMax / R.cursoTotal, 1), '%');\n    }\n\n    h += secao('Tensões de cisalhamento');\n    h += linha('Tensão sob F<sub>máx<\u002Fsub>', 'τ = K<sub>B<\u002Fsub>·8FD / (πd³)', fmt(R.tauMax, 1), 'MPa');\n    h += linha('Tensão sob F<sub>mín<\u002Fsub>', '', fmt(R.tauMin, 1), 'MPa');\n    if (TIPO === 'compressao') {\n      h += linha('Tensão com a mola fechada', 'τ<sub>s<\u002Fsub>', fmt(R.tauS, 1), 'MPa');\n      h += linha('Fator com a mola fechada', 'n<sub>s<\u002Fsub> = S<sub>sy<\u002Fsub> / τ<sub>s<\u002Fsub>', fmt(R.nFechada, 3), '');\n    }\n    h += linha('Fator de segurança ao escoamento', 'n = S<sub>sy<\u002Fsub> / τ<sub>máx<\u002Fsub>', fmt(R.nEscoamento, 3), '');\n\n    if (TIPO === 'tracao') {\n      h += secao('Ganchos');\n      h += linha('Fator do gancho em flexão', 'K<sub>A<\u002Fsub> = r₁ / (r₁ − d/2)', fmt(R.KA, 4), '');\n      h += linha('Tensão de flexão no gancho', 'σ<sub>A<\u002Fsub> = F·[K<sub>A<\u002Fsub>·16D/(πd³) + 4/(πd²)]', fmt(R.sigmaA, 1), 'MPa');\n      h += linha('Admissível em flexão', '0,75·S<sub>ut<\u002Fsub>', fmt(R.SyGancho, 0), 'MPa');\n      h += linha('Fator — gancho em flexão', '', fmt(R.nGanchoFlexao, 3), '');\n      h += linha('Fator do gancho em torção', 'K<sub>B,g<\u002Fsub> = r₂ / (r₂ − d/2)', fmt(R.KBg, 4), '');\n      h += linha('Tensão de torção no gancho', 'τ<sub>B<\u002Fsub> = K<sub>B,g<\u002Fsub>·8FD/(πd³)', fmt(R.tauB, 1), 'MPa');\n      h += linha('Admissível em torção', '0,40·S<sub>ut<\u002Fsub>', fmt(R.SsyGancho, 0), 'MPa');\n      h += linha('Fator — gancho em torção', '', fmt(R.nGanchoTorcao, 3), '');\n    }\n\n    if (TIPO === 'compressao') {\n      h += secao('Estabilidade lateral (flambagem)');\n      h += linha('Coeficiente de apoio', 'α', fmt(R.alpha, 3), '',\n        INP.apoio === 'articulado' ? 'uma extremidade articulada' : 'superfícies planas paralelas');\n      h += linha('Esbeltez', 'L₀ / D', fmt(R.esbeltez, 2), '');\n      h += linha('Limite de estabilidade absoluta', 'L₀ < 2,63·D/α', fmt(R.L0critAbs, 1), 'mm',\n        R.estavelSempre ? 'atendido — não flamba em nenhuma deflexão' : 'não atendido — verificar deflexão crítica');\n      if (!R.estavelSempre) {\n        h += linha('Deflexão crítica', 'y<sub>cr<\u002Fsub> = L₀·C₁·[1 − √(1 − C₂/λ²)]', fmt(R.defCritica, 2), 'mm');\n        h += linha('Força crítica', 'F<sub>cr<\u002Fsub> = k·y<sub>cr<\u002Fsub>', fmt(R.FCritica, 1), 'N');\n      }\n    }\n\n    h += secao('Vibração (surge)');\n    h += linha('Massa das espiras ativas', '(πd²/4)·πD·N<sub>a<\u002Fsub>·ρ', fmt(R.massaAtiva * 1000, 2), 'g');\n    h += linha('Frequência natural — ambas fixas', 'f = ½·√(k/m)', fmt(R.f1, 1), 'Hz');\n    h += linha('Frequência natural — uma extremidade livre', 'f = ¼·√(k/m)', fmt(R.f1livre !== undefined ? R.f1livre : R.f1 / 2, 1), 'Hz');\n    if (R.fExc > 0) h += linha('Razão f<sub>n<\u002Fsub> / f<sub>exc<\u002Fsub>', 'mínimo 13, ideal ≥ 20', fmt(R.razaoFreq, 2), '');\n  }\n\n  h += '<\u002Ftbody><\u002Ftable>';\n  $('tabCalc').innerHTML = h;\n}\n\n/* -------------------------------------------------------------- aba de fadiga */\nfunction renderFadiga() {\n  const t = TIPO === 'torcao';\n  const sa = t ? R.sigA : (TIPO === 'tracao' ? R.tauA_amp : R.tauA);\n  const sm = t ? R.sigM : R.tauM;\n  const Su = t ? R.Su : R.Ssu;\n  const Se = t ? R.Se : R.Sse;\n  const crit = INP.criterio === 'gerber' ? 'Gerber (parábola)' : 'Goodman modificado (reta)';\n  let h = `<table><thead><tr><th>Grandeza<\u002Fth><th>Expressão<\u002Fth><th style=\"text-align:right\">Valor<\u002Fth><th>Unidade<\u002Fth><\u002Ftr><\u002Fthead><tbody>`;\n  h += secao('Carregamento cíclico');\n  if (t) {\n    h += linha('Momento alternado', 'M<sub>a<\u002Fsub> = (M<sub>máx<\u002Fsub> − M<sub>mín<\u002Fsub>)/2', fmt(R.Ma, 1), 'N·mm');\n    h += linha('Momento médio', 'M<sub>m<\u002Fsub> = (M<sub>máx<\u002Fsub> + M<sub>mín<\u002Fsub>)/2', fmt(R.Mm, 1), 'N·mm');\n  } else {\n    h += linha('Força alternada', 'F<sub>a<\u002Fsub> = (F<sub>máx<\u002Fsub> − F<sub>mín<\u002Fsub>)/2', fmt(R.Fa, 2), 'N');\n    h += linha('Força média', 'F<sub>m<\u002Fsub> = (F<sub>máx<\u002Fsub> + F<sub>mín<\u002Fsub>)/2', fmt(R.Fm, 2), 'N');\n  }\n  h += linha('Tensão alternada', t ? 'σ<sub>a<\u002Fsub> = K<sub>i<\u002Fsub>·32M<sub>a<\u002Fsub>/(πd³)' : 'τ<sub>a<\u002Fsub> = K<sub>B<\u002Fsub>·8F<sub>a<\u002Fsub>D/(πd³)', fmt(sa, 1), 'MPa');\n  h += linha('Tensão média', t ? 'σ<sub>m<\u002Fsub>' : 'τ<sub>m<\u002Fsub>', fmt(sm, 1), 'MPa');\n  h += linha('Razão da reta de carga', 'r = alternada / média', fmt(R.razaoCarga, 4), '');\n\n  h += secao('Resistência à fadiga — critério ' + esc(crit));\n  if (t) {\n    h += linha('Resistência à fadiga em flexão (10⁶)', `S<sub>r<\u002Fsub> = ${fmt(matAtual().kFlex, 2)}·S<sub>ut<\u002Fsub>${INP.jateado ? ' × 1,20 (jateado)' : ''}`, fmt(R.Sr, 1), 'MPa',\n      'valor publicado para carregamento repetido (M<sub>mín<\u002Fsub> = 0)');\n    h += linha('Limite equivalente', 'S<sub>e<\u002Fsub> a partir de S<sub>a<\u002Fsub> = S<sub>m<\u002Fsub> = S<sub>r<\u002Fsub>/2', fmt(R.Se, 1), 'MPa');\n    h += linha('Ruptura em flexão', 'S<sub>u<\u002Fsub> = S<sub>ut<\u002Fsub>', fmt(R.Su, 0), 'MPa');\n  } else {\n    h += linha('Amplitude de referência', 'S<sub>sa<\u002Fsub>', fmt(R.SsaRef, 1), 'MPa', esc(R.fadFonte));\n    h += linha('Média de referência', 'S<sub>sm<\u002Fsub>', fmt(R.SsmRef, 1), 'MPa');\n    h += linha('Limite de resistência corrigido', INP.criterio === 'gerber'\n      ? 'S<sub>se<\u002Fsub> = S<sub>sa<\u002Fsub> / [1 − (S<sub>sm<\u002Fsub>/S<sub>su<\u002Fsub>)²]'\n      : 'S<sub>se<\u002Fsub> = S<sub>sa<\u002Fsub> / (1 − S<sub>sm<\u002Fsub>/S<sub>su<\u002Fsub>)', fmt(R.Sse, 1), 'MPa');\n    h += linha('Ruptura em torção', 'S<sub>su<\u002Fsub>', fmt(R.Ssu, 0), 'MPa');\n  }\n  h += linha('Amplitude admissível na reta de carga', 'S<sub>a<\u002Fsub>', fmt(R.SaAdm, 1), 'MPa');\n  h += linha('Fator de segurança à fadiga', 'n<sub>f<\u002Fsub> = S<sub>a<\u002Fsub> / ' + (t ? 'σ<sub>a<\u002Fsub>' : 'τ<sub>a<\u002Fsub>'),\n    Number.isFinite(R.nFadiga) ? fmt(R.nFadiga, 3) : '∞', '');\n  h += linha('Vida estimada', R.nFadiga >= 1 ? 'acima do limite de fadiga' : 'interpolação S–N 10³ a 10⁶',\n    R.vida === Infinity ? 'infinita' : fmt(R.vida, 0), R.vida === Infinity ? '' : 'ciclos');\n  h += '<\u002Ftbody><\u002Ftable>';\n\n  const nivel = !Number.isFinite(R.nFadiga) || R.nFadiga >= 1.3 ? 'aprovado' : R.nFadiga >= 1 ? 'atencao' : 'erro';\n  const rot = nivel === 'aprovado' ? 'Vida infinita' : nivel === 'atencao' ? 'Margem estreita' : 'Vida finita';\n  const txt = nivel === 'aprovado'\n    ? 'O ponto de operação fica dentro da envoltória de fadiga: vida acima de 10⁶ ciclos para os dados adotados.'\n    : nivel === 'atencao'\n    ? 'O ponto de operação está próximo da envoltória. Pequenas variações de carga ou de resistência do lote podem levar à falha.'\n    : `O ponto de operação está fora da envoltória. Caminhos usuais: jatear o arame (+65% na amplitude admissível para aços ferrosos), aumentar d, reduzir C, ou migrar para material de qualidade válvula.`;\n  h = `<div class=\"msg ${nivel}\"><b>${rot}<\u002Fb><span>${txt}<\u002Fspan><\u002Fdiv>` + h;\n  h += `<div class=\"msg info\"><b>Método<\u002Fb><span>Os dados de amplitude e média de referência são para arame de mola sem entalhes e com superfície controlada. Corrosão, riscos de manuseio, marcas de ferramenta e desalinhamento no assento reduzem a vida sem aparecer neste cálculo.<\u002Fspan><\u002Fdiv>`;\n  $('tabFad').innerHTML = h;\n}\n\n/* ============================== DIAGRAMAS SVG ============================== */\nconst SW = 340, SH = 240;\nfunction svgOpen(w, h) { return `<svg viewBox=\"0 0 ${w} ${h}\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\">`; }\nfunction eixos(x0, y0, x1, y1, labX, labY) {\n  return `<line x1=\"${x0}\" y1=\"${y0}\" x2=\"${x1}\" y2=\"${y0}\" stroke=\"var(--ink3)\" stroke-width=\"1\"/>\n    <line x1=\"${x0}\" y1=\"${y0}\" x2=\"${x0}\" y2=\"${y1}\" stroke=\"var(--ink3)\" stroke-width=\"1\"/>\n    <text x=\"${(x0 + x1) / 2}\" y=\"${y0 + 26}\" fill=\"var(--ink3)\" font-size=\"10\" font-family=\"var(--mono)\" text-anchor=\"middle\">${labX}<\u002Ftext>\n    <text x=\"${x0 - 30}\" y=\"${(y0 + y1) / 2}\" fill=\"var(--ink3)\" font-size=\"10\" font-family=\"var(--mono)\" text-anchor=\"middle\" transform=\"rotate(-90 ${x0 - 30} ${(y0 + y1) / 2})\">${labY}<\u002Ftext>`;\n}\n\n/* croqui: compressao / tracao / torcao */\nfunction croqui() {\n  const w = SW, h = SH, m = 34;\n  let s = svgOpen(w, h);\n  if (TIPO === 'torcao') {\n    const cx = w * 0.42, cy = h * 0.5, esc0 = Math.min(70 / (R.Dext / 2), 3.2);\n    const rE = (R.Dext / 2) * esc0, rI = (R.Dint / 2) * esc0;\n    s += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${rE}\" fill=\"none\" stroke=\"var(--steel)\" stroke-width=\"2\"/>`;\n    s += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${rI}\" fill=\"none\" stroke=\"var(--steel)\" stroke-width=\"2\"/>`;\n    s += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${(rE + rI) / 2}\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>`;\n    if (INP.dMandril > 0) {\n      const rm = (INP.dMandril / 2) * esc0;\n      s += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${rm}\" fill=\"var(--bg2)\" stroke=\"var(--ink3)\" stroke-width=\"1\"/>\n        <text x=\"${cx}\" y=\"${cy + 4}\" font-size=\"9\" fill=\"var(--ink3)\" font-family=\"var(--mono)\" text-anchor=\"middle\">mandril<\u002Ftext>`;\n    }\n    const l1 = Math.min(INP.L1 * esc0, 88), l2 = Math.min(INP.L2 * esc0, 88);\n    s += `<line x1=\"${cx}\" y1=\"${cy - rE}\" x2=\"${cx + l1}\" y2=\"${cy - rE}\" stroke=\"var(--steel)\" stroke-width=\"2\"/>`;\n    s += `<line x1=\"${cx}\" y1=\"${cy + rE}\" x2=\"${cx + l2}\" y2=\"${cy + rE}\" stroke=\"var(--steel)\" stroke-width=\"2\"/>`;\n    // rotacao\n    const a0 = -18, a1 = a0 + Math.min(R.thetaMaxGrau, 300);\n    const rr = rE + 14;\n    const pol = (a) => [cx + rr * Math.cos(a * Math.PI / 180), cy + rr * Math.sin(a * Math.PI / 180)];\n    const [xA, yA] = pol(a0), [xB, yB] = pol(a1);\n    const big = Math.min(R.thetaMaxGrau, 300) > 180 ? 1 : 0;\n    s += `<path d=\"M ${xA} ${yA} A ${rr} ${rr} 0 ${big} 1 ${xB} ${yB}\" fill=\"none\" stroke=\"var(--warn)\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>`;\n    s += `<text x=\"${cx + rr + 4}\" y=\"${cy - rr * 0.2}\" font-size=\"10\" fill=\"var(--warn)\" font-family=\"var(--mono)\">θ = ${fmt(R.thetaMaxGrau, 0)}°<\u002Ftext>`;\n    s += `<text x=\"${m - 20}\" y=\"${h - 12}\" font-size=\"10\" fill=\"var(--ink3)\" font-family=\"var(--mono)\">D = ${fmt(INP.D, 1)} · d = ${fmt(INP.d, 2)} · N<tspan baseline-shift=\"sub\" font-size=\"8\">b<\u002Ftspan> = ${fmt(INP.Nb, 1)}<\u002Ftext>`;\n    return s + '<\u002Fsvg>';\n  }\n\n  // molas de compressao/tracao: vista lateral\n  const Lref = TIPO === 'compressao' ? R.L0 : R.Lmax;\n  const esc0 = Math.min((h - 2 * m - 18) / Lref, (w * 0.22) / R.Dext);\n  const cx = w * 0.30, yTop = m;\n  const bodyW = R.Dext * esc0;\n  const desenhaEspiral = (yIni, comp, nEsp, cor, largura) => {\n    const p = comp / Math.max(nEsp, 1);\n    let d = '';\n    for (let i = 0; i <= nEsp; i++) {\n      const y = yIni + i * p;\n      const xa = cx - bodyW / 2, xb = cx + bodyW / 2;\n      d += (i === 0 ? `M ${xa} ${y}` : ` L ${xb} ${y - p / 2} L ${xa} ${y}`);\n    }\n    return `<path d=\"${d}\" fill=\"none\" stroke=\"${cor}\" stroke-width=\"${largura}\" stroke-linejoin=\"round\"/>`;\n  };\n  const nEsp = TIPO === 'compressao' ? Math.max(2, Math.round(R.Na)) : Math.max(3, Math.round(R.Nb));\n  const compLivre = (TIPO === 'compressao' ? R.L0 : R.Lcorpo) * esc0;\n  const compCarga = (TIPO === 'compressao' ? R.Lmax : R.Lcorpo + R.defMax) * esc0;\n\n  s += desenhaEspiral(yTop, compLivre, nEsp, 'var(--rule)', 1.5);\n  s += desenhaEspiral(yTop, compCarga, nEsp, 'var(--steel)', 2);\n  if (TIPO === 'tracao') {\n    const rG = Math.min(bodyW * 0.34, 14);\n    s += `<path d=\"M ${cx} ${yTop} A ${rG} ${rG} 0 1 1 ${cx} ${yTop - 2 * rG}\" fill=\"none\" stroke=\"var(--steel)\" stroke-width=\"2\"/>`;\n    s += `<path d=\"M ${cx} ${yTop + compCarga} A ${rG} ${rG} 0 1 0 ${cx} ${yTop + compCarga + 2 * rG}\" fill=\"none\" stroke=\"var(--steel)\" stroke-width=\"2\"/>`;\n  }\n  // cotas verticais\n  const xc = cx + bodyW / 2 + 22;\n  const cota = (x, y1, y2, txt, cor) =>\n    `<line x1=\"${x}\" y1=\"${y1}\" x2=\"${x}\" y2=\"${y2}\" stroke=\"${cor}\" stroke-width=\"1\"/>\n     <line x1=\"${x - 4}\" y1=\"${y1}\" x2=\"${x + 4}\" y2=\"${y1}\" stroke=\"${cor}\" stroke-width=\"1\"/>\n     <line x1=\"${x - 4}\" y1=\"${y2}\" x2=\"${x + 4}\" y2=\"${y2}\" stroke=\"${cor}\" stroke-width=\"1\"/>\n     <text x=\"${x + 7}\" y=\"${(y1 + y2) / 2 + 3}\" font-size=\"10\" fill=\"${cor}\" font-family=\"var(--mono)\">${txt}<\u002Ftext>`;\n  if (TIPO === 'compressao') {\n    s += cota(xc, yTop, yTop + compLivre, 'L₀ = ' + fmt(R.L0, 1), 'var(--ink3)');\n    s += cota(xc + 62, yTop, yTop + compCarga, 'L = ' + fmt(R.Lmax, 1), 'var(--steel)');\n    const ys = yTop + R.Ls * esc0;\n    s += `<line x1=\"${cx - bodyW / 2 - 8}\" y1=\"${ys}\" x2=\"${cx + bodyW / 2 + 8}\" y2=\"${ys}\" stroke=\"var(--bad)\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n      <text x=\"${cx - bodyW / 2 - 12}\" y=\"${ys + 3}\" font-size=\"9\" fill=\"var(--bad)\" font-family=\"var(--mono)\" text-anchor=\"end\">Ls<\u002Ftext>`;\n  } else {\n    s += cota(xc, yTop, yTop + compLivre, 'corpo ' + fmt(R.Lcorpo, 1), 'var(--ink3)');\n    s += cota(xc + 68, yTop, yTop + compCarga, '+y = ' + fmt(R.defMax, 1), 'var(--steel)');\n  }\n  // cota horizontal\n  const yb = h - 20;\n  s += `<line x1=\"${cx - bodyW / 2}\" y1=\"${yb}\" x2=\"${cx + bodyW / 2}\" y2=\"${yb}\" stroke=\"var(--ink3)\" stroke-width=\"1\"/>\n    <text x=\"${cx}\" y=\"${yb + 13}\" font-size=\"10\" fill=\"var(--ink3)\" font-family=\"var(--mono)\" text-anchor=\"middle\">Dₑ = ${fmt(R.Dext, 1)} mm<\u002Ftext>`;\n  s += `<text x=\"8\" y=\"14\" font-size=\"9\" fill=\"var(--ink3)\" font-family=\"var(--mono)\">cinza: livre · azul: sob F máx<\u002Ftext>`;\n  return s + '<\u002Fsvg>';\n}\n\n/* curva carga x deflexao (ou momento x rotacao) */\nfunction curvaCarga() {\n  const w = SW, h = SH, x0 = 46, y0 = h - 34, x1 = w - 14, y1 = 16;\n  const t = TIPO === 'torcao';\n  let xMax, yMax, k, pMax, pMin, marcos = [];\n  if (t) {\n    xMax = Math.max(R.thetaMaxGrau * 1.25, 10); yMax = Math.max(R.Mmax * 1.25, 1);\n    k = R.kGrau; pMax = [R.thetaMaxGrau, R.Mmax]; pMin = [R.thetaMinGrau, R.Mmin];\n  } else if (TIPO === 'compressao') {\n    xMax = Math.max(R.cursoTotal * 1.05, R.defMax * 1.25, 1);\n    yMax = Math.max(R.Fs * 1.05, R.Fmax * 1.25, 1);\n    k = R.k; pMax = [R.defMax, R.Fmax]; pMin = [R.defMin, R.Fmin];\n    marcos.push({ x: R.cursoTotal, y: R.Fs, t: 'fechada', c: 'var(--bad)' });\n    if (!R.estavelSempre && Number.isFinite(R.defCritica))\n      marcos.push({ x: R.defCritica, y: R.FCritica, t: 'flambagem', c: 'var(--warn)' });\n  } else {\n    xMax = Math.max(R.defMax * 1.3, 1); yMax = Math.max(R.Fmax * 1.25, R.Fi * 1.5, 1);\n    k = R.k; pMax = [R.defMax, R.Fmax]; pMin = [R.defMin, R.Fmin];\n  }\n  const X = v => x0 + (v / xMax) * (x1 - x0);\n  const Y = v => y0 - (v / yMax) * (y0 - y1);\n  let s = svgOpen(w, h);\n  for (let i = 1; i <= 4; i++) {\n    s += `<line x1=\"${x0}\" y1=\"${Y(yMax * i / 4)}\" x2=\"${x1}\" y2=\"${Y(yMax * i / 4)}\" stroke=\"var(--grid)\" stroke-width=\".5\"/>`;\n    s += `<line x1=\"${X(xMax * i / 4)}\" y1=\"${y0}\" x2=\"${X(xMax * i / 4)}\" y2=\"${y1}\" stroke=\"var(--grid)\" stroke-width=\".5\"/>`;\n  }\n  s += eixos(x0, y0, x1, y1,\n    t ? 'rotação θ [°]' : 'deflexão y [mm]',\n    t ? 'momento M [N·mm]' : 'força F [N]');\n  s += `<text x=\"${x0 - 5}\" y=\"${y1 + 4}\" font-size=\"9\" fill=\"var(--ink3)\" font-family=\"var(--mono)\" text-anchor=\"end\">${fmt(yMax, 0)}<\u002Ftext>`;\n  s += `<text x=\"${x1}\" y=\"${y0 + 13}\" font-size=\"9\" fill=\"var(--ink3)\" font-family=\"var(--mono)\" text-anchor=\"end\">${fmt(xMax, 1)}<\u002Ftext>`;\n\n  // reta da mola\n  const y0v = (TIPO === 'tracao') ? R.Fi : 0;\n  const xEnd = Math.min(xMax, (yMax - y0v) / k);\n  s += `<line x1=\"${X(0)}\" y1=\"${Y(y0v)}\" x2=\"${X(xEnd)}\" y2=\"${Y(y0v + k * xEnd)}\" stroke=\"var(--steel)\" stroke-width=\"2\"/>`;\n  if (TIPO === 'tracao' && R.Fi > 0)\n    s += `<line x1=\"${x0}\" y1=\"${Y(R.Fi)}\" x2=\"${x1}\" y2=\"${Y(R.Fi)}\" stroke=\"var(--ink3)\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n      <text x=\"${x0 + 4}\" y=\"${Y(R.Fi) - 4}\" font-size=\"9\" fill=\"var(--ink3)\" font-family=\"var(--mono)\">Fᵢ = ${fmt(R.Fi, 0)} N<\u002Ftext>`;\n\n  // faixa de trabalho\n  s += `<rect x=\"${X(pMin[0])}\" y=\"${Y(pMax[1])}\" width=\"${Math.max(1, X(pMax[0]) - X(pMin[0]))}\" height=\"${Math.max(1, Y(pMin[1]) - Y(pMax[1]))}\" fill=\"var(--steel)\" opacity=\".12\"/>`;\n  [[pMin, 'var(--ink2)', 'mín'], [pMax, 'var(--steel)', 'máx']].forEach(([p, c, l]) => {\n    s += `<circle cx=\"${X(p[0])}\" cy=\"${Y(p[1])}\" r=\"4\" fill=\"${c}\"/>\n      <text x=\"${X(p[0]) + 7}\" y=\"${Y(p[1]) - 6}\" font-size=\"9\" fill=\"${c}\" font-family=\"var(--mono)\">${l}<\u002Ftext>`;\n  });\n  marcos.forEach(mk => {\n    if (mk.x > xMax) return;\n    s += `<line x1=\"${X(mk.x)}\" y1=\"${y0}\" x2=\"${X(mk.x)}\" y2=\"${y1}\" stroke=\"${mk.c}\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n      <text x=\"${X(mk.x) - 4}\" y=\"${y1 + 10}\" font-size=\"9\" fill=\"${mk.c}\" font-family=\"var(--mono)\" text-anchor=\"end\">${mk.t}<\u002Ftext>`;\n  });\n  $('legCurva').innerHTML = `<span><i style=\"background:var(--steel)\"><\u002Fi>${t ? \"k' = \" + fmt(R.kGrau, 3) + ' N·mm/°' : 'k = ' + fmt(R.k, 3) + ' N/mm'}<\u002Fspan>\n    <span>faixa de trabalho sombreada<\u002Fspan>`;\n  $('tCurva').textContent = t ? 'Curva momento × rotação' : 'Curva carga × deflexão';\n  return s + '<\u002Fsvg>';\n}\n\n/* diagrama de fadiga: media x amplitude */\nfunction diagFadiga() {\n  const w = SW, h = SH, x0 = 46, y0 = h - 34, x1 = w - 14, y1 = 16;\n  const t = TIPO === 'torcao';\n  const Su = t ? R.Su : R.Ssu;\n  const Se = t ? R.Se : R.Sse;\n  const Sy = t ? R.Sy : R.Ssy;\n  const sa = t ? R.sigA : (TIPO === 'tracao' ? R.tauA_amp : R.tauA);\n  const sm = t ? R.sigM : R.tauM;\n  const xMax = Su * 1.05, yMax = Math.max(Se, sa, Sy) * 1.15;\n  const X = v => x0 + (v / xMax) * (x1 - x0);\n  const Y = v => y0 - (v / yMax) * (y0 - y1);\n  let s = svgOpen(w, h);\n  for (let i = 1; i <= 4; i++) {\n    s += `<line x1=\"${x0}\" y1=\"${Y(yMax * i / 4)}\" x2=\"${x1}\" y2=\"${Y(yMax * i / 4)}\" stroke=\"var(--grid)\" stroke-width=\".5\"/>`;\n  }\n  s += eixos(x0, y0, x1, y1,\n    (t ? 'σ' : 'τ') + 'ₘ — tensão média [MPa]',\n    (t ? 'σ' : 'τ') + 'ₐ — amplitude [MPa]');\n\n  // envoltoria de fadiga\n  if (INP.criterio === 'gerber') {\n    let d = '';\n    for (let i = 0; i <= 40; i++) {\n      const xm = (Su * i) / 40;\n      const ya = Se * (1 - Math.pow(xm / Su, 2));\n      d += (i === 0 ? 'M ' : ' L ') + X(xm) + ' ' + Y(Math.max(0, ya));\n    }\n    s += `<path d=\"${d}\" fill=\"none\" stroke=\"var(--steel)\" stroke-width=\"2\"/>`;\n  } else {\n    s += `<line x1=\"${X(0)}\" y1=\"${Y(Se)}\" x2=\"${X(Su)}\" y2=\"${Y(0)}\" stroke=\"var(--steel)\" stroke-width=\"2\"/>`;\n  }\n  // reta de escoamento (Langer)\n  s += `<line x1=\"${X(0)}\" y1=\"${Y(Sy)}\" x2=\"${X(Sy)}\" y2=\"${Y(0)}\" stroke=\"var(--bad)\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/>`;\n  // reta de carga\n  if (sm > 0) {\n    const kk = sa / sm;\n    const xe = Math.min(xMax, yMax / Math.max(kk, 1e-9));\n    s += `<line x1=\"${X(0)}\" y1=\"${Y(0)}\" x2=\"${X(xe)}\" y2=\"${Y(kk * xe)}\" stroke=\"var(--ink3)\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>`;\n  }\n  // ponto de operacao e ponto admissivel\n  if (Number.isFinite(R.SaAdm) && sm > 0) {\n    const xAdm = R.SaAdm / (sa / sm);\n    s += `<circle cx=\"${X(xAdm)}\" cy=\"${Y(R.SaAdm)}\" r=\"3.5\" fill=\"none\" stroke=\"var(--warn)\" stroke-width=\"1.8\"/>\n      <text x=\"${X(xAdm) + 6}\" y=\"${Y(R.SaAdm) - 5}\" font-size=\"9\" fill=\"var(--warn)\" font-family=\"var(--mono)\">limite<\u002Ftext>`;\n  }\n  const cor = R.nFadiga >= 1.3 ? 'var(--ok)' : R.nFadiga >= 1 ? 'var(--warn)' : 'var(--bad)';\n  s += `<circle cx=\"${X(sm)}\" cy=\"${Y(sa)}\" r=\"5\" fill=\"${cor}\"/>\n    <text x=\"${X(sm) + 8}\" y=\"${Y(sa) + 4}\" font-size=\"9.5\" fill=\"${cor}\" font-family=\"var(--mono)\">operação (nf = ${Number.isFinite(R.nFadiga) ? fmt(R.nFadiga, 2) : '∞'})<\u002Ftext>`;\n  s += `<text x=\"${X(0) - 5}\" y=\"${Y(Se) + 3}\" font-size=\"9\" fill=\"var(--steel)\" font-family=\"var(--mono)\" text-anchor=\"end\">${fmt(Se, 0)}<\u002Ftext>`;\n  s += `<text x=\"${X(Su)}\" y=\"${y0 + 13}\" font-size=\"9\" fill=\"var(--ink3)\" font-family=\"var(--mono)\" text-anchor=\"middle\">${fmt(Su, 0)}<\u002Ftext>`;\n\n  $('legGood').innerHTML = `<span><i style=\"background:var(--steel)\"><\u002Fi>${INP.criterio === 'gerber' ? 'parábola de Gerber' : 'reta de Goodman'}<\u002Fspan>\n    <span><i style=\"background:var(--bad)\"><\u002Fi>escoamento (Langer)<\u002Fspan>`;\n  $('tGood').textContent = 'Diagrama de fadiga — ' + (INP.criterio === 'gerber' ? 'Gerber' : 'Goodman');\n  return s + '<\u002Fsvg>';\n}\n\n/* sensibilidade a bitola do arame */\nfunction sensibilidade() {\n  const w = SW, h = SH, x0 = 46, y0 = h - 34, x1 = w - 14, y1 = 16;\n  const d0 = INP.d;\n  const pts = [];\n  for (let i = 0; i <= 30; i++) {\n    const d = d0 * (0.6 + (0.9 * i) / 30);\n    const inp = Object.assign({}, INP, { d });\n    let r;\n    try {\n      r = TIPO === 'compressao' ? calcCompressao(inp) : TIPO === 'tracao' ? calcTracao(inp) : calcTorcao(inp);\n    } catch (e) { continue; }\n    if (r.erros && r.erros.length) continue;\n    pts.push({ d, ne: r.nEscoamento, nf: Number.isFinite(r.nFadiga) ? Math.min(r.nFadiga, 6) : 6 });\n  }\n  let s = svgOpen(w, h);\n  if (!pts.length) return s + `<text x=\"12\" y=\"30\" font-size=\"11\" fill=\"var(--ink3)\">Sem dados<\u002Ftext><\u002Fsvg>`;\n  const dMin = pts[0].d, dMax = pts[pts.length - 1].d;\n  const yMax = 4;\n  const X = v => x0 + ((v - dMin) / (dMax - dMin)) * (x1 - x0);\n  const Y = v => y0 - (Math.min(v, yMax) / yMax) * (y0 - y1);\n  for (let i = 1; i <= 4; i++)\n    s += `<line x1=\"${x0}\" y1=\"${Y(i)}\" x2=\"${x1}\" y2=\"${Y(i)}\" stroke=\"var(--grid)\" stroke-width=\".5\"/>\n      <text x=\"${x0 - 5}\" y=\"${Y(i) + 3}\" font-size=\"9\" fill=\"var(--ink3)\" font-family=\"var(--mono)\" text-anchor=\"end\">${i}<\u002Ftext>`;\n  s += `<line x1=\"${x0}\" y1=\"${Y(1)}\" x2=\"${x1}\" y2=\"${Y(1)}\" stroke=\"var(--bad)\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/>`;\n  s += eixos(x0, y0, x1, y1, 'diâmetro do arame d [mm]', 'fator de segurança');\n  const path = (key, cor) => {\n    let d = '';\n    pts.forEach((p, i) => { d += (i === 0 ? 'M ' : ' L ') + X(p.d) + ' ' + Y(p[key]); });\n    return `<path d=\"${d}\" fill=\"none\" stroke=\"${cor}\" stroke-width=\"2\"/>`;\n  };\n  s += path('ne', 'var(--steel)');\n  s += path('nf', 'var(--warn)');\n  s += `<line x1=\"${X(d0)}\" y1=\"${y0}\" x2=\"${X(d0)}\" y2=\"${y1}\" stroke=\"var(--ink2)\" stroke-width=\"1\"/>\n    <text x=\"${X(d0) + 4}\" y=\"${y1 + 10}\" font-size=\"9\" fill=\"var(--ink2)\" font-family=\"var(--mono)\">d = ${fmt(d0, 2)}<\u002Ftext>`;\n  s += `<text x=\"${x0}\" y=\"${y0 + 13}\" font-size=\"9\" fill=\"var(--ink3)\" font-family=\"var(--mono)\">${fmt(dMin, 2)}<\u002Ftext>\n    <text x=\"${x1}\" y=\"${y0 + 13}\" font-size=\"9\" fill=\"var(--ink3)\" font-family=\"var(--mono)\" text-anchor=\"end\">${fmt(dMax, 2)}<\u002Ftext>`;\n  return s + '<\u002Fsvg>';\n}\n\nfunction renderDiagramas() {\n  $('svgCroqui').innerHTML = croqui();\n  $('svgCurva').innerHTML = curvaCarga();\n  $('svgGood').innerHTML = diagFadiga();\n  $('svgSens').innerHTML = sensibilidade();\n}\n\n/* ============================== BIBLIOTECA ============================== */\nfunction renderBiblio() {\n  const fam = $('bFam').value;\n  const q = $('bBusca').value.trim().toLowerCase();\n  const tmin = parseNum($('bTmin').value);\n  const corr = Number($('bCorr').value) || 0;\n  const ordem = $('bOrdem').value;\n\n  const comp = (INP && !(R && R.erros && R.erros.length)) ? compararMateriais(INP, TIPO) : [];\n  const mapa = new Map(comp.map(c => [c.mat.id, c]));\n\n  let lista = MATERIAIS.filter(m => {\n    if (fam && m.fam !== fam) return false;\n    if (corr && m.corr < corr) return false;\n    if (Number.isFinite(tmin) && m.tmax < tmin) return false;\n    if (q) {\n      const blob = [m.nome, m.norma, m.equiv, m.usos, m.obs, FAMILIAS[m.fam]].join(' ').toLowerCase();\n      if (!blob.includes(q)) return false;\n    }\n    return true;\n  });\n\n  const sutDe = m => sutMaterial(m, INP && INP.d > 0 ? INP.d : 2).valor;\n  lista.sort((a, b) => {\n    if (ordem === 'sut') return sutDe(b) - sutDe(a);\n    if (ordem === 'custo') return a.custo - b.custo;\n    if (ordem === 'temp') return b.tmax - a.tmax;\n    if (ordem === 'nome') return a.nome.localeCompare(b.nome, 'pt-BR');\n    const ca = mapa.get(a.id), cb = mapa.get(b.id);\n    const va = ca ? (ca.viavel ? 1 : 0) : -1, vb = cb ? (cb.viavel ? 1 : 0) : -1;\n    if (va !== vb) return vb - va;\n    const na = ca && Number.isFinite(ca.nEscoamento) ? ca.nEscoamento : 0;\n    const nb = cb && Number.isFinite(cb.nEscoamento) ? cb.nEscoamento : 0;\n    return nb - na;\n  });\n\n  const atual = matAtual().id;\n  const un = TIPO === 'torcao' ? 'N·mm/°' : 'N/mm';\n  let h = `<table><thead><tr>\n    <th>Material<\u002Fth><th>Família<\u002Fth><th style=\"text-align:right\">S<sub>ut<\u002Fsub><br>MPa<\u002Fth>\n    <th style=\"text-align:right\">G<br>GPa<\u002Fth><th style=\"text-align:right\">k<br>${un}<\u002Fth>\n    <th style=\"text-align:right\">n<sub>escoam.<\u002Fsub><\u002Fth><th style=\"text-align:right\">n<sub>fadiga<\u002Fsub><\u002Fth>\n    <th style=\"text-align:right\">T<sub>máx<\u002Fsub><br>°C<\u002Fth><th>Corrosão<\u002Fth>\n    <th style=\"text-align:right\">Custo<\u002Fth><th>Situação<\u002Fth><\u002Ftr><\u002Fthead><tbody>`;\n\n  for (const m of lista) {\n    const c = mapa.get(m.id);\n    const su = sutMaterial(m, INP && INP.d > 0 ? INP.d : 2);\n    let sit = '<span class=\"pill neutro\">não avaliado<\u002Fspan>';\n    if (c) {\n      if (!c.bitolaOk) sit = '<span class=\"pill warn\">bitola fora da faixa<\u002Fspan>';\n      else if (!c.tempOk) sit = '<span class=\"pill bad\">temperatura excedida<\u002Fspan>';\n      else if (c.viavel) sit = '<span class=\"pill ok\">atende<\u002Fspan>';\n      else sit = '<span class=\"pill bad\">não atende<\u002Fspan>';\n    }\n    h += `<tr${m.id === atual ? ' style=\"background:var(--steelBg)\"' : ''}>\n      <td><span class=\"matnome\">${esc(m.nome)}<\u002Fspan><br><span class=\"matnorma\">${esc(m.norma)}<\u002Fspan>\n        <details class=\"obs\"><summary>equivalências e notas<\u002Fsummary>\n          <p><b>Equivalentes:<\u002Fb> ${esc(m.equiv)}<\u002Fp>\n          <p><b>Aplicações:<\u002Fb> ${esc(m.usos)}<\u002Fp>\n          <p><b>Notas:<\u002Fb> ${esc(m.obs)}<\u002Fp>\n          <p><b>Bitolas:<\u002Fb> ${fmt(m.dmin, 2)} a ${fmt(m.dmax, 2)} mm · <b>ρ<\u002Fb> ${fmt(m.rho, 0)} kg/m³ ·\n             <b>S<sub>sy<\u002Fsub>/S<sub>ut<\u002Fsub><\u002Fb> ${fmt(m.kSsy, 2)} · <b>S<sub>y<\u002Fsub>/S<sub>ut<\u002Fsub><\u002Fb> ${fmt(m.kSy, 2)} ·\n             <b>magnético:<\u002Fb> ${m.mag === true ? 'sim' : m.mag === 'leve' ? 'leve' : 'não'}\n             ${m.cond ? ' · <b>condutividade:<\u002Fb> ' + fmt(m.cond, 1) + '% IACS' : ''}<\u002Fp>\n        <\u002Fdetails><\u002Ftd>\n      <td style=\"font-size:11.5px\">${esc(FAMILIAS[m.fam])}<\u002Ftd>\n      <td class=\"n\">${fmt(su.valor, 0)}${su.extrapolado ? '*' : ''}<\u002Ftd>\n      <td class=\"n\">${fmt(m.G / 1000, 1)}<\u002Ftd>\n      <td class=\"n\">${c ? fmt(c.k, TIPO === 'torcao' ? 3 : 2) : '—'}<\u002Ftd>\n      <td class=\"n\">${c && Number.isFinite(c.nEscoamento) ? fmt(c.nEscoamento, 2) : '—'}<\u002Ftd>\n      <td class=\"n\">${c ? (Number.isFinite(c.nFadiga) ? fmt(c.nFadiga, 2) : '∞') : '—'}<\u002Ftd>\n      <td class=\"n\">${fmt(m.tmax, 0)}<\u002Ftd>\n      <td style=\"font-size:11.5px\">${esc(CORR_LABEL[m.corr])}<\u002Ftd>\n      <td class=\"n\">${fmt(m.custo, 1)}×<\u002Ftd>\n      <td>${sit}<\u002Ftd><\u002Ftr>`;\n  }\n  h += `<\u002Ftbody><\u002Ftable>`;\n  const nAtende = lista.filter(m => mapa.get(m.id) && mapa.get(m.id).viavel).length;\n  h = `<p style=\"margin:0 0 10px;color:var(--ink3);font-size:12px\">\n    ${lista.length} de ${MATERIAIS.length} materiais listados · ${nAtende} atendem à geometria e ao carregamento atuais.\n    Colunas k, n<sub>escoam.<\u002Fsub> e n<sub>fadiga<\u002Fsub> recalculam a mola atual trocando apenas o material.\n    Asterisco em S<sub>ut<\u002Fsub> indica extrapolação fora da faixa de validade.<\u002Fp>` + h;\n  $('tabBiblio').innerHTML = h;\n}\n\n/* =========================== MEMORIA E NORMAS =========================== */\nfunction renderMemoria() {\n  const m = matAtual();\n  const t = TIPO === 'torcao';\n  const linhas = [\n    ['Tipo de mola', TIPO === 'compressao' ? 'Helicoidal cilíndrica de compressão' : TIPO === 'tracao' ? 'Helicoidal cilíndrica de tração' : 'Helicoidal de torção'],\n    ['Material', `${m.nome} (${m.norma})`],\n    ['Diâmetro do arame d', fmt(INP.d, 2) + ' mm'],\n    ['Diâmetro médio D', fmt(INP.D, 2) + ' mm'],\n    ['Índice de mola C', fmt(R.C, 3)],\n    ['Temperatura de serviço', fmt(INP.T, 0) + ' °C'],\n    ['Critério de fadiga', INP.criterio === 'gerber' ? 'Gerber' : 'Goodman modificado'],\n    ['Jateamento', INP.jateado ? 'sim' : 'não']\n  ];\n  if (t) {\n    linhas.push(['Rigidez', fmt(R.kGrau, 4) + ' N·mm/° (' + fmt(R.kVolta, 1) + ' N·mm/volta)']);\n    linhas.push(['Rotação sob momento máximo', fmt(R.thetaMaxGrau, 2) + '°']);\n    linhas.push(['Tensão de flexão máxima', fmt(R.sigMax, 1) + ' MPa (admissível ' + fmt(R.Sy, 0) + ' MPa)']);\n  } else {\n    linhas.push(['Rigidez', fmt(R.k, 4) + ' N/mm']);\n    linhas.push(['Deflexão sob carga máxima', fmt(R.defMax, 3) + ' mm']);\n    linhas.push(['Tensão de cisalhamento máxima', fmt(R.tauMax, 1) + ' MPa (admissível ' + fmt(R.Ssy, 0) + ' MPa)']);\n  }\n  linhas.push(['Fator de segurança ao escoamento', fmt(R.nEscoamento, 3)]);\n  linhas.push(['Fator de segurança à fadiga', Number.isFinite(R.nFadiga) ? fmt(R.nFadiga, 3) : 'vida infinita']);\n  linhas.push(['Vida estimada', R.vida === Infinity ? 'acima de 10⁶ ciclos' : fmt(R.vida, 0) + ' ciclos']);\n\n  let h = `<h4 style=\"font-size:13px;margin-bottom:8px\">Resumo do cálculo<\u002Fh4>\n    <table><tbody>${linhas.map(l => `<tr><td>${l[0]}<\u002Ftd><td class=\"n\">${esc(l[1])}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable>`;\n\n  h += `<h4 style=\"font-size:13px;margin:20px 0 8px\">Referências normativas e bibliográficas<\u002Fh4>\n  <table><thead><tr><th>Referência<\u002Fth><th>Uso neste cálculo<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n    <tr><td><b>ASTM A227 / A228 / A229 / A230 / A231 / A232 / A401 / A877 / A313 / A679<\u002Fb><\u002Ftd>\n        <td>Especificação dos arames de mola: composição, faixas de bitola, requisitos de resistência e de superfície.<\u002Ftd><\u002Ftr>\n    <tr><td><b>DIN 17223 / EN 10270-1<\u002Fb> e <b>DIN 17221 / EN 10089<\u002Fb><\u002Ftd>\n        <td>Arames patenteados estirados e aços-liga para molas — classes de resistência europeias.<\u002Ftd><\u002Ftr>\n    <tr><td><b>EN 10270-3<\u002Fb><\u002Ftd><td>Arames de aço inoxidável para molas.<\u002Ftd><\u002Ftr>\n    <tr><td><b>DIN 2095<\u002Fb> / <b>DIN 2096<\u002Fb> / <b>DIN 2097<\u002Fb> / <b>DIN 2088<\u002Fb><\u002Ftd>\n        <td>Tolerâncias e classes de qualidade de molas de compressão (2095/2096), de tração (2097) e de torção (2088).<\u002Ftd><\u002Ftr>\n    <tr><td><b>DIN EN 13906-1/-2/-3<\u002Fb><\u002Ftd><td>Cálculo e projeto de molas helicoidais de compressão, tração e torção.<\u002Ftd><\u002Ftr>\n    <tr><td><b>ABNT NBR 5170<\u002Fb><\u002Ftd><td>Terminologia e simbologia de molas de aço.<\u002Ftd><\u002Ftr>\n    <tr><td><b>ASTM B159 / B197 / B134 / B122<\u002Fb><\u002Ftd><td>Arames de bronze fosforoso, berílio-cobre, latão e cupro-níquel-zinco.<\u002Ftd><\u002Ftr>\n    <tr><td><b>ASTM B164 / B865 / B166 / B574<\u002Fb> · <b>AMS 5596 / 5698<\u002Fb><\u002Ftd>\n        <td>Ligas de níquel: Monel, Inconel e Hastelloy em condição de mola.<\u002Ftd><\u002Ftr>\n    <tr><td><b>ASTM B348<\u002Fb> · <b>ASTM F1058<\u002Fb><\u002Ftd><td>Titânio grau 5 e grau 19; liga Co-Cr-Ni-Mo (Elgiloy/Phynox).<\u002Ftd><\u002Ftr>\n    <tr><td><b>SHIGLEY, MISCHKE, BUDYNAS<\u002Fb> — <i>Mechanical Engineering Design<\u002Fi>, cap. 10<\u002Ftd>\n        <td>Fator de Bergsträsser, fator K<sub>i<\u002Fsub> de flexão, critério de estabilidade lateral, dados de fadiga de Zimmerli, correção de espiras ativas em molas de tração e rigidez de molas de torção.<\u002Ftd><\u002Ftr>\n    <tr><td><b>WAHL, A. M.<\u002Fb> — <i>Mechanical Springs<\u002Fi><\u002Ftd><td>Fator de concentração de tensão clássico e tensão inicial de enrolamento.<\u002Ftd><\u002Ftr>\n    <tr><td><b>SAE HS-795<\u002Fb> / <b>SMI Handbook of Spring Design<\u002Fb><\u002Ftd>\n        <td>Faixas práticas de índice de mola, tensões admissíveis por percentual de S<sub>ut<\u002Fsub> e prática de jateamento.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>`;\n\n  h += `<h4 style=\"font-size:13px;margin:20px 0 8px\">Limitações do modelo<\u002Fh4>\n  <div class=\"msg info\"><b>Escopo<\u002Fb><span>Somente molas helicoidais <b>cilíndricas de seção circular<\u002Fb>. Não cobre molas cônicas, barrilete, de seção retangular, planas, prato (Belleville) ou de fio conformado.<\u002Fspan><\u002Fdiv>\n  <div class=\"msg info\"><b>Sut<\u002Fb><span>Onde há coeficientes A e m publicados, S<sub>ut<\u002Fsub> = A·d<sup>−m<\u002Fsup>. Nos demais materiais adota-se a média da faixa declarada — sempre confirme no certificado do lote.<\u002Fspan><\u002Fdiv>\n  <div class=\"msg info\"><b>Fadiga<\u002Fb><span>Aços ferrosos com d ≤ 10 mm usam os dados de Zimmerli, independentes de S<sub>ut<\u002Fsub>. Ligas de níquel, cobre, titânio e inoxidáveis usam estimativa por fração de S<sub>ut<\u002Fsub> — resultado de pré-dimensionamento. Não há verificação de corrosão-fadiga, fretting nem fluência.<\u002Fspan><\u002Fdiv>\n  <div class=\"msg info\"><b>Temperatura<\u002Fb><span>A correção de G e E é linear e aproximada. Perda de carga por relaxação em serviço quente não é quantificada: acima de cerca de 0,85·T<sub>máx<\u002Fsub> o dimensionamento deve ser confirmado por ensaio de relaxação.<\u002Fspan><\u002Fdiv>\n  <div class=\"msg info\"><b>Molas de torção<\u002Fb><span>A flexão das pernas (L₁ e L₂) como vigas engastadas não é verificada. Molas de torção devem ser carregadas no sentido que fecha o enrolamento; o sentido inverso não é coberto pelas tensões admissíveis adotadas.<\u002Fspan><\u002Fdiv>\n  <div class=\"msg info\"><b>Molas de tração<\u002Fb><span>A vida em fadiga é normalmente governada pelos ganchos. Os fatores K<sub>A<\u002Fsub> e K<sub>B,g<\u002Fsub> dependem dos raios reais de conformação — meça no protótipo.<\u002Fspan><\u002Fdiv>`;\n  $('tabMem').innerHTML = h;\n}\n\n/* ============================== HISTORICO ============================== */\nfunction lerHist() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }\nfunction gravarHist(a) { try { localStorage.setItem(KEY, JSON.stringify(a.slice(0, 40))); } catch (e) { } }\nfunction salvar() {\n  if (!R || (R.erros && R.erros.length)) { alert('Corrija os dados de entrada antes de salvar.'); return; }\n  const h = lerHist();\n  h.unshift({\n    ts: Date.now(), tipo: TIPO, campos: capturarCampos(),\n    resumo: `${matAtual().id} · d ${fmt(INP.d, 2)} · D ${fmt(INP.D, 1)} · ` +\n      (TIPO === 'torcao' ? `k′ ${fmt(R.kGrau, 3)} N·mm/°` : `k ${fmt(R.k, 2)} N/mm`) +\n      ` · n ${fmt(R.nEscoamento, 2)}`\n  });\n  gravarHist(h); renderHist();\n}\nfunction renderHist() {\n  const h = lerHist();\n  $('histCount').textContent = h.length ? h.length + (h.length === 1 ? ' registro' : ' registros') : 'nenhum';\n  if (!h.length) { $('hist').innerHTML = '<p style=\"color:var(--ink3);margin:0;font-size:12.5px\">Nenhum cálculo salvo. Use “Salvar cálculo” para guardar a configuração atual neste navegador.<\u002Fp>'; return; }\n  const rot = { compressao: 'Compressão', tracao: 'Tração', torcao: 'Torção' };\n  $('hist').innerHTML = h.map((it, i) => `<div class=\"hitem\">\n    <span class=\"num\">${new Date(it.ts).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}<\u002Fspan>\n    <span class=\"pill neutro\">${rot[it.tipo]}<\u002Fspan>\n    <strong>${esc(it.resumo)}<\u002Fstrong>\n    <button class=\"iconbtn\" data-carregar=\"${i}\">Carregar<\u002Fbutton>\n    <button class=\"iconbtn\" data-excluir=\"${i}\">Excluir<\u002Fbutton><\u002Fdiv>`).join('');\n  $('hist').querySelectorAll('[data-carregar]').forEach(b => b.onclick = () => {\n    const it = lerHist()[+b.dataset.carregar];\n    trocarTipo(it.tipo); aplicarCampos(it.campos); render();\n  });\n  $('hist').querySelectorAll('[data-excluir]').forEach(b => b.onclick = () => {\n    const a = lerHist(); a.splice(+b.dataset.excluir, 1); gravarHist(a); renderHist();\n  });\n}\n\nconst CAMPOS = ['fFamilia', 'fMaterial', 'fd', 'fD', 'fNt', 'fL0', 'fEnds', 'fApoio', 'fNb', 'fL0t', 'fFi',\n  'fr1', 'fr2', 'fNbt', 'fdMandril', 'fL1', 'fL2', 'fSentido', 'fFmin', 'fFmax', 'fModoM', 'fMmin', 'fMmax',\n  'fFmint', 'fFmaxt', 'fBraco', 'fT', 'ffExc', 'fCriterio'];\nfunction capturarCampos() {\n  const o = { fJateado: $('fJateado').checked };\n  CAMPOS.forEach(c => { if ($(c)) o[c] = $(c).value; });\n  return o;\n}\nfunction aplicarCampos(o) {\n  if (o.fFamilia !== undefined) { $('fFamilia').value = o.fFamilia; atualizarListaMateriais(); }\n  CAMPOS.forEach(c => { if ($(c) && o[c] !== undefined) $(c).value = o[c]; });\n  $('fJateado').checked = !!o.fJateado;\n  sincronizarMomento();\n}\n\n/* ============================== NAVEGACAO ============================== */\nfunction trocarTipo(t) {\n  TIPO = t;\n  document.querySelectorAll('.selector button').forEach(b =>\n    b.setAttribute('aria-selected', String(b.dataset.tipo === t)));\n  document.querySelectorAll('[data-grupo]').forEach(el =>\n    el.hidden = !el.dataset.grupo.split(' ').includes(t));\n  $('rotuloTipo').textContent = t === 'compressao' ? 'compressão' : t === 'tracao' ? 'tração' : 'torção';\n}\nfunction sincronizarMomento() {\n  const f = $('fModoM').value === 'forca';\n  $('grpForca').hidden = !f; $('grpMomento').hidden = f;\n}\n\nconst EXEMPLOS = {\n  compressao: { fFamilia: '', fMaterial: 'A229', fd: '4', fD: '25', fNt: '10', fL0: '75',\n    fEnds: 'esquadroEsm', fApoio: 'fixo', fFmin: '100', fFmax: '400', fT: '20', ffExc: '10',\n    fCriterio: 'gerber', fJateado: false },\n  tracao: { fFamilia: '', fMaterial: 'A228', fd: '2,5', fD: '16', fNb: '24', fL0t: '90', fFi: '',\n    fr1: '10', fr2: '4', fFmin: '40', fFmax: '120', fT: '20', ffExc: '', fCriterio: 'gerber', fJateado: false },\n  torcao: { fFamilia: '', fMaterial: 'A227', fd: '3,5', fD: '22', fNbt: '9', fdMandril: '16',\n    fL1: '40', fL2: '40', fSentido: 'fecha', fModoM: 'forca', fFmint: '0', fFmaxt: '50', fBraco: '40',\n    fT: '20', fCriterio: 'goodman', fJateado: false }\n};\n\nfunction iniciar() {\n  popularMateriais();\n  trocarTipo('compressao');\n  sincronizarMomento();\n\n  document.querySelectorAll('.selector button').forEach(b =>\n    b.onclick = () => { trocarTipo(b.dataset.tipo); render(); });\n\n  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {\n    document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', 'false'));\n    document.querySelectorAll('.pane').forEach(p => p.hidden = true);\n    b.setAttribute('aria-selected', 'true');\n    $(b.dataset.pane).hidden = false;\n  });\n\n  $('fFamilia').onchange = () => { atualizarListaMateriais(); render(); };\n  $('fModoM').onchange = () => { sincronizarMomento(); render(); };\n  ['fMaterial', 'fEnds', 'fApoio', 'fSentido', 'fCriterio'].forEach(id => { if ($(id)) $(id).onchange = render; });\n  $('fJateado').onchange = render;\n  document.querySelectorAll('input.inp').forEach(el => { el.oninput = render; });\n  ['bFam', 'bBusca', 'bTmin', 'bCorr', 'bOrdem'].forEach(id => {\n    const el = $(id); if (!el) return;\n    el.oninput = renderBiblio; el.onchange = renderBiblio;\n  });\n\n  $('btnExemplo').onclick = () => { aplicarCampos(EXEMPLOS[TIPO]); render(); };\n  $('btnSalvar').onclick = salvar;\n  $('btnImprimir').onclick = () => window.print();\n  $('btnTema').onclick = () => {\n    const atual = document.documentElement.getAttribute('data-tema') === 'escuro' ? 'claro' : 'escuro';\n    document.documentElement.setAttribute('data-tema', atual);\n    try { localStorage.setItem(KEY + '.tema', atual); } catch (e) { }\n  };\n  try {\n    const t = localStorage.getItem(KEY + '.tema');\n    if (t) document.documentElement.setAttribute('data-tema', t);\n  } catch (e) { }\n\n  renderHist();\n  render();\n}\n\nif (typeof document !== 'undefined') {\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);\n  else iniciar();\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
