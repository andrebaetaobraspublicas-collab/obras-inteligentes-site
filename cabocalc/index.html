  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"pt-BR\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>CaboCalc — Cabos estruturais estacionários<\u002Ftitle>\n<style>\n:root{\n  --paper:#eceff3; --card:#fff; --card2:#f5f7f9;\n  --line:#d9e0e7; --line2:#bfcad4;\n  --txt:#141d26; --txt2:#4a5c6b; --txt3:#7a8b99;\n  --aco:#1f5f7a; --aco-l:#e8f2f6;\n  --ferro:#a8551c; --ferro-l:#fbf0e7;\n  --ok:#1a7549; --ok-l:#e9f5ee;\n  --warn:#9c7008; --warn-l:#fdf6e3;\n  --bad:#b8302a; --bad-l:#fceceb;\n  --mono:ui-monospace,\"SF Mono\",\"Cascadia Mono\",\"Roboto Mono\",Consolas,monospace;\n  --sans:\"Inter\",\"Segoe UI\",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;\n  --r:4px; --sh:0 1px 2px rgba(20,29,38,.05); --sh2:0 2px 9px rgba(20,29,38,.08);\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{-webkit-text-size-adjust:100%}\nbody{background:var(--paper);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh;\n  background-image:radial-gradient(ellipse 880px 460px at 10% -6%,rgba(31,95,122,.06),transparent 62%),\n                   radial-gradient(ellipse 720px 460px at 95% 3%,rgba(168,85,28,.045),transparent 60%);\n  background-attachment:fixed}\nbutton,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}\nbutton{cursor:pointer;background:none;border:none}\na{color:var(--aco)}\n\n.top{border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50}\n.top-in{max-width:1560px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}\n.brand{display:flex;align-items:baseline;gap:9px}\n.brand h1{font-size:19px;font-weight:800;letter-spacing:-.035em}\n.brand h1 span{color:var(--aco)}\n.brand .sub{font-family:var(--mono);font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.13em}\n.top-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}\n.btn{border:1px solid var(--line2);background:var(--card);border-radius:var(--r);padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--txt2);transition:.14s;white-space:nowrap;box-shadow:var(--sh)}\n.btn:hover{border-color:var(--aco);color:var(--aco);background:var(--aco-l)}\n.btn:focus-visible{outline:2px solid var(--aco);outline-offset:2px}\n.btn-p{background:var(--aco);border-color:var(--aco);color:#fff;font-weight:700}\n.btn-p:hover{background:#26718f;border-color:#26718f;color:#fff}\n\n.shell{max-width:1560px;margin:0 auto;padding:18px 20px 70px;display:grid;grid-template-columns:372px 1fr;gap:20px;align-items:start}\n@media(max-width:1150px){.shell{grid-template-columns:1fr}}\n.rail{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow-y:auto;padding-right:5px}\n@media(max-width:1150px){.rail{position:static;max-height:none}}\n.rail::-webkit-scrollbar{width:8px}\n.rail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}\n\n.card{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}\n.card-h{padding:9px 13px;border-bottom:1px solid var(--line);background:var(--card2);display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}\n.card-h .idx{font-family:var(--mono);font-size:10px;color:var(--aco);border:1px solid var(--aco);border-radius:3px;padding:1px 5px;background:var(--aco-l)}\n.card-h h3{font-size:12.5px;font-weight:700;flex:1}\n.card-h .chev{color:var(--txt3);font-size:11px;transition:.2s}\n.card.collapsed .chev{transform:rotate(-90deg)}\n.card.collapsed .card-b{display:none}\n.card-b{padding:13px}\n\n.f{margin-bottom:11px}.f:last-child{margin-bottom:0}\n.f label{display:block;font-size:10.5px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}\n.f label .u{color:var(--txt3);font-weight:400;text-transform:none;letter-spacing:0}\n.f .hint{font-size:11px;color:var(--txt3);margin-top:4px;line-height:1.45}\ninput[type=number],input[type=text],input[type=date],select{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:7px 9px;font-family:var(--mono);font-size:13px;transition:.14s}\nselect{font-family:var(--sans);cursor:pointer}\ninput:focus,select:focus{outline:none;border-color:var(--aco);box-shadow:0 0 0 3px rgba(31,95,122,.13)}\ninput[readonly]{color:var(--txt3);background:var(--card2);cursor:not-allowed}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}\n.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt2);cursor:pointer;margin-bottom:6px}\n.chk input{width:14px;height:14px;accent-color:var(--aco);cursor:pointer}\n.auto{display:flex;gap:6px;font-size:10.5px;color:var(--aco);font-family:var(--mono);margin-top:4px}\n.auto button{color:var(--aco);text-decoration:underline;font-size:10.5px;font-family:var(--mono)}\n\n.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin-bottom:16px;overflow-x:auto}\n.tab{padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--txt3);border-bottom:2px solid transparent;white-space:nowrap;transition:.14s}\n.tab:hover{color:var(--txt)}\n.tab.on{color:var(--aco);border-bottom-color:var(--aco)}\n.pane{display:none}.pane.on{display:block}\n\n.verdict{border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:16px;background:var(--card);box-shadow:var(--sh2)}\n.verdict-h{padding:15px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}\n.lamp{width:15px;height:15px;border-radius:50%;flex:none}\n.lamp.ok{background:var(--ok);box-shadow:0 0 0 4px var(--ok-l)}\n.lamp.warn{background:var(--warn);box-shadow:0 0 0 4px var(--warn-l)}\n.lamp.bad{background:var(--bad);box-shadow:0 0 0 4px var(--bad-l)}\n.verdict-t{font-size:17px;font-weight:800;letter-spacing:-.02em}\n.verdict-s{font-size:12.5px;color:var(--txt2);margin-top:2px}\n.verdict-tag{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;padding:4px 9px;border-radius:3px;border:1px solid;font-weight:700}\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(156px,1fr));gap:1px;background:var(--line)}\n.kpi{background:var(--card);padding:12px 14px}\n.kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt3);font-weight:700}\n.kpi .v{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:3px;line-height:1.1}\n.kpi .v small{font-size:12px;color:var(--txt3);font-weight:400;margin-left:2px}\n.kpi .n{font-size:11px;color:var(--txt3);margin-top:3px}\n.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}\n.c-aco{color:var(--aco)}.c-ferro{color:var(--ferro)}\n\n.panel{background:var(--card);border:1px solid var(--line);border-radius:7px;margin-bottom:14px;overflow:hidden;box-shadow:var(--sh)}\n.panel-h{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card2);display:flex;align-items:center;gap:12px;flex-wrap:wrap}\n.panel-h h3{font-size:12.5px;font-weight:700;flex:1}\n.panel-h p{font-size:11.5px;color:var(--txt3);margin-top:2px;width:100%}\n.panel-h .eyebrow{font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:.11em;text-transform:uppercase}\n.panel-b{padding:14px}\n.panel canvas{width:100%;height:auto;display:block}\n.legend{display:flex;gap:15px;flex-wrap:wrap;padding:0 14px 12px;font-size:11.5px;color:var(--txt2)}\n.legend i{display:inline-block;width:14px;height:2.5px;margin-right:5px;vertical-align:middle;border-radius:2px}\n.scrub{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}\n.scrub input[type=range]{flex:1;min-width:170px;accent-color:var(--aco);height:4px;cursor:pointer}\n.scrub .rd{font-family:var(--mono);font-size:12px;color:var(--txt2)}\n.scrub .rd b{color:var(--aco);font-weight:700}\n\ntable{width:100%;border-collapse:collapse;font-size:12.5px}\nth{text-align:left;padding:7px 10px;background:var(--card2);color:var(--txt3);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;border-bottom:1px solid var(--line)}\ntd{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}\ntbody tr:last-child td{border-bottom:none}\ntd.num,th.num{text-align:right;font-family:var(--mono)}\ntbody tr:hover{background:var(--card2)}\n.st{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 6px;border-radius:2px;letter-spacing:.06em}\n.st.ok{background:var(--ok-l);color:var(--ok)}\n.st.warn{background:var(--warn-l);color:var(--warn)}\n.st.bad{background:var(--bad-l);color:var(--bad)}\n\n.rec{border:1px solid var(--line);border-left:3px solid var(--txt3);border-radius:var(--r);padding:11px 14px;margin-bottom:9px;background:var(--card);box-shadow:var(--sh)}\n.rec.crit{border-left-color:var(--bad)}.rec.att{border-left-color:var(--warn)}\n.rec.info{border-left-color:var(--aco)}.rec.good{border-left-color:var(--ok)}\n.rec h4{font-size:12.5px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}\n.rec .pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid currentColor;font-weight:600}\n.rec.crit .pill{color:var(--bad)}.rec.att .pill{color:var(--warn)}\n.rec.info .pill{color:var(--aco)}.rec.good .pill{color:var(--ok)}\n.rec p{font-size:12.5px;color:var(--txt2);line-height:1.55}\n.rec .src{font-family:var(--mono);font-size:10.5px;color:var(--txt3);margin-top:6px}\n\n.mem{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:18px 20px;box-shadow:var(--sh)}\n.mem h3{font-size:13px;font-weight:800;margin:20px 0 8px;color:var(--aco)}\n.mem h3:first-child{margin-top:0}\n.mem p{font-size:12.5px;color:var(--txt2);margin-bottom:8px;line-height:1.6}\n.eq{background:var(--card2);border:1px solid var(--line);border-left:2px solid var(--ferro);border-radius:var(--r);padding:10px 13px;margin:8px 0;font-family:var(--mono);font-size:12.5px;overflow-x:auto;white-space:pre;line-height:1.7}\n.mem .note{font-size:11.5px;color:var(--txt3);font-style:italic}\n\n.proj{display:flex;align-items:center;gap:12px;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--card);box-shadow:var(--sh)}\n.proj .pn{flex:1;min-width:0}\n.proj .pn b{font-size:13px;display:block}\n.proj .pn small{font-size:11px;color:var(--txt3);font-family:var(--mono)}\n.empty{padding:40px 20px;text-align:center;color:var(--txt3);font-size:13px}\n.empty b{display:block;color:var(--txt2);font-size:14px;margin-bottom:5px}\n\n.warnbar{background:var(--bad-l);border:1px solid #efc3c0;border-radius:var(--r);padding:9px 13px;font-size:12.5px;color:#8a231e;margin-bottom:12px;line-height:1.5}\n.infobar{background:var(--aco-l);border:1px solid #c0dbe5;border-radius:var(--r);padding:9px 13px;font-size:12.5px;color:#134b61;margin-bottom:12px;line-height:1.5}\n.rustbar{background:var(--ferro-l);border:1px solid #ecd0b6;border-radius:var(--r);padding:9px 13px;font-size:12.5px;color:#7d3d11;margin-bottom:12px;line-height:1.5}\n.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--txt);color:#fff;border-radius:6px;padding:10px 18px;font-size:13px;z-index:200;opacity:0;transition:.28s;pointer-events:none;box-shadow:0 8px 28px rgba(20,29,38,.3)}\n.toast.on{transform:translateX(-50%) translateY(0);opacity:1}\n.foot{max-width:1560px;margin:0 auto;padding:20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--txt3);line-height:1.6}\n.foot b{color:var(--txt2)}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}\n@media print{\n  body{background:#fff;background-image:none}\n  .top,.rail,.tabs,.top-actions,.scrub,.foot{display:none!important}\n  .shell{display:block;max-width:none;padding:0}\n  .pane{display:block!important;page-break-before:always}\n  .pane:first-of-type{page-break-before:auto}\n  .card,.panel,.verdict,.mem,.rec{box-shadow:none;border-color:#bbb;break-inside:avoid}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<header class=\"top\"><div class=\"top-in\">\n  <div class=\"brand\"><h1>Cabo<span>Calc<\u002Fspan><\u002Fh1><span class=\"sub\">Cabos estruturais estacionários<\u002Fspan><\u002Fdiv>\n  <div class=\"top-actions\">\n    <button class=\"btn\" id=\"btnNovo\">Limpar<\u002Fbutton>\n    <button class=\"btn\" id=\"btnSalvar\">Salvar<\u002Fbutton>\n    <button class=\"btn\" id=\"btnJson\">JSON<\u002Fbutton>\n    <button class=\"btn\" id=\"btnCsv\">CSV<\u002Fbutton>\n    <button class=\"btn\" id=\"btnPdf\">Relatório<\u002Fbutton>\n    <button class=\"btn btn-p\" id=\"btnCalc\">Calcular<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fheader>\n<div class=\"shell\">\n<aside class=\"rail\">\n\n  <div class=\"card\"><div class=\"card-h\"><span class=\"idx\">01<\u002Fspan><h3>Identificação<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n  <div class=\"card-b\">\n    <div class=\"f\"><label>Obra / contrato<\u002Flabel><input type=\"text\" id=\"obra\" placeholder=\"Ex.: Passarela do Setor Norte\"><\u002Fdiv>\n    <div class=\"f\"><label>Elemento<\u002Flabel><input type=\"text\" id=\"elem\" placeholder=\"Ex.: Tirante T-03 do arrimo\"><\u002Fdiv>\n    <div class=\"grid2\">\n      <div class=\"f\"><label>Data<\u002Flabel><input type=\"date\" id=\"data\"><\u002Fdiv>\n      <div class=\"f\"><label>Responsável<\u002Flabel><input type=\"text\" id=\"resp\" placeholder=\"Nome / CREA\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <div class=\"card\"><div class=\"card-h\"><span class=\"idx\">02<\u002Fspan><h3>Cabo<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n  <div class=\"card-b\">\n    <div class=\"f\"><label>Construção<\u002Flabel><select id=\"tipo\"><\u002Fselect><div class=\"hint\" id=\"tipoHint\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"grid2\">\n      <div class=\"f\"><label>Diâmetro nominal <span class=\"u\">mm<\u002Fspan><\u002Flabel><input type=\"number\" id=\"diam\" value=\"12.7\" step=\"0.5\" min=\"4\" max=\"120\"><\u002Fdiv>\n      <div class=\"f\"><label>Classe R<sub>r<\u002Fsub> <span class=\"u\">MPa<\u002Fspan><\u002Flabel>\n        <select id=\"Rr\"><option>1570<\u002Foption><option selected=\"\">1770<\u002Foption><option>1860<\u002Foption><option>1960<\u002Foption><\u002Fselect><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"f\"><label>Número de cabos em paralelo<\u002Flabel><input type=\"number\" id=\"nCabos\" value=\"1\" step=\"1\" min=\"1\" max=\"60\"><\u002Fdiv>\n    <div class=\"f\"><label class=\"chk\" style=\"margin-bottom:2px\"><input type=\"checkbox\" id=\"preEst\"> Cabo pré-esticado em fábrica<\u002Flabel>\n      <div class=\"hint\">Elimina quase todo o alongamento estrutural e eleva o módulo efetivo. Exigência usual em tirantes e estais protendidos.<\u002Fdiv><\u002Fdiv>\n    <div class=\"grid2\">\n      <div class=\"f\"><label>F<sub>min<\u002Fsub> ruptura <span class=\"u\">kN<\u002Fspan><\u002Flabel><input type=\"number\" id=\"Fmin\" readonly=\"\"><\u002Fdiv>\n      <div class=\"f\"><label>Área metálica <span class=\"u\">mm²<\u002Fspan><\u002Flabel><input type=\"number\" id=\"Am\" readonly=\"\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid2\">\n      <div class=\"f\"><label>Massa <span class=\"u\">kg/m<\u002Fspan><\u002Flabel><input type=\"number\" id=\"massa\" readonly=\"\"><\u002Fdiv>\n      <div class=\"f\"><label>E efetivo <span class=\"u\">GPa<\u002Fspan><\u002Flabel><input type=\"number\" id=\"Ef\" step=\"5\" min=\"50\" max=\"210\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"rustbar\" style=\"margin:8px 0 0;font-size:11px;padding:7px 10px\">F<sub>min<\u002Fsub> vem de F = K·d²·R<sub>r<\u002Fsub>/1000 (ISO 2408). Área, massa e módulo são valores típicos: <b>substitua pelos do catálogo do fabricante<\u002Fb> antes de emitir o projeto.<\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <div class=\"card\"><div class=\"card-h\"><span class=\"idx\">03<\u002Fspan><h3>Aplicação e carregamento<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n  <div class=\"card-b\">\n    <div class=\"f\"><label>Modo de análise<\u002Flabel>\n      <select id=\"modo\">\n        <option value=\"reto\">Tirante reto — flecha desprezível<\u002Foption>\n        <option value=\"flecha\">Cabo com flecha — estai, cabo de sustentação<\u002Foption>\n      <\u002Fselect>\n      <div class=\"hint\">No modo reto a tração é dada diretamente. No modo com flecha ela resulta da geometria, do peso próprio e da protensão.<\u002Fdiv><\u002Fdiv>\n    <div id=\"blocoReto\">\n      <div class=\"grid2\">\n        <div class=\"f\"><label>Tração permanente <span class=\"u\">kN<\u002Fspan><\u002Flabel><input type=\"number\" id=\"Fperm\" value=\"18\" step=\"1\" min=\"0\"><\u002Fdiv>\n        <div class=\"f\"><label>Tração máxima <span class=\"u\">kN<\u002Fspan><\u002Flabel><input type=\"number\" id=\"Fmax\" value=\"26\" step=\"1\" min=\"0\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:-4px\">Valores característicos por cabo, já divididos pelo número de cabos em paralelo.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"f\" style=\"margin-top:11px\"><label>Coeficiente de segurança exigido<\u002Flabel>\n      <select id=\"gamma\">\n        <option value=\"2.0\">2,0 — tirante permanente protegido, com inspeção<\u002Foption>\n        <option value=\"2.5\">2,5 — estai e cabo estrutural (usual)<\u002Foption>\n        <option value=\"3.0\" selected=\"\">3,0 — cabo de sustentação com acesso de pessoas<\u002Foption>\n        <option value=\"3.5\">3,5 — guarda-corpo e linha de vida<\u002Foption>\n        <option value=\"5.0\">5,0 — içamento e movimentação de carga (NR-11 / NR-18)<\u002Foption>\n      <\u002Fselect><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <div class=\"card\" id=\"cardGeo\"><div class=\"card-h\"><span class=\"idx\">04<\u002Fspan><h3>Geometria e protensão<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n  <div class=\"card-b\">\n    <div class=\"grid2\">\n      <div class=\"f\"><label>Vão horizontal <span class=\"u\">m<\u002Fspan><\u002Flabel><input type=\"number\" id=\"vao\" value=\"30\" step=\"0.5\" min=\"1\" max=\"600\"><\u002Fdiv>\n      <div class=\"f\"><label>Desnível entre apoios <span class=\"u\">m<\u002Fspan><\u002Flabel><input type=\"number\" id=\"desn\" value=\"0\" step=\"0.5\" min=\"-200\" max=\"200\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"f\"><label>Definir estado por<\u002Flabel>\n      <select id=\"defPor\"><option value=\"H\">Protensão horizontal (kN)<\u002Foption><option value=\"f\">Flecha alvo no meio do vão (m)<\u002Foption><\u002Fselect><\u002Fdiv>\n    <div class=\"grid2\">\n      <div class=\"f\"><label>Protensão H <span class=\"u\">kN<\u002Fspan><\u002Flabel><input type=\"number\" id=\"H0\" value=\"20\" step=\"0.5\" min=\"0.1\"><\u002Fdiv>\n      <div class=\"f\"><label>Flecha alvo <span class=\"u\">m<\u002Fspan><\u002Flabel><input type=\"number\" id=\"fAlvo\" value=\"0.30\" step=\"0.05\" min=\"0.005\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid3\">\n      <div class=\"f\"><label>T montagem <span class=\"u\">°C<\u002Fspan><\u002Flabel><input type=\"number\" id=\"tMont\" value=\"25\" step=\"1\" min=\"-10\" max=\"60\"><\u002Fdiv>\n      <div class=\"f\"><label>T mínima <span class=\"u\">°C<\u002Fspan><\u002Flabel><input type=\"number\" id=\"tMin\" value=\"5\" step=\"1\" min=\"-30\" max=\"50\"><\u002Fdiv>\n      <div class=\"f\"><label>T máxima <span class=\"u\">°C<\u002Fspan><\u002Flabel><input type=\"number\" id=\"tMax\" value=\"55\" step=\"1\" min=\"0\" max=\"90\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"f\"><label>Carga transversal adicional <span class=\"u\">N/m<\u002Fspan><\u002Flabel><input type=\"number\" id=\"qAd\" value=\"0\" step=\"5\" min=\"0\">\n      <div class=\"hint\">Vento, gelo, sobrecarga de instalação ou peso de elementos suspensos ao cabo.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <div class=\"card\"><div class=\"card-h\"><span class=\"idx\">05<\u002Fspan><h3>Terminação<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n  <div class=\"card-b\">\n    <div class=\"f\"><label>Tipo de terminação<\u002Flabel><select id=\"term\"><\u002Fselect><div class=\"hint\" id=\"termHint\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"f\"><label>Comprimento entre terminações <span class=\"u\">m<\u002Fspan><\u002Flabel><input type=\"number\" id=\"compr\" value=\"30\" step=\"0.5\" min=\"0.5\"><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <div class=\"card\"><div class=\"card-h\"><span class=\"idx\">06<\u002Fspan><h3>Durabilidade<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n  <div class=\"card-b\">\n    <div class=\"f\"><label>Categoria de corrosividade — ISO 9223<\u002Flabel><select id=\"cat\"><\u002Fselect><div class=\"hint\" id=\"catHint\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"f\"><label>Proteção<\u002Flabel>\n      <select id=\"prot\">\n        <option value=\"0\">Sem proteção — aço polido<\u002Foption>\n        <option value=\"1\">Zincado classe leve — 135 g/m²<\u002Foption>\n        <option value=\"2\" selected=\"\">Zincado classe pesada — 230 g/m²<\u002Foption>\n        <option value=\"3\">Zincado pesado + graxa/betume — 300 g/m²<\u002Foption>\n        <option value=\"4\">Zincado + bainha de PEAD injetada<\u002Foption>\n        <option value=\"5\">Aço inoxidável AISI 316<\u002Foption>\n      <\u002Fselect><\u002Fdiv>\n    <div class=\"grid2\">\n      <div class=\"f\"><label>Vida útil de projeto <span class=\"u\">anos<\u002Fspan><\u002Flabel><input type=\"number\" id=\"vidaAlvo\" value=\"50\" step=\"5\" min=\"5\" max=\"120\"><\u002Fdiv>\n      <div class=\"f\"><label>Perda de seção admitida <span class=\"u\">%<\u002Fspan><\u002Flabel><input type=\"number\" id=\"perdaAdm\" value=\"10\" step=\"1\" min=\"2\" max=\"30\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <div class=\"card collapsed\"><div class=\"card-h\"><span class=\"idx\">07<\u002Fspan><h3>Fadiga<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n  <div class=\"card-b\">\n    <div class=\"f\"><label class=\"chk\" style=\"margin-bottom:2px\"><input type=\"checkbox\" id=\"verFad\" checked=\"\"> Verificar fadiga<\u002Flabel>\n      <div class=\"hint\">Obrigatório em cabos sob carga cíclica: passarelas, coberturas tensionadas, estais sob vento.<\u002Fdiv><\u002Fdiv>\n    <div class=\"grid2\">\n      <div class=\"f\"><label>Ciclos previstos<\u002Flabel><input type=\"number\" id=\"nCiclos\" value=\"2000000\" step=\"100000\" min=\"1000\"><\u002Fdiv>\n      <div class=\"f\"><label>Δσ<sub>c<\u002Fsub> <span class=\"u\">MPa<\u002Fspan><\u002Flabel><input type=\"number\" id=\"dsc\" value=\"150\" step=\"5\" min=\"60\" max=\"220\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hint\">Δσ<sub>c<\u002Fsub> = 150 MPa a 2×10⁶ ciclos, m = 4, para cordoalha espiral com terminal soquetado (EN 1993-1-11, Tabela 6.4). Normas brasileiras não cobrem fadiga de cabos.<\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <div class=\"card collapsed\"><div class=\"card-h\"><span class=\"idx\">08<\u002Fspan><h3>Orçamento<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n  <div class=\"card-b\">\n    <div class=\"f\"><label>Preço do cabo <span class=\"u\">R$/m<\u002Fspan><\u002Flabel><input type=\"number\" id=\"pCabo\" value=\"0\" step=\"0.5\" min=\"0\"><\u002Fdiv>\n    <div class=\"f\"><label>Preço por terminação <span class=\"u\">R$/un<\u002Fspan><\u002Flabel><input type=\"number\" id=\"pTerm\" value=\"0\" step=\"5\" min=\"0\"><\u002Fdiv>\n    <div class=\"f\"><label>Mão de obra de instalação <span class=\"u\">R$/m<\u002Fspan><\u002Flabel><input type=\"number\" id=\"pMo\" value=\"0\" step=\"0.5\" min=\"0\"><\u002Fdiv>\n    <div class=\"f\"><label>Natureza do item para fins de BDI<\u002Flabel>\n      <select id=\"natBdi\">\n        <option value=\"mat\">Fornecimento de materiais e equipamentos<\u002Foption>\n        <option value=\"obra\" selected=\"\">Serviço de engenharia com instalação<\u002Foption>\n      <\u002Fselect>\n      <div class=\"hint\">O Acórdão TCU 2.622/2013 fixa faixas distintas. Aplicar BDI de obra sobre item de puro fornecimento é achado recorrente de auditoria.<\u002Fdiv><\u002Fdiv>\n    <div class=\"grid2\">\n      <div class=\"f\"><label>BDI adotado <span class=\"u\">%<\u002Fspan><\u002Flabel><input type=\"number\" id=\"bdi\" value=\"22.12\" step=\"0.01\" min=\"0\" max=\"60\"><\u002Fdiv>\n      <div class=\"f\"><label>Perda / sobras <span class=\"u\">%<\u002Fspan><\u002Flabel><input type=\"number\" id=\"perdas\" value=\"5\" step=\"1\" min=\"0\" max=\"25\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hint\">Preços zerados de propósito. Preencha com a composição SINAPI vigente ou cotação da região — nenhum preço vem embutido nesta ferramenta.<\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <div class=\"card collapsed\"><div class=\"card-h\"><span class=\"idx\">09<\u002Fspan><h3>Parâmetros avançados<\u002Fh3><span class=\"chev\">▾<\u002Fspan><\u002Fdiv>\n  <div class=\"card-b\">\n    <div class=\"grid2\">\n      <div class=\"f\"><label>α térmico <span class=\"u\">×10⁻⁶/°C<\u002Fspan><\u002Flabel><input type=\"number\" id=\"alfa\" value=\"12\" step=\"0.5\" min=\"8\" max=\"18\"><\u002Fdiv>\n      <div class=\"f\"><label>Alongamento estrutural <span class=\"u\">%<\u002Fspan><\u002Flabel><input type=\"number\" id=\"alEst\" value=\"0.40\" step=\"0.05\" min=\"0\" max=\"1.5\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid2\">\n      <div class=\"f\"><label>Área metálica A<sub>m<\u002Fsub> <span class=\"u\">mm²<\u002Fspan><\u002Flabel><input type=\"number\" id=\"AmMan\" step=\"1\" min=\"1\"><\u002Fdiv>\n      <div class=\"f\"><label>Ø fio externo <span class=\"u\">mm<\u002Fspan><\u002Flabel><input type=\"number\" id=\"dFio\" step=\"0.05\" min=\"0.2\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"auto\"><span>valores da tabela por construção<\u002Fspan><button type=\"button\" id=\"resetTab\">restaurar<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n<\u002Faside>\n\n<main>\n  <div class=\"tabs\">\n    <button class=\"tab on\" data-pane=\"pa\">Diagnóstico<\u002Fbutton>\n    <button class=\"tab\" data-pane=\"pb\">Geometria e flecha<\u002Fbutton>\n    <button class=\"tab\" data-pane=\"pc\">Durabilidade<\u002Fbutton>\n    <button class=\"tab\" data-pane=\"pd\">Terminações<\u002Fbutton>\n    <button class=\"tab\" data-pane=\"pe\">Orçamento<\u002Fbutton>\n    <button class=\"tab\" data-pane=\"pf\">Memória de cálculo<\u002Fbutton>\n    <button class=\"tab\" data-pane=\"pg\">Projetos<\u002Fbutton>\n  <\u002Fdiv>\n\n  <section class=\"pane on\" id=\"pa\">\n    <div id=\"verdictBox\"><\u002Fdiv>\n    <div class=\"panel\">\n      <div class=\"panel-h\"><span class=\"eyebrow\">Assinatura<\u002Fspan><h3>Seção do cabo e perfil em elevação<\u002Fh3><\u002Fdiv>\n      <div class=\"panel-b\">\n        <canvas id=\"cvMain\" width=\"1000\" height=\"330\"><\u002Fcanvas>\n        <div class=\"scrub\" id=\"scrubWrap\">\n          <input type=\"range\" id=\"scrubT\" min=\"0\" max=\"100\" value=\"50\">\n          <span class=\"rd\">Temperatura <b id=\"rdT\">—<\u002Fb> °C · H <b id=\"rdH\">—<\u002Fb> kN · flecha <b id=\"rdF\">—<\u002Fb> m · T<sub>máx<\u002Fsub> <b id=\"rdTm\">—<\u002Fb> kN<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"verifBox\"><\u002Fdiv>\n    <div id=\"recBox\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"pane\" id=\"pb\">\n    <div id=\"geoBox\"><\u002Fdiv>\n    <div class=\"panel\">\n      <div class=\"panel-h\"><h3>Tração e flecha em função da temperatura<\u002Fh3><p>Equação de mudança de estado: o cabo aquecido alonga, a flecha cresce e a tração cai.<\u002Fp><\u002Fdiv>\n      <div class=\"panel-b\"><canvas id=\"cvTemp\" width=\"1000\" height=\"300\"><\u002Fcanvas><\u002Fdiv>\n      <div class=\"legend\"><span><i style=\"background:#1f5f7a\"><\u002Fi>Tração horizontal H<\u002Fspan><span><i style=\"background:#a8551c\"><\u002Fi>Flecha no meio do vão<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel\">\n      <div class=\"panel-h\"><h3>Tração máxima × protensão de montagem<\u002Fh3><p>Protender demais economiza flecha e consome margem de ruptura. O ponto ótimo fica onde as duas curvas se cruzam.<\u002Fp><\u002Fdiv>\n      <div class=\"panel-b\"><canvas id=\"cvProt\" width=\"1000\" height=\"300\"><\u002Fcanvas><\u002Fdiv>\n      <div class=\"legend\"><span><i style=\"background:#1f5f7a\"><\u002Fi>T máxima no cabo<\u002Fspan><span><i style=\"background:#b8302a\"><\u002Fi>Limite admissível F<sub>min<\u002Fsub>/γ<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"pane\" id=\"pc\">\n    <div id=\"durBox\"><\u002Fdiv>\n    <div class=\"panel\">\n      <div class=\"panel-h\"><h3>Perda de seção e resistência residual<\u002Fh3><p>Zinco consumido primeiro, depois o aço do fio externo. A curva de resistência só cai após o esgotamento do revestimento.<\u002Fp><\u002Fdiv>\n      <div class=\"panel-b\"><canvas id=\"cvCorr\" width=\"1000\" height=\"320\"><\u002Fcanvas><\u002Fdiv>\n      <div class=\"legend\"><span><i style=\"background:#1f5f7a\"><\u002Fi>Resistência residual<\u002Fspan><span><i style=\"background:#a8551c\"><\u002Fi>Perda de seção<\u002Fspan><span><i style=\"background:#b8302a\"><\u002Fi>Limite admitido<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"fadBox\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"pane\" id=\"pd\"><div id=\"termBox\"><\u002Fdiv><\u002Fsection>\n  <section class=\"pane\" id=\"pe\"><div id=\"orcBox\"><\u002Fdiv><\u002Fsection>\n  <section class=\"pane\" id=\"pf\"><div class=\"mem\" id=\"memBox\"><\u002Fdiv><\u002Fsection>\n  <section class=\"pane\" id=\"pg\">\n    <div class=\"infobar\">Os projetos ficam gravados apenas neste navegador. Use <b>JSON<\u002Fb> para transportar um estudo.<\u002Fdiv>\n    <div id=\"projBox\"><\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fdiv>\n\n<footer class=\"foot\">\n  <p><b>CaboCalc<\u002Fb> — verificação de cabos de aço estruturais estacionários: tirantes, estais, cabos de sustentação e contenção. Base normativa: ISO 2408 e ABNT NBR 6327 (cabo e carga de ruptura), EN 1993-1-11 (fadiga e terminações), ISO 9223 (corrosividade atmosférica), Acórdão TCU 2.622/2013 (BDI).<\u002Fp>\n  <p style=\"margin-top:6px\">Não cobre cabos móveis sobre polias, cuja verificação é dominada pela relação D/d e pela fadiga de flexão, nem cordoalhas de protensão aderente, regidas pela NBR 7483 e NBR 6118. Ferramenta de pré-dimensionamento e triagem: os valores de área, massa e módulo são típicos e devem ser substituídos pelos do catálogo do fabricante. A responsabilidade técnica permanece do engenheiro responsável.<\u002Fp>\n<\u002Ffooter>\n<div class=\"toast\" id=\"toast\"><\u002Fdiv>\n<script>\n\"use strict\";\n/* ================================================================\n   CaboCalc — cabos estruturais estacionários\n   ================================================================ */\n\n/* K  = fator de carga de ruptura mínima (ISO 2408 / EN 12385-4)\n   C  = área metálica / d²   ·   Ef = módulo efetivo (GPa)\n   alEst = alongamento estrutural (%)  ·  rFio = Ø fio externo / Ø cabo */\nconst CABOS = {\n  '6×7 alma de fibra':    {K:0.335,C:0.384,Ef:80, alEst:0.50,rFio:0.111,ns:6,nw:7,af:true,\n    txt:'Cabo rígido de poucos fios grossos. Boa resistência à abrasão, pouca flexibilidade. Usado em contraventamento e esticadores.'},\n  '6×19 alma de fibra':   {K:0.330,C:0.365,Ef:70, alEst:0.60,rFio:0.075,ns:6,nw:19,af:true,\n    txt:'Flexível e barato. Módulo baixo e alongamento alto: evite onde a flecha for controlada.'},\n  '6×19 alma de aço':     {K:0.356,C:0.417,Ef:90, alEst:0.40,rFio:0.075,ns:6,nw:19,af:false,\n    txt:'Construção mais usada em obra. Bom equilíbrio entre resistência, flexibilidade e preço.'},\n  '6×36 WS alma de aço':  {K:0.356,C:0.417,Ef:90, alEst:0.35,rFio:0.052,ns:6,nw:36,af:false,\n    txt:'Warrington-Seale. Fios externos mais finos: mais flexível, porém mais sensível à corrosão e ao desgaste.'},\n  '6×41 WS alma de aço':  {K:0.356,C:0.417,Ef:88, alEst:0.35,rFio:0.043,ns:6,nw:41,af:false,\n    txt:'Muito flexível, para diâmetros grandes de içamento. Fio externo muito fino exige atenção redobrada à corrosão.'},\n  '8×19 alma de fibra':   {K:0.310,C:0.345,Ef:65, alEst:0.55,rFio:0.062,ns:8,nw:19,af:true,\n    txt:'Oito pernas, muito flexível. Baixa resistência ao esmagamento. Pouco indicado para uso estacionário protendido.'},\n  '8×36 alma de aço':     {K:0.346,C:0.400,Ef:85, alEst:0.45,rFio:0.043,ns:8,nw:36,af:false,\n    txt:'Flexibilidade elevada com alma de aço resistente ao esmagamento. Uso em guindastes.'},\n  '18×7 antigiratório':   {K:0.328,C:0.400,Ef:85, alEst:0.45,rFio:0.048,ns:18,nw:7,af:false,\n    txt:'Camadas em sentido oposto anulam o torque. Indicado para carga suspensa em cabo único, onde o giro é inaceitável.'},\n  '19×7 antigiratório':   {K:0.328,C:0.404,Ef:88, alEst:0.42,rFio:0.045,ns:19,nw:7,af:false,\n    txt:'Antigiratório de menor rotação residual. Linha de vida e sustentação de cargas rotativas.'},\n  '35×7 antigiratório':   {K:0.333,C:0.410,Ef:90, alEst:0.40,rFio:0.032,ns:35,nw:7,af:false,\n    txt:'Praticamente sem rotação. Grandes alturas de içamento em cabo único.'},\n  '1×7 cordoalha':        {K:0.520,C:0.560,Ef:150,alEst:0.20,rFio:0.333,ns:1,nw:7,af:false,\n    txt:'Cordoalha de sete fios, base dos estais de pequeno porte e das linhas de guarda-corpo tensionadas.'},\n  '1×19 espiral':         {K:0.550,C:0.590,Ef:140,alEst:0.18,rFio:0.200,ns:1,nw:19,af:false,\n    txt:'Cordoalha espiral. Módulo alto e baixo alongamento: escolha natural para tirante e estai.'},\n  '1×37 espiral':         {K:0.560,C:0.600,Ef:140,alEst:0.15,rFio:0.143,ns:1,nw:37,af:false,\n    txt:'Espiral de maior diâmetro, mesmas vantagens do 1×19 com mais capacidade.'},\n  '1×61 espiral':         {K:0.565,C:0.605,Ef:145,alEst:0.14,rFio:0.111,ns:1,nw:61,af:false,\n    txt:'Espiral de grande porte para estais de pontes e coberturas tensionadas.'},\n  'Full locked coil':     {K:0.750,C:0.690,Ef:165,alEst:0.12,rFio:0.120,ns:1,nw:0,af:false,\n    txt:'Fios externos em Z formam superfície fechada e estanque. Maior módulo e melhor proteção contra corrosão. Custo e prazo de fornecimento elevados. Referência para estais permanentes.'},\n  'Half locked coil':     {K:0.700,C:0.660,Ef:158,alEst:0.13,rFio:0.130,ns:1,nw:0,af:false,\n    txt:'Camada externa mista de fios em Z e redondos. Intermediário entre a espiral e o full locked coil.'},\n  'Inox 1×19 (AISI 316)': {K:0.480,C:0.575,Ef:130,alEst:0.20,rFio:0.200,ns:1,nw:19,af:false,\n    txt:'Cordoalha inoxidável. Resistência de ruptura menor que o aço carbono, compensada por durabilidade em ambiente marinho e por dispensar revestimento.'},\n  'Inox 7×19 (AISI 316)': {K:0.300,C:0.400,Ef:100,alEst:0.45,rFio:0.062,ns:7,nw:19,af:false,\n    txt:'Cabo inoxidável flexível para fachadas tensionadas e arquitetura exposta. Verifique sempre a carga de ruptura reduzida frente ao aço carbono.'}\n};\n\nconst TERMINACOES = {\n  'Soquete cônico com resina epóxi': {ef:1.00,ok:true,\n    txt:'Rendimento pleno da carga de ruptura. É a terminação de referência para tirantes e estais permanentes. Execução em oficina qualificada.'},\n  'Soquete cônico com metal fundido':{ef:1.00,ok:true,\n    txt:'Rendimento pleno. Exige controle de temperatura de fusão para não recozer os fios na região do soquete.'},\n  'Terminal prensado (casquilho)':   {ef:0.95,ok:true,\n    txt:'Prensagem a frio com casquilho de alumínio ou aço. Exige prensa calibrada e controle dimensional após a prensagem.'},\n  'Laço com sapatilha e prensa':     {ef:0.90,ok:true,\n    txt:'Sapatilha protege o cabo do raio de curvatura fechado. Sem sapatilha o rendimento cai fortemente.'},\n  'Soquete de cunha':                {ef:0.80,ok:true,\n    txt:'Permite ajuste em campo, mas consome 20% da capacidade. A ponta livre precisa de grampo de segurança.'},\n  'Laço com sapatilha e grampos':    {ef:0.80,ok:true,\n    txt:'Montagem em campo. O torque dos grampos precisa ser reapertado após o primeiro carregamento.'},\n  'Laço sem sapatilha / nó':         {ef:0.50,ok:false,\n    txt:'Corta metade da capacidade e concentra tensão no raio de dobra. Não admitido em elemento estrutural.'}\n};\n\n/* ISO 9223 — taxas de corrosão de primeiro ano (µm/ano) */\nconst CATEGORIAS = {\n  'C1 — muito baixa (interior seco, climatizado)': {aco:0.9, zn:0.08},\n  'C2 — baixa (rural, interior sem climatização)': {aco:15,  zn:0.5},\n  'C3 — média (urbana, litoral distante)':         {aco:38,  zn:1.5},\n  'C4 — alta (industrial, litoral)':               {aco:65,  zn:3.2},\n  'C5 — muito alta (industrial úmida, marinha)':   {aco:140, zn:6.3},\n  'CX — extrema (zona de respingo, offshore)':     {aco:350, zn:15.0}\n};\n\n/* Revestimentos: massa de zinco (g/m²) e fator de redução da taxa do aço após esgotamento */\nconst PROTECOES = [\n  {n:'Sem proteção',            zn:0,   fAco:1.00, inox:false},\n  {n:'Zincado leve 135 g/m²',   zn:135, fAco:1.00, inox:false},\n  {n:'Zincado pesado 230 g/m²', zn:230, fAco:1.00, inox:false},\n  {n:'Zincado + graxa 300 g/m²',zn:300, fAco:0.55, inox:false},\n  {n:'Zincado + bainha PEAD',   zn:230, fAco:0.10, inox:false},\n  {n:'Inoxidável AISI 316',     zn:0,   fAco:0.03, inox:true}\n];\n\nconst RHO_ZN = 7.14;     // g/cm³\nconst B_ACO = 0.65, B_ZN = 0.85;   // expoentes de longo prazo (ISO 9224)\nconst G_AC = 9.80665;\n\n/* ---------------- funções de cálculo ---------------- */\n\nfunction propriedades(tipo, d, Rr){\n  const c = CABOS[tipo];\n  return { Fmin:c.K*d*d*Rr/1000, Am:c.C*d*d, massa:c.C*d*d*0.00785,\n           Ef:c.Ef, alEst:c.alEst, dFio:c.rFio*d, K:c.K, C:c.C };\n}\n\n/* Estado parabólico com corda inclinada. L,h em m · w em N/m · H em N */\nfunction estado(L, h, w, H){\n  const Cc = h/L - w*L/(2*H);\n  const Va = H*Cc, Vb = w*L + H*Cc;\n  const Ta = Math.hypot(H,Va), Tb = Math.hypot(H,Vb);\n  const fV = w*L*L/(8*H), Lc = Math.hypot(L,h), fP = fV*L/Lc;\n  return { H, Va, Vb, Ta, Tb, Tmax:Math.max(Ta,Tb), fV, fP, Lc,\n           S: Lc + (8/3)*fP*fP/Lc, razao: L/Math.max(fV,1e-9) };\n}\n\n/* Mudança de estado: H₂³ + A·H₂² − EA·w₂²·L²/24 = 0 */\nfunction mudancaEstado(EA, alfa, L, H1, w1, w2, dT){\n  const A = EA*alfa*dT + (EA*w1*w1*L*L)/(24*H1*H1) - H1;\n  const B = EA*w2*w2*L*L/24;\n  let H = Math.max(H1,10);\n  for(let i=0;i<300;i++){\n    const f = H*H*H + A*H*H - B, df = 3*H*H + 2*A*H;\n    if(Math.abs(df) < 1e-9) break;\n    let st = f/df;\n    if(Math.abs(st) > H*0.5) st = Math.sign(st)*H*0.5;\n    H -= st; if(H < 1) H = 1;\n    if(Math.abs(st) < 1e-7) break;\n  }\n  return H;\n}\n\n/* Corrosão: profundidade acumulada pelo modelo potencial da ISO 9224 */\nconst profZn  = (r,t) => r*Math.pow(Math.max(t,0), B_ZN);\nconst profAco = (r,t) => r*Math.pow(Math.max(t,0), B_ACO);\n\n/* Tempo até consumir o zinco, resolvido por inversão direta */\nfunction vidaZinco(espZn, rZn){ return rZn <= 0 ? 0 : Math.pow(espZn/rZn, 1/B_ZN); }\n\n/* Perda percentual da seção do fio externo após t anos */\nfunction perdaSecao(t, espZn, rZn, rAco, fAco){\n  const tZn = vidaZinco(espZn, rZn);\n  if(t <= tZn) return {perda:0, tZn, dr:0};\n  const dr = profAco(rAco*fAco, t - tZn)/1000;      // mm de raio perdido\n  return {dr, tZn, perdaRaio:dr};\n}\n\n/* Fadiga: curva S-N de inclinação m = 4 ancorada em Δσc a 2×10⁶ ciclos */\nfunction vidaFadiga(dSigma, dSc){\n  if(dSigma <= 0.1) return Infinity;\n  return 2e6*Math.pow(dSc/dSigma, 4);\n}\n\n/* Número mínimo de grampos e comprimento de retorno */\nfunction grampos(d){\n  const n = d<=13?3 : d<=19?4 : d<=26?5 : d<=32?6 : d<=38?7 : 8;\n  return { n, esp:6*d, retorno:Math.round((n+1)*6*d) };\n}\n<\u002Fscript>\n<script>\nconst $ = id => document.getElementById(id);\nconst nf = (v,d=1) => (isFinite(v)?v:0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});\nconst nfi = v => Math.round(isFinite(v)?v:0).toLocaleString('pt-BR');\nfunction toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2500);}\nfunction fill(id,obj,def){const e=$(id);e.innerHTML='';Object.keys(obj).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;if(k===def)o.selected=true;e.appendChild(o);});}\n\nfill('tipo',CABOS,'1×19 espiral');\nfill('term',TERMINACOES,'Soquete cônico com resina epóxi');\nfill('cat',CATEGORIAS,'C3 — média (urbana, litoral distante)');\n$('prot').innerHTML = PROTECOES.map((p,i)=>`<option value=\"${i}\"${i===2?' selected':''}>${p.n}<\u002Foption>`).join('');\n$('data').valueAsDate = new Date();\n\ndocument.querySelectorAll('.card-h').forEach(h=>h.addEventListener('click',()=>h.parentElement.classList.toggle('collapsed')));\ndocument.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{\n  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));\n  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));\n  t.classList.add('on'); $(t.dataset.pane).classList.add('on');\n  if(t.dataset.pane==='pb'||t.dataset.pane==='pc') redesenhar();\n}));\n\n/* ---------------- sincronização de campos ---------------- */\nlet tabManual = false;\n\nfunction aplicarTipo(){\n  const c = CABOS[$('tipo').value];\n  $('tipoHint').textContent = c.txt;\n  $('Ef').value = c.Ef;\n  $('alEst').value = $('preEst').checked ? 0.02 : c.alEst;\n  if(!tabManual) atualizarProps();\n}\nfunction atualizarProps(){\n  const d=+$('diam').value, Rr=+$('Rr').value;\n  const p = propriedades($('tipo').value, d, Rr);\n  $('Fmin').value = p.Fmin.toFixed(1);\n  if(!tabManual){ $('AmMan').value = p.Am.toFixed(1); $('dFio').value = p.dFio.toFixed(2); }\n  $('Am').value = (+$('AmMan').value).toFixed(1);\n  $('massa').value = ((+$('AmMan').value)*0.00785).toFixed(3);\n}\n['diam','Rr'].forEach(i=>$(i).addEventListener('input',atualizarProps));\n$('tipo').addEventListener('change',aplicarTipo);\n$('preEst').addEventListener('change',aplicarTipo);\n$('AmMan').addEventListener('input',()=>{tabManual=true;atualizarProps();});\n$('dFio').addEventListener('input',()=>{tabManual=true;});\n$('resetTab').addEventListener('click',()=>{tabManual=false;aplicarTipo();toast('Valores da tabela restaurados');});\n$('term').addEventListener('change',()=>{$('termHint').textContent=TERMINACOES[$('term').value].txt;});\n$('cat').addEventListener('change',()=>{const c=CATEGORIAS[$('cat').value];\n  $('catHint').textContent=`Aço sem proteção: ${nf(c.aco,1)} µm no primeiro ano · zinco: ${nf(c.zn,2)} µm/ano`;});\n$('modo').addEventListener('change',()=>{\n  const f = $('modo').value==='flecha';\n  $('blocoReto').style.display = f ? 'none' : '';\n  $('cardGeo').style.display = f ? '' : 'none';\n  $('scrubWrap').style.display = f ? '' : 'none';\n});\n$('natBdi').addEventListener('change',()=>{\n  $('bdi').value = $('natBdi').value==='mat' ? '14.02' : '22.12';\n  toast('Faixa de referência do Acórdão 2.622/2013 — confirme o valor vigente');\n});\n$('vao').addEventListener('input',()=>{ $('compr').value = $('vao').value; });\n\n/* ---------------- coleta ---------------- */\nfunction coletar(){\n  const d=+$('diam').value, Rr=+$('Rr').value;\n  const p = propriedades($('tipo').value, d, Rr);\n  const Am = +$('AmMan').value || p.Am;\n  const c = CABOS[$('tipo').value];\n  return {\n    obra:$('obra').value, elem:$('elem').value, data:$('data').value, resp:$('resp').value,\n    tipo:$('tipo').value, d, Rr, nCabos:+$('nCabos').value, preEst:$('preEst').checked,\n    Fmin:p.Fmin, Am, massa:Am*0.00785, Ef:+$('Ef').value, alEst:+$('alEst').value,\n    dFio:+$('dFio').value||p.dFio, K:p.K, ns:c.ns, nw:c.nw, af:c.af,\n    modo:$('modo').value, Fperm:+$('Fperm').value, FmaxAp:+$('Fmax').value, gamma:+$('gamma').value,\n    vao:+$('vao').value, desn:+$('desn').value, defPor:$('defPor').value,\n    H0:+$('H0').value, fAlvo:+$('fAlvo').value,\n    tMont:+$('tMont').value, tMin:+$('tMin').value, tMax:+$('tMax').value, qAd:+$('qAd').value,\n    term:$('term').value, ef:TERMINACOES[$('term').value].ef, compr:+$('compr').value,\n    cat:$('cat').value, prot:+$('prot').value, vidaAlvo:+$('vidaAlvo').value, perdaAdm:+$('perdaAdm').value,\n    verFad:$('verFad').checked, nCiclos:+$('nCiclos').value, dsc:+$('dsc').value,\n    pCabo:+$('pCabo').value, pTerm:+$('pTerm').value, pMo:+$('pMo').value,\n    natBdi:$('natBdi').value, bdi:+$('bdi').value, perdas:+$('perdas').value,\n    alfa:(+$('alfa').value)*1e-6\n  };\n}\n\n/* ---------------- núcleo do cálculo ---------------- */\nlet R = null;\n\nfunction calcular(){\n  const p = coletar();\n  const EA = p.Ef*p.Am*1000;                   // N\n  const w0 = p.massa*G_AC;                     // N/m — peso próprio\n  const w1 = w0 + p.qAd;                       // com sobrecarga\n  const gam = p.gamma > 0 ? p.gamma : 3.0;      // guarda contra γ inválido\n  const Frd = p.Fmin*p.ef/gam;                 // kN admissível\n\n  let est = null, curvaT = [], estMont=null, estFrio=null, estQuente=null, Fperm, Fmax;\n\n  if(p.modo === 'flecha'){\n    const H0 = (p.defPor === 'f') ? w1*p.vao*p.vao/(8*p.fAlvo) : p.H0*1000;\n    estMont = estado(p.vao, p.desn, w1, H0);\n    const Hf = mudancaEstado(EA, p.alfa, p.vao, H0, w1, w1, p.tMin - p.tMont);\n    const Hq = mudancaEstado(EA, p.alfa, p.vao, H0, w1, w1, p.tMax - p.tMont);\n    estFrio = estado(p.vao, p.desn, w1, Hf);\n    estQuente = estado(p.vao, p.desn, w1, Hq);\n    for(let i=0;i<=80;i++){\n      const t = p.tMin + (p.tMax-p.tMin)*i/80;\n      const H = mudancaEstado(EA, p.alfa, p.vao, H0, w1, w1, t - p.tMont);\n      const e = estado(p.vao, p.desn, w1, H);\n      curvaT.push({t, H:H/1000, f:e.fV, Tmax:e.Tmax/1000});\n    }\n    est = estFrio.Tmax > estQuente.Tmax ? estFrio : estQuente;\n    Fmax = est.Tmax/1000;\n    Fperm = estMont.Tmax/1000;\n  } else {\n    Fperm = p.Fperm; Fmax = p.FmaxAp;\n  }\n\n  // resistência\n  const gReal = p.Fmin*p.ef/Math.max(Fmax,1e-6);\n  p.gamma = gam;\n  const util = Fmax/Frd;\n\n  // alongamento\n  const sigma = Fmax*1000/p.Am;                       // MPa\n  const alElast = (Fperm*1000/(p.Ef*1000*p.Am))*p.compr*1000;   // mm\n  const alConstr = p.compr*p.alEst*10;                          // mm\n  const alTerm = p.alfa*(p.tMax-p.tMont)*p.compr*1000;          // mm\n\n  // fadiga\n  const dSigma = (Fmax-Fperm)*1000/p.Am;\n  const Nadm = vidaFadiga(dSigma, p.dsc);\n  const fadOk = !p.verFad || Nadm >= p.nCiclos;\n\n  // corrosão\n  const cat = CATEGORIAS[p.cat], pr = PROTECOES[p.prot];\n  const espZn = pr.zn/RHO_ZN;                          // µm\n  const tZn = pr.inox ? 999 : vidaZinco(espZn, cat.zn);\n  const rAcoEf = cat.aco*pr.fAco;\n  const rFio = p.dFio/2;\n  const perdaAlvo = 1 - Math.sqrt(1 - p.perdaAdm/100);          // fração do raio\n  const drAdm = rFio*perdaAlvo*1000;                            // µm\n  const tAco = rAcoEf > 0 ? Math.pow(drAdm/rAcoEf, 1/B_ACO) : 999;\n  const vida = Math.min(999, tZn + tAco);\n\n  const curvaC = [];\n  const tFim = Math.max(p.vidaAlvo*1.4, vida*1.15, 20);\n  for(let i=0;i<=90;i++){\n    const t = tFim*i/90;\n    const dr = t <= tZn ? 0 : profAco(rAcoEf, t-tZn)/1000;      // mm\n    const rr = Math.max(0, rFio - dr);\n    const perda = 1 - (rr*rr)/(rFio*rFio);\n    curvaC.push({t, perda:perda*100, res:p.Fmin*p.ef*(1-perda)});\n  }\n\n  R = {p, EA, w0, w1, Frd, est, estMont, estFrio, estQuente, curvaT,\n       Fperm, Fmax, gReal, util, sigma, alElast, alConstr, alTerm,\n       dSigma, Nadm, fadOk, espZn, tZn, tAco, vida, curvaC, cat, pr, rAcoEf, rFio};\n\n  render(); redesenhar();\n  if(p.modo==='flecha') $('scrubT').value=50;\n  desenharPrincipal();\n  toast('Cálculo concluído');\n}\n\n/* ---------------- desenho: seção do cabo ---------------- */\nfunction desenharSecao(ctx, cx, cy, R0, p){\n  const aco='#8fa4b4', acoD='#5b7181', acoL='#c3d0d9', fibra='#c9ab7a';\n  function fio(x,y,r,cor){\n    const g = ctx.createRadialGradient(x-r*0.35,y-r*0.35,r*0.1,x,y,r);\n    g.addColorStop(0,acoL); g.addColorStop(1,cor);\n    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=g; ctx.fill();\n    ctx.strokeStyle=acoD; ctx.lineWidth=Math.max(0.4,r*0.14); ctx.stroke();\n  }\n  function perna(x,y,rs,nw){\n    ctx.beginPath(); ctx.arc(x,y,rs,0,7);\n    ctx.fillStyle='#eef2f5'; ctx.fill();\n    ctx.strokeStyle='#aebcc7'; ctx.lineWidth=0.8; ctx.stroke();\n    let cam;\n    if(nw<=7) cam=[1,6]; else if(nw<=19) cam=[1,6,12]; else if(nw<=26) cam=[1,6,9,10]; else cam=[1,6,12,17];\n    const rw = rs/(2*cam.length-1);\n    cam.forEach((n,li)=>{\n      const rr = li*2*rw;\n      if(n===1){ fio(x,y,rw,aco); return; }\n      for(let i=0;i<n;i++){\n        const a = (i/n)*2*Math.PI + li*0.4;\n        fio(x+rr*Math.cos(a), y+rr*Math.sin(a), rw, aco);\n      }\n    });\n  }\n  function nucleoFibra(x,y,r){\n    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=fibra; ctx.fill();\n    ctx.strokeStyle='#a68a5c'; ctx.lineWidth=0.9; ctx.stroke();\n  }\n  if(p.nw === 0){                              // locked coil: coroa de fios em Z\n    const nInt = p.tipo.indexOf('Half')>=0 ? 15 : 19;\n    perna(cx,cy,R0*0.72,nInt);\n    const nz = 34, ri = R0*0.72, ro = R0;\n    for(let i=0;i<nz;i++){\n      const a0=(i/nz)*2*Math.PI, a1=((i+0.9)/nz)*2*Math.PI;\n      ctx.beginPath(); ctx.arc(cx,cy,ro,a0,a1); ctx.arc(cx,cy,ri,a1,a0,true); ctx.closePath();\n      const g=ctx.createLinearGradient(cx+ri*Math.cos(a0),cy+ri*Math.sin(a0),cx+ro*Math.cos(a0),cy+ro*Math.sin(a0));\n      g.addColorStop(0,acoL); g.addColorStop(1,aco);\n      ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle=acoD; ctx.lineWidth=0.8; ctx.stroke();\n    }\n  } else if(p.ns === 1){                        // cordoalha de perna única\n    perna(cx,cy,R0,p.nw);\n  } else if(p.ns <= 8){                         // 6 ou 8 pernas em uma coroa\n    const rs = p.ns<=6 ? R0/3 : R0/3.4;\n    const ror = R0 - rs;\n    (p.af ? nucleoFibra(cx,cy,rs*0.92) : perna(cx,cy,rs,p.nw));\n    for(let i=0;i<p.ns;i++){\n      const a=(i/p.ns)*2*Math.PI - Math.PI/2;\n      perna(cx+ror*Math.cos(a), cy+ror*Math.sin(a), rs, p.nw);\n    }\n  } else {                                      // antigiratório: coroas concêntricas de pernas\n    const camadas = p.ns>=35 ? [1,7,13,14] : p.ns>=19 ? [1,6,12] : [6,12];\n    const central = camadas[0]===1;\n    const nAneis = central ? camadas.length-1 : camadas.length;   // coroas fora do centro\n    const rs = R0/(2*nAneis+1);                                   // pernas encostam no contorno\n    camadas.forEach((n,li)=>{\n      if(n===1 && li===0){ perna(cx,cy,rs,p.nw); return; }\n      const ordem = central ? li : li+1;             // 1ª coroa a 2·rs, última encosta em R0-rs\n      const rr = (R0 - rs) * ordem / nAneis;\n      for(let i=0;i<n;i++){\n        const a=(i/n)*2*Math.PI + li*0.55;\n        perna(cx+rr*Math.cos(a), cy+rr*Math.sin(a), rs*0.96, p.nw);\n      }\n    });\n  }\n  ctx.beginPath(); ctx.arc(cx,cy,R0,0,7);\n  ctx.strokeStyle='#5b7181'; ctx.lineWidth=1.4; ctx.stroke();\n}\n\n/* ---------------- desenho principal ---------------- */\nfunction desenharPrincipal(){\n  if(!R) return;\n  const cv=$('cvMain'), ctx=cv.getContext('2d');\n  const dpr=Math.min(2,window.devicePixelRatio||1), W=1000, H=330;\n  cv.width=W*dpr; cv.height=H*dpr; cv.style.height='auto'; ctx.setTransform(dpr,0,0,dpr,0,0);\n  ctx.clearRect(0,0,W,H);\n  const p=R.p;\n\n  // --- seção transversal ---\n  const cx=138, cy=160, R0=96;\n  desenharSecao(ctx,cx,cy,R0,p);\n  ctx.font='700 10px ui-monospace,monospace'; ctx.fillStyle='#4a5c6b'; ctx.textAlign='center';\n  ctx.fillText('SEÇÃO — '+p.tipo.toUpperCase(), cx, 42);\n  ctx.font='10px ui-monospace,monospace'; ctx.fillStyle='#7a8b99';\n  ctx.fillText(`Ø ${nf(p.d,1)} mm · ${nfi(p.Am)} mm² · ${nf(p.massa,3)} kg/m`, cx, 288);\n  ctx.fillText(`fio externo Ø ${nf(p.dFio,2)} mm`, cx, 302);\n  // cota do diâmetro\n  ctx.strokeStyle='#7a8b99'; ctx.lineWidth=1; ctx.setLineDash([3,3]);\n  ctx.beginPath(); ctx.moveTo(cx-R0,cy+R0+12); ctx.lineTo(cx+R0,cy+R0+12); ctx.stroke(); ctx.setLineDash([]);\n  ctx.beginPath(); ctx.moveTo(cx-R0,cy+R0+8); ctx.lineTo(cx-R0,cy+R0+16);\n  ctx.moveTo(cx+R0,cy+R0+8); ctx.lineTo(cx+R0,cy+R0+16); ctx.stroke();\n\n  // --- elevação ---\n  const x0=320, x1=968, yTop=52, yBot=250;\n  ctx.strokeStyle='#dfe5ea'; ctx.lineWidth=1;\n  ctx.beginPath(); ctx.moveTo(x0-10,yTop-16); ctx.lineTo(x1+8,yTop-16); ctx.stroke();\n  ctx.font='700 10px ui-monospace,monospace'; ctx.fillStyle='#4a5c6b'; ctx.textAlign='left';\n\n  if(p.modo !== 'flecha'){\n    // tirante reto\n    const yc=(yTop+yBot)/2;\n    ctx.fillText('ELEVAÇÃO — TIRANTE RETO', x0, 42);\n    ctx.fillStyle='#4a5c6b';\n    ctx.beginPath(); ctx.moveTo(x0+40,yc); ctx.lineTo(x1-40,yc);\n    ctx.strokeStyle='#5b7181'; ctx.lineWidth=5; ctx.stroke();\n    [[x0+40,-1],[x1-40,1]].forEach(([x,s])=>{\n      ctx.fillStyle='#8fa4b4'; ctx.fillRect(x+(s<0?-34:0),yc-26,34,52);\n      ctx.strokeStyle='#5b7181'; ctx.lineWidth=1.2; ctx.strokeRect(x+(s<0?-34:0),yc-26,34,52);\n      ctx.strokeStyle='#a9b7c2'; ctx.lineWidth=1;\n      for(let i=0;i<7;i++){const yy=yc-24+i*8;ctx.beginPath();\n        ctx.moveTo(x+(s<0?-34:34),yy);ctx.lineTo(x+(s<0?-44:44),yy+9);ctx.stroke();}\n    });\n    // seta de tração\n    ctx.strokeStyle='#1f5f7a'; ctx.lineWidth=2; ctx.fillStyle='#1f5f7a';\n    [[x0+120,-1],[x1-120,1]].forEach(([x,s])=>{\n      ctx.beginPath(); ctx.moveTo(x,yc-40); ctx.lineTo(x+s*54,yc-40); ctx.stroke();\n      ctx.beginPath(); ctx.moveTo(x+s*54,yc-40); ctx.lineTo(x+s*44,yc-45); ctx.lineTo(x+s*44,yc-35); ctx.fill();\n    });\n    ctx.font='700 12px ui-monospace,monospace'; ctx.textAlign='center';\n    ctx.fillText(nf(R.Fmax,1)+' kN', (x0+x1)/2, yc-44);\n    ctx.font='10px ui-monospace,monospace'; ctx.fillStyle='#7a8b99';\n    ctx.fillText(`${p.term} · rendimento ${nf(p.ef*100,0)}%`, (x0+x1)/2, yc+50);\n    ctx.fillText(`comprimento ${nf(p.compr,1)} m · ${p.nCabos} cabo(s) em paralelo`, (x0+x1)/2, yc+66);\n    return;\n  }\n\n  // cabo com flecha, no estado do cursor\n  const i = Math.round((+$('scrubT').value)/100*(R.curvaT.length-1));\n  const cur = R.curvaT[i];\n  const e = estado(p.vao, p.desn, R.w1, cur.H*1000);\n  ctx.fillText('ELEVAÇÃO — VÃO '+nf(p.vao,1)+' m', x0, 42);\n\n  const fRef = Math.max(...R.curvaT.map(c=>c.f));\n  const escX = (x1-x0-90)/p.vao;\n  const alturaUtil = yBot - yTop - 30;\n  const escY = alturaUtil/Math.max(Math.abs(p.desn)+fRef*1.35, 0.4);\n  const ax = x0+45, bx = ax + p.vao*escX;\n  const ay = yTop+22 + (p.desn>0? 0 : Math.abs(p.desn)*escY);\n  const by = ay - p.desn*escY;\n\n  // blocos de ancoragem\n  [[ax,ay],[bx,by]].forEach(([x,y])=>{\n    ctx.fillStyle='#8fa4b4'; ctx.fillRect(x-11,y-13,22,26);\n    ctx.strokeStyle='#5b7181'; ctx.lineWidth=1.2; ctx.strokeRect(x-11,y-13,22,26);\n  });\n  // corda\n  ctx.strokeStyle='#c3d0d9'; ctx.lineWidth=1; ctx.setLineDash([4,4]);\n  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); ctx.setLineDash([]);\n  // parábola\n  ctx.beginPath();\n  for(let k=0;k<=120;k++){\n    const xx = p.vao*k/120;\n    const sag = (R.w1/(2*cur.H*1000))*(p.vao*xx - xx*xx);\n    const X = ax + xx*escX, Y = ay - (p.desn*xx/p.vao)*escY + sag*escY;\n    k? ctx.lineTo(X,Y) : ctx.moveTo(X,Y);\n  }\n  ctx.strokeStyle='#1f5f7a'; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.stroke();\n\n  // cota da flecha\n  const xm = ax + p.vao/2*escX;\n  const ymCorda = ay - (p.desn/2)*escY, ymCabo = ymCorda + e.fV*escY;\n  ctx.strokeStyle='#a8551c'; ctx.lineWidth=1.2; ctx.setLineDash([3,3]);\n  ctx.beginPath(); ctx.moveTo(xm,ymCorda); ctx.lineTo(xm,ymCabo); ctx.stroke(); ctx.setLineDash([]);\n  ctx.fillStyle='#a8551c'; ctx.font='700 11px ui-monospace,monospace'; ctx.textAlign='left';\n  ctx.fillText('f = '+nf(e.fV,3)+' m', xm+7, (ymCorda+ymCabo)/2+4);\n\n  // reações\n  ctx.font='10px ui-monospace,monospace'; ctx.fillStyle='#1f5f7a'; ctx.textAlign='center';\n  ctx.fillText('T = '+nf(e.Ta/1000,1)+' kN', ax, ay-22);\n  ctx.fillText('T = '+nf(e.Tb/1000,1)+' kN', bx, by-22);\n  ctx.fillStyle='#7a8b99'; ctx.textAlign='left';\n  ctx.fillText(`H = ${nf(cur.H,1)} kN · L/f = ${nf(e.razao,0)} · comprimento do arco ${nf(e.S,3)} m`, x0, yBot+26);\n  ctx.fillText(`${p.tipo} Ø${nf(p.d,1)} mm · ${p.term} · ${nf(cur.t,0)} °C`, x0, yBot+42);\n\n  $('rdT').textContent=nf(cur.t,0); $('rdH').textContent=nf(cur.H,1);\n  $('rdF').textContent=nf(cur.f,3); $('rdTm').textContent=nf(cur.Tmax,1);\n}\n$('scrubT').addEventListener('input',desenharPrincipal);\n<\u002Fscript>\n<script>\n/* ---------------- gráfico genérico ---------------- */\nfunction plot(cv, series, opt){\n  const ctx=cv.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1);\n  if(!cv.dataset.w){cv.dataset.w=cv.getAttribute('width');cv.dataset.h=cv.getAttribute('height');}\n  const W=+cv.dataset.w, H=+cv.dataset.h;\n  cv.width=W*dpr; cv.height=H*dpr; cv.style.height='auto'; ctx.setTransform(dpr,0,0,dpr,0,0);\n  ctx.clearRect(0,0,W,H);\n  const m={l:62,r:62,t:16,b:36}, x0=m.l,x1=W-m.r,y0=m.t,y1=H-m.b;\n  const xs=series.flatMap(s=>s.pts.map(p=>p.x));\n  const xmin=opt.xmin??Math.min(...xs), xmax=opt.xmax??Math.max(...xs);\n  const eixos=[0,1];\n  const lim=eixos.map(ax=>{\n    const v=series.filter(s=>(s.ax||0)===ax).flatMap(s=>s.pts.map(p=>p.y)).filter(isFinite);\n    if(!v.length) return null;\n    let a=Math.min(...v), b=Math.max(...v); const pad=(b-a)*0.1||Math.abs(b)*0.1||1;\n    a-=pad; b+=pad; if(opt.zero) a=Math.min(0,a);\n    return [a,b];\n  });\n  const X=v=>x0+(v-xmin)/Math.max(1e-9,xmax-xmin)*(x1-x0);\n  const Y=(v,ax)=>{const L=lim[ax||0];return L?y1-(v-L[0])/Math.max(1e-9,L[1]-L[0])*(y1-y0):y1;};\n\n  ctx.font='10px ui-monospace,monospace';\n  for(let i=0;i<=5;i++){\n    const y=y0+(y1-y0)*i/5;\n    ctx.strokeStyle='#e6ebf0'; ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();\n    eixos.forEach(ax=>{\n      const L=lim[ax]; if(!L)return;\n      const v=L[1]-(L[1]-L[0])*i/5;\n      ctx.fillStyle=ax?'#a8551c':'#7a8b99'; ctx.textAlign=ax?'left':'right';\n      ctx.fillText(nf(v, Math.abs(v)<10?2:0), ax?x1+7:x0-7, y+3);\n    });\n  }\n  ctx.textAlign='center'; ctx.fillStyle='#7a8b99';\n  for(let i=0;i<=6;i++){\n    const v=xmin+(xmax-xmin)*i/6, x=X(v);\n    ctx.strokeStyle='#f0f3f6'; ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();\n    ctx.fillStyle='#7a8b99'; ctx.fillText(nf(v, (xmax-xmin)<12?1:0), x, y1+15);\n  }\n  ctx.fillText(opt.xl, (x0+x1)/2, H-3);\n  ctx.save(); ctx.translate(14,(y0+y1)/2); ctx.rotate(-Math.PI/2); ctx.fillStyle='#7a8b99';\n  ctx.fillText(opt.yl,0,0); ctx.restore();\n  if(opt.yl2){ctx.save();ctx.translate(W-12,(y0+y1)/2);ctx.rotate(Math.PI/2);ctx.fillStyle='#a8551c';\n    ctx.fillText(opt.yl2,0,0);ctx.restore();}\n\n  (opt.hlines||[]).forEach(h=>{\n    const L=lim[h.ax||0]; if(!L||h.v<L[0]||h.v>L[1])return;\n    const y=Y(h.v,h.ax||0);\n    ctx.strokeStyle=h.c; ctx.lineWidth=1.3; ctx.setLineDash([6,4]);\n    ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke(); ctx.setLineDash([]);\n    ctx.fillStyle=h.c; ctx.textAlign='left'; ctx.font='700 10px ui-monospace,monospace'; ctx.fillText(h.t,x0+6,y-5);\n  });\n  (opt.vlines||[]).forEach(h=>{\n    if(h.v<xmin||h.v>xmax)return; const x=X(h.v);\n    ctx.strokeStyle=h.c; ctx.lineWidth=1.3; ctx.setLineDash([5,4]);\n    ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke(); ctx.setLineDash([]);\n    ctx.save(); ctx.translate(x-5,y0+6); ctx.rotate(Math.PI/2); ctx.fillStyle=h.c;\n    ctx.textAlign='left'; ctx.font='700 10px ui-monospace,monospace'; ctx.fillText(h.t,0,0); ctx.restore();\n  });\n  series.forEach(s=>{\n    ctx.beginPath();\n    s.pts.forEach((p,i)=>i?ctx.lineTo(X(p.x),Y(p.y,s.ax||0)):ctx.moveTo(X(p.x),Y(p.y,s.ax||0)));\n    ctx.strokeStyle=s.c; ctx.lineWidth=s.w||2.2; ctx.lineJoin='round';\n    if(s.dash)ctx.setLineDash(s.dash);\n    ctx.stroke(); ctx.setLineDash([]);\n  });\n}\n\nfunction redesenhar(){\n  if(!R) return;\n  const p=R.p;\n  if(p.modo==='flecha' && R.curvaT.length){\n    plot($('cvTemp'),[\n      {pts:R.curvaT.map(c=>({x:c.t,y:c.H})), c:'#1f5f7a', ax:0},\n      {pts:R.curvaT.map(c=>({x:c.t,y:c.f})), c:'#a8551c', ax:1}\n    ],{xl:'temperatura (°C)', yl:'tração horizontal H (kN)', yl2:'flecha (m)',\n       vlines:[{v:p.tMont,c:'#7a8b99',t:'montagem'}]});\n\n    const pts=[], H0=(p.defPor==='f')? R.w1*p.vao*p.vao/(8*p.fAlvo) : p.H0*1000;\n    const hmax=Math.max(H0*2.2, 5000);\n    for(let i=1;i<=70;i++){\n      const H=hmax*i/70;\n      const Hf=mudancaEstado(R.EA,p.alfa,p.vao,H,R.w1,R.w1,p.tMin-p.tMont);\n      pts.push({x:H/1000, y:estado(p.vao,p.desn,R.w1,Hf).Tmax/1000});\n    }\n    plot($('cvProt'),[{pts, c:'#1f5f7a'}],\n      {xl:'protensão de montagem H (kN)', yl:'tração máxima no cabo (kN)',\n       hlines:[{v:R.Frd,c:'#b8302a',t:`admissível ${nf(R.Frd,1)} kN`}],\n       vlines:[{v:H0/1000,c:'#a8551c',t:'adotado'}]});\n  }\n  plot($('cvCorr'),[\n    {pts:R.curvaC.map(c=>({x:c.t,y:c.res})), c:'#1f5f7a', ax:0},\n    {pts:R.curvaC.map(c=>({x:c.t,y:c.perda})), c:'#a8551c', ax:1}\n  ],{xl:'idade (anos)', yl:'resistência residual (kN)', yl2:'perda de seção (%)', zero:true,\n     hlines:[{v:R.Fmax*R.p.gamma, c:'#b8302a', t:`resistência mínima exigida ${nf(R.Fmax*R.p.gamma,0)} kN`}],\n     vlines:[{v:R.p.vidaAlvo, c:'#7a8b99', t:'vida de projeto'},\n             {v:Math.min(R.tZn,900), c:'#a8551c', t:'zinco esgotado'}]});\n}\nwindow.addEventListener('resize',()=>{redesenhar();desenharPrincipal();});\n\n/* ---------------- painéis ---------------- */\nconst cls = r => r<0.85?'ok' : r<1.0?'warn':'bad';\nconst stTag = (ok,warn) => warn?'<span class=\"st warn\">ATENÇÃO<\u002Fspan>' : ok?'<span class=\"st ok\">OK<\u002Fspan>':'<span class=\"st bad\">NÃO ATENDE<\u002Fspan>';\n\nfunction render(){\n  const p=R.p;\n  const corrOk = R.vida >= p.vidaAlvo;\n  const resOk = R.util <= 1.0;\n  const pior = Math.max(R.util, p.verFad? p.nCiclos/Math.max(R.Nadm,1):0, p.vidaAlvo/Math.max(R.vida,0.01));\n  const c = cls(
