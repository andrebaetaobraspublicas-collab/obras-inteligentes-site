pior);\n  const tag={ok:'var(--ok)',warn:'var(--warn)',bad:'var(--bad)'}[c];\n\n  let tit,sub;\n  if(!TERMINACOES[p.term].ok){ tit='Terminação não admitida em elemento estrutural';\n    sub='Independentemente das demais verificações, a terminação escolhida não pode ser usada. Substitua antes de seguir.'; }\n  else if(c==='bad'){ tit='O cabo não atende a alguma verificação';\n    sub='Veja o quadro abaixo: pelo menos um dos critérios foi reprovado. Aumente o diâmetro, mude a construção ou reveja a proteção.'; }\n  else if(c==='warn'){ tit='Atende, mas com margem estreita';\n    sub='Nenhuma verificação reprovou, porém a folga é pequena. Um degrau de diâmetro costuma resolver com pouco impacto de custo.'; }\n  else { tit='Cabo adequado para a aplicação';\n    sub='As verificações de resistência, durabilidade e fadiga passam com folga nas condições informadas.'; }\n\n  let h='';\n  if(!TERMINACOES[p.term].ok)\n    h+=`<div class=\"warnbar\"><b>${p.term}.<\u002Fb> ${TERMINACOES[p.term].txt}<\u002Fdiv>`;\n  if(p.modo==='flecha' && R.est && R.est.razao < 8)\n    h+=`<div class=\"warnbar\">Relação vão/flecha de ${nf(R.est.razao,0)}. Abaixo de 8 a hipótese parabólica perde precisão: use formulação de catenária ou análise não linear.<\u002Fdiv>`;\n  if(p.d < 6) h+=`<div class=\"warnbar\">Diâmetro abaixo de 6 mm. Verifique a exequibilidade da terminação e a suscetibilidade a dano acidental.<\u002Fdiv>`;\n\n  h+=`<div class=\"verdict\"><div class=\"verdict-h\">\n    <span class=\"lamp ${c}\"><\u002Fspan>\n    <div><div class=\"verdict-t\">${tit}<\u002Fdiv><div class=\"verdict-s\">${sub}<\u002Fdiv><\u002Fdiv>\n    <span class=\"verdict-tag\" style=\"color:${tag}\">utilização ${nf(R.util*100,0)}%<\u002Fspan><\u002Fdiv>\n    <div class=\"kpis\">\n      <div class=\"kpi\"><div class=\"k\">Ruptura mínima<\u002Fdiv><div class=\"v c-aco\">${nf(R.p.Fmin,0)}<small>kN<\u002Fsmall><\u002Fdiv><div class=\"n\">K = ${nf(p.K,3)} · ISO 2408<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi\"><div class=\"k\">Com terminação<\u002Fdiv><div class=\"v\">${nf(R.p.Fmin*p.ef,0)}<small>kN<\u002Fsmall><\u002Fdiv><div class=\"n\">rendimento ${nf(p.ef*100,0)}%<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi\"><div class=\"k\">Admissível γ=${nf(p.gamma,1)}<\u002Fdiv><div class=\"v\">${nf(R.Frd,0)}<small>kN<\u002Fsmall><\u002Fdiv><div class=\"n\">solicitação ${nf(R.Fmax,1)} kN<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi\"><div class=\"k\">Segurança real<\u002Fdiv><div class=\"v c-${cls(1/Math.max(R.gReal/p.gamma,1e-6))}\">${nf(R.gReal,2)}<\u002Fdiv><div class=\"n\">exigida ${nf(p.gamma,1)}<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi\"><div class=\"k\">Vida por corrosão<\u002Fdiv><div class=\"v c-${corrOk?'ok':'bad'}\">${R.vida>=900?'>100':nf(R.vida,0)}<small>anos<\u002Fsmall><\u002Fdiv><div class=\"n\">projeto ${nf(p.vidaAlvo,0)} anos<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi\"><div class=\"k\">Tensão de serviço<\u002Fdiv><div class=\"v\">${nfi(R.sigma)}<small>MPa<\u002Fsmall><\u002Fdiv><div class=\"n\">${nf(R.sigma/p.Rr*100,0)}% de R<sub>r<\u002Fsub><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>`;\n  $('verdictBox').innerHTML=h;\n\n  // quadro de verificações\n  const linhas=[\n    ['Resistência estática', `${nf(R.Fmax,1)} kN`, `${nf(R.Frd,1)} kN`, nf(R.util*100,0)+'%', stTag(resOk, resOk&&R.util>0.85)],\n    ['Rendimento da terminação', `${nf(p.ef*100,0)}%`, '≥ 80%', p.ef>=0.8?'—':'crítico', stTag(p.ef>=0.8,false)],\n    ['Vida útil por corrosão', `${R.vida>=900?'>100':nf(R.vida,0)} anos`, `${nf(p.vidaAlvo,0)} anos`, nf(p.vidaAlvo/Math.max(R.vida,.01)*100,0)+'%', stTag(corrOk, corrOk&&R.vida<p.vidaAlvo*1.3)],\n    ['Esgotamento do zinco', `${R.tZn>=900?'—':nf(R.tZn,0)+' anos'}`, 'informativo', R.pr.inox?'inoxidável':`${nf(R.espZn,1)} µm`, '<span class=\"st ok\">—<\u002Fspan>']\n  ];\n  if(p.verFad) linhas.push(['Fadiga (EN 1993-1-11)', `Δσ = ${nf(R.dSigma,1)} MPa`,\n    `${R.Nadm>1e12?'>10¹²':R.Nadm.toExponential(1)} ciclos`, nfi(p.nCiclos)+' previstos', stTag(R.fadOk, R.fadOk&&R.Nadm<p.nCiclos*3)]);\n  if(p.modo==='flecha') linhas.push(['Relação vão/flecha', nf(R.est.razao,0), '≥ 8 (validade da parábola)',\n    nf(R.est.fV,3)+' m', stTag(R.est.razao>=8,false)]);\n\n  $('verifBox').innerHTML=`<div class=\"panel\"><div class=\"panel-h\"><h3>Quadro de verificações<\u002Fh3>\n    <p>${p.elem||'Elemento'} — ${p.obra||'obra não identificada'} · ${p.tipo} Ø ${nf(p.d,1)} mm · ${p.nCabos} cabo(s)<\u002Fp><\u002Fdiv>\n    <table><thead><tr><th>Verificação<\u002Fth><th class=\"num\">Solicitação<\u002Fth><th class=\"num\">Limite<\u002Fth><th class=\"num\">Relação<\u002Fth><th>Situação<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>${linhas.map(l=>`<tr><td>${l[0]}<\u002Ftd><td class=\"num\">${l[1]}<\u002Ftd><td class=\"num\">${l[2]}<\u002Ftd><td class=\"num\">${l[3]}<\u002Ftd><td>${l[4]}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable><\u002Fdiv>`;\n\n  renderRec(); renderGeo(); renderDur(); renderTerm(); renderOrc(); renderMem();\n}\n\nfunction rec(n,pill,t,txt,src){return `<div class=\"rec ${n}\"><h4>${t}<span class=\"pill\">${pill}<\u002Fspan><\u002Fh4><p>${txt}<\u002Fp>${src?`<div class=\"src\">${src}<\u002Fdiv>`:''}<\u002Fdiv>`;}\n\nfunction renderRec(){\n  const p=R.p; let h='';\n  if(!TERMINACOES[p.term].ok)\n    h+=rec('crit','substituir','Trocar a terminação',\n      `Um laço sem sapatilha ou um nó reduz a capacidade à metade e concentra tensão no raio de dobra, onde a ruptura sempre começa. Para elemento permanente use soquete com resina; para montagem em campo, laço com sapatilha e prensa, com rendimento de 90%.`,\n      'EN 1993-1-11 · NBR 6327');\n  if(R.util>1)\n    h+=rec('crit','redimensionar','Capacidade insuficiente',\n      `A solicitação de ${nf(R.Fmax,1)} kN supera o admissível de ${nf(R.Frd,1)} kN. O diâmetro necessário é de aproximadamente <b>${nf(p.d*Math.sqrt(R.util),1)} mm<\u002Fb> mantendo construção e classe. Alternativas: subir a classe de ${p.Rr} para ${p.Rr<1960?p.Rr+190:p.Rr} MPa, trocar para construção espiral (K de ${nf(p.K,3)} para 0,550) ou dividir a carga em mais cabos.`,\n      'ISO 2408 · NBR 6327');\n  if(R.vida < p.vidaAlvo)\n    h+=rec('crit','durabilidade','Vida útil inferior à de projeto',\n      `A vida estimada é de ${nf(R.vida,0)} anos contra ${nf(p.vidaAlvo,0)} exigidos, em ambiente ${p.cat.split('—')[0].trim()}. O zinco se esgota em ${nf(R.tZn,0)} anos e a partir daí o fio externo, de apenas ${nf(p.dFio,2)} mm, perde seção rapidamente — é o fio fino, não o diâmetro do cabo, que governa. Caminhos: revestimento mais pesado, bainha de PEAD injetada com graxa, ou aço inoxidável em zona de respingo.`,\n      'ISO 9223 · ISO 9224 · EN 10264');\n  if(p.verFad && !R.fadOk)\n    h+=rec('crit','fadiga','Vida à fadiga insuficiente',\n      `A variação de tensão de ${nf(R.dSigma,1)} MPa admite ${R.Nadm.toExponential(1)} ciclos, abaixo dos ${nfi(p.nCiclos)} previstos. Como N varia com a quarta potência, reduzir Δσ em 20% multiplica a vida por 2,4. Aumentar a área metálica é o caminho direto. Verifique também a flexão junto às ancoragens: em cabo real a fadiga quase sempre começa na terminação, não no vão livre.`,\n      'EN 1993-1-11 item 6.4');\n  if(R.util<=1 && R.util>0.85)\n    h+=rec('att','margem','Margem de segurança estreita',\n      `Utilização de ${nf(R.util*100,0)}%. Um degrau de diâmetro leva a folga para ${nf(R.util/Math.pow((p.d+2)/p.d,2)*100,0)}% com acréscimo pequeno no custo do cabo, e nenhum na mão de obra.`);\n  if(p.modo==='flecha'){\n    const dH=R.estMont.H-R.estFrio.H;\n    h+=rec('info','térmico','Variação térmica da protensão',\n      `Entre ${nf(p.tMin,0)} °C e ${nf(p.tMax,0)} °C a tração horizontal varia de ${nf(R.estQuente.H/1000,1)} a ${nf(R.estFrio.H/1000,1)} kN — amplitude de ${nf(Math.abs(dH*2)/1000,1)} kN, ou ${nf(Math.abs(R.estFrio.H-R.estQuente.H)/R.estMont.H*100,0)}% da protensão de montagem. A flecha oscila entre ${nf(R.estFrio.fV,3)} e ${nf(R.estQuente.fV,3)} m. <b>Protenda na temperatura de projeto e registre a temperatura efetiva do cabo no momento do travamento<\u002Fb>, não a do ar: cabo exposto ao sol fica bem acima da ambiente e o erro se congela na estrutura.`,\n      'Equação de mudança de estado · EN 1993-1-11 item 5');\n    h+=rec('info','montagem','Alongamento a compensar no corte',\n      `Comprimento do arco de ${nf(R.est.S,3)} m contra ${nf(R.est.Lc,3)} m de corda. Alongamento elástico de ${nf(R.alElast,1)} mm e alongamento estrutural de ${nf(R.alConstr,1)} mm${p.preEst?' (cabo pré-esticado)':''}. Some ${nf(R.alElast+R.alConstr,0)} mm ao comprimento entre terminações ou o cabo chegará curto na obra.`);\n  }\n  if(!p.preEst && p.alEst>0.2)\n    h+=rec('att','especificação','Especificar pré-esticamento',\n      `Sem pré-esticamento, o alongamento estrutural de ${nf(p.alEst,2)}% representa ${nf(R.alConstr,0)} mm em ${nf(p.compr,1)} m, e ele ocorre de forma permanente nos primeiros carregamentos — a protensão simplesmente se perde. Em tirantes e estais, exija cabo pré-esticado em fábrica com certificado.`,\n      'EN 1993-1-11 item 3.3');\n  h+=rec('good','controle','Plano de inspeção',\n    `Registre o estado inicial em relatório fotográfico com medição do diâmetro em três seções. Inspecione a cada ${p.cat.startsWith('C4')||p.cat.startsWith('C5')||p.cat.startsWith('CX')?'12 meses':'24 meses'} conforme a agressividade do ambiente, verificando: redução de diâmetro, fios rompidos, corrosão junto às terminações e afrouxamento. A região crítica é sempre a saída da terminação e o ponto mais baixo, onde a água se acumula. Critério de descarte por fios rompidos conforme ISO 4309.`,\n    'ISO 4309 · NBR 6327');\n  $('recBox').innerHTML=h;\n}\n\nfunction renderGeo(){\n  const p=R.p;\n  if(p.modo!=='flecha'){\n    $('geoBox').innerHTML=`<div class=\"infobar\">O modo <b>tirante reto<\u002Fb> está ativo: a tração foi informada diretamente e não há análise de flecha. Mude para <b>cabo com flecha<\u002Fb> no bloco 03 para estudar a geometria, a protensão e o efeito da temperatura.<\u002Fdiv>\n    <div class=\"panel\"><div class=\"panel-h\"><h3>Alongamento do tirante<\u002Fh3><\u002Fdiv><table><tbody>\n      <tr><td>Alongamento elástico sob carga permanente<\u002Ftd><td class=\"num\"><b>${nf(R.alElast,1)} mm<\u002Fb><\u002Ftd><\u002Ftr>\n      <tr><td>Alongamento estrutural (assentamento dos fios)<\u002Ftd><td class=\"num\"><b>${nf(R.alConstr,1)} mm<\u002Fb><\u002Ftd><\u002Ftr>\n      <tr><td>Alongamento térmico até ${nf(p.tMax,0)} °C<\u002Ftd><td class=\"num\"><b>${nf(R.alTerm,1)} mm<\u002Fb><\u002Ftd><\u002Ftr>\n      <tr><td><b>Total a compensar no corte<\u002Fb><\u002Ftd><td class=\"num\"><b>${nf(R.alElast+R.alConstr,0)} mm<\u002Fb><\u002Ftd><\u002Ftr>\n    <\u002Ftbody><\u002Ftable><\u002Fdiv>`;\n    return;\n  }\n  const est=[['Montagem a '+nf(p.tMont,0)+' °C',R.estMont],['Mínima a '+nf(p.tMin,0)+' °C',R.estFrio],['Máxima a '+nf(p.tMax,0)+' °C',R.estQuente]];\n  $('geoBox').innerHTML=`<div class=\"panel\"><div class=\"panel-h\"><h3>Estados do cabo<\u002Fh3>\n    <p>Vão ${nf(p.vao,1)} m · desnível ${nf(p.desn,1)} m · peso próprio ${nf(R.w0,2)} N/m${p.qAd?` + sobrecarga ${nf(p.qAd,0)} N/m`:''}<\u002Fp><\u002Fdiv>\n    <table><thead><tr><th>Estado<\u002Fth><th class=\"num\">H (kN)<\u002Fth><th class=\"num\">T máx (kN)<\u002Fth><th class=\"num\">Flecha (m)<\u002Fth><th class=\"num\">L/f<\u002Fth><th class=\"num\">Arco (m)<\u002Fth><th class=\"num\">Utilização<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n    ${est.map(([n,e])=>`<tr><td>${n}<\u002Ftd><td class=\"num\">${nf(e.H/1000,2)}<\u002Ftd><td class=\"num\">${nf(e.Tmax/1000,2)}<\u002Ftd>\n      <td class=\"num\">${nf(e.fV,3)}<\u002Ftd><td class=\"num\">${nf(e.razao,0)}<\u002Ftd><td class=\"num\">${nf(e.S,3)}<\u002Ftd>\n      <td class=\"num\" style=\"color:var(--${cls(e.Tmax/1000/R.Frd)})\">${nf(e.Tmax/1000/R.Frd*100,0)}%<\u002Ftd><\u002Ftr>`).join('')}\n    <\u002Ftbody><\u002Ftable><\u002Fdiv>\n    <div class=\"panel\"><div class=\"panel-h\"><h3>Alongamentos a compensar<\u002Fh3><\u002Fdiv><table><tbody>\n      <tr><td>Elástico sob carga permanente<\u002Ftd><td class=\"num\"><b>${nf(R.alElast,1)} mm<\u002Fb><\u002Ftd><\u002Ftr>\n      <tr><td>Estrutural${p.preEst?' — cabo pré-esticado':''}<\u002Ftd><td class=\"num\"><b>${nf(R.alConstr,1)} mm<\u002Fb><\u002Ftd><\u002Ftr>\n      <tr><td>Diferença arco − corda<\u002Ftd><td class=\"num\"><b>${nf((R.estMont.S-R.estMont.Lc)*1000,1)} mm<\u002Fb><\u002Ftd><\u002Ftr>\n      <tr><td><b>Comprimento de fabricação sugerido<\u002Fb><\u002Ftd><td class=\"num\"><b>${nf(R.estMont.S+(R.alElast+R.alConstr)/1000,3)} m<\u002Fb><\u002Ftd><\u002Ftr>\n    <\u002Ftbody><\u002Ftable><\u002Fdiv>`;\n}\n\nfunction renderDur(){\n  const p=R.p;\n  const perdaFinal=R.curvaC.find(c=>c.t>=p.vidaAlvo)||R.curvaC[R.curvaC.length-1];\n  $('durBox').innerHTML=`<div class=\"rustbar\">A corrosão consome o <b>fio externo<\u002Fb>, de ${nf(p.dFio,2)} mm, não o diâmetro do cabo. É por isso que uma construção 6×36, mais flexível, dura menos que uma 6×19 no mesmo ambiente: os fios são mais finos.<\u002Fdiv>\n  <div class=\"panel\"><div class=\"panel-h\"><h3>Balanço de durabilidade<\u002Fh3>\n    <p>${p.cat} · ${R.pr.n}<\u002Fp><\u002Fdiv><table><tbody>\n    <tr><td>Taxa de corrosão do zinco no primeiro ano<\u002Ftd><td class=\"num\">${nf(R.cat.zn,2)} µm<\u002Ftd><\u002Ftr>\n    <tr><td>Espessura de zinco disponível<\u002Ftd><td class=\"num\">${R.pr.inox?'—':nf(R.espZn,1)+' µm'}<\u002Ftd><\u002Ftr>\n    <tr><td>Tempo até esgotar o zinco<\u002Ftd><td class=\"num\"><b>${R.tZn>=900?'—':nf(R.tZn,0)+' anos'}<\u002Fb><\u002Ftd><\u002Ftr>\n    <tr><td>Taxa efetiva do aço após o zinco<\u002Ftd><td class=\"num\">${nf(R.rAcoEf,1)} µm no primeiro ano<\u002Ftd><\u002Ftr>\n    <tr><td>Raio do fio externo<\u002Ftd><td class=\"num\">${nf(R.rFio*1000,0)} µm<\u002Ftd><\u002Ftr>\n    <tr><td>Tempo adicional até perder ${nf(p.perdaAdm,0)}% da seção<\u002Ftd><td class=\"num\"><b>${R.tAco>=900?'—':nf(R.tAco,0)+' anos'}<\u002Fb><\u002Ftd><\u002Ftr>\n    <tr style=\"background:var(--card2)\"><td><b>Vida útil estimada<\u002Fb><\u002Ftd><td class=\"num\"><b>${R.vida>=900?'acima de 100 anos':nf(R.vida,0)+' anos'}<\u002Fb><\u002Ftd><\u002Ftr>\n    <tr><td>Perda de seção aos ${nf(p.vidaAlvo,0)} anos<\u002Ftd><td class=\"num\">${nf(perdaFinal.perda,1)}%<\u002Ftd><\u002Ftr>\n    <tr><td>Resistência residual aos ${nf(p.vidaAlvo,0)} anos<\u002Ftd><td class=\"num\">${nf(perdaFinal.res,0)} kN — segurança ${nf(perdaFinal.res/Math.max(R.Fmax,1e-6),2)}<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable><\u002Fdiv>`;\n\n  $('fadBox').innerHTML = p.verFad ? `<div class=\"panel\"><div class=\"panel-h\"><h3>Fadiga<\u002Fh3>\n    <p>Curva S-N de inclinação m = 4 ancorada em Δσ<sub>c<\u002Fsub> = ${nf(p.dsc,0)} MPa a 2×10⁶ ciclos.<\u002Fp><\u002Fdiv><table><tbody>\n    <tr><td>Tração permanente<\u002Ftd><td class=\"num\">${nf(R.Fperm,1)} kN → ${nfi(R.Fperm*1000/p.Am)} MPa<\u002Ftd><\u002Ftr>\n    <tr><td>Tração máxima<\u002Ftd><td class=\"num\">${nf(R.Fmax,1)} kN → ${nfi(R.Fmax*1000/p.Am)} MPa<\u002Ftd><\u002Ftr>\n    <tr><td>Variação de tensão Δσ<\u002Ftd><td class=\"num\"><b>${nf(R.dSigma,1)} MPa<\u002Fb><\u002Ftd><\u002Ftr>\n    <tr><td>Ciclos admissíveis<\u002Ftd><td class=\"num\"><b>${R.Nadm>1e12?'acima de 10¹²':R.Nadm.toExponential(2)}<\u002Fb><\u002Ftd><\u002Ftr>\n    <tr><td>Ciclos previstos<\u002Ftd><td class=\"num\">${nfi(p.nCiclos)}<\u002Ftd><\u002Ftr>\n    <tr style=\"background:var(--card2)\"><td><b>Relação de utilização à fadiga<\u002Fb><\u002Ftd><td class=\"num\"><b>${nf(p.nCiclos/Math.max(R.Nadm,1)*100,1)}%<\u002Fb><\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable><\u002Fdiv>` : `<div class=\"infobar\">Verificação de fadiga desativada no bloco 07.<\u002Fdiv>`;\n}\n\nfunction renderTerm(){\n  const p=R.p, g=grampos(p.d);\n  $('termBox').innerHTML=`<div class=\"infobar\">O rendimento da terminação multiplica diretamente a carga de ruptura. É o parâmetro de projeto mais frequentemente esquecido em memorial e o mais fácil de auditar em campo.<\u002Fdiv>\n  <div class=\"panel\"><div class=\"panel-h\"><h3>Comparação de terminações para este cabo<\u002Fh3>\n    <p>Carga de ruptura do cabo nu: ${nf(p.Fmin,1)} kN · solicitação ${nf(R.Fmax,1)} kN · γ exigido ${nf(p.gamma,1)}<\u002Fp><\u002Fdiv>\n  <table><thead><tr><th>Terminação<\u002Fth><th class=\"num\">Rend.<\u002Fth><th class=\"num\">Ruptura efetiva<\u002Fth><th class=\"num\">Admissível<\u002Fth><th class=\"num\">Segurança real<\u002Fth><th>Situação<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n  ${Object.entries(TERMINACOES).map(([n,t])=>{\n    const Fe=p.Fmin*t.ef, Fa=Fe/p.gamma, gr=Fe/Math.max(R.Fmax,1e-6);\n    const sel=n===p.term;\n    return `<tr style=\"${sel?'background:var(--aco-l);font-weight:600':''}\"><td>${n}${sel?' ◄':''}<\u002Ftd>\n      <td class=\"num\">${nf(t.ef*100,0)}%<\u002Ftd><td class=\"num\">${nf(Fe,1)} kN<\u002Ftd><td class=\"num\">${nf(Fa,1)} kN<\u002Ftd>\n      <td class=\"num\">${nf(gr,2)}<\u002Ftd><td>${t.ok? stTag(gr>=p.gamma, gr>=p.gamma&&gr<p.gamma*1.15) : '<span class=\"st bad\">VEDADO<\u002Fspan>'}<\u002Ftd><\u002Ftr>`;\n  }).join('')}<\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <div class=\"panel\"><div class=\"panel-h\"><h3>Laço com grampos — Ø ${nf(p.d,1)} mm<\u002Fh3>\n    <p>Orientação de montagem. Confira sempre a tabela do fabricante e, em içamento, a NR-11 e a NR-18.<\u002Fp><\u002Fdiv>\n  <table><tbody>\n    <tr><td>Número mínimo de grampos<\u002Ftd><td class=\"num\"><b>${g.n}<\u002Fb><\u002Ftd><\u002Ftr>\n    <tr><td>Espaçamento entre grampos<\u002Ftd><td class=\"num\"><b>${nf(g.esp,0)} mm<\u002Fb> — 6 × Ø<\u002Ftd><\u002Ftr>\n    <tr><td>Comprimento de retorno do cabo<\u002Ftd><td class=\"num\"><b>${nfi(g.retorno)} mm<\u002Fb><\u002Ftd><\u002Ftr>\n    <tr><td>Sapatilha<\u002Ftd><td class=\"num\"><b>obrigatória<\u002Fb><\u002Ftd><\u002Ftr>\n    <tr><td>Reaperto<\u002Ftd><td class=\"num\"><b>após o primeiro carregamento<\u002Fb><\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <div class=\"rec crit\"><h4>Erro clássico de montagem<span class=\"pill\">fiscalização<\u002Fspan><\u002Fh4>\n  <p>A base do grampo — a parte em U — deve apoiar sobre a <b>ponta morta<\u002Fb> do cabo, e a sela sobre a parte que trabalha. Invertido, o U esmaga o cabo tracionado e cria o ponto de ruptura. A regra mnemônica de campo é \"nunca sele um cavalo morto\". Grampos alternados, invertendo a orientação, são igualmente errados. Isso se verifica em vistoria com uma foto.<\u002Fp>\n  <div class=\"src\">NBR 6327 · NR-18 item 18.14<\u002Fdiv><\u002Fdiv>`;\n}\n\nfunction renderOrc(){\n  const p=R.p;\n  const compTot=p.compr*p.nCabos*(1+p.perdas/100);\n  const nTerm=2*p.nCabos;\n  const cCabo=compTot*p.pCabo, cTerm=nTerm*p.pTerm, cMo=p.compr*p.nCabos*p.pMo;\n  const dir=cCabo+cTerm+cMo, tot=dir*(1+p.bdi/100);\n  const semPreco = p.pCabo===0 && p.pTerm===0 && p.pMo===0;\n  $('orcBox').innerHTML=`${semPreco?'<div class=\"rustbar\">Nenhum preço informado. Preencha o bloco 08 com a composição SINAPI vigente ou com cotação da região — esta ferramenta não traz preço embutido, de propósito.<\u002Fdiv>':''}\n  <div class=\"panel\"><div class=\"panel-h\"><h3>Quantitativo e custo<\u002Fh3>\n    <p>${p.nCabos} cabo(s) de ${nf(p.compr,1)} m · perdas ${nf(p.perdas,0)}% · BDI ${nf(p.bdi,2)}%<\u002Fp><\u002Fdiv>\n  <table><thead><tr><th>Item<\u002Fth><th class=\"num\">Quant.<\u002Fth><th class=\"num\">Unit.<\u002Fth><th class=\"num\">Total<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n    <tr><td>Cabo ${p.tipo} Ø ${nf(p.d,1)} mm classe ${p.Rr}, ${R.pr.n}<\u002Ftd><td class=\"num\">${nf(compTot,1)} m<\u002Ftd><td class=\"num\">${nf(p.pCabo,2)}<\u002Ftd><td class=\"num\">${nf(cCabo,2)}<\u002Ftd><\u002Ftr>\n    <tr><td>${p.term}<\u002Ftd><td class=\"num\">${nTerm} un<\u002Ftd><td class=\"num\">${nf(p.pTerm,2)}<\u002Ftd><td class=\"num\">${nf(cTerm,2)}<\u002Ftd><\u002Ftr>\n    <tr><td>Instalação, protensão e ajuste<\u002Ftd><td class=\"num\">${nf(p.compr*p.nCabos,1)} m<\u002Ftd><td class=\"num\">${nf(p.pMo,2)}<\u002Ftd><td class=\"num\">${nf(cMo,2)}<\u002Ftd><\u002Ftr>\n    <tr class=\"tot\" style=\"background:var(--card2);font-weight:700\"><td>Custo direto<\u002Ftd><td class=\"num\">—<\u002Ftd><td class=\"num\">—<\u002Ftd><td class=\"num\">R$ ${nf(dir,2)}<\u002Ftd><\u002Ftr>\n    <tr><td>BDI ${nf(p.bdi,2)}%<\u002Ftd><td class=\"num\">—<\u002Ftd><td class=\"num\">—<\u002Ftd><td class=\"num\">R$ ${nf(tot-dir,2)}<\u002Ftd><\u002Ftr>\n    <tr style=\"background:var(--aco-l);font-weight:700\"><td><b>Preço total<\u002Fb><\u002Ftd><td class=\"num\">—<\u002Ftd><td class=\"num\">—<\u002Ftd><td class=\"num\"><b>R$ ${nf(tot,2)}<\u002Fb><\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable><\u002Fdiv>\n  <div class=\"panel\"><div class=\"panel-h\"><h3>Massa e transporte<\u002Fh3><\u002Fdiv><table><tbody>\n    <tr><td>Massa por metro<\u002Ftd><td class=\"num\">${nf(p.massa,3)} kg/m<\u002Ftd><\u002Ftr>\n    <tr><td>Massa total do fornecimento<\u002Ftd><td class=\"num\"><b>${nf(compTot*p.massa,1)} kg<\u002Fb><\u002Ftd><\u002Ftr>\n    <tr><td>Massa por cabo<\u002Ftd><td class=\"num\">${nf(p.compr*p.massa,1)} kg<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable><\u002Fdiv>\n  `;\n}\n\nfunction renderMem(){\n  const p=R.p;\n  $('memBox').innerHTML=`\n  <h3>1. Identificação<\u002Fh3>\n  <p>Obra: <b>${p.obra||'—'}<\u002Fb> · Elemento: <b>${p.elem||'—'}<\u002Fb> · Data: <b>${p.data||'—'}<\u002Fb> · Responsável: <b>${p.resp||'—'}<\u002Fb><\u002Fp>\n\n  <h3>2. Carga de ruptura mínima<\u002Fh3>\n  <p>Adotada a formulação da ISO 2408 e da NBR 6327, que parte de um fator K característico da construção. Não se usa tensão × área metálica, porque o encordoamento reduz o aproveitamento dos fios em cerca de 15% e essa perda já está embutida no fator K.<\u002Fp>\n  <div class=\"eq\">F_min = K · d² · R_r / 1000\n       = ${nf(p.K,3)} · ${nf(p.d,1)}² · ${p.Rr} / 1000 = ${nf(p.Fmin,1)} kN\nCom terminação (${p.term}, η = ${nf(p.ef,2)}):\nF_ef = ${nf(p.Fmin,1)} · ${nf(p.ef,2)} = ${nf(p.Fmin*p.ef,1)} kN\nAdmissível: F_ef / γ = ${nf(p.Fmin*p.ef,1)} / ${nf(p.gamma,1)} = ${nf(R.Frd,1)} kN<\u002Fdiv>\n\n  <h3>3. Verificação de resistência<\u002Fh3>\n  <div class=\"eq\">Solicitação máxima: ${nf(R.Fmax,1)} kN\nUtilização = ${nf(R.Fmax,1)} / ${nf(R.Frd,1)} = ${nf(R.util,3)} → ${nf(R.util*100,0)}%\nSegurança real = ${nf(p.Fmin*p.ef,1)} / ${nf(R.Fmax,1)} = ${nf(R.gReal,2)}   (exigida ${nf(p.gamma,1)})<\u002Fdiv>\n\n  ${p.modo==='flecha'?`<h3>4. Geometria parabólica<\u002Fh3>\n  <p>Cabo sob carga uniformemente distribuída na projeção horizontal. A componente horizontal H é constante ao longo do vão.<\u002Fp>\n  <div class=\"eq\">w = ${nf(p.massa,3)} kg/m · 9,807 = ${nf(R.w0,2)} N/m${p.qAd?`  (+ ${nf(p.qAd,0)} N/m de sobrecarga → ${nf(R.w1,2)} N/m)`:''}\nf = w·L² / (8·H) = ${nf(R.w1,2)} · ${nf(p.vao,1)}² / (8 · ${nfi(R.estMont.H)}) = ${nf(R.estMont.fV,3)} m\nV_a = H·h/L − w·L/2 = ${nf(R.estMont.Va,0)} N     V_b = H·h/L + w·L/2 = ${nf(R.estMont.Vb,0)} N\nT = √(H² + V²) → T_máx = ${nf(R.estMont.Tmax/1000,2)} kN\nS ≈ L_c + (8/3)·f_perp²/L_c = ${nf(R.estMont.S,3)} m<\u002Fdiv>\n\n  <h3>5. Mudança de estado por temperatura<\u002Fh3>\n  <p>Equação clássica de mudança de estado. O cabo aquecido alonga, a flecha cresce e a tração cai. Quanto mais esticado o cabo, mais a variação térmica se converte em tração em vez de flecha: no limite de flecha nula, ΔH tende a EA·α·ΔT.<\u002Fp>\n  <div class=\"eq\">H₂³ + A·H₂² − (EA·w₂²·L²)/24 = 0\nA = EA·α·ΔT + (EA·w₁²·L²)/(24·H₁²) − H₁\nEA = ${nf(p.Ef,0)} GPa · ${nfi(p.Am)} mm² = ${nfi(R.EA/1000)} kN     α = ${nf(p.alfa*1e6,1)}×10⁻⁶/°C\n${nf(p.tMin,0)} °C → H = ${nf(R.estFrio.H/1000,2)} kN · f = ${nf(R.estFrio.fV,3)} m · T_máx = ${nf(R.estFrio.Tmax/1000,2)} kN\n${nf(p.tMax,0)} °C → H = ${nf(R.estQuente.H/1000,2)} kN · f = ${nf(R.estQuente.fV,3)} m · T_máx = ${nf(R.estQuente.Tmax/1000,2)} kN<\u002Fdiv>`:''}\n\n  <h3>${p.modo==='flecha'?'6':'4'}. Alongamentos<\u002Fh3>\n  <div class=\"eq\">Elástico:    ΔL = F·L / (E·A) = ${nf(R.Fperm,1)}·10³ · ${nf(p.compr,1)} / (${nf(p.Ef,0)}·10³ · ${nfi(p.Am)}) = ${nf(R.alElast,1)} mm\nEstrutural:  ΔL = ${nf(p.alEst,2)}% · ${nf(p.compr,1)} m = ${nf(R.alConstr,1)} mm\nTérmico:     ΔL = α·ΔT·L = ${nf(R.alTerm,1)} mm até ${nf(p.tMax,0)} °C<\u002Fdiv>\n\n  <h3>${p.modo==='flecha'?'7':'5'}. Durabilidade<\u002Fh3>\n  <p>Modelo potencial da ISO 9224 sobre a taxa de primeiro ano da ISO 9223. A corrosão é avaliada no fio externo, não no diâmetro do cabo.<\u002Fp>\n  <div class=\"eq\">Zinco:  D(t) = r_zn · t^${B_ZN}     r_zn = ${nf(R.cat.zn,2)} µm/ano\nEspessura de zinco = massa / ρ_zn = ${R.pr.zn} / ${RHO_ZN} = ${nf(R.espZn,1)} µm\nt_zn = (${nf(R.espZn,1)} / ${nf(R.cat.zn,2)})^(1/${B_ZN}) = ${R.tZn>=900?'—':nf(R.tZn,0)+' anos'}\nAço:    D(t) = r_aço · t^${B_ACO}     r_aço efetiva = ${nf(R.rAcoEf,1)} µm/ano\nPerda de ${nf(p.perdaAdm,0)}% da área ⇒ perda de raio de ${nf((1-Math.sqrt(1-p.perdaAdm/100))*100,2)}%\nRaio do fio = ${nf(R.rFio*1000,0)} µm → Δr admitido = ${nf(R.rFio*(1-Math.sqrt(1-p.perdaAdm/100))*1000,1)} µm\nt_aço = ${R.tAco>=900?'—':nf(R.tAco,0)+' anos'}       Vida total = ${R.vida>=900?'acima de 100 anos':nf(R.vida,0)+' anos'}<\u002Fdiv>\n\n  ${p.verFad?`<h3>${p.modo==='flecha'?'8':'6'}. Fadiga<\u002Fh3>\n  <div class=\"eq\">Δσ = (F_máx − F_perm) / A_m = (${nf(R.Fmax,1)} − ${nf(R.Fperm,1)})·10³ / ${nfi(p.Am)} = ${nf(R.dSigma,1)} MPa\nN = 2×10⁶ · (Δσ_c / Δσ)⁴ = 2×10⁶ · (${nf(p.dsc,0)} / ${nf(R.dSigma,1)})⁴ = ${R.Nadm>1e12?'>10¹²':R.Nadm.toExponential(2)} ciclos\nPrevistos: ${nfi(p.nCiclos)}  →  ${R.fadOk?'ATENDE':'NÃO ATENDE'}<\u002Fdiv>`:''}\n\n  <h3>Hipóteses e limitações<\u002Fh3>\n  <p>Geometria parabólica com carga uniforme na projeção horizontal, válida para relação vão/flecha acima de 8. Fluência do aço e relaxação não consideradas: em tirante permanente muito solicitado, a perda de protensão por relaxação pode chegar a 3% em cordoalha de baixa relaxação e precisa ser somada. A verificação de fadiga cobre o vão livre; a flexão junto às ancoragens e em desviadores, que na prática governa, exige análise específica. Corrosão tratada como uniforme, sem pite localizado nem corrosão sob tensão. Área metálica, massa e módulo efetivo são valores típicos por construção — substitua pelos do catálogo do fabricante antes de emitir o projeto.<\u002Fp>\n  <p class=\"note\">Ferramenta de pré-dimensionamento e triagem. Não substitui o projeto do fornecedor do sistema de cabos nem os ensaios de recebimento.<\u002Fp>`;\n}\n\n/* ---------------- persistência e exportação ---------------- */\nconst KEY='cabocalc.projetos.v1';\nconst ler=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};\nconst grav=a=>{try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){toast('Não foi possível gravar')}};\n\nfunction renderProj(){\n  const ps=ler();\n  $('projBox').innerHTML = ps.length ? ps.map((r,i)=>`<div class=\"proj\">\n    <span class=\"lamp ${r.cls}\" style=\"width:10px;height:10px;box-shadow:none\"><\u002Fspan>\n    <div class=\"pn\"><b>${r.nome}<\u002Fb><small>${r.data} · ${r.p.tipo} Ø${nf(r.p.d,1)} mm · utilização ${nf(r.util*100,0)}% · vida ${nf(r.vida,0)} anos<\u002Fsmall><\u002Fdiv>\n    <button class=\"btn\" data-l=\"${i}\">Abrir<\u002Fbutton><button class=\"btn\" data-d=\"${i}\">Excluir<\u002Fbutton><\u002Fdiv>`).join('')\n    : `<div class=\"empty\"><b>Nenhum projeto salvo<\u002Fb>Calcule e use <i>Salvar<\u002Fi> para guardar o estudo neste navegador.<\u002Fdiv>`;\n  $('projBox').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{aplicar(ler()[+b.dataset.l].p);calcular();document.querySelector('.tab').click();});\n  $('projBox').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const a=ler();a.splice(+b.dataset.d,1);grav(a);renderProj();toast('Excluído');});\n}\nfunction aplicar(p){\n  const map={obra:'obra',elem:'elem',data:'data',resp:'resp',tipo:'tipo',diam:'d',Rr:'Rr',nCabos:'nCabos',\n    Ef:'Ef',alEst:'alEst',AmMan:'Am',dFio:'dFio',modo:'modo',Fperm:'Fperm',Fmax:'FmaxAp',gamma:'gamma',\n    vao:'vao',desn:'desn',defPor:'defPor',H0:'H0',fAlvo:'fAlvo',tMont:'tMont',tMin:'tMin',tMax:'tMax',\n    qAd:'qAd',term:'term',compr:'compr',cat:'cat',prot:'prot',vidaAlvo:'vidaAlvo',perdaAdm:'perdaAdm',\n    nCiclos:'nCiclos',dsc:'dsc',pCabo:'pCabo',pTerm:'pTerm',pMo:'pMo',natBdi:'natBdi',bdi:'bdi',perdas:'perdas'};\n  Object.entries(map).forEach(([el,k])=>{\n    const e=$(el); if(!e || p[k]===undefined) return;\n    e.value = p[k];\n    // selects com valores numéricos (\"3.0\") não casam com o número 3: procura a opção equivalente\n    if(e.tagName==='SELECT' && e.value===''){\n      const alvo=+p[k];\n      const op=[...e.options].find(o=>Math.abs(+o.value-alvo)<1e-9) || [...e.options].find(o=>o.value===String(p[k]));\n      if(op) e.value=op.value;\n    }\n  });\n  $('preEst').checked=!!p.preEst; $('verFad').checked=!!p.verFad;\n  $('alfa').value=(p.alfa*1e6).toFixed(1);\n  tabManual=true; $('term').dispatchEvent(new Event('change')); $('cat').dispatchEvent(new Event('change'));\n  $('modo').dispatchEvent(new Event('change')); atualizarProps();\n}\n$('btnSalvar').addEventListener('click',()=>{\n  if(!R)return toast('Calcule antes de salvar');\n  const nome=prompt('Nome do estudo:',(R.p.elem||'Cabo')+' — '+(R.p.obra||'obra')); if(!nome)return;\n  const a=ler(); a.unshift({nome,data:new Date().toLocaleString('pt-BR'),p:R.p,util:R.util,vida:R.vida,cls:cls(R.util)});\n  grav(a.slice(0,60)); renderProj(); toast('Salvo neste navegador');\n});\nfunction baixar(t,n,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();URL.revokeObjectURL(a.href);toast('Gerado: '+n);}\n$('btnJson').addEventListener('click',()=>{if(!R)return;baixar(JSON.stringify({versao:'CaboCalc 1.0',gerado:new Date().toISOString(),entradas:R.p,\n  resultados:{Fmin:R.p.Fmin,Fadm:R.Frd,solicitacao:R.Fmax,utilizacao:R.util,segurancaReal:R.gReal,\n  vidaAnos:R.vida,zincoAnos:R.tZn,deltaSigma:R.dSigma,ciclosAdm:R.Nadm}},null,2),'cabocalc.json','application/json');});\n$('btnCsv').addEventListener('click',()=>{\n  if(!R)return;\n  let c='grandeza;valor;unidade\\n';\n  [['Diametro',R.p.d,'mm'],['Carga de ruptura minima',R.p.Fmin,'kN'],['Rendimento da terminacao',R.p.ef*100,'%'],\n   ['Admissivel',R.Frd,'kN'],['Solicitacao maxima',R.Fmax,'kN'],['Utilizacao',R.util*100,'%'],\n   ['Seguranca real',R.gReal,'-'],['Tensao de servico',R.sigma,'MPa'],['Delta sigma',R.dSigma,'MPa'],\n   ['Ciclos admissiveis',R.Nadm,'-'],['Vida por corrosao',R.vida,'anos'],['Zinco esgotado',R.tZn,'anos'],\n   ['Alongamento elastico',R.alElast,'mm'],['Alongamento estrutural',R.alConstr,'mm'],['Massa',R.p.massa,'kg/m']]\n   .forEach(([n,v,u])=>c+=`${n};${(+v).toFixed(4).replace('.',',')};${u}\\n`);\n  if(R.p.modo==='flecha') R.curvaT.forEach(x=>c+=`T=${nf(x.t,0)}C H;${x.H.toFixed(3).replace('.',',')};kN\\n`);\n  baixar('\\ufeff'+c,'cabocalc.csv','text/csv;charset=utf-8');\n});\n$('btnPdf').addEventListener('click',()=>{if(!R)return;document.querySelectorAll('.pane').forEach(x=>x.classList.add('on'));\n  redesenhar();desenharPrincipal();setTimeout(()=>window.print(),200);});\n$('btnNovo').addEventListener('click',()=>{if(confirm('Limpar tudo e voltar ao padrão?'))location.reload();});\n$('btnCalc').addEventListener('click',calcular);\ndocument.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();calcular();}});\n\n/* ---------------- início ---------------- */\n$('term').dispatchEvent(new Event('change'));\n$('cat').dispatchEvent(new Event('change'));\n$('modo').dispatchEvent(new Event('change'));\naplicarTipo();\nrenderProj();\ncalcular();\n<\u002Fscript>\n<style id=\"cc-intro-css\">\nhtml.cc-lock,body.cc-lock{overflow:hidden!important}\n#cc-intro{position:fixed;inset:0;z-index:9999;background:#070e14;overflow:hidden;\n  font-family:var(--sans);opacity:1;transition:opacity .5s ease}\n#cc-intro.cc-out{opacity:0;pointer-events:none}\n#cc-cv{position:absolute;inset:0;display:block}\n#cc-intro .cc-vig{position:absolute;inset:0;pointer-events:none;\n  background:radial-gradient(ellipse 70% 60% at 50% 48%,transparent 40%,rgba(4,8,12,.72) 100%)}\n#cc-intro .cc-txt{position:absolute;left:0;right:0;bottom:8.5vh;text-align:center;pointer-events:none;padding:0 6vw}\n#cc-intro .cc-t1{font-size:clamp(30px,5.4vw,68px);font-weight:800;letter-spacing:-.045em;color:#f2f7fa;\n  line-height:1;opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}\n#cc-intro .cc-t1 b{color:#4fbcd8;font-weight:800}\n#cc-intro .cc-t2{margin-top:14px;font-family:var(--mono);font-size:clamp(9.5px,1.15vw,13.5px);\n  text-transform:uppercase;letter-spacing:.3em;color:#8fa8b8;opacity:0;transition:opacity 1s ease .25s}\n#cc-intro.cc-show .cc-t1,#cc-intro.cc-show .cc-t2{opacity:1;transform:none}\n#cc-intro .cc-tags{position:absolute;top:5vh;left:0;right:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;\n  pointer-events:none;opacity:0;transition:opacity .8s ease}\n#cc-intro.cc-sec .cc-tags{opacity:1}\n#cc-intro .cc-tag{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;\n  color:#9fd8e6;border:1px solid rgba(79,188,216,.38);background:rgba(79,188,216,.09);border-radius:3px;padding:4px 9px}\n#cc-intro .cc-tag.w{color:#f0bc82;border-color:rgba(240,188,130,.35);background:rgba(240,188,130,.08)}\n#cc-intro .cc-bar{position:absolute;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,#1f5f7a,#4fbcd8)}\n#cc-intro .cc-skip{position:absolute;right:16px;bottom:14px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;\n  text-transform:uppercase;color:#5d7385;cursor:pointer;background:none;border:none}\n#cc-intro .cc-skip:hover{color:#9fd8e6}\n\n#cc-legal{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;\n  background:rgba(7,14,20,.86);backdrop-filter:blur(7px);font-family:var(--sans)}\n#cc-legal.on{display:flex}\n#cc-legal .box{background:#fff;border:1px solid var(--line);border-radius:8px;max-width:760px;width:100%;\n  max-height:92vh;display:flex;flex-direction:column;box-shadow:0 26px 70px rgba(0,0,0,.5);\n  opacity:0;transform:translateY(16px) scale(.985);transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.2,1)}\n#cc-legal.on .box{opacity:1;transform:none}\n#cc-legal .bh{padding:16px 22px;border-bottom:1px solid var(--line);background:var(--card2)}\n#cc-legal .bh .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3)}\n#cc-legal .bh h2{font-size:19px;font-weight:800;letter-spacing:-.03em;margin-top:3px}\n#cc-legal .bh h2 span{color:var(--aco)}\n#cc-legal .bb{padding:18px 22px;overflow-y:auto;font-size:13px;color:var(--txt2);line-height:1.62}\n#cc-legal .bb h4{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt);margin:14px 0 5px;font-weight:800}\n#cc-legal .bb h4:first-child{margin-top:0}\n#cc-legal .bb ul{margin:0 0 0 17px}\n#cc-legal .bb li{margin-bottom:5px}\n#cc-legal .bb .lead{border-left:2px solid var(--aco);background:var(--aco-l);padding:10px 13px;border-radius:var(--r);\n  color:var(--txt);font-size:12.5px}\n#cc-legal .bf{padding:14px 22px 16px;border-top:1px solid var(--line);background:var(--card2);\n  display:flex;gap:14px;align-items:center;flex-wrap:wrap}\n#cc-legal .bf button{white-space:nowrap}\n#cc-legal .agree{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--txt);cursor:pointer;flex:1;min-width:270px;line-height:1.5}\n#cc-legal .agree input{width:16px;height:16px;accent-color:var(--aco);margin-top:1px;flex:none;cursor:pointer}\n#cc-legal .acts{display:flex;gap:8px;margin-left:auto}\n#cc-legal .btn-x{border:1px solid var(--line2);background:#fff;border-radius:var(--r);padding:8px 14px;font-size:12.5px;\n  font-weight:500;color:var(--txt2);cursor:pointer}\n#cc-legal .btn-x:hover{border-color:var(--aco);color:var(--aco)}\n#cc-legal .btn-go{border:1px solid var(--aco);background:var(--aco);color:#fff;font-weight:700;border-radius:var(--r);\n  padding:8px 18px;font-size:12.5px;cursor:pointer}\n#cc-legal .btn-go:hover{background:#26718f}\n#cc-legal .btn-go:disabled{opacity:.4;cursor:not-allowed;background:var(--line2);border-color:var(--line2)}\n#cc-legal .deny{font-size:12px;color:var(--bad);width:100%;display:none}\n#cc-legal.denied .deny{display:block}\n<\u002Fstyle>\n\n<div id=\"cc-intro\">\n  <canvas id=\"cc-cv\"><\u002Fcanvas>\n  <div class=\"cc-vig\"><\u002Fdiv>\n  <div class=\"cc-tags\">\n    <span class=\"cc-tag\">6 × 19 Seale · alma de aço IWRC<\u002Fspan>\n    <span class=\"cc-tag\">Zincado classe A<\u002Fspan>\n    <span class=\"cc-tag w\">Seção transversal<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"cc-txt\">\n    <div class=\"cc-t1\">Cabo<b>Calc<\u002Fb><\u002Fdiv>\n    <div class=\"cc-t2\">Calculadora de Cabos de Aço Estruturais e Estacionários<\u002Fdiv>\n  <\u002Fdiv>\n  <button class=\"cc-skip\" id=\"cc-skip\">clique para avançar ›<\u002Fbutton>\n  <div class=\"cc-bar\" id=\"cc-bar\"><\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"cc-legal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"cc-legal-t\">\n  <div class=\"box\">\n    <div class=\"bh\">\n      <div class=\"eyebrow\">Aviso legal · termo de uso<\u002Fdiv>\n      <h2 id=\"cc-legal-t\">Cabo<span>Calc<\u002Fspan> — Calculadora de Cabos de Aço Estruturais e Estacionários<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"bb\">\n      <p class=\"lead\">Esta é uma ferramenta de apoio ao dimensionamento e à verificação de cabos de aço. Os resultados\n      são estimativas de engenharia e <b>não substituem projeto, memorial de cálculo, ART/RRT nem a decisão técnica\n      do profissional legalmente habilitado.<\u002Fb><\u002Fp>\n\n      <h4>1. Natureza dos resultados<\u002Fh4>\n      <ul>\n        <li>Cargas de ruptura, áreas metálicas, massas e módulos de elasticidade são valores <b>típicos<\u002Fb> de catálogo\n        (base ISO 2408 e práticas correntes) e devem ser substituídos pelos dados certificados do fabricante do lote.<\u002Fli>\n        <li>Modelos de flecha, fadiga, corrosão e vida útil são simplificados e válidos apenas dentro das hipóteses\n        declaradas na memória de cálculo.<\u002Fli>\n      <\u002Ful>\n\n      <h4>2. Responsabilidade do usuário<\u002Fh4>\n      <ul>\n        <li>Cabe ao usuário conferir dados de entrada, unidades, normas aplicáveis, coeficientes de segurança e a\n        aderência do modelo ao caso real, bem como a inspeção, a manutenção e os critérios de descarte do cabo.<\u002Fli>\n        <li>Aplicações de elevação de pessoas, cargas críticas ou içamento dinâmico exigem normas e coeficientes\n        específicos, fora do escopo desta calculadora.<\u002Fli>\n      <\u002Ful>\n\n      <h4>3. Isenção de garantias<\u002Fh4>\n      <ul>\n        <li>O sistema é fornecido \"no estado em que se encontra\", sem garantia de exatidão, adequação a finalidade\n        específica ou ausência de erros.<\u002Fli>\n        <li>Os autores e distribuidores não respondem por perdas, danos materiais, pessoais ou lucros cessantes\n        decorrentes do uso ou da impossibilidade de uso desta ferramenta.<\u002Fli>\n      <\u002Ful>\n\n      <h4>4. Dados e privacidade<\u002Fh4>\n      <ul>\n        <li>Os projetos salvos permanecem apenas neste navegador (armazenamento local). Nenhum dado é enviado a servidores.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"bf\">\n      <label class=\"agree\"><input type=\"checkbox\" id=\"cc-chk\"><span>Li, compreendi e <b>concordo<\u002Fb> com o aviso legal, assumindo a responsabilidade técnica pelo uso dos resultados desta calculadora.<\u002Fspan><\u002Flabel>\n      <div class=\"acts\">\n        <button class=\"btn-x\" id=\"cc-no\">Não concordo<\u002Fbutton>\n        <button class=\"btn-go\" id=\"cc-yes\" disabled=\"\">Concordar e acessar<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"deny\">É necessário concordar com o aviso legal para acessar o sistema. Feche esta aba caso não concorde.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(function(){\n\"use strict\";\nvar ov=document.getElementById('cc-intro'),cv=document.getElementById('cc-cv'),ctx=cv.getContext('2d'),\n    bar=document.getElementById('cc-bar'),legal=document.getElementById('cc-legal');\nvar root=document.documentElement;root.classList.add('cc-lock');document.body.classList.add('cc-lock');\n\nvar W=0,H=0,DPR=1;\nfunction resize(){\n  DPR=Math.min(window.devicePixelRatio||1,2.5);\n  W=ov.clientWidth;H=ov.clientHeight;\n  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);\n  cv.style.width=W+'px';cv.style.height=H+'px';\n}\nresize();window.addEventListener('resize',resize);\n\n/* ---- sprites de fio: gradiente radial pré-renderizado por cor e nível de luz ---- */\nvar COLORS={\n  outer:[206,222,238], teal:[ 74,190,218], gold:[242,182,108],\n  inner:[ 92,168,196], core:[238,166,92],\n  iwrc :[146,174,196], iwrcC:[206,132,78]\n};\nvar SH=10,SPR={};\nfunction mk(rgb,k){\n  var s=96,c=document.createElement('canvas');c.width=c.height=s;\n  var g=c.getContext('2d'),f=0.30+0.85*(k/(SH-1));\n  var R=Math.min(255,rgb[0]*f)|0,G=Math.min(255,rgb[1]*f)|0,B=Math.min(255,rgb[2]*f)|0;\n  var grd=g.createRadialGradient(s*0.36,s*0.31,s*0.03,s*0.5,s*0.5,s*0.5);\n  grd.addColorStop(0,'rgb('+Math.min(255,R+78)+','+Math.min(255,G+78)+','+Math.min(255,B+78)+')');\n  grd.addColorStop(.30,'rgb('+R+','+G+','+B+')');\n  grd.addColorStop(.80,'rgb('+(R*0.44|0)+','+(G*0.44|0)+','+(B*0.46|0)+')');\n  grd.addColorStop(.94,'rgb('+(R*0.14|0)+','+(G*0.15|0)+','+(B*0.18|0)+')');\n  grd.addColorStop(1,'rgba('+(R*0.10|0)+','+(G*0.11|0)+','+(B*0.14|0)+',0)');\n  g.fillStyle=grd;g.beginPath();g.arc(s/2,s/2,s/2,0,6.2832);g.fill();\n  return c;\n}\nfor(var kk in COLORS){SPR[kk]=[];for(var i=0;i<SH;i++)SPR[kk].push(mk(COLORS[kk],i));}\n\n/* ---- geometria: 6 x 19 Seale + alma de aço independente ---- */\nfunction strandWires(scale,pal){\n  var a=[],i;\n  a.push({r:0,a:0,w:1.05*scale,c:pal.c});\n  for(i=0;i<9;i++)a.push({r:1.95*scale,a:i*6.2832/9,w:0.92*scale,c:pal.i});\n  var seq=pal.seq||[0,0,1,0,0,2,0,1,0];\n  for(i=0;i<9;i++)a.push({r:3.55*scale,a:i*6.2832/9+0.35,w:1.05*scale,c:[pal.o,pal.a1,pal.a2][seq[i]]});\n  return a;\n}\nvar strands=[];\nstrands.push({R:0,th:0,wires:strandWires(0.62,{o:'iwrc',a1:'iwrc',a2:'iwrcC',i:'iwrc',c:'iwrcC'}),k2:0.16,core:true});\nfor(var s=0;s<6;s++)strands.push({R:8.7,th:s*6.2832/6,wires:strandWires(1,{o:'outer',a1:'teal',a2:'gold',i:'inner',c:'core'}),k2:0.19,core:false});\nvar K1=0.052;                      /* passo de torção do cabo */\nvar LIGHT=[-0.42,-0.62,0.66];\n\n/* ---- animação ---- */\nvar DUR=6000,t0=performance.now(),done=false,raf=0;\nfunction ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}\nfunction clamp(v,a,b){return v<a?a:v>b?b:v;}\n\nfunction frame(now){\n  var t=clamp((now-t0)/DUR,0,1);\n  bar.style.width=(t*100)+'%';\n  if(t>0.06)ov.classList.add('cc-show');\n  if(t>0.62)ov.classList.add('cc-sec');\n  draw(t,(now-t0)/1000);\n  if(t>=1){finish();return;}\n  raf=requestAnimationFrame(frame);\n}\n\nfunction draw(t,secs){\n  var w=cv.width,h=cv.height;\n  var g=ctx.createLinearGradient(0,0,w,h);\n  g.addColorStop(0,'#0a1a24');g.addColorStop(.5,'#071016');g.addColorStop(1,'#0b1420');\n  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);\n  var gl=ctx.createRadialGradient(w*.5,h*.46,0,w*.5,h*.46,Math.max(w,h)*.5);\n  gl.addColorStop(0,'rgba(38,104,132,.16)');gl.addColorStop(1,'rgba(0,0,0,0)');\n  ctx.fillStyle=gl;ctx.fillRect(0,0,w,h);\n\n  /* fases: giro longitudinal -> rotação para a seção transversal */\n  var pRot=clamp((t-0.50)/0.26,0,1);\n  var A=(7+ease(pRot)*82)*Math.PI/180;               /* ângulo do eixo do cabo */\n  var tilt=(0.30-0.26*ease(pRot));                    /* inclinação 3/4 */\n  var travel=secs*3.4;                                /* torção percorrendo o cabo */\n  var zoom=(0.92+0.14*ease(clamp((t-0.10)/0.55,0,1)))*(1+0.62*ease(pRot));\n  var fit=Math.min(w,h);\n  var scale=fit*0.0146*zoom;\n  var cx=w*0.5, cy=h*(0.46-0.02*ease(pRot));\n  var f=520, cosA=Math.cos(A), sinA=Math.sin(A), cosT=Math.cos(tilt), sinT=Math.sin(tilt);\n  var full=A>1.15;                                    /* mostra os fios internos só de frente */\n  var zHalf=full?17:70;\n  var step=0.42/Math.max(0.13,Math.abs(cosA));\n  for(var z=zHalf; z>=-zHalf; z-=step){\n    var aRope=K1*(z+travel);\n    for(var si=0;si<strands.length;si++){\n      var st=strands[si], ang=st.th+aRope;\n      var scu=st.R*Math.cos(ang), scv=st.R*Math.sin(ang);\n      /* profundidade do centro do fio-mestre para descarte de trás */\n      var dCen=-(z)*sinA+scu*cosA;\n      if(!full && st.R>0 && dCen< -st.R*0.62) continue;\n      var wires=st.wires;\n      for(var wi=0;wi<wires.length;wi++){\n        var wr=wires[wi];\n        if(!full && (wr.c==='inner'||wr.c==='core'||wr.c==='iwrcC')) continue;\n        var b=wr.a+st.k2*(z+travel)+ang;\n        var lu=scu+wr.r*Math.cos(b), lv=scv+wr.r*Math.sin(b);\n        /* tilt em torno do eixo u */\n        var yv=lv*cosT - 0*sinT, uu=lv*sinT + lu*cosT;\n        var x1=z*cosA + uu*sinA, z1=-z*sinA + uu*cosA;\n        if(z1>f*0.85) continue;\n        var sc=f/(f-z1);\n        if(!full && z1<dCen-0.9) continue;\n        var sx=cx+x1*sc*scale, sy=cy+yv*sc*scale, rr=wr.w*sc*scale;\n        if(rr<0.35||sx<-40||sx>w+40||sy<-40||sy>h+40) continue;\n        /* iluminação: normal externa do fio */\n        var nu=Math.cos(b), nv=Math.sin(b);\n        var nyv=nv*cosT, nuu=nv*sinT+nu*cosT;\n        var nz=nuu*cosA, nx=nuu*sinA;\n        var dot=nx*LIGHT[0]+nyv*LIGHT[1]+nz*LIGHT[2];\n        var span=zHalf*Math.abs(sinA)+14;\n        var fog=clamp(0.24+0.78*(z1/span*0.5+0.5),0.10,1);\n        var k=clamp(Math.round((0.30+0.72*Math.max(0,dot)+0.10*Math.max(0,-dot))*fog*(SH-1)),0,SH-1);\n        var img=SPR[wr.c][k];\n        ctx.drawImage(img,sx-rr*1.04,sy-rr*1.04,rr*2.08,rr*2.08);\n      }\n    }\n  }\n}\n\nfunction finish(){\n  if(done)return;done=true;cancelAnimationFrame(raf);\n  ov.classList.add('cc-out');\n  legal.classList.add('on');\n  setTimeout(function(){ov.style.display='none';},600);\n  document.getElementById('cc-chk').focus();\n}\ndocument.getElementById('cc-skip').addEventListener('click',finish);\nov.addEventListener('click',finish);\ndocument.addEventListener('keydown',function(e){if(!done&&(e.key==='Escape'||e.key===' '))finish();});\n\nvar chk=document.getElementById('cc-chk'),yes=document.getElementById('cc-yes');\nchk.addEventListener('change',function(){yes.disabled=!chk.checked;if(chk.checked)legal.classList.remove('denied');});\ndocument.getElementById('cc-no').addEventListener('click',function(){legal.classList.add('denied');chk.checked=false;yes.disabled=true;});\nyes.addEventListener('click',function(){\n  if(!chk.checked)return;\n  try{localStorage.setItem('cabocalc.aviso',new Date().toISOString());}catch(err){}\n  legal.classList.remove('on');\n  root.classList.remove('cc-lock');document.body.classList.remove('cc-lock');\n  ov.remove();\n});\nraf=requestAnimationFrame(frame);\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
