 === \"filete\") ? \"none\" : \"flex\";\n    calcular();\n  }\n\n  function setModo(m){ _modo = m; modoAplicar(); calcular(); }\n  function modoAplicar(){\n    var ver = (_modo === \"ver\"), esc = (_modo === \"esc\"), dim = (_modo === \"dim\");\n    $(\"mb-dim\").setAttribute(\"aria-selected\", String(dim));\n    $(\"mb-ver\").setAttribute(\"aria-selected\", String(ver));\n    $(\"mb-esc\").setAttribute(\"aria-selected\", String(esc));\n\n    // cards exclusivos de cada modo\n    $(\"cardDiam\").style.display  = ver ? \"block\" : \"none\";\n    $(\"cardEsf\").style.display   = esc ? \"none\"  : \"block\";\n    $(\"cardEsc\").style.display   = esc ? \"block\" : \"none\";\n    $(\"cardCar\").style.display   = esc ? \"block\" : \"none\";\n    $(\"cardSec\").style.display   = esc ? \"block\" : \"none\";\n    $(\"cardDesenho\").style.display = esc ? \"block\" : \"none\";\n    $(\"detSecRes\").style.display = esc ? \"block\" : \"none\";\n    $(\"detVarre\").style.display  = esc ? \"none\"  : \"block\";\n    $(\"detComp\").style.display   = esc ? \"none\"  : \"block\";\n    $(\"fNdim\").style.display     = (ver || esc) ? \"none\" : \"flex\";\n    $(\"thComp\").textContent      = ver ? \"n mín.\" : \"d mín. [mm]\";\n\n    // campos que mudam de significado no escalonado\n    $(\"fViga\").style.display   = esc ? \"none\"  : \"flex\";\n    $(\"fMc\").style.display     = esc ? \"none\"  : \"flex\";\n    $(\"fTheta\").style.display  = esc ? \"none\"  : \"flex\";\n    $(\"fTorTot\").style.display = esc ? \"flex\"  : \"none\";\n    $(\"tabDesc\").style.display = esc ? \"none\"  : \"\";\n\n    if(esc) XUI.iniciar();\n  }\n\n  function usarComercial(){\n    var v = $(\"i_dcom\").value;\n    if(v){ $(\"i_d\").value = v; $(\"i_dcom\").value = \"\"; }\n    calcular();\n  }\n\n  function aba(id, bt){\n    [\"fad\",\"des\",\"def\",\"din\"].forEach(function(k){ $(\"p_\"+k).classList.toggle(\"on\", k===id); });\n    bt.parentNode.querySelectorAll(\"button\").forEach(function(b){\n      b.setAttribute(\"aria-selected\", String(b === bt));\n    });\n  }\n\n  /* ---------- núcleo ---------- */\n  function calcular(){\n    if(_modo === \"esc\"){\n      // no escalonado os fatores K dependem do diâmetro de cada seção, calculados lá dentro;\n      // aqui só mantemos os campos coerentes com o modo automático\n      if($(\"i_autoK\").checked){\n        $(\"i_ka\").value = ENG.fKa(parseFloat($(\"i_sut\").value), $(\"i_acab\").value).toFixed(3);\n        $(\"i_kc\").value = \"1.000\";\n        var kdx = ENG.fKd(parseFloat($(\"i_temp\").value));\n        $(\"i_kd\").value = isFinite(kdx) ? kdx.toFixed(3) : \"—\";\n        $(\"i_ke\").value = ENG.fKe($(\"i_conf\").value).toFixed(3);\n        $(\"i_kb\").value = \"por seção\";\n        [\"i_ka\",\"i_kb\",\"i_kc\",\"i_kd\",\"i_ke\"].forEach(function(id){ $(id).readOnly = true; });\n      } else {\n        [\"i_ka\",\"i_kc\",\"i_kd\",\"i_ke\"].forEach(function(id){ $(id).readOnly = false; });\n        $(\"i_kb\").readOnly = true; $(\"i_kb\").value = \"por seção\";\n      }\n      $(\"boxAutoK\").style.display = $(\"i_autoK\").checked ? \"grid\" : \"none\";\n      XUI.calc();\n      salvar();\n      return;\n    }\n\n    var p, val;\n    try{\n      p = ler();\n    } catch(err){\n      $(\"msgs\").innerHTML = '<div class=\"msg e\">Falha interna ao ler os campos: '\n        + err.message + '. Isso é um defeito do programa, não da sua entrada.<\u002Fdiv>';\n      $(\"vd\").className = \"verdict bad\";\n      $(\"vd_tag\").textContent = \"Erro interno\";\n      $(\"vd_big\").textContent = \"—\";\n      $(\"vd_cap\").textContent = \"Reporte a mensagem acima.\";\n      return;\n    }\n\n    val = ENG.validar(p);\n\n    // Kb sempre exibido; demais K quando automáticos\n    if(p.autoK){\n      var dRef = (_modo === \"ver\" && p.d > 0) ? p.d : (ultimo && ultimo.dCom ? ultimo.dCom : 40);\n      $(\"i_ka\").value = ENG.fKa(p.sut, p.acab).toFixed(3);\n      $(\"i_kb\").value = ENG.fKb(dRef).toFixed(3);\n      $(\"i_kc\").value = \"1.000\";\n      var kd = ENG.fKd(p.temp);\n      $(\"i_kd\").value = isFinite(kd) ? kd.toFixed(3) : \"—\";\n      $(\"i_ke\").value = ENG.fKe(p.conf).toFixed(3);\n      [\"i_ka\",\"i_kb\",\"i_kc\",\"i_kd\",\"i_ke\"].forEach(function(id){ $(id).readOnly = true; });\n    } else {\n      [\"i_ka\",\"i_kc\",\"i_kd\",\"i_ke\"].forEach(function(id){ $(id).readOnly = false; });\n      $(\"i_kb\").readOnly = true;\n      $(\"i_kb\").value = ENG.fKb((_modo===\"ver\" && p.d>0) ? p.d : 40).toFixed(3);\n    }\n    $(\"boxAutoK\").style.display = p.autoK ? \"grid\" : \"none\";\n\n    $(\"h_ymax\").textContent = (p.l > 0)\n      ? \"L/1000 = \" + fmt(p.l/1000, 3) + \" mm  ·  L/2000 = \" + fmt(p.l/2000, 3) + \" mm\" : \"—\";\n\n    // mensagens\n    var mh = \"\";\n    val.erros.forEach(function(t){ mh += '<div class=\"msg e\">'+t+'<\u002Fdiv>'; });\n    val.avisos.forEach(function(t){ mh += '<div class=\"msg w\">'+t+'<\u002Fdiv>'; });\n    $(\"msgs\").innerHTML = mh;\n\n    if(val.erros.length){\n      $(\"vd\").className = \"verdict bad\";\n      $(\"vd_tag\").textContent = \"Dados inconsistentes\";\n      $(\"vd_big\").textContent = \"—\";\n      $(\"vd_cap\").textContent = \"Corrija os itens indicados abaixo.\";\n      $(\"rows\").innerHTML = \"\";\n      $(\"outTens\").innerHTML = \"\";\n      $(\"outMem\").innerHTML = \"\";\n      $(\"tbVarre\").innerHTML = \"\";\n      $(\"tbComp\").innerHTML = \"\";\n      $(\"outKf\").innerHTML = \"\";\n      $(\"outDin\").innerHTML = \"\";\n      return;\n    }\n\n    if(_modo === \"ver\") verificar(p, val); else dimensionar(p, val);\n    varredura(p);\n    comparar(p);\n    salvar();\n  }\n\n  /* ---------- modo VERIFICAR ---------- */\n  function verificar(p, val){\n    var av = ENG.avaliar(p, p.d);\n    ultimo = {modo:\"ver\", d:p.d, av:av, p:p};\n\n    var ok = av.nMin >= p.nAlvo;\n    var quase = !ok && av.nMin >= 0.9*p.nAlvo;\n    $(\"vd\").className = \"verdict \" + (ok ? \"ok\" : (quase ? \"warn\" : \"bad\"));\n    $(\"vd_tag\").textContent = ok ? \"Aprovado\" : (quase ? \"Marginal\" : \"Reprovado\");\n    $(\"vd_big\").textContent = fmtN(av.nMin);\n    var govNome = \"—\";\n    av.criterios.forEach(function(c){ if(c.id === av.gov) govNome = c.nome; });\n    $(\"vd_cap\").innerHTML = \"menor fator de segurança · governa <b>\" + govNome + \"<\u002Fb><br>\" +\n      \"d₀ = \" + fmt(p.d,2) + \" mm · exigido n ≥ \" + fmt(p.nAlvo,2);\n\n    // linhas\n    var h = '<div class=\"row head\"><span>Critério<\u002Fspan><span>n<\u002Fspan><\u002Fdiv>';\n    av.criterios.forEach(function(c){\n      var cls = c.ativo ? classeN(c.n, p.nAlvo) : \"\";\n      var pct = c.ativo ? Math.max(2, Math.min(100, 100*p.nAlvo/Math.max(c.n,1e-9))) : 0;\n      h += '<div class=\"row '+(c.id===av.gov?\"gov\":\"\")+(c.ativo?\"\":\" off\")+'\">'\n        +  '<span class=\"nm\"><b>'+c.nome+'<\u002Fb><small>'+c.norma+'<\u002Fsmall><\u002Fspan>'\n        +  '<span class=\"vl '+cls+'\">'+(c.ativo?fmtN(c.n):\"inativo\")+'<\u002Fspan>'\n        +  (c.ativo ? '<span class=\"bar\"><i class=\"'+(cls||\"ok\")+'\" style=\"width:'+pct.toFixed(1)+'%\"><\u002Fi><\u002Fspan>' : '')\n        +  '<\u002Fdiv>';\n    });\n    $(\"rows\").innerHTML = h;\n\n    tensoesPainel(p, av);\n    memoria(p, av, null);\n    painelKf(av);\n    painelDin(p, av);\n  }\n\n  /* ---------- modo DIMENSIONAR ---------- */\n  function dimensionar(p, val){\n    var r = ENG.dimensionar(p);\n    ultimo = {modo:\"dim\", dReq:r.dReq, dCom:r.dCom, av:r.av, p:p, res:r};\n\n    var inviavel = r.criterios.some(function(c){ return c.estado === \"inviavel\"; });\n    $(\"vd\").className = \"verdict \" + (inviavel ? \"bad\" : \"ok\");\n    $(\"vd_tag\").textContent = inviavel ? \"Sem solução na faixa\" : \"Diâmetro comercial\";\n    $(\"vd_big\").textContent = inviavel ? \"—\" : fmt(r.dCom, 0) + \" mm\";\n    var govNome = \"—\";\n    r.criterios.forEach(function(c){ if(c.id === r.gov) govNome = c.nome; });\n    var cap = \"mínimo exato \" + fmt(r.dReq,2) + \" mm · governa <b>\" + govNome + \"<\u002Fb>\";\n    if(p.c > 0) cap += \"<br>interno d<sub>i<\u002Fsub> = \" + fmt(r.dCom*p.c, 2) + \" mm\";\n    cap += \"<br>na bitola adotada n = <b>\" + fmtN(r.av.nMin) + \"<\u002Fb> · massa \" + fmt(r.av.massa,2) + \" kg\";\n    $(\"vd_cap\").innerHTML = cap;\n\n    var h = '<div class=\"row head\"><span>Critério<\u002Fspan><span>d exigido<\u002Fspan><\u002Fdiv>';\n    r.criterios.forEach(function(c){\n      var txt, cls = \"\";\n      if(c.estado === \"ok\"){ txt = fmt(c.d,2)+\" mm\"; }\n      else if(c.estado === \"folgado\"){ txt = \"não limita\"; cls = \"ok\"; }\n      else if(c.estado === \"inviavel\"){ txt = \"inviável\"; cls = \"bad\"; }\n      else { txt = \"inativo\"; }\n      var pct = (c.estado === \"ok\" && r.dReq > 0) ? 100*c.d/r.dReq : 0;\n      h += '<div class=\"row '+(c.id===r.gov?\"gov\":\"\")+(c.estado===\"ok\"?\"\":\" off\")+'\">'\n        +  '<span class=\"nm\"><b>'+c.nome+'<\u002Fb><small>'+c.norma+'<\u002Fsmall><\u002Fspan>'\n        +  '<span class=\"vl '+cls+'\">'+txt+'<\u002Fspan>'\n        +  (pct>0 ? '<span class=\"bar\"><i class=\"ok\" style=\"width:'+pct.toFixed(1)+'%\"><\u002Fi><\u002Fspan>' : '')\n        +  '<\u002Fdiv>';\n    });\n    $(\"rows\").innerHTML = h;\n\n    tensoesPainel(p, r.av);\n    memoria(p, r.av, r);\n    painelKf(r.av);\n    painelDin(p, r.av);\n  }\n\n  /* ---------- painéis auxiliares ---------- */\n  function tensoesPainel(p, av){\n    var t = av.tens;\n    var rows = [\n      [\"σ<sub>a<\u002Fsub> flexão alternada\", fmt(t.sa,2)+\" MPa\"],\n      [\"σ<sub>m<\u002Fsub> flexão média\", fmt(t.sm,2)+\" MPa\"],\n      [\"τ<sub>a<\u002Fsub> torção alternada\", fmt(t.ta,2)+\" MPa\"],\n      [\"τ<sub>m<\u002Fsub> torção média\", fmt(t.tm,2)+\" MPa\"],\n      [\"σ' von Mises máx.\", fmt(av.vonMises,2)+\" MPa\"],\n      [\"S<sub>e<\u002Fsub> limite corrigido\", fmt(av.lf.Se,1)+\" MPa\"],\n      [\"θ real\", fmt(av.theta,4)+\" °/m\"],\n      [\"y real\", fmt(av.y,4)+\" mm\"],\n      [\"inclinação no apoio\", fmt(av.incl,5)+\" rad\"],\n      [\"N<sub>cr<\u002Fsub>\", isFinite(av.vc.N)? fmt(av.vc.N,0)+\" rpm\" : \"—\"],\n      [\"massa do trecho\", fmt(av.massa,2)+\" kg\"]\n    ];\n    $(\"outTens\").innerHTML = rows.map(function(r){\n      return \"<dt>\"+r[0]+\"<\u002Fdt><dd>\"+r[1]+\"<\u002Fdd>\";\n    }).join(\"\");\n  }\n\n  function painelKf(av){\n    var k = av.k;\n    var rows = [[\"fonte\", k.fonte]];\n    if(isFinite(k.Kt))  rows.push([\"K<sub>t<\u002Fsub> flexão\", fmt(k.Kt,3)]);\n    if(isFinite(k.Kts)) rows.push([\"K<sub>ts<\u002Fsub> torção\", fmt(k.Kts,3)]);\n    if(isFinite(k.r) && k.r !== Infinity) rows.push([\"raio efetivo r\", fmt(k.r,3)+\" mm\"]);\n    if(isFinite(k.qf))  rows.push([\"q flexão\", fmt(k.qf,3)]);\n    if(isFinite(k.qt))  rows.push([\"q torção\", fmt(k.qt,3)]);\n    rows.push([\"K<sub>f<\u002Fsub> flexão\", fmt(k.Kf,3)]);\n    rows.push([\"K<sub>fs<\u002Fsub> torção\", fmt(k.Kfs,3)]);\n    $(\"outKf\").innerHTML = rows.map(function(r){\n      return \"<dt>\"+r[0]+\"<\u002Fdt><dd>\"+r[1]+\"<\u002Fdd>\";\n    }).join(\"\");\n  }\n\n  function painelDin(p, av){\n    var rows;\n    if(!(p.rpm > 0) || !isFinite(av.vc.N)){\n      rows = [[\"situação\",\"critério inativo — informe uma rotação de trabalho\"]];\n      if(isFinite(av.vc.N)){\n        rows.push([\"N<sub>cr<\u002Fsub> estimada\", fmt(av.vc.N,0)+\" rpm\"]);\n        rows.push([\"f₁\", fmt(av.vc.f,2)+\" Hz\"]);\n      }\n    } else {\n      var marg = av.vc.N/Math.max(p.rpm,1e-9);\n      rows = [\n        [\"frequência natural f₁\", fmt(av.vc.f,2)+\" Hz\"],\n        [\"velocidade crítica N<sub>cr<\u002Fsub>\", fmt(av.vc.N,0)+\" rpm\"],\n        [\"rotação de trabalho\", fmt(p.rpm,0)+\" rpm\"],\n        [\"margem N<sub>cr<\u002Fsub>/N\", fmt(marg,2)+\"×\"],\n        [\"exigida\", fmt(p.margem,2)+\"×\"],\n        [\"situação\", marg >= p.margem\n            ? \"<span class='pill ok'>adequada<\u002Fspan>\"\n            : (marg >= 1 ? \"<span class='pill warn'>margem insuficiente<\u002Fspan>\"\n                         : \"<span class='pill bad'>opera acima da crítica<\u002Fspan>\")]\n      ];\n    }\n    $(\"outDin\").innerHTML = rows.map(function(r){\n      return \"<dt>\"+r[0]+\"<\u002Fdt><dd>\"+r[1]+\"<\u002Fdd>\";\n    }).join(\"\");\n  }\n\n  function memoria(p, av, r){\n    var v = ENG.VIGA[p.viga];\n    var rows = [\n      [\"modo\", _modo === \"ver\" ? \"verificação de diâmetro\" : \"dimensionamento\"],\n      [\"material\", $(\"i_mat\").value === \"custom\" ? \"entrada manual\" : ENG.MAT[$(\"i_mat\").value].n],\n      [\"Sy / Sut\", fmt(p.sy,0)+\" / \"+fmt(p.sut,0)+\" MPa\"],\n      [\"E / G\", fmt(p.e,1)+\" / \"+fmt(p.g,1)+\" GPa\"],\n      [\"M<sub>a<\u002Fsub> = √(My²+Mz²)\", fmt(p.Ma,2)+\" N·m\"],\n      [\"M<sub>m<\u002Fsub> / T<sub>a<\u002Fsub> / T<sub>m<\u002Fsub>\", fmt(p.Mm,1)+\" / \"+fmt(p.Ta,1)+\" / \"+fmt(p.Tm,1)+\" N·m\"],\n      [\"critério de fadiga\", $(\"i_crit\").options[$(\"i_crit\").selectedIndex].text],\n      [\"S'<sub>e<\u002Fsub> base\", fmt(av.lf.SeLinha,1)+\" MPa\"+(p.ferroso?\" (0,5·Sut, piso 200 MPa)\":\" (0,4·Sut)\")],\n      [\"Ka · Kb · Kc · Kd · Ke\", fmt(av.lf.ka,3)+\" · \"+fmt(av.lf.kb,3)+\" · \"+fmt(av.lf.kc,3)\n          +\" · \"+fmt(av.lf.kd,3)+\" · \"+fmt(av.lf.ke,3)],\n      [\"S<sub>e<\u002Fsub>\", fmt(av.lf.Se,1)+\" MPa\"],\n      [\"K<sub>f<\u002Fsub> / K<sub>fs<\u002Fsub>\", fmt(av.k.Kf,3)+\" / \"+fmt(av.k.Kfs,3)+\"  (\"+av.k.fonte+\")\"],\n      [\"seção: h = 1−c⁴\", fmt(av.sec.h,4)],\n      [\"I / J\", fmt(av.sec.I,0)+\" / \"+fmt(av.sec.J,0)+\" mm⁴\"],\n      [\"modelo de viga\", v.nome+\"  ·  y = \"+fmt(v.ky,4)+\"·M·L²/(E·I)\"],\n      [\"n alvo\", fmt(p.nAlvo,2)]\n    ];\n    if(r){\n      rows.push([\"d mínimo exato\", fmt(r.dReq,3)+\" mm\"]);\n      rows.push([\"bitola adotada\", fmt(r.dCom,0)+\" mm  (n = \"+fmtN(av.nMin)+\")\"]);\n    } else {\n      rows.push([\"d verificado\", fmt(p.d,2)+\" mm\"]);\n      rows.push([\"n mínimo obtido\", fmtN(av.nMin)]);\n    }\n    $(\"outMem\").innerHTML = rows.map(function(x){\n      return \"<dt>\"+x[0]+\"<\u002Fdt><dd>\"+x[1]+\"<\u002Fdd>\";\n    }).join(\"\");\n  }\n\n  /* ---------- varredura de bitolas ---------- */\n  function varredura(p){\n    var alvo = p.nAlvo;\n    var destaque = (_modo === \"ver\") ? null : (ultimo && ultimo.dCom);\n    var html = \"\";\n    ENG.BITOLAS.forEach(function(b){\n      var av = ENG.avaliar(p, b);\n      var cel = {};\n      av.criterios.forEach(function(c){ cel[c.id] = c; });\n      function td(id){\n        var c = cel[id];\n        if(!c || !c.ativo) return \"<td>—<\u002Ftd>\";\n        return '<td class=\"'+classeN(c.n,alvo)+'\" style=\"color:var(--'+\n          (classeN(c.n,alvo)===\"ok\"?\"ok\":classeN(c.n,alvo)===\"warn\"?\"warn\":\"bad\")+')\">'+fmtN(c.n)+\"<\u002Ftd>\";\n      }\n      var ok = av.nMin >= alvo;\n      var quase = !ok && av.nMin >= 0.9*alvo;\n      var pick = (destaque && b === destaque) ||\n                 (_modo === \"ver\" && Math.abs(b - p.d) < 0.5);\n      html += '<tr class=\"'+(pick?\"pick\":\"\")+'\"><td>'+b+\"<\u002Ftd>\"\n           + td(\"est\")+td(\"fad\")+td(\"rig\")+td(\"def\")+td(\"inc\")+td(\"vel\")\n           + \"<td><b>\"+fmtN(av.nMin)+\"<\u002Fb><\u002Ftd>\"\n           + '<td><span class=\"pill '+(ok?\"ok\":quase?\"warn\":\"bad\")+'\">'\n           + (ok?\"aprovado\":quase?\"marginal\":\"reprovado\")+\"<\u002Fspan><\u002Ftd><\u002Ftr>\";\n    });\n    $(\"tbVarre\").innerHTML = html;\n  }\n\n  /* ---------- comparação de materiais ---------- */\n  function comparar(p){\n    var html = \"\";\n    var chaves = Object.keys(ENG.MAT);\n    chaves.forEach(function(k){\n      var m = ENG.MAT[k];\n      var q = {};\n      for(var x in p) q[x] = p[x];\n      q.sy = m.Sy; q.sut = m.Sut; q.e = m.E; q.g = m.G; q.rho = m.rho; q.ferroso = !!m.fe;\n\n      var col, situ, massa, se;\n      if(_modo === \"ver\"){\n        var av = ENG.avaliar(q, p.d);\n        se = av.lf.Se; massa = av.massa;\n        col = fmtN(av.nMin);\n        var ok = av.nMin >= p.nAlvo, quase = !ok && av.nMin >= 0.9*p.nAlvo;\n        situ = '<span class=\"pill '+(ok?\"ok\":quase?\"warn\":\"bad\")+'\">'+(ok?\"aprovado\":quase?\"marginal\":\"reprovado\")+\"<\u002Fspan>\";\n      } else {\n        var r = ENG.dimensionar(q);\n        se = r.av.lf.Se; massa = r.av.massa;\n        col = isFinite(r.dReq) && r.dReq > 0 ? fmt(r.dReq,1)+\"  (\"+r.dCom+\")\" : \"—\";\n        situ = '<span class=\"pill '+(k === $(\"i_mat\").value ? \"ok\" : \"\")+'\">'\n             + (k === $(\"i_mat\").value ? \"selecionado\" : \"—\")+\"<\u002Fspan>\";\n      }\n      html += \"<tr\"+(k === $(\"i_mat\").value ? ' class=\"pick\"' : \"\")+\"><td>\"+m.n+\"<\u002Ftd>\"\n           + \"<td>\"+m.Sy+\"<\u002Ftd><td>\"+m.Sut+\"<\u002Ftd><td>\"+fmt(se,0)+\"<\u002Ftd>\"\n           + \"<td>\"+col+\"<\u002Ftd><td>\"+fmt(massa,2)+\"<\u002Ftd><td>\"+situ+\"<\u002Ftd><\u002Ftr>\";\n    });\n    $(\"tbComp\").innerHTML = html;\n  }\n\n  /* ---------- persistência ---------- */\n  function salvar(){\n    var d = {_v:\"3.0\"};\n    document.querySelectorAll(\"input,select\").forEach(function(el){\n      if(!el.id) return;\n      d[el.id] = (el.type === \"checkbox\") ? el.checked : el.value;\n    });\n    d._modo = _modo;\n    d._x = XUI.dump();\n    try{ localStorage.setItem(CHAVE, JSON.stringify(d)); }catch(e){}\n  }\n  function carregar(){\n    var raw = null;\n    try{ raw = localStorage.getItem(CHAVE); }catch(e){}\n    if(!raw) return;\n    try{\n      var d = JSON.parse(raw);\n      if(d._v !== \"3.0\") return;            // versionado: não mistura formatos\n      aplicar(d);\n    }catch(e){}\n  }\n  function aplicar(d){\n    Object.keys(d).forEach(function(k){\n      if(k.charAt(0) === \"_\") return;\n      var el = document.getElementById(k);\n      if(!el) return;\n      if(el.type === \"checkbox\") el.checked = !!d[k]; else el.value = d[k];\n    });\n    if(d._x) XUI.load(d._x);\n    if(d._modo) _modo = d._modo;\n  }\n\n  function exportar(){\n    var d = {}; \n    document.querySelectorAll(\"input,select\").forEach(function(el){\n      if(!el.id) return;\n      d[el.id] = (el.type === \"checkbox\") ? el.checked : el.value;\n    });\n    var pacote = {\n      _v:\"3.0\", _modo:_modo, _x:XUI.dump(),\n      gerado: new Date().toISOString(),\n      entradas: d,\n      resultado: (_modo === \"esc\" && XUI.ultimo()) ? (function(){\n        var u = XUI.ultimo();\n        return {modo:\"escalonado\", nMin:u.R.nMin, governante:u.R.govNome,\n                flechaMax:u.R.yMax, torcaoTotal:u.R.torcaoTotal,\n                velCritica:u.R.vc.N, massa:u.R.massa,\n                secoes:u.R.secoes.map(function(s){\n                  return {rotulo:s.rotulo, x:s.x, d:s.d, M:s.M, T:s.T,\n                          Kf:s.Kf, nEst:s.nEst, nFad:s.nFad, nMin:s.nMin}; })};\n      })() : ultimo ? (ultimo.modo === \"ver\"\n        ? {modo:\"verificacao\", d:ultimo.d, nMin:ultimo.av.nMin, governante:ultimo.av.gov}\n        : {modo:\"dimensionamento\", dExato:ultimo.dReq, dComercial:ultimo.dCom,\n           governante:ultimo.res.gov, nNaBitola:ultimo.av.nMin}) : null\n    };\n    var a = document.createElement(\"a\");\n    a.href = \"data:application/json;charset=utf-8,\" + encodeURIComponent(JSON.stringify(pacote,null,2));\n    a.download = \"eixo_\" + new Date().toISOString().slice(0,10) + \".json\";\n    a.click();\n  }\n\n  function importar(){\n    var inp = document.createElement(\"input\");\n    inp.type = \"file\"; inp.accept = \".json,application/json\";\n    inp.onchange = function(){\n      var f = inp.files && inp.files[0];\n      if(!f) return;\n      var fr = new FileReader();\n      fr.onload = function(){\n        try{\n          var o = JSON.parse(fr.result);\n          var d = o.entradas || o;\n          if(o._v && o._v !== \"3.0\"){\n            alert(\"Arquivo gerado na versão \" + o._v + \". Os campos podem não corresponder; revise as entradas depois de importar.\");\n          }\n          aplicar(d);\n          i n    };\n    for(var k in (ov||{})) p[k] = ov[k];\n    return p;\n  }\n  function prox(a,b,tol){ return Math.abs(a-b) <= (tol||1e-6)*Math.max(1,Math.abs(b)); }\n\n  function rodar(){\n    var itens = [];\n    function T(nome, cond, det){ itens.push({nome:nome, ok:!!cond, det:det||\"\"}); }\n\n    // 1. seção maciça\n    var s = ENG.secao(40, 0);\n    T(\"Módulo de flexão S de eixo maciço d=40\",\n      prox(s.S, Math.PI*64000/32, 1e-9), \"S=\"+s.S.toFixed(2));\n\n    // 2. fator de vazado\n    var sv = ENG.secao(40, 0.5);\n    T(\"Fator h = 1−c⁴ para c=0,5\", prox(sv.h, 1-Math.pow(0.5,4), 1e-12), \"h=\"+sv.h);\n\n    // 3. piso de Se' em ferroso\n    T(\"S'e ferroso nunca abaixo de 200 MPa\",\n      ENG.SeLinha(240, true) === 200, \"Sut=240 → S'e=\"+ENG.SeLinha(240,true));\n\n    // 4. Se' de 0,5·Sut na faixa usual\n    T(\"S'e = 0,5·Sut para Sut=630\", prox(ENG.SeLinha(630,true), 315, 1e-12));\n\n    // 5. Kb por faixa\n    T(\"Kb(40) na faixa 2,79–51 mm\", prox(ENG.fKb(40), 1.24*Math.pow(40,-0.107), 1e-12),\n      \"Kb=\"+ENG.fKb(40).toFixed(4));\n    T(\"Kb decresce com o diâmetro\", ENG.fKb(100) < ENG.fKb(30));\n\n    // 6. Ka limitado a 1\n    T(\"Ka ≤ 1 sempre\", ENG.fKa(200,\"retificado\") <= 1);\n\n    // 7. Kd neutro à temperatura ambiente\n    T(\"Kd = 1 a 20 °C\", ENG.fKd(20) === 1);\n    T(\"Kd < 1 a 400 °C\", ENG.fKd(400) < 1, \"Kd=\"+ENG.fKd(400).toFixed(4));\n\n    // 8. q de Neuber entre 0 e 1\n    var qq = ENG.q(ENG.raizA_flex(630), 0.8);\n    T(\"q de Neuber em (0,1]\", qq > 0 && qq <= 1, \"q=\"+qq.toFixed(4));\n\n    // 9. tensão nominal conferida à mão\n    var p = base();\n    var t = ENG.tensoes(p, 40);\n    var saMao = 200*1000/(Math.PI*64000/32);\n    T(\"σa nominal confere com o cálculo manual\", prox(t.sa, saMao, 1e-9),\n      \"σa=\"+t.sa.toFixed(3)+\" MPa\");\n    var tmMao = 150*1000/(Math.PI*64000/16);\n    T(\"τm nominal confere com o cálculo manual\", prox(t.tm, tmMao, 1e-9),\n      \"τm=\"+t.tm.toFixed(3)+\" MPa\");\n\n    // 10. von ction calc(){\n    var P = ler();\n    var v = validar(P);\n    var mh = \"\";\n    v.erros.forEach(function(x){ mh += '<div class=\"msg e\">'+esc(x)+'<\u002Fdiv>'; });\n    v.avisos.forEach(function(x){ mh += '<div class=\"msg w\">'+esc(x)+'<\u002Fdiv>'; });\n    $(\"msgs\").innerHTML = mh;\n\n    $(\"hx_L\").textContent = \"comprimento total: \" + fmt(P.L,0) + \" mm\";\n    var st = 0; CAR.forEach(function(c){ st += (c.T||0); });\n    $(\"hx_bal\").innerHTML = Math.abs(st) < 1e-6\n      ? '<span class=\"pill ok\">torques equilibrados<\u002Fspan>'\n      : '<span class=\"pill bad\">torque residual '+fmt(st,1)+' N·m<\u002Fspan>';\n\n    if(v.erros.length){\n      $(\"vd\").className = \"verdict bad\";\n      $(\"vd_tag\").textContent = \"Dados inconsistentes\";\n      $(\"vd_big\").textContent = \"—\";\n      $(\"vd_cap\").textContent = \"Corrija os itens listados.\";\n      $(\"rows\").innerHTML = \"\"; $(\"xSvg\").innerHTML = \"\";\n      $(\"tbSecRes\").innerHTML = \"\"; $(\"outTens\").innerHTML = \"\";\n      return;\n    }\n\n    var R;\n    try{ R = ENGX.resolver(P); }\n    catch(err){\n      $(\"msgs\").innerHTML = '<div class=\"msg e\">Falha interna no solver: '+esc(err.message)\n        +'. Isso é defeito do programa.<\u002Fdiv>';\n      return;\n    }\n    ult = {P:P, R:R};\n    renderSec();\n\n    // veredito\n    var ok = R.nMin >= P.nAlvo, quase = !ok && R.nMin >= 0.9*P.nAlvo;\n    $(\"vd\").className = \"verdict \" + (ok ? \"ok\" : quase ? \"warn\" : \"bad\");\n    $(\"vd_tag\").textContent = ok ? \"Aprovado\" : quase ? \"Marginal\" : \"Reprovado\";\n    $(\"vd_big\").textContent = fmtN(R.nMin);\n    $(\"vd_cap\").innerHTML = \"menor fator do eixo · governa <b>\"+esc(R.govNome)+\"<\u002Fb><br>\"\n      + \"massa \"+fmt(R.massa,2)+\" kg · flecha máx. \"+fmt(R.yMax,4)+\" mm em x = \"+fmt(R.xyMax,0)+\" mm\";\n\n    // linhas: globais + seções\n    var h = '<div class=\"row head\"><span>Critério global<\u002Fspan><span>n<\u002Fspan><\u002Fdiv>';\n    R.glo ult; }};\n})();\n/* ===XUI_END=== */\n\nUI.montar();\nUI.calcular();\n<\u002Fscript>\n<script>\n/* ================= tela de abertura — eixo escalonado em mancais (WebGL puro) ================= */\n(function(){\n  var root = document.getElementById(\"om-splash\");\n  if(!root) return;\n  var cv = document.getElementById(\"om-cv\");\n  var hud = document.getElementById(\"om-hud\");\n  var legal = document.getElementById(\"om-legal\");\n  var skip = document.getElementById(\"om-skip\");\n  var accept = document.getElementById(\"om-accept\");\n  var raf = null, dead = false;\n  var reduce = window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n\n  document.documentElement.style.overflow = \"hidden\";\n\n  function showLegal(){\n    if(legal.classList.contains(\"om-in\")) return;\n    legal.classList.add(\"om-in\");\n    hud.classList.remove(\"om-in\");\n    skip.style.display = \"none\";\n    setTimeout(function(){ try{ accept.focus(); }catch(e){} }, 350);\n  }\n  function close(){\n    dead = true;\n    if(raf) cancelAnimationFrame(raf);\n    root.classList.add(\"om-gone\");\n    document.documentElement.style.overflow = \"\";\n    setTimeout(function(){ if(root.parentNode) root.parentNode.removeChild(root); }, 700);\n  }\n  skip.addEventListener(\"click\", showLegal);\n  accept.addEventListener(\"click\", close);\n  root.addEventListener(\"keydown\", function(e){ if(e.key === \"Escape\") showLegal(); });\n\n  /* ---------------- mat4 mínima ---------------- */\n  function mul(a,b){\n    var o = new Float32Array(16), i, j, s;\n    for(i=0;i<4;i++) for(j=0;j<4;j++){\n      s = 0; for(var k=0;k<4;k++) s += a[k*4+j]*b[i*4+k];\n      o[i*4+j] = s;\n    }\n    return o;\n  }\n  function persp(fovy,asp,n,f){\n    var t = 1/Math.tan(fovy/2), o = new Float32Array(16);\n    o[0]=t/asp; o[5]=t; o[10]=(f+n)/(n-f); o[11]=-1; o[14]=2*f*n/(n-f);\n    return o;\n  }\n  function look(e,c,u){\n    var z=[e[0]-c[0],e[1]-c[1],e[2]-c[2]], l=Math.hypot(z[0],z[1],z[2]);\n    z=[z[0]/l,z[1]/l,z[2]/l];\n    var x=[u[1]*z[2]-u[2]*z[1], u[2]*z[0]-u[0]*z[2], u[0]*z[1]-u[1]*z[0]];\n    l=Math.hypot(x[0],x[1],x[2]); x=[x[0]/l,x[1]/l,x[2]/l];\n    var y=[z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];\n    return new Float32Array([\n      x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,\n      -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),\n      -(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),\n      -(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]), 1]);\n  }\n  function trs(tx,ty,tz,rx){\n    var c=Math.cos(rx), s=Math.sin(rx);\n    return new Float32Array([1,0,0,0, 0,c,s,0, 0,-s,c,0, tx,ty,tz,1]);\n  }\n\n  /* ---------------- malhas ---------------- */\n  function lathe(prof, segs){\n    var P=[], N=[], i, j;\n    for(i=0;i<prof.length-1;i++){\n      var a=prof[i], b=prof[i+1];\n      var dx=b.x-a.x, dr=b.r-a.r, l=Math.hypot(dx,dr) || 1e-6;\n      var nx=-dr/l, nr=dx/l;\n      for(j=0;j<segs;j++){\n        var t0=j/segs*Math.PI*2, t1=(j+1)/segs*Math.PI*2;\n        var c0=Math.cos(t0), s0=Math.sin(t0), c1=Math.cos(t1), s1=Math.sin(t1);\n        var v00=[a.x,a.r*c0,a.r*s0], v01=[a.x,a.r*c1,a.r*s1];\n        var v10=[b.x,b.r*c0,b.r*s0], v11=[b.x,b.r*c1,b.r*s1];\n        var n0=[nx,nr*c0,nr*s0], n1=[nx,nr*c1,nr*s1];\n        P.push(v00[0],v00[1],v00[2], v01[0],v01[1],v01[2], v11[0],v11[1],v11[2],\n               v00[0],v00[1],v00[2], v11[0],v11[1],v11[2], v10[0],v10[1],v10[2]);\n        N.push(n0[0],n0[1],n0[2], n1[0],n1[1],n1[2], n1[0],n1[1],n1[2],\n               n0[0],n0[1],n0[2], n1[0],n1[1],n1[2], n0[0],n0[1],n0[2]);\n      }\n    }\n    return {p:P, n:N};\n  }\n  function box(cx,cy,cz,sx,sy,sz){\n    var P=[], N=[];\n    var hx=sx/2, hy=sy/2, hz=sz/2;\n    var f = [\n      [[ 1,0,0],[hx,-hy,-hz],[hx,hy,-hz],[hx,hy,hz],[hx,-hy,hz]],\n      [[-1,0,0],[-hx,-hy,hz],[-hx,hy,hz],[-hx,hy,-hz],[-hx,-hy,-hz]],\n      [[0, 1,0],[-hx,hy,-hz],[-hx,hy,hz],[hx,hy,hz],[hx,hy,-hz]],\n      [[0,-1,0],[-hx,-hy,hz],[-hx,-hy,-hz],[hx,-hy,-hz],[hx,-hy,hz]],\n      [[0,0, 1],[-hx,-hy,hz],[hx,-hy,hz],[hx,hy,hz],[-hx,hy,hz]],\n      [[0,0,-1],[hx,-hy,-hz],[-hx,-hy,-hz],[-hx,hy,-hz],[hx,hy,-hz]]\n    ];\n    for(var i=0;i<6;i++){\n      var n=f[i][0], q=[f[i][1],f[i][2],f[i][3],f[i][4]];\n      var idx=[0,1,2,0,2,3];\n      for(var k=0;k<6;k++){\n        var v=q[idx[k]];\n        P.push(v[0]+cx, v[1]+cy, v[2]+cz);\n        N.push(n[0],n[1],n[2]);\n      }\n    }\n    return {p:P, n:N};\n  }\n  function join(){\n    var P=[], N=[];\n    for(var i=0;i<arguments.length;i++){\n      var m=arguments[i];\n      P = P.concat(m.p); N = N.concat(m.n);\n    }\n    return {p:P, n:N};\n  }\n\n  var SEGS = 96;\n  // perfil do eixo escalonado (mm, eixo em x, centrado depois)\n  var shaftProf = [\n    {x:0,r:0},{x:0,r:11.5},{x:2.5,r:14},\n    {x:34,r:14},{x:35,r:19},\n    {x:88,r:19},{x:89.5,r:26},\n    {x:152,r:26},{x:153.5,r:19},\n    {x:206,r:19},{x:207,r:14},\n    {x:237.5,r:14},{x:240,r:11.5},{x:240,r:0}\n  ].map(function(p){ return {x:p.x-120, r:p.r}; });\n\n  var shaft = lathe(shaftProf, SEGS);\n  // ranhura de chaveta (bloco escuro sobre o ressalto central) — detalhe técnico\n  var keyway = box(6, 26.2, 0, 46, 5.0, 12);\n\n  var ringProf = [\n    {x:-10,r:19.7},{x:-10,r:26},{x:-8,r:27},{x:-8,r:33.5},\n    {x:8,r:33.5},{x:8,r:27},{x:10,r:26},{x:10,r:19.7},{x:-10,r:19.7}\n  ];\n  var ring = lathe(ringProf, SEGS);\n  var pedestal = join(\n    box(0,-46,0, 30, 26, 46),\n    box(0,-63,0, 62, 10, 58),\n    box(0,-33,0, 34, 12, 50)\n  );\n\n  /* ---------------- gl ---------------- */\n  var gl = cv.getContext(\"webgl\", {antialias:true, alpha:false, premultipliedAlpha:false});\n  if(!gl){ root.classList.add(\"om-lit\"); showLegal(); return; }\n\n  function sh(type, src){\n    var s = gl.createShader(type);\n    gl.shaderSource(s, src); gl.compileShader(s);\n    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS) && window.console) console.error(\"splash shader:\", gl.getShaderInfoLog(s));\n    return s;\n  }\n  function prog(vs, fs){\n    var p = gl.createProgram();\n    gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));\n    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));\n    gl.linkProgram(p);\n    if(!gl.getProgramParameter(p, gl.LINK_STATUS) && window.console) console.error(\"splash gl:\", gl.getProgramInfoLog(p));\n    return p;\n  }\n\n  var VS = [\n    \"attribute vec3 aPos; attribute vec3 aNrm;\",\n    \"uniform mat4 uM, uVP;\",\n    \"varying vec3 vN, vW;\",\n    \"void main(){ vec4 w = uM*vec4(aPos,1.0); vW = w.xyz;\",\n    \" vN = mat3(uM[0].xyz, uM[1].xyz, uM[2].xyz)*aNrm;\",\n    \" gl_Position = uVP*w; }\"\n  ].join(\"\\n\");\n\n  var FS = [\n    \"precision highp float;\",\n    \"varying vec3 vN, vW;\",\n    \"uniform vec3 uBase, uCam; uniform float uRough, uMetal, uAO;\",\n    \"vec3 lit(vec3 N, vec3 V, vec3 L, vec3 c, float sp, vec3 spc){\",\n    \"  float nl = max(dot(N,L),0.0);\",\n    \"  vec3 H = normalize(L+V);\",\n    \"  float s = pow(max(dot(N,H),0.0), sp) * (sp+8.0)/70.0;\",\n    \"  return c*(uBase*nl*(1.0-uMetal*0.55) + spc*s*nl);\",\n    \"}\",\n    \"void main(){\",\n    \"  vec3 N = normalize(vN);\",\n    \"  vec3 V = normalize(uCam - vW);\",\n    \"  float sp = mix(220.0, 12.0, uRough);\",\n    \"  vec3 spc = mix(vec3(0.09), uBase, uMetal);\",\n    \"  vec3 col = vec3(0.0);\",\n    \"  col += lit(N,V, normalize(vec3(0.32,0.80,-0.52)), vec3(1.05,1.0,0.95)*2.05, sp, spc);\",\n    \"  col += lit(N,V, normalize(vec3(-0.85,0.28,0.36)), vec3(0.32,0.48,0.70)*0.20, sp, spc);\",\n    \"  col += lit(N,V, normalize(vec3(0.10,0.10,0.99)), vec3(0.30,0.46,0.66)*0.18, sp, spc);\",\n    \"  vec3 sky = vec3(0.042,0.062,0.092), gnd = vec3(0.005,0.007,0.010);\",\n    \"  col += uBase*mix(gnd, sky, N.y*0.5+0.5)*1.0;\",\n    \"  float fres = pow(1.0-max(dot(N,V),0.0), 4.0);\",\n    \"  col += vec3(0.26,0.48,0.72)*fres*0.38;\",\n    \"  col *= uAO;\",\n    \"  col = col/(1.0+col*0.42);\",\n    \"  gl_FragColor = vec4(pow(max(col,0.0), vec3(0.4545)), 1.0);\",\n    \"}\"\n  ].join(\"\\n\");\n\n  var GFS = [\n    \"precision highp float;\",\n    \"varying vec3 vN, vW;\",\n    \"uniform vec3 uCam;\",\n    \"void main(){\",\n    \"  vec2 q = vW.xz;\",\n    \"  float d = length(q)/620.0;\",\n    \"  float fade = 1.0 - smoothstep(0.25, 1.0, d);\",\n    \"  vec3 base = vec3(0.0042,0.0058,0.0082);\",\n    // grade técnica\n    \"  float wpx = 0.010 + d*0.055;\",\n    \"  vec2 f = abs(fract(q/40.0+0.5)-0.5);\",\n    \"  float line = min((1.0-smoothstep(0.0,wpx,f.x))+(1.0-smoothstep(0.0,wpx,f.y)),1.0);\",\n    \"  vec3 col = base + vec3(0.018,0.036,0.058)*line*0.45*fade;\",\n    // sombras de contato aproximadas\n    \"  float sh = 0.0;\",\n    \"  sh += 0.85*exp(-pow(length(vec2(q.x/150.0, q.y/30.0)),2.2)*2.2);\",\n    \"  sh += 0.70*exp(-pow(length(vec2((q.x+60.0)/40.0, q.y/38.0)),2.0)*2.2);\",\n    \"  sh += 0.70*exp(-pow(length(vec2((q.x-60.0)/40.0, q.y/38.0)),2.0)*2.2);\",\n    \"  col *= 1.0 - min(sh,0.92);\",\n    \"  col = mix(vec3(0.0032,0.0046,0.0072), col, fade);\",\n    \"  gl_FragColor = vec4(pow(max(col,0.0), vec3(0.4545)), 1.0);\",\n    \"}\"\n  ].join(\"\\n\");\n\n  var BGVS = \"attribute vec2 aP; varying vec2 vUv; void main(){ vUv = aP*0.5+0.5; gl_Position = vec4(aP,0.0,1.0); }\";\n  var BGFS = [\n    \"precision highp float; varying vec2 vUv;\",\n    \"void main(){\",\n    \"  vec3 top = vec3(0.0070,0.0105,0.0160), bot = vec3(0.0014,0.0020,0.0032);\",\n    \"  vec3 c = mix(bot, top, pow(vUv.y, 1.25));\",\n    \"  float g = exp(-pow(length((vUv-vec2(0.5,0.62))*vec2(1.5,1.9)),2.0)*3.2);\",\n    \"  c += vec3(0.013,0.026,0.042)*g;\",\n    \"  gl_FragColor = vec4(pow(max(c,0.0), vec3(0.4545)), 1.0);\",\n    \"}\"\n  ].join(\"\\n\");\n  var pBg = prog(BGVS, BGFS);\n  var bgBuf = gl.createBuffer();\n  gl.bindBuffer(gl.ARRAY_BUFFER, bgBuf);\n  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);\n  function drawBg(){\n    gl.useProgram(pBg);\n    gl.disable(gl.DEPTH_TEST);\n    var a = gl.getAttribLocation(pBg,\"aP\");\n    gl.bindBuffer(gl.ARRAY_BUFFER, bgBuf);\n    gl.enableVertexAttribArray(a);\n    gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);\n    gl.drawArrays(gl.TRIANGLES,0,3);\n    gl.enable(gl.DEPTH_TEST);\n  }\n  var pMesh = prog(VS, FS);\n  var pGnd  = prog(VS, GFS);\n\n  function mesh(m, p){\n    var pos = gl.createBuffer();\n    gl.bindBuffer(gl.ARRAY_BUFFER, pos);\n    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(m.p), gl.STATIC_DRAW);\n    var nrm = gl.createBuffer();\n    gl.bindBuffer(gl.ARRAY_BUFFER, nrm);\n    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(m.n), gl.STATIC_DRAW);\n    return {pos:pos, nrm:nrm, count:m.p.length/3, prog:p||pMesh};\n  }\n  var gShaft = mesh(shaft), gKey = mesh(keyway), gRing = mesh(ring), gPed = mesh(pedestal);\n  var gGround = mesh(box(0,-69.5,0, 1400, 1, 1400), pGnd);\n\n  function draw(g, model, base, rough, metal, ao, vp, cam){\n    var p = g.prog;\n    gl.useProgram(p);\n    var aP = gl.getAttribLocation(p,\"aPos\"), aN = gl.getAttribLocation(p,\"aNrm\");\n    gl.bindBuffer(gl.ARRAY_BUFFER, g.pos); gl.enableVertexAttribArray(aP);\n    gl.vertexAttribPointer(aP,3,gl.FLOAT,false,0,0);\n    gl.bindBuffer(gl.ARRAY_BUFFER, g.nrm); gl.enableVertexAttribArray(aN);\n    gl.vertexAttribPointer(aN,3,gl.FLOAT,false,0,0);\n    gl.uniformMatrix4fv(gl.getUniformLocation(p,\"uM\"), false, model);\n    gl.uniformMatrix4fv(gl.getUniformLocation(p,\"uVP\"), false, vp);\n    gl.uniform3fv(gl.getUniformLocation(p,\"uCam\"), cam);\n    if(p === pMesh){\n      gl.uniform3fv(gl.getUniformLocation(p,\"uBase\"), base);\n      gl.uniform1f(gl.getUniformLocation(p,\"uRough\"), rough);\n      gl.uniform1f(gl.getUniformLocation(p,\"uMetal\"), metal);\n      gl.uniform1f(gl.getUniformLocation(p,\"uAO\"), ao);\n    }\n    gl.drawArrays(gl.TRIANGLES, 0, g.count);\n  }\n\n  var W=0, H=0;\n  function resize(){\n    var dpr = Math.min(window.devicePixelRatio||1, 2);\n    W = Math.round(cv.clientWidth*dpr); H = Math.round(cv.clientHeight*dpr);\n    if(cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }\n  }\n  window.addEventListener(\"resize\", resize);\n\n  var STEEL = [0.335,0.365,0.405];\n  var HOUSE = [0.070,0.082,0.100];\n  var PLATE = [0.038,0.045,0.055];\n  var KEY   = [0.09,0.10,0.12];\n\n  function eo(t){ return 1-Math.pow(1-t,3); }\n  function clamp01(t){ return t<0?0:t>1?1:t; }\n\n  var t0 = null, tPrev = null, spinAcc = 0, frames = 0, DUR = 4.0, timer = false;\n  function frame(now){ try{ frameInner(now); }catch(err){ if(window.console) console.error(\"splash:\", err); root.classList.add(\"om-lit\"); showLegal(); } }\n  function frameInner(now){\n    if(dead) return;\n    if(t0 === null) t0 = now;\n    frames++;\n    var t = (now-t0)/1000;\n    var dt = tPrev === null ? 0.016 : Math.min((now-tPrev)/1000, 0.05);\n    tPrev = now;\n    resize();\n    gl.viewport(0,0,W,H);\n    gl.enable(gl.DEPTH_TEST);\n    gl.disable(gl.CULL_FACE);\n    gl.clearColor(0.031,0.047,0.066,1);\n    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);\n    drawBg();\n\n    // câmera: órbita lenta + aproximação\n    var ct = clamp01(t/4.6), e = eo(ct);\n    var ang = -1.46 + e*0.36;\n    var rad = 600 - e*105;\n    var hgt = 250 - e*130;\n    var cam = [Math.cos(ang)*rad, hgt, Math.sin(ang)*rad];\n    var asp = (W||1)/(H||1);\n    var fov = asp < 1.1 ? 0.80 : 0.60;\n    var vp = mul(persp(fov, asp, 5, 4000), look(cam, [0, -14, 0], [0,1,0]));\n\n    // eixo: entra deslizando da esquerda e gira desacelerando\n    var ein = eo(clamp01((t-0.1)/0.95));\n    var w = 26*Math.exp(-t*0.95) + 2.6;\n    spinAcc += w*dt;\n    var sx = -300*(1-ein);\n    var mShaft = trs(sx, 0, 0, spinAcc);\n\n    // mancais: descem no lugar\n    var bin = eo(clamp01((t-0.55)/0.9));\n    var by = 300*(1-bin);\n\n    draw(gGround, trs(0,0,0,0), PLATE, 1, 0, 1, vp, cam);\n    draw(gShaft, mShaft, STEEL, 0.16, 0.86, 1, vp, cam);\n    draw(gKey,   mShaft, KEY,   0.55, 0.35, 0.85, vp, cam);\n    for(var i=0;i<2;i++){\n      var bx = i? 60 : -60;\n      var m = trs(bx, by, 0, 0);\n      draw(gRing, m, HOUSE, 0.34, 0.60, 1, vp, cam);\n      draw(gPed,  m, PLATE, 0.62, 0.35, 0.95, vp, cam);\n    }\n\n    if(t > 0.05) root.classList.add(\"om-lit\");\n    if(t > 1.7) hud.classList.add(\"om-in\");\n    if(t > DUR) showLegal();\n    if(timer) setTimeout(step, 16); else raf = requestAnimationFrame(step);\n  }\n  function step(now){ frame(typeof now === \"number\" ? now : performance.now()); }\n\n  resize();\n  if(reduce){ root.classList.add(\"om-lit\"); t0 = performance.now() - 4200; }\n  raf = requestAnimationFrame(step);\n  // se o rAF não roda (aba oculta/throttle), segue por temporizador\n  setTimeout(function(){ if(!dead && frames < 2){ timer = true; step(); } }, 600);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
