<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora do FIT: Fator de Interferência de Tráfego (SICRO)</title>
<style>:root{
  --bg:#E7EAEE;--panel:#FAFBFC;--panel2:#F1F3F6;--ink:#17202B;--muted:#56616E;--line:#C9D0D8;--line2:#DDE2E8;
  --asfalto:#262D36;--asfalto-ink:#E9EDF1;--sinal:#D9600C;--sinal-ink:#fff;--sinal-soft:#FBE3D2;
  --faixa:#F0C020;--urbano:#1F3A66;--pos:#2E7A4E;--neg:#B3261E;--focus:#1F6FEB;
  --f-sign:Bahnschrift,"DIN Alternate","DIN 2014","Barlow Semi Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:4px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121519;--panel:#1B2027;--panel2:#161A20;--ink:#E4E8EC;--muted:#9AA4AF;--line:#2E3640;--line2:#262D36;
  --asfalto:#0B0E12;--asfalto-ink:#DCE2E8;--sinal:#F07A26;--sinal-ink:#140A02;--sinal-soft:#3A2412;
  --urbano:#4A73B8;--pos:#5DBB84;--neg:#F08080;--focus:#6EA8FF;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121519;--panel:#1B2027;--panel2:#161A20;--ink:#E4E8EC;--muted:#9AA4AF;--line:#2E3640;--line2:#262D36;
  --asfalto:#0B0E12;--asfalto-ink:#DCE2E8;--sinal:#F07A26;--sinal-ink:#140A02;--sinal-soft:#3A2412;
  --urbano:#4A73B8;--pos:#5DBB84;--neg:#F08080;--focus:#6EA8FF;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-sign);font-weight:600;letter-spacing:.01em;line-height:1.2;margin:0}
h1{font-size:1.45rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:.4em 0 .8em;max-width:78ch}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{text-align:right;white-space:nowrap}
code,.cod{font-family:var(--f-sign);letter-spacing:.02em}

/* ---------- Estrutura ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.rail{background:var(--asfalto);color:var(--asfalto-ink);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:22px 0 16px;overflow:auto}
.rail .marca{padding:0 20px 18px}
.rail .marca b{display:block;font-family:var(--f-sign);font-size:2.1rem;line-height:1;letter-spacing:.04em}
.rail .marca span{display:block;font-size:.78rem;opacity:.75;margin-top:4px}
.estrada{position:relative;margin:6px 0 0;padding:4px 0}
.estrada::before{content:"";position:absolute;left:37px;top:0;bottom:0;border-left:3px dashed var(--faixa);opacity:.7}
.passo{position:relative;display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 16px 12px 18px;cursor:pointer;text-align:left;color:inherit}
.passo .placa{position:relative;z-index:1;flex:0 0 auto;width:40px;height:28px;display:grid;place-items:center;background:#F4F5F6;color:#10151B;border:2px solid #10151B;border-radius:3px;font-family:var(--f-sign);font-weight:700;font-size:.8rem;box-shadow:0 0 0 3px var(--asfalto)}
.passo .rot{font-family:var(--f-sign);font-size:1rem;line-height:1.2}
.passo .rot small{display:block;font-family:var(--f-body);font-size:.74rem;opacity:.7;margin-top:2px}
.passo:hover .rot{text-decoration:underline;text-underline-offset:3px}
.passo[aria-current="page"] .placa{background:var(--sinal);color:var(--sinal-ink);border-color:var(--sinal)}
.passo[aria-current="page"] .rot{color:#fff}
.rail .extra{margin-top:auto;padding:16px 16px 0;display:grid;gap:8px}
.rail .extra button{background:transparent;border:1px solid rgba(255,255,255,.22);color:inherit;border-radius:var(--r);padding:8px 10px;text-align:left;cursor:pointer;font-size:.88rem}
.rail .extra button[aria-current="page"]{border-color:var(--sinal);color:#fff}
.rail .extra button:hover{border-color:rgba(255,255,255,.5)}

.main{min-width:0;padding:22px 28px 60px}
.topo{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.topo .sub{color:var(--muted);font-size:.88rem;margin-top:3px}
.basechip{display:flex;gap:10px;align-items:center;font-size:.85rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 6px 6px 12px}
.basechip b{font-family:var(--f-sign);font-weight:600}

.bloco{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.bloco > h2,.bloco > h3{margin-bottom:10px}
.bloco-cab{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:10px}
.grade{display:grid;gap:14px 18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo > span{font-size:.82rem;color:var(--muted)}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:7px 9px;min-width:0;width:100%}
input:disabled{opacity:.45}
textarea{min-height:70px;resize:vertical}
input.n{text-align:right;width:84px;padding:5px 7px}
input.n.w{width:110px}
.quadro input.n{width:62px;padding:4px 5px}
.quadro input.od{display:block;width:118px;padding:3px 6px;font-size:.82rem}
.quadro input.od + input.od{margin-top:3px}
.quadro th,.quadro td{padding:5px 5px}
.quadro td.desc{min-width:190px;max-width:260px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:7px 12px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--sinal);border-color:var(--sinal);color:var(--sinal-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:saturate(.4)}
.btn:disabled:hover{border-color:var(--line)}
.btn.lnk{background:none;border-color:transparent;padding:4px 6px;text-decoration:underline;text-underline-offset:3px}
.btn.mini{padding:3px 8px;font-size:.82rem}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg label{display:flex;align-items:center;gap:6px;padding:6px 12px;cursor:pointer;border-right:1px solid var(--line);font-size:.9rem}
.seg label:last-child{border-right:0}
.seg input{accent-color:var(--sinal)}
.seg label:has(input:checked){background:var(--sinal-soft)}
.aviso{border-left:4px solid var(--sinal);background:var(--panel2);padding:10px 14px;margin:10px 0;font-size:.9rem}
.ok{color:var(--pos)}.neg{color:var(--neg)}

/* ---------- Tabelas ---------- */
.tabwrap{overflow-x:auto;border:1px solid var(--line);border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
th{background:var(--panel2);font-weight:600;text-align:left;font-size:.8rem;color:var(--muted);position:sticky;top:0;z-index:1}
thead tr.g th{text-align:center;border-bottom:1px solid var(--line)}
tbody tr:hover td{background:color-mix(in srgb,var(--panel2) 70%,transparent)}
tfoot td{font-weight:600;background:var(--panel2)}
tr.grp td{font-family:var(--f-sign);font-weight:600;background:var(--panel2);border-top:1px solid var(--line);padding-top:9px}
td.desc{min-width:240px;max-width:460px}
td.desc .l2{display:block;color:var(--muted);font-size:.78rem}
.plaq{display:inline-block;min-width:62px;text-align:center;font-family:var(--f-sign);font-weight:700;padding:2px 6px;border-radius:3px;border:1.5px solid var(--line)}
.plaq.on{background:var(--sinal);color:var(--sinal-ink);border-color:var(--sinal)}
.barra{height:6px;background:var(--line2);border-radius:2px;overflow:hidden;min-width:60px}
.barra i{display:block;height:100%;background:var(--sinal)}
tr.sel td{background:var(--sinal-soft)!important}
td.sep,th.sep{border-left:1px solid var(--line)}

/* ---------- Busca ---------- */
.busca{position:relative}
.resultados{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:3px;margin-top:8px}
.res{display:grid;grid-template-columns:78px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line2);font-size:.88rem}
.res:last-child{border-bottom:0}
.res .cod{font-weight:600}
.res em{font-style:normal;background:var(--sinal-soft)}

/* ---------- Resumo ---------- */
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:16px}
.resumo > div{padding:14px 18px;border-right:1px solid var(--line2)}
.resumo > div:last-child{border-right:0}
.resumo small{display:block;color:var(--muted);font-size:.8rem}
.resumo b{display:block;font-family:var(--f-sign);font-size:1.45rem;font-weight:600;margin-top:2px}
.resumo .dest b{color:var(--sinal)}

/* ---------- Diagrama ---------- */
.diag{width:100%;height:auto;display:block;margin:6px 0 2px}
.diag text{font-family:var(--f-sign);font-size:13px;fill:var(--muted)}
.diag .lbl{fill:var(--ink);font-size:12px}
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
.legenda i{display:inline-block;width:22px;height:8px;margin-right:6px;vertical-align:middle;border-radius:1px}

/* ---------- Modal ---------- */
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);padding:0;width:min(1100px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(10,14,20,.55)}
.dlg-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-corpo{padding:16px 20px}
.esp h4{margin:14px 0 6px;font-size:.95rem}
.esp .tot td{font-weight:600}

/* ---------- Manual ---------- */
.manual{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}
.manual nav{position:sticky;top:12px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.manual nav button{display:flex;width:100%;gap:8px;justify-content:space-between;text-align:left;background:none;border:0;padding:6px 6px;border-radius:3px;cursor:pointer;font-size:.9rem}
.manual nav button[aria-current="true"]{background:var(--sinal-soft)}
.manual nav .lido{color:var(--pos);font-size:.8rem}
.manual article{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 26px}
.manual article h2{margin-bottom:10px}
.eq{font-family:var(--f-sign);font-size:1.05rem;background:var(--panel2);border-left:4px solid var(--sinal);padding:8px 14px;margin:10px 0;display:inline-block}
.lab{border:1px dashed var(--line);border-radius:var(--r);padding:14px;margin:14px 0;background:var(--panel2)}
.lab h4{margin-bottom:8px}

#carga{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;font-family:var(--f-sign);font-size:1.1rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--asfalto);color:var(--asfalto-ink);padding:10px 16px;border-radius:var(--r);font-size:.9rem;z-index:60;max-width:90vw}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:8px 8px;z-index:20;overflow-x:auto}
  .rail .marca{padding:0 10px 0 6px}.rail .marca span{display:none}.rail .marca b{font-size:1.4rem}
  .estrada{display:flex;margin:0;padding:0}.estrada::before{display:none}
  .passo{padding:8px 8px;gap:6px}.passo .rot small{display:none}.passo .rot{font-size:.85rem;white-space:nowrap}
  .rail .extra{margin:0;padding:0 6px;display:flex}
  .main{padding:16px 12px 50px}
  .manual{grid-template-columns:1fr}.manual nav{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000}
  .app,#toast,dialog{display:none!important}
  #memorial{display:block!important}
}
#memorial{display:none}

/* ======================= v2 ======================= */
:root{--pre:#8A6400}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pre:#D6B25A}}
:root[data-theme="dark"]{--pre:#D6B25A}
td.b{font-weight:600}

/* ---------- Diálogos ---------- */
dialog.largo{width:min(1500px,98vw);max-height:96vh}
dialog.largo .dlg-corpo{padding:12px 18px 16px}
#dlgConf{width:min(540px,94vw)}
.conf-corpo{padding:20px 22px}
#confTxt{max-width:60ch;line-height:1.5}
#confCampos .campo{margin-top:12px}
.conf-acoes{margin-top:18px;justify-content:flex-start;flex-direction:row-reverse}

/* ---------- Selos e etiquetas ---------- */
.selo{display:inline-block;font-family:var(--f-body);font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:9px;background:var(--sinal-soft);color:var(--sinal);border:1px solid var(--sinal);vertical-align:2px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.selo.novo{background:transparent;color:var(--urbano);border-color:var(--urbano)}
.selo.sicro{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.selo.rasc{background:#FFF2CC;color:#6B5000;border-color:#C9A200}
.fonte{display:inline-block;font-size:.66rem;padding:0 6px;border-radius:8px;border:1px solid;vertical-align:1px;margin-left:4px;font-weight:700;white-space:nowrap;cursor:help}
.fonte.cad{color:var(--pos);border-color:var(--pos)}
.fonte.pre{color:var(--pre);border-color:var(--pre)}
.fonte.apt{color:var(--muted);border-color:var(--line)}
.fonte.usr{color:var(--sinal);border-color:var(--sinal)}

/* ---------- Composição analítica (grade de planilha) ---------- */
.edbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.xlwrap{overflow:auto;border:1px solid #BFC5CC;border-radius:2px;background:#fff;max-height:calc(96vh - 250px);color-scheme:light}
table.xl{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;table-layout:fixed;font:12.5px/1.3 Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#111;background:#fff}
table.xl col.c-rn{width:40px}table.xl col.c-a{width:82px}table.xl col.c-b{width:390px}table.xl col.c-n{width:98px}table.xl col.c-h{width:86px}table.xl col.c-i{width:116px}
table.xl th{position:sticky;top:0;z-index:3;background:#F2F2F2;color:#555;font:400 12px Calibri,Carlito,Arial,sans-serif;text-align:center;border-right:1px solid #D4D4D4;border-bottom:1px solid #C8C8C8;padding:3px 0}
table.xl th:first-child{left:0;z-index:4}
table.xl td{border-right:1px solid #E3E3E3;border-bottom:1px solid #E3E3E3;padding:1px 5px;height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;background:#fff}
table.xl tbody tr:hover td{background:#fff}
table.xl td.rn{position:sticky;left:0;z-index:2;background:#F2F2F2!important;color:#666;text-align:center;border-right:1px solid #C8C8C8;padding:0;font-size:11.5px}
table.xl td.rn .rm{display:none;width:100%;height:21px;border:0;background:#B3261E;color:#fff;font-weight:700;cursor:pointer;font-size:14px;line-height:1}
table.xl tr:hover td.rn .rm,table.xl td.rn .rm:focus-visible{display:block}
table.xl tr:hover td.rn:has(.rm) span{display:none}
table.xl td.n{text-align:right;font-variant-numeric:tabular-nums}
table.xl td.b{font-weight:700}
table.xl td.r{text-align:right}
table.xl td.it{font-style:italic;color:#555}
table.xl td.sec{background:#FBE3D2!important;font-weight:700;overflow:visible}
table.xl td.desc{white-space:normal;line-height:1.25;padding-top:2px;padding-bottom:2px}
table.xl td.cod{font-family:Calibri,Carlito,Arial,sans-serif}
table.xl td.ed{background:#FFF2CC!important;padding:0}
table.xl td.ed input{display:block;width:100%;height:22px;border:0;border-radius:0;background:transparent;color:#0000FF;font:inherit;text-align:right;padding:0 5px;min-width:0}
table.xl td.ed.cod input,table.xl td.ed.desc input,table.xl td.ed.obs input,table.xl td.ed.tc input,table.xl td.ed:not(.n) input{text-align:left}
table.xl td.ed input:focus{outline:2px solid #1F6FEB;outline-offset:-2px;background:#fff}
table.xl td.alt{box-shadow:inset 0 0 0 2px #D9600C}
table.xl tr.nova td:not(.rn):not(.ed){background:#E6F2E8}
table.xl tr.sub td{color:#666;font-size:11px;height:18px;font-style:italic}
table.xl tr.tot td.n{font-weight:700}
table.xl td.total{font-size:13.5px;border-top:2px solid #333}
table.xl td.fitv{color:#B34A00;font-weight:700}
table.xl .lnk{background:none;border:0;padding:0;color:#1F4E9A;text-decoration:underline;text-underline-offset:2px;cursor:pointer;font:inherit}
table.xl .ins{float:right;margin-left:10px;padding:0 7px;font-size:11px;line-height:17px;background:#fff;color:#7A3A06;border:1px solid #D9A27A;border-radius:3px;font-weight:600}
table.xl .ins:hover{background:#FFF7F0}
table.xl .selo{font-size:9px;padding:0 4px;margin-left:4px;vertical-align:1px}
.edleg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 4px;align-items:center}
.edleg .sw{display:inline-block;width:16px;height:12px;vertical-align:middle;margin-right:6px;border:1px solid #bbb}
.edleg .sw.ed{background:#FFF2CC}.edleg .sw.alt{box-shadow:inset 0 0 0 2px #D9600C;background:#fff}.edleg .sw.nova{background:#E6F2E8}
.pick{border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);padding:10px 12px;margin-bottom:10px}
.pick .bloco-cab{margin-bottom:6px}
.picklst{max-height:230px;overflow:auto;margin-top:6px;border:1px solid var(--line2);border-radius:3px;background:var(--panel)}
.pk{display:grid;grid-template-columns:minmax(80px,auto) minmax(0,1fr) auto;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);padding:6px 10px;cursor:pointer;font-size:.85rem;align-items:center}
.pk:hover,.pk:focus-visible{background:var(--sinal-soft)}
.pk .cod{font-weight:600}

/* ---------- Estudo de caso ---------- */
.estudo .relatorio{max-width:1200px}
.relatorio section{padding-top:8px;margin-top:14px;border-top:1px solid var(--line2)}
.relatorio h2{font-size:1.15rem;margin:10px 0 8px}
.relatorio h3{font-size:.98rem;margin:16px 0 6px}
nav.sumario{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);padding:10px 16px;margin:8px 0 6px}
nav.sumario ol{columns:3 220px;margin:6px 0 0;padding-left:22px;font-size:.88rem}
nav.sumario a{text-decoration:none}nav.sumario a:hover{text-decoration:underline}
.formula{font-family:var(--f-sign);font-size:1rem;background:var(--panel2);border-left:4px solid var(--sinal);padding:10px 14px;margin:10px 0;overflow-x:auto;white-space:nowrap}
table.compacta{font-size:.8rem}table.compacta td,table.compacta th{padding:4px 6px}
svg.barras{margin:8px 0}
svg.mapa{margin-top:10px}
.relatorio .resumo{margin:10px 0 6px}
.relatorio td.desc{min-width:200px}

/* ---------- Avisos legais ---------- */
#avisos{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(8,11,15,.74);padding:16px}
.av-in{width:min(880px,100%);max-height:94vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 24px 70px rgba(0,0,0,.45)}
.av-cab{display:flex;gap:18px;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}
.placa-leg{flex:0 0 auto;width:40px;height:40px;display:grid;place-items:center;background:var(--faixa);border:2.5px solid #111;border-radius:4px;transform:rotate(45deg);margin:4px}
.placa-leg span{transform:rotate(-45deg);color:#111;font-family:var(--f-sign);font-weight:700;font-size:1.5rem;line-height:1}
.av-txt{overflow:auto;padding:4px 24px 16px}
.av-txt h3,.legal h3{margin:16px 0 4px;font-size:1rem}
.av-rod{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;border-top:1px solid var(--line);background:var(--panel2)}
.av-rod label{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:600}
.av-rod input{accent-color:var(--sinal);width:18px;height:18px}
.legal p{max-width:86ch}

/* ---------- Abertura ---------- */
#abertura{position:fixed;inset:0;z-index:90;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(120% 90% at 50% 18%,#26303A 0%,#14191F 58%,#0B0E12 100%);color:#E9EDF1;overflow-y:auto;padding:20px;transition:opacity .38s ease;color-scheme:dark}
#abertura.sai{opacity:0}
.ab-in{width:min(980px,100%);display:flex;flex-direction:column;align-items:center;gap:4px}
.cena{width:100%;height:auto;max-height:44vh;display:block;overflow:visible}
.cena .morro{fill:#1B222A}
.cena .asfalto{fill:#2A3139}
.cena .bordo{stroke:#E9EDF1;stroke-width:3}
.cena .faixa-c{stroke:#F0C020;stroke-width:4;stroke-dasharray:28 20}
.cena text{font-family:var(--f-sign);font-weight:700;font-size:15px;fill:#fff;letter-spacing:.06em}
.cena .s1{font-size:19px;fill:#F0C020;letter-spacing:.02em}
.cena .s2{font-size:11px;font-weight:400;fill:#C9D1DA;letter-spacing:0}
.cena .cam{animation:ab-cam 7s infinite}
.cena .pare{animation:ab-pare 7s infinite}
.cena .siga{opacity:0;animation:ab-siga 7s infinite}
.cena .selo-a1{opacity:0;animation:ab-selo 7s infinite}
@keyframes ab-cam{0%{transform:translateX(-1300px);animation-timing-function:cubic-bezier(.15,.6,.3,1)}32%{transform:translateX(392px);animation-timing-function:linear}58%{transform:translateX(392px);animation-timing-function:cubic-bezier(.6,0,.85,.5)}100%{transform:translateX(2600px)}}
@keyframes ab-pare{0%,56%{opacity:1}58%,94%{opacity:0}97%,100%{opacity:1}}
@keyframes ab-siga{0%,56%{opacity:0}58%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes ab-selo{0%,31%{opacity:0;transform:translateY(8px)}35%,54%{opacity:1;transform:none}58%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes ab-sobe{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ab-tit{text-align:center;margin-top:14px;animation:ab-sobe .8s .15s both}
.ab-fit{font-family:var(--f-sign);font-weight:700;font-size:clamp(3.4rem,9vw,6rem);line-height:.9;letter-spacing:.1em;color:#F07A26}
.ab-nome{font-family:var(--f-sign);font-size:clamp(1.1rem,2.6vw,1.6rem);letter-spacing:.02em;margin-top:4px}
.ab-sub{color:#AEB8C3;font-size:.92rem;max-width:64ch;margin:8px auto 0}
.ab-acoes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center;margin-top:18px;animation:ab-sobe .8s .4s both}
.btn.grande{font-size:1.05rem;padding:11px 28px}
.btn.grande:disabled{opacity:.75;cursor:progress;filter:saturate(.6)}
#abertura .btn.lnk{color:#C9D1DA}
.ab-rod{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:center;color:#8C97A3;font-size:.8rem;margin-top:16px}
.ab-rod label{display:flex;gap:6px;align-items:center;cursor:pointer}
.ab-rod input{accent-color:#F07A26}
@media (prefers-reduced-motion:reduce){
  .cena .cam{transform:translateX(392px)}.cena .pare{opacity:0}.cena .siga{opacity:1}.cena .selo-a1{opacity:1}
}
@media (max-width:860px){ table.xl col.c-b{width:260px} .conf-acoes{flex-direction:column-reverse;align-items:stretch} }
@media print{ #abertura,#avisos{display:none!important} }
</style>
</head>

</div>

        g += `<line x1="${X}" x2="${X}" y1="${Y - 30}" y2="${Y - 12}" stroke="var(--sinal)" stroke-width="2.5"/><circle cx="${X}" cy="${Y - 34}" r="5" fill="var(--sinal)"/><text class="lbl" x="${X}" y="${Y - 44}" text-anchor="middle">${esc(m.rot)}</text>`;

    const H = (marcas || []).some(m => m.tipo === 'faixa') ? 140 : 110;
    return `<svg class="diag" viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagrama linear do trecho de obra">${g}</svg>

  };

  /* ---------- Etapa 1: Obra ---------- */
  A.abas.obra = el => {
    const o = A.S.obra, ps = A.pareSiga(), c = A.ctx();
    const ext = E.extensaoObra(o.segs);
    el.innerHTML = `
    <div class="bloco">
      <div class="bloco-cab"><h2>Identificação da obra</h2>

      <div class="grade">
        <label class="campo"><span>Nome da obra</span><input type="text" data-fk="o-nome" data-o="nome" value="${esc(o.nome)}" placeholder="Ex.: Conservação rodoviária BR-000"></label>
        <label class="campo"><span>Trecho / segmento</span><input type="text" data-fk="o-trecho" data-o="trecho" value="${esc(o.trecho)}" placeholder="Ex.: km 7,60 ao km 78,00"></label>
        <label class="campo"><span>BDI (%) para o preço de venda</span><input type="text" inputmode="decimal" data-fk="o-bdi" data-o="bdi" data-num="1" value="${fmtIn(o.bdi, 2)}"></label>
      </div>
    </div>
    <div class="bloco">
      <div class="bloco-cab"><h2>Segmentos do trecho de obra</h2><span class="muted small">Extensão ${fmt(ext, 2)} km, VMDf médio ponderado ${fmt(c.vmdfPadrao, 0)} veíc./dia por faixa</span></div>
      <p class="muted small">Descreva a extensão da obra como no diagrama linear de ocorrências. O VMDf é o volume médio diário por faixa do estudo de tráfego (ou PNCT/PNCV, com a fonte citada no memorial). Perímetros urbanos não recebem VMDf: neles incide o atraso A2.</p>
      ${A.diagrama(o.segs)}
      <div class="tabwrap" style="margin-top:10px"><table>
        <thead><tr><th>km inicial</th><th>km final</th><th>Tipo de via</th><th class="num">VMDf (veíc./dia/faixa)</th><th class="num">Extensão (km)</th><th></th></tr></thead>
        <tbody>${o.segs.map((s, i) => `<tr>
          <td><input class="n" type="text" inputmode="decimal" data-fk="s${i}ini" data-seg="${i}" data-campo="ini" value="${fmtIn(s.ini, 2)}"></td>
          <td><input class="n" type="text" inputmode="decimal" data-fk="s${i}fim" data-seg="${i}" data-campo="fim" value="${fmtIn(s.fim, 2)}"></td>
          <td><select data-fk="s${i}tipo" data-seg="${i}" data-campo="tipo"><option value="rural"${s.tipo !== 'urbano' ? ' selected' : ''}>Rodovia rural pavimentada</option><option value="urbano"${s.tipo === 'urbano' ? ' selected' : ''}>Via urbana pavimentada (perímetro urbano)</option></select></td>
          <td class="num"><input class="n w" type="text" inputmode="decimal" data-fk="s${i}vmdf" data-seg="${i}" data-campo="vmdf" value="${s.tipo === 'urbano' ? '' : fmtIn(s.vmdf, 0)}" ${s.tipo === 'urbano' ? 'disabled' : ''}></td>
          <td class="num">${fmt(Math.abs(+s.fim - +s.ini), 2)}</td>
          <td><button class="btn mini" data-acao="delseg" data-i="${i}">Remover</button></td></tr>`).join('')}</tbody>
      </table></div>
      <div class="acoes" style="margin-top:10px"><button class="btn" data-acao="addseg">Adicionar segmento</button></div>
    </div>
    <div class="bloco">
      <h2>Operação “PARE” e “SIGA” (atraso A1)</h2>
      <p class="muted small">O atraso A1 só é considerado quando o orçamento prevê a operação de sinalização por bandeirola ou placa metálica (SICRO 5213850 ou similar), com pista simples operando em meia pista. Sem essa previsão, A1 = 0.</p>
      <div class="seg" role="radiogroup" aria-label="Operação PARE e SIGA">
        ${[['auto', 'Automático'], ['sim', 'Prevista'], ['nao', 'Não prevista']].map(([v, t]) => `<label><input type="radio" name="ps" value="${v}" ${o.pareSiga === v ? 'checked' : ''}>${t}</label>`).join('')}
      </div>
      <p class="small" style="margin-top:10px">Composição 5213850 no orçamento: <b>${ps.tem ? 'sim' : 'não'}</b>. Situação considerada no cálculo: <b class="${ps.on ? 'ok' : ''}">${ps.on ? 'A1 aplicado' : 'A1 = 0'}</b>${o.pareSiga === 'sim' && !ps.tem ? ' <span class="neg">(atenção: marcada como prevista, mas 5213850 não está no orçamento; justifique o serviço similar no memorial)</span>' : ''}.</p>
    </div>
    <div class="bloco">
      <h2>Parâmetros de velocidade</h2>
      <div class="grade">
        <label class="campo"><span>Velocidade média em vias urbanas pavimentadas, Vu (km/h)</span><input type="text" inputmode="decimal" data-fk="o-vu" data-o="Vu" data-num="1" value="${fmtIn(o.Vu, 1)}"></label>
        <label class="campo"><span>Velocidade padrão, Vp (km/h)</span><input type="text" value="60,0" disabled></label>
        <div class="campo"><span>Fatores resultantes</span><div>Fc = <b>${fmt(E.fatorConversao(c.Vu, 60), 2)} s/km</b> (Eq. 3), Fp = <b>60,00 s/km</b> (Eq. 5)</div></div>
      </div>
      ${(+o.Vu || 30) !== 30 ? `<label class="campo" style="margin-top:12px"><span>Justificativa técnica para Vu diferente de 30 km/h (vai para o memorial)</span><textarea data-fk="o-just" data-o="justVu">${esc(o.justVu)}</textarea></label>` : ''}
      <p class="muted small" style="margin-top:10px">Acima de ${fmt(c.lim, 0)} km de DMT pavimentada o manual considera a velocidade média estabilizada em 60 km/h, e o FIT não é aplicado (FIT = 1).</p>

      <span>Levar para a composição principal o custo unitário da atividade auxiliar já com o seu próprio momento de transporte (e FIT). <span class="muted small">Desmarcado, a seção D usa o custo da auxiliar como publicado no relatório analítico (sem transporte), como na figura 3 do Caderno de Aplicação; nesse caso os insumos transportados das auxiliares saem do quadro de DMT.</span></span></label>

  };

  /* ---------- Etapa 2: Composições ---------- */
  A.buscar = q => {
    const t = norm(q).split(/\s+/).filter(Boolean);
    if (!t.length) return [];
    const out = [];
    for (const b of A.BUSCA) { if (t.every(x => b.t.indexOf(x) >= 0)) { out.push(b.c); if (out.length >= 80) break; } }
    return out;
  };
  function destacar(txt, q) {
    let h = esc(txt);
    norm(q).split(/\s+/).filter(x => x.length > 2).forEach(x => {
      const i = norm(txt).indexOf(x);
      if (i >= 0) { const orig = txt.substr(i, x.length); h = h.replace(esc(orig), '<em>' + esc(orig) + '</em>'); }
    });
    return h;
  }
  A.selo = k => {
    const ov = A.S.comps[k];
    if (!ov || !ov.c) return '';
    return ov.nova ? '<span class="selo novo" title="Composição criada pelo usuário">própria</span>' : '<span class="selo" title="Composição do SICRO alterada pelo usuário">alterada</span>';
  };
  A.renderBusca = () => {
    const box = $('#resBusca'); if (!box) return;
    const q = $('#q').value, r = A.buscar(q);
    const naLista = new Set(A.S.orc.map(i => i.code));
    box.innerHTML = !q.trim() ? '<div class="res muted" style="grid-template-columns:1fr">Digite o código ou parte da descrição (ex.: “concreto asfáltico faixa C”, “brita graduada”, “4011276”).</div>'
      : !r.length ? '<div class="res" style="grid-template-columns:1fr">Nenhuma composição encontrada. Tente menos palavras ou o código de 7 dígitos.</div>'
        : r.map(k => { const c = A.BASE.get(k); return `<div class="res"><button class="btn lnk cod" data-acao="abrir" data-k="${esc(k)}" title="Abrir a composição analítica">${esc(k)}</button><span>${destacar(c[1], q)} ${A.selo(k)} <span class="muted small">(${esc(c[2])}${c[17].length ? `, ${c[17].length} item(ns) em momento de transporte` : ''})</span></span><span class="num small">R$ ${fmt(c[11], 2)}</span><button class="btn mini ${naLista.has(k) ? '' : 'pri'}" data-acao="add" data-k="${esc(k)}">${naLista.has(k) ? 'Adicionar de novo' : 'Adicionar'}</button></div>`; }).join('');
  };
  A.abas.orc = el => {
    const r = A.calc();
    const grupos = [...new Set(A.S.orc.map(i => i.grupo).filter(Boolean))];
    const alteradas = Object.keys(A.S.comps).filter(k => A.S.comps[k] && A.S.comps[k].c);
    el.innerHTML = `
    <div class="bloco">
      <div class="bloco-cab"><h2>Buscar composições do SICRO</h2><span class="muted small">${esc(A.BASE.uf)}, ${esc(A.BASE.mes)}. Clique no código para abrir a composição no formato analítico.</span></div>
      <div class="busca"><input id="q" type="search" placeholder="Código ou descrição" autocomplete="off" aria-label="Buscar composição"></div>
      <div class="resultados" id="resBusca"></div>
      <details style="margin-top:12px"><summary class="small">Colar uma lista de composições (código e quantidade)</summary>
        <p class="muted small">Uma composição por linha: código, separador (tab, ponto e vírgula ou espaço) e quantidade. Pode colar direto de uma planilha. Um terceiro campo vira o grupo.</p>
        <textarea id="colar" rows="5" placeholder="4011276;7379,70&#10;4011464;4737,60"></textarea>
        <div class="acoes" style="margin-top:8px"><button class="btn" data-acao="colar">Incluir na lista</button></div>
      </details>
    </div>
    ${alteradas.length ? `<div class="bloco"><div class="bloco-cab"><h2>Composições alteradas e próprias</h2><span class="muted small">Valem para todo o projeto, inclusive quando usadas como atividade auxiliar.</span></div>
      <div class="tabwrap"><table><thead><tr><th>Código</th><th>Descrição</th><th>Situação</th><th class="num">Custo unitário (R$)</th><th>Motivo</th><th></th></tr></thead><tbody>
      ${alteradas.map(k => { const ov = A.S.comps[k], c = ov.c, o = A.BASE_REF.orig(k); return `<tr><td class="cod">${esc(k)}</td><td class="desc">${esc(c[1])}</td><td>${A.selo(k)}${ov.origem ? `<span class="small muted" style="display:block">a partir de ${esc(ov.origem)}</span>` : ''}</td><td class="num">${fmt(c[11], 2)}${o ? `<span class="l2 small muted" style="display:block">SICRO ${fmt(o[11], 2)}</span>` : ''}</td><td class="small">${esc(ov.motivo || '')}</td><td><div class="acoes" style="flex-wrap:nowrap"><button class="btn mini" data-acao="abrir" data-k="${esc(k)}">Abrir</button><button class="btn mini" data-acao="restaurar" data-k="${esc(k)}">${ov.nova ? 'Excluir' : 'Restaurar SICRO'}</button></div></td></tr>`; }).join('')}
      </tbody></table></div></div>` : ''}
    <div class="bloco">
      <div class="bloco-cab"><h2>Composições do orçamento</h2>
        <span class="muted small">${A.S.orc.length} item(ns), ${r.nComps} composições na árvore (com auxiliares), ${r.ins.length} insumos com momento de transporte</span></div>
      ${A.S.orc.length ? `<div class="tabwrap"><table>
        <thead><tr><th>Grupo</th><th>Código</th><th>Descrição</th><th>Un.</th><th class="num">Quantidade</th><th class="num">Custo unitário (R$)</th><th></th></tr></thead>
        <tbody>${A.S.orc.map(i => { const c = A.BASE.get(i.code); return `<tr>
          <td><input type="text" list="dlGrupos" data-fk="g${i.id}" data-id="${i.id}" data-campo="grupo" value="${esc(i.grupo || '')}" style="min-width:140px"></td>
          <td class="cod">${esc(i.code)}</td>
          <td class="desc">${c ? esc(c[1]) + ' ' + A.selo(i.code) : '<span class="neg">Código não encontrado nesta base</span>'}</td>
          <td>${c ? esc(c[2]) : ''}</td>
          <td class="num"><input class="n w" type="text" inputmode="decimal" data-fk="q${i.id}" data-id="${i.id}" data-campo="qty" value="${fmtIn(i.qty, 2)}"></td>
          <td class="num">${c ? fmt(c[11], 2) : '—'}</td>
          <td><div class="acoes" style="flex-wrap:nowrap">${c ? `<button class="btn mini" data-acao="abrir" data-k="${esc(i.code)}">Analítica</button>` : ''}<button class="btn mini" data-acao="del" data-id="${i.id}">Remover</button></div></td></tr>`; }).join('')}</tbody>
      </table></div><datalist id="dlGrupos">${grupos.map(g => `<option value="${esc(g)}">`).join('')}</datalist>
      <div class="acoes" style="margin-top:10px"><button class="btn pri" data-acao="ir" data-aba="dmt">Ir para o quadro de DMT</button><button class="btn" data-acao="limpar">Esvaziar lista</button></div>`
        : '<p>Nenhuma composição ainda. Busque acima e clique em Adicionar, cole uma lista ou carregue o estudo de caso na etapa Obra.</p>'}
    </div>`;
    const q = $('#q', el);
    q.value = A.UI.filtro || '';
    q.addEventListener('input', () => { A.UI.filtro = q.value; A.renderBusca(); });
    A.renderBusca();
  };

  /* ---------- Etapa 3: Quadro de DMT ---------- */
  A.SEL = new Set();
  A.rotaDe = k => {
    if (!A.S.rotas[k]) A.S.rotas[k] = { origem: '', destino: '', ln: 0, rp: 0, dmtr: 0, dmtu: 0, vmdf: null, passa: true, fit: true, oth: 0 };
    return A.S.rotas[k];
  };
  A.etiquetaFonte = rt => {
    if (!rt || !rt.fonte) return '';
    const m = { 'Caderno': ['cad', 'Caderno'], 'À parte': ['apt', 'orçado à parte'], 'Premissa': ['pre', 'premissa'], 'Usuário': ['usr', 'alterada'] }[rt.fonte] || ['pre', rt.fonte];
    return `<span class="fonte ${m[0]}" title="${esc(rt.nota || '')}">${esc(m[1])}</span>`;
  };
  A.abas.dmt = el => {
    const r = A.calc(), SEL = A.SEL;
    if (!A.S.orc.length) { el.innerHTML = '<div class="bloco"><h2>Quadro de DMT e FIT</h2><p>Inclua composições na etapa 2 para montar o quadro de DMT.</p><button class="btn pri" data-acao="ir" data-aba="orc">Ir para Composições</button></div>'; return; }
    let ins = r.ins.slice();
    if (A.UI.ordem === 'custo') ins.sort((a, b) => (b.custoF - a.custoF) || (b.massa - a.massa) || a.k.localeCompare(b.k));
    else if (A.UI.ordem === 'massa') ins.sort((a, b) => (b.massa - a.massa) || a.k.localeCompare(b.k));
    else ins.sort((a, b) => a.k.localeCompare(b.k));
    const maxM = Math.max(1e-9, ...ins.map(i => i.massa));
    const c = r.c;
    const semRota = ins.filter(i => !i.outro && !(i.rt.dmtr || i.rt.dmtu || i.rt.rp || i.rt.ln) && i.rt.fonte !== 'À parte').length;
    el.innerHTML = `
    <div class="bloco">
      <div class="bloco-cab"><h2>Quadro de DMT e FIT</h2>
        <div class="acoes small"><span>Ordenar por</span><div class="seg">${[['custo', 'Custo de transporte'], ['massa', 'Massa transportada'], ['cod', 'Código']].map(([v, t]) => `<label><input type="radio" name="ordem" value="${v}" ${A.UI.ordem === v ? 'checked' : ''}>${t}</label>`).join('')}</div></div></div>
      <p class="small">A1 ${c.pareSiga ? `<b class="ok">ativo</b> (PARE e SIGA previsto)` : '<b>= 0</b> (PARE e SIGA não previsto)'}; VMDf padrão da obra ${fmt(c.vmdfPadrao, 0)}; Fc ${fmt(E.fatorConversao(c.Vu, 60), 2)} s/km. Deixe o VMDf em branco para usar o padrão da obra. Os valores de DMT são em km; LN e RP não recebem FIT.</p>
      ${semRota ? `<div class="aviso">${semRota} insumo(s) ainda sem DMT. A “massa transportada” (t, ou unidade de transporte, por km de DMT) ajuda a decidir quais insumos detalhar primeiro: o manual permite aplicar o FIT só aos mais significativos.</div>` : ''}
      <div class="acoes" style="margin:8px 0">
        <span class="small">${SEL.size ? `${SEL.size} selecionado(s).` : 'Marque linhas para preencher várias de uma vez.'}</span>
        <label class="small" style="display:flex;gap:6px;align-items:center">Copiar a rota de
          <select id="fonteRota" ${SEL.size ? '' : 'disabled'}><option value="">escolha um insumo</option>${ins.filter(i => i.tem && !i.outro).map(i => `<option value="${esc(i.k)}">${esc(i.k)} ${esc(i.desc).slice(0, 40)}</option>`).join('')}</select></label>
        <button class="btn mini" data-acao="aplicaSel" ${SEL.size ? '' : 'disabled'}>Aplicar aos selecionados</button>
        <button class="btn mini" data-acao="limpaSel" ${SEL.size ? '' : 'disabled'}>Limpar seleção</button>
      </div>
      <div class="tabwrap"><table class="quadro">
        <thead>
          <tr class="g"><th colspan="3"></th><th class="sep">Rota</th><th colspan="4" class="sep">DMT (km)</th><th colspan="3" class="sep">Critérios</th><th colspan="5" class="sep">Cálculo (Eqs. 2 a 8)</th><th colspan="2" class="sep">No orçamento</th><th></th></tr>
          <tr><th><input type="checkbox" data-acao="selTodos" aria-label="Selecionar todos"></th><th>Código</th><th>Insumo transportado</th>
          <th class="sep">Origem / destino</th>
          <th class="sep num">LN</th><th class="num">RP</th><th class="num">DMTr</th><th class="num">DMTu</th>
          <th class="sep num">VMDf</th><th title="O transporte passa pela extensão da obra (condição para A1)">Passa<br>na obra</th><th title="Transporte pelo executor (FOB). Desmarque para CIF.">FOB<br>(FIT)</th>
          <th class="sep num">DMTp</th><th class="num">A1 (s)</th><th class="num">A2 (s)</th><th class="num">FIT</th><th class="num">DMTF</th>
          <th class="sep num">Massa (t)</th><th class="num">Transporte (R$)</th><th></th></tr>
        </thead>
        <tbody>${ins.map(i => {
          const rt = i.rt, rs = i.res, k = esc(i.k), dis = i.outro ? 'disabled' : '';
          const inp = (campo, v, d, extra) => `<input class="n" type="text" inputmode="decimal" data-fk="r${k}${campo}" data-r="${k}" data-campo="${campo}" value="${fmtIn(v, d)}" ${extra || ''}>`;
          const fonte = A.etiquetaFonte(rt);
          return `<tr class="${SEL.has(i.k) ? 'sel' : ''}">
          <td><input type="checkbox" data-sel="${k}" ${SEL.has(i.k) ? 'checked' : ''} aria-label="Selecionar ${k}"></td>
          <td class="cod">${k}</td>
          <td class="desc">${esc(i.desc)} ${fonte}<span class="l2">${esc(i.veic.join('; ') || (i.outro ? 'Transporte ferroviário/outro modal' : ''))}${i.comps.size ? `, em ${i.comps.size} composição(ões)` : ''}</span></td>
          <td class="sep"><input class="od" type="text" data-fk="r${k}origem" data-r="${k}" data-campo="origem" value="${esc(rt.origem || '')}" placeholder="origem" aria-label="Origem"><input class="od" type="text" data-fk="r${k}destino" data-r="${k}" data-campo="destino" value="${esc(rt.destino || '')}" placeholder="destino" aria-label="Destino"></td>
          ${i.outro ? `<td class="sep" colspan="4"><span class="small muted">DMT outro modal</span> ${inp('oth', rt.oth, 2)}</td>`
            : `<td class="sep num">${inp('ln', rt.ln, 2)}</td><td class="num">${inp('rp', rt.rp, 2)}</td><td class="num">${inp('dmtr', rt.dmtr, 2)}</td><td class="num">${inp('dmtu', rt.dmtu, 2)}</td>`}
          <td class="sep num">${inp('vmdf', rt.vmdf, 0, `placeholder="${fmt(c.vmdfPadrao, 0)}" ${dis}`)}</td>
          <td style="text-align:center"><input type="checkbox" data-r="${k}" data-campo="passa" ${rt.passa !== false ? 'checked' : ''} ${dis}></td>
          <td style="text-align:center"><input type="checkbox" data-r="${k}" data-campo="fit" ${rt.fit !== false ? 'checked' : ''} ${dis}></td>
          <td class="sep num">${i.outro ? '—' : fmt(rs.DMTp, 2)}</td>
          <td class="num">${i.outro ? '—' : fmt(rs.A1, 2)}</td>
          <td class="num">${i.outro ? '—' : fmt(rs.A2, 2)}</td>
          <td class="num" title="${esc(rs.motivo)}">${i.outro ? '—' : `<span class="plaq ${rs.FIT > 1 ? 'on' : ''}">${fmt(rs.FIT, 4)}</span>`}</td>
          <td class="num">${i.outro ? '—' : fmt(rs.DMTF, 2)}</td>
          <td class="sep num"><div>${fmt(i.massa, 2)}</div><div class="barra"><i style="width:${(i.massa / maxM * 100).toFixed(1)}%"></i></div></td>
          <td class="num">${fmt(i.custoF, 2)}${i.custoF - i.custoS > 0.005 ? `<span class="small" style="display:block;color:var(--sinal)">+${fmt(i.custoF - i.custoS, 2)} FIT</span>` : ''}</td>
          <td>${i.outro ? '' : `<button class="btn mini" data-acao="rota" data-k="${k}">Diagrama</button>`}</td></tr>`;

  /* ---------- Inclusão de linhas ---------- */
  function candidatos(sec, q) {
    const t = norm(q).split(/\s+/).filter(Boolean), dic = A.BASE_REF.dicionarios(), out = [];
    const ok = s => t.every(x => s.indexOf(x) >= 0);
    const push = (cod, desc, info) => { if (out.length < 40 && (!t.length || ok(norm(cod + ' ' + desc)))) out.push({ cod, desc, info }); };
    if (sec === 'A') dic.eq.forEach((v, k) => push(k, v.d, `produtivo ${fmt(v.cp, 4)} · improdutivo ${fmt(v.ci, 4)}`));
    else if (sec === 'B') dic.mo.forEach((v, k) => push(k, v.d, `${fmt(v.ch, 4)} /${v.u}`));
    else if (sec === 'C') dic.mat.forEach((v, k) => push(k, v.d, `${fmt(v.pu, 4)} /${v.u}`));
    else if (sec === 'D') { if (!t.length) return out; for (const k of A.buscar(q)) { if (k === ED.k) continue; const c = A.BASE.get(k); push(k, c[1], `${fmt(c[11], 2)} /${c[2]}`); } }
    else if (sec === 'E') dic.tf.forEach((v, k) => push(k, v.d, `${fmt(v.cu, 2)} /${v.u}`));
    else if (sec === 'F') dic.fam.forEach((v, k) => push(k, v.veic || v.oth, v.oth && !v.ln ? `outro modal ${v.oth}` : `LN ${v.ln} · RP ${v.rp} · P ${v.p}`));
    return out;
  }
  function desenharPick() {
    const box = $('#edPick'); if (!box) return;
    if (!ED.pick) { box.innerHTML = ''; return; }
    const s = ED.pick, lst = candidatos(s, ED.pq);
    const dica = { A: 'equipamento (código E ou descrição)', B: 'mão de obra (código P ou descrição)', C: 'material (código M ou descrição)', D: 'composição (código ou descrição)', E: 'composição de tempo fixo (carga, manobra e descarga)', F: 'veículo de transporte (família de códigos LN, RP e P)' }[s];
    box.innerHTML = `<div class="pick"><div class="bloco-cab"><b>Inserir em ${NOMES[s]}</b><button class="btn mini" data-acao="edPickFechar">Fechar</button></div>
      <input type="search" id="edPq" placeholder="Buscar ${dica}" value="${esc(ED.pq)}" autocomplete="off">
      <div class="picklst">${lst.length ? lst.map(o => `<button class="pk" data-acao="edPickAdd" data-cod="${esc(o.cod)}"><span class="cod">${esc(s === 'F' ? o.desc : o.cod)}</span><span>${esc(s === 'F' ? '' : o.desc)}</span><span class="muted small">${esc(o.info)}</span></button>`).join('') : `<div class="muted small" style="padding:8px">${s === 'D' && !ED.pq.trim() ? 'Digite para buscar na base.' : 'Nada encontrado.'}</div>`}</div>
      ${s === 'E' || s === 'F' ? '<p class="muted small">Depois de inserir, informe na coluna A o código do insumo transportado (o que liga a linha ao quadro de DMT) e a quantidade.</p>' : ''}</div>`;
    const q = $('#edPq');
    q.addEventListener('input', () => { ED.pq = q.value; const pos = q.selectionStart; desenharPick(); const nq = $('#edPq'); nq.focus(); nq.setSelectionRange(pos, pos); });
  }
  function insumoSugerido(sec) {
    const usados = new Set(ED.draft[SECS[sec]].map(l => l[0]));
    const m = ED.draft[14].find(x => !usados.has(x[0]));
    return m ? m[0] : '';
  }
  function adicionar(sec, cod) {
    const dic = A.BASE_REF.dicionarios(), d = ED.draft, b = A.BASE;
    if (sec === 'A') { const v = dic.eq.get(cod); d[12].push([cod, 1, 1, 0, v.cp, v.ci, 0]); }
    else if (sec === 'B') { const v = dic.mo.get(cod); d[13].push([cod, 1, v.ch, 0]); }
    else if (sec === 'C') { const v = dic.mat.get(cod); d[14].push([cod, 1, v.pu, 0]); }
    else if (sec === 'D') { const c = b.get(cod); d[15].push([cod, 1, c[11], 0]); }
    else if (sec === 'E') { const v = dic.tf.get(cod), ins = insumoSugerido('E'); d[16].push([ins, (ins ? E.nomeInsumoF(b.descItem(ins)) + ' - ' : '') + (v.veic || v.d), cod, 0, v.u || 't', v.cu, 0]); }
    else if (sec === 'F') { const v = dic.fam.get(cod), ins = insumoSugerido('F'); d[17].push([ins, (ins ? E.nomeInsumoF(b.descItem(ins)) + ' - ' : '') + (v.veic || ''), 0, v.u || 'tkm', v.ln, v.rp, v.p, v.oth]); }
    ED.sujo = true; ED.pick = null; ED.pq = '';
    desenhar();
    A.toast(`Linha incluída em ${NOMES[sec]}. Ajuste a quantidade.`);

  /* ---------- Edição de células ---------- */
  function aplicarCelula(path, val) {
    const d = ED.draft;
    if (path === 'obs') { ED.motivo = val; ED.sujo = true; return; }
    const p = path.split('.');
    if (p[0] === 'h') {
      const i = +p[1];
      if (i === 1 || i === 2) d[i] = val; else { const v = parseNum(val); if (v === null) return A.toast('Valor numérico inválido.'); d[i] = v; }
    } else if (p[0] === 'p') {
      const j = +p[1], v = parseNum(val); if (v === null) return A.toast('Percentual inválido.');
      d[19][j][1] = d[19][j][1].replace(/\((\d+(?:[.,]\d+)?)\s*%\)\s*$/, '(' + v.toFixed(2) + '%)');
    } else {
      const sec = p[0], i = +p[1], f = +p[2], l = d[SECS[sec]][i];
      const texto = (sec === 'E' && (f === 0 || f === 2)) || (sec === 'F' && (f === 0 || f === 4 || f === 5 || f === 6));
      if (texto) {
        l[f] = val.trim();
        if (sec === 'E' && f === 2) { const t = A.BASE.get(l[2]); if (t) l[5] = t[11]; }
        if ((sec === 'E' || sec === 'F') && f === 0) {
          const veic = E.veiculoF(l[1]) || '';
          l[1] = (val.trim() ? E.nomeInsumoF(A.BASE.descItem(val.trim()) || val.trim()) : '') + (veic ? ' - ' + veic : '');
        }
      } else { const v = parseNum(val); if (v === null) return A.toast('Valor numérico inválido.'); l[f] = v; }
    }
    ED.sujo = true;
  }
  A.trocas.push(e => {
    const t = e.target;
    if (t.dataset && t.dataset.ed && ED.k) { aplicarCelula(t.dataset.ed, t.value); setTimeout(desenhar, 0); return true; }
    if (t.name === 'edFit' && ED.k) { ED.semFIT = t.value === 'sem'; desenhar(); return true; }
    return false;
  });

  /* ---------- Salvar ---------- */
  async function salvar() {
    const d = ED.draft;
    if ((d[12].length || d[13].length) && !(+d[3] > 0)) { A.toast('Informe a produção da equipe (maior que zero).'); return false; }
    if (!ED.motivo.trim()) {
      const r = await A.perguntar('Registre o motivo da alteração. Ele aparece no campo Obs. da composição, na planilha exportada e no memorial.', [{ rot: 'Motivo', val: '' }], 'Salvar');
      if (r === null) return false;
      ED.motivo = r[0];
    }
    const k = ED.k, ov = A.S.comps[k] || {};
    A.S.comps[k] = Object.assign({}, ov, { c: E.recalcular(d), motivo: ED.motivo, quando: new Date().toISOString(), base: `${A.BASE_REF.uf} ${A.BASE_REF.mes}` });
    delete A.S.comps[k].c._eq;
    A.refazBase(); A.mudou();
    ED.sujo = false; ED.draft = clone(A.BASE.get(k));
    desenhar(); A.render();
    A.toast(`Composição ${k} salva no projeto.`);
    return true;
  }
  function proximoCodigo() {
    let n = 1; while (A.BASE.get('U' + String(n).padStart(6, '0'))) n++;
    return 'U' + String(n).padStart(6, '0');
  }
  async function salvarNova() {
    const r = await A.perguntar('Salvar esta composição como nova composição própria do projeto. A composição original não muda.', [{ rot: 'Código (diferente dos códigos do SICRO)', val: proximoCodigo() }, { rot: 'Descrição', val: ED.draft[1] + (/(adaptada)$/.test(ED.draft[1]) ? '' : ' (adaptada)') }, { rot: 'Motivo', val: ED.motivo }], 'Criar composição');
    if (!r) return;
    const cod = r[0].trim().toUpperCase();
    if (!/^[A-Z0-9._-]{2,20}$/.test(cod)) { A.toast('Código inválido: use de 2 a 20 letras, números, ponto, hífen ou sublinhado.'); return; }
    if (A.BASE.get(cod)) { A.toast(`O código ${cod} já existe.`); return; }

    <p>Os resultados dependem integralmente dos dados informados pelo usuário: segmentos, volumes de tráfego (VMDf), previsão da operação PARE e SIGA, rotas e distâncias de transporte, velocidades e demais parâmetros. A ferramenta não substitui o projeto, os estudos de tráfego nem o julgamento do profissional legalmente habilitado, a quem cabe conferir os cálculos, justificar as premissas e responder pelo orçamento, com a respectiva Anotação de Responsabilidade Técnica.</p>
    <h3>4. Estudo de caso</h3>
    <p>O estudo de caso usa a obra fictícia do Caderno de Aplicação. Os polos de origem e destino e as distâncias marcados como premissa foram criados para fins didáticos e não representam obra, fornecedor ou local reais.</p>
    <h3>5. Composições alteradas</h3>
    <p>Uma composição alterada ou criada pelo usuário deixa de corresponder à referência publicada no SICRO. As alterações são de responsabilidade de quem as faz e devem ser justificadas; a ferramenta identifica essas composições na tela, nas planilhas exportadas e no memorial.</p>
    <h3>6. Privacidade e dados</h3>
    <p>Os cálculos são executados no próprio navegador. A ferramenta não envia o projeto, as planilhas importadas nem os resultados a servidores: os dados ficam no armazenamento local deste navegador, neste dispositivo. Para apagá-los, use “Novo projeto” ou limpe os dados do site no navegador. Os arquivos baixados ficam sob a guarda do usuário.</p>
    <h3>7. Ausência de garantias</h3>
    <p>A ferramenta é fornecida no estado em que se encontra, sem garantia de adequação a finalidade específica, de ausência de erros ou de disponibilidade contínua. O autor não responde por decisões, contratações ou prejuízos decorrentes do seu uso. Divergências devem ser resolvidas pelos documentos oficiais do DNIT.</p>
    <h3>8. Propriedade intelectual</h3>
    <p>Código, interface, textos e estudo de caso: © 2026 ${esc(A.AUTOR.nome)} (${esc(A.AUTOR.site)}). SICRO e DNIT são designações de seus titulares; os dados do SICRO são públicos e citados com a fonte.</p>

  const CAPS = [
    ['m1', 'O que o FIT remunera', () => `<p>Obras em rodovias abertas ao tráfego exigem sinalização, estreitamento de pista e, em pista simples, operação em meia pista. Essas interferências, somadas ao trânsito lento dos perímetros urbanos, alongam o tempo de viagem dos caminhões que abastecem a obra.</p>
      <p>Na 2ª edição do Volume 05, o FIT deixou de multiplicar o custo horário de equipamentos e mão de obra. Parte-se da premissa de que, dentro da área sinalizada, a produção não é afetada pelo tráfego; o que atrasa é o <b>transporte dos insumos</b>. Por isso o fator incide só sobre a parcela F (momento de transporte) das composições.</p>`],
    ['m2', 'Quando se aplica', () => `<p>O FIT só alcança o transporte feito pelo executor, com preço do insumo livre de frete (FOB). Insumos entregues pelo fornecedor na obra (CIF) ficam de fora: desmarque “FOB (FIT)” na linha do quadro.</p>

      <p>Todo insumo com FIT deve constar do quadro de DMT do projeto, e cabe ao orçamentista decidir se aplica o fator a todos ou só aos mais relevantes. A coluna de massa transportada do quadro serve a essa triagem.</p>`],
    ['m3', 'Atraso A1: PARE e SIGA', () => `<p>Na operação com uma única faixa para os dois sentidos, o tráfego é liberado alternadamente e o caminhão espera na fila. O atraso por viagem cresce com o volume diário por faixa:</p>
      <div class="eq">A1 = 70 + 0,0035 × VMDf  (s), Eq. 2</div>
      <p>Três condições precisam ocorrer juntas: o orçamento prevê a sinalização de ocupação da pista (SICRO 5213850 ou similar), a obra está em rodovia pavimentada e o trajeto do insumo passa pela extensão da obra. Se o segmento tiver mais de um VMDf, usa-se a média ponderada pelas distâncias rurais (Eq. 1).</p>`],
    ['m4', 'Atraso A2: vias urbanas', () => `<p>Nos perímetros urbanos, com características de vias coletoras e locais, a velocidade média adotada é de 30 km/h contra 60 km/h na rodovia rural. A diferença de tempo por quilômetro dá o fator de conversão:</p>
      <div class="eq">Fc = (1/Vu − 1/Vp) × 3.600 = 60 s/km, Eq. 3</div>

      <p>A velocidade urbana pode ser ajustada às particularidades da cidade, com justificativa técnica. Ajuste Vu na etapa Obra; o texto da justificativa sai no memorial.</p>`],
    ['m5', 'Cálculo do FIT', () => `<p>Com os atrasos em segundos, o FIT é a razão entre o tempo total de viagem e o tempo de referência a 60 km/h (Fp = 3.600/60 = 60 s/km, Eq. 5) sobre a DMT pavimentada (DMTp = DMTr + DMTu, Eq. 6):</p>

        </div><div id="lOut" class="aviso"></div>
        <p class="muted small">Valores iniciais: massa asfáltica comercial do Caderno de Aplicação (FIT 1,3160).</p></div>`],
    ['m6', 'Aplicação no momento de transporte', () => `<p>O FIT multiplica a DMT pavimentada, gerando a DMTF (Eq. 8), que entra na parcela F de cada composição:</p>

      <p>Os custos unitários de transporte (R$/tkm) vêm das composições 5914xxx e 5915xxx da própria base, na versão de leito natural, revestimento primário e pavimentada indicada em cada linha F do relatório analítico. O relatório publica esses custos com o momento de transporte zerado; a ferramenta recalcula cada composição, e as auxiliares recursivamente, com as DMTs do quadro.</p>

    ['m8', 'Composições no formato analítico', () => `<p>Qualquer composição abre em uma grade com as mesmas linhas e colunas (A a I) do relatório analítico do SICRO em Excel: cabeçalho com FIC e produção da equipe, seções A a F, totais e o campo Obs. Abra pelo código na busca, pelo botão Analítica da lista do orçamento ou por Abrir nos resultados. Na seção D, o código da auxiliar abre a auxiliar.</p>
      <p>As células de fundo amarelo e texto azul são entradas: quantidades, utilização operativa e improdutiva, custos horários, preços, produção da equipe, FIC, percentuais, códigos de transporte e o texto de Obs. Cada alteração recalcula a composição com as regras do relatório, validadas nas 6.619 composições da base: custo horário = quantidade × (operativa × produtivo + improdutiva × improdutivo); custo unitário de execução = custo horário total ÷ produção; FIC = fator × (Σ custos improdutivos + mão de obra) ÷ produção; linhas com 4 casas e total com 2.</p>
      <p>Use “+ inserir” no cabeçalho de cada seção para incluir equipamentos, mão de obra, materiais, auxiliares, tempo fixo ou transporte, e o × no número da linha para remover. As células que diferem do SICRO ficam contornadas em laranja, com o valor original na dica.</p>
      <p>“Salvar alterações” vale para todo o projeto, inclusive onde a composição é auxiliar; “Salvar como nova” cria uma composição própria (código U000001, por exemplo) e oferece substituir a original no orçamento. O motivo registrado vai para o campo Obs., para a planilha e para o memorial. “Restaurar SICRO” desfaz tudo.</p>`],

      <p>“Baixar orçamento analítico (.xlsx)”, em Resultados, gera três abas ligadas: Orçamento (itens por grupo, com totais e BDI), Quadro DMT (A1, A2 e FIT calculados por fórmula a partir das DMTs, do VMDf e dos parâmetros Vu, Vp, PARE e SIGA e limite de 100 km) e Composições (todas as composições da árvore, com as auxiliares ligadas às respectivas composições e o momento de transporte ligado ao quadro). Alterar uma DMT ou um VMDf na aba Quadro DMT atualiza o orçamento inteiro.</p>
      <p>A planilha foi conferida recalculando no LibreOffice: os 83 itens do estudo de caso coincidem com a ferramenta ao centavo, também depois de alterar DMT e VMDf na própria planilha.</p>`],
    ['m10', 'Como usar esta ferramenta', () => `<p>1. Em <b>Obra</b>, descreva os segmentos com o tipo de via e o VMDf, e indique se há operação PARE e SIGA. Para ver um orçamento completo pronto, use “Carregar o estudo de caso”.</p>
      <p>2. Em <b>Composições</b>, busque e inclua as composições com as quantidades. As atividades auxiliares entram automaticamente. Abra a composição para conferir ou editar no formato analítico.</p>
      <p>3. No <b>Quadro de DMT</b> aparecem todos os insumos das parcelas F da árvore. Informe origem, destino e distâncias (ou use o Diagrama). Para insumos com a mesma rota, marque as linhas e copie a rota de uma delas.</p>

  Object.assign(A.acoes, {
    ir: b => { const d = $('#dlg'); if (d.open) A.fecharDlg(); A.irPara(b.dataset.aba); },

      A.carregarProjeto(A.projetoVazio()); A.render(); A.toast('Novo projeto iniciado.');
    },
    addseg: () => { const s = A.S.obra.segs, u = s[s.length - 1]; s.push({ ini: u ? +u.fim : 0, fim: u ? +u.fim + 10 : 10, tipo: 'rural', vmdf: u ? +u.vmdf || 0 : 0 }); A.mudou(); A.render(); },
    delseg: b => { A.S.obra.segs.splice(+b.dataset.i, 1); A.mudou(); A.render(); },
    add: b => { incluir(b.dataset.k); A.render(); A.toast(`${b.dataset.k} incluída no orçamento.`); },
    del: b => { A.S.orc = A.S.orc.filter(i => i.id !== +b.dataset.id); A.mudou(); A.render(); },
    limpar: async () => { if (await A.confirmar('Remover todas as composições da lista do orçamento?', 'Remover todas')) { A.S.orc = []; A.mudou(); A.render(); } },
    colar: () => {
      const txt = $('#colar').value; let n = 0; const ruins = [];
      txt.split(/\r?\n/).forEach(l => {
        l = l.trim(); if (!l) return;
        const p = l.split(/\t|;/).map(x => x.trim());
        let [k, q, g] = p.length >= 2 ? p : l.split(/\s+/);
        k = String(k || '').trim().toUpperCase();
        if (/^\d+$/.test(k)) k = k.padStart(7, '0');
        if (!A.BASE.get(k)) { ruins.push(l); return; }
        incluir(k, parseNum(q) || 0, g || ''); n++;
      });
      A.render(); A.toast(`${n} composição(ões) incluída(s)${ruins.length ? `; ${ruins.length} linha(s) ignorada(s) por código inexistente` : ''}.`, 5000);
    },
    rota: b => A.abrirRota(b.dataset.k),
    aplicaSel: () => {
      const f = $('#fonteRota').value; if (!f) { A.toast('Escolha o insumo de onde copiar a rota.'); return; }
      const src = A.S.rotas[f];
      A.SEL.forEach(k => {
        if (k === f) return;
        const r = A.rotaDe(k);
        ['origem', 'destino', 'ln', 'rp', 'dmtr', 'dmtu', 'vmdf', 'passa', 'fit'].forEach(c => r[c] = src[c]);
        if (src.helper) r.helper = Object.assign({}, src.helper);
        if (r.fonte) { r.fonte = 'Usuário'; r.nota = 'Rota copiada de ' + f + '.'; }
      });
      A.toast(`Rota de ${f} copiada para ${A.SEL.size} insumo(s).`); A.SEL.clear(); A.mudou(); A.render();
    },
    limpaSel: () => { A.SEL.clear(); A.render(); },
    xlsxOrc: () => {
      const r = A.calc();
      const buf = window.FITExport.exportarOrcamento({ base: A.BASE, motor: r.mF, calc: r, projeto: A.S, ctx: r.c, titulo: A.S.obra.nome || 'Orçamento com FIT' });
      A.baixar('orcamento-analitico-fit.xlsx', new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    },
    memorial: () => A.baixar('memorial-fit.html', A.memorialHTML()),
    imprimir: () => {
      const h = A.memorialHTML(); const body = /<body>([\s\S]*)<\/body>/.exec(h)[1]; const st = /<style>([\s\S]*?)<\/style>/.exec(h)[1];
      $('#memorial').innerHTML = `<style>@media print{${st.replace(/body\{/, '#memorial{')}}</style>` + body;
      try { window.print(); } catch (e) { A.toast('A impressão não está disponível aqui; use “Baixar memorial”.'); }
    },
    projSalvar: () => {
      const b = A.BASE_REF;
      const dados = Object.assign({ app: 'Calculadora do FIT', versao: A.VERSAO, base: `${b.uf} ${b.mes}`, salvoEm: new Date().toISOString() }, A.S);
      const nome = (A.S.obra.nome || 'projeto').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w-]+/g, '-').replace(/^-|-$/g, '').toLowerCase().slice(0, 50) || 'projeto';
      A.baixar(`fit-${nome}.json`, JSON.stringify(dados, null, 1));
    },
    selTodos: () => { }
  });

  async function abrirProjeto(arq) {
    try {
      const p = JSON.parse(await arq.text());
      if (!p || !p.obra || !Array.isArray(p.orc)) throw new Error('o arquivo não é um projeto da Calculadora do FIT');
      if ((A.S.orc.length || Object.keys(A.S.comps || {}).length) && !await A.confirmar(`Abrir “${esc(p.obra.nome || arq.name)}” substitui o projeto atual. Continuar?`, 'Abrir projeto')) return;
      ['app', 'versao', 'base', 'salvoEm'].forEach(k => delete p[k]);
      A.carregarProjeto(p); A.render();
      A.toast(`Projeto aberto: ${p.orc.length} composição(ões)${Object.keys(p.comps || {}).length ? `, ${Object.keys(p.comps).length} alterada(s) ou própria(s)` : ''}.`);
    } catch (e) { A.toast('Não foi possível abrir: ' + (e && e.message ? e.message : e), 6000); }
  }

  /* ---------- Trocar base ---------- */
  function dlgBase() {
    const B = A.BASE_REF, alt = Object.keys(A.S.comps || {}).length;
    A.abrirDlg('<h3>Base de custos</h3><div class="muted small">Relatório Analítico de Composições de Custos do SICRO</div>', `
      <p>Base em uso: <b>${esc(B.uf)}, ${esc(B.mes)}</b>, ${fmt(B.raw.comps.length, 0)} composições (${A.BASE_ORIGEM}).</p>
      <p>Para outra UF ou mês, selecione o arquivo .xlsx do relatório analítico de composições publicado pelo DNIT. A leitura é feita neste navegador e leva alguns segundos.</p>
      ${alt ? `<div class="aviso">O projeto tem ${alt} composição(ões) alterada(s) ou própria(s), salvas com os preços da base atual. Elas continuam valendo na nova base até serem restauradas.</div>` : ''}
      <input type="file" id="arqBase" accept=".xlsx">
      <div id="progBase" class="aviso hide"></div>
      <div class="acoes" style="margin-top:12px">${A.BASE_ORIGEM === 'importada' ? '<button class="btn" id="voltaEmb">Voltar à base embutida (SP, julho/2026)</button>' : ''}</div>`);
    $('#arqBase').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      const p = $('#progBase'); p.classList.remove('hide'); p.textContent = 'Lendo o arquivo…';
      try {
        const buf = await f.arrayBuffer();
        const rows = await window.XLSXMini.readXlsxRows(buf, 9, m => { p.textContent = m; });
        p.textContent = 'Montando as composições…';
        await new Promise(r => setTimeout(r, 20));
        const raw = window.SicroParse.parseRows(rows);
        A.usarBase(raw, 'importada');
        try { await A.idbPut('importada', raw); } catch (err) { }
        A.fecharDlg(); A.render(); A.toast(`Base ${raw.uf}, ${raw.mes} carregada: ${fmt(raw.comps.length, 0)} composições.`);
      } catch (err) { p.textContent = 'Não foi possível ler o arquivo: ' + (err && err.message ? err.message : err); }
    });
    const v = $('#voltaEmb');
    v && v.addEventListener('click', async () => { try { await A.idbDel('importada'); } catch (e) { } A.usarBase(A.BASE_EMB, 'embutida'); A.fecharDlg(); A.render(); A.toast('Base embutida restaurada.'); });
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-acao],[data-aba],[data-cap]');
    if (!b || b.disabled) return;
    if (b.dataset.cap) { A.acoes.capitulo(b); return; }
    const a = b.dataset.acao;
    if (!a && b.dataset.aba) { A.irPara(b.dataset.aba); return; }
    const fn = A.acoes[a];
    if (fn) { try { await fn(b, e); } catch (err) { console.error(err); A.toast('Erro: ' + (err && err.message ? err.message : err), 6000); } }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    for (const h of A.trocas) if (h(e)) return;
    if (t.id === 'arqProj') { const f = t.files[0]; t.value = ''; if (f) abrirProjeto(f); return; }
    if (t.name === 'ps') { A.S.obra.pareSiga = t.value; A.mudou(); A.render(); return; }
    if (t.name === 'ordem') { A.UI.ordem = t.value; A.salvar(); A.render(); return; }
    if (t.dataset.acao === 'selTodos') { const r = A.calc(); if (t.checked) r.ins.forEach(i => { if (!i.outro) A.SEL.add(i.k); }); else A.SEL.clear(); A.render(); return; }
    if (t.dataset.sel !== undefined) { if (t.checked) A.SEL.add(t.dataset.sel); else A.SEL.delete(t.dataset.sel); A.render(); return; }
    if (t.dataset.o) {
      const k = t.dataset.o, o = A.S.obra;
      if (t.type === 'checkbox') o[k] = t.checked;
      else if (t.dataset.num) { const v = parseNum(t.value); o[k] = v === null ? (k === 'Vu' ? 30 : 0) : v; if (k === 'Vu' && o.Vu <= 0) o.Vu = 30; }
      else o[k] = t.value;
      A.mudou(); if (t.dataset.num || t.type === 'checkbox') A.rerender(); return;
    }
    if (t.dataset.seg !== undefined) {
      const s = A.S.obra.segs[+t.dataset.seg], c = t.dataset.campo;
      if (c === 'tipo') s.tipo = t.value; else s[c] = parseNum(t.value) || 0;
      A.mudou(); A.rerender(); return;
    }
    if (t.dataset.id !== undefined && t.dataset.campo) {
      const it = A.S.orc.find(i => i.id === +t.dataset.id); if (!it) return;
      if (t.dataset.campo === 'qty') it.qty = parseNum(t.value) || 0; else it[t.dataset.campo] = t.value;
      A.mudou(); A.rerender(); return;
    }
    if (t.dataset.r !== undefined) {
      const r = A.rotaDe(t.dataset.r), c = t.dataset.campo;
      if (t.type === 'checkbox') r[c] = t.checked;
      else if (c === 'origem' || c === 'destino') r[c] = t.value;
      else if (c === 'vmdf') r[c] = parseNum(t.value);
      else r[c] = Math.max(0, parseNum(t.value) || 0);
      if (r.fonte && r.fonte !== 'Usuário' && ['ln', 'rp', 'dmtr', 'dmtu', 'vmdf', 'oth', 'passa', 'fit'].includes(c)) { r.nota = `Alterada pelo usuário (antes: ${r.fonte === 'Caderno' ? 'Tabela 10 do Caderno' : r.fonte === 'À parte' ? 'transporte orçado à parte' : 'premissa do estudo'}).`; r.fonte = 'Usuário'; }
      A.mudou(); A.rerender(); return;
    }
  });
  const fecharComConfirma = async () => {
    if (A.antesFechar && !await A.antesFechar()) return;
    A.fecharDlg();
  };
  $('#dlgFechar').addEventListener('click', fecharComConfirma);
  $('#dlg').addEventListener('cancel', e => { e.preventDefault(); fecharComConfirma(); });
  $('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) fecharComConfirma(); });
  $('#btnBase').addEventListener('click', dlgBase);
  $('#btnTema').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nv = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nv); A.UI.tema = nv; A.salvar();
  });
  if (A.UI.tema) document.documentElement.setAttribute('data-theme', A.UI.tema);

  /* ---------- Início ---------- */
  (async function init() {
    const comAbertura = !A.UI.semAbertura && !/[?#&]semabertura\b/.test(location.search + location.hash);
    const abertura = comAbertura ? A.mostrarAbertura() : null;
    if (comAbertura) $('#carga').classList.add('hide');
    try {
      A.BASE_EMB = await A.gunzipB64($('#base-gz').textContent);
      let raw = A.BASE_EMB, origem = 'embutida';
      try { const imp = await A.idbGet('importada'); if (imp && imp.comps) { raw = imp; origem = 'importada'; } } catch (e) { }
      A.usarBase(raw, origem);
      A.irPara(A.UI.aba || 'obra');
      $('#carga').remove();
      if (abertura) { A.aberturaPronta(`Base SICRO ${raw.uf}, ${raw.mes}: ${fmt(raw.comps.length, 0)} composições`); await abertura; }
      if (!A.UI.avisos || A.UI.avisos.ver !== A.AVISOS_VER) await A.mostrarAvisos(false);
    } catch (e) {
      const c = $('#carga');
      const msg = 'Não foi possível carregar a base embutida: ' + (e && e.message ? e.message : e) + '. Use um navegador atualizado (Chrome, Edge, Firefox ou Safari recentes).';
      if (c) { c.classList.remove('hide'); c.textContent = msg; }
      $('#abertura').classList.add('hide');
    }
  })();
  window.__FIT = { A, get S() { return A.S; }, calc: () => A.calc(), render: () => A.render(), irPara: a => A.irPara(a), memorialHTML: () => A.memorialHTML() };
})();
</script>
</body>
</html>
