document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"pt-BR\" data-tema=\"claro\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>CompressorSelect Pro v2.3 — seleção e dimensionamento de compressores de ar<\/title>\n<meta name=\"description\" content=\"Ferramenta offline para dimensionamento de centrais de ar comprimido: demanda, perfil horário, potência, rede, reservatório, NR-13, conformidade normativa e custo de energia.\">\n<style>\n/* ============================================================\n   CompressorSelect Pro — estilo\n   Paleta ancorada na ABNT NBR 6493: tubulação de ar comprimido\n   é identificada em AZUL. Daí o azul como cor de sistema, o\n   grafite de aço como neutro e o amarelo NR-26 como alerta.\n   ============================================================ */\n:root {\n  --ar:        #0B57A4;\n  --ar-esc:    #06356A;\n  --ar-claro:  #E3EDF8;\n  --ar-linha:  #B9D2EA;\n  --aco:       #1F272F;\n  --aco-med:   #5C6B7A;\n  --aco-fraco: #93A1AE;\n  --bg:        #E9EEF3;\n  --papel:     #FFFFFF;\n  --papel-2:   #F5F8FA;\n  --borda:     #CBD6E0;\n  --nr26:      #E8A200;\n  --ok:        #12735A;\n  --ok-bg:     #E4F2ED;\n  --alerta:    #B33A2B;\n  --alerta-bg: #FBE9E6;\n  --aviso-bg:  #FDF4E0;\n  --placa-1:   #D8DEE4;\n  --placa-2:   #B6C0CA;\n  --placa-txt: #17202A;\n  --sombra:    0 1px 2px rgba(31,39,47,.08), 0 4px 14px rgba(31,39,47,.06);\n  --mono: ui-monospace, \"SF Mono\", \"Cascadia Mono\", \"Roboto Mono\", Consolas, \"Liberation Mono\", monospace;\n  --sans: system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --r: 4px;\n}\n[data-tema=\"escuro\"] {\n  --ar:        #5BA3E8;\n  --ar-esc:    #A9CDF0;\n  --ar-claro:  #16283C;\n  --ar-linha:  #27455F;\n  --aco:       #E6ECF2;\n  --aco-med:   #9BAAB9;\n  --aco-fraco: #6B7A89;\n  --bg:        #11171D;\n  --papel:     #1A222A;\n  --papel-2:   #212B34;\n  --borda:     #2E3A45;\n  --nr26:      #F0B429;\n  --ok:        #4FBF9B;\n  --ok-bg:     #14302A;\n  --alerta:    #F08573;\n  --alerta-bg: #35201C;\n  --aviso-bg:  #33290F;\n  --placa-1:   #313C47;\n  --placa-2:   #232C35;\n  --placa-txt: #DCE4EC;\n  --sombra:    0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);\n}\n\n* { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody {\n  margin: 0; background: var(--bg); color: var(--aco);\n  font-family: var(--sans); font-size: 14px; line-height: 1.5;\n}\n\n/* ---------- Cabeçalho ---------- */\n.topo {\n  background: var(--ar-esc); color: #fff;\n  border-bottom: 3px solid var(--nr26);\n  position: sticky; top: 0; z-index: 40;\n}\n.topo-in {\n  max-width: 1360px; margin: 0 auto; padding: 10px 18px;\n  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;\n}\n.marca { display: flex; align-items: center; gap: 10px; }\n.marca svg { flex: none; }\n.marca h1 {\n  margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em;\n}\n.marca .ver {\n  font-family: var(--mono); font-size: 10px; letter-spacing: .1em;\n  color: #9FC4E6; text-transform: uppercase; display: block; margin-top: 1px;\n}\n.topo-acoes { margin-left: auto; display: flex; gap: 8px; align-items: center; }\n.btn-topo {\n  background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.22);\n  padding: 6px 11px; border-radius: var(--r); cursor: pointer;\n  font-family: var(--sans); font-size: 12px; font-weight: 500;\n}\n.btn-topo:hover { background: rgba(255,255,255,.22); }\n\n/* ---------- Abas ---------- */\n.abas {\n  background: var(--papel); border-bottom: 1px solid var(--borda);\n  position: sticky; top: 51px; z-index: 30; overflow-x: auto;\n}\n.abas-in { max-width: 1360px; margin: 0 auto; display: flex; padding: 0 10px; }\n.aba {\n  background: none; border: none; border-bottom: 3px solid transparent;\n  padding: 11px 14px; cursor: pointer; white-space: nowrap;\n  font-family: var(--sans); font-size: 12.5px; font-weight: 550; color: var(--aco-med);\n  display: flex; align-items: center; gap: 7px;\n}\n.aba:hover { color: var(--ar); background: var(--papel-2); }\n.aba[aria-selected=\"true\"] { color: var(--ar); border-bottom-color: var(--ar); }\n.aba .num {\n  font-family: var(--mono); font-size: 10px; color: var(--aco-fraco);\n}\n.aba[aria-selected=\"true\"] .num { color: var(--ar); }\n\n/* ---------- Layout ---------- */\nmain { max-width: 1360px; margin: 0 auto; padding: 18px; }\n.painel[hidden] { display: none; }\n.grade { display: grid; gap: 16px; }\n.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }\n.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }\n.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }\n.g-2-1 { grid-template-columns: minmax(0,2fr) minmax(0,1fr); }\n.g-1-2 { grid-template-columns: minmax(0,1fr) minmax(0,2fr); }\n@media (max-width: 980px) { .g2,.g3,.g4,.g-2-1,.g-1-2 { grid-template-columns: 1fr; } }\n\n.cartao {\n  background: var(--papel); border: 1px solid var(--borda);\n  border-radius: var(--r); box-shadow: var(--sombra);\n}\n.cartao > h2, .cartao > h3 {\n  margin: 0; padding: 11px 15px; border-bottom: 1px solid var(--borda);\n  font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em;\n  color: var(--aco-med); display: flex; align-items: center; gap: 8px;\n}\n.cartao > h2 .tag-num {\n  font-family: var(--mono); color: var(--ar); font-size: 11px;\n}\n.corpo { padding: 15px; }\n.corpo.solto > * + * { margin-top: 14px; }\n\n/* ---------- Formulários ---------- */\nlabel.campo { display: block; }\n.rotulo {\n  display: block; font-size: 10.5px; font-weight: 650; letter-spacing: .085em;\n  text-transform: uppercase; color: var(--aco-med); margin-bottom: 4px;\n}\n.rotulo .un { color: var(--aco-fraco); font-weight: 500; letter-spacing: .04em; }\ninput[type=text], input[type=number], select, textarea {\n  width: 100%; padding: 7px 9px; border: 1px solid var(--borda);\n  border-radius: var(--r); background: var(--papel); color: var(--aco);\n  font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums;\n}\nselect, textarea { font-family: var(--sans); }\ninput:focus, select:focus, textarea:focus {\n  outline: 2px solid var(--ar); outline-offset: -1px; border-color: var(--ar);\n}\ninput[readonly] { background: var(--papel-2); color: var(--aco-med); }\n.dica { font-size: 11.5px; color: var(--aco-med); margin: 4px 0 0; }\nfieldset { border: 1px solid var(--borda); border-radius: var(--r); padding: 12px; margin: 0; }\nlegend {\n  font-size: 10.5px; font-weight: 650; letter-spacing: .085em;\n  text-transform: uppercase; color: var(--aco-med); padding: 0 6px;\n}\n\n.btn {\n  padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--ar);\n  background: var(--ar); color: #fff; cursor: pointer;\n  font-family: var(--sans); font-size: 13px; font-weight: 600;\n}\n.btn:hover { background: var(--ar-esc); border-color: var(--ar-esc); }\n.btn.sec { background: var(--papel); color: var(--ar); }\n.btn.sec:hover { background: var(--ar-claro); }\n.btn.mini { padding: 4px 9px; font-size: 11.5px; }\n.btn.perigo { background: var(--papel); color: var(--alerta); border-color: var(--alerta); }\n.btn:focus-visible, .aba:focus-visible, .btn-topo:focus-visible { outline: 2px solid var(--nr26); outline-offset: 2px; }\n.linha-btn { display: flex; gap: 8px; flex-wrap: wrap; }\n\n/* ---------- Tabelas ---------- */\ntable.dados { width: 100%; border-collapse: collapse; font-size: 12.5px; }\ntable.dados th {\n  text-align: left; padding: 7px 9px; background: var(--papel-2);\n  border-bottom: 1px solid var(--borda); font-size: 10px; font-weight: 700;\n  letter-spacing: .07em; text-transform: uppercase; color: var(--aco-med);\n  position: sticky; top: 0; z-index: 1;\n}\ntable.dados td { padding: 6px 9px; border-bottom: 1px solid var(--borda); vertical-align: middle; }\ntable.dados tbody tr:hover { background: var(--papel-2); }\ntable.dados td.n, table.dados th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }\n.rolagem { max-height: 480px; overflow: auto; }\ntable.dados input, table.dados select { padding: 4px 6px; font-size: 12px; }\n\n/* ---------- Placa de identificação (elemento-assinatura) ---------- */\n.placa {\n  position: relative; border-radius: 3px; padding: 18px 22px;\n  background: linear-gradient(155deg, var(--placa-1) 0%, var(--placa-2) 55%, var(--placa-1) 100%);\n  color: var(--placa-txt);\n  border: 1px solid rgba(0,0,0,.18);\n  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), var(--sombra);\n}\n.placa::before, .placa::after,\n.placa .parafuso {\n  content: \"\"; position: absolute; width: 9px; height: 9px; border-radius: 50%;\n  background: radial-gradient(circle at 35% 30%, #fff 0%, #9AA5B0 45%, #5E6873 100%);\n  box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);\n}\n.placa::before { top: 7px; left: 7px; }\n.placa::after { top: 7px; right: 7px; }\n.placa .parafuso.pi { bottom: 7px; left: 7px; }\n.placa .parafuso.pd { bottom: 7px; right: 7px; }\n.placa-topo {\n  display: flex; justify-content: space-between; align-items: baseline;\n  border-bottom: 1.5px solid rgba(0,0,0,.28); padding-bottom: 8px; margin-bottom: 12px;\n}\n.placa-marca {\n  font-family: var(--mono); font-size: 11px; font-weight: 700;\n  letter-spacing: .22em; text-transform: uppercase;\n}\n.placa-id { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; opacity: .7; }\n.placa-modelo {\n  font-size: 25px; font-weight: 700; letter-spacing: -.015em; margin: 0 0 2px;\n  line-height: 1.15;\n}\n.placa-tipo { font-size: 12px; opacity: .78; margin: 0 0 14px; }\n.placa-grade {\n  display: grid; grid-template-columns: repeat(auto-fit, minmax(96px,1fr)); gap: 12px 18px;\n}\n.placa-item .k {\n  font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;\n  opacity: .62; font-weight: 700; display: block;\n}\n.placa-item .v {\n  font-family: var(--mono); font-size: 17px; font-weight: 600;\n  font-variant-numeric: tabular-nums; letter-spacing: -.01em;\n}\n.placa-item .v small { font-size: 10.5px; font-weight: 500; opacity: .7; letter-spacing: 0; }\n\n/* ---------- Indicadores ---------- */\n.kpi-linha { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 1px; background: var(--borda); border: 1px solid var(--borda); border-radius: var(--r); overflow: hidden; }\n.kpi { background: var(--papel); padding: 11px 13px; }\n.kpi .k { font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--aco-med); font-weight: 700; display: block; margin-bottom: 3px; }\n.kpi .v { font-family: var(--mono); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }\n.kpi .v small { font-size: 11px; font-weight: 500; color: var(--aco-med); }\n.kpi.destaque .v { color: var(--ar); }\n.kpi.bom .v { color: var(--ok); }\n.kpi.ruim .v { color: var(--alerta); }\n\n.selo {\n  display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px;\n  border-radius: 3px; font-size: 10.5px; font-weight: 650;\n  letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;\n}\n.selo.ok { background: var(--ok-bg); color: var(--ok); }\n.selo.aviso { background: var(--aviso-bg); color: #9A6B00; }\n.selo.erro { background: var(--alerta-bg); color: var(--alerta); }\n.selo.info { background: var(--ar-claro); color: var(--ar); }\n[data-tema=\"escuro\"] .selo.aviso { color: var(--nr26); }\n\n.nota {\n  border-left: 3px solid var(--ar); background: var(--ar-claro);\n  padding: 10px 13px; border-radius: 0 var(--r) var(--r) 0; font-size: 12.5px;\n}\n.nota.aviso { border-left-color: var(--nr26); background: var(--aviso-bg); }\n.nota.erro { border-left-color: var(--alerta); background: var(--alerta-bg); }\n.nota.ok { border-left-color: var(--ok); background: var(--ok-bg); }\n.nota strong { display: block; margin-bottom: 3px; }\n\n/* ---------- Memória de cálculo ---------- */\n.memoria { font-family: var(--mono); font-size: 12.5px; }\n.memoria .passo { border-bottom: 1px dashed var(--borda); padding: 9px 0; }\n.memoria .passo:last-child { border-bottom: none; }\n.memoria .titulo-passo {\n  font-family: var(--sans); font-size: 11px; font-weight: 700;\n  text-transform: uppercase; letter-spacing: .07em; color: var(--aco-med); margin-bottom: 5px;\n}\n.memoria .formula { color: var(--aco-med); font-size: 12px; }\n.memoria .resultado { color: var(--ar); font-weight: 600; font-size: 14px; }\n.memoria .ref { font-family: var(--sans); font-size: 11px; color: var(--aco-fraco); font-style: italic; }\n\n/* ---------- Cartões de modelo ---------- */\n.modelo-card {\n  border: 1px solid var(--borda); border-radius: var(--r); padding: 11px 13px;\n  background: var(--papel); display: flex; gap: 13px; align-items: center;\n  cursor: pointer; text-align: left; width: 100%; font-family: inherit;\n}\n.modelo-card:hover { border-color: var(--ar); background: var(--papel-2); }\n.modelo-card.sel { border-color: var(--ar); box-shadow: inset 3px 0 0 var(--ar); background: var(--ar-claro); }\n.modelo-card .pos {\n  font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--aco-fraco);\n  min-width: 26px;\n}\n.modelo-card.sel .pos { color: var(--ar); }\n.modelo-card .info { flex: 1; min-width: 0; }\n.modelo-card .nome { font-weight: 650; font-size: 13.5px; }\n.modelo-card .sub { font-size: 11.5px; color: var(--aco-med); }\n.modelo-card .esp {\n  font-family: var(--mono); font-size: 11.5px; color: var(--aco-med);\n  font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap;\n}\n.modelo-card .esp b { color: var(--aco); font-size: 13px; }\n\n/* ---------- Diversos ---------- */\n.filtros { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; }\n.chips { display: flex; flex-wrap: wrap; gap: 6px; }\ndetails.norma { border: 1px solid var(--borda); border-radius: var(--r); }\ndetails.norma > summary {\n  padding: 9px 13px; cursor: pointer; font-weight: 600; font-size: 13px;\n  list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center;\n}\ndetails.norma > summary::-webkit-details-marker { display: none; }\ndetails.norma > summary::after { content: \"+\"; font-family: var(--mono); color: var(--ar); font-size: 16px; }\ndetails.norma[open] > summary::after { content: \"−\"; }\ndetails.norma > div { padding: 0 13px 13px; font-size: 12.5px; }\ndetails.norma .cod {\n  font-family: var(--mono); font-size: 11px; color: var(--ar);\n  letter-spacing: .04em; display: block; margin-bottom: 3px;\n}\n.rodape {\n  max-width: 1360px; margin: 0 auto; padding: 22px 18px 40px;\n  font-size: 11.5px; color: var(--aco-med); border-top: 1px solid var(--borda);\n}\n.rodape code { font-family: var(--mono); font-size: 11px; }\n.aviso-dados {\n  background: var(--aviso-bg); border: 1px solid var(--nr26);\n  border-radius: var(--r); padding: 11px 14px; font-size: 12.5px; margin-bottom: 16px;\n}\n.aviso-dados b { color: #8A5F00; }\n[data-tema=\"escuro\"] .aviso-dados b { color: var(--nr26); }\n#relatorio-txt { font-family: var(--mono); font-size: 11.5px; min-height: 420px; white-space: pre; }\n.barra { height: 5px; background: var(--borda); border-radius: 3px; overflow: hidden; }\n.barra > i { display: block; height: 100%; background: var(--ar); }\n.barra.ok > i { background: var(--ok); }\n.barra.ruim > i { background: var(--alerta); }\n.oculto { display: none !important; }\n@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }\n/* ---------- Impressão / geração de PDF ----------\n   Antes da v2.3 a regra `.painel[hidden]{display:block}` mandava TODAS\n   as abas para o papel de uma vez, produzindo dezenas de páginas\n   desconexas. Agora a impressão renderiza um documento próprio\n   (#doc-impressao), montado no momento do clique, e o resto da\n   interface é suprimido. */\n#doc-impressao { display: none; }\n\n@media print {\n  @page { size: A4 portrait; margin: 16mm 14mm 18mm 14mm; }\n\n  html, body { background: #fff !important; color: #000 !important; }\n  body { font-size: 10.5pt; line-height: 1.42; }\n\n  /* Suprime a aplicação inteira; imprime só o documento montado */\n  .topo, .abas, .painel, .linha-btn, .btn, .csp-modal, #csp-splash { display: none !important; }\n  #doc-impressao { display: block !important; }\n\n  #doc-impressao .doc-cab {\n    border-bottom: 2.5pt solid #000; padding-bottom: 6pt; margin-bottom: 12pt;\n  }\n  #doc-impressao .doc-cab h1 { font-size: 15pt; margin: 0 0 3pt; letter-spacing: .2pt; }\n  #doc-impressao .doc-cab .sub { font-size: 9pt; color: #333; }\n  #doc-impressao .doc-meta {\n    width: 100%; border-collapse: collapse; font-size: 8.6pt; margin-top: 7pt;\n  }\n  #doc-impressao .doc-meta td { padding: 1.5pt 0; vertical-align: top; }\n  #doc-impressao .doc-meta td:first-child { color: #444; width: 32%; }\n  #doc-impressao .doc-meta td:last-child { font-family: var(--mono); }\n\n  #doc-impressao h2 {\n    font-size: 11pt; margin: 13pt 0 5pt; padding-bottom: 2pt;\n    border-bottom: .8pt solid #999; break-after: avoid; page-break-after: avoid;\n  }\n  #doc-impressao pre {\n    font-family: var(--mono); font-size: 8.4pt; line-height: 1.38;\n    white-space: pre-wrap; word-wrap: break-word; margin: 0;\n  }\n  #doc-impressao .doc-aviso {\n    border: .8pt solid #000; padding: 6pt 8pt; margin-top: 12pt; font-size: 8.6pt;\n    break-inside: avoid; page-break-inside: avoid;\n  }\n  #doc-impressao .doc-assin {\n    margin-top: 26pt; break-inside: avoid; page-break-inside: avoid;\n  }\n  #doc-impressao .doc-assin .linha-assin {\n    border-top: .8pt solid #000; width: 68mm; margin-top: 30pt; padding-top: 3pt;\n    font-size: 8.6pt;\n  }\n  #doc-impressao .quebra { break-before: page; page-break-before: always; }\n}\n\n/* ---------- Controle deslizante de pesos ---------- */\ninput[type=range] {\n  -webkit-appearance: none; appearance: none; height: 5px; padding: 0;\n  background: var(--borda); border-radius: 3px; border: none; outline-offset: 4px;\n}\ninput[type=range]::-webkit-slider-thumb {\n  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;\n  background: var(--ar); border: 2px solid var(--papel); cursor: pointer;\n  box-shadow: 0 1px 3px rgba(0,0,0,.25);\n}\ninput[type=range]::-moz-range-thumb {\n  width: 14px; height: 14px; border-radius: 50%; background: var(--ar);\n  border: 2px solid var(--papel); cursor: pointer;\n}\n#area-svg svg { border: 1px solid var(--borda); }\n.tubo:hover line { filter: brightness(1.15); }\n.no:hover { filter: brightness(1.06); }\n\n/* ---------- Biblioteca de projetos ---------- */\ndetails.bloco { border: 1px solid var(--borda); border-radius: var(--r); background: var(--papel); box-shadow: var(--sombra); }\ndetails.bloco > summary {\n  padding: 11px 15px; cursor: pointer; list-style: none;\n  font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em;\n  color: var(--aco-med); display: flex; align-items: center; gap: 8px;\n}\ndetails.bloco > summary::-webkit-details-marker { display: none; }\ndetails.bloco > summary::after { content: \"+\"; font-family: var(--mono); color: var(--ar); font-size: 16px; margin-left: auto; }\ndetails.bloco[open] > summary::after { content: \"−\"; }\ndetails.bloco[open] > summary { border-bottom: 1px solid var(--borda); }\ndetails.bloco .tag-num { font-family: var(--mono); color: var(--ar); font-size: 11px; }\n\n.chip {\n  border: 1px solid var(--borda); background: var(--papel); color: var(--aco-med);\n  padding: 3px 10px; border-radius: 12px; cursor: pointer;\n  font-family: var(--sans); font-size: 11.5px; font-weight: 550;\n}\n.chip:hover { border-color: var(--ar); color: var(--ar); }\n.chip[aria-pressed=\"true\"] { background: var(--ar); border-color: var(--ar); color: #fff; }\n\n.cartoes-proj { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap: 10px; }\n.proj-card {\n  border: 1px solid var(--borda); border-radius: var(--r); padding: 11px 13px;\n  background: var(--papel); display: flex; flex-direction: column; gap: 6px;\n}\n.proj-card.atual { border-color: var(--ar); box-shadow: inset 3px 0 0 var(--ar); background: var(--ar-claro); }\n.proj-card .titulo { font-weight: 650; font-size: 13px; line-height: 1.3; }\n.proj-card .meta { font-size: 11px; color: var(--aco-med); }\n.proj-card .resumo {\n  font-family: var(--mono); font-size: 11px; color: var(--aco-med);\n  font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 12px;\n}\n.proj-card .acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }\n.vazio { text-align: center; color: var(--aco-med); padding: 22px; font-size: 12.5px; }\n\n/* ---------- Perfil de demanda ---------- */\n.perfil-horas { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 5px; }\n@media (max-width: 760px) { .perfil-horas { grid-template-columns: repeat(6, minmax(0,1fr)); } }\n.perfil-horas label { display: block; }\n.perfil-horas .hh {\n  display: block; font-family: var(--mono); font-size: 9.5px; color: var(--aco-fraco);\n  text-align: center; margin-bottom: 2px;\n}\n.perfil-horas input { padding: 4px 3px; font-size: 11.5px; text-align: center; }\n\n/* ---------- Conformidade ---------- */\n.conf-grupo + .conf-grupo { margin-top: 14px; }\n.conf-grupo > h4 {\n  margin: 0 0 7px; font-size: 11px; font-weight: 700; text-transform: uppercase;\n  letter-spacing: .08em; color: var(--aco-med);\n  display: flex; align-items: center; gap: 8px;\n}\n.conf-item {\n  border: 1px solid var(--borda); border-left-width: 3px; border-radius: var(--r);\n  padding: 9px 12px; background: var(--papel); margin-bottom: 7px;\n}\n.conf-item.s-ok { border-left-color: var(--ok); }\n.conf-item.s-atencao { border-left-color: var(--nr26); }\n.conf-item.s-nao { border-left-color: var(--alerta); background: var(--alerta-bg); }\n.conf-item.s-pendente { border-left-color: var(--aco-fraco); }\n.conf-item.s-na { border-left-color: var(--borda); opacity: .72; }\n.conf-item .linha1 { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }\n.conf-item .txt { font-weight: 600; font-size: 13px; flex: 1; min-width: 190px; }\n.conf-item .norma-ref {\n  font-family: var(--mono); font-size: 10.5px; color: var(--ar); display: block; margin-top: 2px;\n}\n.conf-item .detalhe { font-size: 12px; color: var(--aco-med); margin-top: 5px; }\n.conf-item .ctrl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 7px; }\n.conf-item .ctrl select { width: auto; min-width: 128px; font-size: 11.5px; padding: 3px 6px; }\n.conf-item .ctrl input[type=text] { flex: 1; min-width: 150px; font-family: var(--sans); font-size: 12px; padding: 3px 7px; }\n.medidor { height: 9px; border-radius: 5px; overflow: hidden; display: flex; border: 1px solid var(--borda); }\n.medidor i { display: block; height: 100%; }\n.medidor .m-ok { background: var(--ok); }\n.medidor .m-atencao { background: var(--nr26); }\n.medidor .m-nao { background: var(--alerta); }\n.medidor .m-pendente { background: var(--aco-fraco); }\n.medidor .m-na { background: var(--borda); }\n.legenda { display: flex; flex-wrap: wrap; gap: 5px 14px; font-size: 11px; color: var(--aco-med); margin-top: 6px; }\n.legenda span::before {\n  content: \"\"; display: inline-block; width: 9px; height: 9px; border-radius: 2px;\n  margin-right: 5px; vertical-align: -1px;\n}\n.legenda .l-ok::before { background: var(--ok); }\n.legenda .l-atencao::before { background: var(--nr26); }\n.legenda .l-nao::before { background: var(--alerta); }\n.legenda .l-pendente::before { background: var(--aco-fraco); }\n.legenda .l-na::before { background: var(--borda); }\n\n<\/style>\n\n<\/head>\n<body>\n\n<!-- ================= ABERTURA: splash 3D + termos ================= -->\n<div id=\"csp-abertura\" aria-hidden=\"false\">\n  <div id=\"csp-splash\">\n    <canvas id=\"csp-3d\"><\/canvas>\n    <div class=\"csp-vinheta\"><\/div>\n    <div class=\"csp-splash-txt\">\n      <div class=\"csp-selo\">ABNT NBR 6493 · NR-13 · NR-12<\/div>\n      <h1>CompressorSelect <span>Pro<\/span><\/h1>\n      <p>Seleção e dimensionamento de centrais de ar comprimido<\/p>\n      <div class=\"csp-barra\"><i><\/i><\/div>\n      <div class=\"csp-carregando\">Inicializando módulos de cálculo…<\/div>\n    <\/div>\n    <div class=\"csp-versao\"><span data-versao>v2.3<\/span> · build offline · <span id=\"csp-modo\">iniciando<\/span><\/div>\n  <\/div>\n\n  <div id=\"csp-termos\" hidden=\"\">\n    <div class=\"csp-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"csp-termos-tit\">\n      <header>\n        <div class=\"csp-faixa\"><\/div>\n        <h2 id=\"csp-termos-tit\">Avisos legais e condições de uso<\/h2>\n        <p>Leia integralmente antes de utilizar o sistema. O uso implica aceitação.<\/p>\n      <\/header>\n      <div class=\"csp-corpo\" id=\"csp-corpo\" tabindex=\"0\">\n        <ol>\n          <li><b>Natureza da ferramenta.<\/b> O CompressorSelect Pro é instrumento de <i>apoio à decisão<\/i> em engenharia. Os resultados são estimativas obtidas de modelos simplificados e não substituem projeto executivo, memorial de cálculo, nem a análise de profissional legalmente habilitado.<\/li>\n          <li><b>Responsabilidade técnica.<\/b> Todo dimensionamento, especificação ou orçamento derivado deste sistema deve ser verificado, assinado e acompanhado da devida ART/RRT por engenheiro ou técnico habilitado, nos termos da Lei nº 5.194/1966 e das resoluções do CONFEA/CREA.<\/li>\n          <li><b>Conformidade normativa.<\/b> As verificações internas referenciam ABNT NBR 6493, NBR 12.176 e correlatas, NR-12 e NR-13. A checagem automática é <i>parcial<\/i>: não dispensa inspeção, prontuário do vaso de pressão, plano de manutenção e demais obrigações legais do empregador.<\/li>\n          <li><b>Dados de catálogo.<\/b> Vazões, potências e rendimentos embarcados têm caráter referencial e podem divergir de dados atuais do fabricante. Confirme sempre com o catálogo vigente e com a curva do equipamento efetivamente ofertado.<\/li>\n          <li><b>Contratações públicas.<\/b> Quando aplicado a obras e serviços públicos, o usuário é o único responsável pela aderência à Lei nº 14.133/2021, às referências oficiais de custo (SINAPI/SICRO) e à motivação técnica dos quantitativos adotados.<\/li>\n          <li><b>Limitação de responsabilidade.<\/b> O software é fornecido \"no estado em que se encontra\", sem garantia de qualquer espécie. Os autores não respondem por danos diretos, indiretos, lucros cessantes, paradas de produção ou acidentes decorrentes do uso ou da impossibilidade de uso.<\/li>\n          <li><b>Dados e privacidade.<\/b> A aplicação é offline: projetos e parâmetros permanecem no navegador do usuário (armazenamento local), sem transmissão a servidores. A guarda, o backup e o sigilo desses dados são de responsabilidade do usuário, observada a LGPD (Lei nº 13.709/2018).<\/li>\n          <li><b>Propriedade intelectual.<\/b> É vedada a redistribuição, revenda ou incorporação do código a produtos derivados sem autorização expressa do titular.<\/li>\n        <\/ol>\n        <div class=\"csp-fim\">— fim do documento —<\/div>\n      <\/div>\n      <footer>\n        <label class=\"csp-check\">\n          <input type=\"checkbox\" id=\"csp-aceite\">\n          <span>Li, compreendi e <b>concordo<\/b> com os avisos legais e condições de uso acima. Declaro que utilizarei os resultados sob responsabilidade técnica de profissional habilitado.<\/span>\n        <\/label>\n        <div class=\"csp-acoes\">\n          <button type=\"button\" id=\"csp-recusar\" class=\"csp-btn-sec\">Recusar e sair<\/button>\n          <button type=\"button\" id=\"csp-entrar\" class=\"csp-btn-pri\" disabled=\"\">Acessar o sistema<\/button>\n        <\/div>\n      <\/footer>\n    <\/div>\n  <\/div>\n<\/div>\n\n<style>\n#csp-abertura{position:fixed;inset:0;z-index:9000;background:#0B1015;\n  font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;color:#E6ECF2;}\n#csp-abertura.csp-saindo{opacity:0;transition:opacity .5s ease;pointer-events:none;}\n#csp-splash{position:absolute;inset:0;overflow:hidden;\n  background:radial-gradient(120% 90% at 50% 45%,#182430 0%,#0D131A 55%,#070A0E 100%);}\n#csp-3d{position:absolute;inset:0;width:100%;height:100%;display:block;}\n.csp-vinheta{position:absolute;inset:0;pointer-events:none;\n  background:radial-gradient(75% 65% at 50% 48%,rgba(0,0,0,0) 40%,rgba(0,0,0,.72) 100%);}\n.csp-splash-txt{position:absolute;left:0;right:0;bottom:7%;text-align:center;pointer-events:none;\n  opacity:1;animation:csp-sobe .9s .2s cubic-bezier(.2,.7,.2,1) forwards;}\n@keyframes csp-sobe{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}\n.csp-selo{font:600 10.5px/1 ui-monospace,\"SF Mono\",Consolas,monospace;letter-spacing:.22em;\n  color:#5BA3E8;text-transform:uppercase;margin-bottom:14px;}\n.csp-splash-txt h1{margin:0;font-size:clamp(28px,4.6vw,54px);font-weight:250;letter-spacing:-.02em;color:#F2F6FA;}\n.csp-splash-txt h1 span{font-weight:650;color:#5BA3E8;}\n.csp-splash-txt p{margin:10px 0 0;font-size:clamp(12px,1.35vw,15px);color:#8FA1B2;letter-spacing:.02em;}\n.csp-barra{width:min(300px,52vw);height:2px;margin:26px auto 12px;background:rgba(255,255,255,.10);overflow:hidden;}\n.csp-barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5BA3E8,#F0B429);\n  animation:csp-carga 5.9s cubic-bezier(.4,0,.15,1) forwards;}\n@keyframes csp-carga{to{width:100%}}\n.csp-carregando{font:400 10.5px/1 ui-monospace,\"SF Mono\",Consolas,monospace;letter-spacing:.14em;\n  color:#6B7A89;text-transform:uppercase;}\n.csp-versao{position:absolute;right:20px;bottom:16px;font:400 10px/1 ui-monospace,Consolas,monospace;\n  letter-spacing:.14em;color:#44525F;}\n\n#csp-termos{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;\n  background:radial-gradient(110% 80% at 50% 30%,#16212C 0%,#0A0F14 70%);\n  animation:csp-fade .45s ease both;}\n@keyframes csp-fade{from{opacity:0}to{opacity:1}}\n.csp-modal{width:min(760px,100%);max-height:min(88vh,760px);display:flex;flex-direction:column;\n  background:#151D25;border:1px solid #2E3A45;border-radius:5px;\n  box-shadow:0 30px 90px rgba(0,0,0,.65);overflow:hidden;\n  opacity:1;animation:csp-sobe .5s .05s cubic-bezier(.2,.7,.2,1) forwards;}\n.csp-modal header{padding:22px 28px 18px;border-bottom:1px solid #2E3A45;background:#101820;position:relative;}\n.csp-faixa{position:absolute;left:0;right:0;top:0;height:3px;background:#F0B429;}\n.csp-modal h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em;color:#F2F6FA;}\n.csp-modal header p{margin:6px 0 0;font-size:12.5px;color:#8FA1B2;}\n.csp-corpo{overflow:auto;padding:20px 28px 8px;font-size:13px;line-height:1.62;color:#C3CEDA;}\n.csp-corpo:focus-visible{outline:2px solid #5BA3E8;outline-offset:-2px;}\n.csp-corpo ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:13px;}\n.csp-corpo li::marker{color:#5BA3E8;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;}\n.csp-corpo b{color:#EAF1F8;font-weight:600;}\n.csp-corpo i{color:#9FB2C4;}\n.csp-fim{margin:18px 0 6px;text-align:center;font:400 10px/1 ui-monospace,Consolas,monospace;\n  letter-spacing:.18em;color:#4E5C69;text-transform:uppercase;}\n.csp-modal footer{padding:16px 28px 20px;border-top:1px solid #2E3A45;background:#101820;\n  display:flex;flex-direction:column;gap:14px;}\n.csp-check{display:flex;gap:11px;align-items:flex-start;font-size:12.5px;line-height:1.5;color:#AFBECC;cursor:pointer;}\n.csp-check input{margin:2px 0 0;width:16px;height:16px;accent-color:#5BA3E8;flex:none;cursor:pointer;}\n.csp-check b{color:#EAF1F8;}\n.csp-acoes{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}\n.csp-btn-pri,.csp-btn-sec{font:550 13px/1 inherit;padding:10px 18px;border-radius:4px;cursor:pointer;border:1px solid transparent;}\n.csp-btn-pri{background:#0B57A4;color:#fff;border- ndição de referência ISO 1217 (20 °C)\n\n  /* ---------- Atmosfera ------------------------------------------ */\n  // Atmosfera padrão ISA — pressão em kPa para altitude em metros\n  function pressaoAtmosferica(altitude_m) {\n    return P0 * Math.pow(1 - 2.25577e-5 * altitude_m, 5.25588);\n  }\n\n  function densidadeAr(p_kPa, T_C) {\n    return (p_kPa * 1000) / (R_AR * (T_C + 273.15));\n  }\n\n  // Fator de correção de altitude/temperatura sobre a MASSA de ar entregue.\n  // Compressores são ensaiados em FAD (ISO 1217) na condição de aspiração.\n  // Em altitude, o mesmo FAD volumétrico entrega menos massa de ar.\n  function fatorAltitude(altitude_m, T_C) {\n    const rhoLocal = densidadeAr(pressaoAtmosferica(altitude_m), T_C);\n    const rhoRef = densidadeAr(P0, 20);\n    return rhoRef / rhoLocal;   // >1 = precisa de mais volume local\n  }\n\n  /* ---------- Demanda -------------------------------------------- */\n  // Fator de simultaneidade decrescente com o nº de consumidores\n  // (base: prática de projeto pneumático — quanto mais pontos,\n  //  menor a probabilidade de uso conjunto)\n  function fatorSimultaneidadeSugerido(nPontos) {\n    if (nPontos <= 1) return 1.00;\n    if (nPontos <= 2) return 0.95;\n    if (nPontos <= 4) return 0.85;\n    if (nPontos <= 6) return 0.75;\n    if (nPontos <= 10) return 0.65;\n    if (nPontos <= 20) return 0.55;\n    return 0.50;\n  }\n\n  /**\n   * Consolida a demanda de ar do projeto.\n   * consumidores: [{nome, qtd, vazao_m3min, utilizacao (0-1), pressao_bar}]\n   *\n   * MODO DE DIVERSIDADE (cfg.modo_diversidade) — ver nota metodológica:\n   * o fator de utilização (u_i, por ponto) e o fator de simultaneidade\n   * (f_s, global) descrevem o MESMO fenômeno por caminhos diferentes:\n   * a improbabilidade de todos os consumidores demandarem ar ao mesmo\n   * tempo. Aplicar os dois em série multiplica os abatimentos e tende a\n   * SUBDIMENSIONAR a central. A literatura de projeto pneumático usa em\n   * geral um OU outro. Modos:\n   *   'serie'          — u_i × f_s (comportamento das versões ≤ 2.2)\n   *   'utilizacao'     — só u_i  (f_s = 1) — recomendado quando as\n   *                      utilizações foram levantadas em campo\n   *   'simultaneidade' — só f_s  (ignora u_i) — recomendado quando as\n   *                      vazões são de catálogo em regime contínuo\n   */\n  function demandaProjeto(cfg) {\n    const cons = cfg.consumidores || [];\n    let somaBruta = 0, somaPonderada = 0, pressaoMax = 0, nPontos = 0;\n\n    cons.forEach(c => {\n      const qtd = +c.qtd || 0;\n      const q = (+c.vazao_m3min || 0) * qtd;\n      somaBruta += q;\n      somaPonderada += q * (c.utilizacao === undefined ? 1 : +c.utilizacao);\n      pressaoMax = Math.max(pressaoMax, +c.pressao_bar || 0);\n      nPontos += qtd;\n    });\n\n    const modo = cfg.modo_diversidade || 'serie';\n\n    const fSimBase = cfg.fator_simultaneidade === undefined\n      ? fatorSimultaneidadeSugerido(nPontos)\n      : +cfg.fator_simultaneidade;\n\n    // No modo 'utilizacao' o abatimento já está em u_i: f_s é neutralizado.\n    const fSim = modo === 'utilizacao' ? 1 : fSimBase;\n    // No modo 'simultaneidade' a base volta a ser a soma bruta (ignora u_i).\n    const base = modo === 'simultaneidade' ? somaBruta : somaPonderada;\n\n    const qSimultanea = base * fSim;\n\n    // FRAÇÃO RETIDA da soma bruta (não o abatimento): 0,16 significa que\n    // sobraram 16 % da soma bruta, ou seja, cortaram-se 84 %. É o número\n    // que realmente importa auditar. Abaixo de 0,35 o projeto fica exposto.\n    const fCombinado = somaBruta > 0 ? qSimultanea / somaBruta : 1;\n    const alertaDiversidade = modo === 'serie' && fCombinado < 0.35\n      ? 'Utilização e simultaneidade aplicadas em série retêm apenas '\n        + (fCombinado * 100).toFixed(0) + ' % da soma bruta (corte de '\n        + (100 - fCombinado * 100).toFixed(0) + ' %). Verifique se a metodologia '\n        + 'adotada não está contando o mesmo efeito duas vezes.'\n      : '';\n    const fVaz = +cfg.perdas_vazamento || 0;      // 0,05 a 0,25\n    const fFut = +cfg.reserva_futura || 0;        // 0,10 a 0,30\n    const qComVaz = qSimultanea * (1 + fVaz);\n    const qComFut = qComVaz * (1 + fFut);\n    const fAlt = fatorAltitude(+cfg.altitude_m || 0, cfg.temp_aspiracao_C === undefined ? 25 : +cfg.temp_aspiracao_C);\n    const qCorrigida = qComFut * fAlt;\n\n    return {\n      n_pontos: nPontos,\n      soma_bruta: somaBruta,\n      soma_ponderada: somaPonderada,\n      modo_diversidade: modo,\n      fator_simultaneidade: fSim,\n      fator_simultaneidade_sugerido: fSimBase,\n      base_aplicada: base,\n      fator_combinado: fCombinado,\n      alerta_diversidade: alertaDiversidade,\n      q_simultanea: qSimultanea,\n      q_com_vazamento: qComVaz,\n      q_com_reserva: qComFut,\n      fator_altitude: fAlt,\n      q_projeto_m3min: qCorrigida,\n      pressao_max_consumidor_bar: pressaoMax,\n    };\n  }\n\n  /* ---------- Potência de compressão ------------------------------ */\n  /**\n   * Potência isentrópica de compressão em n estágios com resfriamento\n   * intermediário e razão de pressão igualmente repartida.\n   * Q em m3/min (na aspiração), p1/p2 absolutos em bar. Retorna kW.\n   */\n  function potenciaIsentropica(Q_m3min, p1_bar_abs, p2_bar_abs, estagios) {\n    const n = Math.max(1, estagios || 1);\n    const Q = Q_m3min / 60;                 // m3/s\n    const p1 = p1_bar_abs * 1e5;            // Pa\n    const r = p2_bar_abs / p1_bar_abs;\n    const exp = (K_AR - 1) / (K_AR * n);\n    return (n * (K_AR / (K_AR - 1)) * p1 * Q * (Math.pow(r, exp) - 1)) / 1000;\n  }\n\n  /* Rendimentos isentrópicos típicos por tecnologia. O parafuso injetado\n     a óleo se aproxima da compressão isotérmica (menos trabalho que a\n     isentrópica), o que eleva o rendimento aparente referido ao ciclo\n     isentrópico. Valores calibrados contra a potência específica de\n     catálogo (kW por m3/min de FAD a 7-8 bar). */\n  const REND_ISENTROPICO = {\n    pistao_1e: 0.530, pistao_2e: 0.538, parafuso: 0.822, parafuso_vsd: 0.880,\n    parafuso_isento: 0.725, scroll: 0.615, palheta: 0.765, centrifugo: 0.769,\n    diesel_portatil: 0.672,\n  };\n\n  /* Rendimento de motores de indução em plena carga (faixa IR2/IR3) */\n  function rendimentoMotor(kw) {\n    if (kw <= 1.5) return 0.80;\n    if (kw <= 4) return 0.855;\n    if (kw <= 11) return 0.895;\n    if (kw <= 30) return 0.925;\n    if (kw <= 75) return 0.945;\n    return 0.955;\n  }\n\n  /**\n   * Potências de eixo e elétrica.\n   * rend: {isentropico, mecanico, motor}\n   */\n  function potenciaAcionamento(cfg) {\n    const pAtm = pressaoAtmosferica(cfg.altitude_m || 0) / 100;   // bar abs\n    const p2 = (+cfg.pressao_descarga_bar) + pAtm;\n    const est = cfg.estagios || 1;\n    const Pis = potenciaIsentropica(+cfg.vazao_m3min, pAtm, p2, est);\n    const rIs = cfg.rend_isentropico || REND_ISENTROPICO[cfg.tipo] || 0.82;\n    const rMec = cfg.rend_mecanico || 0.95;\n    // O porte do motor é estimado pela própria potência de eixo — usa o\n    // rendimento mecânico efetivo (rMec), não um literal, para respeitar\n    // um rend_mecanico informado pelo usuário.\n    const rMot = cfg.rend_motor || rendimentoMotor(Pis / (rIs * rMec));\n    const Peixo = Pis / (rIs * rMec);\n    const Pelet = Peixo / rMot;\n    return {\n      pressao_atm_bar: pAtm,\n      pressao_abs_descarga_bar: p2,\n      razao_compressao: p2 / pAtm,\n      potencia_isentropica_kw: Pis,\n      potencia_eixo_kw: Peixo,\n      potencia_eletrica_kw: Pelet,\n      potencia_comercial_kw: motorComercial(Peixo * 1.10),\n      rend: { isentropico: rIs, mecanico: rMec, motor: rMot },\n    };\n  }\n\n  const KW_COMERCIAL = [0.75, 1.1, 1.5, 2.2, 3, 4, 5.5, 7.5, 11, 15, 18.5,\n    22, 30, 37, 45, 55, 75, 90, 110, 132, 160, 200, 250, 315, 400];\n\n  function motorComercial(kw) {\n    for (const v of KW_COMERCIAL) if (v >= kw - 1e-9) return v;\n    return KW_COMERCIAL[KW_COMERCIAL.length - 1];\n  }\n\n  /* ---------- Reservatório ---------------------------------------- */\n  // Partidas/hora máximas admissíveis por porte de motor\n  function partidasMaximas(kw) {\n    if (kw <= 7.5) return 30;\n    if (kw <= 30) return 20;\n    if (kw <= 75) return 15;\n    return 10;\n  }\n\n  /**\n   * Volume mínimo do reservatório para limitar a frequência de partidas.\n   * Deduzido do ciclo carga/alívio na condição crítica (demanda = 50 % da\n   * capacidade), que maximiza o tempo de ciclo:\n   *      t_ciclo = 4.V.Δp /(p_atm.Q)  →  V = 15.p_atm.Q/(N.Δp)\n   * V em litros, Q em L/min, pressões em bar.\n   */\n  function volumeReservatorio(cfg) {\n    const Q = (+cfg.vazao_m3min) * 1000;          // L/min\n    // dP e N entram no denominador: zero/negativo tornaria o volume infinito.\n    const dP = +cfg.delta_pressao_bar > 0 ? +cfg.delta_pressao_bar : 1.0;\n    const N = +cfg.partidas_hora > 0 ? +cfg.partidas_hora : 20;\n    const pAtm = pressaoAtmosferica(cfg.altitude_m || 0) / 100;\n    const V = (15 * pAtm * Q) / (N * dP);\n    return {\n      volume_min_l: V,\n      volume_comercial_l: tanqueComercial(V),\n      delta_pressao_bar: dP,\n      partidas_hora: N,\n      tempo_ciclo_s: (3600 / N),\n      obs: cfg.vsd ? 'Acionamento com inversor (VSD): o reservatório pode ser reduzido, pois a modulação de rotação elimina o ciclo carga/alívio. Usual: 1/3 a 1/2 do volume calculado.' : '',\n    };\n  }\n\n  const TANQUES = [30, 50, 100, 150, 175, 200, 250, 300, 350, 425, 500, 750,\n    1000, 1500, 2000, 3000, 5000, 7500, 10000];\n  function tanqueComercial(l) {\n    for (const v of TANQUES) if (v >= l - 1e-9) return v;\n    return Math.ceil(l / 1000) * 1000;\n  }\n\n  /* ---------- Rede de distribuição -------------------------------- */\n  // Diâmetros internos aproximados (mm) para tubo de aço SCH 40\n  const DN_ACO = [\n    { dn: 'DN 15 (1/2\")', di: 15.8 }, { dn: 'DN 20 (3/4\")', di: 20.9 },\n    { dn: 'DN 25 (1\")', di: 26.6 }, { dn: 'DN 32 (1.1/4\")', di: 35.1 },\n    { dn: 'DN 40 (1.1/2\")', di: 40.9 }, { dn: 'DN 50 (2\")', di: 52.5 },\n    { dn: 'DN 65 (2.1/2\")', di: 62.7 }, { dn: 'DN 80 (3\")', di: 77.9 },\n    { dn: 'DN 100 (4\")', di: 102.3 }, { dn: 'DN 125 (5\")', di: 128.2 },\n    { dn: 'DN 150 (6\")', di: 154.1 }, { dn: 'DN 200 (8\")', di: 202.7 },\n    { dn: 'DN 250 (10\")', di: 254.5 }, { dn: 'DN 300 (12\")', di: 303.2 },\n  ];\n\n  function fatorAtrito(Re, rugosidade_mm, d_mm) {\n    // Vazão nula ⇒ Re = 0: 64/Re divergiria. Sem escoamento não há atrito.\n    if (!isFinite(Re) || Re <= 1e-6) return 0;\n    if (Re < 2300) return 64 / Re;                       // laminar\n    const eD = (+d_mm > 0) ? rugosidade_mm / d_mm : 0;   // Swamee-Jain\n    const t = Math.log10(eD / 3.7 + 5.74 / Math.pow(Re, 0.9));\n    return t === 0 ? 0 : 0.25 / (t * t);\n  }\n\n  /**\n   * Perda de carga em trecho de rede de ar comprimido — Darcy-Weisbach\n   * com fator de atrito de Swamee-Jain (aproximação explícita de\n   * Colebrook-White). Escoamento tratado como incompressível no trecho,\n   * hipótese válida para Δp < 10 % da pressão absoluta.\n   */\n  function perdaCarga(cfg) {\n    const Qfad = +cfg.vazao_m3min;                        // FAD (20 °C, 1 atm)\n    const pManBar = +cfg.pressao_linha_bar;\n    const alt = +cfg.altitude_m || 0;\n    const pAtm = pressaoAtmosferica(alt) / 100;\n    const pAbs = pManBar + pAtm;\n    const T = (cfg.temp_linha_C === undefined ? 30 : +cfg.temp_linha_C) + 273.15;\n    const d = (+cfg.diametro_mm) / 1000;\n    const L = +cfg.comprimento_equivalente_m;\n    const rug = cfg.rugosidade_mm === undefined ? 0.15 : +cfg.rugosidade_mm;\n\n    // Diâmetro nulo/ausente tornaria a velocidade infinita — sem tubo não\n    // há trecho a calcular.\n    if (!(d > 0) || !isFinite(Qfad) || !isFinite(L)) {\n      return {\n        vazao_linha_m3s: 0, velocidade_ms: 0, densidade_kgm3: 0, reynolds: 0,\n        fator_atrito: 0, perda_bar: 0, perda_percentual: null,\n        pressao_ponto_uso_bar: pManBar, regime: '—', velocidade_ok: true,\n        indefinido: true,\n      };\n    }\n\n    // Vazão real na pressão de linha (lei dos gases, referida a 20 °C/1 atm)\n    const Qlinha = (Qfad / 60) * (P0 / 100 / pAbs) * (T / T_REF);   // m3/s\n    const A = Math.PI * d * d / 4;\n    const v = Qlinha / A;\n    const rho = densidadeAr(pAbs * 100, T - 273.15);\n    const Re = rho * v * d / MU_AR;\n    const f = fatorAtrito(Re, rug, +cfg.diametro_mm);\n    const dp_Pa = f * (L / d) * rho * v * v / 2;\n\n    return {\n      vazao_linha_m3s: Qlinha,\n      velocidade_ms: v,\n      densidade_kgm3: rho,\n      reynolds: Re,\n      fator_atrito: f,\n      perda_bar: dp_Pa / 1e5,\n      // Pressão manométrica nula ⇒ perda relativa indefinida (não Infinity)\n      perda_percentual: pManBar > 0 ? (dp_Pa / 1e5) / pManBar * 100 : null,\n      pressao_ponto_uso_bar: pManBar - dp_Pa / 1e5,\n      regime: Re < 2300 ? 'laminar' : Re < 4000 ? 'transição' : 'turbulento',\n      velocidade_ok: v <= (cfg.vel_max_ms || 9),\n    };\n  }\n\n  /** Escolhe o menor DN que atenda ao Δp admissível e à velocidade máxima. */\n  function dimensionarDiametro(cfg) {\n    const dpAdm = cfg.perda_admissivel_bar || 0.10;\n    const vMax = cfg.vel_max_ms || 9;\n    const opcoes = DN_ACO.map(o => {\n      const r = perdaCarga(Object.assign({}, cfg, { diametro_mm: o.di }));\n      return Object.assign({ dn: o.dn, di: o.di, atende: r.perda_bar <= dpAdm && r.velocidade_ms <= vMax }, r);\n    });\n    const escolhido = opcoes.find(o => o.atende) || opcoes[opcoes.length - 1];\n    return { escolhido, opcoes, perda_admissivel_bar: dpAdm, vel_max_ms: vMax };\n  }\n\n  /* ---------- Vazamentos ------------------------------------------ */\n  /**\n   * Vazão através de orifício. Como a razão de pressões supera a crítica\n   * (0,528) para p > ~0,9 bar man., o escoamento é sônico (bloqueado):\n   *   ṁ = Cd.A.p0.sqrt(k/(R.T)).(2/(k+1))^((k+1)/(2(k-1)))\n   * Retorna a vazão equivalente em m3/min de ar livre.\n   */\n  function vazamentoOrificio(diam_mm, p_man_bar, altitude_m, Cd) {\n    const cd = Cd === undefined ? 0.65 : Cd;\n    const pAtm = pressaoAtmosferica(altitude_m || 0);            // kPa\n    const p0 = (p_man_bar + pAtm / 100) * 1e5;                   // Pa abs\n    const A = Math.PI * Math.pow(diam_mm / 1000, 2) / 4;\n    const T = 293.15;\n    const crit = Math.pow(2 / (K_AR + 1), (K_AR + 1) / (2 * (K_AR - 1)));\n    const mdot = cd * A * p0 * Math.sqrt(K_AR / (R_AR * T)) * crit;  // kg/s\n    const rhoLivre = densidadeAr(pAtm, 20);\n    return { vazao_m3min: mdot / rhoLivre * 60, fluxo_massico_kgs: mdot, sonico: true };\n  }\n\n  /* ---------- Energia --------------------------------------------- */\n  function consumoEnergia(cfg) {\n    const P = +cfg.potencia_eletrica_kw;\n    const h = +cfg.horas_ano;\n    const fc = +cfg.fator_carga;             // 0-1\n    // Compressor de velocidade fixa em alívio consome ~25-35 % da potência\n    const fAlivio = cfg.fator_alivio === undefined ? 0.30 : +cfg.fator_alivio;\n    const vsd = !!cfg.vsd;\n    const energia = vsd\n      ? P * h * (0.05 + 0.95 * fc)           // VSD: potência ~linear com a vazão\n      : P * h * (fc + (1 - fc) * fAlivio);\n    const tarifa = +cfg.tarifa_kwh;\n    // Volume anual produzido — se qualquer fator for nulo não há produção\n    // contra a qual ratear o custo (evita Infinity no custo por m³).\n    const volumeAno = (+cfg.vazao_m3min || 0) * 60 * h * fc;\n    return {\n      energia_kwh_ano: energia,\n      custo_ano_brl: energia * tarifa,\n      custo_por_m3: volumeAno > 0 ? (energia * tarifa) / volumeAno : null,\n    };\n  }\n\n  function comparativoVSD(cfg) {\n    const fixa = consumoEnergia(Object.assign({}, cfg, { vsd: false }));\n    const vsd = consumoEnergia(Object.assign({}, cfg, { vsd: true }));\n    const economia = fixa.custo_ano_brl - vsd.custo_ano_brl;\n    const sobrepreco = +cfg.sobrepreco_vsd_brl || 0;\n    return {\n      fixa, vsd,\n      economia_ano_brl: economia,\n      economia_percentua
