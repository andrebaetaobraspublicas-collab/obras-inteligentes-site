 'auto', critico: false,\n      item: 'Filtragem compatível com o teor de óleo exigido',\n      norma: 'ISO 8573-1:2010',\n      verificar: (x) => {\n        const req = x.c.qual.filtragem;\n        const isento = x.c.modelo && x.c.modelo.lubrificacao === 'isento';\n        if (x.c.qual.oleo <= 1 && !isento && x.c.modelo) {\n          return AT('Requisito: ' + req + '. A classe de óleo ' + x.c.qual.oleo + ' foi exigida, mas o '\n            + 'modelo é lubrificado. É possível atingi-la com filtragem coalescente e carvão ativado, '\n            + 'porém com custo de manutenção recorrente e risco residual. Compare com máquina isenta '\n            + 'de óleo antes de decidir.');\n        }\n        return OK('Requisito: ' + req + ' para a classe de óleo ' + x.c.qual.oleo + '. '\n          + 'Prever perda de carga dos filtros no cálculo da rede e trocas periódicas de elemento.');\n      },\n    },\n    {\n      id: 'iso-comissionamento', grupo: 'qualidade', tipo: 'declaratorio', critico: false,\n      item: 'Medição de ponto de orvalho no comissionamento',\n      norma: 'ISO 8573-1:2010 · ISO 7183:2007',\n      dica: 'Classe de pureza especificada em contrato sem medição no recebimento não é verificável. '\n        + 'Registre o valor medido no termo de aceite.',\n    },\n    {\n      id: 'iso-purga', grupo: 'qualidade', tipo: 'declaratorio', critico: false,\n      item: 'Destinação do condensado oleoso definida',\n      norma: 'ABNT NBR 10004 · legislação ambiental aplicável',\n      dica: 'O condensado de compressor lubrificado carrega óleo e não pode ir para a rede pluvial nem '\n        + 'para o esgoto. Prever separador água/óleo ou coleta por empresa licenciada.',\n    },\n\n    /* ---------- Dimensionamento ---------- */\n    {\n      id: 'dim-reservatorio', grupo: 'dimensionamento', tipo: 'auto', critico: false,\n      item: 'Volume do reservatório igual ou superior ao mínimo calculado',\n      norma: 'Critério de limitação da frequência de partidas',\n      verificar: (x) => {\n        const vMin = x.c.res.volume_min_l;\n        const vAdot = x.c.volTanque;\n        if (!vAdot) {\n          return AT('Modelo sem reservatório integrado. Volume mínimo calculado: ' + n(vMin, 0)\n            + ' L — especificar reservatório separado de pelo menos ' + n(ENG.tanqueComercial(vMin), 0) + ' L.');\n        }\n        if (vAdot < vMin) {\n          return NAO('Reservatório de ' + n(vAdot, 0) + ' L contra ' + n(vMin, 0) + ' L necessários para '\n            + 'limitar as partidas a ' + n(x.c.partidas, 0) + ' por hora. Partidas em excesso queimam '\n            + 'motor e contator.');\n        }\n        return OK('Reservatório de ' + n(vAdot, 0) + ' L contra ' + n(vMin, 0) + ' L mínimos, para '\n          + n(x.c.partidas, 0) + ' partidas/hora e Δp de ' + n(x.c.res.delta_pressao_bar, 1) + ' bar.');\n      },\n    },\n    {\n      id: 'dim-partidas', grupo: 'dimensionamento', tipo: 'auto', critico: false,\n      item: 'Frequência de partidas dentro do admissível para o porte do motor',\n      norma: 'Prática de acionamento de motores de indução',\n      verificar: (x) => {\n        const kw = x.c.modelo ? x.c.modelo.potencia_kw : x.c.pot.potencia_comercial_kw;\n        const max = ENG.partidasMaximas(kw);\n        if (x.c.modelo && x.c.modelo.vsd) {\n          return NA('Máquina com inversor: a modulação de rotação elimina o ciclo carga/alívio e o '\n            + 'critério de partidas por hora perde o sentido.');\n        }\n        if (x.c.partidas > max) {\n          return NAO('Adotadas ' + n(x.c.partidas, 0) + ' partidas/hora contra ' + n(max, 0)\n            + ' admissíveis para motor de ' + n(kw, 1) + ' kW. Aumente o reservatório ou o Δp de comando.');\n        }\n        return OK('Adotadas ' + n(x.c.partidas, 0) + ' partidas/hora, dentro das ' + n(max, 0)\n          + ' admissíveis para motor de ' + n(kw, 1) + ' kW.');\n      },\n    },\n    {\n      id: 'dim-pressao', grupo: 'dimensionamento', tipo: 'auto', critico: true,\n      item: 'Pressão de trabalho suficiente para o consumidor mais exigente',\n      norma: 'Requisito funcional dos consumidores',\n      verificar: (x) => {\n        const exig = x.c.dem.pressao_max_consumidor_bar;\n        if (!exig) return NA('Nenhum consumidor cadastrado.');\n        const perda = x.c.perda.perda_bar;\n        const necessario = exig + perda;\n        if (x.c.pTrab < exig) {\n          return NAO('Pressão ajustada em ' + n(x.c.pTrab, 1) + ' bar, abaixo dos ' + n(exig, 1)\n            + ' bar exigidos pelo consumidor mais crítico — sem considerar ainda a perda de carga '\n            + 'da rede. O equipamento não vai operar.');\n        }\n        if (x.c.pTrab < necessario) {\n          return AT('Pressão ajustada em ' + n(x.c.pTrab, 1) + ' bar atende ao consumidor no ponto '\n            + 'de saída do compressor, mas descontada a perda de ' + n(perda, 3) + ' bar da rede '\n            + 'sobram ' + n(x.c.pTrab - perda, 2) + ' bar no ponto de uso, contra ' + n(exig, 1)\n            + ' bar exigidos. Eleve o ajuste para ao menos ' + n(necessario, 2) + ' bar ou reduza '\n            + 'a perda de carga.');\n        }\n        const folga = x.c.pTrab - necessario;\n        if (folga > 2) {\n          return AT('Pressão ajustada em ' + n(x.c.pTrab, 1) + ' bar, ' + n(folga, 1) + ' bar acima do '\n            + 'necessário. Cada bar a menos economiza cerca de 7 % da energia — verifique se a folga '\n            + 'é mesmo requisito de processo.');\n        }\n        return OK('Pressão de ' + n(x.c.pTrab, 1) + ' bar contra ' + n(necessario, 2) + ' bar necessários '\n          + '(' + n(exig, 1) + ' bar do consumidor + ' + n(perda, 3) + ' bar de perda). '\n          + 'Folga de ' + n(folga, 2) + ' bar.');\n      },\n    },\n    {\n      id: 'dim-folga', grupo: 'dimensionamento', tipo: 'auto', critico: false,\n      item: 'Folga de capacidade do modelo em faixa razoável',\n      norma: 'Prática de seleção — 10 % a 25 % sobre a vazão de projeto',\n      verificar: (x) => {\n        if (!x.c.modelo) return AT('Nenhum modelo selecionado.');\n        const f = x.c.modelo.folga_percentual;\n        if (f < 0) return NAO('Vazão do modelo abaixo da vazão de projeto (' + n(f, 1) + ' %).');\n        if (f < 5) return AT('Folga de apenas ' + n(f, 1) + ' %. Sem margem para desgaste do bloco, '\n          + 'filtro sujo ou ampliação futura.');\n        if (f > 40) return AT('Folga de ' + n(f, 1) + ' %. Máquina superdimensionada tende a operar em '\n          + 'alívio, com consumo sem entrega de ar. Avalie modelo menor ou arranjo com duas máquinas.');\n        return OK('Folga de ' + n(f, 1) + ' % sobre a vazão de projeto — faixa adequada.');\n      },\n    },\n    {\n      id: 'dim-altitude', grupo: 'dimensionamento', tipo: 'auto', critico: false,\n      item: 'Correção de altitude aplicada à vazão',\n      norma: 'ISO 1217 · condições de aspiração',\n      verificar: (x) => {\n        const fa = x.c.dem.fator_altitude;\n        const alt = x.estado.projeto.altitude_m;\n        if (alt < 300) {\n          return OK('Altitude de ' + n(alt, 0) + ' m: correção de ' + n((fa - 1) * 100, 1) + ' %, '\n            + 'praticamente irrelevante.');\n        }\n        return OK('Altitude de ' + n(alt, 0) + ' m e ' + n(x.estado.projeto.temp_aspiracao_C, 0)\n          + ' °C na aspiração: vazão de projeto majorada em ' + n((fa - 1) * 100, 1) + ' %. '\n          + 'Confirme que o fabricante declarou o FAD para a condição do local, e não ao nível do mar.');\n      },\n    },\n    {\n      id: 'dim-perfil', grupo: 'dimensionamento', tipo: 'auto', critico: false,\n      item: 'Perfil de demanda considerado na avaliação energética',\n      norma: 'Boa prática de análise de ciclo de vida',\n      verificar: (x) => {\n        if (!x.perfil || !x.perfil.ativo) {\n          return AT('Perfil horário não está sendo aplicado. A energia está sendo estimada por '\n            + 'horas/ano × fator de carga médio, o que pode subestimar ou superestimar o consumo em '\n            + 'operações com carga variável. Ative o perfil na aba correspondente.');\n        }\n        const a = x.perfil.analise;\n        const nomePerfil = (PERFIL.PRESETS[x.perfil.tipo] || {}).nome || 'personalizado';\n        return OK('Perfil \"' + nomePerfil + '\" aplicado: '\n          + n(a.horas_operacao_dia, 0) + ' h/dia × ' + n(a.dias_ano, 0) + ' dias = '\n          + n(a.horas_ano, 0) + ' h/ano, fator de carga efetivo de '\n          + n(a.fator_carga_efetivo * 100, 0) + ' %.');\n      },\n    },\n  ];\n\n  /* ---------------- Avaliação ---------------- */\n  function avaliar(ctx) {\n    const marcas = (ctx.marcas || {});\n    const itens = ITENS.map(it => {\n      let r = null;\n      if (it.tipo === 'auto') {\n        try { r = it.verificar(ctx); } catch (e) {\n          r = { status: 'atencao', detalhe: 'Não foi possível avaliar automaticamente com os dados atuais.' };\n        }\n      } else {\n        const dica = typeof it.dica === 'function' ? (function () {\n          try { return it.dica(ctx); } catch (e) { return ''; }\n        })() : it.dica;\n        r = { status: 'pendente', detalhe: dica || '' };\n      }\n      const m = marcas[it.id];\n      let status = r.status;\n      // A marcação manual prevalece sobre \"pendente\"; sobre resultado\n      // automático ela só é aceita para registrar \"não aplicável\" ou\n      // para confirmar a correção de uma pendência apontada.\n      if (m === 'na') status = 'na';\n      else if (m === 'ok') status = (r.status === 'nao') ? 'nao' : 'ok';\n      else if (m === 'nao') status = 'nao';\n\n      return {\n        id: it.id, grupo: it.grupo, item: it.item, norma: it.norma,\n        tipo: it.tipo, critico: !!it.critico,\n        status, detalhe: r.detalhe || '',\n        marca: m || null,\n        automatico_status: it.tipo === 'auto' ? r.status : null,\n        obs: (ctx.observacoes || {})[it.id] || '',\n      };\n    });\n\n    const cont = { ok: 0, atencao: 0, nao: 0, pendente: 0, na: 0 };\n    itens.forEach(i => { cont[i.status]++; });\n    const aplicaveis = itens.length - cont.na;\n    const criticosAbertos = itens.filter(i => i.critico && (i.status === 'nao' || i.status === 'pendente'));\n    const naoConformes = itens.filter(i => i.status === 'nao');\n\n    // Dois indicadores distintos, porque medem coisas diferentes:\n    //   • verificação automática — o que o aplicativo consegue conferir\n    //     sozinho a partir dos dados lançados;\n    //   • progresso declaratório — quanto da lista que depende de campo\n    //     ou de documento já foi efetivamente marcado pelo responsável.\n    const auto = itens.filter(i => i.tipo === 'auto' && i.status !== 'na');\n    const autoOk = auto.filter(i => i.status === 'ok').length;\n    const decl = itens.filter(i => i.tipo !== 'auto' && i.status !== 'na');\n    const declMarcados = decl.filter(i => i.status !== 'pendente').length;\n\n    return {\n      itens, contagem: cont, total: itens.length, aplicaveis,\n      indice: aplicaveis ? cont.ok / aplicaveis : 0,\n      auto_total: auto.length, auto_ok: autoOk,\n      indice_auto: auto.length ? autoOk / auto.length : 0,\n      decl_total: decl.length, decl_marcados: declMarcados,\n      progresso_declaratorio: decl.length ? declMarcados / decl.length : 0,\n      criticos_abertos: criticosAbertos,\n      nao_conformes: naoConformes,\n      apto: naoConformes.length === 0 && criticosAbertos.length === 0,\n    };\n  }\n\n  function porGrupo(resultado) {\n    const g = {};\n    resultado.itens.forEach(i => { (g[i.grupo] = g[i.grupo] || []).push(i); });\n    return Object.keys(GRUPOS)\n      .sort((a, b) => GRUPOS[a].ordem - GRUPOS[b].ordem)\n      .filter(k => g[k])\n      .map(k => ({ chave: k, nome: GRUPOS[k].nome, itens: g[k] }));\n  }\n\n  const ROTULO = { ok: 'Conforme', atencao: 'Atenção', nao: 'Não conforme', pendente: 'A verificar', na: 'Não aplicável' };\n\n  return { GRUPOS, ITENS, ROTULO, avaliar, porGrupo };\n})();\n\n<\/script>\n<script>\n/* ==================================================================\n   CompressorSelect Pro — PROJ: biblioteca de projetos\n   --------------------------------------------------------------\n   Guarda o estado completo de trabalhos anteriores no próprio\n   navegador e permite reabrir, duplicar, exportar e importar. Nada\n   sai do computador: o armazenamento é o localStorage.\n\n   Dois acervos convivem:\n     • MODELOS DE PARTIDA — os projetos pré-cadastrados que vêm com o\n       aplicativo, classificados por tipologia e porte;\n     • PROJETOS SALVOS — os que o usuário grava, com data e resumo\n       técnico (vazão, potência, modelo e custo anual de energia).\n   ================================================================== */\nconst PROJ = (function () {\n  'use strict';\n\n  const CHAVE = 'compressorselect.biblioteca.v1';\n  const LIMITE = 60;                       // projetos salvos simultâneos\n\n  /* ---------- Classificação dos modelos de partida ---------------- */\n  const META = {\n    P01: { categoria: 'Predial / manutenção', porte: 'Pequeno', tags: ['oficina', 'órgão público', 'intermitente'] },\n    P02: { categoria: 'Obra / canteiro', porte: 'Médio', tags: ['rodovia', 'demolição', 'diesel'] },\n    P03: { categoria: 'Industrial', porte: 'Médio', tags: ['pré-moldados', 'vibração', 'dois turnos'] },\n    P04: { categoria: 'Obra / canteiro', porte: 'Grande', tags: ['jateamento', 'pintura', 'ponte'] },\n    P05: { categoria: 'Laboratório / saúde', porte: 'Pequeno', tags: ['ar isento', 'instrumentação', 'ensaios'] },\n    P06: { categoria: 'Predial / manutenção', porte: 'Pequeno', tags: ['pintura', 'demanda variável', 'HVLP'] },\n    P07: { categoria: 'Saneamento / infraestrutura', porte: 'Médio', tags: ['ETE', '24 h', 'instrumentação'] },\n    P08: { categoria: 'Industrial', porte: 'Grande', tags: ['automação', 'três turnos', 'muitos pontos'] },\n  };\n\n  const CATEGORIAS = ['Obra / canteiro', 'Industrial', 'Predial / manutenção',\n    'Saneamento / infraestrutura', 'Laboratório / saúde'];\n  const PORTES = ['Pequeno', 'Médio', 'Grande'];\n\n  function meta(id) {\n    return META[id] || { categoria: 'Outros', porte: '—', tags: [] };\n  }\n\n  /**\n   * Filtra os modelos de partida por texto livre, categoria e porte.\n   */\n  function filtrarModelos(lista, f) {\n    const t = (f.texto || '').trim().toLowerCase();\n    return lista.filter(p => {\n      const m = meta(p.id);\n      if (f.categoria && m.categoria !== f.categoria) return false;\n      if (f.porte && m.porte !== f.porte) return false;\n      if (t) {\n        const alvo = (p.nome + ' ' + (p.descricao || '') + ' ' + m.categoria + ' ' + m.tags.join(' ')).toLowerCase();\n        if (!alvo.includes(t)) return false;\n      }\n      return true;\n    });\n  }\n\n  /* ---------- Persistência ---------------------------------------- */\n  function ler() {\n    try {\n      const b = localStorage.getItem(CHAVE);\n      if (!b) return [];\n      const l = JSON.parse(b);\n      return Array.isArray(l) ? l : [];\n    } catch (e) { return []; }\n  }\n\n  function gravar(lista) {\n    try {\n      localStorage.setItem(CHAVE, JSON.stringify(lista));\n      return { ok: true };\n    } catch (e) {\n      return { ok: false, erro: 'Não foi possível gravar. O armazenamento local do navegador pode estar '\n        + 'cheio ou bloqueado (janela anônima). Exporte a biblioteca como arquivo e apague projetos antigos.' };\n    }\n  }\n\n  function listar() {\n    return ler().sort((a, b) => (b.atualizado_em || '').localeCompare(a.atualizado_em || ''));\n  }\n\n  function obter(id) { return ler().find(p => p.id === id) || null; }\n\n  function novoId() {\n    return 'S' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);\n  }\n\n  /* Campos do estado que compõem um projeto salvo */\n  const CAMPOS = ['projeto', 'modelo_id', 'rede', 'reserv', 'energia', 'auto',\n    'desenho', 'perfil', 'conformidade'];\n\n  function extrair(estado) {\n    const d = {};\n    CAMPOS.forEach(k => { if (estado[k] !== undefined) d[k] = JSON.parse(JSON.stringify(estado[k])); });\n    return d;\n  }\n\n  /**\n   * Grava um projeto. Se `id` existir, sobrescreve; senão cria.\n   * resumo: indicadores técnicos calculados no momento da gravação.\n   */\n  function salvar(estado, nome, resumo, id) {\n    const lista = ler();\n    const agora = new Date().toISOString();\n    let reg = id ? lista.find(p => p.id === id) : null;\n\n    if (!reg) {\n      if (lista.length >= LIMITE) {\n        return { ok: false, erro: 'Limite de ' + LIMITE + ' projetos salvos atingido. '\n          + 'Exclua algum ou exporte a biblioteca antes de continuar.' };\n      }\n      reg = { id: novoId(), criado_em: agora };\n      lista.push(reg);\n    }\n    reg.nome = (nome || 'Projeto sem nome').slice(0, 120);\n    reg.atualizado_em = agora;\n    reg.resumo = resumo || {};\n    reg.dados = extrair(estado);\n\n    const r = gravar(lista);\n    return r.ok ? { ok: true, id: reg.id, registro: reg } : r;\n  }\n\n  function excluir(id) {\n    const lista = ler().filter(p => p.id !== id);\n    return gravar(lista);\n  }\n\n  function duplicar(id) {\n    const lista = ler();\n    const o = lista.find(p => p.id === id);\n    if (!o) return { ok: false, erro: 'Projeto não encontrado.' };\n    if (lista.length >= LIMITE) return { ok: false, erro: 'Limite de projetos salvos atingido.' };\n    const agora = new Date().toISOString();\n    const c = JSON.parse(JSON.stringify(o));\n    c.id = novoId(); c.criado_em = agora; c.atualizado_em = agora;\n    c.nome = (o.nome + ' (cópia)').slice(0, 120);\n    lista.push(c);\n    const r = gravar(lista);\n    return r.ok ? { ok: true, id: c.id } : r;\n  }\n\n  function renomear(id, nome) {\n    const lista = ler();\n    const o = lista.find(p => p.id === id);\n    if (!o) return { ok: false, erro: 'Projeto não encontrado.' };\n    o.nome = (nome || o.nome).slice(0, 120);\n    o.atualizado_em = new Date().toISOString();\n    return gravar(lista);\n  }\n\n  /* ---------- Exportação e importação ----------------------------- */\n  const MARCA = 'compressorselect-biblioteca';\n\n  function exportarTudo() {\n    return {\n      formato: MARCA, versao: 1,\n      gerado_em: new Date().toISOString(),\n      projetos: ler(),\n    };\n  }\n\n  function exportarUm(id) {\n    const o = obter(id);\n    if (!o) return null;\n    return { formato: MARCA, versao: 1, gerado_em: new Date().toISOString(), projetos: [o] };\n  }\n\n  function pareceEstado(o) {\n    return o && typeof o === 'object' && o.projeto && Array.isArray(o.projeto.consumidores);\n  }\n\n  /**\n   * Aceita três formatos:\n   *   1. pacote da biblioteca  {formato:'compressorselect-biblioteca', projetos:[...]}\n   *   2. estado completo exportado pela aba Conformidade (projeto-compressor.json)\n   *   3. array de registros da biblioteca\n   * Devolve a lista de registros normalizados, sem gravar.\n   */\n  function interpretar(texto) {\n    let o;\n    try { o = typeof texto === 'string' ? JSON.parse(texto) : texto; }\n    catch (e) { return { ok: false, erro: 'Arquivo não é um JSON válido.' }; }\n\n    const agora = new Date().toISOString();\n    let brutos = null;\n\n    if (o && o.formato === MARCA && Array.isArray(o.projetos)) brutos = o.projetos;\n    else if (Array.isArray(o)) brutos = o;\n    else if (pareceEstado(o)) {\n      brutos = [{\n        id: null, nome: o.projeto.nome || 'Projeto importado',\n        criado_em: agora, atualizado_em: agora, resumo: {},\n        dados: extrair(o),\n      }];\n    }\n\n    if (!brutos) {\n      return { ok: false, erro: 'Formato não reconhecido. Use um arquivo gerado pela própria '\n        + 'biblioteca ou a exportação de projeto (.json) da aba Conformidade.' };\n    }\n\n    const registros = [];\n    brutos.forEach(b => {\n      if (!b || typeof b !== 'object') return;\n      const d = b.dados && b.dados.projeto ? b.dados : (pareceEstado(b) ? extrair(b) : null);\n      if (!d || !d.projeto || !Array.isArray(d.projeto.consumidores)) return;\n      registros.push({\n        id: novoId(),\n        nome: String(b.nome || d.projeto.nome || 'Projeto importado').slice(0, 120),\n        criado_em: b.criado_em || agora,\n        atualizado_em: agora,\n        resumo: b.resumo && typeof b.resumo === 'object' ? b.resumo : {},\n        dados: d,\n      });\n    });\n\n    if (!registros.length) {\n      return { ok: false, erro: 'Nenhum projeto válido encontrado no arquivo. '\n        + 'Cada projeto precisa ter, no mínimo, a lista de consumidores.' };\n    }\n    return { ok: true, registros };\n  }\n\n  /** Importa e grava, mantendo os projetos já existentes. */\n  function importar(texto) {\n    const r = interpretar(texto);\n    if (!r.ok) return r;\n    const lista = ler();\n    const espaco = LIMITE - lista.length;\n    if (espaco <= 0) {\n      return { ok: false, erro: 'Limite de ' + LIMITE + ' projetos salvos atingido. Exclua algum antes de importar.' };\n    }\n    const entram = r.registros.slice(0, espaco);\n    const g = gravar(lista.concat(entram));\n    if (!g.ok) return g;\n    return {\n      ok: true, importados: entram.length,\n      ignorados: r.registros.length - entram.length,\n    };\n  }\n\n  /** Restaura um projeto salvo sobre o estado atual, campo a campo. */\n  function aplicar(registro, estado) {\n    if (!registro || !registro.dados) return false;\n    CAMPOS.forEach(k => {\n      if (registro.dados[k] !== undefined) {\n        estado[k] = JSON.parse(JSON.stringify(registro.dados[k]));\n      }\n    });\n    return true;\n  }\n\n  function limpar() { return gravar([]); }\n\n  return { CHAVE, LIMITE, META, CATEGORIAS, PORTES, CAMPOS,\n    meta, filtrarModelos, listar, obter, salvar, excluir, duplicar, renomear,\n    exportarTudo, exportarUm, interpretar, importar, aplicar, limpar, extrair };\n})();\n\n<\/script>\n<script>\n/* ==================================================================\n   CompressorSelect Pro — editor gráfico da rede\n   SVG com eventos de ponteiro (funciona com mouse e toque). Todo o\n   cálculo hidráulico vive em REDE; aqui só há desenho e interação.\n   ================================================================== */\nconst CANVAS = (function () {\n  'use strict';\n\n  const GRADE = 25;                 // passo do alinhamento, em pixels\n  const RAIO = 17;                  // raio do símbolo do nó\n  const VB = { w: 1000, h: 620 };   // área de trabalho\n\n  const ui = {\n    rede: null, ferramenta: 'mover', selNo: null, selTrecho: null,\n    ligarDe: null, arrastando: null, offset: null, resultado: null,\n    mostrarGrade: true, rotular: 'pressao', aoMudar: null, cursor: null,\n  };\n\n  const SIMBOLOS = {\n    compressor:   { r: 21, forma: 'circulo', glifo: 'C' },\n    reservatorio: { r: 18, forma: 'capsula', glifo: 'R' },\n    secador_ref:  { r: 16, forma: 'losango', glifo: 'S' },\n    secador_ads:  { r: 16, forma: 'losango', glifo: 'S' },\n    filtro_part:  { r: 15, forma: 'quadrado', glifo: 'F' },\n    filtro_coal:  { r: 15, forma: 'quadrado', glifo: 'F' },\n    filtro_carvao:{ r: 15, forma: 'quadrado', glifo: 'F' },\n    purgador:     { r: 12, forma: 'triangulo', glifo: 'P' },\n    juncao:       { r: 8,  forma: 'circulo', glifo: '' },\n    consumo:      { r: 15, forma: 'circulo', glifo: '' },\n  };\n\n  function alinhar(v) { return Math.round(v / GRADE) * GRADE; }\n\n  function iniciar(rede, aoMudar) {\n    ui.rede = rede; ui.aoMudar = aoMudar;\n    REDE.sincronizarSequencia(rede);\n    recalcular();\n  }\n\n  function recalcular() {\n    try { ui.resultado = REDE.calcular(ui.rede); }\n    catch (e) { ui.resultado = { ok: false, erros: ['Falha no cálculo: ' + e.message] }; }\n    if (ui.aoMudar) ui.aoMudar(ui.resultado);\n    return ui.resultado;\n  }\n\n  /* ---------- Escalas de cor ---------- */\n  function corVelocidade(v, vmax) {\n    if (!v) return 'var(--aco-fraco)';\n    const f = v / vmax;\n    if (f > 1) return 'var(--alerta)';\n    if (f > 0.8) return '#E07B39';\n    if (f > 0.6) return 'var(--nr26)';\n    return 'var(--ar)';\n  }\n  function espessura(di) { return Math.max(2.2, Math.min(11, 1.6 + di / 16)); }\n\n  /* ---------- Desenho ---------- */\n  function desenhar() {\n    const r = ui.rede, res = ui.resultado || {};\n    const infoT = {}; (res.trechos || []).forEach(t => infoT[t.id] = t);\n    const infoN = {}; (res.nos || []).forEach(n => infoN[n.id] = n);\n\n    const grade = ui.mostrarGrade\n      ? `<defs><pattern id=\"gr\" width=\"${GRADE}\" height=\"${GRADE}\" patternUnits=\"userSpaceOnUse\">\n           <path d=\"M ${GRADE} 0 L 0 0 0 ${GRADE}\" fill=\"none\" stroke=\"var(--borda)\" stroke-width=\".6\" opacity=\".55\"/>\n         <\/pattern><\/defs>\n         <rect width=\"100%\" height=\"100%\" fill=\"url(#gr)\"/>` : '';\n\n    const setas = `<defs>\n      <marker id=\"fl\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\">\n        <path d=\"M 0 1 L 9 5 L 0 9 z\" fill=\"var(--papel)\" stroke=\"none\"/>\n      <\/marker><\/defs>`;\n\n    // Trechos\n    const tubos = r.trechos.map(t => {\n      const a = REDE.no(r, t.de), b = REDE.no(r, t.para);\n      if (!a || !b) return '';\n      const i = infoT[t.id] || {};\n      const sel = ui.selTrecho === t.id;\n      const cor = i.excede_velocidade ? 'var(--alerta)' : corVelocidade(i.velocidade_ms, r.vel_max_ms);\n      const w = espessura(i.di_mm || 25);\n      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;\n      const inverso = i.sentido === 'para→de';\n      const [ox, oy] = inverso ? [b.x, b.y] : [a.x, a.y];\n      const [dx, dy] = inverso ? [a.x, a.y] : [b.x, b.y];\n      const ang = Math.atan2(dy - oy, dx - ox);\n      const sx = ox + Math.cos(ang) * (Math.hypot(dx - ox, dy - oy) * 0.5 - 9);\n      const sy = oy + Math.sin(ang) * (Math.hypot(dx - ox, dy - oy) * 0.5 - 9);\n\n      const rotulo = ui.rotular === 'nenhum' ? '' : `\n        <rect x=\"${mx - 30}\" y=\"${my - 25}\" width=\"60\" height=\"15\" rx=\"2.5\"\n              fill=\"var(--papel)\" stroke=\"var(--borda)\" stroke-width=\".7\" opacity=\".95\"/>\n        <text x=\"${mx}\" y=\"${my - 14}\" text-anchor=\"middle\" font-size=\"9.5\"\n              font-family=\"ui-monospace, Consolas, monospace\" fill=\"var(--aco-med)\">${esc(rotuloTrecho(i))}<\/text>`;\n\n      return `<g class=\"tubo\" data-trecho=\"${t.id}\" style=\"cursor:pointer\">\n        <line x1=\"${a.x}\" y1=\"${a.y}\" x2=\"${b.x}\" y2=\"${b.y}\" stroke=\"transparent\" stroke-width=\"16\"/>\n        ${sel ? `<line x1=\"${a.x}\" y1=\"${a.y}\" x2=\"${b.x}\" y2=\"${b.y}\" stroke=\"var(--nr26)\" stroke-width=\"${w + 7}\" stroke-linecap=\"round\" opacity=\".55\"/>` : ''}\n        <line x1=\"${a.x}\" y1=\"${a.y}\" x2=\"${b.x}\" y2=\"${b.y}\" stroke=\"${cor}\" stroke-width=\"${w}\" stroke-linecap=\"round\"/>\n        ${i.vazao_m3min > 1e-6 ? `<circle cx=\"${sx}\" cy=\"${sy}\" r=\"0\" fill=\"none\"/>\n          <path d=\"M ${sx - Math.cos(ang) * 5 - Math.sin(ang) * 4} ${sy - Math.sin(ang) * 5 + Math.cos(ang) * 4}\n                   L ${sx + Math.cos(ang) * 5} ${sy + Math.sin(ang) * 5}\n                   L ${sx - Math.cos(ang) * 5 + Math.sin(ang) * 4} ${sy - Math.sin(ang) * 5 - Math.cos(ang) * 4} z\"\n                fill=\"var(--papel)\" opacity=\".9\"/>` : ''}\n        ${rotulo}\n      <\/g>`;\n    }).join('');\n\n    // Linha-guia enquanto liga dois nós\n    let guia = '';\n    if (ui.ligarDe && ui.cursor) {\n      const a = REDE.no(r, ui.ligarDe);\n      if (a) guia = `<line x1=\"${a.x}\" y1=\"${a.y}\" x2=\"${ui.cursor.x}\" y2=\"${ui.cursor.y}\"\n        stroke=\"var(--ar)\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\" opacity=\".8\"/>`;\n    }\n\n    // Nós\n    const nos = r.nos.map(n => {\n      const s = SIMBOLOS[n.tipo] || SIMBOLOS.juncao;\n      const eq = REDE.EQUIPAMENTOS[n.tipo] || {};\n      const i = infoN[n.id] || {};\n      const sel = ui.selNo === n.id, ligando = ui.ligarDe === n.id;\n      const critico = i.critico;\n      const cor = critico ? 'var(--alerta)' : (eq.cor || 'var(--aco-med)');\n\n      let forma;\n      if (s.forma === 'capsula') forma = `<rect x=\"${n.x - s.r * 1.5}\" y=\"${n.y - s.r * 0.85}\" width=\"${s.r * 3}\" height=\"${s.r * 1.7}\" rx=\"${s.r * 0.85}\" fill=\"var(--papel)\" stroke=\"${cor}\" stroke-width=\"2.6\"/>`;\n      else if (s.forma === 'losango') forma = `<rect x=\"${n.x - s.r * 0.75}\" y=\"${n.y - s.r * 0.75}\" width=\"${s.r * 1.5}\" height=\"${s.r * 1.5}\" transform=\"rotate(45 ${n.x} ${n.y})\" fill=\"var(--papel)\" stroke=\"${cor}\" stroke-width=\"2.6\"/>`;\n      else if (s.forma === 'quadrado') forma = `<rect x=\"${n.x - s.r * 0.8}\" y=\"${n.y - s.r * 0.8}\" width=\"${s.r * 1.6}\" height=\"${s.r * 1.6}\" rx=\"2\" fill=\"var(--papel)\" stroke=\"${cor}\" stroke-width=\"2.6\"/>`;\n      else if (s.forma === 'triangulo') forma = `<path d=\"M ${n.x} ${n.y + s.r} L ${n.x - s.r} ${n.y - s.r * 0.7} L ${n.x + s.r} ${n.y - s.r * 0.7} z\" fill=\"var(--papel)\" stroke=\"${cor}\" stroke-width=\"2.4\"/>`;\n      else forma = `<circle cx=\"${n.x}\" cy=\"${n.y}\" r=\"${s.r}\" fill=\"${n.tipo === 'juncao' ? cor : 'var(--papel)'}\" stroke=\"${cor}\" stroke-width=\"2.6\"/>`;\n\n      const rot = ui.rotular === 'nenhum' || n.tipo === 'juncao' ? '' : `\n        <text x=\"${n.x}\" y=\"${n.y + s.r + 14}\" text-anchor=\"middle\" font-size=\"10.5\"\n              font-weight=\"600\" fill=\"var(--aco)\">${esc(cortar(n.nome, 20))}<\/text>\n        ${i.pressao_bar !== undefined && ui.rotular !== 'nome' ? `<text x=\"${n.x}\" y=\"${n.y + s.r + 26}\"\n              text-anchor=\"middle\" font-size=\"10\" font-family=\"ui-monospace, Consolas, monospace\"\n              fill=\"${critico ? 'var(--alerta)' : 'var(--aco-med)'}\">${fmt(i.pressao_bar, 2)} bar${\n          n.tipo === 'consumo' && i.demanda_m3min ? ' · ' + fmt(i.demanda_m3min, 2) + ' m³/min' : ''}<\/text>` : ''}`;\n\n      return `<g class=\"no\" data-no=\"${n.id}\" style=\"cursor:${ui.ferramenta === 'mover' ? 'grab' : 'pointer'}\">\n        ${sel || ligando ? `<circle cx=\"${n.x}\" cy=\"${n.y}\" r=\"${s.r + 9}\" fill=\"none\"\n          stroke=\"${ligando ? 'var(--ar)' : 'var(--nr26)'}\" stroke-width=\"2.5\" opacity=\".85\"\n          ${ligando ? 'stroke-dasharray=\"5 4\"' : ''}/>` : ''}\n        ${critico ? `<circle cx=\"${n.x}\" cy=\"${n.y}\" r=\"${s.r + 5}\" fill=\"var(--alerta)\" opacity=\".16\"/>` : ''}\n        ${forma}\n        ${s.glifo ? `<text x=\"${n.x}\" y=\"${n.y + 4.5}\" text-anchor=\"middle\" font-size=\"12.5\"\n          font-weight=\"700\" fill=\"${cor}\" pointer-events=\"none\">${s.glifo}<\/text>` : ''}\n        ${rot}\n      <\/g>`;\n    }).join('');\n\n    return `<svg id=\"svg-rede\" viewBox=\"0 0 ${VB.w} ${VB.h}\" width=\"100%\"\n        style=\"display:block;background:var(--papel);border-radius:var(--r);touch-action:none\"\n        role=\"img\" aria-label=\"Diagrama da rede de ar comprimido com ${r.nos.length} equipamentos e ${r.trechos.length} trechos de tubulação\">\n      ${grade}${setas}${tubos}${guia}${nos}\n    <\/svg>`;\n  }\n\n  function rotuloTrecho(i) {\n    if (!i || !i.di_mm) return '';\n    switch (ui.rotular) {\n      case 'diametro': return (i.dn || '').replace(/ \\(.*\\)/, '');\n      case 'vazao': return fmt(i.vazao_m3min, 2) + ' m³/min';\n      case 'velocidade': return fmt(i.velocidade_ms, 1) + ' m/s';\n      case 'nome': return '';\n      default: return fmt(i.perda_bar, 3) + ' bar';\n    }\n  }\n\n  /* ---------- Interação ---------- */\n  function ligarEventos(svg, redesenhar) {\n    const ponto = ev => {\n      const p = svg.createSVGPoint();\n      p.x = ev.clientX; p.y = ev.clientY;\n      const m = svg.getScreenCTM();\n      if (!m) return { x: 0, y: 0 };\n      const q = p.matrixTransform(m.inverse());\n      return { x: q.x, y: q.y };\n    };\n\n    svg.addEventListener('pointerdown', ev => {\n      const alvoNo = ev.target.closest('[data-no]');\n      const alvoT = ev.target.closest('[data-trecho]');\n      const p = ponto(ev);\n\n      if (ui.ferramenta === 'apagar') {\n        if (alvoNo) { REDE.removerNo(ui.rede, alvoNo.dataset.no); ui.selNo = null; }\n        else if (alvoT) { REDE.removerTrecho(ui.rede, alvoT.dataset.trecho); ui.selTrecho = null; }\n        else return;\n        recalcular(); redesenhar(); return;\n      }\n\n      if (ui.ferramenta === 'tubo') {\n        if (!alvoNo) { ui.ligarDe = null; ui.cursor = null; redesenhar(); return; }\n        const id = alvoNo.dataset.no;\n        if (!ui.ligarDe) { ui.ligarDe = id; ui.cursor = p; }\n        else if (ui.ligarDe === id) { ui.ligarDe = null; ui.cursor = null; }\n        else {\n          const t = REDE.addTrecho(ui.rede, ui.ligarDe, id);\n          ui.ligarDe = null; ui.cursor = null;\n          if (t) { ui.selTrecho = t.id; ui.selNo = null; recalcular(); }\n        }\n        redesenhar(); return;\n      }\n\n      if (ui.ferramenta !== 'mover') {           // ferramenta de inserção\n        if (alvoNo) { ui.selNo = alvoNo.dataset.no; ui.selTrecho = null; redesenhar(); return; }\n        const n = REDE.addNo(ui.rede, ui.ferramenta, alinhar(p.x), alinhar(p.y));\n        ui.selNo = n.id; ui.selTrecho = null;\n        recalcular(); redesenhar(); return;\n      }\n\n      // mover / selecionar\n      if (alvoNo) {\n        const id = alvoNo.dataset.no, n = REDE.no(ui.rede, id);\n        ui.selNo = id; ui.selTrecho = null;\n        ui.arrastando = id; ui.offset = { x: p.x - n.x, y: p.y - n.y };\n        svg.setPointerCapture(ev.pointerId);\n        redesenhar();\n      } else if (alvoT) {\n        ui.selTrecho = alvoT.dataset.trecho; ui.selNo = null; redesenhar();\n      } else { ui.selNo = null; ui.selTrecho = null; redesenhar(); }\n    });\n\n    svg.addEventListener('pointermove', ev => {\n      if (ui.ligarDe) { ui.cursor = ponto(ev); redesenhar(); return; }\n      if (!ui.arrastando) return;\n      const p = ponto(ev), n = REDE.no(ui.rede, ui.arrastando);\n      if (!n) return;\n      n.x = Math.max(RAIO + 6, Math.min(VB.w - RAIO - 6, alinhar(p.x - ui.offset.x)));\n      n.y = Math.max(RAIO + 6, Math.min(VB.h - RAIO - 22, alinhar(p.y - ui.offset.y)));\n      redesenhar();\n    });\n\n    const soltar = ev => {\n      if (!ui.arrastando) return;\n      ui.arrastando = null;\n      try { svg.releasePointerCapture(ev.pointerId); } catch (e) { /* já liberado */ }\n      recalcular(); redesenhar();\n    };\n    svg.addEventListener('pointerup', soltar);\n    svg.addEventListener('pointercancel', soltar);\n    svg.addEventListener('pointerleave', () => { if (ui.arrastando) { ui.arrastando = null; recalcular(); redesenhar(); } });\n  }\n\n  /* ---------- Auxiliares ---------- */\n  function esc(s) {\n    return String(s === undefined || s === null ? '' : s)\n      .replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n  }\n  function cortar(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }\n  function fmt(v, d) {\n    if (v === null || v === undefined || !isFinite(v)) return '—';\n    return Number(v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });\n  }\n\n  return {\n    ui, GRADE, VB, SIMBOLOS,\n    iniciar, recalcular, desenhar, ligarEventos, alinhar,\n    set ferramenta(f) { ui.ferramenta = f; ui.ligarDe = null; ui.cursor = null; },\n    get ferramenta() { return ui.ferramenta; },\n  };\n})();\n\n\n<\/script>\n<script>\n/* Declarações const no topo de script clássico não viram propriedade do objeto\n   global. A exposição explícita permite inspeção no console e testes externos. */\nwindow.ENG = ENG; window.REDE = REDE; window.AUTOSEL = AUTOSEL; window.CANVAS = CANVAS;\n<\/script>\n<script>\n/* ==================================================================\n   CompressorSelect Pro — painéis de autosseleção e desenho da rede\n   Registrado em window.PAINEIS e consumido por app.js.\n   ================================================================== */\n(function () {\n  'use strict';\n\n  const $ = (s, r) => (r || document).querySelector(s);\n  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));\n\n  function num(v, d) {\n    if (v === null || v === undefined || !isFinite(v)) return '—';\n    return Number(v).toLocaleString('pt-BR', {\n      minimumFractionDigits: d === undefined ? 2 : d, maximumFractionDigits: d === undefined ? 2 : d });\n  }\n  function moeda(v) {\n    if (!isFinite(v)) return '—';\n    return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });\n  }\n  function esc(s) {\n    return String(s === undefined || s === null ? '' : s)\n      .replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n  }\n\n  /* =================================================================\n     AUTOSSELEÇÃO\n     ================================================================= */\n  function renderAutoSelecao(ctx) {\n    const { estado, calcular, salvar, render, irPara } = ctx;\n    const c = calcular();\n    const p = estado.projeto;\n    const el = $('#painel-auto');\n\n    const req = {\n      vazao_m3min: c.dem.q_projeto_m3min, pressao_bar: c.pTrab, regime: p.regime,\n      isento: !!p.isento, demanda_variavel: !!p.demanda_variavel,\n      acionamento: p.acionamento || null, ruido_max: estado.auto.ruido_max || null,\n      margem_max: estado.auto.margem_max,\n      horas_ano: c.horasEf === undefined ? p.horas_ano : c.horasEf,\n      fator_carga: c.fcEf === undefined ? p.fator_carga : c.fcEf,\n      tarifa_kwh: c.tarifa, anos_analise: estado.auto.anos, pesos: estado.auto.pesos,\n    };\n    const r = AUTOSEL.executar(CATALOGO, req);\n    const baseEnergia = num(req.horas_ano, 0) + ' h/ano e fator de carga de '\n      + num(req.fator_carga * 100, 0) + ' % '\n      + (c.usaPerfil ? '(derivados do perfil horário de demanda)' : '(informados na aba Projeto)');\n\n    const pesosUI = Object.keys(AUTOSEL.CRITERIOS).map(k => {\n      const cr = AUTOSEL.CRITERIOS[k];\n      return `<div style=\"margin-bottom:11px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n          <span class=\"rotulo\" style=\"margin:0\">${esc(cr.nome)}<\/span>\n          <span style=\"font-family:var(--mono);font-size:12px;color:var(--ar)\">${estado.auto.pesos[k]}<\/span>\n        <\/div>\n        <input type=\"range\" min=\"0\" max=\"50\" step=\"5\" value=\"${estado.auto.pesos[k]}\"\n               data-peso=\"${k}\" style=\"width:100%;padding:0\" aria-label=\"${esc(cr.nome)}\">\n        <p class=\"dica\" style=\"margin-top:1px\">${esc(cr.desc)}<\/p>\n      <\/div>`;\n    }).join('');\n\n    if (!r.ok) {\n      el.innerHTML = `<div class=\"grade g-1-2\">\n        ${cartaoPesos(pesosUI, estado, baseEnergia)}\n        <div class=\"cartao\"><h2><span class=\"tag-num\">A<\/span> Resultado<\/h2><div class=\"corpo\">\n          <div class=\"nota erro\"><strong>${esc(r.motivo)}<\/strong>\n          Afrouxe a folga máxima, reveja a exigência de ar isento ou a pressão de trabalho.\n          Os candidatos mais próximos e o motivo da reprovação estão na aba Seleção.<\/div>\n        <\/div><\/div><\/div>`;\n      ligarPesos(ctx); return;\n    }\n\n    const v = r.recomendado;\n    const maxContrib = Math.max.apply(null, Object.keys(v.contribuicao).map(k => v.contribuicao[k]));\n    const barras = Object.keys(AUTOSEL.CRITERIOS).map(k => {\n      const cr = AUTOSEL.CRITERIOS[k], val = v.contribuicao[k] * 100;\n      return `<tr>\n        <td style=\"width:38%\">${esc(cr.nome)}<\/td>\n        <td style=\"width:44%\"><div class=\"barra\"><i style=\"width:${(v.contribuicao[k] / maxContrib * 100).toFixed(1)}%\"><\/i><\/div><\/td>\n        <td class=\"n\">${num(v.notas[k] * 100, 0)}<\/td>\n        <td class=\"n\" style=\"color:var(--ar)\">${num(val, 1)}<\/td>\n      <\/tr>`;\n    }).join('');\n\n    const maxTCO = Math.max.apply(null, r.arranjos.map(a => a.tco_total)) || 1;\n    const linhasArranjo = r.arranjos.map(a => `<tr${a === r.arranjo_recomendado ? ' style=\"background:var(--ok-bg)\"' : ''}>\n      <td><b>${esc(a.nome)}<\/b><br><span style=\"font-size:11px;color:var(--aco-med)\">\n        ${a.detalhe.map(d => esc(d.modelo.marca + ' ' + d.modelo.modelo) + ' <i>(' + d.papel + ')<\/i>').join('<br>')}<\/span><\/td>\n      <td class=\"n\">${num(a.capacidade_m3min, 2)}<\/td>\n      <td class=\"n\">${num(a.potencia_instalada_kw, 1)}<\/td>\n      <td class=\"n\">${moeda(a.capex)}<\/td>\n      <td class=\"n\">${moeda(a.energia_ano)}<\/td>\n      <td style=\"width:130px\"><div class=\"barra ${a.tco_total === Math.min.apply(null, r.arranjos.map(x => x.tco_total)) ? 'ok' : ''}\">\n        <i style=\"width:${(a.tco_total / maxTCO * 100).toFixed(1)}%\"><\/i><\/div>\n        <span style=\"font-family:var(--mono);font-size:11px\">${moeda(a.tco_total)}<\/span><\/td>\n      <td>${a.redundancia === 'total' ? '<span class=\"selo ok\">total<\/span>'\n        : a.redundancia === 'parcial' ? '<span class=\"selo info\">parcial<\/span>' : '<span class=\"selo erro\">nenhuma<\/span>'}<\/td>\n    <\/tr>`).join('');\n\n    const linhasAlt = r.alternativas.map((a, i) => `<tr>\n      <td class=\"n\">${i + 2}<\/td>\n      <td><b>${esc(a.marca)} ${esc(a.modelo)}<\/b><br><span style=\"font-size:11px;color:var(--aco-med)\">${esc(ENG.NOMES_TIPO[a.tipo])}<\/span><\/td>\n      <td class=\"n\">${num(a.vazao_fad_m3min, 2)}<\/td>\n      <td class=\"n\">${num(a.folga_percentual, 0)} %<\/td>\n      <td class=\"n\">${num(a.potencia_kw, 1)}<\/td>\n      <td class=\"n\">${moeda(a.tco.total)}<\/td>\n      <td class=\"n\" style=\"color:var(--ar);font-weight:600\">${num(a.pontuacao, 1)}<\/td>\n      <td><button class=\"btn mini sec\" data-adotar=\"${a.id}\">adotar<\/button><\/td>\n    <\/tr>`).join('');\n\n    el.innerHTML = `<div class=\"grade g-1-2\">\n      ${cartaoPesos(pesosUI, estado, baseEnergia)}\n\n      <div class=\"grade\" style=\"align-content:start\">\n        <div class=\"cartao\" style=\"border-color:var(--ar);border-width:2px\">\n          <h2><span class=\"tag-num\">A<\/span> Recomendação automática\n            <span class=\"selo ok\">${num(v.pontuacao, 1)} de 100 pontos<\/span><\/h2>\n          <div class=\"corpo solto\">\n            <div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start\">\n              <div style=\"flex:1;min-width:230px\">\n                <div style=\"font-size:22px;font-weight:700;line-height:1.15\">${esc(v.marca)} ${esc(v.modelo)}<\/div>\n                <div style=\"color:var(--aco-med);font-size:12.5px;margin-top:2px\">\n                  ${esc(v.linha)} · ${esc(ENG.NOMES_TIPO[v.tipo])} · ref. ${esc(v.id)}<\/div>\n              <\/div>\n              <div class=\"linha-btn\">\n                <button class=\"btn\" data-adotar=\"${v.id}\">Adotar este modelo<\/button>\n              <\/div>\n            <\/div>\n            <div class=\"kpi-linha\">\n              <div class=\"kpi destaque\"><span class=\"k\">Vazão FAD<\/span><span class=\"v\">${num(v.vazao_fad_m3min, 2)} <small>m³/min<\/small><\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">Folga<\/span><span class=\"v\">${num(v.folga_percentual, 0)} <small>%<\/small><\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">Potência<\/span><span class=\"v\">${num(v.potencia_kw, 1)} <small>kW<\/small><\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">Pot. específica<\/span><span class=\"v\">${num(v.pot_especifica, 2)}<\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">Ruído<\/span><span class=\"v\">${v.ruido_dba} <small>dB(A)<\/small><\/span><\/div>\n              <div class=\"kpi ${v.tco.total === Math.min.apply(null, r.todos.map(x => x.tco.total)) ? 'bom' : ''}\">\n                <span class=\"k\">Custo em ${estado.auto.anos} anos<\/span><span class=\"v\" style=\"font-size:15px\">${moeda(v.tco.total)}<\/span><\/div>\n            <\/div>\n\n            <div>\n              <span class=\"rotulo\">Como a pontuação se formou<\/span>\n              <table class=\"dados\">\n                <thead><tr><th>Critério<\/th><th>Contribuição<\/th><th class=\"n\">Nota<\/th><th class=\"n\">Pontos<\/th><\/tr><\/thead>\n                <tbody>${barras}<\/tbody>\n              <\/table>\n            <\/div>\n\n            <div class=\"grade\" style=\"gap:9px\">\n              ${r.justificativa.map(j => `<div class=\"nota\"><strong>${esc(j.titulo)}<\/strong>${esc(j.texto)}<\/div>`).join('')}\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">B<\/span> Arranjo da central\n            ${r.arranjo_recomendado ? `<span class=\"selo ok\">economia de ${moeda(r.economia_arranjo)}<\/span>` : ''}<\/h2>\n          <div class=\"corpo\">\n            ${r.arranjo_recomendado ? `<div class=\"nota ok\" style=\"margin-bottom:12px\">\n              <strong>Vale considerar mais de uma máquina<\/strong>\n              O arranjo \"${esc(r.arranjo_recomendado.nome.toLowerCase())}\" sai ${moeda(r.economia_arranjo)} mais barato\n              que a máquina única em ${estado.auto.anos} anos, porque as unidades operam mais perto da plena carga,\n              onde o rendimento é melhor. Some a isso a possibilidade de manutenção sem parar a produção.<\/div>`\n        : `<div class=\"nota\" style=\"margin-bottom:12px\"><strong>Máquina única é suficiente<\/strong>\n              Nenhum arranjo com várias máquinas compensa o investimento adicional neste projeto — a demanda é\n              estável o bastante para que a máquina única opere com bom rendimento.<\/div>`}\n            <div class=\"rolagem\"><table class=\"dados\">\n              <thead><tr><th>Arranjo<\/th><th class=\"n\">Capac.<br><span style=\"font-weight:400;text-transform:none\">m³/min<\/span><\/th>\n                <th class=\"n\">Pot. inst.<br><span style=\"font-weight:400;text-transform:none\">kW<\/span><\/th>\n                <th class=\"n\">Aquisição<\/th><th class=\"n\">Energia/ano<\/th>\n                <th>Custo em ${estado.auto.anos} anos<\/th><th>Redundância<\/th><\/tr><\/thead>\n              <tbody>${linhasArranjo}<\/tbody>\n            <\/table><\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">C<\/span> Demais candidatos\n            <span class=\"selo info\">${r.total_apto} aptos de ${r.total_avaliado}<\/span><\/h2>\n          <div class=\"corpo\"><div class=\"rolagem\"><table class=\"dados\">\n            <thead><tr><th class=\"n\">#<\/th><th>Modelo<\/th><th class=\"n\">Vazão<\/th><th class=\"n\">Folga<\/th>\n              <th class=\"n\">kW<\/th><th class=\"n\">Custo ${estado.auto.anos} anos<\/th><th class=\"n\">Pontos<\/th><th><\/th><\/tr><\/thead>\n            <tbody>${linhasAlt}<\/tbody>\n          <\/table><\/div><\/div>\n        <\/div>\n      <\/div>\n    <\/div>`;\n\n    ligarPesos(ctx);\n    $$('[data-adotar]').forEach(b => b.addEventListener('click', () => {\n      estado.modelo_id = b.dataset.adotar; salvar(); irPara('selecao');\n    }));\n  }\n\n  function cartaoPesos(pesosUI, estado, base) {\n    return `<div class=\"cartao\" style=\"align-self:start\">\n      <h2><span class=\"tag-num\">01<\/span> Pesos dos critérios<\/h2>\n      <div class=\"corpo solto\">\n        <p class=\"dica\" style=\"margin-top:0\">Ajuste o que importa neste projeto. Os pesos são normalizados,\n        então só a proporção entre eles conta.<\/p>\n        ${pesosUI}\n        <div class=\"grade g2\">\n          <label class=\"campo\"><span class=\"rotulo\">Horizonte <span class=\"un\">(anos)<\/span><\/span>\n            <input type=\"number\" id=\"a-anos\" min=\"1\" max=\"30\" step=\"1\" value=\"${estado.auto.anos}\"><\/label>\n          <label class=\"campo\"><span class=\"rotulo\">Folga máxima <span class=\"un\">(fração)<\/span><\/span>\n            <input type=\"number\" id=\"a-margem\" min=\"0.05\" max=\"2\" step=\"0.05\" value=\"${estado.auto.margem_max}\"><\/label>\n          <label class=\"campo\"><span class=\"rotulo\">Ruído máximo <span class=\"un\">(dB(A))<\/span><\/span>\n            <input type=\"number\" id=\"a-ruido\" step=\"1\" placeholder=\"sem limite\" value=\"${estado.auto.ruido_max || ''}\"><\/label>\n          <div style=\"display:flex;align-items:flex-end\">\n            <button class=\"btn sec mini\" id=\"a-reset\">Restaurar pesos<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"nota\"><strong>Perfis prontos<\/strong>\n          <div class=\"linha-btn\" style=\"margin-top:7px\">\n            <button class=\"btn sec mini\" data-perfil=\"energia\">Foco em energia<\/button>\n            <button class=\"btn sec mini\" data-perfil=\"capex\">Menor investimento<\/button>\n            <button class=\"btn sec mini\" data-perfil=\"silencio\">Ambiente silencioso<\/button>\n            <button class=\"btn sec mini\" data-perfil=\"robustez\">Robustez e manutenção<\/button>\n          <\/div>\n        <\/div>\n        ${base ? `<p class=\"dica\">Custo de ciclo de vida calculado sobre ${base}.<\/p>` : ''}\n      <\/div>\n    <\/div>`;\n  }\n\n  const PERFIS = {\n    energia:  { energia: 50, aquisicao: 10, aderencia: 20, tecnologia: 15, ruido: 0, manutencao: 5 },\n    capex:    { energia: 15, aquisicao: 45, aderencia: 20, tecnologia: 10, ruido: 0, manutencao: 10 },\n    silencio: { energia: 25, aquisicao: 15, aderencia: 15, tecnologia: 15, ruido: 25, manutencao: 5 },\n    robustez: { energia: 20, aquisicao: 15, aderencia: 15, tecnologia: 20, ruido: 5, manutencao: 25 },\n  };\n\n  function ligarPesos(ctx) {\n    const { estado, salvar, render } = ctx;\n    $$('[data-peso]').forEach(s => s.addEventListener('change', () => {\n      estado.auto.pesos[s.dataset.peso] = +s.value; salvar(); render();\n    }));\n    $$('[data-perfil]').forEach(b => b.addEventListener('click', () => {\n      estado.auto.pesos = Object.assign({}, PERFIS[b.dataset.perfil]); salvar(); render();\n    }));\n    const bind = (id, campo, vazio) => {\n      const e = $(id); if (!e) return;\n      e.addEventListener('change', () => {\n        estado.auto[campo] = e.value === '' ? vazio : +e.value; salvar(); render();\n      });\n    };\n    bind('#a-anos', 'anos', 10); bind('#a-margem', 'margem_max', 0.6); bind('#a-ruido', 'ruido_max', null);\n    const rs = $('#a-reset');\n    if (rs) rs.addEventListener('click', () => { estado.auto.pesos = AUTOSEL.pesosPadrao(); salvar(); render(); });\n  }\n\n  /* =================================================================\n     DESENHO DA REDE\n     ================================================================= */\n  const FERRAMENTAS = [\n    { id: 'mover', rotulo: 'Mover', dica: 'Arrastar equipamentos e selecionar' },\n    { id: 'tubo', rotulo: 'Tubo', dica: 'Clicar em dois equipamentos para ligá-los' },\n    { id: 'consumo', rotulo: '+ Consumo', dica: 'Ponto de uso de ar' },\n    { id: 'juncao', rotulo: '+ Nó', dica: 'Junção ou tê' },\n    { id: 'reservatorio', rotulo: '+ Reservatório', dica: '' },\n    { id: 'secador_ref', rotulo: '+ Secador', dica: '' },\n    { id: 'filtro_coal', rotulo: '+ Filtro', dica: '' },\n    { id: 'purgador', rotulo: '+ Purgador', dica: '' },\n    { id: 'compressor', rotulo: '+ Compressor', dica: '' },\n    { id: 'apagar', rotulo: 'Apagar', dica: 'Clicar para remover' },\n  ];\n\n  function renderDesenho(ctx) {\n    const { estado, salvar, render } = ctx;\n    const el = $('#painel-desenho');\n    const rede = estado.desenho;\n\n    CANVAS.ui.rede = rede;\n    CANVAS.ui.rotular = estado.desenho_ui.rotular;\n    CANVAS.ui.mostrarGrade = estado.desenho_ui.grade;\n    CANVAS.ui.ferramenta = estado.desenho_ui.ferramenta;\n    const res = CANVAS.recalcular();\n\n    const barra = FERRAMENTAS.map(f => `<button class=\"btn mini ${estado.desenho_ui.ferramenta === f.id ? '' : 'sec'}\"\n      data-ferr=\"${f.id}\" title=\"${esc(f.dica)}\">${esc(f.rotulo)}<\/button>`).join('');\n\n    el.innerHTML = `<div class=\"grade g-2-1\">\n      <div class=\"grade\" style=\"align-content:start\">\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">D<\/span> Planta da rede\n            ${res.ok ? (res.atende ? '<span class=\"selo ok\">rede aprovada<\/span>'\n        : '<span class=\"selo erro\">rede reprovada<\/span>') : '<span class=\"selo aviso\">incompleta<\/span>'}\n            ${res.malhas ? `<span class=\"selo info\">${res.malhas} malha(s) — Hardy Cross em ${res.iteracoes} iterações<\/span>` : ''}<\/h2>\n          <div class=\"corpo\">\n            <div class=\"linha-btn\" style=\"margin-bottom:10px\">${barra}<\/div>\n            <div id=\"area-svg\">${CANVAS.desenhar()}<\/div>\n            <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;align-items:center\">\n              <label class=\"campo\" style=\"flex:0 0 auto\">\n                <span class=\"rotulo\">Rótulo nos trechos<\/span>\n                <select id=\"d-rotulo\" style=\"width:auto\">\n                  ${[['pressao', 'Perda de carga'], ['diametro', 'Diâmetro'], ['vazao', 'Vazão'],\n          ['velocidade', 'Velocidade'], ['nome', 'Só nomes'], ['nenhum', 'Nenhum']]\n        .map(([k, r]) => `<option value=\"${k}\"${estado.desenho_ui.rotular === k ? ' selected' : ''}>${r}<\/option>`).join('')}\n                <\/select><\/label>\n              <label style=\"display:flex;gap:6px;align-items:center;font-size:12.5px;margin-top:14px\">\n                <input type=\"checkbox\" id=\"d-grade\" style=\"width:auto\" ${estado.desenho_ui.grade ? 'checked' : ''}> Grade<\/label>\n              <div class=\"chips\" style=\"margin-top:14px;font-size:11px;color:var(--aco-med)\">\n                <span><i style=\"display:inline-block;width:14px;height:4px;background:var(--ar);vertical-align:middle\"><\/i> velocidade folgada<\/span>\n                <span><i style=\"display:inline-block;width:14px;height:4px;background:var(--nr26);vertical-align:middle\"><\/i> perto do limite<\/span>\n                <span><i style=\"display:inline-block;width:14px;height:4px;background:var(--alerta);vertical-align:middle\"><\/i> acima do limite<\/span>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        ${estado.desenho_ui.ultimo_auto ? avisoAuto(estado) : ''}\n        ${res.ok ? painelResultados(res, rede, estado) : `<div class=\"cartao\"><div class=\"corpo\">\n          ${res.erros.map(e => `<div class=\"nota erro\" style=\"margin-bottom:8px\"><strong>Falta corrigir<\/strong>${esc(e)}<\/div>`).join('')}\n        <\/div><\/div>`}\n\n        ${res.ok ? painelMateriais(rede, res) : ''}\n      <\/div>\n\n      <div class=\"grade\" style=\"align-content:start\">\n        ${painelMontagem(estado)}\n        ${painelPropriedades(rede, res, estado)}\n        ${painelParametros(rede)}\n      <\/div>\n    <\/div>`;\n\n    ligarDesenho(ctx, res);\n  }\n\n  function painelResultados(res, rede, estado) {\n    const criticos = res.criticos || [];\n    return `<div class=\"cartao\">\n      <h2><span class=\"tag-num\">E<\/span> Verificação hidráulica<\/h2>\n      <div class=\"corpo solto\">\n        <div class=\"kpi-linha\">\n          <div class=\"kpi\"><span class=\"k\">Demanda total<\/span><span class=\"v\">${num(res.demanda_total_m3min, 2)} <small>m³/min<\/small><\/span><\/div>\n          <div class=\"kpi\"><span class=\"k\">Tubulação<\/span><span class=\"v\">${num(res.comprimento_total_m, 0)} <small>m<\/small><\/span><\/div>\n          <div class=\"kpi\"><span class=\"k\">Compr. equivalente<\/span><span class=\"v\">${num(res.comprimento_eq_total_m, 0)} <small>m<\/small><\/span><\/div>\n          <div class=\"kpi ${res.perda_tubulacao_bar <= rede.perda_admissivel_bar ? 'bom' : 'ruim'}\">\n            <span class=\"k\">Perda na tubulação<\/span><span class=\"v\">${num(res.perda_tubulacao_bar, 3)} <small>bar<\/small><\/span><\/div>\n          <div class=\"kpi\"><span class=\"k\">Perda nos equipamentos<\/span><span class=\"v\">${num(res.perda_equipamentos_bar, 3)} <small>bar<\/small><\/span><\/div>\n          <div class=\"kpi ${criticos.length ? 'ruim' : 'bom'}\">\n            <span class=\"k\">Pressão no pior ponto<\/span><span class=\"v\">${num(res.pressao_minima_bar, 2)} <small>bar<\/small><\/span><\/div>\n          <div class=\"kpi ${res.velocidade_max_ms > rede.vel_max_ms ? 'ruim' : 'bom'}\">\n            <span class=\"k\">Velocidade máxima<\/span><span class=\"v\">${num(res.velocidade_max_ms, 1)} <small>m/s<\/small><\/span><\/div>\n        <\/div>\n\n        ${criticos.length ? diagnosticoHTML(rede, res)\n        : `<div class=\"nota ok\"><strong>Todos os pontos recebem a pressão exigida<\/strong>\n          O pior caso é ${esc(res.no_critico ? res.no_critico.nome : '—')}, com\n          ${num(res.no_critico ? res.no_critico.margem_bar : 0, 2)} bar de margem.\n          A perda na tubulação até ele é de ${num(res.perda_tubulacao_bar, 3)} bar,\n          contra ${num(rede.perda_admissivel_bar, 2)} bar admissíveis.<\/div>`}\n\n        ${(res.avisos || []).map(a => `<div class=\"nota aviso\"><strong>Atenção<\/strong>${esc(a)}<\/div>`).join('')}\n\n        <div class=\"rolagem\" style=\"max-height:300px\"><table class=\"dados\">\n          <thead><tr><th>Trecho<\/th><th>Diâmetro<\/th><th class=\"n\">Compr.<br><span style=\"font-weight:400;text-transform:none\">m<\/span><\/th>\n            <th class=\"n\">Equiv.<br><span style=\"font-weight:400;text-transform:none\">m<\/span><\/th>\n            <th class=\"n\">Vazão<br><span style=\"font-weight:400;text-transform:none\">m³/min<\/span><\/th>\n            <th class=\"n\">Veloc.<br><span style=\"font-weight:400;text-transform:none\">m/s<\/span><\/th>\n            <th class=\"n\">Δp<br><span style=\"font-weight:400;text-transform:none\">bar<\/span><\/th><th><\/th><\/tr><\/thead>\n          <tbody>${res.trechos.map(t => {\n          const a = res.nos.find(n => n.id === t.de), b = res.nos.find(n => n.id === t.para);\n          return `<tr>\n              <td style=\"font-size:11.5px\">${esc(a ? a.nome : t.de)} → ${esc(b ? b.nome : t.para)}<\/td>\n              <td>${esc(t.dn)}${t.manual ? ' <span class=\"selo info\">fixo<\/span>' : ''}<\/td>\n              <td class=\"n\">${num(t.comprimento_m, 1)}<\/td><td class=\"n\">${num(t.comprimento_eq_m, 1)}<\/td>\n              <td class=\"n\">${num(t.vazao_m3min, 3)}<\/td>\n              <td class=\"n\" style=\"${t.excede_velocidade ? 'color:var(--alerta);font-weight:600' : ''}\">${num(t.velocidade_ms, 2)}<\/td>\n              <td class=\"n\">${num(t.perda_bar, 4)}<\/td>\n              <td><button class=\"btn mini sec\" data-sel-trecho=\"${t.id}\">ver<\/button><\/td>\n            <\/tr>`;\n        }).join('')}<\/tbody>\n        <\/table><\/div>\n      <\/div>\n    <\/div>`;\n  }\n\n  function diagnosticoHTML(rede, res) {\n    const d = REDE.diagnosticar(rede, res);\n    if (!d.ok) return '';\n    const bloco = (i, inviavel) => `<div class=\"nota ${inviavel ? 'erro' : 'aviso'}\">\n      <strong>${esc(i.no)} — faltam ${num(i.falta, 2)} bar<\/strong>\n      Chega ${num(i.chega, 2)} bar e o consumidor exige ${num(i.exigido, 2)} bar.\n      ${inviavel ? `Com a fonte em ${num(res.pressao_fonte_bar, 1)} bar e\n        ${num(i.perda_equipamentos, 2)} bar consumidos por ${esc(i.equipamentos.join(', ') || 'equipamentos no caminho')},\n        o teto alcançável neste ponto é ${num(i.teto_alcancavel, 2)} bar. ` : ''}\n      ${esc(i.causa)} <b>${esc(i.acao)}<\/b><\/div>`;\n    return (d.inviaveis.map(i => bloco(i, true)).join('')\n      + d.corrigiveis.map(i => bloco(i, false)).join(''));\n  }\n\n  function painelMateriais(rede, res) {\n    const bom = REDE.listaMateriais(rede, res);\n    if (!bom.ok) return '';\n    return `<div class=\"cartao\">\n      <h2><span class=\"tag-num\">F<\/span> Lista de materiais\n        <span class=\"selo info\">${esc(bom.material)}<\/span><\/h2>\n      <div class=\"corpo solto\">\n        <table class=\"dados\">\n          <thead><tr><th>Tubulação<\/th><th class=\"n\">Trechos<\/th><th class=\"n\">Traçado (m)<\/th>\n            <th class=\"n\">Com 5 % de corte<\/th><th class=\"n\">Custo estimado<\/th><\/tr><\/thead>\n          <tbody>${bom.tubos.map(t => `<tr>\n            <td>${esc(t.dn)}<\/td><td class=\"n\">${t.trechos}<\/td><td class=\"n\">${num(t.comprimento_m, 1)}<\/td>\n            <td class=\"n\">${num(t.comprimento_compra_m, 1)}<\/td><td class=\"n\">${moeda(t.custo_total)}<\/td><\/tr>`).join('')}\n            <tr style=\"font-weight:650;background:var(--papel-2)\"><td>Total<\/td><td class=\"n\"><\/td>\n              <td class=\"n\">${num(bom.comprimento_total_m, 1)}<\/td><td class=\"n\"><\/td>\n              <td class=\"n\">${moeda(bom.custo_tubos)}<\/td><\/tr>\n          <\/tbody>\n        <\/table>\n\n        ${bom.acessorios.length ? `<table class=\"dados\">\n          <thead><tr><th>Conexões e acessórios<\/th><th>Diâmetro<\/th><th class=\"n\">Quantidade<\/th><\/tr><\/thead>\n          <tbody>${bom.acessorios.map(a => `<tr><td>${esc(a.nome)}<\/td><td>${esc(a.dn)}<\/td>\n            <td class=\"n\">${a.qtd}<\/td><\/tr>`).join('')}<\/tbody><\/table>` : ''}\n\n        <table class=\"dados\">\n          <thead><tr><th>Equipamentos<\/th><th class=\"n\">Quantidade<\/th><\/tr><\/thead>\n          <tbody>${bom.equipamentos.map(e => `<tr><td>${esc(e.nome)}<\/td><td class=\"n\">${e.qtd}<\/td><\/tr>`).join('')}<\/tbody>\n        <\/table>\n\n        ${bom.sugestoes.map(s => `<div class=\"nota aviso\"><strong>Revisar o projeto<\/strong>${esc(s)}<\/div>`).join('')}\n\n        <p class=\"dica\">O custo é uma estimativa de ordem de grandeza a partir do preço por metro do material\n        escolhido, escalonado com o diâmetro. Não inclui mão de obra, suportes, pintura de identificação\n        nem ensaio de estanqueidade.<\/p>\n\n        <div class=\"linha-btn\">\n          <button class=\"btn sec\" id=\"d-csv\">Exportar lista (.csv)<\/button>\n          <button class=\"btn sec\" id=\"d-svg\">Exportar diagrama (.svg)<\/button>\n          <button class=\"btn sec\" id=\"d-json\">Exportar rede (.json)<\/button>\n        <\/div>\n      <\/div>\n    <\/div>`;\n  }\n\n  function avisoAuto(estado) {\n    const a = estado.desenho_ui.ultimo_auto;\n    if (!a) return '';\n    const inv = a.inviaveis.length\n      ? `<div class=\"nota erro\"><strong>${a.inviaveis.length} ponto(s) fora do alcance do dimensionamento<\/strong>\n         ${a.inviaveis.map(esc).join(', ')} exigem pressão que a fonte não consegue entregar depois das perdas\n         nos equipamentos de tratamento. Aumentar o diâmetro não resolve; veja a verificação abaixo.<\/div>` : '';\n    return `<div class=\"cartao\"><div class=\"corpo\">\n      <div class=\"nota ${a.convergiu ? 'ok' : 'aviso'}\"><strong>Dimensionamento concluído<\/strong>\n        ${a.ajustes} trecho(s) engrossado(s) para atender à pressão nos pontos críticos.\n        ${a.convergiu ? '' : ' O processo atingiu o limite de passos: revise a concepção da rede.'}<\/div>\n      ${inv}<\/div><\/div>`;\n  }\n\n  function painelMontagem(estado) {\n    return `<div class=\"cartao\">\n      <h2>Montar a rede<\/h2>\n      <div class=\"corpo solto\">\n        <div>\n          <span class=\"rotulo\">Gerar a partir dos consumidores do projeto<\/span>\n          <div class=\"linha-btn\">\n            <button class=\"btn sec mini\" data-modelo=\"anel\">Anel fechado<\/button>\n            <button class=\"btn sec mini\" data-modelo=\"espinha\">Espinha de peixe<\/button>\n            <button class=\"btn sec mini\" data-modelo=\"ramificada\">Ramificada<\/button>\n          <\/div>\n          <p class=\"dica\">O anel é o traçado recomendado: alimenta cada ponto pelos dois lados,\n          o que reduz o comprimento efetivo pela metade e equaliza a pressão.<\/p>\n        <\/div>\n        <div class=\"linha-btn\">\n          <button class=\"btn\" id=\"d-auto\">Dimensionar automaticamente<\/button>\n          <button class=\"btn sec\" id=\"d-limpar\">Limpar<\/button>\n        <\/div>\n        <p class=\"dica\">O dimensionamento automático escolhe o menor diâmetro que respeita a\n        velocidade máxima e, em seguida, engrossa os trechos do caminho crítico até que todos os\n        pontos recebam a pressão mínima. Trechos marcados como fixos são preservados.<\/p>\n      <\/div>\n    <\/div>`;\n  }\n\n  function painelPropriedades(rede, res, estado) {\n    const idN = CANVAS.ui.selNo, idT = CANVAS.ui.selTrecho;\n\n    if (idN) {\n      const n = REDE.no(rede, idN);\n      if (!n) return '';\n      const i = (res.nos || []).find(x => x.id === idN) || {};\n      const eq = REDE.EQUIPAMENTOS[n.tipo] || {};\n      const tipos = Object.keys(REDE.EQUIPAMENTOS).map(k =>\n        `<option value=\"${k}\"${n.tipo === k ? ' selected' : ''}>${esc(REDE.EQUIPAMENTOS[k].nome)}<\/option>`).join('');\n      return `<div class=\"cartao\">\n        <h2>Equipamento selecionado<\/h2>\n        <div class=\"corpo solto\">\n          <label class=\"campo\"><span class=\"rotulo\">Nome<\/span>\n            <input type=\"text\" id=\"n-nome\" value=\"${esc(n.nome)}\" style=\"font-family:var(--sans)\"><\/label>\n          <label class=\"campo\"><span class=\"rotulo\">Tipo<\/span>\n            <select id=\"n-tipo\">${tipos}<\/select><\/label>\n          ${eq.consumidor ? `<div class=\"grade g2\">\n            <label class=\"campo\"><span class=\"rotulo\">Demanda <span class=\"un\">(m³/min)<\/span><\/span>\n              <input type=\"number\" id=\"n-dem\" step=\"0.01\" min=\"0\" value=\"${n.demanda_m3min}\"><\/label>\n            <label class=\"campo\"><span class=\"rotulo\">Pressão mínima <span class=\"un\">(bar)<\/span><\/span>\n              <input type=\"number\" id=\"n-pmin\" step=\"0.1\" min=\"0\" value=\"${n.pressao_min_bar}\"><\/label>\n          <\/div>` : ''}\n          ${eq.dp ? `<div class=\"nota\"><strong>Perda no equipamento<\/strong>\n            ${num(eq.dp, 2)} bar com elemento limpo. Filtro saturado chega a triplicar esse valor —\n            por isso a recomendação de manômetro diferencial.<\/div>` : ''}\n          <div class=\"kpi-linha\">\n            <div class=\"kpi ${i.critico ? 'ruim' : 'bom'}\"><span class=\"k\">Pressão no nó<\/span>\n              <span class=\"v\">${num(i.pressao_bar, 2)} <small>bar<\/small><\/span><\/div>\n            ${eq.consumidor ? `<div class=\"kpi ${i.margem_bar < 0 ? 'ruim' : 'bom'}\">\n              <span class=\"k\">Margem<\/span><span class=\"v\">${num(i.margem_bar, 2)} <small>bar<\/small><\/span><\/div>` : ''}\n          <\/div>\n          <div class=\"linha-btn\"><button class=\"btn mini perigo\" id=\"n-apagar\">Remover equipamento<\/button><\/div>\n        <\/div>\n      <\/div>`;\n    }\n\n    if (idT) {\n      const t = rede.trechos.find(x => x.id === idT);\n      if (!t) return '';\n      const i = (res.trechos || []).find(x => x.id === idT) || {};\n      const a = REDE.no(rede, t.de), b = REDE.no(rede, t.para);\n      const opcoes = ENG.DN_ACO.map(o =>\n        `<option value=\"${o.di}\"${Math.abs((t.dn || i.di_mm) - o.di) < 0.05 ? ' selected' : ''}>${esc(o.dn)} — ${num(o.di, 1)} mm<\/option>`).join('');\n      const acess = Object.keys(REDE.ACESSORIOS).map(k => `<tr>\n        <td style=\"font-size:11.5px\">${esc(REDE.ACESSORIOS[k].nome)}<\/td>\n        <td class=\"n\" style=\"font-size:11px;color:var(--aco-med)\">${REDE.ACESSORIOS[k].leD}<\/td>\n        <td class=\"n\"><input type=\"number\" min=\"0\" step=\"1\" style=\"width:62px\"\n          data-acess=\"${k}\" value=\"${Math.round(t.acessorios[k] || 0)}\"><\/td><\/tr>`).join('');\n      return `<div class=\"cartao\">\n        <h2>Trecho selecionado<\/h2>\n        <div class=\"corpo solto\">\n          <div style=\"font-weight:600\">${esc(a ? a.nome : '')} → ${esc(b ? b.nome : '')}<\/div>\n          <label class=\"campo\"><span class=\"rotulo\">Diâmetro<\/span>\n            <select id=\"t-dn\">${opcoes}<\/select><\/label>\n          <label style=\"display:flex;gap:8px;align-items:center;font-size:12.5px\">\n            <input type=\"checkbox\" id=\"t-manual\" style=\"width:auto\" ${t.manual ? 'checked' : ''}>\n            Fixar diâmetro (não alterar no dimensionamento automático)<\/label>\n          <div class=\"kpi-linha\">\n            <div class=\"kpi\"><span class=\"k\">Vazão<\/span><span class=\"v\">${num(i.vazao_m3min, 3)} <small>m³/min<\/small><\/span><\/div>\n            <div class=\"kpi ${i.excede_velocidade ? 'ruim' : 'bom'}\"><span class=\"k\">Velocidade<\/span>\n              <span class=\"v\">${num(i.velocidade_ms, 2)} <small>m/s<\/small><\/span><\/div>\n            <div class=\"kpi\"><span class=\"k\">Perda de carga<\/span><span class=\"v\">${num(i.perda_bar, 4)} <small>bar<\/small><\/span><\/div>\n            <div class=\"kpi\"><span class=\"k\">Reynolds<\/span><span class=\"v\">${num(i.reynolds / 1000, 0)}<small>k<\/small><\/span><\/div>\n            <div class=\"kpi\"><span class=\"k\">Traçado<\/span><span class=\"v\">${num(i.comprimento_m, 1)} <small>m<\/small><\/span><\/div>\n            <div class=\"kpi\"><span class=\"k\">Equivalente<\/span><span class=\"v\">${num(i.comprimento_eq_m, 1)} <small>m<\/small><\/span><\/div>\n          <\/div>\n          <details class=\"norma\"><summary>Acessórios do trecho (comprimento equivalente)<\/summary>\n            <div><table class=\"dados\">\n              <thead><tr><th>Acessório<\/th><th class=\"n\">Le/D<\/th><th class=\"n\">Qtd.<\/th><\/tr><\/thead>\n              <tbody>${acess}<\/tbody><\/table>\n              <p class=\"dica\">Sugeridos automaticamente pela geometria dos nós. Editar qualquer campo\n              passa o trecho para controle manual.<\/p><\/div>\n          <\/details>\n          <div class=\"linha-btn\"><button class=\"btn mini perigo\" id=\"t-apagar\">Remover trecho<\/button><\/div>\n        <\/div>\n      <\/div>`;\n    }\n\n    return `<div class=\"cartao\"><h2>Propriedades<\/h2><div class=\"corpo\">\n      <p class=\"dica\" style=\"margin:0\">Clique num equipamento ou num trecho da planta para editar suas\n      propriedades. Com a ferramenta <b>Tubo<\/b>, clique em dois equipamentos para ligá-los.<\/p><\/div><\/div>`;\n  }\n\n  function painelParametros(rede) {\n    const mats = Object.keys(REDE.MATERIAIS).map(k =>\n      `<option value=\"${k}\"${rede.material === k ? ' selected' : ''}>${esc(REDE.MATERIAIS[k].nome)} — ε ${num(REDE.MATERIAIS[k].rugosidade, 3)} mm<\/option>`).join('');\n    return `<div class=\"cartao\">\n      <h2>Parâmetros da rede<\/h2>\n      <div class=\"corpo solto\">\n        <label class=\"campo\"><span class=\"rotulo\">Material da tubulação<\/span>\n          <select id=\"d-material\">${mats}<\/select><\/label>\n        <div class=\"grade g2\">\n          <label class=\"campo\"><span class=\"rotulo\">Pressão na fonte <span class=\"un\">(bar)<\/span><\/span>\n            <input type=\"number\" id=\"d-pfonte\" step=\"0.5\" value=\"${rede.pressao_fonte_bar}\"><\/label>\n          <label class=\"campo\"><span class=\"rotulo\">Escala <span class=\"un\">(m por pixel)<\/span><\/span>\n            <input type=\"number\" id=\"d-escala\" step=\"0.05\" min=\"0.01\" value=\"${rede.escala_m_px}\"><\/label>\n          <label class=\"campo\"><span class=\"rotulo\">Velocidade máxima <span class=\"un\">(m/s)<\/span><\/span>\n            <input type=\"number\" id=\"d-vmax\" step=\"0.5\" value=\"${rede.vel_max_ms}\"><\/label>\n          <label class=\"campo\"><span class=\"rotulo\">Perda admissível <span class=\"un\">(bar)<\/span><\/span>\n            <input type=\"number\" id=\"d-dpadm\" step=\"0.01\" value=\"${rede.perda_admissivel_bar}\"><\/label>\n          <label class=\"campo\"><span class=\"rotulo\">Altitude <span class=\"un\">(m)<\/span><\/span>\n            <input type=\"number\" id=\"d-alt\" step=\"10\" value=\"${rede.altitude_m}\"><\/label>\n          <label class=\"campo\"><span class=\"rotulo\">Temp. na linha <span class=\"un\">(°C)<\/span><\/span>\n            <input type=\"number\" id=\"d-temp\" step=\"1\" value=\"${rede.temp_linha_C}\"><\/label>\n        <\/div>\n        <p class=\"dica\">A escala converte a distância desenhada em comprimento real. Com 0,25 m por pixel,\n        a largura útil da planta corresponde a 250 m.<\/p>\n      <\/div>\n    <\/div>`;\n  }\n\n  /* ---------- Eventos do desenho ---------- */\n  function ligarDesenho(ctx, res) {\n    const { estado, salvar, render } = ctx;\n    const rede = estado.desenho;\n    const redesenhar = () => {\n      const area = $('#area-svg');\n      if (!area) return;\n      area.innerHTML = CANVAS.desenhar();\n      const svg = $('#svg-rede');\n      if (svg) CANVAS.ligarEventos(svg, redesenhar);\n      atualizarLateral(ctx);\n    };\n\n    const svg = $('#svg-rede');\n    if (svg) CANVAS.ligarEventos(svg, redesenhar);\n\n    $$('[data-ferr]').forEach(b => b.addEventListener('click', () => {\n      estado.desenho_ui.ferramenta = b.dataset.ferr;\n      CANVAS.ferramenta = b.dataset.ferr; salvar(); render();\n    }));\n\n    const rot = $('#d-rotulo');\n    if (rot) rot.addEventListener('change', () => {\n      estado.desenho_ui.rotular = rot.value; CANVAS.ui.rotular = rot.value; salvar(); redesenhar();\n    });\n    const gr = $('#d-grade');\n    if (gr) gr.addEventListener('change', () => {\n      estado.desenho_ui.grade = gr.checked; CANVAS.ui.mostrarGrade = gr.checked; salvar(); redesenhar();\n    });\n\n    $$('[data-modelo]').forEach(b => b.addEventListener('click', () => {\n      const cons = REDE.consumidoresDoProjeto(estado.projeto);\n      estado.desenho = REDE.modelo(b.dataset.modelo, cons, {\n        pressao_fonte_bar: estado.projeto.pressao_trabalho_bar,\n        altitude_m: estado.projeto.altitude_m, temp_linha_C: 30,\n      });\n      CANVAS.ui.selNo = null; CANVAS.ui.selTrecho = null;\n      REDE.autoDimensionar(estado.desenho);\n      salvar(); render();\n    }));\n\n    const auto = $('#d-auto');\n    if (auto) auto.addEventListener('click', () => {\n      const r = REDE.autoDimensionar(rede);\n      estado.desenho_ui.ultimo_auto = r.ok\n        ? { ajustes: r.ajustes.length, inviaveis: r.inviaveis.map(x => x.no), convergiu: r.convergiu }\n        : null;\n      salvar(); render();\n    });\n    const limpar = $('#d-limpar');\n    if (limpar) limpar.addEventListener('click', () => {\n      if (!confirm('Isso apaga a rede desenhada. Continuar?')) return;\n      estado.desenho = REDE.redeVazia();\n      CANVAS.ui.selNo = null; CANVAS.ui.selTrecho = null; salvar(); render();\n    });\n\n    $$('[data-sel-trecho]').forEach(b => b.addEventListener('click', () => {\n      CANVAS.ui.selTrecho = b.dataset.selTrecho; CANVAS.ui.selNo = null; render();\n    }));\n\n    // Propriedades do nó\n    const bindNo = (id, campo, tipo) => {\n      const e = $(id); if (!e) return;\n      e.addEventListener('change', () => {\n        const n = REDE.no(rede, CANVAS.ui.selNo); if (!n) return;\n        n[campo] = tipo === 'num' ? +e.value : e.value;\n        salvar(); render();\n      });\n    };\n    bindNo('#n-nome', 'nome'); bindNo('#n-tipo', 'tipo');\n    bindNo('#n-dem', 'demanda_m3min', 'num'); bindNo('#n-pmin', 'pressao_min_bar', 'num');\n    const na = $('#n-apagar');\n    if (na) na.addEventListener('click', () => {\n      REDE.removerNo(rede, CANVAS.ui.selNo); CANVAS.ui.selNo = null; salvar(); render();\n    });\n\n    // Propriedades do trecho\n    const dn = $('#t-dn');\n    if (dn) dn.addEventListener('change', () => {\n      const t = rede.trechos.find(x => x.id === CANVAS.ui.selTrecho); if (!t) return;\n      t.dn = +dn.value; t.manual = true; salvar(); render();\n    });\n    const tm = $('#t-manual');\n    if (tm) tm.addEventListener('change', () => {\n      const t = rede.trechos.find(x => x.id === CANVAS.ui.selTrecho); if (!t) return;\n      t.manual = tm.checked; salvar(); render();\n    });\n    $$('[data-acess]').forEach(i => i.addEventListener('change', () => {\n      const t = rede.trechos.find(x => x.id === CANVAS.ui.selTrecho); if (!t) return;\n      t.manual_acessorios = true;\n      t.acessorios[i.dataset.acess] = +i.value; salvar(); render();\n    }));\n    const ta = $('#t-apagar');\n    if (ta) ta.addEventListener('click', () => {\n      REDE.removerTrecho(rede, CANVAS.ui.selTrecho); CANVAS.ui.selTrecho = null; salvar(); render();\n    });\n\n    // Parâmetros\n    const bindR = (id, campo, tipo) => {\n      const e = $(id); if (!e) return;\n      e.addEventListener('change', () => { rede[campo] = tipo === 'num' ? +e.value : e.value; salvar(); render(); });\n    };\n    bindR('#d-material', 'material'); bindR('#d-pfonte', 'pressao_fonte_bar', 'num');\n    bindR('#d-escala', 'escala_m_px', 'num'); bindR('#d-vmax', 'vel_max_ms', 'num');\n    bindR('#d-dpadm', 'perda_admissivel_bar', 'num'); bindR('#d-alt', 'altitude_m', 'num');\n    bindR('#d-temp', 'temp_linha_C', 'num');\n\n    // Exportações\n    const csv = $('#d-csv');\n    if (csv) csv.addEventListener('click', () => ctx.baixar('lista-materiais-rede.csv', csvMateriais(rede, res)));\n    const jsn = $('#d-json');\n    if (jsn) jsn.addEventListener('click', () => ctx.baixar('rede-ar-comprimido.json', JSON.stringify(rede, null, 2)));\n    const svgb = $('#d-svg');\n    if (svgb) svgb.addEventListener('click', () => {\n      const s = $('#svg-rede');\n      if (!s) return;\n      ctx.baixar('diagrama-rede.svg', paraSVGAutonomo(s.outerHTML));\n    });\n  }\n\n  function atualizarLateral(ctx) {\n    // Redesenhar apenas o painel lateral evita perder o foco em campos de texto\n    const res = CANVAS.ui.resultado || {};\n    const alvo = $('#painel-desenho .g-2-1 > div:last-child');\n    if (!alvo) return;\n    alvo.innerHTML = painelMontagem(ctx.estado)\n      + painelPropriedades(ctx.estado.desenho, res, ctx.estado)\n      + painelParametros(ctx.estado.desenho);\n    ligarDesenho(ctx, res);\n  }\n\n  function csvMateriais(rede, res) {\n    const bom = REDE.listaMateriais(rede, res);\n    if (!bom.ok) return 'Rede incompleta';\n    const L = ['Categoria;Item;Diametro;Quantidade;Unidade;Custo estimado (R$)'];\n    bom.tubos.forEach(t => L.push(['Tubulação', REDE.MATERIAIS[rede.material].nome, t.dn,\n      t.comprimento_compra_m.toFixed(1).replace('.', ','), 'm', t.custo_total.toFixed(2).replace('.', ',')].join(';')));\n    bom.acessorios.forEach(a => L.push(['Acessório', a.nome, a.dn, a.qtd, 'un', ''].join(';')));\n    bom.equipamentos.forEach(e => L.push(['Equipamento', e.nome, '', e.qtd, 'un', ''].join(';')));\n    L.push(['', 'TOTAL ESTIMADO', '', '', '', bom.custo_total.toFixed(2).replace('.', ',')].join(';'));\n    return '\\ufeff' + L.join('\\n');\n  }\n\n  // As variáveis CSS não existem fora da página; troca pelos valores do tema claro\n  const CORES_FIXAS = {\n    '--ar': '#0B57A4', '--ar-esc': '#06356A', '--ar-claro': '#E3EDF8',\n    '--aco': '#1F272F', '--aco-med': '#5C6B7A', '--aco-fraco': '#93A1AE',\n    '--papel': '#FFFFFF', '--papel-2': '#F5F8FA', '--borda': '#CBD6E0',\n    '--nr26': '#E8A200', '--ok': '#12735A', '--alerta': '#B33A2B',\n  };\n  function paraSVGAutonomo(svg) {\n    let s = svg;\n    Object.keys(CORES_FIXAS).forEach(k => {\n      s = s.split('var(' + k + ')').join(CORES_FIXAS[k]);\n    });\n    if (s.indexOf('xmlns') === -1) s = s.replace('<svg', '<svg xmlns=\"http://www.w3.org/2000/svg\"');\n    return '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\\n' + s;\n  }\n\n  window.PAINEIS = { renderAutoSelecao, renderDesenho, PERFIS, FERRAMENTAS, csvMateriais, paraSVGAutonomo };\n})();\n\n<\/script>\n<script>\n/* ==================================================================\n   CompressorSelect Pro — aplicação\n   ================================================================== */\n(function () {\n  'use strict';\n\n  const CHAVE = 'compressorselect.v1';\n  const $ = (s, r) => (r || document).querySelector(s);\n  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));\n\n  /* ---------- Formatação brasileira ---------- */\n  function num(v, d) {\n    if (v === null || v === undefined || !isFinite(v)) return '—';\n    return Numb
