er(v).toLocaleString('pt-BR', {\n      minimumFractionDigits: d === undefined ? 2 : d,\n      maximumFractionDigits: d === undefined ? 2 : d,\n    });\n  }\n  function moeda(v) {\n    if (!isFinite(v)) return '—';\n    return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });\n  }\n  function esc(s) {\n    return String(s === undefined || s === null ? '' : s)\n      .replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n  }\n  /* Quebra texto corrido em linhas de largura fixa para o memorial .txt,\n     indentando a partir da segunda linha. */\n  function quebrar(texto, largura, recuo) {\n    const pal = String(texto).split(/\\s+/);\n    const linhas = []; let atual = '';\n    pal.forEach(p => {\n      if (!atual) { atual = p; }\n      else if ((atual + ' ' + p).length <= largura) { atual += ' ' + p; }\n      else { linhas.push(atual); atual = p; }\n    });\n    if (atual) linhas.push(atual);\n    return linhas.join('\\n' + (recuo || ''));\n  }\n  /* Nome de arquivo rastreável: tipo, projeto, data e soma de verificação.\n     Ex.: memorial_oficina-central_2026-08-02_3F2A9C11.txt */\n  function nomeArquivo(tipo, ext) {\n    const bruto = (estado.projeto && estado.projeto.nome) || 'projeto';\n    const slug = bruto.toLowerCase()\n      .normalize('NFD').replace(/[̀-ͯ]/g, '')\n      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'projeto';\n    const d = new Date().toISOString().slice(0, 10);\n    return [tipo, slug, d, APP.somaProjeto(estado)].join('_') + '.' + ext;\n  }\n\n  /* ---------- Estado ---------- */\n  const padrao = () => JSON.parse(JSON.stringify(PROJETOS[0]));\n\n  let estado = {\n    projeto: padrao(),\n    modelo_id: null,\n    aba: 'projeto',\n    tema: 'claro',\n    rede: { diametro_mm: null, comprimento_equivalente_m: null, rugosidade_mm: 0.15, perda_admissivel_bar: 0.10, vel_max_ms: 9 },\n    reserv: { delta_pressao_bar: 1.0, partidas_hora: null },\n    energia: { tarifa_kwh: null, sobrepreco_vsd: 0.28, vazamentos: [{ d: 3, n: 2 }, { d: 1, n: 6 }] },\n    filtros: { texto: '', tipo: '', marca: '', pmin: '', pmax: '', fonte: '' },\n    auto: { pesos: AUTOSEL.pesosPadrao(), anos: 10, margem_max: 0.6, ruido_max: null },\n    desenho: REDE.redeVazia(),\n    desenho_ui: { ferramenta: 'mover', rotular: 'pressao', grade: true },\n    perfil: PERFIL.novo('dois_turnos'),\n    conformidade: {\n      marcas: {}, observacoes: {},\n      responsavel: '', registro: '', local: '', data: '',\n    },\n    biblioteca_ui: { texto: '', categoria: '', porte: '', nome_salvar: '', aberto_id: null },\n  };\n\n  function conformidadePadrao() {\n    return { marcas: {}, observacoes: {}, responsavel: '', registro: '', local: '', data: '' };\n  }\n\n  function salvar() {\n    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { /* modo privado */ }\n  }\n  function carregar() {\n    try {\n      const b = localStorage.getItem(CHAVE);\n      if (b) {\n        const s = JSON.parse(b);\n        estado = Object.assign(estado, s);\n        if (!estado.projeto || !estado.projeto.consumidores) estado.projeto = padrao();\n        if (!estado.auto || !estado.auto.pesos) estado.auto = { pesos: AUTOSEL.pesosPadrao(), anos: 10, margem_max: 0.6, ruido_max: null };\n        if (!estado.desenho || !Array.isArray(estado.desenho.nos)) estado.desenho = REDE.redeVazia();\n        if (!estado.desenho_ui) estado.desenho_ui = { ferramenta: 'mover', rotular: 'pressao', grade: true };\n        // Estados gravados por versões anteriores não trazem estes campos\n        estado.perfil = PERFIL.normalizarPerfil(estado.perfil);\n        if (!estado.conformidade || typeof estado.conformidade !== 'object') estado.conformidade = conformidadePadrao();\n        if (!estado.conformidade.marcas) estado.conformidade.marcas = {};\n        if (!estado.conformidade.observacoes) estado.conformidade.observacoes = {};\n        if (!estado.biblioteca_ui) estado.biblioteca_ui = { texto: '', categoria: '', porte: '', nome_salvar: '', aberto_id: null };\n        REDE.sincronizarSequencia(estado.desenho);\n      }\n    } catch (e) { /* dado corrompido: mantém padrão */ }\n  }\n\n  /* ---------- Cálculo consolidado ---------- */\n  function calcular() {\n    const p = estado.projeto;\n    const dem = ENG.demandaProjeto(p);\n    const pTrab = +p.pressao_trabalho_bar;\n\n    const sel = ENG.selecionar(CATALOGO, {\n      vazao_m3min: dem.q_projeto_m3min,\n      pressao_bar: pTrab,\n      regime: p.regime,\n      isento: !!p.isento,\n      demanda_variavel: !!p.demanda_variavel,\n      acionamento: p.acionamento || null,\n      margem_max: 0.60,\n    });\n\n    let modelo = null;\n    if (estado.modelo_id) modelo = sel.aptos.concat(sel.reprovados).find(m => m.id === estado.modelo_id) || null;\n    if (!modelo) modelo = sel.aptos[0] || null;\n\n    const tipoRef = modelo ? modelo.tipo : (p.regime === 'intermitente' ? 'pistao_2e' : 'parafuso');\n    const estRef = modelo ? modelo.estagios : (tipoRef === 'pistao_2e' ? 2 : 1);\n\n    const pot = ENG.potenciaAcionamento({\n      vazao_m3min: dem.q_projeto_m3min, pressao_descarga_bar: pTrab,\n      altitude_m: p.altitude_m, tipo: tipoRef, estagios: estRef,\n    });\n\n    const kwRef = modelo ? modelo.potencia_kw : pot.potencia_comercial_kw;\n    const partidas = estado.reserv.partidas_hora || ENG.partidasMaximas(kwRef);\n    const res = ENG.volumeReservatorio({\n      vazao_m3min: modelo ? modelo.vazao_fad_m3min : dem.q_projeto_m3min,\n      delta_pressao_bar: estado.reserv.delta_pressao_bar,\n      partidas_hora: partidas, altitude_m: p.altitude_m,\n      vsd: modelo ? modelo.vsd : false,\n    });\n\n    const Lc = estado.rede.comprimento_equivalente_m || (+p.comprimento_rede_m * 1.4);\n    const dim = ENG.dimensionarDiametro({\n      vazao_m3min: dem.q_projeto_m3min, pressao_linha_bar: pTrab,\n      altitude_m: p.altitude_m, comprimento_equivalente_m: Lc,\n      temp_linha_C: 30, rugosidade_mm: estado.rede.rugosidade_mm,\n      perda_admissivel_bar: estado.rede.perda_admissivel_bar,\n      vel_max_ms: estado.rede.vel_max_ms,\n    });\n    const dEsc = estado.rede.diametro_mm || dim.escolhido.di;\n    const perda = ENG.perdaCarga({\n      vazao_m3min: dem.q_projeto_m3min, pressao_linha_bar: pTrab,\n      altitude_m: p.altitude_m, comprimento_equivalente_m: Lc,\n      diametro_mm: dEsc, temp_linha_C: 30, rugosidade_mm: estado.rede.rugosidade_mm,\n      vel_max_ms: estado.rede.vel_max_ms,\n    });\n\n    const volTanque = modelo && modelo.reservatorio_l ? modelo.reservatorio_l : res.volume_comercial_l;\n    const nr13 = ENG.categoriaNR13(modelo ? modelo.pressao_max_bar : pTrab + 1, volTanque);\n    const qual = ENG.qualidadeAr(p.qualidade);\n\n    const tarifa = estado.energia.tarifa_kwh !== null ? estado.energia.tarifa_kwh : p.tarifa_kwh;\n    const potElet = modelo ? modelo.potencia_kw / ENG.rendimentoMotor(modelo.potencia_kw) : pot.potencia_eletrica_kw;\n\n    // Perfil horário de demanda: quando ativo, substitui a hipótese de\n    // carga média constante na integração da energia anual.\n    const perf = PERFIL.analisar({\n      perfil: estado.perfil,\n      q_projeto_m3min: dem.q_projeto_m3min,\n      q_maquina_m3min: modelo ? modelo.vazao_fad_m3min : dem.q_projeto_m3min,\n      potencia_eletrica_kw: potElet, tarifa_kwh: tarifa,\n      vsd: modelo ? modelo.vsd : false,\n    });\n    const usaPerfil = !!(estado.perfil && estado.perfil.ativo && perf.ok);\n    const horasEf = usaPerfil ? perf.horas_ano : +p.horas_ano;\n    const fcEf = usaPerfil ? perf.fator_carga_efetivo : +p.fator_carga;\n    const fAlivio = estado.perfil ? estado.perfil.fator_alivio : 0.30;\n\n    const ener = ENG.consumoEnergia({\n      potencia_eletrica_kw: potElet, horas_ano: horasEf, fator_carga: fcEf,\n      tarifa_kwh: tarifa, vsd: modelo ? modelo.vsd : false, vazao_m3min: dem.q_projeto_m3min,\n      fator_alivio: fAlivio,\n    });\n    const cmpVSD = ENG.comparativoVSD({\n      potencia_eletrica_kw: potElet, horas_ano: horasEf, fator_carga: fcEf,\n      tarifa_kwh: tarifa, vazao_m3min: dem.q_projeto_m3min, fator_alivio: fAlivio,\n      sobrepreco_vsd_brl: (modelo ? modelo.preco_ref_brl : 0) * estado.energia.sobrepreco_vsd,\n    });\n\n    let qVaz = 0;\n    estado.energia.vazamentos.forEach(v => {\n      qVaz += ENG.vazamentoOrificio(+v.d, pTrab, p.altitude_m).vazao_m3min * (+v.n || 0);\n    });\n    const custoVaz = potElet && dem.q_projeto_m3min\n      ? (qVaz / dem.q_projeto_m3min) * potElet * horasEf * tarifa : 0;\n\n    return { dem, sel, modelo, pot, res, partidas, dim, perda, dEsc, Lc, nr13, qual, ener, cmpVSD,\n      qVaz, custoVaz, tarifa, potElet, volTanque, pTrab, perf, usaPerfil, horasEf, fcEf };\n  }\n\n  /* ---------- Rede desenhada, quando existir ---------- */\n  function redeCalculada() {\n    try {\n      if (!estado.desenho || !estado.desenho.nos || !estado.desenho.nos.length) return null;\n      const r = REDE.calcular(estado.desenho);\n      return r && r.ok ? r : null;\n    } catch (e) { return null; }\n  }\n\n  /* ---------- Verificação de conformidade ---------- */\n  function avaliarConformidade(c) {\n    const cc = c || calcular();\n    return CONFORM.avaliar({\n      c: cc, estado, rede: redeCalculada(),\n      marcas: estado.conformidade.marcas,\n      observacoes: estado.conformidade.observacoes,\n      perfil: { ativo: !!estado.perfil.ativo, tipo: estado.perfil.tipo, analise: cc.perf },\n    });\n  }\n\n  /* ---------- Foco preservado entre redesenhos ----------\n     Os painéis são redesenhados inteiros a cada alteração. Sem isto,\n     digitar em um campo de filtro perde o cursor a cada tecla. */\n  function comFoco(fn) {\n    const a = document.activeElement;\n    const id = a && a.id ? a.id : null;\n    let ini = null, fim = null;\n    try { ini = a.selectionStart; fim = a.selectionEnd; } catch (e) { /* campo sem seleção */ }\n    fn();\n    if (!id) return;\n    const n = document.getElementById(id);\n    if (!n) return;\n    try {\n      n.focus();\n      if (ini !== null && ini !== undefined && n.setSelectionRange) n.setSelectionRange(ini, fim);\n    } catch (e) { /* tipo de campo não aceita seleção */ }\n  }\n\n  function dataBR(iso) {\n    if (!iso) return '—';\n    const d = new Date(iso);\n    if (isNaN(d.getTime())) return '—';\n    return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric',\n      hour: '2-digit', minute: '2-digit' });\n  }\n\n  /* =================================================================\n     BIBLIOTECA DE PROJETOS\n     ================================================================= */\n  function resumoAtual() {\n    const c = calcular();\n    return {\n      vazao_m3min: c.dem.q_projeto_m3min,\n      pressao_bar: c.pTrab,\n      pontos: c.dem.n_pontos,\n      modelo: c.modelo ? (c.modelo.marca + ' ' + c.modelo.modelo) : null,\n      potencia_kw: c.modelo ? c.modelo.potencia_kw : c.pot.potencia_comercial_kw,\n      custo_energia_ano: c.ener.custo_ano_brl,\n      horas_ano: c.horasEf,\n      perfil: estado.perfil.ativo ? estado.perfil.tipo : null,\n    };\n  }\n\n  function chipsResumo(r) {\n    if (!r || r.vazao_m3min === undefined) return '';\n    const p = [];\n    p.push('<span>' + num(r.vazao_m3min, 2) + ' m³/min<\/span>');\n    if (r.pressao_bar) p.push('<span>' + num(r.pressao_bar, 1) + ' bar<\/span>');\n    if (r.potencia_kw) p.push('<span>' + num(r.potencia_kw, 1) + ' kW<\/span>');\n    if (r.custo_energia_ano) p.push('<span>' + moeda(r.custo_energia_ano) + '/ano<\/span>');\n    return '<div class=\"resumo\">' + p.join('') + '<\/div>';\n  }\n\n  function blocoBiblioteca() {\n    const ui = estado.biblioteca_ui;\n    const salvos = PROJ.listar();\n    const modelos = PROJ.filtrarModelos(PROJETOS, ui);\n\n    const cartoesSalvos = salvos.map(s => `\n      <div class=\"proj-card${s.id === ui.aberto_id ? ' atual' : ''}\">\n        <div class=\"titulo\">${esc(s.nome)}<\/div>\n        <div class=\"meta\">Atualizado em ${esc(dataBR(s.atualizado_em))}${\n          s.resumo && s.resumo.modelo ? ' · ' + esc(s.resumo.modelo) : ''}<\/div>\n        ${chipsResumo(s.resumo)}\n        <div class=\"acoes\">\n          <button class=\"btn mini\" data-bib-abrir=\"${esc(s.id)}\">Abrir<\/button>\n          <button class=\"btn sec mini\" data-bib-dup=\"${esc(s.id)}\">Duplicar<\/button>\n          <button class=\"btn sec mini\" data-bib-exp=\"${esc(s.id)}\">Exportar<\/button>\n          <button class=\"btn mini perigo\" data-bib-del=\"${esc(s.id)}\">Excluir<\/button>\n        <\/div>\n      <\/div>`).join('');\n\n    const cartoesModelo = modelos.map(m => {\n      const mt = PROJ.meta(m.id);\n      const nPontos = (m.consumidores || []).reduce((s, k) => s + (+k.qtd || 0), 0);\n      return `\n      <div class=\"proj-card${m.id === estado.projeto.id ? ' atual' : ''}\">\n        <div class=\"titulo\">${esc(m.nome)}<\/div>\n        <div class=\"meta\">${esc(mt.categoria)} · porte ${esc(mt.porte)} · ${esc(m.id)}<\/div>\n        <div class=\"resumo\">\n          <span>${nPontos} pontos<\/span><span>${num(m.pressao_trabalho_bar, 1)} bar<\/span>\n          <span>${num(m.horas_ano, 0)} h/ano<\/span><span>${num(m.altitude_m, 0)} m<\/span>\n        <\/div>\n        <div class=\"acoes\">\n          <button class=\"btn mini\" data-mod-carregar=\"${esc(m.id)}\">Carregar modelo<\/button>\n        <\/div>\n      <\/div>`;\n    }).join('');\n\n    const chipsCat = PROJ.CATEGORIAS.map(cat =>\n      `<button class=\"chip\" data-fcat=\"${esc(cat)}\" aria-pressed=\"${ui.categoria === cat}\">${esc(cat)}<\/button>`).join('');\n    const chipsPorte = PROJ.PORTES.map(pt =>\n      `<button class=\"chip\" data-fporte=\"${esc(pt)}\" aria-pressed=\"${ui.porte === pt}\">${esc(pt)}<\/button>`).join('');\n\n    return `\n      <details class=\"bloco\" id=\"det-biblioteca\"${ui.aberta ? ' open' : ''} style=\"margin-bottom:16px\">\n        <summary><span class=\"tag-num\">B<\/span> Biblioteca de projetos —\n          ${PROJETOS.length} modelos de partida · ${salvos.length} salvo${salvos.length === 1 ? '' : 's'} neste navegador<\/summary>\n        <div class=\"corpo solto\">\n\n          <div class=\"linha-btn\">\n            <input type=\"text\" id=\"bib-nome\" placeholder=\"Nome para gravar o projeto atual\"\n                   value=\"${esc(ui.nome_salvar || estado.projeto.nome || '')}\"\n                   style=\"flex:1;min-width:230px;font-family:var(--sans)\">\n            <button class=\"btn\" id=\"bib-salvar\">Salvar como novo<\/button>\n            ${ui.aberto_id ? '<button class=\"btn sec\" id=\"bib-atualizar\">Atualizar o aberto<\/button>' : ''}\n            <button class=\"btn sec\" id=\"bib-importar\">Importar .json<\/button>\n            <button class=\"btn sec\" id=\"bib-exportar\">Exportar biblioteca<\/button>\n            <input type=\"file\" id=\"bib-arquivo\" accept=\".json,application/json\" class=\"oculto\">\n          <\/div>\n          <div id=\"bib-msg\" class=\"nota oculto\" style=\"margin-top:0\"><\/div>\n          <p class=\"dica\">Os projetos salvos ficam apenas neste navegador. Para levar o trabalho a outra\n          máquina, exporte a biblioteca em arquivo. A importação aceita tanto o pacote da biblioteca\n          quanto o <code>projeto-compressor.json<\/code> exportado na aba Conformidade.<\/p>\n\n          <div>\n            <span class=\"rotulo\">Projetos salvos<\/span>\n            ${salvos.length\n              ? `<div class=\"cartoes-proj\">${cartoesSalvos}<\/div>`\n              : '<div class=\"vazio\">Nenhum projeto salvo ainda. Configure o projeto e use “Salvar como novo”.<\/div>'}\n          <\/div>\n\n          <div>\n            <span class=\"rotulo\">Modelos de partida <span class=\"un\">(${modelos.length} de ${PROJETOS.length})<\/span><\/span>\n            <div class=\"grade g2\" style=\"gap:10px;margin-bottom:9px\">\n              <input type=\"text\" id=\"bib-busca\" placeholder=\"Buscar por tipologia, uso ou palavra-chave\"\n                     value=\"${esc(ui.texto || '')}\" style=\"font-family:var(--sans)\">\n              <div class=\"chips\" style=\"align-items:center\">\n                ${chipsCat}${chipsPorte}\n                ${(ui.categoria || ui.porte || ui.texto) ? '<button class=\"btn sec mini\" id=\"bib-limpar\">Limpar filtros<\/button>' : ''}\n              <\/div>\n            <\/div>\n            ${modelos.length\n              ? `<div class=\"cartoes-proj\">${cartoesModelo}<\/div>`\n              : '<div class=\"vazio\">Nenhum modelo de partida corresponde aos filtros.<\/div>'}\n          <\/div>\n        <\/div>\n      <\/details>`;\n  }\n\n  function msgBib(texto, classe) {\n    const m = $('#bib-msg');\n    if (!m) return;\n    m.className = 'nota ' + (classe || 'ok');\n    m.innerHTML = texto;\n  }\n\n  function ligarBiblioteca() {\n    const ui = estado.biblioteca_ui;\n\n    const det = $('#det-biblioteca');\n    if (det) det.addEventListener('toggle', () => { ui.aberta = det.open; salvar(); });\n\n    const nome = $('#bib-nome');\n    if (nome) nome.addEventListener('input', () => { ui.nome_salvar = nome.value; });\n\n    const bs = $('#bib-salvar');\n    if (bs) bs.addEventListener('click', () => {\n      const n = ($('#bib-nome') || {}).value || estado.projeto.nome;\n      const r = PROJ.salvar(estado, n, resumoAtual(), null);\n      if (!r.ok) { msgBib('<strong>Não foi possível salvar<\/strong>' + esc(r.erro), 'erro'); return; }\n      ui.aberto_id = r.id; ui.nome_salvar = ''; ui.aberta = true;\n      salvar(); render();\n      msgBib('<strong>Projeto salvo<\/strong>“' + esc(n) + '” gravado na biblioteca deste navegador.', 'ok');\n    });\n\n    const ba = $('#bib-atualizar');\n    if (ba) ba.addEventListener('click', () => {\n      const atual = PROJ.obter(ui.aberto_id);\n      if (!atual) { msgBib('<strong>Projeto não encontrado<\/strong>Ele pode ter sido excluído.', 'erro'); return; }\n      const n = ($('#bib-nome') || {}).value || atual.nome;\n      const r = PROJ.salvar(estado, n, resumoAtual(), ui.aberto_id);\n      if (!r.ok) { msgBib('<strong>Não foi possível atualizar<\/strong>' + esc(r.erro), 'erro'); return; }\n      salvar(); render();\n      msgBib('<strong>Projeto atualizado<\/strong>“' + esc(n) + '” regravado com os dados atuais.', 'ok');\n    });\n\n    const bi = $('#bib-importar');\n    const arq = $('#bib-arquivo');\n    if (bi && arq) {\n      bi.addEventListener('click', () => arq.click());\n      arq.addEventListener('change', () => {\n        const f = arq.files && arq.files[0];\n        if (!f) return;\n        const fr = new FileReader();\n        fr.onload = () => {\n          const r = PROJ.importar(String(fr.result || ''));\n          ui.aberta = true; salvar(); render();\n          if (!r.ok) { msgBib('<strong>Importação recusada<\/strong>' + esc(r.erro), 'erro'); return; }\n          msgBib('<strong>Importação concluída<\/strong>' + r.importados + ' projeto(s) adicionado(s)'\n            + (r.ignorados ? ', ' + r.ignorados + ' ignorado(s) por limite de espaço' : '') + '.', 'ok');\n        };\n        fr.onerror = () => msgBib('<strong>Falha na leitura<\/strong>Não foi possível ler o arquivo.', 'erro');\n        fr.readAsText(f);\n      });\n    }\n\n    const be = $('#bib-exportar');\n    if (be) be.addEventListener('click', () => {\n      const pacote = PROJ.exportarTudo();\n      if (!pacote.projetos.length) { msgBib('<strong>Biblioteca vazia<\/strong>Não há projeto salvo para exportar.', 'aviso'); return; }\n      baixar('biblioteca-compressorselect.json', JSON.stringify(pacote, null, 2));\n    });\n\n    const busca = $('#bib-busca');\n    if (busca) busca.addEventListener('input', () => {\n      ui.texto = busca.value; salvar(); comFoco(renderProjeto);\n    });\n    $$('[data-fcat]').forEach(b => b.addEventListener('click', () => {\n      ui.categoria = ui.categoria === b.dataset.fcat ? '' : b.dataset.fcat; salvar(); render();\n    }));\n    $$('[data-fporte]').forEach(b => b.addEventListener('click', () => {\n      ui.porte = ui.porte === b.dataset.fporte ? '' : b.dataset.fporte; salvar(); render();\n    }));\n    const bl = $('#bib-limpar');\n    if (bl) bl.addEventListener('click', () => {\n      ui.texto = ''; ui.categoria = ''; ui.porte = ''; salvar(); render();\n    });\n\n    $$('[data-bib-abrir]').forEach(b => b.addEventListener('click', () => {\n      const reg = PROJ.obter(b.dataset.bibAbrir);\n      if (!reg) return;\n      PROJ.aplicar(reg, estado);\n      estado.perfil = PERFIL.normalizarPerfil(estado.perfil);\n      if (!estado.conformidade) estado.conformidade = conformidadePadrao();\n      REDE.sincronizarSequencia(estado.desenho);\n      estado.biblioteca_ui.aberto_id = reg.id;\n      estado.biblioteca_ui.nome_salvar = reg.nome;\n      salvar(); render();\n      msgBib('<strong>Projeto aberto<\/strong>“' + esc(reg.nome) + '” carregado sobre a sessão atual.', 'ok');\n    }));\n    $$('[data-bib-dup]').forEach(b => b.addEventListener('click', () => {\n      const r = PROJ.duplicar(b.dataset.bibDup);\n      salvar(); render();\n      msgBib(r.ok ? '<strong>Cópia criada<\/strong>Duplicata gravada na biblioteca.'\n        : '<strong>Não foi possível duplicar<\/strong>' + esc(r.erro), r.ok ? 'ok' : 'erro');\n    }));\n    $$('[data-bib-exp]').forEach(b => b.addEventListener('click', () => {\n      const pac = PROJ.exportarUm(b.dataset.bibExp);\n      if (!pac) return;\n      const nm = (pac.projetos[0].nome || 'projeto').replace(/[^\\w\\-]+/g, '-').slice(0, 40).toLowerCase();\n      baixar('projeto-' + nm + '.json', JSON.stringify(pac, null, 2));\n    }));\n    $$('[data-bib-del]').forEach(b => b.addEventListener('click', () => {\n      const reg = PROJ.obter(b.dataset.bibDel);\n      if (!reg) return;\n      if (!confirm('Excluir definitivamente o projeto “' + reg.nome + '”? Esta ação não pode ser desfeita.')) return;\n      PROJ.excluir(reg.id);\n      if (estado.biblioteca_ui.aberto_id === reg.id) estado.biblioteca_ui.aberto_id = null;\n      salvar(); render();\n      msgBib('<strong>Projeto excluído<\/strong>“' + esc(reg.nome) + '” foi removido da biblioteca.', 'aviso');\n    }));\n\n    $$('[data-mod-carregar]').forEach(b => b.addEventListener('click', () => {\n      const m = PROJETOS.find(x => x.id === b.dataset.modCarregar);\n      if (!m) return;\n      estado.projeto = JSON.parse(JSON.stringify(m));\n      estado.modelo_id = null;\n      estado.rede.diametro_mm = null; estado.rede.comprimento_equivalente_m = null;\n      estado.reserv.partidas_hora = null; estado.energia.tarifa_kwh = null;\n      estado.perfil = PERFIL.aplicarPreset(estado.perfil, PERFIL.sugerirPreset(m));\n      estado.biblioteca_ui.aberto_id = null;\n      estado.biblioteca_ui.nome_salvar = m.nome;\n      salvar(); render();\n      msgBib('<strong>Modelo carregado<\/strong>“' + esc(m.nome) + '”. O perfil de demanda foi ajustado para '\n        + esc((PERFIL.PRESETS[estado.perfil.tipo] || {}).nome || '—') + '.', 'ok');\n    }));\n  }\n\n  /* =================================================================\n     ABA 1 — PROJETO\n     ================================================================= */\n  function renderProjeto() {\n    const p = estado.projeto;\n    const c = calcular();\n    const el = $('#painel-projeto');\n\n    const base = PROJETOS.find(x => x.id === p.id);\n    const abertoBib = estado.biblioteca_ui.aberto_id ? PROJ.obter(estado.biblioteca_ui.aberto_id) : null;\n    const origemProjeto = abertoBib ? 'biblioteca · ' + abertoBib.nome\n      : base ? 'modelo de partida ' + base.id : 'projeto próprio';\n\n    const linhas = p.consumidores.map((k, i) => `\n      <tr>\n        <td><input type=\"text\" data-cons=\"${i}\" data-campo=\"nome\" value=\"${esc(k.nome)}\"><\/td>\n        <td class=\"n\" style=\"width:74px\"><input type=\"number\" min=\"0\" step=\"1\" data-cons=\"${i}\" data-campo=\"qtd\" value=\"${k.qtd}\"><\/td>\n        <td class=\"n\" style=\"width:96px\"><input type=\"number\" min=\"0\" step=\"0.01\" data-cons=\"${i}\" data-campo=\"vazao_m3min\" value=\"${k.vazao_m3min}\"><\/td>\n        <td class=\"n\" style=\"width:84px\"><input type=\"number\" min=\"0\" step=\"0.1\" data-cons=\"${i}\" data-campo=\"pressao_bar\" value=\"${k.pressao_bar}\"><\/td>\n        <td class=\"n\" style=\"width:84px\"><input type=\"number\" min=\"0\" max=\"1\" step=\"0.05\" data-cons=\"${i}\" data-campo=\"utilizacao\" value=\"${k.utilizacao}\"><\/td>\n        <td class=\"n\">${num(k.qtd * k.vazao_m3min * k.utilizacao, 3)}<\/td>\n        <td><button class=\"btn mini perigo\" data-remover=\"${i}\" aria-label=\"Remover ${esc(k.nome)}\">Remover<\/button><\/td>\n      <\/tr>`).join('');\n\n    const grupos = {};\n    BIBLIOTECA.forEach(b => { (grupos[b.grupo] = grupos[b.grupo] || []).push(b); });\n    const optBib = Object.keys(grupos).map(g =>\n      `<optgroup label=\"${esc(g)}\">` + grupos[g].map((b, i) =>\n        `<option value=\"${esc(b.nome)}\">${esc(b.nome)} — ${num(b.vazao, 2)} m³/min<\/option>`).join('') + '<\/optgroup>').join('');\n\n    el.innerHTML = `\n      <div class=\"aviso-dados\">\n        <b>Sobre os dados do catálogo.<\/b> As especificações dos ${CATALOGO.length} modelos são\n        <b>indicativas de referência<\/b>, geradas a partir da potência comercial do motor e da potência\n        específica típica de cada tecnologia — não são transcrições de catálogo. Servem para dimensionar,\n        comparar tecnologias e montar a memória de cálculo. <b>Antes de licitar, contratar ou emitir\n        documento técnico, substitua pelos valores do catálogo vigente do fabricante<\/b> (aba Catálogo →\n        Exportar para editar a base).\n      <\/div>\n\n      ${blocoBiblioteca()}\n\n      <div class=\"grade g-1-2\">\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">01<\/span> Projeto<\/h2>\n          <div class=\"corpo solto\">\n            <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n              <span class=\"selo info\">${esc(origemProjeto)}<\/span>\n              ${estado.biblioteca_ui.aberto_id ? '<span class=\"selo ok\">salvo na biblioteca<\/span>' : ''}\n              <button class=\"btn sec mini\" id=\"btn-abrir-biblioteca\" style=\"margin-left:auto\">Biblioteca de projetos<\/button>\n            <\/div>\n            <label class=\"campo\">\n              <span class=\"rotulo\">Identificação<\/span>\n              <input type=\"text\" id=\"p-nome\" value=\"${esc(p.nome)}\" style=\"font-family:var(--sans)\">\n            <\/label>\n            <p class=\"dica\">${esc(p.descricao || '')}<\/p>\n            <div class=\"grade g2\">\n              <label class=\"campo\"><span class=\"rotulo\">Altitude <span class=\"un\">(m)<\/span><\/span>\n                <input type=\"number\" id=\"p-altitude\" step=\"10\" value=\"${p.altitude_m}\"><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Temp. aspiração <span class=\"un\">(°C)<\/span><\/span>\n                <input type=\"number\" id=\"p-temp\" step=\"1\" value=\"${p.temp_aspiracao_C}\"><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Pressão de trabalho <span class=\"un\">(bar)<\/span><\/span>\n                <input type=\"number\" id=\"p-pressao\" step=\"0.5\" value=\"${p.pressao_trabalho_bar}\"><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Rede — comprimento <span class=\"un\">(m)<\/span><\/span>\n                <input type=\"number\" id=\"p-rede\" step=\"5\" value=\"${p.comprimento_rede_m}\"><\/label>\n            <\/div>\n            <div class=\"grade g2\">\n              <label class=\"campo\"><span class=\"rotulo\">Regime de operação<\/span>\n                <select id=\"p-regime\">\n                  <option value=\"intermitente\"${p.regime === 'intermitente' ? ' selected' : ''}>Intermitente<\/option>\n                  <option value=\"continuo\"${p.regime === 'continuo' ? ' selected' : ''}>Contínuo (1–2 turnos)<\/option>\n                  <option value=\"24h\"${p.regime === '24h' ? ' selected' : ''}>Ininterrupto (24 h)<\/option>\n                <\/select><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Qualidade do ar exigida<\/span>\n                <select id=\"p-qualidade\">\n                  <option value=\"ferramentas\"${p.qualidade === 'ferramentas' ? ' selected' : ''}>Ferramentas / serviço geral<\/option>\n                  <option value=\"instrumentacao\"${p.qualidade === 'instrumentacao' ? ' selected' : ''}>Instrumentação e automação<\/option>\n                  <option value=\"pintura\"${p.qualidade === 'pintura' ? ' selected' : ''}>Pintura / jateamento<\/option>\n                  <option value=\"alimenticio\"${p.qualidade === 'alimenticio' ? ' selected' : ''}>Contato indireto com alimentos<\/option>\n                  <option value=\"critico\"${p.qualidade === 'critico' ? ' selected' : ''}>Processo crítico / laboratório<\/option>\n                <\/select><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Vazamentos previstos <span class=\"un\">(fração)<\/span><\/span>\n                <input type=\"number\" id=\"p-vaz\" step=\"0.01\" min=\"0\" max=\"0.5\" value=\"${p.perdas_vazamento}\"><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Reserva para expansão <span class=\"un\">(fração)<\/span><\/span>\n                <input type=\"number\" id=\"p-fut\" step=\"0.05\" min=\"0\" max=\"1\" value=\"${p.reserva_futura}\"><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Horas de operação <span class=\"un\">(h/ano)<\/span><\/span>\n                <input type=\"number\" id=\"p-horas\" step=\"100\" value=\"${p.horas_ano}\"><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Fator de carga médio<\/span>\n                <input type=\"number\" id=\"p-fc\" step=\"0.05\" min=\"0\" max=\"1\" value=\"${p.fator_carga}\"><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Critério de diversidade<\/span>\n                <select id=\"p-diversidade\">\n                  <option value=\"serie\"${(p.modo_diversidade || 'serie') === 'serie' ? ' selected' : ''}>Utilização × simultaneidade<\/option>\n                  <option value=\"utilizacao\"${p.modo_diversidade === 'utilizacao' ? ' selected' : ''}>Somente utilização<\/option>\n                  <option value=\"simultaneidade\"${p.modo_diversidade === 'simultaneidade' ? ' selected' : ''}>Somente simultaneidade<\/option>\n                <\/select><\/label>\n            <\/div>\n            <p class=\"ajuda\">O <strong>fator de utilização<\/strong> (por ferramenta) e o\n            <strong>fator de simultaneidade<\/strong> (global) descrevem o mesmo fenômeno:\n            a improbabilidade de todos os pontos consumirem ar ao mesmo tempo. Aplicar os dois\n            em série multiplica os abatimentos e pode subdimensionar a central. Use\n            <em>somente utilização<\/em> quando os tempos de uso foram levantados em campo, e\n            <em>somente simultaneidade<\/em> quando as vazões vieram de catálogo em regime contínuo.<\/p>\n            <fieldset>\n              <legend>Restrições de seleção<\/legend>\n              <label style=\"display:flex;gap:8px;align-items:center;font-size:13px\">\n                <input type=\"checkbox\" id=\"p-isento\" style=\"width:auto\" ${p.isento ? 'checked' : ''}>\n                Exigir ar isento de óleo<\/label>\n              <label style=\"display:flex;gap:8px;align-items:center;font-size:13px;margin-top:7px\">\n                <input type=\"checkbox\" id=\"p-var\" style=\"width:auto\" ${p.demanda_variavel ? 'checked' : ''}>\n                Demanda acentuadamente variável (favorece inversor)<\/label>\n              <label style=\"display:flex;gap:8px;align-items:center;font-size:13px;margin-top:7px\">\n                <input type=\"checkbox\" id=\"p-diesel\" style=\"width:auto\" ${p.acionamento === 'diesel' ? 'checked' : ''}>\n                Sem energia elétrica no local (exige acionamento a diesel)<\/label>\n            <\/fieldset>\n            <div class=\"linha-btn\">\n              <button class=\"btn sec mini\" id=\"btn-restaurar\">Restaurar projeto original<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"grade\" style=\"align-content:start\">\n          <div class=\"kpi-linha\">\n            <div class=\"kpi\"><span class=\"k\">Pontos de consumo<\/span><span class=\"v\">${c.dem.n_pontos}<\/span><\/div>\n            <div class=\"kpi\"><span class=\"k\">Soma bruta<\/span><span class=\"v\">${num(c.dem.soma_bruta, 2)} <small>m³/min<\/small><\/span><\/div>\n            <div class=\"kpi\"><span class=\"k\">Fator simultaneidade<\/span><span class=\"v\">${num(c.dem.fator_simultaneidade, 2)}<\/span><\/div>\n            <div class=\"kpi\"><span class=\"k\">Correção de altitude<\/span><span class=\"v\">${num((c.dem.fator_altitude - 1) * 100, 1)} <small>%<\/small><\/span><\/div>\n            <div class=\"kpi destaque\"><span class=\"k\">Vazão de projeto<\/span><span class=\"v\">${num(c.dem.q_projeto_m3min, 2)} <small>m³/min<\/small><\/span><\/div>\n            <div class=\"kpi\"><span class=\"k\">Equivalente<\/span><span class=\"v\">${num(ENG.UN.m3min_para_pcm(c.dem.q_projeto_m3min), 0)} <small>pcm<\/small><\/span><\/div>\n          <\/div>\n\n          <div class=\"cartao\">\n            <h2><span class=\"tag-num\">02<\/span> Consumidores pneumáticos<\/h2>\n            <div class=\"corpo\">\n              <div class=\"linha-btn\" style=\"margin-bottom:11px\">\n                <select id=\"sel-biblioteca\" style=\"flex:1;min-width:210px\">\n                  <option value=\"\">Adicionar da biblioteca (${BIBLIOTECA.length} itens)…<\/option>${optBib}\n                <\/select>\n                <button class=\"btn sec mini\" id=\"btn-add-vazio\">Linha em branco<\/button>\n              <\/div>\n              <div class=\"rolagem\">\n                <table class=\"dados\">\n                  <thead><tr>\n                    <th>Consumidor<\/th><th class=\"n\">Qtd.<\/th><th class=\"n\">Vazão unit.<br><span style=\"font-weight:400;text-transform:none\">m³/min<\/span><\/th>\n                    <th class=\"n\">Pressão<br><span style=\"font-weight:400;text-transform:none\">bar<\/span><\/th>\n                    <th class=\"n\">Utilização<\/th><th class=\"n\">Ponderada<br><span style=\"font-weight:400;text-transform:none\">m³/min<\/span><\/th><th><\/th>\n                  <\/tr><\/thead>\n                  <tbody id=\"tb-cons\">${linhas || '<tr><td colspan=\"7\" style=\"text-align:center;color:var(--aco-med);padding:22px\">Nenhum consumidor cadastrado. Adicione um item da biblioteca acima.<\/td><\/tr>'}<\/tbody>\n                  <tfoot><tr style=\"background:var(--papel-2);font-weight:650\">\n                    <td colspan=\"5\" style=\"text-align:right\">Demanda ponderada<\/td>\n                    <td class=\"n\">${num(c.dem.soma_ponderada, 3)}<\/td><td><\/td>\n                  <\/tr><\/tfoot>\n                <\/table>\n              <\/div>\n              ${c.dem.pressao_max_consumidor_bar > c.pTrab ? `<div class=\"nota erro\" style=\"margin-top:11px\"><strong>Pressão de trabalho insuficiente<\/strong>\n                O consumidor mais exigente pede ${num(c.dem.pressao_max_consumidor_bar, 1)} bar, acima dos ${num(c.pTrab, 1)} bar ajustados\n                para o compressor. Some ainda a perda de carga da rede. Eleve a pressão de trabalho.<\/div>` : ''}\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>`;\n\n    ligarProjeto();\n  }\n\n  function ligarProjeto() {\n    const p = estado.projeto;\n    const bind = (id, campo, tipo) => {\n      const e = $(id); if (!e) return;\n      e.addEventListener('change', () => {\n        p[campo] = tipo === 'num' ? +e.value : tipo === 'bool' ? e.checked : e.value;\n        salvar(); render();\n      });\n    };\n    bind('#p-nome', 'nome'); bind('#p-altitude', 'altitude_m', 'num');\n    bind('#p-temp', 'temp_aspiracao_C', 'num'); bind('#p-pressao', 'pressao_trabalho_bar', 'num');\n    bind('#p-rede', 'comprimento_rede_m', 'num'); bind('#p-regime', 'regime');\n    bind('#p-diversidade', 'modo_diversidade');\n    bind('#p-qualidade', 'qualidade'); bind('#p-vaz', 'perdas_vazamento', 'num');\n    bind('#p-fut', 'reserva_futura', 'num'); bind('#p-horas', 'horas_ano', 'num');\n    bind('#p-fc', 'fator_carga', 'num'); bind('#p-isento', 'isento', 'bool');\n    bind('#p-var', 'demanda_variavel', 'bool');\n\n    const d = $('#p-diesel');\n    if (d) d.addEventListener('change', () => {\n      p.acionamento = d.checked ? 'diesel' : null; estado.modelo_id = null; salvar(); render();\n    });\n\n    ligarBiblioteca();\n\n    const ab = $('#btn-abrir-biblioteca');\n    if (ab) ab.addEventListener('click', () => {\n      estado.biblioteca_ui.aberta = true; salvar(); render();\n      const d = $('#det-biblioteca');\n      if (d && d.scrollIntoView) try { d.scrollIntoView({ block: 'start' }); } catch (e) { /* sem suporte */ }\n    });\n\n    const br = $('#btn-restaurar');\n    if (br) br.addEventListener('click', () => {\n      const o = PROJETOS.find(x => x.id === p.id);\n      if (!o) return;\n      estado.projeto = JSON.parse(JSON.stringify(o)); estado.modelo_id = null; salvar(); render();\n    });\n\n    const sb = $('#sel-biblioteca');\n    if (sb) sb.addEventListener('change', () => {\n      const item = BIBLIOTECA.find(b => b.nome === sb.value);\n      if (!item) return;\n      p.consumidores.push({ nome: item.nome, qtd: 1, vazao_m3min: item.vazao, pressao_bar: item.pressao, utilizacao: item.utilizacao });\n      estado.modelo_id = null; salvar(); render();\n    });\n\n    const bv = $('#btn-add-vazio');\n    if (bv) bv.addEventListener('click', () => {\n      p.consumidores.push({ nome: 'Novo consumidor', qtd: 1, vazao_m3min: 0.30, pressao_bar: 6.3, utilizacao: 0.30 });\n      salvar(); render();\n    });\n\n    $$('[data-cons]').forEach(inp => {\n      inp.addEventListener('change', () => {\n        const i = +inp.dataset.cons, campo = inp.dataset.campo;\n        p.consumidores[i][campo] = campo === 'nome' ? inp.value : +inp.value;\n        estado.modelo_id = null; salvar(); render();\n      });\n    });\n    $$('[data-remover]').forEach(b => {\n      b.addEventListener('click', () => {\n        p.consumidores.splice(+b.dataset.remover, 1);\n        estado.modelo_id = null; salvar(); render();\n      });\n    });\n  }\n\n  /* =================================================================\n     ABA 2 — SELEÇÃO\n     ================================================================= */\n  function manometro(pNominal, pUso, pMin) {\n    // Manômetro com zona vermelha abaixo da pressão mínima admissível\n    const max = Math.ceil(pNominal * 1.25);\n    const a0 = 135, a1 = 405;                       // varredura de 270°\n    const ang = v => a0 + (Math.min(v, max) / max) * (a1 - a0);\n    const pol = (a, r) => {\n      const rad = (a - 90) * Math.PI / 180;\n      return [110 + r * Math.cos(rad), 100 + r * Math.sin(rad)];\n    };\n    const arco = (v1, v2, r) => {\n      const [x1, y1] = pol(ang(v1), r), [x2, y2] = pol(ang(v2), r);\n      const grande = ang(v2) - ang(v1) > 180 ? 1 : 0;\n      return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${grande} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;\n    };\n    const [px, py] = pol(ang(pUso), 62);\n    const marcas = [];\n    for (let i = 0; i <= 10; i++) {\n      const v = max * i / 10;\n      const [x1, y1] = pol(ang(v), 70), [x2, y2] = pol(ang(v), 78);\n      marcas.push(`<line x1=\"${x1.toFixed(1)}\" y1=\"${y1.toFixed(1)}\" x2=\"${x2.toFixed(1)}\" y2=\"${y2.toFixed(1)}\" stroke=\"currentColor\" stroke-width=\"${i % 2 ? 1 : 1.8}\" opacity=\"${i % 2 ? .4 : .8}\"/>`);\n    }\n    const ok = pUso >= pMin;\n    return `<svg viewBox=\"0 0 220 190\" width=\"100%\" style=\"max-width:230px;color:var(--aco-med)\" role=\"img\"\n        aria-label=\"Pressão no ponto de uso: ${num(pUso, 2)} bar; mínima admissível ${num(pMin, 2)} bar\">\n      <circle cx=\"110\" cy=\"100\" r=\"84\" fill=\"var(--papel-2)\" stroke=\"var(--borda)\" stroke-width=\"2\"/>\n      <path d=\"${arco(0, pMin, 74)}\" stroke=\"var(--alerta)\" stroke-width=\"7\" fill=\"none\" opacity=\".85\"/>\n      <path d=\"${arco(pMin, max, 74)}\" stroke=\"var(--ok)\" stroke-width=\"7\" fill=\"none\" opacity=\".55\"/>\n      ${marcas.join('')}\n      <line x1=\"110\" y1=\"100\" x2=\"${px.toFixed(1)}\" y2=\"${py.toFixed(1)}\"\n            stroke=\"${ok ? 'var(--ar)' : 'var(--alerta)'}\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n      <circle cx=\"110\" cy=\"100\" r=\"6\" fill=\"${ok ? 'var(--ar)' : 'var(--alerta)'}\"/>\n      <text x=\"110\" y=\"140\" text-anchor=\"middle\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"21\" font-weight=\"600\"\n            fill=\"${ok ? 'var(--ar)' : 'var(--alerta)'}\">${num(pUso, 2)}<\/text>\n      <text x=\"110\" y=\"155\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\"\n            letter-spacing=\"1.5\">BAR NO PONTO DE USO<\/text>\n      <text x=\"110\" y=\"180\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\" opacity=\".75\">\n        mínima admissível ${num(pMin, 2)} bar<\/text>\n    <\/svg>`;\n  }\n\n  function placa(m, c) {\n    if (!m) return '<div class=\"nota erro\"><strong>Nenhum modelo selecionado<\/strong>Ajuste os critérios do projeto ou escolha um modelo na lista.<\/div>';\n    return `<div class=\"placa\">\n      <span class=\"parafuso pi\"><\/span><span class=\"parafuso pd\"><\/span>\n      <div class=\"placa-topo\">\n        <span class=\"placa-marca\">${esc(m.marca)}<\/span>\n        <span class=\"placa-id\">REF ${esc(m.id)} · ${esc(m.revisao)}<\/span>\n      <\/div>\n      <p class=\"placa-modelo\">${esc(m.modelo)}<\/p>\n      <p class=\"placa-tipo\">${esc(m.linha)} · ${esc(m.tipo_nome || ENG.NOMES_TIPO[m.tipo])} · ${m.estagios} estágio(s) · ${m.lubrificacao === 'isento' ? 'isento de óleo' : 'lubrificado a óleo'}<\/p>\n      <div class=\"placa-grade\">\n        <div class=\"placa-item\"><span class=\"k\">Vazão FAD<\/span><span class=\"v\">${num(m.vazao_fad_m3min, 2)} <small>m³/min<\/small><\/span><\/div>\n        <div class=\"placa-item\"><span class=\"k\">Equivalente<\/span><span class=\"v\">${num(m.vazao_pcm, 0)} <small>pcm<\/small><\/span><\/div>\n        <div class=\"placa-item\"><span class=\"k\">Pressão nom.<\/span><span class=\"v\">${num(m.pressao_nom_bar, 1)} <small>bar<\/small><\/span><\/div>\n        <div class=\"placa-item\"><span class=\"k\">Pressão máx.<\/span><span class=\"v\">${num(m.pressao_max_bar, 1)} <small>bar<\/small><\/span><\/div>\n        <div class=\"placa-item\"><span class=\"k\">Potência<\/span><span class=\"v\">${num(m.potencia_kw, 1)} <small>kW<\/small><\/span><\/div>\n        <div class=\"placa-item\"><span class=\"k\">Potência<\/span><span class=\"v\">${num(m.potencia_cv, 1)} <small>cv<\/small><\/span><\/div>\n        <div class=\"placa-item\"><span class=\"k\">Pot. específica<\/span><span class=\"v\">${num(m.pot_especifica, 2)} <small>kW/(m³/min)<\/small><\/span><\/div>\n        <div class=\"placa-item\"><span class=\"k\">Ruído<\/span><span class=\"v\">${m.ruido_dba} <small>dB(A)<\/small><\/span><\/div>\n        <div class=\"placa-item\"><span class=\"k\">Reservatório<\/span><span class=\"v\">${m.reservatorio_l ? num(m.reservatorio_l, 0) : '—'} <small>${m.reservatorio_l ? 'L' : 'sem tanque'}<\/small><\/span><\/div>\n        <div class=\"placa-item\"><span class=\"k\">Massa<\/span><span class=\"v\">${num(m.peso_kg, 0)} <small>kg<\/small><\/span><\/div>\n        <div class=\"placa-item\"><span class=\"k\">Alimentação<\/span><span class=\"v\" style=\"font-size:12px\">${esc(m.tensao)}<\/span><\/div>\n        <div class=\"placa-item\"><span class=\"k\">Preço ref.<\/span><span class=\"v\">${moeda(m.preco_ref_brl)}<\/span><\/div>\n      <\/div>\n    <\/div>`;\n  }\n\n  function renderSelecao() {\n    const c = calcular();\n    const el = $('#painel-selecao');\n    const m = c.modelo;\n    const pMin = c.dem.pressao_max_consumidor_bar;\n    const pUso = c.perda.pressao_ponto_uso_bar;\n\n    const cartaoLista = (arr, reprovado) => arr.slice(0, reprovado ? 8 : 12).map((x, i) => `\n      <button class=\"modelo-card ${x.id === (m && m.id) ? 'sel' : ''}\" data-modelo=\"${x.id}\">\n        <span class=\"pos\">${reprovado ? '—' : String(i + 1).padStart(2, '0')}<\/span>\n        <span class=\"info\">\n          <span class=\"nome\">${esc(x.marca)} ${esc(x.modelo)}<\/span>\n          <span class=\"sub\">${esc(x.tipo_nome)} · folga ${num(x.folga_percentual, 0)} %\n            ${x.restricoes.length ? ' · <span style=\"color:var(--alerta)\">' + esc(x.restricoes[0]) + '<\/span>' : ''}<\/span>\n        <\/span>\n        <span class=\"esp\"><b>${num(x.vazao_fad_m3min, 2)}<\/b> m³/min<br>${num(x.potencia_kw, 1)} kW · ${num(x.pressao_nom_bar, 1)} bar<\/span>\n      <\/button>`).join('');\n\n    el.innerHTML = `\n      <div class=\"grade g-2-1\">\n        <div class=\"grade\" style=\"align-content:start\">\n          ${placa(m, c)}\n          ${m ? `<div class=\"kpi-linha\">\n            <div class=\"kpi ${m.vazao_fad_m3min >= c.dem.q_projeto_m3min ? 'bom' : 'ruim'}\">\n              <span class=\"k\">Vazão · exigida / disponível<\/span>\n              <span class=\"v\">${num(c.dem.q_projeto_m3min, 2)} / ${num(m.vazao_fad_m3min, 2)}<\/span><\/div>\n            <div class=\"kpi ${m.folga_percentual > 60 ? 'ruim' : m.folga_percentual >= 0 ? 'bom' : 'ruim'}\">\n              <span class=\"k\">Folga de capacidade<\/span><span class=\"v\">${num(m.folga_percentual, 1)} <small>%<\/small><\/span><\/div>\n            <div class=\"kpi ${pUso >= pMin ? 'bom' : 'ruim'}\">\n              <span class=\"k\">Pressão no ponto de uso<\/span><span class=\"v\">${num(pUso, 2)} <small>bar<\/small><\/span><\/div>\n            <div class=\"kpi\"><span class=\"k\">Custo anual de energia<\/span><span class=\"v\">${moeda(c.ener.custo_ano_brl)}<\/span><\/div>\n          <\/div>` : ''}\n\n          <div class=\"cartao\">\n            <h2><span class=\"tag-num\">03<\/span> Modelos que atendem <span class=\"selo info\">${c.sel.aptos.length} de ${c.sel.total}<\/span><\/h2>\n            <div class=\"corpo\">\n              ${c.sel.aptos.length ? `<div class=\"grade\" style=\"gap:7px\">${cartaoLista(c.sel.aptos, false)}<\/div>`\n        : `<div class=\"nota erro\"><strong>Nenhum modelo do catálogo atende simultaneamente a todos os critérios<\/strong>\n             Isso costuma indicar demanda entre faixas comerciais, exigência de pureza incompatível com a\n             tecnologia filtrada, ou pressão acima do disponível. Veja abaixo os candidatos mais próximos e o\n             motivo da reprovação — em muitos casos a saída é associar duas máquinas em paralelo.<\/div>`}\n            <\/div>\n          <\/div>\n\n          <div class=\"cartao\">\n            <h2><span class=\"tag-num\">04<\/span> Candidatos reprovados e o motivo<\/h2>\n            <div class=\"corpo\"><div class=\"grade\" style=\"gap:7px\">${cartaoLista(c.sel.reprovados, true)}<\/div><\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"grade\" style=\"align-content:start\">\n          <div class=\"cartao\">\n            <h3>Pressão disponível<\/h3>\n            <div class=\"corpo\" style=\"display:flex;justify-content:center\">${manometro(c.pTrab, pUso, pMin)}<\/div>\n          <\/div>\n          ${pUso < pMin ? `<div class=\"nota erro\"><strong>Pressão insuficiente no ponto de uso<\/strong>\n            Após ${num(c.perda.perda_bar, 3)} bar de perda na rede sobram ${num(pUso, 2)} bar, abaixo dos\n            ${num(pMin, 2)} bar exigidos pelo consumidor mais crítico. Aumente o diâmetro da rede\n            (aba Rede de ar) antes de aumentar a pressão do compressor — cada bar a mais custa cerca de\n            7 % de energia.<\/div>` : `<div class=\"nota ok\"><strong>Pressão adequada<\/strong>\n            Sobram ${num(pUso - pMin, 2)} bar de margem sobre a exigência do consumidor mais crítico.<\/div>`}\n          <div class=\"cartao\">\n            <h3>Qualidade do ar<\/h3>\n            <div class=\"corpo solto\">\n              <div><span class=\"rotulo\">Classe requerida<\/span>\n                <div style=\"font-family:var(--mono);font-size:15px;color:var(--ar);font-weight:600\">${esc(c.qual.designacao)}<\/div>\n                <p class=\"dica\">${esc(c.qual.descricao)}<\/p><\/div>\n              <div><span class=\"rotulo\">Ponto de orvalho sob pressão<\/span>\n                <div style=\"font-family:var(--mono);font-size:15px\">${esc(c.qual.ponto_orvalho)}<\/div><\/div>\n              <div><span class=\"rotulo\">Secagem<\/span><div>${esc(c.qual.secador)}<\/div><\/div>\n              <div><span class=\"rotulo\">Filtragem<\/span><div>${esc(c.qual.filtragem)}<\/div><\/div>\n              ${c.qual.oleo === 0 && m && m.lubrificacao !== 'isento' ? `<div class=\"nota aviso\">\n                <strong>Incompatibilidade<\/strong>A classe exigida é de ar isento de óleo, mas o modelo\n                selecionado é lubrificado. Marque \"Exigir ar isento de óleo\" na aba Projeto.<\/div>` : ''}\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>`;\n\n    $$('[data-modelo]').forEach(b => b.addEventListener('click', () => {\n      estado.modelo_id = b.dataset.modelo; salvar(); render();\n    }));\n  }\n\n  /* =================================================================\n     ABA 3 — DIMENSIONAMENTO (memória de cálculo)\n     ================================================================= */\n  function renderDimensionamento() {\n    const c = calcular(); const p = estado.projeto; const el = $('#painel-dimensionamento');\n    const d = c.dem;\n    const passo = (t, formula, resultado, ref) => `\n      <div class=\"passo\">\n        <div class=\"titulo-passo\">${t}<\/div>\n        <div class=\"formula\">${formula}<\/div>\n        <div class=\"resultado\">${resultado}<\/div>\n        ${ref ? `<div class=\"ref\">${ref}<\/div>` : ''}\n      <\/div>`;\n\n    el.innerHTML = `\n      <div class=\"grade g2\">\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">05<\/span> Memória de cálculo — demanda<\/h2>\n          <div class=\"corpo memoria\">\n            ${passo('1 · Soma bruta dos consumidores',\n      'Q<sub>bruta<\/sub> = Σ (n<sub>i<\/sub> × q<sub>i<\/sub>)',\n      `Q_bruta = ${num(d.soma_bruta, 3)} m³/min`,\n      'Vazões de ar livre (FAD) referidas a 20 °C e 1 atm — ISO 1217.')}\n            ${passo('2 · Ponderação pelo fator de utilização',\n      'Q<sub>pond<\/sub> = Σ (n<sub>i<\/sub> × q<sub>i<\/sub> × u<sub>i<\/sub>)',\n      `Q_pond = ${num(d.soma_ponderada, 3)} m³/min`,\n      'O fator de utilização mede a fração do tempo em que cada ferramenta efetivamente consome ar.')}\n            ${passo('3 · Fator de simultaneidade',\n      d.modo_diversidade === 'utilizacao'\n        ? `Q<sub>sim<\/sub> = Q<sub>pond<\/sub> &nbsp; (critério: <b>somente utilização<\/b> — f<sub>s<\/sub> neutralizado em 1,00)`\n        : d.modo_diversidade === 'simultaneidade'\n          ? `Q<sub>sim<\/sub> = Q<sub>bruta<\/sub> × f<sub>s<\/sub> &nbsp; com f<sub>s<\/sub> = ${num(d.fator_simultaneidade, 2)} para ${d.n_pontos} pontos<br>\n             (critério: <b>somente simultaneidade<\/b> — os fatores de utilização não são aplicados)`\n          : `Q<sub>sim<\/sub> = Q<sub>pond<\/sub> × f<sub>s<\/sub> &nbsp; com f<sub>s<\/sub> = ${num(d.fator_simultaneidade, 2)} para ${d.n_pontos} pontos<br>\n             (critério: <b>utilização × simultaneidade<\/b>)`,\n      `Q_sim = ${num(d.q_simultanea, 3)} m³/min &nbsp;·&nbsp; retém ${num(d.fator_combinado * 100, 1)} % da soma bruta (corte de ${num(100 - d.fator_combinado * 100, 1)} %)`,\n      'Quanto maior o número de pontos, menor a probabilidade de operação conjunta.')}\n            ${d.alerta_diversidade ? `<div class=\"nota aviso\" style=\"margin:8px 0\">\n              <strong>Confira o critério de diversidade.<\/strong> ${esc(d.alerta_diversidade)}\n              O critério pode ser trocado no cartão 01, campo <em>Critério de diversidade<\/em>.\n            <\/div>` : ''}\n            ${passo('4 · Vazamentos da rede',\n      `Q<sub>vaz<\/sub> = Q<sub>sim<\/sub> × (1 + ${num(p.perdas_vazamento, 2)})`,\n      `Q_vaz = ${num(d.q_com_vazamento, 3)} m³/min`,\n      'Redes industriais típicas perdem de 10 % a 25 % do ar produzido em vazamentos.')}\n            ${passo('5 · Reserva para expansão',\n      `Q<sub>fut<\/sub> = Q<sub>vaz<\/sub> × (1 + ${num(p.reserva_futura, 2)})`,\n      `Q_fut = ${num(d.q_com_reserva, 3)} m³/min`, '')}\n            ${passo('6 · Correção de altitude e temperatura',\n      `ρ = p /(R·T) &nbsp;|&nbsp; p<sub>atm<\/sub>(${num(p.altitude_m, 0)} m) = ${num(ENG.pressaoAtmosferica(p.altitude_m), 2)} kPa<br>\n       f<sub>alt<\/sub> = ρ<sub>ref<\/sub> / ρ<sub>local<\/sub> = ${num(d.fator_altitude, 4)}`,\n      `Q_projeto = ${num(d.q_projeto_m3min, 3)} m³/min  (${num(ENG.UN.m3min_para_pcm(d.q_projeto_m3min), 0)} pcm)`,\n      'Atmosfera padrão ISA. O compressor é ensaiado ao nível do mar; em altitude o mesmo volume aspirado carrega menos massa de ar, exigindo acréscimo de capacidade.')}\n          <\/div>\n        <\/div>\n\n        <div class=\"grade\" style=\"align-content:start\">\n          <div class=\"cartao\">\n            <h2><span class=\"tag-num\">06<\/span> Memória de cálculo — potência<\/h2>\n            <div class=\"corpo memoria\">\n              ${passo('7 · Razão de compressão',\n      `r = p<sub>2abs<\/sub> / p<sub>1abs<\/sub> = ${num(c.pot.pressao_abs_descarga_bar, 3)} / ${num(c.pot.pressao_atm_bar, 3)}`,\n      `r = ${num(c.pot.razao_compressao, 3)}`, '')}\n              ${passo('8 · Potência isentrópica de compressão',\n      `P<sub>is<\/sub> = n · (k/(k−1)) · p<sub>1<\/sub> · Q · [ r<sup>(k−1)/(n·k)<\/sup> − 1 ]<br>\n       k = 1,40 &nbsp; n = ${c.modelo ? c.modelo.estagios : 1} estágio(s)`,\n      `P_is = ${num(c.pot.potencia_isentropica_kw, 2)} kW`,\n      'Compressão isentrópica com resfriamento intermediário e razão de pressão igualmente repartida entre estágios.')}\n              ${passo('9 · Potência no eixo',\n      `P<sub>eixo<\/sub> = P<sub>is<\/sub> / (η<sub>is<\/sub> · η<sub>mec<\/sub>) &nbsp; com η<sub>is<\/sub> = ${num(c.pot.rend.isentropico, 3)} · η<sub>mec<\/sub> = ${num(c.pot.rend.mecanico, 2)}`,\n      `P_eixo = ${num(c.pot.potencia_eixo_kw, 2)} kW`,\n      'Rendimento isentrópico calibrado contra a potência específica de catálogo da tecnologia.')}\n              ${passo('10 · Potência elétrica absorvida',\n      `P<sub>el<\/sub> = P<sub>eixo<\/sub> / η<sub>motor<\/sub> &nbsp; com η<sub>motor<\/sub> = ${num(c.pot.rend.motor, 3)}`,\n      `P_el = ${num(c.pot.potencia_eletrica_kw, 2)} kW`, '')}\n              ${passo('11 · Motor comercial (com 10 % de margem)',\n      'Escolha na série normalizada de potências',\n      `P_comercial = ${num(c.pot.potencia_comercial_kw, 1)} kW  (${num(ENG.UN.kw_para_cv(c.pot.potencia_comercial_kw), 1)} cv)`, '')}\n            <\/div>\n          <\/div>\n\n          <div class=\"cartao\">\n            <h3>Verificação contra o modelo escolhido<\/h3>\n            <div class=\"corpo\">\n              ${c.modelo ? `<table class=\"dados\">\n                <tr><td>Potência calculada (motor comercial)<\/td><td class=\"n\">${num(c.pot.potencia_comercial_kw, 1)} kW<\/td><\/tr>\n                <tr><td>Potência do modelo ${esc(c.modelo.modelo)}<\/td><td class=\"n\">${num(c.modelo.potencia_kw, 1)} kW<\/td><\/tr>\n                <tr><td>Divergência<\/td><td class=\"n\" style=\"color:${Math.abs(c.modelo.potencia_kw - c.pot.potencia_comercial_kw) / c.pot.potencia_comercial_kw > 0.25 ? 'var(--alerta)' : 'var(--ok)'}\">\n                  ${num((c.modelo.potencia_kw / c.pot.potencia_comercial_kw - 1) * 100, 1)} %<\/td><\/tr>\n              <\/table>\n              <p class=\"dica\">Divergência elevada em geral significa que o modelo é o degrau comercial\n              imediatamente acima da necessidade — situação normal e aceitável, desde que a folga de vazão\n              permaneça dentro do limite adotado.<\/p>` : '<p class=\"dica\">Selecione um modelo na aba Seleção.<\/p>'}\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>`;\n  }\n\n  /* =================================================================\n     ABA 4 — REDE DE AR\n     ================================================================= */\n  function renderRede() {\n    const c = calcular(); const el = $('#painel-rede'); const r = estado.rede;\n\n    const linhasDN = c.dim.opcoes.map(o => {\n      const sel = Math.abs(o.di - c.dEsc) < 1e-6;\n      return `<tr style=\"${sel ? 'background:var(--ar-claro);font-weight:600' : ''}\">\n        <td>${esc(o.dn)}<\/td><td class=\"n\">${num(o.di, 1)}<\/td><td class=\"n\">${num(o.velocidade_ms, 2)}<\/td>\n        <td class=\"n\">${num(o.perda_bar, 4)}<\/td><td class=\"n\">${num(o.perda_percentual, 2)}<\/td>\n        <td>${o.atende ? '<span class=\"selo ok\">atende<\/span>' : '<span class=\"selo erro\">não atende<\/span>'}<\/td>\n        <td><button class=\"btn mini sec\" data-dn=\"${o.di}\">${sel ? 'adotado' : 'adotar'}<\/button><\/td>\n      <\/tr>`;\n    }).join('');\n\n    el.innerHTML = `\n      <div class=\"grade g2\">\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">07<\/span> Perda de carga na rede<\/h2>\n          <div class=\"corpo solto\">\n            <div class=\"grade g2\">\n              <label class=\"campo\"><span class=\"rotulo\">Compr. equivalente <span class=\"un\">(m)<\/span><\/span>\n                <input type=\"number\" id=\"r-leq\" step=\"5\" value=\"${num(c.Lc, 0).replace(/\\./g, '')}\"><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Rugosidade <span class=\"un\">(mm)<\/span><\/span>\n                <input type=\"number\" id=\"r-rug\" step=\"0.01\" value=\"${r.rugosidade_mm}\"><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Perda admissível <span class=\"un\">(bar)<\/span><\/span>\n                <input type=\"number\" id=\"r-dp\" step=\"0.01\" value=\"${r.perda_admissivel_bar}\"><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Velocidade máxima <span class=\"un\">(m/s)<\/span><\/span>\n                <input type=\"number\" id=\"r-vmax\" step=\"0.5\" value=\"${r.vel_max_ms}\"><\/label>\n            <\/div>\n            <p class=\"dica\">O comprimento equivalente soma o traçado real às perdas localizadas de curvas,\n            tês, registros e conexões — pré-carregado como 1,4 × o comprimento da rede.\n            Rugosidade: 0,05 mm (cobre/inox), 0,15 mm (aço galvanizado), 0,50 mm (aço carbono envelhecido).<\/p>\n\n            <div class=\"kpi-linha\">\n              <div class=\"kpi\"><span class=\"k\">Diâmetro adotado<\/span><span class=\"v\">${num(c.dEsc, 1)} <small>mm<\/small><\/span><\/div>\n              <div class=\"kpi ${c.perda.velocidade_ok ? 'bom' : 'ruim'}\"><span class=\"k\">Velocidade<\/span><span class=\"v\">${num(c.perda.velocidade_ms, 2)} <small>m/s<\/small><\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">Reynolds<\/span><span class=\"v\">${num(c.perda.reynolds / 1000, 0)}<small>k<\/small><\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">Fator de atrito<\/span><span class=\"v\">${num(c.perda.fator_atrito, 4)}<\/span><\/div>\n              <div class=\"kpi ${c.perda.perda_bar <= r.perda_admissivel_bar ? 'bom' : 'ruim'}\"><span class=\"k\">Perda de carga<\/span><span class=\"v\">${num(c.perda.perda_bar, 4)} <small>bar<\/small><\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">Regime<\/span><span class=\"v\" style=\"font-size:14px\">${esc(c.perda.regime)}<\/span><\/div>\n            <\/div>\n\n            <div class=\"memoria\">\n              <div class=\"passo\"><div class=\"titulo-passo\">Método<\/div>\n                <div class=\"formula\">Δp = f · (L/D) · ρ·v²/2 &nbsp;— Darcy-Weisbach<br>\n                f = 0,25 / [log<sub>10<\/sub>(ε/3,7D + 5,74/Re<sup>0,9<\/sup>)]² &nbsp;— Swamee-Jain<\/div>\n                <div class=\"ref\">Swamee-Jain é a aproximação explícita de Colebrook-White, com desvio inferior\n                a 1 % na faixa 5×10³ &lt; Re &lt; 10⁸. A vazão é convertida de FAD para a condição de linha\n                pela lei dos gases antes do cálculo de velocidade.<\/div><\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">08<\/span> Seleção do diâmetro<\/h2>\n          <div class=\"corpo\">\n            <div class=\"rolagem\"><table class=\"dados\">\n              <thead><tr><th>Diâmetro nominal<\/th><th class=\"n\">D int.<br><span style=\"font-weight:400;text-transform:none\">mm<\/span><\/th>\n              <th class=\"n\">Veloc.<br><span style=\"font-weight:400;text-transform:none\">m/s<\/span><\/th>\n              <th class=\"n\">Δp<br><span style=\"font-weight:400;text-transform:none\">bar<\/span><\/th>\n              <th class=\"n\">Δp<br><span style=\"font-weight:400;text-transform:none\">%<\/span><\/th><th>Situação<\/th><th><\/th><\/tr><\/thead>\n              <tbody>${linhasDN}<\/tbody><\/table><\/div>\n            <p class=\"dica\" style=\"margin-top:10px\">Recomendação usual: rede principal até 6–9 m/s e ramais até\n            15 m/s, com perda total inferior a 0,1 bar entre o reservatório e o ponto mais distante.<\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">09<\/span> Reservatório de ar<\/h2>\n          <div class=\"corpo solto\">\n            <div class=\"grade g2\">\n              <label class=\"campo\"><span class=\"rotulo\">Δp carga/alívio <span class=\"un\">(bar)<\/span><\/span>\n                <input type=\"number\" id=\"v-dp\" step=\"0.1\" value=\"${estado.reserv.delta_pressao_bar}\"><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Partidas máximas <span class=\"un\">(1/h)<\/span><\/span>\n                <input type=\"number\" id=\"v-np\" step=\"1\" value=\"${c.partidas}\"><\/label>\n            <\/div>\n            <div class=\"memoria\"><div class=\"passo\">\n              <div class=\"titulo-passo\">Volume mínimo por limitação de partidas<\/div>\n              <div class=\"formula\">t<sub>ciclo<\/sub> = 4·V·Δp /(p<sub>atm<\/sub>·Q) &nbsp;→&nbsp; V = 15·p<sub>atm<\/sub>·Q /(N·Δp)<\/div>\n              <div class=\"resultado\">V<sub>mín<\/sub> = ${num(c.res.volume_min_l, 0)} L → comercial ${num(c.res.volume_comercial_l, 0)} L<\/div>\n              <div class=\"ref\">Condição crítica: demanda igual a 50 % da capacidade, que maximiza o tempo de ciclo.\n              O limite de partidas protege o enrolamento do motor do aquecimento por corrente de partida.<\/div>\n            <\/div><\/div>\n            ${c.res.obs ? `<div class=\"nota\"><strong>Acionamento com inversor<\/strong>${esc(c.res.obs)}<\/div>` : ''}\n            ${c.modelo && c.modelo.reservatorio_l ? `<div class=\"nota ok\"><strong>Reservatório integrado<\/strong>\n              O modelo já traz tanque de ${num(c.modelo.reservatorio_l, 0)} L${c.modelo.reservatorio_l < c.res.volume_min_l\n        ? `, <b>abaixo<\/b> dos ${num(c.res.volume_min_l, 0)} L calculados. Considere reservatório auxiliar ou aceitar frequência de partidas maior.`\n        : ', compatível com o volume calculado.'}<\/div>` : ''}\n          <\/div>\n        <\/div>\n\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">10<\/span> Enquadramento na NR-13<\/h2>\n          <div class=\"corpo solto\">\n            <div class=\"kpi-linha\">\n              <div class=\"kpi\"><span class=\"k\">Volume<\/span><span class=\"v\">${num(c.nr13.volume_m3 * 1000, 0)} <small>L<\/small><\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">PMTA<\/span><span class=\"v\">${num(c.nr13.pressao_kPa / 100, 1)} <small>bar<\/small><\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">Produto P·V<\/span><span class=\"v\">${num(c.nr13.produto_PV, 0)} <small>kPa·m³<\/small><\/span><\/div>\n              <div class=\"kpi destaque\"><span class=\"k\">Categoria<\/span><span class=\"v\">${esc(c.nr13.categoria)}<\/span><\/div>\n            <\/div>\n            <table class=\"dados\">\n              <tr><td>Classe do fluido<\/td><td>${esc(c.nr13.classe_fluido)}<\/td><\/tr>\n              <tr><td>Sujeito à NR-13<\/td><td>${c.nr13.sujeito_nr13 ? '<span class=\"selo aviso\">sim<\/span>' : '<span class=\"selo ok\">dispensado<\/span>'}<\/td><\/tr>\n              <tr><td>Periodicidade de inspeção<\/td><td>${esc(c.nr13.periodicidade)}<\/td><\/tr>\n            <\/table>\n            <div class=\"nota aviso\"><strong>Confira a redação vigente<\/strong>\n              ${esc(c.nr13.nota)} O enquadramento afeta prontuário, registro de segurança, válvula de\n              segurança, dispositivo de drenagem e a habilitação exigida do profissional que inspeciona.<\/div>\n          <\/div>\n        <\/div>\n      <\/div>`;\n\n    const b = (id, obj, campo) => {\n      const e = $(id); if (!e) return;\n      e.addEventListener('change', () => { obj[campo] = +e.value; salvar(); render(); });\n    };\n    b('#r-leq', estado.rede, 'comprimento_equivalente_m');\n    b('#r-rug', estado.rede, 'rugosidade_mm');\n    b('#r-dp', estado.rede, 'perda_admissivel_bar');\n    b('#r-vmax', estado.rede, 'vel_max_ms');\n    b('#v-dp', estado.reserv, 'delta_pressao_bar');\n    b('#v-np', estado.reserv, 'partidas_hora');\n    $$('[data-dn]').forEach(x => x.addEventListener('click', () => {\n      estado.rede.diametro_mm = +x.dataset.dn; salvar(); render();\n    }));\n  }\n\n  /* =================================================================\n     ABA — PERFIL DE DEMANDA\n     O compressor é dimensionado pelo pico; a conta de luz é a área sob\n     a curva. Esta aba separa as duas leituras.\n     ================================================================= */\n  function graficoPerfil(a) {\n    const W = 720, H = 236, mL = 42, mR = 14, mT = 12, mB = 34;\n    const iw = W - mL - mR, ih = H - mT - mB;\n    const bw = iw / 24;\n    const y = v => mT + ih * (1 - v);\n\n    const grades = [0, 0.25, 0.5, 0.75, 1].map(v => `\n      <line x1=\"${mL}\" y1=\"${y(v).toFixed(1)}\" x2=\"${(W - mR).toFixed(1)}\" y2=\"${y(v).toFixed(1)}\"\n            stroke=\"var(--borda)\" stroke-width=\"1\"${v ? ' stroke-dasharray=\"3 3\"' : ''}/>\n      <text x=\"${mL - 6}\" y=\"${(y(v) + 4).toFixed(1)}\" text-anchor=\"end\"\n            font-size=\"10\" font-family=\"var(--mono)\" fill=\"var(--aco-fraco)\">${(v * 100).toFixed(0)}%<\/text>`).join('');\n\n    const barras = a.horas.map((v, h) => {\n      const alt = Math.max(0, ih * v);\n      return `<rect x=\"${(mL + h * bw + 1.2).toFixed(1)}\" y=\"${y(v).toFixed(1)}\"\n        width=\"${(bw - 2.4).toFixed(1)}\" height=\"${alt.toFixed(1)}\"\n        fill=\"var(--ar-linha)\" stroke=\"var(--ar)\" stroke-width=\".6\" rx=\"1\">\n        <title>${h}h — demanda ${(v * 100).toFixed(0)} % do pico<\/title><\/rect>`;\n    }).join('');\n\n    const pontos = a.carga_maquina.map((v, h) =>\n      `${(mL + h * bw + bw / 2).toFixed(1)},${y(a.opera[h] ? v : 0).toFixed(1)}`).join(' ');\n    const linha = `<polyline points=\"${pontos}\" fill=\"none\" stroke=\"var(--ar)\"\n      stroke-width=\"2\" stroke-linejoin=\"round\" stroke-dasharray=\"5 3\"/>`;\n\n    const rotulos = [0, 3, 6, 9, 12, 15, 18, 21].map(h =>\n      `<text x=\"${(mL + h * bw + bw / 2).toFixed(1)}\" y=\"${H - mB + 15}\" text-anchor=\"middle\"\n             font-size=\"10\" font-family=\"var(--mono)\" fill=\"var(--aco-fraco)\">${h}h<\/text>`).join('');\n\n    return `<svg viewBox=\"0 0 ${W} ${H}\" width=\"100%\" role=\"img\"\n      aria-label=\"Perfil horário de demanda de ar comprimido\">\n      ${grades}${barras}${linha}${rotulos}\n      <line x1=\"${mL}\" y1=\"${mT}\" x2=\"${mL}\" y2=\"${mT + ih}\" stroke=\"var(--aco-fraco)\" stroke-width=\"1\"/>\n      <text x=\"${W - mR}\" y=\"${H - 4}\" text-anchor=\"end\" font-size=\"10\"\n            font-family=\"var(--sans)\" fill=\"var(--aco-fraco)\">barras: demanda / pico · tracejado: carga sobre a máquina<\/text>\n    <\/svg>`;\n  }\n\n  function graficoPermanencia(a) {\n    if (!a.permanencia.length) return '';\n    const W = 720, H = 190, mL = 42, mR = 14, mT = 12, mB = 30;\n    const iw = W - mL - mR, ih = H - mT - mB;\n    const n = a.permanencia.length;\n    const x = i => mL + (n <= 1 ? iw / 2 : iw * i / (n - 1));\n    const y = v => mT + ih * (1 - v);\n\n    const grades = [0, 0.25, 0.5, 0.75, 1].map(v => `\n      <line x1=\"${mL}\" y1=\"${y(v).toFixed(1)}\" x2=\"${(W - mR).toFixed(1)}\" y2=\"${y(v).toFixed(1)}\"\n            stroke=\"var(--borda)\" stroke-width=\"1\"${v ? ' stroke-dasharray=\"3 3\"' : ''}/>\n      <text x=\"${mL - 6}\" y=\"${(y(v) + 4).toFixed(1)}\" text-anchor=\"end\" font-size=\"10\"\n            font-family=\"var(--mono)\" fill=\"var(--aco-fraco)\">${(v * 100).toFixed(0)}%<\/text>`).join('');\n\n    const pts = a.permanencia.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');\n    const area = `M ${mL},${y(0).toFixed(1)} L ${pts} L ${x(n - 1).toFixed(1)},${y(0).toFixed(1)} Z`;\n\n    return `<svg viewBox=\"0 0 ${W} ${H}\" width=\"100%\" role=\"img\"\n      aria-label=\"Curva de permanência de carga\">\n      ${grades}\n      <path d=\"${area}\" fill=\"var(--ar-claro)\" stroke=\"none\"/>\n      <polyline points=\"${pts}\" fill=\"none\" stroke=\"var(--ar)\" stroke-width=\"2\"/>\n      <line x1=\"${mL}\" y1=\"${mT}\" x2=\"${mL}\" y2=\"${mT + ih}\" stroke=\"var(--aco-fraco)\" stroke-width=\"1\"/>\n      <text x=\"${mL}\" y=\"${H - 8}\" font-size=\"10\" font-family=\"var(--sans)\" fill=\"var(--aco-fraco)\">0 h<\/text>\n      <text x=\"${W - mR}\" y=\"${H - 8}\" text-anchor=\"end\" font-size=\"10\" font-family=\"var(--sans)\"\n            fill=\"var(--aco-fraco)\">${n} h de operação por dia<\/text>\n    <\/svg>`;\n  }\n\n  function renderPerfil() {\n    const el = $('#painel-perfil');\n    const c = calcular();\n    const pf = estado.perfil;\n    const a = c.perf;\n    const cmp = PERFIL.compararComUniforme(a, estado.projeto, c.potElet, c.tarifa,\n      c.modelo ? c.modelo.vsd : false);\n\n    const opcoes = (pf.tipo === 'personalizado'\n      ? '<option value=\"personalizado\" selected>Personalizado — editado manualmente<\/option>' : '')\n      + PERFIL.ORDEM_PRESETS.map(k =>\n        `<option value=\"${k}\"${pf.tipo === k ? ' selected' : ''}>${esc(PERFIL.PRESETS[k].nome)}<\/option>`).join('');\n\n    const campos = pf.horas.map((v, h) => `\n      <label><span class=\"hh\">${h}h<\/span>\n        <input type=\"number\" min=\"0\" max=\"1\" step=\"0.05\" data-ph=\"${h}\" value=\"${v}\"\n               id=\"ph-${h}\" aria-label=\"Demanda às ${h} horas\"><\/label>`).join('');\n\n    const totalBandas = a.bandas.reduce((s, b) => s + b.horas_dia, 0) || 1;\n    const barraBandas = a.bandas.map((b, i) => {\n      const cores = ['var(--aco-fraco)', 'var(--alerta)', 'var(--nr26)', 'var(--ar)', 'var(--ok)'];\n      return b.horas_dia ? `<i style=\"width:${(b.horas_dia / totalBandas * 100).toFixed(1)}%;background:${cores[i]}\"><\/i>` : '';\n    }).join('');\n\n    const linhasBandas = a.bandas.filter(b => b.horas_dia).map(b => `\n      <tr><td>${esc(b.rotulo)}<\/td><td class=\"n\">${num(b.horas_dia, 0)}<\/td>\n      <td class=\"n\">${num(b.horas_ano, 0)}<\/td><td class=\"n\">${num(b.fracao * 100, 1)} %<\/td><\/tr>`).join('');\n\n    const relevante = Math.abs(cmp.diferenca_pct) >= 5;\n\n    el.innerHTML = `\n      <div class=\"grade\" style=\"gap:16px\">\n\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">P1<\/span> Curva de demanda ao longo do dia<\/h2>\n          <div class=\"corpo solto\">\n            <div class=\"grade g4\">\n              <label class=\"campo\"><span class=\"rotulo\">Perfil típico<\/span>\n                <select id=\"pf-preset\">${opcoes}<\/select><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Dias de operação <span class=\"un\">(por ano)<\/span><\/span>\n                <input type=\"number\" id=\"pf-dias\" min=\"1\" max=\"365\" step=\"1\" value=\"${pf.dias_ano}\"><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Consumo em alívio <span class=\"un\">(fração)<\/span><\/span>\n                <input type=\"number\" id=\"pf-alivio\" min=\"0\" max=\"1\" step=\"0.05\" value=\"${pf.fator_alivio}\"><\/label>\n              <div class=\"campo\">\n                <span class=\"rotulo\">Aplicação<\/span>\n                <label style=\"display:flex;gap:7px;align-items:center;font-size:12.5px\">\n                  <input type=\"checkbox\" id=\"pf-ativo\" style=\"width:auto\"${pf.ativo ? ' checked' : ''}>\n                  Usar no cálculo de energia<\/label>\n                <label style=\"display:flex;gap:7px;align-items:center;font-size:12.5px;margin-top:5px\">\n                  <input type=\"checkbox\" id=\"pf-press\" style=\"width:auto\"${pf.manter_pressurizado ? ' checked' : ''}>\n                  Manter pressurizado fora de operação<\/label>\n              <\/div>\n            <\/div>\n            <p class=\"dica\">${esc((PERFIL.PRESETS[pf.tipo] || {}).desc\n              || 'Perfil editado manualmente. Escolher um perfil típico na lista recarrega os valores originais.')}<\/p>\n\n            ${graficoPerfil(a)}\n\n            <div>\n              <span class=\"rotulo\">Demanda hora a hora <span class=\"un\">(fração da vazão de projeto: 1,00 = pico)<\/span><\/span>\n              <div class=\"perfil-horas\">${campos}<\/div>\n              <p class=\"dica\">Editar qualquer hora personaliza o perfil. Escolher outro perfil típico\n              na lista acima descarta a edição e recarrega os valores originais.<\/p>\n            <\/div>\n\n            ${pf.ativo ? '' : `<div class=\"nota aviso\"><strong>Perfil não aplicado<\/strong>\n              A energia continua sendo estimada por ${num(estado.projeto.horas_ano, 0)} h/ano ×\n              fator de carga ${num(estado.projeto.fator_carga * 100, 0)} %, informados na aba Projeto.\n              Marque “Usar no cálculo de energia” para que a integração hora a hora substitua essa hipótese.<\/div>`}\n          <\/div>\n        <\/div>\n\n        <div class=\"grade g2\">\n          <div class=\"cartao\">\n            <h2><span class=\"tag-num\">P2<\/span> Indicadores de operação<\/h2>\n            <div class=\"corpo solto\">\n              <div class=\"kpi-linha\">\n                <div class=\"kpi\"><span class=\"k\">Horas de operação<\/span><span class=\"v\">${num(a.horas_operacao_dia, 0)} <small>h/dia<\/small><\/span><\/div>\n                <div class=\"kpi destaque\"><span class=\"k\">Horas no ano<\/span><span class=\"v\">${num(a.horas_ano, 0)} <small>h<\/small><\/span><\/div>\n                <div class=\"kpi\"><span class=\"k\">Demanda de pico<\/span><span class=\"v\">${num(a.vazao_pico_m3min, 2)} <small>m³/min<\/small><\/span><\/div>\n                <div class=\"kpi\"><span class=\"k\">Demanda média<\/span><span class=\"v\">${num(a.vazao_media_m3min, 2)} <small>m³/min<\/small><\/span><\/div>\n                <div class=\"kpi\"><span class=\"k\">Relação pico/média<\/span><span class=\"v\">${num(a.relacao_pico_media, 2)}<\/span><\/div>\n                <div class=\"kpi ${a.fator_carga_efetivo < 0.4 ? 'ruim' : 'bom'}\"><span class=\"k\">Fator de carga efetivo<\/span><span class=\"v\">${num(a.fator_carga_efetivo * 100, 0)} <small>%<\/small><\/span><\/div>\n              <\/div>\n\n              <div>\n                <span class=\"rotulo\">Distribuição das horas por faixa de carga da máquina<\/span>\n                <div class=\"medidor\">${barraBandas}<\/div>\n                <table class=\"dados\" style=\"margin-top:8px\">\n                  <thead><tr><th>Faixa de carga<\/th><th class=\"n\">h/dia<\/th><th class=\"n\">h/ano<\/th><th class=\"n\">% do dia<\/th><\/tr><\/thead>\n                  <tbody>${linhasBandas}<\/tbody>\n                <\/table>\n              <\/div>\n\n              <div class=\"nota\"><strong>Volume de ar produzido<\/strong>\n                ${num(a.volume_dia_m3, 0)} m³ por dia · ${num(a.volume_ano_m3, 0)} m³ por ano,\n                referidos às condições de aspiração (FAD).\n                ${a.folga_maquina > 0.001 ? 'A máquina selecionada tem ' + num(a.folga_maquina * 100, 0)\n                  + ' % de folga sobre a vazão de projeto, por isso a carga sobre ela (tracejado no gráfico) '\n                  + 'fica abaixo da curva de demanda.' : ''}<\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"cartao\">\n            <h2><span class=\"tag-num\">P3<\/span> Curva de permanência de carga<\/h2>\n            <div class=\"corpo solto\">\n              ${a.permanencia.length ? graficoPermanencia(a)\n                : '<div class=\"vazio\">Perfil sem horas de operação.<\/div>'}\n              <p class=\"dica\">As horas de operação ordenadas da mais carregada para a menos carregada.\n              Uma curva que cai depressa indica muitas horas em carga parcial — é aí que a máquina de\n              velocidade fixa desperdiça energia em alívio.<\/p>\n              <div class=\"nota ${a.recomendacao_tipo === 'fixa' ? 'ok' : a.recomendacao_tipo === 'indefinido' ? 'erro' : ''}\">\n                <strong>Leitura do perfil<\/strong>${esc(a.recomendacao)}<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">P4<\/span> Reflexo na energia<\/h2>\n          <div class=\"corpo solto\">\n            <div class=\"kpi-linha\">\n              <div class=\"kpi\"><span class=\"k\">Energia útil (compressão)<\/span><span class=\"v\">${num(a.energia_util_kwh, 0)} <small>kWh/ano<\/small><\/span><\/div>\n              <div class=\"kpi ruim\"><span class=\"k\">Energia gasta em alívio<\/span><span class=\"v\">${num(a.energia_alivio_kwh, 0)} <small>kWh/ano<\/small><\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">Desperdício em alívio<\/span><span class=\"v\">${num(a.desperdicio_alivio_pct, 1)} <small>%<\/small><\/span><\/div>\n              <div class=\"kpi destaque\"><span class=\"k\">Custo anual — velocidade fixa<\/span><span class=\"v\" style=\"font-size:16px\">${moeda(a.custo_fixa_brl)}<\/span><\/div>\n              <div class=\"kpi bom\"><span class=\"k\">Custo anual — com inversor<\/span><span class=\"v\" style=\"font-size:16px\">${moeda(a.custo_vsd_brl)}<\/span><\/div>\n              <div class=\"kpi bom\"><span class=\"k\">Diferença<\/span><span class=\"v\" style=\"font-size:16px\">${moeda(a.economia_vsd_brl)}<\/span><\/div>\n            <\/div>\n\n            <div>\n              <span class=\"rotulo\">Comparação com a hipótese simplificada<\/span>\n              <table class=\"dados\">\n                <thead><tr><th>Critério<\/th><th class=\"n\">Hipótese simplificada<\/th><th class=\"n\">Perfil horário<\/th><\/tr><\/thead>\n                <tbody>\n                  <tr><td>Horas de operação por ano<\/td><td class=\"n\">${num(cmp.horas_simples, 0)}<\/td><td class=\"n\">${num(cmp.horas_perfil, 0)}<\/td><\/tr>\n                  <tr><td>Fator de carga<\/td><td class=\"n\">${num(cmp.fc_simples * 100, 0)} %<\/td><td class=\"n\">${num(cmp.fc_perfil * 100, 0)} %<\/td><\/tr>\n                  <tr><td>Energia anual<\/td><td class=\"n\">${num(cmp.simples.energia_kwh_ano, 0)} kWh<\/td><td class=\"n\">${num(a.energia_kwh_ano, 0)} kWh<\/td><\/tr>\n                  <tr style=\"font-weight:650;background:var(--papel-2)\"><td>Custo anual de energia<\/td>\n                    <td class=\"n\">${moeda(cmp.simples.custo_ano_brl)}<\/td><td class=\"n\">${moeda(a.custo_ano_brl)}<\/td><\/tr>\n                <\/tbody>\n              <\/table>\n              <div class=\"nota ${relevante ? 'aviso' : ''}\" style
