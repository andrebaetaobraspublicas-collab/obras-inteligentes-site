=\"margin-top:10px\">\n                <strong>${relevante ? 'A hipótese simplificada distorce o resultado' : 'As duas hipóteses convergem'}<\/strong>\n                Diferença de ${moeda(Math.abs(cmp.diferenca_brl))} por ano\n                (${num(Math.abs(cmp.diferenca_pct), 1)} %), com o perfil\n                ${cmp.diferenca_brl >= 0 ? 'acima' : 'abaixo'} da estimativa por carga média constante.\n                ${relevante ? 'Vale adotar o perfil para a análise de ciclo de vida e para a decisão sobre inversor.'\n                  : 'Neste caso a simplificação não compromete a decisão.'}<\/div>\n            <\/div>\n\n            <div class=\"memoria\">\n              <div class=\"passo\">\n                <div class=\"titulo-passo\">Modelo de potência adotado<\/div>\n                <div class=\"formula\">velocidade fixa: P(x) = P<sub>el<\/sub>·[x + (1 − x)·f<sub>alívio<\/sub>], com f<sub>alívio<\/sub> = ${num(a.fator_alivio, 2)}<\/div>\n                <div class=\"formula\">inversor: P(x) = P<sub>el<\/sub>·[0,05 + 0,95·x]<\/div>\n                <div class=\"ref\">x é a carga sobre a máquina em cada hora, obtida da demanda horária\n                dividida pela vazão do modelo selecionado e limitada a 1,00. A energia anual é a soma\n                hora a hora multiplicada pelos ${num(a.dias_ano, 0)} dias de operação. Com perfil uniforme\n                o resultado coincide com a fórmula agregada de horas × fator de carga.<\/div>\n              <\/div>\n              <div class=\"passo\">\n                <div class=\"titulo-passo\">Potência elétrica absorvida<\/div>\n                <div class=\"resultado\">P<sub>el<\/sub> = ${num(c.potElet, 2)} kW<\/div>\n                <div class=\"ref\">Potência do motor corrigida pelo rendimento, conforme a aba Dimensionamento.\n                Tarifa adotada: ${moeda(c.tarifa)}/kWh.<\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>`;\n\n    const preset = $('#pf-preset');\n    if (preset) preset.addEventListener('change', () => {\n      if (preset.value === 'personalizado') return;\n      PERFIL.aplicarPreset(estado.perfil, preset.value); salvar(); render();\n    });\n    const dias = $('#pf-dias');\n    if (dias) dias.addEventListener('change', () => {\n      estado.perfil.dias_ano = Math.max(1, Math.min(365, +dias.value || 1)); salvar(); render();\n    });\n    const al = $('#pf-alivio');\n    if (al) al.addEventListener('change', () => {\n      estado.perfil.fator_alivio = Math.max(0, Math.min(1, +al.value || 0)); salvar(); render();\n    });\n    const at = $('#pf-ativo');\n    if (at) at.addEventListener('change', () => { estado.perfil.ativo = at.checked; salvar(); render(); });\n    const pr = $('#pf-press');\n    if (pr) pr.addEventListener('change', () => { estado.perfil.manter_pressurizado = pr.checked; salvar(); render(); });\n\n    $$('[data-ph]').forEach(i => i.addEventListener('change', () => {\n      const h = +i.dataset.ph;\n      let v = +i.value;\n      if (!isFinite(v) || v < 0) v = 0;\n      if (v > 1) v = 1;\n      estado.perfil.horas[h] = v;\n      estado.perfil.tipo = 'personalizado';\n      salvar(); comFoco(renderPerfil);\n    }));\n  }\n\n  /* =================================================================\n     ABA 5 — ENERGIA\n     ================================================================= */\n  function renderEnergia() {\n    const c = calcular(); const el = $('#painel-energia');\n    const vidaUtil = 10;\n    const capex = c.modelo ? c.modelo.preco_ref_brl : 0;\n    const opex = c.ener.custo_ano_brl * vidaUtil;\n\n    const linhasVaz = estado.energia.vazamentos.map((v, i) => {\n      const q = ENG.vazamentoOrificio(+v.d, c.pTrab, estado.projeto.altitude_m).vazao_m3min;\n      return `<tr>\n        <td class=\"n\"><input type=\"number\" step=\"0.5\" min=\"0.1\" data-vaz=\"${i}\" data-vc=\"d\" value=\"${v.d}\" style=\"width:78px\"><\/td>\n        <td class=\"n\"><input type=\"number\" step=\"1\" min=\"0\" data-vaz=\"${i}\" data-vc=\"n\" value=\"${v.n}\" style=\"width:70px\"><\/td>\n        <td class=\"n\">${num(q, 4)}<\/td><td class=\"n\">${num(q * v.n, 3)}<\/td>\n        <td><button class=\"btn mini perigo\" data-rmvaz=\"${i}\">Remover<\/button><\/td><\/tr>`;\n    }).join('');\n\n    const barra = (v, max, cls) => `<div class=\"barra ${cls || ''}\"><i style=\"width:${Math.min(100, v / max * 100).toFixed(1)}%\"><\/i><\/div>`;\n    const maxCusto = Math.max(c.cmpVSD.fixa.custo_ano_brl, c.cmpVSD.vsd.custo_ano_brl, 1);\n\n    el.innerHTML = `\n      ${c.usaPerfil\n        ? `<div class=\"nota ok\" style=\"margin-bottom:16px\"><strong>Energia calculada pelo perfil horário<\/strong>\n            ${num(c.horasEf, 0)} h/ano de operação e fator de carga efetivo de ${num(c.fcEf * 100, 0)} %,\n            derivados da curva de demanda montada na aba Perfil de demanda — não dos valores fixos da aba Projeto.<\/div>`\n        : `<div class=\"nota aviso\" style=\"margin-bottom:16px\"><strong>Energia estimada por carga média constante<\/strong>\n            ${num(c.horasEf, 0)} h/ano × fator de carga ${num(c.fcEf * 100, 0)} %, conforme informado na aba Projeto.\n            Para demanda variável, monte a curva horária na aba Perfil de demanda e marque\n            “usar no cálculo de energia”: a diferença costuma ser relevante.<\/div>`}\n      <div class=\"grade g2\">\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">11<\/span> Consumo e custo de energia<\/h2>\n          <div class=\"corpo solto\">\n            <div class=\"grade g2\">\n              <label class=\"campo\"><span class=\"rotulo\">Tarifa <span class=\"un\">(R$/kWh)<\/span><\/span>\n                <input type=\"number\" id=\"e-tarifa\" step=\"0.01\" value=\"${c.tarifa}\"><\/label>\n              <label class=\"campo\"><span class=\"rotulo\">Potência elétrica absorvida <span class=\"un\">(kW)<\/span><\/span>\n                <input type=\"number\" value=\"${num(c.potElet, 2).replace(/\\./g, '').replace(',', '.')}\" readonly><\/label>\n            <\/div>\n            <div class=\"kpi-linha\">\n              <div class=\"kpi\"><span class=\"k\">Energia anual<\/span><span class=\"v\">${num(c.ener.energia_kwh_ano, 0)} <small>kWh<\/small><\/span><\/div>\n              <div class=\"kpi destaque\"><span class=\"k\">Custo anual<\/span><span class=\"v\" style=\"font-size:16px\">${moeda(c.ener.custo_ano_brl)}<\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">Custo por 1.000 m³<\/span><span class=\"v\" style=\"font-size:16px\">${c.ener.custo_por_m3 ? moeda(c.ener.custo_por_m3 * 1000) : '—'}<\/span><\/div>\n            <\/div>\n            <div>\n              <span class=\"rotulo\">Custo total de propriedade em ${vidaUtil} anos<\/span>\n              <table class=\"dados\">\n                <tr><td>Aquisição (referência)<\/td><td class=\"n\">${moeda(capex)}<\/td><td class=\"n\">${num(capex / (capex + opex) * 100, 1)} %<\/td><\/tr>\n                <tr><td>Energia em ${vidaUtil} anos<\/td><td class=\"n\">${moeda(opex)}<\/td><td class=\"n\">${num(opex / (capex + opex) * 100, 1)} %<\/td><\/tr>\n                <tr style=\"font-weight:650;background:var(--papel-2)\"><td>Total<\/td><td class=\"n\">${moeda(capex + opex)}<\/td><td class=\"n\">100,0 %<\/td><\/tr>\n              <\/table>\n              <p class=\"dica\">Em compressores de porte industrial a energia costuma responder por 70 % a 80 %\n              do custo de ciclo de vida. Comprar pela menor proposta de aquisição sem avaliar a potência\n              específica tende a sair mais caro ao longo do contrato.<\/p>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">12<\/span> Velocidade fixa × inversor (VSD)<\/h2>\n          <div class=\"corpo solto\">\n            <label class=\"campo\"><span class=\"rotulo\">Sobrepreço estimado do VSD <span class=\"un\">(fração do preço)<\/span><\/span>\n              <input type=\"number\" id=\"e-vsd\" step=\"0.01\" value=\"${estado.energia.sobrepreco_vsd}\"><\/label>\n            <div>\n              <span class=\"rotulo\">Velocidade fixa — ${moeda(c.cmpVSD.fixa.custo_ano_brl)}/ano<\/span>\n              ${barra(c.cmpVSD.fixa.custo_ano_brl, maxCusto, 'ruim')}\n            <\/div>\n            <div>\n              <span class=\"rotulo\">Com inversor — ${moeda(c.cmpVSD.vsd.custo_ano_brl)}/ano<\/span>\n              ${barra(c.cmpVSD.vsd.custo_ano_brl, maxCusto, 'ok')}\n            <\/div>\n            <div class=\"kpi-linha\">\n              <div class=\"kpi bom\"><span class=\"k\">Economia anual<\/span><span class=\"v\" style=\"font-size:16px\">${moeda(c.cmpVSD.economia_ano_brl)}<\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">Redução<\/span><span class=\"v\">${num(c.cmpVSD.economia_percentual, 1)} <small>%<\/small><\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">Retorno do investimento<\/span><span class=\"v\">${c.cmpVSD.payback_anos ? num(c.cmpVSD.payback_anos, 1) + ' <small>anos<\/small>' : '—'}<\/span><\/div>\n            <\/div>\n            <div class=\"nota\"><strong>Como a conta é feita<\/strong>\n              A máquina de velocidade fixa em alívio ainda consome cerca de 30 % da potência nominal sem\n              entregar ar. O inversor aproxima o consumo da vazão efetivamente demandada. A vantagem cresce\n              com a variabilidade da demanda e some quando o fator de carga é próximo de 100 %\n              — no seu caso, fator de carga ${num(estado.projeto.fator_carga * 100, 0)} %.<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">13<\/span> Custo dos vazamentos<\/h2>\n          <div class=\"corpo solto\">\n            <table class=\"dados\">\n              <thead><tr><th class=\"n\">Ø furo (mm)<\/th><th class=\"n\">Quantidade<\/th>\n              <th class=\"n\">Vazão unit. (m³/min)<\/th><th class=\"n\">Subtotal (m³/min)<\/th><th><\/th><\/tr><\/thead>\n              <tbody>${linhasVaz}<\/tbody>\n            <\/table>\n            <div class=\"linha-btn\"><button class=\"btn sec mini\" id=\"btn-add-vaz\">Adicionar furo<\/button><\/div>\n            <div class=\"kpi-linha\">\n              <div class=\"kpi ruim\"><span class=\"k\">Vazão perdida<\/span><span class=\"v\">${num(c.qVaz, 3)} <small>m³/min<\/small><\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">Fração da produção<\/span><span class=\"v\">${num(c.dem.q_projeto_m3min ? c.qVaz / c.dem.q_projeto_m3min * 100 : 0, 1)} <small>%<\/small><\/span><\/div>\n              <div class=\"kpi ruim\"><span class=\"k\">Custo anual<\/span><span class=\"v\" style=\"font-size:16px\">${moeda(c.custoVaz)}<\/span><\/div>\n            <\/div>\n            <div class=\"memoria\"><div class=\"passo\">\n              <div class=\"titulo-passo\">Método<\/div>\n              <div class=\"formula\">ṁ = C<sub>d<\/sub>·A·p<sub>0<\/sub>·√(k/(R·T))·[2/(k+1)]<sup>(k+1)/(2(k−1))<\/sup><\/div>\n              <div class=\"ref\">Escoamento compressível bloqueado (sônico) no orifício, válido porque a razão\n              de pressões supera a crítica de 0,528 — o que ocorre para qualquer pressão de linha acima de\n              cerca de 0,9 bar manométrico. Adotado C<sub>d<\/sub> = 0,65.<\/div>\n            <\/div><\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">14<\/span> Onde reduzir consumo<\/h2>\n          <div class=\"corpo solto\">\n            <div class=\"nota\"><strong>Reduzir a pressão de operação<\/strong>\n              Cada bar de redução corta aproximadamente 7 % da energia. Verifique se os\n              ${num(c.pTrab, 1)} bar ajustados são mesmo necessários — o consumidor mais exigente\n              deste projeto pede ${num(c.dem.pressao_max_consumidor_bar, 1)} bar.<\/div>\n            <div class=\"nota\"><strong>Corrigir vazamentos<\/strong>\n              Os furos cadastrados custam ${moeda(c.custoVaz)} por ano, ${num(c.dem.q_projeto_m3min ? c.qVaz / c.dem.q_projeto_m3min * 100 : 0, 1)} % da produção.\n              Um programa de detecção por ultrassom costuma se pagar em poucos meses.<\/div>\n            <div class=\"nota\"><strong>Recuperar calor<\/strong>\n              Cerca de 90 % da energia elétrica consumida vira calor recuperável em água ou ar de\n              aquecimento — no seu caso, algo próximo de ${num(c.ener.energia_kwh_ano * 0.9, 0)} kWh/ano.<\/div>\n            <div class=\"nota\"><strong>Cuidar da temperatura de aspiração<\/strong>\n              Ar mais frio é mais denso. Aspirar do ambiente externo em vez da casa de máquinas aquecida\n              melhora a massa de ar entregue por unidade de energia.<\/div>\n          <\/div>\n        <\/div>\n      <\/div>`;\n\n    const t = $('#e-tarifa');\n    if (t) t.addEventListener('change', () => { estado.energia.tarifa_kwh = +t.value; salvar(); render(); });\n    const v = $('#e-vsd');\n    if (v) v.addEventListener('change', () => { estado.energia.sobrepreco_vsd = +v.value; salvar(); render(); });\n    $$('[data-vaz]').forEach(i => i.addEventListener('change', () => {\n      estado.energia.vazamentos[+i.dataset.vaz][i.dataset.vc] = +i.value; salvar(); render();\n    }));\n    $$('[data-rmvaz]').forEach(b => b.addEventListener('click', () => {\n      estado.energia.vazamentos.splice(+b.dataset.rmvaz, 1); salvar(); render();\n    }));\n    const a = $('#btn-add-vaz');\n    if (a) a.addEventListener('click', () => {\n      estado.energia.vazamentos.push({ d: 2, n: 1 }); salvar(); render();\n    });\n  }\n\n  /* =================================================================\n     ABA 6 — CATÁLOGO\n     ================================================================= */\n  function catalogoFiltrado() {\n    const f = estado.filtros;\n    return CATALOGO.filter(m => {\n      if (f.tipo && m.tipo !== f.tipo) return false;\n      if (f.marca && m.marca !== f.marca) return false;\n      if (f.pmin && m.potencia_kw < +f.pmin) return false;\n      if (f.pmax && m.potencia_kw > +f.pmax) return false;\n      if (f.fonte === 'verificado' && !m.verificado) return false;\n      if (f.fonte === 'indicativo' && m.verificado) return false;\n      if (f.texto) {\n        const t = f.texto.toLowerCase();\n        if (!(m.marca + ' ' + m.linha + ' ' + m.modelo).toLowerCase().includes(t)) return false;\n      }\n      return true;\n    });\n  }\n\n  function renderCatalogo() {\n    const el = $('#painel-catalogo');\n    const lista = catalogoFiltrado();\n    const marcas = Array.from(new Set(CATALOGO.map(m => m.marca))).sort();\n    const f = estado.filtros;\n    const nVerificados = CATALOGO.filter(m => m.verificado).length;\n\n    el.innerHTML = `\n      <div class=\"cartao\">\n        <h2><span class=\"tag-num\">15<\/span> Base de compressores\n          <span class=\"selo info\">${lista.length} de ${CATALOGO.length}<\/span><\/h2>\n        <div class=\"corpo\">\n          <div class=\"filtros\" style=\"margin-bottom:12px\">\n            <label class=\"campo\"><span class=\"rotulo\">Buscar<\/span>\n              <input type=\"text\" id=\"f-texto\" value=\"${esc(f.texto)}\" placeholder=\"marca, linha ou modelo\" style=\"font-family:var(--sans)\"><\/label>\n            <label class=\"campo\"><span class=\"rotulo\">Tecnologia<\/span>\n              <select id=\"f-tipo\"><option value=\"\">Todas<\/option>\n                ${Object.keys(ENG.NOMES_TIPO).map(k => `<option value=\"${k}\"${f.tipo === k ? ' selected' : ''}>${esc(ENG.NOMES_TIPO[k])}<\/option>`).join('')}\n              <\/select><\/label>\n            <label class=\"campo\"><span class=\"rotulo\">Marca<\/span>\n              <select id=\"f-marca\"><option value=\"\">Todas<\/option>\n                ${marcas.map(m => `<option value=\"${esc(m)}\"${f.marca === m ? ' selected' : ''}>${esc(m)}<\/option>`).join('')}\n              <\/select><\/label>\n            <label class=\"campo\"><span class=\"rotulo\">Potência mín. <span class=\"un\">(kW)<\/span><\/span>\n              <input type=\"number\" id=\"f-pmin\" value=\"${esc(f.pmin)}\"><\/label>\n            <label class=\"campo\"><span class=\"rotulo\">Potência máx. <span class=\"un\">(kW)<\/span><\/span>\n              <input type=\"number\" id=\"f-pmax\" value=\"${esc(f.pmax)}\"><\/label>\n            <label class=\"campo\"><span class=\"rotulo\">Procedência<\/span>\n              <select id=\"f-fonte\">\n                <option value=\"\">Todas<\/option>\n                <option value=\"verificado\"${f.fonte === 'verificado' ? ' selected' : ''}>Somente verificados<\/option>\n                <option value=\"indicativo\"${f.fonte === 'indicativo' ? ' selected' : ''}>Somente estimativas<\/option>\n              <\/select><\/label>\n            <div style=\"display:flex;align-items:flex-end;gap:8px\">\n              <button class=\"btn sec mini\" id=\"f-limpar\">Limpar filtros<\/button>\n              <button class=\"btn sec mini\" id=\"f-exportar\">Exportar base<\/button>\n            <\/div>\n          <\/div>\n\n          ${nVerificados === 0 ? `<div class=\"nota aviso\" style=\"margin-bottom:12px\">\n            <strong>Nenhum modelo verificado nesta base.<\/strong>\n            Os ${CATALOGO.length} modelos embarcados são <em>estimativas indicativas<\/em>, derivadas da\n            potência comercial do motor e da potência específica típica de cada tecnologia —\n            não são transcrições de catálogo. Servem para estudo preliminar e comparação entre\n            tecnologias. Para licitação, contrato ou memorial assinado, carregue os dados do\n            catálogo vigente do fabricante no cartão de importação abaixo.\n          <\/div>` : `<div class=\"nota\" style=\"margin-bottom:12px\">\n            <strong>${nVerificados} de ${CATALOGO.length} modelos com procedência registrada.<\/strong>\n            Os demais permanecem como estimativa indicativa. Use o filtro de procedência para\n            restringir a seleção aos dados verificados.\n          <\/div>`}\n          <div class=\"rolagem\">\n            <table class=\"dados\">\n              <thead><tr>\n                <th>Ref.<\/th><th>Marca<\/th><th>Modelo<\/th><th>Tecnologia<\/th>\n                <th class=\"n\">Vazão<br><span style=\"font-weight:400;text-transform:none\">m³/min<\/span><\/th>\n                <th class=\"n\">pcm<\/th><th class=\"n\">Pressão<br><span style=\"font-weight:400;text-transform:none\">bar<\/span><\/th>\n                <th class=\"n\">Pot.<br><span style=\"font-weight:400;text-transform:none\">kW<\/span><\/th>\n                <th class=\"n\">Pot. esp.<br><span style=\"font-weight:400;text-transform:none\">kW/(m³/min)<\/span><\/th>\n                <th class=\"n\">Ruído<br><span style=\"font-weight:400;text-transform:none\">dB(A)<\/span><\/th>\n                <th class=\"n\">Tanque<br><span style=\"font-weight:400;text-transform:none\">L<\/span><\/th>\n                <th class=\"n\">Preço ref.<\/th><th>Fonte<\/th><th><\/th>\n              <\/tr><\/thead>\n              <tbody>${lista.map(m => `<tr${m.id === estado.modelo_id ? ' style=\"background:var(--ar-claro)\"' : ''}>\n                <td style=\"font-family:var(--mono);font-size:11px\">${esc(m.id)}<\/td>\n                <td>${esc(m.marca)}<\/td><td><b>${esc(m.modelo)}<\/b><br><span style=\"font-size:11px;color:var(--aco-med)\">${esc(m.linha)}<\/span><\/td>\n                <td style=\"font-size:11.5px\">${esc(ENG.NOMES_TIPO[m.tipo])}<\/td>\n                <td class=\"n\">${num(m.vazao_fad_m3min, 2)}<\/td><td class=\"n\">${num(m.vazao_pcm, 0)}<\/td>\n                <td class=\"n\">${num(m.pressao_nom_bar, 1)}<\/td><td class=\"n\">${num(m.potencia_kw, 1)}<\/td>\n                <td class=\"n\">${num(m.pot_especifica, 2)}<\/td><td class=\"n\">${m.ruido_dba}<\/td>\n                <td class=\"n\">${m.reservatorio_l || '—'}<\/td><td class=\"n\">${moeda(m.preco_ref_brl)}<\/td>\n                <td>${seloFonte(m)}<\/td>\n                <td><button class=\"btn mini sec\" data-modelo=\"${m.id}\">selecionar<\/button><\/td>\n              <\/tr>`).join('')}<\/tbody>\n            <\/table>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"cartao\">\n        <h2><span class=\"tag-num\">15b<\/span> Importar catálogo do fabricante<\/h2>\n        <div class=\"corpo solto\">\n          <p class=\"ajuda\">Cole abaixo, ou carregue de arquivo, os dados do catálogo vigente\n          (CSV ou JSON). Cada modelo importado guarda de onde veio — tipo de fonte, documento,\n          URL e data de consulta — e passa por conferência de plausibilidade física antes de\n          entrar na base. Os modelos importados marcam-se como <strong>verificados<\/strong>\n          quando a fonte é catálogo ou ensaio.<\/p>\n\n          <div class=\"linha-btn\">\n            <button class=\"btn sec mini\" id=\"cat-modelo-csv\">Baixar planilha modelo (.csv)<\/button>\n            <button class=\"btn sec mini\" id=\"cat-arquivo-btn\">Carregar arquivo…<\/button>\n            <input type=\"file\" id=\"cat-arquivo\" accept=\".csv,.json,.txt\" class=\"oculto\">\n          <\/div>\n\n          <label class=\"campo\" style=\"margin-top:10px\">\n            <span class=\"rotulo\">Dados (CSV com cabeçalho, ou JSON)<\/span>\n            <textarea id=\"cat-texto\" rows=\"7\" style=\"font-family:var(--mono);font-size:11.5px\"\n              placeholder=\"marca;modelo;tipo;vazao_fad_m3min;pressao_nom_bar;potencia_kw;fonte_tipo;fonte_url;fonte_data\"><\/textarea>\n          <\/label>\n\n          <div class=\"linha-btn\">\n            <button class=\"btn\" id=\"cat-conferir\">Conferir<\/button>\n            <button class=\"btn sec\" id=\"cat-aplicar\" disabled>Adicionar à base<\/button>\n            <button class=\"btn sec\" id=\"cat-restaurar\">Restaurar base original<\/button>\n          <\/div>\n          <div id=\"cat-relatorio\"><\/div>\n        <\/div>\n      <\/div>`;\n\n    const upd = (id, campo) => {\n      const e = $(id); if (!e) return;\n      e.addEventListener('input', () => { estado.filtros[campo] = e.value; salvar(); comFoco(renderCatalogo); });\n    };\n    upd('#f-texto', 'texto'); upd('#f-pmin', 'pmin'); upd('#f-pmax', 'pmax');\n    ['#f-tipo:tipo', '#f-marca:marca'].forEach(s => {\n      const [sel, campo] = s.split(':'); const e = $(sel); if (!e) return;\n      e.addEventListener('change', () => { estado.filtros[campo] = e.value; salvar(); renderCatalogo(); });\n    });\n    const l = $('#f-limpar');\n    if (l) l.addEventListener('click', () => {\n      estado.filtros = { texto: '', tipo: '', marca: '', pmin: '', pmax: '', fonte: '' }; salvar(); renderCatalogo();\n    });\n    const ff = $('#f-fonte');\n    if (ff) ff.addEventListener('change', () => { estado.filtros.fonte = ff.value; salvar(); renderCatalogo(); });\n    const ex = $('#f-exportar');\n    if (ex) ex.addEventListener('click', () => baixar('catalogo-compressores.json',\n      JSON.stringify({ gerado_em: new Date().toISOString(), ferramenta: APP.NOME + ' v' + APP.VERSAO, modelos: CATALOGO }, null, 2),\n      'application/json'));\n    $$('[data-modelo]').forEach(b => b.addEventListener('click', () => {\n      estado.modelo_id = b.dataset.modelo; salvar(); irPara('selecao');\n    }));\n\n    /* ---- Importação de catálogo ---- */\n    let pendente = null;\n\n    const mc = $('#cat-modelo-csv');\n    if (mc) mc.addEventListener('click', () => baixar('modelo-catalogo-compressores.csv', CATIMPORT.modeloCSV(), 'text/csv'));\n\n    const ab = $('#cat-arquivo-btn'), ai = $('#cat-arquivo');\n    if (ab && ai) {\n      ab.addEventListener('click', () => ai.click());\n      ai.addEventListener('change', () => {\n        const fl = ai.files && ai.files[0]; if (!fl) return;\n        const fr = new FileReader();\n        fr.onload = () => { const ta = $('#cat-texto'); if (ta) { ta.value = fr.result; conferir(); } };\n        fr.readAsText(fl, 'utf-8');\n      });\n    }\n\n    function conferir() {\n      const ta = $('#cat-texto'), rel = $('#cat-relatorio'), ap = $('#cat-aplicar');\n      if (!ta || !rel) return;\n      const r = CATIMPORT.interpretar(ta.value);\n      pendente = null; if (ap) ap.disabled = true;\n\n      if (!r.ok) {\n        rel.innerHTML = `<div class=\"nota alerta\" style=\"margin-top:10px\"><strong>Não foi possível ler.<\/strong> ${esc(r.erro)}<\/div>`;\n        return;\n      }\n      pendente = r.itens.filter(i => i.validacao.ok).map(i => i.modelo);\n      if (ap) ap.disabled = pendente.length === 0;\n\n      const linhas = r.itens.map((it, i) => {\n        const m = it.modelo, v = it.validacao;\n        const cls = !v.ok ? 'alerta' : (v.avisos.length ? 'aviso' : 'ok');\n        const rot = !v.ok ? 'rejeitado' : (v.avisos.length ? 'com ressalva' : 'ok');\n        return `<tr>\n          <td class=\"n\">${i + 1}<\/td>\n          <td>${esc(m.marca || '—')} ${esc(m.modelo || '')}<\/td>\n          <td class=\"n\">${m.vazao_fad_m3min === null ? '—' : num(m.vazao_fad_m3min, 2)}<\/td>\n          <td class=\"n\">${m.potencia_kw === null ? '—' : num(m.potencia_kw, 1)}<\/td>\n          <td>${seloFonte(m)}<\/td>\n          <td><span class=\"selo ${cls}\">${rot}<\/span>\n            ${v.erros.concat(v.avisos).length\n              ? `<ul style=\"margin:4px 0 0 14px;font-size:11.5px\">${v.erros.concat(v.avisos).map(e => `<li>${esc(e)}<\/li>`).join('')}<\/ul>`\n              : ''}<\/td>\n        <\/tr>`;\n      }).join('');\n\n      rel.innerHTML = `\n        <div class=\"nota\" style=\"margin-top:10px\">\n          <strong>${r.total} registro(s) lido(s):<\/strong> ${r.validos} aproveitável(is),\n          ${r.com_erro} rejeitado(s), ${r.com_aviso} com ressalva.\n          ${r.com_erro ? ' Registros rejeitados não são adicionados.' : ''}\n        <\/div>\n        <div class=\"rolagem\" style=\"max-height:320px\"><table class=\"dados\">\n          <thead><tr><th>#<\/th><th>Modelo<\/th><th class=\"n\">m³/min<\/th><th class=\"n\">kW<\/th>\n            <th>Fonte<\/th><th>Conferência<\/th><\/tr><\/thead>\n          <tbody>${linhas}<\/tbody><\/table><\/div>`;\n    }\n\n    const cc = $('#cat-conferir');\n    if (cc) cc.addEventListener('click', conferir);\n\n    const ca = $('#cat-aplicar');\n    if (ca) ca.addEventListener('click', () => {\n      if (!pendente || !pendente.length) return;\n      // Ids duplicados receberiam o mesmo registro: renumera os importados.\n      const usados = new Set(CATALOGO.map(m => m.id));\n      pendente.forEach((m, i) => {\n        let id = m.id;\n        while (usados.has(id)) id = 'U' + String(CATALOGO.length + i + 1).padStart(3, '0') + '-' + Math.floor(Math.random() * 90 + 10);\n        usados.add(id); m.id = id;\n        CATALOGO.push(m);\n      });\n      guardarCatalogo();\n      const n = pendente.length; pendente = null;\n      const ta = $('#cat-texto'); if (ta) ta.value = '';\n      renderCatalogo();\n      alert(n + ' modelo(s) adicionado(s) à base.');\n    });\n\n    const cr = $('#cat-restaurar');\n    if (cr) cr.addEventListener('click', () => {\n      if (!confirm('Descartar todos os modelos importados e voltar à base original de '\n        + CATALOGO_ORIGINAL.length + ' modelos?')) return;\n      CATALOGO.length = 0;\n      CATALOGO_ORIGINAL.forEach(m => CATALOGO.push(JSON.parse(JSON.stringify(m))));\n      guardarCatalogo(); renderCatalogo();\n    });\n  }\n\n  /* Selo de procedência: o usuário precisa distinguir, de relance, o que\n     é dado de catálogo do que é estimativa da ferramenta. */\n  function seloFonte(m) {\n    const t = CATIMPORT.TIPOS_FONTE[m.fonte_tipo] || CATIMPORT.TIPOS_FONTE.indicativo;\n    const det = [m.fonte_doc, m.fonte_data ? 'consulta em ' + m.fonte_data : null]\n      .filter(Boolean).join(' · ');\n    const titulo = t.desc + (det ? ' — ' + det : '');\n    const selo = `<span class=\"selo ${t.classe}\" title=\"${esc(titulo)}\">${esc(t.rotulo)}<\/span>`;\n    return m.fonte_url\n      ? `${selo} <a href=\"${esc(m.fonte_url)}\" target=\"_blank\" rel=\"noopener noreferrer\"\n           style=\"font-size:11px\">fonte<\/a>`\n      : selo;\n  }\n\n  /* =================================================================\n     ABA 7 — CONFORMIDADE E RELATÓRIO\n     ================================================================= */\n  const NORMAS = [\n    { cod: 'ISO 1217:2009', titulo: 'Compressores de deslocamento — Ensaios de aceitação',\n      texto: 'Define o procedimento de medição do FAD (Free Air Delivery, vazão de ar livre efetivamente entregue), referido às condições de aspiração. É a referência que torna comparáveis as vazões declaradas por fabricantes diferentes. Exija que a proposta declare a vazão conforme esta norma, e não o \"deslocamento teórico\" do bloco, que é sempre maior.' },\n    { cod: 'ISO 8573-1:2010', titulo: 'Ar comprimido — Contaminantes e classes de pureza',\n      texto: 'Classifica o ar em três dígitos: partículas sólidas, teor de água (ponto de orvalho sob pressão) e teor de óleo. A designação [1:2:1], por exemplo, é bem mais rigorosa que [3:4:5]. Especificar a classe é o que define se o sistema precisa de secador por refrigeração, por adsorção, filtro coalescente ou carvão ativado.' },\n    { cod: 'ISO 7183:2007', titulo: 'Secadores de ar comprimido — Especificação e ensaio',\n      texto: 'Padroniza a declaração de capacidade e as condições de ensaio de secadores. Sem ela, comparar secadores de fornecedores diferentes é comparar números medidos em condições distintas.' },\n    { cod: 'ISO 1219-1', titulo: 'Sistemas e componentes pneumáticos — Símbolos gráficos',\n      texto: 'Simbologia dos diagramas pneumáticos. Aplicável à representação da central de ar e da rede em projeto executivo.' },\n    { cod: 'NR-13', titulo: 'Caldeiras, vasos de pressão, tubulações e tanques metálicos',\n      texto: 'O reservatório de ar comprimido é vaso de pressão. O ar comprimido é fluido da classe C (gás asfixiante simples). A categoria decorre do produto pressão × volume e determina prontuário, registro de segurança, periodicidade de exames interno e externo, e a habilitação do profissional. O aplicativo calcula o enquadramento na aba Rede de ar — sempre confirme na redação vigente.' },\n    { cod: 'NR-12', titulo: 'Segurança no trabalho em máquinas e equipamentos',\n      texto: 'Proteção de partes móveis (acoplamento, polias, correias), dispositivos de parada de emergência, aterramento e sinalização. Vale para a instalação da casa de máquinas, não apenas para o equipamento.' },\n    { cod: 'NR-15, Anexo I', titulo: 'Limites de tolerância para ruído contínuo',\n      texto: 'O limite para 8 horas diárias é 85 dB(A). Compressores de pistão abertos frequentemente ultrapassam esse valor a um metro, o que exige enclausuramento acústico, sala técnica isolada ou proteção auditiva com controle de exposição.' },\n    { cod: 'ABNT NBR 6493:2018', titulo: 'Emprego de cores para identificação de tubulações industriais',\n      texto: 'Tubulação de ar comprimido é identificada na cor azul. Regra simples e frequentemente descumprida em obra; entra na lista de verificação de recebimento da instalação.' },\n    { cod: 'ABNT NBR 5410', titulo: 'Instalações elétricas de baixa tensão',\n      texto: 'Dimensionamento do circuito de alimentação, proteção contra sobrecarga e curto-circuito, e aterramento do quadro do compressor. A corrente de partida de motores de indução exige atenção na escolha da proteção.' },\n  ];\n\n  function textoRelatorio() {\n    const c = calcular(); const p = estado.projeto; const m = c.modelo;\n    const L = [];\n    const sep = '='.repeat(78);\n    const sub = '-'.repeat(78);\n    const lin = (k, v) => `  ${String(k).padEnd(42, '.')} ${v}`;\n\n    const car = APP.carimbo(estado);\n    L.push(sep, 'MEMORIAL DE SELEÇÃO DE COMPRESSOR DE AR',\n      car.nome + ' v' + car.versao + ' (build ' + car.build + ')', sep, '');\n    L.push('1. IDENTIFICAÇÃO DO PROJETO', sub);\n    L.push(lin('Projeto', p.nome));\n    L.push(lin('Emissão', car.emissao));\n    L.push(lin('Ferramenta', car.nome + ' v' + car.versao));\n    L.push(lin('Soma de verificação das entradas', car.soma));\n    L.push(lin('Altitude', num(p.altitude_m, 0) + ' m'));\n    L.push(lin('Temperatura de aspiração', num(p.temp_aspiracao_C, 0) + ' °C'));\n    L.push(lin('Pressão de trabalho', num(p.pressao_trabalho_bar, 1) + ' bar'));\n    L.push(lin('Regime de operação', p.regime));\n    L.push(lin('Horas de operação', num(p.horas_ano, 0) + ' h/ano'));\n    L.push('');\n\n    L.push('2. DEMANDA DE AR COMPRIMIDO', sub);\n    p.consumidores.forEach(k => {\n      L.push(`  ${k.qtd}× ${k.nome}`);\n      L.push(`      ${num(k.vazao_m3min, 3)} m³/min · ${num(k.pressao_bar, 1)} bar · utilização ${num(k.utilizacao * 100, 0)} %`);\n    });\n    L.push('');\n    const MODOS_TXT = {\n      serie: 'utilização × simultaneidade (em série)',\n      utilizacao: 'somente fator de utilização',\n      simultaneidade: 'somente fator de simultaneidade',\n    };\n    L.push(lin('Soma bruta', num(c.dem.soma_bruta, 3) + ' m³/min'));\n    L.push(lin('Demanda ponderada', num(c.dem.soma_ponderada, 3) + ' m³/min'));\n    L.push(lin('Critério de diversidade', MODOS_TXT[c.dem.modo_diversidade] || c.dem.modo_diversidade));\n    L.push(lin('Fator de simultaneidade', num(c.dem.fator_simultaneidade, 2)));\n    L.push(lin('Fração retida da soma bruta', num(c.dem.fator_combinado * 100, 1) + ' %'\n      + ' (corte de ' + num(100 - c.dem.fator_combinado * 100, 1) + ' %)'));\n    L.push(lin('Vazão simultânea', num(c.dem.q_simultanea, 3) + ' m³/min'));\n    L.push(lin('Acréscimo por vazamentos', num(p.perdas_vazamento * 100, 0) + ' %'));\n    L.push(lin('Reserva para expansão', num(p.reserva_futura * 100, 0) + ' %'));\n    L.push(lin('Fator de correção de altitude', num(c.dem.fator_altitude, 4)));\n    L.push(lin('VAZÃO DE PROJETO', num(c.dem.q_projeto_m3min, 3) + ' m³/min ('\n      + num(ENG.UN.m3min_para_pcm(c.dem.q_projeto_m3min), 0) + ' pcm)'));\n    if (c.dem.alerta_diversidade) {\n      L.push('');\n      L.push('  [ATENÇÃO] ' + quebrar(c.dem.alerta_diversidade, 68, '             '));\n    }\n    L.push('');\n\n    L.push('3. POTÊNCIA DE COMPRESSÃO', sub);\n    L.push(lin('Pressão atmosférica local', num(ENG.pressaoAtmosferica(p.altitude_m), 2) + ' kPa'));\n    L.push(lin('Razão de compressão', num(c.pot.razao_compressao, 3)));\n    L.push(lin('Potência isentrópica', num(c.pot.potencia_isentropica_kw, 2) + ' kW'));\n    L.push(lin('Rendimento isentrópico adotado', num(c.pot.rend.isentropico, 3)));\n    L.push(lin('Potência no eixo', num(c.pot.potencia_eixo_kw, 2) + ' kW'));\n    L.push(lin('Potência elétrica absorvida', num(c.pot.potencia_eletrica_kw, 2) + ' kW'));\n    L.push(lin('Motor comercial', num(c.pot.potencia_comercial_kw, 1) + ' kW ('\n      + num(ENG.UN.kw_para_cv(c.pot.potencia_comercial_kw), 1) + ' cv)'));\n    L.push('');\n\n    L.push('4. EQUIPAMENTO SELECIONADO', sub);\n    if (m) {\n      L.push(lin('Referência', m.id));\n      L.push(lin('Marca / modelo', m.marca + ' ' + m.modelo));\n      L.push(lin('Linha', m.linha));\n      L.push(lin('Tecnologia', ENG.NOMES_TIPO[m.tipo] + ', ' + m.estagios + ' estágio(s)'));\n      L.push(lin('Lubrificação', m.lubrificacao === 'isento' ? 'isento de óleo' : 'lubrificado a óleo'));\n      L.push(lin('Vazão FAD', num(m.vazao_fad_m3min, 2) + ' m³/min (' + num(m.vazao_pcm, 0) + ' pcm)'));\n      L.push(lin('Pressão nominal / máxima', num(m.pressao_nom_bar, 1) + ' / ' + num(m.pressao_max_bar, 1) + ' bar'));\n      L.push(lin('Potência', num(m.potencia_kw, 1) + ' kW (' + num(m.potencia_cv, 1) + ' cv)'));\n      L.push(lin('Potência específica', num(m.pot_especifica, 2) + ' kW/(m³/min)'));\n      L.push(lin('Ruído', m.ruido_dba + ' dB(A)'));\n      L.push(lin('Folga sobre a demanda', num(m.folga_percentual, 1) + ' %'));\n      L.push(lin('Preço de referência', moeda(m.preco_ref_brl)));\n    } else L.push('  Nenhum modelo atende aos critérios definidos.');\n    L.push('');\n\n    L.push('5. REDE DE DISTRIBUIÇÃO', sub);\n    L.push(lin('Comprimento equivalente', num(c.Lc, 0) + ' m'));\n    L.push(lin('Diâmetro interno adotado', num(c.dEsc, 1) + ' mm'));\n    L.push(lin('Velocidade do ar', num(c.perda.velocidade_ms, 2) + ' m/s'));\n    L.push(lin('Número de Reynolds', num(c.perda.reynolds, 0)));\n    L.push(lin('Fator de atrito (Swamee-Jain)', num(c.perda.fator_atrito, 5)));\n    L.push(lin('Perda de carga', num(c.perda.perda_bar, 4) + ' bar (' + num(c.perda.perda_percentual, 2) + ' %)'));\n    L.push(lin('Pressão no ponto de uso', num(c.perda.pressao_ponto_uso_bar, 2) + ' bar'));\n    L.push('');\n\n    L.push('6. RESERVATÓRIO E NR-13', sub);\n    L.push(lin('Volume mínimo calculado', num(c.res.volume_min_l, 0) + ' L'));\n    L.push(lin('Volume comercial', num(c.res.volume_comercial_l, 0) + ' L'));\n    L.push(lin('Partidas por hora admitidas', num(c.partidas, 0)));\n    L.push(lin('Produto P·V', num(c.nr13.produto_PV, 0) + ' kPa·m³'));\n    L.push(lin('Classe do fluido', 'C — ar comprimido'));\n    L.push(lin('Categoria NR-13', c.nr13.categoria));\n    L.push(lin('Periodicidade', c.nr13.periodicidade));\n    L.push('');\n\n    L.push('7. QUALIDADE DO AR', sub);\n    L.push(lin('Classe requerida', c.qual.designacao));\n    L.push(lin('Ponto de orvalho sob pressão', c.qual.ponto_orvalho));\n    L.push(lin('Secagem', c.qual.secador));\n    L.push(lin('Filtragem', c.qual.filtragem));\n    L.push('');\n\n    L.push('8. ENERGIA', sub);\n    L.push(lin('Base de horas', c.usaPerfil\n      ? 'perfil horário — ' + num(c.horasEf, 0) + ' h/ano'\n      : 'informada no projeto — ' + num(c.horasEf, 0) + ' h/ano'));\n    L.push(lin('Fator de carga adotado', num(c.fcEf * 100, 1) + ' %'));\n    L.push(lin('Tarifa adotada', moeda(c.tarifa) + '/kWh'));\n    L.push(lin('Consumo anual', num(c.ener.energia_kwh_ano, 0) + ' kWh'));\n    L.push(lin('Custo anual de energia', moeda(c.ener.custo_ano_brl)));\n    L.push(lin('Economia potencial com VSD', sh(`      ${a.nome} ${a.dn}: ${a.qtd} un`));\n      }\n      L.push('');\n    }\n\n    L.push('10. PERFIL DE DEMANDA', sub);\n    if (!c.perf.ok) {\n      L.push('  Perfil horário sem horas de operação — não avaliado.');\n      L.push('');\n    } else if (!estado.perfil.ativo) {\n      L.push('  Perfil horário montado, porém não aplicado ao cálculo de energia. A energia da');\n      L.push('  seção 8 foi obtida por horas/ano × fator de carga médio informados no projeto.');\n      L.push('');\n    } else {\n      const a = c.perf;\n      L.push(lin('Perfil adotado', (PERFIL.PRESETS[estado.perfil.tipo] || {}).nome || 'personalizado'));\n      L.push(lin('Operação', num(a.horas_operacao_dia, 0) + ' h/dia × ' + num(a.dias_ano, 0)\n        + ' dias = ' + num(a.horas_ano, 0) + ' h/ano'));\n      L.push(lin('Demanda de pico', num(a.vazao_pico_m3min, 2) + ' m³/min'));\n      L.push(lin('Demanda média em operação', num(a.vazao_media_m3min, 2) + ' m³/min'));\n      L.push(lin('Relação pico/média', num(a.relacao_pico_media, 2)));\n      L.push(lin('Fator de carga efetivo', num(a.fator_carga_efetivo * 100, 1) + ' %'));\n      L.push(lin('Energia útil de compressão', num(a.energia_util_kwh, 0) + ' kWh/ano'));\n      L.push(lin('Energia gasta em alívio', num(a.energia_alivio_kwh, 0) + ' kWh/ano ('\n        + num(a.desperdicio_alivio_pct, 1) + ' %)'));\n      L.push(lin('Volume de ar produzido', num(a.volume_ano_m3, 0) + ' m³/ano'));\n      L.push('');\n      L.push('  Demanda horária (fração do pico):');\n      for (let b = 0; b < 24; b += 8) {\n        L.push('      ' + a.horas.slice(b, b + 8)\n          .map((v, k) => String(b + k).padStart(2, '0') + 'h ' + num(v, 2)).join('  '));\n      }\n      L.push('');\n      L.push('  Leitura: ' + a.recomendacao);\n      L.push('');\n    }\n\n    L.push('11. REFERÊNCIAS NORMATIVAS', sub);\n    NORMAS.forEach(n => L.push(`  ${n.cod} — ${n.titulo}`));\n    L.push('');\n\n    const vc = avaliarConformidade(c);\n    L.push('12. VERIFICAÇÃO DE CONFORMIDADE', sub);\n    L.push(lin('Itens verificados', vc.total));\n    L.push(lin('Conformes', vc.contagem.ok));\n    L.push(lin('Com ressalva', vc.contagem.atencao));\n    L.push(lin('Não conformes', vc.contagem.nao));\n    L.push(lin('A verificar', vc.contagem.pendente));\n    L.push(lin('Não aplicáveis', vc.contagem.na));\n    L.push(lin('Verificação automática', vc.auto_ok + ' de ' + vc.auto_total + ' conformes ('\n      + num(vc.indice_auto * 100, 1) + ' %)'));\n    L.push(lin('Checklist declaratório', vc.decl_marcados + ' de ' + vc.decl_total + ' verificados ('\n      + num(vc.progresso_declaratorio * 100, 1) + ' %)'));\n    if (vc.nao_conformes.length) {\n      L.push('');\n      L.push('  Não conformidades apontadas:');\n      vc.nao_conformes.forEach(i => L.push('      • ' + i.item + ' [' + i.norma + ']'));\n    }\n    if (vc.criticos_abertos.length) {\n      L.push('');\n      L.push('  Itens críticos ainda não verificados: ' + vc.criticos_abertos.length\n        + ' (relação completa no termo de verificação).');\n    }\n    L.push('');\n\n    L.push('13. RESSALVA SOBRE OS DADOS', sub);\n    if (m) {\n      const tf = CATIMPORT.TIPOS_FONTE[m.fonte_tipo] || CATIMPORT.TIPOS_FONTE.indicativo;\n      L.push(lin('Procedência do modelo adotado', tf.rotulo));\n      if (m.fonte_doc) L.push(lin('Documento de origem', m.fonte_doc));\n      if (m.fonte_url) L.push(lin('Endereço da fonte', m.fonte_url));\n      if (m.fonte_data) L.push(lin('Data de consulta', m.fonte_data));\n      L.push('');\n    }\n    const nVer = CATALOGO.filter(x => x.verificado).length;\n    L.push(lin('Base de modelos', CATALOGO.length + ' modelos (' + nVer + ' com procedência registrada)'));\n    L.push('');\n    if (!m || !m.verificado) {\n      L.push('  [!] O MODELO ADOTADO NESTE MEMORIAL É UMA ESTIMATIVA INDICATIVA.');\n      L.push('');\n    }\n    L.push('  As especificações dos modelos não verificados são indicativas de referência,');\n    L.push('  derivadas da potência comercial do motor e da potência específica típica de');\n    L.push('  cada tecnologia. NÃO são transcrições de catálogo. Antes de licitar, contratar');\n    L.push('  ou emitir documento técnico, substitua pelos valores do catálogo vigente do');\n    L.push('  fabricante — a aba Catálogo permite importá-los com registro de procedência —');\n    L.push('  e confirme as normas citadas em sua redação atual.');\n    L.push('');\n    L.push(sep);\n    return L.join('\\n');\n  }\n\n  /* =================================================================\n     CONFORMIDADE — lista de verificação e termo\n     ================================================================= */\n  function textoTermo() {\n    const c = calcular();\n    const v = avaliarConformidade(c);\n    const cf = estado.conformidade;\n    const p = estado.projeto;\n    const sep = '='.repeat(74), sub = '-'.repeat(74);\n    const L = [];\n    const lin = (r, val) => '  ' + (r + ' ').padEnd(38, '.') + ' ' + val;\n\n    L.push(sep);\n    L.push('  TERMO DE VERIFICAÇÃO DE CONFORMIDADE');\n    L.push('  Sistema de ar comprimido');\n    L.push(sep, '');\n    L.push(lin('Projeto', p.nome));\n    L.push(lin('Local', cf.local || '(não informado)'));\n    L.push(lin('Data da verificação', cf.data || new Date().toLocaleDateString('pt-BR')));\n    L.push(lin('Responsável técnico', cf.responsavel || '(não informado)'));\n    L.push(lin('Registro profissional', cf.registro || '(não informado)'));\n    L.push('');\n\n    L.push('1. SISTEMA VERIFICADO', sub);\n    L.push(lin('Vazão de projeto', num(c.dem.q_projeto_m3min, 2) + ' m³/min'));\n    L.push(lin('Pressão de trabalho', num(c.pTrab, 1) + ' bar'));\n    L.push(lin('Modelo de referência', c.modelo ? c.modelo.marca + ' ' + c.modelo.modelo : '(não selecionado)'));\n    L.push(lin('Potência', c.modelo ? num(c.modelo.potencia_kw, 1) + ' kW' : '—'));\n    L.push(lin('Reservatório', num(c.volTanque, 0) + ' L'));\n    L.push(lin('Categoria NR-13', c.nr13.sujeito_nr13 ? c.nr13.categoria : 'fora do limite de aplicação'));\n    L.push(lin('Classe de pureza', c.qual.designacao));\n    L.push('');\n\n    L.push('2. RESULTADO DA VERIFICAÇÃO', sub);\n    L.push(lin('Itens verificados', v.total));\n    L.push(lin('Conformes', v.contagem.ok));\n    L.push(lin('Com ressalva', v.contagem.atencao));\n    L.push(lin('Não conformes', v.contagem.nao));\n    L.push(lin('A verificar', v.contagem.pendente));\n    L.push(lin('Não aplicáveis', v.contagem.na));\n    L.push('');\n    L.push(lin('Verificação automática', v.auto_ok + ' de ' + v.auto_total + ' itens conformes ('\n      + num(v.indice_auto * 100, 1) + ' %)'));\n    L.push(lin('Checklist declaratório', v.decl_marcados + ' de ' + v.decl_total + ' itens verificados ('\n      + num(v.progresso_declaratorio * 100, 1) + ' %)'));\n    L.push('');\n    if (v.nao_conformes.length) {\n      L.push('  SITUAÇÃO: há ' + v.nao_conformes.length + ' não conformidade(s) registrada(s). '\n        + 'A instalação não deve ser recebida antes da regularização.');\n    } else if (v.criticos_abertos.length) {\n      L.push('  SITUAÇÃO: nenhuma não conformidade registrada, porém ' + v.criticos_abertos.length\n        + ' item(ns) crítico(s) permanece(m) sem verificação.');\n    } else {\n      L.push('  SITUAÇÃO: nenhum item crítico em aberto e nenhuma não conformidade registrada.');\n    }\n    L.push('');\n\n    L.push('3. NÃO CONFORMIDADES', sub);\n    if (!v.nao_conformes.length) {\n      L.push('  Nenhuma não conformidade registrada.');\n    } else {\n      v.nao_conformes.forEach((i, k) => {\n        L.push('  ' + (k + 1) + '. ' + i.item);\n        L.push('     Norma: ' + i.norma);\n        if (i.detalhe) L.push('     ' + i.detalhe);\n        if (i.obs) L.push('     Observação: ' + i.obs);\n      });\n    }\n    L.push('');\n\n    L.push('4. ITENS CRÍTICOS AINDA NÃO VERIFICADOS', sub);\n    if (!v.criticos_abertos.length) {\n      L.push('  Nenhum. Todos os itens críticos foram verificados ou declarados não aplicáveis.');\n    } else {\n      v.criticos_abertos.forEach((i, k) => {\n        L.push('  ' + (k + 1) + '. ' + i.item + '  [' + i.norma + ']');\n      });\n    }\n    L.push('');\n\n    L.push('5. RELAÇÃO COMPLETA DOS ITENS', sub);\n    CONFORM.porGrupo(v).forEach(g => {\n      L.push('');\n      L.push('  ' + g.nome.toUpperCase());\n      g.itens.forEach(i => {\n        L.push('    [' + CONFORM.ROTULO[i.status].toUpperCase().padEnd(13) + '] ' + i.item);\n        L.push('        Norma: ' + i.norma);\n        if (i.detalhe) L.push('        ' + i.detalhe);\n        if (i.obs) L.push('        Observação: ' + i.obs);\n      });\n    });\n    L.push('');\n\n    L.push('6. RESSALVAS', sub);\n    L.push('  a) Os itens assinalados como automáticos decorrem exclusivamente dos dados');\n    L.push('     lançados neste aplicativo. Não substituem inspeção presencial, ensaio nem');\n    L.push('     análise de documentação do fornecedor.');\n    L.push('  b) As normas técnicas e as normas regulamentadoras citadas são revisadas');\n    L.push('     periodicamente. Confirme a edição vigente antes de usar este termo como');\n    L.push('     documento oficial.');\n    L.push('  c) As especificações dos modelos do catálogo embarcado são indicativas de');\n    L.push('     referência e não são transcrições de catálogo de fabricante.');\n    L.push('');\n    L.push(sub);\n    L.push('  ______________________________________');\n    L.push('  ' + (cf.responsavel || 'Responsável técnico'));\n    L.push('  ' + (cf.registro || 'Registro profissional'));\n    L.push('');\n    L.push('  Emitido em ' + new Date().toLocaleString('pt-BR') + ' — CompressorSelect Pro');\n    L.push(sep);\n    return L.join('\\n');\n  }\n\n  function renderConformidade() {\n    const el = $('#painel-conformidade');\n    const c = calcular();\n    const v = avaliarConformidade(c);\n    const cf = estado.conformidade;\n    const filtro = cf.filtro || '';\n\n    const pct = k => (v.total ? v.contagem[k] / v.total * 100 : 0).toFixed(1);\n    const medidor = ['ok', 'atencao', 'nao', 'pendente', 'na']\n      .filter(k => v.contagem[k])\n      .map(k => `<i class=\"m-${k}\" style=\"width:${pct(k)}%\" title=\"${CONFORM.ROTULO[k]}: ${v.contagem[k]}\"><\/i>`).join('');\n\n    const visivel = i => {\n      if (filtro === 'abertos') return i.status === 'nao' || i.status === 'pendente' || i.status === 'atencao';\n      if (filtro === 'nao') return i.status === 'nao';\n      if (filtro === 'pendente') return i.status === 'pendente';\n      if (filtro === 'criticos') return i.critico;\n      return true;\n    };\n\n    const grupos = CONFORM.porGrupo(v).map(g => {\n      const itens = g.itens.filter(visivel);\n      if (!itens.length) return '';\n      const abertos = g.itens.filter(i => i.status === 'nao').length;\n      return `\n        <div class=\"conf-grupo\">\n          <h4>${esc(g.nome)}\n            ${abertos ? `<span class=\"selo erro\">${abertos} não conforme${abertos > 1 ? 's' : ''}<\/span>` : ''}\n            <span style=\"margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0\">\n              ${itens.length} de ${g.itens.length} item(ns)<\/span><\/h4>\n          ${itens.map(i => {\n            const trava = i.tipo === 'auto' && i.automatico_status === 'nao';\n            return `\n            <div class=\"conf-item s-${i.status}\">\n              <div class=\"linha1\">\n                <div class=\"txt\">${esc(i.item)}\n                  <span class=\"norma-ref\">${esc(i.norma)}<\/span><\/div>\n                <span class=\"selo ${i.status === 'ok' ? 'ok' : i.status === 'nao' ? 'erro'\n                  : i.status === 'atencao' ? 'aviso' : 'info'}\">${esc(CONFORM.ROTULO[i.status])}<\/span>\n                ${i.critico ? '<span class=\"selo aviso\">crítico<\/span>' : ''}\n                <span class=\"selo info\">${i.tipo === 'auto' ? 'automático' : 'declaratório'}<\/span>\n              <\/div>\n              ${i.detalhe ? `<div class=\"detalhe\">${esc(i.detalhe)}<\/div>` : ''}\n              ${trava ? '<div class=\"detalhe\" style=\"color:var(--alerta)\">A verificação automática aponta divergência nos dados do projeto: corrija o projeto para que este item possa ser dado por conforme.<\/div>' : ''}\n              <div class=\"ctrl\">\n                <select data-conf-marca=\"${esc(i.id)}\" aria-label=\"Situação de ${esc(i.item)}\">\n                  <option value=\"\"${!i.marca ? ' selected' : ''}>${i.tipo === 'auto' ? 'Manter automático' : 'A verificar'}<\/option>\n                  <option value=\"ok\"${i.marca === 'ok' ? ' selected' : ''}>Verificado — conforme<\/option>\n                  <option value=\"nao\"${i.marca === 'nao' ? ' selected' : ''}>Verificado — não conforme<\/option>\n                  <option value=\"na\"${i.marca === 'na' ? ' selected' : ''}>Não aplicável<\/option>\n                <\/select>\n                <input type=\"text\" data-conf-obs=\"${esc(i.id)}\" value=\"${esc(i.obs)}\"\n                       placeholder=\"Observação, evidência ou documento de referência\">\n              <\/div>\n            <\/div>`;\n          }).join('')}\n        <\/div>`;\n    }).join('');\n\n    el.innerHTML = `\n      <div class=\"grade\" style=\"gap:16px\">\n\n        <div class=\"cartao\">\n          <h2><span class=\"tag-num\">C1<\/span> Situação da conformidade<\/h2>\n          <div class=\"corpo solto\">\n            <div class=\"kpi-linha\">\n              <div class=\"kpi ${v.contagem.nao ? 'ruim' : 'bom'}\"><span class=\"k\">Verificação automática<\/span><span class=\"v\">${num(v.indice_auto * 100, 0)} <small>% de ${v.auto_total}<\/small><\/span><\/div>\n              <div class=\"kpi destaque\"><span class=\"k\">Checklist declaratório<\/span><span class=\"v\">${v.decl_marcados} <small>de ${v.decl_total}<\/small><\/span><\/div>\n              <div class=\"kpi bom\"><span class=\"k\">Conformes<\/span><span class=\"v\">${v.contagem.ok}<\/span><\/div>\n              <div class=\"kpi\"><span class=\"k\">C
