ocalizada. */\n  const ACESSORIOS = {\n    cotovelo90:     { nome: 'Cotovelo 90°',            leD: 30 },\n    cotovelo45:     { nome: 'Cotovelo 45°',            leD: 16 },\n    curva90:        { nome: 'Curva longa 90°',         leD: 20 },\n    te_passagem:    { nome: 'Tê — passagem direta',    leD: 20 },\n    te_derivacao:   { nome: 'Tê — saída lateral',      leD: 60 },\n    valvula_esfera: { nome: 'Válvula esfera (aberta)', leD: 8 },\n    valvula_gaveta: { nome: 'Válvula gaveta (aberta)', leD: 8 },\n    valvula_globo:  { nome: 'Válvula globo (aberta)',  leD: 340 },\n    valvula_retencao:{ nome: 'Válvula de retenção',    leD: 100 },\n    reducao:        { nome: 'Redução',                 leD: 15 },\n    entrada:        { nome: 'Entrada de linha',        leD: 17 },\n    saida:          { nome: 'Saída de linha',          leD: 35 },\n  };\n\n  /* ---------- Perda de carga concentrada em equipamentos ----------\n     Valores típicos de Δp com elemento limpo, em bar. Filtro entupido\n     chega a triplicar — daí a recomendação de manômetro diferencial. */\n  const EQUIPAMENTOS = {\n    compressor:   { nome: 'Compressor',              dp: 0,    fonte: true,  cor: '#0B57A4' },\n    reservatorio: { nome: 'Reservatório',            dp: 0.02, cor: '#0B57A4' },\n    secador_ref:  { nome: 'Secador por refrigeração', dp: 0.20, cor: '#12735A' },\n    secador_ads:  { nome: 'Secador por adsorção',     dp: 0.30, cor: '#12735A' },\n    filtro_part:  { nome: 'Filtro de partículas',     dp: 0.10, cor: '#7A5AA8' },\n    filtro_coal:  { nome: 'Filtro coalescente',       dp: 0.15, cor: '#7A5AA8' },\n    filtro_carvao:{ nome: 'Filtro de carvão ativado', dp: 0.12, cor: '#7A5AA8' },\n    purgador:     { nome: 'Purgador automático',      dp: 0,    cor: '#5C6B7A' },\n    juncao:       { nome: 'Junção / tê',              dp: 0,    cor: '#5C6B7A' },\n    consumo:      { nome: 'Ponto de consumo',         dp: 0,    consumidor: true, cor: '#E8A200' },\n  };\n\n  const MATERIAIS = {\n    aco_galv:  { nome: 'Aço galvanizado', rugosidade: 0.15, custo_m: 78 },\n    aco_carb:  { nome: 'Aço carbono',     rugosidade: 0.30, custo_m: 62 },\n    cobre:     { nome: 'Cobre',           rugosidade: 0.0015, custo_m: 145 },\n    aluminio:  { nome: 'Alumínio (engate rápido)', rugosidade: 0.0015, custo_m: 168 },\n    inox:      { nome: 'Aço inoxidável',  rugosidade: 0.015, custo_m: 290 },\n    ppr:       { nome: 'PPR para ar comprimido', rugosidade: 0.007, custo_m: 54 },\n  };\n\n  let seqNo = 0, seqTr = 0;\n  function novoIdNo() { return 'N' + (++seqNo); }\n  function novoIdTrecho() { return 'T' + (++seqTr); }\n  function sincronizarSequencia(rede) {\n    rede.nos.forEach(n => { const v = +String(n.id).slice(1); if (v > seqNo) seqNo = v; });\n    rede.trechos.forEach(t => { const v = +String(t.id).slice(1); if (v > seqTr) seqTr = v; });\n  }\n\n  function redeVazia() {\n    return {\n      escala_m_px: 0.25,          // 1 pixel = 0,25 m  (4 px por metro)\n      material: 'aco_galv',\n      pressao_fonte_bar: 8,\n      temp_linha_C: 30,\n      altitude_m: 0,\n      vel_max_ms: 9,\n      perda_admissivel_bar: 0.10,\n      nos: [], trechos: [],\n    };\n  }\n\n  function addNo(rede, tipo, x, y, extra) {\n    const n = Object.assign({\n      id: novoIdNo(), tipo, x: Math.round(x), y: Math.round(y),\n      nome: '', demanda_m3min: tipo === 'consumo' ? 0.3 : 0,\n      pressao_min_bar: tipo === 'consumo' ? 6.0 : 0,\n    }, extra || {});\n    if (!n.nome) n.nome = rotuloPadrao(rede, tipo);\n    rede.nos.push(n); return n;\n  }\n\n  function rotuloPadrao(rede, tipo) {\n    const base = { compressor: 'Compressor', reservatorio: 'Reservatório', secador_ref: 'Secador',\n      secador_ads: 'Secador', filtro_part: 'Filtro', filtro_coal: 'Filtro', filtro_carvao: 'Filtro',\n      purgador: 'Purgador', juncao: 'Nó', consumo: 'Ponto' }[tipo] || 'Nó';\n    const n = rede.nos.filter(x => x.tipo === tipo).length + 1;\n    return base + ' ' + n;\n  }\n\n  function addTrecho(rede, de, para, extra) {\n    if (de === para) return null;\n    if (rede.trechos.some(t => (t.de === de && t.para === para) || (t.de === para && t.para === de))) return null;\n    const t = Object.assign({\n      id: novoIdTrecho(), de, para, dn: null, manual: false,\n      acessorios: {},\n    }, extra || {});\n    rede.trechos.push(t); return t;\n  }\n\n  function removerNo(rede, id) {\n    rede.nos = rede.nos.filter(n => n.id !== id);\n    rede.trechos = rede.trechos.filter(t => t.de !== id && t.para !== id);\n  }\n  function removerTrecho(rede, id) { rede.trechos = rede.trechos.filter(t => t.id !== id); }\n\n  function no(rede, id) { return rede.nos.find(n => n.id === id); }\n\n  /* ---------- Geometria ---------- */\n  function comprimentoReto(rede, t) {\n    const a = no(rede, t.de), b = no(rede, t.para);\n    if (!a || !b) return 0;\n    return Math.hypot(b.x - a.x, b.y - a.y) * rede.escala_m_px;\n  }\n\n  function comprimentoAcessorios(rede, t, di_mm) {\n    let soma = 0;\n    Object.keys(t.acessorios || {}).forEach(k => {\n      const a = ACESSORIOS[k]; if (!a) return;\n      soma += (t.acessorios[k] || 0) * a.leD * (di_mm / 1000);\n    });\n    return soma;\n  }\n\n  function comprimentoEquivalente(rede, t, di_mm) {\n    return comprimentoReto(rede, t) + comprimentoAcessorios(rede, t, di_mm);\n  }\n\n  /* ---------- Acessórios sugeridos pela geometria ------------------\n     Nó de grau 2 com mudança de direção significativa ganha cotovelo;\n     nó de grau 3 gera um tê de passagem e um de derivação; grau maior\n     vira distribuidor. Cada trecho absorve metade dos acessórios de\n     cada extremidade. */\n  function sugerirAcessorios(rede) {\n    const grau = {}; rede.nos.forEach(n => grau[n.id] = []);\n    rede.trechos.forEach(t => { if (grau[t.de]) grau[t.de].push(t); if (grau[t.para]) grau[t.para].push(t); });\n\n    rede.trechos.forEach(t => { if (!t.manual_acessorios) t.acessorios = {}; });\n\n    rede.nos.forEach(n => {\n      const ts = grau[n.id] || [];\n      const add = (t, k, q) => {\n        if (t.manual_acessorios) return;\n        t.acessorios[k] = (t.acessorios[k] || 0) + q;\n      };\n      if (n.tipo === 'consumo') { ts.forEach(t => add(t, 'saida', 1)); return; }\n      if (n.tipo === 'compressor') { ts.forEach(t => add(t, 'entrada', 1)); return; }\n      if (ts.length === 2) {\n        const ang = anguloEntre(rede, n, ts[0], ts[1]);\n        if (ang < 150) ts.forEach(t => add(t, ang < 115 ? 'cotovelo90' : 'cotovelo45', 0.5));\n      } else if (ts.length === 3) {\n        ts.forEach((t, i) => add(t, i === 2 ? 'te_derivacao' : 'te_passagem', 0.5));\n      } else if (ts.length > 3) {\n        ts.forEach(t => add(t, 'te_derivacao', 0.5));\n      }\n    });\n    return rede;\n  }\n\n  function anguloEntre(rede, n, t1, t2) {\n    const outro = t => no(rede, t.de === n.id ? t.para : t.de);\n    const a = outro(t1), b = outro(t2);\n    if (!a || !b) return 180;\n    const v1 = Math.atan2(a.y - n.y, a.x - n.x), v2 = Math.atan2(b.y - n.y, b.x - n.x);\n    let d = Math.abs(v1 - v2) * 180 / Math.PI;\n    if (d > 180) d = 360 - d;\n    return d;\n  }\n\n  /* ---------- Topologia ---------- */\n  function adjacencia(rede) {\n    const adj = {}; rede.nos.forEach(n => adj[n.id] = []);\n    rede.trechos.forEach(t => {\n      if (adj[t.de]) adj[t.de].push({ t, viz: t.para, sentido: +1 });\n      if (adj[t.para]) adj[t.para].push({ t, viz: t.de, sentido: -1 });\n    });\n    return adj;\n  }\n\n  function fontes(rede) { return rede.nos.filter(n => (EQUIPAMENTOS[n.tipo] || {}).fonte); }\n  function consumidores(rede) { return rede.nos.filter(n => (EQUIPAMENTOS[n.tipo] || {}).consumidor); }\n\n  /**\n   * Árvore geradora por busca em largura a partir da fonte.\n   * Os trechos que não entram na árvore fecham as malhas independentes.\n   */\n  function arvoreGeradora(rede, idFonte) {\n    const adj = adjacencia(rede);\n    const pai = {}, paiTrecho = {}, ordem = [], visto = {};\n    const fila = [idFonte]; visto[idFonte] = true; pai[idFonte] = null;\n    while (fila.length) {\n      const u = fila.shift(); ordem.push(u);\n      (adj[u] || []).forEach(({ t, viz }) => {\n        if (!visto[viz]) { visto[viz] = true; pai[viz] = u; paiTrecho[viz] = t; fila.push(viz); }\n      });\n    }\n    const naArvore = new Set(Object.values(paiTrecho).map(t => t.id));\n    return { pai, paiTrecho, ordem, visto, naArvore,\n      cordas: rede.trechos.filter(t => !naArvore.has(t.id)) };\n  }\n\n  /** Caminho de nós da raiz até o nó, pela árvore geradora. */\n  function caminhoAteRaiz(arv, id) {\n    const c = []; let u = id;\n    while (u !== null && u !== undefined) { c.push(u); u = arv.pai[u]; }\n    return c;\n  }\n\n  /** Malhas independentes: cada corda + o caminho na árvore entre suas pontas. */\n  function malhas(rede, arv) {\n    return arv.cordas.map(corda => {\n      const ca = caminhoAteRaiz(arv, corda.de).reverse();\n      const cb = caminhoAteRaiz(arv, corda.para).reverse();\n      let i = 0; while (i < ca.length && i < cb.length && ca[i] === cb[i]) i++;\n      const ancestral = i - 1;\n      const ramoA = ca.slice(ancestral).reverse();   // de.de → ancestral\n      const ramoB = cb.slice(ancestral + 1);          // ancestral → para\n      const seq = ramoA.concat(ramoB);                // percurso da malha\n      const trechos = [];\n      for (let k = 0; k < seq.length - 1; k++) {\n        const t = rede.trechos.find(x =>\n          (x.de === seq[k] && x.para === seq[k + 1]) || (x.de === seq[k + 1] && x.para === seq[k]));\n        if (t) trechos.push({ t, sentido: t.de === seq[k] ? +1 : -1 });\n      }\n      trechos.push({ t: corda, sentido: corda.de === seq[seq.length - 1] ? +1 : -1 });\n      return trechos;\n    });\n  }\n\n  /* ---------- Perda de carga de um trecho ---------- */\n  function perdaTrecho(rede, t, Q_m3min, di_mm, pAbs_bar) {\n    if (!di_mm || Math.abs(Q_m3min) < 1e-12) {\n      return { perda_bar: 0, velocidade_ms: 0, reynolds: 0, fator_atrito: 0, comprimento_eq_m: comprimentoEquivalente(rede, t, di_mm || 25) };\n    }\n    const L = comprimentoEquivalente(rede, t, di_mm);\n    const r = ENG.perdaCarga({\n      vazao_m3min: Math.abs(Q_m3min),\n      pressao_linha_bar: Math.max(pAbs_bar - ENG.pressaoAtmosferica(rede.altitude_m) / 100, 0.5),\n      altitude_m: rede.altitude_m,\n      diametro_mm: di_mm,\n      comprimento_equivalente_m: L,\n      temp_linha_C: rede.temp_linha_C,\n      rugosidade_mm: (MATERIAIS[rede.material] || MATERIAIS.aco_galv).rugosidade,\n      vel_max_ms: rede.vel_max_ms,\n    });\n    return {\n      perda_bar: r.perda_bar, velocidade_ms: r.velocidade_ms, reynolds: r.reynolds,\n      fator_atrito: r.fator_atrito, comprimento_eq_m: L, regime: r.regime,\n    };\n  }\n\n  /* ---------- Distribuição de vazões ---------- */\n  /**\n   * Vazões iniciais pela árvore: cada trecho carrega a soma das demandas\n   * da sub-árvore a jusante. As cordas começam com vazão nula.\n   */\n  function vazoesIniciais(rede, arv) {\n    const Q = {}; rede.trechos.forEach(t => Q[t.id] = 0);\n    const acum = {}; rede.nos.forEach(n => acum[n.id] = n.tipo === 'consumo' ? (+n.demanda_m3min || 0) : 0);\n    for (let i = arv.ordem.length - 1; i >= 0; i--) {\n      const u = arv.ordem[i], t = arv.paiTrecho[u];\n      if (!t) continue;\n      Q[t.id] = (t.de === arv.pai[u] ? +1 : -1) * acum[u];\n      acum[arv.pai[u]] += acum[u];\n    }\n    return Q;\n  }\n\n  /**\n   * Hardy Cross. Para cada malha calcula-se a correção\n   *     ΔQ = − Σ(s·Δp) / Σ(n·|Δp/Q|)\n   * e aplica-se a todos os trechos da malha, respeitando a orientação.\n   * A perda é recalculada a cada iteração com Darcy-Weisbach, portanto\n   * o expoente n = 2 entra apenas na derivada aproximada.\n   */\n  function resolverVazoes(rede, arv, diametros, pFonte, opc) {\n    const o = opc || {};\n    const tol = o.tolerancia || 1e-6;\n    const maxIt = o.max_iteracoes || 200;\n    const Q = vazoesIniciais(rede, arv);\n    const ml = malhas(rede, arv);\n    if (!ml.length) return { Q, iteracoes: 0, convergiu: true, malhas: 0 };\n\n    let it = 0, maxDelta = Infinity;\n    for (; it < maxIt && maxDelta > tol; it++) {\n      maxDelta = 0;\n      ml.forEach(malha => {\n        let numer = 0, denom = 0;\n        malha.forEach(({ t, sentido }) => {\n          const q = Q[t.id];\n          const p = perdaTrecho(rede, t, q, diametros[t.id], pFonte);\n          const dp = p.perda_bar * Math.sign(q || 1);\n          numer += sentido * dp;\n          denom += 2 * Math.abs(p.perda_bar) / Math.max(Math.abs(q), 1e-9);\n        });\n        if (denom < 1e-12) return;\n        const dQ = -numer / denom;\n        malha.forEach(({ t, sentido }) => { Q[t.id] += sentido * dQ; });\n        maxDelta = Math.max(maxDelta, Math.abs(dQ));\n      });\n    }\n    return { Q, iteracoes: it, convergiu: maxDelta <= tol, malhas: ml.length, residuo: maxDelta };\n  }\n\n  /* ---------- Pressões nodais ---------- */\n  function propagarPressoes(rede, arv, Q, diametros, pFonte) {\n    const P = {}; P[arv.ordem[0]] = pFonte;\n    const detalhe = {};\n    arv.ordem.forEach(u => {\n      const t = arv.paiTrecho[u]; if (!t) return;\n      const pai = arv.pai[u];\n      const pPai = P[pai] === undefined ? pFonte : P[pai];\n      const q = Q[t.id];\n      const p = perdaTrecho(rede, t, q, diametros[t.id], pPai + ENG.pressaoAtmosferica(rede.altitude_m) / 100);\n      // O sentido do escoamento decide quem perde pressão\n      const desce = (t.de === pai && q >= 0) || (t.para === pai && q < 0);\n      P[u] = pPai - (desce ? 1 : -1) * p.perda_bar;\n      const eq = EQUIPAMENTOS[no(rede, u).tipo];\n      if (eq && eq.dp) P[u] -= eq.dp;\n      detalhe[t.id] = Object.assign({ vazao_m3min: q }, p);\n    });\n    // Trechos-corda: perda calculada, mas a pressão dos nós já veio da árvore\n    rede.trechos.forEach(t => {\n      if (detalhe[t.id]) return;\n      const pRef = P[t.de] === undefined ? pFonte : P[t.de];\n      detalhe[t.id] = Object.assign({ vazao_m3min: Q[t.id] },\n        perdaTrecho(rede, t, Q[t.id], diametros[t.id], pRef + ENG.pressaoAtmosferica(rede.altitude_m) / 100));\n    });\n    return { P, detalhe };\n  }\n\n  /* ---------- Diâmetros ---------- */\n  function diametrosAtuais(rede, padrao) {\n    const d = {};\n    rede.trechos.forEach(t => { d[t.id] = t.dn || padrao || ENG.DN_ACO[5].di; });\n    return d;\n  }\n\n  function dnMaisProximo(di) {\n    let melhor = ENG.DN_ACO[0];\n    ENG.DN_ACO.forEach(o => { if (Math.abs(o.di - di) < Math.abs(melhor.di - di)) melhor = o; });\n    return melhor;\n  }\n  function nomeDN(di) { const o = ENG.DN_ACO.find(x => Math.abs(x.di - di) < 0.05); return o ? o.dn : num1(di) + ' mm'; }\n  function num1(v) { return Math.round(v * 10) / 10; }\n  function proximoDN(di) {\n    const i = ENG.DN_ACO.findIndex(o => Math.abs(o.di - di) < 0.05);\n    return i >= 0 && i < ENG.DN_ACO.length - 1 ? ENG.DN_ACO[i + 1].di : null;\n  }\n\n  /* ---------- Cálculo completo ---------- */\n  function calcular(rede, opc) {\n    const o = opc || {};\n    const val = validar(rede);\n    if (!val.ok) return { ok: false, erros: val.erros, avisos: val.avisos };\n\n    sugerirAcessorios(rede);\n    const fonte = fontes(rede)[0];\n    const arv = arvoreGeradora(rede, fonte.id);\n    const pFonte = +rede.pressao_fonte_bar;\n    const diam = o.diametros || diametrosAtuais(rede);\n\n    const sol = resolverVazoes(rede, arv, diam, pFonte, o);\n    const { P, detalhe } = propagarPressoes(rede, arv, sol.Q, diam, pFonte);\n\n    const trechos = rede.trechos.map(t => {\n      const d = detalhe[t.id] || {};\n      const di = diam[t.id];\n      return {\n        id: t.id, de: t.de, para: t.para, di_mm: di, dn: nomeDN(di),\n        comprimento_m: comprimentoReto(rede, t),\n        comprimento_eq_m: d.comprimento_eq_m || 0,\n        vazao_m3min: Math.abs(d.vazao_m3min || 0),\n        sentido: (d.vazao_m3min || 0) >= 0 ? 'de→para' : 'para→de',\n        velocidade_ms: d.velocidade_ms || 0,\n        perda_bar: d.perda_bar || 0,\n        reynolds: d.reynolds || 0,\n        fator_atrito: d.fator_atrito || 0,\n        excede_velocidade: (d.velocidade_ms || 0) > rede.vel_max_ms,\n        acessorios: t.acessorios,\n        manual: !!t.manual,\n      };\n    });\n\n    const nos = rede.nos.map(n => {\n      const p = P[n.id];\n      const eq = EQUIPAMENTOS[n.tipo] || {};\n      const critico = eq.consumidor && p !== undefined && p < (+n.pressao_min_bar || 0);\n      return {\n        id: n.id, nome: n.nome, tipo: n.tipo, x: n.x, y: n.y,\n        demanda_m3min: +n.demanda_m3min || 0,\n        pressao_bar: p, pressao_min_bar: +n.pressao_min_bar || 0,\n        margem_bar: p === undefined ? null : p - (+n.pressao_min_bar || 0),\n        critico, desconectado: !arv.visto[n.id],\n      };\n    });\n\n    const cons = nos.filter(n => (EQUIPAMENTOS[n.tipo] || {}).consumidor);\n    const pressoes = cons.map(n => n.pressao_bar).filter(v => v !== undefined);\n    const perdaTotal = pressoes.length ? pFonte - Math.min.apply(null, pressoes) : 0;\n    const noCritico = cons.slice().sort((a, b) => (a.pressao_bar || 9e9) - (b.pressao_bar || 9e9))[0] || null;\n\n    // A perda total mistura duas coisas de natureza distinta: o atrito na\n    // tubulação, que o projetista controla pelo diâmetro, e a perda fixa dos\n    // equipamentos de tratamento (secador, filtros), que independe do traçado.\n    // O limite de perda admissível é critério de TUBULAÇÃO — comparar o total\n    // contra ele reprovaria qualquer rede com secador.\n    let perdaTubo = 0, perdaEquip = 0;\n    if (noCritico) {\n      const caminho = caminhoAteRaiz(arv, noCritico.id);\n      for (let i = 0; i < caminho.length - 1; i++) {\n        const tt = rede.trechos.find(x =>\n          (x.de === caminho[i] && x.para === caminho[i + 1]) || (x.de === caminho[i + 1] && x.para === caminho[i]));\n        if (tt && detalhe[tt.id]) perdaTubo += detalhe[tt.id].perda_bar;\n        const nn = no(rede, caminho[i]);\n        const ee = nn ? EQUIPAMENTOS[nn.tipo] : null;\n        if (ee && ee.dp) perdaEquip += ee.dp;\n      }\n    }\n\n    return {\n      ok: true, erros: val.erros, avisos: val.avisos,\n      trechos, nos, malhas: sol.malhas, iteracoes: sol.iteracoes, convergiu: sol.convergiu,\n      demanda_total_m3min: cons.reduce((s, n) => s + n.demanda_m3min, 0),\n      comprimento_total_m: trechos.reduce((s, t) => s + t.comprimento_m, 0),\n      comprimento_eq_total_m: trechos.reduce((s, t) => s + t.comprimento_eq_m, 0),\n      perda_total_bar: perdaTotal,\n      perda_tubulacao_bar: perdaTubo,\n      perda_equipamentos_bar: perdaEquip,\n      pressao_fonte_bar: pFonte,\n      pressao_minima_bar: pressoes.length ? Math.min.apply(null, pressoes) : null,\n      no_critico: noCritico,\n      criticos: nos.filter(n => n.critico),\n      velocidade_max_ms: trechos.reduce((m, t) => Math.max(m, t.velocidade_ms), 0),\n      atende: !nos.some(n => n.critico) && perdaTubo <= rede.perda_admissivel_bar + 1e-9\n        && !trechos.some(t => t.excede_velocidade),\n    };\n  }\n\n  /* ---------- Validação ---------- */\n  function validar(rede) {\n    const erros = [], avisos = [];\n    const f = fontes(rede), c = consumidores(rede);\n    if (!f.length) erros.push('A rede não tem compressor. Adicione a fonte de ar.');\n    if (f.length > 1) avisos.push('Há mais de um compressor. O cálculo usa o primeiro como fonte; para centrais em paralelo, represente-as por um único nó equivalente.');\n    if (!c.length) erros.push('A rede não tem ponto de consumo.');\n    if (!rede.trechos.length && rede.nos.length > 1) erros.push('Os equipamentos não estão ligados por tubulação.');\n    if (c.some(n => !(+n.demanda_m3min > 0))) avisos.push('Há ponto de consumo com demanda nula.');\n\n    if (f.length && rede.trechos.length) {\n      const arv = arvoreGeradora(rede, f[0].id);\n      const soltos = rede.nos.filter(n => !arv.visto[n.id]);\n      if (soltos.length) erros.push('Sem ligação com o compressor: ' + soltos.map(n => n.nome).join(', ') + '.');\n    }\n    rede.trechos.forEach(t => {\n      if (comprimentoReto(rede, t) < 0.05) avisos.push('Trecho ' + t.id + ' tem comprimento praticamente nulo.');\n    });\n    return { ok: erros.length === 0, erros, avisos };\n  }\n\n  /* ---------- Autodimensionamento ---------------------------------\n     Duas fases. Primeiro cada trecho recebe o menor diâmetro que\n     respeita a velocidade máxima — critério local, resolvido de uma vez.\n     Depois, enquanto algum ponto ficar abaixo da pressão mínima ou a\n     perda total estourar o limite, aumenta-se um degrau no trecho de\n     maior perda no caminho até o ponto crítico. É guloso, mas converge\n     rápido porque a perda cai com a quinta potência do diâmetro. */\n  function autoDimensionar(rede, opc) {\n    const o = opc || {};\n    const respeitarManuais = o.respeitar_manuais !== false;\n    const val = validar(rede);\n    if (!val.ok) return { ok: false, erros: val.erros };\n\n    const fonte = fontes(rede)[0];\n    const arv = arvoreGeradora(rede, fonte.id);\n    const pFonte = +rede.pressao_fonte_bar;\n    const diam = {};\n\n    // Fase 1 — velocidade\n    const solInicial = resolverVazoes(rede, arv, diametrosAtuais(rede, ENG.DN_ACO[7].di), pFonte, o);\n    rede.trechos.forEach(t => {\n      if (respeitarManuais && t.manual && t.dn) { diam[t.id] = t.dn; return; }\n      const q = Math.abs(solInicial.Q[t.id]);\n      let escolhido = ENG.DN_ACO[ENG.DN_ACO.length - 1].di;\n      for (const op of ENG.DN_ACO) {\n        const p = perdaTrecho(rede, t, q, op.di, pFonte);\n        if (p.velocidade_ms <= rede.vel_max_ms) { escolhido = op.di; break; }\n      }\n      diam[t.id] = escolhido;\n    });\n\n    // Fase 2 — pressão no ponto crítico.\n    // Antes de iterar, verifica quais pontos são inalcançáveis por diâmetro:\n    // se a pressão exigida já supera a da fonte descontada a perda fixa dos\n    // equipamentos no caminho, engrossar tubo não resolve.\n    const inviaveis = [];\n    {\n      const rTeste = calcular(rede, Object.assign({}, o, { diametros: diam }));\n      if (rTeste.ok) {\n        rTeste.nos.filter(n => (EQUIPAMENTOS[n.tipo] || {}).consumidor).forEach(n => {\n          const caminho = caminhoAteRaiz(arv, n.id);\n          let dpEquip = 0;\n          caminho.forEach(id => { const e = EQUIPAMENTOS[(no(rede, id) || {}).tipo]; if (e && e.dp) dpEquip += e.dp; });\n          const tetoAlcancavel = pFonte - dpEquip;\n          if (n.pressao_min_bar > tetoAlcancavel + 1e-9) {\n            inviaveis.push({ no: n.nome, exigido: n.pressao_min_bar, teto: tetoAlcancavel, perda_equipamentos: dpEquip });\n          }\n        });\n      }\n    }\n\n    const historico = [];\n    let r = calcular(rede, Object.assign({}, o, { diametros: diam }));\n    let guarda = 0;\n    const parar = () => {\n      // Ignora os pontos inviáveis: continuar por causa deles seria iterar em vão\n      const nomes = inviaveis.map(x => x.no);\n      const criticosReais = (r.criticos || []).filter(c => nomes.indexOf(c.nome) === -1);\n      return criticosReais.length === 0\n        && r.perda_tubulacao_bar <= rede.perda_admissivel_bar + 1e-9\n        && !r.trechos.some(t => t.excede_velocidade);\n    };\n    while (r.ok && !parar() && guarda++ < 60) {\n      const nomesInv = inviaveis.map(x => x.no);\n      const reais = r.criticos.filter(c => nomesInv.indexOf(c.nome) === -1);\n      const alvo = reais.length\n        ? reais.slice().sort((a, b) => a.margem_bar - b.margem_bar)[0]\n        : r.no_critico;\n      if (!alvo) break;\n      const caminho = caminhoAteRaiz(arv, alvo.id);\n      const cand = [];\n      for (let i = 0; i < caminho.length - 1; i++) {\n        const t = rede.trechos.find(x =>\n          (x.de === caminho[i] && x.para === caminho[i + 1]) || (x.de === caminho[i + 1] && x.para === caminho[i]));\n        if (!t) continue;\n        if (respeitarManuais && t.manual && t.dn) continue;\n        const info = r.trechos.find(x => x.id === t.id);\n        if (info && proximoDN(diam[t.id])) cand.push({ t, perda: info.perda_bar });\n      }\n      if (!cand.length) break;\n      cand.sort((a, b) => b.perda - a.perda);\n      const alvoT = cand[0].t;\n      const novo = proximoDN(diam[alvoT.id]);\n      if (!novo) break;\n      historico.push({ trecho: alvoT.id, de: nomeDN(diam[alvoT.id]), para: nomeDN(novo), motivo: 'pressão em ' + alvo.nome });\n      diam[alvoT.id] = novo;\n      r = calcular(rede, Object.assign({}, o, { diametros: diam }));\n    }\n\n    rede.trechos.forEach(t => {\n      if (respeitarManuais && t.manual && t.dn) return;\n      t.dn = diam[t.id];\n    });\n\n    return { ok: true, diametros: diam, resultado: r, ajustes: historico,\n      iteracoes: guarda, inviaveis, convergiu: guarda < 60 };\n  }\n\n  /* ---------- Diagnóstico dos pontos críticos ---------------------\n     Separa o que se resolve engrossando tubo do que exige mudar a\n     pressão da fonte ou o tratamento do ar. É a distinção que decide\n     se o problema é de projeto de rede ou de concepção da central. */\n  function diagnosticar(rede, resultado) {\n    const r = resultado || calcular(rede);\n    if (!r.ok) return { ok: false, erros: r.erros };\n    const f = fontes(rede)[0];\n    if (!f) return { ok: false, erros: ['Sem fonte'] };\n    const arv = arvoreGeradora(rede, f.id);\n    const pFonte = +rede.pressao_fonte_bar;\n\n    const itens = (r.criticos || []).map(n => {\n      const caminho = caminhoAteRaiz(arv, n.id);\n      let dpEquip = 0; const equipamentos = [];\n      caminho.forEach(id => {\n        const nn = no(rede, id); if (!nn) return;\n        const e = EQUIPAMENTOS[nn.tipo];\n        if (e && e.dp) { dpEquip += e.dp; equipamentos.push(nn.nome + ' (' + e.dp.toFixed(2) + ' bar)'); }\n      });\n      const teto = pFonte - dpEquip;\n      const inviavel = n.pressao_min_bar > teto + 1e-9;\n      return {\n        no: n.nome, exigido: n.pressao_min_bar, chega: n.pressao_bar,\n        falta: n.pressao_min_bar - n.pressao_bar,\n        perda_equipamentos: dpEquip, equipamentos, teto_alcancavel: teto, inviavel,\n        causa: inviavel\n          ? 'A pressão exigida supera o teto alcançável mesmo com tubulação de perda nula. Aumentar o diâmetro não resolve.'\n          : 'Perda de carga excessiva na tubulação até o ponto. Resolve-se aumentando o diâmetro dos trechos do caminho.',\n        acao: inviavel\n          ? 'Elevar a pressão da fonte para pelo menos ' + (n.pressao_min_bar + dpEquip).toFixed(2)\n            + ' bar, ou rever a exigência do consumidor, ou reposicionar o tratamento do ar para fora deste ramal.'\n          : 'Aumentar o diâmetro no caminho crítico — o dimensionamento automático faz isso.',\n      };\n    });\n    return { ok: true, itens, inviaveis: itens.filter(i => i.inviavel), corrigiveis: itens.filter(i => !i.inviavel) };\n  }\n\n  /* ---------- Lista de materiais ---------- */\n  function listaMateriais(rede, resultado) {\n    const r = resultado || calcular(rede);\n    if (!r.ok) return { ok: false, erros: r.erros };\n    const mat = MATERIAIS[rede.material] || MATERIAIS.aco_galv;\n\n    const tubos = {};\n    r.trechos.forEach(t => {\n      const k = t.dn;\n      tubos[k] = tubos[k] || { dn: t.dn, di_mm: t.di_mm, comprimento_m: 0, trechos: 0 };\n      tubos[k].comprimento_m += t.comprimento_m;\n      tubos[k].trechos++;\n    });\n    // 5 % de perda de corte, prática de obra\n    const listaTubos = Object.values(tubos).sort((a, b) => a.di_mm - b.di_mm).map(x => {\n      const c = x.comprimento_m * 1.05;\n      const fator = Math.pow(x.di_mm / 52.5, 1.35);   // custo escala com o diâmetro\n      return Object.assign({}, x, {\n        comprimento_compra_m: c,\n        custo_unitario: mat.custo_m * fator,\n        custo_total: c * mat.custo_m * fator,\n      });\n    });\n\n    const acess = {};\n    rede.trechos.forEach(t => {\n      const info = r.trechos.find(x => x.id === t.id);\n      Object.keys(t.acessorios || {}).forEach(k => {\n        const q = t.acessorios[k]; if (!q) return;\n        const chave = k + '|' + (info ? info.dn : '');\n        acess[chave] = acess[chave] || { tipo: k, nome: ACESSORIOS[k].nome, dn: info ? info.dn : '', qtd: 0 };\n        acess[chave].qtd += q;\n      });\n    });\n    const listaAcess = Object.values(acess)\n      .map(a => Object.assign({}, a, { qtd: Math.round(a.qtd) }))\n      .filter(a => a.qtd > 0 && a.tipo !== 'entrada' && a.tipo !== 'saida')\n      .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));\n\n    const equip = {};\n    rede.nos.forEach(n => {\n      const e = EQUIPAMENTOS[n.tipo]; if (!e) return;\n      equip[n.tipo] = equip[n.tipo] || { tipo: n.tipo, nome: e.nome, qtd: 0 };\n      equip[n.tipo].qtd++;\n    });\n\n    // Um purgador a cada ponto baixo e no fim de cada ramal é a prática usual\n    const pontasSoltas = contarPontas(rede);\n    const sugestoes = [];\n    if (!rede.nos.some(n => n.tipo === 'purgador'))\n      sugestoes.push('Nenhum purgador na rede. Recomenda-se um em cada ponto baixo e no fim de cada ramal principal.');\n    if (!rede.nos.some(n => n.tipo.indexOf('secador') === 0))\n      sugestoes.push('Nenhum secador na rede. Verifique se a classe de qualidade do ar exigida dispensa secagem.');\n    if (!rede.nos.some(n => n.tipo === 'reservatorio'))\n      sugestoes.push('Nenhum reservatório na rede. Sem ele o compressor cicla em excesso e a rede não absorve picos.');\n    if (r.malhas === 0 && pontasSoltas > 3)\n      sugestoes.push('Rede ramificada com ' + pontasSoltas + ' ramais. Fechar um anel reduz o comprimento efetivo pela metade e equaliza a pressão entre os pontos.');\n\n    const custoTubos = listaTubos.reduce((s, x) => s + x.custo_total, 0);\n    const custoAcess = listaAcess.reduce((s, a) => s + a.qtd * 0.35 * mat.custo_m, 0);\n\n    return {\n      ok: true, material: mat.nome, tubos: listaTubos, acessorios: listaAcess,\n      equipamentos: Object.values(equip), sugestoes,\n      custo_tubos: custoTubos, custo_acessorios: custoAcess, custo_total: custoTubos + custoAcess,\n      comprimento_total_m: r.comprimento_total_m,\n    };\n  }\n\n  function contarPontas(rede) {\n    const g = {}; rede.nos.forEach(n => g[n.id] = 0);\n    rede.trechos.forEach(t => { g[t.de]++; g[t.para]++; });\n    return rede.nos.filter(n => g[n.id] === 1 && n.tipo === 'consumo').length;\n  }\n\n  /* ---------- Modelos prontos de rede ---------- */\n  function modelo(nome, consumidoresProjeto, cfg) {\n    const r = redeVazia();\n    Object.assign(r, cfg || {});\n    const lista = (consumidoresProjeto || []).slice(0, 12);\n    const dem = lista.length ? lista : [{ nome: 'Ponto 1', vazao: 0.3, pressao: 6 }];\n\n    if (nome === 'anel') {\n      // O anel é deslocado para a direita para não colidir com a cadeia de\n      // tratamento. O nó de entrada não recebe consumidor: é só o ponto de\n      // injeção do ar tratado no anel.\n      const pontos = dem.slice(0, 8);\n      const cx = 590, cy = 300, rx = 245, ry = 165;\n      const comp = addNo(r, 'compressor', 70, 300, { nome: 'Compressor' });\n      const res = addNo(r, 'reservatorio', 165, 300, { nome: 'Reservatório' });\n      const sec = addNo(r, 'secador_ref', 260, 300, { nome: 'Secador' });\n      addTrecho(r, comp.id, res.id); addTrecho(r, res.id, sec.id);\n\n      const n = pontos.length + 1;\n      const anel = [];\n      for (let i = 0; i < n; i++) {\n        const a = Math.PI + (2 * Math.PI * i / n);\n        anel.push(addNo(r, 'juncao', Math.round(cx + rx * Math.cos(a)), Math.round(cy + ry * Math.sin(a)),\n          { nome: i === 0 ? 'Entrada do anel' : 'Nó ' + i }));\n      }\n      addTrecho(r, sec.id, anel[0].id);\n      for (let i = 0; i < n; i++) addTrecho(r, anel[i].id, anel[(i + 1) % n].id);\n\n      pontos.forEach((d, i) => {\n        const k = i + 1;                       // pula o nó de entrada\n        const a = Math.PI + (2 * Math.PI * k / n);\n        const p = addNo(r, 'consumo',\n          Math.round(cx + (rx + 88) * Math.cos(a)), Math.round(cy + (ry + 92) * Math.sin(a)),\n          { nome: d.nome || ('Ponto ' + k), demanda_m3min: d.vazao, pressao_min_bar: d.pressao });\n        addTrecho(r, anel[k].id, p.id);\n      });\n      // Purgador no ponto mais baixo do anel, prática usual de drenagem\n      const baixo = anel.slice(1).sort((a, b) => b.y - a.y)[0];\n      if (baixo) {\n        const purg = addNo(r, 'purgador', baixo.x, Math.min(596, baixo.y + 62), { nome: 'Purgador' });\n        addTrecho(r, baixo.id, purg.id);\n      }\n      return r;\n    }\n\n    if (nome === 'espinha') {\n      const comp = addNo(r, 'compressor', 80, 300, { nome: 'Compressor' });\n      const res = addNo(r, 'reservatorio', 160, 300, { nome: 'Reservatório' });\n      const sec = addNo(r, 'secador_ref', 235, 300, { nome: 'Secador' });\n      addTrecho(r, comp.id, res.id); addTrecho(r, res.id, sec.id);\n      let ant = sec.id;\n      dem.forEach((d, i) => {\n        const x = 330 + i * 105;\n        const j = addNo(r, 'juncao', x, 300, { nome: 'Nó ' + (i + 1) });\n        addTrecho(r, ant, j.id); ant = j.id;\n        const acima = i % 2 === 0;\n        const p = addNo(r, 'consumo', x, acima ? 175 : 425,\n          { nome: d.nome || ('Ponto ' + (i + 1)), demanda_m3min: d.vazao, pressao_min_bar: d.pressao });\n        addTrecho(r, j.id, p.id);\n      });\n      const purg = addNo(r, 'purgador', 330 + dem.length * 105, 300, { nome: 'Purgador' });\n      addTrecho(r, ant, purg.id);\n      return r;\n    }\n\n    // ramificada em árvore\n    const comp = addNo(r, 'compressor', 80, 300, { nome: 'Compressor' });\n    const res = addNo(r, 'reservatorio', 165, 300, { nome: 'Reservatório' });\n    const tronco = addNo(r, 'juncao', 300, 300, { nome: 'Distribuidor' });\n    addTrecho(r, comp.id, res.id); addTrecho(r, res.id, tronco.id);\n    const ramos = Math.min(3, Math.max(2, Math.ceil(dem.length / 3)));\n    const porRamo = Math.ceil(dem.length / ramos);\n    let k = 0;\n    for (let i = 0; i < ramos; i++) {\n      const y = 300 + (i - (ramos - 1) / 2) * 165;\n      let ant = tronco.id;\n      for (let j = 0; j < porRamo && k < dem.length; j++, k++) {\n        const x = 430 + j * 125;\n        const d = dem[k];\n        const p = addNo(r, 'consumo', x, Math.round(y),\n          { nome: d.nome || ('Ponto ' + (k + 1)), demanda_m3min: d.vazao, pressao_min_bar: d.pressao });\n        addTrecho(r, ant, p.id); ant = p.id;\n      }\n    }\n    return r;\n  }\n\n  /** Converte a lista de consumidores do projeto em pontos da rede. */\n  function consumidoresDoProjeto(projeto) {\n    const out = [];\n    (projeto.consumidores || []).forEach(c => {\n      const q = (+c.qtd || 1);\n      // Agrupa por tipo: um ponto por consumidor cadastrado, com a vazão total\n      out.push({\n        nome: (q > 1 ? q + '× ' : '') + c.nome,\n        vazao: +(q * (+c.vazao_m3min || 0) * (c.utilizacao === undefined ? 1 : +c.utilizacao)).toFixed(3),\n        pressao: +c.pressao_bar || 6,\n      });\n    });\n    return out.filter(x => x.vazao > 0);\n  }\n\n  return {\n    ACESSORIOS, EQUIPAMENTOS, MATERIAIS,\n    redeVazia, addNo, addTrecho, removerNo, removerTrecho, no,\n    sincronizarSequencia, sugerirAcessorios,\n    comprimentoReto, comprimentoEquivalente, adjacencia,\n    fontes, consumidores, arvoreGeradora, malhas, caminhoAteRaiz,\n    vazoesIniciais, resolverVazoes, propagarPressoes, perdaTrecho,\n    diametrosAtuais, nomeDN, dnMaisProximo, proximoDN,\n    calcular, validar, autoDimensionar, listaMateriais, diagnosticar,\n    modelo, consumidoresDoProjeto,\n  };\n})();\n\n\n<\/script>\n<script>\n/* ==================================================================\n   CompressorSelect Pro — seleção automática\n   Vai além do ranqueamento simples: pondera critérios explícitos,\n   avalia arranjos com mais de uma máquina e devolve a justificativa\n   de por que o vencedor ganhou do segundo colocado.\n   ================================================================== */\nconst AUTOSEL = (function () {\n  'use strict';\n\n  const CRITERIOS = {\n    energia:      { nome: 'Custo de energia',        desc: 'Potência específica e comportamento em carga parcial ao longo da vida útil', padrao: 35 },\n    aquisicao:    { nome: 'Custo de aquisição',      desc: 'Preço de compra do equipamento', padrao: 20 },\n    aderencia:    { nome: 'Aderência à demanda',     desc: 'Penaliza tanto folga excessiva quanto operação no limite', padrao: 20 },\n    tecnologia:   { nome: 'Adequação ao regime',     desc: 'Compatibilidade da tecnologia com o regime de operação previsto', padrao: 15 },\n    ruido:        { nome: 'Ruído',                   desc: 'Nível sonoro a um metro, relevante para exposição ocupacional', padrao: 5 },\n    manutencao:   { nome: 'Simplicidade de manutenção', desc: 'Complexidade construtiva e disponibilidade de peças', padrao: 5 },\n  };\n\n  // Complexidade relativa de manutenção (1 = mais simples)\n  const MANUTENIBILIDADE = {\n    pistao_1e: 1.0, pistao_2e: 0.95, parafuso: 0.80, parafuso_vsd: 0.68,\n    parafuso_isento: 0.55, scroll: 0.75, palheta: 0.72, centrifugo: 0.40,\n    diesel_portatil: 0.60,\n  };\n\n  // Aderência da tecnologia ao regime de operação\n  const ADEQUACAO_REGIME = {\n    intermitente: { pistao_1e: 0.90, pistao_2e: 1.00, parafuso: 0.70, parafuso_vsd: 0.80,\n      parafuso_isento: 0.65, scroll: 0.85, palheta: 0.75, centrifugo: 0.20, diesel_portatil: 0.85 },\n    continuo:     { pistao_1e: 0.35, pistao_2e: 0.60, parafuso: 1.00, parafuso_vsd: 0.98,\n      parafuso_isento: 0.90, scroll: 0.85, palheta: 0.92, centrifugo: 0.85, diesel_portatil: 0.80 },\n    '24h':        { pistao_1e: 0.15, pistao_2e: 0.35, parafuso: 0.95, parafuso_vsd: 1.00,\n      parafuso_isento: 0.92, scroll: 0.80, palheta: 0.90, centrifugo: 1.00, diesel_portatil: 0.55 },\n  };\n\n  function pesosPadrao() {\n    const p = {}; Object.keys(CRITERIOS).forEach(k => p[k] = CRITERIOS[k].padrao); return p;\n  }\n  function normalizarPesos(p) {\n    const soma = Object.keys(p).reduce((s, k) => s + (+p[k] || 0), 0) || 1;\n    const o = {}; Object.keys(p).forEach(k => o[k] = (+p[k] || 0) / soma); return o;\n  }\n\n  /* ---------- Custo de ciclo de vida ---------- */\n  function tco(modelo, req) {\n    const anos = req.anos_analise || 10;\n    const potElet = modelo.potencia_kw / ENG.rendimentoMotor(modelo.potencia_kw);\n    const e = ENG.consumoEnergia({\n      potencia_eletrica_kw: potElet, horas_ano: req.horas_ano,\n      fator_carga: req.fator_carga, tarifa_kwh: req.tarifa_kwh, vsd: modelo.vsd,\n    });\n    // Manutenção anual como fração do preço, maior nas máquinas complexas\n    const fatorManut = 0.05 / Math.max(MANUTENIBILIDADE[modelo.tipo] || 0.8, 0.3);\n    const manutAno = modelo.preco_ref_brl * fatorManut * (req.horas_ano / 4000);\n    return {\n      capex: modelo.preco_ref_brl,\n      energia_ano: e.custo_ano_brl,\n      energia_total: e.custo_ano_brl * anos,\n      manutencao_ano: manutAno,\n      manutencao_total: manutAno * anos,\n      total: modelo.preco_ref_brl + (e.custo_ano_brl + manutAno) * anos,\n      energia_kwh_ano: e.energia_kwh_ano,\n      potencia_eletrica_kw: potElet,\n      anos,\n    };\n  }\n\n  /* ---------- Notas por critério (0 a 1) ---------- */\n  function notas(modelo, req, faixas) {\n    const t = tco(modelo, req);\n    const n = {};\n\n    // Energia: menor custo de energia na vida útil vale mais\n    n.energia = 1 - normalizar(t.energia_total, faixas.energia_min, faixas.energia_max);\n    // Aquisição\n    n.aquisicao = 1 - normalizar(t.capex, faixas.capex_min, faixas.capex_max);\n    // Aderência: ótimo entre 10 % e 25 % de folga\n    const f = modelo.folga_percentual;\n    if (f < 0) n.aderencia = 0;\n    else if (f < 10) n.aderencia = 0.55 + f / 10 * 0.45;\n    else if (f <= 25) n.aderencia = 1.0;\n    else n.aderencia = Math.max(0, 1 - (f - 25) / 55);\n    // Tecnologia\n    const tabela = ADEQUACAO_REGIME[req.regime] || ADEQUACAO_REGIME.continuo;\n    n.tecnologia = tabela[modelo.tipo] === undefined ? 0.6 : tabela[modelo.tipo];\n    if (req.demanda_variavel && modelo.vsd) n.tecnologia = Math.min(1, n.tecnologia + 0.15);\n    // Ruído: 60 dB(A) ou menos é excelente, 95 é péssimo\n    n.ruido = 1 - normalizar(modelo.ruido_dba, 58, 98);\n    // Manutenção\n    n.manutencao = MANUTENIBILIDADE[modelo.tipo] || 0.7;\n\n    Object.keys(n).forEach(k => n[k] = Math.max(0, Math.min(1, n[k])));\n    return { notas: n, tco: t };\n  }\n\n  function normalizar(v, min, max) {\n    if (!isFinite(min) || !isFinite(max) || max - min < 1e-9) return 0.5;\n    return Math.max(0, Math.min(1, (v - min) / (max - min)));\n  }\n\n  /* ---------- Seleção automática de máquina única ---------- */\n  function selecionarAutomatico(catalogo, req) {\n    const pesos = normalizarPesos(req.pesos || pesosPadrao());\n    const base = ENG.selecionar(catalogo, {\n      vazao_m3min: req.vazao_m3min, pressao_bar: req.pressao_bar,\n      regime: req.regime, isento: req.isento, demanda_variavel: req.demanda_variavel,\n      acionamento: req.acionamento, ruido_max: req.ruido_max,\n      margem_max: req.margem_max === undefined ? 0.60 : req.margem_max,\n    });\n\n    if (!base.aptos.length) {\n      return { ok: false, motivo: 'Nenhum modelo do catálogo atende simultaneamente aos critérios.',\n        aptos: [], reprovados: base.reprovados.slice(0, 12), pesos };\n    }\n\n    // Faixas para normalização, calculadas apenas sobre os candidatos aptos\n    const tcos = base.aptos.map(m => tco(m, req));\n    const faixas = {\n      energia_min: Math.min.apply(null, tcos.map(t => t.energia_total)),\n      energia_max: Math.max.apply(null, tcos.map(t => t.energia_total)),\n      capex_min: Math.min.apply(null, tcos.map(t => t.capex)),\n      capex_max: Math.max.apply(null, tcos.map(t => t.capex)),\n    };\n\n    const avaliados = base.aptos.map(m => {\n      const { notas: n, tco: t } = notas(m, req, faixas);\n      let pontos = 0;\n      const contrib = {};\n      Object.keys(pesos).forEach(k => {\n        const c = (n[k] === undefined ? 0.5 : n[k]) * pesos[k];\n        contrib[k] = c; pontos += c;\n      });\n      return Object.assign({}, m, { notas: n, contribuicao: contrib, tco: t, pontuacao: +(pontos * 100).toFixed(2) });\n    }).sort((a, b) => b.pontuacao - a.pontuacao);\n\n    const vencedor = avaliados[0];\n    const segundo = avaliados[1] || null;\n\n    return {\n      ok: true, pesos, faixas,\n      recomendado: vencedor, alternativas: avaliados.slice(1, 6),\n      todos: avaliados,\n      justificativa: justificar(vencedor, segundo, req, pesos),\n      reprovados: base.reprovados.slice(0, 10),\n      total_avaliado: catalogo.length, total_apto: base.aptos.length,\n    };\n  }\n\n  function justificar(v, s, req, pesos) {\n    const j = [];\n    j.push({\n      titulo: 'Capacidade',\n      texto: `Entrega ${fmt(v.vazao_fad_m3min, 2)} m³/min contra ${fmt(req.vazao_m3min, 2)} m³/min de demanda, `\n        + `folga de ${fmt(v.folga_percentual, 0)} %. `\n        + (v.folga_percentual < 10 ? 'É uma folga apertada: qualquer ampliação futura exigirá segunda máquina.'\n          : v.folga_percentual > 35 ? 'A folga é generosa, o que acomoda expansão mas eleva o consumo em carga parcial.'\n            : 'Folga na faixa recomendada de 10 % a 25 %.'),\n    });\n    j.push({\n      titulo: 'Tecnologia',\n      texto: `${ENG.NOMES_TIPO[v.tipo]} com potência específica de ${fmt(v.pot_especifica, 2)} kW por m³/min. `\n        + (v.vsd ? 'O inversor acompanha a demanda e evita o consumo em alívio.'\n          : v.tipo.indexOf('pistao') === 0 ? 'Máquina de pistão: adequada a uso intermitente, mas não a regime contínuo prolongado.'\n            : 'Velocidade fixa: consome cerca de 30 % da potência nominal quando está em alívio.'),\n    });\n    j.push({\n      titulo: 'Custo em ' + v.tco.anos + ' anos',\n      texto: `Aquisição ${moedaBR(v.tco.capex)} mais ${moedaBR(v.tco.energia_total)} de energia e `\n        + `${moedaBR(v.tco.manutencao_total)} de manutenção, totalizando ${moedaBR(v.tco.total)}. `\n        + `A energia responde por ${fmt(v.tco.energia_total / v.tco.total * 100, 0)} % do total.`,\n    });\n    if (s) {\n      const dif = v.pontuacao - s.pontuacao;\n      const maior = Object.keys(pesos).sort((a, b) =>\n        (v.contribuicao[b] - s.contribuicao[b]) - (v.contribuicao[a] - s.contribuicao[a]))[0];\n      j.push({\n        titulo: 'Por que este e não o segundo colocado',\n        texto: `Superou ${s.marca} ${s.modelo} por ${fmt(dif, 1)} ponto(s). A diferença vem principalmente de `\n          + `\"${CRITERIOS[maior].nome.toLowerCase()}\". `\n          + (Math.abs(dif) < 3 ? 'A margem é estreita: os dois são tecnicamente defensáveis e a decisão pode considerar assistência técnica local e prazo de entrega.'\n            : 'A margem é confortável.'),\n      });\n    }\n    if (v.ruido_dba > 85) {\n      j.push({ titulo: 'Atenção ao ruído',\n        texto: `${v.ruido_dba} dB(A) a um metro supera o limite de 85 dB(A) para jornada de 8 horas. `\n          + 'Prevê enclausuramento acústico, sala técnica isolada ou controle de exposição.' });\n    }\n    return j;\n  }\n\n  /* ---------- Arranjos com mais de uma máquina --------------------\n     Uma máquina única é o arranjo mais barato de comprar e o mais caro\n     de operar quando a demanda varia. Dividir a capacidade permite que\n     as máquinas de base trabalhem em plena carga — que é onde o\n     rendimento é melhor — e dá redundância. */\n  function avaliarArranjos(catalogo, req) {\n    const Q = req.vazao_m3min;\n    const anos = req.anos_analise || 10;\n    const arranjos = [];\n\n    const filtro = (m, alvo, tolInf, tolSup) =>\n      m.pressao_max_bar >= req.pressao_bar\n      && (!req.isento || m.lubrificacao === 'isento')\n      && (!req.acionamento || m.acionamento === req.acionamento)\n      && m.vazao_fad_m3min >= alvo * tolInf && m.vazao_fad_m3min <= alvo * tolSup;\n\n    const melhor = (lista, ordenar) => lista.length ? lista.slice().sort(ordenar)[0] : null;\n    const porTCO = (a, b) => tco(a, req).total - tco(b, req).total;\n\n    /* 1 — máquina única */\n    const unicos = catalogo.filter(m => filtro(m, Q, 1.0, 1.6));\n    const u = melhor(unicos, porTCO);\n    if (u) arranjos.push(montar('unica', 'Máquina única', [u], req, anos,\n      'Arranjo mais simples e mais barato de instalar. Toda a capacidade depende de um equipamento: uma parada programada ou uma falha interrompe o fornecimento de ar.'));\n\n    /* 2 — duas máquinas iguais em paralelo */\n    const metade = catalogo.filter(m => filtro(m, Q / 2, 1.0, 1.5));\n    const p = melhor(metade, porTCO);\n    if (p) arranjos.push(montar('paralela', 'Duas máquinas iguais', [p, p], req, anos,\n      'Cada máquina cobre metade da demanda. Em carga baixa opera só uma, em plena carga, o que reduz o tempo em alívio. Permite manutenção alternada sem parar a produção, ainda que com capacidade reduzida.'));\n\n    /* 3 — base fixa + ponta com inversor */\n    const bases = catalogo.filter(m => filtro(m, Q * 0.65, 0.9, 1.25) && !m.vsd);\n    const pontas = catalogo.filter(m => filtro(m, Q * 0.45, 0.85, 1.4) && m.vsd);\n    const b = melhor(bases, porTCO), pt = melhor(pontas, porTCO);\n    if (b && pt && b.vazao_fad_m3min + pt.vazao_fad_m3min >= Q) {\n      arranjos.push(montar('base_ponta', 'Base fixa + ponta com inversor', [b, pt], req, anos,\n        'A máquina de base trabalha em plena carga, onde o rendimento é máximo, e o inversor absorve apenas a variação. É o arranjo de menor consumo quando a demanda oscila bastante, ao custo de controle mais elaborado.'));\n    }\n\n    /* 4 — redundância N+1 */\n    const r1 = melhor(catalogo.filter(m => filtro(m, Q, 1.0, 1.5)), porTCO);\n    if (r1) arranjos.push(montar('n_mais_1', 'Redundância N+1', [r1, r1], req, anos,\n      'Duas máquinas de capacidade plena, uma em operação e outra em reserva, com alternância periódica. Dobra o investimento, mas garante fornecimento durante manutenção ou falha. Justifica-se quando a parada de ar interrompe processo crítico.', { reserva: 1 }));\n\n    /* 5 — três máquinas escalonadas */\n    const terco = catalogo.filter(m => filtro(m, Q / 3, 1.0, 1.5));\n    const t3 = melhor(terco, porTCO);\n    if (t3 && Q >= 3) arranjos.push(montar('escalonada', 'Três máquinas escalonadas', [t3, t3, t3], req, anos,\n      'Escalonamento fino: entram e saem conforme a demanda, mantendo as que operam próximas da plena carga. Faz sentido em instalações grandes com variação acentuada ao longo do dia.'));\n\n    return arranjos.sort((a, b) => a.tco_total - b.tco_total);\n  }\n\n  function montar(tipo, nome, maquinas, req, anos, obs, extra) {\n    const e = extra || {};\n    const reserva = e.reserva || 0;\n    const ativas = maquinas.length - reserva;\n    const capacidade = maquinas.reduce((s, m) => s + m.vazao_fad_m3min, 0)\n      - (reserva ? maquinas[maquinas.length - 1].vazao_fad_m3min * reserva : 0);\n    const capex = maquinas.reduce((s, m) => s + m.preco_ref_brl, 0);\n\n    // Energia: cada máquina ativa recebe a fração da demanda que lhe cabe.\n    // Máquinas de base operam em plena carga; a de ponta modula.\n    let energiaAno = 0;\n    const detalhe = [];\n    const demanda = req.vazao_m3min;\n    let restante = demanda;\n    maquinas.slice(0, ativas).forEach((m, i) => {\n      const ultima = i === ativas - 1;\n      const carga = ultima\n        ? Math.max(0, Math.min(1, restante / m.vazao_fad_m3min))\n        : Math.min(1, restante / m.vazao_fad_m3min);\n      restante -= m.vazao_fad_m3min * carga;\n      // Fator de carga efetivo. Com uma única máquina ativa vale o fator de\n      // carga do projeto, que já representa o regime real. Com mais de uma,\n      // a partição da demanda passa a governar a carga de cada unidade.\n      const fc = ativas === 1\n        ? req.fator_carga\n        : Math.max(0.05, Math.min(1, carga * (0.35 + 0.65 * req.fator_carga)));\n      const pot = m.potencia_kw / ENG.rendimentoMotor(m.potencia_kw);\n      const en = ENG.consumoEnergia({\n        potencia_eletrica_kw: pot, horas_ano: req.horas_ano,\n        fator_carga: fc, tarifa_kwh: req.tarifa_kwh, vsd: m.vsd,\n      });\n      energiaAno += en.custo_ano_brl;\n      detalhe.push({ modelo: m, papel: ultima && ativas > 1 ? 'ponta' : ativas > 1 ? 'base' : 'única',\n        carga_relativa: carga, custo_ano: en.custo_ano_brl, kwh_ano: en.energia_kwh_ano });\n    });\n    if (reserva) detalhe.push({ modelo: maquinas[maquinas.length - 1], papel: 'reserva',\n      carga_relativa: 0, custo_ano: 0, kwh_ano: 0 });\n\n    const manutAno = maquinas.reduce((s, m) => {\n      const f = 0.05 / Math.max(MANUTENIBILIDADE[m.tipo] || 0.8, 0.3);\n      return s + m.preco_ref_brl * f * (req.horas_ano / 4000);\n    }, 0);\n\n    return {\n      tipo, nome, maquinas, detalhe, reserva, n_maquinas: maquinas.length,\n      capacidade_m3min: capacidade, atende: capacidade >= req.vazao_m3min,\n      folga_percentual: (capacidade - req.vazao_m3min) / req.vazao_m3min * 100,\n      capex, energia_ano: energiaAno, energia_total: energiaAno * anos,\n      manutencao_ano: manutAno, manutencao_total: manutAno * anos,\n      tco_total: capex + (energiaAno + manutAno) * anos,\n      redundante: reserva > 0 || maquinas.length > 1,\n      redundancia: reserva > 0 ? 'total' : maquinas.length > 1 ? 'parcial' : 'nenhuma',\n      potencia_instalada_kw: maquinas.reduce((s, m) => s + m.potencia_kw, 0),\n      observacao: obs, anos,\n    };\n  }\n\n  /* ---------- Execução completa ---------- */\n  function executar(catalogo, req) {\n    const sel = selecionarAutomatico(catalogo, req);\n    const arr = sel.ok ? avaliarArranjos(catalogo, req) : [];\n    let melhorArranjo = null, economiaArranjo = 0;\n    if (sel.ok && arr.length) {\n      const unica = arr.find(a => a.tipo === 'unica');\n      const alt = arr.filter(a => a.tipo !== 'unica' && a.atende);\n      if (unica && alt.length) {\n        const m = alt.slice().sort((a, b) => a.tco_total - b.tco_total)[0];\n        if (m.tco_total < unica.tco_total * 0.97) { melhorArranjo = m; economiaArran , 0, 0],\n    },\n    laboratorio: {\n      nome: 'Laboratório / ensaios',\n      dias: 260,\n      desc: 'Base contínua de instrumentação com picos de ensaio ao longo do expediente.',\n      h: [0.12, 0.12, 0.12, 0.12, 0.12, 0.15, 0.30, 0.55, 0.85, 1.00, 0.90, 0.70,\n          0.35, 0.65, 0.95, 0.88, 0.72, 0.45, 0.22, 0.15, 0.12, 0.12, 0.12, 0.12],\n    },\n    jateamento: {\n      nome: 'Jateamento / pintura — blocos de trabalho',\n      dias: 180,\n      desc: 'Demanda em patamar alto durante os blocos de aplicação, com paradas de troca e limpeza.',\n      h: [0, 0, 0, 0, 0, 0, 0.30, 0.95, 1.00, 1.00, 0.55, 1.00,\n          0.20, 0.95, 1.00, 1.00, 0.60, 0.35, 0, 0, 0, 0, 0, 0],\n    },\n    uniforme: {\n      nome: 'Uniforme — carga constante',\n      dias: 365,\n      desc: 'Referência de comparação: demanda igual ao pico em todas as horas de operação.',\n      h: Array(24).fill(1),\n    },\n  };\n\n  const ORDEM_PRESETS = ['continuo_24h', 'tres_turnos', 'dois_turnos', 'turno_unico',\n    'canteiro', 'oficina', 'laboratorio', 'jateamento', 'uniforme'];\n\n  /* Sugestão de perfil a partir do regime e da tipologia do projeto */\n  function sugerirPreset(projeto) {\n    const q = (projeto && projeto.qualidade) || '';\n    const r = (projeto && projeto.regime) || 'continuo';\n    if (q === 'critico') return 'laboratorio';\n    if (q === 'pintura') return 'jateamento';\n    if (projeto && projeto.acionamento === 'diesel') return 'canteiro';\n    if (r === '24h') return q === 'instrumentacao' ? 'continuo_24h' : 'tres_turnos';\n    if (r === 'intermitente') return 'oficina';\n    return 'dois_turnos';\n  }\n\n  function novo(tipo) {\n    const t = PRESETS[tipo] ? tipo : 'dois_turnos';\n    return {\n      ativo: false,\n      tipo: t,\n      dias_ano: PRESETS[t].dias,\n      horas: PRESETS[t].h.slice(),\n      manter_pressurizado: false,\n      fator_alivio: 0.30,\n    };\n  }\n\n  function aplicarPreset(perfil, tipo) {\n    const p = PRESETS[tipo] ? tipo : 'dois_turno uce((m, v) => Math.min(m, v), 1) : 0;\n    const xMedioOp = nOpera ? somaX / nOpera : 0;\n    const xeMedioOp = nOpera ? somaXe / nOpera : 0;\n\n    // ---- Energia: integração hora a hora ----\n    let kwhFixa = 0, kwhVSD = 0, kwhAlivio = 0, kwhUtil = 0;\n    for (let h = 0; h < 24; h++) {\n      if (opera[h]) {\n        const c = xe[h];\n        kwhFixa += Pel * (c + (1 - c) * fAlivio);\n        kwhVSD += Pel * (0.05 + 0.95 * c);\n        kwhAlivio += Pel * (1 - c) * fAlivio;\n        kwhUtil += Pel * c;\n      } else if (perfil.manter_pressurizado) {\n        kwhFixa += Pel * fAlivio;\n        kwhVSD += Pel * 0.05;\n        kwhAlivio += Pel * fAlivio;\n      }\n    }\n    kwhFixa *= dias; kwhVSD *= dias; kwhAlivio *= dias; kwhUtil *= dias;\n\n    const energiaAno = cfg.vsd ? kwhVSD : kwhFixa;\n    const custoAno = energiaAno * tarifa;\n    const economiaVSD = (kwhFixa - kwhVSD) * tarifa;\n\n    // ---- Curva de permanência (carga ordenada de forma decrescente) ----\n    const permanencia = xe\n      .map((v, i) => ({ v, opera: opera[i] }))\n      .filter(o => o.opera)\n      .map(o => o.v)\n      .sort((a, b) => b - a);\n\n    // ---- Distribuição por faixa de carga ----\n    const FAIXAS = [\n      { rot: 'Parada', min: -1, max: LIMIAR },\n      { rot: '0–25 %', min: LIMIAR, max: 0.25 },\n      { rot: '25–50 %', min: 0.25, max: 0.50 },\n      { rot: '50–75 %', min: 0.50, max: 0.75 },\n      { rot: '75–100 %', min: 0.75, max: 1.01 },\n    ];\n    const bandas = FAIXAS.map(f => {\n      let n = 0;\n      for (let h = 0; h < 24; h++) {\n        const c = opera[h] ? xe[h] : 0;\n        const dentro = f.rot === 'Parada' ? !opera[h] : (opera[h] && c > f.min && c <= f.max);\n        if (dentro) n++;\n      }\n      return { rotulo: f.rot, horas_dia: n, horas_ano: n * dias, fracao: n / 24 };\n    });\n\n    // ---- Recomendação de arranjo ----\n    const relPicoMedia = xMedioOp > 0 ? xPico / xMedioOp : 0;\n    const horasBaixa = bandas[1].horas_ano + bandas[2].horas_ano;   // abaixo de 50 %\n    let rec, recTipo;\n    if (nOpera === 0) {\n      recTipo = 'indefinido';\n      rec = 'Perfil sem nenhuma hora de demanda. Ajuste ao menos uma hora acima de zero.';\n    } else if (xMinOp / (xPico || 1) >= 0.80 && relPicoMedia <= 1.2) {\n      recTipo = 'fixa';\n      rec = 'Demanda praticamente constante durante a operação. Máquina de velocidade fixa bem ' +\n        'dimensionada é a solução mais econômica: o inversor teria pouca margem para modular e não ' +\n        'compensaria o sobrepreço.';\n    } else if (xMinOp / (xPico || 1) <= 0.50 && horasAno >= 2000) {\n      recTipo = 'base_ponta';\n      rec = 'A demanda mínima sustentada fica em torno de ' + Math.round(xMinOp * 100) + ' % do pico, ' +\n        'com ' + Math.round(horasBaixa) + ' h/ano abaixo de meia carga. Vale avaliar arranjo base + ponta ' +\n        '(uma máquina de velocidade fixa cobrindo a base e uma com inversor acompanhando a variação) — ' +\n        'compare na aba Autosseleção.';\n    } else {\n      recTipo = 'vsd';\n      rec = 'Demanda variável com ' + Math.round(horasBaixa) + ' h/ano abaixo de meia carga. ' +\n        'É o cenário em que o inversor de frequência costuma se pagar, porque elimina o consumo ' +\n        'em alívio nas horas de carga parcial.';\n    }\n\n    return {\n      ok: nOpera > 0,\n      horas: x.slice(),\n      carga_maquina: xe,\n      opera,\n      dias_ano: dias,\n      horas_operacao_dia: nOpera,\n      horas_ano: horasAno,\n      horas_parada_ano: horasParada,\n      x_pico: xPico,\n      x_min_operacao: xMinOp,\n      x_medio_operacao: xMedioOp,\n      fator_carga_efetivo: xeMedioOp,\n      folga_maquina: razao > 0 ? (1 / razao - 1) : 0,\n      vazao_pico_m3min: qProj * xPico,\n      vazao_media_m3min: nOpera ? qProj * xMedioOp : 0,\n      vazao_media_dia_m3min: qProj * (somaX / 24),\n      relacao_pico_media: relPicoMedia,\n      volume_dia_m3: qProj * somaX * 60,\n      volume_ano_m3: qProj * somaX * 60 * dias,\n      energia_fixa_kwh: kwhFixa,\n      energia_vsd_kwh: kwhVSD,\n      energia_alivio_kwh: kwhAlivio,\n      energia_util_kwh: kwhUtil,\n      energia_kwh_ano: energiaAno,\n      custo_ano_brl: custoAno,\n      custo_fixa_brl: kwhFixa * tarifa,\n      custo_vsd_brl: kwhVSD * tarifa,\n      economia_vsd_brl: economiaVSD,\n      economia_vsd_pct: kwhFixa > 0 ? (kwhFixa - kwhVSD) / kwhFixa * 100 : 0,\n      desperdicio_alivio_pct: kwhFixa > 0 ? kwhAlivio / kwhFixa * 100 : 0,\n      bandas,\n      permanencia,\n      recomendacao: rec,\n      recomendacao_tipo: recTipo,\n      fator_alivio: fAlivio,\n    };\n  }\n\n  /**\n   * Compara o resultado do perfil com a hipótese simplificada\n   * (horas_ano × fator de carga médio informado na aba Projeto).\n   */\n  function compararComUniforme(analise, projeto, potElet, tarifa, vsd) {\n    const simples = ENG.consumoEnergia({\n      potencia_eletrica_kw: potElet,\n      horas_ano: +projeto.horas_ano,\n      fator_carga: +projeto.fator_carga,\n      tarifa_kwh: tarifa,\n      vsd: !!vsd,\n      fator_alivio: analise.fator_alivio,\n    });\n    const dif = analise.custo_ano_brl - simples.custo_ano_brl;\n    return {\n      simples,\n      diferenca_brl: dif,\n      diferenca_pct: simples.custo_ano_brl ? dif / simples.custo_ano_brl * 100 : 0,\n      horas_simples: +projeto.horas_ano,\n      horas_perfil: analise.horas_ano,\n      fc_simples: +projeto.fator_carga,\n      fc_perfil: analise.fator_carga_efetivo,\n    };\n  }\n\n  return { PRESETS, ORDEM_PRESETS, LIMIAR, novo, aplicarPreset, normalizarPerfil,\n    sugerirPreset, analisar, compararComUniforme };\n})();\n\n<\/script>\n<script>\n/* ==================================================================\n   CompressorSelect Pro — CONFORM: verificação de conformidade\n   --------------------------------------------------------------\n   Lista de verificação da instalação de ar comprimido. Cada item cita\n   a norma de origem. Há dois tipos:\n\n     • automático — o próprio aplicativo confronta o item com os dados\n       do projeto e devolve conforme / atenção / não conforme;\n     • declaratório — depende de constatação em campo ou de documento\n       do fornecedor; o aplicativo apenas indica o que verificar e\n       registra a marcação do responsável.\n\n   Nenhum item substitui inspeção presencial nem dispensa a leitura da\n   redação vigente da norma citada. As periodicidades e limites aqui\n   embutidos precisam ser confirmados antes de emitir documento oficial.\n   ================================================================== */\nconst CONFORM = (function () {\n  'use strict';\n\n  const GRUPOS = {\n    nr13: { nome: 'Vaso de pressão — NR-13', ordem: 1 },\n    nr12: { nome: 'Segurança da máquina — NR-12', ordem: 2 },\n    ruido: { nome: 'Ruído ocupacional — NR-15, Anexo I', ordem: 3 },\n    rede: { nome: 'Rede de distribuição', ordem: 4 },\n    eletrica: { nome: 'Instalação elétrica — ABNT NBR 5410', ordem: 5 },\n    qualidade: { nome: 'Qualidade do ar — ISO 8573-1 / ISO 1217', ordem: 6 },\n    dimensionamento: { nome: 'Coerência do dimensionamento', ordem: 7 },\n  };\n\n  const OK = (d) => ({ status: 'ok', detalhe: d });\n  const AT = (d) => ({ status: 'atencao', detalhe: d });\n  const NAO = (d) => ({ status: 'nao', detalhe: d });\n  const NA = (d) => ({ status: 'na', detalhe: d });\n\n  function n(v, d) {\n    if (v === null || v === undefined || !isFinite(v)) return '—';\n    return Number(v).toLocaleString('pt-BR', {\n      minimumFractionDigits: d === undefined ? 2 : d,\n      maximumFractionDigits: d === undefined ? 2 : d,\n    });\n  }\n\n  /* ---------------- Itens ---------------- */\n  const ITENS = [\n    /* ---------- NR-13 ---------- */\n    {\n      id: 'nr13-enq', grupo: 'nr13', tipo: 'auto', critico: true,\n      item: 'Enquadramento do reservatório como vaso de pressão',\n      norma: 'NR-13, item 13.5 e Anexo I',\n      verificar: (x) => {\n        const r = x.c.nr13;\n        if (!r.sujeito_nr13) {\n          return NA('Produto P·V = ' + n(r.produto_PV, 1) + ' kPa·m³, abaixo do limite de aplicação. '\n            + 'Ainda assim, mantenha manômetro, válvula de segurança e dreno.');\n        }\n        return OK('Categoria ' + r.categoria + ' · fluido classe C · P·V = ' + n(r.produto_PV, 1)\n          + ' kPa·m³ (' + n(r.pressao_kPa, 0) + ' kPa × ' + n(r.volume_m3, 3) + ' m³). ' + r.periodicidade + '.');\n      },\n    },\n    {\n      id: 'nr13-prontuario', grupo: 'nr13', tipo: 'declaratorio', critico: true,\n      item: 'Prontuário do vaso fornecido pelo fabricante',\n      norma: 'NR-13, item 13.5.1',\n      dica: 'Deve conter código de projeto, memorial de cálculo, especificação de materiais, procedimentos '\n        + 'de fabricação e de inspeção, e os certificados dos ensaios. Exija na entrega — reconstituir '\n        + 'prontuário depois custa caro.',\n    },\n    {\n      id: 'nr13-registro', grupo: 'nr13', tipo: 'declaratorio', critico: true,\n      item: 'Registro de segurança aberto e mantido no estabelecimento',\n      norma: 'NR-13, item 13.5.3',\n      dica: 'Livro próprio, folhas numeradas ou sistema informatizado, onde se anotam ocorrências, '\n        + 'intervenções e resultados das inspeções.',\n    },\n    {\n      id: 'nr13-psv', grupo: 'nr13', tipo: 'auto', critico: true,\n      item: 'Válvula de segurança com pressão de abertura compatível',\n      norma: 'NR-13, item 13.5.2 · dispositivos de segurança',\n      verificar: (x) => {\n        const pMax = x.c.modelo ? x.c.modelo.pressao_max_bar : x.c.pTrab + 1;\n        const pTrab = x.c.pTrab;\n        if (pMax <= pTrab) {\n          return NAO('A pressão máxima do equipamento (' + n(pMax, 1) + ' bar) não supera a pressão de '\n            + 'trabalho ajustada (' + n(pTrab, 1) + ' bar). Não há faixa para ajuste da válvula de segurança.');\n        }\n        return OK('Ajustar a abertura entre ' + n(pTrab + 0.5, 1) + ' bar e a PMTA do reservatório, '\n          + 'sem ultrapassá-la. Pressão máxima declarada do conjunto: ' + n(pMax, 1) + ' bar. '\n          + 'Confirmar a PMTA na placa e no prontuário do vaso.');\n      },\n    },\n    {\n      id: 'nr13-manometro', grupo: 'nr13', tipo: 'declaratorio', critico: false,\n      item: 'Manômetro instalado com escala adequada',\n      norma: 'NR-13 · dispositivos de indicação',\n      dica: (x) => 'Escala recomendada: fundo entre ' + n(x.c.pTrab * 1.5, 1) + ' e ' + n(x.c.pTrab * 2, 1)\n        + ' bar, de modo que a pressão de trabalho fique no terço médio do mostrador.',\n    },\n    {\n      id: 'nr13-dreno', grupo: 'nr13', tipo: 'declaratorio', critico: true,\n      item: 'Dreno do reservatório em operação (preferencialmente automático)',\n      norma: 'NR-13 · condições de operação',\n      dica: 'O condensado acumulado corrói a parede do vaso pelo lado interno, onde a inspeção visual não '\n        + 'alcança no dia a dia. Purgador automático temporizado ou por nível evita depender de rotina manual.',\n    },\n    {\n      id: 'nr13-placa', grupo: 'nr13', tipo: 'declaratorio', critico: false,\n      item: 'Placa de identificação do vaso legível e fixada em local visível',\n      norma: 'NR-13, item 13.5.1.4',\n      dica: 'Fabricante, número de série, ano de fabricação, PMTA, pressão de teste hidrostático, '\n        + 'código de projeto e categoria.',\n    },\n    {\n      id: 'nr13-ph', grupo: 'nr13', tipo: 'declaratorio', critico: true,\n      item: 'Inspeções conduzidas por Profissional Habilitado',\n      norma: 'NR-13, item 13.1.2',\n      dica: (x) => 'Categoria ' + x.c.nr13.categoria + '. ' + x.c.nr13.periodicidade\n        + '. Periodicidades de estabelecimento sem SPIE — confirmar na redação vigente.',\n    },\n    {\n      id: 'nr13-local', grupo: 'nr13', tipo: 'declaratorio', critico: false,\n      item: 'Local de instalação atende aos requisitos de ventilação, acesso e saídas',\n      norma: 'NR-13, Anexo · instalação de vasos de pressão',\n      dica: 'Ventilação permanente, duas saídas amplas e desobstruídas quando em ambiente confinado, '\n        + 'iluminação, acesso seguro aos dispositivos e afastamento de fontes de calor.',\n    },\n    {\n      id: 'nr13-bloqueio', grupo: 'nr13', tipo: 'declaratorio', critico: false,\n      item: 'Dispositivo de bloqueio e despressurização para manutenção',\n      norma: 'NR-13 · NR-12, item 12.11 (bloqueio de energias)',\n      dica: 'Antes de qualquer intervenção o sistema precisa ser isolado, despressurizado e sinalizado. '\n        + 'Ar comprimido é energia armazenada.',\n    },\n\n    /* ---------- NR-12 ---------- */\n    {\n      id: 'nr12-protecao', grupo: 'nr12', tipo: 'auto', critico: true,\n      item: 'Proteção fixa de polias, correias e acoplamento',\n      norma: 'NR-12, itens 12.36 a 12.55',\n      verificar: (x) => {\n        const t = x.c.modelo ? x.c.modelo.tipo : '';\n        if (t.startsWith('pistao')) {\n          return AT('Modelo de pistão com transmissão por correia exposta na maioria das linhas. '\n            + 'Proteção fixa da polia e do volante é obrigatória e costuma ser o item mais reprovado '\n            + 'em inspeção. Confirmar na entrega.');\n        }\n        return OK('Máquina do tipo ' + (x.c.modelo ? x.c.modelo.tipo_nome : '—') + ', normalmente '\n          + 'fornecida em gabinete fechado. Verificar se os painéis de acesso exigem ferramenta '\n          + 'ou possuem intertravamento.');\n      },\n    },\n    {\n      id: 'nr12-parada', grupo: 'nr12', tipo: 'declaratorio', critico: true,\n      item: 'Dispositivo de parada de emergência acessível',\n      norma: 'NR-12, itens 12.24 a 12.29',\n      dica: 'Acionamento por soco, sem trava automática de rearme, alcançável da posição do operador '\n        + 'e sem exigir passagem pela zona de perigo.',\n    },\n    {\n      id: 'nr12-aterramento', grupo: 'nr12', tipo: 'declaratorio', critico: true,\n      item: 'Aterramento e seccionamento de energia identificados',\n      norma: 'NR-12, itens 12.14 a 12.22 · NR-10',\n      dica: 'Dispositivo de seccionamento com bloqueio, sinalização de energias e continuidade do '\n        + 'condutor de proteção verificada.',\n    },\n    {\n      id: 'nr12-sinalizacao', grupo: 'nr12', tipo: 'declaratorio', critico: false,\n      item: 'Sinalização de riscos e advertências no equipamento',\n      norma: 'NR-12, itens 12.116 a 12.123 · NR-26',\n      dica: 'Superfície quente, partida automática sem aviso, energia armazenada em ar comprimido e '\n        + 'nível de ruído. Texto em português e legível da posição de operação.',\n    },\n\n    /* ---------- Ruído ---------- */\n    {\n      id: 'ruido-nivel', grupo: 'ruido', tipo: 'auto', critico: false,\n      item: 'Nível de pressão sonora do equipamento',\n      norma: 'NR-15, Anexo I — 85 dB(A) para 8 h de exposição',\n      verificar: (x) => {\n        if (!x.c.modelo) return AT('Nenhum modelo selecionado — sem dado de ruído para confrontar.');\n        const db = x.c.modelo.ruido_dba;\n        if (db > 85) {\n          return NAO('Modelo declarado em ' + n(db, 0) + ' dB(A), acima do limite de 85 dB(A) para '\n            + 'jornada de 8 h. Exige enclausuramento acústico, sala técnica isolada ou controle de '\n            + 'exposição com proteção auditiva e avaliação de dose.');\n        }\n        if (db > 80) {\n          return AT('Modelo declarado em ' + n(db, 0) + ' dB(A). Abaixo do limite, mas acima do nível '\n            + 'de ação de 80 dB(A) que aciona programa de conservação auditiva. Lembre que o valor de '\n            + 'catálogo é medido em campo livre, a 1 m; em sala fechada a reverberação aumenta o nível.');\n        }\n        return OK('Modelo declarado em ' + n(db, 0) + ' dB(A), abaixo do nível de ação. '\n          + 'Ainda assim, medir em campo após a instalação.');\n      },\n    },\n    {\n      id: 'ruido-avaliacao', grupo: 'ruido', tipo: 'declaratorio', critico: false,\n      item: 'Avaliação de exposição ocupacional após a instalação',\n      norma: 'NR-15, Anexo I · NR-09 (PGR)',\n      dica: 'Medição em campo com o compressor em regime, no posto de trabalho real. O valor de catálogo '\n        + 'é referência de projeto, não medição do ambiente instalado.',\n    },\n\n    /* ---------- Rede ---------- */\n    {\n      id: 'rede-cor', grupo: 'rede', tipo: 'declaratorio', critico: false,\n      item: 'Tubulação identificada na cor azul',\n      norma: 'ABNT NBR 6493:2018',\n      dica: 'Ar comprimido é identificado em azul. Item simples, barato e reprovado com frequência no '\n        + 'recebimento da instalação.',\n    },\n    {\n      id: 'rede-declive', grupo: 'rede', tipo: 'declaratorio', critico: false,\n      item: 'Declividade de 0,5 % a 2 % no sentido do fluxo, com pontos de purga nas extremidades baixas',\n      norma: 'Boa prática de instalação pneumática',\n      dica: 'Sem caimento, o condensado se acumula em barrigas da linha e chega às ferramentas. '\n        + 'Cada ponto baixo precisa de dreno.',\n    },\n    {\n      id: 'rede-tomada', grupo: 'rede', tipo: 'declaratorio', critico: false,\n      item: 'Tomadas de serviço derivadas da geratriz superior do tubo (pescoço de ganso)',\n      norma: 'Boa prática de instalação pneumática',\n      dica: 'Derivação pela parte de cima impede que o condensado depositado no fundo do tubo desça '\n        + 'para o ponto de uso. Custa nada na montagem e é irreversível depois.',\n    },\n    {\n      id: 'rede-velocidade', grupo: 'rede', tipo: 'auto', critico: false,\n      item: 'Velocidade do ar dentro do limite adotado',\n      norma: 'Boa prática — 6 a 9 m/s em linha principal',\n      verificar: (x) => {\n        const lim = +x.estado.rede.vel_max_ms || 9;\n        const vDim = x.c.perda.velocidade_ms;\n        const vDes = x.rede && x.rede.ok ? x.rede.velocidade_max_ms : null;\n        const v = vDes !== null ? Math.max(vDim, vDes) : vDim;\n        const onde = vDes !== null && vDes > vDim ? 'rede desenhada' : 'tronco dimensionado';\n        if (v > lim) {\n          return NAO('Velocidade de ' + n(v, 2) + ' m/s no ' + onde + ', acima do limite de '\n            + n(lim, 1) + ' m/s. Ruído, arraste de condensado e perda de carga crescem com o quadrado '\n            + 'da velocidade. Aumente o diâmetro.');\n        }\n        if (v > lim * 0.9) {\n          return AT('Velocidade de ' + n(v, 2) + ' m/s no ' + onde + ', próxima do limite de '\n            + n(lim, 1) + ' m/s. Sem folga para ampliação futura.');\n        }\n        return OK('Velocidade máxima de ' + n(v, 2) + ' m/s no ' + onde + ', dentro do limite de '\n          + n(lim, 1) + ' m/s.');\n      },\n    },\n    {\n      id: 'rede-perda', grupo: 'rede', tipo: 'auto', critico: false,\n      item: 'Perda de carga total dentro do admissível',\n      norma: 'Boa prática — até 0,1 bar, ou 5 % da pressão de trabalho',\n      verificar: (x) => {\n        const adm = +x.estado.rede.perda_admissivel_bar || 0.10;\n        const dpDim = x.c.perda.perda_bar;\n        const dpDes = x.rede && x.rede.ok ? x.rede.perda_total_bar : null;\n        const dp = dpDes !== null ? Math.max(dpDim, dpDes) : dpDim;\n        if (dp > adm) {\n          return NAO('Perda de ' + n(dp, 4) + ' bar contra ' + n(adm, 3) + ' bar admitidos. '\n            + 'Cada 0,1 bar recuperado na rede permite baixar a pressão do compressor e cortar '\n            + 'cerca de 0,7 % da energia.');\n        }\n        return OK('Perda de ' + n(dp, 4) + ' bar, dentro dos ' + n(adm, 3) + ' bar admitidos.');\n      },\n    },\n    {\n      id: 'rede-pressao-ponto', grupo: 'rede', tipo: 'auto', critico: true,\n      item: 'Pressão disponível no ponto mais desfavorável',\n      norma: 'Requisito funcional dos consumidores',\n      verificar: (x) => {\n        const exig = x.c.dem.pressao_max_consumidor_bar;\n        if (!exig) return NA('Nenhum consumidor cadastrado com pressão exigida.');\n        if (!(x.rede && x.rede.ok)) {\n          return NA('Nenhuma rede desenhada no editor gráfico. A verificação ponto a ponto só é '\n            + 'possível com o traçado montado; o confronto pelo tronco equivalente está no item '\n            + '\"Pressão de trabalho suficiente para o consumidor mais exigente\".');\n        }\n        const pPonto = x.rede.pressao_minima_bar;\n        if (pPonto < exig) {\n          return NAO('Pressão de ' + n(pPonto, 2) + ' bar no pior ponto da rede desenhada contra '\n            + n(exig, 1) + ' bar exigidos pelo consumidor mais crítico. Eleve a pressão de trabalho, '\n            + 'aumente o diâmetro dos trechos críticos ou reveja o traçado.');\n        }\n        if (pPonto - exig < 0.3) {\n          return AT('Pressão de ' + n(pPonto, 2) + ' bar no pior ponto contra ' + n(exig, 1)\n            + ' bar exigidos: folga de apenas ' + n(pPonto - exig, 2) + ' bar. Sem margem para '\n            + 'sujeira de filtro ou ampliação da rede.');\n        }\n        return OK('Pressão de ' + n(pPonto, 2) + ' bar no pior ponto da rede desenhada, contra '\n          + n(exig, 1) + ' bar exigidos. Folga de ' + n(pPonto - exig, 2) + ' bar.');\n      },\n    },\n    {\n      id: 'rede-material', grupo: 'rede', tipo: 'declaratorio', critico: false,\n      item: 'Material da tubulação compatível com ar comprimido e com a pressão de trabalho',\n      norma: 'Especificação do fabricante da tubulação',\n      dica: 'Tubo de PVC comum não é adequado para ar comprimido: rompe de forma frágil e estilhaça. '\n        + 'Use aço, cobre ou sistemas de alumínio/polímero certificados para a aplicação.',\n    },\n\n    /* ---------- Elétrica ---------- */\n    {\n      id: 'ele-circuito', grupo: 'eletrica', tipo: 'auto', critico: false,\n      item: 'Circuito de alimentação dimensionado para a corrente do motor',\n      norma: 'ABNT NBR 5410, seções 6.2 e 6.3',\n      verificar: (x) => {\n        const kw = x.c.modelo ? x.c.modelo.potencia_kw : x.c.pot.potencia_comercial_kw;\n        if (!kw) return NA('Sem modelo definido para estimar a corrente.');\n        const rend = ENG.rendimentoMotor(kw);\n        const cosf = 0.85;\n        const In380 = kw * 1000 / (Math.sqrt(3) * 380 * cosf * rend);\n        return AT('Corrente nominal estimada em ' + n(In380, 1) + ' A a 380 V trifásico '\n          + '(cos φ 0,85, rendimento ' + n(rend * 100, 0) + ' %). Estimativa de projeto: dimensione '\n          + 'condutor, proteção e queda de tensão pela corrente de placa do motor efetivamente fornecido.');\n      },\n    },\n    {\n      id: 'ele-partida', grupo: 'eletrica', tipo: 'declaratorio', critico: false,\n      item: 'Proteção compatível com a corrente de partida do motor',\n      norma: 'ABNT NBR 5410 · IEC 60947',\n      dica: 'Partida direta em motor de indução puxa de 6 a 8 vezes a corrente nominal. A proteção '\n        + 'contra curto-circuito precisa suportar o transitório sem atuar; a proteção contra sobrecarga '\n        + 'é dimensionada pela corrente nominal.',\n    },\n    {\n      id: 'ele-aterramento', grupo: 'eletrica', tipo: 'declaratorio', critico: true,\n      item: 'Aterramento do quadro e da carcaça verificado',\n      norma: 'ABNT NBR 5410, seção 6.4 · NR-10',\n      dica: 'Continuidade do condutor de proteção medida e registrada no comissionamento.',\n    },\n    {\n      id: 'ele-harmonicas', grupo: 'eletrica', tipo: 'auto', critico: false,\n      item: 'Tratamento de harmônicas quando houver inversor de frequência',\n      norma: 'IEC 61000 · orientação do fabricante do inversor',\n      verificar: (x) => {\n        if (!x.c.modelo || !x.c.modelo.vsd) {\n          return NA('Modelo selecionado sem inversor de frequência.');\n        }\n        return AT('Modelo com inversor: prever reatância de linha ou filtro conforme orientação do '\n          + 'fabricante e verificar a distorção harmônica no ponto de conexão, sobretudo se houver '\n          + 'banco de capacitores na instalação.');\n      },\n    },\n\n    /* ---------- Qualidade do ar ---------- */\n    {\n      id: 'iso-1217', grupo: 'qualidade', tipo: 'declaratorio', critico: true,\n      item: 'Vazão declarada na proposta conforme ISO 1217',\n      norma: 'ISO 1217:2009, Anexo C',\n      dica: (x) => 'Exija o FAD referido às condições de aspiração, não o deslocamento teórico do bloco, '\n        + 'que é sempre maior. Vazão de projeto a atender: ' + n(x.c.dem.q_projeto_m3min, 2) + ' m³/min '\n        + '(' + n(ENG.UN.m3min_para_pcm(x.c.dem.q_projeto_m3min), 0) + ' pcm).',\n    },\n    {\n      id: 'iso-8573-classe', grupo: 'qualidade', tipo: 'auto', critico: false,\n      item: 'Classe de pureza do ar especificada',\n      norma: 'ISO 8573-1:2010',\n      verificar: (x) => OK('Classe requerida pela aplicação: ' + x.c.qual.designacao\n        + ' — ' + x.c.qual.descricao + '. Ponto de orvalho sob pressão: ' + x.c.qual.ponto_orvalho\n        + '. Registre a designação na especificação técnica, e não apenas \"ar seco e limpo\".'),\n    },\n    {\n      id: 'iso-secador', grupo: 'qualidade', tipo: 'auto', critico: true,\n      item: 'Secador compatível com a classe de água exigida',\n      norma: 'ISO 8573-1:2010 · ISO 7183:2007',\n      verificar: (x) => {\n        const req = x.c.qual.secador;\n        const integrado = x.c.modelo && x.c.modelo.secador_integrado;\n        if (/sem secador/i.test(req)) {\n          return OK('A classe exigida dispensa secador dedicado: ' + req + '. '\n            + 'Mantenha separador de condensado e purgador.');\n        }\n        if (integrado) {\n          return AT('Requisito: ' + req + '. O modelo declara secador integrado — confirme no catálogo '\n            + 'do fabricante se o ponto de orvalho atendido é o de ' + x.c.qual.ponto_orvalho + '.');\n        }\n        return AT('Requisito: ' + req + ' para atingir ponto de orvalho de ' + x.c.qual.ponto_orvalho\n          + '. O modelo selecionado não declara secador integrado — o secador precisa ser especificado '\n          + 'e orçado à parte, com capacidade conforme ISO 7183.');\n      },\n    },\n    {\n      id: 'iso-filtragem', grupo: 'qualidade', tipo:
