 const labRent=sum(labs.map(x=>x.areaCost));
 const furnitureOffice=occ.officePersonMonths*generalCost('B8953');
 const furnitureRes=resEnabled?occ.resPersonMonths*generalCost('B8954'):0;
 const cif=officeRent+resRent+topoRent+labRent+furnitureOffice+furnitureRes;
 const diverseOffice=occ.officePersonMonths*generalCost('B8959');
 const diverseRes=resEnabled?occ.resPersonMonths*generalCost('B8960'):0;
 const ccd=diverseOffice+diverseRes;
 const topoBasketCost=topoMonths*topoBaskets*generalCost('B8958');
 const cem=topoBasketCost+sum(labs.map(x=>x.basketCost));
 return {occ,resEnabled,autoOffice,autoRes,officeArea,resArea,officeRent,resRent,topoMonths,topoBaskets,topoRent,labs,labRent,furnitureOffice,furnitureRes,cif,diverseOffice,diverseRes,ccd,topoBasketCost,cem};
}
function mobilizationCalc(){
 const occ=occupancyCalc(),veh=vehicleCalc(), local=state.project.localDistribution;
 const upper=Object.entries(occ.upperPeakByCode).map(([code,q])=>({code,name:state.bases.professionals[code]?.name||code,q,cost:local?0:q*2*Number(state.mob.travelUnit||0)}));
 const autoLabor=sum(upper.map(x=>x.cost));
 const speed=Math.max(.01,Number(state.mob.equipmentSpeed)||60),dist=Math.max(0,Number(state.mob.equipmentDistance)||0);
 const fleet=Object.entries(veh.peak).map(([code,q])=>{const v=state.bases.vehicles[code];const cost=q*2*(dist/speed)*Number(v?.prod||0);return {code,name:v?.name||code,q,prod:v?.prod||0,cost}});
 const autoEquip=sum(fleet.map(x=>x.cost));
 const labor=state.mob.laborManual?Number(state.mob.laborManualValue||0):autoLabor;
 const equipment=state.mob.equipmentManual?Number(state.mob.equipmentManualValue||0):autoEquip;
 return {upper,autoLabor,fleet,autoEquip,labor,equipment,total:labor+equipment};
}
function extrasCalc(){
 const rows=state.extras.map(x=>({...x,total:Number(x.qty||0)*Number(x.unitCost||0)}));
 const dp=sum(rows.filter(x=>x.group==='dp').map(x=>x.total));
 const enc=sum(rows.filter(x=>x.group==='enc').map(x=>x.total));
 const adj=sum(rows.filter(x=>x.group==='adj').map(x=>x.total));
 return {rows,dp,enc,adj};
}
function bdiCalc(){
 const b=state.bdi,selic=Number(b.selic)/100,dfRaw=(1+selic)**(1/12)-1,df=Math.round(dfRaw*10000)/10000,ac=Number(b.acCd)/100,profit=Number(b.profitCd)/100;
 const pvRates=(Number(b.riskPv)+Number(b.guaranteePv)+Number(b.pisPv)+Number(b.cofinsPv)+Number(b.issPv))/100;
 const denom=1-df-pvRates;let factor=denom>0?(1+ac+profit-profit*df)/denom:NaN;
 let cd=(factor-1)*100,pv=(factor-1)/factor*100;if(b.manual){cd=Number(b.manualCd)||0;factor=1+cd/100;pv=cd/(100+cd)*100}
 const comp=[
   {name:'Administração central',basis:'CD',pv:100*ac/factor,cd:100*ac},
   {name:'Despesas financeiras',basis:'PV – lucro',pv:100*df*(1-profit/factor),cd:100*df*(factor-profit)},
   {name:'Riscos',basis:'PV',pv:Number(b.riskPv),cd:Number(b.riskPv)*factor},
   {name:'Seguros e garantias',basis:'PV',pv:Number(b.guaranteePv),cd:Number(b.guaranteePv)*factor},
   {name:'Lucro',basis:'CD',pv:100*profit/factor,cd:100*profit},
   {name:'PIS',basis:'PV',pv:Number(b.pisPv),cd:Number(b.pisPv)*factor},
   {name:'COFINS',basis:'PV',pv:Number(b.cofinsPv),cd:Number(b.cofinsPv)*factor},
   {name:'ISSQN',basis:'PV',pv:Number(b.issPv),cd:Number(b.issPv)*factor}
 ];
 return {df:df*100,factor,cd,pv,comp,valid:Number.isFinite(factor)&&factor>1};
}
function calcAll(){
 const labor=laborCalc(),vehicles=vehicleCalc(),fac=facilitiesCalc(),mob=mobilizationCalc(),extras=extrasCalc(),bdi=bdiCalc();
 const parts={CMO:labor.total,CV:vehicles.total,CIF:fac.cif,CMD:mob.total,CDP:extras.dp,CCD:fac.ccd,CEM:fac.cem,CENC:extras.enc,AJUSTES:extras.adj};
 const ct=sum(Object.values(parts)),bdiValue=ct*(bdi.cd/100),pv=ct+bdiValue;
 return {labor,vehicles,fac,mob,extras,bdi,parts,ct,bdiValue,pv};
}

function validation(c){
 const out=[];const a=autoPorte();
 if(Number(state.project.extent)<=0)out.push(['bad','Informe extensão positiva.']);
 if(Number(state.project.durationContract)<=0||Number(state.project.durationPorte)<=0)out.push(['bad','Os prazos devem ser positivos.']);
 if(state.project.porteMode==='manual'&&!state.project.porteJustification.trim())out.push(['bad','A adoção manual do porte requer justificativa.']);
 if(Object.keys(state.overrides).length&&!state.project.technicalJustification.trim())out.push(['bad','Há quantitativos de equipe alterados sem justificativa técnica.']);
 if((state.project.areaOfficeManual!==null&&state.project.areaOfficeManual!=='')||(state.project.areaResidenceManual!==null&&state.project.areaResidenceManual!==''))if(!state.project.technicalJustification.trim())out.push(['bad','Áreas manuais foram adotadas sem justificativa técnica.']);
 if((group()==='implantacao'||group()==='restauracao')&&activeCount('fronts')===0)out.push(['bad','A equipe de frentes de serviço está sem permanência; confirme o cronograma.']);
 if(group()==='conservacao'&&Math.abs(units('fronts')-conservationFrontTeams())>.001&&!state.project.technicalJustification.trim())out.push(['bad','O número de equipes de conservação diverge do cálculo por 200 kmf sem justificativa.']);
 if(!c.bdi.valid)out.push(['bad','A composição do BDI gerou denominador inválido.']);
 if(c.ct<=0)out.push(['bad','O custo total é nulo.']);
 if(!out.length)out.push(['ok','Verificações automáticas concluídas. Ainda é necessária revisão do cronograma, logística, escopo e justificativas pelo orçamentista responsável.']);
 return out;
}

function combinedValidation(sup,dep){
  const out=[];
  if(!state.scope.supervision&&!state.scope.expropriation)out.push(['bad','Selecione ao menos um módulo no escopo do orçamento.']);
  if(state.scope.supervision)out.push(...validation(sup));
  if(state.scope.expropriation)out.push(...desValidation(dep));
  return out;
}
renderBudget = function(){
  normalizeState();const sup=calcAll(),dep=desCalc(),supOn=!!state.scope.supervision,depOn=!!state.scope.expropriation,bdi=bdiCalc();
  const ct=(supOn?sup.ct:0)+(depOn?dep.ct:0),bdiValue=ct*(bdi.cd/100),pv=ct+bdiValue;
  const serviceRows=[];
  if(supOn)serviceRows.push(['Supervisão de obras',sup.ct,sup.bdiValue,sup.pv]);
  if(depOn)serviceRows.push(['Projeto Executivo de Desapropriação',dep.ct,dep.bdiValue,dep.pv]);
  const serviceTableRows=serviceRows.map(x=>`<tr><td><b>${x[0]}</b></td><td class="num">${money.format(x[1])}</td><td class="num">${money.format(x[2])}</td><td class="num"><b>${money.format(x[3])}</b></td><td class="num">${pv?nf2.format(x[3]/pv*100):'0,00'}%</td></tr>`).concat([`<tr><td><b>CONSOLIDADO</b></td><td class="num"><b>${money.format(ct)}</b></td><td class="num"><b>${money.format(bdiValue)}</b></td><td class="num"><b>${money.format(pv)}</b></td><td class="num"><b>100,00%</b></td></tr>`]);
  const partRows=[];
  const addParts=(service,parts)=>Object.entries(parts).forEach(([k,v])=>partRows.push(`<tr><td>${service}</td><td>${k}</td><td class="num"><b>${money.format(v)}</b></td><td class="num">${ct?nf2.format(v/ct*100):'0,00'}%</td></tr>`));
  if(supOn)addParts('Supervisão',sup.parts);if(depOn)addParts('Desapropriação',dep.parts);
  const max=Math.max(1,...serviceRows.map(x=>x[3]));
  const bars=serviceRows.map(x=>`<div class="bar-row"><div><span class="tag">${x[0]}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(1,x[3]/max*100)}%"></div></div><div class="num"><b>${money.format(x[3])}</b><br><span class="tiny">${pv?nf2.format(x[3]/pv*100):'0,00'}%</span></div></div>`).join('');

function resActivityCost(a){
  return sum(Object.entries(a.comp).map(([code,q])=>q*a.teamMonths*resCost(code)));
}
function resLaborCalc(activities=resActivities()){
  const fixedDuration=resFixedDuration(),rows=[];let fixedTotal=0,variableTotal=0;
  for(const [code,q] of Object.entries(resFixedComp())){
    const p=resProf(code);if(!p)continue;const pm=q*fixedDuration,total=pm*resCost(code);
    fixedTotal+=total;rows.push({key:'fixed',phase:'Global',product:null,code,name:p.name,level:p.level,qty:q,teamMonths:fixedDuration,personMonths:pm,cost:resCost(code),total,fixed:true});
  }
  for(const a of activities)for(const [code,q] of Object.entries(a.comp)){
    const p=resProf(code);if(!p)continue;const pm=q*a.teamMonths,total=pm*resCost(code);
    variableTotal+=total;rows.push({key:a.key,phase:a.phase,product:a.product,code,name:p.name,level:p.level,qty:q,teamMonths:a.teamMonths,personMonths:pm,cost:resCost(code),total,fixed:false});
  }
  return {rows,fixedTotal,variableTotal,total:fixedTotal+variableTotal};
}
function resVehicleCalc(activities=resActivities()){
  const rows=[];let total=0;
  const dur=resFixedDuration(),fixedMonthly=resVehicleMonthly('E8889'),fixed=fixedMonthly*dur;
  if(dur>0){rows.push({key:'fixed',phase:'Global',product:null,code:'E8889',teamMonths:dur,monthly:fixedMonthly,total:fixed,fixed:true});total+=fixed}
  for(const a of activities)if(a.vehicle){
    const monthly=resVehicleMonthly(a.vehicle),v=a.teamMonths*monthly;
    rows.push({key:a.key,phase:a.phase,product:a.product,code:a.vehicle,teamMonths:a.teamMonths,monthly,total:v,fixed:false});
    total+=v;
  }
  return {rows,total};
}
function resOccupancyCalc(activities=resActivities()){
  const dur=resFixedDuration(),r=res();
  let officePM=0,resPM=0,topoPM=0;
  const byProduct={};Object.keys(RES_PRODUCT_LABELS).forEach(k=>byProduct[k]={officePM:0,resPM:0,topoPM:0});
  const addComp=(comp,tm,product)=>{
    for(const [code,q] of Object.entries(comp)){
      const p=resProf(code);if(!p)continue;
      const pm=q*tm;officePM+=pm;if(p.level==='superior')resPM+=pm;if(RES_TOPO_CODES.has(code))topoPM+=pm;
      if(product&&byProduct[product]){
        byProduct[product].officePM+=pm;
        if(p.level==='superior')byProduct[product].resPM+=pm;
        if(RES_TOPO_CODES.has(code))byProduct[product].topoPM+=pm;
      }
    }
  };
  addComp(resFixedComp(),dur,null);activities.forEach(a=>addComp(a.comp,a.teamMonths,a.product));
  const autoOffice=Math.max(.25,Math.ceil((officePM/Math.max(dur,1))*1.25*4)/4);
  const autoResidence=Math.max(0,Math.ceil((resPM/Math.max(dur,1))*1.25*4)/4);
  const officePeak=(r.peakOfficeManual!==null&&r.peakOfficeManual!=='')?nonneg(r.peakOfficeManual):autoOffice;
  const residencePeak=(r.peakResidenceManual!==null&&r.peakResidenceManual!=='')?nonneg(r.peakResidenceManual):autoResidence;
  const autoOfficeArea=officePeak>0?57.95/2+4.5*officePeak:0;
  const autoResidenceArea=12.41*residencePeak;
  const officeArea=(r.areaOfficeManual!==null&&r.areaOfficeManual!=='')?nonneg(r.areaOfficeManual):autoOfficeArea;
  const residenceArea=(r.areaResidenceManual!==null&&r.areaResidenceManual!=='')?nonneg(r.areaResidenceManual):autoResidenceArea;
  const resEnabled=r.residenceMode==='incluir'&&!r.localDistribution;
  const officeRent=r.officeMode==='locado'?officeArea*dur*resGeneral('B8951'):0;
  const residenceRent=resEnabled?residenceArea*dur*resGeneral('B8952'):0;
  const topoTeamMonths=sum(activities.filter(a=>a.basket).map(a=>a.teamMonths));
  const topoRent=topoTeamMonths*14.77*resGeneral('B8951');
  const furnitureOffice=officePM*resGeneral('B8953');
  const furnitureResidence=resEnabled?resPM*resGeneral('B8954'):0;
  const diverseOffice=officePM*resGeneral('B8959');
  const diverseResidence=resEnabled?resPM*resGeneral('B8960'):0;
  return {
    officePM,resPM,topoPM,byProduct,autoOffice,autoResidence,officePeak,residencePeak,
    autoOfficeArea,autoResidenceArea,officeArea,residenceArea,resEnabled,
    officeRent,residenceRent,topoTeamMonths,topoRent,
    furnitureOffice,furnitureResidence,cif:officeRent+residenceRent+topoRent+furnitureOffice+furnitureResidence,
    diverseOffice,diverseResidence,ccd:diverseOffice+diverseResidence
  };
}
function resSocialInputsCalc(activities=resActivities(),labor=resLaborCalc(activities)){
  const r=res(),fixedMonthly=sum(Object.entries(resFixedComp()).map(([c,q])=>q*resCost(c)));
  const items=[];
  const add=(label,pct,reference,product=null)=>{const cost=reference*pct/100;items.push({label,pct,reference,cost,product});return cost};
  let total=0;
  if(r.phases.cadastral)total+=add('Equipe fixa — fase cadastral',20.50,fixedMonthly*nonneg(r.cadastralDuration));
  if(r.phases.executive)total+=add('Equipe fixa — fase executiva',14.20,fixedMonthly*nonneg(r.executiveDuration));
  const ac=Object.fromEntries(activities.map(a=>[a.key,a]));
  if(ac.socialPosts)total+=add('Trabalho social — plantões',2.20,resActivityCost(ac.socialPosts));
  if(ac.socialLectures)total+=add('Trabalho social — palestras',191.50,resActivityCost(ac.socialLectures));
  if(ac.socialMeetings)total+=add('Trabalho social — reuniões',131.90,resActivityCost(ac.socialMeetings));
  if(ac.socialAssemblies)total+=add('Trabalho social — assembleias',60.60,resActivityCost(ac.socialAssemblies));
  return {items,total};
}
function resEquipmentCalc(activities=resActivities(),labor=resLaborCalc(activities)){
  const topoRows=activities.filter(a=>a.basket).map(a=>({key:a.key,product:a.product,teamMonths:a.teamMonths,cost:a.teamMonths*resGeneral('B8958')}));
  const topo=sum(topoRows.map(x=>x.cost)),social=resSocialInputsCalc(activities,labor);
  return {topoRows,topo,social,total:topo+social.total};
}
function resMobilizationCalc(){
  const r=res(),m=r.mob;
  const autoLabor=r.localDistribution?0:nonneg(m.laborMobilizations)*2*nonneg(m.travelUnit);
  const labor=m.laborManual?nonneg(m.laborManualValue):autoLabor;
  const speed=Math.max(.01,nonneg(m.equipmentSpeed)||60),dist=nonneg(m.equipmentDistance);
  const e8899=nonneg(m.e8889Qty)*2*(dist/speed)*Number(state.bases.vehicles?.E8889?.prod||0);
  const e8887=nonneg(m.e8887Qty)*2*(dist/speed)*Number(state.bases.vehicles?.E8887?.prod||0);
  const autoEquipment=e8899+e8887,equipment=m.equipmentManual?nonneg(m.equipmentManualValue):autoEquipment;
  return {autoLabor,labor,autoEquipment,equipment,e8899,e8887,total:labor+equipment};
}
function resExtrasCalc(){
  const rows=(res().extras||[]).map(x=>({...x,qty:nonneg(x.qty),unitCost:nonneg(x.unitCost),total:nonneg(x.qty)*nonneg(x.unitCost)}));
  return {rows,dp:sum(rows.filter(x=>x.group==='dp').map(x=>x.total)),enc:sum(rows.filter(x=>x.group==='enc').map(x=>x.total)),adj:sum(rows.filter(x=>x.group==='adj').map(x=>x.total))};
}
function resCalc(){
  const activities=resActivities(),labor=resLaborCalc(activities),vehicles=resVehicleCalc(activities),occ=resOccupancyCalc(activities),equipment=resEquipmentCalc(activities,labor),mob=resMobilizationCalc(),extras=resExtrasCalc(),bdi=bdiCalc();
  const parts={CMO:labor.total,CV:vehicles.total,CIF:occ.cif,CMD:mob.total,CDP:extras.dp,CCD:occ.ccd,CEM:equipment.total,CENC:extras.enc,AJUSTES:extras.adj};
  const ct=sum(Object.values(parts)),bdiValue=ct*bdi.cd/100,pv=ct+bdiValue;
  const direct={};Object.keys(RES_PRODUCT_LABELS).forEach(k=>direct[k]={labor:0,vehicles:0,furnitureOffice:0,furnitureResidence:0,diverseOffice:0,diverseResidence:0,topo:0});
  for(const row of labor.rows)if(row.product&&direct[row.product])direct[row.product].labor+=row.total;
  for(const row of vehicles.rows)if(row.product&&direct[row.product])direct[row.product].vehicles+=row.total;
  for(const [p,o] of Object.entries(occ.byProduct))if(direct[p]){
    direct[p].furnitureOffice=o.officePM*resGeneral('B8953');
    direct[p].furnitureResidence=occ.resEnabled?o.resPM*resGeneral('B8954'):0;
    direct[p].diverseOffice=o.officePM*resGeneral('B8959');
    direct[p].diverseResidence=occ.resEnabled?o.resPM*resGeneral('B8960'):0;
  }
  equipment.topoRows.forEach(x=>{if(x.product&&direct[x.product])direct[x.product].topo+=x.cost});
  const productRows=Object.entries(direct).map(([product,v])=>({product,label:RES_PRODUCT_LABELS[product],...v,cd:sum(Object.values(v))})).filter(x=>x.cd>0);
  const directTotal=sum(productRows.map(x=>x.cd));productRows.forEach(x=>{x.kr=directTotal?x.cd/directTotal:0;x.pv=pv*x.kr});
  const phaseCosts={Cadastral:0,Executiva:0,'Pós-morar':0,Global:0};
  labor.rows.forEach(x=>phaseCosts[x.phase]=(phaseCosts[x.phase]||0)+x.total);
  return {activities,labor,vehicles,occ,equipment,mob,extras,bdi,parts,ct,bdiValue,pv,productRows,directTotal,phaseCosts,duration:resFixedDuration()};
}
function resValidation(c=resCalc()){
  const r=res(),out=[];
  if(nonneg(r.families)<=0)out.push(['bad','Informe o número de famílias/ocupações irregulares.']);
  if(nonneg(r.affectedBuildings)<=0)out.push(['bad','Informe o número de benfeitorias atingidas.']);
  for(const phase of ['cadastral','executive','post']){
    const dur=phase==='cadastral'?r.cadastralDuration:phase==='executive'?r.executiveDuration:r.postMonths;
    if(r.phases[phase]&&nonneg(dur)<=0)out.push(['bad',`A duração da fase ${phase} deve ser positiva.`]);
  }
  const maxByPhase={Cadastral:0,Executiva:0,'Pós-morar':0};
  c.activities.forEach(a=>maxByPhase[a.phase]=Math.max(maxByPhase[a.phase],a.teamMonths/a.teams));
  if(r.phases.cadastral&&maxByPhase.Cadastral>nonneg(r.cadastralDuration)+.01)out.push(['bad',`Uma atividade cadastral exige ${nf2.format(maxByPhase.Cadastral)} meses-calendário, acima dos ${nf2.format(r.cadastralDuration)} meses informados.`]);
  if(r.phases.executive&&maxByPhase.Executiva>nonneg(r.executiveDuration)+.01)out.push(['bad',`Uma atividade executiva exige ${nf2.format(maxByPhase.Executiva)} meses-calendário, acima dos ${nf2.format(r.executiveDuration)} meses informados.`]);
  if((r.peakOfficeManual!==null||r.peakResidenceManual!==null||r.areaOfficeManual!==null||r.areaResidenceManual!==null)&&!String(r.technicalJustification||'').trim())out.push(['info','Os picos/áreas manuais devem ser conferidos com o cronograma detalhado e justificados no termo de referência.']);
  if(['P8001','P8033','P8041'].some(c=>state.bases.professionals[c]?.sourceNote))out.push(['info','P8001, P8033 e P8041 estão inicialmente com custos do Caderno de Aplicação de outubro/2023. Atualize-os na aba Bases Tabeladas antes do uso oficial.']);
  if(!c.bdi.valid)out.push(['bad','A composição do BDI gerou denominador inválido.']);
  if(!out.some(x=>x[0]==='bad'))out.push(['ok','Dimensionamento paramétrico concluído. Revise o cronograma detalhado, as modalidades efetivamente adotadas e as possíveis duplicidades com a desapropriação.']);
  return out;
}

  const notice=$('#projectContent .scope-grid')?.parentElement?.querySelector('.notice.info');
  if(notice)notice.innerHTML='<b>Consolidação:</b> os módulos preservam as metodologias próprias. Desapropriação e reassentamento são orçados separadamente; eventual contratação conjunta exige identificar duplicidades e economias de escala.';

function combinedValidationV4(sup,dep,re){
  const out=combinedValidation(sup,dep);
  if(state.scope.resettlement)out.push(...resValidation(re).filter(x=>x[0]==='bad'));
  if(!out.some(x=>x[0]==='bad'))out.push(['ok','Orçamento consolidado calculado. Revise possíveis compartilhamentos e duplicidades entre os módulos.']);
  return out;
}

renderBudget=function(){
  normalizeState();
  const supOn=!!state.scope.supervision,depOn=!!state.scope.expropriation,resOn=!!state.scope.resettlement;
  const sup=calcAll(),dep=desCalc(),re=resCalc(),bdi=bdiCalc();
  const services=[];
  if(supOn)services.push({name:'Supervisão',ct:sup.ct,pv:sup.pv,parts:sup.parts,detail:nature().label});
  if(depOn)services.push({name:'Desapropriação',ct:dep.ct,pv:dep.pv,parts:dep.parts,detail:'RMA + RP + CTD'});
  if(resOn)services.push({name:'Reassentamento',ct:re.ct,pv:re.pv,parts:re.parts,detail:'Cadastral + Executiva + Pós-morar'});
  const ct=sum(services.map(x=>x.ct)),bdiValue=ct*bdi.cd/100,pv=ct+bdiValue;
  const serviceRows=services.map(x=>[x.name,x.detail,x.ct,x.pv,pv?x.pv/pv*100:0]);
  const serviceTableRows=serviceRows.map(x=>`<tr><td><b>${x[0]}</b><br><span class="tiny">${esc(x[1])}</span></td><td class="num">${money.format(x[2])}</td><td class="num">${money.format(x[3]-x[2])}</td><td class="num"><b>${money.format(x[3])}</b></td><td class="num">${nf2.format(x[4])}%</td></tr>`);
  serviceTableRows.push(`<tr><td><b>Total</b></td><td class="num"><b>${money.format(ct)}</b></td><td class="num"><b>${money.format(bdiValue)}</b></td><td class="num"><b>${money.format(pv)}</b></td><td class="num"><b>100,00%</b></td></tr>`);
  const max=Math.max(1,...serviceRows.map(x=>x[3]));
  const bars=serviceRows.map(x=>`<div class="bar-row"><div><span class="tag">${x[0]}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(1,x[3]/max*100)}%"></div></div><div class="num"><b>${money.format(x[3])}</b><br><span class="tiny">${nf2.format(x[4])}%</span></div></div>`).join('');
  const partRows=[];services.forEach(s=>Object.entries(s.parts).forEach(([k,v])=>partRows.push(`<tr><td>${s.name}</td><td>${k}</td><td class="num"><b>${money.format(v)}</b></td><td class="num">${ct?nf2.format(v/ct*100):'0,00'}%</td></tr>`)));
  const checks=combinedValidationV4(sup,dep,re).map(x=>`<div class="notice ${x[0]}">${x[1]}</div>`).join('');
  const maxDuration=Math.max(supOn?duration():0,depOn?dep.duration:0,resOn?re.duration:0,1);
  const depProducts=depOn?dep.productRows.map(x=>`<tr><td>${esc(x.label)}</td><td class="num">${money.format(x.cd)}</td><td class="num">${nf2.format(x.kr*100)}%</td><td class="num"><b>${money.format(x.pv)}</b></td></tr>`):[];
  const resProducts=resOn?re.productRows.map(x=>`<tr><td>${esc(x.label)}</td><td class="num">${money.format(x.cd)}</td><td class="num">${nf2.format(x.kr*100)}%</td><td class="num"><b>${money.format(x.pv)}</b></td></tr>`):[];
  $('#budgetContent').innerHTML=`<div class="print-head"><h1>${esc(state.project.name)}</h1><p>Orçamento consolidado de Engenharia Consultiva</p></div>
  <div class="metrics">${metric('Custo direto consolidado',money.format(ct),'módulos selecionados')}${metric('BDI sobre CD',nf2.format(bdi.cd)+'%',money.format(bdiValue))}${metric('Preço de venda consolidado',money.format(pv),'PV = CT × (1 + BDI)',true)}${metric('Supervisão',supOn?money.format(sup.pv):'Não incluída',supOn?nature().label:'módulo desativado')}${metric('Desapropriação',depOn?money.format(dep.pv):'Não incluída',depOn?'Projeto Executivo':'módulo desativado')}${metric('Reassentamento',resOn?money.format(re.pv):'Não incluído',resOn?nf2.format(re.duration)+' meses':'módulo desativado')}${metric('Média mensal referencial',money.format(pv/maxDuration),nf2.format(maxDuration)+' meses')}</div>
  <div class="grid g2"><div class="card"><h2>Resumo por serviço</h2>${table(['Serviço','Custo direto','BDI','Preço de venda','Participação'],serviceTableRows)}<div class="formula">PV consolidado = ${money.format(ct)} × (1 + ${nf4.format(bdi.cd/100)}) = ${money.format(pv)}</div></div><div class="card"><h2>Participação dos módulos</h2><div class="bar-list">${bars||'<p class="small">Nenhum módulo selecionado.</p>'}</div></div></div>
  <div class="card" style="margin-top:15px"><h2>Parcelas do custo direto</h2>${table(['Módulo','Parcela','Custo','% do CT consolidado'],partRows)}</div>
  ${depOn?`<div class="card" style="margin-top:15px"><h2>Produtos da desapropriação</h2>${table(['Produto','Custo diretamente atribuível','KR','Preço de venda'],depProducts)}</div>`:''}
  ${resOn?`<div class="card" style="margin-top:15px"><h2>Produtos do reassentamento</h2>${table(['Produto','Custo diretamente atribuível','KR','Preço de venda'],resProducts)}</div>`:''}
  <div class="grid g2" style="margin-top:15px"><div class="card"><h2>Memória consolidada</h2><div class="formula">Módulos: ${services.map(x=>x.name).join(' + ')||'nenhum'}<br>Base principal: abril/2026<br>BDI: junho/2026 — SELIC 14,25% a.a.<br><br>${services.map(x=>`${x.name} — CT: ${money.format(x.ct)} | PV: ${money.format(x.pv)}`).join('<br>')}<br><br>CT consolidado: ${money.format(ct)}<br>BDI: ${money.format(bdiValue)}<br>PV consolidado: ${money.format(pv)}</div></div><div class="card"><h2>Verificações</h2>${checks}<label>Notas do orçamento</label><textarea data-state-notes>${esc(state.notes)}</textarea></div></div>
  <div class="card" style="margin-top:15px"><h2>Relatório e intercâmbio</h2><div class="actions no-print"><button data-action="print">Imprimir / salvar em PDF</button><button class="secondary" data-action="export-csv">Exportar CSV</button><button class="secondary" data-action="export-json">Exportar projeto JSON</button><button class="ghost" data-action="import-json">Importar projeto JSON</button><button class="ghost" data-action="save-local">Salvar no navegador</button></div><div class="source-box"><b>Base metodológica:</b> Manuais de Custos de Supervisão de Obras, Desapropriação e Reassentamento, primeiras edições, 2024. O sistema não inclui indenizações de desapropriação, aquisição de imóveis, construção das unidades habitacionais ou pagamento de aluguel social; ele estima os serviços de engenharia consultiva.</div></div>`;
};

function mgLaborCalc(){const m=mg(),rows=[];let total=0;for(const [code,q]of Object.entries(mgFixedComp())){const t=q*nonneg(m.durationContract)*v5Cost(code);rows.push({team:'fixed',code,name:v5Prof(code)?.name||code,qty:q,months:nonneg(m.durationContract),cost:v5Cost(code),total:t,level:v5Prof(code)?.level});total+=t}for(const [code,q]of Object.entries(mgFieldComp())){const t=q*nonneg(m.durationWorks)*v5Cost(code);rows.push({team:'field',code,name:v5Prof(code)?.name||code,qty:q,months:nonneg(m.durationWorks),cost:v5Cost(code),total:t,level:v5Prof(code)?.level});total+=t}if(nonneg(m.consultantMonths)>0){const t=nonneg(m.consultantMonths)*v5Cost('P8060');rows.push({team:'consultant',code:'P8060',name:v5Prof('P8060')?.name||'Consultor',qty:1,months:nonneg(m.consultantMonths),cost:v5Cost('P8060'),total:t,level:'superior'});total+=t}return{rows,total}}
function mgVehicleCalc(){const m=mg(),fieldQty=m.fieldVehicleManual!==null&&m.fieldVehicleManual!==''?nonneg(m.fieldVehicleManual):Math.max(1,Math.ceil(nonneg(m.extent)/200)),fixedMonthly=v5VehicleMonthly('E8889'),fieldMonthly=v5VehicleMonthly(m.fieldVehicleCode||'E8889',fieldQty);return{fieldQty,fixedMonthly,fieldMonthly,fixed:fixedMonthly*nonneg(m.durationContract),field:fieldMonthly*nonneg(m.durationWorks),total:fixedMonthly*nonneg(m.durationContract)+fieldMonthly*nonneg(m.durationWorks)}}
function mgOccCalc(){const m=mg(),fd=nonneg(m.durationContract),wd=nonneg(m.durationWorks),fixed=mgFixedComp(),field=mgFieldComp();let officePM=0,resPM=0;for(const[c,q]of Object.entries(fixed)){officePM+=q*fd;if(v5Prof(c)?.level==='superior')resPM+=q*fd}for(const[c,q]of Object.entries(field)){officePM+=q*wd;if(v5Prof(c)?.level==='superior')resPM+=q*wd}const dur=Math.max(.01,fd),autoOffice=Math.max(1,Math.ceil(officePM/dur*1.15*4)/4),autoResidence=Math.ceil(resPM/dur*1.15*4)/4,officePeak=m.peakOfficeManual!==null&&m.peakOfficeManual!==''?nonneg(m.peakOfficeManual):autoOffice,residencePeak=m.peakResidenceManual!==null&&m.peakResidenceManual!==''?nonneg(m.peakResidenceManual):autoResidence,officeArea=m.areaOfficeManual!==null&&m.areaOfficeManual!==''?nonneg(m.areaOfficeManual):57.95/2+4.5*officePeak,residenceArea=m.areaResidenceManual!==null&&m.areaResidenceManual!==''?nonneg(m.areaResidenceManual):12.41*residencePeak,resEnabled=m.residenceMode==='incluir'&&!m.localDistribution,officeRent=m.officeMode==='locado'?officeArea*fd*v5Gen('B8951'):0,residenceRent=resEnabled?residenceArea*fd*v5Gen('B8952'):0,furnitureOffice=officePM*v5Gen('B8953'),furnitureResidence=resEnabled?resPM*v5Gen('B8954'):0,diverseOffice=officePM*v5Gen('B8959'),diverseResidence=resEnabled?resPM*v5Gen('B8960'):0;return{officePM,resPM,autoOffice,autoResidence,officePeak,residencePeak,officeArea,residenceArea,resEnabled,officeRent,residenceRent,furnitureOffice,furnitureResidence,cif:officeRent+residenceRent+furnitureOffice+furnitureResidence,diverseOffice,diverseResidence,ccd:diverseOffice+diverseResidence}}
function mgMobCalc(){const m=mg(),x=m.mob;const autoLabor=m.localDistribution?0:nonneg(x.laborMobilizations)*2*nonneg(x.travelUnit),labor=x.laborManual?nonneg(x.laborManualValue):autoLabor,speed=Math.max(.01,nonneg(x.equipmentSpeed)||60),qty=1+(m.fieldVehicleManual!==null&&m.fieldVehicleManual!==''?nonneg(m.fieldVehicleManual):Math.max(1,Math.ceil(nonneg(m.extent)/200))),autoEquipment=2*(nonneg(x.equipmentDistance)/speed)*qty*Number(state.bases.vehicles[m.fieldVehicleCode||'E8889']?.prod||0),equipment=x.equipmentManual?nonneg(x.equipmentManualValue):autoEquipment;return{autoLabor,labor,autoEquipment,equipment,total:labor+equipment}}
function mgCalc(){const labor=mgLaborCalc(),vehicles=mgVehicleCalc(),occ=mgOccCalc(),mob=mgMobCalc(),extras=v5ExtrasCalc(mg().extras),bdi=bdiCalc();const parts={CMO:labor.total,CV:vehicles.total,CIF:occ.cif,CMD:mob.total,CDP:extras.dp,CCD:occ.ccd,AJUSTES:extras.adj};const ct=sum(Object.values(parts)),bdiValue=ct*bdi.cd/100,pv=ct+bdiValue;return{labor,vehicles,occ,mob,extras,parts,ct,bdiValue,pv,bdi,duration:nonneg(mg().durationContract)}}
function mgValidation(c=mgCalc()){const m=mg(),out=[];if(nonneg(m.extent)<=0)out.push(['bad','Informe a extensão total das obras gerenciadas.']);if(nonneg(m.durationContract)<=0||nonneg(m.durationWorks)<=0)out.push(['bad','Informe prazos positivos para o contrato e para as obras gerenciadas.']);if(nonneg(m.durationWorks)>nonneg(m.durationContract))out.push(['info','O período das obras supera o prazo do contrato de gerenciamento; verifique a coerência do cronograma.']);if(!String(m.technicalJustification||'').trim()&&m.fieldVehicleManual!==null)out.push(['info','O quantitativo manual de veículos deve ser justificado.']);if(!out.some(x=>x[0]==='bad'))out.push(['ok','Equipe vinculada dimensionada pela extensão total das obras gerenciadas, conforme a Tabela 3 do Manual.']);return out}

function v5Services(){const sup=calcAll(),dep=desCalc(),re=resCalc(),en=envCalc(),ma=mgCalc();const services=[];if(state.scope.supervision)services.push({name:'Supervisão',detail:nature().label,calc:sup});if(state.scope.expropriation)services.push({name:'Desapropriação',detail:'RMA + RP + CTD',calc:dep});if(state.scope.resettlement)services.push({name:'Reassentamento',detail:'Cadastral + Executiva + Pós-morar',calc:re});if(state.scope.environmental)services.push({name:'Gestão Ambiental',detail:'PBA e programas ambientais',calc:en});if(state.scope.management)services.push({name:'Gerenciamento',detail:'Equipe fixa + campo',calc:ma});return{services,sup,dep,re,en,ma}}
renderBudget=function(){normalizeState();const {services,sup,dep,re,en,ma}=v5Services(),bdi=bdiCalc(),ct=sum(services.map(s=>s.calc.ct)),bdiValue=ct*bdi.cd/100,pv=ct+bdiValue,max=Math.max(1,...services.map(s=>s.calc.pv));const rows=services.map(s=>`<tr><td><b>${s.name}</b><br><span class="tiny">${esc(s.detail)}</span></td><td class="num">${money.format(s.calc.ct)}</td><td class="num">${money.format(s.calc.pv-s.calc.ct)}</td><td class="num"><b>${money.format(s.calc.pv)}</b></td><td class="num">${pv?nf2.format(s.calc.pv/pv*100):'0,00'}%</td></tr>`);rows.push(`<tr><td><b>Total</b></td><td class="num"><b>${money.format(ct)}</b></td><td class="num"><b>${money.format(bdiValue)}</b></td><td class="num"><b>${money.format(pv)}</b></td><td class="num"><b>100,00%</b></td></tr>`);const bars=services.map(s=>`<div class="bar-row"><div><span class="tag">${s.name}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(1,s.calc.pv/max*100)}%"></div></div><div class="num"><b>${money.format(s.calc.pv)}</b><br><span class="tiny">${pv?nf2.format(s.calc.pv/pv*100):'0,00'}%</span></div></div>`).join('');const parts=[];services.forEach(s=>Object.entries(s.calc.parts).forEach(([k,v])=>parts.push(`<tr><td>${s.name}</td><td>${k}</td><td class="num"><b>${money.format(v)}</b></td><td class="num">${ct?nf2.format(v/ct*100):'0,00'}%</td></tr>`)));const checks=[...combinedValidationV4(sup,dep,re),...(state.scope.environmental?envValidation(en).filter(x=>x[0]==='bad'):[]),...(state.scope.management?mgValidation(ma).filter(x=>x[0]==='bad'):[])].map(x=>`<div class="notice ${x[0]}">${x[1]}</div>`).join('');const durationMax=Math.max(1,...services.map(s=>s.calc.duration||0));$('#budgetContent').innerHTML=`<div class="print-head"><h1>${esc(state.project.name)}</h1><p>Orçamento consolidado de Engenharia Consultiva Rodoviária</p></div><div class="metrics">${metric('Custo direto consolidado',money.format(ct),'módulos selecionados')}${metric('BDI sobre CD',nf2.format(bdi.cd)+'%',money.format(bdiValue))}${metric('Preço de venda consolidado',money.format(pv),'PV = CT × (1 + BDI)',true)}${metric('Módulos ativos',String(services.length),'de cinco módulos')}${metric('Prazo máximo',nf2.format(durationMax)+' meses','referência mensal')}${metric('Média mensal',money.format(pv/durationMax),'preço de venda ÷ prazo')}</div><div class="grid g2"><div class="card"><h2>Resumo por módulo</h2>${table(['Módulo','Custo direto','BDI','Preço de venda','Participação'],rows)}<div class="formula">PV consolidado = ${money.format(ct)} × (1 + ${nf4.format(bdi.cd/100)}) = ${money.format(pv)}</div></div><div class="card"><h2>Participação dos módulos</h2><div class="bar-list">${bars||'<p>Nenhum módulo selecionado.</p>'}</div></div></div><div class="card" style="margin-top:15px"><h2>Parcelas do custo direto</h2>${table(['Módulo','Parcela','Custo','% do CT'],parts)}</div><div class="grid g2" style="margin-top:15px"><div class="card"><h2>Memória consolidada</h2><div class="formula">${services.map(s=>`${s.name} — CT: ${money.format(s.calc.ct)} | PV: ${money.format(s.calc.pv)}`).join('<br>')}<br><br>CT consolidado: ${money.format(ct)}<br>BDI: ${money.format(bdiValue)}<br>PV consolidado: ${money.format(pv)}</div></div><div class="card"><h2>Verificações</h2>${checks}<label>Notas do orçamento</label><textarea data-state-notes>${esc(state.notes)}</textarea></div></div><div class="card" style="margin-top:15px"><h2>Relatório e intercâmbio</h2><div class="actions no-print"><button data-action="print">Imprimir / salvar em PDF</button><button class="secondary" data-action="export-csv">Exportar CSV</button><button class="secondary" data-action="export-json">Exportar projeto JSON</button><button class="ghost" data-action="import-json">Importar projeto JSON</button><button class="ghost" data-action="save-local">Salvar no navegador</button></div><div class="source-box"><b>Escopo:</b> serviços de engenharia consultiva. Não estão incluídas indenizações, aquisição de imóveis, execução de obras exportCSV=function(){normalizeState();const {services}=v5Services(),rows=[['Módulo','Grupo','Código/Equipe','Descrição','Quantidade/Permanência','Custo unitário','Custo total']];for(const s of services){if(s.name==='Gestão Ambiental'){s.calc.labor.rows.forEach(r=>rows.push([s.name,'Mão de obra',r.code,(r.fixed?ENV_LABELS.fixed:ENV_LABELS[r.key])+(r.sub?' — '+r.sub:'')+' — '+r.name,`${r.qty} × ${r.months}`,r.cost,r.total]));s.calc.vehicles.rows.forEach(r=>rows.push([s.name,'Veículos',r.code,ENV_LABELS[r.key]+(r.sub?' — '+r.sub:''),`${r.qty} × ${r.months}`,r.monthly,r.total]));}else if(s.name==='Gerenciamento'){s.calc.labor.rows.forEach(r=>rows.push([s.name,'Mão de obra',r.code,(r.team==='fixed'?'Equipe fixa':r.team==='field'?'Equipe vinculada':'Consultor')+' — '+r.name,`${r.qty} × ${r.months}`,r.cost,r.total]));}Object.entries(s.calc.parts).forEach(([k,v])=>rows.push([s.name,'Resumo',k,'',1,v,v]));rows.push([s.name,'Resumo','PV','',1,s.calc.pv,s.calc.pv])}const ct=sum(services.map(s=>s.calc.ct)),b=bdiCalc(),pv=ct*(1+b.cd/100);rows.push(['Consolidado','Resumo','CT','','',ct,ct],['Consolidado','Resumo','BDI','','',b.cd,ct*b.cd/100],['Consolidado','Resumo','PV','','',pv,pv]);const csv='\ufeff'+rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')).join('\n');download('consultoria_pro_engenharia_consultiva_rodoviaria_v5.csv',csv,'text/csv;charset=utf-8')};
saveLocal=function(){localStorage.setItem('consultoriaProDnitV5',JSON.stringify(state));alert('Projeto salvo neste navegador.')};loadLocal=function(){const s=localStorage.getItem('consultoriaProDnitV5')||localStorage.getItem('consultoriaProDnitV4')||localStorage.getItem('consultoriaProDnitV3');if(!s)return alert('Não há projeto salvo.');try{state=JSON.parse(s);normalizeState();renderAll();alert('Projeto recuperado.')}catch(e){alert('Não foi possível recuperar o projeto.')}};

document.addEventListener('change',e=>{const t=e.target;function n(v){return v===''?null:Number(v)}if(t.dataset.env!==undefined){env()[t.dataset.env]=t.type==='checkbox'?t.checked:t.type==='number'?n(t.value):t.value;renderAll();return}if(t.dataset.envLinked){env().linked[t.dataset.envLinked]=t.type==='checkbox'?t.checked:n(t.value);renderAll();return}if(t.dataset.envProgram){env().programs[t.dataset.envProgram]=t.checked;renderAll();return}for(const [ds,obj] of [['envAsr',env().asr],['envRoadkill',env().roadkill],['envPassages',env().passages],['envIctio',env().ictio],['envCultural',env().cultural],['envArch2',env().archII],['envArch3',env().archIII],['envGerm',env().germplasm],['envMob',env().mob]])if(t.dataset[ds]){obj[t.dataset[ds]]=t.type==='checkbox'?t.checked:t.type==='number'?nonneg(t.value):t.value;renderAll();return}if(t.dataset.envMmhaIndex!==undefined){env().mmha[Number(t.dataset.envMmhaIndex)][t.dataset.envMmhaField]=nonneg(t.value);renderAll();return}if(t.dataset.envExtraIndex!==undefined){const x=env().extras[Number(t.dataset.envExtraIndex)],k=t.dataset.envExtraField;x[k]=(k==='qty'||k==='unitCost')?nonneg(t.value):t.value;renderAll();return}if(t.dataset.mg!==undefined){mg()[t.dataset.mg]=t.type==='checkbox'?t.checked:t.type==='number'?n(t.value):t.value;renderAll();return}if(t.dataset.mgMob){mg().mob[t.dataset.mgMob]=t.type==='checkbox'?t.checked:nonneg(t.value);renderAll();return}if(t.dataset.mgExtraIndex!==undefined){const x=mg().extras[Number(t.dataset.mgExtraIndex)],k=t.dataset.mgExtraField;x[k]=(k==='qty'||k==='unitCost')?nonneg(t.value):t.value;renderAll();return}});
